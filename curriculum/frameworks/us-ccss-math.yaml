completeness: structure-and-summary
strands:
  - id: "K.CC"
    title: "การนับและจำนวน (Counting and Cardinality) อนุบาล"
    standards:
      - id: "K.CC.A"
        text: "รู้จักชื่อจำนวนและลำดับการนับ"
        indicators:
          - { id: "K.CC.1", level: "K", text: "นับปากเปล่าถึง 100 ทั้งทีละหนึ่งและทีละสิบ" }
          - { id: "K.CC.2", level: "K", text: "นับต่อจากจำนวนที่กำหนดได้โดยไม่ต้องเริ่มที่ 1" }
          - { id: "K.CC.3", level: "K", text: "เขียนตัวเลข 0 ถึง 20 และใช้ตัวเลขแทนจำนวนสิ่งของ โดยรู้ว่า 0 คือไม่มีสิ่งของ" }
      - id: "K.CC.B"
        text: "นับเพื่อบอกจำนวนสิ่งของ"
        indicators:
          - { id: "K.CC.4", level: "K", text: "เชื่อมการนับกับจำนวน: นับแบบหนึ่งต่อหนึ่ง รู้ว่าคำสุดท้ายที่นับคือจำนวนทั้งหมดไม่ว่าจะจัดเรียงหรือนับลำดับใด และจำนวนถัดไปมากขึ้นหนึ่งเสมอ" }
          - { id: "K.CC.5", level: "K", text: "นับตอบคำถาม \"มีกี่อัน\" สำหรับสิ่งของไม่เกิน 20 ที่จัดเป็นแถว แถวลำดับ หรือวงกลม (หรือไม่เกิน 10 ที่วางกระจาย) และหยิบสิ่งของให้ได้ตามจำนวน 1-20 ที่กำหนด" }
      - id: "K.CC.C"
        text: "เปรียบเทียบจำนวน"
        indicators:
          - { id: "K.CC.6", level: "K", text: "บอกว่าสิ่งของกลุ่มหนึ่งมีมากกว่า น้อยกว่า หรือเท่ากับอีกกลุ่ม ด้วยการจับคู่หรือการนับ" }
          - { id: "K.CC.7", level: "K", text: "เปรียบเทียบตัวเลขสองจำนวนที่อยู่ระหว่าง 1 ถึง 10" }
  - id: "K.OA"
    title: "การดำเนินการและการคิดเชิงพีชคณิต (Operations and Algebraic Thinking) อนุบาล"
    standards:
      - id: "K.OA.A"
        text: "เข้าใจการบวกว่าเป็นการรวมหรือเพิ่ม และการลบว่าเป็นการแยกหรือเอาออก"
        indicators:
          - { id: "K.OA.1", level: "K", text: "แสดงการบวกและการลบได้หลายแบบ ทั้งด้วยของจริง ภาพ ท่าทาง การเล่าด้วยคำพูด และประโยคสัญลักษณ์" }
          - { id: "K.OA.2", level: "K", text: "แก้โจทย์ปัญหาการบวกการลบและบวกลบจำนวนไม่เกิน 10 โดยใช้สิ่งของหรือภาพช่วย" }
          - { id: "K.OA.3", level: "K", text: "แยกจำนวนไม่เกิน 10 เป็นสองส่วนได้หลายแบบ และบันทึกด้วยภาพหรือประโยคสัญลักษณ์" }
          - { id: "K.OA.4", level: "K", text: "หาจำนวนที่บวกกับจำนวน 1-9 แล้วได้ 10 และบันทึกคำตอบด้วยภาพหรือประโยคสัญลักษณ์" }
          - { id: "K.OA.5", level: "K", text: "บวกและลบจำนวนไม่เกิน 5 ได้คล่อง" }
  - id: "K.NBT"
    title: "จำนวนและการดำเนินการในระบบฐานสิบ (Number and Operations in Base Ten) อนุบาล"
    standards:
      - id: "K.NBT.A"
        text: "ใช้จำนวน 11-19 เป็นพื้นฐานของค่าประจำหลัก"
        indicators:
          - { id: "K.NBT.1", level: "K", text: "ประกอบและแยกจำนวน 11-19 เป็นสิบหน่วยกับหน่วยที่เหลือ บันทึกด้วยภาพหรือประโยคสัญลักษณ์ และเข้าใจว่าจำนวนเหล่านี้คือสิบกับอีกหนึ่งถึงเก้า" }
  - id: "K.MD"
    title: "การวัดและข้อมูล (Measurement and Data) อนุบาล"
    standards:
      - id: "K.MD.A"
        text: "บรรยายและเปรียบเทียบลักษณะที่วัดได้"
        indicators:
          - { id: "K.MD.1", level: "K", text: "บอกได้ว่าสิ่งของมีลักษณะใดบ้างที่วัดได้ และสิ่งของชิ้นเดียวอาจวัดได้หลายลักษณะ" }
          - { id: "K.MD.2", level: "K", text: "เปรียบเทียบสิ่งของสองชิ้นโดยตรงในลักษณะเดียวกันว่าชิ้นใดมากกว่าหรือน้อยกว่า และบอกความแตกต่าง" }
      - id: "K.MD.B"
        text: "จัดกลุ่มสิ่งของและนับจำนวนในแต่ละกลุ่ม"
        indicators:
          - { id: "K.MD.3", level: "K", text: "จัดสิ่งของเข้ากลุ่มที่กำหนด นับจำนวนในแต่ละกลุ่ม แล้วเรียงกลุ่มตามจำนวน" }
  - id: "K.G"
    title: "เรขาคณิต (Geometry) อนุบาล"
    standards:
      - id: "K.G.A"
        text: "บอกชื่อและบรรยายรูปร่าง"
        indicators:
          - { id: "K.G.1", level: "K", text: "ใช้ชื่อรูปเรขาคณิตบรรยายสิ่งของรอบตัว และใช้คำบอกตำแหน่งอธิบายว่าสิ่งของอยู่ตรงไหนเทียบกับสิ่งอื่น" }
          - { id: "K.G.2", level: "K", text: "บอกชื่อรูปร่างได้ถูกต้องไม่ว่าจะวางในทิศใดหรือมีขนาดเท่าใด" }
          - { id: "K.G.3", level: "K", text: "จำแนกรูปเป็นรูปสองมิติ (แบน) หรือรูปสามมิติ (ทรงตัน)" }
      - id: "K.G.B"
        text: "วิเคราะห์ เปรียบเทียบ สร้าง และประกอบรูป"
        indicators:
          - { id: "K.G.4", level: "K", text: "เปรียบเทียบรูปสองมิติและสามมิติที่ขนาดและทิศต่างกันด้วยภาษาของเด็ก บอกความเหมือน ความต่าง และส่วนประกอบ เช่น จำนวนด้านและมุม" }
          - { id: "K.G.5", level: "K", text: "สร้างแบบจำลองรูปร่างจากวัสดุและวาดรูปร่าง" }
          - { id: "K.G.6", level: "K", text: "นำรูปง่าย ๆ มาต่อกันเป็นรูปที่ใหญ่ขึ้น" }
  - id: "1.OA"
    title: "การดำเนินการและการคิดเชิงพีชคณิต (Operations and Algebraic Thinking) เกรด 1"
    standards:
      - id: "1.OA.A"
        text: "แสดงและแก้ปัญหาการบวกและการลบ"
        indicators:
          - { id: "1.OA.1", level: "1", text: "ใช้การบวกลบไม่เกิน 20 แก้โจทย์ปัญหาแบบเพิ่ม เอาออก รวม แยก และเปรียบเทียบ โดยตัวไม่ทราบค่าอยู่ตำแหน่งใดก็ได้ ใช้สิ่งของ ภาพ หรือประโยคสัญลักษณ์ช่วย" }
          - { id: "1.OA.2", level: "1", text: "แก้โจทย์ปัญหาการบวกจำนวนนับสามจำนวนที่ผลรวมไม่เกิน 20" }
      - id: "1.OA.B"
        text: "เข้าใจและใช้สมบัติของการดำเนินการ และความสัมพันธ์ระหว่างการบวกกับการลบ"
        indicators:
          - { id: "1.OA.3", level: "1", text: "ใช้สมบัติการสลับที่และการเปลี่ยนกลุ่มของการบวกเป็นกลยุทธ์ในการบวกและลบ" }
          - { id: "1.OA.4", level: "1", text: "เข้าใจการลบว่าเป็นการหาตัวบวกที่หายไป" }
      - id: "1.OA.C"
        text: "บวกและลบจำนวนไม่เกิน 20"
        indicators:
          - { id: "1.OA.5", level: "1", text: "เชื่อมการนับ (เช่น การนับต่อ) กับการบวกและการลบ" }
          - { id: "1.OA.6", level: "1", text: "บวกลบไม่เกิน 20 (คล่องภายใน 10) ด้วยกลยุทธ์ เช่น นับต่อ ทำให้ครบสิบ แยกจำนวน ใช้ความสัมพันธ์ของการบวกการลบ และใช้ผลบวกที่รู้แล้ว" }
      - id: "1.OA.D"
        text: "ทำงานกับประโยคสัญลักษณ์การบวกและการลบ"
        indicators:
          - { id: "1.OA.7", level: "1", text: "เข้าใจความหมายของเครื่องหมายเท่ากับ และตัดสินว่าประโยคสัญลักษณ์การบวกลบเป็นจริงหรือเท็จ" }
          - { id: "1.OA.8", level: "1", text: "หาจำนวนที่ไม่ทราบค่าในประโยคสัญลักษณ์การบวกหรือลบที่มีสามจำนวน" }
  - id: "1.NBT"
    title: "จำนวนและการดำเนินการในระบบฐานสิบ (Number and Operations in Base Ten) เกรด 1"
    standards:
      - id: "1.NBT.A"
        text: "ขยายลำดับการนับ"
        indicators:
          - { id: "1.NBT.1", level: "1", text: "นับถึง 120 โดยเริ่มจากจำนวนใดก็ได้ อ่านเขียนตัวเลขและใช้ตัวเลขแทนจำนวนสิ่งของในช่วงนี้" }
      - id: "1.NBT.B"
        text: "เข้าใจค่าประจำหลัก"
        indicators:
          - { id: "1.NBT.2", level: "1", text: "เข้าใจว่าเลขสองหลักแทนจำนวนสิบและหน่วย รวมทั้งกรณีพิเศษ: สิบหน่วยคือหนึ่งสิบ 11-19 คือหนึ่งสิบกับหน่วย และพหุคูณของสิบคือจำนวนสิบล้วน" }
          - { id: "1.NBT.3", level: "1", text: "เปรียบเทียบจำนวนสองหลักด้วยความหมายของหลักสิบและหลักหน่วย และบันทึกด้วย >, =, <" }
      - id: "1.NBT.C"
        text: "ใช้ค่าประจำหลักและสมบัติของการดำเนินการในการบวกและลบ"
        indicators:
          - { id: "1.NBT.4", level: "1", text: "บวกจำนวนไม่เกิน 100 (สองหลักกับหนึ่งหลัก และสองหลักกับพหุคูณของสิบ) ด้วยสื่อและกลยุทธ์ค่าประจำหลัก เข้าใจการรวมสิบกับสิบ หน่วยกับหน่วย และการทดเป็นสิบ แล้วอธิบายวิธีคิด" }
          - { id: "1.NBT.5", level: "1", text: "หาจำนวนที่มากกว่าหรือน้อยกว่าจำนวนสองหลักอยู่ 10 ในใจโดยไม่ต้องนับ และอธิบายเหตุผล" }
          - { id: "1.NBT.6", level: "1", text: "ลบพหุคูณของสิบในช่วง 10-90 ด้วยสื่อและกลยุทธ์ค่าประจำหลัก แล้วอธิบายวิธีคิด" }
  - id: "1.MD"
    title: "การวัดและข้อมูล (Measurement and Data) เกรด 1"
    standards:
      - id: "1.MD.A"
        text: "วัดความยาวทางอ้อมและด้วยการต่อหน่วยซ้ำ"
        indicators:
          - { id: "1.MD.1", level: "1", text: "เรียงสิ่งของสามชิ้นตามความยาว และเปรียบเทียบความยาวสองชิ้นทางอ้อมโดยใช้สิ่งที่สาม" }
          - { id: "1.MD.2", level: "1", text: "วัดความยาวเป็นจำนวนเต็มหน่วยด้วยการวางหน่วยวัดที่สั้นกว่าต่อกันโดยไม่เว้นช่องหรือซ้อนกัน" }
      - id: "1.MD.B"
        text: "บอกและเขียนเวลา"
        indicators:
          - { id: "1.MD.3", level: "1", text: "บอกและเขียนเวลาเป็นชั่วโมงและครึ่งชั่วโมงจากนาฬิกาเข็มและนาฬิกาตัวเลข" }
      - id: "1.MD.C"
        text: "นำเสนอและแปลความหมายข้อมูล"
        indicators:
          - { id: "1.MD.4", level: "1", text: "จัดระเบียบและนำเสนอข้อมูลไม่เกินสามประเภท แล้วตอบคำถามเรื่องจำนวนรวม จำนวนแต่ละประเภท และผลต่างระหว่างประเภท" }
  - id: "1.G"
    title: "เรขาคณิต (Geometry) เกรด 1"
    standards:
      - id: "1.G.A"
        text: "ให้เหตุผลเกี่ยวกับรูปและลักษณะของรูป"
        indicators:
          - { id: "1.G.1", level: "1", text: "แยกลักษณะที่ใช้ตัดสินว่าเป็นรูปนั้น (เช่น จำนวนด้าน) ออกจากลักษณะที่ไม่เกี่ยวกับนิยามของรูป และสร้างหรือวาดรูปให้มีลักษณะที่กำหนด" }
          - { id: "1.G.2", level: "1", text: "นำรูปสองมิติหรือรูปสามมิติมาประกอบกันเป็นรูปใหม่ แล้วนำรูปใหม่นั้นไปประกอบต่อ" }
          - { id: "1.G.3", level: "1", text: "แบ่งวงกลมและสี่เหลี่ยมผืนผ้าเป็นสองหรือสี่ส่วนเท่ากัน เรียกส่วนว่าครึ่งหรือหนึ่งในสี่ และเข้าใจว่ายิ่งแบ่งมากส่วนยิ่งเล็กลง" }
  - id: "2.OA"
    title: "การดำเนินการและการคิดเชิงพีชคณิต (Operations and Algebraic Thinking) เกรด 2"
    standards:
      - id: "2.OA.A"
        text: "แสดงและแก้ปัญหาการบวกและการลบ"
        indicators:
          - { id: "2.OA.1", level: "2", text: "ใช้การบวกลบไม่เกิน 100 แก้โจทย์ปัญหาหนึ่งและสองขั้นตอนแบบเพิ่ม เอาออก รวม แยก และเปรียบเทียบ โดยตัวไม่ทราบค่าอยู่ตำแหน่งใดก็ได้" }
      - id: "2.OA.B"
        text: "บวกและลบจำนวนไม่เกิน 20"
        indicators:
          - { id: "2.OA.2", level: "2", text: "บวกลบไม่เกิน 20 ในใจได้คล่อง และจำผลบวกของเลขหลักเดียวสองจำนวนได้ทั้งหมดเมื่อจบเกรด 2" }
      - id: "2.OA.C"
        text: "ทำงานกับกลุ่มที่เท่ากันเพื่อเป็นพื้นฐานของการคูณ"
        indicators:
          - { id: "2.OA.3", level: "2", text: "บอกว่าจำนวนสิ่งของ (ไม่เกิน 20) เป็นจำนวนคู่หรือคี่ และเขียนจำนวนคู่เป็นผลบวกของสองจำนวนที่เท่ากัน" }
          - { id: "2.OA.4", level: "2", text: "ใช้การบวกหาจำนวนสิ่งของที่จัดเป็นแถวลำดับสี่เหลี่ยม (ไม่เกิน 5 × 5) และเขียนเป็นผลบวกของจำนวนที่เท่ากัน" }
  - id: "2.NBT"
    title: "จำนวนและการดำเนินการในระบบฐานสิบ (Number and Operations in Base Ten) เกรด 2"
    standards:
      - id: "2.NBT.A"
        text: "เข้าใจค่าประจำหลัก"
        indicators:
          - { id: "2.NBT.1", level: "2", text: "เข้าใจว่าเลขสามหลักแทนจำนวนร้อย สิบ และหน่วย รวมถึงสิบสิบคือหนึ่งร้อย และพหุคูณของร้อยคือจำนวนร้อยล้วน" }
          - { id: "2.NBT.2", level: "2", text: "นับภายใน 1,000 และนับเพิ่มทีละ 5 ทีละ 10 และทีละ 100" }
          - { id: "2.NBT.3", level: "2", text: "อ่านและเขียนจำนวนไม่เกิน 1,000 เป็นตัวเลข ตัวหนังสือ และรูปกระจาย" }
          - { id: "2.NBT.4", level: "2", text: "เปรียบเทียบจำนวนสามหลักด้วยความหมายของแต่ละหลัก และบันทึกด้วย >, =, <" }
      - id: "2.NBT.B"
        text: "ใช้ค่าประจำหลักและสมบัติของการดำเนินการในการบวกและลบ"
        indicators:
          - { id: "2.NBT.5", level: "2", text: "บวกลบไม่เกิน 100 ได้คล่องด้วยกลยุทธ์ค่าประจำหลัก สมบัติของการดำเนินการ หรือความสัมพันธ์ของการบวกการลบ" }
          - { id: "2.NBT.6", level: "2", text: "บวกจำนวนสองหลักได้ถึงสี่จำนวนด้วยกลยุทธ์ค่าประจำหลักและสมบัติของการดำเนินการ" }
          - { id: "2.NBT.7", level: "2", text: "บวกลบไม่เกิน 1,000 ด้วยสื่อและกลยุทธ์ค่าประจำหลัก เชื่อมกับวิธีเขียน และเข้าใจการทดและการกระจายร้อย สิบ หน่วย" }
          - { id: "2.NBT.8", level: "2", text: "บวกหรือลบ 10 หรือ 100 กับจำนวน 100-900 ในใจ" }
          - { id: "2.NBT.9", level: "2", text: "อธิบายว่าทำไมกลยุทธ์การบวกลบจึงใช้ได้ โดยอ้างค่าประจำหลักและสมบัติของการดำเนินการ" }
  - id: "2.MD"
    title: "การวัดและข้อมูล (Measurement and Data) เกรด 2"
    standards:
      - id: "2.MD.A"
        text: "วัดและประมาณความยาวด้วยหน่วยมาตรฐาน"
        indicators:
          - { id: "2.MD.1", level: "2", text: "วัดความยาวโดยเลือกเครื่องมือวัดความยาวมาตรฐานที่เหมาะกับงาน" }
          - { id: "2.MD.2", level: "2", text: "วัดความยาวสิ่งเดียวกันด้วยหน่วยสองขนาด และอธิบายว่าผลการวัดสัมพันธ์กับขนาดของหน่วยอย่างไร" }
          - { id: "2.MD.3", level: "2", text: "ประมาณความยาวเป็นนิ้ว ฟุต เซนติเมตร และเมตร" }
          - { id: "2.MD.4", level: "2", text: "วัดเพื่อหาว่าสิ่งหนึ่งยาวกว่าอีกสิ่งเท่าใดเป็นหน่วยมาตรฐาน" }
      - id: "2.MD.B"
        text: "เชื่อมการบวกและการลบกับความยาว"
        indicators:
          - { id: "2.MD.5", level: "2", text: "ใช้การบวกลบไม่เกิน 100 แก้โจทย์ปัญหาความยาวที่ใช้หน่วยเดียวกัน" }
          - { id: "2.MD.6", level: "2", text: "แสดงจำนวนนับเป็นความยาวบนเส้นจำนวน และแสดงผลบวกผลลบไม่เกิน 100 บนเส้นจำนวน" }
      - id: "2.MD.C"
        text: "ทำงานกับเวลาและเงิน"
        indicators:
          - { id: "2.MD.7", level: "2", text: "บอกและเขียนเวลาจากนาฬิกาเข็มและนาฬิกาตัวเลขละเอียดถึงห้านาที พร้อมระบุก่อนเที่ยงหรือหลังเที่ยง (a.m./p.m.)" }
          - { id: "2.MD.8", level: "2", text: "แก้โจทย์ปัญหาเกี่ยวกับธนบัตรและเหรียญของสหรัฐ โดยใช้สัญลักษณ์ดอลลาร์และเซนต์ให้ถูกต้อง" }
      - id: "2.MD.D"
        text: "นำเสนอและแปลความหมายข้อมูล"
        indicators:
          - { id: "2.MD.9", level: "2", text: "เก็บข้อมูลจากการวัดความยาวเป็นจำนวนเต็มหน่วย แล้วนำเสนอด้วยแผนภาพจุด (line plot) ที่มีสเกลเป็นจำนวนเต็ม" }
          - { id: "2.MD.10", level: "2", text: "เขียนแผนภูมิรูปภาพและแผนภูมิแท่ง (สเกลหนึ่งหน่วย) ของข้อมูลไม่เกินสี่ประเภท และแก้ปัญหาการรวม แยก และเปรียบเทียบจากแผนภูมิแท่ง" }
  - id: "2.G"
    title: "เรขาคณิต (Geometry) เกรด 2"
    standards:
      - id: "2.G.A"
        text: "ให้เหตุผลเกี่ยวกับรูปและลักษณะของรูป"
        indicators:
          - { id: "2.G.1", level: "2", text: "จำแนกและวาดรูปตามลักษณะที่กำหนด เช่น จำนวนมุมหรือหน้า และบอกชื่อรูปสามเหลี่ยม สี่เหลี่ยม ห้าเหลี่ยม หกเหลี่ยม และลูกบาศก์" }
          - { id: "2.G.2", level: "2", text: "แบ่งสี่เหลี่ยมผืนผ้าเป็นแถวและหลักของสี่เหลี่ยมจัตุรัสขนาดเท่ากันแล้วนับจำนวนทั้งหมด" }
          - { id: "2.G.3", level: "2", text: "แบ่งวงกลมและสี่เหลี่ยมผืนผ้าเป็นสอง สาม หรือสี่ส่วนเท่ากัน เรียกชื่อส่วนเหล่านั้น และเข้าใจว่าส่วนเท่ากันของรูปเดียวกันอาจมีรูปร่างต่างกันได้" }
  - id: "3.OA"
    title: "การดำเนินการและการคิดเชิงพีชคณิต (Operations and Algebraic Thinking) เกรด 3"
    standards:
      - id: "3.OA.A"
        text: "แสดงและแก้ปัญหาการคูณและการหาร"
        indicators:
          - { id: "3.OA.1", level: "3", text: "แปลความหมายผลคูณของจำนวนนับว่าเป็นจำนวนทั้งหมดของกลุ่มที่เท่ากันหลายกลุ่ม" }
          - { id: "3.OA.2", level: "3", text: "แปลความหมายผลหารว่าเป็นจำนวนในแต่ละส่วนเมื่อแบ่งเท่า ๆ กัน หรือเป็นจำนวนส่วนเมื่อแบ่งออกทีละเท่า ๆ กัน" }
          - { id: "3.OA.3", level: "3", text: "ใช้การคูณการหารภายใน 100 แก้โจทย์ปัญหาเรื่องกลุ่มที่เท่ากัน แถวลำดับ และปริมาณที่วัดได้" }
          - { id: "3.OA.4", level: "3", text: "หาจำนวนที่ไม่ทราบค่าในประโยคสัญลักษณ์การคูณหรือการหารที่มีสามจำนวน" }
      - id: "3.OA.B"
        text: "เข้าใจสมบัติของการคูณและความสัมพันธ์ระหว่างการคูณกับการหาร"
        indicators:
          - { id: "3.OA.5", level: "3", text: "ใช้สมบัติการสลับที่ การเปลี่ยนกลุ่ม และการแจกแจงเป็นกลยุทธ์ในการคูณและการหาร" }
          - { id: "3.OA.6", level: "3", text: "เข้าใจการหารว่าเป็นการหาตัวประกอบที่หายไปของการคูณ" }
      - id: "3.OA.C"
        text: "คูณและหารจำนวนภายใน 100"
        indicators:
          - { id: "3.OA.7", level: "3", text: "คูณหารภายใน 100 ได้คล่องด้วยกลยุทธ์ และจำผลคูณของเลขหลักเดียวได้ทั้งหมดเมื่อจบเกรด 3" }
      - id: "3.OA.D"
        text: "แก้ปัญหาด้วยการดำเนินการทั้งสี่ และหาและอธิบายแบบรูปในเลขคณิต"
        indicators:
          - { id: "3.OA.8", level: "3", text: "แก้โจทย์ปัญหาสองขั้นตอนด้วยการบวก ลบ คูณ หาร เขียนประโยคสัญลักษณ์โดยใช้ตัวอักษรแทนค่าที่ไม่ทราบ และตรวจความสมเหตุสมผลด้วยการคิดในใจและการประมาณ" }
          - { id: "3.OA.9", level: "3", text: "หาแบบรูปในเลขคณิต (รวมทั้งในตารางบวกและตารางคูณ) และอธิบายด้วยสมบัติของการดำเนินการ" }
  - id: "3.NBT"
    title: "จำนวนและการดำเนินการในระบบฐานสิบ (Number and Operations in Base Ten) เกรด 3"
    standards:
      - id: "3.NBT.A"
        text: "ใช้ค่าประจำหลักและสมบัติของการดำเนินการคำนวณจำนวนหลายหลัก"
        indicators:
          - { id: "3.NBT.1", level: "3", text: "ปัดเศษจำนวนนับเป็นหลักสิบหรือหลักร้อยที่ใกล้ที่สุดโดยอาศัยค่าประจำหลัก" }
          - { id: "3.NBT.2", level: "3", text: "บวกลบไม่เกิน 1,000 ได้คล่องด้วยกลยุทธ์และขั้นตอนวิธีที่อาศัยค่าประจำหลัก" }
          - { id: "3.NBT.3", level: "3", text: "คูณเลขหลักเดียวกับพหุคูณของสิบ (10-90) ด้วยกลยุทธ์ค่าประจำหลักและสมบัติของการดำเนินการ" }
  - id: "3.NF"
    title: "จำนวนและการดำเนินการ: เศษส่วน (Number and Operations—Fractions) เกรด 3"
    standards:
      - id: "3.NF.A"
        text: "พัฒนาความเข้าใจเศษส่วนในฐานะจำนวน"
        indicators:
          - { id: "3.NF.1", level: "3", text: "เข้าใจเศษส่วน 1/b ว่าเป็นหนึ่งส่วนเมื่อแบ่งทั้งหมดเป็น b ส่วนเท่ากัน และ a/b ว่าเป็น a ส่วนขนาด 1/b" }
          - { id: "3.NF.2", level: "3", text: "เข้าใจเศษส่วนเป็นจำนวนบนเส้นจำนวน โดยแบ่งช่วง 0 ถึง 1 เป็น b ส่วนเท่ากันเพื่อหาตำแหน่งของ 1/b และนับต่อ a ช่วงเพื่อหาตำแหน่งของ a/b" }
          - { id: "3.NF.3", level: "3", text: "อธิบายเศษส่วนที่เท่ากันในกรณีง่าย เขียนจำนวนนับเป็นเศษส่วน และเปรียบเทียบเศษส่วนที่ตัวเศษหรือตัวส่วนเท่ากันด้วยการให้เหตุผลเรื่องขนาด โดยเปรียบเทียบได้เมื่ออ้างถึงทั้งหมดเดียวกัน" }
  - id: "3.MD"
    title: "การวัดและข้อมูล (Measurement and Data) เกรด 3"
    standards:
      - id: "3.MD.A"
        text: "แก้ปัญหาการวัดและการประมาณ"
        indicators:
          - { id: "3.MD.1", level: "3", text: "บอกเวลาละเอียดถึงนาที วัดช่วงเวลาเป็นนาที และแก้โจทย์บวกลบช่วงเวลา" }
          - { id: "3.MD.2", level: "3", text: "วัดและประมาณปริมาตรของเหลวและมวลด้วยกรัม กิโลกรัม และลิตร และแก้โจทย์ปัญหาขั้นเดียวเกี่ยวกับมวลหรือปริมาตร" }
      - id: "3.MD.B"
        text: "นำเสนอและแปลความหมายข้อมูล"
        indicators:
          - { id: "3.MD.3", level: "3", text: "เขียนแผนภูมิรูปภาพและแผนภูมิแท่งที่มีมาตราส่วน และแก้ปัญหาหนึ่งและสองขั้นตอนว่ามากกว่าหรือน้อยกว่าเท่าใดจากแผนภูมิ" }
          - { id: "3.MD.4", level: "3", text: "วัดความยาวละเอียดถึงครึ่งและหนึ่งในสี่นิ้ว แล้วนำเสนอข้อมูลด้วยแผนภาพจุด (line plot)" }
      - id: "3.MD.C"
        text: "การวัดทางเรขาคณิต: เข้าใจพื้นที่และเชื่อมพื้นที่กับการคูณและการบวก"
        indicators:
          - { id: "3.MD.5", level: "3", text: "เข้าใจพื้นที่ว่าเป็นลักษณะของรูปบนระนาบ วัดด้วยตารางหน่วย และรูปที่ปูด้วยตารางหน่วย n ช่องโดยไม่เว้นหรือซ้อนมีพื้นที่ n ตารางหน่วย" }
          - { id: "3.MD.6", level: "3", text: "วัดพื้นที่ด้วยการนับตารางหน่วย (ตารางเซนติเมตร ตารางเมตร ตารางนิ้ว ตารางฟุต หรือหน่วยที่ตั้งเอง)" }
          - { id: "3.MD.7", level: "3", text: "เชื่อมพื้นที่กับการคูณและการบวก: หาพื้นที่สี่เหลี่ยมผืนผ้าด้วยการปูและการคูณ ใช้แบบจำลองพื้นที่แสดงสมบัติการแจกแจง และหาพื้นที่รูปประกอบด้วยการแยกเป็นสี่เหลี่ยมผืนผ้า" }
      - id: "3.MD.D"
        text: "การวัดทางเรขาคณิต: รู้จักความยาวรอบรูป"
        indicators:
          - { id: "3.MD.8", level: "3", text: "แก้ปัญหาความยาวรอบรูปของรูปหลายเหลี่ยม หาด้านที่ไม่ทราบ และแสดงว่าสี่เหลี่ยมผืนผ้าที่ความยาวรอบรูปเท่ากันอาจมีพื้นที่ต่างกัน (และในทางกลับกัน)" }
  - id: "3.G"
    title: "เรขาคณิต (Geometry) เกรด 3"
    standards:
      - id: "3.G.A"
        text: "ให้เหตุผลเกี่ยวกับรูปและลักษณะของรูป"
        indicators:
          - { id: "3.G.1", level: "3", text: "เข้าใจว่ารูปต่างประเภทอาจมีลักษณะร่วมกัน และลักษณะร่วมนั้นใช้นิยามประเภทที่ใหญ่กว่าได้ เช่น รูปสี่เหลี่ยม และวาดรูปสี่เหลี่ยมที่ไม่อยู่ในประเภทย่อยที่รู้จัก" }
          - { id: "3.G.2", level: "3", text: "แบ่งรูปเป็นส่วนที่มีพื้นที่เท่ากัน และบอกพื้นที่แต่ละส่วนเป็นเศษส่วนที่มีตัวเศษเป็น 1 ของทั้งหมด" }
  - id: "4.OA"
    title: "การดำเนินการและการคิดเชิงพีชคณิต (Operations and Algebraic Thinking) เกรด 4"
    standards:
      - id: "4.OA.A"
        text: "ใช้การดำเนินการทั้งสี่กับจำนวนนับในการแก้ปัญหา"
        indicators:
          - { id: "4.OA.1", level: "4", text: "แปลความหมายการคูณว่าเป็นการเปรียบเทียบแบบ \"เป็นกี่เท่า\" และเขียนข้อความเปรียบเทียบเชิงคูณเป็นประโยคสัญลักษณ์" }
          - { id: "4.OA.2", level: "4", text: "คูณหรือหารเพื่อแก้โจทย์การเปรียบเทียบเชิงคูณ และแยกให้ออกจากการเปรียบเทียบเชิงบวก" }
          - { id: "4.OA.3", level: "4", text: "แก้โจทย์ปัญหาหลายขั้นตอนของจำนวนนับด้วยการดำเนินการทั้งสี่ รวมทั้งการตีความเศษจากการหาร เขียนประโยคสัญลักษณ์ที่มีตัวแปร และตรวจคำตอบด้วยการประมาณและการปัดเศษ" }
      - id: "4.OA.B"
        text: "คุ้นเคยกับตัวประกอบและพหุคูณ"
        indicators:
          - { id: "4.OA.4", level: "4", text: "หาคู่ตัวประกอบทั้งหมดของจำนวน 1-100 รู้ว่าจำนวนเป็นพหุคูณของตัวประกอบของมัน ตรวจการเป็นพหุคูณของเลขหลักเดียว และบอกว่าจำนวนเป็นจำนวนเฉพาะหรือจำนวนประกอบ" }
      - id: "4.OA.C"
        text: "สร้างและวิเคราะห์แบบรูป"
        indicators:
          - { id: "4.OA.5", level: "4", text: "สร้างแบบรูปของจำนวนหรือรูปตามกฎที่กำหนด และสังเกตลักษณะอื่นของแบบรูปที่กฎไม่ได้บอกไว้ตรง ๆ" }
  - id: "4.NBT"
    title: "จำนวนและการดำเนินการในระบบฐานสิบ (Number and Operations in Base Ten) เกรด 4"
    standards:
      - id: "4.NBT.A"
        text: "ขยายความเข้าใจค่าประจำหลักสู่จำนวนนับหลายหลัก"
        indicators:
          - { id: "4.NBT.1", level: "4", text: "เข้าใจว่าในจำนวนหลายหลัก ค่าของเลขโดดในหลักหนึ่งเป็นสิบเท่าของค่าในหลักที่อยู่ทางขวา" }
          - { id: "4.NBT.2", level: "4", text: "อ่านเขียนจำนวนหลายหลักเป็นตัวเลข ตัวหนังสือ และรูปกระจาย และเปรียบเทียบด้วยค่าประจำหลักโดยใช้ >, =, <" }
          - { id: "4.NBT.3", level: "4", text: "ปัดเศษจำนวนหลายหลักเป็นหลักใดก็ได้โดยอาศัยค่าประจำหลัก" }
      - id: "4.NBT.B"
        text: "ใช้ค่าประจำหลักและสมบัติของการดำเนินการคำนวณจำนวนหลายหลัก"
        indicators:
          - { id: "4.NBT.4", level: "4", text: "บวกลบจำนวนหลายหลักได้คล่องด้วยวิธีตั้งบวกตั้งลบมาตรฐาน" }
          - { id: "4.NBT.5", level: "4", text: "คูณจำนวนไม่เกินสี่หลักด้วยเลขหลักเดียว และคูณเลขสองหลักกับสองหลัก ด้วยกลยุทธ์ค่าประจำหลัก อธิบายด้วยประโยคสัญลักษณ์ แถวลำดับ หรือแบบจำลองพื้นที่" }
          - { id: "4.NBT.6", level: "4", text: "หารจำนวนไม่เกินสี่หลักด้วยเลขหลักเดียว หาผลหารและเศษด้วยกลยุทธ์ค่าประจำหลัก อธิบายด้วยประโยคสัญลักษณ์ แถวลำดับ หรือแบบจำลองพื้นที่" }
  - id: "4.NF"
    title: "จำนวนและการดำเนินการ: เศษส่วน (Number and Operations—Fractions) เกรด 4"
    standards:
      - id: "4.NF.A"
        text: "ขยายความเข้าใจเรื่องเศษส่วนที่เท่ากันและการเรียงลำดับเศษส่วน"
        indicators:
          - { id: "4.NF.1", level: "4", text: "อธิบายด้วยแบบจำลองว่าทำไมการคูณทั้งตัวเศษและตัวส่วนด้วยจำนวนเดียวกันจึงได้เศษส่วนที่เท่ากัน และใช้หลักนี้สร้างเศษส่วนที่เท่ากัน" }
          - { id: "4.NF.2", level: "4", text: "เปรียบเทียบเศษส่วนที่ตัวเศษและตัวส่วนต่างกัน โดยทำให้ตัวส่วนหรือตัวเศษเท่ากันหรือเทียบกับเศษส่วนอ้างอิง เช่น 1/2 และบันทึกด้วย >, =, <" }
      - id: "4.NF.B"
        text: "สร้างเศษส่วนจากเศษส่วนที่มีตัวเศษเป็น 1"
        indicators:
          - { id: "4.NF.3", level: "4", text: "เข้าใจเศษส่วน a/b เป็นผลบวกของ 1/b: บวกลบเศษส่วนที่ตัวส่วนเท่ากันและจำนวนคละ แยกเศษส่วนเป็นผลบวกได้หลายแบบ และแก้โจทย์ปัญหา" }
          - { id: "4.NF.4", level: "4", text: "คูณเศษส่วนด้วยจำนวนนับ โดยมอง a/b เป็นพหุคูณของ 1/b และแก้โจทย์ปัญหาการคูณเศษส่วนกับจำนวนนับ" }
      - id: "4.NF.C"
        text: "เข้าใจการเขียนเศษส่วนเป็นทศนิยม และเปรียบเทียบทศนิยม"
        indicators:
          - { id: "4.NF.5", level: "4", text: "เขียนเศษส่วนที่มีตัวส่วน 10 เป็นตัวส่วน 100 และใช้วิธีนี้บวกเศษส่วนที่ตัวส่วนเป็น 10 กับ 100" }
          - { id: "4.NF.6", level: "4", text: "เขียนเศษส่วนที่มีตัวส่วน 10 หรือ 100 ในรูปทศนิยม และหาตำแหน่งบนเส้นจำนวน" }
          - { id: "4.NF.7", level: "4", text: "เปรียบเทียบทศนิยมสองตำแหน่งด้วยการให้เหตุผลเรื่องขนาด โดยเปรียบเทียบได้เมื่ออ้างถึงทั้งหมดเดียวกัน และบันทึกด้วย >, =, <" }
  - id: "4.MD"
    title: "การวัดและข้อมูล (Measurement and Data) เกรด 4"
    standards:
      - id: "4.MD.A"
        text: "แก้ปัญหาการวัดและการแปลงหน่วย"
        indicators:
          - { id: "4.MD.1", level: "4", text: "รู้ขนาดสัมพัทธ์ของหน่วยวัดในระบบเดียวกัน (ความยาว มวล ปริมาตร เวลา ทั้งเมตริกและหน่วยสหรัฐ) แปลงหน่วยใหญ่เป็นหน่วยย่อย และบันทึกเป็นตารางสองคอลัมน์" }
          - { id: "4.MD.2", level: "4", text: "แก้โจทย์ปัญหาระยะทาง เวลา ปริมาตร มวล และเงินด้วยการดำเนินการทั้งสี่ รวมถึงเศษส่วนหรือทศนิยมอย่างง่ายและการแปลงหน่วย และแสดงด้วยแผนภาพเส้นจำนวน" }
          - { id: "4.MD.3", level: "4", text: "ใช้สูตรพื้นที่และความยาวรอบรูปของสี่เหลี่ยมผืนผ้าแก้ปัญหา รวมทั้งหาด้านที่ไม่ทราบ" }
      - id: "4.MD.B"
        text: "นำเสนอและแปลความหมายข้อมูล"
        indicators:
          - { id: "4.MD.4", level: "4", text: "เขียนแผนภาพจุดของข้อมูลการวัดที่เป็นเศษส่วน (1/2, 1/4, 1/8) และแก้ปัญหาการบวกลบเศษส่วนจากแผนภาพ" }
      - id: "4.MD.C"
        text: "การวัดทางเรขาคณิต: เข้าใจมุมและวัดมุม"
        indicators:
          - { id: "4.MD.5", level: "4", text: "เข้าใจมุมว่าเกิดจากรังสีสองเส้นที่มีจุดปลายร่วมกัน และการวัดมุมเทียบกับส่วนโค้งของวงกลม: มุมหนึ่งองศาคือ 1/360 ของรอบวง และมุม n องศาประกอบด้วยมุมหนึ่งองศา n มุม" }
          - { id: "4.MD.6", level: "4", text: "วัดมุมเป็นองศาด้วยไม้โปรแทรกเตอร์ และสร้างมุมตามขนาดที่กำหนด" }
          - { id: "4.MD.7", level: "4", text: "เข้าใจว่าขนาดมุมบวกกันได้เมื่อแบ่งมุมเป็นส่วนที่ไม่ซ้อนกัน และแก้ปัญหาการบวกลบหามุมที่ไม่ทราบ" }
  - id: "4.G"
    title: "เรขาคณิต (Geometry) เกรด 4"
    standards:
      - id: "4.G.A"
        text: "วาดและระบุเส้นและมุม และจำแนกรูปตามสมบัติของเส้นและมุม"
        indicators:
          - { id: "4.G.1", level: "4", text: "วาดและระบุจุด เส้นตรง ส่วนของเส้นตรง รังสี มุม (ฉาก แหลม ป้าน) เส้นตั้งฉาก และเส้นขนานในรูปสองมิติ" }
          - { id: "4.G.2", level: "4", text: "จำแนกรูปสองมิติตามการมีเส้นขนาน เส้นตั้งฉาก หรือมุมขนาดที่กำหนด และจำแนกรูปสามเหลี่ยมมุมฉาก" }
          - { id: "4.G.3", level: "4", text: "รู้จักแกนสมมาตรของรูปสองมิติว่าเป็นเส้นที่พับแล้วสองข้างทับกันสนิท ระบุรูปที่มีแกนสมมาตรและวาดแกนสมมาตร" }
  - id: "5.OA"
    title: "การดำเนินการและการคิดเชิงพีชคณิต (Operations and Algebraic Thinking) เกรด 5"
    standards:
      - id: "5.OA.A"
        text: "เขียนและแปลความหมายนิพจน์ของจำนวน"
        indicators:
          - { id: "5.OA.1", level: "5", text: "ใช้วงเล็บแบบต่าง ๆ ในนิพจน์ของจำนวนและหาค่านิพจน์ตามลำดับที่วงเล็บกำหนด" }
          - { id: "5.OA.2", level: "5", text: "เขียนนิพจน์อย่างง่ายแทนขั้นตอนการคำนวณที่บรรยายเป็นคำ และตีความนิพจน์โดยไม่ต้องคำนวณ เช่น บอกว่านิพจน์หนึ่งมีค่าเป็นกี่เท่าของอีกนิพจน์" }
      - id: "5.OA.B"
        text: "วิเคราะห์แบบรูปและความสัมพันธ์"
        indicators:
          - { id: "5.OA.3", level: "5", text: "สร้างแบบรูปจำนวนสองชุดจากกฎสองข้อ หาความสัมพันธ์ระหว่างพจน์ที่สอดคล้องกัน จับคู่อันดับและเขียนกราฟบนระนาบพิกัด" }
  - id: "5.NBT"
    title: "จำนวนและการดำเนินการในระบบฐานสิบ (Number and Operations in Base Ten) เกรด 5"
    standards:
      - id: "5.NBT.A"
        text: "เข้าใจระบบค่าประจำหลัก"
        indicators:
          - { id: "5.NBT.1", level: "5", text: "เข้าใจว่าค่าของเลขโดดในหลักหนึ่งเป็น 10 เท่าของหลักทางขวาและเป็น 1/10 ของหลักทางซ้าย" }
          - { id: "5.NBT.2", level: "5", text: "อธิบายแบบรูปของจำนวนศูนย์เมื่อคูณด้วยกำลังของ 10 และการเลื่อนจุดทศนิยมเมื่อคูณหรือหารด้วยกำลังของ 10 และใช้เลขชี้กำลังเขียนกำลังของ 10" }
          - { id: "5.NBT.3", level: "5", text: "อ่าน เขียน (ตัวเลข ตัวหนังสือ รูปกระจาย) และเปรียบเทียบทศนิยมถึงสามตำแหน่งด้วยค่าประจำหลัก โดยใช้ >, =, <" }
          - { id: "5.NBT.4", level: "5", text: "ปัดเศษทศนิยมเป็นตำแหน่งใดก็ได้โดยอาศัยค่าประจำหลัก" }
      - id: "5.NBT.B"
        text: "คำนวณจำนวนนับหลายหลักและทศนิยมถึงสองตำแหน่ง"
        indicators:
          - { id: "5.NBT.5", level: "5", text: "คูณจำนวนนับหลายหลักได้คล่องด้วยวิธีตั้งคูณมาตรฐาน" }
          - { id: "5.NBT.6", level: "5", text: "หารจำนวนไม่เกินสี่หลักด้วยตัวหารสองหลักด้วยกลยุทธ์ค่าประจำหลัก และอธิบายด้วยประโยคสัญลักษณ์ แถวลำดับ หรือแบบจำลองพื้นที่" }
          - { id: "5.NBT.7", level: "5", text: "บวก ลบ คูณ หารทศนิยมถึงสองตำแหน่งด้วยสื่อและกลยุทธ์ค่าประจำหลัก เชื่อมกับวิธีเขียน และอธิบายเหตุผล" }
  - id: "5.NF"
    title: "จำนวนและการดำเนินการ: เศษส่วน (Number and Operations—Fractions) เกรด 5"
    standards:
      - id: "5.NF.A"
        text: "ใช้เศษส่วนที่เท่ากันเป็นกลยุทธ์ในการบวกและลบเศษส่วน"
        indicators:
          - { id: "5.NF.1", level: "5", text: "บวกลบเศษส่วนและจำนวนคละที่ตัวส่วนไม่เท่ากันโดยเปลี่ยนเป็นเศษส่วนที่เท่ากันซึ่งมีตัวส่วนเดียวกัน" }
          - { id: "5.NF.2", level: "5", text: "แก้โจทย์ปัญหาการบวกลบเศษส่วนที่ตัวส่วนไม่เท่ากัน และใช้เศษส่วนอ้างอิงกับการประมาณตรวจความสมเหตุสมผลของคำตอบ" }
      - id: "5.NF.B"
        text: "ขยายความเข้าใจการคูณและการหารไปสู่เศษส่วน"
        indicators:
          - { id: "5.NF.3", level: "5", text: "ตีความเศษส่วนว่าเป็นการหารตัวเศษด้วยตัวส่วน และแก้โจทย์การหารจำนวนนับที่ได้คำตอบเป็นเศษส่วนหรือจำนวนคละ" }
          - { id: "5.NF.4", level: "5", text: "คูณเศษส่วนกับจำนวนนับหรือเศษส่วน ตีความผลคูณด้วยการแบ่งส่วน และหาพื้นที่สี่เหลี่ยมผืนผ้าที่ด้านยาวเป็นเศษส่วนด้วยการปูตารางหน่วย" }
          - { id: "5.NF.5", level: "5", text: "ตีความการคูณว่าเป็นการย่อขยาย: คาดขนาดผลคูณจากตัวประกอบโดยไม่ต้องคำนวณ และอธิบายว่าคูณด้วยจำนวนที่มากกว่า 1 ผลคูณใหญ่ขึ้น น้อยกว่า 1 ผลคูณเล็กลง" }
          - { id: "5.NF.6", level: "5", text: "แก้ปัญหาในชีวิตจริงเกี่ยวกับการคูณเศษส่วนและจำนวนคละ" }
          - { id: "5.NF.7", level: "5", text: "หารเศษส่วนที่มีตัวเศษเป็น 1 ด้วยจำนวนนับ และหารจำนวนนับด้วยเศษส่วนที่มีตัวเศษเป็น 1 ตีความผลหารและแก้โจทย์ปัญหา" }
  - id: "5.MD"
    title: "การวัดและข้อมูล (Measurement and Data) เกรด 5"
    standards:
      - id: "5.MD.A"
        text: "แปลงหน่วยวัดภายในระบบเดียวกัน"
        indicators:
          - { id: "5.MD.1", level: "5", text: "แปลงหน่วยวัดมาตรฐานต่างขนาดในระบบเดียวกัน และใช้ในการแก้โจทย์ปัญหาหลายขั้นตอน" }
      - id: "5.MD.B"
        text: "นำเสนอและแปลความหมายข้อมูล"
        indicators:
          - { id: "5.MD.2", level: "5", text: "เขียนแผนภาพจุดของข้อมูลการวัดที่เป็นเศษส่วน (1/2, 1/4, 1/8) และใช้การดำเนินการของเศษส่วนแก้ปัญหาจากแผนภาพ" }
      - id: "5.MD.C"
        text: "การวัดทางเรขาคณิต: เข้าใจปริมาตร"
        indicators:
          - { id: "5.MD.3", level: "5", text: "เข้าใจปริมาตรว่าเป็นลักษณะของรูปทรงตัน วัดด้วยลูกบาศก์หน่วย และรูปที่บรรจุลูกบาศก์หน่วย n ลูกโดยไม่เว้นหรือซ้อนมีปริมาตร n ลูกบาศก์หน่วย" }
          - { id: "5.MD.4", level: "5", text: "วัดปริมาตรด้วยการนับลูกบาศก์หน่วย (ลูกบาศก์เซนติเมตร ลูกบาศก์นิ้ว ลูกบาศก์ฟุต หรือหน่วยที่ตั้งเอง)" }
          - { id: "5.MD.5", level: "5", text: "เชื่อมปริมาตรกับการคูณและการบวก: หาปริมาตรปริซึมสี่เหลี่ยมมุมฉากด้วยการบรรจุลูกบาศก์และด้วยสูตร V = l × w × h หรือ V = B × h และหาปริมาตรรูปที่ประกอบจากปริซึมสองรูปที่ไม่ซ้อนกัน" }
  - id: "5.G"
    title: "เรขาคณิต (Geometry) เกรด 5"
    standards:
      - id: "5.G.A"
        text: "เขียนจุดบนระนาบพิกัดเพื่อแก้ปัญหา"
        indicators:
          - { id: "5.G.1", level: "5", text: "เข้าใจระบบพิกัดจากเส้นจำนวนสองเส้นที่ตั้งฉากกัน (แกน) ตัดกันที่จุดกำเนิด และอ่านพิกัดของจุดเป็นคู่อันดับ" }
          - { id: "5.G.2", level: "5", text: "เขียนจุดในจตุภาคที่หนึ่งเพื่อแสดงปัญหา และตีความค่าพิกัดตามสถานการณ์" }
      - id: "5.G.B"
        text: "จำแนกรูปสองมิติเป็นประเภทตามสมบัติ"
        indicators:
          - { id: "5.G.3", level: "5", text: "เข้าใจว่าสมบัติของรูปประเภทหนึ่งเป็นสมบัติของรูปทุกประเภทย่อยในประเภทนั้นด้วย" }
          - { id: "5.G.4", level: "5", text: "จัดลำดับชั้นการจำแนกรูปสองมิติตามสมบัติ" }
  - id: "6.RP"
    title: "อัตราส่วนและความสัมพันธ์เชิงสัดส่วน (Ratios and Proportional Relationships) เกรด 6"
    standards:
      - id: "6.RP.A"
        text: "เข้าใจอัตราส่วนและใช้การให้เหตุผลเชิงอัตราส่วนแก้ปัญหา"
        indicators:
          - { id: "6.RP.1", level: "6", text: "เข้าใจความหมายของอัตราส่วน และใช้ภาษาของอัตราส่วนบรรยายความสัมพันธ์ระหว่างสองปริมาณ" }
          - { id: "6.RP.2", level: "6", text: "เข้าใจอัตราต่อหนึ่งหน่วย a/b ที่มาจากอัตราส่วน a:b (b ≠ 0) และใช้ภาษาของอัตราในบริบทอัตราส่วน" }
          - { id: "6.RP.3", level: "6", text: "ใช้อัตราส่วนและอัตราแก้ปัญหาด้วยตาราง แผนภาพแถบ เส้นจำนวนคู่ หรือสมการ: สร้างตารางอัตราส่วนที่เท่ากันและเขียนกราฟ แก้โจทย์อัตราต่อหน่วยและความเร็วคงที่ หาร้อยละของปริมาณ และแปลงหน่วยด้วยอัตราส่วน" }
  - id: "6.NS"
    title: "ระบบจำนวน (The Number System) เกรด 6"
    standards:
      - id: "6.NS.A"
        text: "ขยายความเข้าใจการคูณและการหารสู่การหารเศษส่วนด้วยเศษส่วน"
        indicators:
          - { id: "6.NS.1", level: "6", text: "ตีความและคำนวณผลหารของเศษส่วนด้วยเศษส่วน และแก้โจทย์ปัญหาโดยใช้แบบจำลองและสมการ" }
      - id: "6.NS.B"
        text: "คำนวณจำนวนหลายหลักได้คล่อง และหาตัวประกอบร่วมและพหุคูณร่วม"
        indicators:
          - { id: "6.NS.2", level: "6", text: "หารจำนวนหลายหลักได้คล่องด้วยวิธีหารยาวมาตรฐาน" }
          - { id: "6.NS.3", level: "6", text: "บวก ลบ คูณ หารทศนิยมหลายหลักได้คล่องด้วยวิธีมาตรฐาน" }
          - { id: "6.NS.4", level: "6", text: "หา ห.ร.ม. ของจำนวนนับไม่เกิน 100 และ ค.ร.น. ของจำนวนนับไม่เกิน 12 และใช้สมบัติการแจกแจงดึงตัวประกอบร่วมออกจากผลบวก" }
      - id: "6.NS.C"
        text: "ขยายความเข้าใจจำนวนสู่ระบบจำนวนตรรกยะ"
        indicators:
          - { id: "6.NS.5", level: "6", text: "เข้าใจว่าจำนวนบวกและจำนวนลบใช้แทนปริมาณที่มีทิศหรือค่าตรงข้ามกัน และอธิบายความหมายของศูนย์ในแต่ละสถานการณ์" }
          - { id: "6.NS.6", level: "6", text: "เข้าใจจำนวนตรรกยะเป็นจุดบนเส้นจำนวน รู้ว่าจำนวนตรงข้ามอยู่คนละฝั่งของศูนย์ เครื่องหมายของพิกัดบอกจตุภาค และหาตำแหน่งจำนวนตรรกยะบนเส้นจำนวนและระนาบพิกัด" }
          - { id: "6.NS.7", level: "6", text: "เข้าใจการเรียงลำดับและค่าสัมบูรณ์ของจำนวนตรรกยะ: ตีความอสมการเป็นตำแหน่งบนเส้นจำนวน เขียนและอธิบายลำดับในสถานการณ์จริง และตีความค่าสัมบูรณ์เป็นระยะห่างจากศูนย์" }
          - { id: "6.NS.8", level: "6", text: "แก้ปัญหาด้วยการเขียนจุดในทั้งสี่จตุภาค และใช้พิกัดกับค่าสัมบูรณ์หาระยะทางระหว่างจุดที่มีพิกัดตัวหน้าหรือตัวหลังเท่ากัน" }
  - id: "6.EE"
    title: "นิพจน์และสมการ (Expressions and Equations) เกรด 6"
    standards:
      - id: "6.EE.A"
        text: "ขยายความรู้เลขคณิตสู่นิพจน์พีชคณิต"
        indicators:
          - { id: "6.EE.1", level: "6", text: "เขียนและหาค่านิพจน์ของจำนวนที่มีเลขชี้กำลังเป็นจำนวนนับ" }
          - { id: "6.EE.2", level: "6", text: "เขียน อ่าน และหาค่านิพจน์ที่ใช้ตัวอักษรแทนจำนวน รู้จักคำเรียกส่วนของนิพจน์ (พจน์ ผลคูณ ตัวประกอบ สัมประสิทธิ์) และแทนค่าในสูตร" }
          - { id: "6.EE.3", level: "6", text: "ใช้สมบัติของการดำเนินการสร้างนิพจน์ที่สมมูลกัน" }
          - { id: "6.EE.4", level: "6", text: "บอกได้ว่านิพจน์สองนิพจน์สมมูลกันเมื่อมีค่าเท่ากันไม่ว่าจะแทนตัวแปรด้วยค่าใด" }
      - id: "6.EE.B"
        text: "ให้เหตุผลและแก้สมการและอสมการตัวแปรเดียว"
        indicators:
          - { id: "6.EE.5", level: "6", text: "เข้าใจการแก้สมการหรืออสมการว่าเป็นการหาค่าจากเซตที่กำหนดที่ทำให้ประโยคเป็นจริง และใช้การแทนค่าตรวจ" }
          - { id: "6.EE.6", level: "6", text: "ใช้ตัวแปรแทนจำนวนและเขียนนิพจน์เมื่อแก้ปัญหา โดยเข้าใจว่าตัวแปรแทนจำนวนที่ไม่ทราบค่าหรือจำนวนใดก็ได้ในเซตที่กำหนด" }
          - { id: "6.EE.7", level: "6", text: "แก้ปัญหาด้วยการเขียนและแก้สมการรูป x + p = q และ px = q เมื่อทุกค่าเป็นจำนวนตรรกยะที่ไม่เป็นลบ" }
          - { id: "6.EE.8", level: "6", text: "เขียนอสมการรูป x > c หรือ x < c แทนเงื่อนไขในปัญหา รู้ว่ามีคำตอบมากมายไม่จำกัด และแสดงคำตอบบนเส้นจำนวน" }
      - id: "6.EE.C"
        text: "นำเสนอและวิเคราะห์ความสัมพันธ์ระหว่างตัวแปรตามกับตัวแปรอิสระ"
        indicators:
          - { id: "6.EE.9", level: "6", text: "ใช้ตัวแปรแทนสองปริมาณที่เปลี่ยนแปลงสัมพันธ์กัน เขียนสมการของตัวแปรตามในรูปตัวแปรอิสระ และเชื่อมโยงสมการกับกราฟและตาราง" }
  - id: "6.G"
    title: "เรขาคณิต (Geometry) เกรด 6"
    standards:
      - id: "6.G.A"
        text: "แก้ปัญหาพื้นที่ พื้นที่ผิว และปริมาตร"
        indicators:
          - { id: "6.G.1", level: "6", text: "หาพื้นที่สามเหลี่ยม รูปสี่เหลี่ยมพิเศษ และรูปหลายเหลี่ยมด้วยการประกอบเป็นสี่เหลี่ยมผืนผ้าหรือแยกเป็นสามเหลี่ยม แล้วใช้แก้ปัญหา" }
          - { id: "6.G.2", level: "6", text: "หาปริมาตรปริซึมสี่เหลี่ยมมุมฉากที่ด้านยาวเป็นเศษส่วน ด้วยการบรรจุลูกบาศก์หน่วยเศษส่วนและด้วยสูตร แล้วแสดงว่าได้ผลเท่ากัน" }
          - { id: "6.G.3", level: "6", text: "เขียนรูปหลายเหลี่ยมบนระนาบพิกัดจากพิกัดของจุดยอด และใช้พิกัดหาความยาวด้านที่ขนานกับแกน" }
          - { id: "6.G.4", level: "6", text: "ใช้รูปคลี่ที่ประกอบด้วยสี่เหลี่ยมผืนผ้าและสามเหลี่ยมแทนรูปสามมิติ และใช้หาพื้นที่ผิว" }
  - id: "6.SP"
    title: "สถิติและความน่าจะเป็น (Statistics and Probability) เกรด 6"
    standards:
      - id: "6.SP.A"
        text: "เข้าใจความแปรปรวนทางสถิติ"
        indicators:
          - { id: "6.SP.1", level: "6", text: "แยกคำถามเชิงสถิติ (ซึ่งคาดว่าข้อมูลจะแตกต่างกัน) ออกจากคำถามที่มีคำตอบเดียว" }
          - { id: "6.SP.2", level: "6", text: "เข้าใจว่าข้อมูลที่เก็บเพื่อตอบคำถามเชิงสถิติมีการแจกแจง ซึ่งบรรยายได้ด้วยค่ากลาง การกระจาย และรูปร่าง" }
          - { id: "6.SP.3", level: "6", text: "เข้าใจว่าค่ากลางสรุปข้อมูลทั้งชุดด้วยจำนวนเดียว ส่วนค่าการกระจายบอกว่าข้อมูลแตกต่างกันมากเพียงใดด้วยจำนวนเดียว" }
      - id: "6.SP.B"
        text: "สรุปและบรรยายการแจกแจง"
        indicators:
          - { id: "6.SP.4", level: "6", text: "นำเสนอข้อมูลเชิงปริมาณบนเส้นจำนวนด้วยแผนภาพจุด ฮิสโทแกรม และแผนภาพกล่อง" }
          - { id: "6.SP.5", level: "6", text: "สรุปข้อมูลตามบริบท: บอกจำนวนข้อมูล ลักษณะที่ศึกษาและวิธีวัด ค่ากลาง (มัธยฐาน ค่าเฉลี่ย) และการกระจาย (พิสัยระหว่างควอร์ไทล์ ส่วนเบี่ยงเบนเฉลี่ย) รวมทั้งเลือกค่ากลางและค่าการกระจายให้เหมาะกับรูปร่างข้อมูล" }
  - id: "7.RP"
    title: "อัตราส่วนและความสัมพันธ์เชิงสัดส่วน (Ratios and Proportional Relationships) เกรด 7"
    standards:
      - id: "7.RP.A"
        text: "วิเคราะห์ความสัมพันธ์เชิงสัดส่วนและใช้แก้ปัญหา"
        indicators:
          - { id: "7.RP.1", level: "7", text: "คำนวณอัตราต่อหนึ่งหน่วยจากอัตราส่วนของเศษส่วน รวมทั้งปริมาณที่ใช้หน่วยเดียวกันหรือต่างกัน" }
          - { id: "7.RP.2", level: "7", text: "ระบุและแสดงความสัมพันธ์เชิงสัดส่วน: ตรวจด้วยตารางหรือกราฟเส้นตรงผ่านจุดกำเนิด หาค่าคงตัวของสัดส่วนจากตาราง กราฟ สมการ หรือแผนภาพ เขียนสมการ y = kx และอธิบายความหมายของจุด (1, r) บนกราฟ" }
          - { id: "7.RP.3", level: "7", text: "ใช้ความสัมพันธ์เชิงสัดส่วนแก้ปัญหาอัตราส่วนและร้อยละหลายขั้นตอน รวมถึงโจทย์การเงินในชีวิตประจำวันและการเปลี่ยนแปลงเป็นร้อยละ" }
  - id: "7.NS"
    title: "ระบบจำนวน (The Number System) เกรด 7"
    standards:
      - id: "7.NS.A"
        text: "ขยายความเข้าใจการดำเนินการของเศษส่วนสู่จำนวนตรรกยะ"
        indicators:
          - { id: "7.NS.1", level: "7", text: "บวกลบจำนวนตรรกยะและแสดงบนเส้นจำนวน: เข้าใจจำนวนตรงข้ามรวมกันได้ศูนย์ p + q เป็นการเลื่อนจาก p ไป |q| การลบคือการบวกด้วยจำนวนตรงข้าม และระยะห่างคือค่าสัมบูรณ์ของผลต่าง" }
          - { id: "7.NS.2", level: "7", text: "คูณหารจำนวนตรรกยะ: เข้าใจที่มาของกฎเครื่องหมายจากสมบัติของการดำเนินการ รู้ว่าผลหารของจำนวนเต็มเป็นจำนวนตรรกยะเมื่อตัวหารไม่เป็นศูนย์ และเปลี่ยนจำนวนตรรกยะเป็นทศนิยมซึ่งรู้จบหรือซ้ำ" }
          - { id: "7.NS.3", level: "7", text: "แก้ปัญหาด้วยการบวก ลบ คูณ หารจำนวนตรรกยะ" }
  - id: "7.EE"
    title: "นิพจน์และสมการ (Expressions and Equations) เกรด 7"
    standards:
      - id: "7.EE.A"
        text: "ใช้สมบัติของการดำเนินการสร้างนิพจน์ที่สมมูลกัน"
        indicators:
          - { id: "7.EE.1", level: "7", text: "บวก ลบ แยกตัวประกอบ และกระจายนิพจน์เชิงเส้นที่มีสัมประสิทธิ์เป็นจำนวนตรรกยะ โดยใช้สมบัติของการดำเนินการ" }
          - { id: "7.EE.2", level: "7", text: "เข้าใจว่าการเขียนนิพจน์ในรูปที่ต่างกันช่วยให้เห็นความหมายของปัญหาและความสัมพันธ์ระหว่างปริมาณ" }
      - id: "7.EE.B"
        text: "แก้ปัญหาด้วยนิพจน์และสมการ"
        indicators:
          - { id: "7.EE.3", level: "7", text: "แก้ปัญหาหลายขั้นตอนที่มีจำนวนตรรกยะทั้งบวกและลบในหลายรูป (จำนวนเต็ม เศษส่วน ทศนิยม) แปลงรูปจำนวนเมื่อจำเป็น และตรวจความสมเหตุสมผลด้วยการคิดในใจและการประมาณ" }
          - { id: "7.EE.4", level: "7", text: "ใช้ตัวแปรสร้างสมการและอสมการอย่างง่ายเพื่อแก้ปัญหา: แก้สมการรูป px + q = r และ p(x + q) = r และแก้อสมการรูป px + q > r หรือ < r แล้วแสดงคำตอบเป็นกราฟและตีความ" }
  - id: "7.G"
    title: "เรขาคณิต (Geometry) เกรด 7"
    standards:
      - id: "7.G.A"
        text: "วาด สร้าง และบรรยายรูปเรขาคณิตและความสัมพันธ์ระหว่างรูป"
        indicators:
          - { id: "7.G.1", level: "7", text: "แก้ปัญหาเกี่ยวกับรูปย่อขยายตามมาตราส่วน คำนวณความยาวและพื้นที่จริง และวาดใหม่ด้วยมาตราส่วนอื่น" }
          - { id: "7.G.2", level: "7", text: "วาดรูปเรขาคณิตตามเงื่อนไข (ด้วยมือ ไม้บรรทัดกับโปรแทรกเตอร์ หรือเทคโนโลยี) โดยเน้นการสร้างสามเหลี่ยมจากมุมหรือด้านสามค่า และสังเกตว่าเงื่อนไขให้รูปเดียว หลายรูป หรือไม่มีรูป" }
          - { id: "7.G.3", level: "7", text: "บรรยายรูปสองมิติที่เกิดจากการตัดรูปสามมิติ เช่น ภาคตัดของปริซึมและพีระมิดฐานสี่เหลี่ยม" }
      - id: "7.G.B"
        text: "แก้ปัญหาขนาดของมุม พื้นที่ พื้นที่ผิว และปริมาตร"
        indicators:
          - { id: "7.G.4", level: "7", text: "รู้สูตรพื้นที่และเส้นรอบวงของวงกลม ใช้แก้ปัญหา และอธิบายความสัมพันธ์ระหว่างเส้นรอบวงกับพื้นที่อย่างไม่เป็นทางการ" }
          - { id: "7.G.5", level: "7", text: "ใช้สมบัติของมุมประกอบสองมุมฉาก มุมประกอบมุมฉาก มุมตรงข้ามที่จุดยอด และมุมประชิด เขียนและแก้สมการหามุมที่ไม่ทราบ" }
          - { id: "7.G.6", level: "7", text: "แก้ปัญหาพื้นที่ ปริมาตร และพื้นที่ผิวของรูปสองมิติและสามมิติที่ประกอบจากสามเหลี่ยม สี่เหลี่ยม รูปหลายเหลี่ยม ลูกบาศก์ และปริซึมตรง" }
  - id: "7.SP"
    title: "สถิติและความน่าจะเป็น (Statistics and Probability) เกรด 7"
    standards:
      - id: "7.SP.A"
        text: "ใช้การสุ่มตัวอย่างอนุมานเกี่ยวกับประชากร"
        indicators:
          - { id: "7.SP.1", level: "7", text: "เข้าใจว่าสถิติให้ข้อมูลเกี่ยวกับประชากรจากกลุ่มตัวอย่าง ซึ่งสรุปได้สมเหตุสมผลเมื่อกลุ่มตัวอย่างเป็นตัวแทน และการสุ่มช่วยให้ได้กลุ่มตัวอย่างที่เป็นตัวแทน" }
          - { id: "7.SP.2", level: "7", text: "ใช้ข้อมูลจากกลุ่มตัวอย่างสุ่มอนุมานลักษณะของประชากร และสร้างหลายกลุ่มตัวอย่าง (หรือจำลอง) เพื่อดูว่าค่าประมาณคลาดเคลื่อนได้มากเพียงใด" }
      - id: "7.SP.B"
        text: "อนุมานเปรียบเทียบประชากรสองกลุ่มอย่างไม่เป็นทางการ"
        indicators:
          - { id: "7.SP.3", level: "7", text: "ประเมินการซ้อนทับของการแจกแจงข้อมูลสองชุดที่การกระจายใกล้กัน โดยวัดผลต่างของค่ากลางเป็นจำนวนเท่าของค่าการกระจาย" }
          - { id: "7.SP.4", level: "7", text: "ใช้ค่ากลางและค่าการกระจายของกลุ่มตัวอย่างสุ่มเปรียบเทียบประชากรสองกลุ่มอย่างไม่เป็นทางการ" }
      - id: "7.SP.C"
        text: "ศึกษากระบวนการสุ่ม และพัฒนา ใช้ และประเมินแบบจำลองความน่าจะเป็น"
        indicators:
          - { id: "7.SP.5", level: "7", text: "เข้าใจว่าความน่าจะเป็นเป็นจำนวนระหว่าง 0 ถึง 1 ยิ่งมากยิ่งมีโอกาสเกิด โดย 1/2 คือไม่ค่อนไปทางใด ใกล้ 0 คือไม่น่าเกิด และใกล้ 1 คือน่าจะเกิด" }
          - { id: "7.SP.6", level: "7", text: "ประมาณความน่าจะเป็นจากความถี่สัมพัทธ์เมื่อทำการทดลองซ้ำหลายครั้ง และใช้ความน่าจะเป็นคาดการณ์ความถี่สัมพัทธ์โดยประมาณ" }
          - { id: "7.SP.7", level: "7", text: "สร้างแบบจำลองความน่าจะเป็น (ทั้งแบบเท่ากันทุกผลลัพธ์และแบบที่ได้จากการสังเกต) ใช้หาความน่าจะเป็น และเทียบกับความถี่ที่สังเกตได้ พร้อมอธิบายสาเหตุถ้าไม่สอดคล้อง" }
          - { id: "7.SP.8", level: "7", text: "หาความน่าจะเป็นของเหตุการณ์ประกอบด้วยรายการ ตาราง แผนภาพต้นไม้ และการจำลอง เข้าใจว่าเป็นสัดส่วนของผลลัพธ์ในปริภูมิตัวอย่าง และออกแบบการจำลองเพื่อประมาณความน่าจะเป็น" }
  - id: "8.NS"
    title: "ระบบจำนวน (The Number System) เกรด 8"
    standards:
      - id: "8.NS.A"
        text: "รู้ว่ามีจำนวนที่ไม่ใช่จำนวนตรรกยะ และประมาณค่าด้วยจำนวนตรรกยะ"
        indicators:
          - { id: "8.NS.1", level: "8", text: "รู้ว่าจำนวนที่ไม่ใช่จำนวนตรรกยะเรียกว่าจำนวนอตรรกยะ ทุกจำนวนมีรูปทศนิยม จำนวนตรรกยะมีทศนิยมซ้ำ และเปลี่ยนทศนิยมซ้ำเป็นเศษส่วน" }
          - { id: "8.NS.2", level: "8", text: "ใช้ค่าประมาณที่เป็นจำนวนตรรกยะเปรียบเทียบขนาดจำนวนอตรรกยะ หาตำแหน่งโดยประมาณบนเส้นจำนวน และประมาณค่านิพจน์" }
  - id: "8.EE"
    title: "นิพจน์และสมการ (Expressions and Equations) เกรด 8"
    standards:
      - id: "8.EE.A"
        text: "ทำงานกับรากและเลขชี้กำลังที่เป็นจำนวนเต็ม"
        indicators:
          - { id: "8.EE.1", level: "8", text: "ใช้สมบัติของเลขยกกำลังที่มีเลขชี้กำลังเป็นจำนวนเต็มสร้างนิพจน์ที่สมมูลกัน" }
          - { id: "8.EE.2", level: "8", text: "ใช้รากที่สองและรากที่สามแทนคำตอบของสมการ x^2 = p และ x^3 = p หาค่ารากของกำลังสองและกำลังสามสมบูรณ์ที่ไม่ใหญ่ และรู้ว่า √2 เป็นจำนวนอตรรกยะ" }
          - { id: "8.EE.3", level: "8", text: "ใช้รูปเลขหลักเดียวคูณกำลังของ 10 ประมาณปริมาณที่ใหญ่มากหรือเล็กมาก และบอกว่าปริมาณหนึ่งเป็นกี่เท่าของอีกปริมาณ" }
          - { id: "8.EE.4", level: "8", text: "คำนวณกับจำนวนในรูปสัญกรณ์วิทยาศาสตร์ (รวมทั้งปนกับทศนิยม) เลือกหน่วยให้เหมาะกับขนาด และอ่านค่าสัญกรณ์วิทยาศาสตร์จากเทคโนโลยี" }
      - id: "8.EE.B"
        text: "เข้าใจความเชื่อมโยงระหว่างความสัมพันธ์เชิงสัดส่วน เส้นตรง และสมการเชิงเส้น"
        indicators:
          - { id: "8.EE.5", level: "8", text: "เขียนกราฟความสัมพันธ์เชิงสัดส่วน ตีความอัตราต่อหน่วยเป็นความชัน และเปรียบเทียบความสัมพันธ์สองแบบที่นำเสนอต่างวิธี" }
          - { id: "8.EE.6", level: "8", text: "ใช้สามเหลี่ยมคล้ายอธิบายว่าความชันของเส้นตรงเท่ากันทุกช่วง และหาสมการ y = mx กับ y = mx + b ของเส้นตรง" }
      - id: "8.EE.C"
        text: "วิเคราะห์และแก้สมการเชิงเส้นและระบบสมการเชิงเส้นสองสมการ"
        indicators:
          - { id: "8.EE.7", level: "8", text: "แก้สมการเชิงเส้นตัวแปรเดียว: ยกตัวอย่างกรณีมีคำตอบเดียว มากมายไม่จำกัด หรือไม่มีคำตอบ และแก้สมการที่มีสัมประสิทธิ์ตรรกยะ ซึ่งต้องกระจายและรวมพจน์คล้าย" }
          - { id: "8.EE.8", level: "8", text: "วิเคราะห์และแก้ระบบสมการเชิงเส้นสองตัวแปร: เข้าใจคำตอบเป็นจุดตัดของกราฟ แก้ด้วยพีชคณิตและประมาณด้วยกราฟ และแก้ปัญหาที่นำไปสู่ระบบสมการ" }
  - id: "8.F"
    title: "ฟังก์ชัน (Functions) เกรด 8"
    standards:
      - id: "8.F.A"
        text: "นิยาม หาค่า และเปรียบเทียบฟังก์ชัน"
        indicators:
          - { id: "8.F.1", level: "8", text: "เข้าใจว่าฟังก์ชันคือกฎที่จับคู่ข้อมูลเข้าแต่ละค่ากับข้อมูลออกเพียงค่าเดียว และกราฟของฟังก์ชันคือเซตของคู่อันดับ" }
          - { id: "8.F.2", level: "8", text: "เปรียบเทียบสมบัติของฟังก์ชันสองฟังก์ชันที่นำเสนอต่างรูปแบบ (สมการ กราฟ ตาราง คำบรรยาย)" }
          - { id: "8.F.3", level: "8", text: "ตีความ y = mx + b ว่าเป็นฟังก์ชันเชิงเส้นซึ่งกราฟเป็นเส้นตรง และยกตัวอย่างฟังก์ชันที่ไม่เป็นเชิงเส้น" }
      - id: "8.F.B"
        text: "ใช้ฟังก์ชันสร้างแบบจำลองความสัมพันธ์ระหว่างปริมาณ"
        indicators:
          - { id: "8.F.4", level: "8", text: "สร้างฟังก์ชันเชิงเส้นจำลองความสัมพันธ์ หาอัตราการเปลี่ยนแปลงและค่าเริ่มต้นจากคำบรรยาย ตาราง หรือกราฟ และตีความตามสถานการณ์" }
          - { id: "8.F.5", level: "8", text: "บรรยายความสัมพันธ์เชิงฟังก์ชันจากกราฟในเชิงคุณภาพ (เพิ่ม ลด เชิงเส้นหรือไม่) และร่างกราฟจากคำบรรยาย" }
  - id: "8.G"
    title: "เรขาคณิต (Geometry) เกรด 8"
    standards:
      - id: "8.G.A"
        text: "เข้าใจความเท่ากันทุกประการและความคล้ายด้วยแบบจำลอง แผ่นใส หรือโปรแกรมเรขาคณิต"
        indicators:
          - { id: "8.G.1", level: "8", text: "ทดลองตรวจสมบัติของการหมุน การสะท้อน และการเลื่อนขนาน: เส้นตรงยังเป็นเส้นตรง ความยาวและขนาดมุมคงเดิม และเส้นขนานยังขนานกัน" }
          - { id: "8.G.2", level: "8", text: "เข้าใจว่ารูปสองรูปเท่ากันทุกประการเมื่อได้จากกันด้วยการหมุน สะท้อน และเลื่อนขนานต่อกัน และบอกลำดับการแปลงนั้นได้" }
          - { id: "8.G.3", level: "8", text: "ใช้พิกัดบรรยายผลของการย่อขยาย การเลื่อนขนาน การหมุน และการสะท้อนต่อรูปสองมิติ" }
          - { id: "8.G.4", level: "8", text: "เข้าใจว่ารูปสองรูปคล้ายกันเมื่อได้จากกันด้วยการแปลงที่รวมการย่อขยาย และบอกลำดับการแปลงนั้นได้" }
          - { id: "8.G.5", level: "8", text: "ให้เหตุผลอย่างไม่เป็นทางการเรื่องผลบวกมุมภายในและมุมภายนอกของสามเหลี่ยม มุมที่เกิดจากเส้นตัดเส้นขนาน และเงื่อนไขมุม-มุมของสามเหลี่ยมคล้าย" }
      - id: "8.G.B"
        text: "เข้าใจและใช้ทฤษฎีบทพีทาโกรัส"
        indicators:
          - { id: "8.G.6", level: "8", text: "อธิบายการพิสูจน์ทฤษฎีบทพีทาโกรัสและบทกลับ" }
          - { id: "8.G.7", level: "8", text: "ใช้ทฤษฎีบทพีทาโกรัสหาความยาวด้านของสามเหลี่ยมมุมฉากในปัญหาสองและสามมิติ" }
          - { id: "8.G.8", level: "8", text: "ใช้ทฤษฎีบทพีทาโกรัสหาระยะทางระหว่างจุดสองจุดบนระนาบพิกัด" }
      - id: "8.G.C"
        text: "แก้ปัญหาปริมาตรของทรงกระบอก กรวย และทรงกลม"
        indicators:
          - { id: "8.G.9", level: "8", text: "รู้สูตรปริมาตรของกรวย ทรงกระบอก และทรงกลม และใช้แก้ปัญหา" }
  - id: "8.SP"
    title: "สถิติและความน่าจะเป็น (Statistics and Probability) เกรด 8"
    standards:
      - id: "8.SP.A"
        text: "ศึกษาแบบแผนความสัมพันธ์ในข้อมูลสองตัวแปร"
        indicators:
          - { id: "8.SP.1", level: "8", text: "สร้างและตีความแผนภาพการกระจายของข้อมูลสองตัวแปร บรรยายการเกาะกลุ่ม ค่าผิดปกติ ความสัมพันธ์ทางบวกหรือลบ เชิงเส้นหรือไม่เชิงเส้น" }
          - { id: "8.SP.2", level: "8", text: "รู้ว่าเส้นตรงใช้จำลองความสัมพันธ์ของสองตัวแปรเชิงปริมาณ ลากเส้นตรงที่เหมาะกับแผนภาพการกระจายอย่างไม่เป็นทางการ และประเมินความเหมาะด้วยระยะของจุดจากเส้น" }
          - { id: "8.SP.3", level: "8", text: "ใช้สมการของแบบจำลองเชิงเส้นแก้ปัญหาในบริบทข้อมูลสองตัวแปร และตีความความชันกับจุดตัดแกน" }
          - { id: "8.SP.4", level: "8", text: "เข้าใจว่าข้อมูลเชิงกลุ่มสองตัวแปรก็แสดงความสัมพันธ์ได้ สร้างและตีความตารางสองทางด้วยความถี่และความถี่สัมพัทธ์" }
  - id: "N-RN"
    title: "ระบบจำนวนจริง (The Real Number System) มัธยมปลาย: จำนวนและปริมาณ"
    standards:
      - id: "N-RN.A"
        text: "ขยายสมบัติของเลขยกกำลังสู่เลขชี้กำลังที่เป็นจำนวนตรรกยะ"
        indicators:
          - { id: "N-RN.1", level: "HS", text: "อธิบายว่านิยามของเลขชี้กำลังตรรกยะมาจากการขยายสมบัติของเลขชี้กำลังจำนวนเต็ม ทำให้เขียนรากในรูปเลขชี้กำลังได้" }
          - { id: "N-RN.2", level: "HS", text: "เขียนนิพจน์ที่มีรากและเลขชี้กำลังตรรกยะในรูปอื่นด้วยสมบัติของเลขยกกำลัง" }
      - id: "N-RN.B"
        text: "ใช้สมบัติของจำนวนตรรกยะและจำนวนอตรรกยะ"
        indicators:
          - { id: "N-RN.3", level: "HS", text: "อธิบายว่าผลบวกและผลคูณของจำนวนตรรกยะเป็นจำนวนตรรกยะ ส่วนจำนวนตรรกยะบวกจำนวนอตรรกยะ หรือจำนวนตรรกยะที่ไม่เป็นศูนย์คูณจำนวนอตรรกยะ ได้จำนวนอตรรกยะ" }
  - id: "N-Q"
    title: "ปริมาณ (Quantities) มัธยมปลาย: จำนวนและปริมาณ (การสร้างแบบจำลอง)"
    standards:
      - id: "N-Q.A"
        text: "ให้เหตุผลเชิงปริมาณและใช้หน่วยแก้ปัญหา"
        indicators:
          - { id: "N-Q.1", level: "HS", text: "ใช้หน่วยช่วยทำความเข้าใจและนำทางการแก้ปัญหาหลายขั้นตอน ใช้หน่วยในสูตรให้สอดคล้อง และเลือกสเกลกับจุดเริ่มของกราฟและการนำเสนอข้อมูล" }
          - { id: "N-Q.2", level: "HS", text: "กำหนดปริมาณที่เหมาะสมเพื่อสร้างแบบจำลองเชิงบรรยาย" }
          - { id: "N-Q.3", level: "HS", text: "เลือกระดับความละเอียดของการรายงานปริมาณให้สอดคล้องกับข้อจำกัดของการวัด" }
  - id: "N-CN"
    title: "ระบบจำนวนเชิงซ้อน (The Complex Number System) มัธยมปลาย: จำนวนและปริมาณ"
    standards:
      - id: "N-CN.A"
        text: "ดำเนินการทางเลขคณิตกับจำนวนเชิงซ้อน"
        indicators:
          - { id: "N-CN.1", level: "HS", text: "รู้จักจำนวน i ที่ i^2 = -1 และรู้ว่าจำนวนเชิงซ้อนทุกจำนวนเขียนได้ในรูป a + bi เมื่อ a, b เป็นจำนวนจริง" }
          - { id: "N-CN.2", level: "HS", text: "บวก ลบ และคูณจำนวนเชิงซ้อนโดยใช้ i^2 = -1 กับสมบัติการสลับที่ การเปลี่ยนกลุ่ม และการแจกแจง" }
          - { id: "N-CN.3", level: "HS", text: "หาสังยุคของจำนวนเชิงซ้อน และใช้สังยุคหาค่าสัมบูรณ์และผลหาร (เกินแกนกลาง)" }
      - id: "N-CN.B"
        text: "แสดงจำนวนเชิงซ้อนและการดำเนินการบนระนาบเชิงซ้อน"
        indicators:
          - { id: "N-CN.4", level: "HS", text: "แสดงจำนวนเชิงซ้อนบนระนาบเชิงซ้อนทั้งในรูปมุมฉากและรูปเชิงขั้ว และอธิบายว่าทำไมสองรูปนี้แทนจำนวนเดียวกัน (เกินแกนกลาง)" }
          - { id: "N-CN.5", level: "HS", text: "แสดงการบวก ลบ คูณ และสังยุคของจำนวนเชิงซ้อนในเชิงเรขาคณิตบนระนาบเชิงซ้อน และใช้สมบัตินี้ช่วยคำนวณ (เกินแกนกลาง)" }
          - { id: "N-CN.6", level: "HS", text: "หาระยะห่างระหว่างจำนวนเชิงซ้อนเป็นค่าสัมบูรณ์ของผลต่าง และหาจุดกึ่งกลางเป็นค่าเฉลี่ยของจุดปลาย (เกินแกนกลาง)" }
      - id: "N-CN.C"
        text: "ใช้จำนวนเชิงซ้อนในเอกลักษณ์และสมการพหุนาม"
        indicators:
          - { id: "N-CN.7", level: "HS", text: "แก้สมการกำลังสองสัมประสิทธิ์จริงที่มีคำตอบเป็นจำนวนเชิงซ้อน" }
          - { id: "N-CN.8", level: "HS", text: "ขยายเอกลักษณ์พหุนามไปใช้กับจำนวนเชิงซ้อน เช่น แยกตัวประกอบพหุนามที่ไม่มีรากจริง (เกินแกนกลาง)" }
          - { id: "N-CN.9", level: "HS", text: "รู้จักทฤษฎีบทหลักมูลของพีชคณิต และแสดงว่าเป็นจริงสำหรับพหุนามกำลังสอง (เกินแกนกลาง)" }
  - id: "N-VM"
    title: "ปริมาณเวกเตอร์และเมทริกซ์ (Vector and Matrix Quantities) มัธยมปลาย: จำนวนและปริมาณ"
    standards:
      - id: "N-VM.A"
        text: "แสดงและสร้างแบบจำลองด้วยปริมาณเวกเตอร์"
        indicators:
          - { id: "N-VM.1", level: "HS", text: "รู้ว่าปริมาณเวกเตอร์มีทั้งขนาดและทิศทาง แทนด้วยส่วนของเส้นตรงที่มีทิศทาง และใช้สัญลักษณ์ของเวกเตอร์และขนาดให้ถูกต้อง (เกินแกนกลาง)" }
          - { id: "N-VM.2", level: "HS", text: "หาองค์ประกอบของเวกเตอร์จากพิกัดของจุดปลายลบด้วยพิกัดของจุดเริ่มต้น (เกินแกนกลาง)" }
          - { id: "N-VM.3", level: "HS", text: "แก้ปัญหาความเร็วและปริมาณอื่นที่แทนด้วยเวกเตอร์ (เกินแกนกลาง)" }
      - id: "N-VM.B"
        text: "ดำเนินการกับเวกเตอร์"
        indicators:
          - { id: "N-VM.4", level: "HS", text: "บวกและลบเวกเตอร์ด้วยการต่อหัวต่อหาง ตามองค์ประกอบ และกฎสี่เหลี่ยมด้านขนาน หาขนาดและทิศของผลบวก และเข้าใจการลบเป็นการบวกด้วยเวกเตอร์ตรงข้าม (เกินแกนกลาง)" }
          - { id: "N-VM.5", level: "HS", text: "คูณเวกเตอร์ด้วยสเกลาร์ทั้งเชิงกราฟและตามองค์ประกอบ และหาขนาดกับทิศของผลคูณ (เกินแกนกลาง)" }
      - id: "N-VM.C"
        text: "ดำเนินการกับเมทริกซ์และใช้เมทริกซ์ในการประยุกต์"
        indicators:
          - { id: "N-VM.6", level: "HS", text: "ใช้เมทริกซ์แทนและจัดการข้อมูลในสถานการณ์ต่าง ๆ (เกินแกนกลาง)" }
          - { id: "N-VM.7", level: "HS", text: "คูณเมทริกซ์ด้วยสเกลาร์เพื่อได้เมทริกซ์ใหม่ (เกินแกนกลาง)" }
          - { id: "N-VM.8", level: "HS", text: "บวก ลบ และคูณเมทริกซ์ที่มีมิติเหมาะสม (เกินแกนกลาง)" }
          - { id: "N-VM.9", level: "HS", text: "เข้าใจว่าการคูณเมทริกซ์จัตุรัสไม่มีสมบัติการสลับที่ แต่ยังมีสมบัติการเปลี่ยนกลุ่มและการแจกแจง (เกินแกนกลาง)" }
          - { id: "N-VM.10", level: "HS", text: "เข้าใจบทบาทของเมทริกซ์ศูนย์และเมทริกซ์เอกลักษณ์เทียบกับ 0 และ 1 และรู้ว่าเมทริกซ์จัตุรัสมีตัวผกผันการคูณเมื่อดีเทอร์มิแนนต์ไม่เป็นศูนย์ (เกินแกนกลาง)" }
          - { id: "N-VM.11", level: "HS", text: "คูณเวกเตอร์ (มองเป็นเมทริกซ์หนึ่งหลัก) ด้วยเมทริกซ์เพื่อได้เวกเตอร์ใหม่ และใช้เมทริกซ์เป็นการแปลงเวกเตอร์ (เกินแกนกลาง)" }
          - { id: "N-VM.12", level: "HS", text: "ใช้เมทริกซ์ 2 × 2 เป็นการแปลงบนระนาบ และตีความค่าสัมบูรณ์ของดีเทอร์มิแนนต์ในรูปพื้นที่ (เกินแกนกลาง)" }
  - id: "A-SSE"
    title: "การมองโครงสร้างของนิพจน์ (Seeing Structure in Expressions) มัธยมปลาย: พีชคณิต"
    standards:
      - id: "A-SSE.A"
        text: "ตีความโครงสร้างของนิพจน์"
        indicators:
          - { id: "A-SSE.1", level: "HS", text: "ตีความนิพจน์ตามบริบท ทั้งส่วนย่อย (พจน์ ตัวประกอบ สัมประสิทธิ์) และการมองบางส่วนของนิพจน์ที่ซับซ้อนเป็นก้อนเดียว (การสร้างแบบจำลอง)" }
          - { id: "A-SSE.2", level: "HS", text: "ใช้โครงสร้างของนิพจน์มองหาวิธีเขียนนิพจน์นั้นใหม่ในรูปที่สมมูลกัน" }
      - id: "A-SSE.B"
        text: "เขียนนิพจน์ในรูปที่สมมูลกันเพื่อแก้ปัญหา"
        indicators:
          - { id: "A-SSE.3", level: "HS", text: "เลือกเขียนนิพจน์ในรูปที่สมมูลกันเพื่อให้เห็นสมบัติของปริมาณ: แยกตัวประกอบพหุนามกำลังสองหาค่าศูนย์ ทำเป็นกำลังสองสมบูรณ์หาค่าสูงสุดหรือต่ำสุด และใช้สมบัติเลขยกกำลังแปลงนิพจน์เอกซ์โพเนนเชียล (การสร้างแบบจำลอง)" }
          - { id: "A-SSE.4", level: "HS", text: "หาที่มาของสูตรผลบวกอนุกรมเรขาคณิตจำกัด (อัตราส่วนร่วมไม่เท่ากับ 1) และใช้สูตรแก้ปัญหา (การสร้างแบบจำลอง)" }
  - id: "A-APR"
    title: "เลขคณิตของพหุนามและนิพจน์ตรรกยะ (Arithmetic with Polynomials and Rational Expressions) มัธยมปลาย: พีชคณิต"
    standards:
      - id: "A-APR.A"
        text: "ดำเนินการทางเลขคณิตกับพหุนาม"
        indicators:
          - { id: "A-APR.1", level: "HS", text: "เข้าใจว่าพหุนามมีสมบัติปิดภายใต้การบวก ลบ และคูณเหมือนจำนวนเต็ม และบวก ลบ คูณพหุนามได้" }
      - id: "A-APR.B"
        text: "เข้าใจความสัมพันธ์ระหว่างค่าศูนย์กับตัวประกอบของพหุนาม"
        indicators:
          - { id: "A-APR.2", level: "HS", text: "รู้และใช้ทฤษฎีบทเศษเหลือ: เศษจากการหาร p(x) ด้วย x - a คือ p(a) จึง x - a เป็นตัวประกอบเมื่อ p(a) = 0" }
          - { id: "A-APR.3", level: "HS", text: "หาค่าศูนย์ของพหุนามจากการแยกตัวประกอบ และใช้ค่าศูนย์ร่างกราฟของฟังก์ชันพหุนาม" }
      - id: "A-APR.C"
        text: "ใช้เอกลักษณ์พหุนามแก้ปัญหา"
        indicators:
          - { id: "A-APR.4", level: "HS", text: "พิสูจน์เอกลักษณ์พหุนามและใช้บรรยายความสัมพันธ์ของจำนวน" }
          - { id: "A-APR.5", level: "HS", text: "รู้และใช้ทฤษฎีบททวินามกระจาย (x + y)^n เมื่อ n เป็นจำนวนเต็มบวก (เกินแกนกลาง)" }
      - id: "A-APR.D"
        text: "เขียนนิพจน์ตรรกยะในรูปอื่น"
        indicators:
          - { id: "A-APR.6", level: "HS", text: "เขียนนิพจน์ตรรกยะอย่างง่ายในรูปผลหารบวกเศษส่วนที่ดีกรีของเศษต่ำกว่าตัวหาร" }
          - { id: "A-APR.7", level: "HS", text: "เข้าใจว่านิพจน์ตรรกยะมีสมบัติปิดเหมือนจำนวนตรรกยะ และบวก ลบ คูณ หารนิพจน์ตรรกยะได้ (เกินแกนกลาง)" }
  - id: "A-CED"
    title: "การสร้างสมการ (Creating Equations) มัธยมปลาย: พีชคณิต (การสร้างแบบจำลอง)"
    standards:
      - id: "A-CED.A"
        text: "สร้างสมการที่บรรยายจำนวนหรือความสัมพันธ์"
        indicators:
          - { id: "A-CED.1", level: "HS", text: "สร้างสมการและอสมการตัวแปรเดียวจากปัญหาและใช้แก้ปัญหา รวมทั้งที่มาจากฟังก์ชันเชิงเส้น กำลังสอง ตรรกยะ และเอกซ์โพเนนเชียลอย่างง่าย" }
          - { id: "A-CED.2", level: "HS", text: "สร้างสมการสองตัวแปรขึ้นไปแทนความสัมพันธ์ระหว่างปริมาณ และเขียนกราฟบนแกนที่ระบุชื่อและสเกล" }
          - { id: "A-CED.3", level: "HS", text: "แทนเงื่อนไขด้วยสมการ อสมการ หรือระบบของสมการและอสมการ และตีความว่าคำตอบเป็นทางเลือกที่ใช้ได้หรือไม่ในบริบท" }
          - { id: "A-CED.4", level: "HS", text: "จัดรูปสูตรเพื่อหาปริมาณที่สนใจด้วยหลักเดียวกับการแก้สมการ" }
  - id: "A-REI"
    title: "การให้เหตุผลกับสมการและอสมการ (Reasoning with Equations and Inequalities) มัธยมปลาย: พีชคณิต"
    standards:
      - id: "A-REI.A"
        text: "เข้าใจการแก้สมการว่าเป็นกระบวนการให้เหตุผลและอธิบายเหตุผลได้"
        indicators:
          - { id: "A-REI.1", level: "HS", text: "อธิบายเหตุผลของแต่ละขั้นในการแก้สมการอย่างง่าย โดยอ้างความเท่ากันจากขั้นก่อนหน้า และสร้างข้อโต้แย้งรองรับวิธีแก้" }
          - { id: "A-REI.2", level: "HS", text: "แก้สมการตรรกยะและสมการที่มีรากตัวแปรเดียวอย่างง่าย และยกตัวอย่างการเกิดคำตอบแปลกปลอม" }
      - id: "A-REI.B"
        text: "แก้สมการและอสมการตัวแปรเดียว"
        indicators:
          - { id: "A-REI.3", level: "HS", text: "แก้สมการและอสมการเชิงเส้นตัวแปรเดียว รวมทั้งที่สัมประสิทธิ์เป็นตัวอักษร" }
          - { id: "A-REI.4", level: "HS", text: "แก้สมการกำลังสองตัวแปรเดียว: ใช้การทำกำลังสองสมบูรณ์และหาที่มาของสูตรกำลังสอง แก้ด้วยการถอดราก การแยกตัวประกอบ และสูตร และรู้ว่าเมื่อใดได้คำตอบเป็นจำนวนเชิงซ้อน" }
      - id: "A-REI.C"
        text: "แก้ระบบสมการ"
        indicators:
          - { id: "A-REI.5", level: "HS", text: "พิสูจน์ว่าการแทนสมการหนึ่งด้วยผลบวกของมันกับพหุคูณของอีกสมการ ได้ระบบสมการที่มีคำตอบเดิม" }
          - { id: "A-REI.6", level: "HS", text: "แก้ระบบสมการเชิงเส้นสองตัวแปรทั้งแบบค่าแม่นตรงและแบบประมาณ (เช่น ด้วยกราฟ)" }
          - { id: "A-REI.7", level: "HS", text: "แก้ระบบสมการเชิงเส้นกับสมการกำลังสองสองตัวแปรด้วยพีชคณิตและกราฟ" }
          - { id: "A-REI.8", level: "HS", text: "เขียนระบบสมการเชิงเส้นเป็นสมการเมทริกซ์เดียวของตัวแปรเวกเตอร์ (เกินแกนกลาง)" }
          - { id: "A-REI.9", level: "HS", text: "หาเมทริกซ์ผกผัน (ถ้ามี) และใช้แก้ระบบสมการเชิงเส้น โดยใช้เทคโนโลยีกับเมทริกซ์ขนาด 3 × 3 ขึ้นไป (เกินแกนกลาง)" }
      - id: "A-REI.D"
        text: "นำเสนอและแก้สมการและอสมการด้วยกราฟ"
        indicators:
          - { id: "A-REI.10", level: "HS", text: "เข้าใจว่ากราฟของสมการสองตัวแปรคือเซตของคำตอบทั้งหมดบนระนาบพิกัด ซึ่งมักเป็นเส้นโค้งหรือเส้นตรง" }
          - { id: "A-REI.11", level: "HS", text: "อธิบายว่าพิกัด x ของจุดตัดของกราฟ y = f(x) กับ y = g(x) คือคำตอบของ f(x) = g(x) และหาคำตอบโดยประมาณด้วยเทคโนโลยี ตาราง หรือการประมาณต่อเนื่อง (การสร้างแบบจำลอง)" }
          - { id: "A-REI.12", level: "HS", text: "เขียนกราฟคำตอบของอสมการเชิงเส้นสองตัวแปรเป็นครึ่งระนาบ และหาบริเวณคำตอบของระบบอสมการเป็นส่วนที่ซ้อนทับกัน" }
  - id: "F-IF"
    title: "การตีความฟังก์ชัน (Interpreting Functions) มัธยมปลาย: ฟังก์ชัน"
    standards:
      - id: "F-IF.A"
        text: "เข้าใจแนวคิดของฟังก์ชันและใช้สัญกรณ์ฟังก์ชัน"
        indicators:
          - { id: "F-IF.1", level: "HS", text: "เข้าใจว่าฟังก์ชันจับคู่แต่ละสมาชิกของโดเมนกับสมาชิกของเรนจ์เพียงตัวเดียว รู้ความหมายของ f(x) และกราฟของ y = f(x)" }
          - { id: "F-IF.2", level: "HS", text: "ใช้สัญกรณ์ฟังก์ชัน หาค่าฟังก์ชันที่ค่าในโดเมน และตีความข้อความที่ใช้สัญกรณ์ฟังก์ชันตามบริบท" }
          - { id: "F-IF.3", level: "HS", text: "รู้ว่าลำดับเป็นฟังก์ชันที่มีโดเมนเป็นสับเซตของจำนวนเต็ม และอาจนิยามแบบเวียนเกิด" }
      - id: "F-IF.B"
        text: "ตีความฟังก์ชันในการประยุกต์ตามบริบท"
        indicators:
          - { id: "F-IF.4", level: "HS", text: "ตีความลักษณะสำคัญของกราฟและตารางของฟังก์ชันตามบริบท (จุดตัดแกน ช่วงเพิ่มลด ค่าสูงสุดต่ำสุด สมมาตร พฤติกรรมปลาย คาบ) และร่างกราฟจากคำบรรยาย (การสร้างแบบจำลอง)" }
          - { id: "F-IF.5", level: "HS", text: "เชื่อมโดเมนของฟังก์ชันกับกราฟและกับความสัมพันธ์เชิงปริมาณที่ฟังก์ชันบรรยาย (การสร้างแบบจำลอง)" }
          - { id: "F-IF.6", level: "HS", text: "คำนวณและตีความอัตราการเปลี่ยนแปลงเฉลี่ยของฟังก์ชันในช่วงที่กำหนด และประมาณจากกราฟ (การสร้างแบบจำลอง)" }
      - id: "F-IF.C"
        text: "วิเคราะห์ฟังก์ชันด้วยการนำเสนอหลายแบบ"
        indicators:
          - { id: "F-IF.7", level: "HS", text: "เขียนกราฟฟังก์ชันจากสมการและแสดงลักษณะสำคัญ ทั้งฟังก์ชันเชิงเส้น กำลังสอง รากที่สอง รากที่สาม ค่าสัมบูรณ์ ขั้นบันได เป็นช่วง พหุนาม ตรรกยะ เอกซ์โพเนนเชียล ลอการิทึม และตรีโกณมิติ (เกินแกนกลาง) (การสร้างแบบจำลอง)" }
          - { id: "F-IF.8", level: "HS", text: "เขียนฟังก์ชันในรูปที่สมมูลกันเพื่อให้เห็นสมบัติ เช่น แยกตัวประกอบหรือทำกำลังสองสมบูรณ์เพื่อหาค่าศูนย์ จุดยอด และสมมาตร และใช้สมบัติเลขยกกำลังตีความอัตราการเติบโตหรือสลายตัว" }
          - { id: "F-IF.9", level: "HS", text: "เปรียบเทียบสมบัติของฟังก์ชันสองฟังก์ชันที่นำเสนอต่างรูปแบบ (สมการ กราฟ ตาราง คำบรรยาย)" }
  - id: "F-BF"
    title: "การสร้างฟังก์ชัน (Building Functions) มัธยมปลาย: ฟังก์ชัน"
    standards:
      - id: "F-BF.A"
        text: "สร้างฟังก์ชันที่จำลองความสัมพันธ์ระหว่างสองปริมาณ"
        indicators:
          - { id: "F-BF.1", level: "HS", text: "เขียนฟังก์ชันบรรยายความสัมพันธ์: หาสูตรตรง กระบวนการเวียนเกิด หรือขั้นตอนคำนวณจากบริบท รวมฟังก์ชันพื้นฐานด้วยการดำเนินการ และประกอบฟังก์ชัน (เกินแกนกลาง) (การสร้างแบบจำลอง)" }
          - { id: "F-BF.2", level: "HS", text: "เขียนลำดับเลขคณิตและลำดับเรขาคณิตทั้งแบบเวียนเกิดและแบบสูตรตรง ใช้จำลองสถานการณ์ และแปลงไปมาระหว่างสองรูป (การสร้างแบบจำลอง)" }
      - id: "F-BF.B"
        text: "สร้างฟังก์ชันใหม่จากฟังก์ชันเดิม"
        indicators:
          - { id: "F-BF.3", level: "HS", text: "บอกผลต่อกราฟเมื่อเปลี่ยน f(x) เป็น f(x) + k, k f(x), f(kx) และ f(x + k) หา k จากกราฟ และระบุฟังก์ชันคู่และคี่จากกราฟและสมการ" }
          - { id: "F-BF.4", level: "HS", text: "หาฟังก์ชันผกผัน: แก้ f(x) = c เพื่อเขียนตัวผกผันของฟังก์ชันอย่างง่าย ตรวจด้วยการประกอบฟังก์ชัน อ่านค่าตัวผกผันจากกราฟหรือตาราง และจำกัดโดเมนให้มีตัวผกผัน (เกินแกนกลาง)" }
          - { id: "F-BF.5", level: "HS", text: "เข้าใจความสัมพันธ์ผกผันระหว่างเลขยกกำลังกับลอการิทึม และใช้แก้ปัญหา (เกินแกนกลาง)" }
  - id: "F-LE"
    title: "แบบจำลองเชิงเส้น กำลังสอง และเอกซ์โพเนนเชียล (Linear, Quadratic, and Exponential Models) มัธยมปลาย: ฟังก์ชัน (การสร้างแบบจำลอง)"
    standards:
      - id: "F-LE.A"
        text: "สร้างและเปรียบเทียบแบบจำลองเชิงเส้น กำลังสอง และเอกซ์โพเนนเชียล และใช้แก้ปัญหา"
        indicators:
          - { id: "F-LE.1", level: "HS", text: "แยกสถานการณ์ที่จำลองด้วยฟังก์ชันเชิงเส้น (เพิ่มเท่ากันในช่วงเท่ากัน) ออกจากฟังก์ชันเอกซ์โพเนนเชียล (เพิ่มเป็นสัดส่วนเท่ากันในช่วงเท่ากัน)" }
          - { id: "F-LE.2", level: "HS", text: "สร้างฟังก์ชันเชิงเส้นและเอกซ์โพเนนเชียล (รวมถึงลำดับเลขคณิตและเรขาคณิต) จากกราฟ คำบรรยาย หรือคู่ข้อมูลเข้า-ออกสองคู่" }
          - { id: "F-LE.3", level: "HS", text: "ใช้กราฟและตารางสังเกตว่าปริมาณที่เพิ่มแบบเอกซ์โพเนนเชียลจะแซงปริมาณที่เพิ่มแบบเชิงเส้น กำลังสอง หรือพหุนามในที่สุด" }
          - { id: "F-LE.4", level: "HS", text: "เขียนคำตอบของสมการเอกซ์โพเนนเชียลในรูปลอการิทึม (ฐาน 2, 10 หรือ e) และหาค่าด้วยเทคโนโลยี" }
      - id: "F-LE.B"
        text: "ตีความนิพจน์ของฟังก์ชันตามสถานการณ์ที่จำลอง"
        indicators:
          - { id: "F-LE.5", level: "HS", text: "ตีความพารามิเตอร์ของฟังก์ชันเชิงเส้นหรือเอกซ์โพเนนเชียลตามบริบท" }
  - id: "F-TF"
    title: "ฟังก์ชันตรีโกณมิติ (Trigonometric Functions) มัธยมปลาย: ฟังก์ชัน"
    standards:
      - id: "F-TF.A"
        text: "ขยายโดเมนของฟังก์ชันตรีโกณมิติด้วยวงกลมหนึ่งหน่วย"
        indicators:
          - { id: "F-TF.1", level: "HS", text: "เข้าใจการวัดมุมเป็นเรเดียนว่าคือความยาวส่วนโค้งบนวงกลมหนึ่งหน่วยที่มุมรองรับ" }
          - { id: "F-TF.2", level: "HS", text: "อธิบายว่าวงกลมหนึ่งหน่วยทำให้นิยามฟังก์ชันตรีโกณมิติกับจำนวนจริงทุกจำนวนได้ โดยมองเป็นมุมเรเดียนที่วัดทวนเข็มนาฬิกา" }
          - { id: "F-TF.3", level: "HS", text: "ใช้สามเหลี่ยมพิเศษหาค่า sin, cos, tan ของ π/3, π/4, π/6 และใช้วงกลมหนึ่งหน่วยหาค่าของมุม π - x, π + x และ 2π - x (เกินแกนกลาง)" }
          - { id: "F-TF.4", level: "HS", text: "ใช้วงกลมหนึ่งหน่วยอธิบายความเป็นฟังก์ชันคู่หรือคี่และความเป็นคาบของฟังก์ชันตรีโกณมิติ (เกินแกนกลาง)" }
      - id: "F-TF.B"
        text: "จำลองปรากฏการณ์ที่เป็นคาบด้วยฟังก์ชันตรีโกณมิติ"
        indicators:
          - { id: "F-TF.5", level: "HS", text: "เลือกฟังก์ชันตรีโกณมิติจำลองปรากฏการณ์เป็นคาบตามแอมพลิจูด ความถี่ และเส้นกึ่งกลางที่กำหนด (การสร้างแบบจำลอง)" }
          - { id: "F-TF.6", level: "HS", text: "เข้าใจว่าการจำกัดโดเมนของฟังก์ชันตรีโกณมิติให้เพิ่มหรือลดอย่างเดียวทำให้สร้างฟังก์ชันผกผันได้ (เกินแกนกลาง)" }
          - { id: "F-TF.7", level: "HS", text: "ใช้ฟังก์ชันตรีโกณมิติผกผันแก้สมการที่เกิดจากการสร้างแบบจำลอง หาค่าด้วยเทคโนโลยี และตีความตามบริบท (เกินแกนกลาง) (การสร้างแบบจำลอง)" }
      - id: "F-TF.C"
        text: "พิสูจน์และใช้เอกลักษณ์ตรีโกณมิติ"
        indicators:
          - { id: "F-TF.8", level: "HS", text: "พิสูจน์เอกลักษณ์ sin^2(θ) + cos^2(θ) = 1 และใช้หาค่าฟังก์ชันตรีโกณมิติอื่นเมื่อรู้ค่าหนึ่งและจตุภาคของมุม" }
          - { id: "F-TF.9", level: "HS", text: "พิสูจน์สูตรผลบวกและผลต่างของมุมสำหรับ sin, cos, tan และใช้แก้ปัญหา (เกินแกนกลาง)" }
  - id: "G-CO"
    title: "ความเท่ากันทุกประการ (Congruence) มัธยมปลาย: เรขาคณิต"
    standards:
      - id: "G-CO.A"
        text: "ทดลองการแปลงบนระนาบ"
        indicators:
          - { id: "G-CO.1", level: "HS", text: "รู้บทนิยามที่แม่นยำของมุม วงกลม เส้นตั้งฉาก เส้นขนาน และส่วนของเส้นตรง โดยอาศัยอนิยามจุด เส้น และระยะทาง" }
          - { id: "G-CO.2", level: "HS", text: "แสดงการแปลงบนระนาบด้วยแผ่นใสหรือโปรแกรมเรขาคณิต มองการแปลงเป็นฟังก์ชันของจุด และเปรียบเทียบการแปลงที่คงระยะและมุมกับการแปลงที่ไม่คง" }
          - { id: "G-CO.3", level: "HS", text: "บรรยายการหมุนและการสะท้อนที่ทำให้สี่เหลี่ยมผืนผ้า สี่เหลี่ยมด้านขนาน สี่เหลี่ยมคางหมู หรือรูปหลายเหลี่ยมด้านเท่ามุมเท่าทับตัวเอง" }
          - { id: "G-CO.4", level: "HS", text: "สร้างบทนิยามของการหมุน การสะท้อน และการเลื่อนขนานด้วยมุม วงกลม เส้นตั้งฉาก เส้นขนาน และส่วนของเส้นตรง" }
          - { id: "G-CO.5", level: "HS", text: "วาดภาพที่ได้จากการหมุน สะท้อน หรือเลื่อนขนานรูปที่กำหนด และระบุลำดับการแปลงที่พารูปหนึ่งไปทับอีกรูป" }
      - id: "G-CO.B"
        text: "เข้าใจความเท่ากันทุกประการผ่านการเคลื่อนที่แบบแข็งเกร็ง"
        indicators:
          - { id: "G-CO.6", level: "HS", text: "ใช้การเคลื่อนที่แบบแข็งเกร็งแปลงรูปและคาดผลของการแปลง และใช้บทนิยามความเท่ากันทุกประการตัดสินว่ารูปสองรูปเท่ากันทุกประการหรือไม่" }
          - { id: "G-CO.7", level: "HS", text: "ใช้บทนิยามความเท่ากันทุกประการแสดงว่าสามเหลี่ยมสองรูปเท่ากันทุกประการก็ต่อเมื่อด้านและมุมที่สมนัยกันเท่ากันทุกคู่" }
          - { id: "G-CO.8", level: "HS", text: "อธิบายว่าเงื่อนไขความเท่ากันทุกประการของสามเหลี่ยม (มุม-ด้าน-มุม ด้าน-มุม-ด้าน ด้าน-ด้าน-ด้าน) มาจากบทนิยามการเคลื่อนที่แบบแข็งเกร็งอย่างไร" }
      - id: "G-CO.C"
        text: "พิสูจน์ทฤษฎีบททางเรขาคณิต"
        indicators:
          - { id: "G-CO.9", level: "HS", text: "พิสูจน์ทฤษฎีบทเกี่ยวกับเส้นและมุม เช่น มุมตรงข้ามที่จุดยอด มุมที่เกิดจากเส้นตัดเส้นขนาน และจุดบนเส้นแบ่งครึ่งตั้งฉาก" }
          - { id: "G-CO.10", level: "HS", text: "พิสูจน์ทฤษฎีบทเกี่ยวกับสามเหลี่ยม เช่น ผลบวกมุมภายใน มุมฐานของสามเหลี่ยมหน้าจั่ว ส่วนของเส้นตรงที่เชื่อมจุดกึ่งกลางด้าน และจุดตัดของเส้นมัธยฐาน" }
          - { id: "G-CO.11", level: "HS", text: "พิสูจน์ทฤษฎีบทเกี่ยวกับสี่เหลี่ยมด้านขนาน เช่น ด้านตรงข้าม มุมตรงข้าม เส้นทแยงมุมแบ่งครึ่งกัน และสี่เหลี่ยมผืนผ้าคือสี่เหลี่ยมด้านขนานที่เส้นทแยงมุมยาวเท่ากัน" }
      - id: "G-CO.D"
        text: "สร้างรูปทางเรขาคณิต"
        indicators:
          - { id: "G-CO.12", level: "HS", text: "สร้างรูปเรขาคณิตอย่างเป็นแบบแผนด้วยเครื่องมือและวิธีหลายแบบ ทั้งการลอกส่วนของเส้นตรงและมุม การแบ่งครึ่ง และการสร้างเส้นตั้งฉากและเส้นขนาน" }
          - { id: "G-CO.13", level: "HS", text: "สร้างสามเหลี่ยมด้านเท่า สี่เหลี่ยมจัตุรัส และหกเหลี่ยมด้านเท่ามุมเท่าแนบในวงกลม" }
  - id: "G-SRT"
    title: "ความคล้าย สามเหลี่ยมมุมฉาก และตรีโกณมิติ (Similarity, Right Triangles, and Trigonometry) มัธยมปลาย: เรขาคณิต"
    standards:
      - id: "G-SRT.A"
        text: "เข้าใจความคล้ายผ่านการแปลงแบบคล้าย"
        indicators:
          - { id: "G-SRT.1", level: "HS", text: "ทดลองตรวจสมบัติของการย่อขยายที่มีจุดศูนย์กลางและอัตราส่วน: เส้นที่ไม่ผ่านจุดศูนย์กลางได้เส้นขนาน และความยาวเปลี่ยนตามอัตราส่วน" }
          - { id: "G-SRT.2", level: "HS", text: "ใช้บทนิยามความคล้ายผ่านการแปลงตัดสินว่ารูปสองรูปคล้ายกันหรือไม่ และอธิบายว่าสามเหลี่ยมคล้ายคือมุมสมนัยเท่ากันและด้านสมนัยเป็นสัดส่วนกัน" }
          - { id: "G-SRT.3", level: "HS", text: "ใช้สมบัติของการแปลงแบบคล้ายสร้างเงื่อนไขมุม-มุมของสามเหลี่ยมคล้าย" }
      - id: "G-SRT.B"
        text: "พิสูจน์ทฤษฎีบทที่เกี่ยวกับความคล้าย"
        indicators:
          - { id: "G-SRT.4", level: "HS", text: "พิสูจน์ทฤษฎีบทเกี่ยวกับสามเหลี่ยม เช่น เส้นขนานกับด้านหนึ่งแบ่งอีกสองด้านเป็นสัดส่วน (และบทกลับ) และพิสูจน์ทฤษฎีบทพีทาโกรัสด้วยสามเหลี่ยมคล้าย" }
          - { id: "G-SRT.5", level: "HS", text: "ใช้เงื่อนไขความเท่ากันทุกประการและความคล้ายของสามเหลี่ยมแก้ปัญหาและพิสูจน์ความสัมพันธ์ในรูปเรขาคณิต" }
      - id: "G-SRT.C"
        text: "นิยามอัตราส่วนตรีโกณมิติและแก้ปัญหาสามเหลี่ยมมุมฉาก"
        indicators:
          - { id: "G-SRT.6", level: "HS", text: "เข้าใจว่าจากความคล้าย อัตราส่วนของด้านในสามเหลี่ยมมุมฉากขึ้นกับมุม จึงนิยามอัตราส่วนตรีโกณมิติของมุมแหลมได้" }
          - { id: "G-SRT.7", level: "HS", text: "อธิบายและใช้ความสัมพันธ์ระหว่าง sine กับ cosine ของมุมที่รวมกันเป็นมุมฉาก" }
          - { id: "G-SRT.8", level: "HS", text: "ใช้อัตราส่วนตรีโกณมิติและทฤษฎีบทพีทาโกรัสแก้สามเหลี่ยมมุมฉากในปัญหาประยุกต์ (การสร้างแบบจำลอง)" }
      - id: "G-SRT.D"
        text: "ใช้ตรีโกณมิติกับสามเหลี่ยมทั่วไป"
        indicators:
          - { id: "G-SRT.9", level: "HS", text: "หาที่มาของสูตรพื้นที่สามเหลี่ยม A = 1/2 ab sin(C) ด้วยการลากเส้นตั้งฉากจากจุดยอด (เกินแกนกลาง)" }
          - { id: "G-SRT.10", level: "HS", text: "พิสูจน์กฎของไซน์และกฎของโคไซน์ และใช้แก้ปัญหา (เกินแกนกลาง)" }
          - { id: "G-SRT.11", level: "HS", text: "ใช้กฎของไซน์และกฎของโคไซน์หาความยาวและมุมที่ไม่ทราบในสามเหลี่ยมทั้งมุมฉากและไม่มุมฉาก (เกินแกนกลาง)" }
  - id: "G-C"
    title: "วงกลม (Circles) มัธยมปลาย: เรขาคณิต"
    standards:
      - id: "G-C.A"
        text: "เข้าใจและใช้ทฤษฎีบทเกี่ยวกับวงกลม"
        indicators:
          - { id: "G-C.1", level: "HS", text: "พิสูจน์ว่าวงกลมทุกวงคล้ายกัน" }
          - { id: "G-C.2", level: "HS", text: "บอกและบรรยายความสัมพันธ์ของมุมในวงกลม รัศมี และคอร์ด เช่น มุมที่จุดศูนย์กลางกับมุมในส่วนโค้ง มุมในครึ่งวงกลม และรัศมีตั้งฉากกับเส้นสัมผัส" }
          - { id: "G-C.3", level: "HS", text: "สร้างวงกลมแนบในและวงกลมล้อมรอบสามเหลี่ยม และพิสูจน์สมบัติของมุมในรูปสี่เหลี่ยมแนบในวงกลม" }
          - { id: "G-C.4", level: "HS", text: "สร้างเส้นสัมผัสวงกลมจากจุดภายนอกวงกลม (เกินแกนกลาง)" }
      - id: "G-C.B"
        text: "หาความยาวส่วนโค้งและพื้นที่เซกเตอร์ของวงกลม"
        indicators:
          - { id: "G-C.5", level: "HS", text: "ใช้ความคล้ายแสดงว่าความยาวส่วนโค้งเป็นสัดส่วนกับรัศมี นิยามเรเดียนเป็นค่าคงตัวของสัดส่วนนั้น และหาสูตรพื้นที่เซกเตอร์" }
  - id: "G-GPE"
    title: "การแสดงสมบัติทางเรขาคณิตด้วยสมการ (Expressing Geometric Properties with Equations) มัธยมปลาย: เรขาคณิต"
    standards:
      - id: "G-GPE.A"
        text: "แปลงไปมาระหว่างคำบรรยายเชิงเรขาคณิตกับสมการของภาคตัดกรวย"
        indicators:
          - { id: "G-GPE.1", level: "HS", text: "หาสมการวงกลมจากจุดศูนย์กลางและรัศมีด้วยทฤษฎีบทพีทาโกรัส และทำกำลังสองสมบูรณ์เพื่อหาจุดศูนย์กลางและรัศมีจากสมการ" }
          - { id: "G-GPE.2", level: "HS", text: "หาสมการพาราโบลาจากจุดโฟกัสและเส้นไดเรกทริกซ์" }
          - { id: "G-GPE.3", level: "HS", text: "หาสมการวงรีและไฮเพอร์โบลาจากจุดโฟกัส โดยใช้ว่าผลบวกหรือผลต่างของระยะถึงจุดโฟกัสคงตัว (เกินแกนกลาง)" }
      - id: "G-GPE.B"
        text: "ใช้พิกัดพิสูจน์ทฤษฎีบทเรขาคณิตอย่างง่ายด้วยพีชคณิต"
        indicators:
          - { id: "G-GPE.4", level: "HS", text: "ใช้พิกัดพิสูจน์หรือหักล้างข้อความทางเรขาคณิตอย่างง่ายด้วยพีชคณิต" }
          - { id: "G-GPE.5", level: "HS", text: "พิสูจน์เงื่อนไขความชันของเส้นขนานและเส้นตั้งฉาก และใช้หาสมการเส้นตรงที่ขนานหรือตั้งฉากกับเส้นที่กำหนด" }
          - { id: "G-GPE.6", level: "HS", text: "หาจุดบนส่วนของเส้นตรงระหว่างสองจุดที่แบ่งส่วนนั้นตามอัตราส่วนที่กำหนด" }
          - { id: "G-GPE.7", level: "HS", text: "ใช้พิกัดคำนวณความยาวรอบรูปของรูปหลายเหลี่ยมและพื้นที่ของสามเหลี่ยมและสี่เหลี่ยมผืนผ้า (การสร้างแบบจำลอง)" }
  - id: "G-GMD"
    title: "การวัดและมิติทางเรขาคณิต (Geometric Measurement and Dimension) มัธยมปลาย: เรขาคณิต"
    standards:
      - id: "G-GMD.A"
        text: "อธิบายสูตรปริมาตรและใช้แก้ปัญหา"
        indicators:
          - { id: "G-GMD.1", level: "HS", text: "ให้เหตุผลอย่างไม่เป็นทางการรองรับสูตรเส้นรอบวงและพื้นที่วงกลม และปริมาตรทรงกระบอก พีระมิด และกรวย ด้วยการตัดแบ่ง หลักของคาวาลิเอรี หรือการคิดแบบลิมิต" }
          - { id: "G-GMD.2", level: "HS", text: "ใช้หลักของคาวาลิเอรีให้เหตุผลอย่างไม่เป็นทางการรองรับสูตรปริมาตรทรงกลมและรูปทรงอื่น (เกินแกนกลาง)" }
          - { id: "G-GMD.3", level: "HS", text: "ใช้สูตรปริมาตรทรงกระบอก พีระมิด กรวย และทรงกลมแก้ปัญหา (การสร้างแบบจำลอง)" }
      - id: "G-GMD.B"
        text: "เห็นภาพความสัมพันธ์ระหว่างรูปสองมิติกับรูปสามมิติ"
        indicators:
          - { id: "G-GMD.4", level: "HS", text: "บอกรูปร่างของภาคตัดสองมิติของรูปสามมิติ และบอกรูปสามมิติที่เกิดจากการหมุนรูปสองมิติ" }
  - id: "G-MG"
    title: "การสร้างแบบจำลองด้วยเรขาคณิต (Modeling with Geometry) มัธยมปลาย: เรขาคณิต"
    standards:
      - id: "G-MG.A"
        text: "ใช้แนวคิดเรขาคณิตในสถานการณ์การสร้างแบบจำลอง"
        indicators:
          - { id: "G-MG.1", level: "HS", text: "ใช้รูปเรขาคณิต การวัด และสมบัติของรูปบรรยายวัตถุจริงโดยประมาณเป็นรูปทรงพื้นฐาน (การสร้างแบบจำลอง)" }
          - { id: "G-MG.2", level: "HS", text: "ใช้แนวคิดความหนาแน่นต่อพื้นที่และต่อปริมาตรในสถานการณ์การสร้างแบบจำลอง (การสร้างแบบจำลอง)" }
          - { id: "G-MG.3", level: "HS", text: "ใช้วิธีทางเรขาคณิตแก้ปัญหาการออกแบบที่มีเงื่อนไขหรือต้องการค่าที่ดีที่สุด (การสร้างแบบจำลอง)" }
  - id: "S-ID"
    title: "การตีความข้อมูลเชิงกลุ่มและเชิงปริมาณ (Interpreting Categorical and Quantitative Data) มัธยมปลาย: สถิติและความน่าจะเป็น"
    standards:
      - id: "S-ID.A"
        text: "สรุป นำเสนอ และตีความข้อมูลของตัวแปรเดียวที่ได้จากการนับหรือการวัด"
        indicators:
          - { id: "S-ID.1", level: "HS", text: "นำเสนอข้อมูลบนเส้นจำนวนจริงด้วยแผนภาพจุด ฮิสโทแกรม และแผนภาพกล่อง" }
          - { id: "S-ID.2", level: "HS", text: "เลือกค่าสถิติให้เหมาะกับรูปร่างการแจกแจงเพื่อเปรียบเทียบค่ากลาง (มัธยฐาน ค่าเฉลี่ย) และการกระจาย (พิสัยระหว่างควอร์ไทล์ ส่วนเบี่ยงเบนมาตรฐาน) ของข้อมูลสองชุดขึ้นไป" }
          - { id: "S-ID.3", level: "HS", text: "ตีความความต่างของรูปร่าง ค่ากลาง และการกระจายตามบริบท โดยคำนึงถึงผลของค่าผิดปกติ" }
          - { id: "S-ID.4", level: "HS", text: "ใช้ค่าเฉลี่ยและส่วนเบี่ยงเบนมาตรฐานประมาณข้อมูลด้วยการแจกแจงปกติและประมาณร้อยละของประชากร รู้ว่าข้อมูลบางชุดไม่เหมาะกับวิธีนี้ และใช้เทคโนโลยีหรือตารางหาพื้นที่ใต้โค้งปกติ" }
      - id: "S-ID.B"
        text: "สรุป นำเสนอ และตีความข้อมูลสองตัวแปรทั้งเชิงกลุ่มและเชิงปริมาณ"
        indicators:
          - { id: "S-ID.5", level: "HS", text: "สรุปข้อมูลเชิงกลุ่มสองตัวแปรด้วยตารางความถี่สองทาง ตีความความถี่สัมพัทธ์ร่วม ส่วนขอบ และแบบมีเงื่อนไข และสังเกตแนวโน้มความสัมพันธ์" }
          - { id: "S-ID.6", level: "HS", text: "นำเสนอข้อมูลเชิงปริมาณสองตัวแปรด้วยแผนภาพการกระจาย หาฟังก์ชันที่เหมาะกับข้อมูลและใช้แก้ปัญหา ประเมินความเหมาะด้วยกราฟเศษเหลือ และลากเส้นตรงที่เหมาะเมื่อความสัมพันธ์เป็นเชิงเส้น" }
      - id: "S-ID.C"
        text: "ตีความแบบจำลองเชิงเส้น"
        indicators:
          - { id: "S-ID.7", level: "HS", text: "ตีความความชัน (อัตราการเปลี่ยนแปลง) และจุดตัดแกน (ค่าคงที่) ของแบบจำลองเชิงเส้นตามบริบทของข้อมูล" }
          - { id: "S-ID.8", level: "HS", text: "คำนวณ (ด้วยเทคโนโลยี) และตีความสัมประสิทธิ์สหสัมพันธ์ของเส้นตรงที่เหมาะกับข้อมูล" }
          - { id: "S-ID.9", level: "HS", text: "แยกความสัมพันธ์เชิงสหสัมพันธ์ออกจากความเป็นเหตุเป็นผล" }
  - id: "S-IC"
    title: "การอนุมานและการให้เหตุผลรองรับข้อสรุป (Making Inferences and Justifying Conclusions) มัธยมปลาย: สถิติและความน่าจะเป็น"
    standards:
      - id: "S-IC.A"
        text: "เข้าใจและประเมินกระบวนการสุ่มที่อยู่เบื้องหลังการทดลองทางสถิติ"
        indicators:
          - { id: "S-IC.1", level: "HS", text: "เข้าใจสถิติว่าเป็นกระบวนการอนุมานพารามิเตอร์ของประชากรจากกลุ่มตัวอย่างสุ่ม" }
          - { id: "S-IC.2", level: "HS", text: "ตัดสินว่าแบบจำลองที่กำหนดสอดคล้องกับผลจากกระบวนการสร้างข้อมูลหรือไม่ เช่น ด้วยการจำลอง" }
      - id: "S-IC.B"
        text: "อนุมานและให้เหตุผลรองรับข้อสรุปจากการสำรวจ การทดลอง และการศึกษาเชิงสังเกต"
        indicators:
          - { id: "S-IC.3", level: "HS", text: "บอกจุดประสงค์และความต่างของการสำรวจด้วยกลุ่มตัวอย่าง การทดลอง และการศึกษาเชิงสังเกต และอธิบายบทบาทของการสุ่มในแต่ละแบบ" }
          - { id: "S-IC.4", level: "HS", text: "ใช้ข้อมูลจากการสำรวจประมาณค่าเฉลี่ยหรือสัดส่วนของประชากร และหาค่าความคลาดเคลื่อนด้วยการจำลองการสุ่มตัวอย่าง" }
          - { id: "S-IC.5", level: "HS", text: "ใช้ข้อมูลจากการทดลองแบบสุ่มเปรียบเทียบสองวิธีทดลอง และใช้การจำลองตัดสินว่าความแตกต่างมีนัยสำคัญหรือไม่" }
          - { id: "S-IC.6", level: "HS", text: "ประเมินรายงานที่อ้างอิงข้อมูล" }
  - id: "S-CP"
    title: "ความน่าจะเป็นแบบมีเงื่อนไขและกฎของความน่าจะเป็น (Conditional Probability and the Rules of Probability) มัธยมปลาย: สถิติและความน่าจะเป็น"
    standards:
      - id: "S-CP.A"
        text: "เข้าใจความเป็นอิสระและความน่าจะเป็นแบบมีเงื่อนไข และใช้ตีความข้อมูล"
        indicators:
          - { id: "S-CP.1", level: "HS", text: "บรรยายเหตุการณ์เป็นสับเซตของปริภูมิตัวอย่างตามลักษณะของผลลัพธ์ หรือเป็นยูเนียน อินเตอร์เซกชัน และคอมพลีเมนต์ของเหตุการณ์อื่น (\"หรือ\" \"และ\" \"ไม่\")" }
          - { id: "S-CP.2", level: "HS", text: "เข้าใจว่าเหตุการณ์ A และ B เป็นอิสระกันเมื่อความน่าจะเป็นที่เกิดร่วมกันเท่ากับผลคูณของความน่าจะเป็นแต่ละเหตุการณ์ และใช้ตรวจความเป็นอิสระ" }
          - { id: "S-CP.3", level: "HS", text: "เข้าใจความน่าจะเป็นของ A เมื่อกำหนด B เป็น P(A และ B)/P(B) และตีความความเป็นอิสระว่าการรู้ B ไม่เปลี่ยนความน่าจะเป็นของ A" }
          - { id: "S-CP.4", level: "HS", text: "สร้างและตีความตารางความถี่สองทาง ใช้เป็นปริภูมิตัวอย่างตรวจความเป็นอิสระและประมาณความน่าจะเป็นแบบมีเงื่อนไข" }
          - { id: "S-CP.5", level: "HS", text: "อธิบายความน่าจะเป็นแบบมีเงื่อนไขและความเป็นอิสระด้วยภาษาและสถานการณ์ในชีวิตประจำวัน" }
      - id: "S-CP.B"
        text: "ใช้กฎของความน่าจะเป็นคำนวณความน่าจะเป็นของเหตุการณ์ประกอบ"
        indicators:
          - { id: "S-CP.6", level: "HS", text: "หาความน่าจะเป็นของ A เมื่อกำหนด B เป็นสัดส่วนของผลลัพธ์ใน B ที่อยู่ใน A ด้วย และตีความตามแบบจำลอง" }
          - { id: "S-CP.7", level: "HS", text: "ใช้กฎการบวก P(A หรือ B) = P(A) + P(B) - P(A และ B) และตีความตามแบบจำลอง" }
          - { id: "S-CP.8", level: "HS", text: "ใช้กฎการคูณทั่วไป P(A และ B) = P(A)P(B|A) = P(B)P(A|B) ในแบบจำลองความน่าจะเป็นที่ผลลัพธ์มีโอกาสเท่ากัน และตีความตามแบบจำลอง (เกินแกนกลาง)" }
          - { id: "S-CP.9", level: "HS", text: "ใช้การเรียงสับเปลี่ยนและการจัดหมู่คำนวณความน่าจะเป็นของเหตุการณ์ประกอบและแก้ปัญหา (เกินแกนกลาง)" }
  - id: "S-MD"
    title: "การใช้ความน่าจะเป็นในการตัดสินใจ (Using Probability to Make Decisions) มัธยมปลาย: สถิติและความน่าจะเป็น"
    standards:
      - id: "S-MD.A"
        text: "คำนวณค่าคาดหมายและใช้แก้ปัญหา"
        indicators:
          - { id: "S-MD.1", level: "HS", text: "นิยามตัวแปรสุ่มโดยกำหนดค่าตัวเลขให้แต่ละเหตุการณ์ในปริภูมิตัวอย่าง และเขียนกราฟการแจกแจงความน่าจะเป็น (เกินแกนกลาง)" }
          - { id: "S-MD.2", level: "HS", text: "คำนวณค่าคาดหมายของตัวแปรสุ่ม และตีความว่าเป็นค่าเฉลี่ยของการแจกแจงความน่าจะเป็น (เกินแกนกลาง)" }
          - { id: "S-MD.3", level: "HS", text: "สร้างการแจกแจงความน่าจะเป็นของตัวแปรสุ่มจากความน่าจะเป็นเชิงทฤษฎี และหาค่าคาดหมาย (เกินแกนกลาง)" }
          - { id: "S-MD.4", level: "HS", text: "สร้างการแจกแจงความน่าจะเป็นของตัวแปรสุ่มจากความน่าจะเป็นเชิงประจักษ์ (ข้อมูลจริง) และหาค่าคาดหมาย (เกินแกนกลาง)" }
      - id: "S-MD.B"
        text: "ใช้ความน่าจะเป็นประเมินผลของการตัดสินใจ"
        indicators:
          - { id: "S-MD.5", level: "HS", text: "ชั่งน้ำหนักผลที่อาจเกิดจากการตัดสินใจ โดยกำหนดความน่าจะเป็นให้ผลตอบแทนแต่ละแบบแล้วเปรียบเทียบค่าคาดหมายของทางเลือก (เกินแกนกลาง)" }
          - { id: "S-MD.6", level: "HS", text: "ใช้ความน่าจะเป็นช่วยให้การตัดสินใจเป็นธรรม (เกินแกนกลาง)" }
          - { id: "S-MD.7", level: "HS", text: "วิเคราะห์การตัดสินใจและกลยุทธ์ในสถานการณ์จริงด้วยแนวคิดความน่าจะเป็น (เกินแกนกลาง)" }
