id: physics.momentum.collisions
subject: physics
title: { th: การชนและการอนุรักษ์โมเมนตัม, en: Collisions and conservation of momentum }
summary: ใช้กฎการอนุรักษ์โมเมนตัมกับการชนใน 1 มิติ แยกการชนแบบยืดหยุ่นและไม่ยืดหยุ่นด้วยพลังงานจลน์ และคำนวณการระเบิดแยกตัว
difficulty: 6
minutes: 40
prerequisites: [physics.momentum.momentum-impulse, physics.energy.conservation]
encompasses:
  - { id: physics.momentum.momentum-impulse, weight: 0.5 }
  - { id: physics.energy.conservation, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: third-law-collision.svg
    alt: "รถบรรทุกมวล 6000 กิโลกรัมชนกับรถจักรยานยนต์มวล 150 กิโลกรัม ที่จุดสัมผัสมีลูกศรแรงสองอันยาวเท่ากัน ลูกศรสีแดงชี้ไปทางขวาคือแรงที่กระทำบนรถจักรยานยนต์ ลูกศรสีน้ำเงินชี้ไปทางซ้ายคือแรงที่กระทำบนรถบรรทุก ข้อความด้านล่างบอกว่าแรงเท่ากัน แต่ความเร่งของรถจักรยานยนต์มากกว่า 40 เท่า"
    caption: "แรงคู่กิริยา–ปฏิกิริยาระหว่างการชนเท่ากันเสมอ ผลต่างกันเพราะมวลต่างกัน"
  - type: worked-example
    title: ตรวจว่าการชนเป็นแบบยืดหยุ่นหรือไม่
    problem: "รถทดลอง A มวล $2\\ \\mathrm{kg}$ วิ่งด้วยความเร็ว $3\\ \\mathrm{m/s}$ ชนรถ B มวล $1\\ \\mathrm{kg}$ ที่จอดนิ่ง หลังชน A วิ่งต่อไปทางเดิมด้วยความเร็ว $1\\ \\mathrm{m/s}$ และ B วิ่งด้วยความเร็ว $4\\ \\mathrm{m/s}$ ข้อมูลนี้เป็นไปได้หรือไม่ และการชนเป็นแบบใด"
    figure:
      src: before-after.svg
      alt: "ภาพก่อนชนและหลังชน ก่อนชน รถ A มวล 2 kg มีลูกศรความเร็ว 3 m/s ไปทางขวา รถ B มวล 1 kg นิ่ง หลังชน รถ A มีลูกศรสั้น 1 m/s ไปทางขวา รถ B มีลูกศรยาว 4 m/s ไปทางขวา ความยาวลูกศรเป็นสัดส่วนกับความเร็ว"
    steps:
      - text: "ตั้งทิศที่รถวิ่งเป็นบวก โมเมนตัมก่อนชน: $(2)(3) + (1)(0) = 6\\ \\mathrm{kg\\,m/s}$"
      - text: "โมเมนตัมหลังชน: $(2)(1) + (1)(4) = 2 + 4 = 6\\ \\mathrm{kg\\,m/s}$ เท่ากับก่อนชน ข้อมูลจึงเป็นไปได้"
        why: "ข้อมูลการชนใดที่โมเมนตัมรวมก่อนและหลังไม่เท่ากัน (โดยไม่มีแรงภายนอก) เป็นไปไม่ได้"
      - text: "พลังงานจลน์ก่อนชน: $\\tfrac12(2)(3)^2 = 9\\ \\mathrm{J}$ หลังชน: $\\tfrac12(2)(1)^2 + \\tfrac12(1)(4)^2 = 1 + 8 = 9\\ \\mathrm{J}$"
        why: "โมเมนตัมบอกไม่ได้ว่าการชนเป็นแบบใด ต้องเทียบพลังงานจลน์"
      - text: "พลังงานจลน์เท่าเดิม การชนจึงเป็นแบบยืดหยุ่นสมบูรณ์"
    answer: "เป็นไปได้ โมเมนตัมรวมคงตัว $6\\ \\mathrm{kg\\,m/s}$ และพลังงานจลน์คงตัว $9\\ \\mathrm{J}$ จึงเป็นการชนแบบยืดหยุ่นสมบูรณ์"
  - { type: check, problem: phy.coll.p013, prompt: "ใครออกแรงมากกว่ากัน" }
  - type: worked-example
    title: หามวลของรถจากกราฟการชนบนรางลม
    problem: "กราฟความเร็ว–เวลาของรถ A มวล $0.5\\ \\mathrm{kg}$ และรถ B บนรางลมเป็นดังรูป รถ B มีมวลเท่าใด และพลังงานจลน์หายไปเท่าใด"
    figure:
      src: vt-airtrack.svg
      alt: "กราฟความเร็ว–เวลา รถ A มีความเร็ว 0.8 m/s คงที่จนถึง t = 1.0 s แล้วลดลงเหลือ 0.2 m/s ที่ t = 1.1 s และคงที่ต่อไป รถ B นิ่งจนถึง t = 1.0 s แล้วเพิ่มเป็น 0.4 m/s ที่ t = 1.1 s และคงที่ต่อไป"
    steps:
      - text: "อ่านกราฟ: ก่อนชน $u_A = 0.8\\ \\mathrm{m/s}$, $u_B = 0$ หลังชน $v_A = 0.2\\ \\mathrm{m/s}$, $v_B = 0.4\\ \\mathrm{m/s}$"
        why: "ช่วงที่เส้นเปลี่ยนระดับ ($1.0$–$1.1\\ \\mathrm{s}$) คือช่วงที่กำลังชน ให้อ่านค่าที่เส้นราบก่อนและหลังช่วงนั้น"
      - text: "อนุรักษ์โมเมนตัม: $(0.5)(0.8) = (0.5)(0.2) + m_B(0.4)$"
      - text: "$0.4 = 0.1 + 0.4m_B$ ได้ $m_B = \\dfrac{0.3}{0.4} = 0.75\\ \\mathrm{kg}$"
      - text: "พลังงานจลน์ก่อนชน $\\tfrac12(0.5)(0.8)^2 = 0.16\\ \\mathrm{J}$ หลังชน $\\tfrac12(0.5)(0.2)^2 + \\tfrac12(0.75)(0.4)^2 = 0.01 + 0.06 = 0.07\\ \\mathrm{J}$"
    answer: "$m_B = 0.75\\ \\mathrm{kg}$ พลังงานจลน์หายไป $0.16 - 0.07 = 0.09\\ \\mathrm{J}$ จึงเป็นการชนแบบไม่ยืดหยุ่น (แต่ไม่ติดกัน)"
  - { type: check, problem: phy.coll.p017, prompt: "อ่านกราฟการชนอีกครั้ง" }
  - type: interactive
    title: ความเร็วหลังชนแบบยืดหยุ่นสมบูรณ์ เมื่อเปลี่ยนมวลของวัตถุที่ถูกชน
    caption: วัตถุมวล a (kg) วิ่งด้วยความเร็ว u (m/s) ชนวัตถุที่อยู่นิ่ง แกนนอนคือมวลของวัตถุที่ถูกชน (kg) แกนตั้งคือความเร็วหลังชน (m/s) เส้นที่เริ่มจาก u คือวัตถุที่วิ่งมาชน อีกเส้นคือวัตถุที่ถูกชน สังเกตว่าเมื่อมวลเท่ากัน ลูกที่วิ่งมาหยุดนิ่งพอดี และเมื่อชนวัตถุที่หนักกว่า ลูกที่วิ่งมาจะกระดอนกลับ (ความเร็วติดลบ)
    widget:
      kind: function-plot
      functions: ["\\frac{a - x}{a + x} u", "\\frac{2a}{a + x} u"]
      sliders:
        - { name: a, min: 0.5, max: 5, step: 0.5, value: 2, label: มวลของวัตถุที่วิ่งมาชน (kg) }
        - { name: u, min: 1, max: 5, step: 1, value: 3, label: ความเร็วก่อนชน (m/s) }
      x: [0, 10]
      y: [-6, 11]
  - type: simulation
    title: ห้องทดลองการชน (PhET Collision Lab)
    url: https://phet.colorado.edu/en/simulations/collision-lab
    provider: phet
    note: เลือกแบบ 1 มิติ (Intro) ตั้งค่าความยืดหยุ่น (elasticity) เป็น 100% แล้วลดลงเป็น 0% เปิดแสดงโมเมนตัมรวมและพลังงานจลน์ จะเห็นว่าโมเมนตัมรวมเท่าเดิมทุกครั้ง แต่พลังงานจลน์ลดลงเมื่อการชนไม่ยืดหยุ่น
glossary:
  - { term: กฎการอนุรักษ์โมเมนตัม, definition: "ถ้าระบบไม่มีแรงลัพธ์ภายนอก โมเมนตัมรวมของระบบก่อนและหลังชนเท่ากัน $m_1u_1 + m_2u_2 = m_1v_1 + m_2v_2$" }
  - { term: การชนแบบยืดหยุ่นสมบูรณ์, definition: "การชนที่ทั้งโมเมนตัมรวมและพลังงานจลน์รวมคงตัว" }
  - { term: การชนแบบไม่ยืดหยุ่นสมบูรณ์, definition: "การชนที่วัตถุติดกันไปหลังชน โมเมนตัมรวมคงตัวแต่พลังงานจลน์ลดลงมากที่สุด" }
  - { term: การระเบิด, definition: "การที่วัตถุแยกออกจากกันด้วยแรงภายใน โมเมนตัมรวมคงตัว แต่พลังงานจลน์รวมเพิ่มขึ้นจากพลังงานภายใน" }
flashcards:
  - { front: "ปริมาณใดคงตัวในการชนทุกแบบ (ระบบไม่มีแรงลัพธ์ภายนอก)", back: "โมเมนตัมรวม ส่วนพลังงานจลน์รวมคงตัวเฉพาะการชนแบบยืดหยุ่นสมบูรณ์" }
  - { front: "ความเร็วหลังชนเมื่อวัตถุติดกันไป", back: "$v = \\dfrac{m_1u_1 + m_2u_2}{m_1 + m_2}$" }
  - { front: "ลูกบอลชนลูกบอลมวลเท่ากันที่อยู่นิ่งแบบยืดหยุ่นสมบูรณ์ เกิดอะไรขึ้น", back: "ลูกที่วิ่งมาหยุดนิ่ง ลูกที่ถูกชนวิ่งออกไปด้วยความเร็วเท่าความเร็วเดิม" }
  - { front: "วัตถุนิ่งระเบิดแยกเป็นสองส่วน ความเร็วของสองส่วนสัมพันธ์กันอย่างไร", back: "$m_1v_1 = -m_2v_2$ พุ่งออกทิศตรงข้ามกัน ส่วนที่มวลน้อยกว่าเร็วกว่า" }
  - { front: "ทำไมถุงลมนิรภัยและโครงรถส่วนยุบตัวช่วยลดการบาดเจ็บ", back: "การเปลี่ยนโมเมนตัมเท่าเดิม แต่ยืดเวลาชนให้นานขึ้น แรงเฉลี่ย $F = \\dfrac{\\Delta p}{\\Delta t}$ จึงลดลง" }
