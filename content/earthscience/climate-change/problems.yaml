  - id: earthscience.atmosphere.climate-change.p011
    topics: [earthscience.atmosphere.climate-change]
    difficulty: 4
    type: numeric
    stem: "ถ้าคาร์บอนไดออกไซด์เพิ่มเป็นสองเท่า โลกร้อนขึ้น 1.2 °C เมื่อไม่มีการป้อนกลับ ถ้าการป้อนกลับสุทธิ $f = 0.6$ ความไวของภูมิอากาศสมดุลเป็นกี่องศาเซลเซียส ใช้ $\\Delta T = \\dfrac{\\Delta T_0}{1 - f}$"
    answer: { value: 3.0, tolerance: 0.05, unit: "°C" }
    misconceptions:
      - { match: 1.92, feedback: "1.92 มาจาก 1.2 × (1 + 0.6) คิดการป้อนกลับรอบเดียว แต่ความร้อนที่เพิ่มทำให้เกิดการป้อนกลับต่อเนื่องหลายรอบ" }
      - { match: 2.0, feedback: "2.0 มาจาก 1.2 ÷ 0.6 ต้องหารด้วย 1 − f ซึ่งเท่ากับ 0.4" }
    hints:
      - "หา 1 − f ก่อน"
      - "นำ 1.2 หารด้วยค่านั้น"
    solution: "$\\Delta T = 1.2 / (1 - 0.6) = 1.2 / 0.4 = 3.0\\ \\mathrm{^\\circ C}$ ตรงกับค่าดีที่สุดของ IPCC AR6"
