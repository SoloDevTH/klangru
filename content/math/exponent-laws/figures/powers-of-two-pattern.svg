  <text x="100" y="266" text-anchor="middle" fill="#2b5f9e" font-size="18" font-weight="bold">2<tspan dy="-9" font-size="13">−1</tspan></text>
  <text x="230" y="266" text-anchor="middle" fill="#15211e" font-size="18" font-weight="bold">1/2</text>
