<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="sans-serif">
<title>โครงสร้างการนำเสนอสามส่วนพร้อมคำบอกทิศทาง</title>
<rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
<text x="380" y="36" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">โครงสร้างการนำเสนอและคำบอกทิศทาง</text>
<rect x="20" y="64" width="210" height="320" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<rect x="20" y="64" width="210" height="40" rx="6" fill="#1d3f75" stroke="#1d3f75" stroke-width="1.5"/>
<text x="125.0" y="90" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">ส่วนเปิด</text>
<text x="36" y="134" font-size="14" fill="#111" text-anchor="start" font-weight="normal">Good morning, everyone.</text>
<text x="36" y="159" font-size="14" fill="#111" text-anchor="start" font-weight="normal">Today I'm going to talk</text>
<text x="36" y="184" font-size="14" fill="#111" text-anchor="start" font-weight="normal">about plastic waste.</text>
<text x="36" y="234" font-size="14" fill="#111" text-anchor="start" font-weight="normal">My presentation is</text>
<text x="36" y="259" font-size="14" fill="#111" text-anchor="start" font-weight="normal">divided into three parts.</text>
<rect x="270" y="64" width="210" height="320" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<rect x="270" y="64" width="210" height="40" rx="6" fill="#2e6b4f" stroke="#2e6b4f" stroke-width="1.5"/>
<text x="375.0" y="90" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">ส่วนเนื้อหา</text>
<text x="286" y="134" font-size="14" fill="#111" text-anchor="start" font-weight="normal">First of all, ...</text>
<text x="286" y="184" font-size="14" fill="#111" text-anchor="start" font-weight="normal">Moving on to my second</text>
<text x="286" y="209" font-size="14" fill="#111" text-anchor="start" font-weight="normal">point, ...</text>
<text x="286" y="259" font-size="14" fill="#111" text-anchor="start" font-weight="normal">Let me give you an example.</text>
<text x="286" y="309" font-size="14" fill="#111" text-anchor="start" font-weight="normal">What's really important</text>
<text x="286" y="334" font-size="14" fill="#111" text-anchor="start" font-weight="normal">is ...</text>
<rect x="520" y="64" width="210" height="320" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<rect x="520" y="64" width="210" height="40" rx="6" fill="#9a4d00" stroke="#9a4d00" stroke-width="1.5"/>
<text x="625.0" y="90" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">ส่วนสรุปปิด</text>
<text x="536" y="134" font-size="14" fill="#111" text-anchor="start" font-weight="normal">To sum up, ...</text>
<text x="536" y="184" font-size="14" fill="#111" text-anchor="start" font-weight="normal">Thank you for listening.</text>
<text x="536" y="234" font-size="14" fill="#111" text-anchor="start" font-weight="normal">Any questions?</text>
<line x1="232" y1="224" x2="268" y2="224" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="268,224 258.10,228.78 258.10,219.22" fill="#555"/>
<line x1="482" y1="224" x2="518" y2="224" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="518,224 508.10,228.78 508.10,219.22" fill="#555"/>
<text x="380" y="404" font-size="13" fill="#444" text-anchor="middle" font-weight="normal">ข้อความในกรอบคือคำบอกทิศทางที่ผู้นำเสนอใช้บอกว่าอยู่ส่วนไหน</text>
</svg>
