id: biology.cells.enzymes
subject: biology
title: { th: ปฏิกิริยาเคมีในเซลล์และเอนไซม์, en: Chemical reactions in cells and enzymes }
summary: ปฏิกิริยาดูดและคายพลังงานในสิ่งมีชีวิต พลังงานก่อกัมมันต์ การทำงานของเอนไซม์ที่บริเวณเร่ง และผลของอุณหภูมิ pH ความเข้มข้น และตัวยับยั้ง
difficulty: 5
minutes: 40
prerequisites: [biology.molecules.water-biomolecules]
encompasses:
  - { id: biology.molecules.water-biomolecules, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: เอนไซม์ลดพลังงานก่อกัมมันต์
    src: activation-energy.svg
    alt: "แผนภาพพลังงานของปฏิกิริยาคายพลังงาน แกนนอนคือการดำเนินไปของปฏิกิริยา แกนตั้งคือพลังงาน สารตั้งต้นอยู่ระดับสูงทางซ้าย ผลิตภัณฑ์อยู่ระดับต่ำกว่าทางขวา เส้นสีแดง (ไม่มีเอนไซม์) มีเนินสูง เส้นสีน้ำเงิน (มีเอนไซม์) มีเนินต่ำกว่า ลูกศร Ea₁ สีแดงวัดจากระดับสารตั้งต้นถึงยอดเนินสีแดง ลูกศร Ea₂ สีน้ำเงินวัดจากระดับสารตั้งต้นถึงยอดเนินสีน้ำเงินซึ่งสั้นกว่า ลูกศรสีดำวัดจากระดับสารตั้งต้นลงไปถึงผลิตภัณฑ์คือพลังงานที่ปล่อยออก ซึ่งเท่ากันทั้งสองเส้น"
    caption: "Ea₁ คือพลังงานก่อกัมมันต์เมื่อไม่มีเอนไซม์ Ea₂ คือเมื่อมีเอนไซม์ ระดับพลังงานของสารตั้งต้นและผลิตภัณฑ์ไม่เปลี่ยน (วาดโดยทีมคลังรู้)"
  - type: figure
    title: เอนไซม์จับซับสเตรตที่บริเวณเร่ง
    src: enzyme-action.svg
    alt: "ภาพสามขั้นเรียงจากซ้ายไปขวา ขั้นแรก เอนไซม์มีร่องที่ด้านบนชื่อบริเวณเร่ง และมีซับสเตรตรูปสี่เหลี่ยมลอยอยู่ด้านบน ขั้นที่สอง ซับสเตรตเข้าไปอยู่ในบริเวณเร่งพอดี เรียกว่าเอนไซม์–ซับสเตรตคอมเพล็กซ์ ขั้นที่สาม ซับสเตรตแยกเป็นผลิตภัณฑ์สองชิ้นลอยออกไป และเอนไซม์ตัวเดิมมีร่องว่างพร้อมใช้อีก"
    caption: "เอนไซม์จำเพาะกับซับสเตรตที่มีรูปร่างเข้ากับบริเวณเร่ง และไม่ถูกใช้หมดไป (วาดโดยทีมคลังรู้)"
  - { type: check, problem: biology.cells.enzymes.p005, prompt: "ใช้แผนภาพพลังงานด้านบนตอบ" }
  - type: worked-example
    title: อ่านพลังงานก่อกัมมันต์จากแผนภาพ
    problem: "จากแผนภาพพลังงานในโจทย์ (สารตั้งต้น 40 kJ ผลิตภัณฑ์ 100 kJ ยอดเนินเมื่อไม่มีเอนไซม์ 160 kJ เมื่อมีเอนไซม์ 110 kJ) จงหาพลังงานก่อกัมมันต์ทั้งสองกรณี พลังงานก่อกัมมันต์ที่ลดลง และบอกว่าปฏิกิริยาดูดหรือคายพลังงาน"
    figure: { src: energy-data.svg, alt: "แผนภาพพลังงาน แกนตั้งเป็นกิโลจูล 0 ถึง 180 สารตั้งต้นอยู่ที่ 40 ผลิตภัณฑ์อยู่ที่ 100 เส้นสีแดงไม่มีเอนไซม์มียอดที่ 160 เส้นสีน้ำเงินมีเอนไซม์มียอดที่ 110" }
    steps:
      - text: "พลังงานก่อกัมมันต์วัดจากระดับสารตั้งต้นถึงยอดเนิน ไม่ใช่จากศูนย์"
        why: "พลังงานก่อกัมมันต์คือพลังงานที่ต้องเพิ่มให้สารตั้งต้น จึงต้องเริ่มวัดจากระดับของสารตั้งต้น"
      - text: "ไม่มีเอนไซม์: $E_a = 160 - 40 = 120\\ \\mathrm{kJ}$"
      - text: "มีเอนไซม์: $E_a = 110 - 40 = 70\\ \\mathrm{kJ}$ ลดลง $120 - 70 = 50\\ \\mathrm{kJ}$"
      - text: "ผลิตภัณฑ์ (100 kJ) สูงกว่าสารตั้งต้น (40 kJ) อยู่ $100 - 40 = 60\\ \\mathrm{kJ}$ จึงเป็นปฏิกิริยาดูดพลังงาน ค่า 60 kJ นี้เท่ากันทั้งมีและไม่มีเอนไซม์"
    answer: "$E_a$ 120 kJ และ 70 kJ ลดลง 50 kJ เป็นปฏิกิริยาดูดพลังงาน 60 kJ"
  - type: figure
    title: ปัจจัยที่มีผลต่อการทำงานของเอนไซม์
    src: enzyme-factors.svg
    alt: "กราฟสามรูป รูปแรก อัตราการเกิดปฏิกิริยาเทียบกับอุณหภูมิ 0 ถึง 70 องศาเซลเซียส อัตราค่อย ๆ เพิ่มขึ้นจนสูงสุดที่ราว 37 องศา (อุณหภูมิที่เหมาะสม) แล้วลดลงอย่างรวดเร็วจนเกือบศูนย์ที่ราว 55 องศา รูปที่สอง อัตราเทียบกับ pH 0 ถึง 14 เพปซินมียอดที่ pH 2 ทริปซินมียอดที่ pH 8 รูปที่สาม อัตราเทียบกับความเข้มข้นของซับสเตรต อัตราเพิ่มเร็วในช่วงแรกแล้วค่อย ๆ คงที่ เส้นของเอนไซม์ 2 เท่าคงที่ที่ระดับสูงกว่าเส้นเอนไซม์ 1 เท่าเป็นสองเท่า"
    caption: "เกินอุณหภูมิที่เหมาะสม เอนไซม์เสียสภาพ เอนไซม์แต่ละชนิดมี pH ที่เหมาะสมต่างกัน และเมื่อบริเวณเร่งถูกจับเต็ม อัตราจะคงที่ (วาดโดยทีมคลังรู้ รูปร่างกราฟเป็นแบบจำลอง)"
  - { type: check, problem: biology.cells.enzymes.p010, prompt: "ดูกราฟอุณหภูมิ" }
glossary:
  - { term: เอนไซม์, definition: "ตัวเร่งปฏิกิริยาที่สิ่งมีชีวิตสร้าง ส่วนใหญ่เป็นโปรตีน ลดพลังงานก่อกัมมันต์และไม่ถูกใช้หมดไป" }
  - { term: พลังงานก่อกัมมันต์, definition: "พลังงานขั้นต่ำที่สารตั้งต้นต้องได้รับก่อนเกิดปฏิกิริยา วัดจากระดับสารตั้งต้นถึงยอดเนินในแผนภาพพลังงาน" }
  - { term: ซับสเตรต, definition: "สารที่เอนไซม์จับและเปลี่ยนเป็นผลิตภัณฑ์" }
  - { term: บริเวณเร่ง, definition: "ร่องบนเอนไซม์ที่ซับสเตรตเข้าจับและเกิดปฏิกิริยา (active site)" }
  - { term: ปฏิกิริยาคายพลังงานและดูดพลังงาน, definition: "ปฏิกิริยาคายพลังงานมีผลิตภัณฑ์พลังงานต่ำกว่าสารตั้งต้น ปฏิกิริยาดูดพลังงานมีผลิตภัณฑ์พลังงานสูงกว่า" }
  - { term: ตัวยับยั้ง, definition: "สารที่ลดการทำงานของเอนไซม์ แบบแข่งขันแย่งจับบริเวณเร่ง แบบไม่แข่งขันจับที่ตำแหน่งอื่นแล้วทำให้บริเวณเร่งเปลี่ยนรูป" }
flashcards:
  - { front: "เอนไซม์เร่งปฏิกิริยาได้อย่างไร", back: "ลดพลังงานก่อกัมมันต์ โดยไม่เปลี่ยนพลังงานของสารตั้งต้นและผลิตภัณฑ์ และไม่ถูกใช้หมดไป" }
  - { front: "ปัจจัยที่มีผลต่อการทำงานของเอนไซม์", back: "อุณหภูมิ pH ความเข้มข้นของซับสเตรต ความเข้มข้นของเอนไซม์ และตัวยับยั้ง" }
  - { front: "ทำไมเกินอุณหภูมิที่เหมาะสม เอนไซม์ทำงานช้าลง", back: "เอนไซม์ซึ่งเป็นโปรตีนเสียสภาพ บริเวณเร่งเสียรูปร่าง ซับสเตรตจับไม่ได้" }
  - { front: "pH ที่เหมาะสมของเพปซินและทริปซิน", back: "เพปซินราว 2 (กระเพาะอาหาร) ทริปซินราว 8 (ลำไส้เล็ก)" }
  - { front: "ทำไมสับปะรดสดทำให้วุ้นเจลาตินไม่แข็งตัว", back: "โบรมีเลนในสับปะรดสดย่อยโปรตีนเจลาติน สับปะรดกระป๋องผ่านความร้อน เอนไซม์เสียสภาพแล้ว" }
