problems:
- id: business.law.intellectual-property.p001
  topics:
  - business.law.intellectual-property
  difficulty: 1
  type: match
  stem: จับคู่สิ่งที่ต้องการคุ้มครองกับประเภทของทรัพย์สินทางปัญญา
  pairs:
  - left: เพลงที่นักเรียนแต่งและบันทึกเสียงเอง
    right: ลิขสิทธิ์
  - left: เครื่องสีข้าวแบบใหม่ที่ประหยัดไฟกว่าเดิมมาก
    right: สิทธิบัตรการประดิษฐ์
  - left: ชื่อและโลโก้ของร้านกาแฟ
    right: เครื่องหมายการค้า
  - left: ชื่อ "กาแฟดอยตุง" ที่บอกแหล่งผลิตและคุณภาพเฉพาะถิ่น
    right: สิ่งบ่งชี้ทางภูมิศาสตร์
  hints:
  - ลิขสิทธิ์คุ้มครองงานสร้างสรรค์ สิทธิบัตรคุ้มครองการประดิษฐ์
  - ชื่อที่ผูกกับแหล่งผลิตคือสิ่งบ่งชี้ทางภูมิศาสตร์
  solution: เพลง → ลิขสิทธิ์ · เครื่องสีข้าวแบบใหม่ → สิทธิบัตรการประดิษฐ์ · ชื่อและโลโก้ร้าน → เครื่องหมายการค้า · กาแฟดอยตุง → สิ่งบ่งชี้ทางภูมิศาสตร์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.intellectual-property.p002
  topics:
  - business.law.intellectual-property
  difficulty: 1
  type: mcq
  stem: นักเรียนวาดการ์ตูนลงสมุดของตัวเอง งานนี้ได้รับความคุ้มครองลิขสิทธิ์เมื่อใด
  choices:
  - id: a
    text: ทันทีที่วาดเสร็จ ไม่ต้องจดทะเบียน
    correct: true
  - id: b
    text: เมื่อนำไปจดทะเบียนที่กรมทรัพย์สินทางปัญญาแล้วเท่านั้น
    feedback: ลิขสิทธิ์เกิดขึ้นเองเมื่อสร้างสรรค์งาน การจดแจ้งข้อมูลเป็นเพียงหลักฐาน ไม่ใช่เงื่อนไข
  - id: c
    text: เมื่อมีคนนำไปขายได้เงิน
    feedback: งานไม่จำเป็นต้องเผยแพร่หรือขายก็ได้รับความคุ้มครอง
  - id: d
    text: เมื่ออายุครบ 20 ปี
    feedback: อายุของผู้สร้างสรรค์ไม่เกี่ยวกับการได้ลิขสิทธิ์
  hints:
  - ลิขสิทธิ์ต่างจากสิทธิบัตรเรื่องการจดทะเบียน
  - งานต้องเป็นของที่สร้างสรรค์เอง ไม่ลอกใคร
  solution: ลิขสิทธิ์เกิดขึ้น **ทันทีที่สร้างสรรค์งาน** ไม่ต้องจดทะเบียน ส่วนสิทธิบัตร อนุสิทธิบัตร และเครื่องหมายการค้าต้องยื่นคำขอจึงได้รับความคุ้มครอง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.intellectual-property.p003
  topics:
  - business.law.intellectual-property
  difficulty: 2
  type: mcq
  stem: ข้อใด **ไม่** ได้รับความคุ้มครองลิขสิทธิ์
  choices:
  - id: a
    text: ความคิดว่าจะเปิดร้านขายข้าวเหนียวมะม่วงแบบเดลิเวอรี
    correct: true
  - id: b
    text: นิยายที่เขียนลงเว็บไซต์
    feedback: เป็นงานวรรณกรรม ได้รับความคุ้มครอง
  - id: c
    text: โปรแกรมคอมพิวเตอร์ที่เขียนขึ้นเอง
    feedback: โปรแกรมคอมพิวเตอร์ได้รับความคุ้มครองในฐานะงานวรรณกรรม
  - id: d
    text: ภาพถ่ายทิวทัศน์ที่ถ่ายเอง
    feedback: ภาพถ่ายเป็นงานศิลปกรรม
  hints:
  - ลิขสิทธิ์คุ้มครองการแสดงออก ไม่ใช่ความคิด
  - ความคิดที่ยังไม่ถูกแสดงออกเป็นงาน ใครก็ทำได้
  solution: ลิขสิทธิ์คุ้มครอง **การแสดงออกของความคิด** เช่น ตัวหนังสือ ภาพ เพลง โปรแกรม แต่ไม่คุ้มครองความคิด ขั้นตอน หรือหลักการ คนอื่นจึงเปิดร้านแบบเดียวกันได้ ถ้าไม่ลอกชื่อ โลโก้ หรือภาพของเรา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.intellectual-property.p004
  topics:
  - business.law.intellectual-property
  difficulty: 2
  type: numeric
  stem: บริษัทหนึ่งยื่นขอสิทธิบัตรการประดิษฐ์เครื่องอบแห้งผลไม้เมื่อปี พ.ศ. $2562$ และได้รับสิทธิบัตร ความคุ้มครองจะสิ้นสุดในปี พ.ศ. ใด (ตอบเป็นปี พ.ศ.)
  answer:
    value: 2582
    unit: พ.ศ.
  misconceptions:
  - match: 2572
    feedback: 10 ปีคืออายุของสิทธิบัตรการออกแบบผลิตภัณฑ์
  - match: 2612
    feedback: 50 ปีเป็นอายุลิขสิทธิ์บางประเภท
  hints:
  - สิทธิบัตรการประดิษฐ์มีอายุ 20 ปี
  - นับจากวันยื่นคำขอ ไม่ใช่วันที่ได้รับสิทธิบัตร
  solution: 'อายุ 20 ปีนับแต่วันยื่นคำขอ: $2562 + 20 = 2582$ หลังจากนั้นใครก็ผลิตเครื่องแบบนี้ได้'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.intellectual-property.p005
  topics:
  - business.law.intellectual-property
  difficulty: 2
  type: numeric
  stem: อนุสิทธิบัตรได้รับความคุ้มครอง $6$ ปีนับแต่วันยื่นคำขอ และต่ออายุได้ $2$ ครั้ง ครั้งละ $2$ ปี อนุสิทธิบัตรคุ้มครองได้นานที่สุดกี่ปี (ตอบเป็นปี)
  answer:
    value: 10
    unit: ปี
  misconceptions:
  - match: 8
    feedback: ต่ออายุได้ 2 ครั้ง ไม่ใช่ครั้งเดียว
  - match: 24
    feedback: คูณกันแทนการบวก
  hints:
  - เริ่มจาก 6 ปี
  - บวกการต่ออายุทั้งสองครั้ง
  solution: รวม $= 6 + 2 + 2 = 10$ ปี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.intellectual-property.p006
  topics:
  - business.law.intellectual-property
  difficulty: 2
  type: mcq
  stem: การซื้อกระเป๋าแบรนด์ปลอมราคาถูกจากร้านออนไลน์ ส่งผลเสียต่อใครบ้าง (เลือกได้มากกว่าหนึ่งข้อ)
  multiple: true
  choices:
  - id: a
    text: เจ้าของเครื่องหมายการค้าที่เสียยอดขายและชื่อเสียง
    correct: true
  - id: b
    text: ผู้บริโภคที่อาจได้สินค้าคุณภาพต่ำและไม่มีการรับประกัน
    correct: true
  - id: c
    text: รัฐที่เก็บภาษีจากการค้าที่ผิดกฎหมายไม่ได้
    correct: true
  - id: d
    text: ไม่มีใครเสียหาย เพราะผู้ซื้อยอมรับเองว่าเป็นของปลอม
    feedback: แม้ผู้ซื้อรู้ เจ้าของแบรนด์และผู้ผลิตที่สุจริตยังเสียประโยชน์ และผู้ขายกระทำผิดกฎหมาย
  hints:
  - คิดถึงทั้งเจ้าของแบรนด์ ผู้ซื้อ และส่วนรวม
  - สินค้าปลอมผ่านการตรวจคุณภาพหรือเสียภาษีหรือไม่
  solution: ของปลอมทำให้เจ้าของเครื่องหมายการค้าเสียรายได้และชื่อเสียง ผู้บริโภคเสี่ยงได้ของไม่มีคุณภาพ และรัฐสูญเสียภาษี การขายของปลอมเป็นความผิดตามกฎหมายเครื่องหมายการค้า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.intellectual-property.p007
  topics:
  - business.law.intellectual-property
  difficulty: 3
  type: numeric
  stem: ร้านขนมจดทะเบียนเครื่องหมายการค้า โดยยื่นคำขอเมื่อปี พ.ศ. $2555$ และต่ออายุตรงเวลา $2$ ครั้ง เครื่องหมายจะได้รับความคุ้มครองถึงปี พ.ศ. ใด (ตอบเป็นปี พ.ศ.)
  answer:
    value: 2585
    unit: พ.ศ.
  misconceptions:
  - match: 2575
    feedback: ลืมนับช่วงแรกก่อนต่ออายุ
  - match: 2565
    feedback: นับแค่ช่วงแรก ไม่รวมการต่ออายุ
  hints:
  - เครื่องหมายการค้าคุ้มครองคราวละ 10 ปีนับแต่วันยื่นคำขอ
  - ช่วงแรก 10 ปี บวกการต่ออายุอีกสองครั้ง ครั้งละ 10 ปี
  solution: $10 + 10 + 10 = 30$ ปี จึงคุ้มครองถึงปี $2555 + 30 = 2585$ และยังต่ออายุต่อได้อีก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.intellectual-property.p008
  topics:
  - business.law.intellectual-property
  difficulty: 3
  type: match
  stem: จากภาพซองข้าว จับคู่หมายเลขกับกฎหมายทรัพย์สินทางปัญญาที่คุ้มครอง
  figure:
    src: p-package.svg
    alt: ภาพซองข้าวหอมมะลิของวิสาหกิจชุมชน (สมมติ) มีหมายเลขกำกับสี่จุด หมายเลข 1 ชี้ที่ชื่อและโลโก้ 'ทุ่งทองรวงข้าว' มีสัญลักษณ์ R ในวงกลม หมายเลข 2 ชี้ที่ตรารูปรวงข้าวในวงกลมใต้คำว่า ข้าวหอมมะลิทุ่งกุลาร้องไห้ ซึ่งเป็นชื่อแหล่งผลิตที่ขึ้นทะเบียนไว้ หมายเลข 3 ชี้ที่กลอนและภาพวาดทุ่งนาที่ครูเอวาดและแต่ง (สมมติ) หมายเลข 4 ชี้ที่ซองซิปแบบใหม่ที่ผู้ผลิตคิดขึ้นเอง ซึ่งเป็นการปรับปรุงเล็กน้อยที่ใหม่และผลิตในโรงงานได้
  pairs:
  - left: หมายเลข 1
    right: เครื่องหมายการค้า
  - left: หมายเลข 2
    right: สิ่งบ่งชี้ทางภูมิศาสตร์
  - left: หมายเลข 3
    right: ลิขสิทธิ์
  - left: หมายเลข 4
    right: อนุสิทธิบัตร
  hints:
  - ชื่อและโลโก้ร้านคุ้มครองด้วยกฎหมายใด
  - กลอนและภาพวาดเป็นงานสร้างสรรค์ ส่วนซองแบบใหม่เป็นการประดิษฐ์อย่างง่าย
  solution: 1 ชื่อและโลโก้ที่จดทะเบียน (®) → เครื่องหมายการค้า · 2 ตราของชื่อแหล่งผลิตข้าวหอมมะลิทุ่งกุลาร้องไห้ → สิ่งบ่งชี้ทางภูมิศาสตร์ · 3 กลอนและภาพวาด → ลิขสิทธิ์ · 4 ซองซิปแบบใหม่ (การประดิษฐ์อย่างง่าย) → อนุสิทธิบัตร สินค้าชิ้นเดียวจึงมีทรัพย์สินทางปัญญาหลายประเภท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.intellectual-property.p009
  topics:
  - business.law.intellectual-property
  difficulty: 3
  type: mcq
  stem: การกระทำใดน่าจะเป็น **การใช้งานอันมีลิขสิทธิ์โดยชอบธรรม** (ไม่ละเมิดลิขสิทธิ์)
  choices:
  - id: a
    text: ครูคัดลอกบทกลอนสั้น ๆ จากหนังสือมาให้นักเรียนวิเคราะห์ในชั้นเรียน พร้อมบอกชื่อผู้แต่ง
    correct: true
  - id: b
    text: ถ่ายเอกสารหนังสือทั้งเล่มแล้วขายให้เพื่อนทั้งห้อง
    feedback: การทำซ้ำทั้งเล่มเพื่อขายกระทบรายได้ปกติของเจ้าของลิขสิทธิ์
  - id: c
    text: อัปโหลดภาพยนตร์ทั้งเรื่องลงช่องของตัวเองแล้วรับเงินโฆษณา
    feedback: เป็นการเผยแพร่ต่อสาธารณชนเพื่อหากำไรโดยไม่ได้รับอนุญาต
  - id: d
    text: เปิดเพลงทั้งอัลบั้มในไลฟ์ขายของทุกวันโดยไม่ขออนุญาต
    feedback: ใช้เพลงเพื่อการค้าโดยไม่ได้รับอนุญาต
  hints:
  - ข้อยกเว้นมักใช้กับการศึกษา วิจัย ติชม วิจารณ์ โดยอ้างถึงเจ้าของ
  - ดูว่าทำเพื่อหากำไรและใช้มากจนแทนที่การซื้อของแท้หรือไม่
  solution: กฎหมายลิขสิทธิ์ยกเว้นการใช้บางกรณีที่ไม่ขัดต่อการแสวงประโยชน์ตามปกติของเจ้าของและไม่กระทบสิทธิเกินสมควร เช่น ใช้ส่วนหนึ่งเพื่อการเรียนการสอนพร้อมรับรู้ความเป็นเจ้าของ ส่วนข้ออื่นเป็นการใช้ทั้งหมดหรือใช้เพื่อการค้า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.intellectual-property.p010
  topics:
  - business.law.intellectual-property
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นตัวอย่างของ **สิ่งบ่งชี้ทางภูมิศาสตร์ (GI)** ของไทย
  choices:
  - id: a
    text: ส้มโอนครชัยศรี
    correct: true
  - id: b
    text: ชื่อร้านกาแฟที่ตั้งตามชื่อเจ้าของ
    feedback: ชื่อร้านคุ้มครองด้วยเครื่องหมายการค้า ไม่ได้บอกแหล่งผลิตที่ให้คุณภาพเฉพาะ
  - id: c
    text: สูตรน้ำจิ้มลับเฉพาะของร้าน
    feedback: เป็นความลับทางการค้า
  - id: d
    text: เพลงประจำจังหวัด
    feedback: เพลงคุ้มครองด้วยลิขสิทธิ์
  hints:
  - GI คือชื่อแหล่งผลิตที่ทำให้สินค้ามีคุณภาพเฉพาะ
  - ชื่อมักเป็น ชื่อสินค้า + ชื่อถิ่น
  solution: '**ส้มโอนครชัยศรี** เป็นสิ่งบ่งชี้ทางภูมิศาสตร์ ชื่อนี้ใช้ได้กับส้มโอที่ปลูกในพื้นที่และมีคุณลักษณะตามที่ขึ้นทะเบียนเท่านั้น ช่วยให้เกษตรกรในพื้นที่ขายได้ราคาดีและผู้บริโภคมั่นใจแหล่งที่มา'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.intellectual-property.p011
  topics:
  - business.law.intellectual-property
  difficulty: 3
  type: numeric
  stem: นักแต่งเพลงคนหนึ่งเสียชีวิตเมื่อปี พ.ศ. $2535$ เพลงที่เขาแต่งไว้ได้รับความคุ้มครองลิขสิทธิ์ถึงปี พ.ศ. ใด (ตอบเป็นปี พ.ศ.)
  answer:
    value: 2585
    unit: พ.ศ.
