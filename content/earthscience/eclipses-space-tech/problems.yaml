  - id: earthscience.astronomy.eclipses-space-tech.p012
    topics: [earthscience.astronomy.eclipses-space-tech]
    difficulty: 3
    type: numeric
    stem: "สถานีอวกาศนานาชาติโคจรรอบโลกรอบละประมาณ 90 นาที ใน 1 วัน (24 ชั่วโมง) สถานีอวกาศโคจรรอบโลกได้กี่รอบ"
    answer: { value: 16, unit: รอบ }
    misconceptions:
      - { match: 1.5, feedback: "1.5 คือ 90 นาทีแปลงเป็นชั่วโมง ยังต้องนำ 24 ชั่วโมงหารด้วย 1.5" }
      - { match: 3.75, feedback: "นำ 90 หารด้วย 24 โดยไม่ได้แปลงหน่วยให้ตรงกัน ต้องแปลง 24 ชั่วโมงเป็น 1,440 นาที แล้วหารด้วย 90" }
    hints:
      - "แปลง 1 วันเป็นนาที: $24 \\times 60$"
      - "นำจำนวนนาทีใน 1 วันหารด้วยเวลาที่ใช้ต่อรอบ"
    solution: "1 วัน $= 24 \\times 60 = 1{,}440$ นาที จำนวนรอบ $= 1{,}440 \\div 90 = 16$ รอบ นักบินอวกาศจึงเห็นดวงอาทิตย์ขึ้นวันละ 16 ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.eclipses-space-tech.p013
