id: computer.security.risk-policy
subject: computer
title: { th: การบริหารความเสี่ยง นโยบาย และกฎหมายความมั่นคงปลอดภัย, en: "Risk management, security policy and cybersecurity law" }
summary: ประเมินความเสี่ยงด้วยโอกาสคูณผลกระทบ เลือกทางจัดการ ออกแบบการเข้าถึงตามบทบาท วางนโยบายขององค์กร และรู้จักกฎหมายพื้นฐานกับวิศวกรรมสังคม
difficulty: 5.5
minutes: 45
prerequisites: [computer.security.cybersecurity-basics, computer.society.privacy]
encompasses:
  - { id: computer.security.cybersecurity-basics, weight: 0.3 }
  - { id: computer.society.privacy, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: risk-matrix.svg
    alt: "ตารางขนาด 5 คูณ 5 แถวแสดงโอกาสจาก 1 ถึง 5 จากล่างขึ้นบน คอลัมน์แสดงผลกระทบจาก 1 ถึง 5 จากซ้ายไปขวา แต่ละช่องแสดงผลคูณของโอกาสกับผลกระทบ ช่องมุมล่างซ้ายเป็น 1 และช่องมุมบนขวาเป็น 25 ช่องสีแดงอยู่มุมบนขวา"
    caption: "คะแนนความเสี่ยง = โอกาส × ผลกระทบ ช่องสีแดงควรจัดการก่อน"
  - type: figure
    src: risk-treatment.svg
    alt: "สี่กล่องแสดงทางเลือกจัดการความเสี่ยง ได้แก่ ลด ด้วยการสำรองข้อมูลทุกคืน โอน ด้วยการซื้อประกันภัยไซเบอร์ ยอมรับ ด้วยการบันทึกและติดตามไว้ และหลีกเลี่ยง ด้วยการเลิกใช้ระบบเสี่ยงสูง"
    caption: "เลือกทางจัดการให้เหมาะกับแต่ละความเสี่ยง"
  - type: worked-example
    title: จัดลำดับความเสี่ยงของระบบลงทะเบียนโรงเรียน
    problem: "ระบบลงทะเบียนมีความเสี่ยงสองเรื่อง เรื่องแรกคือระบบล่มในช่วงเปิดเทอม มีโอกาส 4 และผลกระทบ 3 เรื่องที่สองคือข้อมูลส่วนบุคคลรั่ว มีโอกาส 2 และผลกระทบ 5 เรื่องใดควรจัดการก่อน"
    steps:
      - text: "คำนวณคะแนนเรื่องแรก: $4 \\times 3 = 12$"
        why: "ใช้ผลคูณเพราะความเสี่ยงขึ้นกับทั้งโอกาสและผลกระทบพร้อมกัน ไม่ใช่การบวก"
      - text: "คำนวณคะแนนเรื่องที่สอง: $2 \\times 5 = 10$"
      - text: "เปรียบเทียบ 12 กับ 10 เรื่องระบบล่มมีคะแนนสูงกว่า"
        why: "คะแนนที่สูงกว่าบอกว่าควรให้ความสำคัญก่อน แต่ต้องดูด้วยว่าผลกระทบด้านกฎหมายหรือความเป็นส่วนตัวหรือไม่"
      - text: "ข้อมูลรั่วมีคะแนนรองลงมาแต่ผลกระทบด้านกฎหมายสูงมาก จึงควรวางมาตรการควบคุมการเข้าถึงไปพร้อมกันด้วย"
    answer: "ระบบล่มมีคะแนน 12 สูงกว่าข้อมูลรั่วที่ 10 จึงจัดการก่อน แต่ไม่ควรละเลยข้อมูลรั่วเพราะมีผลกระทบด้านกฎหมายสูง"
  - { type: check, problem: computer.security.risk-policy.p001, prompt: "ลองทบทวนว่าความเสี่ยงประกอบด้วยอะไรบ้าง" }
  - type: worked-example
    title: เลือกการควบคุมการเข้าถึงที่สิทธิ์น้อยที่สุด
    problem: "โรงเรียนต้องให้ครูประจำวิชาคอมพิวเตอร์กรอกคะแนนของห้อง ม.4/1 ได้ แต่ไม่ควรแก้คะแนนห้องอื่น ออกแบบสิทธิ์อย่างไร"
    steps:
      - text: "กำหนดบทบาท เช่น ครูผู้สอนวิชา แล้วให้สิทธิ์แก่บทบาทนั้น"
        why: "สิทธิ์ผูกกับบทบาทช่วยให้การเปลี่ยนคนทำได้ง่ายโดยไม่ต้องแก้สิทธิ์ทีละคน"
      - text: "ให้สิทธิ์เฉพาะการดูและกรอกคะแนนของห้อง ม.4/1 ไม่ให้สิทธิ์ลบหรือแก้ห้องอื่น"
        why: "หลักสิทธิ์น้อยที่สุดกำหนดให้มีแค่สิ่งที่งานต้องการ"
      - text: "บันทึกการเข้าถึงทุกครั้ง เพื่อตรวจสอบย้อนหลังได้เมื่อมีข้อสงสัย"
    answer: "ใช้บทบาทครูผู้สอนที่เข้าถึงได้เฉพาะคะแนนห้อง ม.4/1 พร้อมบันทึกการเข้าถึง"
  - { type: check, problem: computer.security.risk-policy.p010, prompt: "ลองนึกว่าสัญญาณใดบ่งบอกว่าเป็นการเร่งรีบหรืออ้างอำนาจ" }
  - type: figure
    src: cia-triad.svg
    alt: "สามกล่องเรียงกันแสดงความลับ ความถูกต้องครบถ้วน และความพร้อมใช้งาน แต่ละกล่องมีตัวอย่าง ความลับคือเฉพาะผู้มีสิทธิ์อ่านผลสอบได้ ความถูกต้องครบถ้วนคือคะแนนไม่ถูกแก้ระหว่างทาง ความพร้อมใช้งานคือระบบลงทะเบียนเปิดให้ใช้ตอนเปิดเทอม"
    caption: "CIA ครอบคลุมสามเป้าหมายของความมั่นคงปลอดภัยข้อมูล"
glossary:
  - { term: สินทรัพย์ (asset), definition: "สิ่งที่มีคุณค่าต่อองค์กรและต้องป้องกัน เช่น ข้อมูล ระบบ หรือชื่อเสียง" }
  - { term: ภัยคุกคาม (threat), definition: "เหตุที่อาจทำให้สินทรัพย์เสียหาย เช่น มัลแวร์ ไฟดับ หรือการหลอกลวง" }
  - { term: ช่องโหว่ (vulnerability), definition: "จุดอ่อนที่ภัยคุกคามใช้ประโยชน์ได้" }
  - { term: ความเสี่ยง (risk), definition: "โอกาสที่ภัยจะใช้ช่องโหว่ทำให้สินทรัพย์เสียหาย วัดจากโอกาสคูณผลกระทบ" }
  - { term: CIA triad, definition: "กรอบสามด้านของความมั่นคงปลอดภัยข้อมูล คือความลับ ความถูกต้องครบถ้วน และความพร้อมใช้งาน" }
  - { term: การควบคุมตามบทบาท (RBAC), definition: "การกำหนดสิทธิ์ให้กับบทบาท แล้วให้บุคคลรับบทบาทนั้นเพื่อเข้าถึงทรัพยากร" }
  - { term: วิศวกรรมสังคม (social engineering), definition: "การใช้จิตวิทยาหลอกให้คนเปิดเผยข้อมูลหรือทำตามคำสั่งที่ไม่ควรทำ" }
flashcards:
  - { front: "สูตรคะแนนความเสี่ยง", back: "โอกาส × ผลกระทบ (ให้คะแนนแต่ละด้าน 1 ถึง 5)" }
  - { front: "ทางจัดการความเสี่ยงสี่แบบ", back: "ลด โอน ยอมรับ หลีกเลี่ยง" }
  - { front: "CIA คืออะไร", back: "ความลับ (Confidentiality) ความถูกต้องครบถ้วน (Integrity) ความพร้อมใช้งาน (Availability)" }
  - { front: "สิทธิ์น้อยที่สุดหมายถึงอะไร", back: "ให้สิทธิ์เท่าที่งานต้องการเท่านั้น" }
  - { front: "ISMS คืออะไร", back: "ระบบการจัดการความมั่นคงสารสนเทศ ตามมาตรฐาน ISO/IEC 27001" }
