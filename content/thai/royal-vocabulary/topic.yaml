id: thai.grammar.royal-vocabulary
subject: thai
title: { th: คำราชาศัพท์, en: Thai royal and honorific vocabulary }
summary: ระดับบุคคลที่ใช้ถ้อยคำต่างกัน คำนาม สรรพนาม และกริยาราชาศัพท์ที่พบบ่อย การใช้ ทรง และ เสด็จ คำที่ใช้กับพระสงฆ์ และคำสุภาพสำหรับบุคคลทั่วไป
difficulty: 4
minutes: 40
prerequisites: [thai.grammar.word-types]
encompasses:
  - { id: thai.grammar.word-types, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: royal-tiers.svg
    alt: "ตารางคำตามระดับบุคคล คอลัมน์ บุคคล กิน ป่วย ตาย: พระมหากษัตริย์ เสวย ประชวร สวรรคต; พระราชวงศ์ เสวย ประชวร สิ้นพระชนม์; พระภิกษุสงฆ์ ฉัน อาพาธ มรณภาพ; ข้าราชการชั้นผู้ใหญ่ รับประทาน ป่วย ถึงแก่อนิจกรรม; สุภาพชน รับประทาน ป่วย ไม่สบาย ถึงแก่กรรม"
    caption: "คำที่ใช้ต่างกันตามระดับบุคคล"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: royal-face.svg
    alt: "ภาพใบหน้าการ์ตูนพร้อมป้ายคำราชาศัพท์ ผม พระเกศา คิ้ว พระขนง ตา พระเนตร จมูก พระนาสิก ปาก พระโอษฐ์ หู พระกรรณ"
    caption: "คำราชาศัพท์อวัยวะบนใบหน้า"
  - type: worked-example
    title: เลือกคำว่า ให้ ตามผู้ให้และผู้รับ
    problem: "เติมคำ: ก) พระมหากษัตริย์ ___ ทุนการศึกษาแก่นักเรียน ข) นักเรียน ___ หนังสือแด่พระมหากษัตริย์ ค) ชาวบ้าน ___ ภัตตาหารแด่พระสงฆ์"
    steps:
      - text: "ก) ผู้ให้คือพระมหากษัตริย์ ให้แก่ผู้อื่น ใช้ พระราชทาน"
      - text: "ข) ผู้ให้คือนักเรียน ผู้รับคือพระมหากษัตริย์ หนังสือยกได้ ใช้ ทูลเกล้าฯ ถวาย"
        why: "ถ้าเป็นของที่ยกไม่ได้ เช่น อาคาร ใช้ น้อมเกล้าฯ ถวาย"
      - text: "ค) ผู้รับคือพระสงฆ์ ใช้ ถวาย และถ้ายกส่งถึงมือ เรียกว่า ประเคน"
    answer: "ก) พระราชทาน ข) ทูลเกล้าฯ ถวาย ค) ถวาย (ประเคน)"
  - { type: check, problem: thai.grammar.royal-vocabulary.p008, prompt: "ของนี้ยกได้หรือไม่" }
  - type: worked-example
    title: ตรวจคำว่า ทรง ในประโยค
    problem: "ประโยค \"สมเด็จพระราชินีทรงประทับที่พระราชวัง ทรงพระสรวล แล้วทรงทอดพระเนตรการแสดง\" ผิดที่ใด"
    steps:
      - text: "ทรงประทับ: ประทับ เป็นราชาศัพท์อยู่แล้ว ผิด ใช้ ประทับ"
      - text: "ทรงพระสรวล: ทรง + นามราชาศัพท์ ถูก"
        why: "พระสรวล เป็นคำนาม ทรง ทำให้เป็นกริยา แปลว่าหัวเราะ"
      - text: "ทรงทอดพระเนตร: ทอดพระเนตร เป็นกริยาราชาศัพท์อยู่แล้ว ผิด ใช้ ทอดพระเนตร"
    answer: "สมเด็จพระราชินีประทับที่พระราชวัง ทรงพระสรวล แล้วทอดพระเนตรการแสดง"
  - { type: check, problem: thai.grammar.royal-vocabulary.p007, prompt: "ทรง ใช้นำหน้าคำแบบใดไม่ได้" }
glossary:
  - { term: คำราชาศัพท์, definition: "ถ้อยคำที่ใช้ให้เหมาะกับฐานะของบุคคล ได้แก่ พระมหากษัตริย์ พระราชวงศ์ พระภิกษุสงฆ์ ข้าราชการ และสุภาพชน" }
  - { term: ทรง, definition: "คำที่นำหน้าคำนามสามัญ กริยาสามัญ หรือนามราชาศัพท์ ให้เป็นกริยาราชาศัพท์ ห้ามนำหน้ากริยาที่เป็นราชาศัพท์อยู่แล้ว" }
  - { term: ทูลเกล้าฯ ถวาย, definition: "ถวายสิ่งของที่ยกได้แด่พระมหากษัตริย์" }
  - { term: น้อมเกล้าฯ ถวาย, definition: "ถวายสิ่งของที่ยกไม่ได้หรือเป็นนามธรรมแด่พระมหากษัตริย์" }
  - { term: คำสุภาพ, definition: "คำที่ใช้แทนคำที่ฟังไม่สุภาพในการสื่อสารทั่วไป เช่น ศีรษะ รับประทาน สุนัข" }
flashcards:
  - { front: "เสวย บรรทม ตรัส ทอดพระเนตร", back: "กิน นอน พูด ดู" }
  - { front: "ไป ของพระมหากษัตริย์ใช้คำว่าอะไร", back: "เสด็จพระราชดำเนิน (พระราชวงศ์ใช้ เสด็จ)" }
  - { front: "ห้ามใช้ ทรง นำหน้าคำแบบใด", back: "กริยาที่เป็นราชาศัพท์อยู่แล้ว เช่น เสด็จ เสวย ประทับ ตรัส" }
  - { front: "พระสงฆ์ กิน นอน ป่วย", back: "ฉัน จำวัด อาพาธ" }
  - { front: "ทูลเกล้าฯ กับ น้อมเกล้าฯ ต่างกันอย่างไร", back: "ทูลเกล้าฯ = ของยกได้ · น้อมเกล้าฯ = ของยกไม่ได้" }
