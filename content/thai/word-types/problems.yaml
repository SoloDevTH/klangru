    choices:
      - { id: a, text: "รูป", correct: true, feedback: "ถูก พระภิกษุและสามเณรใช้ลักษณนามว่า รูป" }
      - { id: b, text: "องค์", feedback: "องค์ ใช้กับพระพุทธรูป เจดีย์ หรือเจ้านาย ไม่ใช่ลักษณนามของพระภิกษุทั่วไป" }
      - { id: c, text: "คน", feedback: "คน ใช้กับบุคคลทั่วไป สำหรับพระภิกษุภาษาไทยมีลักษณนามเฉพาะ" }
      - { id: d, text: "ท่าน", feedback: "ท่าน เป็นคำสรรพนามที่ใช้แทนบุคคลอย่างยกย่อง ไม่ใช่ลักษณนามที่ใช้ต่อหลังตัวเลข" }
    hints:
      - "ลักษณนามของพระภิกษุต่างจากของคนทั่วไป"
      - "พระพุทธรูปใช้ องค์ แต่พระภิกษุที่มีชีวิตใช้อีกคำหนึ่ง"
    solution: "พระภิกษุใช้ลักษณนาม **รูป** เช่น ตักบาตรพระ 9 รูป ส่วนพระพุทธรูปใช้ องค์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.word.p017
    topics: [thai.grammar.word-types]
    difficulty: 3
    type: mcq
    stem: "ประโยค \"น้องสาวของฉันกินขนมปังอย่างเอร็ดอร่อย\" **ภาคประธาน** คือข้อใด"
    choices:
      - { id: a, text: "น้องสาวของฉัน", correct: true, feedback: "ถูก ภาคประธานคือตัวประธาน (น้องสาว) รวมกับส่วนขยายของมัน (ของฉัน)" }
      - { id: b, text: "น้องสาว", feedback: "น้องสาวคือตัวประธาน แต่ภาคประธานต้องรวมส่วนขยาย ของฉัน ด้วย" }
      - { id: c, text: "ฉัน", feedback: "ฉัน อยู่ในบุพบทวลี ของฉัน ซึ่งขยายคำว่า น้องสาว ไม่ได้เป็นผู้กิน" }
      - { id: d, text: "กินขนมปังอย่างเอร็ดอร่อย", feedback: "ส่วนนี้คือภาคแสดง บอกว่าประธานทำอะไร" }
    hints:
      - "ถามว่า ใคร กิน คำตอบคือประธาน"
      - "ภาคประธาน = ประธาน + คำที่ขยายประธาน"
    solution: "ผู้กินคือ น้องสาว และ ของฉัน ขยายว่าเป็นน้องสาวของใคร ภาคประธานจึงเป็น **น้องสาวของฉัน** ส่วน กินขนมปังอย่างเอร็ดอร่อย เป็นภาคแสดง (กริยา + กรรม + ส่วนขยาย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: thai.word.p018
