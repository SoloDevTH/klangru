copyright: "เอกสารแนบท้ายประกาศกระทรวงศึกษาธิการที่ประกาศในราชกิจจานุเบกษา ตามการตีความของเรา เป็นประกาศของหน่วยงานรัฐ จึงไม่เป็นงานอันมีลิขสิทธิ์ตาม พ.ร.บ.ลิขสิทธิ์ พ.ศ. 2537 มาตรา 7 คัดข้อความได้ครบ (การตีความนี้ไม่ใช่คำปรึกษาทางกฎหมาย)"
completeness: full-text
strands:
  - id: "5"
    title: มาตรฐานผลลัพธ์การเรียนรู้
    standards:
      - id: "5.1"
        text: "คุณธรรม จริยธรรม"
        indicators:
          - { id: "5.1.1", text: "มีความรู้และความเข้าใจในหลักจริยธรรมพื้นฐานทางวิชาชีพบัญชี" }
          - { id: "5.1.2", text: "สามารถประยุกต์หลักจริยธรรมพื้นฐานทางวิชาชีพในการแก้ไขปัญหาในทางปฏิบัติได้อย่างเหมาะสม" }
          - { id: "5.1.3", text: "แสดงออกถึงความเป็นคนซื่อสัตย์ สุจริต เที่ยงธรรม ระมัดระวังรอบคอบในการทำงานและมีความรับผิดชอบต่อตนเอง วิชาชีพ และสังคม" }
      - id: "5.2"
        text: "ความรู้"
        indicators:
          - { id: "5.2.1", text: "มีความรู้และความเข้าใจในสาระสำคัญของศาสตร์ทางการบัญชีเพียงพอที่จะประยุกต์ในการจัดทำและนำเสนอสารสนเทศที่เป็นประโยชน์ต่อผู้ใช้" }
          - { id: "5.2.2", text: "มีความรู้และความเข้าใจในศาสตร์อื่นที่เกี่ยวข้อง เพียงพอที่จะประยุกต์ในการประกอบวิชาชีพบัญชี" }
          - { id: "5.2.3", text: "มีความสามารถในการประยุกต์หลักคณิตศาสตร์และสถิติในการประกอบวิชาชีพบัญชี" }
      - id: "5.3"
        text: "ทักษะทางปัญญา"
        indicators:
          - { id: "5.3.1", text: "มีความสามารถในการสืบค้นและวิเคราะห์ข้อมูลด้วยวิธีการที่ถูกต้องและเหมาะสมกับปัญหา" }
          - { id: "5.3.2", text: "มีความสามารถในการเรียนรู้และติดตามการเปลี่ยนแปลงในศาสตร์ทางการบัญชีและศาสตร์อื่นที่เกี่ยวข้อง และรู้เท่าทันการเปลี่ยนแปลงของสังคมและของโลก" }
          - { id: "5.3.3", text: "มีความสามารถในการใช้ดุลยพินิจในการระบุปัญหาในการปฏิบัติทางบัญชีในเรื่องที่มีความสำคัญต่อองค์กร และสามารถแสดงความคิดเห็นหรือเสนอแนวทางการแก้ไขปัญหา" }
      - id: "5.4"
        text: "ความสัมพันธ์ระหว่างบุคคลและความรับผิดชอบ"
        indicators:
          - { id: "5.4.1", text: "มีทัศนคติที่ดีต่อการทำงานเป็นทีม มีความรับผิดชอบในการทำงานของตนเองร่วมกับผู้อื่นและสามารถปรับตัวให้เข้ากับสถานการณ์และวัฒนธรรมขององค์กร" }
          - { id: "5.4.2", text: "มีหลักคิดและวิธีการปฏิบัติงานที่เป็นระบบ มีความรับผิดชอบในการทำงานให้สำเร็จตามเป้าหมายภายในระยะเวลาที่กำหนด" }
      - id: "5.5"
        text: "การวิเคราะห์เชิงตัวเลข การสื่อสาร และการใช้เทคโนโลยีสารสนเทศ"
        indicators:
          - { id: "5.5.1", text: "มีความสามารถในการวิเคราะห์เชิงปริมาณและเชิงคุณภาพ รวมทั้งการใช้ความรู้ความสามารถเชิงเทคนิคในการวางแผนงาน การควบคุม การประเมินผล และการรายงานผล ได้อย่างถูกต้องและเหมาะสม โดยคำนึงถึงผลกระทบที่อาจเกิดขึ้นจากการตัดสินใจ" }
          - { id: "5.5.2", text: "มีความสามารถในการสื่อสารอย่างมีประสิทธิภาพทั้งการพูดและการเขียน โดยเลือกใช้รูปแบบการนำเสนอที่เหมาะสมกับสถานการณ์" }
          - { id: "5.5.3", text: "มีความสามารถในการประยุกต์ใช้เทคโนโลยีสารสนเทศทางการบัญชีโดยเฉพาะเทคโนโลยีดิจิทัลที่มีในปัจจุบัน เพื่อพัฒนากระบวนการทำงานด้านวิชาชีพบัญชีให้มีประสิทธิภาพ" }
  - id: "8"
    title: เนื้อหาสาระสำคัญของสาขาวิชา
    standards:
      - id: "8.1"
        text: "ความรู้ด้านการบัญชี การเงิน และด้านอื่นๆ ที่เกี่ยวข้อง"
        indicators:
          - { id: "8.1.1", text: "การบัญชีการเงินและการรายงานทางการเงิน: หลักการบัญชี มาตรฐานการรายงานทางการเงินระหว่างประเทศ (IFRSs) หรือมาตรฐานอื่นที่เกี่ยวข้องกับรายการค้าและเหตุการณ์ต่างๆ นโยบายการบัญชีที่ใช้จัดทำงบการเงิน การจัดทำงบการเงิน การจัดทำงบการเงินรวมตามมาตรฐานการรายงานทางการเงินระหว่างประเทศหรือมาตรฐานอื่นที่เกี่ยวข้อง การตีความงบการเงินและการเปิดเผยข้อมูลที่เกี่ยวข้อง การตีความของรายงานต่างๆ ซึ่งรวมถึงข้อมูลที่ไม่ใช่ข้อมูลทางการเงิน เช่น รายงานความยั่งยืนและรายงานฉบับบูรณาการ" }
          - { id: "8.1.2", text: "การบัญชีบริหาร: เทคนิคต่างๆ เพื่อสนับสนุนการตัดสินใจด้านการบริหาร เทคนิคเชิงปริมาณในการวิเคราะห์พฤติกรรมต้นทุนและตัวผลักดันต้นทุน ต้นทุนผลิตภัณฑ์ การวิเคราะห์ผลต่าง การบริหารสินค้าคงเหลือ การจัดทำงบประมาณและการพยากรณ์ การวิเคราะห์ข้อมูลทางการเงินและข้อมูลที่ไม่ใช่ข้อมูลทางการเงิน เพื่อนำเสนอข้อมูลและจัดทำรายงานสนับสนุนการตัดสินใจ ซึ่งรวมถึงการรายงานต่างๆ ที่มุ่งเน้นการวางแผนและการจัดทำงบประมาณ การบริหารต้นทุน การควบคุมคุณภาพ การวัดผลการปฏิบัติงาน และการเทียบเคียงสมรรถนะกับเกณฑ์มาตรฐาน การประเมินผลการปฏิบัติงานของผลิตภัณฑ์และส่วนงานธุรกิจ" }
          - { id: "8.1.3", text: "การเงินและการบริหารการเงิน: แหล่งเงินทุนสำหรับองค์กร การจัดหาเงินทุนจากธนาคาร เครื่องมือทางการเงิน ตลาดหุ้นกู้ ตลาดหุ้นทุนและตลาดพันธบัตรรัฐบาล การวิเคราะห์ความต้องการด้านกระแสเงินสดและเงินทุนหมุนเวียนขององค์กร การวิเคราะห์ฐานะการเงินในปัจจุบันและในอนาคตขององค์กรโดยใช้เทคนิคต่างๆ ซึ่งรวมถึงการวิเคราะห์อัตราส่วน การวิเคราะห์แนวโน้มและการวิเคราะห์กระแสเงินสด การคำนวณต้นทุนเงินทุนขององค์กร เทคนิคการจัดทำงบประมาณการลงทุน วิธีการประเมินมูลค่าด้วยวิธีรายได้ วิธีสินทรัพย์ และวิธีมูลค่าตลาดที่ใช้สำหรับการตัดสินใจลงทุน การวางแผนธุรกิจและการบริหารการเงินในระยะยาว" }
          - { id: "8.1.4", text: "การภาษีอากร: ข้อกำหนดและระเบียบวิธีปฏิบัติตามระบบการจัดเก็บภาษีอากรของประเทศ การคำนวณภาษีทางตรงและทางอ้อมสำหรับบุคคลธรรมดาและนิติบุคคล ประเด็นภาษีอากรที่สัมพันธ์กับรายการค้าระหว่างประเทศ" }
          - { id: "8.1.5", text: "การสอบบัญชีและการให้ความเชื่อมั่น: วัตถุประสงค์และขั้นตอนที่เกี่ยวข้องกับการตรวจสอบงบการเงิน มาตรฐานการสอบบัญชีที่เกี่ยวข้อง (เช่น มาตรฐานการสอบบัญชีระหว่างประเทศ เป็นต้น) กฎหมายและข้อบังคับที่เกี่ยวข้องกับการตรวจสอบงบการเงิน การประเมินความเสี่ยงของข้อมูลที่ขัดต่อข้อเท็จจริงอันเป็นสาระสำคัญต่องบการเงินและการพิจารณาถึงผลกระทบต่อกลยุทธ์การตรวจสอบ วิธีเชิงปริมาณที่ใช้ในงานตรวจสอบ รายงานผู้สอบบัญชี ซึ่งรวมถึงองค์ประกอบสำคัญของงานให้ความเชื่อมั่นและมาตรฐานที่เกี่ยวข้อง" }
          - { id: "8.1.6", text: "การกำกับดูแล การบริหารความเสี่ยง และการควบคุมภายใน: หลักการการกำกับดูแลที่ดี สิทธิและความรับผิดชอบของผู้เป็นเจ้าของ นักลงทุน และผู้มีหน้าที่ในการกำกับดูแล บทบาทของผู้มีส่วนได้ส่วนเสียในข้อกำหนดด้านการกำกับดูแล การเปิดเผยข้อมูลและความโปร่งใส องค์ประกอบของกรอบแนวคิดในการกำกับดูแลองค์กร ความเสี่ยงและโอกาสขององค์กร กรอบแนวคิดในการบริหารความเสี่ยง องค์ประกอบของการควบคุมภายใน" }
          - { id: "8.1.7", text: "กฎหมายและข้อบังคับทางธุรกิจ: กฎหมายและข้อบังคับทางธุรกิจ กฎหมายและข้อบังคับทางธุรกิจที่เกี่ยวข้องกับสภาพแวดล้อมในการปฏิบัติงานของผู้ประกอบวิชาชีพบัญชี" }
      - id: "8.2"
        text: "ความรู้เกี่ยวกับองค์การ และธุรกิจ"
        indicators:
          - { id: "8.2.1", text: "สภาพแวดล้อมทางธุรกิจและองค์กร: สภาพแวดล้อมที่องค์กรดำเนินงาน แรงผลักดันหลักด้านเศรษฐกิจ ด้านกฎหมาย ด้านการเมือง ด้านสังคม ด้านเทคนิค ด้านการต่างประเทศ และด้านวัฒนธรรม ลักษณะของสภาพแวดล้อมโลกที่ส่งผลกระทบต่อการค้าและการเงินระหว่างประเทศ ลักษณะสำคัญของโลกาภิวัตน์ บทบาทของธุรกิจข้ามชาติ การพาณิชย์อิเล็กทรอนิกส์ และตลาดเกิดใหม่" }
          - { id: "8.2.2", text: "เศรษฐศาสตร์: หลักการพื้นฐานของเศรษฐศาสตร์จุลภาคและเศรษฐศาสตร์มหภาค ผลกระทบของการเปลี่ยนแปลงในดัชนีชี้วัดด้านเศรษฐศาสตร์มหภาคต่อกิจกรรมทางธุรกิจ โครงสร้างตลาดประเภทต่างๆ ซึ่งรวมถึงการแข่งขันสมบูรณ์ การแข่งขันแบบผูกขาด การผูกขาด และการมีผู้ขายน้อยราย" }
          - { id: "8.2.3", text: "กลยุทธ์ธุรกิจและการจัดการ: วิธีการออกแบบและจัดรูปแบบองค์กร วัตถุประสงค์และความสำคัญของหน้าที่และการดำเนินงานประเภทต่างๆ ภายในองค์กร ปัจจัยภายนอกและภายในที่อาจมีอิทธิพลต่อกลยุทธ์ขององค์กร กระบวนการที่ใช้ในการดำเนินกลยุทธ์ขององค์กร ทฤษฎีพฤติกรรมองค์กรเพื่อยกระดับผลการปฏิบัติงานของบุคคล ทีมงาน และองค์กร" }
      - id: "8.3"
        text: "เทคโนโลยีสารสนเทศ"
        indicators:
          - { id: "8.3", text: "การประยุกต์ใช้ระบบสารสนเทศทางการบัญชี การควบคุมภายในที่เกี่ยวกับระบบสารสนเทศ ซึ่งรวมถึงการควบคุมทั่วไปและการควบคุมระบบงาน การใช้เทคโนโลยีสารสนเทศในการวิเคราะห์ข้อมูลเพื่อสนับสนุนการตัดสินใจ" }
