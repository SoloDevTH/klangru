problems:
- id: english.speaking.discussions.p001
  topics:
  - english.speaking.discussions
  difficulty: 1
  type: mcq
  stem: ประโยคใดแสดงความเห็นของตัวเองอย่างสุภาพและมีเหตุผลประกอบ
  choices:
  - id: a
    text: In my opinion, students in Thai schools should have more time for sports, because it helps them focus in class.
    correct: true
    feedback: ถูก มีวลีบอกความเห็น และมี because ตามด้วยเหตุผล
  - id: b
    text: Sports, sports, sports!
    feedback: ไม่ใช่ประโยคแสดงความเห็น ไม่มีเหตุผล
  - id: c
    text: I don't care about this.
    feedback: ไม่สุภาพต่อกลุ่ม และไม่ให้ความเห็นที่ใช้อภิปรายต่อ
  - id: d
    text: Whatever, it's fine.
    feedback: ไม่ให้เหตุผลและไม่ช่วยให้การอภิปรายไปต่อ
  hints:
  - มองหาวลีที่บอกว่านี่คือความเห็นของผู้พูด
  - ดูว่ามีเหตุผลตามหลัง because หรือไม่
  solution: ข้อ a ใช้ In my opinion เพื่อบอกความเห็น และ because เพื่อให้เหตุผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.discussions.p002
  topics:
  - english.speaking.discussions
  difficulty: 1
  type: text
  stem: 'เติมคำเชื่อมที่ใช้บอกเหตุผล: *I think it is a good idea, ___ it saves time for everyone.*'
  accepted:
  - because
  - since
  - as
  misconceptions:
  - match: but
    feedback: but ใช้บอกการขัดแย้ง ไม่ได้ใช้บอกเหตุผลของความเห็นที่ตามมา
  - match: although
    feedback: although ใช้บอกการขัดแย้งหรือข้อจำกัด ไม่ได้ใช้บอกเหตุผลในประโยคนี้
  hints:
  - ประโยคนี้ต้องการเหตุผลว่าทำไมจึงเป็นความคิดที่ดี
  - คำเชื่อมที่แปลว่า "เพราะ"
  solution: '*I think it is a good idea, **because** it saves time for everyone.* since หรือ as ก็บอกเหตุผลได้เช่นกัน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.discussions.p003
  topics:
  - english.speaking.discussions
  difficulty: 1
  type: match
  stem: จับคู่วลีในการอภิปรายกับหน้าที่ของวลีนั้น
  pairs:
  - left: Sorry to interrupt, but ...
    right: ขัดจังหวะอย่างสุภาพ
  - left: Could you explain what you mean by ...?
    right: ขอให้อธิบายความหมายเพิ่มเติม
  - left: What do you think, Nok?
    right: เชิญเพื่อนให้แสดงความเห็น
  - left: Anyway, going back to the main point, ...
    right: กลับเข้าสู่ประเด็นหลัก
  hints:
  - วลีที่มี Sorry to interrupt ใช้ขัดจังหวะ
  - ดูว่าวลีนั้นขอข้อมูลเพิ่ม เชิญให้คนอื่นพูด หรือพากลับเรื่องเดิม
  solution: 'Sorry to interrupt → ขัดจังหวะ · Could you explain → ขอให้อธิบาย · What do you think → เชิญให้พูด · going back to the main point → กลับเข้าประเด็น'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.discussions.p004
  topics:
  - english.speaking.discussions
  difficulty: 2
  type: mcq
  stem: อีกฝ่ายพูดว่า 'Students should not have homework on weekends.' คุณเห็นด้วยบางส่วน ข้อใดเหมาะที่สุด
  choices:
  - id: a
    text: You're wrong.
    feedback: ค้านโดยไม่ให้เหตุผล และไม่สุภาพ
  - id: b
    text: I see your point, but some students in Thai schools need extra practice at weekends.
    correct: true
    feedback: ถูก รับความเห็นก่อน แล้วบอกข้อแตกต่างด้วย but และให้ตัวอย่างประกอบ
  - id: c
    text: I agree, I agree, I agree.
    feedback: ไม่ได้ให้ความเห็นของตัวเองและฟังซ้ำ
  - id: d
    text: Who cares about weekends?
    feedback: ไม่สุภาพและไม่เกี่ยวกับประเด็นที่อภิปราย
  hints:
  - เมื่อเห็นด้วยบางส่วน ให้ตามด้วยข้อที่ต่าง
  - ดูว่าคำตอบมีทั้งการรับความเห็นและเหตุผลที่ต่างหรือไม่
  solution: ข้อ b รับความเห็น แล้วใช้ but เพื่อบอกข้อที่ต่างและให้เหตุผลประกอบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.discussions.p005
  topics:
  - english.speaking.discussions
  difficulty: 2
  type: text
  stem: 'เติมคำเชื่อมที่แสดงการแย้งอย่างสุภาพ: *I see your point, ___ I''m not sure the plan is practical.*'
  accepted:
  - but
  - although
  - though
  misconceptions:
  - match: so
    feedback: so บอกผลลัพธ์ ไม่ได้บอกการแย้ง
  - match: because
    feedback: because ต้องตามด้วยเหตุผลที่สนับสนุนความเห็น ไม่ใช่บอกการแย้ง
  hints:
  - ส่วนหลังคำเชื่อมต่างจากอีกฝ่าย
  - คำที่ใช้บอกความต่างในประโยคนี้
  solution: '*I see your point, **but** I''m not sure the plan is practical.* ใช้ but เพื่อแย้งอย่างสุภาพหลังรับความเห็น although หรือ though ก็ใช้ได้'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.discussions.p006
  topics:
  - english.speaking.discussions
  difficulty: 3
  type: order
  stem: เรียงบทสนทนาการอภิปรายนี้ให้เป็นลำดับที่สมเหตุสมผล
  items:
  - I think schools should start later in the morning, because students would do better.
  - Could you explain what you mean by 'better'?
  - Good question. Students would get more sleep, so they could focus more in class.
  - I see your point, but starting later might affect the bus schedule.
  - What do you think, Ploy?
  hints:
  - ความเห็นแรกต้องมาก่อนการขอให้อธิบาย
  - เมื่อเห็นด้วยบางส่วนแล้วจึงเชิญคนอื่นพูด
  solution: ลำดับคือ แสดงความเห็น → ขอให้อธิบาย → ตอบพร้อมเหตุผล → รับความเห็นและแย้งอย่างสุภาพ → เชิญผู้อื่นพูด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.discussions.p007
  topics:
  - english.speaking.discussions
  difficulty: 2
  type: mcq
  stem: ในการประชุมชมรมของโรงเรียนในกรุงเทพฯ ผู้อภิปรายคนหนึ่งพูดยาวจนหลุดจากหัวข้อ คุณต้องการพาการสนทนากลับมาที่ประเด็นหลักอย่างสุภาพ ควรพูดว่าอย่างไร
  choices:
  - id: a
    text: Stop talking now!
    feedback: ห้วนและไม่สุภาพ อาจทำให้ผู้พูดและกลุ่มไม่พอใจ
  - id: b
    text: Sorry to interrupt, but can we get back to the main point?
    correct: true
    feedback: ถูก ขัดจังหวะอย่างสุภาพและเชิญให้กลับเข้าประเด็น
  - id: c
    text: Blah blah, whatever.
    feedback: ไม่สุภาพและไม่ช่วยให้กลับเข้าประเด็น
  - id: d
    text: Hmm, I'll just leave the group.
    feedback: เป็นการถอนตัวจากการอภิปราย ไม่ได้พากลับเข้าประเด็น
  hints:
  - ใช้วลีขัดจังหวะที่สุภาพก่อน
  - ตามด้วยการเสนอให้กลับเข้าประเด็นหลัก
  solution: ข้อ b ใช้ Sorry to interrupt เพื่อขัดจังหวะอย่างสุภาพ แล้วถามว่าจะกลับเข้าประเด็นหลักได้ไหม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.discussions.p008
  topics:
  - english.speaking.discussions
  difficulty: 2
  type: text
  stem: 'เติมคำกริยาที่เชิญให้คนอื่นพูดเพิ่มเติม: *Would anyone like to ___ something?*'
  accepted:
  - add
  - say
  misconceptions:
  - match: remove
    feedback: remove แปลว่าเอาออก ไม่ใช่เชิญให้เพิ่มความเห็น
  - match: delete
    feedback: delete แปลว่าลบ ไม่ใช่เชิญให้เพิ่มความเห็น
  hints:
  - คำกริยาที่แปลว่า "เพิ่ม"
  - ประโยคนี้เชิญให้คนอื่นเสริมความเห็น
  solution: '*Would anyone like to **add** something?* ใช้เชิญให้ผู้อื่นเสริมความเห็นในกลุ่ม (say ก็ใช้ได้ แต่ add บอกชัดกว่าว่าเป็นการเสริม)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.discussions.p009
  topics:
  - english.speaking.discussions
  difficulty: 3
  type: mcq
  stem: คุณนึกคำว่า colander (ที่กรองน้ำออกจากเส้นพาสต้า) ไม่ออกขณะอภิปราย ข้อใดเป็นการพูดอ้อมที่ดีที่สุด
  choices:
  - id: a
    text: It's a kind of bowl you use to drain pasta, with lots of small holes.
    correct: true
    feedback: ถูก บอกประเภทของสิ่งนั้น หน้าที่ และลักษณะเด่น ผู้ฟังเข้าใจได้ทันที
  - id: b
    text: That silver thing.
    feedback: คลุมเครือ ผู้ฟังไม่รู้ว่าหมายถึงอะไร
  - id: c
    text: The thing.
    feedback: ไม่บอกหน้าที่หรือลักษณะ ผู้ฟังไม่สามารถเดาได้
  - id: d
    text: I don't know the word, sorry.
    feedback: ยอมแพ้ก่อนพยายามพูดอ้อม ทั้งที่ทำได้โดยอธิบายหน้าที่
  hints:
  - ลองบอกประเภท หน้าที่ และลักษณะ
  - การพูดอ้อมคือการอธิบายแทนการเรียกชื่อ
  solution: ข้อ a พูดอ้อมด้วย It's a kind of ... และ you use to ... ซึ่งบอกประเภท หน้าที่ และลักษณะของสิ่งนั้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.discussions.p010
  topics:
  - english.speaking.discussions
  difficulty: 3
  type: match
  stem: จับคู่โครงสร้างการพูดอ้อมกับความหมายของโครงสร้างนั้น
  pairs:
  - left: It's a kind of ...
    right: บอกประเภทของสิ่งนั้น
  - left: The thing you use to ...
    right: บอกหน้าที่ของสิ่งนั้น
  - left: It's like a ..., but ...
    right: เปรียบเทียบกับสิ่งที่รู้จักและบอกความต่าง
  - left: What do you call it when ...?
    right: ถามหาคำศัพท์ที่ต้องการ
  hints:
  - โครงสร้างที่ใช้ like เป็นการเปรียบเทียบ
  - โครงสร้างที่ถามด้วย call คือการขอคำศัพท์
  solution: "It's a kind of → ประเภท · the thing you use to → หน้าที่ · It's like a ..., but → เปรียบเทียบ · What do you call it → ถามคำศัพท์"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.discussions.p011
  topics:
  - english.speaking.discussions
  difficulty: 3
  type: order
  stem: เรียงขั้นตอนการพูดที่ดีในการอภิปรายกลุ่มให้ถูกลำดับ
  items:
  - State your opinion clearly.
  - Support it with a reason and an example.
  - Invite others to give their views.
  - Respond politely to their views.
  - Summarise what the group agreed.
  hints:
  - เริ่มจากความเห็นของเราก่อนรับความเห็นอื่น
  - การสรุปความเห็นกลุ่มอยู่ท้ายสุด
  solution: ลำดับคือ บอกความเห็น → ให้เหตุผลและตัวอย่าง → เชิญผู้อื่นพูด → ตอบความเห็นของเขา (their views อ้างถึงคนที่เพิ่งเชิญ) → สรุปความเห็นของกลุ่ม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.discussions.p012
  topics:
  - english.speaking.discussions
  difficulty: 4
  type: text
  stem: 'ใช้โครงสร้างเงื่อนไขชนิดที่สองเพื่อแสดงความเห็นแบบสมมุติ: *If the school banned phones, students ___ have more time to talk.*'
  accepted:
  - would
  - could
  - might
  misconceptions:
  - match: will
    feedback: will ใช้กับเรื่องที่เป็นจริงได้ในอนาคต ส่วนความเห็นสมมุติที่ยังไม่เกิดใช้ would
  - match: can
    feedback: can ไม่ตรงกับโครงสร้างเงื่อนไขชนิดที่สองในประโยคหลัก ให้ใช้ would
  hints:
  - ประโยคนี้เป็นการสมมุติเรื่องที่ยังไม่เกิด
  - โครงสร้าง if + อดีต ตามด้วย would + กริยา
  solution: '*If the school banned phones, students **would** have more time to talk.* could หรือ might ก็ใช้ในประโยคหลังของเงื่อนไขชนิดที่สองได้ แต่ would พบบ่อยที่สุด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.discussions.p013
  topics:
  - english.speaking.discussions
  difficulty: 4
  type: mcq
  stem: ข้อใดฟังแล้วค้านอย่างไม่สุภาพที่สุด
  choices:
  - id: a
    text: I see your point, but I'm not sure.
    feedback: ยังสุภาพอยู่ เพราะรับความเห็นก่อนและบอกความไม่แน่ใจ
  - id: b
    text: You're completely wrong, and that idea is stupid.
    correct: true
    feedback: ถูก ดูถูกความเห็นของอีกฝ่ายโดยตรงและไม่ให้เหตุผล
  - id: c
    text: That's an interesting idea. Could you say more?
    feedback: สุภาพและเป็นการขอข้อมูลเพิ่ม ไม่ได้ค้านอย่างไม่สุภาพ
  - id: d
    text: I understand, though I see it differently.
    feedback: สุภาพ เพราะบอกว่าเข้าใจและยอมรับว่าเห็นต่าง
  hints:
  - มองหาคำที่ดูถูกความคิดหรือตัวบุคคล
  - ดูว่าประโยคให้เหตุผลหรือไม่
  solution: ข้อ b ดูถูกทั้งความเห็นและตัวอีกฝ่ายโดยไม่มีเหตุผล จึงไม่สุภาพที่สุด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.discussions.p014
  topics:
  - english.speaking.discussions
  difficulty: 4
  type: text
  stem: 'เติมคำกริยาในคำอธิบายแบบพูดอ้อม: *It''s the thing you use to ___ pasta.* (เพื่อกรองน้ำออกจากเส้น)'
  accepted:
  - drain
  misconceptions:
  - match: cook
    feedback: cook คือการปรุงอาหาร ไม่ได้หมายถึงการกรองน้ำออก
  - match: boil
    feedback: boil คือการต้ม ไม่ได้หมายถึงการกรองน้ำออก
  hints:
  - คำกริยาที่แปลว่า "ทำให้น้ำไหลออกจากสิ่งที่อยู่ข้างใน"
  - นึกถึงสิ่งที่ทำหลังต้มเส้นเสร็จ ก่อนนำไปผัดหรือราดซอส
  solution: '*It''s the thing you use to **drain** pasta.* drain แปลว่าทำให้น้ำไหลออก'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.discussions.p015
  topics:
  - english.speaking.discussions
  difficulty: 4
  type: order
  stem: เรียงบทสนทนาเรื่องรถรับส่งนักเรียนในจังหวัดเชียงใหม่ที่มีการแย้งอย่างสุภาพและกลับมาหาข้อตกลงให้ถูกลำดับ
  items:
  - I think we should all use the bus instead of driving.
  - Sorry to interrupt, but not everyone lives near a bus stop.
  - That's a fair point. Could we consider a shuttle for those students?
  - I see your point, although the shuttle might cost too much.
  - So, it seems we agree on the bus, but we need to check how much a shuttle would cost.
  hints:
  - ประโยคแรกเป็นความเห็นที่ถูกแย้งทีหลัง
  - การสรุปข้อตกลงอยู่ท้ายสุด
  solution: ลำดับคือ เสนอความเห็น → ขัดจังหวะอย่างสุภาพและแย้ง → รับความเห็นและเสนอทางเลือก → รับและแย้งอย่างสุภาพ → สรุป
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.discussions.p016
  topics:
  - english.speaking.discussions
  difficulty: 5
  type: mcq
