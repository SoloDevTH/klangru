<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="sans-serif" font-size="15">
  <title>ต้นไม้ค้นหาแบบทวิภาคที่ได้จากการใส่ 50, 30, 70, 20, 40, 60, 80 ราก 50 ลูกซ้าย 30 ลูกขวา 70 ใต้ 30 มี 20 และ 40 ใต้ 70 มี 60 และ 80 เส้นทางค้นหา 60 คือ 50 ไปขวา 70 ไปซ้าย 60 ใช้เทียบ 3 ครั้ง</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
  <line x1="380.0" y1="60.0" x2="210.0" y2="160.0" stroke="#374151" stroke-width="1.8"/>
  <line x1="380.0" y1="60.0" x2="550.0" y2="160.0" stroke="#c2410c" stroke-width="4"/>
  <line x1="210.0" y1="160.0" x2="120.0" y2="260.0" stroke="#374151" stroke-width="1.8"/>
  <line x1="210.0" y1="160.0" x2="300.0" y2="260.0" stroke="#374151" stroke-width="1.8"/>
  <line x1="550.0" y1="160.0" x2="460.0" y2="260.0" stroke="#c2410c" stroke-width="4"/>
  <line x1="550.0" y1="160.0" x2="640.0" y2="260.0" stroke="#374151" stroke-width="1.8"/>
  <circle cx="380.0" cy="60.0" r="26" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/>
  <text x="380.0" y="67.0" font-size="19" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">50</text>
  <circle cx="210.0" cy="160.0" r="26" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="210.0" y="167.0" font-size="19" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">30</text>
  <circle cx="550.0" cy="160.0" r="26" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/>
  <text x="550.0" y="167.0" font-size="19" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">70</text>
  <circle cx="120.0" cy="260.0" r="26" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="120.0" y="267.0" font-size="19" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">20</text>
  <circle cx="300.0" cy="260.0" r="26" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="300.0" y="267.0" font-size="19" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">40</text>
  <circle cx="460.0" cy="260.0" r="26" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/>
  <text x="460.0" y="267.0" font-size="19" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">60</text>
  <circle cx="640.0" cy="260.0" r="26" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="640.0" y="267.0" font-size="19" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">80</text>
  <text x="500.0" y="66.0" font-size="14" text-anchor="start" fill="#c2410c" xml:space="preserve">60 &gt; 50 ไปขวา</text>
  <text x="590.0" y="140.0" font-size="14" text-anchor="start" fill="#c2410c" xml:space="preserve">60 &lt; 70 ไปซ้าย</text>
  <text x="380.0" y="320.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">ทุกโหนด: ค่าทางซ้ายน้อยกว่า ค่าทางขวามากกว่าหรือเท่ากับ</text>
</svg>
