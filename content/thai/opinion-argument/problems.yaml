problems:
- id: thai.composition.opinion-argument.p001
  topics:
  - thai.composition.opinion-argument
  difficulty: 1
  type: match
  stem: จับคู่ส่วนของงานเขียนโต้แย้งเรื่อง ห้องสมุดควรเปิดช่วงพักกลางวัน (สมมติ) กับประโยคตัวอย่าง
  pairs:
  - left: ข้ออ้าง
    right: ห้องสมุดควรเปิดช่วงพักกลางวัน
  - left: เหตุผล
    right: นักเรียนที่กลับด้วยรถรับส่งไม่มีเวลาเข้าห้องสมุดหลังเลิกเรียน
  - left: หลักฐาน
    right: สำรวจสามห้องพบว่า 64 คนจาก 120 คนกลับด้วยรถรับส่ง
  - left: การหักล้าง
    right: บรรณารักษ์พักได้ ถ้าจัดนักเรียนอาสาช่วยเวรและสลับเวลาพัก
  hints:
  - ข้ออ้างคือจุดยืน เหตุผลตอบคำถาม ทำไม
  - หลักฐานเป็นข้อเท็จจริงที่ตรวจได้ การหักล้างตอบข้อแย้ง
  solution: ข้ออ้าง → จุดยืน · เหตุผล → ทำไม · หลักฐาน → ผลสำรวจ · การหักล้าง → ตอบข้อแย้งเรื่องบรรณารักษ์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.opinion-argument.p002
  topics:
  - thai.composition.opinion-argument
  difficulty: 1
  type: mcq
  stem: นักเรียนอยากเขียนบอกครูว่า **ดีใจ** ที่ครูพาไปทัศนศึกษา ข้อความใดตรงเจตนาและเหมาะสมที่สุด
  choices:
  - id: a
    text: พิพิธภัณฑ์อยู่ห่างจากโรงเรียน 20 กิโลเมตร
    feedback: เป็นข้อเท็จจริง ไม่ได้แสดงความรู้สึก
  - id: b
    text: หนูรู้สึกดีใจมากที่ได้ไปพิพิธภัณฑ์ เพราะได้เห็นของจริงที่เคยอ่านแต่ในหนังสือ ขอบคุณคุณครูค่ะ
    correct: true
    feedback: ถูก บอกความรู้สึก สาเหตุ และขอบคุณอย่างสุภาพ
  - id: c
    text: ไปเที่ยวสนุกกว่าเรียนในห้องเยอะ
    feedback: ไม่ได้บอกความดีใจต่อครูตรง ๆ และอาจฟังไม่สุภาพ
  - id: d
    text: ครูควรพาไปทุกเดือน
    feedback: เป็นข้อเสนอ ไม่ใช่การบอกความรู้สึก
  hints:
  - เจตนาคือบอกความรู้สึก
  - ความรู้สึกที่ดีบอกสาเหตุด้วย
  solution: ข้อแรกบอก **ความรู้สึก (ดีใจ) สาเหตุ และขอบคุณ** ตรงเจตนา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.opinion-argument.p003
  topics:
  - thai.composition.opinion-argument
  difficulty: 1
  type: text
  stem: ในงานเขียนโต้แย้ง ส่วนที่เป็น **จุดยืนหรือความคิดเห็นหลัก** ที่ผู้เขียนต้องการให้ผู้อ่านยอมรับ เรียกว่าอะไร
  accepted:
  - ข้ออ้าง
  - ข้อสรุป
  - ทรรศนะ
  - จุดยืน
  - claim
  misconceptions:
  - match: หลักฐาน
    feedback: หลักฐานคือข้อเท็จจริงที่หนุนเหตุผล ไม่ใช่จุดยืน
  - match: เหตุผล
    feedback: เหตุผลตอบคำถาม ทำไม ไม่ใช่ตัวจุดยืน
  hints:
  - เป็นส่วนที่เหตุผลและหลักฐานช่วยหนุน
  - ขึ้นต้นด้วย ข้อ...
  solution: เรียกว่า **ข้ออ้าง** (แบบเรียนบางเล่มเรียก ข้อสรุป หรือ ทรรศนะ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.opinion-argument.p004
  topics:
  - thai.composition.opinion-argument
  difficulty: 2
  type: mcq
  stem: ข้ออ้าง "โรงเรียนควรปลูกต้นไม้เพิ่มรอบสนาม" หลักฐานใด **หนักแน่น** ที่สุด
  choices:
  - id: a
    text: เพื่อนฉันสองคนชอบต้นไม้
    feedback: จำนวนน้อยและเป็นความชอบ ไม่เกี่ยวกับประโยชน์โดยตรง
  - id: b
    text: ต้นไม้สวยงาม ทุกคนรู้ดี
    feedback: เป็นความเห็นและเหมารวม
  - id: c
    text: โรงเรียนอื่นก็มีต้นไม้
    feedback: ไม่ได้บอกว่าเกิดประโยชน์อะไร
  - id: d
    text: ครูวิทยาศาสตร์วัดอุณหภูมิ (สมมติ) 5 วัน พบว่าใต้ร่มไม้เย็นกว่าลานโล่งเฉลี่ย 4 องศาเซลเซียส
    correct: true
    feedback: ถูก เกี่ยวข้อง วัดจริง บอกที่มา
  hints:
  - หลักฐานต้องเกี่ยวข้อง เพียงพอ และเชื่อถือได้
  - ข้อใดวัดหรือตรวจได้จริง
  solution: การ **วัดอุณหภูมิหลายวันและบอกที่มา** เป็นหลักฐานที่เกี่ยวข้องและตรวจได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.opinion-argument.p005
  topics:
  - thai.composition.opinion-argument
  difficulty: 2
  type: mcq
  stem: ข้อความใดเป็นการ **ชี้แจง**
  choices:
  - id: a
    text: การยืมหนังสือมี 3 ขั้น คือ เลือกหนังสือ ยื่นบัตร และลงชื่อ
    feedback: เป็นการอธิบายขั้นตอน
  - id: b
    text: ฉันเห็นว่าสนามควรมีหลังคา
    feedback: เป็นการแสดงความคิดเห็น
  - id: c
    text: ที่ปิดสนามฟุตบอลช่วงพักสัปดาห์นี้ เนื่องจากกำลังซ่อมท่อระบายน้ำ จะเปิดตามปกติวันจันทร์หน้า
    correct: true
    feedback: ถูก ให้ข้อเท็จจริงและเหตุผลเพื่อให้เข้าใจถูกต้อง
  - id: d
    text: หนูดีใจที่สนามสวยขึ้น
    feedback: เป็นการแสดงความรู้สึก
  hints:
  - ชี้แจงมักใช้เมื่อมีคนสงสัยหรือเข้าใจคลาดเคลื่อน
  - ดูว่ามีการบอกเหตุของการกระทำหรือไม่
  solution: ข้อแรกเป็นการ **ชี้แจง** ให้ข้อเท็จจริงและเหตุผลของการปิดสนาม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.opinion-argument.p006
  topics:
  - thai.composition.opinion-argument
  difficulty: 2
  type: mcq
  stem: อ่านร่างในภาพ ประโยคใดเป็น **หลักฐาน**
  figure:
    src: draft-opinion.svg
    alt: ร่างงานเขียนแสดงความคิดเห็นสมมติ เรื่อง วันพุธปลอดการบ้าน 6 ประโยค (1) โรงเรียนของเราควรกำหนดให้วันพุธเป็นวันปลอดการบ้าน (2) เพราะนักเรียนจะมีเวลาพักผ่อนและทำกิจกรรมชมรมมากขึ้น (3) ผลสำรวจของสภานักเรียนพบว่า นักเรียน 126 คนจาก 180 คน ใช้เวลาทำการบ้านเกินวันละ 2 ชั่วโมง (4) บางคนอาจกังวลว่าจะเรียนไม่ทัน (5) แต่ครูยังให้งานวันอื่นได้ และอาจทดลองหนึ่งภาคเรียนแล้ววัดผลการเรียน (6) ใครที่ค้านเรื่องนี้ก็คือคนที่ไม่เคยต้องทำการบ้านหนักเหมือนพวกเรา
  choices:
  - id: a
    text: ประโยค (1)
    feedback: เป็นข้ออ้าง
  - id: b
    text: ประโยค (3)
    correct: true
    feedback: ถูก เป็นผลสำรวจที่ตรวจได้และบอกที่มา
  - id: c
    text: ประโยค (2)
    feedback: เป็นเหตุผล
  - id: d
    text: ประโยค (4)
    feedback: เป็นข้อแย้งของอีกฝ่าย
  hints:
  - หลักฐานเป็นข้อเท็จจริงที่ตรวจสอบได้
  - ประโยคใดมีตัวเลขและที่มา
  solution: ประโยค **(3)** เป็นผลสำรวจของสภานักเรียน จึงเป็นหลักฐาน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.opinion-argument.p007
  topics:
  - thai.composition.opinion-argument
  difficulty: 3
  type: numeric
  stem: อ่านร่างในภาพ หลักฐานในประโยค (3) คิดเป็นร้อยละเท่าไรของนักเรียนที่ตอบแบบสำรวจ
  figure:
    src: draft-opinion.svg
    alt: ร่างงานเขียนแสดงความคิดเห็นสมมติ เรื่อง วันพุธปลอดการบ้าน 6 ประโยค (1) โรงเรียนของเราควรกำหนดให้วันพุธเป็นวันปลอดการบ้าน (2) เพราะนักเรียนจะมีเวลาพักผ่อนและทำกิจกรรมชมรมมากขึ้น (3) ผลสำรวจของสภานักเรียนพบว่า นักเรียน 126 คนจาก 180 คน ใช้เวลาทำการบ้านเกินวันละ 2 ชั่วโมง (4) บางคนอาจกังวลว่าจะเรียนไม่ทัน (5) แต่ครูยังให้งานวันอื่นได้ และอาจทดลองหนึ่งภาคเรียนแล้ววัดผลการเรียน (6) ใครที่ค้านเรื่องนี้ก็คือคนที่ไม่เคยต้องทำการบ้านหนักเหมือนพวกเรา
  answer:
    value: 70
    unit: '%'
  misconceptions:
  - match: 142.86
    feedback: หารกลับด้าน ต้องเป็น 126 ÷ 180
  - match: 126
    feedback: เป็นจำนวนคน ยังไม่ได้คิดเป็นร้อยละ
  hints:
  - ร้อยละ = ส่วน ÷ ทั้งหมด × 100
  - 126 ÷ 180 × 100
  solution: $126 \div 180 \times 100 = 70$ ร้อยละ เขียนในงานได้ว่า "ร้อยละ 70 ของผู้ตอบ"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.opinion-argument.p008
  topics:
  - thai.composition.opinion-argument
  difficulty: 3
  type: mcq
  stem: ประโยค "นักเรียนทุกคนเกลียดการบ้าน" มาจากผลสำรวจที่มีผู้ตอบไม่ชอบการบ้านร้อยละ 70 ควรแก้อย่างไรให้ **ตรงกับหลักฐาน**
  choices:
  - id: a
    text: นักเรียนทุกคนในประเทศเกลียดการบ้าน
    feedback: เหมารวมยิ่งกว่าเดิม
  - id: b
    text: ไม่มีนักเรียนคนไหนชอบการบ้าน
    feedback: ขัดกับข้อมูล เพราะมีร้อยละ 30 ที่ไม่ได้ตอบว่าไม่ชอบ
  - id: c
    text: การบ้านเป็นสิ่งเลวร้าย
    feedback: เป็นคำตัดสิน ไม่ตรงกับหลักฐาน
  - id: d
    text: นักเรียนส่วนใหญ่ที่ตอบแบบสำรวจไม่ชอบการบ้าน
    correct: true
    feedback: ถูก ใช้คำว่า ส่วนใหญ่ ตรงกับร้อยละ 70 และบอกว่ามาจากผู้ตอบ
  hints:
  - ร้อยละ 70 ใช่ ทุกคน หรือไม่
  - ใช้คำแสดงระดับความมั่นใจให้ตรงหลักฐาน
  solution: ใช้คำว่า **ส่วนใหญ่** และระบุว่า **ผู้ตอบแบบสำรวจ** แทนคำเหมารวม ทุกคน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.opinion-argument.p009
  topics:
  - thai.composition.opinion-argument
  difficulty: 3
  type: order
  stem: เรียงส่วนของงานเขียนโต้แย้งเรื่อง ห้องสมุดควรเปิดช่วงพักกลางวัน (สมมติ)
  items:
  - 'บทนำ: บอกประเด็นและจุดยืนว่าห้องสมุดควรเปิดช่วงพัก'
  - ย่อหน้าเหตุผลที่ 1 พร้อมผลสำรวจเรื่องรถรับส่ง
  - ย่อหน้าเหตุผลที่ 2 พร้อมผลสังเกตเรื่องเสียงดังช่วงพัก
  - ยกข้อแย้งเรื่องบรรณารักษ์ แล้วหักล้าง
  - 'สรุป: ย้ำจุดยืนและเสนอให้ทดลองหนึ่งภาคเรียน'
  hints:
  - เริ่มด้วยจุดยืน จบด้วยข้อเสนอ
  - ตอบข้อแย้งหลังเสนอเหตุผลของตนแล้ว
  solution: บทนำ → เหตุผล 1 → เหตุผล 2 → ข้อแย้งและการหักล้าง → สรุป
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.opinion-argument.p010
  topics:
  - thai.composition.opinion-argument
  difficulty: 3
  type: mcq
  stem: อ่านร่างในภาพ ประโยคใด **ควรตัดออก** เพราะเป็นเหตุผลวิบัติ
  figure:
    src: draft-opinion.svg
    alt: ร่างงานเขียนแสดงความคิดเห็นสมมติ เรื่อง วันพุธปลอดการบ้าน 6 ประโยค (1) โรงเรียนของเราควรกำหนดให้วันพุธเป็นวันปลอดการบ้าน (2) เพราะนักเรียนจะมีเวลาพักผ่อนและทำกิจกรรมชมรมมากขึ้น (3) ผลสำรวจของสภานักเรียนพบว่า นักเรียน 126 คนจาก 180 คน ใช้เวลาทำการบ้านเกินวันละ 2 ชั่วโมง (4) บางคนอาจกังวลว่าจะเรียนไม่ทัน (5) แต่ครูยังให้งานวันอื่นได้ และอาจทดลองหนึ่งภาคเรียนแล้ววัดผลการเรียน (6) ใครที่ค้านเรื่องนี้ก็คือคนที่ไม่เคยต้องทำการบ้านหนักเหมือนพวกเรา
  choices:
  - id: a
    text: ประโยค (4) เพราะทำให้ฝ่ายเราดูอ่อน
    feedback: การยกข้อแย้งแล้วหักล้างทำให้งานหนักแน่นขึ้น
  - id: b
    text: ประโยค (6) เพราะโจมตีตัวบุคคล ไม่ได้ตอบเหตุผลของผู้ที่ค้าน
    correct: true
    feedback: ถูก
  - id: c
    text: ประโยค (3) เพราะมีตัวเลข
    feedback: ตัวเลขที่บอกที่มาเป็นหลักฐานที่ดี
  - id: d
    text: ประโยค (1) เพราะเป็นความคิดเห็น
    feedback: ข้ออ้างต้องเป็นความคิดเห็นอยู่แล้ว
  hints:
  - ประโยคใดพูดถึงตัวคนแทนเหตุผล
  - ทวนชนิดของเหตุผลวิบัติจากบทการอ่านเชิงวิเคราะห์
  solution: ประโยค **(6)** โจมตีตัวบุคคล ควรตัดออกหรือเปลี่ยนเป็นการตอบเหตุผลของผู้ค้าน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.opinion-argument.p011
  topics:
  - thai.composition.opinion-argument
  difficulty: 4
  type: mcq
  stem: ข่าว (สมมติ) "เทศบาลจะเปลี่ยนไฟถนนในชุมชนเป็นหลอดแอลอีดีทั้งหมดภายในปีนี้" ข้อใดเป็นการ **เขียนแสดงความคิดเห็นเกี่ยวกับสาระจากสื่อ** ได้ดีที่สุด
  choices:
  - id: a
