  <text x="160.0" y="269.0" font-size="12" fill="#15211e">2</text>
  <text x="200.0" y="259.0" font-size="13" fill="#15211e">x</text><text x="46.0" y="100.0" font-size="13" fill="#15211e">y</text>
  <text x="54.0" y="129.0" font-size="13" font-weight="bold" fill="#15211e">y = x²/2</text>
  <text x="170.0" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#15211e">ประมาณความยาวส่วนโค้งด้วยเส้นตรงสี่ช่วง</text>
  <text x="170.0" y="298" text-anchor="middle" font-size="12" fill="#b4521f">เมื่อแบ่งช่วงให้ถี่ขึ้น ผลรวมจะเข้าใกล้ความยาวส่วนโค้งจริง</text>
</svg>
