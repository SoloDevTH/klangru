<text x="90.0" y="419.0" font-size="14" text-anchor="start" fill="#1f4e9c" font-weight="normal">wàibian · นอก</text>
<text x="235.0" y="374.0" font-size="14" text-anchor="middle" fill="#666" font-weight="normal">มองจากด้านหน้า</text>
