  - id: biology.plants.photosynthesis-intro.p014
    topics: [biology.plants.photosynthesis-intro]
    difficulty: 4
    type: mcq
    stem: "จากกราฟจำนวนฟองแก๊สของสาหร่ายหางกระรอกที่ระยะหลอดไฟต่าง ๆ ข้อสรุปใดถูกต้องที่สุด"
    figure: { src: p-bubbles.svg, alt: "กราฟเส้น แกนนอนเป็นระยะจากหลอดไฟถึงสาหร่าย 0 ถึง 60 เซนติเมตร แกนตั้งเป็นจำนวนฟองแก๊สต่อนาที จุดข้อมูล 10 เซนติเมตร 48 ฟอง, 20 เซนติเมตร 30, 30 เซนติเมตร 17, 40 เซนติเมตร 9, 50 เซนติเมตร 5 เส้นลดลงเมื่อระยะเพิ่มขึ้น" }
    choices:
      - { id: a, text: "แสงยิ่งเข้ม (หลอดไฟยิ่งใกล้) การสังเคราะห์ด้วยแสงยิ่งเร็ว", correct: true }
      - { id: b, text: "ระยะเพิ่มขึ้นสองเท่า จำนวนฟองลดลงครึ่งหนึ่งพอดีทุกช่วง", feedback: "จาก 10 เป็น 20 เซนติเมตร ฟองลดจาก 48 เป็น 30 ไม่ใช่ครึ่งหนึ่ง (24)" }
      - { id: c, text: "สาหร่ายใช้ออกซิเจนมากขึ้นเมื่ออยู่ใกล้หลอดไฟ", feedback: "ฟองแก๊สคือออกซิเจนที่สาหร่ายปล่อยออกมา ฟองมากแปลว่าผลิตออกซิเจนมาก" }
      - { id: d, text: "ถ้าวางห่าง 60 เซนติเมตร จะได้ฟองมากขึ้นอีก", feedback: "แนวโน้มของกราฟลดลงเมื่อระยะเพิ่ม ที่ 60 เซนติเมตรน่าจะได้น้อยกว่า 5 ฟอง" }
    hints:
