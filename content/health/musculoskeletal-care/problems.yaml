problems:
  - id: health.body.musculoskeletal-care.p001
    topics: [health.body.musculoskeletal-care]
    difficulty: 1
    type: mcq
    stem: "กระดูกใดทำหน้าที่ปกป้องสมอง"
    choices:
      - { id: a, text: "กะโหลกศีรษะ", correct: true }
      - { id: b, text: "กระดูกซี่โครง", feedback: "กระดูกซี่โครงปกป้องหัวใจและปอดในทรวงอก" }
      - { id: c, text: "กระดูกต้นแขน", feedback: "กระดูกต้นแขนช่วยในการเคลื่อนไหวแขน ไม่ได้ปกป้องสมอง" }
    hints:
      - "สมองอยู่ในศีรษะ"
      - "กระดูกที่ปกป้องต้องหุ้มรอบอวัยวะนั้น"
    solution: "กะโหลกศีรษะหุ้มรอบสมองไว้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.musculoskeletal-care.p002
    topics: [health.body.musculoskeletal-care]
    difficulty: 1
    type: match
    stem: "จับคู่กระดูกกับอวัยวะที่กระดูกนั้นปกป้อง"
    pairs:
      - { left: "กะโหลกศีรษะ", right: "สมอง" }
      - { left: "กระดูกซี่โครง", right: "หัวใจและปอด" }
      - { left: "กระดูกสันหลัง", right: "ไขสันหลัง" }
    hints:
      - "นึกถึงตำแหน่งของอวัยวะแต่ละอย่าง"
      - "ไขสันหลังอยู่ในแนวกลางหลัง"
    solution: "กะโหลก-สมอง, ซี่โครง-หัวใจและปอด, กระดูกสันหลัง-ไขสันหลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.musculoskeletal-care.p003
    topics: [health.body.musculoskeletal-care]
    difficulty: 2
    type: text
    stem: "เนื้อเยื่อเหนียวที่ยึดกล้ามเนื้อเข้ากับกระดูกเรียกว่าอะไร"
    accepted: ["เอ็นกล้ามเนื้อ", "เอ็น", "เส้นเอ็น", "tendon"]
    misconceptions:
      - { match: "เอ็นยึดข้อ", feedback: "เอ็นยึดข้อยึดกระดูกกับกระดูก ส่วนที่ยึดกล้ามเนื้อกับกระดูกคือเอ็นกล้ามเนื้อ" }
      - { match: "กระดูกอ่อน", feedback: "กระดูกอ่อนหุ้มปลายกระดูกที่ข้อต่อ ไม่ได้ยึดกล้ามเนื้อ" }
    hints:
      - "มีสองชนิด ชนิดหนึ่งยึดกระดูกกับกระดูก อีกชนิดยึดกล้ามเนื้อกับกระดูก"
      - "ชื่อของมันมีคำว่า กล้ามเนื้อ อยู่ด้วย"
    solution: "เอ็นกล้ามเนื้อ ยึดกล้ามเนื้อกับกระดูก เมื่อกล้ามเนื้อหดตัวจึงดึงกระดูกได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.musculoskeletal-care.p004
    topics: [health.body.musculoskeletal-care]
    difficulty: 2
    type: mcq
    stem: "จากภาพ แขนกำลังงอที่ข้อศอก กล้ามเนื้อใดกำลังหดตัว"
    figure:
      src: arm-muscles-quiz.svg
      alt: "แผนภาพแขนขวาที่งอที่ข้อศอก กระดูกต้นแขนตั้งตรง แขนท่อนล่างเฉียงขึ้นไปทางขวา กล้ามเนื้อ A อยู่ด้านหน้าของต้นแขน ยึดจากหัวไหล่ไปที่แขนท่อนล่างใกล้ข้อศอก กล้ามเนื้อ B อยู่ด้านหลังของต้นแขน ยึดจากหัวไหล่ไปที่ปลายข้อศอก"
    choices:
      - { id: a, text: "A กล้ามเนื้อต้นแขนด้านหน้า", correct: true }
      - { id: b, text: "B กล้ามเนื้อต้นแขนด้านหลัง", feedback: "กล้ามเนื้อด้านหลังหดตัวตอนเหยียดแขน ตอนงอแขนมันคลายตัว" }
      - { id: c, text: "ทั้ง A และ B หดตัวพร้อมกัน", feedback: "ถ้าหดพร้อมกันจะดึงสวนกัน แขนจะเกร็งอยู่กับที่ การงอแขนต้องให้มัดหนึ่งหดอีกมัดคลาย" }
    hints:
      - "กล้ามเนื้อดึงกระดูกได้ด้วยการหดตัว"
      - "มัดที่ยึดกับแขนท่อนล่างด้านหน้าจะดึงแขนท่อนล่างขึ้นมา"
    solution: "ตอนงอแขน กล้ามเนื้อต้นแขนด้านหน้า (A) หดตัวดึงแขนท่อนล่างขึ้น ส่วนด้านหลัง (B) คลายตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.musculoskeletal-care.p005
    topics: [health.body.musculoskeletal-care]
    difficulty: 2
    type: mcq
    stem: "ข้อต่อใดหมุนได้หลายทิศทาง"
    choices:
      - { id: a, text: "ข้อไหล่", correct: true }
      - { id: b, text: "ข้อศอก", feedback: "ข้อศอกเป็นข้อต่อแบบบานพับ งอและเหยียดได้ทางเดียว" }
      - { id: c, text: "ข้อเข่า", feedback: "ข้อเข่าเป็นข้อต่อแบบบานพับ งอและเหยียดได้ทางเดียว" }
    hints:
      - "ลองหมุนแขนเป็นวงกลม ข้อต่อใดทำให้หมุนได้"
      - "ข้อต่อแบบลูกกลมในเบ้าหมุนได้หลายทิศ"
    solution: "ข้อไหล่เป็นข้อต่อแบบลูกกลมในเบ้า จึงหมุนแขนได้หลายทิศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.musculoskeletal-care.p006
    topics: [health.body.musculoskeletal-care]
    difficulty: 2
    type: numeric
    stem: "ปลายฝนหนัก 35 กิโลกรัม ถ้ากระเป๋านักเรียนไม่ควรหนักเกินร้อยละ 10 ของน้ำหนักตัว กระเป๋าของปลายฝนควรหนักไม่เกินกี่กิโลกรัม (ตอบเป็นกิโลกรัม)"
    answer: { value: 3.5, tolerance: 0.05, unit: กิโลกรัม }
    misconceptions:
      - { match: 7, feedback: "7 คือร้อยละ 20 ของ 35 ข้อนี้ใช้ร้อยละ 10" }
      - { match: 35, feedback: "35 คือน้ำหนักตัว ต้องหาร้อยละ 10 ของน้ำหนักตัว" }
    hints:
      - "ร้อยละ 10 คือ 10 ส่วนใน 100 ส่วน"
      - "นำน้ำหนักตัวคูณ 10 แล้วหารด้วย 100"
    solution: "35 × 10 ÷ 100 = 3.5 กิโลกรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.musculoskeletal-care.p007
    topics: [health.body.musculoskeletal-care]
    difficulty: 3
    type: numeric
    stem: "ทารกแรกเกิดมีกระดูกราว 270 ชิ้น ผู้ใหญ่มีราว 206 ชิ้น จำนวนชิ้นลดลงราวกี่ชิ้น (ตอบเป็นชิ้น)"
    answer: { value: 64, unit: ชิ้น }
    misconceptions:
      - { match: 476, feedback: "ต้องลบจำนวนชิ้นของผู้ใหญ่ออกจากของทารก ไม่ใช่บวก" }
    hints:
      - "จำนวนลดลงเพราะกระดูกบางชิ้นเชื่อมกันเป็นชิ้นเดียว"
      - "นำจำนวนของทารกลบด้วยจำนวนของผู้ใหญ่"
    solution: "270 − 206 = 64 ชิ้น ลดลงเพราะกระดูกบางชิ้น เช่น กระดูกกะโหลกศีรษะ เชื่อมกันเมื่อโตขึ้น ไม่ได้หายไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.musculoskeletal-care.p008
    topics: [health.body.musculoskeletal-care]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดช่วยให้กระดูกและกล้ามเนื้อของเด็กแข็งแรง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ดื่มนมและกินปลาเล็กปลาน้อยเป็นประจำ", correct: true }
      - { id: b, text: "วิ่งเล่น กระโดดเชือก หรือเล่นกีฬาทุกวัน", correct: true }
      - { id: c, text: "นอนหลับให้เพียงพอ", correct: true }
      - { id: d, text: "นั่งเล่นเกมในห้องทั้งวันหยุด", feedback: "การนั่งนาน ๆ ไม่ได้ใช้กล้ามเนื้อและกระดูก และไม่ได้รับแสงแดด" }
      - { id: e, text: "งดอาหารเช้าเพื่อให้ตัวเบา", feedback: "การงดอาหารทำให้ได้โปรตีนและแคลเซียมไม่พอสำหรับการเติบโต" }
    hints:
      - "นึกถึงอาหาร การออกกำลังกาย และการพักผ่อน"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "อาหารที่มีแคลเซียมและโปรตีน การออกกำลังกาย และการนอนหลับให้พอ ช่วยให้กระดูกและกล้ามเนื้อแข็งแรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.musculoskeletal-care.p009
    topics: [health.body.musculoskeletal-care]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการยกกล่องหนักจากพื้นอย่างถูกวิธี"
    items:
      - "ยืนชิดกล่อง แยกเท้าเล็กน้อย"
      - "ย่อเข่าลง หลังตรง"
      - "จับกล่องให้แน่นแล้วดึงชิดตัว"
      - "ลุกขึ้นด้วยแรงขา หลังยังตรง"
      - "ถ้าจะหันไปทางอื่น ให้ก้าวเท้าหมุนตัว ไม่บิดเอว"
    hints:
      - "เตรียมท่าก่อนแล้วจึงยก"
      - "การหมุนตัวทำหลังจากยกขึ้นมาแล้ว"
    solution: "ยืนชิดกล่อง → ย่อเข่า หลังตรง → จับกล่องชิดตัว → ลุกขึ้นด้วยแรงขา → ก้าวเท้าหมุนตัว ไม่บิดเอว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.musculoskeletal-care.p010
    topics: [health.body.musculoskeletal-care]
    difficulty: 3
    type: numeric
    stem: "ต้นข้าวอายุ 10 ปี วันนี้ดื่มนมจืด 2 กล่อง (กล่องละ 226 มิลลิกรัม) และกินผักคะน้า 1 ทัพพี (71 มิลลิกรัม) ต้องได้แคลเซียมอีกกี่มิลลิกรัมจึงจะครบ 1,000 มิลลิกรัมตามคำแนะนำของกรมอนามัย (ตอบเป็นมิลลิกรัม)"
    answer: { value: 477, unit: มิลลิกรัม }
    misconceptions:
      - { match: 523, feedback: "523 คือแคลเซียมที่ได้แล้ว ต้องนำไปลบออกจาก 1,000" }
      - { match: 703, feedback: "นม 2 กล่องได้ 226 × 2 = 452 มิลลิกรัม อย่าลืมคูณ 2" }
    hints:
      - "หาแคลเซียมที่ได้ทั้งหมดก่อน: นม 2 กล่องกับคะน้า 1 ทัพพี"
      - "นำ 1,000 ลบด้วยแคลเซียมที่ได้"
    solution: "ได้ 226 × 2 + 71 = 523 มิลลิกรัม ขาดอีก 1,000 − 523 = 477 มิลลิกรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.musculoskeletal-care.p011
    topics: [health.body.musculoskeletal-care]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นท่านั่งเรียนที่ถูกต้อง"
    choices:
      - { id: a, text: "นั่งหลังตรงชิดพนักเก้าอี้ เท้าวางราบบนพื้น", correct: true }
      - { id: b, text: "นั่งหลังค่อม ก้มหน้าใกล้สมุด", feedback: "หลังค่อมและก้มคอนาน ๆ ทำให้ปวดคอและหลัง และสายตาเพ่งมากเกินไป" }
      - { id: c, text: "นั่งไขว่ห้างและเอียงตัวพิงโต๊ะข้างเดียว", feedback: "การเอียงตัวข้างเดียวนาน ๆ ทำให้กล้ามเนื้อสองข้างทำงานไม่เท่ากัน" }
    hints:
      - "ท่าที่ดีทำให้กระดูกสันหลังตั้งตรง"
      - "น้ำหนักควรลงทั้งสองข้างเท่ากัน"
    solution: "นั่งหลังตรงชิดพนัก เท้าวางราบ ช่วยให้กระดูกสันหลังและกล้ามเนื้อหลังไม่ต้องทำงานหนักเกินไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.musculoskeletal-care.p012
    topics: [health.body.musculoskeletal-care]
    difficulty: 4
    type: mcq
    stem: "ทำไมกล้ามเนื้อที่ขยับกระดูกจึงต้องทำงานเป็นคู่"
    choices:
      - { id: a, text: "เพราะกล้ามเนื้อหดตัวดึงได้อย่างเดียว ดันไม่ได้ จึงต้องมีอีกมัดดึงกลับ", correct: true }
      - { id: b, text: "เพราะกล้ามเนื้อมัดเดียวแรงไม่พอ", feedback: "ปัญหาไม่ใช่เรื่องแรง แต่กล้ามเนื้อดึงได้ทิศเดียว ต้องมีอีกมัดดึงในทิศตรงข้าม" }
      - { id: c, text: "เพราะกล้ามเนื้อหนึ่งมัดใช้ได้ครั้งเดียว", feedback: "กล้ามเนื้อหดและคลายได้ซ้ำหลายครั้ง" }
    hints:
      - "กล้ามเนื้อทำงานด้วยการหดตัว"
      - "การหดตัวทำให้เกิดแรงดึงหรือแรงดัน"
    solution: "กล้ามเนื้อหดตัวได้แค่ดึง เช่น งอแขนใช้กล้ามเนื้อด้านหน้าดึง เหยียดแขนใช้กล้ามเนื้อด้านหลังดึงกลับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.musculoskeletal-care.p013
    topics: [health.body.musculoskeletal-care]
    difficulty: 4
    type: match
    stem: "จับคู่สถานการณ์กับวิธีป้องกันการบาดเจ็บของกล้ามเนื้อ กระดูก และข้อ"
    pairs:
      - { left: "ก่อนเตะฟุตบอลกับเพื่อน", right: "อบอุ่นร่างกายและยืดเหยียดกล้ามเนื้อ" }
      - { left: "ปั่นจักรยานไปโรงเรียน", right: "สวมหมวกนิรภัย" }
      - { left: "เจ็บข้อเท้าระหว่างเล่น", right: "หยุดเล่นแล้วบอกครูหรือผู้ใหญ่" }
      - { left: "นั่งทำการบ้านบนคอมพิวเตอร์นาน", right: "ลุกขึ้นยืดเส้นเป็นระยะ" }
    hints:
      - "บางข้อเป็นการเตรียมตัวก่อน บางข้อเป็นสิ่งที่ทำเมื่อเกิดเหตุ"
      - "การฝืนเล่นต่อเมื่อเจ็บทำให้บาดเจ็บมากขึ้น"
    solution: "ฟุตบอล-อบอุ่นร่างกาย, จักรยาน-หมวกนิรภัย, เจ็บข้อเท้า-หยุดเล่นและบอกผู้ใหญ่, นั่งนาน-ลุกยืดเส้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.musculoskeletal-care.p014
    topics: [health.body.musculoskeletal-care]
    difficulty: 4
    type: mcq
    stem: "คุณตาของมายด์อายุ 74 ปี ลื่นล้มในห้องน้ำแล้วกระดูกสะโพกหัก แพทย์บอกว่าคุณตาเป็นโรคกระดูกพรุน ข้อใดเป็นสิ่งที่มายด์ควรทำตั้งแต่ตอนนี้เพื่อดูแลกระดูกของตนเองในอนาคต"
    choices:
      - { id: a, text: "สะสมมวลกระดูกตั้งแต่วัยเด็ก ด้วยอาหารที่มีแคลเซียมและการออกกำลังกาย", correct: true }
      - { id: b, text: "ไม่ต้องทำอะไร เพราะโรคกระดูกพรุนเกิดเฉพาะผู้สูงอายุ", feedback: "โรคนี้แสดงอาการตอนแก่ แต่มวลกระดูกสะสมมากที่สุดในวัยเด็กถึงผู้ใหญ่ตอนต้น" }
      - { id: c, text: "หลีกเลี่ยงการวิ่งและกระโดดเพื่อไม่ให้กระดูกสึก", feedback: "การวิ่งและกระโดดช่วยกระตุ้นให้กระดูกแข็งแรงขึ้น" }
    hints:
