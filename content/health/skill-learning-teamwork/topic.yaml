id: health.movement.skill-learning-teamwork
subject: health
title: { th: การเรียนรู้ทักษะกีฬา การประเมินการเล่น และการทำงานเป็นทีม, en: "Learning sport skills, assessing play and teamwork" }
summary: ขั้นของการเรียนรู้ทักษะกลไก การตั้งเป้าหมายและบันทึกพัฒนาการ การประเมินการเล่นด้วยแบบสังเกต ความแตกต่างระหว่างบุคคล บทบาทในทีม และกลวิธีรุกและป้องกันเบื้องต้น
difficulty: 3
minutes: 35
prerequisites: [health.sport.rules-fair-play]
encompasses:
  - { id: health.sport.rules-fair-play, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ขั้นของการเรียนรู้ทักษะกลไก
    src: skill-stages.svg
    alt: "แผนภาพสามขั้นเรียงเป็นขั้นบันไดขึ้น ขั้นที่ 1 ขั้นทำความเข้าใจ: รู้ว่าต้องทำอะไร ต้องคิดทุกขั้น ช้า ผิดบ่อย ไม่สม่ำเสมอ ต้องการคำแนะนำและตัวอย่าง ขั้นที่ 2 ขั้นฝึกฝน: ทำได้คล่องขึ้น ผิดน้อยลง แก้เองได้ เริ่มรู้สึกว่าทำถูกหรือผิด ต้องฝึกซ้ำและได้ข้อมูลย้อนกลับ ขั้นที่ 3 ขั้นอัตโนมัติ: ทำได้โดยไม่ต้องคิด ถูกต้องและสม่ำเสมอ สนใจเกมและเพื่อนร่วมทีมได้ ฝึกรักษาและพัฒนาต่อ"
    caption: "การฝึกที่ถูกวิธีและสม่ำเสมอพาจากขั้นที่ 1 ไปขั้นที่ 3"
  - type: worked-example
    title: ตั้งเป้าหมายและอ่านบันทึกพัฒนาการ
    problem: "น้ำตั้งเป้าหมายว่า \"ภายใน 5 สัปดาห์ จะเล่นลูกสองมือบนข้ามตาข่ายให้สำเร็จ 15 จาก 20 ครั้ง\" แล้วบันทึกผลเป็นกราฟ น้ำทำได้ตามเป้าหรือไม่ และพัฒนาขึ้นจากสัปดาห์แรกเท่าไร"
    figure:
      src: progress-log.svg
      alt: "กราฟเส้นบันทึกพัฒนาการของน้ำ จำนวนครั้งที่เล่นลูกสองมือบนข้ามตาข่ายสำเร็จจาก 20 ครั้ง สัปดาห์ 1 ได้ 6 สัปดาห์ 2 ได้ 8 สัปดาห์ 3 ได้ 11 สัปดาห์ 4 ได้ 12 สัปดาห์ 5 ได้ 15 มีเส้นประเป้าหมายที่ 15 ครั้ง"
    steps:
      - text: "ตรวจเป้าหมาย: เจาะจง (เล่นลูกสองมือบน) วัดได้ (15 จาก 20) และมีกำหนดเวลา (5 สัปดาห์) จึงเป็นเป้าหมายที่ดี"
      - text: "สัปดาห์ 5 ได้ 15 ครั้ง เท่ากับเส้นเป้าหมาย จึงทำได้ตามเป้า"
      - text: "คิดเป็นร้อยละ: สัปดาห์ 1 ได้ 6 ÷ 20 × 100 = 30 สัปดาห์ 5 ได้ 15 ÷ 20 × 100 = 75"
      - text: "พัฒนาขึ้น 15 − 6 = 9 ครั้ง หรือจากร้อยละ 30 เป็นร้อยละ 75"
        why: "ช่วงสัปดาห์ 3 ถึง 4 เพิ่มเพียง 1 ครั้ง น้ำจึงอาจลองเปลี่ยนวิธีฝึกเมื่อผลเริ่มนิ่ง"
    answer: "ทำได้ตามเป้า และพัฒนาจาก 6 เป็น 15 ครั้ง (ร้อยละ 30 เป็นร้อยละ 75)"
  - { type: check, problem: health.movement.skill-learning-teamwork.p004, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: ใช้ความสามารถของตนเพื่อทีม
    problem: "ในการแข่งฟุตซอล ต้นเป็นคนยิงประตูเก่งที่สุดในทีม แต่ช่วงนี้ถูกคู่แข่งประกบสองคนทุกครั้ง ต้นยังพยายามเลี้ยงฝ่าเข้าไปยิงเอง ทีมเสียบอลบ่อย ต้นควรปรับอย่างไร"
    steps:
      - text: "สังเกตสถานการณ์: คู่แข่งใช้สองคนประกบต้น แปลว่าต้องมีเพื่อนร่วมทีมอย่างน้อยหนึ่งคนที่ว่าง"
        why: "ฝ่ายละ 5 คน ถ้าคู่แข่งใช้สองคนกับต้น การป้องกันที่เหลือจะบางลง"
      - text: "ใช้ความสามารถของตนเพื่อทีม: ดึงคู่แข่งสองคนเข้าหาตัว แล้วส่งให้เพื่อนที่ว่าง"
      - text: "ลดความเป็นตัวตน: ยอมให้เพื่อนเป็นคนยิง แล้ววิ่งหาที่ว่างใหม่เพื่อรับบอลคืน"
      - text: "สื่อสารกับทีมช่วงพัก ตกลงกลวิธีร่วมกัน และไม่โทษกันเมื่อพลาด"
    answer: "ใช้การที่ถูกประกบสองคนสร้างพื้นที่ให้เพื่อน ส่งให้คนที่ว่าง แล้ววิ่งหาที่ว่างใหม่ ทีมจะได้โอกาสยิงมากขึ้น"
  - { type: check, problem: health.movement.skill-learning-teamwork.p008 }
glossary:
  - { term: ทักษะกลไก, definition: "ความสามารถในการเคลื่อนไหวร่างกายอย่างแม่นยำและมีประสิทธิภาพ เช่น ส่ง รับ เลี้ยง เสิร์ฟ" }
  - { term: ข้อมูลย้อนกลับ, definition: "ข้อมูลที่บอกว่าทำได้ดีหรือควรแก้ตรงไหน ได้จากครู เพื่อน วิดีโอ หรือความรู้สึกของตนเอง" }
  - { term: แบบสังเกต, definition: "รายการพฤติกรรมที่ใช้ติ๊กว่าผู้เล่นทำได้หรือยังไม่ได้ ใช้ประเมินตนเองและผู้อื่น" }
  - { term: กลวิธี, definition: "วิธีเล่นที่ทีมเลือกใช้ในการรุกและการป้องกันตามสถานการณ์" }
  - { term: การประกบตัว, definition: "การป้องกันที่ผู้เล่นแต่ละคนดูแลคู่แข่งหนึ่งคน" }
flashcards:
  - { front: "ขั้นของการเรียนรู้ทักษะกลไกมีอะไรบ้าง", back: "ขั้นทำความเข้าใจ → ขั้นฝึกฝน → ขั้นอัตโนมัติ" }
  - { front: "เป้าหมายการฝึกที่ดีมีลักษณะอย่างไร", back: "เจาะจง วัดได้ ทำได้จริง เกี่ยวกับสิ่งที่ฝึก และมีกำหนดเวลา" }
  - { front: "ประเมินเพื่อนอย่างไรให้เป็นประโยชน์", back: "บอกตามที่เห็นจากแบบสังเกต ชมสิ่งที่ทำได้ก่อน แล้วบอกสิ่งที่ควรแก้ 1–2 ข้อ" }
  - { front: "ลดความเป็นตัวตนในทีมหมายถึงอะไร", back: "เลือกทางที่ดีที่สุดสำหรับทีม เช่น ส่งให้เพื่อนที่ว่าง ไม่เล่นเพื่อให้ตัวเองเด่น" }
