<text x="225.0" y="65.0" text-anchor="middle" fill="#15211e" font-size="14">ปั๊มไฟฟ้า</text>
<rect x="310.0" y="30.0" width="150.0" height="60.0" rx="6" fill="#fff4e0" stroke="#c26a00" stroke-width="3"/>
<text x="385.0" y="65.0" text-anchor="middle" fill="#15211e" font-size="14">ปั๊มพลังแสงอาทิตย์</text>
<rect x="470.0" y="30.0" width="150.0" height="60.0" rx="6" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
<text x="545.0" y="65.0" text-anchor="middle" fill="#15211e" font-size="14">ปั๊มมือ</text>
<rect x="20.0" y="102.0" width="120.0" height="60.0" rx="6" fill="#eef3f8" stroke="#15211e" stroke-width="2"/>
<text x="80.0" y="137.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">กรอง</text>
<rect x="150.0" y="102.0" width="150.0" height="60.0" rx="6" fill="#fff4e0" stroke="#c26a00" stroke-width="3"/>
<text x="225.0" y="137.0" text-anchor="middle" fill="#15211e" font-size="14">กรองทรายช้า</text>
<rect x="310.0" y="102.0" width="150.0" height="60.0" rx="6" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
<text x="385.0" y="137.0" text-anchor="middle" fill="#15211e" font-size="14">ไส้กรองเซรามิก</text>
<rect x="20.0" y="174.0" width="120.0" height="60.0" rx="6" fill="#eef3f8" stroke="#15211e" stroke-width="2"/>
