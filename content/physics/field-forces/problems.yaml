    choices:
      - { id: a, text: "ห่างกัน 1 cm", correct: true }
      - { id: b, text: "ห่างกัน 6 cm", feedback: "ข้อนี้ใช้ได้กับแม่เหล็กที่ดูดกัน แม่เหล็กที่ผลักกันต้องออกแรงกดให้เข้าใกล้กัน ยิ่งใกล้ยิ่งเก็บพลังงานมาก" }
      - { id: c, text: "เท่ากันทุกแบบ เพราะเป็นแม่เหล็กคู่เดิม", feedback: "พลังงานศักย์ขึ้นกับตำแหน่งของวัตถุที่ออกแรงต่อกัน เมื่อการจัดตำแหน่งเปลี่ยน พลังงานที่สะสมก็เปลี่ยน" }
    hints:
      - "ถ้าปล่อยมือ แบบใดแม่เหล็กจะพุ่งแยกออกจากกันแรงที่สุด"
      - "ต้องออกแรงทำงานมากที่สุดเพื่อจัดให้เป็นแบบใด"
    solution: "แม่เหล็กที่ผลักกันต้องถูกกดให้เข้าใกล้กัน ยิ่งใกล้ยิ่งต้องทำงานมาก งานนั้นเก็บไว้เป็นพลังงานศักย์ แบบห่าง 1 cm จึงเก็บพลังงานมากที่สุด และเมื่อปล่อยมือจะพุ่งแยกออกเร็วที่สุด"
