problems:
  - id: engineering.circuits.dc-analysis.p001
    topics: [engineering.circuits.dc-analysis]
    difficulty: 1
    type: mcq
    stem: "กฎกระแสของเคียร์ชฮอฟฟ์ (KCL) มาจากหลักการใด"
    choices:
      - { id: a, text: "การอนุรักษ์ประจุ ประจุไม่สะสมและไม่หายไปที่โนด", correct: true }
      - { id: b, text: "การอนุรักษ์พลังงาน", feedback: "การอนุรักษ์พลังงาน (ศักย์มีค่าเดียว) เป็นที่มาของกฎแรงดัน KVL" }
      - { id: c, text: "กฎของโอห์ม", feedback: "KCL ใช้ได้กับทุกอุปกรณ์ ไม่จำเป็นต้องเป็นตัวต้านทาน จึงไม่ได้มาจากกฎของโอห์ม" }
      - { id: d, text: "กฎข้อที่สามของนิวตัน", feedback: "KCL เกี่ยวกับการไหลของประจุ ไม่ใช่แรงกิริยาและปฏิกิริยา" }
    hints:
      - "กระแสคืออัตราการไหลของประจุ"
      - "ถ้ากระแสเข้าไม่เท่ากับกระแสออก ประจุที่โนดจะเป็นอย่างไร"
    solution: "ในนามธรรมแบบก้อน ประจุไม่สะสมที่โนด ประจุที่ไหลเข้าต่อวินาทีจึงเท่ากับที่ไหลออก นี่คือการอนุรักษ์ประจุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p002
    topics: [engineering.circuits.dc-analysis]
    difficulty: 1
    type: numeric
    stem: "ที่โนดหนึ่ง มีกระแส $3\\ \\mathrm{A}$ และ $5\\ \\mathrm{A}$ ไหลเข้า และกระแส $2\\ \\mathrm{A}$ ไหลออกทางสายหนึ่ง กระแสในสายเส้นที่สี่ซึ่งไหลออกเป็นกี่แอมแปร์"
    answer: { value: 6, tolerance: 0, unit: A }
    misconceptions:
      - { match: 10, feedback: "บวกทุกกระแสโดยไม่สนทิศ กระแส 2 A ไหลออก ต้องนับอยู่ฝั่งเดียวกับกระแสที่ต้องการหา" }
      - { match: 0, feedback: "KCL บอกว่าผลรวมเป็นศูนย์เมื่อนับเครื่องหมายแล้ว ไม่ได้บอกว่ากระแสในสายที่เหลือเป็นศูนย์" }
    hints:
      - "กระแสเข้ารวม = กระแสออกรวม"
      - "$3 + 5 = 2 + I$"
    solution: "$3 + 5 = 2 + I$ ได้ $I = 6\\ \\mathrm{A}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p003
    topics: [engineering.circuits.dc-analysis]
    difficulty: 2
    type: numeric
    stem: "วงปิดหนึ่งมีแบตเตอรี่ $12\\ \\mathrm{V}$ และตัวต้านทานสามตัวต่ออนุกรม วัดแรงดันคร่อมสองตัวแรกได้ $5\\ \\mathrm{V}$ และ $4\\ \\mathrm{V}$ แรงดันคร่อมตัวที่สามเป็นกี่โวลต์"
    answer: { value: 3, tolerance: 0, unit: V }
    misconceptions:
      - { match: 21, feedback: "บวกแรงดันทั้งหมด แต่ KVL บอกว่าแรงดันที่ลดลงในตัวต้านทานรวมกันเท่ากับแรงดันของแหล่งจ่าย" }
      - { match: 4, feedback: "ตัวต้านทานต่ออนุกรมไม่จำเป็นต้องมีแรงดันเท่ากัน ต้องใช้ KVL" }
    hints:
      - "เดินรอบวง ผลรวมแรงดันเป็นศูนย์"
      - "$12 = 5 + 4 + V_3$"
    solution: "$12 - 5 - 4 - V_3 = 0$ ได้ $V_3 = 3\\ \\mathrm{V}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p004
    topics: [engineering.circuits.dc-analysis]
    difficulty: 2
    type: numeric
    stem: "วงจรแบ่งแรงดันในเครื่องวัดอุณหภูมิของฟาร์มเห็ดแห่งหนึ่ง (ค่าสมมติ) ต่อตัวต้านทาน $2\\ \\mathrm{k\\Omega}$ อนุกรมกับ $4\\ \\mathrm{k\\Omega}$ คร่อมแหล่งจ่าย $12\\ \\mathrm{V}$ แรงดันคร่อมตัวต้านทาน $4\\ \\mathrm{k\\Omega}$ เป็นกี่โวลต์"
    answer: { value: 8, tolerance: 0.01, unit: V }
    misconceptions:
      - { match: 4, feedback: "นี่คือแรงดันคร่อม $2\\ \\mathrm{k\\Omega}$ ตัวที่ความต้านทานมากได้แรงดันมากกว่า" }
      - { match: 6, feedback: "แรงดันไม่ได้แบ่งครึ่ง แบ่งตามสัดส่วนความต้านทาน" }
    hints:
      - "$V_2 = V\\,\\dfrac{R_2}{R_1 + R_2}$"
      - "$12 \\times \\tfrac{4}{6}$"
    solution: "$V = 12 \\times \\dfrac{4}{2 + 4} = 8\\ \\mathrm{V}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p005
    topics: [engineering.circuits.dc-analysis]
    difficulty: 2
    type: match
    stem: "จับคู่วิธีวิเคราะห์วงจรกับสถานการณ์ที่เหมาะ"
    pairs:
      - { left: "วิธีแรงดันโนด", right: "วงจรมีโนดน้อยและมีแหล่งจ่ายกระแส" }
      - { left: "วิธีกระแสเมช", right: "วงจรบนระนาบที่มีเมชน้อยและมีแหล่งจ่ายแรงดัน" }
      - { left: "การทับซ้อน", right: "ต้องการดูผลของแหล่งจ่ายแต่ละตัวแยกกัน" }
      - { left: "วงจรสมมูลเทวินิน", right: "ต้องลองเปลี่ยนค่าโหลดหลายค่า" }
    hints:
      - "จำนวนสมการของแต่ละวิธีขึ้นกับอะไร"
      - "วงจรสมมูลช่วยเมื่อส่วนที่เหลือของวงจรคงเดิม"
    solution: "วิธีโนดใช้สมการเท่าจำนวนโนดลบหนึ่ง และเขียนแหล่งจ่ายกระแสได้ตรง วิธีเมชใช้สมการเท่าจำนวนเมช การทับซ้อนแยกผลของแต่ละแหล่ง วงจรเทวินินลดวงจรเหลือสองอุปกรณ์จึงเปลี่ยนโหลดได้ง่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p006
    topics: [engineering.circuits.dc-analysis]
    difficulty: 3
    type: numeric
    stem: "ใช้วิธีแรงดันโนดกับวงจรในภาพ (เส้นล่างเป็นกราวด์) แรงดันที่โนด 2 เป็นกี่โวลต์ (ทศนิยม 2 ตำแหน่ง)"
    figure: { src: p-node.svg, alt: "วงจรมีสี่กิ่งแนวตั้งต่อระหว่างเส้นบนกับเส้นล่างที่เป็นกราวด์ กิ่งซ้ายสุดเป็นแหล่งจ่ายกระแส 2 A ทิศขึ้นเข้าสู่โนด 1 กิ่งที่สองเป็นตัวต้านทาน 10 Ω จากโนด 1 ลงกราวด์ ระหว่างโนด 1 กับโนด 2 มีตัวต้านทาน 5 Ω กิ่งที่สามเป็นตัวต้านทาน 20 Ω จากโนด 2 ลงกราวด์ กิ่งขวาสุดเป็นแหล่งจ่ายกระแส 3 A ทิศขึ้นเข้าสู่โนด 2" }
    answer: { value: 37.14, tolerance: 0.05, unit: V }
    misconceptions:
      - { match: 11.43, feedback: "ลืมแหล่งจ่ายกระแส 3 A ที่ไหลเข้าโนด 2" }
      - { match: 31.43, feedback: "นี่คือแรงดันที่โนด 1" }
    hints:
      - "KCL โนด 1: $\\dfrac{V_1}{10} + \\dfrac{V_1 - V_2}{5} = 2$ · โนด 2: $\\dfrac{V_2}{20} + \\dfrac{V_2 - V_1}{5} = 3$"
      - "จัดรูปเป็น $0.3V_1 - 0.2V_2 = 2$ และ $-0.2V_1 + 0.25V_2 = 3$"
    solution: "แก้ระบบ $0.3V_1 - 0.2V_2 = 2$ และ $-0.2V_1 + 0.25V_2 = 3$ ได้ $V_1 = 31.43\\ \\mathrm{V}$ และ $V_2 = 37.14\\ \\mathrm{V}$ (กระแสใน $5\\ \\Omega$ ไหลจากโนด 2 ไปโนด 1 ขนาด $1.14\\ \\mathrm{A}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p007
    topics: [engineering.circuits.dc-analysis]
    difficulty: 3
    type: numeric
    stem: "วงจรในภาพมีแหล่งจ่าย $20\\ \\mathrm{V}$ และ $10\\ \\mathrm{V}$ (ขั้วบวกด้านบนทั้งคู่) กระแสในตัวต้านทาน $6\\ \\Omega$ ที่อยู่กลางวงจรเป็นกี่แอมแปร์ (ทศนิยม 2 ตำแหน่ง)"
    figure: { src: p-mesh.svg, alt: "วงจรสามกิ่งแนวตั้งต่อกับเส้นล่างร่วมกัน กิ่งซ้ายเป็นแหล่งจ่าย 20 V ขั้วบวกด้านบน กิ่งกลางเป็นตัวต้านทาน 6 Ω กิ่งขวาเป็นแหล่งจ่าย 10 V ขั้วบวกด้านบน เส้นบนมีตัวต้านทาน 4 Ω ระหว่างกิ่งซ้ายกับกิ่งกลาง และ 3 Ω ระหว่างกิ่งกลางกับกิ่งขวา" }
    answer: { value: 1.85, tolerance: 0.01, unit: A }
    misconceptions:
      - { match: 2.22, feedback: "นี่คือกระแสเมชซ้าย $I_1$ ตัวต้านทานกลางมีกระแส $I_1 - I_2$" }
      - { match: 2.59, feedback: "บวกกระแสเมช แต่สองเมชวนตามเข็มนาฬิกาทั้งคู่ จึงผ่านตัวต้านทานกลางในทิศตรงข้ามกัน ต้องลบกัน" }
    hints:
      - "เมชซ้าย: $20 = 4I_1 + 6(I_1 - I_2)$ · เมชขวา: $0 = 6(I_2 - I_1) + 3I_2 + 10$"
      - "หรือใช้วิธีโนดที่โนดบนกลาง: $\\dfrac{V - 20}{4} + \\dfrac{V}{6} + \\dfrac{V - 10}{3} = 0$"
    solution: "แก้ได้ $I_1 = 2.222\\ \\mathrm{A}$, $I_2 = 0.370\\ \\mathrm{A}$ กระแสใน $6\\ \\Omega$ $= 1.85\\ \\mathrm{A}$ ไหลลง (ตรวจด้วยวิธีโนด: $V = 100/9 = 11.11\\ \\mathrm{V}$ และ $11.11/6 = 1.85\\ \\mathrm{A}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p008
    topics: [engineering.circuits.dc-analysis]
    difficulty: 3
    type: numeric
    stem: "จากวงจรในภาพ แรงดันเทวินิน $V_{Th}$ ระหว่างขั้ว a กับ b เป็นกี่โวลต์"
    figure: { src: p-thevenin.svg, alt: "แหล่งจ่าย 24 V ขั้วบวกด้านบนอยู่กิ่งซ้าย ต่อผ่านตัวต้านทาน 6 Ω ไปยังโนดกลาง จากโนดกลางมีตัวต้านทาน 12 Ω ลงเส้นล่าง และมีตัวต้านทาน 4 Ω ต่อไปยังขั้ว a เส้นล่างต่อไปยังขั้ว b ขั้ว a และ b เปิดอยู่" }
    answer: { value: 16, tolerance: 0.05, unit: V }
    misconceptions:
      - { match: 24, feedback: "ตัวต้านทาน 6 Ω กับ 12 Ω แบ่งแรงดันกัน แรงดันขั้วเปิดจึงน้อยกว่าแหล่งจ่าย" }
      - { match: 8, feedback: "นี่คือแรงดันคร่อม 6 Ω ขั้ว a ต่อกับโนดกลางผ่าน 4 Ω ซึ่งไม่มีกระแส" }
    hints:
      - "ขั้วเปิด ไม่มีกระแสผ่าน 4 Ω แรงดันที่ a จึงเท่ากับแรงดันที่โนดกลาง"
      - "โนดกลางได้จากตัวแบ่งแรงดัน 6 Ω กับ 12 Ω"
    solution: "$V_{Th} = 24 \\times \\dfrac{12}{6 + 12} = 16\\ \\mathrm{V}$ ตัวต้านทาน 4 Ω ไม่มีกระแสจึงไม่มีแรงดันตก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p009
    topics: [engineering.circuits.dc-analysis]
    difficulty: 3
    type: numeric
    stem: "จากวงจรเดียวกัน ($24\\ \\mathrm{V}$, $6\\ \\Omega$, $12\\ \\Omega$, $4\\ \\Omega$) ความต้านทานเทวินิน $R_{Th}$ ที่มองเข้าไปจากขั้ว a b เป็นกี่โอห์ม"
    figure: { src: p-thevenin.svg, alt: "แหล่งจ่าย 24 V ขั้วบวกด้านบนอยู่กิ่งซ้าย ต่อผ่านตัวต้านทาน 6 Ω ไปยังโนดกลาง จากโนดกลางมีตัวต้านทาน 12 Ω ลงเส้นล่าง และมีตัวต้านทาน 4 Ω ต่อไปยังขั้ว a เส้นล่างต่อไปยังขั้ว b" }
    answer: { value: 8, tolerance: 0.01, unit: Ω }
    misconceptions:
      - { match: 22, feedback: "บวกทุกตัวอนุกรม แต่เมื่อลัดวงจรแหล่งจ่าย 6 Ω กับ 12 Ω ต่อขนานกัน" }
      - { match: 16, feedback: "ไม่ได้ปิดแหล่งจ่าย ถ้าแหล่งจ่ายถูกลัดวงจร 6 Ω จะต่อขนานกับ 12 Ω ไม่ใช่อนุกรม" }
    hints:
      - "ปิดแหล่งจ่ายแรงดันโดยลัดวงจร"
      - "$6\\ \\Omega \\parallel 12\\ \\Omega$ แล้วอนุกรมกับ $4\\ \\Omega$"
    solution: "$R_{Th} = \\dfrac{6 \\times 12}{6 + 12} + 4 = 4 + 4 = 8\\ \\Omega$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p010
    topics: [engineering.circuits.dc-analysis]
    difficulty: 4
    type: numeric
    stem: "ต่อโหลดที่ขั้ว a b ของวงจรเดียวกัน ($V_{Th} = 16\\ \\mathrm{V}$, $R_{Th} = 8\\ \\Omega$) โหลดที่เลือกให้ได้กำลังสูงสุดจะได้รับกำลังกี่วัตต์"
    answer: { value: 8, tolerance: 0.01, unit: W }
    misconceptions:
      - { match: 32, feedback: "ใช้ $V_{Th}^2/R_{Th}$ แต่เมื่อ $R_L = R_{Th}$ แรงดันคร่อมโหลดเหลือครึ่งเดียว กำลังจึงเป็น $V_{Th}^2/(4R_{Th})$" }
      - { match: 16, feedback: "นับกำลังรวมทั้ง $R_{Th}$ และโหลด โหลดได้เพียงครึ่งหนึ่ง" }
    hints:
      - "กำลังสูงสุดเมื่อ $R_L = R_{Th}$"
      - "$P_{\\max} = V_{Th}^2/(4R_{Th})$"
    solution: "$R_L = 8\\ \\Omega$ กระแส $16/16 = 1\\ \\mathrm{A}$ $P = 1^2 \\times 8 = 8\\ \\mathrm{W}$ ตรงกับ $16^2/(4 \\times 8) = 8\\ \\mathrm{W}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p011
    topics: [engineering.circuits.dc-analysis]
    difficulty: 4
    type: numeric
    stem: "แหล่งจ่าย $10\\ \\mathrm{V}$ ต่อผ่าน $5\\ \\Omega$ ไปยังโนด a แหล่งจ่ายกระแส $2\\ \\mathrm{A}$ ป้อนกระแสเข้าโนด a และมีตัวต้านทาน $20\\ \\Omega$ จากโนด a ลงกราวด์ (ขั้วลบของแหล่งแรงดันและแหล่งกระแสต่อกราวด์) ใช้การทับซ้อนหาแรงดันที่โนด a (โวลต์)"
    answer: { value: 16, tolerance: 0.05, unit: V }
    misconceptions:
      - { match: 8, feedback: "คิดผลของแหล่งจ่ายเพียงตัวเดียว การทับซ้อนต้องรวมผลของทั้งสองแหล่ง ซึ่งบังเอิญได้ 8 V เท่ากัน" }
      - { match: 48, feedback: "ตอนคิดผลของแหล่งกระแส ลืมลัดวงจรแหล่งแรงดัน ทำให้ใช้ 20 Ω อย่างเดียว ต้องใช้ $5 \\parallel 20$" }
    hints:
      - "แหล่งแรงดันอย่างเดียว (เปิดวงจรแหล่งกระแส): ตัวแบ่งแรงดัน $10 \\times \\tfrac{20}{25}$"
      - "แหล่งกระแสอย่างเดียว (ลัดวงจรแหล่งแรงดัน): $2 \\times (5 \\parallel 20)$"
    solution: "แหล่งแรงดันอย่างเดียว: $V' = 10 \\times \\dfrac{20}{25} = 8\\ \\mathrm{V}$ แหล่งกระแสอย่างเดียว: $5 \\parallel 20 = 4\\ \\Omega$ $V'' = 2 \\times 4 = 8\\ \\mathrm{V}$ รวม $V_a = 16\\ \\mathrm{V}$ (ตรวจ KCL: $\\tfrac{16 - 10}{5} + \\tfrac{16}{20} = 1.2 + 0.8 = 2\\ \\mathrm{A}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.circuits.dc-analysis.p012
    topics: [engineering.circuits.dc-analysis]
    difficulty: 4
    type: numeric
    stem: "ในวงจรสองเมช ($20\\ \\mathrm{V}$, $4\\ \\Omega$, $6\\ \\Omega$, $3\\ \\Omega$, $10\\ \\mathrm{V}$) ตามภาพ ตัวต้านทาน $6\\ \\Omega$ รับกำลังกี่วัตต์ (ทศนิยม 1 ตำแหน่ง)"
    figure: { src: p-mesh.svg, alt: "วงจรสามกิ่งแนวตั้งต่อกับเส้นล่างร่วมกัน กิ่งซ้ายเป็นแหล่งจ่าย 20 V ขั้วบวกด้านบน กิ่งกลางเป็นตัวต้านทาน 6 Ω กิ่งขวาเป็นแหล่งจ่าย 10 V ขั้วบวกด้านบน เส้นบนมีตัวต้านทาน 4 Ω ระหว่างกิ่งซ้ายกับกิ่งกลาง และ 3 Ω ระหว่างกิ่งกลางกับกิ่งขวา" }
    answer: { value: 20.6, tolerance: 0.1, unit: W }
    misconceptions:
      - { match: 29.6, feedback: "ใช้กระแสเมช $I_1 = 2.22\\ \\mathrm{A}$ แทนกระแสจริงใน 6 Ω ซึ่งคือ $I_1 - I_2$" }
      - { match: 66.7, feedback: "ใช้ $V^2/R$ กับแรงดันของแหล่ง 20 V แต่แรงดันคร่อม 6 Ω คือแรงดันที่โนดกลาง" }
    hints:
      - "หาแรงดันที่โนดบนกลางก่อน ($V = 100/9\\ \\mathrm{V}$)"
      - "$P = V^2/R$"
    solution: "$V = 11.11\\ \\mathrm{V}$ $P = 11.11^2/6 = 20.6\\ \\mathrm{W}$ (หรือ $1.852^2 \\times 6$)"
