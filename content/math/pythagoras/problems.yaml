      - "ได้สามเหลี่ยมมุมฉากที่มีด้านตรงข้ามมุมฉาก $4.5\\ \\mathrm{m}$ และขาข้างหนึ่งเป็นครึ่งของ $7.2\\ \\mathrm{m}$"
