<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="sans-serif" font-size="14">
<title>เปรียบเทียบความยาววันของพืชวันสั้นกับพืชวันยาว เทียบกับความยาววันวิกฤติ 12 ชั่วโมง</title>
<rect x="0" y="0" width="860" height="330" fill="#ffffff"/>
<text x="30" y="96" fill="#263238" font-weight="bold">วัน 10 ชม.</text>
<rect x="150" y="70" width="430" height="40" fill="#424242" rx="6"/>
<rect x="150" y="70" width="179.2" height="40" fill="#fff59d" rx="6"/>
<text x="239.6" y="96" text-anchor="middle" fill="#5d4037">แสง 10 ชม.</text>
<text x="454.6" y="96" text-anchor="middle" fill="#eceff1">มืด 14 ชม.</text>
<text x="594" y="88" fill="#1b5e20" font-weight="bold">พืชวันสั้น: ออกดอก</text>
<text x="594" y="108" fill="#1b5e20" font-weight="bold">พืชวันยาว: ไม่ออกดอก</text>
<text x="30" y="176" fill="#263238" font-weight="bold">วัน 14 ชม.</text>
<rect x="150" y="150" width="430" height="40" fill="#424242" rx="6"/>
<rect x="150" y="150" width="250.8" height="40" fill="#fff59d" rx="6"/>
<text x="275.4" y="176" text-anchor="middle" fill="#5d4037">แสง 14 ชม.</text>
<text x="490.4" y="176" text-anchor="middle" fill="#eceff1">มืด 10 ชม.</text>
<text x="594" y="168" fill="#1b5e20" font-weight="bold">พืชวันสั้น: ไม่ออกดอก</text>
<text x="594" y="188" fill="#1b5e20" font-weight="bold">พืชวันยาว: ออกดอก</text>
<text x="30" y="256" fill="#263238" font-weight="bold">วัน 12 ชม.</text>
<rect x="150" y="230" width="430" height="40" fill="#424242" rx="6"/>
<rect x="150" y="230" width="215.0" height="40" fill="#fff59d" rx="6"/>
<text x="257.5" y="256" text-anchor="middle" fill="#5d4037">แสง 12 ชม.</text>
<text x="472.5" y="256" text-anchor="middle" fill="#eceff1">มืด 12 ชม.</text>
<text x="594" y="248" fill="#1b5e20" font-weight="bold">เส้นวิกฤติ</text>
<line x1="365.0" y1="60" x2="365.0" y2="290" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<text x="369.0" y="58" fill="#c62828" font-size="13">ความยาววันวิกฤติ 12 ชม.</text>
<text x="150.0" y="312" text-anchor="middle" fill="#455a64">0 ชม.</text>
<text x="257.5" y="312" text-anchor="middle" fill="#455a64">6 ชม.</text>
<text x="365.0" y="312" text-anchor="middle" fill="#455a64">12 ชม.</text>
<text x="472.5" y="312" text-anchor="middle" fill="#455a64">18 ชม.</text>
<text x="580.0" y="312" text-anchor="middle" fill="#455a64">24 ชม.</text>
<text x="30" y="318" fill="#555" font-size="12"></text>
