- id: physics.dynamics.gravitational-energy-orbits.p012
  topics:
  - physics.dynamics.gravitational-energy-orbits
  difficulty: 3
  type: mcq
  stem: เหตุใดน้ำขึ้นน้ำลงจึงเกิดขึ้นสองครั้งต่อวันโดยประมาณทั้งที่มีดวงจันทร์ด้านเดียว
  hints:
  - ลองนึกถึงผลต่างของแรงดึงดูดที่กระทำกับโลกทั้งสามตำแหน่ง ได้แก่ ด้านใกล้ จุดกลาง และด้านไกล
  - แรงดึงดูดด้านไกลอ่อนกว่าจุดกลาง ทำให้น้ำด้านไกลยังคงนูนออกไปด้วย
  - น้ำนูนทั้งสองด้านของโลก แต่โลกหมุนผ่านทั้งสองยอดในหนึ่งวันโดยประมาณ
  multiple: false
  choices:
  - id: a
    text: เพราะแรงไทดัลจากผลต่างของแรงดึงดูดทำให้มีการนูนสองยอดตรงข้ามกันของโลก
    correct: true
  - id: b
    text: เพราะดวงจันทร์ดึงน้ำทั้งสองด้านด้วยแรงเท่ากัน จึงไม่มีผลต่างและไม่เกิดการนูน
    correct: false
    feedback: ถ้าแรงเท่ากันทุกจุด โลกจะเคลื่อนที่ไปทั้งก้อนโดยไม่มีน้ำขึ้นน้ำลง สิ่งที่สำคัญคือผลต่างของแรง
  - id: c
    text: เพราะโลกหมุนรอบดวงจันทร์ทุก 12 ชั่วโมงโดยตรง
    correct: false
    feedback: โลกและดวงจันทร์โคจรรอบจุดศูนย์กลางมวลร่วมกัน ไม่ได้หมุนรอบดวงจันทร์โดยตรง
  - id: d
    text: เพราะด้านที่หันเข้าหาดวงจันทร์ใกล้กว่าเท่านั้น จึงมีน้ำนูนขึ้นด้านเดียว
    correct: false
    feedback: ด้านไกลก็นูนด้วย เพราะจุดกลางโลกถูกดึงเข้าหาดวงจันทร์มากกว่าน้ำด้านไกล ทำให้น้ำด้านไกลเหลืออยู่ข้างหลัง
  solution: ผลต่างของแรงไทดัลทำให้เกิดการนูนสองยอดตรงข้ามกัน โลกหมุนผ่านทั้งสองยอดภายในราว 24 ชั่วโมง จึงเกิดน้ำขึ้นสองครั้งต่อวันโดยประมาณ (ตัวเลือก a)
