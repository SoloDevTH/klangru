    solution: "ลูกที่โยนขึ้นกลับผ่านระดับมือด้วยอัตราเร็ว $u$ ทิศลง ซึ่งเหมือนลูกที่ขว้างลงพอดี จากนั้นทั้งสองเคลื่อนที่เหมือนกัน จึงกระทบพื้นด้วย $v = \\sqrt{u^2 + 2gh}$ เท่ากัน แต่ลูกแรกเสียเวลาขึ้นและลงเพิ่มอีก $\\dfrac{2u}{g}$ จึงถึงพื้นช้ากว่า"
