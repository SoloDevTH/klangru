<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 640" width="700" height="640" font-family="sans-serif">
<title>ผังการช่วยเหลือเมื่อพบผู้หมดสติ</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="700" height="640" fill="#ffffff"/>
<rect x="140" y="15" width="220" height="44" rx="8" fill="#e8eef7" stroke="#222" stroke-width="1.5"/>
<text x="250.0" y="41.9" text-anchor="middle" font-size="14" font-weight="bold">พบคนล้มหรือบาดเจ็บ</text>
<polyline points="250,59 250,85" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/>
<polygon points="250,85.0 355.0,135 250,185.0 145.0,135" fill="#fff6d6" stroke="#222" stroke-width="1.5"/>
<text x="250" y="130.9" text-anchor="middle" font-size="14" font-weight="bold">ที่เกิดเหตุ</text>
<text x="250" y="148.9" text-anchor="middle" font-size="14" font-weight="bold">ปลอดภัยไหม</text>
<rect x="465" y="100" width="225" height="70" rx="8" fill="#fde8e8" stroke="#222" stroke-width="1.5"/>
<text x="577.5" y="120.9" text-anchor="middle" font-size="14">ไม่เข้าไป โทร 1669</text>
<text x="577.5" y="139.9" text-anchor="middle" font-size="14">(ไฟไหม้ 199 ตำรวจ 191)</text>
<text x="577.5" y="158.9" text-anchor="middle" font-size="14">รอผู้มีอุปกรณ์</text>
<polyline points="355,135 463,135" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="410" y="125" font-size="13" fill="#0a5c52" font-weight="bold" text-anchor="middle">ไม่ปลอดภัย</text>
<polyline points="250,185 250,215" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="258" y="205" font-size="13" fill="#0a5c52" font-weight="bold" text-anchor="start">ปลอดภัย</text>
<polygon points="250,215.0 355.0,265 250,315.0 145.0,265" fill="#fff6d6" stroke="#222" stroke-width="1.5"/>
<text x="250" y="260.9" text-anchor="middle" font-size="14" font-weight="bold">ตบไหล่ เรียกดัง ๆ</text>
<text x="250" y="278.9" text-anchor="middle" font-size="14" font-weight="bold">รู้สึกตัวไหม</text>
<rect x="465" y="225" width="225" height="80" rx="8" fill="#e9f5ea" stroke="#222" stroke-width="1.5"/>
<text x="577.5" y="250.9" text-anchor="middle" font-size="14">ถามอาการ ดูแลตามเหตุ</text>
<text x="577.5" y="269.9" text-anchor="middle" font-size="14">เลือดออก แผลไหม้ สำลัก</text>
<text x="577.5" y="288.9" text-anchor="middle" font-size="14">อาการหนัก โทร 1669</text>
<polyline points="355,265 463,265" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="410" y="255" font-size="13" fill="#0a5c52" font-weight="bold" text-anchor="middle">รู้สึกตัว</text>
<polyline points="250,315 250,345" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="258" y="335" font-size="13" fill="#0a5c52" font-weight="bold" text-anchor="start">ไม่รู้สึกตัว</text>
<rect x="100" y="347" width="300" height="66" rx="8" fill="#e8eef7" stroke="#222" stroke-width="1.5"/>
<text x="250.0" y="375.4" text-anchor="middle" font-size="14" font-weight="bold">ตะโกนขอความช่วยเหลือ โทร 1669</text>
<text x="250.0" y="394.4" text-anchor="middle" font-size="14" font-weight="bold">เปิดลำโพง ให้คนไปหา AED</text>
<polyline points="250,413 250,440" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/>
<polygon points="250,440.0 365.0,492 250,544.0 135.0,492" fill="#fff6d6" stroke="#222" stroke-width="1.5"/>
<text x="250" y="487.9" text-anchor="middle" font-size="14" font-weight="bold">หายใจปกติไหม</text>
<text x="250" y="505.9" text-anchor="middle" font-size="14" font-weight="bold">(ดูไม่เกิน 10 วินาที)</text>
<rect x="465" y="452" width="225" height="80" rx="8" fill="#e9f5ea" stroke="#222" stroke-width="1.5"/>
<text x="577.5" y="477.9" text-anchor="middle" font-size="14">จัดท่าพักฟื้น (นอนตะแคง)</text>
<text x="577.5" y="496.9" text-anchor="middle" font-size="14">เฝ้าดูการหายใจ</text>
<text x="577.5" y="515.9" text-anchor="middle" font-size="14">จนทีมแพทย์มาถึง</text>
<polyline points="365,492 463,492" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="415" y="482" font-size="13" fill="#0a5c52" font-weight="bold" text-anchor="middle">หายใจปกติ</text>
<polyline points="250,544 250,568" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="258" y="560" font-size="13" fill="#0a5c52" font-weight="bold" text-anchor="start">ไม่หายใจ หรือหายใจเฮือก</text>
<rect x="50" y="570" width="400" height="62" rx="8" fill="#fde8e8" stroke="#222" stroke-width="1.5"/>
<text x="250.0" y="596.4" text-anchor="middle" font-size="14" font-weight="bold">กดหน้าอกทันที แรงและเร็ว 100–120 ครั้ง/นาที</text>
<text x="250.0" y="615.4" text-anchor="middle" font-size="14" font-weight="bold">ลึก 5–6 ซม. ใช้ AED ทันทีที่มาถึง</text>
</svg>
