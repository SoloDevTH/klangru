      - { id: a, text: "ทำงานได้น้อยมาก เพราะ pH ไม่เหมาะ ประจุของบริเวณเร่งเปลี่ยนไป ทริปซินในลำไส้เล็กจึงย่อยโปรตีนต่อ", correct: true }
      - { id: b, text: "ทำงานได้ดีขึ้น เพราะ pH 8 ใกล้กลาง", feedback: "เอนไซม์แต่ละชนิดมี pH ที่เหมาะสมต่างกัน เพปซินเหมาะกับ pH ราว 2 ไม่ใช่ pH กลาง" }
      - { id: c, text: "ทำงานได้เท่าเดิม เพราะ pH ไม่มีผลต่อเอนไซม์", feedback: "pH มีผลต่อประจุและรูปร่างของบริเวณเร่ง จึงมีผลต่อการทำงานของเอนไซม์" }
      - { id: d, text: "เปลี่ยนเป็นทริปซิน", feedback: "เพปซินกับทริปซินเป็นเอนไซม์คนละชนิด สร้างจากคนละอวัยวะ เปลี่ยนเป็นกันไม่ได้" }
    hints:
      - "ดูกราฟ pH ของเพปซิน ที่ pH 8 อัตราเป็นอย่างไร"
      - "ในลำไส้เล็กมีเอนไซม์อีกชนิดที่ย่อยโปรตีนได้ดีที่ pH ราว 8"
    solution: "เพปซินมี pH ที่เหมาะสมราว 2 ที่ pH 8 ประจุของบริเวณเร่งเปลี่ยน เพปซินแทบไม่ทำงาน ในลำไส้เล็ก ทริปซินซึ่งเหมาะกับ pH ราว 8 จึงย่อยโปรตีนต่อ"
