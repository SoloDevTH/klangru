  - { title: "9.3 Use Properties of Angles, Triangles, and the Pythagorean Theorem (Prealgebra 2e, OpenStax)", url: "https://openstax.org/books/prealgebra-2e/pages/9-3-use-properties-of-angles-triangles-and-the-pythagorean-theorem", source: openstax, lang: en, license: CC-BY-NC-SA-4.0 }
