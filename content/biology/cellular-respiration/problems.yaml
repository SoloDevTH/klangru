  - id: biology.cells.cellular-respiration.p017
    topics: [biology.cells.cellular-respiration]
    difficulty: 5
    type: numeric
    stem: "อัตราส่วนการหายใจ (RQ) = จำนวนโมเลกุล CO₂ ที่ปล่อย ÷ จำนวนโมเลกุล O₂ ที่ใช้ กรดปาล์มิติกสลายตามสมการ $\\mathrm{C_{16}H_{32}O_2 + 23O_2 \\rightarrow 16CO_2 + 16H_2O}$ RQ ของการสลายกรดไขมันนี้เท่ากับเท่าไร (ตอบทศนิยม 2 ตำแหน่ง)"
