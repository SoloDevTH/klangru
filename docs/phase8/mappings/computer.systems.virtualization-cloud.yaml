topic: computer.systems.virtualization-cloud
rows:
  - { framework: acm-cs2023, indicators: ["OS-Virtualization"], coverage: partial, note: "ไฮเปอร์ไวเซอร์ชนิดที่ 1 และ 2 และการเปรียบเทียบคอนเทนเนอร์กับเครื่องเสมือนในระดับแนวคิด ยังไม่ลงรายละเอียดการจัดสรรทรัพยากรภายในไฮเปอร์ไวเซอร์ (บทเรียนส่วนเครื่องเสมือนและคอนเทนเนอร์; ภาพ vm-vs-container)" }
  - { framework: acm-cs2023, indicators: ["OS-Protection"], coverage: full, note: "การแยกกระบวนการ รายการควบคุมการเข้าถึง ความสามารถ แซนด์บ็อกซ์ และสิทธิ์น้อยที่สุด (บทเรียนส่วนการแยกในระบบปฏิบัติการ; ตัวอย่างแสดงวิธีทำการกำหนดสิทธิ์; โจทย์ p007 p011 p012)" }
  - { framework: acm-cs2023, indicators: ["SF-Security"], coverage: partial, note: "ความรับผิดชอบร่วม ช่องทางข้างเคียงระดับแนวคิด และการตั้งค่าสิทธิ์ (โจทย์ p014 p015) ยังไม่ครอบคลุมการรักษาความปลอดภัยระบบทั้งหมด" }
  - { framework: acm-cs2023, indicators: ["AR-Security"], coverage: partial, note: "การบูตที่เชื่อถือได้และพื้นที่ประมวลผลที่แยกปลอดภัยในระดับแนวคิด ไม่ลงรายละเอียดสถาปัตยกรรมชิปจริง (โจทย์ p008)" }
