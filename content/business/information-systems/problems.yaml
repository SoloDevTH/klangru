problems:
  - id: business.accounting.information-systems.p001
    topics: [business.accounting.information-systems]
    difficulty: 1
    type: match
    stem: "จับคู่สิ่งต่อไปนี้กับขั้นของการไหลของข้อมูลในระบบสารสนเทศทางการบัญชี"
    pairs:
      - { left: "พนักงานสแกนใบกำกับภาษีซื้อเข้าระบบ", right: "นำเข้าข้อมูล" }
      - { left: "ระบบผ่านรายการจากสมุดรายวันไปบัญชีแยกประเภท", right: "ประมวลผล" }
      - { left: "ผู้จัดการเปิดรายงานลูกหนี้แยกตามอายุ", right: "แสดงผล" }
      - { left: "รายชื่อลูกค้าพร้อมวงเงินเครดิตของแต่ละราย", right: "แฟ้มข้อมูลหลัก" }
    hints:
      - "ข้อมูลเข้า → ประมวลผล → ผลลัพธ์ และมีที่เก็บข้อมูล"
      - "เอกสารขั้นต้นเป็นจุดเริ่ม รายงานเป็นปลายทาง"
    solution: "สแกนใบกำกับภาษีเข้าระบบ → นำเข้า · ผ่านรายการไปบัญชีแยกประเภท → ประมวลผล · พิมพ์รายงานลูกหนี้ตามอายุ → แสดงผล · รายชื่อลูกค้าและวงเงินเครดิต → แฟ้มข้อมูลหลัก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.information-systems.p002
    topics: [business.accounting.information-systems]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็น **การควบคุมทั่วไป** (ใช้กับทั้งระบบ ไม่เฉพาะงานใดงานหนึ่ง)"
    choices:
      - { id: a, text: "สำรองข้อมูลของโปรแกรมบัญชีทุกคืนและทดสอบการกู้คืนทุกเดือน", correct: true }
      - { id: b, text: "หน้าจอบันทึกเงินเดือนไม่ยอมรับชั่วโมงทำงานเกิน 80 ชั่วโมงต่อสัปดาห์", feedback: "เป็นการตรวจขอบเขตในงานเงินเดือน (การควบคุมระบบงาน)" }
      - { id: c, text: "ระบบขายตรวจว่ายอดค้างของลูกค้าไม่เกินวงเงินเครดิตก่อนออกบิล", feedback: "เป็นการควบคุมในงานขาย (การควบคุมระบบงาน)" }
      - { id: d, text: "ช่องจำนวนเงินในใบสำคัญจ่ายรับเฉพาะตัวเลข", feedback: "เป็นการตรวจรูปแบบข้อมูลในงานหนึ่ง (การควบคุมระบบงาน)" }
    hints:
      - "การควบคุมทั่วไปดูแลสภาพแวดล้อมของระบบทั้งหมด"
      - "การควบคุมระบบงานฝังอยู่ในหน้าจอหรือขั้นตอนของงานหนึ่ง"
    solution: "การสำรองข้อมูลทุกคืนคุ้มครองข้อมูลของทุกงานในระบบ จึงเป็นการควบคุมทั่วไป ส่วนตัวเลือกอื่นเป็นการควบคุมที่ฝังในงานขายหรืองานเงินเดือน (การควบคุมระบบงาน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.information-systems.p003
    topics: [business.accounting.information-systems]
    difficulty: 2
    type: match
    stem: "จับคู่ขั้นตอนกับวงจรธุรกิจ"
    pairs:
      - { left: "ตรวจวงเงินเครดิตของลูกค้าก่อนส่งของ", right: "วงจรรายได้" }
      - { left: "จับคู่ใบสั่งซื้อ ใบรับของ และใบแจ้งหนี้ก่อนจ่ายเงินผู้ขาย", right: "วงจรค่าใช้จ่าย" }
      - { left: "คำนวณค่าจ้างจากเวลาทำงานและหักประกันสังคม", right: "วงจรเงินเดือน" }
      - { left: "ปิดบัญชีสิ้นงวดและจัดทำงบการเงิน", right: "บัญชีแยกประเภทและรายงาน" }
    hints:
      - "วงจรรายได้เกี่ยวกับการขายและรับเงิน วงจรค่าใช้จ่ายเกี่ยวกับการซื้อและจ่ายเงิน"
      - "เงินเดือนมีวงจรของตัวเอง"
    solution: "ตรวจวงเงินเครดิตก่อนส่งของ → วงจรรายได้ · จับคู่ใบสั่งซื้อ ใบรับของ ใบแจ้งหนี้ก่อนจ่ายเงิน → วงจรค่าใช้จ่าย · คำนวณค่าจ้างจากเวลาทำงาน → วงจรเงินเดือน · ปิดบัญชีและจัดทำงบการเงิน → บัญชีแยกประเภทและรายงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.information-systems.p004
    topics: [business.accounting.information-systems]
    difficulty: 2
    type: numeric
    stem: "แผ่นงานสมุดรายวันมีช่องเดบิต D2:D6 เป็น $12{,}500,\\ 3{,}200,\\ 45{,}000,\\ 860,\\ 7{,}440$ และผลรวมช่องเครดิต E2:E6 เท่ากับ $68{,}100$ สูตร `=SUM(D2:D6)-SUM(E2:E6)` ให้ผลเท่าไร (ตอบเป็นบาท)"
    answer: { value: 900, unit: "บาท" }
    hints:
      - "หาผลรวมเดบิตก่อน"
      - "นำผลรวมเดบิตลบผลรวมเครดิต ถ้าไม่เป็นศูนย์แปลว่าบันทึกไม่สมดุล"
    misconceptions:
      - { match: 69000, feedback: "นั่นคือ `SUM(D2:D6)` อย่างเดียว ยังไม่ได้ลบผลรวมเครดิต" }
      - { match: -900, feedback: "ลบกลับด้าน สูตรคือเดบิตลบเครดิต" }
    solution: "ผลรวมเดบิต $= 12{,}500 + 3{,}200 + 45{,}000 + 860 + 7{,}440 = 69{,}000$ บาท ผลของสูตร $= 69{,}000 - 68{,}100 = 900$ บาท แปลว่าบันทึกไม่สมดุล ต้องหารายการที่ผิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.information-systems.p005
    topics: [business.accounting.information-systems]
    difficulty: 2
    type: mcq
    stem: "ในแผ่นงานผังบัญชีตามภาพ สูตร `=VLOOKUP(401,A2:B9,2,FALSE)` ให้ผลเป็นอะไร"
    figure:
      src: coa-sheet.svg
      alt: "แผ่นงานชื่อผังบัญชีในสเปรดชีต คอลัมน์ A คือรหัส คอลัมน์ B คือชื่อบัญชี แถว 1 เป็นหัวตาราง แถว 2 ถึง 9 คือ 101 เงินสด, 102 ลูกหนี้การค้า, 201 เจ้าหนี้การค้า, 301 ทุน, 401 รายได้จากการขาย, 501 ค่าเช่า, 502 เงินเดือน, 503 ค่าสาธารณูปโภค"
    choices:
      - { id: a, text: "รายได้จากการขาย", correct: true }
      - { id: b, text: "401", feedback: "คอลัมน์ที่ 1 คือรหัส สูตรขอคอลัมน์ที่ 2 ซึ่งเป็นชื่อบัญชี" }
      - { id: c, text: "ทุน", feedback: "ทุนคือรหัส 301 อยู่แถวก่อนหน้า" }
      - { id: d, text: "#N/A", feedback: "#N/A เกิดเมื่อหาไม่พบ แต่รหัส 401 มีอยู่ในคอลัมน์ A" }
    hints:
      - "VLOOKUP หาค่าในคอลัมน์แรกของช่วง แล้วคืนค่าจากคอลัมน์ที่ระบุ"
      - "คอลัมน์ที่ 2 ของช่วง A2:B9 คือคอลัมน์ B"
    solution: "VLOOKUP หา $401$ ในคอลัมน์ A (แถว 6) แล้วคืนค่าคอลัมน์ที่ 2 ของช่วง คือ \"รายได้จากการขาย\" `FALSE` ทำให้หาเฉพาะค่าที่ตรงพอดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.information-systems.p006
    topics: [business.accounting.information-systems]
    difficulty: 3
    type: numeric
    stem: "จากแผ่นงานสมุดรายวันในภาพ สูตร `=SUMIF(C2:C9,101,D2:D9)-SUMIF(C2:C9,101,E2:E9)` ให้ผลเท่าไร (ตอบเป็นบาท)"
    figure:
      src: journal-sheet.svg
      alt: "แผ่นงานชื่อสมุดรายวันในสเปรดชีต คอลัมน์ A วันที่ B เลขที่ C รหัสบัญชี D เดบิต E เครดิต แถว 2 1 ม.ค. JV01 รหัส 101 เดบิต 50,000 แถว 3 1 ม.ค. JV01 รหัส 301 เครดิต 50,000 แถว 4 3 ม.ค. PV01 รหัส 501 เดบิต 8,000 แถว 5 3 ม.ค. PV01 รหัส 101 เครดิต 8,000 แถว 6 5 ม.ค. RV01 รหัส 101 เดบิต 12,500 แถว 7 5 ม.ค. RV01 รหัส 401 เครดิต 12,500 แถว 8 8 ม.ค. SV01 รหัส 102 เดบิต 9,000 แถว 9 8 ม.ค. SV01 รหัส 401 เครดิต 9,000"
    answer: { value: 54500, unit: "บาท" }
    hints:
      - "SUMIF รวมเฉพาะแถวที่คอลัมน์ C เป็น 101"
      - "ส่วนแรกรวมเดบิตของเงินสด ส่วนหลังรวมเครดิตของเงินสด"
    misconceptions:
      - { match: 62500, feedback: "นั่นคือ SUMIF ส่วนแรกอย่างเดียว ยังไม่ได้หักเครดิตของเงินสด $8{,}000$ บาท" }
      - { match: 70500, feedback: "บวกเครดิตของเงินสดเข้าไป ต้องลบ" }
    solution: "แถวที่รหัส 101: เดบิต $50{,}000$ (แถว 2) และ $12{,}500$ (แถว 6) รวม $62{,}500$ เครดิต $8{,}000$ (แถว 5) ผลลัพธ์ $= 62{,}500 - 8{,}000 = 54{,}500$ บาท คือยอดคงเหลือบัญชีเงินสด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.information-systems.p007
    topics: [business.accounting.information-systems]
    difficulty: 3
    type: numeric
    stem: "ฝ่ายขายส่งใบแจ้งหนี้ 5 ใบมาให้ฝ่ายบัญชีบันทึก พร้อมยอดรวมควบคุมที่เขียนหน้าชุดเอกสาร หลังบันทึกเสร็จ ระบบรายงานยอดที่บันทึก $18{,}450,\\ 7{,}200,\\ 9{,}900,\\ 13{,}650,\\ 4{,}800$ บาท ถ้ายอดรวมควบคุมหน้าชุดคือ $55{,}800$ บาท ยอดที่บันทึกต่างจากยอดควบคุมกี่บาท (ตอบเป็นจำนวนบวก)"
    answer: { value: 1800, unit: "บาท" }
    hints:
      - "รวมยอดที่บันทึกทั้ง 5 ใบ"
      - "เทียบกับยอดรวมควบคุม ส่วนต่างบอกว่ามีการบันทึกผิดหรือตกหล่น"
    misconceptions:
      - { match: 54000, feedback: "นั่นคือยอดที่บันทึกรวม โจทย์ถามส่วนต่างจากยอดควบคุม" }
    solution: "ยอดที่บันทึกรวม $= 54{,}000$ บาท ต่างจากยอดควบคุม $55{,}800 - 54{,}000 = 1{,}800$ บาท ระบบควรหยุดและแจ้งให้ตรวจว่าพิมพ์ยอดใดผิดหรือตกหล่นใบใด ก่อนผ่านรายการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.information-systems.p008
    topics: [business.accounting.information-systems]
    difficulty: 3
    type: mcq
    stem: "หน้าจอบันทึกค่าแรงรายวันไม่ยอมรับจำนวนชั่วโมงทำงานที่มากกว่า 16 ชั่วโมงต่อวัน การควบคุมนี้เป็นแบบใด"
    choices:
      - { id: a, text: "การตรวจขอบเขต ซึ่งเป็นการควบคุมการนำเข้า", correct: true }
      - { id: b, text: "การแบ่งแยกหน้าที่", feedback: "การแบ่งแยกหน้าที่คือแยกคนทำงานที่ขัดกัน ไม่ใช่ตรวจค่าที่พิมพ์" }
      - { id: c, text: "การสำรองข้อมูล", feedback: "การสำรองข้อมูลป้องกันข้อมูลสูญหาย ไม่ได้ตรวจความสมเหตุสมผลของค่า" }
      - { id: d, text: "การควบคุมผลลัพธ์", feedback: "การควบคุมผลลัพธ์ตรวจรายงานหลังประมวลผลแล้ว ข้อนี้ตรวจตอนนำเข้า" }
    hints:
      - "การควบคุมนี้ทำงานตอนพิมพ์ข้อมูลเข้า"
      - "มันตรวจว่าค่าอยู่ในช่วงที่เป็นไปได้หรือไม่"
    solution: "เป็น **การตรวจขอบเขต (limit/range check)** ซึ่งเป็นการควบคุมการนำเข้า อยู่ในกลุ่มการควบคุมระบบงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.information-systems.p009
    topics: [business.accounting.information-systems]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนในวงจรรายได้ของการขายเชื่อ"
    items:
      - "รับคำสั่งซื้อจากลูกค้า"
      - "ตรวจวงเงินเครดิตของลูกค้า"
      - "จัดส่งสินค้าและตัดสต็อก"
      - "ออกใบแจ้งหนี้และบันทึกลูกหนี้"
      - "รับชำระเงินและตัดยอดลูกหนี้"
    hints:
      - "ก่อนส่งของต้องแน่ใจว่าลูกค้ามีเครดิตพอ"
      - "บันทึกลูกหนี้เมื่อออกใบแจ้งหนี้ แล้วจึงรับชำระ"
    solution: "รับคำสั่งซื้อ → ตรวจวงเงินเครดิต → ส่งสินค้า → ออกใบแจ้งหนี้และบันทึกลูกหนี้ → รับชำระเงินและตัดยอดลูกหนี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.information-systems.p010
    topics: [business.accounting.information-systems]
    difficulty: 4
    type: numeric
    stem: "กิจการกำหนดรหัสลูกค้า 4 หลักแล้วต่อท้ายด้วยหลักตรวจสอบ วิธีคิด: คูณหลักที่ 1–4 ด้วยน้ำหนัก $3, 1, 3, 1$ ตามลำดับ รวมผล แล้วหลักตรวจสอบ $= (10 - \\text{เศษจากการหารผลรวมด้วย } 10)$ ถ้าได้ $10$ ให้ใช้ $0$ รหัส $4721$ มีหลักตรวจสอบเท่าไร"
    answer: { value: 4 }
    hints:
      - "$4 \\times 3 + 7 \\times 1 + 2 \\times 3 + 1 \\times 1$"
      - "หาเศษจากการหารด้วย 10 แล้วนำ 10 ลบ"
    misconceptions:
      - { match: 6, feedback: "นั่นคือเศษ ยังไม่ได้นำ $10$ ลบ" }
      - { match: 26, feedback: "นั่นคือผลรวมถ่วงน้ำหนัก ยังต้องหาเศษและนำ $10$ ลบ" }
    solution: "ผลรวม $= 12 + 7 + 6 + 1 = 26$ เศษ $= 6$ หลักตรวจสอบ $= 10 - 6 = 4$ รหัสเต็มคือ $47214$ ถ้าพนักงานพิมพ์ $47124$ (สลับหลัก) ระบบคำนวณหลักตรวจสอบได้ไม่ตรงและแจ้งเตือนทันที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.information-systems.p011
    topics: [business.accounting.information-systems]
    difficulty: 4
    type: mcq
    stem: "ร้านค้าส่ง (สมมติ) มีพนักงานบัญชีคนเดียวที่ทั้ง **บันทึกบัญชีเจ้าหนี้** **อนุมัติการจ่ายเงิน** และ **โอนเงินผ่านแอปธนาคาร** ความเสี่ยงหลักคืออะไร และควรแก้อย่างไร"
    choices:
      - { id: a, text: "อาจตั้งเจ้าหนี้ปลอมแล้วโอนเงินให้ตัวเอง ควรแบ่งแยกหน้าที่บันทึก อนุมัติ และจ่ายเงินให้คนละคน", correct: true }
      - { id: b, text: "ข้อมูลอาจสูญหาย ควรสำรองข้อมูลทุกวัน", feedback: "การสำรองข้อมูลสำคัญ แต่ไม่แก้ความเสี่ยงที่คนเดียวทำครบทุกขั้น" }
      - { id: c, text: "ไม่มีความเสี่ยง เพราะโปรแกรมบัญชีคำนวณถูกเสมอ", feedback: "โปรแกรมคำนวณถูก แต่บันทึกตามที่คนป้อน ถ้าคนป้อนรายการปลอม ระบบก็บันทึกตาม" }
      - { id: d, text: "พนักงานอาจพิมพ์ตัวเลขผิด ควรเพิ่มการตรวจรูปแบบข้อมูล", feedback: "การตรวจรูปแบบช่วยเรื่องพิมพ์ผิด แต่ความเสี่ยงหลักคือการทุจริตจากการรวมหน้าที่" }
    hints:
      - "คิดว่าคนคนเดียวทำอะไรได้บ้างโดยไม่มีใครเห็น"
      - "หลักการควบคุมทั่วไปข้อใดป้องกันเรื่องนี้"
    solution: "คนเดียวทำครบทุกขั้นจึงสร้างเจ้าหนี้ปลอม อนุมัติ และโอนเงินให้ตัวเองได้โดยไม่มีใครตรวจพบ ต้อง **แบ่งแยกหน้าที่** ให้คนอนุมัติและคนโอนเงินไม่ใช่คนบันทึกบัญชี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.information-systems.p012
    topics: [business.accounting.information-systems]
    difficulty: 4
    type: numeric
    stem: "รายงานลูกหนี้แยกตามอายุของร้านวัสดุก่อสร้าง (สมมติ): ยังไม่ครบกำหนด $180{,}000$ บาท เกินกำหนด 1–30 วัน $60{,}000$ บาท 31–60 วัน $35{,}000$ บาท เกิน 60 วัน $25{,}000$ บาท ลูกหนี้ที่เกินกำหนด **มากกว่า 30 วัน** คิดเป็นร้อยละเท่าไรของลูกหนี้ทั้งหมด (ตอบเป็น %)"
    answer: { value: 20, tolerance: 0.1, unit: "%" }
    hints:
      - "รวมลูกหนี้ทุกช่วงอายุเป็นตัวหาร"
      - "มากกว่า 30 วันคือช่วง 31–60 วัน และเกิน 60 วัน"
    misconceptions:
      - { match: 8.33, feedback: "นับแค่ช่วงเกิน 60 วัน ต้องรวมช่วง 31–60 วันด้วย" }
      - { match: 40, feedback: "รวมช่วง 1–30 วันเข้าไปด้วย โจทย์ถามเฉพาะมากกว่า 30 วัน" }
    solution: "ลูกหนี้รวม $= 180{,}000 + 60{,}000 + 35{,}000 + 25{,}000 = 300{,}000$ บาท เกิน 30 วัน $= 35{,}000 + 25{,}000 = 60{,}000$ บาท คิดเป็น $\\dfrac{60{,}000}{300{,}000} \\times 100 = 20\\%$ ร้านควรเร่งติดตามกลุ่มนี้ก่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.information-systems.p013
    topics: [business.accounting.information-systems]
    difficulty: 4
    type: mcq
    stem: "เซลล์ C2 มีสูตร `=B2*$F$1` (F1 คืออัตราภาษีมูลค่าเพิ่ม) ถ้าคัดลอกสูตรนี้ไปวางที่เซลล์ C5 สูตรใน C5 จะเป็นอะไร"
    choices:
      - { id: a, text: "`=B5*$F$1`", correct: true }
      - { id: b, text: "`=B5*$F$4`", feedback: "$F$1 ล็อกทั้งคอลัมน์และแถว จึงไม่เลื่อนเป็น F4" }
      - { id: c, text: "`=B2*$F$1`", feedback: "B2 ไม่มี $ จึงเลื่อนตามแถวเป็น B5" }
      - { id: d, text: "`=B5*F4`", feedback: "เครื่องหมาย $ ไม่หายไปเมื่อคัดลอก และ F1 ไม่เลื่อน" }
    hints:
      - "การอ้างอิงที่ไม่มี $ จะเลื่อนตามแถวที่คัดลอกไป"
      - "$F$1 มี $ ทั้งหน้าคอลัมน์และหน้าแถว"
    solution: "B2 เป็นการอ้างอิงแบบสัมพัทธ์ เลื่อนลง 3 แถวเป็น B5 ส่วน `$F$1` เป็นการอ้างอิงแบบสัมบูรณ์ ไม่เลื่อน สูตรจึงเป็น `=B5*$F$1`"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.information-systems.p014
    topics: [business.accounting.information-systems]
    difficulty: 5
    type: numeric
    stem: "ตารางสรุป (Pivot Table) จากโปรแกรมบัญชีของร้านค้า (สมมติ) แสดงยอดขายและต้นทุนขายไตรมาสนี้: สินค้า ก ขาย $120{,}000$ ต้นทุน $84{,}000$ บาท สินค้า ข ขาย $80{,}000$ ต้นทุน $44{,}000$ บาท สินค้า ค ขาย $50{,}000$ ต้นทุน $40{,}000$ บาท สินค้าที่มีอัตรากำไรขั้นต้นสูงที่สุดมีอัตรากำไรขั้นต้นกี่เปอร์เซ็นต์ (ตอบเป็น %)"
    answer: { value: 45, tolerance: 0.1, unit: "%" }
    hints:
      - "อัตรากำไรขั้นต้น $= \\dfrac{\\text{ยอดขาย} - \\text{ต้นทุนขาย}}{\\text{ยอดขาย}} \\times 100$"
      - "คิดทีละสินค้า ไม่ใช่ดูยอดขายมากที่สุด"
    misconceptions:
      - { match: 30, feedback: "เลือกสินค้า ก เพราะยอดขายสูงสุด แต่อัตรากำไรขั้นต้นของ ก คือ $30\\%$ ไม่ใช่สูงสุด" }
      - { match: 81.82, feedback: "หารกำไรขั้นต้นด้วยต้นทุน ($36{,}000 \\div 44{,}000$) อัตรากำไรขั้นต้นต้องหารด้วยยอดขาย" }
    solution: "ก: $\\dfrac{36{,}000}{120{,}000} = 30\\%$ · ข: $\\dfrac{36{,}000}{80{,}000} = 45\\%$ · ค: $\\dfrac{10{,}000}{50{,}000} = 20\\%$ สินค้า ข มีอัตรากำไรขั้นต้นสูงสุด $45\\%$ แม้ยอดขายจะน้อยกว่าสินค้า ก จึงน่าส่งเสริมการขาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.information-systems.p015
    topics: [business.accounting.information-systems]
    difficulty: 5
    type: mcq
    stem: "ร้านอาหารสามสาขา (สมมติ) ใช้โปรแกรมบัญชีบนคลาวด์ พบว่า (1) พนักงานทุกคนใช้รหัสผู้ใช้เดียวกัน (2) ไม่เคยสำรองข้อมูลออกนอกระบบ (3) หน้าจอบันทึกรายจ่ายรับยอดติดลบได้ ข้อใดจับคู่ปัญหากับการควบคุมที่ควรเพิ่มได้ **ถูกต้อง** (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "(1) ให้รหัสผู้ใช้รายบุคคลและกำหนดสิทธิตามหน้าที่ เป็นการควบคุมทั่วไป", correct: true }
      - { id: b, text: "(2) สำรองข้อมูลตามกำหนดและทดสอบการกู้คืน เป็นการควบคุมทั่วไป", correct: true }
      - { id: c, text: "(3) ตรวจขอบเขตให้ยอดต้องมากกว่าศูนย์ เป็นการควบคุมการนำเข้า", correct: true }
      - { id: d, text: "(1) ให้ทุกคนเปลี่ยนรหัสผ่านร่วมกันทุกสัปดาห์ก็เพียงพอ", feedback: "ยังใช้รหัสร่วมกัน จึงตรวจย้อนไม่ได้ว่าใครทำรายการใด" }
    hints:
      - "ปัญหา (1) และ (2) เกี่ยวกับทั้งระบบ ปัญหา (3) เกี่ยวกับหน้าจอหนึ่ง"
      - "การควบคุมทั่วไปกับการควบคุมระบบงานแก้ปัญหาต่างกัน"
    solution: "ข้อ ก ข และ ค ถูก รหัสผู้ใช้รายบุคคลพร้อมสิทธิตามหน้าที่และการสำรองข้อมูลเป็นการควบคุมทั่วไป ส่วนการตรวจขอบเขตไม่ให้ยอดติดลบเป็นการควบคุมการนำเข้าของงานรายจ่าย ข้อ ง ผิด เพราะการเปลี่ยนรหัสผ่านร่วมบ่อย ๆ ยังไม่รู้ว่าใครบันทึกรายการใด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.information-systems.p016
    topics: [business.accounting.information-systems]
    difficulty: 4
    type: numeric
    stem: "ระบบดึงรายการเดินบัญชีธนาคารเข้าโปรแกรมบัญชีอัตโนมัติ ณ สิ้นเดือน รายการเดินบัญชีแสดงยอด $86{,}300$ บาท มีเงินฝากระหว่างทางที่ธนาคารยังไม่บันทึก $2{,}000$ บาท และเช็คที่จ่ายแล้วแต่ผู้รับยังไม่นำไปขึ้นเงิน $3{,}800$ บาท ยอดตามธนาคารหลังปรับปรุงเป็นกี่บาท (ตอบเป็นบาท)"
    answer: { value: 84500, unit: "บาท" }
    hints:
      - "เงินฝากระหว่างทางยังไม่เข้าบัญชีธนาคาร ต้องบวก"
      - "เช็คที่ยังไม่ขึ้นเงินจะทำให้เงินในธนาคารลดในอนาคต ต้องหัก"
    misconceptions:
      - { match: 88100, feedback: "บวกเช็คที่ยังไม่ขึ้นเงินและหักเงินฝากระหว่างทาง ต้องทำกลับกัน" }
      - { match: 92100, feedback: "บวกทั้งสองรายการ แต่เช็คที่ยังไม่ขึ้นเงินต้องหัก" }
    solution: "ยอดตามธนาคารหลังปรับปรุง $= 86{,}300 + 2{,}000 - 3{,}800 = 84{,}500$ บาท ถ้าเท่ากับยอดเงินฝากในสมุดบัญชีของกิจการ แสดงว่ากระทบยอดได้ (เป็นการควบคุมผลลัพธ์)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.accounting.information-systems.p017
    topics: [business.accounting.information-systems]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นประโยชน์ของการใช้ **ใบกำกับภาษีอิเล็กทรอนิกส์ (e-Tax Invoice)** และการดึงรายการธนาคารเข้าระบบอัตโนมัติ (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "ลดการพิมพ์ข้อมูลซ้ำ ความผิดพลาดจากการพิมพ์จึงลดลง", correct: true }
      - { id: b, text: "ลดค่ากระดาษและพื้นที่เก็บเอกสาร", correct: true }
      - { id: c, text: "ผู้บริหารเห็นยอดเงินและยอดขายได้เร็วขึ้นเพื่อตัดสินใจ", correct: true }
      - { id: d, text: "ไม่ต้องมีการควบคุมภายในหรือคนตรวจสอบอีกต่อไป", feedback: "ระบบอัตโนมัติยังต้องมีการควบคุม เช่น สิทธิผู้ใช้และการกระทบยอด" }
    hints:
      - "คิดถึงงานที่เคยต้องพิมพ์หรือจัดเก็บด้วยมือ"
      - "เทคโนโลยีลดงานซ้ำ แต่ไม่ได้ลบความรับผิดชอบของนักบัญชี"
    solution: "เทคโนโลยีดิจิทัลลดการพิมพ์ซ้ำ ลดความผิดพลาด ลดกระดาษ และทำให้เห็นข้อมูลเร็วขึ้น (ข้อ ก ข ค) แต่ยังต้องมีคนตรวจสอบและมีการควบคุมภายใน (ข้อ ง ผิด)"
    license: CC-BY-SA-4.0
    ai_assisted: true
