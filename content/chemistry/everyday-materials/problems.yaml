    stem: "ธนาคารขยะของโรงเรียนรับซื้อกระป๋องอะลูมิเนียมกิโลกรัมละ 50 บาท (ราคาสมมติ) กระป๋อง 1 ใบหนัก 15 กรัม ห้อง ป.2/1 เก็บได้ 200 ใบ จะได้เงินกี่บาท (1 กิโลกรัม = 1,000 กรัม)"
    answer: { value: 150, unit: บาท }
    misconceptions:
