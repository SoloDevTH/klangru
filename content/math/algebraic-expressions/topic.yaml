id: math.algebra.expressions
subject: math
title: { th: นิพจน์พีชคณิต, en: Algebraic expressions }
summary: ใช้ตัวแปรแทนจำนวนที่ยังไม่รู้ค่า รู้จักพจน์และพจน์คล้าย รวมพจน์คล้าย แทนค่าตัวแปร และกระจายวงเล็บ
difficulty: 2.5
minutes: 30
prerequisites: [math.number.integers, math.number.fractions]
encompasses:
  - { id: math.number.integers, weight: 0.3 }
  - { id: math.number.fractions, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: area-model-distributive.svg
    alt: "แบบจำลองพื้นที่ สี่เหลี่ยมผืนผ้าสูง 3 หน่วย ด้านยาวแบ่งเป็นส่วนยาว x กับส่วนยาว 2 ส่วนแรกมีพื้นที่ 3x ส่วนที่สองแบ่งเป็นช่องสี่เหลี่ยมจัตุรัสหนึ่งหน่วย 6 ช่อง ใต้ภาพเขียนว่า 3(x + 2) = 3x + 6"
    caption: "สี่เหลี่ยมสูง $3$ ยาว $x + 2$ มีพื้นที่ $3(x + 2)$ และแบ่งได้เป็น $3x$ กับ $6$ ช่อง จึงได้ $3(x + 2) = 3x + 6$ ไม่ว่า $x$ ยาวเท่าใด"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: math.expr.p012, prompt: "ลองมองวงเล็บเป็นก้อนเดียว แล้วตอบ" }
  - type: worked-example
    title: ดึงตัวร่วมจากนิพจน์ 12a + 8b
    problem: "เขียน $12a + 8b$ ในรูปผลคูณ โดยดึงตัวร่วมที่มากที่สุดออกมา"
    steps:
      - text: "หาตัวหารร่วมมากของสัมประสิทธิ์ $12$ กับ $8$: ตัวประกอบของ 12 คือ 1, 2, 3, 4, 6, 12 ของ 8 คือ 1, 2, 4, 8 ตัวร่วมที่มากที่สุดคือ $4$"
        why: "ถ้าดึงแค่ 2 ออกมา จะได้ $2(6a + 4b)$ ซึ่งในวงเล็บยังมีตัวร่วม 2 เหลืออยู่ ยังแยกไม่สุด"
      - text: "หารทุกพจน์ด้วย $4$: $12a \\div 4 = 3a$ และ $8b \\div 4 = 2b$"
      - text: "เขียนตัวร่วมไว้นอกวงเล็บ: $12a + 8b = 4(3a + 2b)$"
      - text: "ตรวจด้วยการกระจายกลับ: $4 \\cdot 3a + 4 \\cdot 2b = 12a + 8b$ ✓"
        why: "การดึงตัวร่วมคือการกระจายย้อนกลับ กระจายแล้วต้องได้นิพจน์เดิมพอดี"
    answer: "$12a + 8b = 4(3a + 2b)$"
  - type: worked-example
    title: กระจายวงเล็บที่มีสัมประสิทธิ์เป็นเศษส่วน
    problem: "ทำ $\\tfrac{2}{3}(6x - 9) - \\tfrac{1}{2}(4x + 2)$ ให้อยู่ในรูปอย่างง่าย"
    steps:
      - text: "กระจายวงเล็บแรก: $\\tfrac{2}{3} \\cdot 6x = 4x$ และ $\\tfrac{2}{3} \\cdot (-9) = -6$ ได้ $4x - 6$"
        why: "$\\tfrac{2}{3} \\cdot 6 = \\tfrac{12}{3} = 4$ และ $\\tfrac{2}{3} \\cdot 9 = \\tfrac{18}{3} = 6$"
      - text: "กระจายวงเล็บที่สองด้วย $-\\tfrac{1}{2}$ (รวมเครื่องหมายลบ): $-\\tfrac{1}{2} \\cdot 4x = -2x$ และ $-\\tfrac{1}{2} \\cdot 2 = -1$ ได้ $-2x - 1$"
        why: "เครื่องหมายลบหน้า $\\tfrac{1}{2}$ ต้องคูณเข้าทุกพจน์ในวงเล็บ ไม่ใช่แค่พจน์แรก"
      - text: "เขียนต่อกัน: $4x - 6 - 2x - 1$"
      - text: "รวมพจน์คล้าย: $(4x - 2x) + (-6 - 1) = 2x - 7$"
      - text: "ตรวจด้วย $x = 3$: นิพจน์เดิม $\\tfrac{2}{3}(9) - \\tfrac{1}{2}(14) = 6 - 7 = -1$ และ $2(3) - 7 = -1$ ✓"
        why: "ค่าที่ตรงกันยังไม่พิสูจน์ว่าเท่ากัน แต่ถ้าไม่ตรงกันแปลว่าทำผิดแน่นอน จึงเป็นการตรวจที่คุ้มค่า"
    answer: "$2x - 7$"
  - { type: check, problem: math.expr.p015, prompt: "นิพจน์ไหนเท่ากันจริง ลองแทนค่าตรวจดู" }
  - type: simulation
    title: รวมพจน์คล้ายด้วยเหรียญ (PhET Expression Exchange)
    url: https://phet.colorado.edu/en/simulations/expression-exchange
    provider: phet
    note: ลองลากพจน์ที่มีตัวแปรเหมือนกันมาซ้อนกัน แล้วดูว่าสัมประสิทธิ์รวมกันอย่างไร พจน์ที่ตัวแปรต่างกันจะรวมกันไม่ได้
glossary:
  - { term: "ตัวแปร", definition: "ตัวอักษร เช่น $x$ หรือ $y$ ที่ใช้แทนจำนวนที่ยังไม่รู้ค่าหรือเปลี่ยนค่าได้" }
  - { term: "พจน์", definition: "ส่วนของนิพจน์ที่คั่นด้วยเครื่องหมายบวกหรือลบ เช่น $5x - 3y + 7$ มี 3 พจน์" }
  - { term: "สัมประสิทธิ์", definition: "ตัวเลขที่คูณอยู่หน้าตัวแปร รวมเครื่องหมายด้วย เช่น สัมประสิทธิ์ของ $y$ ใน $-3y$ คือ $-3$" }
  - { term: "พจน์คล้าย", definition: "พจน์ที่มีตัวแปรและเลขชี้กำลังเหมือนกันทุกประการ เช่น $4a$ กับ $-a$ จึงนำมารวมกันได้" }
flashcards:
  - { front: "$3x$ หมายถึงอะไร", back: "$3 \\times x$ ถ้า $x = 4$ จะได้ $3x = 12$ ไม่ใช่ 34" }
  - { front: "รวม $4a + 3b - a + 5b$", back: "รวม $a$ กับ $a$: $4a - a = 3a$ รวม $b$ กับ $b$: $3b + 5b = 8b$ ได้ $3a + 8b$" }
  - { front: "กระจาย $-2(3x - 5)$", back: "คูณ $-2$ เข้าทุกพจน์ในวงเล็บ: $-6x + 10$" }
  - { front: "ดึงตัวร่วมจาก $24x + 18y$", back: "ตัวหารร่วมมากของ 24 กับ 18 คือ 6 จึงได้ $6(4x + 3y)$ ตรวจด้วยการกระจายกลับ" }
  - { front: "$2a$ กับ $2b$ รวมกันได้หรือไม่", back: "ไม่ได้ เพราะตัวแปรต่างกัน จึงไม่ใช่พจน์คล้าย คำตอบคง $2a + 2b$ ไว้" }
