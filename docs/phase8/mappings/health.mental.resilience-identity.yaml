topic: health.mental.resilience-identity
rows:
  - { framework: au-ac9-hpe, indicators: ["AC9HP2P01"], coverage: full }
  - { framework: au-ac9-hpe, indicators: ["AC9HP4P01"], coverage: partial, note: "สอนว่าความล้มเหลวและการดูผลช่วยสร้างความยืดหยุ่น (p007, p011, p009 และบทเรียนส่วนความยืดหยุ่นทางใจ ซึ่งมีตัวอย่างจากการสอบและการยิงลูกโทษในกีฬา) แต่ตัวชี้วัดให้สืบค้น (investigate) ในหลายบริบท บทเรียนมีเพียงสองบริบทและโจทย์ส่วนใหญ่อยู่ในบริบทการเรียน การสืบค้นจริงทำนอกแอป" }
  - { framework: au-ac9-hpe, indicators: ["AC9HP6P01", "AC9HP8P01", "AC9HP10P01"], coverage: partial, note: "สอนตัวตนประกอบจากคนรอบตัว ค่านิยม และความเชื่อ และยกตัวอย่างการถูกล้อที่กระทบตัวตน (p012, p013) แต่ยังไม่วิเคราะห์อิทธิพลของสถานที่ (มีแค่ชื่อในภาพ) และยังไม่มีการวิเคราะห์เชิงลึกว่าค่านิยมและความเชื่อหล่อหลอมตัวตนอย่างไร ระดับ 9–10 ที่ให้ประเมินว่าบุคคลส่งอิทธิพลต่อตัวตนของผู้อื่นอย่างไรเกินกว่าที่บทเรียนสอน" }
  - { framework: au-ac9-hpe, indicators: ["AC9HP4P02", "AC9HP6P02", "AC9HP8P02", "AC9HP10P02"], coverage: partial, note: "สอนการวางแผนและการรับมือการเปลี่ยนแปลง การแบ่งเป้าหมายย่อย การขอความช่วยเหลือ และการประเมินแผน (p008, p014, p017 และบทเรียนส่วนการเปลี่ยนผ่าน) แต่ไม่ได้ระบุการเปลี่ยนแปลงในวัยเจริญพันธุ์ซึ่งเป็นตัวอย่างในตัวชี้วัด (สอนในหัวข้อ health.sexuality.puberty) และการซ้อม (rehearse) และการสะท้อนผลทำนอกแอป" }
