    ai_assisted: true

  - id: phy.ff.p021
    topics: [physics.kinematics.free-fall]
    difficulty: 5
    type: numeric
    stem: "ปล่อยลูกบอล A จากหยุดนิ่งที่ความสูง $45\\ \\mathrm{m}$ ในขณะเดียวกันโยนลูกบอล B ขึ้นตรง ๆ จากพื้นที่อยู่ใต้ลูก A พอดี ด้วยความเร็ว $15\\ \\mathrm{m/s}$ ลูกบอลทั้งสองชนกันที่ความสูงเท่าใดเหนือพื้น ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดแรงต้านอากาศ (ตอบเป็นตัวเลขในหน่วย m ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 0.9, tolerance: 0.05, unit: m }
    hints:
      - "เขียนความสูงของแต่ละลูกเป็นฟังก์ชันของเวลา: $y_A = 45 - 4.9t^2$ และ $y_B = 15t - 4.9t^2$"
      - "ชนกันเมื่อ $y_A = y_B$ พจน์ $4.9t^2$ ตัดกันได้"
      - "หาเวลาที่ชนก่อน แล้วแทนกลับหาความสูง"
    misconceptions:
      - { match: 22.5, feedback: "ลูกทั้งสองไม่ได้พบกันกลางทาง ลูก A เร่งลงเร็วขึ้นเรื่อย ๆ ขณะที่ลูก B ช้าลง ต้องตั้งสมการตำแหน่งให้เท่ากัน" }
      - { match: 3, feedback: "นั่นคือเวลาที่ชนกัน ($t = 3\\ \\mathrm{s}$) โจทย์ถามความสูงที่ชน" }
    solution: "$45 - 4.9t^2 = 15t - 4.9t^2$ ได้ $t = 3\\ \\mathrm{s}$ ความสูง $y = 45 - 4.9(3)^2 = 45 - 44.1 = 0.9\\ \\mathrm{m}$ (ลูก B ขึ้นไปถึงจุดสูงสุดแล้วกำลังตกลงในจังหวะนั้น และยังไม่ถึงพื้นซึ่งจะถึงที่ $t \\approx 3.06\\ \\mathrm{s}$)"
