<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="sans-serif">
<title>โครงสร้างเลข 四十七 เท่ากับ 4 คูณ 10 บวก 7</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect x="0" y="0" width="640" height="250" fill="#fff"/>
<rect x="40.0" y="30.0" width="110.0" height="110.0" fill="#cfe3f7" stroke="#1f4e9c" stroke-width="2" rx="10"/>
<text x="95.0" y="112.0" font-size="72" text-anchor="middle" fill="#111" font-weight="normal" >四</text>
<text x="95.0" y="166.0" font-size="18" text-anchor="middle" fill="#1f4e9c" font-weight="bold" >sì</text>
<text x="95.0" y="196.0" font-size="20" text-anchor="middle" fill="#1f4e9c" font-weight="bold" >4</text>
<rect x="170.0" y="30.0" width="110.0" height="110.0" fill="#fbeeb0" stroke="#7a5a00" stroke-width="2" rx="10"/>
<text x="225.0" y="112.0" font-size="72" text-anchor="middle" fill="#111" font-weight="normal" >十</text>
<text x="225.0" y="166.0" font-size="18" text-anchor="middle" fill="#7a5a00" font-weight="bold" >shí</text>
<text x="225.0" y="196.0" font-size="20" text-anchor="middle" fill="#7a5a00" font-weight="bold" >× 10</text>
<rect x="300.0" y="30.0" width="110.0" height="110.0" fill="#d6efd0" stroke="#2a6a2a" stroke-width="2" rx="10"/>
<text x="355.0" y="112.0" font-size="72" text-anchor="middle" fill="#111" font-weight="normal" >七</text>
<text x="355.0" y="166.0" font-size="18" text-anchor="middle" fill="#2a6a2a" font-weight="bold" >qī</text>
<text x="355.0" y="196.0" font-size="20" text-anchor="middle" fill="#2a6a2a" font-weight="bold" >+ 7</text>
<text x="450.0" y="100.0" font-size="26" text-anchor="start" fill="#111" font-weight="bold" >= 4 × 10 + 7</text>
<text x="450.0" y="140.0" font-size="30" text-anchor="start" fill="#c0392b" font-weight="bold" >= 47</text>
<text x="40.0" y="236.0" font-size="14" text-anchor="start" fill="#444" font-weight="normal" >เลขหน้า 十 คูณ 10 · เลขหลัง 十 บวกเพิ่ม (二十 = 20 แต่ 十二 = 12)</text>
</svg>
