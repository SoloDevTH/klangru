      - { id: c, text: "เอนไซม์เสียสภาพเพราะซับสเตรตมากเกินไป", feedback: "ซับสเตรตมากไม่ได้ทำให้เอนไซม์เสียสภาพ เอนไซม์ยังทำงานเต็มที่อยู่" }
      - { id: d, text: "เพิ่มซับสเตรตอีกจะทำให้อัตราเพิ่มขึ้นอีกมาก", feedback: "เมื่อบริเวณเร่งเต็มแล้ว เพิ่มซับสเตรตอีกก็ไม่ทำให้อัตราเพิ่ม" }
