# ข้อเสนอหัวข้อภาษาใหม่ (เฟส 6): ภาษาไทย ภาษาอังกฤษ และภาษาจีน
#
# เป้าหมาย
# - ภาษาไทย: ให้ครอบคลุมตัวชี้วัด th-core-2551-thai ทุกข้อ (319) ร่วมกับหัวข้อเดิม
#   ข้อที่ไม่อยู่ในไฟล์นี้มี 4 ข้อ คือ ท 4.1 ป.3/2 ป.4/2 ป.5/1 ป.6/1 ซึ่ง thai.grammar.word-types สอนครบแล้ว
# - ภาษาอังกฤษ: ให้ครอบคลุมตัวชี้วัด th-core-2551-foreign-languages ทุกข้อ (193) และ CEFR ระดับ A1–B1 ครบ 6 สเกล
# - ภาษาจีน: ครอบคลุม HSK 3.0 ระดับ 1–3 และตัวชี้วัดภาษาต่างประเทศส่วนที่ใช้กับภาษาจีนระดับต้นได้
#   ระดับไวยากรณ์ของหัวข้อจีนตรวจกับ 附录A 语法等级大纲 ของ GF 0025—2021 แล้ว (เช่น 比 了 在/正在 อยู่ระดับ 1,
#   过 着 是…的 ส่วนเติมเต็มผลลัพธ์และทิศทาง และ 因为…所以 อยู่ระดับ 2, 把 และ 被/叫/让 อยู่ระดับ 3)
#
# หลักการจัดกลุ่ม
# - คลังไม่แบ่งชั้น ตัวชี้วัดชั้นต่าง ๆ ที่เป็นทักษะเดียวกันจึงรวมเป็นหัวข้อเดียว (เช่น การอ่านออกเสียง ป.1 ถึง ม.4-6)
#   หัวข้อหนึ่งจึงมีระดับความยากกว้าง ผู้เขียนควรแบ่งตัวอย่างและโจทย์จากง่ายไปยาก
# - ตัวชี้วัดเรื่องมารยาท (ท 1.1 ท 2.1 ท 3.1) และนิสัยรักการอ่านเป็นพฤติกรรม รวมไว้ในหัวข้อเดียวที่ให้ความรู้และสถานการณ์ตัดสินใจ
# - ตัวชี้วัดภาษาต่างประเทศเป็นทักษะ ไวยากรณ์อยู่ในสาระการเรียนรู้แกนกลาง จึงแยกเป็นหัวข้อไวยากรณ์ คำศัพท์ และทักษะ
#   ตัวชี้วัดเดียวกันอาจปรากฏทั้งในหัวข้อภาษาอังกฤษและภาษาจีน เพราะมาตรฐานเขียนไว้สำหรับภาษาต่างประเทศทั่วไป
# - วรรณคดีและบทอาขยานต้องใช้ตัวบทที่หมดลิขสิทธิ์หรือมีสัญญาอนุญาตเปิด
