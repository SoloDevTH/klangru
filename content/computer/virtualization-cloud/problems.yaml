problems:
  - id: computer.systems.virtualization-cloud.p001
    topics: [computer.systems.virtualization-cloud]
    difficulty: 1
    type: mcq
    stem: "เครื่องเสมือน (virtual machine) คืออะไร"
    choices:
      - { id: a, text: "ซอฟต์แวร์ที่จำลองคอมพิวเตอร์หนึ่งเครื่องให้รันระบบปฏิบัติการได้หลายชุดบนเครื่องจริงเครื่องเดียวกัน", correct: true }
      - { id: b, text: "เครื่องพิมพ์ที่ต่ออยู่กับเครือข่ายในห้องคอมพิวเตอร์", feedback: "เครื่องพิมพ์เครือข่ายเป็นอุปกรณ์จริง ไม่ใช่การจำลองคอมพิวเตอร์ด้วยซอฟต์แวร์" }
      - { id: c, text: "โปรแกรมที่ลบไวรัสออกจากไฟล์ทั้งหมด", feedback: "นั่นคือโปรแกรมป้องกันมัลแวร์ ไม่ใช่เครื่องเสมือน" }
      - { id: d, text: "พื้นที่เก็บข้อมูลที่ส่งไปเก็บบนอินเทอร์เน็ต", feedback: "นั่นคือการเก็บข้อมูลบนคลาวด์ ซึ่งไม่ได้จำลองคอมพิวเตอร์ทั้งเครื่อง" }
    hints:
      - "คำว่าเสมือนหมายถึงเหมือนจริงแต่ไม่ได้เป็นของจริง"
      - "ลองนึกว่าซอฟต์แวร์สามารถทำให้เครื่องเดียวดูเหมือนมีหลายเครื่องได้อย่างไร"
    solution: "เครื่องเสมือนคือซอฟต์แวร์ที่สร้างฮาร์ดแวร์จำลองขึ้นมา เพื่อให้รันระบบปฏิบัติการได้หลายชุดโดยแยกจากกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.virtualization-cloud.p002
    topics: [computer.systems.virtualization-cloud]
    difficulty: 1
    type: match
    stem: "จับคู่คำศัพท์ของเวอร์ชวลไลเซชันและคลาวด์กับความหมายที่ตรงที่สุด"
    pairs:
      - { left: "ไฮเปอร์ไวเซอร์", right: "ซอฟต์แวร์ที่จัดสรรและควบคุมเครื่องเสมือน" }
      - { left: "คอนเทนเนอร์", right: "แยกแอปโดยใช้เคอร์เนลของระบบปฏิบัติการร่วมกัน" }
      - { left: "IaaS", right: "เช่าโครงสร้างพื้นฐาน เช่น เครื่องเสมือนและพื้นที่เก็บข้อมูล" }
      - { left: "SaaS", right: "ใช้โปรแกรมสำเร็จรูปผ่านเว็บโดยไม่ต้องดูแลระบบเอง" }
    hints:
      - "ไฮเปอร์ไวเซอร์อยู่เหนือเครื่องเสมือนและจัดการมัน"
      - "ตัวอักษรในชื่อ IaaS, PaaS และ SaaS บอกว่าสิ่งที่เป็นบริการคืออะไร"
    solution: "ไฮเปอร์ไวเซอร์จัดการเครื่องเสมือน คอนเทนเนอร์ใช้เคอร์เนลร่วมกัน IaaS ให้เช่าโครงสร้างพื้นฐาน และ SaaS ให้ใช้โปรแกรมผ่านเว็บ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.virtualization-cloud.p003
    topics: [computer.systems.virtualization-cloud]
    difficulty: 2
    type: mcq
    stem: "ไฮเปอร์ไวเซอร์ชนิดที่ 2 ทำงานอย่างไร"
    choices:
      - { id: a, text: "ทำงานบนระบบปฏิบัติการปกติของเครื่อง แล้วจำลองเครื่องเสมือนอีกชั้นหนึ่ง", correct: true }
      - { id: b, text: "ทำงานบนฮาร์ดแวร์โดยตรงโดยไม่มีระบบปฏิบัติการใดอยู่ข้างใต้", feedback: "นั่นคือลักษณะของไฮเปอร์ไวเซอร์ชนิดที่ 1 ไม่ใช่ชนิดที่ 2" }
      - { id: c, text: "ทำหน้าที่เป็นเบราว์เซอร์สำหรับเปิดเว็บไซต์", feedback: "ไฮเปอร์ไวเซอร์เกี่ยวข้องกับการจำลองเครื่องเสมือน ไม่ใช่การท่องเว็บ" }
      - { id: d, text: "เก็บข้อมูลของผู้ใช้ไว้บนอินเทอร์เน็ตทั้งหมด", feedback: "การเก็บข้อมูลบนอินเทอร์เน็ตไม่ได้เป็นหน้าที่ของไฮเปอร์ไวเซอร์ชนิดที่ 2" }
    hints:
      - "ลองนึกว่ามีระบบปฏิบัติการอยู่ข้างใต้หรือไม่"
      - "ชนิดที่ 1 และชนิดที่ 2 ต่างกันที่ตำแหน่งของไฮเปอร์ไวเซอร์เมื่อเทียบกับฮาร์ดแวร์"
    solution: "ไฮเปอร์ไวเซอร์ชนิดที่ 2 รันบนระบบปฏิบัติการปกติ จึงมีชั้นของระบบปฏิบัติการอยู่ข้างใต้ ส่วนชนิดที่ 1 รันบนฮาร์ดแวร์โดยตรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.virtualization-cloud.p004
    topics: [computer.systems.virtualization-cloud]
    difficulty: 2
    type: mcq
    stem: "ข้อดีหลักของคอนเทนเนอร์เมื่อเทียบกับเครื่องเสมือนคืออะไร"
    choices:
      - { id: a, text: "เริ่มทำงานได้เร็วและใช้ทรัพยากรน้อย เพราะไม่ต้องบูตระบบปฏิบัติการใหม่ทั้งชุด", correct: true }
      - { id: b, text: "มีการแยกที่แข็งแรงกว่าเสมอ เพราะแต่ละตัวมีเคอร์เนลของตนเอง", feedback: "คอนเทนเนอร์ใช้เคอร์เนลร่วมกัน การแยกจึงอ่อนกว่าเครื่องเสมือนในหลายกรณี" }
      - { id: c, text: "ไม่ต้องใช้ระบบปฏิบัติการใด ๆ เลย", feedback: "คอนเทนเนอร์ยังต้องอาศัยเคอร์เนลของระบบปฏิบัติการโฮสต์" }
      - { id: d, text: "รันได้เฉพาะบนเครื่องพิมพ์เท่านั้น", feedback: "คอนเทนเนอร์เป็นการรันแอปบนเครื่องคอมพิวเตอร์ ไม่ได้จำกัดกับอุปกรณ์พิมพ์" }
    hints:
      - "คิดว่าสิ่งที่ต้องบูตใหม่มากหรือน้อยกว่ากันระหว่างสองแบบ"
      - "การใช้เคอร์เนลร่วมกันส่งผลต่อทั้งความเร็วและความปลอดภัย"
    solution: "คอนเทนเนอร์ไม่บูตระบบปฏิบัติการใหม่ทั้งชุด จึงเริ่มเร็วและกินทรัพยากรน้อยกว่าเครื่องเสมือน แต่แลกกับการแยกที่อ่อนกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.virtualization-cloud.p005
    topics: [computer.systems.virtualization-cloud]
    difficulty: 2
    type: mcq
    stem: "ข้อจำกัดสำคัญของคอนเทนเนอร์ด้านความปลอดภัยคืออะไร"
    choices:
      - { id: a, text: "คอนเทนเนอร์หลายตัวใช้เคอร์เนลร่วมกัน ช่องโหว่ของเคอร์เนลอาจกระทบทุกตัวบนเครื่องนั้น", correct: true }
      - { id: b, text: "คอนเทนเนอร์ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้", feedback: "คอนเทนเนอร์เชื่อมต่อเครือข่ายได้ตามปกติ ข้อจำกัดด้านความปลอดภัยอยู่ที่การแชร์เคอร์เนล" }
      - { id: c, text: "คอนเทนเนอร์เก็บรหัสผ่านทุกตัวไว้เป็นข้อความธรรมดา", feedback: "ข้อจำกัดนี้ไม่ใช่ลักษณะเฉพาะของคอนเทนเนอร์" }
      - { id: d, text: "คอนเทนเนอร์ไม่สามารถตั้งสิทธิ์การเข้าถึงได้เลย", feedback: "คอนเทนเนอร์สามารถกำหนดสิทธิ์และการแยกได้ ข้อจำกัดอยู่ที่การใช้เคอร์เนลร่วมกัน" }
    hints:
      - "นึกถึงสิ่งที่คอนเทนเนอร์ทุกตัวบนเครื่องใช้ร่วมกันที่อยู่ลึกที่สุด"
      - "ช่องโหว่ที่อยู่ในส่วนที่ใช้ร่วมกันจะส่งผลต่อหลายตัวพร้อมกัน"
    solution: "เพราะคอนเทนเนอร์ใช้เคอร์เนลร่วมกัน ช่องโหว่ของเคอร์เนลจึงอาจทำให้คอนเทนเนอร์หลายตัวได้รับผลกระทบพร้อมกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.virtualization-cloud.p006
    topics: [computer.systems.virtualization-cloud]
    difficulty: 2
    type: numeric
    stem: "ร้านค้าออนไลน์แห่งหนึ่งในประเทศไทยเช่าเครื่องเสมือนคิด 3 บาทต่อชั่วโมง (ค่าสมมติ) รันวันละ 10 ชั่วโมงเฉพาะวันทำการ ในเดือนที่มี 21 วันทำการ ค่าเช่าต่อเดือนเท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 630, unit: บาท }
    hints:
      - "คำนวณชั่วโมงทั้งเดือนก่อน คือ จำนวนชั่วโมงต่อวันคูณจำนวนวันทำการ"
      - "ค่าเช่าเท่ากับชั่วโมงทั้งเดือนคูณราคาต่อชั่วโมง"
    misconceptions:
      - { match: 210, feedback: "นั่นคือจำนวนชั่วโมงทั้งเดือน (10 × 21) ยังไม่ได้คูณราคา 3 บาทต่อชั่วโมง" }
      - { match: 1512, feedback: "คิดเป็น 24 ชั่วโมงต่อวันแทนที่จะเป็น 10 ชั่วโมงที่รันจริง" }
    solution: "ชั่วโมงต่อเดือน = 10 × 21 = 210 ชั่วโมง ค่าเช่า = 210 × 3 = 630 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.virtualization-cloud.p007
    topics: [computer.systems.virtualization-cloud]
    difficulty: 2
    type: text
    stem: "หลักการให้สิทธิ์แก่โปรแกรมหรือผู้ใช้เฉพาะเท่าที่งานต้องการ เรียกเป็นภาษาไทยว่าอะไร (ตอบเป็นคำไทยหรืออังกฤษ)"
    accepted: ["สิทธิ์น้อยที่สุด", "หลักสิทธิ์น้อยที่สุด", "หลักการสิทธิ์น้อยที่สุด", "least privilege"]
    hints:
      - "คำนี้ใช้คำว่าสิทธิ์และคำที่บอกปริมาณที่น้อยที่สุด"
      - "หลักนี้ช่วยจำกัดความเสียหายเมื่อโปรแกรมถูกโจมตี"
    solution: "สิทธิ์น้อยที่สุด (least privilege) คือให้สิทธิ์เฉพาะที่จำเป็นต่องาน เพื่อให้ความเสียหายจากการถูกโจมตีหรือความผิดพลาดมีขอบเขตจำกัด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.virtualization-cloud.p008
    topics: [computer.systems.virtualization-cloud]
    difficulty: 3
    type: order
    stem: "เรียงลำดับการบูตที่เชื่อถือได้ (trusted boot) จากขั้นแรกไปจนถึงขั้นสุดท้าย"
    items:
      - "ฮาร์ดแวร์ตรวจลายเซ็นของตัวบูตแรกก่อนให้ทำงาน"
      - "ตัวบูตตรวจลายเซ็นของเคอร์เนลก่อนโหลด"
      - "เคอร์เนลเริ่มทำงานและตรวจโมดูลที่จะโหลดเพิ่ม"
      - "ระบบปฏิบัติการและแอปเริ่มทำงานบนสายโซ่ที่ตรวจแล้ว"
    hints:
      - "การตรวจต้องเกิดก่อนที่ซอฟต์แวร์ชั้นนั้นจะทำงาน"
      - "แต่ละชั้นตรวจชั้นที่ถัดลงไปก่อนปล่อยให้ทำงาน"
    solution: "ฮาร์ดแวร์ตรวจตัวบูตแรก ตัวบูตตรวจเคอร์เนล เคอร์เนลตรวจโมดูล แล้วระบบปฏิบัติการและแอปจึงเริ่มทำงานบนสายโซ่ที่ผ่านการตรวจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.virtualization-cloud.p009
    topics: [computer.systems.virtualization-cloud]
    difficulty: 3
    type: numeric
    stem: "โรงเรียนเช่าเครื่องเสมือนเดือนละ 630 บาท (ค่าสมมติ) ต่อเนื่อง 36 เดือน หรือจะซื้อเครื่องเองราคา 30,000 บาทแล้วใช้ 36 เดือนเท่ากัน ถ้าไม่คิดค่าไฟและค่าดูแล การเช่าถูกกว่าการซื้อกี่บาท (ตอบเป็นบาท)"
    answer: { value: 7320, unit: บาท }
    hints:
      - "หาค่าเช่ารวมตลอด 36 เดือนก่อน"
      - "ค่าเช่ารวม = 630 × 36"
      - "ส่วนต่าง = ราคาซื้อเครื่อง − ค่าเช่ารวม"
    misconceptions:
      - { match: 22680, feedback: "นั่นคือค่าเช่ารวม 36 เดือน ยังไม่ได้นำไปเทียบกับราคาซื้อเครื่อง 30,000 บาท" }
      - { match: 22440, feedback: "คิดค่าเช่าเพียง 12 เดือน (630 × 12 = 7,560) แต่ต้องคิดครบ 36 เดือน" }
    solution: "ค่าเช่ารวม = 630 × 36 = 22,680 บาท ส่วนต่าง = 30,000 − 22,680 = 7,320 บาท การเช่าจึงถูกกว่าในกรณีนี้ แต่การตัดสินใจจริงต้องรวมค่าไฟ การดูแล และความยืดหยุ่นด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.virtualization-cloud.p010
    topics: [computer.systems.virtualization-cloud]
    difficulty: 3
    type: mcq
    stem: "ในบริการ IaaS ข้อใดเป็นความรับผิดชอบของผู้ใช้"
    choices:
      - { id: a, text: "การตั้งค่าสิทธิ์การเข้าถึงข้อมูลและอัปเดตระบบปฏิบัติการที่ผู้ใช้ติดตั้งเอง", correct: true }
      - { id: b, text: "การดูแลฮาร์ดแวร์และระบบไฟฟ้าในศูนย์ข้อมูล", feedback: "ในบริการ IaaS ผู้ให้บริการดูแลฮาร์ดแวร์และโครงสร้างพื้นฐานของศูนย์ข้อมูล" }
      - { id: c, text: "การสร้างระบบทำความเย็นให้ศูนย์ข้อมูล", feedback: "ระบบทำความเย็นอยู่ในความรับผิดชอบของผู้ให้บริการ ไม่ใช่ผู้ใช้" }
      - { id: d, text: "การซ่อมแซมอุปกรณ์เครือข่ายหลักของผู้ให้บริการ", feedback: "อุปกรณ์เครือข่ายหลักเป็นความรับผิดชอบของผู้ให้บริการ" }
    hints:
      - "ใน IaaS ผู้ใช้ได้เครื่องเสมือนมาแล้วต้องดูแลสิ่งที่อยู่เหนือขึ้นไปจากนั้น"
      - "ถามว่าส่วนใดอยู่ในการควบคุมของผู้ใช้โดยตรงหลังเช่าเครื่องเสมือน"
    solution: "ใน IaaS ผู้ให้บริการดูแลฮาร์ดแวร์และโครงสร้างพื้นฐาน ส่วนผู้ใช้รับผิดชอบระบบปฏิบัติการ ข้อมูล และการตั้งค่าสิทธิ์ที่ตนสร้างขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.virtualization-cloud.p011
    topics: [computer.systems.virtualization-cloud]
    difficulty: 3
    type: mcq
    stem: "ข้อใดอธิบายการแยกระหว่างกระบวนการ (process) ได้ถูกต้อง"
    choices:
      - { id: a, text: "แต่ละกระบวนการมีพื้นที่หน่วยความจำของตนเอง และเข้าถึงของอีกกระบวนการไม่ได้โดยตรงหากไม่ได้รับอนุญาต", correct: true }
      - { id: b, text: "ทุกกระบวนการใช้หน่วยความจำเดียวกันทั้งหมดเพื่อความรวดเร็ว", feedback: "ถ้าใช้หน่วยความจำร่วมกันโดยไม่มีการแยก กระบวนการหนึ่งอาจอ่านหรือแก้ข้อมูลของอีกตัวได้โดยไม่ตั้งใจ" }
      - { id: c, text: "กระบวนการไม่สามารถทำงานพร้อมกันได้เลย", feedback: "ระบบปฏิบัติการจัดการหลายกระบวนการให้ทำงานพร้อมกันหรือสลับกันได้" }
      - { id: d, text: "กระบวนการจะหายไปทุกครั้งที่มีการเปิดโปรแกรมใหม่", feedback: "การเปิดโปรแกรมใหม่ไม่ได้ทำให้กระบวนการเดิมหายไปโดยอัตโนมัติ" }
    hints:
      - "นึกถึงสิ่งที่ระบบต้องป้องกันเมื่อหลายโปรแกรมทำงานพร้อมกัน"
      - "การแยกหมายถึงกระบวนการหนึ่งมองไม่เห็นข้อมูลของอีกกระบวนการ"
    solution: "ระบบปฏิบัติการจัดให้แต่ละกระบวนการมีพื้นที่หน่วยความจำแยกกัน การเข้าถึงข้ามกันต้องผ่านกลไกที่ได้รับอนุญาตเท่านั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.virtualization-cloud.p012
    topics: [computer.systems.virtualization-cloud]
    difficulty: 4
    type: mcq
    stem: "รายการควบคุมการเข้าถึง (access control list) ของไฟล์หนึ่งช่วยตอบคำถามใด"
    choices:
      - { id: a, text: "ใครสามารถอ่าน เขียน หรือรันไฟล์นี้ได้บ้าง", correct: true }
      - { id: b, text: "ไฟล์นี้มีขนาดกี่เมกะไบต์", feedback: "ขนาดของไฟล์เป็นข้อมูลอีกอย่างหนึ่ง ไม่ใช่สิ่งที่ ACL บอก" }
      - { id: c, text: "ไฟล์นี้สร้างขึ้นด้วยโปรแกรมใดเมื่อใด", feedback: "ข้อมูลประวัติการสร้างไม่ได้เป็นหน้าที่หลักของ ACL" }
      - { id: d, text: "ไฟล์นี้จะถูกส่งไปยังเครื่องใดในเครือข่ายต่อไป", feedback: "การส่งไฟล์ไปเครื่องอื่นไม่ได้ถูกกำหนดโดย ACL ของไฟล์" }
    hints:
      - "คำว่า control หมายถึงการควบคุม และ access คือการเข้าถึง"
      - "ACL เก็บรายการผู้ใช้และสิทธิ์ที่กำหนดต่อทรัพยากร"
    solution: "ACL คือรายการที่บอกว่าผู้ใช้หรือกลุ่มใดทำอะไรกับทรัพยากรได้บ้าง เช่น อ่าน เขียน หรือรัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.virtualization-cloud.p013
    topics: [computer.systems.virtualization-cloud]
    difficulty: 4
    type: numeric
    stem: "เว็บร้านอาหารในเชียงใหม่ใช้เครื่องเสมือน 2 เครื่อง คิดเครื่องละ 3 บาทต่อชั่วโมง (ค่าสมมติ) ช่วงเร่งสูงสุดวันละ 6 ชั่วโมงต้องเพิ่มเป็น 5 เครื่อง ส่วนอีก 18 ชั่วโมงใช้ 2 เครื่องตามเดิม ค่าใช้จ่ายต่อวันเท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 198, unit: บาท }
    hints:
      - "แยกคิดเป็นสองช่วงเวลา คือช่วงเร่งสูงสุดและช่วงที่เหลือ"
      - "ช่วงเร่งสูงสุด = 5 เครื่อง × 3 บาท × 6 ชั่วโมง"
      - "ช่วงที่เหลือ = 2 เครื่อง × 3 บาท × 18 ชั่วโมง"
    misconceptions:
      - { match: 144, feedback: "คิด 2 เครื่องตลอด 24 ชั่วโมง โดยลืมว่าช่วงเร่งสูงสุดใช้ 5 เครื่อง" }
      - { match: 90, feedback: "คิดเฉพาะช่วงเร่งสูงสุดและลืมค่าใช้จ่ายของอีก 18 ชั่วโมง" }
    solution: "ช่วงเร่ง 5 × 3 × 6 = 90 บาท ช่วงที่เหลือ 2 × 3 × 18 = 108 บาท รวมเป็น 198 บาทต่อวัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.virtualization-cloud.p014
    topics: [computer.systems.virtualization-cloud]
    difficulty: 4
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของการโจมตีด้วยช่องทางข้างเคียง (side-channel)"
    choices:
      - { id: a, text: "วัดเวลาที่ระบบใช้ตอบสนองหรือการใช้แคชที่ใช้ร่วมกัน เพื่ออนุมานข้อมูลลับของโปรแกรมอื่นบนเครื่องเดียวกัน", correct: true }
      - { id: b, text: "ส่งอีเมลหลอกลวงให้ผู้ใช้กรอกรหัสผ่าน", feedback: "นั่นคือการหลอกลวงทางสังคมหรือฟิชชิง ไม่ได้ใช้ช่องทางข้างเคียงของฮาร์ดแวร์" }
      - { id: c, text: "เปลี่ยนรหัสผ่านของบัญชีผู้ใช้โดยตรง", feedback: "การเข้าถึงบัญชีโดยตรงไม่ได้ใช้การวัดของระบบข้างเคียง" }
      - { id: d, text: "ปิดเครื่องแม่ข่ายเพื่อให้บริการหยุดทำงาน", feedback: "นั่นคือการโจมตีเพื่อให้บริการใช้ไม่ได้ ไม่ใช่การอนุมานข้อมูลผ่านช่องทางข้างเคียง" }
    hints:
      - "ช่องทางข้างเคียงใช้สิ่งที่เกิดขึ้นรอบ ๆ การประมวลผล เช่น เวลาและการใช้ทรัพยากร"
      - "ผู้โจมตีไม่ได้อ่านข้อมูลโดยตรง แต่ดูจากผลข้างเคียงที่วัดได้"
    solution: "การโจมตีช่องทางข้างเคียงอนุมานข้อมูลจากผลข้างเคียงที่วัดได้ เช่น เวลาตอบสนองหรือการใช้แคชที่ใช้ร่วมกัน โดยไม่ต้องอ่านข้อมูลนั้นโดยตรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.virtualization-cloud.p015
    topics: [computer.systems.virtualization-cloud]
    difficulty: 4
    type: mcq
    stem: "ข้อใดเป็นการแบ่งความรับผิดชอบด้านความปลอดภัยในคลาวด์ได้ถูกต้อง"
    choices:
      - { id: a, text: "ผู้ให้บริการดูแลความปลอดภัยของโครงสร้างพื้นฐาน ส่วนผู้ใช้รับผิดชอบการตั้งค่าสิทธิ์และข้อมูลของตน", correct: true }
      - { id: b, text: "ผู้ใช้ไม่ต้องทำอะไรเลยเพราะเป็นคลาวด์แล้ว", feedback: "ผู้ใช้ยังรับผิดชอบการตั้งค่าสิทธิ์ ข้อมูล และซอฟต์แวร์ที่ตนติดตั้ง" }
      - { id: c, text: "ผู้ให้บริการรับผิดชอบทุกอย่างรวมถึงข้อมูลและการตั้งรหัสผ่านของผู้ใช้", feedback: "ข้อมูลของผู้ใช้และการตั้งค่าสิทธิ์ส่วนใหญ่เป็นความรับผิดชอบของผู้ใช้เอง" }
      - { id: d, text: "ทั้งสองฝ่ายรับผิดชอบเหมือนกันทุกส่วนโดยไม่มีการแบ่งงาน", feedback: "ความรับผิดชอบถูกแบ่งตามระดับบริการ ไม่ได้เท่ากันทุกส่วน" }
    hints:
      - "คิดว่าใครควบคุมฮาร์ดแวร์และใครควบคุมข้อมูลของร้านค้า"
      - "ความรับผิดชอบร่วมหมายถึงแบ่งกันตามสิ่งที่แต่ละฝ่ายควบคุมได้"
    solution: "ความรับผิดชอบร่วมแบ่งตามการควบคุม ผู้ให้บริการดูแลโครงสร้างพื้นฐานและศูนย์ข้อมูล ผู้ใช้ดูแลข้อมูล สิทธิ์ และซอฟต์แวร์ที่ตนนำขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.virtualization-cloud.p016
    topics: [computer.systems.virtualization-cloud]
    difficulty: 5
    type: numeric
    stem: "บริการคลาวด์คิดค่าพื้นที่เก็บข้อมูล 0.5 บาทต่อ GB ต่อเดือน และค่าข้อมูลขาออก 0.10 บาทต่อ GB (ค่าสมมติ) ถ้าเก็บข้อมูล 200 GB และมีข้อมูลขาออก 50 GB ในเดือนหนึ่ง ค่าใช้จ่ายรวมเท่ากับกี่บาท (ตอบเป็นบาท)"
    answer: { value: 105, tolerance: 0.5, unit: บาท }
    hints:
      - "คิดค่าพื้นที่เก็บข้อมูลและค่าข้อมูลขาออกแยกกันก่อนรวม"
      - "ค่าพื้นที่ = 200 × 0.5 และค่าข้อมูลขาออก = 50 × 0.10"
    misconceptions:
      - { match: 100, feedback: "ลืมคิดค่าข้อมูลขาออกที่ 50 GB ซึ่งต้องเพิ่มเข้าไปด้วย" }
      - { match: 125, feedback: "คิดค่าพื้นที่และค่าข้อมูลขาออกด้วยอัตราเดียวกัน คือ 0.5 บาทต่อ GB ซึ่งไม่ตรงกับโจทย์" }
    solution: "ค่าพื้นที่เก็บข้อมูล = 200 × 0.5 = 100 บาท ค่าข้อมูลขาออก = 50 × 0.10 = 5 บาท รวมเป็น 105 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.virtualization-cloud.p017
    topics: [computer.systems.virtualization-cloud]
    difficulty: 5
    type: mcq
    stem: "องค์กรกำลังเลือกแพลตฟอร์มคลาวด์สำหรับระบบรับสมัครนักศึกษา ข้อใดเป็นการประเมินที่ครบถ้วนที่สุด"
    choices:
      - { id: a, text: "พิจารณาค่าใช้จ่ายตามการใช้จริง การควบคุมสิทธิ์ การแบ่งความรับผิดชอบด้านความปลอดภัย ความสามารถในการย้ายออก และการแยกข้อมูลของลูกค้า", correct: true }
      - { id: b, text: "เลือกจากราคาต่ำสุดเพียงอย่างเดียวโดยไม่ดูเงื่อนไข", feedback: "ราคาเป็นเพียงมิติเดียว ต้องดูความปลอดภัย การควบคุม และการย้ายข้อมูลออกด้วย" }
      - { id: c, text: "เลือกจากชื่อเสียงของโลโก้โดยไม่ตรวจการตั้งค่า", feedback: "ชื่อเสียงไม่ได้บอกว่าระบบตั้งค่าและควบคุมได้เพียงพอกับข้อมูลของนักศึกษาหรือไม่" }
      - { id: d, text: "ไม่ต้องประเมินเพราะคลาวด์ปลอดภัยเสมอ", feedback: "ความปลอดภัยในคลาวด์ขึ้นกับการตั้งค่าของทั้งสองฝ่าย จึงต้องประเมิน" }
    hints:
      - "การประเมินที่ครบถ้วนต้องครอบคลุมทั้งค่าใช้จ่าย ความปลอดภัย และความยืดหยุ่นในอนาคต"
      - "ข้อมูลของนักศึกษาเป็นข้อมูลที่ต้องดูแลอย่างรอบคอบ"
    solution: "การเลือกแพลตฟอร์มที่ดีต้องดูค่าใช้จ่ายตามการใช้จริง การควบคุมสิทธิ์ การแบ่งความรับผิดชอบ การย้ายออกได้ และการแยกข้อมูลลูกค้า ไม่ใช่มิติเดียว"
