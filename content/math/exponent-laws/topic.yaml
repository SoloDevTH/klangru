id: math.algebra.exponent-laws
subject: math
title: { th: กฎของเลขยกกำลัง, en: Laws of exponents }
summary: ใช้กฎการคูณ การหาร และการยกกำลังซ้อนของเลขยกกำลังที่มีตัวแปร เข้าใจเลขชี้กำลังศูนย์ ลบ และเศษส่วน และเชื่อมกับรากที่ n
difficulty: 4.5
minutes: 35
prerequisites: [math.number.exponents, math.number.roots, math.algebra.polynomials]
encompasses:
  - { id: math.number.exponents, weight: 0.5 }
  - { id: math.number.roots, weight: 0.3 }
  - { id: math.algebra.polynomials, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: powers-of-two-pattern.svg
    alt: "ตารางสองคอลัมน์ ซ้ายคือ 2 ยกกำลัง 4, 3, 2, 1, 0, −1, −2, −3 ขวาคือค่า 16, 8, 4, 2, 1, 1/2, 1/4, 1/8 ลูกศรด้านข้างระบุว่าเลื่อนลงทีละแถวคือหารด้วย 2 แถวที่เลขชี้กำลังเป็น 0 และลบระบายสีเหลือง ใต้ตารางเขียนว่า 2 ยกกำลัง 0 เท่ากับ 1 และ 2 ยกกำลังลบ n เท่ากับ 1 ส่วน 2 ยกกำลัง n"
    caption: "ต่อรูปแบบ \"หารด้วย 2\" ลงไปเรื่อย ๆ จะได้ความหมายของเลขชี้กำลังศูนย์และเลขชี้กำลังลบเอง"
  - { type: check, problem: math.expl.p003, prompt: "ลองใช้ตารางข้างบนช่วยคิด" }
  - type: worked-example
    title: ทำนิพจน์ที่มีเลขชี้กำลังลบให้อยู่ในรูปอย่างง่าย
    problem: "ทำ $\\dfrac{6a^{-2}b^5}{3a^4b^{-1}}$ ให้อยู่ในรูปที่เลขชี้กำลังเป็นบวกทั้งหมด ($a, b \\neq 0$)"
    steps:
      - text: "แยกตัวเลข: $\\tfrac{6}{3} = 2$"
      - text: "ฐาน $a$: $\\dfrac{a^{-2}}{a^4} = a^{-2-4} = a^{-6}$"
        why: "ฐานเดียวกันหารกันให้ลบเลขชี้กำลัง ระวัง $-2 - 4 = -6$ ไม่ใช่ $2$"
      - text: "ฐาน $b$: $\\dfrac{b^5}{b^{-1}} = b^{5-(-1)} = b^6$"
        why: "ลบด้วยจำนวนลบคือบวก"
      - text: "รวม: $2a^{-6}b^6 = \\dfrac{2b^6}{a^6}$"
        why: "$a^{-6} = \\tfrac{1}{a^6}$ จึงย้ายลงไปเป็นตัวส่วน"
      - text: "ตรวจด้วย $a = 1$, $b = 2$: นิพจน์เดิม $\\dfrac{6 \\cdot 32}{3 \\cdot \\tfrac12} = \\dfrac{192}{1.5} = 128$ และ $\\dfrac{2 \\cdot 64}{1} = 128$ ✓"
    answer: "$\\dfrac{2b^6}{a^6}$"
  - type: worked-example
    title: แก้สมการโดยทำให้ฐานเท่ากัน
    problem: "แก้สมการ $27^{x} = 9^{x + 1}$"
    steps:
      - text: "เขียนเป็นฐาน 3: $27 = 3^3$ และ $9 = 3^2$"
      - text: "$27^x = (3^3)^x = 3^{3x}$ และ $9^{x+1} = (3^2)^{x+1} = 3^{2x + 2}$"
        why: "ยกกำลังซ้อนให้คูณเลขชี้กำลัง และต้องคูณ 2 เข้าทุกพจน์ใน $x + 1$"
      - text: "ฐานเท่ากันแล้ว เลขชี้กำลังต้องเท่ากัน: $3x = 2x + 2$"
      - text: "ได้ $x = 2$ ตรวจ: $27^2 = 729$ และ $9^3 = 729$ ✓"
    answer: "$x = 2$"
  - { type: check, problem: math.expl.p019, prompt: "ทำให้ฐานเท่ากันก่อน" }
  - type: interactive
    title: เลขชี้กำลังเศษส่วนกับรากที่ n
    caption: เส้นแรกคือ x ยกกำลัง p/q เส้นที่สองคือรากที่ q ของ x ยกกำลัง p เปลี่ยน p กับ q แล้วสังเกตว่ากราฟทั้งสองทับกันเสมอ ลอง p = 1, q = 2 จะได้กราฟรากที่สอง
    widget:
      kind: function-plot
      functions: ["x^{\\frac{p}{q}}", "\\sqrt[q]{x^{p}}"]
      sliders:
        - { name: p, min: -3, max: 4, step: 1, value: 1, label: ตัวเศษ (ยกกำลัง) }
        - { name: q, min: 1, max: 4, step: 1, value: 2, label: ตัวส่วน (ถอดราก) }
      x: [0, 5]
      y: [0, 5]
glossary:
  - { term: เลขชี้กำลัง, definition: "จำนวนที่บอกว่าฐานคูณกันกี่ตัว เช่น ใน $x^5$ เลขชี้กำลังคือ 5" }
  - { term: เลขชี้กำลังลบ, definition: "$a^{-n}$ หมายถึง $\\dfrac{1}{a^n}$ คือกลับเป็นส่วน ไม่ได้ทำให้ผลเป็นลบ" }
  - { term: รากที่ n, definition: "จำนวนที่ยกกำลัง $n$ แล้วได้ $a$ เขียน $\\sqrt[n]{a}$ หรือ $a^{1/n}$" }
flashcards:
  - { front: "$a^m \\cdot a^n = ?$", back: "$a^{m+n}$ ฐานเดียวกันคูณกัน ให้บวกเลขชี้กำลัง" }
  - { front: "$(a^m)^n = ?$", back: "$a^{mn}$ ยกกำลังซ้อน ให้คูณเลขชี้กำลัง" }
  - { front: "$a^0$ และ $a^{-n}$ มีค่าเท่าใด ($a \\neq 0$)", back: "$a^0 = 1$ และ $a^{-n} = \\dfrac{1}{a^n}$" }
  - { front: "$a^{m/n}$ หมายถึงอะไร", back: "ถอดรากที่ $n$ แล้วยกกำลัง $m$: $\\left(\\sqrt[n]{a}\\right)^m$" }
