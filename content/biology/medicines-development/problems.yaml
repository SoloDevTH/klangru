    solution: "ความเสี่ยงใหม่ $0.4\\% \\times 0.5 = 0.2\\%$ ลดลงสัมบูรณ์ $0.4\\% - 0.2\\% = 0.2\\% = 0.002$ $NNT = 1/0.002 = 500$ คน ตัวเลข \"ลด 50%\" ฟังดูมาก แต่สำหรับคนเสี่ยงต่ำ ประโยชน์สัมบูรณ์น้อย ต้องชั่งกับผลข้างเคียงและราคา"
