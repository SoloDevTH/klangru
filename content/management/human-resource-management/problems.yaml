  - id: management.hr.human-resource-management.p014
    topics: [management.hr.human-resource-management]
    difficulty: 4
    type: numeric
    stem: "แผนกตรวจสอบคุณภาพมีพนักงาน 40 คน ผลทดสอบทักษะการใช้เครื่องวัดพบว่า 26 คนผ่านระดับที่งานต้องการแล้ว คนที่ยังไม่ผ่านต้องอบรมคนละ 12 ชั่วโมง ต้องวางแผนชั่วโมงอบรมรวมกี่ชั่วโมง"
    answer: { value: 168, unit: ชั่วโมง }
    hints:
      - "อบรมเฉพาะคนที่ยังไม่ผ่าน"
      - "จำนวนคนที่ไม่ผ่าน = 40 − 26"
    misconceptions:
      - { match: 480, feedback: "อบรมทุกคน ทั้งที่ 26 คนผ่านแล้ว การวิเคราะห์ระดับบุคคลช่วยไม่ให้อบรมคนที่ไม่จำเป็น" }
      - { match: 312, feedback: "คูณจำนวนคนที่ผ่านแล้ว ต้องใช้จำนวนคนที่ยังไม่ผ่าน" }
    solution: "ยังไม่ผ่าน $40 - 26 = 14$ คน ชั่วโมงอบรมรวม $14 \\times 12 = 168$ ชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.hr.human-resource-management.p015
    topics: [management.hr.human-resource-management]
    difficulty: 5
    type: numeric
    stem: "ศูนย์บริการลูกค้าทางโทรศัพท์ (สมมติ) มีพนักงาน 200 คน ทำโครงการพี่เลี้ยงและเส้นทางความก้าวหน้า ต้นทุน 600,000 บาท อัตราการลาออกต่อปีลดจาก 30% เหลือ 18% ต้นทุนแทนที่พนักงานหนึ่งคนที่ลาออก (สรรหา อบรม ผลผลิตที่เสีย) ประมาณ 45,000 บาท ROI ของโครงการในปีแรกเป็นร้อยละเท่าใด"
    answer: { value: 80, unit: "%" }
    hints:
      - "จำนวนคนลาออกที่ลดลง = (0.30 − 0.18) × 200"
      - "ผลประโยชน์ = จำนวนคนที่ไม่ลาออก × 45,000 แล้วใช้สูตร ROI"
    misconceptions:
      - { match: 180, feedback: "นั่นคือผลประโยชน์ ÷ ต้นทุน ROI ต้องหักต้นทุนก่อน" }
      - { match: 0.8, feedback: "นั่นคืออัตราส่วน ยังไม่ได้คูณ 100 เป็นร้อยละ" }
    solution: "ลาออกลดลง $(0.30 - 0.18) \\times 200 = 24$ คน ประหยัด $24 \\times 45{,}000 = 1{,}080{,}000$ บาท ROI $= (1{,}080{,}000 - 600{,}000) \\div 600{,}000 \\times 100 = 80\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.hr.human-resource-management.p016
    topics: [management.hr.human-resource-management]
    difficulty: 5
    type: mcq
    stem: "ธนาคารแห่งหนึ่งจะนำระบบปัญญาประดิษฐ์มาตรวจเอกสารสินเชื่อ คาดว่างานตรวจเอกสารจะลดลงครึ่งหนึ่งในสองปี ขณะที่งานให้คำปรึกษาลูกค้าจะเพิ่มขึ้น แนวทางด้านบุคลากรใดสอดคล้องกับการเตรียมขีดความสามารถและอัตรากำลังมากที่สุด"
    choices:
      - { id: a, text: "แจ้งแผนล่วงหน้า ประเมินทักษะรายคน อบรมพนักงานตรวจเอกสารที่สนใจให้เป็นผู้ให้คำปรึกษา และชะลอการรับคนใหม่ในตำแหน่งที่งานจะลดลง", correct: true }
      - { id: b, text: "เลิกจ้างพนักงานตรวจเอกสารครึ่งหนึ่งทันทีที่ระบบเริ่มใช้ แล้วรับผู้ให้คำปรึกษาใหม่จากภายนอก", feedback: "เสียความรู้ด้านสินเชื่อที่มีอยู่ เสียต้นทุนเลิกจ้างและสรรหา และทำลายความไว้วางใจของคนที่เหลือ" }
      - { id: c, text: "ไม่บอกพนักงานจนกว่าระบบจะพร้อม เพื่อไม่ให้ตื่นตระหนก", feedback: "การปิดข่าวทำให้เกิดข่าวลือและแรงต้าน และไม่มีเวลาพัฒนาทักษะใหม่" }
      - { id: d, text: "คงจำนวนพนักงานตรวจเอกสารไว้เท่าเดิม และให้ตรวจซ้ำกับระบบทุกเรื่อง", feedback: "ไม่ได้ใช้ประโยชน์จากระบบ และไม่ได้เตรียมคนสำหรับงานที่เพิ่มขึ้น" }
    hints:
      - "วางแผนอัตรากำลังต้องมองทั้งงานที่จะลดและงานที่จะเพิ่ม"
      - "คนที่มีอยู่มีความรู้ด้านสินเชื่อซึ่งงานให้คำปรึกษาต้องใช้"
    solution: "การสื่อสารล่วงหน้า ประเมินช่องว่างทักษะ พัฒนาคนเดิมไปสู่งานที่เพิ่มขึ้น และปรับการรับคนใหม่ ทำให้องค์การได้ทั้งขีดความสามารถและอัตรากำลังที่ตรงกับงานในอนาคต และรักษาความผูกพันของบุคลากร"
