<text x="780.0" y="103.2" font-size="15" fill="#222" text-anchor="middle">ตะกอนเล็ก</text>
<text x="780.0" y="122.2" font-size="15" fill="#222" text-anchor="middle">รวมเป็นก้อน</text>
<line x1="780.0" y1="150.0" x2="780.0" y2="226.0" stroke="#1d3557" stroke-width="2.5" marker-end="url(#arr1d3557)"/>
