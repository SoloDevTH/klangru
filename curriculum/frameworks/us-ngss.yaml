# NGSS: strand = Disciplinary Core Idea (PS1-PS4, LS1-LS4, ESS1-ESS3, ETS1-ETS2), standard = component idea (PS1.A ฯลฯ)
# indicator = performance expectation (PE) 208 ข้อ ข้อความตาม AllDCI.pdf (ตัดส่วน Clarification Statement / Assessment Boundary)
# PE แต่ละข้อวางไว้ใต้ component idea แรกในกล่อง Disciplinary Core Ideas ที่อยู่ใน core idea เดียวกับรหัส PE
#   (note "DCI:" บอก component idea ทั้งหมดที่ PE ใช้ ตามหน้า DCI arrangement บน nextgenscience.org)
# PS2.C, ETS2.A, ETS2.B ไม่มี PE ใน NGSS (ETS2 ปรากฏเป็น "Connections to Engineering, Technology, and Applications of Science")
# level = ชั้นตามรหัส PE: K, 1-5, K-2 / 3-5 (ETS1 ช่วงชั้น), MS, HS
