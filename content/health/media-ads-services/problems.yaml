  difficulty: 4
  type: mcq
  stem: สินค้าหนึ่งมีเลข อย. จริง แต่โฆษณาว่า "ขาวใสถาวรใน 3 วัน" ข้อใดสรุปถูกต้อง
  choices:
  - id: a
    text: เลข อย. บอกว่าผลิตภัณฑ์ได้รับอนุญาตหรือจดแจ้ง แต่ไม่ได้รับรองว่าคำโฆษณานั้นเป็นจริง
    correct: true
  - id: b
    text: มีเลข อย. แปลว่าทุกคำโฆษณาผ่านการรับรองแล้ว
    feedback: การได้เลข อย. กับการได้รับอนุญาตโฆษณาเป็นคนละเรื่อง
  - id: c
    text: เลข อย. ไม่มีประโยชน์เลย
    feedback: เลข อย. ช่วยตรวจว่าผลิตภัณฑ์ขึ้นทะเบียนถูกต้อง เป็นข้อมูลขั้นแรกที่ควรตรวจ
  hints:
  - เลข อย. กับคำโฆษณาตรวจคนละอย่าง
  - คำว่า ถาวร และ 3 วัน เป็นสัญญาณเตือน
  solution: เลข อย. บอกว่าผลิตภัณฑ์ขึ้นทะเบียน แต่คำโฆษณาอาจเกินจริงได้ ต้องดูทั้งเลข อย. ความสมเหตุสมผลของคำโฆษณา และร้องเรียนที่ 1556 ถ้าน่าสงสัย
