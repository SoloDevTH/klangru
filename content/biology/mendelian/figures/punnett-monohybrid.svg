<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="sans-serif" font-size="14">
<title>ตารางพันเนตต์ของถั่วลันเตา Tt × Tt</title>
<rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
<text x="450.0" y="30.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">รุ่น F1 ต้นสูง (Tt) × ต้นสูง (Tt)  →  รุ่น F2</text>
<text x="290.0" y="92.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">เซลล์สืบพันธุ์จากต้นที่ 1</text>
<text x="100" y="270.0" text-anchor="middle" font-size="14" font-weight="bold" transform="rotate(-90 100 270.0)">เซลล์สืบพันธุ์จากต้นที่ 2</text>
<circle cx="230.0" cy="126" r="18" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="230.0" y="132.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">T</text>
<circle cx="350.0" cy="126" r="18" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="350.0" y="132.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">t</text>
<circle cx="140" cy="210.0" r="18" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
<text x="140.0" y="216.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">T</text>
<circle cx="140" cy="330.0" r="18" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
<text x="140.0" y="336.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">t</text>
<rect x="170" y="150" width="120" height="120" fill="#c8e6c9" stroke="#333" stroke-width="2"/>
<text x="230.0" y="205.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">TT</text>
<text x="230.0" y="227.0" text-anchor="middle" font-size="14" fill="#222">สูง</text>
<rect x="290" y="150" width="120" height="120" fill="#c8e6c9" stroke="#333" stroke-width="2"/>
<text x="350.0" y="205.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Tt</text>
<text x="350.0" y="227.0" text-anchor="middle" font-size="14" fill="#222">สูง</text>
<rect x="170" y="270" width="120" height="120" fill="#c8e6c9" stroke="#333" stroke-width="2"/>
<text x="230.0" y="325.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Tt</text>
<text x="230.0" y="347.0" text-anchor="middle" font-size="14" fill="#222">สูง</text>
<rect x="290" y="270" width="120" height="120" fill="#ffe0b2" stroke="#333" stroke-width="2"/>
<text x="350.0" y="325.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">tt</text>
<text x="350.0" y="347.0" text-anchor="middle" font-size="14" fill="#222">เตี้ย</text>
<rect x="500" y="100" width="370" height="300" rx="12" fill="#fafafa" stroke="#bdbdbd"/>
<text x="685.0" y="132.0" text-anchor="middle" font-size="14" fill="#222">T = ยีนต้นสูง (เด่น)</text>
<text x="685.0" y="159.0" text-anchor="middle" font-size="14" fill="#222">t = ยีนต้นเตี้ย (ด้อย)</text>
<text x="685.0" y="186.0" text-anchor="middle" font-size="8" fill="#222"></text>
<text x="685.0" y="213.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">จีโนไทป์</text>
<text x="685.0" y="240.0" text-anchor="middle" font-size="15" fill="#222">TT : Tt : tt = 1 : 2 : 1</text>
<text x="685.0" y="267.0" text-anchor="middle" font-size="8" fill="#222"></text>
<text x="685.0" y="294.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ฟีโนไทป์</text>
<text x="685.0" y="321.0" text-anchor="middle" font-size="15" fill="#222">สูง : เตี้ย = 3 : 1</text>
<text x="685.0" y="348.0" text-anchor="middle" font-size="8" fill="#222"></text>
<text x="685.0" y="375.0" text-anchor="middle" font-size="13" fill="#222">แต่ละช่องมีโอกาส 1/4</text>
</svg>