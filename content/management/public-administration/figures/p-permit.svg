<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" font-family="sans-serif" font-size="14">
<title>ขั้นตอนการขออนุญาตก่อสร้างอาคารของเทศบาลแห่งหนึ่งพร้อมเวลาแต่ละขั้น</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="800" height="250" fill="#ffffff"/>
<text x="400.0" y="30.0" text-anchor="middle" font-size="16" fill="#222" font-weight="bold" >ขั้นตอนการขออนุญาตก่อสร้างอาคาร เทศบาลแห่งหนึ่ง (สมมติ)</text>
<rect x="22.0" y="80.0" width="128.0" height="80.0" rx="8" fill="#eef4fb" stroke="#1f5fa8" stroke-width="2" />
<text x="86.0" y="112.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold" >1. ยื่นคำขอ</text>
<text x="86.0" y="190.0" text-anchor="middle" font-size="14" fill="#d35400" font-weight="bold" >1 วันทำการ</text>
<line x1="153.0" y1="120.0" x2="180.0" y2="120.0" stroke="#222" stroke-width="2.5" marker-end="url(#ahk)" />
<rect x="183.0" y="80.0" width="128.0" height="80.0" rx="8" fill="#eef4fb" stroke="#1f5fa8" stroke-width="2" />
<text x="247.0" y="112.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold" >2. ตรวจเอกสาร</text>
<text x="247.0" y="190.0" text-anchor="middle" font-size="14" fill="#d35400" font-weight="bold" >3 วันทำการ</text>
<line x1="314.0" y1="120.0" x2="341.0" y2="120.0" stroke="#222" stroke-width="2.5" marker-end="url(#ahk)" />
<rect x="344.0" y="80.0" width="128.0" height="80.0" rx="8" fill="#eef4fb" stroke="#1f5fa8" stroke-width="2" />
<text x="408.0" y="112.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold" >3. ตรวจพื้นที่</text>
<text x="408.0" y="190.0" text-anchor="middle" font-size="14" fill="#d35400" font-weight="bold" >5 วันทำการ</text>
<line x1="475.0" y1="120.0" x2="502.0" y2="120.0" stroke="#222" stroke-width="2.5" marker-end="url(#ahk)" />
<rect x="505.0" y="80.0" width="128.0" height="80.0" rx="8" fill="#eef4fb" stroke="#1f5fa8" stroke-width="2" />
<text x="569.0" y="104.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold" >4. พิจารณา</text>
<text x="569.0" y="124.0" text-anchor="middle" font-size="14" fill="#222" >แบบแปลน</text>
<text x="569.0" y="190.0" text-anchor="middle" font-size="14" fill="#d35400" font-weight="bold" >7 วันทำการ</text>
<line x1="636.0" y1="120.0" x2="663.0" y2="120.0" stroke="#222" stroke-width="2.5" marker-end="url(#ahk)" />
<rect x="666.0" y="80.0" width="128.0" height="80.0" rx="8" fill="#eef4fb" stroke="#1f5fa8" stroke-width="2" />
<text x="730.0" y="104.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold" >5. ลงนาม</text>
<text x="730.0" y="124.0" text-anchor="middle" font-size="14" fill="#222" >ออกใบอนุญาต</text>
<text x="730.0" y="190.0" text-anchor="middle" font-size="14" fill="#d35400" font-weight="bold" >2 วันทำการ</text>
<text x="400.0" y="232.0" text-anchor="middle" font-size="13" fill="#444" >แต่ละขั้นเริ่มได้เมื่อขั้นก่อนหน้าเสร็จ</text>
</svg>
