  - id: biology.evolution.evolution.p018
    topics: [biology.evolution.evolution]
    difficulty: 5
    type: numeric
    stem: "ในประชากรหนึ่ง ความถี่ของแอลลีลด้อย q = 0.5 และจีโนไทป์ aa ตายทั้งหมดก่อนสืบพันธุ์ ส่วน AA และ Aa รอดเท่ากัน ถ้ารุ่นพ่อแม่อยู่ในสมดุลฮาร์ดี-ไวน์เบิร์กก่อนการคัดเลือก ความถี่ของแอลลีล a ในรุ่นถัดไปเป็นเท่าใด (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.33, tolerance: 0.005 }
    misconceptions:
      - { match: 0.25, feedback: "0.25 คือความถี่ของจีโนไทป์ aa ก่อนการคัดเลือก ไม่ใช่ความถี่แอลลีลใหม่" }
      - { match: 0.5, feedback: "การคัดเลือกกำจัด aa ออก ความถี่ของ a จึงต้องลดลง" }
      - { match: 0.67, feedback: "0.67 คือความถี่ของแอลลีล A หลังการคัดเลือก" }
    hints:
      - "ก่อนคัดเลือก AA 0.25 Aa 0.5 aa 0.25"
      - "หลัง aa ตาย เหลือ AA และ Aa ให้นับแอลลีล a จาก Aa แล้วหารด้วยแอลลีลทั้งหมดที่เหลือ"
    solution: "เหลือ AA 0.25 และ Aa 0.5 รวม 0.75 แอลลีล a $= \\tfrac{0.5}{2 \\times 0.75} = \\tfrac{1}{3} \\approx 0.33$ แอลลีลด้อยลดลงแต่ไม่หายไปทันที เพราะยังซ่อนอยู่ในเฮเทอโรไซกัส"
    license: CC-BY-SA-4.0
    ai_assisted: true
