  - { front: "คำถาม Yes/No กับคำถาม Wh- ขึ้นหรือลงเสียงท้าย", back: "Yes/No ↗ ขึ้น · Wh- ↘ ลง" }
  - { front: "fifteen กับ fifty ต่างกันที่การเน้นอย่างไร", back: "fif-TEEN เน้นท้าย · FIF-ty เน้นหน้า" }
  - { front: "school มีกี่พยางค์", back: "1 พยางค์ (ไม่ใช่ สะ-กูล)" }
  - { front: "an apple เวลาพูดเร็วอ่านอย่างไร", back: "เชื่อมเสียง a-napple (อะ-แนพ-เพิล)" }
