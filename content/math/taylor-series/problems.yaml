problems:
- id: math.calculus.taylor-series.p001
  topics:
  - math.calculus.taylor-series
  difficulty: 1
  type: numeric
  stem: 'จงหาสัมประสิทธิ์ของ $x^3$ ในอนุกรมแมคลอรินของ $e^x$ (ตอบทศนิยม 4 ตำแหน่ง)'
  answer:
    value: 0.1667
    tolerance: 0.0001
  hints:
  - อนุกรมแมคลอรินของ $e^x$ มีสัมประสิทธิ์ของ $x^n$ เป็น $\frac{1}{n!}$
  - ดูว่า $3!$ เท่ากับเท่าใดแล้วหารหนึ่งด้วยค่านั้น
  misconceptions:
  - match: 0.3333
    feedback: ใช้ $\frac{1}{3}$ แทน $\frac{1}{3!}$ ลืมคูณแฟกทอเรียลของ $3$
  solution: $e^x = \sum \frac{x^n}{n!}$ สัมประสิทธิ์ของ $x^3$ คือ $\frac{1}{3!} = \frac{1}{6} \approx 0.1667$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.calculus.taylor-series.p002
  topics:
  - math.calculus.taylor-series
  difficulty: 1
  type: mcq
  stem: 'พหุนามแมคลอรินดีกรี $3$ ของ $\sin x$ คือข้อใด'
  choices:
  - id: a
    text: $x - \dfrac{x^3}{6}$
    correct: true
  - id: b
    text: $x + \dfrac{x^3}{3}$
    correct: false
    feedback: สัมประสิทธิ์ผิด และเครื่องหมายผิด ต้องหารด้วย $3! = 6$ และเป็นลบ
  - id: c
    text: $1 - \dfrac{x^2}{2}$
    correct: false
    feedback: นี่คือพหุนามของ $\cos x$ ไม่ใช่ $\sin x$
  - id: d
    text: $x - \dfrac{x^2}{6}$
    correct: false
    feedback: $\sin x$ มีเฉพาะกำลังคี่ของ $x$ จึงไม่มี $x^2$
  hints:
  - หาอนุพันธ์ของ $\sin x$ ทีละอันดับแล้วแทนค่า $0$
  - $\sin x$ มีเฉพาะพจน์ที่ $x$ มีกำลังเป็นเลขคี่
  solution: $\sin x = x - \frac{x^3}{3!} + \cdots$ พหุนามดีกรี $3$ คือ $x - \frac{x^3}{6}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.calculus.taylor-series.p003
  topics:
  - math.calculus.taylor-series
  difficulty: 2
  type: numeric
  stem: 'จงใช้พหุนามเทย์เลอร์ดีกรี $2$ ของ $\ln x$ รอบ $a=1$ ประมาณค่า $\ln(1.1)$ (ตอบทศนิยม 4 ตำแหน่ง)'
  answer:
    value: 0.095
    tolerance: 0.0001
  hints:
  - อนุพันธ์ของ $\ln x$ คือ $\frac{1}{x}$ ซึ่งที่ $x=1$ มีค่า $1$
  - พหุนามคือ $f(a) + f'(a)(x-a) + \frac{f''(a)}{2}(x-a)^2$
  misconceptions:
  - match: 0.1
    feedback: ใช้เพียงดีกรี $1$ ทำให้ตกพจน์ $-\frac{(x-1)^2}{2}$ ซึ่งต้องรวมด้วยเพื่อให้ได้ดีกรี $2$
  solution: $f(1)=0$, $f'(1)=1$, $f''(1)=-1$ จึงได้ $P_2(x) = (x-1) - \frac{(x-1)^2}{2}$ เมื่อ $x=1.1$ ได้ $0.1 - 0.005 = 0.095$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.calculus.taylor-series.p004
  topics:
  - math.calculus.taylor-series
  difficulty: 2
  type: numeric
  stem: 'จงหาสัมประสิทธิ์ของ $x^4$ ในอนุกรมแมคลอรินของ $\cos x$ (ตอบทศนิยม 4 ตำแหน่ง)'
  answer:
    value: 0.0417
    tolerance: 0.0001
  hints:
  - อนุกรมของ $\cos x$ มีเฉพาะกำลังคู่ของ $x$
  - สัมประสิทธิ์ของ $x^{2k}$ คือ $\frac{(-1)^k}{(2k)!}$
  misconceptions:
  - match: -0.0417
    feedback: เครื่องหมายผิด $x^4$ อยู่ที่ $k=2$ ซึ่ง $(-1)^2 = +1$ จึงเป็นบวก
  solution: $\cos x = 1 - \frac{x^2}{2!} + \frac{x^4}{4!} - \cdots$ สัมประสิทธิ์ของ $x^4$ คือ $\frac{1}{24} \approx 0.0417$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.calculus.taylor-series.p005
  topics:
  - math.calculus.taylor-series
  difficulty: 2
  type: mcq
  stem: 'ใช้พหุนาม $1 + x + \frac{x^2}{2}$ ประมาณ $e^x$ บนช่วง $0 \le x \le 1$ ขอบเขตบนของค่าคลาดเคลื่อนคือข้อใด'
  choices:
  - id: a
    text: $\dfrac{1}{6}$
    correct: false
    feedback: ลืม $e^c$ ในเศษเหลือลากรองจ์ เมื่อ $c$ อยู่ในช่วง $(0,x)$ ค่า $e^c$ อาจมากกว่า $1$
  - id: b
    text: $\dfrac{e}{2}$
    correct: false
    feedback: ใช้ $2!$ หารแทน $3!$ เศษเหลือของดีกรี $2$ มีตัวหาร $3!$
  - id: c
    text: $\dfrac{e^2}{6}$
    correct: false
    feedback: ค่า $c$ อยู่ในช่วง $(0,1)$ ดังนั้น $e^c$ มากที่สุดเมื่อ $c=1$ ได้ $e$ ไม่ใช่ $e^2$
  - id: d
    text: $\dfrac{e}{6}$
    correct: true
  hints:
  - เศษเหลือลากรองจ์ดีกรี $2$ คือ $\frac{e^c}{3!}x^3$ สำหรับ $c$ บางค่า
  - ค่าสูงสุดของ $e^c$ บนช่วง $[0,1]$ คือ $e$ เมื่อ $c=1$
  solution: เศษเหลือ $R_2 = \frac{e^c}{3!}x^3$ เมื่อ $0 < c < x \le 1$ จึงมีขอบเขตบน $\frac{e}{6}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.calculus.taylor-series.p006
  topics:
  - math.calculus.taylor-series
  difficulty: 2
  type: expression
  stem: 'จงเขียนพหุนามแมคลอรินดีกรี $4$ ของ $\cos(2x)$'
  prefix: 'P_4(x) ='
  answer:
    latex: '1 - 2x^2 + \frac{2x^4}{3}'
    variables:
    - x
  misconceptions:
  - match: '1 - \frac{x^2}{2} + \frac{x^4}{24}'
    feedback: นี่คือพหุนามของ $\cos x$ ต้องแทน $u = 2x$ แล้วยกกำลังทั้ง $2x$ เช่น $(2x)^2 = 4x^2$
  - match: '1 - 2x^2 + \frac{x^4}{6}'
    feedback: ยกกำลังสี่ของ $2x$ ผิด $(2x)^4 = 16x^4$ หารด้วย $4! = 24$ ได้ $\frac{2}{3}x^4$
  hints:
  - เริ่มจาก $\cos u = 1 - \frac{u^2}{2!} + \frac{u^4}{4!} - \cdots$ แล้วแทน $u = 2x$
  - คำนวณ $\frac{(2x)^2}{2}$ และ $\frac{(2x)^4}{24}$ แยกกันทีละพจน์
  solution: $\cos(2x) = 1 - \frac{(2x)^2}{2!} + \frac{(2x)^4}{4!} - \cdots = 1 - 2x^2 + \frac{16x^4}{24} - \cdots$ จึงได้ $P_4(x) = 1 - 2x^2 + \frac{2x^4}{3}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.calculus.taylor-series.p007
  topics:
  - math.calculus.taylor-series
  difficulty: 2
  type: numeric
  stem: 'จงหาสัมประสิทธิ์ของ $x^2$ ในการขยาย $(1+x)^{1/2}$ เป็นอนุกรมกำลังรอบ $0$ (ตอบทศนิยม 4 ตำแหน่ง)'
  answer:
    value: -0.125
    tolerance: 0.0001
  hints:
  - ใช้อนุกรมทวินาม $(1+x)^k = \sum \binom{k}{n} x^n$ โดย $k = \frac12$
  - ตัวประกอบของ $\binom{k}{2}$ คือ $\frac{k(k-1)}{2}$
  misconceptions:
  - match: 0.125
    feedback: เครื่องหมายผิด ค่าของ $k(k-1)$ เมื่อ $k=\frac12$ เป็นลบ
  solution: $\binom{1/2}{2} = \frac{(1/2)(-1/2)}{2} = -\frac18 = -0.125$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.calculus.taylor-series.p008
  topics:
  - math.calculus.taylor-series
  difficulty: 3
  type: numeric
  stem: 'ลูกตุ้มนาฬิกาแกว่งทำมุม $\theta = 0.2$ เรเดียนกับแนวดิ่ง (ข้อมูลสมมติ) ถ้าประมาณ $\sin\theta \approx \theta$ ความคลาดเคลื่อนสัมพัทธ์ $\dfrac{|\theta-\sin\theta|}{\sin\theta}$ คิดเป็นกี่เปอร์เซ็นต์ (ตอบทศนิยม 2 ตำแหน่ง)'
  answer:
    value: 0.67
    tolerance: 0.01
    unit: '%'
  hints:
  - ค่าคลาดเคลื่อนสัมบูรณ์ประมาณได้จาก $\frac{\theta^3}{6}$ ซึ่งยังต้องหารด้วย $\sin\theta$
  - คำนวณ $\sin 0.2$ ด้วยเครื่องคิดเลขหรือ Python แล้วคูณด้วย $100$
  misconceptions:
  - match: 0.13
    feedback: ลืมหารด้วย $\sin\theta$ ผลที่ได้คือค่าคลาดเคลื่อนสัมบูรณ์คูณ $100$ ไม่ใช่สัมพัทธ์
  solution: $\sin 0.2 \approx 0.198669$ จึง $|\theta - \sin\theta| \approx 0.001331$ และ $\frac{0.001331}{0.198669}\times 100 \approx 0.67\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.calculus.taylor-series.p009
  topics:
  - math.calculus.taylor-series
  difficulty: 3
  type: numeric
  stem: 'โรงงานผลิตหลอดไฟในนครปฐมจำลองความน่าจะเป็นด้วยฟังก์ชัน $e^{-x^2}$ (ข้อมูลสมมติ) จงประมาณ $\displaystyle\int_0^1 e^{-x^2}\,dx$ ด้วยสามพจน์แรกของอนุกรมแมคลอริน (ตอบทศนิยม 4 ตำแหน่ง)'
  answer:
    value: 0.7667
    tolerance: 0.0001
  hints:
  - แทน $x^2$ ลงในอนุกรมของ $e^t$ เพื่อหาอนุกรมของ $e^{-x^2}$
  - ปริพันธ์ $x^{2n}$ จาก $0$ ถึง $1$ คือ $\frac{1}{2n+1}$
  misconceptions:
  - match: 0.7917
    feedback: ปริพันธ์ $\frac{x^4}{2}$ ต้องหารด้วย $5$ จึงได้ $\frac{1}{10}$ ไม่ใช่หารด้วย $4$ ซึ่งได้ $\frac{1}{8}$
  solution: $e^{-x^2} = 1 - x^2 + \frac{x^4}{2} - \cdots$ ปริพันธ์ทีละพจน์ได้ $1 - \frac13 + \frac{1}{10} = \frac{23}{30} \approx 0.7667$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.calculus.taylor-series.p010
  topics:
  - math.calculus.taylor-series
  difficulty: 3
  type: mcq
  stem: 'รัศมีการลู่เข้าของอนุกรมแมคลอรินของ $\dfrac{1}{1+x^2}$ คือข้อใด'
  choices:
  - id: a
    text: $\infty$
    correct: false
    feedback: ฟังก์ชันไม่นิยามที่ $x = \pm i$ ซึ่งมีระยะห่างจาก $0$ เท่ากับ $1$ จึงจำกัดรัศมี
  - id: b
    text: $2$
    correct: false
    feedback: ระยะจาก $0$ ถึงจุดที่ฟังก์ชันไม่นิยามบนระนาบเชิงซ้อนคือ $1$ ไม่ใช่ $2$
  - id: c
    text: $1$
    correct: true
  - id: d
    text: $0$
    correct: false
    feedback: อนุกรมลู่เข้าที่ $|x|<1$ จึงไม่ได้ลู่เข้าเฉพาะที่ $0$
  hints:
  - ดูค่าของ $x$ ที่ทำให้ตัวส่วน $1+x^2$ เป็นศูนย์
  - ระยะจาก $0$ ถึงจุดเหล่านั้นคือรัศมี
  solution: $\frac{1}{1+x^2} = \sum (-1)^n x^{2n}$ ลู่เข้าเมื่อ $|x^2|<1$ จึงได้ $R=1$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.calculus.taylor-series.p011
  topics:
  - math.calculus.taylor-series
  difficulty: 3
  type: match
  stem: 'จับคู่ฟังก์ชันกับอนุกรมแมคลอรินที่แทนฟังก์ชันนั้น'
  pairs:
  - left: '$e^x$'
    right: '$\displaystyle\sum_{n=0}^{\infty}\frac{x^n}{n!}$'
  - left: '$\sin x$'
    right: '$\displaystyle\sum_{n=0}^{\infty}\frac{(-1)^n x^{2n+1}}{(2n+1)!}$'
  - left: '$\cos x$'
