id: computer.algorithms.computational-thinking
subject: computer
title: { th: แนวคิดเชิงนามธรรมและแนวคิดเชิงคำนวณ, en: "Abstraction and computational thinking" }
summary: แยกปัญหาเป็นส่วนย่อย หารูปแบบ เลือกเฉพาะสาระสำคัญด้วยแนวคิดเชิงนามธรรม ออกแบบอัลกอริทึมด้วยรหัสลำลองและผังงาน และนำอัลกอริทึมเดิมไปใช้กับปัญหาในวิชาอื่น
difficulty: 3
minutes: 35
prerequisites: [computer.algorithms.logical-reasoning]
encompasses:
  - { id: computer.algorithms.logical-reasoning, weight: 0.4 }
  - { id: computer.algorithms.intro, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: ct-pillars.svg
    alt: "สี่กล่องเรียงจากซ้ายไปขวา มีลูกศรเชื่อม กล่องที่ 1 แยกส่วนย่อย decomposition แบ่งงานใหญ่เป็นงานย่อย ตัวอย่าง รถ อาหาร เงิน ตารางเวลา กล่องที่ 2 หารูปแบบ pattern recognition หาสิ่งที่ซ้ำหรือคล้ายกัน ตัวอย่าง ทุกห้องคิดจำนวนรถแบบเดียวกัน กล่องที่ 3 นามธรรม abstraction เก็บเฉพาะที่จำเป็น ตัวอย่าง ใช้จำนวนคน ไม่สนสีเสื้อ กล่องที่ 4 อัลกอริทึม algorithm เขียนขั้นตอนที่ทำตามได้ ตัวอย่าง รถ เท่ากับ ปัดขึ้นของ คน หารด้วย ที่นั่ง ใต้ภาพเขียนว่าทั้งสี่อย่างใช้ร่วมกันและวนกลับไปแก้ได้"
    caption: "สี่องค์ประกอบของแนวคิดเชิงคำนวณ ใช้กับการจัดทัศนศึกษา"
  - type: figure
    src: decomposition-tree.svg
    alt: "แผนภาพต้นไม้ กล่องบนสุด จัดงานกีฬาสี แตกเป็นสามงานย่อย สถานที่และอุปกรณ์ แตกต่อเป็น จองสนาม ยืมเต็นท์ เครื่องเสียง การแข่งขัน แตกต่อเป็น ตารางแข่ง กรรมการ บันทึกคะแนน คนและอาหาร แตกต่อเป็น แบ่งสี น้ำดื่ม ปฐมพยาบาล ใต้ภาพเขียนว่าแต่ละงานย่อยเล็กพอให้คนหรือกลุ่มเดียวรับไปทำ และตรวจได้ว่าเสร็จหรือยัง"
    caption: "แตกงานจนแต่ละชิ้นชัดเจนว่าต้องทำอะไร"
  - type: worked-example
    title: ใช้ทั้งสี่องค์ประกอบหาจำนวนรถทัศนศึกษา
    problem: "ม.1 มี 4 ห้อง จำนวนนักเรียน 38, 41, 35 และ 40 คน มีครูไปด้วย 8 คน รถบัสคันละ 45 ที่นั่ง ต้องเช่ารถกี่คัน และเขียนวิธีที่ใช้ได้กับทุกระดับชั้น"
    steps:
      - text: "แยกส่วน: ปัญหาย่อยคือ (1) นับคนทั้งหมด (2) หารด้วยที่นั่งต่อคัน (3) ปัดเศษให้ทุกคนมีที่นั่ง"
      - text: "นามธรรม: ข้อมูลที่ต้องใช้มีแค่จำนวนคนแต่ละห้อง จำนวนครู และที่นั่งต่อคัน ชื่อนักเรียนหรือสีรถไม่เกี่ยว"
        why: "ถ้าเก็บรายละเอียดที่ไม่เกี่ยว อัลกอริทึมจะยาวโดยไม่จำเป็น แต่ถ้าลืมครูจะได้คำตอบผิด"
      - text: "หารูปแบบ: ทุกห้องทำเหมือนกัน คือนำจำนวนนักเรียนมาบวกรวม จึงใช้วงวนบวกทีละห้อง"
      - text: "คำนวณ: 38 + 41 + 35 + 40 + 8 = 162 คน และ 162 ÷ 45 = 3.6"
      - text: "ปัดเศษขึ้นเป็น 4 คัน เพราะ 3 คันมีแค่ 135 ที่นั่ง ไม่พอ"
        why: "จำนวนรถต้องเป็นจำนวนเต็ม และต้องพอสำหรับทุกคน จึงปัดขึ้นเสมอ ไม่ใช่ปัดตามหลักทศนิยม"
      - text: "อัลกอริทึมทั่วไป: จำนวนรถ = ปัดเศษขึ้น((ผลรวมนักเรียนทุกห้อง + จำนวนครู) ÷ ที่นั่งต่อคัน) ใช้ได้กับทุกระดับชั้นและรถทุกขนาด"
    answer: "ต้องเช่ารถ 4 คัน"
  - { type: check, problem: computer.algorithms.computational-thinking.p004, prompt: "ส่วนใดของงานที่ควรใช้วงวน" }
  - type: figure
    src: abstraction-map.svg
    alt: "ภาพสองฝั่ง ฝั่งซ้ายเป็นแผนที่จริงที่มีรายละเอียดมาก มีอาคาร ถนนโค้ง แม่น้ำ และเส้นทางรถไฟฟ้าสีแดงคดเคี้ยวผ่านห้าสถานี ฝั่งขวาเป็นแผนผังรถไฟฟ้า สายสีแดงเป็นเส้นตรงมีสถานี ก ข ค ง จ ห่างเท่ากัน ที่สถานี ค มีสายสีน้ำเงินแยกลงไปที่สถานี ฉ เป็นจุดเปลี่ยนสาย มีข้อความว่า เก็บ ลำดับสถานี สายที่เชื่อมกัน จุดเปลี่ยนสาย ตัดทิ้ง ถนน อาคาร ระยะทางและทิศจริง"
    caption: "แผนผังรถไฟฟ้าเป็นนามธรรมของแผนที่จริง"
  - type: worked-example
    title: ออกแบบอัลกอริทึมคิดค่าจอดรถ
    problem: "ห้างแห่งหนึ่งคิดค่าจอดรถดังนี้ 2 ชั่วโมงแรกฟรี ชั่วโมงที่ 3 ถึง 5 ชั่วโมงละ 20 บาท ตั้งแต่ชั่วโมงที่ 6 ชั่วโมงละ 50 บาท เศษของชั่วโมงคิดเป็นหนึ่งชั่วโมง ให้ออกแบบอัลกอริทึมและหาค่าจอดเมื่อจอด 3 ชั่วโมง 10 นาที"
    steps:
      - text: "ข้อมูลเข้าและผลลัพธ์: รับเวลาจอดเป็นนาที m ให้ผลเป็นค่าจอดเป็นบาท"
      - text: "แปลงเป็นชั่วโมงแบบปัดเศษขึ้น: h ← ปัดเศษขึ้น(m ÷ 60)"
        why: "กติกาให้เศษของชั่วโมงคิดเป็นหนึ่งชั่วโมง จึงต้องปัดขึ้นก่อนเทียบเงื่อนไข"
      - text: "แยกเป็น 3 กรณีด้วยเงื่อนไขหลายทาง: ถ้า h ≤ 2 ค่าจอด 0 / ถ้า h ≤ 5 ค่าจอด (h − 2) × 20 / นอกนั้น ค่าจอด 3 × 20 + (h − 5) × 50"
        why: "ชั่วโมงที่ 3 ถึง 5 มี 3 ชั่วโมง ราคาส่วนนี้จึงเต็มที่ 3 × 20 = 60 บาท ก่อนเริ่มคิดชั่วโมงละ 50"
      - text: "ไล่ด้วย 3 ชั่วโมง 10 นาที: m = 190 นาที h = ปัดขึ้น(3.17) = 4 ซึ่งไม่เกิน 5 ค่าจอด (4 − 2) × 20 = 40 บาท"
      - text: "ทดสอบค่าบนรอยต่อ: 120 นาที ได้ h = 2 ค่าจอด 0 บาท และ 121 นาที ได้ h = 3 ค่าจอด 20 บาท ตรงกับกติกา"
    answer: "จอด 3 ชั่วโมง 10 นาที เสีย 40 บาท (ผังงานของอัลกอริทึมนี้อยู่ในโจทย์ฝึก)"
  - { type: check, problem: computer.algorithms.computational-thinking.p007, prompt: "ไล่รหัสลำลองที่มีวงวนและเงื่อนไข" }
glossary:
  - { term: แนวคิดเชิงคำนวณ (computational thinking), definition: "วิธีคิดแก้ปัญหาแบบนักคอมพิวเตอร์ ประกอบด้วยการแยกส่วนย่อย การหารูปแบบ แนวคิดเชิงนามธรรม และการออกแบบอัลกอริทึม" }
  - { term: การแยกส่วนย่อย (decomposition), definition: "การแบ่งปัญหาใหญ่เป็นปัญหาย่อยที่เล็กและจัดการได้" }
  - { term: การหารูปแบบ (pattern recognition), definition: "การสังเกตความเหมือนหรือความซ้ำในปัญหา เพื่อใช้วิธีเดียวกันซ้ำหรือนำวิธีที่เคยใช้มาปรับ" }
  - { term: แนวคิดเชิงนามธรรม (abstraction), definition: "การเลือกเก็บเฉพาะรายละเอียดที่จำเป็นต่อการแก้ปัญหา และตัดส่วนที่ไม่เกี่ยวข้องทิ้ง" }
  - { term: รหัสลำลอง (pseudocode), definition: "การเขียนขั้นตอนของอัลกอริทึมด้วยภาษาที่คนอ่านง่ายแต่มีโครงสร้างคล้ายโปรแกรม" }
  - { term: แบบจำลอง (model), definition: "ตัวแทนอย่างง่ายของระบบจริง ที่เก็บสถานะและพฤติกรรมที่สำคัญไว้" }
flashcards:
  - { front: "องค์ประกอบสี่อย่างของแนวคิดเชิงคำนวณ", back: "แยกส่วนย่อย หารูปแบบ นามธรรม อัลกอริทึม" }
  - { front: "แผนผังรถไฟฟ้าเป็นตัวอย่างของอะไร", back: "แนวคิดเชิงนามธรรม เก็บลำดับสถานีและจุดเปลี่ยนสาย ตัดถนนและระยะทางจริงทิ้ง" }
  - { front: "ทำไมต้องปัดเศษขึ้นเมื่อคิดจำนวนรถ", back: "จำนวนรถต้องเป็นจำนวนเต็มที่พอสำหรับทุกคน 3.6 คันจึงต้องเป็น 4 คัน" }
  - { front: "ตัวอย่างอัลกอริทึมเดียวที่ใช้ได้หลายวิชา", back: "ค้นหาแบบแบ่งครึ่ง นับความถี่ หาค่ามากที่สุด เรียงลำดับ" }
