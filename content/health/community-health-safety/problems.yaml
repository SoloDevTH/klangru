problems:
- id: health.community.community-health-safety.p001
  topics:
  - health.community.community-health-safety
  difficulty: 1
  type: mcq
  stem: '**อสม.** ในชุมชนไทยคือใคร'
  choices:
  - id: a
    text: อาสาสมัครสาธารณสุขประจำหมู่บ้าน คนในชุมชนที่ผ่านการอบรมด้านสุขภาพ
    correct: true
  - id: b
    text: แพทย์ประจำโรงพยาบาลจังหวัด
    feedback: อสม. ไม่ใช่แพทย์ แต่เป็นคนในชุมชนที่อาสาและผ่านการอบรม
  - id: c
    text: เจ้าหน้าที่ตำรวจจราจรประจำตำบล
    feedback: ตำรวจเป็นผู้บังคับใช้กฎหมาย ไม่ใช่ อสม.
  - id: d
    text: พนักงานเก็บขยะของเทศบาล
    feedback: การเก็บขยะเป็นงานของ อบต. หรือเทศบาล
  hints:
  - ส. ในคำย่อมาจากคำว่า สาธารณสุข
  - ม. มาจากคำว่า หมู่บ้าน
  solution: อสม. คือ อาสาสมัครสาธารณสุขประจำหมู่บ้าน เป็นคนในชุมชนที่อาสาและผ่านการอบรม ทั่วประเทศมีมากกว่า 1 ล้านคน ทำงานร่วมกับ รพ.สต. เช่น สำรวจลูกน้ำยุงลาย วัดความดัน และเยี่ยมผู้ป่วยที่บ้าน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.community-health-safety.p002
  topics:
  - health.community.community-health-safety
  difficulty: 1
  type: text
  stem: เห็นคนเจ็บจากรถชนกันหน้าโรงเรียน ควรโทรหมายเลขใดเพื่อเรียกรถพยาบาล (ตอบเป็นตัวเลข 4 หลัก)
  accepted:
  - '1669'
  misconceptions:
  - match: '191'
    feedback: 191 คือแจ้งเหตุด่วนเหตุร้ายกับตำรวจ เรียกรถพยาบาลต้องโทร 1669
  - match: '199'
    feedback: 199 คือแจ้งไฟไหม้
  - match: '1323'
    feedback: 1323 คือสายด่วนสุขภาพจิต
  hints:
  - เป็นสายด่วนการแพทย์ฉุกเฉิน
  - ขึ้นต้นด้วย 16
  solution: 1669 คือสายด่วนการแพทย์ฉุกเฉิน แจ้งสถานที่ จำนวนผู้บาดเจ็บ และอาการ ส่วน 191 คือแจ้งเหตุด่วนเหตุร้าย 199 คือไฟไหม้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.community-health-safety.p003
  topics:
  - health.community.community-health-safety
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนการแก้ปัญหาสุขภาพชุมชนจากขั้นแรกไปขั้นสุดท้าย
  items:
  - รวบรวมข้อมูลจาก รพ.สต. แบบสำรวจ และแผนที่ชุมชน
  - วิเคราะห์และจัดลำดับความสำคัญของปัญหา
  - วางแผน กำหนดเป้าหมาย กิจกรรม และผู้รับผิดชอบ
  - ลงมือทำตามแผนร่วมกับคนในชุมชน
  - ประเมินผลโดยเทียบข้อมูลก่อนและหลัง
  hints:
  - ต้องรู้ก่อนว่ามีปัญหาอะไร
  - ประเมินผลได้ก็ต่อเมื่อลงมือทำแล้ว
  solution: รวบรวมข้อมูล → วิเคราะห์และจัดลำดับ → วางแผน → ลงมือทำ → ประเมินผล แล้วนำผลประเมินกลับไปปรับแผนรอบใหม่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.community-health-safety.p004
  topics:
  - health.community.community-health-safety
  difficulty: 2
  type: match
  stem: จับคู่ผู้ที่เกี่ยวข้องกับบทบาทในการดูแลสุขภาพและความปลอดภัยของชุมชน
  pairs:
  - left: อสม.
    right: เคาะประตูบ้านสำรวจลูกน้ำและวัดความดันโลหิต
  - left: รพ.สต.
    right: ตรวจรักษาเบื้องต้น ฉีดวัคซีน และดูแลแม่และเด็ก
  - left: อบต. หรือเทศบาล
    right: ติดไฟส่องสว่างและจัดการขยะของชุมชน
  - left: ตำรวจ
    right: ตั้งจุดตรวจหมวกนิรภัยและบังคับใช้กฎจราจร
  - left: นักเรียนแต่ละคน
    right: คว่ำภาชนะขังน้ำที่บ้านทุกสัปดาห์
  hints:
  - ใครเป็นอาสาสมัครที่ลงพื้นที่ถึงบ้าน
  - ใครมีงบประมาณดูแลถนนและขยะ
  solution: อสม. ลงพื้นที่ถึงบ้าน รพ.สต. ให้บริการสุขภาพ อบต./เทศบาลดูแลโครงสร้างและบริการสาธารณะ ตำรวจบังคับใช้กฎหมาย และแต่ละคนรับผิดชอบสุขภาพของตนและบ้านตนเอง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.community-health-safety.p005
  topics:
  - health.community.community-health-safety
  difficulty: 2
  type: numeric
  stem: จากตาราง หมู่ 3 มีค่าดัชนีบ้านที่พบลูกน้ำ (HI) เท่าใด
  answer:
    value: 17.5
    tolerance: 0.1
  misconceptions:
  - match: 27.5
    feedback: นี่คือ BI (ภาชนะที่พบลูกน้ำ 22 ต่อบ้าน 80 หลัง) ไม่ใช่ HI
  - match: 3.93
    feedback: นี่คือ CI (ภาชนะที่พบ 22 ÷ ภาชนะที่สำรวจ 560) ไม่ใช่ HI
  hints:
  - HI = บ้านที่พบลูกน้ำ ÷ บ้านที่สำรวจ × 100
  - หมู่ 3 พบ 14 บ้าน จากที่สำรวจ 80 บ้าน
  solution: $\mathrm{HI} = \frac{14}{80} \times 100 = 17.5$ เกินเกณฑ์ HI ไม่เกิน 10 ของกรมควบคุมโรค
  figure:
    src: survey.svg
    alt: ตารางผลสำรวจลูกน้ำยุงลาย 4 หมู่บ้าน ข้อมูลสมมติ หมู่ 1 สำรวจ 60 บ้าน พบลูกน้ำ 9 บ้าน ภาชนะ 420 พบลูกน้ำ 15 หมู่ 2 สำรวจ 45 บ้าน พบ 3 บ้าน ภาชนะ 300 พบ 4 หมู่ 3 สำรวจ 80 บ้าน พบ 14 บ้าน ภาชนะ 560 พบ 22 หมู่ 4 สำรวจ 50 บ้าน พบ 5 บ้าน ภาชนะ 350 พบ 6
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.community-health-safety.p006
  topics:
  - health.community.community-health-safety
  difficulty: 3
  type: numeric
  stem: จากตาราง หมู่ 1 มีค่าดัชนีบรูโต (BI) คือจำนวนภาชนะที่พบลูกน้ำต่อบ้าน 100 หลังคาเรือน เท่าใด
  answer:
    value: 25
  misconceptions:
  - match: 15
    feedback: นี่คือ HI (บ้านที่พบ 9 ÷ 60 × 100) ไม่ใช่ BI
  - match: 3.57
    feedback: นี่คือ CI (15 ÷ 420 × 100) BI ต้องหารด้วยจำนวนบ้าน
  hints:
  - BI ใช้ภาชนะที่พบลูกน้ำเป็นตัวตั้ง
  - แต่หารด้วยจำนวนบ้านที่สำรวจ แล้วคูณ 100
  solution: $\mathrm{BI} = \frac{15}{60} \times 100 = 25$ คือพบภาชนะมีลูกน้ำ 25 ภาชนะต่อบ้าน 100 หลัง
  figure:
    src: survey.svg
    alt: ตารางผลสำรวจลูกน้ำยุงลาย 4 หมู่บ้าน ข้อมูลสมมติ หมู่ 1 สำรวจ 60 บ้าน พบลูกน้ำ 9 บ้าน ภาชนะ 420 พบลูกน้ำ 15 หมู่ 2 สำรวจ 45 บ้าน พบ 3 บ้าน ภาชนะ 300 พบ 4 หมู่ 3 สำรวจ 80 บ้าน พบ 14 บ้าน ภาชนะ 560 พบ 22 หมู่ 4 สำรวจ 50 บ้าน พบ 5 บ้าน ภาชนะ 350 พบ 6
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.community-health-safety.p007
  topics:
  - health.community.community-health-safety
  difficulty: 3
  type: mcq
  stem: จากตาราง หมู่บ้านใดมีค่า HI **ไม่ผ่าน** เกณฑ์ของกรมควบคุมโรค (ชุมชนต้องมี HI ไม่เกิน 10)
  choices:
  - id: a
    text: หมู่ 1 และหมู่ 3
    correct: true
    feedback: ถูก HI ของหมู่ 1 คือ 15 และหมู่ 3 คือ 17.5
  - id: b
    text: หมู่ 1 หมู่ 3 และหมู่ 4
    feedback: หมู่ 4 มี HI = 5/50 × 100 = 10 พอดี ซึ่ง "ไม่เกิน 10" จึงผ่านเกณฑ์
  - id: c
    text: เฉพาะหมู่ 3
    feedback: หมู่ 1 มี HI = 9/60 × 100 = 15 ก็เกิน 10 ด้วย
  - id: d
    text: ทุกหมู่บ้าน เพราะพบลูกน้ำทุกหมู่
    feedback: เกณฑ์ชุมชนยอมให้ HI ไม่เกิน 10 ไม่ได้ต้องเป็น 0 (เกณฑ์ CI = 0 ใช้กับโรงเรียนและโรงพยาบาล)
  hints:
  - คำนวณ HI ของทุกหมู่บ้าน
  - '"ไม่เกิน 10" รวม 10 ด้วย'
  solution: HI หมู่ 1 = 15, หมู่ 2 = 6.7, หมู่ 3 = 17.5, หมู่ 4 = 10 ที่เกิน 10 คือหมู่ 1 และหมู่ 3 จึงควรเร่งกำจัดแหล่งเพาะพันธุ์ก่อน
  figure:
    src: survey.svg
    alt: ตารางผลสำรวจลูกน้ำยุงลาย 4 หมู่บ้าน ข้อมูลสมมติ หมู่ 1 สำรวจ 60 บ้าน พบลูกน้ำ 9 บ้าน ภาชนะ 420 พบลูกน้ำ 15 หมู่ 2 สำรวจ 45 บ้าน พบ 3 บ้าน ภาชนะ 300 พบ 4 หมู่ 3 สำรวจ 80 บ้าน พบ 14 บ้าน ภาชนะ 560 พบ 22 หมู่ 4 สำรวจ 50 บ้าน พบ 5 บ้าน ภาชนะ 350 พบ 6
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.community-health-safety.p008
  topics:
  - health.community.community-health-safety
  difficulty: 3
  type: mcq
  stem: ชุมชนติดตั้งไฟส่องสว่างและป้ายเตือนที่ทางโค้งหน้าโรงเรียน เป็นการลดอุบัติเหตุตามหลัก 5E ข้อใด
  choices:
  - id: a
    text: Engineering ปรับสภาพแวดล้อมทางกายภาพ
    correct: true
  - id: b
    text: Education ให้ความรู้
    feedback: การให้ความรู้คือการสอนหรือรณรงค์ ไม่ใช่การติดตั้งอุปกรณ์
  - id: c
    text: Enforcement บังคับใช้กฎ
    feedback: การบังคับใช้กฎคือการตรวจและลงโทษตามกฎหมาย
  - id: d
    text: Evaluation ประเมินผล
    feedback: ประเมินผลคือการเก็บข้อมูลหลังทำโครงการ
  hints:
  - เป็นการเปลี่ยนถนนหรือคน
  - การแก้ที่สภาพแวดล้อมใช้คำว่า engineering
  solution: การติดไฟและป้ายคือการปรับสภาพแวดล้อม (Engineering) ช่วยทุกคนที่ใช้ถนนแม้ไม่ได้ฟังการรณรงค์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.community-health-safety.p009
  topics:
  - health.community.community-health-safety
  difficulty: 3
  type: match
  stem: จับคู่หลัก 5E กับกิจกรรมลดอุบัติเหตุจากการจมน้ำที่บ่อดินกลางหมู่บ้าน
  pairs:
  - left: Education
    right: สอนเด็กเรื่องตะโกน โยน ยื่น และห้ามลงไปช่วยเอง
  - left: Engineering
    right: ล้อมรั้วรอบบ่อและแขวนขวดน้ำพลาสติกผูกเชือกไว้ใช้โยน
  - left: Enforcement
    right: ออกข้อตกลงหมู่บ้านห้ามเด็กเล่นน้ำในบ่อโดยไม่มีผู้ใหญ่
  - left: Emergency
    right: ติดป้ายเบอร์ 1669 และฝึกผู้ใหญ่ทำ CPR
  - left: Evaluation
    right: นับจำนวนเหตุจมน้ำก่อนและหลังทำโครงการ
  hints:
  - ข้อตกลงหรือกฎใช้หลักใด
  - การเตรียมรับเหตุฉุกเฉินคือ Emergency
  solution: แต่ละหลักแก้คนละด้าน ใช้ร่วมกันจะได้ผลดีกว่าการใช้หลักเดียว (การช่วยคนตกน้ำดูใน [ความปลอดภัยทางน้ำ ทางบก และการเดินทาง](/topic/health.safety.road-water/))
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.community-health-safety.p010
  topics:
  - health.community.community-health-safety
  difficulty: 3
  type: numeric
  stem: สภานักเรียนให้คะแนนปัญหา "รถจักรยานยนต์ล้มที่ทางโค้งหน้าโรงเรียน" (คะแนนแต่ละเกณฑ์ 1–4) ขนาดของปัญหา 3 ความรุนแรง 4 ความยากง่ายในการแก้ 2 ความร่วมมือของชุมชน 3 คะแนนรวมเท่าใด
  answer:
    value: 12
    unit: คะแนน
  misconceptions:
  - match: 9
    feedback: ลืมบวกคะแนนเกณฑ์ใดเกณฑ์หนึ่ง ต้องรวมครบ 4 เกณฑ์
  - match: 72
    feedback: นี่คือการคูณคะแนน บทเรียนนี้ใช้การรวมคะแนน
  hints:
  - รวมคะแนนทุกเกณฑ์
  - มี 4 เกณฑ์
  solution: $3 + 4 + 2 + 3 = 12$ คะแนน แล้วนำไปเทียบกับปัญหาอื่น ปัญหาที่ได้คะแนนรวมสูงสุดแก้ก่อน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.community-health-safety.p011
  topics:
  - health.community.community-health-safety
  difficulty: 4
  type: numeric
  stem: ก่อนโครงการ นักเรียนนับผู้ขับขี่จักรยานยนต์หน้าโรงเรียนได้ 120 คน สวมหมวกนิรภัย 54 คน หลังโครงการ 3 เดือนนับได้ 125 คน สวม 90 คน อัตราการสวมหมวกเพิ่มขึ้นกี่ **จุดร้อยละ** (ผลต่างของร้อยละ)
  answer:
    value: 27
    unit: จุดร้อยละ
  misconceptions:
  - match: 60
    feedback: นี่คือการเพิ่มขึ้นเทียบกับค่าเดิม (27 ÷ 45) โจทย์ถามผลต่างของร้อยละ
  - match: 36
    feedback: นำจำนวนคน 90 − 54 มาลบกันตรง ๆ แต่จำนวนคนที่นับต่างกัน ต้องเทียบเป็นร้อยละ
  hints:
  - คำนวณร้อยละก่อนและหลังแยกกัน
  - จำนวนคนที่นับไม่เท่ากัน จึงห้ามเอา 90 − 54 ตรง ๆ
  solution: ก่อน $\frac{54}{120} \times 100 = 45\%$ หลัง $\frac{90}{125} \times 100 = 72\%$ เพิ่มขึ้น $72 - 45 = 27$ จุดร้อยละ (ถ้าคิดเทียบกับค่าเดิมจะเพิ่มขึ้น 60%)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.community.community-health-safety.p012
  topics:
  - health.community.community-health-safety
  difficulty: 4
  type: mcq
  stem: ข้อใดเป็น **เป้าหมาย** ของโครงการลดไข้เลือดออกที่เขียนได้ดีที่สุด
  choices:
  - id: a
    text: ภายในเดือนกันยายน หมู่ 3 มีค่า HI ไม่เกิน 10 จากการสำรวจทุกหลังคาเรือน
    correct: true
  - id: b
    text: ทำให้ชุมชนปลอดยุงลายและทุกคนมีสุขภาพดี
    feedback: ฟังดี แต่วัดไม่ได้และไม่มีกำหนดเวลา
  - id: c
    text: รณรงค์เรื่องไข้เลือดออกให้มากที่สุด
    feedback: เป็นกิจกรรม ไม่ใช่ผลลัพธ์ที่วัดได้
  - id: d
