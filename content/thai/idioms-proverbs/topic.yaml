id: thai.grammar.idioms-proverbs
subject: thai
title: { th: สำนวน คำพังเพย และสุภาษิต, en: "Thai idioms, sayings and proverbs" }
summary: บอกความหมายและที่มาของสำนวนไทย แยกสำนวน คำพังเพย และสุภาษิตจากลักษณะของถ้อยคำ และเลือกใช้สำนวนให้ถูกความหมายและเหมาะกับสถานการณ์
difficulty: 3
minutes: 30
prerequisites: [thai.reading.word-meaning-in-context]
encompasses:
  - { id: thai.reading.word-meaning-in-context, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: three-groups.svg
    alt: "กรอบใหญ่ชื่อ สำนวน (ความหมายกว้าง): ถ้อยคำสืบต่อกันมา ความหมายไม่ตรงตามตัว ข้างในแบ่ง 3 กลุ่ม กลุ่มสำนวน: วลีสั้น บอกลักษณะ ตัวอย่าง ไก่อ่อน ผักชีโรยหน้า ปิดทองหลังพระ คมในฝัก กลุ่มคำพังเพย: เปรียบเหตุการณ์ ให้คิดเอง ตัวอย่าง รำไม่ดีโทษปี่โทษกลอง ขี่ช้างจับตั๊กแตน หนีเสือปะจระเข้ กลุ่มสุภาษิต: สอนตรง ๆ ควร/อย่า ตัวอย่าง น้ำเชี่ยวอย่าขวางเรือ น้ำขึ้นให้รีบตัก"
    caption: "สำนวนในความหมายกว้าง และการแบ่ง 3 กลุ่มตามแบบเรียน"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: เลือกสำนวนให้ตรงสถานการณ์
    problem: "\"นักเรียนรีบทาสีห้องตอนเช้าวันที่ผู้อำนวยการมาตรวจ แต่ใต้โต๊ะยังเต็มไปด้วยขยะ\" ใช้สำนวนใด"
    steps:
      - text: "สรุปสถานการณ์: ทำให้ดูดีเฉพาะส่วนที่คนเห็น ส่วนที่ไม่เห็นยังไม่เรียบร้อย"
      - text: "นึกสำนวนที่เกี่ยวกับการทำดี: ปิดทองหลังพระ กับ ผักชีโรยหน้า"
      - text: "เทียบความหมาย: ปิดทองหลังพระ = ทำดีจริงแต่ไม่มีใครเห็น · ผักชีโรยหน้า = ทำดีเพียงผิวเผิน"
        why: "สองสำนวนนี้คล้ายกันเพราะพูดถึงการทำดี ต้องดูว่าทำจริงหรือแค่ภายนอก"
      - text: "สถานการณ์นี้ทำแค่ภายนอกให้ผู้ตรวจเห็น จึงตรงกับผักชีโรยหน้า"
    answer: "ผักชีโรยหน้า"
  - { type: check, problem: thai.grammar.idioms-proverbs.p006, prompt: "ทำดีจริงหรือแค่ภายนอก" }
  - type: worked-example
    title: จำแนกคำพังเพยกับสุภาษิต
    problem: "จำแนก \"รำไม่ดีโทษปี่โทษกลอง\" และ \"น้ำเชี่ยวอย่าขวางเรือ\""
    steps:
      - text: "รำไม่ดีโทษปี่โทษกลอง: เล่าเหตุการณ์คนรำที่โทษวงดนตรี ไม่ได้บอกว่าควรทำอะไร ผู้ฟังตีความเอง"
      - text: "น้ำเชี่ยวอย่าขวางเรือ: มีคำว่า อย่า เป็นการสั่งสอนตรง ๆ"
        why: "คำสั่งสอนอย่าง ให้ อย่า ควร เป็นเครื่องหมายของสุภาษิต"
      - text: "ข้อสังเกต: พจนานุกรมยกรำไม่ดีโทษปี่โทษกลองเป็นตัวอย่างสำนวน ซึ่งเป็นความหมายกว้าง"
    answer: "รำไม่ดีโทษปี่โทษกลอง เป็นคำพังเพย (ตามแบบเรียน) · น้ำเชี่ยวอย่าขวางเรือ เป็นสุภาษิต"
  - { type: check, problem: thai.grammar.idioms-proverbs.p005, prompt: "หาคำสั่งสอน ให้ อย่า ควร" }
glossary:
  - { term: สำนวน, definition: "ถ้อยคำที่กล่าวสืบต่อกันมา มีความหมายไม่ตรงตามตัวหรือมีความหมายแฝง" }
  - { term: คำพังเพย, definition: "ถ้อยคำที่กล่าวเป็นกลาง ๆ เปรียบเหตุการณ์ ให้ผู้ฟังตีความเข้ากับเรื่อง" }
  - { term: สุภาษิต, definition: "ถ้อยคำที่กล่าวสืบต่อกันมา มีความหมายเป็นคติสอนใจ" }
  - { term: ที่มาของสำนวน, definition: "สิ่งในชีวิตที่สำนวนนำมาเปรียบ เช่น การเดินเรือ ศาสนา อาหาร สัตว์ การแสดง" }
flashcards:
  - { front: "วัวหายล้อมคอก", back: "เรื่องเกิดขึ้นแล้วจึงคิดแก้ไข" }
  - { front: "ปิดทองหลังพระ กับ ผักชีโรยหน้า", back: "ปิดทองหลังพระ = ทำดีจริงแต่ไม่มีใครเห็น · ผักชีโรยหน้า = ทำดีเพียงผิวเผิน" }
  - { front: "สุภาษิตต่างจากคำพังเพยอย่างไร", back: "สุภาษิตสอนตรง ๆ (ให้ อย่า ควร) คำพังเพยเปรียบเหตุการณ์ให้คิดเอง" }
  - { front: "ขี่ช้างจับตั๊กแตน", back: "ลงทุนมากแต่ได้ผลนิดเดียว" }
  - { front: "น้ำเชี่ยวอย่าขวางเรือ", back: "อย่าขวางผู้มีอำนาจหรือคนที่กำลังโกรธจัด" }
