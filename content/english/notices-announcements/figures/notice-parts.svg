<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 470" width="750" height="470" font-family="sans-serif">
<title>ประกาศค่ายภาษาอังกฤษพร้อมป้ายบอกส่วนประกอบ</title>
<rect x="0" y="0" width="750" height="470" fill="#fff"/>
<rect x="20.0" y="20.0" width="450.0" height="430.0" rx="4" fill="#fffdf6" stroke="#555" stroke-width="2"/>
<text x="245.0" y="58.0" font-size="24" text-anchor="middle" fill="#1d3f75" font-weight="bold">NOTICE</text>
<text x="450.0" y="86.0" font-size="15" text-anchor="end" fill="#111" font-weight="normal">2 November 2026</text>
<text x="40.0" y="122.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="bold">English Camp for M.1–M.3 Students</text>
<text x="40.0" y="168.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">We are pleased to announce that the English</text>
<text x="40.0" y="191.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">Camp will be held on Saturday, 21 November,</text>
<text x="40.0" y="214.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">from 8:30 a.m. to 3:30 p.m. in the school hall.</text>
<text x="40.0" y="237.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">All M.1–M.3 students are invited to join.</text>
<text x="40.0" y="283.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">Please register with Kru Malee by 13 November.</text>
<text x="40.0" y="306.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">Lunch is provided. Please bring a pencil case.</text>
<text x="40.0" y="352.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">For more information, contact the English</text>
<text x="40.0" y="375.0" font-size="15.5" text-anchor="start" fill="#111" font-weight="normal">Department.</text>
<text x="450.0" y="405.0" font-size="15" text-anchor="end" fill="#111" font-weight="normal">Kru Malee Srisuk</text>
<text x="450.0" y="427.0" font-size="14" text-anchor="end" fill="#444" font-weight="normal">Head of the English Department</text>
<line x1="530.0" y1="53.0" x2="476.0" y2="53.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round"/>
<polygon points="476.0,53.0 484.1,49.1 484.1,56.9" fill="#b3261e" stroke="#b3261e" stroke-width="1" stroke-linejoin="round"/>
<text x="538.0" y="58.0" font-size="15" text-anchor="start" fill="#b3261e" font-weight="bold">หัวเรื่อง (NOTICE หรือชื่องาน)</text>
<line x1="530.0" y1="81.0" x2="476.0" y2="81.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round"/>
<polygon points="476.0,81.0 484.1,77.1 484.1,84.9" fill="#b3261e" stroke="#b3261e" stroke-width="1" stroke-linejoin="round"/>
<text x="538.0" y="86.0" font-size="15" text-anchor="start" fill="#b3261e" font-weight="bold">วันที่ออกประกาศ</text>
<line x1="530.0" y1="175.0" x2="476.0" y2="175.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round"/>
<polygon points="476.0,175.0 484.1,171.1 484.1,178.9" fill="#b3261e" stroke="#b3261e" stroke-width="1" stroke-linejoin="round"/>
<text x="538.0" y="180.0" font-size="15" text-anchor="start" fill="#b3261e" font-weight="bold">เนื้อความ: What · When</text>
<text x="538.0" y="200.0" font-size="14" text-anchor="start" fill="#b3261e" font-weight="normal">Where · Who</text>
<line x1="530.0" y1="291.0" x2="476.0" y2="291.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round"/>
<polygon points="476.0,291.0 484.1,287.1 484.1,294.9" fill="#b3261e" stroke="#b3261e" stroke-width="1" stroke-linejoin="round"/>
<text x="538.0" y="296.0" font-size="15" text-anchor="start" fill="#b3261e" font-weight="bold">วิธีสมัคร สิ่งที่ต้องเตรียม</text>
<text x="538.0" y="316.0" font-size="14" text-anchor="start" fill="#b3261e" font-weight="normal">การติดต่อ</text>
<line x1="530.0" y1="411.0" x2="476.0" y2="411.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round"/>
<polygon points="476.0,411.0 484.1,407.1 484.1,414.9" fill="#b3261e" stroke="#b3261e" stroke-width="1" stroke-linejoin="round"/>
<text x="538.0" y="416.0" font-size="15" text-anchor="start" fill="#b3261e" font-weight="bold">ผู้ออกประกาศ</text>
<text x="538.0" y="436.0" font-size="14" text-anchor="start" fill="#b3261e" font-weight="normal">ชื่อและตำแหน่ง</text>
</svg>
