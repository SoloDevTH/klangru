id: technology.living.problem-solving-learning
subject: technology
title:
  th: ทักษะกระบวนการแก้ปัญหาและการแสวงหาความรู้เพื่อพัฒนาการทำงาน
  en: Problem-solving and knowledge-seeking skills for work
summary: ขั้นของการแก้ปัญหาในการทำงานตั้งแต่ระบุปัญหา หาสาเหตุด้วยการถามทำไมซ้ำ ไปจนถึงตัดสินใจด้วยเกณฑ์ ทดลอง และประเมินผล พร้อมวิธีหาความรู้จากแหล่งที่เชื่อถือได้
difficulty: 3.5
minutes: 35
prerequisites:
- technology.living.work-process
encompasses:
- id: technology.living.work-process
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: ถามทำไมซ้ำ ๆ จนถึงต้นเหตุ
  src: ladder.svg
  alt: ผังแนวตั้งห้าขั้นจากบนลงล่าง ขั้นแรกคือปัญหาผักกวางตุ้งเหี่ยวภายใน 2 วัน ขั้นทำไม 1 คือใบผักเสียน้ำเร็วกว่าปกติ ขั้นทำไม 2 คือวางผักใกล้ช่องลมเย็นและไม่ได้ห่อให้ชื้น ขั้นทำไม 3 คือไม่รู้ว่าช่องไหนมีลมเป่าแรง ขั้นทำไม 4 คือยังไม่เคยอ่านคู่มือหรือถามผู้รู้ และขั้นต้นเหตุคือขาดความรู้ จึงต้องทดลองวางผักในช่องอื่นและบันทึกผล
- type: worked-example
  title: เปรียบเทียบผลการทดลองสองวิธีเก็บผัก
  problem: ทดลองเก็บผักด้วยวิธีที่ 1 (ห่อกระดาษ) ได้สด 3, 4 และ 3 วัน ส่วนวิธีที่ 2 (ห่อผ้าชุบน้ำหมาด) ได้สด 5, 6 และ 5 วัน วิธีใดควรเลือก
  steps:
  - text: หาค่าเฉลี่ยของวิธีที่ 1 (3 + 4 + 3) ÷ 3 ≈ 3.3 วัน
    why: ใช้ค่าเฉลี่ยจากการทดลองซ้ำเพื่อลดผลจากความบังเอิญของการทำครั้งเดียว
  - text: หาค่าเฉลี่ยของวิธีที่ 2 (5 + 6 + 5) ÷ 3 ≈ 5.3 วัน
  - text: เทียบส่วนต่าง 5.3 − 3.3 = 2.0 วัน
  - text: ตรวจว่าเปลี่ยนเพียงวิธีห่อ และทั้งสองวิธีใช้ผักชนิดเดียวกันในที่เดียวกัน
    why: ถ้าเปลี่ยนหลายอย่างพร้อมกัน จะบอกไม่ได้ว่าความต่างมาจากวิธีใด
  answer: วิธีที่ 2 สดนานกว่าเฉลี่ยประมาณ 2 วัน จึงควรเลือกและบันทึกไว้ใช้ต่อ
- type: check
  problem: technology.living.problem-solving-learning.p002
  prompt: ลองเขียนปัญหาที่คุณเจอวันนี้ให้ชัดเจนเหมือนข้อที่ถูก
- type: worked-example
  title: แก้ปัญหาขนมไม่ฟูตามขั้นตอน
  problem: อบเค้กกล้วยหอมแล้วไม่ฟู ควรแก้ปัญหาอย่างไรให้เป็นระบบ
  steps:
  - text: ระบุปัญหาให้ชัด เช่น เค้กกล้วยหอมที่ใช้ผงฟู 1 ช้อนชา อบในพิมพ์ขนาด 20 เซนติเมตรแล้วสูงเพียง 3 เซนติเมตร
  - text: หาสาเหตุด้วยการถามทำไมซ้ำ เช่น ทำไมขนมไม่ฟู ก็เพราะผงฟูอาจเสื่อม ทำไมผงฟูจึงเสื่อม ก็เพราะเก็บไว้ในที่ชื้นนาน
    why: การถามต่อเรื่อย ๆ ช่วยให้พบสาเหตุที่แก้ได้จริง ไม่หยุดที่อาการ
  - text: คิดทางเลือก เช่น เปลี่ยนผงฟูใหม่ ปรับปริมาณผงฟู หรือเก็บผงฟูในภาชนะปิดสนิท
  - text: ทดลองทีละอย่าง โดยเปลี่ยนเฉพาะผงฟูและทำซ้ำสามครั้ง แล้วบันทึกความสูงของขนม
    why: การเปลี่ยนทีละอย่างทำให้รู้ว่าอะไรช่วยได้จริง
  - text: ประเมินผลเทียบกับเป้าหมาย แล้วบันทึกวิธีที่ได้ผลไว้ใช้รอบถัดไป
  answer: ใช้วิธีทดลองทีละอย่างและบันทึกผลจนพบวิธีที่ขนมฟูตามเป้าหมาย
- type: check
  problem: technology.living.problem-solving-learning.p013
  prompt: ลองนึกทางเลือกที่ใช้แก้ปัญหาในบ้านของคุณให้ได้อย่างน้อยสามแบบก่อนตัดสิน
glossary:
- term: ต้นเหตุ
  definition: สาเหตุที่อยู่ลึกที่สุดของปัญหาซึ่งแก้ได้จริง ถ้าแก้แล้วปัญหาไม่กลับมาอีก
- term: ตารางให้คะแนน
  definition: ตารางที่ให้คะแนนทางเลือกตามเกณฑ์ที่มีน้ำหนักต่างกัน แล้วรวมคะแนนเพื่อเปรียบเทียบ
- term: 5 ทำไม
  definition: เทคนิคถามว่าทำไมซ้ำ ๆ จากปัญหาที่เกิดขึ้นจนถึงต้นเหตุที่แก้ไขได้
- term: ปราชญ์ชาวบ้าน
  definition: ผู้มีความรู้และประสบการณ์สั่งสมจากการดำรงชีวิตและการทำงานในชุมชน
- term: แหล่งความรู้ที่น่าเชื่อถือ
  definition: แหล่งที่ระบุที่มาและผู้รับผิดชอบข้อมูลได้ มีวิธีทดสอบหรือหลักฐานให้ตรวจสอบได้
flashcards:
- front: ขั้นของการแก้ปัญหาในการทำงานมีอะไรบ้าง
  back: ระบุปัญหา หาสาเหตุ สร้างทางเลือก ตั้งเกณฑ์และเลือก ลงมือทดลอง และประเมินผล
- front: การถามทำไมซ้ำ ๆ ใช้ทำอะไร
  back: ใช้หาต้นเหตุของปัญหาที่แก้ได้จริง แทนการแก้เพียงอาการที่เห็น
- front: ต่างจากการลองผิดลองถูกอย่างไร
  back: การตัดสินใจอย่างมีเหตุผลใช้เกณฑ์และหลักฐานประกอบการเลือก แล้วตรวจผลหลังทำ
- front: ควรประเมินแหล่งความรู้อย่างไร
  back: ดูว่ามีที่มาและผู้รับผิดชอบข้อมูลไหม มีวิธีทดสอบหรือไม่ และสอดคล้องกับหลักฐานอื่นหรือไม่
