  - id: math.logic.sets.p019
    topics: [math.logic.sets]
    difficulty: 3
    type: numeric
    stem: "จากแผนภาพเวนน์จำนวนนักเรียนที่เลี้ยงสุนัข (A) และแมว (B) จงหา $n(A \\cup B)$"
    figure: { src: venn-problem.svg, alt: "แผนภาพเวนน์ U มีวงกลมสุนัข (A) และแมว (B) ซ้อนกัน ส่วนสุนัขอย่างเดียวเขียน 12 ส่วนที่ซ้อนกันเขียน 7 ส่วนแมวอย่างเดียวเขียน 9 และนอกวงกลมทั้งสองเขียน 4" }
    answer: { value: 28, unit: คน }
    hints:
      - "$A \\cup B$ คือทุกส่วนที่อยู่ในวงกลมใดวงกลมหนึ่ง"
      - "บวกสามส่วนในวงกลม ไม่รวมส่วนนอกวงกลม"
    misconceptions:
      - { match: 35, feedback: "บวก $n(A) + n(B) = 19 + 16$ แต่ส่วนที่ซ้อน 7 คนถูกนับสองครั้ง" }
      - { match: 32, feedback: "32 คือ $n(U)$ รวม 4 คนที่ไม่เลี้ยงทั้งสองอย่างเข้าไปด้วย" }
    solution: "$n(A \\cup B) = 12 + 7 + 9 = 28$ คน (หรือ $19 + 16 - 7 = 28$)"
