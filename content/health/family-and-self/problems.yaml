    choices:
      - { id: a, text: "ครั้งนี้ไม่ได้รางวัล แต่เราตั้งใจวาดจนเสร็จ และได้เรียนรู้วิธีใช้สีแบบใหม่", correct: true }
      - { id: b, text: "เราไม่มีความสามารถอะไรเลย ต่อไปจะไม่วาดรูปอีกแล้ว", feedback: "ผลการแข่งขันครั้งเดียวไม่ได้บอกคุณค่าทั้งหมดของเรา" }
      - { id: c, text: "คนที่ชนะต้องโกงแน่ ๆ", feedback: "การโทษคนอื่นโดยไม่มีหลักฐานไม่ช่วยให้เราพัฒนา และไม่ยุติธรรมกับเพื่อน" }
