<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" font-family="sans-serif" font-size="13">
<title>วงจรนโยบายสาธารณะหกขั้น</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="860" height="440" fill="#ffffff"/>
<text x="430.0" y="28.0" text-anchor="middle" font-size="18" fill="#222" font-weight="bold">วงจรนโยบายสาธารณะ</text>
<rect x="325.0" y="60.0" width="210.0" height="60.0" rx="10" fill="#f7f7f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="430.0" y="85.0" text-anchor="middle" font-size="14" fill="#1f5fa8" font-weight="bold">1 ก่อตัวของปัญหา</text>
<text x="430.0" y="106.0" text-anchor="middle" font-size="13" fill="#222">และกำหนดวาระ</text>
