- id: physics.electricity.dipoles-potential-gradient.p014
  topics:
  - physics.electricity.dipoles-potential-gradient
  difficulty: 4
  type: code
  stem: เขียนฟังก์ชัน `potential(charges, x, y)` ที่คืนค่าศักย์ไฟฟ้ารวม (โวลต์) ที่จุด $(x, y)$ จากรายการประจุ `charges` ซึ่งเป็นลิสต์ของทูเพิล `(q, xi, yi)` โดยใช้ $V = \sum k\,q_i/r_i$ และ $k = 8.988\times10^{9}$ ให้ใช้ไลบรารี `math` ได้
  hints:
  - ศักย์เป็นปริมาณสเกลาร์ จึงวนลูปแล้วบวกค่าของแต่ละประจุได้เลย
  - ระยะจากประจุถึงจุดคำนวณคือ `math.hypot(x - xi, y - yi)`
  - คืนค่ารวมด้วย `return` และอย่าลืมประจุลบที่ให้ค่าศักย์ติดลบ
  language: python
  starter: |
    import math

    K = 8.988e9

    def potential(charges, x, y):
        pass
  tests: |
    import math
    r = potential([(4e-9, 0.0, 0.0), (-2e-9, 0.30, 0.0)], 0.10, 0.0)
    assert r is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return ไม่ใช่ print"
    assert abs(r - 269.6) < 0.5, f"potential ที่ (0.10, 0) ควรได้ประมาณ 269.6 V แต่ได้ {r} (ตรวจว่าประจุลบให้ค่าติดลบและรวมทุกประจุ)"
    r2 = potential([(1e-9, 0.0, 0.0)], 0.0, 1.0)
    assert abs(r2 - 8.988) < 0.01, f"potential ของประจุ 1 nC ที่ระยะ 1 m ควรได้ 8.988 V แต่ได้ {r2}"
    r3 = potential([], 1.0, 1.0)
    assert r3 == 0, f"ไม่มีประจุจึงควรได้ 0 แต่ได้ {r3}"
  reference: |
    import math

    K = 8.988e9

    def potential(charges, x, y):
        total = 0.0
        for q, xi, yi in charges:
            total += K * q / math.hypot(x - xi, y - yi)
        return total
  solution: วนลูปบวก $k\,q/r$ ของทุกประจุ เช่น potential([(4e-9, 0.0, 0.0), (-2e-9, 0.3, 0.0)], 0.1, 0.0) ได้ประมาณ 269.6 V
