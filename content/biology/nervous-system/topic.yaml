id: biology.animals.nervous-system
subject: biology
title: { th: ระบบประสาท, en: "Nervous system" }
summary: ระบบประสาทของสัตว์กลุ่มต่าง ๆ โครงสร้างเซลล์ประสาท ศักย์พักและศักย์งาน การนำกระแสประสาท ไซแนปส์ สมองสามส่วน ไขสันหลัง วงจรรีเฟล็กซ์ และระบบประสาทโซมาติกกับอัตโนวัติ
difficulty: 6
minutes: 55
prerequisites: [biology.cells.membrane-transport]
encompasses:
  - { id: biology.cells.membrane-transport, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: โครงสร้างของเซลล์ประสาทสั่งการ
    src: neuron-structure.svg
    alt: "เซลล์ประสาทสั่งการวางแนวนอน ด้านซ้ายคือตัวเซลล์ทรงกลมมีนิวเคลียสอยู่ตรงกลาง มีเดนไดรต์แตกแขนงสั้นหลายแขนงรอบตัวเซลล์ จากตัวเซลล์มีแอกซอนยาวไปทางขวา แอกซอนหุ้มด้วยเยื่อไมอีลิน (เซลล์ชวันน์) เป็นปล้อง ๆ มีช่องว่างระหว่างปล้องคือโนดออฟแรนเวียร์ ปลายขวาแตกเป็นปลายแอกซอน 4 แขนง ลูกศรด้านล่างบอกทิศทางของกระแสประสาทจากตัวเซลล์ไปยังปลายแอกซอน"
    caption: "เดนไดรต์รับสัญญาณ แอกซอนส่งสัญญาณออก (วาดโดยทีมคลังรู้)"
  - type: figure
    title: ศักย์งาน
    src: action-potential.svg
    alt: "กราฟศักย์เยื่อเซลล์ (มิลลิโวลต์) กับเวลา 0 ถึง 6 มิลลิวินาที เริ่มที่ศักย์พัก −70 mV เมื่อถูกกระตุ้นราวมิลลิวินาทีที่ 1 ศักย์ขึ้นถึงระดับขีดเริ่ม −55 mV (เส้นประ) แล้วพุ่งขึ้นเร็วเป็นช่วงดีโพลาไรเซชันที่ Na⁺ ไหลเข้า จนสูงสุด +30 mV ราวมิลลิวินาทีที่ 1.5 จากนั้นลดลงเร็วเป็นช่วงรีโพลาไรเซชันที่ K⁺ ไหลออก ลงต่ำกว่าศักย์พักถึงราว −80 mV ราวมิลลิวินาทีที่ 2.8 เป็นช่วงไฮเพอร์โพลาไรเซชัน แล้วค่อย ๆ กลับสู่ −70 mV"
    caption: "ศักย์งานหนึ่งครั้งใช้เวลาเพียงไม่กี่มิลลิวินาที (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: เวลาที่สัญญาณเดินทางจากปลายเท้า
    problem: "ระยะจากปลายเท้าถึงไขสันหลัง 1.2 m จงเทียบเวลาที่กระแสประสาทใช้ในแอกซอนที่มีไมอีลิน (100 m/s) กับแอกซอนที่ไม่มีไมอีลิน (1 m/s)"
    steps:
      - text: "เวลา = ระยะทาง ÷ อัตราเร็ว"
      - text: "มีไมอีลิน: $\\tfrac{1.2\\ \\mathrm{m}}{100\\ \\mathrm{m/s}} = 0.012\\ \\mathrm{s} = 12$ มิลลิวินาที"
      - text: "ไม่มีไมอีลิน: $\\tfrac{1.2\\ \\mathrm{m}}{1\\ \\mathrm{m/s}} = 1.2\\ \\mathrm{s}$"
        why: "ไมอีลินเป็นฉนวน ศักย์งานจึงเกิดเฉพาะที่โนดออฟแรนเวียร์และกระโดดข้ามช่วงที่หุ้มไว้"
    answer: "แอกซอนที่มีไมอีลินเร็วกว่า 100 เท่า ใช้เพียง 12 มิลลิวินาที"
  - { type: check, problem: biology.animals.nervous-system.p008, prompt: "ช่วงที่ศักย์พุ่งขึ้นเร็วเกิดจากไอออนใดไหลเข้า" }
  - type: figure
    title: ไขสันหลังและวงจรรีเฟล็กซ์
    src: spinal-reflex.svg
    alt: "ภาพตัดขวางไขสันหลังรูปวงรี ด้านบนคือด้านหลัง ด้านล่างคือด้านท้อง ตรงกลางมีเนื้อสีเทารูปผีเสื้อซึ่งเป็นตัวเซลล์ และมีช่องกลางเล็ก ๆ ล้อมด้วยเนื้อสีขาวซึ่งเป็นแอกซอนมีไมอีลิน เซลล์ประสาทรับความรู้สึก (สีเขียว) เริ่มจากหน่วยรับความรู้สึกที่ผิวหนัง ตัวเซลล์อยู่ในปมประสาทรากบน แล้วเข้าไขสันหลังทางรากบนด้านหลัง ต่อกับเซลล์ประสาทประสานงาน (สีม่วง) ในเนื้อสีเทา ซึ่งต่อกับเซลล์ประสาทสั่งการ (สีส้ม) ที่มีตัวเซลล์ในเนื้อสีเทาด้านท้อง แอกซอนออกทางรากล่างไปยังกล้ามเนื้อ ข้อความด้านล่างสรุปลำดับ สิ่งเร้า หน่วยรับความรู้สึก เซลล์ประสาทรับความรู้สึก เซลล์ประสาทประสานงาน เซลล์ประสาทสั่งการ กล้ามเนื้อ"
    caption: "รีเฟล็กซ์ผ่านไขสันหลังจึงตอบสนองได้ก่อนสมองรับรู้ (วาดโดยทีมคลังรู้)"
  - { type: check, problem: biology.animals.nervous-system.p013, prompt: "รากบนนำสัญญาณเข้า รากล่างนำสัญญาณออก" }
  - type: simulation
    title: เซลล์ประสาท (PhET Neuron)
    url: https://phet.colorado.edu/en/simulations/neuron
    provider: phet
    note: กระตุ้นเซลล์ประสาทแล้วเปิดแสดงช่องไอออนและกราฟศักย์ สังเกตว่า Na⁺ เข้าก่อนแล้ว K⁺ จึงออก
glossary:
  - { term: เยื่อไมอีลิน, definition: "ชั้นไขมันที่เซลล์ชวันน์พันรอบแอกซอน เป็นฉนวนทำให้นำกระแสประสาทได้เร็ว" }
  - { term: โนดออฟแรนเวียร์, definition: "ช่วงบนแอกซอนที่ไม่มีเยื่อไมอีลินหุ้ม ศักย์งานเกิดที่ตำแหน่งนี้" }
  - { term: ศักย์พัก, definition: "ความต่างศักย์ที่เยื่อหุ้มเซลล์ประสาทขณะไม่ถูกกระตุ้น ประมาณ −70 mV" }
  - { term: ศักย์งาน, definition: "การเปลี่ยนแปลงศักย์เยื่อเซลล์อย่างรวดเร็วเมื่อถูกกระตุ้นถึงระดับขีดเริ่ม" }
  - { term: ระยะดื้อ, definition: "ช่วงหลังเกิดศักย์งานที่เซลล์ยังถูกกระตุ้นซ้ำไม่ได้ ทำให้กระแสประสาทไปทางเดียว" }
  - { term: ไซแนปส์, definition: "รอยต่อระหว่างปลายแอกซอนกับเซลล์ถัดไป ส่งสัญญาณด้วยสารสื่อประสาท" }
  - { term: ระบบประสาทอัตโนวัติ, definition: "ระบบประสาทรอบนอกที่ควบคุมหัวใจ กล้ามเนื้อเรียบ และต่อม นอกอำนาจจิตใจ แบ่งเป็นซิมพาเทติกและพาราซิมพาเทติก" }
flashcards:
  - { front: "ศักย์พักและระดับขีดเริ่มประมาณเท่าใด", back: "−70 mV และ −55 mV" }
  - { front: "ดีโพลาไรเซชันและรีโพลาไรเซชันเกิดจากไอออนใด", back: "Na⁺ ไหลเข้า และ K⁺ ไหลออก" }
  - { front: "โซเดียม-โพแทสเซียมปั๊ม 1 รอบ", back: "Na⁺ ออก 3 ไอออน K⁺ เข้า 2 ไอออน ใช้ ATP" }
  - { front: "Ca²⁺ ทำอะไรที่ปลายแอกซอน", back: "กระตุ้นให้ถุงหลั่งสารสื่อประสาทออกสู่ช่องไซแนปส์" }
  - { front: "ซิมพาเทติกกับพาราซิมพาเทติก", back: "ซิมพาเทติก: ตื่นตัว หัวใจเร็ว ม่านตาขยาย พาราซิมพาเทติก: พัก ให้ผลตรงข้าม" }
