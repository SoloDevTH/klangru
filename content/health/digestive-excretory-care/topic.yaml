id: health.body.digestive-excretory-care
subject: health
title: { th: "ระบบย่อยอาหารและระบบขับถ่าย: ความสำคัญและการดูแล", en: "The digestive and excretory systems: why they matter and how to care for them" }
summary: ความสำคัญของระบบย่อยอาหารและระบบขับถ่ายต่อสุขภาพและการเติบโต การกินผักผลไม้และใยอาหาร การดื่มน้ำ การขับถ่ายเป็นเวลา และอาการผิดปกติที่ควรไปพบแพทย์
difficulty: 3
minutes: 30
prerequisites: [health.body.internal-organs, health.nutrition.basics]
encompasses:
  - { id: health.body.internal-organs, weight: 0.2 }
  - { id: health.nutrition.basics, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: อาหารเข้า ของเสียออก
    src: digestive-excretory.svg
    alt: "แผนภาพสองฝั่ง ฝั่งซ้ายระบบย่อยอาหาร เรียงลงมาด้วยลูกศร ปากและฟัน เคี้ยวให้ละเอียด หลอดอาหาร กระเพาะอาหาร ย่อยด้วยน้ำย่อย ลำไส้เล็ก ดูดซึมสารอาหาร โดยตับและตับอ่อนช่วย ลำไส้ใหญ่ ดูดน้ำกลับ เก็บกากอาหาร ทวารหนัก ขับกากออกเป็นอุจจาระ ฝั่งขวาระบบขับถ่าย ไตสองข้างกรองของเสียจากเลือด ท่อไต กระเพาะปัสสาวะเก็บปัสสาวะ ท่อปัสสาวะขับออก และทางขับของเสียอื่น ลำไส้ใหญ่ขับอุจจาระ ผิวหนังขับเหงื่อ ปอดขับคาร์บอนไดออกไซด์"
    caption: "ระบบย่อยอาหารนำสารอาหารเข้าสู่ร่างกาย ระบบขับถ่ายนำของเสียออก"
  - type: worked-example
    title: ปัสสาวะบอกอะไร
    problem: "วันกีฬาสี ฟ้าใสเล่นกลางแดดทั้งวันและดื่มน้ำไปแค่แก้วเดียว ตอนเย็นปัสสาวะสีเหลืองเข้ม กลิ่นแรง และออกน้อย หมายความว่าอะไร และควรทำอย่างไร"
    figure:
      src: urine-colour.svg
      alt: "ภาพแก้วสามใบแสดงสีปัสสาวะ ใบแรกสีเหลืองอ่อนใส เขียนว่าดื่มน้ำพอดี ใบที่สองสีเหลือง เขียนว่าดื่มน้ำเพิ่มอีกหน่อย ใบที่สามสีเหลืองเข้ม กลิ่นแรง เขียนว่าขาดน้ำ ดื่มน้ำทันที"
    steps:
      - text: "ร่างกายเสียน้ำทางเหงื่อมากเพราะเล่นกลางแดด แต่ได้น้ำกลับเข้าไปน้อย"
      - text: "ไตจึงเก็บน้ำไว้ในร่างกายให้มากที่สุด ปัสสาวะจึงออกน้อย เข้มข้น สีเข้ม และกลิ่นแรง"
        why: "ไตช่วยรักษาปริมาณน้ำในร่างกายให้พอดี"
      - text: "เทียบกับแผนภาพ: สีเหลืองเข้มกลิ่นแรงตรงกับ ขาดน้ำ"
      - text: "ดื่มน้ำสะอาดทีละน้อยแต่บ่อย พักในที่ร่ม และดูว่าปัสสาวะกลับเป็นสีเหลืองอ่อน ถ้ายังปัสสาวะน้อยหรืออ่อนเพลียมากให้บอกผู้ใหญ่"
    answer: "ร่างกายขาดน้ำ ควรดื่มน้ำสะอาดเพิ่มและพักในที่ร่ม"
  - { type: check, problem: health.body.digestive-excretory-care.p004, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: อ่านบันทึกผักผลไม้
    problem: "จากบันทึก 5 วันของต้นหอม ต้นหอมกินผักขาดไปจากคำแนะนำ (วันละ 4 ทัพพี) รวมกี่ทัพพี และควรปรับอย่างไร"
    figure:
      src: veg-fruit-log.svg
      alt: "แผนภูมิแท่งคู่ บันทึกการกินผักและผลไม้ 5 วันของต้นหอม ข้อมูลสมมติ เส้นประบอกคำแนะนำผักวันละ 4 ทัพพี ผลไม้วันละ 3 ส่วน จันทร์ ผัก 2 ผลไม้ 1 อังคาร ผัก 3 ผลไม้ 2 พุธ ผัก 1 ผลไม้ 1 พฤหัสบดี ผัก 4 ผลไม้ 3 ศุกร์ ผัก 2 ผลไม้ 1"
    steps:
      - text: "ที่ควรกินใน 5 วัน: 4 × 5 = 20 ทัพพี"
      - text: "ที่กินจริง: 2 + 3 + 1 + 4 + 2 = 12 ทัพพี"
      - text: "ขาดไป: 20 − 12 = 8 ทัพพี"
      - text: "ปรับ: เพิ่มผักทีละน้อยในทุกมื้อ เช่น ผักในแกงจืดตอนเช้า ผักในข้าวผัดตอนกลางวัน และผักลวกตอนเย็น"
        why: "การเพิ่มทีละน้อยทำให้ชินรสชาติ และใยอาหารที่เพิ่มขึ้นช่วยให้ขับถ่ายดี"
    answer: "ขาด 8 ทัพพี ควรเพิ่มผักให้มีในทุกมื้อ"
  - { type: check, problem: health.body.digestive-excretory-care.p007 }
glossary:
  - { term: ระบบขับถ่าย, definition: "ระบบที่กำจัดของเสียออกจากร่างกาย ได้แก่ ไตและทางเดินปัสสาวะ ลำไส้ใหญ่ ผิวหนัง และปอด" }
  - { term: ใยอาหาร, definition: "ส่วนของพืชที่ร่างกายย่อยไม่ได้ ช่วยให้กากอาหารมีปริมาณพอและอุจจาระนุ่ม" }
  - { term: ท้องเสีย, definition: "การถ่ายเหลวหรือเป็นน้ำตั้งแต่ 3 ครั้งต่อวัน (นิยามขององค์การอนามัยโลก)" }
  - { term: ท้องผูก, definition: "การถ่ายอุจจาระน้อยกว่า 3 ครั้งต่อสัปดาห์ หรืออุจจาระแข็ง ถ่ายยาก" }
  - { term: ภาวะขาดน้ำ, definition: "ภาวะที่ร่างกายเสียน้ำมากกว่าที่ได้รับ ปัสสาวะน้อยและสีเข้ม อ่อนเพลีย" }
flashcards:
  - { front: "ไตทำหน้าที่อะไร", back: "กรองของเสียและน้ำส่วนเกินจากเลือดเป็นปัสสาวะ" }
  - { front: "ปัสสาวะสีเหลืองเข้มกลิ่นแรงบอกอะไร", back: "ร่างกายขาดน้ำ ควรดื่มน้ำสะอาดเพิ่ม" }
  - { front: "วิธีป้องกันท้องผูก", back: "กินผักผลไม้ ดื่มน้ำ ขับถ่ายเป็นเวลาไม่กลั้น และออกกำลังกาย" }
  - { front: "อาการใดต้องไปพบแพทย์", back: "อุจจาระหรือปัสสาวะมีเลือด ปัสสาวะแสบ ท้องเสียหลายวัน ปวดท้องไม่หาย" }
  - { front: "อาการใดต้องโทร 1669", back: "ปวดท้องรุนแรงทันที อาเจียนเป็นเลือด อุจจาระดำเหนียว ปัสสาวะไม่ออกเลย" }
