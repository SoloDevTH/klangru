problems:
  - id: earthscience.astronomy.celestial-sphere-time.p001
    topics: [earthscience.astronomy.celestial-sphere-time]
    difficulty: 1
    type: match
    stem: "จับคู่จุดหรือเส้นบนทรงกลมฟ้ากับความหมาย"
    pairs:
      - { left: "จุดเหนือศีรษะ", right: "จุดบนท้องฟ้าที่อยู่ตรงศีรษะผู้สังเกตพอดี" }
      - { left: "ขอบฟ้า", right: "วงกลมที่แบ่งท้องฟ้าส่วนที่มองเห็นกับส่วนที่มองไม่เห็น" }
      - { left: "เส้นเมริเดียน", right: "วงกลมที่ผ่านทิศเหนือ จุดเหนือศีรษะ และทิศใต้" }
      - { left: "ขั้วฟ้าเหนือ", right: "จุดที่แกนหมุนของโลกชี้ไป ท้องฟ้าหมุนรอบจุดนี้" }
    hints:
      - "นึกภาพผู้สังเกตยืนอยู่ตรงกลางทรงกลม"
      - "เส้นเมริเดียนแบ่งท้องฟ้าเป็นซีกตะวันออกกับตะวันตก"
    solution: "จุดเหนือศีรษะอยู่ตรงศีรษะ ขอบฟ้าแบ่งส่วนที่มองเห็นได้ เส้นเมริเดียนผ่าน N จุดเหนือศีรษะ และ S และขั้วฟ้าเหนือคือจุดที่แกนโลกชี้ไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.celestial-sphere-time.p002
    topics: [earthscience.astronomy.celestial-sphere-time]
    difficulty: 1
    type: mcq
    stem: "ทำไมดาวฤกษ์ส่วนใหญ่จึงขึ้นทางทิศตะวันออกและตกทางทิศตะวันตก"
    choices:
      - { id: a, text: "โลกหมุนรอบตัวเองจากทิศตะวันตกไปทิศตะวันออก ท้องฟ้าจึงดูหมุนสวนทาง", correct: true }
      - { id: b, text: "ดาวฤกษ์โคจรรอบโลกจากตะวันออกไปตะวันตก", feedback: "ดาวฤกษ์ไม่ได้โคจรรอบโลก การเคลื่อนที่ที่เห็นในหนึ่งคืนเกิดจากการหมุนของโลก" }
      - { id: c, text: "โลกโคจรรอบดวงอาทิตย์", feedback: "การโคจรทำให้กลุ่มดาวเปลี่ยนตามฤดู แต่การขึ้นตกในแต่ละคืนเกิดจากการหมุนรอบตัวเอง" }
      - { id: d, text: "ลมพัดเมฆและดาวไปทางตะวันตก", feedback: "ดาวอยู่ไกลเหนือบรรยากาศมาก ลมไม่มีผลต่อตำแหน่งของดาว" }
    hints:
      - "การเคลื่อนที่ที่เห็นเกิดซ้ำทุกราว 24 ชั่วโมง"
      - "ถ้าเราหมุนไปทางหนึ่ง สิ่งรอบตัวดูเหมือนหมุนไปอีกทาง"
    solution: "โลกหมุนจากตะวันตกไปตะวันออก ผู้สังเกตบนโลกจึงเห็นท้องฟ้าทั้งหมดหมุนจากตะวันออกไปตะวันตกรอบขั้วฟ้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.celestial-sphere-time.p003
    topics: [earthscience.astronomy.celestial-sphere-time]
    difficulty: 2
    type: numeric
    stem: "นักเรียนที่เชียงใหม่ (ละติจูด 18.79° เหนือ) ต้องการตั้งกล้องโทรทรรศน์แบบศูนย์สูตรให้แกนชี้ไปที่ขั้วฟ้าเหนือ ต้องเงยแกนกล้องทำมุมกี่องศากับขอบฟ้าทิศเหนือ"
    answer: { value: 18.79, tolerance: 0.05, unit: "°" }
    misconceptions:
      - { match: 71.21, feedback: "71.21° คือมุมเงยของเส้นศูนย์สูตรฟ้าเมื่อผ่านเมริเดียน มุมเงยของขั้วฟ้าเหนือเท่ากับละติจูด" }
      - { match: 90, feedback: "ขั้วฟ้าเหนืออยู่ตรงศีรษะเฉพาะที่ขั้วโลกเหนือ" }
    hints:
      - "มุมเงยของขั้วฟ้าเหนือสัมพันธ์กับละติจูดอย่างไร"
      - "ที่เส้นศูนย์สูตรขั้วฟ้าเหนืออยู่ที่ขอบฟ้า ที่ขั้วโลกอยู่ตรงศีรษะ"
    solution: "มุมเงยของขั้วฟ้าเหนือเท่ากับละติจูด จึงต้องเงยแกน 18.79°"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.celestial-sphere-time.p004
    topics: [earthscience.astronomy.celestial-sphere-time]
    difficulty: 2
    type: numeric
    stem: "ดาวดวงหนึ่งอยู่ทางทิศตะวันตกเฉียงใต้พอดี มุมทิศของดาวดวงนี้กี่องศา (วัดจากทิศเหนือไปทางทิศตะวันออก)"
    answer: { value: 225, tolerance: 0.5, unit: "°" }
    misconceptions:
      - { match: 135, feedback: "135° คือทิศตะวันออกเฉียงใต้ ทิศตะวันตกเฉียงใต้อยู่ระหว่างใต้ (180°) กับตะวันตก (270°)" }
      - { match: 45, feedback: "45° คือทิศตะวันออกเฉียงเหนือ มุมทิศวัดจากทิศเหนือตามเข็มนาฬิกาเมื่อมองจากด้านบน" }
    hints:
      - "เหนือ 0° ตะวันออก 90° ใต้ 180° ตะวันตก 270°"
      - "ตะวันตกเฉียงใต้อยู่กึ่งกลางระหว่างใต้กับตะวันตก"
    solution: "ทิศตะวันตกเฉียงใต้อยู่กึ่งกลางระหว่าง 180° กับ 270° คือ 225°"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.celestial-sphere-time.p005
    topics: [earthscience.astronomy.celestial-sphere-time]
    difficulty: 2
    type: order
    stem: "ในวันเดียวกัน เรียงเมืองต่อไปนี้ตามเวลาที่ดวงอาทิตย์ผ่านเส้นเมริเดียน จากก่อนไปหลัง (ลองจิจูดโดยประมาณ: กรุงเทพฯ 100.50° อุบลราชธานี 104.85° ภูเก็ต 98.39° เชียงใหม่ 98.98° ตะวันออก)"
    items:
      - "อุบลราชธานี"
      - "กรุงเทพฯ"
      - "เชียงใหม่"
      - "ภูเก็ต"
    hints:
      - "โลกหมุนจากตะวันตกไปตะวันออก ที่ทางตะวันออกกว่าเห็นดวงอาทิตย์ผ่านเมริเดียนก่อน"
      - "เรียงจากลองจิจูดมากไปน้อย"
    solution: "ลองจิจูดมากกว่าอยู่ทางตะวันออกกว่า เห็นเที่ยงวันก่อน: อุบลราชธานี (104.85°) → กรุงเทพฯ (100.50°) → เชียงใหม่ (98.98°) → ภูเก็ต (98.39°)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.celestial-sphere-time.p006
    topics: [earthscience.astronomy.celestial-sphere-time]
    difficulty: 3
    type: numeric
    stem: "ดาวซิริอัสมีเดคลิเนชัน −16.72° เมื่อผ่านเส้นเมริเดียนที่กรุงเทพฯ (ละติจูด 13.75° เหนือ) จะมีมุมเงยกี่องศา"
    answer: { value: 59.53, tolerance: 0.1, unit: "°" }
    misconceptions:
      - { match: 92.97, feedback: "เดคลิเนชันเป็นลบ ต้องลบ 16.72° ไม่ใช่บวก" }
      - { match: 30.47, feedback: "นำละติจูดบวกกับขนาดของเดคลิเนชัน สูตรที่ถูกคือ $h = 90^\\circ - \\varphi + \\delta$" }
    hints:
      - "$h = 90^\\circ - \\varphi + \\delta$"
      - "$\\delta = -16.72^\\circ$ เป็นค่าลบ"
    solution: "$h = 90 - 13.75 + (-16.72) = 59.53^\\circ$ ทางทิศใต้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.celestial-sphere-time.p007
    topics: [earthscience.astronomy.celestial-sphere-time]
    difficulty: 3
    type: numeric
    stem: "ที่เชียงใหม่ (ละติจูด 18.79° เหนือ) ดาวที่มีเดคลิเนชันมากกว่ากี่องศาจะไม่ตกลับขอบฟ้าเลย"
    answer: { value: 71.21, tolerance: 0.05, unit: "°" }
    misconceptions:
      - { match: 18.79, feedback: "18.79° คือมุมเงยของขั้วฟ้าเหนือ ดาวที่ไม่ตกต้องอยู่ห่างขั้วฟ้าไม่เกิน 18.79° คือ δ > 90° − 18.79°" }
    hints:
      - "ดาวที่ไม่ตกเคลื่อนเป็นวงกลมรอบขั้วฟ้าเหนือโดยไม่แตะขอบฟ้า"
      - "รัศมีของวงกลม (ระยะจากขั้วฟ้า) ต้องน้อยกว่ามุมเงยของขั้วฟ้า"
    solution: "ระยะเชิงมุมจากขั้วฟ้าเหนือคือ $90^\\circ - \\delta$ ต้องน้อยกว่า 18.79° จึงได้ $\\delta > 90 - 18.79 = 71.21^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.celestial-sphere-time.p008
    topics: [earthscience.astronomy.celestial-sphere-time]
    difficulty: 3
    type: numeric
    stem: "เชียงใหม่อยู่ที่ลองจิจูดราว 98.98° ตะวันออก ประเทศไทยใช้เวลามาตรฐานของเส้น 105° ตะวันออก เที่ยงวันตามเวลาสุริยคติปานกลางของเชียงใหม่ตรงกับ 12:00 น. บวกกี่นาที (ตามเวลาประเทศไทย)"
    answer: { value: 24.1, tolerance: 0.2, unit: "นาที" }
    misconceptions:
      - { match: 6.02, feedback: "นี่คือผลต่างเป็นองศา ต้องคูณ 4 นาทีต่อองศา" }
      - { match: 1.5, feedback: "หารด้วย 4 แทนการคูณ โลกหมุน 1° ใช้เวลา 4 นาที" }
    hints:
      - "ผลต่างลองจิจูด = 105 − 98.98"
      - "1° = 4 นาที"
    solution: "$(105 - 98.98) \\times 4 = 6.02 \\times 4 \\approx 24.1$ นาที เที่ยงปานกลางของเชียงใหม่จึงตรงกับราว 12:24 น."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.celestial-sphere-time.p009
    topics: [earthscience.astronomy.celestial-sphere-time]
    difficulty: 3
    type: mcq
    stem: "ภาพแสดงวงโคจรของโลกและดาวศุกร์เมื่อมองจากเหนือระนาบวงโคจร ตำแหน่งใดที่ดาวศุกร์ปรากฏเป็นดาวประจำเมืองโดยมีมุมห่างจากดวงอาทิตย์มากที่สุด"
    figure: { src: p-elong.svg, alt: "มองลงมาจากเหนือระนาบวงโคจร ดาวเคราะห์โคจรทวนเข็มนาฬิกา ดวงอาทิตย์อยู่ตรงกลาง วงโคจรดาวศุกร์วงใน วงโคจรโลกวงนอก โลกอยู่ด้านล่างสุดของวงนอก ดาวศุกร์ที่ตำแหน่ง A อยู่ระหว่างโลกกับดวงอาทิตย์ C อยู่ด้านบนสุด หลังดวงอาทิตย์ B อยู่ด้านล่างค่อนไปทางซ้าย และ D อยู่ด้านล่างค่อนไปทางขวา ซึ่ง B และ D เป็นจุดที่เส้นจากโลกสัมผัสวงโคจรดาวศุกร์พอดี" }
    choices:
      - { id: a, text: "B", correct: true }
      - { id: b, text: "D", feedback: "D เป็นจุดสัมผัสเหมือนกัน แต่อยู่ทางตะวันตกของดวงอาทิตย์ ดาวศุกร์จะขึ้นก่อนดวงอาทิตย์ เห็นตอนรุ่งเช้าเป็นดาวประกายพรึก" }
      - { id: c, text: "A", feedback: "A อยู่ระหว่างโลกกับดวงอาทิตย์ (ร่วมทิศแนววงใน) มุมห่างเกือบ 0° มองไม่เห็น" }
      - { id: d, text: "C", feedback: "C อยู่หลังดวงอาทิตย์ (ร่วมทิศแนววงนอก) มุมห่างเกือบ 0° มองไม่เห็น" }
    hints:
      - "มุมห่างมากที่สุดเกิดเมื่อเส้นจากโลกสัมผัสวงโคจรของดาวศุกร์"
      - "ดาวประจำเมืองอยู่ทางตะวันออกของดวงอาทิตย์ ในภาพนี้คือด้านซ้ายเมื่อมองจากโลกไปหาดวงอาทิตย์"
    solution: "B และ D มีมุมห่างมากที่สุดราว 46° B อยู่ทางตะวันออกของดวงอาทิตย์เมื่อมองจากโลก จึงตกหลังดวงอาทิตย์ เห็นหัวค่ำทางทิศตะวันตก เป็นดาวประจำเมือง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.celestial-sphere-time.p010
    topics: [earthscience.astronomy.celestial-sphere-time]
    difficulty: 4
    type: numeric
    stem: "กรุงเทพฯ อยู่ที่ลองจิจูด 100.5° ตะวันออก กลางเดือนกุมภาพันธ์สมการเวลา (เวลาปรากฏ − เวลาปานกลาง) เท่ากับ −14.1 นาที ดวงอาทิตย์ผ่านเมริเดียนที่กรุงเทพฯ เวลา 12:00 น. บวกกี่นาที (เวลาประเทศไทย)"
    answer: { value: 32.1, tolerance: 0.3, unit: "นาที" }
    misconceptions:
      - { match: 3.9, feedback: "สมการเวลาเป็นลบ แปลว่าดวงอาทิตย์จริงช้ากว่าดวงอาทิตย์ปานกลาง ต้องบวกเพิ่ม 14.1 นาที ไม่ใช่ลบ" }
      - { match: 18, feedback: "นี่คือเที่ยงปานกลางของกรุงเทพฯ ยังไม่ได้คิดสมการเวลา" }
    hints:
      - "เที่ยงปานกลางของกรุงเทพฯ $= 12{:}00 + (105 - 100.5) \\times 4$ นาที"
      - "เวลาที่ดวงอาทิตย์จริงผ่านเมริเดียน = เที่ยงปานกลาง − สมการเวลา"
    solution: "เที่ยงปานกลาง $= 12{:}18$ น. ดวงอาทิตย์จริงผ่านเมริเดียน $= 12{:}18 - (-14.1) \\approx 12{:}32$ น. (32.1 นาทีหลัง 12:00)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.celestial-sphere-time.p011
    topics: [earthscience.astronomy.celestial-sphere-time]
    difficulty: 4
    type: numeric
    stem: "ในวันครีษมายัน (เดคลิเนชันของดวงอาทิตย์ +23.44°) ดวงอาทิตย์ขึ้นที่มุมทิศ $A$ ซึ่งหาได้จาก $\\cos A = \\dfrac{\\sin\\delta}{\\cos\\varphi}$ ที่เชียงใหม่ (ละติจูด 18.79° เหนือ) ดวงอาทิตย์ขึ้นที่มุมทิศกี่องศา (ไม่คิดการหักเหของแสง)"
    answer: { value: 65.15, tolerance: 0.2, unit: "°" }
    misconceptions:
      - { match: 66.56, feedback: "ใช้ $90^\\circ - 23.44^\\circ$ ซึ่งถูกเฉพาะผู้สังเกตที่เส้นศูนย์สูตร ต้องหารด้วย $\\cos\\varphi$" }
      - { match: 24.85, feedback: "นี่คือมุมจากทิศตะวันออกไปทางเหนือ มุมทิศต้องวัดจากทิศเหนือ คือ $90^\\circ - 24.85^\\circ$" }
    hints:
      - "$\\sin 23.44^\\circ \\approx 0.3978$ และ $\\cos 18.79^\\circ \\approx 0.9467$"
      - "$A = \\cos^{-1}(0.4202)$"
    solution: "$\\cos A = 0.3978/0.9467 \\approx 0.4202$ ได้ $A \\approx 65.15^\\circ$ คือขึ้นค่อนไปทางเหนือของทิศตะวันออกราว 24.85°"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.celestial-sphere-time.p012
    topics: [earthscience.astronomy.celestial-sphere-time]
    difficulty: 4
    type: numeric
    stem: "ดาวศุกร์โคจรรอบดวงอาทิตย์ทุก 224.7 วัน โลก 365.25 วัน ดาวศุกร์จะกลับมาอยู่ตำแหน่งเดิมเทียบกับดวงอาทิตย์เมื่อมองจากโลก (เช่น เป็นดาวประจำเมืองที่มุมห่างมากที่สุดอีกครั้ง) ทุกกี่วัน ใช้ $\\dfrac{1}{S} = \\dfrac{1}{P_{\\text{ศุกร์}}} - \\dfrac{1}{P_{\\text{โลก}}}$"
    answer: { value: 584, tolerance: 3, unit: "วัน" }
    misconceptions:
