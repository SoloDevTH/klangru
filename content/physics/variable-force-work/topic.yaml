id: physics.energy.variable-force-work
subject: physics
title: { th: งานจากกราฟและแรงสปริง, en: Work from graphs and spring forces }
summary: หางานของแรงที่ไม่คงตัวจากพื้นที่ใต้กราฟแรงกับตำแหน่ง กฎของฮุก งานที่ใช้ยืดสปริงกับพลังงานศักย์ยืดหยุ่น และงานของแรงลัพธ์กับพลังงานจลน์
difficulty: 5
minutes: 35
prerequisites: [physics.energy.kinetic-potential, physics.kinematics.motion-graphs]
encompasses:
  - { id: physics.energy.kinetic-potential, weight: 0.4 }
  - { id: physics.energy.work, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แบ่งพื้นที่ใต้กราฟเป็นรูปง่าย ๆ
    src: fx-area.svg
    alt: "กราฟแรง F (N) กับตำแหน่ง x (m) จาก 0 ถึง 8 m แรงเพิ่มเป็นเส้นตรงจาก 0 ถึง 30 N ในช่วง 0 ถึง 2 m คงที่ 30 N จาก 2 ถึง 5 m ลดเป็นเส้นตรงถึง 0 ที่ 6 m แล้วเป็น −10 N จาก 6 ถึง 8 m พื้นที่แบ่งเป็นสี่ส่วน ส่วนที่ 1 สามเหลี่ยม ½ × 2 × 30 = 30 J ส่วนที่ 2 สี่เหลี่ยม 3 × 30 = 90 J ส่วนที่ 3 สามเหลี่ยม ½ × 1 × 30 = 15 J ส่วนที่ 4 อยู่ใต้แกน x เป็น 2 × (−10) = −20 J งานรวม 115 J"
    caption: "พื้นที่ใต้แกน x มีค่าเป็นลบ งานรวมจึงเป็น 30 + 90 + 15 − 20 = 115 J"
  - type: worked-example
    title: งานจากกราฟที่มีส่วนเป็นลบ
    problem: "จากกราฟในภาพ แรงดันรถเข็นเปลี่ยนตามตำแหน่ง และช่วง 6 ถึง 8 m มีแรงต้านสุทธิ 10 N งานรวมของแรงนี้ตั้งแต่ x = 0 ถึง 8 m เป็นเท่าใด"
    steps:
      - text: "แบ่งพื้นที่: ช่วง 0–2 m สามเหลี่ยม $\\tfrac12(2)(30) = 30\\ \\mathrm{J}$"
      - text: "ช่วง 2–5 m สี่เหลี่ยม $(3)(30) = 90\\ \\mathrm{J}$ และช่วง 5–6 m สามเหลี่ยม $\\tfrac12(1)(30) = 15\\ \\mathrm{J}$"
      - text: "ช่วง 6–8 m อยู่ใต้แกน x งาน $= (2)(-10) = -20\\ \\mathrm{J}$"
        why: "แรงมีทิศตรงข้ามกับการเคลื่อนที่ จึงดึงพลังงานออกจากวัตถุ"
      - text: "รวม $30 + 90 + 15 - 20 = 115\\ \\mathrm{J}$"
    answer: "งานรวม 115 J"
  - { type: check, problem: physics.energy.variable-force-work.p007, prompt: "ลองหาพื้นที่สี่เหลี่ยมคางหมูใต้กราฟ" }
  - type: figure
    title: กฎของฮุกและงานที่ใช้ยืดสปริง
    src: hooke.svg
    alt: "กราฟแรงดึงสปริง F (N) กับระยะยืด x (m) เป็นเส้นตรงผ่านจุดกำเนิดถึงจุดสีส้มที่ x = 0.4 m ซึ่งเป็นขีดจำกัดสภาพยืดหยุ่น หลังจากนั้นเป็นเส้นประที่โค้งราบลง มีสามเหลี่ยมเล็กแสดงความชัน = k ระบายสีฟ้าเป็นสามเหลี่ยมใต้เส้นจาก 0 ถึง x₁ เขียนว่า ½kx₁² ระบายสีส้มเป็นสี่เหลี่ยมคางหมูจาก x₁ ถึง x₂ เขียนว่า ½k(x₂² − x₁²) แกนตั้งมีป้าย kx₁ และ kx₂"
    caption: "ความชันคือ k พื้นที่สามเหลี่ยมคือพลังงานศักย์ยืดหยุ่น ½kx² ส่วนงานช่วง x₁ ถึง x₂ คือสี่เหลี่ยมคางหมู"
  - type: worked-example
    title: กล่องชนสปริง
    problem: "กล่องมวล 0.50 kg ไถลบนพื้นลื่นด้วยอัตราเร็ว 2.0 m/s เข้าชนสปริงค่าคงตัว 200 N/m ที่ยึดกับผนัง สปริงถูกกดเข้าไปมากที่สุดเท่าใด"
    steps:
      - text: "ขณะกดสปริง แรงสปริงทำงานเป็นลบต่อกล่อง จนกล่องหยุด พลังงานจลน์ทั้งหมดกลายเป็นพลังงานศักย์ยืดหยุ่น"
        why: "พื้นลื่น ไม่มีแรงเสียดทานดึงพลังงานไปเป็นความร้อน"
      - text: "พลังงานจลน์ตอนแรก $\\tfrac12(0.50)(2.0)^2 = 1.0\\ \\mathrm{J}$"
      - text: "ตั้ง $\\tfrac12 kx^2 = 1.0$ ได้ $x^2 = \\dfrac{2(1.0)}{200} = 0.010\\ \\mathrm{m^2}$"
      - text: "$x = 0.10\\ \\mathrm{m} = 10\\ \\mathrm{cm}$"
    answer: "สปริงถูกกดมากที่สุด 10 cm"
  - { type: check, problem: physics.energy.variable-force-work.p011, prompt: "สปริงที่ตึงอยู่แล้ว ดึงต่ออีกเท่าเดิมใช้งานเท่าเดิมหรือไม่" }
  - type: interactive
    title: แรงสปริงกับพลังงานศักย์ยืดหยุ่น
    caption: "เส้นแรกคือแรงดึง F = kx (นิวตัน) เส้นที่สองคือพลังงานศักย์ยืดหยุ่น ½kx² (จูล) เลื่อน k แล้วสังเกตว่าเส้นแรงยังเป็นเส้นตรง แต่พลังงานโค้งขึ้นเพราะขึ้นกับ x²"
    widget:
      kind: function-plot
      functions: ["k x", "\\frac{1}{2} k x^2"]
      sliders:
        - { name: k, min: 50, max: 400, step: 50, value: 200, label: ค่าคงตัวสปริง (N/m) }
      x: [0, 0.6]
      y: [0, 120]
  - type: simulation
    title: "กฎของฮุก (PhET Hooke's Law)"
    url: https://phet.colorado.edu/en/simulations/hookes-law
    provider: phet
    note: "เลือกหน้า Energy เปิดกราฟ Force Plot แล้วลากสปริงให้ยืด สังเกตว่าพื้นที่ใต้กราฟที่ระบายสีเท่ากับพลังงานศักย์ยืดหยุ่น ลองยืดเป็นสองเท่าแล้วดูว่าพลังงานเพิ่มเป็นกี่เท่า"
glossary:
  - { term: กฎของฮุก, definition: "แรงดึงสปริงแปรผันตรงกับระยะยืด $F = kx$ ใช้ได้เมื่อยังไม่เกินขีดจำกัดสภาพยืดหยุ่น" }
  - { term: ค่าคงตัวของสปริง, definition: "ค่า $k$ ในกฎของฮุก บอกความแข็งของสปริง หน่วย N/m เท่ากับความชันของกราฟแรงกับระยะยืด" }
  - { term: ระยะยืด, definition: "ความยาวที่สปริงยืดหรือหดไปจากความยาวปกติ ไม่ใช่ความยาวทั้งหมดของสปริง" }
  - { term: ขีดจำกัดสภาพยืดหยุ่น, definition: "แรงหรือระยะยืดสูงสุดที่วัสดุยังกลับคืนรูปเดิมได้เมื่อปล่อย" }
  - { term: พลังงานศักย์ยืดหยุ่น, definition: "พลังงานที่สะสมในวัตถุที่ถูกยืดหรือกด เท่ากับงานที่ใช้ยืด $\\tfrac12 kx^2$" }
  - { term: กำลังเฉลี่ย, definition: "งานทั้งหมดหารด้วยเวลาที่ใช้ หน่วยวัตต์ (W)" }
flashcards:
  - { front: "งานของแรงที่ไม่คงตัวหาได้อย่างไร", back: "พื้นที่ใต้กราฟแรงกับตำแหน่ง ส่วนที่อยู่ใต้แกน x เป็นงานลบ" }
  - { front: "ความชันของกราฟแรงดึงสปริงกับระยะยืดคืออะไร", back: "ค่าคงตัวของสปริง $k$ (N/m)" }
  - { front: "งานที่ใช้ยืดสปริงจาก $x_1$ ถึง $x_2$", back: "$\\tfrac12 k(x_2^2 - x_1^2)$ ไม่ใช่ $\\tfrac12 k(x_2 - x_1)^2$" }
  - { front: "ยืดสปริงเพิ่มเป็น 2 เท่า พลังงานศักย์ยืดหยุ่นเป็นกี่เท่า", back: "4 เท่า เพราะ $E_s \\propto x^2$" }
  - { front: "พื้นที่ใต้กราฟแรงลัพธ์กับตำแหน่งบอกอะไร", back: "งานรวม ซึ่งเท่ากับพลังงานจลน์ที่เปลี่ยนไป" }
