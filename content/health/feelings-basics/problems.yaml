problems:
- id: health.mental.feelings-basics.p001
  topics:
  - health.mental.feelings-basics
  difficulty: 1
  type: mcq
  stem: เพื่อนยิ้มกว้างและกระโดดโลดเต้นเมื่อได้รับรางวัลจากครู เพื่อนน่าจะรู้สึกอย่างไร
  choices:
  - id: a
    text: ดีใจ
    correct: true
  - id: b
    text: เสียใจ
    feedback: คนเสียใจมักมีหน้าตาหม่นลงและอาจร้องไห้ เพื่อนในเรื่องยิ้มและกระโดด
  - id: c
    text: กลัว
    feedback: คนที่กลัวมักตัวแข็งหรืออยากซ่อนตัว ไม่ได้กระโดดด้วยความสุข
  - id: d
    text: เบื่อ
    feedback: คนที่เบื่อมักไม่อยากทำอะไร ไม่กระตือรือร้นแบบนี้
  hints:
  - ดูที่สีหน้าและท่าทางของเพื่อนก่อน
  - คนที่กระโดดด้วยความสุขมักรู้สึกอย่างไร
  solution: การยิ้มกว้างและกระโดดโลดเต้นเป็นสัญญาณของความดีใจ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.feelings-basics.p002
  topics:
  - health.mental.feelings-basics
  difficulty: 1
  type: mcq
  stem: ภาพมีหน้า 4 หน้า หมายเลข 3 แสดงอารมณ์ใด
  choices:
  - id: a
    text: ดีใจ
    feedback: หน้าที่ 1 ยิ้มกว้าง ไม่ใช่หน้าที่ 3
  - id: b
    text: เสียใจ
    feedback: หน้าที่ 2 มุมปากตก ไม่ใช่หน้าที่ 3
  - id: c
    text: โกรธ
    correct: true
  - id: d
    text: กลัว
    feedback: หน้าที่ 4 ตาเบิกโตและปากอ้า เป็นสัญญาณของความกลัว
  hints:
  - นับหมายเลขจากซ้ายไปขวา
  - หน้าที่ 3 มีคิ้วขมวดและปากเม้ม ดูว่าเป็นอารมณ์แบบใด
  solution: หน้าหมายเลข 3 คิ้วขมวด ปากเม้ม และตาเพ่ง เป็นสัญญาณของความโกรธ
  figure:
    src: faces-quiz.svg
    alt: ภาพการ์ตูนสี่หน้าเรียงจากซ้ายไปขวา มีหมายเลข 1 ถึง 4 ใต้แต่ละหน้า ไม่มีคำบอกอารมณ์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.feelings-basics.p003
  topics:
  - health.mental.feelings-basics
  difficulty: 1
  type: match
  stem: จับคู่สถานการณ์กับอารมณ์ที่น่าจะเกิดขึ้น
  pairs:
  - left: ได้ของขวัญวันเกิดที่อยากได้มานาน
    right: ดีใจ
  - left: ทำแก้วที่แม่ชอบแตกโดยไม่ได้ตั้งใจ
    right: เสียใจ
  - left: มีคนแย่งดินสอไปโดยไม่ขอ
    right: โกรธ
  - left: ได้ยินฟ้าร้องดังมากตอนอยู่คนเดียวในบ้าน
    right: กลัว
  hints:
  - ลองนึกว่าตัวเองอยู่ในสถานการณ์นั้น
  - ของที่แตกและของที่ถูกแย่งทำให้รู้สึกต่างกันอย่างไร
  solution: ได้ของที่อยากได้มานาน = ดีใจ, ทำของที่แม่ชอบแตก = เสียใจ, ถูกแย่งของโดยไม่ขอ = โกรธ, ได้ยินฟ้าร้องดังมากตอนอยู่คนเดียว = กลัว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.feelings-basics.p004
  topics:
  - health.mental.feelings-basics
  difficulty: 1
  type: numeric
  stem: น้องฝึกหายใจแบบนับ โดยหายใจเข้านับ 4 วินาที แล้วหายใจออกนับ 4 วินาที ทำ 5 รอบ รวมใช้เวลากี่วินาที (ตอบเป็นตัวเลขในหน่วยวินาที)
  answer:
    value: 40
    tolerance: 0
    unit: วินาที
  misconceptions:
  - match: 20
    feedback: นั่นคือนับเพียงครั้งเดียวต่อรอบ ลืมนับทั้งตอนหายใจเข้าและหายใจออก
  hints:
  - หนึ่งรอบมีทั้งหายใจเข้าและหายใจออก
  - หาเวลาหนึ่งรอบก่อน แล้วคูณด้วยจำนวนรอบ
  solution: หนึ่งรอบ = 4 + 4 = 8 วินาที ทำ 5 รอบ = 5 × 8 = 40 วินาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.feelings-basics.p005
  topics:
  - health.mental.feelings-basics
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็นการบอกความรู้สึกด้วยประโยค "ฉันรู้สึก...เพราะ..." ได้ชัดที่สุด
  choices:
  - id: a
    text: ฉันรู้สึกเสียใจ เพราะเพื่อนไม่ชวนฉันไปเล่นด้วย
    correct: true
  - id: b
    text: เธอทำให้ฉันโกรธที่สุดในโลก
    feedback: เป็นการโทษเพื่อน ไม่ได้บอกความรู้สึกของเราเอง
  - id: c
    text: ฉันไม่รู้สึกอะไรเลย
    feedback: ไม่ได้บอกความรู้สึก และอาจทำให้เราไม่รู้ตัวว่ากำลังรู้สึกอะไรอยู่
  - id: d
    text: ไม่เอาแล้ว ไม่สนุกเลย
    feedback: ยังไม่บอกว่ารู้สึกอย่างไรและเพราะอะไร
  hints:
  - ประโยคที่ดีมีทั้งความรู้สึกของเราและสาเหตุ
  - หาคำที่บอกว่า "รู้สึก" และคำที่บอกว่า "เพราะ"
  solution: ประโยคที่บอกความรู้สึกของเราเองและเหตุผล คือ "ฉันรู้สึกเสียใจ เพราะเพื่อนไม่ชวนไปเล่นด้วย"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.feelings-basics.p006
  topics:
  - health.mental.feelings-basics
  difficulty: 2
  type: numeric
  stem: เอ๋ฝึกหายใจแบบนับ 4-4 (หายใจเข้า 4 วินาที หายใจออก 4 วินาที) วันละ 3 รอบ ทุกวันตลอด 7 วัน รวมแล้วใช้เวลาฝึกทั้งหมดกี่วินาที (ตอบเป็นวินาที)
  answer:
    value: 168
    tolerance: 0
    unit: วินาที
  misconceptions:
  - match: 84
    feedback: นั่นคือใช้ 4 วินาทีต่อรอบ ลืมนับทั้งตอนหายใจเข้าและหายใจออก
  - match: 21
    feedback: นั่นคือจำนวนรอบทั้งหมด ยังไม่ได้คูณด้วยเวลาที่ใช้ในแต่ละรอบ
  hints:
  - ฝึก 1 รอบใช้กี่วินาที
  - มี 3 รอบต่อวันและ 7 วัน ให้คูณเวลาต่อรอบกับจำนวนรอบทั้งหมด
  solution: 1 รอบ = 4 + 4 = 8 วินาที 1 วัน = 3 × 8 = 24 วินาที 7 วัน = 7 × 24 = 168 วินาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.feelings-basics.p007
  topics:
  - health.mental.feelings-basics
  difficulty: 2
  type: text
  stem: สัญญาณที่เกิดขึ้นในร่างกายเมื่อเรารู้สึกอะไรบางอย่าง เช่น หน้าร้อน ใจเต้นแรง หรือท้องปั่นป่วน เรียกว่าอะไร (ตอบเป็นคำ)
  accepted:
  - สัญญาณในร่างกาย
  - สัญญาณทางร่างกาย
  - สัญญาณร่างกาย
  hints:
  - คำนี้มีคำว่า "สัญญาณ" อยู่ด้วย
  - สัญญาณนี้เกิดขึ้นที่ร่างกายของเรา
  solution: เรียกว่าสัญญาณในร่างกาย ซึ่งบอกให้เรารู้ว่าอารมณ์กำลังทำงานอยู่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.feelings-basics.p008
  topics:
  - health.mental.feelings-basics
  difficulty: 2
  type: mcq
  stem: ข้อใดช่วยให้ใจสงบลงได้ (เลือกได้หลายข้อ)
  multiple: true
  choices:
  - id: a
    text: หายใจเข้าออกช้า ๆ
    correct: true
  - id: b
    text: นับถึงสิบอย่างช้า ๆ
    correct: true
  - id: c
    text: ขอเวลาพักสักครู่ก่อนพูด
    correct: true
  - id: d
    text: ตะโกนใส่เพื่อนให้รู้ว่าโกรธ
    feedback: การตะโกนมักทำให้เรื่องบานปลาย
  - id: e
    text: ขว้างของที่อยู่ใกล้มือ
    feedback: อาจทำให้ตัวเองและคนอื่นบาดเจ็บ
  hints:
  - ดูว่าอะไรช่วยให้ร่างกายช้าลง
  - การทำให้เรื่องแย่ลงหรือทำร้ายคนอื่นไม่ช่วยให้ใจสงบ
  solution: การหายใจช้า การนับถึงสิบอย่างช้า ๆ และการขอเวลาพัก ช่วยให้ร่างกายค่อย ๆ สงบลง ส่วนการตะโกนหรือขว้างของทำให้เรื่องแย่ลงหรือเกิดอันตราย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.feelings-basics.p009
  topics:
  - health.mental.feelings-basics
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนเมื่อเรารู้สึกโกรธเพราะเพื่อนแย่งของ (จากขั้นแรกไปขั้นสุดท้าย)
  items:
  - สังเกตว่าตัวเองกำลังโกรธ
  - หายใจเข้าออกช้า ๆ สักครู่
  - บอกเพื่อนอย่างสุภาพว่าไม่ชอบที่แย่งของ
  - ถ้ายังไม่หายโกรธ บอกครูหรือผู้ใหญ่ที่ไว้ใจ
  hints:
  - ขั้นแรกคือรู้ตัวว่ากำลังรู้สึกอย่างไร
  - ควรสงบก่อนพูดกับเพื่อน และถ้ายังไม่หาย ให้ขอความช่วยเหลือ
  solution: รู้ตัวว่าโกรธ แล้วหายใจช้า ๆ จึงบอกเพื่ออย่างสุภาพ และถ้ายังไม่หายให้บอกครูหรือผู้ใหญ่ที่ไว้ใจ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.feelings-basics.p010
  topics:
  - health.mental.feelings-basics
  difficulty: 3
  type: mcq
  stem: น้องเคยถูกสุนัขวิ่งไล่ วันนี้มีสุนัขวิ่งเข้ามาเห่าเสียงดัง น้องรู้สึกกลัวมาก แต่พี่ซึ่งเลี้ยงสุนัขมาหลายปีไม่ค่อยกลัว ข้อใดอธิบายได้ดีที่สุดว่าทำไมสองคนรู้สึกต่างกัน
  choices:
  - id: a
    text: เพราะพี่มีประสบการณ์กับสุนัขต่างจากน้อง
    correct: true
  - id: b
    text: เพราะพี่ไม่ได้ยินเสียงเห่า
    feedback: พี่อาจได้ยินเสียงเดียวกัน ประเด็นคือความรู้สึกที่ต่างกัน
  - id: c
    text: เพราะพี่ลืมเรื่องสุนัขไปแล้ว
    feedback: ความรู้สึกไม่ได้หายไปเพราะลืม
  - id: d
    text: เพราะพี่ไม่มีอารมณ์
    feedback: ทุกคนมีอารมณ์ แต่ความรู้สึกต่างกันได้
  hints:
  - ลองนึกว่าแต่ละคนเคยเจอสุนัขมาในแบบไหน
  - คนเดียวกันหรือสถานการณ์เดียวกัน ก็ทำให้รู้สึกไม่เหมือนกันได้
  solution: ประสบการณ์เดิมของแต่ละคนมีผลต่อความรู้สึก คนที่คุ้นกับสุนัขมาก่อนอาจรู้สึกไม่กลัวเท่า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.feelings-basics.p011
  topics:
  - health.mental.feelings-basics
  difficulty: 3
  type: mcq
  stem: วันนี้น้องหงุดหงิดง่ายกว่าปกติ เพราะตั้งแต่เช้ายังไม่ได้กินอะไรเลย ข้อใดอธิบายได้ดีที่สุด
  choices:
  - id: a
    text: ความหิวและความเหนื่อยทำให้อารมณ์เปลี่ยนได้
    correct: true
  - id: b
    text: เพราะน้องเป็นคนไม่ดี
    feedback: อารมณ์ที่เปลี่ยนไปไม่ได้บอกว่าเราเป็นคนอย่างไร
  - id: c
    text: อารมณ์ไม่มีผลต่อร่างกายเลย
    feedback: ร่างกายกับอารมณ์มีผลต่อกันได้
  - id: d
    text: เพราะวันนี้เป็นวันจันทร์
    feedback: วันไม่ใช่สาเหตุโดยตรงของอารมณ์
  hints:
  - ลองนึกถึงสิ่งที่ทำให้ร่างกายเหนื่อยหรือหิว
  - อารมณ์ที่เปลี่ยนไปไม่ได้แปลว่าเราเป็นคนไม่ดี
  solution: ความหิวและความเหนื่อยมีผลต่ออารมณ์ได้ จึงควรสังเกตว่าร่างกายต้องการอะไรก่อนตัดสินตัวเอง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.feelings-basics.p012
  topics:
  - health.mental.feelings-basics
  difficulty: 3
  type: match
  stem: จับคู่สถานการณ์กับวิธีทำให้ใจสงบที่เหมาะกับวัย
  pairs:
  - left: ตื่นเต้นจนใจเต้นแรง ขณะยืนรอขึ้นเวทีในงานไหว้ครูและออกไปไหนไม่ได้
    right: หายใจเข้าออกช้า ๆ ตรงที่ยืนอยู่
  - left: ถูกเพื่อนล้อซ้ำ ๆ ทุกวันจนไม่อยากไปโรงเรียน
    right: บอกครูหรือผู้ใหญ่ที่ไว้ใจ
  - left: ทำการบ้านยังไม่เสร็จจนอยากร้องไห้
    right: ขอเวลาพักสักครู่ แล้วค่อยกลับมาทำต่อ
  - left: เล่นกับเพื่อนแล้วโกรธจนอยากผลักเพื่อน
    right: เดินออกมาจากตรงนั้นแล้วนับถึงสิบ
  hints:
  - ดูว่าแต่ละสถานการณ์ทำอะไรได้หรือไม่ได้ เช่น ตอนรอขึ้นเวทีเดินหนีไปไม่ได้
  - เรื่องที่เกิดซ้ำทุกวันจนไม่อยากไปโรงเรียน เราแก้คนเดียวไม่ได้ ต้องให้ผู้ใหญ่ช่วย
  solution: ตื่นเต้นขณะรอขึ้นเวที = หายใจช้า ๆ ตรงที่ยืนอยู่ (ทำได้แม้ออกไปไหนไม่ได้), ถูกล้อซ้ำ ๆ ทุกวัน = บอกครูหรือผู้ใหญ่ที่ไว้ใจ (เรื่องที่เกิดซ้ำต้องให้ผู้ใหญ่ช่วย), การบ้านยังไม่เสร็จจนอยากร้องไห้ = พักสักครู่แล้วกลับมาทำต่อ, โกรธจนอยากผลักเพื่อน = เดินออกมาแล้วนับถึงสิบ (แยกตัวก่อนจะมีใครเจ็บ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.feelings-basics.p013
  topics:
  - health.mental.feelings-basics
  difficulty: 3
  type: numeric
  stem: น้องจดอารมณ์ของตัวเองทุกวันในหนึ่งสัปดาห์ (7 วัน) พบว่าดีใจ 3 วัน เสียใจ 1 วัน ตื่นเต้น 2 วัน และเบื่อ 1 วัน วันที่ดีใจคิดเป็นร้อยละเท่าไรของทั้งสัปดาห์ (ตอบทศนิยม 1 ตำแหน่ง)
  answer:
