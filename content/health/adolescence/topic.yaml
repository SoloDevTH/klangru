id: health.growth.adolescence
subject: health
title:
  th: การเปลี่ยนแปลงในวัยรุ่น ปัจจัย อิทธิพลของสังคมและสื่อ
  en: 'Adolescent development: changes, influences, society and media'
summary: การเปลี่ยนแปลงด้านร่างกาย จิตใจ อารมณ์ สังคม และสติปัญญาในวัยรุ่น ปัจจัยที่ทำให้เติบโตต่างกัน ความคาดหวังของสังคม และการวิเคราะห์สื่อโฆษณาเรื่องรูปร่างและความสูง
difficulty: 4
minutes: 30
prerequisites:
- health.sexuality.puberty
- health.growth.thai-growth-references
encompasses:
- id: health.sexuality.puberty
  weight: 0.2
- id: health.growth.thai-growth-references
  weight: 0.1
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: ปัจจัยที่มีผลต่อการเติบโตของวัยรุ่น
  src: factors.svg
  alt: แผนภาพวงกลมกลางเขียนว่าวัยรุ่น ร่างกาย จิตใจ อารมณ์ สังคม สติปัญญา มีลูกศรจากสองกล่องชี้เข้าหา กล่องซ้ายคือปัจจัยภายในตัว ส่วนใหญ่เปลี่ยนเองไม่ได้ ได้แก่ พันธุกรรม ฮอร์โมน เพศ โรคประจำตัว กล่องขวาคือปัจจัยภายนอก หลายอย่างเราปรับได้ ได้แก่ อาหาร การนอน การออกกำลังกาย ครอบครัว เพื่อน โรงเรียน สื่อ เศรษฐกิจ สิ่งแวดล้อม มลพิษ
  caption: ปัจจัยภายในกำหนดศักยภาพ ส่วนปัจจัยภายนอกช่วยให้เติบโตได้เต็มศักยภาพนั้น
- type: worked-example
  title: วิเคราะห์การเปลี่ยนแปลงและปัจจัยของเพื่อนคนหนึ่ง
  problem: ต้น อายุ 13 ปี สูงขึ้นเร็ว เสียงแตก หงุดหงิดง่าย อยากไปเที่ยวกับเพื่อนมากกว่าไปบ้านยาย และเริ่มชอบถกเถียงเรื่องข่าว ต้นนอนตีหนึ่งเพราะดูคลิป จัดการเปลี่ยนแปลงตามด้าน และระบุปัจจัยที่ต้นปรับได้
  steps:
  - text: 'ร่างกาย: สูงขึ้นเร็ว เสียงแตก อารมณ์: หงุดหงิดง่าย'
  - text: 'สังคม: อยากอยู่กับเพื่อนมากขึ้น สติปัญญา: ถกเถียงและใช้เหตุผลเรื่องข่าว'
    why: การถกเถียงแสดงว่าคิดเชิงนามธรรมและตั้งคำถามได้มากขึ้น
  - text: 'ปัจจัยที่ปรับได้: การนอน ต้นนอนตีหนึ่ง ทำให้นอนไม่ถึง 8 ชั่วโมง ซึ่งทำให้หงุดหงิดและมีสมาธิน้อย'
  - text: 'แนวทาง: ตั้งเวลาปิดจอ ตกลงกับครอบครัวเรื่องเวลาไปเที่ยวกับเพื่อน และหาเวลาไปบ้านยายด้วยกัน'
  answer: การเปลี่ยนแปลงครบหลายด้านเป็นเรื่องปกติ ปัจจัยที่ควรปรับก่อนคือการนอน
- type: check
  problem: health.growth.adolescence.p002
  prompt: ลองตอบก่อนอ่านต่อ
- type: worked-example
  title: วิเคราะห์โฆษณาครีมผิวขาวด้วย 4 ขั้น
  problem: คลิปโฆษณาครีมสมมติมีนักแสดงผิวคล้ำถูกเพื่อนล้อ แล้วทาครีม 7 วันผิวขาวขึ้นจนมีคนชอบ ท้ายคลิปเขียนว่า "ขาวใสใน 7 วัน รับรองผล" วิเคราะห์โฆษณานี้
  steps:
  - text: 'ใครสร้าง ต้องการอะไร: บริษัทที่ขายครีม ต้องการให้ซื้อ'
  - text: 'เทคนิคจูงใจ: ทำให้รู้สึกว่าผิวคล้ำเป็นปัญหา ภาพก่อนและหลัง และสัญญาผลเร็วใน 7 วัน'
    why: การทำให้ผู้ชมรู้สึกด้อยเป็นเทคนิคที่สร้างความต้องการซื้อ
  - text: 'ตรวจข้อเท็จจริง: สีผิวขึ้นกับพันธุกรรมและแสงแดด ไม่ได้บอกคุณค่าของคน ครีมที่อ้างผลเร็วมากอาจมีสารห้ามใช้ ให้ตรวจเลขจดแจ้งกับ อย.'
  - text: 'ตัดสินใจ: ไม่ซื้อ ใช้ครีมกันแดดเพื่อสุขภาพผิว และเตือนเพื่อนว่าการล้อเรื่องสีผิวเป็นการกลั่นแกล้ง'
  answer: เป็นโฆษณาที่ใช้ค่านิยมเรื่องผิวขาวกดดันวัยรุ่นและสัญญาผลเกินจริง
- type: check
  problem: health.growth.adolescence.p011
glossary:
- term: วัยรุ่น
  definition: ช่วงอายุ 10–19 ปีตามนิยามขององค์การอนามัยโลก เป็นช่วงเปลี่ยนจากเด็กสู่ผู้ใหญ่
- term: ช่วงพุ่งสูง
  definition: ช่วงต้นวัยรุ่นที่ส่วนสูงและน้ำหนักเพิ่มเร็วกว่าช่วงอื่น เริ่มเร็วหรือช้าต่างกันในแต่ละคน
- term: ภาพลักษณ์ของร่างกาย
  definition: ความคิดและความรู้สึกที่เรามีต่อรูปร่างหน้าตาของตัวเอง ได้รับอิทธิพลจากสื่อ เพื่อน และครอบครัว
- term: ความคาดหวังของสังคม
  definition: สิ่งที่คนรอบตัวหรือค่านิยมในสังคมคิดว่าคนในวัยหรือเพศหนึ่ง ๆ ควรเป็นหรือควรทำ
flashcards:
- front: การเปลี่ยนแปลง 5 ด้านในวัยรุ่น
  back: ร่างกาย จิตใจ อารมณ์ สังคม สติปัญญา และทุกด้านส่งผลต่อกัน
- front: สมองส่วนหน้า (prefrontal cortex)
  back: ใช้วางแผนและตัดสินใจ พัฒนาเต็มที่ราวกลางถึงปลายวัย 20 ปี (NIMH)
- front: 4 ขั้นวิเคราะห์โฆษณา
  back: ใครสร้างและต้องการอะไร → เทคนิคจูงใจ → ตรวจข้อเท็จจริง → ตัดสินใจ
- front: ปัจจัยการเติบโตที่ปรับได้
  back: อาหาร การนอน 8–10 ชั่วโมง การออกกำลังกาย เพื่อน และการเลือกรับสื่อ
