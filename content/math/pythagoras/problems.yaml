  - id: math.pyth.p015
    topics: [math.geometry.pythagoras]
    difficulty: 2
    type: mcq
    stem: "สามเหลี่ยม $PQR$ มี $PQ = 8$, $QR = 15$ และ $PR = 17$ หน่วย สามเหลี่ยมนี้มีมุมฉากที่จุดใด"
    choices:
      - { id: a, text: "จุด $Q$", correct: true }
      - { id: b, text: "จุด $R$", feedback: "มุมที่ $R$ อยู่ตรงข้ามด้าน $PQ = 8$ ซึ่งสั้นที่สุด มุมฉากต้องอยู่ตรงข้ามด้านที่ยาวที่สุด" }
      - { id: c, text: "จุด $P$", feedback: "มุมที่ $P$ อยู่ตรงข้ามด้าน $QR = 15$ แต่ด้านที่ยาวที่สุดคือ $PR = 17$ มุมฉากต้องอยู่ตรงข้ามด้านนั้น" }
      - { id: d, text: "ไม่มีมุมฉาก", feedback: "ลองตรวจ $8^2 + 15^2 = 64 + 225 = 289 = 17^2$ ผลเท่ากัน จึงเป็นสามเหลี่ยมมุมฉาก" }
    hints:
      - "ตรวจด้วยบทกลับ: เทียบผลบวกกำลังสองของสองด้านที่สั้นกว่ากับกำลังสองของด้านที่ยาวที่สุด"
      - "มุมฉากอยู่ตรงข้ามด้านที่ยาวที่สุด จุดยอดนั้นคือจุดที่ไม่อยู่บนด้านนั้น"
    solution: "$8^2 + 15^2 = 289 = 17^2$ จึงเป็นสามเหลี่ยมมุมฉาก ด้านยาวที่สุดคือ $PR$ มุมฉากอยู่ตรงข้าม $PR$ คือที่จุด $Q$"
