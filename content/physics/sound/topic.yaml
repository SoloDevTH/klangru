id: physics.waves.sound
subject: physics
title: { th: เสียง, en: Sound }
summary: เสียงเป็นคลื่นตามยาวที่ต้องอาศัยตัวกลาง คำนวณอัตราเร็วเสียงและระยะจากเสียงสะท้อน แยกระดับเสียงกับความดัง และรู้จักหน่วยเดซิเบล
difficulty: 4.5
minutes: 30
prerequisites: [physics.waves.wave-basics]
encompasses:
  - { id: physics.waves.wave-basics, weight: 0.5 }
  - { id: physics.kinematics.speed, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: interactive
    title: เปรียบเทียบระดับเสียงและความดังจากรูปคลื่น
    caption: แกนนอนคือเวลา (ms) แกนตั้งคือความดันอากาศที่เปลี่ยนไปจากปกติ (หน่วยเปรียบเทียบ) เส้นหนึ่งเป็นเสียงอ้างอิงความถี่ 1 kHz อีกเส้นปรับได้ แถบ f เปลี่ยนความถี่ (kHz) ทำให้เสียงสูงหรือต่ำ คลื่นจะถี่หรือห่างขึ้น ส่วนแถบ a เปลี่ยนแอมพลิจูด ทำให้เสียงดังหรือเบา คลื่นจะสูงหรือเตี้ยลงแต่ความถี่เท่าเดิม
    widget:
      kind: function-plot
      functions: ["\\sin(2\\pi x)", "a \\sin(2\\pi f x)"]
      sliders:
        - { name: f, min: 0.5, max: 3, step: 0.5, value: 2, label: ความถี่ (kHz) }
        - { name: a, min: 0.5, max: 2.5, step: 0.5, value: 1, label: แอมพลิจูด (เทียบกับเสียงอ้างอิง) }
      x: [0, 3]
      y: [-3, 3]
  - type: simulation
    title: คลื่นเสียง (PhET Sound Waves)
    url: https://phet.colorado.edu/en/simulations/sound-waves
    provider: phet
    note: เปิดลำโพงแล้วดูอนุภาคอากาศ จะเห็นส่วนอัดและส่วนขยายแผ่ออกไป อนุภาคแต่ละตัวสั่นไปมาอยู่กับที่ ลองเพิ่มความถี่แล้วสังเกตว่าส่วนอัดอยู่ชิดกันขึ้น (ความยาวคลื่นสั้นลง) และลองเพิ่มแอมพลิจูดแล้วสังเกตว่าส่วนอัดแน่นขึ้น
glossary:
  - { term: เสียงสะท้อน, definition: "เสียงที่กระทบสิ่งกีดขวางแล้วย้อนกลับมา ระยะถึงสิ่งกีดขวางคือ $d = \\tfrac{vt}{2}$ เมื่อ $t$ คือเวลาไปและกลับ" }
  - { term: ระดับเสียง, definition: "ความสูงต่ำของเสียง ขึ้นกับความถี่ ความถี่สูงได้ยินเป็นเสียงสูง" }
  - { term: ความดัง, definition: "ความรู้สึกว่าเสียงแรงหรือเบา ขึ้นกับแอมพลิจูดและพลังงานของคลื่นเสียง" }
  - { term: เดซิเบล, definition: "หน่วยของระดับความเข้มเสียง ($\\mathrm{dB}$) ทุก $10\\ \\mathrm{dB}$ ที่เพิ่มขึ้น ความเข้มเสียงเพิ่ม 10 เท่า" }
flashcards:
  - { front: "อัตราเร็วเสียงในอากาศที่อุณหภูมิ $T$ องศาเซลเซียส", back: "$v \\approx 331 + 0.6T$ ($\\mathrm{m/s}$) เช่น $20\\ ^\\circ\\mathrm{C}$ ได้ $343\\ \\mathrm{m/s}$" }
  - { front: "ได้ยินเสียงสะท้อนหลัง $t$ วินาที ผนังอยู่ไกลเท่าใด", back: "$d = \\dfrac{vt}{2}$ เพราะเสียงเดินทางไปและกลับ" }
  - { front: "ระดับเสียงสูง–ต่ำ กับ ความดัง ขึ้นกับอะไร", back: "ระดับเสียงขึ้นกับความถี่ ความดังขึ้นกับแอมพลิจูด" }
  - { front: "ทำไมนักบินอวกาศคุยกันนอกยานด้วยเสียงไม่ได้", back: "เสียงเป็นคลื่นกล ต้องมีตัวกลาง ในอวกาศเป็นสุญญากาศ" }
status: draft
