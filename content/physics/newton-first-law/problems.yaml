problems:
  - id: phy.n1.p001
    topics: [physics.dynamics.newton-first]
    difficulty: 1
    type: mcq
    stem: "ผู้โดยสารยืนอยู่บนรถเมล์ที่กำลังแล่นไปข้างหน้า แล้วคนขับเบรกกะทันหัน ผู้โดยสารจะเป็นอย่างไร และเพราะเหตุใด"
    choices:
      - { id: a, text: "เซไปข้างหน้า เพราะตัวผู้โดยสารยังคงเคลื่อนที่ต่อไปตามความเฉื่อย ขณะที่รถช้าลง", correct: true }
      - { id: b, text: "เซไปข้างหลัง เพราะรถดึงตัวผู้โดยสารไว้", feedback: "ผู้โดยสารเอนไปข้างหลังเมื่อรถ **ออกตัว** ต่างหาก ตอนเบรก รถช้าลงแต่ตัวผู้โดยสารยังเคลื่อนที่ไปข้างหน้าต่อ" }
      - { id: c, text: "เซไปข้างหน้า เพราะมีแรงเฉื่อยผลักผู้โดยสารไปข้างหน้า", feedback: "ทิศถูกแล้ว แต่ไม่มีแรงใดผลักไปข้างหน้า ความเฉื่อยเป็นสมบัติของวัตถุที่รักษาสภาพการเคลื่อนที่ ไม่ใช่แรง" }
      - { id: d, text: "ไม่เซเลย เพราะผู้โดยสารอยู่นิ่งเมื่อเทียบกับรถ", feedback: "ก่อนเบรก ผู้โดยสารเคลื่อนที่ไปพร้อมรถ เมื่อรถถูกเบรก ตัวผู้โดยสารไม่ได้ถูกเบรกไปด้วยทันที จึงเคลื่อนที่ต่อและเซไปข้างหน้า" }
    hints:
      - "ก่อนเบรก ผู้โดยสารเคลื่อนที่ด้วยความเร็วเท่ากับรถ"
      - "แรงเบรกกระทำต่อรถ ไม่ได้กระทำต่อตัวผู้โดยสารโดยตรง ตัวผู้โดยสารจะรักษาสภาพการเคลื่อนที่อย่างไร"
    solution: "ตามกฎข้อที่ 1 ตัวผู้โดยสารรักษาสภาพการเคลื่อนที่ไปข้างหน้าด้วยความเร็วเดิม (ความเฉื่อย) เมื่อรถถูกเบรกให้ช้าลง ตัวผู้โดยสารจึงเคลื่อนที่ไปข้างหน้าเทียบกับรถ เห็นเป็นการเซไปข้างหน้า โดยไม่มีแรงใดผลักไปข้างหน้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n1.p002
    topics: [physics.dynamics.newton-first]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "สถานการณ์ใดที่แรงลัพธ์ที่กระทำต่อวัตถุเป็นศูนย์ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "หนังสือวางนิ่งอยู่บนโต๊ะ", correct: true }
      - { id: b, text: "รถยนต์แล่นบนถนนตรงด้วยความเร็วคงตัว $60\\ \\mathrm{km/h}$", correct: true }
      - { id: c, text: "ลิฟต์เคลื่อนที่ขึ้นด้วยความเร็วคงตัว", correct: true }
      - { id: d, text: "ลูกบอลที่โยนขึ้น ขณะอยู่ที่จุดสูงสุด", feedback: "ที่จุดสูงสุดความเร็วเป็นศูนย์ชั่วขณะเท่านั้น น้ำหนักยังดึงลูกบอลลง ความเร็วจึงเปลี่ยนต่อไป แรงลัพธ์ไม่เป็นศูนย์" }
      - { id: e, text: "รถจักรยานยนต์เลี้ยวโค้งด้วยอัตราเร็วคงตัว", feedback: "อัตราเร็วคงตัวแต่ทิศเปลี่ยน ความเร็วจึงไม่คงตัว ต้องมีแรงลัพธ์ทำให้เลี้ยว" }
      - { id: f, text: "รถยนต์ออกตัวจากไฟแดง", feedback: "รถเร็วขึ้น แปลว่าความเร็วเปลี่ยน ต้องมีแรงลัพธ์ไปข้างหน้า" }
    hints:
      - "แรงลัพธ์เป็นศูนย์ก็ต่อเมื่อความเร็วไม่เปลี่ยน ทั้งขนาดและทิศ"
      - "ตรวจทีละข้อว่าวัตถุเร็วขึ้น ช้าลง หรือเปลี่ยนทิศหรือไม่"
    solution: "แรงลัพธ์เป็นศูนย์เมื่อวัตถุนิ่ง (หนังสือ) หรือเคลื่อนที่ด้วยความเร็วคงตัวในแนวตรง (รถบนถนนตรง ลิฟต์) ส่วนลูกบอลที่จุดสูงสุดมีน้ำหนักกระทำ รถที่เลี้ยวโค้งเปลี่ยนทิศ และรถที่ออกตัวเร็วขึ้น จึงมีแรงลัพธ์ไม่เป็นศูนย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n1.p003
    topics: [physics.dynamics.newton-first]
    difficulty: 1
    type: numeric
    stem: "โคมไฟหนัก $35\\ \\mathrm{N}$ แขวนนิ่งอยู่กับเพดานด้วยเชือกเส้นเดียวในแนวดิ่ง แรงตึงในเชือกมีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 35, unit: N }
    hints:
      - "โคมไฟนิ่ง แรงลัพธ์จึงเป็นเท่าใด"
      - "มีแรงสองแรง คือน้ำหนักชี้ลงและแรงตึงชี้ขึ้น ทั้งสองต้องหักล้างกันพอดี"
    misconceptions:
      - { match: 0, feedback: "โคมไฟนิ่งไม่ได้แปลว่าไม่มีแรง เชือกต้องดึงขึ้นเพื่อต้านน้ำหนัก มิฉะนั้นโคมไฟจะตกลงมา" }
    solution: "โคมไฟอยู่ในสมดุลสถิต ให้ทิศขึ้นเป็นบวก: $T + (-35\\ \\mathrm{N}) = 0$ ได้ $T = 35\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n1.p004
    topics: [physics.dynamics.newton-first]
    difficulty: 2
    type: mcq
    stem: "รถยนต์แล่นบนมอเตอร์เวย์ช่วงที่เป็นทางตรงด้วยความเร็วคงตัว $90\\ \\mathrm{km/h}$ แรงต้านอากาศและแรงต้านจากถนนรวมกันเป็น $1800\\ \\mathrm{N}$ แรงขับที่ทำให้รถเคลื่อนที่ไปข้างหน้ามีขนาดเท่าใด"
    choices:
      - { id: a, text: "เท่ากับ $1800\\ \\mathrm{N}$ พอดี", correct: true }
      - { id: b, text: "มากกว่า $1800\\ \\mathrm{N}$ มิฉะนั้นรถจะไม่ไปข้างหน้า", feedback: "ถ้าแรงขับมากกว่าแรงต้าน แรงลัพธ์จะชี้ไปข้างหน้าและรถจะเร็วขึ้นเรื่อย ๆ แต่รถแล่นด้วยความเร็วคงตัว รถเคลื่อนที่ต่อไปได้เองตามความเฉื่อย" }
      - { id: c, text: "น้อยกว่า $1800\\ \\mathrm{N}$ เพราะรถไม่ได้เร่งความเร็ว", feedback: "ถ้าแรงขับน้อยกว่าแรงต้าน แรงลัพธ์จะชี้ไปข้างหลังและรถจะช้าลง" }
      - { id: d, text: "เป็นศูนย์ เพราะความเร็วคงตัวแปลว่าไม่มีแรงกระทำ", feedback: "ความเร็วคงตัวแปลว่าแรง **ลัพธ์** เป็นศูนย์ ไม่ใช่ไม่มีแรง ถ้าไม่มีแรงขับ แรงต้านจะทำให้รถช้าลง" }
    hints:
      - "ความเร็วคงตัวบอกอะไรเกี่ยวกับแรงลัพธ์"
      - "ในแนวราบมีแรงขับไปข้างหน้าและแรงต้านไปข้างหลัง สองแรงนี้ต้องสัมพันธ์กันอย่างไรแรงลัพธ์จึงเป็นศูนย์"
    solution: "รถมีความเร็วคงตัว จึงอยู่ในสมดุลจลน์ แรงลัพธ์แนวราบเป็นศูนย์: $F + (-1800\\ \\mathrm{N}) = 0$ ได้ $F = 1800\\ \\mathrm{N}$ ค่าความเร็ว $90\\ \\mathrm{km/h}$ ไม่เกี่ยว ขอเพียงความเร็วคงตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n1.p005
    topics: [physics.dynamics.newton-first]
    difficulty: 3
    type: numeric
    stem: "พนักงานสองคนย้ายตู้เย็นบนพื้นห้อง คนแรกดันจากด้านหลังด้วยแรง $90\\ \\mathrm{N}$ คนที่สองดึงจากด้านหน้าไปทางเดียวกันด้วยแรง $70\\ \\mathrm{N}$ ตู้เย็นเลื่อนไปด้วยความเร็วคงตัว แรงเสียดทานจากพื้นมีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 160, unit: N }
    hints:
      - "ความเร็วคงตัว แปลว่าแรงลัพธ์แนวราบเป็นศูนย์"
      - "แรงดันและแรงดึงชี้ไปทางเดียวกัน ส่วนแรงเสียดทานชี้ทางตรงข้าม"
      - "ให้ทิศการเคลื่อนที่เป็นบวก แล้วแก้ $90 + 70 - f = 0$"
    misconceptions:
      - { match: 20, feedback: "ดูเหมือนนำแรงของสองคนมาลบกัน แต่คนหนึ่งดันจากด้านหลัง อีกคนดึงจากด้านหน้า ทั้งสองแรงชี้ไปทางเดียวกัน จึงต้องบวกกัน" }
    solution: "ให้ทิศการเคลื่อนที่เป็นบวก ตู้เย็นอยู่ในสมดุลจลน์: $(+90) + (+70) + (-f) = 0$ ได้ $f = 160\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n1.p006
    topics: [physics.dynamics.newton-first]
    difficulty: 2
    type: text
    stem: "สมบัติของวัตถุที่ต้านการเปลี่ยนสภาพการเคลื่อนที่ ซึ่งขึ้นกับมวลของวัตถุ เรียกว่าอะไร (ตอบเป็นคำภาษาไทยหรือภาษาอังกฤษ)"
    accepted: ["ความเฉื่อย", "inertia", "ความเฉื่อยของวัตถุ"]
    hints:
      - "เป็นคำที่ใช้อธิบายว่าทำไมเราเซไปข้างหน้าเมื่อรถเบรก"
      - "สมบัตินี้ไม่ใช่แรง และไม่ขึ้นกับความเร็ว"
    misconceptions:
      - { match: "แรงเฉื่อย", feedback: "เกือบถูก แต่ความเฉื่อยไม่ใช่แรง เป็นสมบัติของวัตถุ จึงไม่ควรเรียกว่าแรง" }
      - { match: "น้ำหนัก", feedback: "น้ำหนักคือแรงที่โลกดึงวัตถุ ส่วนสมบัติที่ต้านการเปลี่ยนการเคลื่อนที่มีชื่อเฉพาะ และมีอยู่แม้ในอวกาศที่ไม่มีน้ำหนัก" }
    solution: "ความเฉื่อย (inertia) คือสมบัติของวัตถุที่ต้านการเปลี่ยนสภาพการเคลื่อนที่ วัตถุมวลมากมีความเฉื่อยมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n1.p007
    topics: [physics.dynamics.newton-first]
    difficulty: 3
    type: mcq
    stem: "รถบรรทุกมวล $10$ ตันจอดนิ่งอยู่ ส่วนจักรยานมวล $15\\ \\mathrm{kg}$ กำลังแล่นเร็ว วัตถุใดมีความเฉื่อยมากกว่า"
    choices:
      - { id: a, text: "รถบรรทุก เพราะมีมวลมากกว่า", correct: true }
      - { id: b, text: "จักรยาน เพราะกำลังเคลื่อนที่เร็ว", feedback: "ความเฉื่อยไม่ขึ้นกับความเร็ว ขึ้นกับมวลอย่างเดียว" }
      - { id: c, text: "รถบรรทุกไม่มีความเฉื่อย เพราะจอดนิ่ง", feedback: "วัตถุนิ่งก็มีความเฉื่อย ลองเข็นรถบรรทุกให้ออกตัวดูจะรู้ว่ายากมาก นั่นคือความเฉื่อย" }
      - { id: d, text: "เท่ากัน เพราะทั้งสองไม่มีแรงลัพธ์กระทำ", feedback: "ความเฉื่อยเป็นสมบัติของวัตถุที่ขึ้นกับมวล ไม่ได้ขึ้นกับแรงที่กระทำในขณะนั้น" }
    hints:
      - "ความเฉื่อยขึ้นกับปริมาณใดของวัตถุ"
      - "เปรียบเทียบมวลของทั้งสอง (1 ตัน = 1000 กิโลกรัม)"
    solution: "ความเฉื่อยขึ้นกับมวลเท่านั้น รถบรรทุกมวล $10\\,000\\ \\mathrm{kg}$ มากกว่าจักรยาน $15\\ \\mathrm{kg}$ มาก จึงมีความเฉื่อยมากกว่า ไม่ว่าจะนิ่งหรือเคลื่อนที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n1.p008
    topics: [physics.dynamics.newton-first]
    difficulty: 4
    type: numeric
    stem: "กล่องหนัก $200\\ \\mathrm{N}$ วางอยู่บนพื้น นักเรียนผูกเชือกที่กล่องแล้วดึงขึ้นในแนวดิ่งด้วยแรง $80\\ \\mathrm{N}$ แต่กล่องยังวางนิ่งอยู่บนพื้น แรงตั้งฉากที่พื้นดันกล่องขึ้นมีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 120, unit: N }
    hints:
      - "วาดแผนภาพแรงของกล่อง: แรงชี้ลงหนึ่งแรง แรงชี้ขึ้นสองแรง"
      - "กล่องนิ่ง แรงลัพธ์แนวดิ่งจึงเป็นศูนย์"
      - "ให้ทิศขึ้นเป็นบวก แล้วแก้ $N + 80 - 200 = 0$"
    misconceptions:
      - { match: 200, feedback: "แรงตั้งฉากไม่จำเป็นต้องเท่ากับน้ำหนักเสมอ เชือกช่วยดึงกล่องขึ้นอยู่ $80\\ \\mathrm{N}$ พื้นจึงดันขึ้นน้อยลง" }
      - { match: 280, feedback: "ดูเหมือนคิดว่าแรงดึงของเชือกชี้ลง แต่นักเรียนดึงขึ้น แรงตึงจึงช่วยพื้นรับน้ำหนัก" }
    solution: "ให้ทิศขึ้นเป็นบวก กล่องอยู่ในสมดุลสถิต: $N + (+80) + (-200) = 0$ ได้ $N = 120\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.n1.p009
    topics: [physics.dynamics.newton-first]
    difficulty: 4
    type: expression
    stem: "รถกระบะลากรถพ่วงด้วยความเร็วคงตัวบนถนนตรง แรงต้านที่กระทำต่อรถกระบะมีขนาด $P$ และแรงต้านที่กระทำต่อรถพ่วงมีขนาด $Q$ แรงตึงในข้อต่อระหว่างรถกระบะกับรถพ่วงมีขนาดเท่าใด เขียนในรูปของ $P$ และ $Q$ (ตามที่จำเป็น)"
    prefix: "T ="
    answer: { latex: "Q", variables: [P, Q] }
    hints:
      - "เลือกรถพ่วงคันเดียวเป็นวัตถุที่สนใจ แล้ววาดแผนภาพแรงแนวราบของมัน"
      - "รถพ่วงมีแรงแนวราบสองแรง คือแรงตึงของข้อต่อดึงไปข้างหน้า และแรงต้านของรถพ่วงเอง ความเร็วคงตัวบอกอะไร"
    misconceptions:
      - { match: "P + Q", feedback: "นั่นคือแรงขับที่ถนนดันล้อรถกระบะ (คิดรถทั้งสองคันรวมกัน) แต่ข้อต่อดึงเฉพาะรถพ่วง ให้พิจารณารถพ่วงคันเดียว" }
      - { match: "P", feedback: "$P$ เป็นแรงต้านที่กระทำต่อรถกระบะ ไม่ได้กระทำต่อรถพ่วง ให้วาดแผนภาพแรงของรถพ่วงคันเดียว" }
    solution: "พิจารณารถพ่วงคันเดียว แนวราบมีแรงตึง $T$ ไปข้างหน้าและแรงต้าน $Q$ ไปข้างหลัง ความเร็วคงตัวจึงอยู่ในสมดุลจลน์: $T - Q = 0$ ได้ $T = Q$ (ส่วนแรงขับของรถกระบะต้องเท่ากับ $P + Q$ เมื่อคิดรถทั้งสองคันรวมกัน)"
