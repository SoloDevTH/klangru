- id: english.reading.argumentative-texts.p015
  topics:
  - english.reading.argumentative-texts
  difficulty: 4
  type: mcq
  stem: 'จากประโยค "Many rural schools are ill-equipped to teach coding, as they have only a few old computers." คำว่า ill-equipped มีความหมายใกล้เคียงที่สุดกับข้อใด'
  choices:
  - id: a
    text: ขาดอุปกรณ์หรือความพร้อมที่จำเป็น
    correct: true
    feedback: ถูก ill- ในคำประสมแปลว่าไม่ดีหรือไม่พอ และ equipped แปลว่ามีอุปกรณ์ เมื่อรวมกันจึงหมายถึงมีอุปกรณ์ไม่พอ
  - id: b
    text: เจ็บป่วยบ่อย
    feedback: ill ที่ยืนเดี่ยวแปลว่าป่วย แต่ ill- ในคำประสมแปลว่าไม่ดีหรือไม่พอ และบริบทพูดถึงคอมพิวเตอร์ ไม่ใช่สุขภาพ
  - id: c
    text: มีอุปกรณ์ครบและทันสมัย
    feedback: ตรงข้ามกับความหมาย ประโยคบอกว่ามีคอมพิวเตอร์เก่าเพียงไม่กี่เครื่อง
  - id: d
    text: ไม่สนใจสอนการเขียนโปรแกรม
    feedback: ประโยคพูดถึงความพร้อมด้านอุปกรณ์ ไม่ได้พูดถึงความสนใจ
  hints:
  - ill- ในคำประสม เช่น ill-conceived แปลว่าไม่ดีหรือไม่พอ
  - ประโยคหลัง as บอกเหตุผล ใช้บริบทนี้ช่วยเดา
  solution: ข้อ a ถูก เพราะ ill- แปลว่าไม่ดีหรือไม่พอ และ equipped แปลว่ามีอุปกรณ์ บริบท only a few old computers ยืนยันความหมายนี้
