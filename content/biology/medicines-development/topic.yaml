id: biology.health.medicines-development
subject: biology
title: { th: การพัฒนายาใหม่และการทดลองทางคลินิก, en: "Developing new medicines and clinical trials" }
summary: การค้นพบยา การทดสอบก่อนคลินิก การทดลองทางคลินิก 4 ระยะ การทดลองแบบสุ่มที่มีกลุ่มควบคุม ยาหลอกและการปกปิด จริยธรรม การอนุมัติโดย อย. การเฝ้าระวังหลังวางจำหน่าย และจีโนมิกส์กับการแพทย์
difficulty: 6
minutes: 40
prerequisites: [biology.animals.immunity, biology.genetics.mutation-biotechnology, science.inquiry.evaluating-claims]
encompasses:
  - { id: science.inquiry.evaluating-claims, weight: 0.3 }
  - { id: biology.genetics.mutation-biotechnology, weight: 0.1 }
  - { id: biology.animals.immunity, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ขั้นตอนการพัฒนายาใหม่
    src: pipeline.svg
    alt: "แผนภาพเจ็ดกล่องเรียงจากซ้ายไปขวาเชื่อมด้วยลูกศร หัวภาพว่าการพัฒนายาใหม่มักใช้เวลามากกว่า 10 ปี 1 ค้นพบยา หาเป้าหมายของโรค คัดสาร 5,000–10,000 ชนิด 2 ก่อนคลินิก ทดสอบในเซลล์และสัตว์ เหลือราว 250 ชนิด สองกล่องนี้มีวงเล็บว่าในห้องปฏิบัติการ 3 ระยะที่ 1 อาสาสมัคร 20–100 คน ความปลอดภัย ขนาดยา 4 ระยะที่ 2 ผู้ป่วยหลายสิบถึงหลายร้อยคน ได้ผลหรือไม่ ผลข้างเคียง 5 ระยะที่ 3 ผู้ป่วยหลายร้อยถึงหลายพันคน ยืนยันว่าได้ผล เทียบยาเดิมหรือยาหลอก สามกล่องนี้มีวงเล็บว่าการทดลองทางคลินิกในคน 6 ขออนุมัติ หน่วยงานกำกับยา ในไทยคือ อย. 7 ระยะที่ 4 ผู้ใช้ยาจริงจำนวนมาก เฝ้าระวังผลข้างเคียงที่พบน้อย วงเล็บว่าหลังวางจำหน่าย ด้านล่างเป็นแผนภูมิแท่งจำนวนสารที่ผ่านแต่ละขั้นโดยประมาณ สารที่คัดกรอง 5,000–10,000 ทดสอบก่อนคลินิกราว 250 ทดลองในคนราว 10 ได้รับอนุมัติราว 1 หมายเหตุว่าสารที่เข้าสู่ระยะที่ 1 ราว 9 ใน 10 ไม่ผ่านถึงการอนุมัติ"
    caption: "สารส่วนใหญ่ตกไประหว่างทางเพราะไม่ได้ผลหรือไม่ปลอดภัย (วาดโดยทีมคลังรู้ ตัวเลขโดยประมาณ ต่างกันตามโรค)"
  - { type: check, problem: biology.health.medicines-development.p002, prompt: "แต่ละระยะถามคำถามต่างกัน" }
  - type: figure
    title: การทดลองแบบสุ่มที่มีกลุ่มควบคุม
    src: rct.svg
    alt: "แผนภาพไหลจากซ้ายไปขวา กล่องผู้ป่วยที่เข้าเกณฑ์และยินยอมหลังได้รับข้อมูลครบ ลูกศรไปวงกลมสุ่มแบ่งกลุ่ม แยกเป็นสองทาง ทางบนกล่องกลุ่มทดลองได้ยาใหม่ ทางล่างกล่องกลุ่มควบคุมได้ยาหลอกหรือยามาตรฐาน ทั้งสองกลุ่มได้เม็ดยาหน้าตาเหมือนกัน แล้วลูกศรรวมไปกล่องเปรียบเทียบผลตามตัวชี้วัดที่กำหนดไว้ล่วงหน้า ด้านล่างมีกรอบเส้นประว่า ปกปิดสองทาง ผู้ป่วยและผู้วัดผลไม่รู้ว่าใครอยู่กลุ่มใด"
    caption: "การสุ่ม กลุ่มควบคุม และการปกปิดทำให้ความแตกต่างของผลมาจากตัวยา (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: อ่านผลการทดลองวัคซีน
    problem: "การทดลองวัคซีนแบบสุ่มปกปิดสองทาง (ข้อมูลสมมติ) กลุ่มละ 10,000 คน กลุ่มยาหลอกป่วย 200 คน กลุ่มวัคซีนป่วย 50 คน หาความเสี่ยงสัมพัทธ์ ประสิทธิผล ความเสี่ยงสัมบูรณ์ที่ลดลง และจำนวนที่ต้องฉีดเพื่อป้องกันผู้ป่วย 1 คน"
    steps:
      - text: "ความเสี่ยงกลุ่มยาหลอก $200/10{,}000 = 2\\%$ กลุ่มวัคซีน $50/10{,}000 = 0.5\\%$"
      - text: "$RR = 0.5\\% / 2\\% = 0.25$ ประสิทธิผล $= 1 - 0.25 = 75\\%$"
        why: "ประสิทธิผลบอกว่าความเสี่ยงลดลงกี่เปอร์เซ็นต์เมื่อเทียบกับกลุ่มควบคุม"
      - text: "ความเสี่ยงสัมบูรณ์ลดลง $2\\% - 0.5\\% = 1.5$ จุดร้อยละ $= 0.015$"
      - text: "$NNT = 1/0.015 \\approx 67$ คน"
        why: "NNT ขึ้นกับความเสี่ยงเดิม โรคที่พบน้อยมี NNT สูงแม้ประสิทธิผลจะสูง"
    answer: "RR = 0.25 ประสิทธิผล 75% ความเสี่ยงสัมบูรณ์ลดลง 1.5 จุดร้อยละ NNT ราว 67 คน"
  - { type: check, problem: biology.health.medicines-development.p005 }
  - type: worked-example
    title: ทำไมต้องเฝ้าระวังหลังวางจำหน่าย
    problem: "ผลข้างเคียงรุนแรงชนิดหนึ่งเกิดกับ 1 ใน 10,000 คน การทดลองระยะที่ 3 มีผู้ได้ยา 3,000 คน โอกาสที่จะพบผลข้างเคียงนี้อย่างน้อย 1 รายเป็นเท่าใด"
    steps:
      - text: "โอกาสที่คนหนึ่งไม่เกิด $= 1 - 0.0001 = 0.9999$"
      - text: "โอกาสที่ไม่เกิดเลยใน 3,000 คน $= 0.9999^{3000} \\approx 0.741$"
        why: "แต่ละคนเกิดหรือไม่เกิดเป็นอิสระต่อกัน จึงคูณโอกาสกัน"
      - text: "โอกาสพบอย่างน้อย 1 ราย $= 1 - 0.741 \\approx 0.259$"
      - text: "เมื่อยาวางจำหน่ายและมีผู้ใช้หลายแสนคน จะเกิดผลข้างเคียงนี้หลายสิบราย จึงต้องมีระบบรายงานอาการไม่พึงประสงค์"
    answer: "ราว 26% การทดลองจึงมีโอกาสสูงที่จะไม่พบผลข้างเคียงนี้"
glossary:
  - { term: เป้าหมายของยา, definition: "โมเลกุลในร่างกายหรือในเชื้อโรค มักเป็นโปรตีน ที่ยาไปจับเพื่อเปลี่ยนการทำงาน" }
  - { term: การทดสอบก่อนคลินิก, definition: "การทดสอบความเป็นพิษและการทำงานของยาในเซลล์และสัตว์ทดลองก่อนให้คน" }
  - { term: การทดลองทางคลินิก, definition: "การวิจัยยาในคนตามแผนที่กำหนด แบ่งเป็นระยะที่ 1 ถึง 4" }
  - { term: การทดลองแบบสุ่มที่มีกลุ่มควบคุม, definition: "การทดลองที่สุ่มแบ่งผู้เข้าร่วมเป็นกลุ่มได้ยาจริงและกลุ่มควบคุม แล้วเปรียบเทียบผล" }
  - { term: ยาหลอก, definition: "สิ่งที่หน้าตาเหมือนยาจริงแต่ไม่มีตัวยาที่ทดสอบ ใช้กับกลุ่มควบคุม" }
  - { term: การปกปิดสองทาง, definition: "การที่ทั้งผู้เข้าร่วมและผู้วัดผลไม่รู้ว่าใครอยู่กลุ่มใด" }
  - { term: ความยินยอมโดยได้รับข้อมูล, definition: "การตัดสินใจเข้าร่วมวิจัยโดยสมัครใจหลังรู้วัตถุประสงค์ ประโยชน์ และความเสี่ยง ถอนตัวได้ทุกเมื่อ" }
  - { term: การเฝ้าระวังความปลอดภัยด้านยา, definition: "การเก็บและวิเคราะห์รายงานอาการไม่พึงประสงค์จากยาหลังวางจำหน่าย" }
  - { term: เภสัชพันธุศาสตร์, definition: "การศึกษาว่ายีนของแต่ละคนมีผลต่อการตอบสนองและการแพ้ยาอย่างไร" }
flashcards:
  - { front: "การทดลองทางคลินิก 4 ระยะ", back: "1 ความปลอดภัยในคนจำนวนน้อย 2 ได้ผลหรือไม่ 3 ยืนยันในคนจำนวนมาก 4 เฝ้าระวังหลังวางจำหน่าย" }
  - { front: "สุ่ม กลุ่มควบคุม ปกปิด ช่วยอะไร", back: "สุ่มให้กลุ่มคล้ายกัน กลุ่มควบคุมแยกผลยาหลอกและการหายเอง ปกปิดลดความเอนเอียง" }
  - { front: "ประสิทธิผลกับ NNT", back: "ประสิทธิผล = 1 − RR บอกความเสี่ยงที่ลดลงแบบสัมพัทธ์ NNT = 1 ÷ ความเสี่ยงสัมบูรณ์ที่ลดลง" }
  - { front: "เมื่อใดห้ามใช้ยาหลอกอย่างเดียว", back: "เมื่อมียาที่ได้ผลอยู่แล้ว ต้องเทียบกับยามาตรฐาน ตามหลักปฏิญญาเฮลซิงกิ" }
  - { front: "จีโนมิกส์ช่วยการแพทย์อย่างไร", back: "ตรวจยีนก่อนให้ยาเพื่อเลี่ยงการแพ้ เลือกยามุ่งเป้าตามการกลายพันธุ์ของมะเร็ง และหาเป้าหมายใหม่ของยา" }
