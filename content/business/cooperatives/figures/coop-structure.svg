<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="sans-serif" font-size="14">
  <title>โครงสร้างและการแบ่งกำไรของสหกรณ์: สมาชิกเป็นเจ้าของ ควบคุม และใช้บริการ</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="780" height="430" fill="#ffffff"/>
  <rect x="20.0" y="30.0" width="200.0" height="90.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="120.0" y="60.5" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">สมาชิก</text>
  <text x="120.0" y="79.5" text-anchor="middle" fill="#1f2937" font-size="13">ถือหุ้นและใช้บริการ</text>
  <text x="120.0" y="98.5" text-anchor="middle" fill="#1f2937" font-size="13">1 คน 1 เสียง</text>
  <rect x="290.0" y="30.0" width="200.0" height="90.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="390.0" y="60.5" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ที่ประชุมใหญ่</text>
  <text x="390.0" y="79.5" text-anchor="middle" fill="#1f2937" font-size="13">กำหนดนโยบาย ข้อบังคับ</text>
  <text x="390.0" y="98.5" text-anchor="middle" fill="#1f2937" font-size="13">เลือกกรรมการ</text>
  <rect x="560.0" y="30.0" width="200.0" height="90.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="660.0" y="60.5" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">คณะกรรมการดำเนินการ</text>
  <text x="660.0" y="79.5" text-anchor="middle" fill="#1f2937" font-size="13">บริหารตามมติ</text>
  <text x="660.0" y="98.5" text-anchor="middle" fill="#1f2937" font-size="13">จ้างผู้จัดการ</text>
  <line x1="220.0" y1="75.0" x2="288.0" y2="75.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="490.0" y1="75.0" x2="558.0" y2="75.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="290.0" y="170.0" width="470.0" height="80.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="525.0" y="205.1" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ธุรกิจของสหกรณ์</text>
  <text x="525.0" y="224.1" text-anchor="middle" fill="#1f2937" font-size="13">ซื้อปัจจัยการผลิต · รวบรวมผลผลิตไปขาย · ร้านค้า · รับฝากเงิน · ให้กู้</text>
  <line x1="660.0" y1="120.0" x2="660.0" y2="168.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="652.0" y="150.0" text-anchor="end" fill="#6b7280" font-size="12">ผ่านผู้จัดการและเจ้าหน้าที่</text>
  <line x1="120.0" y1="120.0" x2="120.0" y2="210.0" stroke="#1f2937" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="120.0" y1="210.0" x2="288.0" y2="210.0" stroke="#1f2937" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="200.0" y="200.0" text-anchor="middle" fill="#1f2937" font-size="12">ทำธุรกิจกับสหกรณ์</text>
  <rect x="290.0" y="290.0" width="200.0" height="56.0" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="390.0" y="322.9" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">กำไรสุทธิประจำปี</text>
  <line x1="390.0" y1="250.0" x2="390.0" y2="288.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="20.0" y="370.0" width="220.0" height="48.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="130.0" y="398.2" text-anchor="middle" fill="#1f2937" font-size="12">ทุนสำรอง (แบ่งให้สมาชิกไม่ได้)</text>
  <rect x="280.0" y="370.0" width="220.0" height="48.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="390.0" y="398.2" text-anchor="middle" fill="#1f2937" font-size="12">เงินปันผลตามหุ้น (อัตราจำกัด)</text>
  <rect x="540.0" y="370.0" width="220.0" height="48.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="650.0" y="398.2" text-anchor="middle" fill="#1f2937" font-size="12">เงินเฉลี่ยคืนตามส่วนธุรกิจ</text>
  <line x1="330.0" y1="346.0" x2="130.0" y2="368.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="390.0" y1="346.0" x2="390.0" y2="368.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450.0" y1="346.0" x2="650.0" y2="368.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="640.0" y="312.0" text-anchor="middle" fill="#6b7280" font-size="12">และทุนสวัสดิการ ทุนสาธารณประโยชน์</text>
  <text x="640.0" y="330.0" text-anchor="middle" fill="#6b7280" font-size="12">โบนัสกรรมการ ตามข้อบังคับ</text>
</svg>
