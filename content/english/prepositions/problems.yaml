problems:
  - id: english.grammar.prepositions.p001
    topics: [english.grammar.prepositions]
    difficulty: 1
    type: mcq
    stem: "อ่านประโยค *The ball is behind the box.* แล้วเลือกภาพที่ตรง"
    figure: { src: positions-quiz.svg, alt: "ภาพสี่ภาพ ภาพ A ลูกบอลวางอยู่บนกล่อง ภาพ B ลูกบอลโผล่มาเพียงเล็กน้อยจากด้านหลังกล่อง ภาพ C ลูกบอลอยู่ในกล่องที่เปิดฝา มองเห็นผ่านด้านหน้า ภาพ D ลูกบอลวางอยู่บนพื้นด้านหน้ากล่อง" }
    choices:
      - { id: a, text: "A", feedback: "ภาพ A ลูกบอลอยู่บนกล่อง (on the box)" }
      - { id: b, text: "B", correct: true, feedback: "ถูก ลูกบอลถูกกล่องบังไว้ อยู่ข้างหลังกล่อง" }
      - { id: c, text: "C", feedback: "ภาพ C ลูกบอลอยู่ในกล่อง (in the box)" }
      - { id: d, text: "D", feedback: "ภาพ D ลูกบอลอยู่ข้างหน้ากล่อง (in front of) ซึ่งตรงข้ามกับ behind" }
    hints:
      - "behind แปลว่าอะไร"
      - "ของที่อยู่ข้างหลังจะถูกบังไว้บางส่วน"
    solution: "*behind* = ข้างหลัง ภาพที่ลูกบอลถูกกล่องบังคือ **B**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.prepositions.p002
    topics: [english.grammar.prepositions]
    difficulty: 1
    type: text
    stem: "เติมคำที่แปลว่า ใต้: *The cat is ___ the table.*"
    accepted: ["under"]
    misconceptions:
      - { match: "on", feedback: "on แปลว่า บน ใต้คือ under" }
      - { match: "in", feedback: "in แปลว่า ข้างใน ใต้คือ under" }
      - { match: "behind", feedback: "behind แปลว่า ข้างหลัง ใต้คือ under" }
    hints:
      - "แมวอยู่ใต้โต๊ะ"
      - "ดูภาพลูกบอลใต้โต๊ะในบทเรียน"
    solution: "*The cat is **under** the table.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.prepositions.p003
    topics: [english.grammar.prepositions]
    difficulty: 1
    type: match
    stem: "จับคู่บุพบทกับความหมาย"
    pairs:
      - { left: "in", right: "ข้างใน" }
      - { left: "on", right: "บน" }
      - { left: "under", right: "ใต้" }
      - { left: "behind", right: "ข้างหลัง" }
      - { left: "next to", right: "ข้าง ๆ ติดกัน" }
    hints:
      - "ดูภาพลูกบอลกับกล่องในบทเรียน"
      - "in กับ on ต่างกันที่อยู่ข้างในหรืออยู่บนพื้นผิว"
    solution: "in → ข้างใน · on → บน · under → ใต้ · behind → ข้างหลัง · next to → ข้าง ๆ ติดกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.prepositions.p004
    topics: [english.grammar.prepositions]
    difficulty: 2
    type: mcq
    stem: "เลือกบุพบทที่ถูก: *We have English ___ Monday.*"
    choices:
      - { id: a, text: "on", correct: true, feedback: "ถูก วันในสัปดาห์ใช้ on" }
      - { id: b, text: "in", feedback: "in ใช้กับเดือน ปี และช่วงของวัน วันในสัปดาห์ใช้ on" }
      - { id: c, text: "at", feedback: "at ใช้กับเวลาบนนาฬิกา วันใช้ on" }
      - { id: d, text: "to", feedback: "to บอกทิศทางไปยังที่ใด ไม่ได้บอกวัน" }
    hints:
      - "Monday เป็นวัน"
      - "at = เวลา · on = วัน · in = เดือน ปี"
    solution: "*We have English **on** Monday.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.prepositions.p005
    topics: [english.grammar.prepositions]
    difficulty: 2
    type: text
    stem: "เติมบุพบท: *My birthday is ___ May.*"
    accepted: ["in"]
    misconceptions:
      - { match: "on", feedback: "on ใช้กับวันหรือวันที่ ถ้าบอกแค่เดือนใช้ in" }
      - { match: "at", feedback: "at ใช้กับเวลาบนนาฬิกา เดือนใช้ in" }
    hints:
      - "May เป็นเดือน"
      - "เดือนและปีใช้บุพบทที่กว้างที่สุด"
    solution: "*My birthday is **in** May.* (ถ้าบอกวันที่ด้วย: *on 5 May*)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.prepositions.p006
    topics: [english.grammar.prepositions]
    difficulty: 2
    type: text
    stem: "นักเรียนไทยเข้าแถวร้องเพลงชาติตอน 8 โมงเช้า เติมบุพบท: *We sing the national anthem ___ 8 o'clock.*"
    accepted: ["at"]
    misconceptions:
      - { match: "in", feedback: "in ใช้กับช่วงเวลา เช่น in the morning เวลาบนนาฬิกาใช้ at" }
      - { match: "on", feedback: "on ใช้กับวัน เวลาบนนาฬิกาใช้ at" }
    hints:
      - "8 o'clock เป็นเวลาบนนาฬิกา"
      - "เวลาที่เจาะจงที่สุดอยู่ชั้นบนของภาพสามชั้น"
    solution: "*We sing the national anthem **at** 8 o'clock.* (หรือ *at 8 o'clock in the morning*)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.prepositions.p007
    topics: [english.grammar.prepositions]
    difficulty: 2
    type: mcq
    stem: "ดูภาพเดิม อ่านประโยค *The ball is in front of the box.* แล้วเลือกภาพที่ตรง"
    figure: { src: positions-quiz.svg, alt: "ภาพสี่ภาพ ภาพ A ลูกบอลวางอยู่บนกล่อง ภาพ B ลูกบอลโผล่มาเพียงเล็กน้อยจากด้านหลังกล่อง ภาพ C ลูกบอลอยู่ในกล่องที่เปิดฝา มองเห็นผ่านด้านหน้า ภาพ D ลูกบอลวางอยู่บนพื้นด้านหน้ากล่อง" }
    choices:
      - { id: a, text: "A", feedback: "ภาพ A ลูกบอลอยู่บนกล่อง (on)" }
      - { id: b, text: "B", feedback: "ภาพ B ลูกบอลอยู่ข้างหลังกล่อง (behind) ตรงข้ามกับ in front of" }
      - { id: c, text: "C", feedback: "ภาพ C ลูกบอลอยู่ในกล่อง (in) อย่าดูแค่คำว่า in ต้องอ่านทั้งวลี in front of" }
      - { id: d, text: "D", correct: true, feedback: "ถูก ลูกบอลอยู่ข้างหน้ากล่อง และบังกล่องไว้บางส่วน" }
    hints:
      - "in front of เป็นวลีสามคำ แปลว่าอะไร"
      - "ของที่อยู่ข้างหน้าจะบังของที่อยู่ข้างหลัง"
    solution: "*in front of* = ข้างหน้า ภาพที่ตรงคือ **D**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.prepositions.p008
    topics: [english.grammar.prepositions]
    difficulty: 3
    type: text
    stem: "ดูแผนที่ เริ่มที่ You are here แล้วทำตาม: *Go straight. Turn right at the crossroads. It's on your left.* — ถึงที่ไหน (ตอบเป็นภาษาอังกฤษตามชื่อในแผนที่)"
    figure: { src: street-map.svg, alt: "แผนที่ถนนสองสายตัดกันเป็นสี่แยก ถนน Park Street วิ่งจากล่างขึ้นบน ถนน River Road วิ่งซ้ายไปขวา จุด You are here อยู่ล่างสุดของ Park Street หันหน้าขึ้นด้านบน ระหว่างทางก่อนถึงสี่แยก ฝั่งซ้ายของ Park Street มี Shop (ใกล้จุดเริ่ม) แล้วจึงเป็น School ฝั่งขวามี Bank อยู่ตรงข้าม School ด้านล่างของ River Road ทางซ้ายของ School มี Market อยู่ติดกัน ทางขวาของ Bank มี Post office อยู่ติดกัน ด้านบนของ River Road ฝั่งซ้ายมี Temple ฝั่งขวามี Hospital สุดถนน Park Street ด้านบนคือ Park" }
    accepted: ["hospital", "the hospital", "Hospital.", "the hospital.", "It's the hospital.", "It is the hospital.", "It's the hospital", "It is the hospital"]
    misconceptions:
      - { match: "post office", feedback: "เลี้ยวขวาแล้ว Post office อยู่ทางขวามือ (on your right) โจทย์บอกว่าอยู่ทางซ้าย" }
      - { match: "the post office", feedback: "เลี้ยวขวาแล้ว Post office อยู่ทางขวามือ (on your right) โจทย์บอกว่าอยู่ทางซ้าย" }
      - { match: "temple", feedback: "Temple อยู่ทางที่เลี้ยวซ้าย โจทย์บอกให้เลี้ยวขวา" }
      - { match: "bank", feedback: "Bank อยู่ก่อนถึงสี่แยก ต้องเลี้ยวขวาที่สี่แยกก่อน" }
    hints:
      - "เดินตรงขึ้นไปถึงสี่แยก แล้วเลี้ยวขวา ตอนนี้หันหน้าไปทางขวาของแผนที่"
      - "เมื่อหันหน้าไปทางขวาของแผนที่ ซ้ายมือคือด้านบนของแผนที่"
    solution: "เลี้ยวขวาที่สี่แยกแล้วหันหน้าไปทางขวาของแผนที่ ซ้ายมือคือด้านบนของถนน จึงเป็น **the hospital** (Post office อยู่ขวามือ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.prepositions.p009
    topics: [english.grammar.prepositions]
    difficulty: 3
    type: text
    stem: "ดูแผนที่ Bank กับ School อยู่คนละฝั่งของ Park Street หันหน้าเข้าหากัน เติมหนึ่งคำ: *The bank is ___ the school.*"
    figure: { src: street-map.svg, alt: "แผนที่ถนนสองสายตัดกันเป็นสี่แยก ถนน Park Street วิ่งจากล่างขึ้นบน ถนน River Road วิ่งซ้ายไปขวา จุด You are here อยู่ล่างสุดของ Park Street หันหน้าขึ้นด้านบน ระหว่างทางก่อนถึงสี่แยก ฝั่งซ้ายของ Park Street มี Shop (ใกล้จุดเริ่ม) แล้วจึงเป็น School ฝั่งขวามี Bank อยู่ตรงข้าม School ด้านล่างของ River Road ทางซ้ายของ School มี Market อยู่ติดกัน ทางขวาของ Bank มี Post office อยู่ติดกัน ด้านบนของ River Road ฝั่งซ้ายมี Temple ฝั่งขวามี Hospital สุดถนน Park Street ด้านบนคือ Park" }
    accepted: ["opposite"]
    misconceptions:
      - { match: "next to", feedback: "next to คืออยู่ติดกันฝั่งเดียวกัน เช่น Market อยู่ next to School ส่วนคนละฝั่งถนนใช้ opposite" }
      - { match: "in front of", feedback: "in front of คืออยู่ข้างหน้า คนละฝั่งถนนที่หันหน้าเข้าหากันใช้ opposite" }
      - { match: "between", feedback: "between ต้องมีสองสิ่ง (between ... and ...) ที่นี่เทียบกับ school อย่างเดียว" }
    hints:
      - "อยู่คนละฝั่งถนนตรงกันพอดี"
      - "คำหนึ่งคำที่แปลว่า ตรงข้าม"
    solution: "*The bank is **opposite** the school.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.prepositions.p010
    topics: [english.grammar.prepositions]
    difficulty: 3
    type: order
    stem: "เรียงคำเป็นประโยค \"โรงเรียนของฉันอยู่ติดกับตลาด\""
    items: ["My school", "is", "next", "to", "the market."]
    hints:
      - "ประธาน + is + บุพบท + สถานที่"
      - "next ต้องตามด้วย to"
    solution: "*My school is next to the market.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.prepositions.p011
    topics: [english.grammar.prepositions]
    difficulty: 3
    type: mcq
    stem: "เลือกบุพบทที่ถูก: *I can see the stars ___ night.*"
    choices:
      - { id: a, text: "at", correct: true, feedback: "ถูก night ใช้ at เป็นคำยกเว้น (at night)" }
      - { id: b, text: "in", feedback: "ช่วงของวันส่วนใหญ่ใช้ in เช่น in the morning แต่กลางคืนใช้ at night" }
      - { id: c, text: "on", feedback: "on ใช้กับวัน เช่น on Friday night แต่ถ้าไม่มีวันใช้ at night" }
      - { id: d, text: "under", feedback: "under บอกตำแหน่ง ไม่ได้บอกเวลา" }
    hints:
      - "in the morning, in the afternoon, in the evening ... แล้ว night ล่ะ"
      - "night เป็นคำยกเว้น"
    solution: "*I can see the stars **at** night.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.prepositions.p012
    topics: [english.grammar.prepositions]
    difficulty: 3
    type: text
    stem: "เติมบุพบท: *Loy Krathong is usually ___ November.*"
    accepted: ["in"]
    misconceptions:
      - { match: "on", feedback: "on ใช้กับวันหรือวันที่ ถ้าบอกแค่เดือนใช้ in" }
      - { match: "at", feedback: "at ใช้กับเวลาบนนาฬิกา เดือนใช้ in" }
    hints:
      - "November เป็นเดือน"
      - "เดือนใช้บุพบทเดียวกับปีและฤดู"
    solution: "*Loy Krathong is usually **in** November.* (วันลอยกระทงคือวันเพ็ญเดือนสิบสองตามจันทรคติ ส่วนใหญ่ตรงกับเดือนพฤศจิกายน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.prepositions.p013
    topics: [english.grammar.prepositions]
    difficulty: 4
    type: text
    stem: "เติมบุพบท: *The children play football ___ Saturday afternoon.*"
    accepted: ["on"]
    misconceptions:
      - { match: "in", feedback: "in the afternoon ใช้ in ก็จริง แต่เมื่อมีวัน (Saturday) อยู่ด้วยต้องใช้ on" }
      - { match: "at", feedback: "at ใช้กับเวลาบนนาฬิกา ที่นี่มีวันจึงใช้ on" }
    hints:
      - "มีทั้งวัน (Saturday) และช่วงของวัน (afternoon)"
      - "ถ้ามีวันอยู่ด้วย ให้ใช้บุพบทของวัน"
    solution: "*The children play football **on** Saturday afternoon.* (เทียบ *in the afternoon*)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.prepositions.p014
    topics: [english.grammar.prepositions]
    difficulty: 4
    type: mcq
    stem: "เลือกคำที่ถูก: *We have a test ___ next Friday.*"
    choices:
      - { id: a, text: "ไม่ต้องใส่บุพบท", correct: true, feedback: "ถูก หน้า next, this, every ไม่ใส่บุพบท: We have a test next Friday." }
      - { id: b, text: "on", feedback: "Friday ใช้ on ก็จริง แต่เมื่อมี next อยู่ข้างหน้าไม่ต้องใส่บุพบท" }
      - { id: c, text: "in", feedback: "in ใช้กับเดือนและปี และหน้า next ไม่ใส่บุพบท" }
      - { id: d, text: "at", feedback: "at ใช้กับเวลาบนนาฬิกา และหน้า next ไม่ใส่บุพบท" }
    hints:
      - "สังเกตคำว่า next หน้าวัน"
      - "หน้า next, this, every, today, tomorrow ใส่บุพบทหรือไม่"
    solution: "*We have a test **next Friday**.* ไม่ใส่ on เพราะมี next"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.prepositions.p015
    topics: [english.grammar.prepositions]
    difficulty: 4
    type: text
    stem: "ดูแผนที่ เริ่มที่ You are here: *Go straight and turn left at the crossroads. The temple is on your ___.* (left หรือ right)"
    figure: { src: street-map.svg, alt: "แผนที่ถนนสองสายตัดกันเป็นสี่แยก ถนน Park Street วิ่งจากล่างขึ้นบน ถนน River Road วิ่งซ้ายไปขวา จุด You are here อยู่ล่างสุดของ Park Street หันหน้าขึ้นด้านบน ระหว่างทางก่อนถึงสี่แยก ฝั่งซ้ายของ Park Street มี Shop (ใกล้จุดเริ่ม) แล้วจึงเป็น School ฝั่งขวามี Bank อยู่ตรงข้าม School ด้านล่างของ River Road ทางซ้ายของ School มี Market อยู่ติดกัน ทางขวาของ Bank มี Post office อยู่ติดกัน ด้านบนของ River Road ฝั่งซ้ายมี Temple ฝั่งขวามี Hospital สุดถนน Park Street ด้านบนคือ Park" }
    accepted: ["right", "right."]
    misconceptions:
      - { match: "left", feedback: "Temple อยู่ซ้ายของแผนที่ แต่หลังเลี้ยวซ้ายเราหันหน้าไปทางซ้ายของแผนที่ ด้านบนของถนนจึงเป็นขวามือ" }
    hints:
      - "หลังเลี้ยวซ้าย เราหันหน้าไปทางไหนของแผนที่"
      - "หันหน้าไปทางซ้ายของแผนที่ ขวามือของเราคือด้านบนหรือด้านล่างของแผนที่"
    solution: "หลังเลี้ยวซ้ายเราหันหน้าไปทางซ้ายของแผนที่ ขวามือคือด้านบน วัดอยู่ด้านบนของถนน: *The temple is on your **right**.* (Market อยู่ซ้ายมือ)"
