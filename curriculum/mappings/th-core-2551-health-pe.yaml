    coverage: full
    note: สอนครบหลังเติมเนื้อหาเฟส 7
  - topic: health.safety.first-aid
    indicators: ["พ 5.1 ป.1/3", "พ 5.1 ป.3/3", "พ 5.1 ม.1/1", "พ 5.1 ม.3/5", "พ 5.1 ม.4-6/7"]
    coverage: partial
    note: "สอนครบ: ป.3/2 (แหล่งขอความช่วยเหลือ 1669 191 199 และข้อมูลที่ต้องบอก มีตัวอย่างแสดงวิธีทำและโจทย์สถานการณ์) บางส่วน: ป.1/3 ป.3/3 ม.1/1 สอนการขอความช่วยเหลือ ห้ามเลือด แผลไหม้ ท่าพักฟื้น ยังไม่มีการเคลื่อนย้ายผู้ป่วยและการบาดเจ็บจากการเล่นแบบอื่น; ม.3/5 ม.4-6/7 สอนหลักการกดหน้าอกด้วยมือเปล่า AED และการช่วยคนสำลักตามแนวทาง AHA 2025 แต่ยังไม่มีการช่วยหายใจและ CPR เด็กและทารกแบบเต็ม และการแสดงวิธีต้องฝึกกับหุ่นและครูฝึก"
  - topic: health.body.external-organs
    indicators: [พ 1.1 ป.1/1, พ 1.1 ป.1/2]
