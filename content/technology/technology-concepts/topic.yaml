id: technology.design.technology-concepts
subject: technology
title:
  th: แนวคิดหลักของเทคโนโลยี
  en: Core concepts of technology
summary: ระบบทางเทคโนโลยี (ตัวป้อน กระบวนการ ผลผลิต ข้อมูลย้อนกลับ) ปัจจัยที่ทำให้เทคโนโลยีเปลี่ยน การคาดการณ์แนวโน้ม ความสัมพันธ์กับวิทยาศาสตร์และคณิตศาสตร์ และผลกระทบ
difficulty: 3
minutes: 30
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: ระบบทางเทคโนโลยีของหม้อหุงข้าว
  src: system.svg
  alt: 'แผนภาพระบบหม้อหุงข้าวไฟฟ้า ตัวป้อน (ข้าวสาร น้ำ พลังงานไฟฟ้า กดปุ่มหุง) → กระบวนการ (แผ่นความร้อนต้มน้ำจนข้าวสุก) → ผลผลิต (ข้าวสุก และความร้อนที่สูญเสียไป) จากผลผลิตมีลูกศรวนกลับผ่านกล่องข้อมูลย้อนกลับ (น้ำแห้ง ก้นหม้อร้อนเกิน 100 °C) ไปที่กระบวนการ ตัวตัดความร้อนเปลี่ยนเป็นโหมดอุ่น ด้านล่างเขียนทรัพยากรที่ระบบใช้: คน ข้อมูล วัสดุ เครื่องมือ พลังงาน ทุน เวลา'
- type: worked-example
  title: วิเคราะห์ระบบของตู้เย็น
  problem: ตู้เย็นทำความเย็นได้อย่างไรในมุมมองของระบบทางเทคโนโลยี ระบุตัวป้อน กระบวนการ ผลผลิต และข้อมูลย้อนกลับ
  steps:
  - text: 'ตัวป้อน: พลังงานไฟฟ้า อาหารที่ใส่ และอุณหภูมิที่ผู้ใช้ตั้งไว้'
  - text: 'กระบวนการ: คอมเพรสเซอร์อัดสารทำความเย็นให้พาความร้อนจากในตู้ออกไปทิ้งด้านหลังตู้'
  - text: 'ผลผลิต: ภายในตู้เย็นลง (ผลผลิตที่ไม่ต้องการคือความร้อนด้านหลังตู้และเสียง)'
    why: ระบบมักมีผลผลิตที่ไม่ได้ตั้งใจด้วย
  - text: 'ข้อมูลย้อนกลับ: เทอร์โมสตัทวัดอุณหภูมิในตู้ ถ้าเย็นพอก็สั่งคอมเพรสเซอร์หยุด ถ้าอุ่นขึ้นก็สั่งทำงานใหม่'
    why: ข้อมูลย้อนกลับทำให้ระบบรักษาอุณหภูมิได้เองโดยไม่ต้องมีคนคอยปรับ
  answer: ตัวป้อนคือไฟฟ้าและค่าที่ตั้ง กระบวนการคือคอมเพรสเซอร์ ผลผลิตคือความเย็น ข้อมูลย้อนกลับคือเทอร์โมสตัท
- type: check
  problem: technology.design.technology-concepts.p005
  prompt: ลองตอบก่อนอ่านต่อ
- type: figure
  title: การเปลี่ยนแปลงของเทคโนโลยีทำนา
  src: farming.svg
  alt: 'เส้นเวลาเทคโนโลยีเตรียมดินและดูแลนาข้าว ควายลากคันไถ (แรงงานคนและสัตว์) → รถไถเดินตาม ควายเหล็ก เครื่องยนต์เล็ก → รถแทรกเตอร์ กำลังมาก ไถได้เร็ว → โดรนและดาวเทียม พ่นปุ๋ยแม่นยำ แผนที่แปลง กล่องด้านล่างบอกปัจจัยที่ทำให้เปลี่ยน: ต้องการทำงานเร็วขึ้นและเหนื่อยน้อยลง ความรู้ด้านเครื่องยนต์และอิเล็กทรอนิกส์ แรงงานในภาคเกษตรลดลง ค่าแรงสูงขึ้น ราคาเครื่องมือถูกลง ต้องการลดการใช้ปุ๋ยและสารเคมี'
- type: worked-example
  title: วิเคราะห์ปัจจัยและคาดการณ์แนวโน้ม
  problem: การชำระเงินในไทยเปลี่ยนจากเงินสดมาเป็นการสแกนคิวอาร์โค้ดผ่านมือถืออย่างรวดเร็ว วิเคราะห์ปัจจัยและคาดการณ์แนวโน้มต่อไป
  steps:
  - text: 'ความต้องการ: จ่ายเงินสะดวก ไม่ต้องทอนเงิน ปลอดภัยกว่าพกเงินสด'
  - text: 'ความรู้และเทคโนโลยี: สมาร์ตโฟนมีกล้องและอินเทอร์เน็ต ระบบโอนเงินด้วยหมายเลขโทรศัพท์หรือเลขประจำตัวประชาชน'
  - text: 'เศรษฐกิจและนโยบาย: ค่าธรรมเนียมต่ำ ภาครัฐสนับสนุนการชำระเงินดิจิทัล'
  - text: 'คาดการณ์: น่าจะมีการจ่ายเงินแบบไม่ต้องหยิบมือถือ เช่น ผ่านนาฬิกาหรือการสแกนใบหน้ามากขึ้น พร้อมความเสี่ยงเรื่องมิจฉาชีพและข้อมูลส่วนตัวที่ต้องป้องกัน'
    why: การคาดการณ์ที่ดีบอกทั้งแนวโน้มและผลกระทบที่ต้องเตรียมรับ
  answer: เปลี่ยนเพราะความต้องการ ความพร้อมของสมาร์ตโฟน และเศรษฐกิจ แนวโน้มคือสะดวกขึ้นแต่ต้องระวังความปลอดภัยของข้อมูล
- type: check
  problem: technology.design.technology-concepts.p007
glossary:
- term: เทคโนโลยี
  definition: การนำความรู้ ทักษะ และทรัพยากรมาสร้างหรือปรับปรุงสิ่งของหรือวิธีการ เพื่อแก้ปัญหาหรือสนองความต้องการ
- term: ระบบทางเทคโนโลยี
  definition: กลุ่มของส่วนประกอบที่ทำงานร่วมกัน มีตัวป้อน กระบวนการ ผลผลิต และข้อมูลย้อนกลับ
- term: ข้อมูลย้อนกลับ
  definition: ข้อมูลจากผลผลิตที่ส่งกลับไปควบคุมหรือปรับการทำงานของระบบ
- term: ทรัพยากรทางเทคโนโลยี
  definition: คน ข้อมูล วัสดุ เครื่องมือ พลังงาน ทุน และเวลา ที่ระบบต้องใช้
flashcards:
- front: องค์ประกอบของระบบทางเทคโนโลยี
  back: ตัวป้อน → กระบวนการ → ผลผลิต และข้อมูลย้อนกลับ
- front: ปัจจัยที่ทำให้เทคโนโลยีเปลี่ยน
  back: ความต้องการ ความรู้ใหม่ เศรษฐกิจ สังคมวัฒนธรรม สิ่งแวดล้อม นโยบาย
- front: ผลกระทบของเทคโนโลยี 4 ด้าน
  back: ชีวิต สังคม เศรษฐกิจ สิ่งแวดล้อม (ทั้งบวกและลบ)
- front: ค่าไฟฟ้า
  back: กำลัง (kW) × ชั่วโมง = หน่วย (kWh) แล้วคูณราคาต่อหน่วย
