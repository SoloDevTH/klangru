<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="sans-serif">
<title>ข่าวสมมุติ New Bike Path Opens Along Nan River</title>
<rect x="0" y="0" width="680" height="400" fill="#fff"/>
<rect x="10.0" y="10.0" width="660.0" height="380.0" rx="4" fill="#fbfaf5" stroke="#444" stroke-width="2"/>
<text x="34.0" y="46.0" font-size="22" text-anchor="start" fill="#222" font-weight="bold">NAN DAILY NEWS</text>
<text x="646.0" y="46.0" font-size="14" text-anchor="end" fill="#555" font-weight="normal">12 October 2026 · ข่าวสมมุติ</text>
<line x1="30.0" y1="60.0" x2="650.0" y2="60.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="34.0" y="96.0" font-size="24" text-anchor="start" fill="#1d3f75" font-weight="bold">New Bike Path Opens Along Nan River</text>
<text x="34.0" y="136.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">A 6-kilometre bike path has opened along the Nan River in the city</text>
<text x="34.0" y="159.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">centre. The mayor opened the path on Saturday morning, and more than</text>
<text x="34.0" y="182.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">300 people cycled on it on the first day.</text>
<text x="34.0" y="219.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">The path took eight months to build and cost 18 million baht. It has</text>
<text x="34.0" y="242.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">lights, benches and two rest stops.</text>
<text x="34.0" y="279.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">“I used to ride on the busy road, so I was scared of the cars. Now I</text>
<text x="34.0" y="302.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">feel much safer,” said Mali, a 15-year-old student.</text>
<text x="34.0" y="339.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">However, some shop owners on River Road are unhappy because the</text>
<text x="34.0" y="362.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">path has taken away 40 parking spaces.</text>
</svg>
