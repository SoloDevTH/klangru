problems:
  - id: biology.evolution.evolution.p001
    topics: [biology.evolution.evolution]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของโครงสร้างกำเนิดเดียวกัน"
    choices:
      - { id: a, text: "แขนของคนกับปีกของค้างคาว", correct: true }
      - { id: b, text: "ปีกของนกกับปีกของผีเสื้อ", feedback: "ปีกนกมีกระดูก ปีกผีเสื้อไม่มี ใช้บินเหมือนกันแต่กำเนิดต่างกัน จึงเป็นโครงสร้างทำหน้าที่เหมือนกัน" }
      - { id: c, text: "ครีบของปลากับครีบของปลาหมึก", feedback: "ครีบสองแบบนี้มีโครงสร้างและกำเนิดต่างกัน" }
      - { id: d, text: "ตาของคนกับตาของแมลง", feedback: "ตาของแมลงเป็นตาประกอบ มีโครงสร้างต่างจากตาของคนมาก" }
    hints:
      - "โครงสร้างกำเนิดเดียวกันมีกระดูกชุดเดียวกัน แม้ใช้งานต่างกัน"
      - "ดูภาพขาหน้าของสัตว์เลี้ยงลูกด้วยน้ำนมในบทเรียน"
    solution: "แขนคนและปีกค้างคาวมีกระดูกต้นแขน แขนท่อนล่าง ข้อมือ และนิ้วชุดเดียวกัน จึงเป็นโครงสร้างกำเนิดเดียวกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.evolution.evolution.p002
    topics: [biology.evolution.evolution]
    difficulty: 1
    type: match
    stem: "จับคู่หลักฐานของวิวัฒนาการกับตัวอย่าง"
    pairs:
      - { left: "ซากดึกดำบรรพ์", right: "อาร์คีออปเทอริกซ์มีทั้งขนนกและฟัน" }
      - { left: "กายวิภาคเปรียบเทียบ", right: "วาฬมีกระดูกเชิงกรานขนาดเล็กที่ไม่ได้ใช้เดิน" }
      - { left: "คัพภะวิทยาเปรียบเทียบ", right: "เอ็มบริโอของปลา ไก่ และคนระยะแรกมีช่องเหงือกและหาง" }
      - { left: "ชีววิทยาโมเลกุล", right: "ลำดับกรดอะมิโนของไซโทโครมซีในคนกับชิมแปนซีเกือบเหมือนกัน" }
    hints:
      - "คัพภะวิทยาเกี่ยวกับเอ็มบริโอ"
      - "ชีววิทยาโมเลกุลเทียบ DNA หรือโปรตีน"
    solution: "อาร์คีออปเทอริกซ์เป็นซากดึกดำบรรพ์รูปแบบกึ่งกลาง เชิงกรานของวาฬเป็นโครงสร้างลดรูป ช่องเหงือกในเอ็มบริโอเป็นหลักฐานคัพภะวิทยา และไซโทโครมซีเป็นหลักฐานระดับโมเลกุล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.evolution.evolution.p003
    topics: [biology.evolution.evolution]
    difficulty: 1
    type: text
    stem: "นักวิทยาศาสตร์ชาวอังกฤษผู้เสนอทฤษฎีวิวัฒนาการด้วยการคัดเลือกโดยธรรมชาติ ร่วมกับอัลเฟรด วอลเลซ คือใคร (ตอบชื่อสกุล)"
    accepted: ["ดาร์วิน", "ชาลส์ ดาร์วิน", "ชาร์ลส์ ดาร์วิน", "Darwin", "Charles Darwin"]
    misconceptions:
      - { match: "ลามาร์ก", feedback: "ลามาร์กเสนอกฎการใช้และไม่ใช้ ไม่ใช่การคัดเลือกโดยธรรมชาติ" }
      - { match: "เมนเดล", feedback: "เมนเดลศึกษาการถ่ายทอดลักษณะในถั่วลันเตา" }
    hints:
      - "เขาเดินทางไปกับเรือบีเกิลและศึกษาหมู่เกาะกาลาปากอส"
      - "หนังสือ On the Origin of Species ตีพิมพ์ ค.ศ. 1859"
    solution: "ชาลส์ ดาร์วิน เสนอร่วมกับวอลเลซใน ค.ศ. 1858 และตีพิมพ์หนังสือกำเนิดสปีชีส์ใน ค.ศ. 1859"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.evolution.evolution.p004
    topics: [biology.evolution.evolution]
    difficulty: 2
    type: mcq
    stem: "ข้อใดอธิบายการที่ยีราฟคอยาวตามแนวคิดของดาร์วิน"
    choices:
      - { id: a, text: "ยีราฟในอดีตมีคอยาวไม่เท่ากัน ตัวที่คอยาวกว่ากินอาหารได้มากกว่า รอดและมีลูกมากกว่า ลักษณะคอยาวจึงพบมากขึ้นในรุ่นต่อมา", correct: true }
      - { id: b, text: "ยีราฟยืดคอเพื่อกินใบไม้สูงจนคอยาวขึ้น แล้วถ่ายทอดคอยาวให้ลูก", feedback: "เป็นแนวคิดของลามาร์ก ลักษณะที่ได้มาระหว่างชีวิตไม่ถ่ายทอดสู่ลูก" }
      - { id: c, text: "ยีราฟต้องการคอยาว จึงเกิดมิวเทชันให้คอยาวขึ้น", feedback: "มิวเทชันเกิดแบบสุ่ม ไม่ได้เกิดเพราะความต้องการของสิ่งมีชีวิต" }
      - { id: d, text: "ยีราฟแต่ละตัวค่อย ๆ คอยาวขึ้นตลอดชีวิตจนกลายเป็นสปีชีส์ใหม่", feedback: "สิ่งมีชีวิตแต่ละตัวไม่วิวัฒนาการ ประชากรต่างหากที่วิวัฒนาการ" }
    hints:
      - "ดาร์วินเริ่มจากความแปรผันที่มีอยู่ในประชากร"
      - "ลักษณะใดถูกคัดเลือกและถ่ายทอดผ่านการสืบพันธุ์"
    solution: "ตามดาร์วิน ความแปรผันของความยาวคอมีอยู่แล้ว ตัวที่คอยาวกว่าได้เปรียบ รอดและสืบพันธุ์ได้มากกว่า ความถี่ของลักษณะคอยาวในประชากรจึงเพิ่มขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.evolution.evolution.p005
    topics: [biology.evolution.evolution]
    difficulty: 2
    type: numeric
    stem: "ประชากรหนึ่งอยู่ในสมดุลฮาร์ดี-ไวน์เบิร์ก มีผู้แสดงลักษณะด้อย (aa) ร้อยละ 16 ประชากรนี้มีผู้เป็นพาหะ (Aa) ร้อยละเท่าใด"
    answer: { value: 48, unit: "%" }
    misconceptions:
      - { match: 84, feedback: "84% คือผู้ที่ไม่แสดงลักษณะด้อยทั้งหมด (AA รวม Aa)" }
      - { match: 24, feedback: "ลืมคูณ 2 ใน 2pq" }
      - { match: 26.88, feedback: "ใช้ q = 0.16 โดยไม่ถอดรากที่สอง ร้อยละ 16 คือ q²" }
    hints:
      - "q² = 0.16 จึงได้ q = ?"
      - "p = 1 − q และพาหะมีความถี่ 2pq"
    solution: "$q = \\sqrt{0.16} = 0.4$ $p = 0.6$ พาหะ $2pq = 2(0.6)(0.4) = 0.48$ หรือร้อยละ 48"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.evolution.evolution.p006
    topics: [biology.evolution.evolution]
    difficulty: 2
    type: order
    stem: "จากภาพชั้นหินตะกอนที่ไม่ถูกรบกวน เรียงซากดึกดำบรรพ์จากเก่าที่สุดไปใหม่ที่สุด"
    figure: { src: strata-fossils.svg, alt: "ชั้นหินตะกอน 4 ชั้นวางตามแนวราบ ชั้นบนสุดมีซากฟันระบุว่าซาก ข ชั้นที่สองจากบนมีซากใบไม้ระบุว่าซาก ง ชั้นที่สามจากบนมีซากปลาระบุว่าซาก ก ชั้นล่างสุดมีซากเปลือกหอยระบุว่าซาก ค ข้อความใต้ภาพบอกว่าชั้นหินวางตัวตามแนวราบ ไม่ถูกพลิกกลับหรือรบกวน" }
    items:
      - "ซาก ค"
      - "ซาก ก"
      - "ซาก ง"
      - "ซาก ข"
    hints:
      - "ชั้นหินตะกอนทับถมจากล่างขึ้นบน"
      - "ชั้นล่างสุดเกิดก่อน จึงเก่าที่สุด"
    solution: "ชั้นล่างเกิดก่อนชั้นบน จึงเรียงจากเก่าไปใหม่เป็น ค (ล่างสุด) → ก → ง → ข (บนสุด)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.evolution.evolution.p007
    topics: [biology.evolution.evolution]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นโครงสร้างที่ลดรูปในร่างกายคน"
    choices:
      - { id: a, text: "กระดูกก้นกบ", correct: true }
      - { id: b, text: "กระดูกต้นแขน", feedback: "กระดูกต้นแขนยังใช้งานเต็มที่" }
      - { id: c, text: "หัวใจ", feedback: "หัวใจทำงานเต็มที่ ไม่ได้ลดรูป" }
      - { id: d, text: "ปอด", feedback: "ปอดเป็นอวัยวะแลกเปลี่ยนแก๊สที่จำเป็น" }
    hints:
      - "โครงสร้างลดรูปมีขนาดเล็กลงและทำหน้าที่เดิมน้อยลงหรือไม่ได้ทำ"
      - "โครงสร้างนี้เหลือจากหางของบรรพบุรุษ"
    solution: "กระดูกก้นกบเป็นกระดูกสันหลังส่วนท้ายที่เชื่อมกัน เทียบได้กับหางของสัตว์มีกระดูกสันหลังอื่น จึงเป็นหลักฐานว่ามีบรรพบุรุษร่วมกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.evolution.evolution.p008
    topics: [biology.evolution.evolution]
    difficulty: 3
    type: numeric
    stem: "ประชากรหนูนา 1,000 ตัว มีจีโนไทป์ AA 490 ตัว Aa 420 ตัว และ aa 90 ตัว ความถี่ของแอลลีล a เท่าใด (ตอบเป็นทศนิยม)"
    answer: { value: 0.3, tolerance: 0.005 }
    misconceptions:
      - { match: 0.09, feedback: "0.09 คือความถี่ของจีโนไทป์ aa ไม่ใช่ความถี่ของแอลลีล a" }
      - { match: 0.6, feedback: "นับแอลลีล a ได้ 600 ถูกแล้ว แต่ต้องหารด้วยจำนวนแอลลีลทั้งหมด 2,000 ไม่ใช่จำนวนหนู 1,000" }
      - { match: 0.7, feedback: "0.7 คือความถี่ของแอลลีล A" }
    hints:
      - "หนูแต่ละตัวมี 2 แอลลีล ประชากรจึงมี 2,000 แอลลีล"
      - "แอลลีล a มาจาก aa ตัวละ 2 และ Aa ตัวละ 1"
    solution: "แอลลีล a $= 2(90) + 420 = 600$ จาก $2{,}000$ แอลลีล $q = \\tfrac{600}{2{,}000} = 0.3$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.evolution.evolution.p009
    topics: [biology.evolution.evolution]
    difficulty: 3
    type: mcq
    stem: "ประชากรพืชหนึ่ง 1,000 ต้น มี AA 500 Aa 200 aa 300 ต้น ซึ่งไม่อยู่ในสมดุลฮาร์ดี-ไวน์เบิร์ก (ถ้าอยู่ในสมดุลจะมี Aa ราว 480 ต้น) ปัจจัยใดอธิบายการมีเฮเทอโรไซกัสน้อยกว่าคาดได้ดีที่สุด"
    choices:
      - { id: a, text: "พืชผสมตัวเองหรือผสมกับต้นใกล้ชิดกันมาก ซึ่งเป็นการผสมพันธุ์แบบไม่สุ่ม", correct: true }
      - { id: b, text: "ประชากรมีขนาดใหญ่มาก", feedback: "ประชากรขนาดใหญ่เป็นเงื่อนไขของสมดุล ไม่ได้ทำให้เฮเทอโรไซกัสลดลง" }
      - { id: c, text: "มีการผสมพันธุ์แบบสุ่มอย่างสมบูรณ์", feedback: "การผสมแบบสุ่มให้สัดส่วนตามสมดุล" }
      - { id: d, text: "ความถี่แอลลีลรวม p + q มากกว่า 1", feedback: "p + q ต้องเท่ากับ 1 เสมอ ในที่นี้ p = 0.6 q = 0.4" }
    hints:
      - "การผสมตัวเองทำให้ลูกเป็นฮอมอไซกัสมากขึ้นทุกรุ่น"
      - "เงื่อนไขใดของสมดุลที่ถูกละเมิด"
    solution: "p = 0.6 q = 0.4 ถ้าสมดุลจะมี Aa 480 ต้น แต่มีเพียง 200 ต้น การผสมตัวเองหรือผสมในกลุ่มใกล้ชิดเพิ่มฮอมอไซกัสและลดเฮเทอโรไซกัส แม้ความถี่แอลลีลไม่เปลี่ยน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.evolution.evolution.p010
    topics: [biology.evolution.evolution]
    difficulty: 3
    type: match
    stem: "จับคู่เหตุการณ์กับปัจจัยที่ทำให้ความถี่ของแอลลีลเปลี่ยน"
    pairs:
      - { left: "น้ำท่วมใหญ่ทำให้ประชากรกบเหลือ 20 ตัวโดยบังเอิญ", right: "การเปลี่ยนแปลงแบบสุ่มทางพันธุกรรม (คอขวด)" }
      - { left: "นกจากเกาะอื่นบินมาผสมพันธุ์กับนกในเกาะนี้", right: "การถ่ายเทยีน" }
      - { left: "แบคทีเรียที่ทนยาปฏิชีวนะรอดชีวิตมากกว่า", right: "การคัดเลือกโดยธรรมชาติ" }
      - { left: "รังสีทำให้เกิดแอลลีลใหม่ในประชากร", right: "มิวเทชัน" }
      - { left: "นกตัวเมียเลือกผสมกับตัวผู้ที่หางยาวเท่านั้น", right: "การผสมพันธุ์แบบไม่สุ่ม" }
    hints:
      - "การเปลี่ยนแปลงโดยบังเอิญในประชากรเล็กต่างจากการคัดเลือก"
      - "การอพยพนำแอลลีลเข้าหรือออกจากประชากร"
    solution: "ภัยพิบัติที่เหลือสมาชิกน้อยโดยบังเอิญคือคอขวด การอพยพเป็นการถ่ายเทยีน การรอดของตัวดื้อยาเป็นการคัดเลือกโดยธรรมชาติ แอลลีลใหม่จากรังสีคือมิวเทชัน และการเลือกคู่เป็นการผสมพันธุ์แบบไม่สุ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.evolution.evolution.p011
    topics: [biology.evolution.evolution]
    difficulty: 3
    type: mcq
    stem: "(สถานการณ์สมมติ) ปูน้ำตกชนิดหนึ่งเคยอาศัยตลอดลำธารบนเทือกเขา ต่อมาดินถล่มทำให้ลำธารแยกเป็นสองสายบนภูเขาคนละลูก หลังผ่านไปหลายพันรุ่น ปูสองกลุ่มผสมพันธุ์กันไม่ได้แล้ว นี่คือการเกิดสปีชีส์ใหม่แบบใด"
    choices:
      - { id: a, text: "แบบแยกกันทางภูมิศาสตร์ เพราะสิ่งกีดขวางทางภูมิศาสตร์แยกประชากรก่อน", correct: true }
      - { id: b, text: "แบบไม่แยกกันทางภูมิศาสตร์", feedback: "ประชากรถูกภูเขาแยกจากกัน จึงเป็นแบบแยกกันทางภูมิศาสตร์" }
      - { id: c, text: "การถ่ายเทยีน", feedback: "ภูเขากั้นไว้ การถ่ายเทยีนระหว่างสองกลุ่มจึงหยุดลง" }
      - { id: d, text: "ไม่ใช่สปีชีส์ใหม่ เพราะยังเป็นปูเหมือนกัน", feedback: "เมื่อผสมพันธุ์กันไม่ได้ ถือว่าเป็นคนละสปีชีส์แล้ว" }
    hints:
      - "อะไรทำให้สองกลุ่มหยุดผสมพันธุ์กันในตอนแรก"
      - "สปีชีส์ใหม่เกิดเมื่อมีการแยกทางการสืบพันธุ์"
