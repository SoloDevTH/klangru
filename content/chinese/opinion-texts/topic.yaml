id: chinese.reading.opinion-texts
subject: chinese
title:
  th: การอ่านข้อความแสดงความคิดเห็นภาษาจีน (ระดับ HSK 5)
  en: Reading Chinese opinion texts (HSK level 5)
summary: อ่านข้อความแสดงความคิดเห็นไม่เกิน 700 ตัวอักษร ระบุความคิดหลัก เหตุผลและตัวอย่าง แยกข้อเท็จจริงกับความเห็น และหาข้อสรุปที่ผู้เขียนต้องการ
difficulty: 6.5
minutes: 40
prerequisites:
- chinese.reading.longer-passages
encompasses:
- id: chinese.reading.longer-passages
  weight: 0.4
- id: chinese.grammar.complex-connectives
  weight: 0.3
