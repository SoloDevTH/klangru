problems:
- id: business.econ.cooperatives.p001
  topics:
  - business.econ.cooperatives
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็น **หลักการสหกรณ์**
  choices:
  - id: a
    text: สมาชิกหนึ่งคนมีหนึ่งเสียงในการลงมติ ไม่ว่าจะถือหุ้นมากหรือน้อย
    correct: true
  - id: b
    text: ผู้ถือหุ้นมากที่สุดเป็นผู้ตัดสินใจแทนสมาชิกทั้งหมด
    feedback: นี่คือลักษณะของบริษัท ที่ออกเสียงตามจำนวนหุ้น
  - id: c
    text: สหกรณ์ต้องทำตามคำสั่งของหน่วยงานรัฐทุกเรื่อง
    feedback: หลักการที่ 4 คือการปกครองตนเองและความเป็นอิสระ รัฐส่งเสริมและกำกับตามกฎหมายแต่ไม่ได้บริหารแทน
  - id: d
    text: รับเฉพาะคนที่มีฐานะดีเป็นสมาชิก
    feedback: หลักการที่ 1 คือเปิดกว้าง ไม่กีดกันเรื่องฐานะ เพศ ศาสนา หรือการเมือง
  hints:
  - สหกรณ์เป็นองค์การประชาธิปไตยของสมาชิก
  - บริษัทออกเสียงตามหุ้น แต่สหกรณ์ออกเสียงตามคน
  solution: สหกรณ์ควบคุมโดยสมาชิกตามหลักประชาธิปไตย สมาชิก **1 คน 1 เสียง** ไม่ขึ้นกับจำนวนหุ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.cooperatives.p002
  topics:
  - business.econ.cooperatives
  difficulty: 1
  type: match
  stem: จับคู่ความต้องการของกลุ่มคนกับประเภทสหกรณ์ที่เหมาะสม
  pairs:
  - left: ชาวนาอยากซื้อปุ๋ยราคาถูกและรวมข้าวเปลือกไปขาย
    right: สหกรณ์การเกษตร
  - left: ชาวประมงพื้นบ้านอยากได้น้ำมันและอุปกรณ์จับปลาราคาถูก
    right: สหกรณ์ประมง
  - left: ครูและบุคลากรในโรงเรียนอยากออมเงินและกู้ดอกเบี้ยไม่สูง
    right: สหกรณ์ออมทรัพย์
  - left: คนในชุมชนอยากมีร้านขายของใช้ราคายุติธรรมที่ตนเป็นเจ้าของ
    right: สหกรณ์ร้านค้า
  - left: คนขับรถรับจ้างอยากรวมกันจัดหาบริการและอะไหล่
    right: สหกรณ์บริการ
  hints:
  - ดูว่ากลุ่มคนประกอบอาชีพอะไร หรือต้องการบริการแบบไหน
  - สหกรณ์ออมทรัพย์มักตั้งในหมู่คนทำงานที่เดียวกัน
  solution: ชาวนา → สหกรณ์การเกษตร · ชาวประมง → สหกรณ์ประมง · ครูออมและกู้ → สหกรณ์ออมทรัพย์ · ร้านของใช้ของชุมชน → สหกรณ์ร้านค้า · รถรับจ้าง → สหกรณ์บริการ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.cooperatives.p003
  topics:
  - business.econ.cooperatives
  difficulty: 2
  type: mcq
  stem: ใครเป็น **เจ้าของ** และเป็นผู้ควบคุมสหกรณ์
  choices:
  - id: a
    text: สมาชิกทุกคน ผ่านที่ประชุมใหญ่
    correct: true
  - id: b
    text: กรมส่งเสริมสหกรณ์
    feedback: กรมส่งเสริมสหกรณ์ให้คำแนะนำ ส่งเสริม และกำกับตามกฎหมาย แต่ไม่ได้เป็นเจ้าของ
  - id: c
    text: ผู้จัดการสหกรณ์
    feedback: ผู้จัดการเป็นลูกจ้างที่คณะกรรมการจ้างมาบริหารงานประจำ
  - id: d
    text: ธนาคารที่ให้สหกรณ์กู้เงิน
    feedback: เจ้าหนี้ไม่ได้เป็นเจ้าของ
  hints:
  - สหกรณ์ตั้งขึ้นจากการรวมกลุ่มของใคร
  - อำนาจสูงสุดของสหกรณ์อยู่ที่การประชุมของใคร
  solution: สหกรณ์เป็นของสมาชิก อำนาจสูงสุดอยู่ที่ **ที่ประชุมใหญ่** ซึ่งเลือกคณะกรรมการดำเนินการ คณะกรรมการจึงจ้างผู้จัดการ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.cooperatives.p004
  topics:
  - business.econ.cooperatives
  difficulty: 2
  type: numeric
  stem: ลุงมีขายข้าวเปลือก $12$ ตัน ถ้าขายให้พ่อค้าคนกลางได้ตันละ $9{,}800$ บาท ถ้าขายผ่านสหกรณ์การเกษตรที่รวบรวมข้าวของสมาชิกไปขายโรงสีได้ตันละ $10{,}400$ บาท (สมมติ) ขายผ่านสหกรณ์ได้เงินมากกว่ากี่บาท (ตอบเป็นบาท)
  answer:
    value: 7200
    unit: บาท
  misconceptions:
  - match: 600
    feedback: นั่นคือส่วนต่างต่อตัน ต้องคูณจำนวนตันด้วย
  - match: 124800
    feedback: นั่นคือเงินที่ได้ทั้งหมดจากสหกรณ์ โจทย์ถามว่ามากกว่ากี่บาท
  hints:
  - หาส่วนต่างราคาต่อตันก่อน
  - คูณส่วนต่างด้วยจำนวนตัน
  solution: ส่วนต่าง $= 10{,}400 - 9{,}800 = 600$ บาทต่อตัน ได้เงินมากกว่า $= 600 \times 12 = 7{,}200$ บาท สหกรณ์มีอำนาจต่อรองมากกว่าเพราะรวมผลผลิตจำนวนมาก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.cooperatives.p005
  topics:
  - business.econ.cooperatives
  difficulty: 2
  type: numeric
  stem: น้องมิ้นถือหุ้นสหกรณ์ออมทรัพย์ $ 120 $ หุ้น หุ้นละ $10$ บาท ปีนี้สหกรณ์จ่ายเงินปันผล $5\%$ ของค่าหุ้น (สมมติ) น้องมิ้นได้เงินปันผลกี่บาท (ตอบเป็นบาท)
  answer:
    value: 60
    unit: บาท
  misconceptions:
  - match: 6
    feedback: คิดจากจำนวนหุ้น ต้องคูณราคาหุ้นละ 10 บาทก่อน
  - match: 1260
    feedback: นั่นคือค่าหุ้นรวมเงินปันผล โจทย์ถามเฉพาะเงินปันผล
  hints:
  - ค่าหุ้นทั้งหมด $=$ จำนวนหุ้น $\times$ ราคาต่อหุ้น
  - $5\% = 0.05$
  solution: ค่าหุ้น $= 120 \times 10 = 1{,}200$ บาท เงินปันผล $= 1{,}200 \times 0.05 = 60$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.cooperatives.p006
  topics:
  - business.econ.cooperatives
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็น **ประโยชน์ที่สมาชิกได้รับ** จากสหกรณ์ (เลือกได้มากกว่าหนึ่งข้อ)
  multiple: true
  choices:
  - id: a
    text: ซื้อสินค้าและปัจจัยการผลิตในราคายุติธรรม
    correct: true
  - id: b
    text: กู้เงินได้ในอัตราดอกเบี้ยที่ไม่สูงเกินไป แทนการกู้นอกระบบ
    correct: true
  - id: c
    text: ได้เงินเฉลี่ยคืนตามยอดที่ทำธุรกิจกับสหกรณ์
    correct: true
  - id: d
    text: ได้เงินปันผลแน่นอนทุกปีโดยไม่ต้องดูผลประกอบการ
    feedback: ปันผลจ่ายจากกำไรสุทธิ ปีที่ขาดทุนหรือกำไรน้อยอาจไม่ได้ปันผล
  - id: e
    text: ได้รับความคุ้มครองเงินฝากจากสถาบันคุ้มครองเงินฝาก
    feedback: เงินฝากในสหกรณ์ไม่อยู่ในความคุ้มครองของสถาบันคุ้มครองเงินฝาก สมาชิกจึงต้องดูความมั่นคงของสหกรณ์เอง
  hints:
  - 'คิดถึงธุรกิจหลักของสหกรณ์: ซื้อ ขาย ออม กู้'
  - ปันผลมาจากกำไร กำไรแน่นอนทุกปีหรือไม่
  solution: ข้อ ก ข ค เป็นประโยชน์ของสมาชิก ข้อ ง ผิดเพราะปันผลขึ้นกับกำไร ข้อ จ ผิดเพราะเงินฝากสหกรณ์ไม่อยู่ในความคุ้มครองเงินฝากของสถาบันคุ้มครองเงินฝาก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.cooperatives.p007
  topics:
  - business.econ.cooperatives
  difficulty: 3
  type: numeric
  stem: สหกรณ์การเกษตรแห่งหนึ่งมีกำไรสุทธิประจำปี $480{,}000$ บาท (สมมติ) ตามกฎหมายต้องจัดสรรเป็นทุนสำรองไม่น้อยกว่าร้อยละ $10$ ของกำไรสุทธิ ทุนสำรองอย่างน้อยกี่บาท (ตอบเป็นบาท)
  answer:
    value: 48000
    unit: บาท
  misconceptions:
  - match: 4800
    feedback: คูณ $0.01$ คือร้อยละ 1 ร้อยละ 10 ต้องคูณ $0.10$
  - match: 432000
    feedback: นั่นคือกำไรที่เหลือหลังกันทุนสำรอง
  hints:
  - ร้อยละ $10$ คือ $0.10$
  - ทุนสำรอง $=$ กำไรสุทธิ $\times 0.10$
  solution: ทุนสำรองอย่างน้อย $= 480{,}000 \times 0.10 = 48{,}000$ บาท ทุนสำรองเก็บไว้รองรับความเสียหายและนำมาแบ่งให้สมาชิกไม่ได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.cooperatives.p008
  topics:
  - business.econ.cooperatives
  difficulty: 3
  type: numeric
  stem: สหกรณ์ร้านค้าชุมชนจัดสรรเงินเฉลี่ยคืน $36{,}000$ บาท ยอดซื้อของสมาชิก $ 120 $ คนรวมกัน $1{,}200{,}000$ บาท ป้าศรีซื้อของทั้งปี $15{,}000$ บาท ป้าศรีได้เงินเฉลี่ยคืนกี่บาท (ตอบเป็นบาท)
  answer:
    value: 450
    unit: บาท
  misconceptions:
  - match: 300
    feedback: แบ่งเท่ากันทุกคน แต่เงินเฉลี่ยคืนแบ่งตามส่วนธุรกิจที่สมาชิกทำกับสหกรณ์
  hints:
  - หาอัตราเฉลี่ยคืนต่อยอดซื้อ 1 บาทก่อน
  - เงินเฉลี่ยคืนแบ่งตามยอดซื้อ ไม่ได้แบ่งเท่ากันทุกคน
  solution: อัตราเฉลี่ยคืน $= \dfrac{36{,}000}{1{,}200{,}000} = 0.03$ หรือ $3\%$ ของยอดซื้อ ป้าศรีได้ $= 15{,}000 \times 0.03 = 450$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.cooperatives.p009
  topics:
  - business.econ.cooperatives
  difficulty: 3
  type: match
  stem: จับคู่การรวมกลุ่มทางเศรษฐกิจในท้องถิ่นกับลักษณะของกลุ่ม
  pairs:
  - left: กลุ่มออมทรัพย์เพื่อการผลิต
    right: สมาชิกฝากเงินสัจจะทุกเดือน แล้วให้สมาชิกกู้ไปลงทุนทำกิน
  - left: วิสาหกิจชุมชน
    right: คนในชุมชนรวมกันผลิตและขาย เช่น แปรรูปกล้วยตาก จดทะเบียนกับกรมส่งเสริมการเกษตร
  - left: ธนาคารขยะ
    right: สมาชิกนำขยะรีไซเคิลมาขาย บันทึกเป็นเงินออมในสมุด
  - left: สหกรณ์ร้านค้า
    right: จดทะเบียนตามกฎหมายสหกรณ์ สมาชิกถือหุ้นและซื้อของใช้จากร้านของตน
  hints:
  - 'ดูว่ากลุ่มทำอะไรเป็นหลัก: ออม ผลิต หรือขาย'
  - กลุ่มที่จดทะเบียนตามกฎหมายสหกรณ์มีเพียงกลุ่มเดียว
  solution: กลุ่มออมทรัพย์เพื่อการผลิต → ฝากสัจจะและให้กู้ · วิสาหกิจชุมชน → ผลิตและขายร่วมกัน · ธนาคารขยะ → ขยะเป็นเงินออม · สหกรณ์ร้านค้า → ร้านของสมาชิกตามกฎหมายสหกรณ์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.cooperatives.p010
  topics:
  - business.econ.cooperatives
  difficulty: 3
  type: mcq
  stem: สหกรณ์ออมทรัพย์ครูกันกำไรส่วนหนึ่งไว้เป็นทุนสำรองทุกปี เพื่อรองรับปีที่ลูกหนี้ผิดนัดชำระ การกระทำนี้ตรงกับหลักใดของปรัชญาของเศรษฐกิจพอเพียงมากที่สุด
  choices:
  - id: a
    text: การมีภูมิคุ้มกันที่ดีในตัว
    correct: true
  - id: b
    text: ความพอประมาณ
    feedback: ความพอประมาณคือทำตามกำลัง ไม่มากไม่น้อยเกินไป ข้อนี้เน้นการเตรียมรับความเสี่ยง
  - id: c
    text: เงื่อนไขคุณธรรม
    feedback: คุณธรรมคือความซื่อสัตย์ แบ่งปัน ข้อนี้คือการเตรียมรับผลกระทบ
  - id: d
    text: ความมีเหตุผล
    feedback: การกันเงินไว้ก็มีเหตุผล แต่จุดประสงค์หลักคือรับมือความเสี่ยงในอนาคต
  hints:
  - ทุนสำรองใช้ทำอะไร
  - หลักใดพูดถึงการเตรียมพร้อมรับผลกระทบจากการเปลี่ยนแปลง
  solution: ทุนสำรองช่วยให้สหกรณ์รับมือความเสียหายในอนาคตได้ จึงตรงกับ **การมีภูมิคุ้มกันที่ดีในตัว** (ดู [ปรัชญาของเศรษฐกิจพอเพียง](/topic/business.econ.sufficiency-economy/))
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.cooperatives.p011
  topics:
  - business.econ.cooperatives
  difficulty: 3
  type: order
  stem: เรียงขั้นตอนการจัดตั้งสหกรณ์ตามลำดับ
  items:
  - รวมกลุ่มคนที่มีปัญหาหรือความต้องการทางเศรษฐกิจเดียวกัน
  - ขอคำแนะนำจากสำนักงานสหกรณ์จังหวัด และศึกษาว่าธุรกิจจะไปได้หรือไม่
  - ประชุมผู้ที่จะเป็นสมาชิก เลือกคณะผู้จัดตั้ง และร่างข้อบังคับ
  - ยื่นขอจดทะเบียนต่อนายทะเบียนสหกรณ์
  - ประชุมใหญ่ครั้งแรก เลือกคณะกรรมการดำเนินการ
  - เริ่มดำเนินธุรกิจและให้บริการสมาชิก
  hints:
  - ต้องมีคนที่ต้องการร่วมกันก่อน
  - ต้องจดทะเบียนก่อนจึงเป็นนิติบุคคลและมีคณะกรรมการตามกฎหมาย
  solution: รวมกลุ่ม → ขอคำแนะนำและศึกษาความเป็นไปได้ → ประชุมเลือกคณะผู้จัดตั้งและร่างข้อบังคับ → ยื่นจดทะเบียน → ประชุมใหญ่ครั้งแรกเลือกคณะกรรมการ → เริ่มธุรกิจ
