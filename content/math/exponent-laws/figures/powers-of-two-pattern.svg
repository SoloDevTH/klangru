  <text x="100" y="228" text-anchor="middle" fill="#2b5f9e" font-size="18" font-weight="bold">2<tspan dy="-9" font-size="13">0</tspan></text>
  <text x="230" y="228" text-anchor="middle" fill="#15211e" font-size="18" font-weight="bold">1</text>
  <path d="M 310 223.0 C 350 225.0 350 255.0 310 257.0" fill="none" stroke="#b4521f" stroke-width="2"/>
  <polygon points="312,257 320,260.6 320,253.4" fill="#b4521f"/>
