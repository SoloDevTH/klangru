      - { match: "ใบ", feedback: "ใบ ใช้กับภาชนะ เช่น แก้ว 2 ใบ ไข่มีลักษณนามเฉพาะของตัวเอง" }
      - { match: "อัน", feedback: "อัน ใช้กับของชิ้นเล็กที่ไม่มีลักษณนามเฉพาะ ไข่มีลักษณนามเฉพาะ" }
    hints:
      - "ลักษณนามคือคำนามที่บอกลักษณะของนามข้างหน้า ใช้ตามหลังตัวเลข"
