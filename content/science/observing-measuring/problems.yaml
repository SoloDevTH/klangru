problems:
  - id: science.inquiry.observing-measuring.p001
    topics: [science.inquiry.observing-measuring]
    difficulty: 1
    type: mcq
    stem: "ประโยคใดเป็น **การสังเกต** คือบอกสิ่งที่เห็นหรือได้ยินจริง ไม่ใช่การคาดเดา"
    choices:
      - { id: a, text: "ก้อนหินนี้มีสีเทาและผิวขรุขระ", correct: true }
      - { id: b, text: "ก้อนหินนี้น่าจะหนักมาก", feedback: "คำว่า น่าจะ บอกว่าเป็นการคาดเดา ต้องชั่งจึงจะรู้น้ำหนักจริง" }
      - { id: c, text: "ก้อนหินนี้เกิดจากภูเขาไฟ", feedback: "เป็นการอนุมานจากความรู้เดิม ยังไม่ได้เห็นหลักฐานของการเกิด" }
      - { id: d, text: "ก้อนหินนี้เป็นของที่สวยที่สุดในสนาม", feedback: "เป็นความเห็นส่วนตัว ไม่ใช่สิ่งที่วัดหรือสังเกตได้โดยตรง" }
    hints:
      - "ลองถามว่า ประโยคนี้บอกสิ่งที่ตาเห็นหรือมือสัมผัสได้โดยตรงหรือไม่"
      - "คำอย่าง น่าจะ คงจะ หรือ สวยที่สุด มักบอกการคาดเดาหรือความเห็น"
    solution: "ก้อนหินมีสีเทาและผิวขรุขระ ตาเห็นและมือสัมผัสได้โดยตรง จึงเป็นการสังเกต ส่วนข้ออื่นเป็นการอนุมานหรือความเห็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.observing-measuring.p002
    topics: [science.inquiry.observing-measuring]
    difficulty: 1
    type: match
    stem: "จับคู่เครื่องมือกับสิ่งที่ใช้วัด"
    pairs:
      - { left: ไม้บรรทัด, right: ความยาว }
      - { left: กระบอกตวง, right: ปริมาตรของเหลว }
      - { left: เทอร์โมมิเตอร์, right: อุณหภูมิ }
      - { left: ตาชั่ง, right: มวล }
      - { left: นาฬิกาจับเวลา, right: ช่วงเวลา }
    hints:
      - "ดูว่าสิ่งที่วัดเป็นความยาว มวล ปริมาตร อุณหภูมิ หรือเวลา"
      - "ลองนึกถึงหน่วยที่ใช้กับแต่ละเครื่องมือ เช่น cm, g, mL, °C และ s"
    solution: "ไม้บรรทัดวัดความยาว กระบอกตวงวัดปริมาตรของเหลว เทอร์โมมิเตอร์วัดอุณหภูมิ ตาชั่งวัดมวล และนาฬิกาจับเวลาวัดช่วงเวลา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.observing-measuring.p003
    topics: [science.inquiry.observing-measuring]
    difficulty: 1
    type: numeric
    stem: "แถบกระดาษประกอบด้วยช่องสี่เหลี่ยมความยาวช่องละ 1 cm วางต่อกัน 8 ช่องพอดี แถบกระดาษยาวกี่เซนติเมตร (ตอบเป็น cm)"
    answer: { value: 8, tolerance: 0, unit: cm }
    hints:
      - "ความยาวของแถบคือจำนวนช่องคูณความยาวของแต่ละช่อง"
      - "ให้นับจำนวนช่อง ไม่ใช่จำนวนเส้นแบ่งระหว่างช่อง"
      - "นับช่องทีละช่องแล้วคูณด้วย 1 cm"
    misconceptions:
      - { match: 9, feedback: "นับเส้นแบ่งระหว่างช่องแทนการนับช่อง ซึ่งจะได้เส้นมากกว่าช่องหนึ่งเส้นเสมอ" }
      - { match: 7, feedback: "นับช่องหายไปหนึ่งช่อง ควรทำเครื่องหมายทีละช่องขณะนับ" }
    solution: "แถบยาว 8 × 1 cm = 8 cm เพราะมี 8 ช่อง และแต่ละช่องยาว 1 cm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.observing-measuring.p004
    topics: [science.inquiry.observing-measuring]
    difficulty: 1
    type: mcq
    stem: "น้องวัดความยาวริบบิ้นได้ค่าหนึ่ง ค่าใดบันทึกผลได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "12", feedback: "มีตัวเลขแต่ไม่มีหน่วย ผู้อ่านจะไม่รู้ว่าวัดความยาว มวล หรืออย่างอื่น" }
      - { id: b, text: "12 cm", correct: true }
      - { id: c, text: "12 กิโลกรัม", feedback: "กิโลกรัมเป็นหน่วยของมวล ไม่ใช่หน่วยของความยาว ต้องเลือกหน่วยตามสิ่งที่วัด" }
      - { id: d, text: "12 วินาที", feedback: "วินาทีเป็นหน่วยของเวลา ไม่ใช่หน่วยของความยาว" }
    hints:
      - "การบันทึกผลที่สมบูรณ์ต้องมีทั้งตัวเลขและหน่วย"
      - "ลองดูว่าหน่วยไหนใช้วัดความยาว"
    solution: "การบันทึกผลต้องมีตัวเลขและหน่วยที่ตรงกับสิ่งที่วัด ความยาวใช้หน่วยเซนติเมตร จึงบันทึกเป็น 12 cm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.observing-measuring.p005
    topics: [science.inquiry.observing-measuring]
    difficulty: 1
    type: text
    stem: "ก่อนชั่งมวลวัตถุด้วยตาชั่ง ต้องทำขั้นตอนใดเป็นอันดับแรก (ตอบสั้น ๆ)"
    accepted: ["ปรับศูนย์", "ปรับ 0", "ปรับให้เป็นศูนย์", "ตั้งศูนย์", "ปรับศูนย์ก่อน"]
    hints:
      - "ลองดูว่าก่อนวางของลงไป ตาชั่งแสดงตัวเลขเป็นเท่าไร"
      - "ค่าที่ตาชั่งแสดงตอนยังไม่มีของ จะถูกนับรวมในทุกการชั่งหรือไม่"
      - "ใช้ปุ่มบนเครื่องให้ค่าตอนไม่มีของกลายเป็นศูนย์"
    misconceptions:
      - { match: "ชั่งเลย", feedback: "ถ้าไม่ปรับศูนย์ก่อน ค่าที่อ่านได้จะคลาดเคลื่อนไปเท่ากับค่าที่เครื่องแสดงตอนว่าง" }
    solution: "ก่อนชั่งต้องปรับศูนย์ให้เครื่องแสดงศูนย์เมื่อยังไม่มีของ มิฉะนั้นค่าที่ค้างอยู่จะถูกนับรวมในทุกการชั่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.observing-measuring.p006
    topics: [science.inquiry.observing-measuring]
    difficulty: 2
    type: numeric
    stem: "กระบอกตวงในภาพมีขีดทุก 1 mL ระดับของเหลวอยู่ระหว่างเลข 40 กับ 50 อ่านปริมาตรได้เท่าไร (ตอบเป็น mL) ให้อ่านที่จุดต่ำสุดของผิวโค้ง"
    figure:
      src: cylinder-problem.svg
      alt: "กระบอกตวงทรงกระบอกสูงมีขีดทุก 1 มิลลิลิตร ตัวเลขกำกับทุก 10 มิลลิลิตรตั้งแต่ 0 ถึง 100 ของเหลวสีฟ้าในกระบอกมีผิวโค้งเว้า ระดับน้ำอยู่ระหว่างเลข 40 กับ 50 ต้องประมาณค่า"
    answer: { value: 46.5, tolerance: 0.2, unit: mL }
    hints:
      - "ดูก่อนว่าขีดเล็กที่สุดของกระบอกตวงนี้เท่ากับเท่าไร"
      - "ระดับน้ำอยู่ตรงขีดพอดี หรืออยู่ระหว่างขีดสองขีดที่ติดกัน"
      - "ถ้าอยู่ระหว่างขีด ให้ประมาณเพิ่มอีกหนึ่งตำแหน่งทศนิยม แล้วอ่านที่จุดต่ำสุดของผิวโค้ง"
    misconceptions:
      - { match: 46, feedback: "อ่านที่ขีดด้านล่างแทนการประมาณระหว่างขีด ค่าที่ได้จึงต่ำกว่าความจริงครึ่งหนึ่งของขีดเล็กที่สุด" }
      - { match: 47, feedback: "ปัดขึ้นไปที่ขีดบนโดยไม่ได้ประมาณ ค่าที่ได้จึงสูงเกินความจริงครึ่งหนึ่งของขีดเล็กที่สุด" }
    solution: "ขีดเล็กที่สุดคือ 1 mL ระดับน้ำอยู่ครึ่งทางระหว่างขีด 46 กับ 47 จึงอ่านได้ 46.5 mL โดยอ่านที่จุดต่ำสุดของผิวโค้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.observing-measuring.p007
    topics: [science.inquiry.observing-measuring]
    difficulty: 2
    type: numeric
    stem: "แท่งไม้สีส้มวางทับไม้บรรทัดในภาพ ปลายทั้งสองด้านอยู่ระหว่างตัวเลขบนไม้บรรทัด ให้อ่านให้ละเอียดถึงขีดมิลลิเมตร แท่งไม้ยาวกี่เซนติเมตร (ตอบเป็น cm)"
    figure:
      src: ruler-problem.svg
      alt: "ไม้บรรทัดมีขีดมิลลิเมตรและตัวเลขกำกับทุกเซนติเมตรตั้งแต่ 0 ถึง 12 แท่งไม้สีส้มวางทับไม้บรรทัด ปลายซ้ายอยู่ระหว่างเลข 1 กับ 2 ปลายขวาอยู่ระหว่างเลข 9 กับ 10"
    answer: { value: 7.8, tolerance: 0.05, unit: cm }
    hints:
      - "อ่านตำแหน่งของปลายแต่ละด้านบนไม้บรรทัดให้ถึงขีดมิลลิเมตร"
      - "ความยาวคือตำแหน่งปลายขวาลบตำแหน่งปลายซ้าย"
      - "นับขีดมิลลิเมตรจากตัวเลขที่อยู่ใกล้ที่สุดทางซ้ายของแต่ละปลาย"
    misconceptions:
      - { match: 9.3, feedback: "อ่านได้เฉพาะตำแหน่งปลายขวา ยังไม่ได้ลบตำแหน่งปลายซ้ายซึ่งไม่ได้อยู่ที่ 0" }
      - { match: -7.8, feedback: "ลบกลับด้าน ทำให้ได้ค่าลบ ความยาวต้องเอาตำแหน่งที่มากกว่าลบด้วยตำแหน่งที่น้อยกว่า" }
    solution: "ปลายซ้ายอยู่ที่ 1.5 cm และปลายขวาอยู่ที่ 9.3 cm ความยาว = 9.3 − 1.5 = 7.8 cm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.observing-measuring.p008
    topics: [science.inquiry.observing-measuring]
    difficulty: 2
    type: mcq
    stem: "ที่บ้านต้องตวงกะทิ 240 mL สำหรับทำขนม ข้อใดเป็นเครื่องมือที่เหมาะที่สุด"
    choices:
      - { id: a, text: "ช้อนโต๊ะ", feedback: "ช้อนโต๊ะไม่มีขีดบอกปริมาตรที่แน่นอน ปริมาณที่ตักได้จะต่างกันไปในแต่ละครั้ง" }
      - { id: b, text: "ถ้วยกาแฟ", feedback: "ถ้วยกาแฟไม่มีขีดบอกปริมาตร และขนาดแต่ละใบไม่เท่ากัน" }
      - { id: c, text: "กระบอกตวงขนาด 250 mL ที่มีขีดทุก 10 mL", correct: true }
      - { id: d, text: "แก้วน้ำใบใหญ่ที่เทให้เกือบเต็ม", feedback: "การประมาณด้วยตาไม่แม่นพอสำหรับสูตรที่ต้องการปริมาณที่แน่นอน" }
    hints:
      - "ดูว่าเครื่องมือแต่ละชิ้นมีขีดบอกปริมาตรหรือไม่"
      - "ความจุของเครื่องมือควรใกล้กับปริมาณที่ต้องการ และขีดต้องอ่านได้ชัด"
    solution: "ต้องการปริมาตร 240 mL ที่แน่นอน กระบอกตวงที่มีขีดชัดและความจุ 250 mL ใกล้เคียงที่สุด จึงอ่านค่าได้ตรงที่สุด ส่วนช้อนและถ้วยไม่มีขีดที่ใช้วัดได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.observing-measuring.p009
    topics: [science.inquiry.observing-measuring]
    difficulty: 2
    type: order
    stem: "เรียงลำดับขั้นตอนการวัดความยาวดินสอด้วยไม้บรรทัดให้ถูกต้อง"
    items:
      - "เลือกไม้บรรทัดที่มีขีดมิลลิเมตร"
      - "วางขีดศูนย์หรือจุดเริ่มให้ตรงปลายด้านหนึ่งของดินสอ"
      - "อ่านค่าที่ปลายอีกด้านโดยมองตั้งฉากกับไม้บรรทัด"
      - "บันทึกค่าพร้อมหน่วยลงในตาราง"
      - "วัดซ้ำจนครบอย่างน้อยสามครั้ง"
      - "หาค่าเฉลี่ยของค่าที่วัดได้"
    hints:
      - "ขั้นแรกคือการเตรียมเครื่องมือก่อนลงมือวัด"
      - "การหาค่าเฉลี่ยต้องทำหลังมีค่าที่วัดครบแล้ว"
      - "การบันทึกต้องทำหลังอ่านค่าแต่ละครั้งเสร็จ"
    solution: "เลือกเครื่องมือที่ละเอียดพอ จัดจุดเริ่มให้ตรง อ่านปลายอีกด้าน บันทึกพร้อมหน่วย วัดซ้ำจนครบสามครั้ง แล้วจึงหาค่าเฉลี่ย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.observing-measuring.p010
    topics: [science.inquiry.observing-measuring]
    difficulty: 2
    type: numeric
    stem: "วัดความยาวใบไม้ 3 ครั้งได้ 7.2 cm, 7.6 cm และ 7.5 cm ค่าเฉลี่ยที่ควรบันทึกเป็นกี่เซนติเมตร โดยปัดให้มีทศนิยมหนึ่งตำแหน่งเท่ากับค่าที่วัด (ตอบเป็น cm)"
    answer: { value: 7.4, tolerance: 0.05, unit: cm }
    hints:
      - "ค่าเฉลี่ยคือผลรวมของค่าทั้งหมดหารด้วยจำนวนครั้งที่วัด"
      - "รวมค่าทั้งสามก่อน แล้วหารด้วยจำนวนครั้ง"
      - "ผลลัพธ์ต้องปัดให้มีทศนิยมหนึ่งตำแหน่งเหมือนค่าที่วัด"
    misconceptions:
      - { match: 7.2, feedback: "ใช้เพียงค่าแรกแทนค่าเฉลี่ย ทั้งที่ควรนำค่าทั้งสามมาเฉลี่ยด้วยกัน" }
      - { match: 22.3, feedback: "รวมค่าที่วัดได้แล้วแต่ยังไม่ได้หารด้วยจำนวนครั้งที่วัด" }
    solution: "ผลรวม 7.2 + 7.6 + 7.5 = 22.3 cm หารด้วย 3 ได้ 7.433… cm ปัดให้มีทศนิยมหนึ่งตำแหน่งเท่ากับค่าที่วัด จึงบันทึก 7.4 cm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.observing-measuring.p011
    topics: [science.inquiry.observing-measuring]
    difficulty: 2
    type: numeric
    stem: "น้องนับก้าวเดินจากประตูโรงเรียนถึงเสาธงได้ 40 ก้าว ก้าวของน้องยาว 60 cm พอดีทุกก้าว ระยะทางระหว่างประตูกับเสาธงยาวกี่เมตร (ตอบเป็น m)"
    answer: { value: 24, tolerance: 0.01, unit: m }
    hints:
      - "จำนวนก้าวคูณความยาวของก้าวหนึ่งก้าว จะได้ระยะทางรวม"
      - "ผลลัพธ์ที่ได้จะเป็นเซนติเมตร ต้องแปลงเป็นเมตร โดย 1 m = 100 cm"
    misconceptions:
      - { match: 2400, feedback: "ได้ค่าเป็นเซนติเมตร ต้องหารด้วย 100 เพื่อแปลงเป็นเมตร" }
      - { match: 40, feedback: "นับได้จำนวนก้าว แต่ยังไม่ได้คูณด้วยความยาวของก้าวแต่ละก้าว" }
    solution: "ระยะทาง = 40 × 60 cm = 2400 cm แปลงเป็นเมตรโดยหารด้วย 100 ได้ 24 m"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.observing-measuring.p012
    topics: [science.inquiry.observing-measuring]
    difficulty: 2
    type: numeric
