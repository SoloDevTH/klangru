      - { id: b, text: "ไวโอลินมีเสียงสูงกว่า เพราะรูปคลื่นมีหยักมากกว่า", feedback: "ระดับเสียงขึ้นกับความถี่ ซึ่งดูจากเวลาที่รูปคลื่นซ้ำเดิม ทั้งสองซ้ำทุกช่วงเท่ากัน ความถี่จึงเท่ากัน หยักเล็ก ๆ คือฮาร์มอนิกที่ทำให้คุณภาพเสียงต่างกัน" }
      - { id: c, text: "ไวโอลินดังกว่า เพราะรูปคลื่นซับซ้อนกว่า", feedback: "ความดังขึ้นกับแอมพลิจูด ยอดของทั้งสองกราฟสูงเท่ากัน ความซับซ้อนของรูปคลื่นบอกคุณภาพเสียง ไม่ใช่ความดัง" }
      - { id: d, text: "ทั้งสองเสียงเหมือนกันทุกประการ หูแยกไม่ออก", feedback: "รูปคลื่นต่างกัน หูจึงแยกเสียงได้ นี่คือสิ่งที่เรียกว่าคุณภาพเสียง" }
