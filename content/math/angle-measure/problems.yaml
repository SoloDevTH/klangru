    solution: "จากเลข 12 เข็มยาวอยู่ที่ $30 \\times 6 = 180^\\circ$ เข็มสั้นอยู่ที่ $3 \\times 30^\\circ + 15^\\circ = 105^\\circ$ มุมระหว่างเข็ม $= 180^\\circ - 105^\\circ = 75^\\circ$"
