  - id: phy.ff.p015
    topics: [physics.kinematics.free-fall]
    difficulty: 2
    type: numeric
    stem: "ในคาบวิทยาศาสตร์ นักเรียนทดสอบเวลาตอบสนองด้วยไม้บรรทัด เพื่อนปล่อยไม้บรรทัดให้ตกอิสระ แล้วนักเรียนจับได้เมื่อไม้บรรทัดตกไป $19.6\\ \\mathrm{cm}$ เวลาตอบสนองของนักเรียนเป็นกี่วินาที ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 0.2, tolerance: 0.005, unit: s }
    hints:
      - "แปลงระยะเป็นเมตร"
      - "ใช้ $t = \\sqrt{\\dfrac{2h}{g}}$"
    misconceptions:
      - { match: 0.04, feedback: "นั่นคือ $t^2$ ยังต้องถอดรากที่สอง" }
      - { match: 0.1414, feedback: "ดูเหมือนลืมเลข 2 ใน $\\tfrac{2h}{g}$ ซึ่งมาจาก $\\tfrac12$ ใน $h = \\tfrac12 gt^2$" }
    solution: "$h = 0.196\\ \\mathrm{m}$ ดังนั้น $t = \\sqrt{\\dfrac{2(0.196)}{9.8}} = \\sqrt{0.04} = 0.2\\ \\mathrm{s}$"
