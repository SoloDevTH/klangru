problems:
  - id: phy.press.p001
    topics: [physics.matter.pressure-fluids]
    difficulty: 1
    type: mcq
    stem: "มีดที่ลับคมแล้วหั่นผักได้ง่ายกว่ามีดทื่อ เมื่อออกแรงกดเท่ากัน เพราะเหตุใด"
    choices:
      - { id: a, text: "คมมีดมีพื้นที่สัมผัสน้อยกว่า แรงเท่ากันจึงให้ความดันมากกว่า", correct: true }
      - { id: b, text: "มีดคมออกแรงกดผักได้มากกว่ามีดทื่อ", feedback: "โจทย์บอกว่าออกแรงกดเท่ากัน สิ่งที่ต่างคือพื้นที่ที่แรงกระจายอยู่ ซึ่งทำให้ความดันต่างกัน" }
      - { id: c, text: "มีดคมมีพื้นที่สัมผัสมากกว่า จึงกดได้ทั่วถึงกว่า", feedback: "กลับกัน คมมีดเป็นเส้นบาง พื้นที่สัมผัสน้อยมาก และจาก $P = F/A$ พื้นที่น้อยยิ่งทำให้ความดันมาก" }
      - { id: d, text: "ความดันไม่เกี่ยวกับพื้นที่ มีดคมแค่ทำจากเหล็กที่ดีกว่า", feedback: "ความดันคือแรงต่อพื้นที่ $P = F/A$ มีดเล่มเดียวกันพอลับคมก็หั่นง่ายขึ้นทั้งที่เป็นเหล็กเดิม" }
    hints:
      - "นึกถึงสูตร $P = F/A$"
      - "แรงเท่ากัน ถ้า $A$ เล็กลง $P$ จะเป็นอย่างไร"
    solution: "จาก $P = F/A$ เมื่อ $F$ เท่ากัน คมมีดที่บางมีพื้นที่ $A$ น้อย ความดันจึงสูงพอจะตัดเนื้อผักได้ มีดทื่อมีพื้นที่สัมผัสมากกว่า ความดันจึงต่ำกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.press.p002
    topics: [physics.matter.pressure-fluids]
    difficulty: 2
    type: numeric
    stem: "กล่องหนัก $600\\ \\mathrm{N}$ วางบนพื้นราบ ฐานกล่องมีพื้นที่ $0.2\\ \\mathrm{m^2}$ กล่องออกความดันต่อพื้นเท่าใด (ตอบเป็นตัวเลขในหน่วย Pa)"
    answer: { value: 3000, unit: Pa }
    hints:
      - "แรงที่กดพื้นคือน้ำหนักของกล่อง"
      - "ใช้ $P = F/A$ หารแรงด้วยพื้นที่"
    misconceptions:
      - { match: 120, feedback: "ดูเหมือนนำแรงคูณพื้นที่ ความดันคือแรง **หาร** ด้วยพื้นที่ $P = F/A$" }
    solution: "$P = \\dfrac{F}{A} = \\dfrac{600\\ \\mathrm{N}}{0.2\\ \\mathrm{m^2}} = 3{,}000\\ \\mathrm{Pa}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.press.p003
    topics: [physics.matter.pressure-fluids]
    difficulty: 3
    type: numeric
    stem: "ช้างไทยมวล $3{,}000\\ \\mathrm{kg}$ ยืนด้วยเท้าทั้งสี่ เท้าแต่ละข้างมีพื้นที่สัมผัสพื้น $0.1\\ \\mathrm{m^2}$ ช้างออกความดันต่อพื้นเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย Pa)"
    answer: { value: 73500, unit: Pa }
    hints:
      - "แรงที่กดพื้นคือน้ำหนัก $W = mg$ ไม่ใช่มวล"
      - "น้ำหนักกระจายบนเท้าทั้งสี่ พื้นที่รวมจึงเป็น $4 \\times 0.1\\ \\mathrm{m^2}$"
      - "หารน้ำหนักด้วยพื้นที่รวม"
    misconceptions:
      - { match: 7500, feedback: "ดูเหมือนใช้มวลแทนแรง ต้องเปลี่ยนมวลเป็นน้ำหนักก่อน $W = mg = 3{,}000 \\times 9.8\\ \\mathrm{N}$" }
      - { match: 294000, feedback: "ดูเหมือนใช้พื้นที่ของเท้าข้างเดียว ช้างยืนสี่เท้า น้ำหนักกระจายบนพื้นที่รวม $0.4\\ \\mathrm{m^2}$" }
    solution: "$W = mg = (3{,}000\\ \\mathrm{kg})(9.8\\ \\mathrm{m/s^2}) = 29{,}400\\ \\mathrm{N}$ · $A = 4 \\times 0.1 = 0.4\\ \\mathrm{m^2}$ · $P = \\dfrac{29{,}400}{0.4} = 73{,}500\\ \\mathrm{Pa}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.press.p004
    topics: [physics.matter.pressure-fluids]
    difficulty: 2
    type: numeric
    stem: "ความดันเนื่องจากน้ำ (ไม่รวมความดันบรรยากาศ) ที่ก้นสระว่ายน้ำลึก $5\\ \\mathrm{m}$ เป็นเท่าใด ใช้ $\\rho$ ของน้ำ $= 1{,}000\\ \\mathrm{kg/m^3}$ และ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย kPa)"
    answer: { value: 49, unit: kPa }
    hints:
      - "ใช้ $P = \\rho g h$"
      - "ได้หน่วยพาสคัล แล้วหาร 1,000 เพื่อเป็นกิโลพาสคัล"
    misconceptions:
      - { match: 5, feedback: "ดูเหมือนลืมคูณ $g$ ความดันในของเหลวคือ $\\rho g h$ ต้องมีค่า $g = 9.8\\ \\mathrm{m/s^2}$ ด้วย" }
      - { match: 150.3, feedback: "นั่นคือความดันรวมที่บวกความดันบรรยากาศแล้ว โจทย์ถามเฉพาะความดันเนื่องจากน้ำ" }
    solution: "$P = \\rho g h = (1{,}000\\ \\mathrm{kg/m^3})(9.8\\ \\mathrm{m/s^2})(5\\ \\mathrm{m}) = 49{,}000\\ \\mathrm{Pa} = 49\\ \\mathrm{kPa}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.press.p005
    topics: [physics.matter.pressure-fluids]
    difficulty: 3
    type: mcq
    stem: "ภาชนะสามใบรูปร่างต่างกัน ใบ ก กว้างมาก ใบ ข เป็นทรงกระบอก ใบ ค ปากแคบก้นกว้าง ใส่น้ำจนระดับน้ำสูงเท่ากันทุกใบ ความดันเนื่องจากน้ำที่ก้นภาชนะเป็นอย่างไร"
    choices:
      - { id: a, text: "เท่ากันทั้งสามใบ", correct: true }
      - { id: b, text: "ใบ ก มากที่สุด เพราะมีน้ำมากที่สุด", feedback: "น้ำมากกว่าก็จริง แต่กระจายอยู่บนก้นที่กว้างกว่าด้วย ความดันในของเหลว $P = \\rho g h$ ขึ้นกับความลึกเท่านั้น" }
      - { id: c, text: "ใบ ค มากที่สุด เพราะปากแคบบีบน้ำไว้", feedback: "รูปร่างภาชนะไม่มีผลต่อความดันที่ความลึกเท่ากัน $P = \\rho g h$ ไม่มีพื้นที่หรือปริมาตรอยู่ในสูตร" }
      - { id: d, text: "ใบ ข มากที่สุด เพราะผนังตั้งตรงทำให้น้ำกดลงตรง ๆ", feedback: "ความดันที่จุดหนึ่งในของเหลวกระทำทุกทิศและขึ้นกับความลึกเท่านั้น ไม่ขึ้นกับว่าผนังเอียงหรือตั้งตรง" }
    hints:
      - "สูตรความดันในของเหลวมีตัวแปรอะไรบ้าง"
      - "ในสูตร $P = \\rho g h$ ไม่มีพื้นที่หรือปริมาตรของภาชนะ"
    solution: "$P = \\rho g h$ ขึ้นกับความหนาแน่นของของเหลวและความลึกเท่านั้น ทั้งสามใบเป็นน้ำและลึกเท่ากัน ความดันที่ก้นจึงเท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.press.p006
    topics: [physics.matter.pressure-fluids]
    difficulty: 3
    type: numeric
    stem: "เขื่อนภูมิพล จังหวัดตาก ช่วงที่น้ำในอ่างลึก $100\\ \\mathrm{m}$ ความดันเนื่องจากน้ำที่ฐานเขื่อนเป็นเท่าใด ใช้ $\\rho$ ของน้ำ $= 1{,}000\\ \\mathrm{kg/m^3}$ และ $g = 9.8\\ \\mathrm{m/s^2}$ ไม่รวมความดันบรรยากาศ (ตอบเป็นตัวเลขในหน่วย kPa)"
    answer: { value: 980, unit: kPa }
    hints:
      - "ใช้ $P = \\rho g h$ โดย $h$ คือความลึกจากผิวน้ำ"
      - "หารผลลัพธ์ด้วย 1,000 เพื่อเปลี่ยน Pa เป็น kPa"
    misconceptions:
      - { match: 100, feedback: "ดูเหมือนลืมคูณ $g$ ใน $P = \\rho g h$ ต้องคูณ $9.8\\ \\mathrm{m/s^2}$ ด้วย" }
      - { match: 980000, feedback: "ตัวเลขถูกแล้วแต่เป็นหน่วยพาสคัล โจทย์ถามเป็นกิโลพาสคัล ให้หารด้วย 1,000" }
    solution: "$P = \\rho g h = (1{,}000)(9.8)(100) = 980{,}000\\ \\mathrm{Pa} = 980\\ \\mathrm{kPa}$ ประมาณ 10 เท่าของความดันบรรยากาศ ฐานเขื่อนจึงต้องหนามาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.press.p007
    topics: [physics.matter.pressure-fluids]
    difficulty: 3
    type: expression
    stem: "แม่แรงไฮดรอลิกมีลูกสูบเล็กพื้นที่ $A_1$ และลูกสูบใหญ่พื้นที่ $A_2$ ออกแรงกด $F_1$ ที่ลูกสูบเล็ก จงเขียนแรง $F_2$ ที่ลูกสูบใหญ่ในรูปของ $F_1$, $A_1$ และ $A_2$"
    prefix: "F_2 ="
    answer: { latex: "\\frac{F_1 A_2}{A_1}", variables: [F_1, A_1, A_2] }
    misconceptions:
      - { match: "\\frac{F_1 A_1}{A_2}", feedback: "สลับพื้นที่ ลูกสูบใหญ่ต้องได้แรงมากกว่า $F_1$ จึงต้องคูณด้วยอัตราส่วน $\\dfrac{A_2}{A_1}$ ซึ่งมากกว่า 1" }
      - { match: "F_1", feedback: "แรงไม่ได้ถ่ายทอดเท่าเดิม สิ่งที่เท่ากันทั้งสองข้างคือ **ความดัน** $\\dfrac{F_1}{A_1} = \\dfrac{F_2}{A_2}$" }
    hints:
      - "หลักของพาสคัล: ความดันที่ลูกสูบทั้งสองเท่ากัน"
      - "ตั้งสมการ $\\dfrac{F_1}{A_1} = \\dfrac{F_2}{A_2}$ แล้วคูณทั้งสองข้างด้วย $A_2$"
    solution: "$\\dfrac{F_1}{A_1} = \\dfrac{F_2}{A_2}$ → $F_2 = \\dfrac{F_1 A_2}{A_1}$ เมื่อ $A_2 > A_1$ จะได้ $F_2 > F_1$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.press.p008
    topics: [physics.matter.pressure-fluids]
    difficulty: 4
    type: numeric
    stem: "อู่ซ่อมรถใช้แม่แรงไฮดรอลิกยกรถเก๋งมวล $1{,}200\\ \\mathrm{kg}$ ลูกสูบใหญ่มีพื้นที่ $0.5\\ \\mathrm{m^2}$ ลูกสูบเล็กมีพื้นที่ $0.002\\ \\mathrm{m^2}$ ต้องออกแรงกดลูกสูบเล็กอย่างน้อยเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ และไม่คิดน้ำหนักของลูกสูบ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 47.04, tolerance: 0.4, unit: N }
    hints:
      - "แรงที่ลูกสูบใหญ่ต้องยกคือน้ำหนักรถ $W = mg$"
      - "ความดันเท่ากันทั้งสองลูกสูบ: $\\dfrac{F_1}{A_1} = \\dfrac{F_2}{A_2}$"
      - "จัดรูปเป็น $F_1 = F_2 \\times \\dfrac{A_1}{A_2}$ แล้วแทนค่า"
    misconceptions:
      - { match: 4.8, feedback: "ดูเหมือนใช้มวลรถแทนน้ำหนัก ต้องคูณ $g$ ก่อน $W = 1{,}200 \\times 9.8\\ \\mathrm{N}$" }
      - { match: 2940000, feedback: "ดูเหมือนคูณอัตราส่วนพื้นที่กลับด้าน ลูกสูบเล็กต้องใช้แรง **น้อยกว่า** น้ำหนักรถ จึงต้องคูณด้วย $\\dfrac{A_1}{A_2}$ ซึ่งน้อยกว่า 1" }
    solution: "$F_2 = mg = (1{,}200)(9.8) = 11{,}760\\ \\mathrm{N}$ · $F_1 = F_2 \\dfrac{A_1}{A_2} = 11{,}760 \\times \\dfrac{0.002}{0.5} = 47.04\\ \\mathrm{N}$ แรงเพียงราว $47\\ \\mathrm{N}$ ยกรถได้ เพราะพื้นที่ต่างกัน 250 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.press.p009
    topics: [physics.matter.pressure-fluids]
    difficulty: 3
    type: numeric
    stem: "ก้อนหินปริมาตร $2\\ \\mathrm{L}$ จมอยู่ในน้ำทั้งก้อน แรงลอยตัวที่น้ำกระทำต่อก้อนหินเป็นเท่าใด ใช้ $\\rho$ ของน้ำ $= 1{,}000\\ \\mathrm{kg/m^3}$ และ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 19.6, tolerance: 0.2, unit: N }
    hints:
      - "เปลี่ยนปริมาตรเป็น $\\mathrm{m^3}$ ก่อน: $1\\ \\mathrm{L} = 0.001\\ \\mathrm{m^3}$"
      - "ใช้ $F_B = \\rho_{\\text{น้ำ}} V g$ โดย $V$ คือปริมาตรที่จม"
    misconceptions:
      - { match: 19600, feedback: "ดูเหมือนใช้ $V = 2\\ \\mathrm{m^3}$ ต้องเปลี่ยนลิตรเป็นลูกบาศก์เมตรก่อน $2\\ \\mathrm{L} = 0.002\\ \\mathrm{m^3}$" }
      - { match: 2, feedback: "นั่นคือมวลของน้ำที่ถูกแทนที่ ($\\mathrm{kg}$) แรงลอยตัวคือ **น้ำหนัก** ของน้ำส่วนนั้น ต้องคูณ $g$" }
    solution: "$V = 2\\ \\mathrm{L} = 0.002\\ \\mathrm{m^3}$ · $F_B = \\rho V g = (1{,}000)(0.002)(9.8) = 19.6\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.press.p010
    topics: [physics.matter.pressure-fluids]
    difficulty: 5
    type: numeric
    stem: "ชั่งก้อนหินด้วยตาชั่งสปริงในอากาศอ่านได้ $30\\ \\mathrm{N}$ เมื่อหย่อนให้จมในน้ำทั้งก้อน (ไม่แตะก้นภาชนะ) อ่านได้ $18\\ \\mathrm{N}$ ก้อนหินมีความหนาแน่นเท่าใด ใช้ $\\rho$ ของน้ำ $= 1{,}000\\ \\mathrm{kg/m^3}$ และ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย kg/m³)"
    answer: { value: 2500, tolerance: 25, unit: kg/m³ }
    hints:
      - "น้ำหนักที่หายไปในน้ำคือแรงลอยตัว"
      - "จาก $F_B = \\rho_{\\text{น้ำ}} V g$ หาปริมาตรหิน $V$ และจาก $W = mg$ หามวลหิน"
      - "ความหนาแน่น = มวล ÷ ปริมาตร (หรือ $\\rho_{\\text{หิน}} = \\dfrac{W}{F_B} \\times \\rho_{\\text{น้ำ}}$)"
    misconceptions:
      - { match: 1667, feedback: "ดูเหมือนหารน้ำหนักในอากาศด้วยค่าที่อ่านได้ในน้ำ ($\\tfrac{30}{18}$) ต้องหารด้วยแรงลอยตัวคือน้ำหนักที่ **หายไป** $30 - 18 = 12\\ \\mathrm{N}$" }
      - { match: 1500, feedback: "ดูเหมือนใช้ค่าที่อ่านได้ในน้ำ ($18\\ \\mathrm{N}$) เป็นน้ำหนักหิน มวลของหินต้องหาจากน้ำหนักในอากาศ $30\\ \\mathrm{N}$" }
    solution: "$F_B = 30 - 18 = 12\\ \\mathrm{N}$ · $V = \\dfrac{F_B}{\\rho_{\\text{น้ำ}} g} = \\dfrac{12}{(1{,}000)(9.8)} \\approx 1.22 \\times 10^{-3}\\ \\mathrm{m^3}$ · $m = \\dfrac{30}{9.8} \\approx 3.06\\ \\mathrm{kg}$ · $\\rho = \\dfrac{m}{V} = \\dfrac{30}{12} \\times 1{,}000 = 2{,}500\\ \\mathrm{kg/m^3}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.press.p011
    topics: [physics.matter.pressure-fluids]
    difficulty: 4
    type: numeric
    stem: "ขอนไม้สักความหนาแน่น $600\\ \\mathrm{kg/m^3}$ ลอยอยู่ในแม่น้ำปิง (ถือว่าน้ำมี $\\rho = 1{,}000\\ \\mathrm{kg/m^3}$) ปริมาตรของขอนไม้ส่วนที่จมอยู่ใต้น้ำคิดเป็นร้อยละเท่าใดของปริมาตรทั้งหมด (ตอบเป็นตัวเลขในหน่วย %)"
    answer: { value: 60, tolerance: 0.5, unit: "%" }
    hints:
      - "วัตถุที่ลอยนิ่ง แรงลอยตัวเท่ากับน้ำหนักพอดี"
      - "$\\rho_{\\text{น้ำ}} V_{\\text{จม}} g = \\rho_{\\text{ไม้}} V g$ ค่า $g$ ตัดกันได้"
      - "สัดส่วนที่จม $\\dfrac{V_{\\text{จม}}}{V} = \\dfrac{\\rho_{\\text{ไม้}}}{\\rho_{\\text{น้ำ}}}$ แล้วคูณ 100"
    misconceptions:
      - { match: 40, feedback: "นั่นคือร้อยละของส่วนที่ **โผล่** พ้นน้ำ โจทย์ถามส่วนที่จม" }
