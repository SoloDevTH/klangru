problems:
- id: english.grammar.sentence-types.p001
  topics:
  - english.grammar.sentence-types
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นประโยค **simple** (ความเดียว)
  choices:
  - id: a
    text: My sister plays badminton every evening.
    correct: true
    feedback: ถูก มีอนุประโยคเดียว (ประธาน My sister กริยา plays)
  - id: b
    text: My sister plays badminton, and I play football.
    feedback: มีสองอนุประโยคหลักเชื่อมด้วย and เป็น compound
  - id: c
    text: My sister plays badminton because she loves it.
    feedback: มีอนุประโยคย่อย because ... เป็น complex
  - id: d
    text: My sister plays badminton when she finishes her homework.
    feedback: มีอนุประโยคย่อย when ... เป็น complex
  hints:
  - simple มีประธานกับกริยาชุดเดียว
  - หาประโยคที่ไม่มีคำเชื่อมอนุประโยคเลย
  solution: '***My sister plays badminton every evening.*** มีอนุประโยคเดียว ข้ออื่นมีสองอนุประโยค'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.sentence-types.p002
  topics:
  - english.grammar.sentence-types
  difficulty: 1
  type: mcq
  stem: '*I was very tired, but I finished my homework.* เป็นประโยคชนิดใด'
  choices:
  - id: a
    text: compound (ความรวม)
    correct: true
    feedback: ถูก สองอนุประโยคหลักที่ยืนเดี่ยวได้ เชื่อมด้วย but
  - id: b
    text: simple (ความเดียว)
    feedback: มีประธานและกริยาสองชุด (I was ... / I finished ...) จึงไม่ใช่ simple
  - id: c
    text: complex (ความซ้อน)
    feedback: but เชื่อมความเท่ากัน ทั้งสองส่วนยืนเดี่ยวได้ ไม่มีอนุประโยคย่อย
  hints:
  - แยกเป็นสองส่วนที่ but แล้วดูว่าแต่ละส่วนยืนเป็นประโยคเดี่ยวได้ไหม
  - and, but, or, so เชื่อมอนุประโยคที่เท่ากัน
  solution: '*I was very tired* และ *I finished my homework* ยืนเดี่ยวได้ทั้งคู่ เชื่อมด้วย but จึงเป็น **compound**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.sentence-types.p003
  topics:
  - english.grammar.sentence-types
  difficulty: 1
  type: text
  stem: 'เติม relative pronoun หนึ่งคำ: *The woman ___ sells som tam near our school is very friendly.*'
  accepted:
  - who
  - that
  misconceptions:
  - match: which
    feedback: which ใช้กับสิ่งของ the woman เป็นคน ใช้ who หรือ that
  - match: she
    feedback: ต้องใช้ relative pronoun เพื่อเชื่อมอนุประโยค ไม่ใช่สรรพนามธรรมดา
  - match: whom
    feedback: คำที่เติมเป็นประธานของ sells จึงใช้ who ไม่ใช่ whom
  hints:
  - คำนามข้างหน้าคือ the woman ซึ่งเป็นคน
  - คนใช้ who (หรือ that)
  solution: '*The woman **who** sells som tam near our school is very friendly.* (ใช้ that ก็ได้)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.sentence-types.p004
  topics:
  - english.grammar.sentence-types
  difficulty: 2
  type: text
  stem: 'เติม relative pronoun หนึ่งคำ: *Songkran is a festival ___ takes place in April.*'
  accepted:
  - which
  - that
  misconceptions:
  - match: who
    feedback: who ใช้กับคน festival เป็นสิ่ง ใช้ which หรือ that
  - match: it
    feedback: ต้องใช้ relative pronoun เชื่อม ไม่ใช่ it
  hints:
  - festival เป็นคนหรือสิ่ง
  - สิ่งของและเหตุการณ์ใช้ which หรือ that
  solution: '*Songkran is a festival **which** takes place in April.* (ใช้ that ก็ได้)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.sentence-types.p005
  topics:
  - english.grammar.sentence-types
  difficulty: 2
  type: match
  stem: จับคู่ต้นประโยคกับท้ายประโยคให้มีความหมายสมเหตุสมผล
  pairs:
  - left: We stayed at home
    right: because it was raining heavily.
  - left: Although the test was hard,
    right: most students passed it.
  - left: Take an umbrella
    right: if you go out this afternoon.
  - left: I waited at the bus stop
    right: until my dad came.
  hints:
  - อ่านความหมายของคำเชื่อม because (เพราะ), although (แม้ว่า), if (ถ้า), until (จนกระทั่ง)
  - ลองอ่านต่อกันทั้งประโยคแล้วดูว่าความหมายเข้ากันไหม
  solution: '*We stayed at home because it was raining heavily.* · *Although the test was hard, most students passed it.* · *Take an umbrella if you go out this afternoon.* · *I waited at the bus stop until my dad came.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.sentence-types.p006
  topics:
  - english.grammar.sentence-types
  difficulty: 2
  type: mcq
  stem: ข้อใดใส่จุลภาคถูกต้อง
  choices:
  - id: a
    text: It was very hot, so we went swimming.
    correct: true
    feedback: ถูก จุลภาควางหน้า so ที่เชื่อมสองอนุประโยคหลัก
  - id: b
    text: It was very hot so, we went swimming.
    feedback: จุลภาคต้องอยู่หน้า so ไม่ใช่หลัง
  - id: c
    text: It was, very hot so we went swimming.
    feedback: จุลภาคหลัง was แยกกริยาออกจากส่วนเติมเต็ม ผิดตำแหน่ง
  - id: d
    text: It was very hot, so, we went swimming.
    feedback: ไม่ต้องมีจุลภาคหลัง so
  hints:
  - ในประโยค compound จุลภาคอยู่หน้าคำเชื่อม
  - 'รูปแบบ: อนุประโยคหลัก + , so + อนุประโยคหลัก'
  solution: '***It was very hot, so we went swimming.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.sentence-types.p007
  topics:
  - english.grammar.sentence-types
  difficulty: 2
  type: mcq
  stem: 'คำเชื่อมใดทำให้ประโยคนี้เป็น **complex**: *I ate khanom krok ___ I was waiting for the bus.*'
  choices:
  - id: a
    text: while
    correct: true
    feedback: ถูก while นำอนุประโยคย่อยบอกเวลา จึงเป็น complex
  - id: b
    text: and
    feedback: and เชื่อมอนุประโยคที่เท่ากัน ได้ประโยค compound
  - id: c
    text: but
    feedback: but เชื่อมความเท่ากัน ได้ compound และความหมายก็ไม่ขัดกัน
  - id: d
    text: so
    feedback: so เชื่อมความเท่ากัน ได้ compound และไม่ใช่เหตุผล
  hints:
  - complex ใช้คำเชื่อมอนุประโยคย่อย เช่น because, when, while, although
  - and, but, or, so ให้ประโยค compound
  solution: '*I ate khanom krok **while** I was waiting for the bus.* while นำอนุประโยคย่อย จึงเป็น complex'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.sentence-types.p008
  topics:
  - english.grammar.sentence-types
  difficulty: 3
  type: text
  stem: 'รวมสองประโยคด้วย **who** แล้วพิมพ์ทั้งประโยค: *I have a friend. She lives in Chiang Rai.*'
  accepted:
  - I have a friend who lives in Chiang Rai.
  - I have a friend who lives in Chiang Rai
  - I have a friend that lives in Chiang Rai.
  - I have a friend that lives in Chiang Rai
  misconceptions:
  - match: I have a friend who she lives in Chiang Rai.
    feedback: who แทน she แล้ว ไม่ต้องใส่ she ซ้ำ
  - match: I have a friend which lives in Chiang Rai.
    feedback: a friend เป็นคน ใช้ who
  - match: I have a friend, she lives in Chiang Rai.
    feedback: นี่คือ comma splice ไม่ได้ใช้ who ตามโจทย์
  hints:
  - She หมายถึง a friend
  - เอา who มาแทน She แล้ววางต่อหลัง a friend ทันที
  solution: '***I have a friend who lives in Chiang Rai.*** (ใช้ that แทน who ก็ได้)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.sentence-types.p009
  topics:
  - english.grammar.sentence-types
  difficulty: 3
  type: mcq
  stem: 'ส่วนใดเป็น **dependent clause** (อนุประโยคย่อย): *Although the bus was late, we arrived on time.*'
  choices:
  - id: a
    text: Although the bus was late
    correct: true
    feedback: ถูก ขึ้นต้นด้วย Although ยืนเป็นประโยคเดี่ยวไม่ได้
  - id: b
    text: we arrived on time
    feedback: ส่วนนี้ยืนเดี่ยวได้ เป็นอนุประโยคหลัก
  - id: c
    text: the bus
    feedback: นี่เป็นแค่กลุ่มคำนาม ไม่มีกริยา จึงไม่ใช่ clause
  - id: d
    text: on time
    feedback: นี่เป็นวลีบอกเวลา ไม่มีประธานและกริยา
  hints:
  - clause ต้องมีประธานและกริยา
  - อนุประโยคย่อยขึ้นต้นด้วยคำเชื่อมเช่น although และยืนเดี่ยวไม่ได้
  solution: '***Although the bus was late*** เป็นอนุประโยคย่อย ส่วน *we arrived on time* เป็นอนุประโยคหลัก'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.sentence-types.p010
  topics:
  - english.grammar.sentence-types
  difficulty: 3
  type: order
  stem: เรียงเป็นประโยค complex ที่ถูกต้อง
  items:
  - When the rain stopped,
  - we
  - walked
  - to the floating market.
  hints:
  - ส่วนที่มีตัวพิมพ์ใหญ่และจุลภาคอยู่ต้นประโยค
  - 'หลังจุลภาคเป็นอนุประโยคหลัก: ประธาน + กริยา + ส่วนขยาย'
  solution: '*When the rain stopped, we walked to the floating market.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.sentence-types.p011
  topics:
  - english.grammar.sentence-types
  difficulty: 3
  type: mcq
  stem: ข้อใดถูกต้อง
  choices:
  - id: a
    text: I like durian, but my brother hates it.
    correct: true
    feedback: ถูก เชื่อมสองอนุประโยคหลักด้วย , but
  - id: b
    text: I like durian, my brother hates it.
    feedback: เชื่อมสองอนุประโยคหลักด้วยจุลภาคอย่างเดียวไม่ได้ (comma splice) ต้องมี but หรือขึ้นประโยคใหม่
  - id: c
    text: I like durian but, my brother hates it.
    feedback: จุลภาคต้องอยู่หน้า but
  - id: d
    text: Although I like durian, but my brother hates it.
    feedback: although กับ but ใช้คู่กันไม่ได้
  hints:
  - สองอนุประโยคหลักต้องมีคำเชื่อมหรือแยกเป็นสองประโยค
  - ระวังการใช้ although คู่กับ but แบบภาษาไทย
  solution: '***I like durian, but my brother hates it.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.sentence-types.p012
  topics:
  - english.grammar.sentence-types
  difficulty: 3
  type: text
  stem: 'เติมคำเชื่อมที่แปลว่า "แม้ว่า": *___ it was raining, the boys played football in the school field.*'
  accepted:
  - Although
  - Though
  - Even though
  misconceptions:
  - match: Because
    feedback: because บอกเหตุผล แต่ฝนตกไม่ใช่เหตุผลที่เล่นฟุตบอล ความหมายขัดกัน
  - match: But
    feedback: but เชื่อมความเท่ากันและไม่ขึ้นต้นอนุประโยคแบบนี้
  - match: Despite
    feedback: despite ตามด้วยคำนาม (despite the rain) ไม่ตามด้วยประโยค
  hints:
  - ฝนตก แต่ก็ยังเล่นฟุตบอล = ความขัดแย้ง
  - 'คำเชื่อมขัดแย้งที่ตามด้วยประโยค: although, though, even though'
  solution: '***Although** it was raining, the boys played football in the school field.* (ใช้ Though หรือ Even though ก็ได้)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.sentence-types.p013
  topics:
  - english.grammar.sentence-types
  difficulty: 3
  type: match
  stem: จับคู่อนุประโยคย่อยกับหน้าที่ของมัน
  pairs:
  - left: who lives next door
    right: ขยายคำนามที่เป็นคน
  - left: because she was ill
    right: บอกเหตุผล
  - left: although it was expensive
    right: บอกความขัดแย้ง
  - left: before the film started
    right: บอกเวลา
  hints:
  - ดูคำเชื่อมที่ขึ้นต้นแต่ละอนุประโยค
  - who = relative clause, because = เหตุผล, although = ขัดแย้ง, before = เวลา
  solution: who → ขยายคำนาม · because → เหตุผล · although → ขัดแย้ง · before → เวลา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.sentence-types.p014
  topics:
  - english.grammar.sentence-types
  difficulty: 4
  type: mcq
  stem: ข้อใดถูกต้องตามหลัก relative clause
  choices:
  - id: a
    text: The phone that I bought last week is broken.
    correct: true
    feedback: ถูก that แทนกรรม (the phone) แล้ว
  - id: b
    text: The phone that I bought it last week is broken.
    feedback: that แทน the phone แล้ว ใส่ it ซ้ำไม่ได้
  - id: c
    text: The phone who I bought last week is broken.
    feedback: who ใช้กับคน phone ใช้ which หรือ that
  - id: d
    text: The phone I bought it last week is broken.
    feedback: ละ that ได้ แต่ต้องไม่ใส่ it ซ้ำ
  hints:
  - relative pronoun ทำหน้าที่แทนคำนามในอนุประโยคแล้ว
  - ระวังการใส่สรรพนาม it ซ้ำ
  solution: '***The phone that I bought last week is broken.*** (หรือ *The phone I bought last week is broken.*)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.sentence-types.p015
  topics:
  - english.grammar.sentence-types
  difficulty: 4
  type: text
  stem: 'รวมสองประโยคโดยใช้ relative clause แล้วพิมพ์ทั้งประโยค: *The temple is very old. We visited it yesterday.* (ให้ประโยคขึ้นต้นด้วย The temple)'
  accepted:
  - The temple which we visited yesterday is very old.
  - The temple which we visited yesterday is very old
  - The temple that we visited yesterday is very old.
  - The temple that we visited yesterday is very old
  - The temple we visited yesterday is very old.
  - The temple we visited yesterday is very old
  misconceptions:
  - match: The temple which we visited it yesterday is very old.
    feedback: which แทน it แล้ว ไม่ต้องใส่ it ซ้ำ
  - match: The temple who we visited yesterday is very old.
    feedback: temple เป็นสิ่ง ใช้ which หรือ that
  - match: The temple is very old which we visited yesterday.
    feedback: relative clause ต้องอยู่ติดหลังคำนามที่ขยาย (the temple)
  hints:
  - it ในประโยคที่สองหมายถึง the temple
  - วาง which/that we visited yesterday ต่อหลัง The temple ทันที แล้วตามด้วย is very old
  solution: '***The temple which we visited yesterday is very old.*** (ใช้ that หรือละคำเชื่อมก็ได้ เพราะเป็นกรรมของ visited)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.sentence-types.p016
  topics:
  - english.grammar.sentence-types
  difficulty: 4
  type: mcq
  stem: 'อ่านย่อหน้าแล้วตอบ ประโยคใดบอก **ใจความสำคัญ** ของย่อหน้า


    *Although many tourists visit Damnoen Saduak Floating Market, it is still an important place for local people. Farmers who grow fruit nearby sell their produce there every morning. Some families have sold food from their boats for many years.*'
  choices:
  - id: a
    text: Although many tourists visit Damnoen Saduak Floating Market, it is still an important place for local people.
    correct: true
    feedback: ถูก อนุประโยคหลัก (it is still an important place for local people) คือใจความ ประโยคอื่นสนับสนุน
  - id: b
    text: Farmers who grow fruit nearby sell their produce there every morning.
    feedback: เป็นรายละเอียดสนับสนุนว่าคนท้องถิ่นใช้ตลาดอย่างไร
  - id: c
    text: Some families have sold food from their boats for many years.
    feedback: เป็นรายละเอียดสนับสนุนอีกข้อ
  - id: d
    text: Many tourists visit the market.
    feedback: เป็นแค่อนุประโยคย่อยที่ให้บริบท ไม่ใช่ใจความหลักของย่อหน้า
  hints:
  - ใจความสำคัญมักอยู่ในอนุประโยคหลัก ส่วน although ... เป็นบริบท
  - ประโยคไหนที่ประโยคอื่น ๆ ช่วยอธิบาย
  solution: ใจความคือตลาดยังสำคัญต่อคนท้องถิ่น ประโยคที่ 2 และ 3 ยกตัวอย่างสนับสนุน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.sentence-types.p017
  topics:
  - english.grammar.sentence-types
  difficulty: 4
  type: mcq
  stem: ข้อใดเป็นประโยค **simple** ทั้งที่มีประธานและกริยามากกว่าหนึ่งคำ
  choices:
  - id: a
    text: My mum and my aunt cook and sell khanom krok every morning.
    correct: true
    feedback: ถูก ประธานกลุ่มเดียว (my mum and my aunt) ทำกริยาชุดเดียว (cook and sell) ยังเป็นอนุประโยคเดียว
  - id: b
    text: My mum cooks khanom krok, and my aunt sells it.
    feedback: มีสองอนุประโยคหลัก (My mum cooks ... / my aunt sells ...) เป็น compound
  - id: c
    text: My mum cooks khanom krok which my aunt sells.
