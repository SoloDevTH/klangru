<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="sans-serif">
<title>จุดสมดุลสามแบบ ได้แก่ เสถียร ไม่เสถียร และสะเทิน แสดงด้วยลูกบอลบนพื้นโค้งและพื้นราบ</title>
<rect width="720" height="300" fill="#ffffff"/>
<text x="120.0" y="40.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">เสถียร (จุดต่ำสุดของ U)</text>
<path d="M 20 110 Q 120 240 220 110" fill="none" stroke="#334155" stroke-width="4"/>
<circle cx="120" cy="159" r="14" fill="#f97316" stroke="#7c2d12" stroke-width="2"/>
<text x="360.0" y="40.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">ไม่เสถียร (จุดสูงสุดของ U)</text>
<path d="M 260 210 Q 360 60 460 210" fill="none" stroke="#334155" stroke-width="4"/>
<circle cx="360" cy="119" r="14" fill="#f97316" stroke="#7c2d12" stroke-width="2"/>
<text x="600.0" y="40.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">สะเทิน (U คงที่)</text>
<path d="M 500 150 L 700 150" fill="none" stroke="#334155" stroke-width="4"/>
<circle cx="600" cy="134" r="14" fill="#f97316" stroke="#7c2d12" stroke-width="2"/>
<text x="360.0" y="284.0" text-anchor="middle" font-size="12" fill="#444" font-weight="normal">เมื่อถูกรบกวนเล็กน้อย ลูกบอลในกรณีเสถียรจะกลับสู่จุดเดิม ส่วนกรณีไม่เสถียรจะเคลื่อนที่ออกไป</text>
</svg>