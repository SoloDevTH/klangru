  - id: phy.wn.p013
    topics: [physics.dynamics.weight-normal]
    difficulty: 4
    type: mcq
    stem: "ในเครื่องเล่นทาวเวอร์ดรอปที่สวนสนุก ที่นั่งตกลงอย่างอิสระด้วยความเร่ง $g$ ระหว่างตก ตาชั่งที่ผูกไว้ใต้ตัวผู้เล่นจะอ่านค่าเท่าใด"
    choices:
      - { id: a, text: "ศูนย์", correct: true }
      - { id: b, text: "เท่ากับน้ำหนักปกติ $mg$", feedback: "ค่า $mg$ เกิดเมื่อไม่มีความเร่ง แต่ที่นี่ทั้งคนและตาชั่งตกด้วยความเร่ง $g$ พร้อมกัน ตาชั่งจึงไม่ต้องดันคนเลย" }
      - { id: c, text: "มากกว่า $mg$ เพราะกำลังตกเร็วขึ้น", feedback: "การตกเร็วขึ้นคือความเร่งทิศลง ซึ่งทำให้ตาชั่งอ่านค่า **น้อยลง** ไม่ใช่มากขึ้น" }
      - { id: d, text: "เป็นลบ", feedback: "ตาชั่งดันได้อย่างเดียว ดึงไม่ได้ ค่าที่อ่านจึงต่ำสุดเป็นศูนย์ จาก $N = m(g + a)$ เมื่อ $a = -g$ ได้ $N = 0$ พอดี" }
    hints:
      - "ใช้ $N = m(g + a)$ โดยให้ทิศขึ้นเป็นบวก"
      - "ตกอิสระแปลว่า $a = -g$"
    solution: "$N = m(g + a) = m(g - g) = 0$ ผู้เล่นรู้สึกเหมือนไร้น้ำหนัก แม้แรงโน้มถ่วงยังกระทำอยู่เต็มที่ (น้ำหนักจริงยังเป็น $mg$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.wn.p014
    topics: [physics.dynamics.weight-normal]
