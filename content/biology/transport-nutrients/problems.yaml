    solution: "อาการขอบใบแก่ไหม้และผลไม่หวานเป็นอาการขาดโพแทสเซียม ซึ่งช่วยลำเลียงน้ำตาลไปสะสมในผล สูตร 13-13-21 มีโพแทสเซียมสูงที่สุดในภาพ"
