# หัวข้อในคลังที่สอนเนื้อหาสาระสำคัญ (ข้อ ๘) หรือผลลัพธ์การเรียนรู้ (ข้อ ๕) ของ มคอ.1 สาขาวิชาการบัญชี พ.ศ. 2562 บางส่วน
# ทุกแถวเป็น partial เพราะ มคอ.1 อธิบายเนื้อหาระดับปริญญาตรีทั้งกลุ่ม หัวข้อในคลังเป็นเพียงจุดเริ่มต้นของกลุ่มนั้น
framework: th-tqf-accounting
mappings:
  - topic: business.accounting.equation
    indicators: ["8.1.1"]
    coverage: partial
    note: "สมการบัญชี ผลของรายการค้า และงบกำไรขาดทุนอย่างง่าย ยังไม่มีมาตรฐานการรายงานทางการเงิน การบันทึกบัญชีคู่ งบแสดงฐานะการเงินฉบับเต็ม งบการเงินรวม และการเปิดเผยข้อมูล"
  - topic: business.finance.break-even
    indicators: ["8.1.2", "5.2.3"]
    coverage: partial
    note: "8.1.2: พฤติกรรมต้นทุน (คงที่/ผันแปร) และการวิเคราะห์ต้นทุน-ปริมาณ-กำไรเพื่อการตัดสินใจ ยังไม่มีต้นทุนผลิตภัณฑ์ งบประมาณ การวิเคราะห์ผลต่าง 5.2.3: ใช้สมการและกราฟเส้นตรงแก้ปัญหาธุรกิจ ยังไม่มีสถิติ"
  - topic: management.principles.functions
    indicators: ["8.2.3"]
    coverage: partial
    note: "หน้าที่ของการจัดการ การจัดรูปแบบองค์กร (แผนผังองค์การ) และรูปแบบการเป็นเจ้าของธุรกิจ ยังไม่มีกลยุทธ์และพฤติกรรมองค์กร"
  - topic: business.accounting.double-entry
    indicators: [8.1.1]
    coverage: partial
    note: "หลักการบัญชีส่วนการบันทึกรายการค้า: ผังบัญชี เดบิตเครดิต สมุดรายวันทั่วไป บัญชีแยกประเภท งบทดลอง และข้อผิดพลาดที่งบทดลองหาไม่พบ ยังไม่มีมาตรฐานการรายงาน งบการเงิน (อยู่ใน business.accounting.financial-statements) งบการเงินรวม และการเปิดเผยข้อมูล"
  - topic: business.accounting.financial-statements
    indicators: [8.1.1]
    coverage: partial
    note: เกณฑ์คงค้าง รายการปรับปรุง (ค่าเสื่อมราคาเส้นตรง ค่าใช้จ่ายค้างจ่าย รายได้รับล่วงหน้า) ต้นทุนขายแบบสิ้นงวด การจัดทำงบแสดงฐานะการเงิน งบกำไรขาดทุน งบแสดงการเปลี่ยนแปลงส่วนของเจ้าของ งบกระแสเงินสดอย่างง่าย ความเชื่อมโยงของงบ และขอบเขตของ TFRS for NPAEs กับ TFRS ฉบับเต็ม ยังไม่มีงบการเงินรวม นโยบายการบัญชีและการเปิดเผยข้อมูลในหมายเหตุ รายงานความยั่งยืนและรายงานฉบับบูรณาการ
  - topic: business.ethics.business-ethics
    indicators: [5.1.1]
    coverage: full
    note: หลักการพื้นฐาน 6 ข้อและอุปสรรค 5 ประเภทตามคู่มือประมวลจรรยาบรรณของผู้ประกอบวิชาชีพบัญชี (ฉบับแปลของสภาวิชาชีพบัญชีฯ 2564) ความขัดแย้งทางผลประโยชน์ และจริยธรรมกับกฎหมาย
  - topic: business.ethics.business-ethics
    indicators: [5.1.2, 5.1.3]
    coverage: partial
    note: ขั้นตอนตัดสินใจเชิงจริยธรรมและกรณีศึกษา (เลื่อนบันทึกค่าใช้จ่าย รับรู้รายได้ก่อนงวด ของขวัญจากผู้ขาย ถูกข่มขู่) ฝึกได้ในรูปตัวเลือก การแก้ปัญหาในการปฏิบัติงานจริงต้องฝึกนอกแอป
  - topic: business.stats.descriptive
    indicators: [5.2.3, 5.3.1]
    coverage: partial
    note: ใช้สถิติเชิงพรรณนากับข้อมูลธุรกิจ (ยอดขายเฉลี่ยต่อบิล มัธยฐานเมื่อมีค่าผิดปกติ CV ร้อยละการเปลี่ยนแปลง ดัชนีราคาแบบรวมถ่วงน้ำหนัก ยอดขายที่แท้จริง) ยังไม่มีสถิติอนุมานและการพยากรณ์ (business.stats.forecasting)
  - topic: management.principles.organizing
    indicators: [8.2.3]
    coverage: partial
    note: สอนวิธีออกแบบและจัดรูปแบบองค์กรและหน้าที่ภายในองค์กร ส่วนปัจจัยที่มีผลต่อกลยุทธ์ การดำเนินกลยุทธ์ และพฤติกรรมองค์กรอยู่ใน strategic-management และ organizational-behavior
