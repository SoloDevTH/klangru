- id: thai.listening.instructions-retelling.p015
  topics:
  - thai.listening.instructions-retelling
  difficulty: 5
  type: mcq
  stem: 'นิทานที่ฟัง: *ราชสีห์ตัวหนึ่งจับหนูได้ หนูอ้อนวอนขอชีวิตและสัญญาว่าจะตอบแทนบุญคุณ ราชสีห์หัวเราะ แต่ก็ปล่อยหนูไป หลายวันต่อมา ราชสีห์ติดบ่วงของนายพราน ดิ้นเท่าไรก็ไม่หลุด หนูได้ยินเสียงร้องจึงวิ่งมากัดเชือกจนขาด ราชสีห์จึงรอดชีวิต*


    ข้อใดเป็น **เรื่องย่อ** ที่ดีที่สุด'
  choices:
  - id: a
    text: ราชสีห์ปล่อยหนูที่จับได้ ต่อมาราชสีห์ติดบ่วงนายพราน หนูจึงกัดเชือกช่วยจนรอด
    correct: true
    feedback: ถูก สั้น เรียงลำดับ ต้น กลาง จบ ใช้ภาษาของเราเอง ไม่มีความเห็น
  - id: b
    text: หนูช่วยราชสีห์ที่ติดบ่วง ราชสีห์จึงปล่อยหนูไป
    feedback: ลำดับกลับกัน ราชสีห์ปล่อยหนูก่อน แล้วหนูจึงช่วยราชสีห์ทีหลัง
  - id: c
    text: ราชสีห์ใจดีมาก ส่วนนายพรานใจร้ายที่ดักสัตว์ หนูเก่งที่สุด
    feedback: เป็นความเห็นของผู้เล่า ไม่ได้เล่าเหตุการณ์
  - id: d
    text: ราชสีห์ตัวหนึ่งจับหนูได้ หนูอ้อนวอนขอชีวิตและสัญญาว่าจะตอบแทนบุญคุณ ราชสีห์หัวเราะ แต่ก็ปล่อยหนูไป หลายวันต่อมาราชสีห์ติดบ่วงของนายพราน ดิ้นเท่าไรก็ไม่หลุด หนูได้ยินเสียงร้องจึงวิ่งมากัดเชือกจนขาด
    feedback: เกือบเท่าเรื่องเดิมทุกคำ เรื่องย่อต้องสั้นและใช้ภาษาของเราเอง
  hints:
  - 'เรื่องย่อดี: สั้น เรียงลำดับ ภาษาของเรา ไม่มีความเห็น'
  - ตัดตัวเลือกที่ลำดับผิด ยาวเกิน หรือมีความเห็น
  solution: เรื่องย่อที่ดีคือ **ราชสีห์ปล่อยหนู ต่อมาติดบ่วง หนูกัดเชือกช่วยจนรอด** สั้นและครบ ต้น กลาง จบ
