<text x="689.8" y="181.0" text-anchor="middle" font-size="13" fill="#222">และวิเคราะห์ความเป็นไปได้</text>
<rect x="584.8" y="285.0" width="210.0" height="60.0" rx="10" fill="#f7f7f7" stroke="#b26a00" stroke-width="2"/>
<text x="689.8" y="310.0" text-anchor="middle" font-size="14" fill="#b26a00" font-weight="bold">3 ตัดสินใจ</text>
<text x="689.8" y="331.0" text-anchor="middle" font-size="13" fill="#222">รับรองนโยบาย</text>
<rect x="325.0" y="360.0" width="210.0" height="60.0" rx="10" fill="#f7f7f7" stroke="#7b1fa2" stroke-width="2"/>
<text x="430.0" y="385.0" text-anchor="middle" font-size="14" fill="#7b1fa2" font-weight="bold">4 นำนโยบาย</text>
<text x="430.0" y="406.0" text-anchor="middle" font-size="13" fill="#222">ไปปฏิบัติ</text>
<rect x="65.2" y="285.0" width="210.0" height="60.0" rx="10" fill="#f7f7f7" stroke="#c62828" stroke-width="2"/>
<text x="170.2" y="310.0" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">5 ติดตามและ</text>
<text x="170.2" y="331.0" text-anchor="middle" font-size="13" fill="#222">ประเมินผลกระทบ</text>
<rect x="65.2" y="135.0" width="210.0" height="60.0" rx="10" fill="#f7f7f7" stroke="#00695c" stroke-width="2"/>
<text x="170.2" y="160.0" text-anchor="middle" font-size="14" fill="#00695c" font-weight="bold">6 ปรับปรุง ขยาย</text>
<text x="170.2" y="181.0" text-anchor="middle" font-size="13" fill="#222">หรือยุติ</text>
