problems:
- id: science.inquiry.data-analysis.p001
  topics:
  - science.inquiry.data-analysis
  difficulty: 1
  type: mcq
  stem: การบันทึกผลการทดลองในตาราง คอลัมน์แรกควรเป็นอะไร
  choices:
  - id: a
    text: ตัวแปรต้น เรียงจากน้อยไปมาก
    correct: true
  - id: b
    text: ตัวแปรตาม
    feedback: ตัวแปรตามอยู่คอลัมน์ถัดไป เพราะเป็นผลที่เกิดตามตัวแปรต้น
  - id: c
    text: ค่าเฉลี่ย
    feedback: ค่าเฉลี่ยมักอยู่คอลัมน์สุดท้าย หลังผลการทำซ้ำ
  - id: d
    text: ชื่อคนที่ทดลอง
    feedback: ไม่ใช่ข้อมูลที่ใช้วิเคราะห์ผล
  hints:
  - สิ่งที่เราเลือกค่าเองมาก่อน
  - ผลที่วัดได้ตามมาทีหลัง
  solution: คอลัมน์แรกเป็นตัวแปรต้นเรียงจากน้อยไปมาก ตามด้วยตัวแปรตามของการทำซ้ำแต่ละครั้ง และค่าเฉลี่ย หัวคอลัมน์ทุกช่องมีหน่วย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.data-analysis.p002
  topics:
  - science.inquiry.data-analysis
  difficulty: 1
  type: numeric
  stem: วัดความสูงที่ลูกปิงปองเด้ง 3 ครั้งได้ 29, 28 และ 30 cm ค่าเฉลี่ยเท่าใด
  answer:
    value: 29
    unit: cm
  misconceptions:
  - match: 87
    feedback: นี่คือผลรวม ยังไม่ได้หารด้วยจำนวนครั้ง
  - match: 43.5
    feedback: หารด้วย 2 แต่มี 3 ค่า
  hints:
  - ค่าเฉลี่ย = ผลรวม ÷ จำนวนค่า
  - มี 3 ค่า
  solution: $\frac{29 + 28 + 30}{3} = \frac{87}{3} = 29$ cm
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.data-analysis.p003
  topics:
  - science.inquiry.data-analysis
  difficulty: 2
  type: numeric
  stem: วัดความสูงที่ลูกปิงปองเด้งได้ 72, 71 และ 73 cm **พิสัย** ของข้อมูลชุดนี้เท่าใด
  answer:
    value: 2
    unit: cm
  misconceptions:
  - match: 72
    feedback: นี่คือค่าเฉลี่ย ไม่ใช่พิสัย
  - match: 1
    feedback: ลบค่าที่อยู่ติดกัน ต้องใช้ค่ามากที่สุดลบค่าน้อยที่สุด
  hints:
  - พิสัย = ค่ามากที่สุด − ค่าน้อยที่สุด
  - ค่ามากที่สุดคือ 73
  solution: $73 - 71 = 2$ cm พิสัยเล็กแสดงว่าวัดซ้ำได้ผลใกล้กัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.data-analysis.p004
  topics:
  - science.inquiry.data-analysis
  difficulty: 2
  type: mcq
  stem: 'ผลการปล่อยลูกปิงปอง (ความสูงที่เด้ง cm 3 ครั้ง) ปล่อย 40 cm: 29, 28, 30 ปล่อย 60 cm: 43, 44, 42 ปล่อย 80 cm: 57, 58, 41 ปล่อย 100 cm: 72, 71, 73 ค่าใดเป็น **ค่าผิดปกติ**'
  choices:
  - id: a
    text: 41 ที่ความสูง 80 cm
    correct: true
  - id: b
    text: 28 ที่ความสูง 40 cm
    feedback: 28 ใกล้กับ 29 และ 30 จึงไม่ผิดปกติ
  - id: c
    text: 73 ที่ความสูง 100 cm
    feedback: 73 เป็นค่าสูงสุดในแถว แต่ห่างจากค่าอื่นเพียง 1–2 cm
  - id: d
    text: ไม่มีค่าผิดปกติ
    feedback: ที่ 80 cm ค่าหนึ่งห่างจากอีกสองค่ามากกว่า 15 cm
  hints:
  - เทียบค่าในแถวเดียวกัน
  - ค่าผิดปกติห่างจากค่าอื่นในแถวมาก หรือไม่เข้ากับแนวโน้ม
  solution: ที่ 80 cm ค่า 57 กับ 58 ใกล้กัน แต่ 41 ต่ำกว่ามากและต่ำกว่าค่าที่ 60 cm ด้วย จึงเป็นค่าผิดปกติ ควรวัดใหม่หรือไม่นำมาเฉลี่ย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.data-analysis.p005
  topics:
  - science.inquiry.data-analysis
  difficulty: 2
  type: mcq
  stem: นักเรียนนับแมลงที่พบในแปลงผัก สนามหญ้า สวนดอกไม้ และใต้ต้นมะม่วงในโรงเรียน ควรนำเสนอด้วยแผนภูมิแบบใด
  choices:
  - id: a
    text: แผนภูมิแท่ง
    correct: true
  - id: b
    text: กราฟเส้นที่ลากต่อจุด
    feedback: สถานที่เป็นกลุ่ม ไม่มีค่าระหว่างกลาง จึงไม่ควรลากเส้นต่อ
  - id: c
    text: กราฟจุดกับเส้นแนวโน้ม
    feedback: ใช้เมื่อตัวแปรต้นเป็นตัวเลขต่อเนื่อง
  - id: d
    text: ไม่ต้องเขียนกราฟ
    feedback: แผนภูมิช่วยให้เปรียบเทียบได้เร็วกว่าตัวเลขในตาราง
  hints:
  - ตัวแปรต้นเป็นตัวเลขหรือเป็นกลุ่ม
  - สถานที่เป็นข้อมูลแบบกลุ่ม
  solution: ตัวแปรต้นคือสถานที่ซึ่งเป็นกลุ่ม จึงใช้แผนภูมิแท่ง ส่วนข้อมูลที่ตัวแปรต้นเป็นตัวเลขต่อเนื่อง เช่น อุณหภูมิ ใช้กราฟจุดและเส้นแนวโน้ม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.data-analysis.p006
  topics:
  - science.inquiry.data-analysis
  difficulty: 2
  type: match
  stem: จับคู่ข้อความกับชนิดของความสัมพันธ์
  pairs:
  - left: ยิ่งปล่อยสูง ลูกบอลยิ่งเด้งสูง
    right: ความสัมพันธ์เชิงบวก
  - left: ยิ่งน้ำร้อน น้ำตาลยิ่งใช้เวลาละลายน้อยลง
    right: ความสัมพันธ์เชิงลบ
  - left: เลขที่บ้านกับส่วนสูงของนักเรียน
    right: ไม่มีความสัมพันธ์
  - left: ซื้อดินสอ 2 แท่งจ่าย 10 บาท 4 แท่งจ่าย 20 บาท
    right: แปรผันตรง
  hints:
  - ดูว่าเมื่อค่าหนึ่งเพิ่ม อีกค่าเพิ่มหรือลด
  - แปรผันตรงคืออัตราส่วนคงที่และเริ่มจากศูนย์
  solution: เพิ่มด้วยกันคือเชิงบวก เพิ่มอีกค่าลดคือเชิงลบ ไม่เป็นแบบรูปคือไม่มีความสัมพันธ์ และอัตราส่วนคงที่ผ่านจุดกำเนิดคือแปรผันตรง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.data-analysis.p007
  topics:
  - science.inquiry.data-analysis
  difficulty: 3
  type: numeric
  stem: ที่ความสูงปล่อย 80 cm วัดความสูงที่เด้งได้ 57, 58 และ 41 cm ถ้า 41 เป็นค่าผิดปกติ ค่าเฉลี่ยที่ควรรายงานเท่าใด
  answer:
    value: 57.5
    tolerance: 0.1
    unit: cm
  misconceptions:
  - match: 52
    feedback: รวมค่าผิดปกติ 41 ทำให้ค่าเฉลี่ยต่ำเกินจริง
  - match: 38.33
    feedback: รวม 57 + 58 แล้วหารด้วย 3
  hints:
  - ไม่นำค่าผิดปกติมาคิด
  - เฉลี่ยเฉพาะ 57 กับ 58
  solution: $\frac{57 + 58}{2} = 57.5$ cm และเขียนในรายงานว่าตัดค่า 41 ออกเพราะห่างจากค่าอื่นมาก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.data-analysis.p008
  topics:
  - science.inquiry.data-analysis
  difficulty: 3
  type: numeric
  stem: จากกราฟ ประมาณเวลาที่น้ำตาลละลายหมดเมื่อน้ำมีอุณหภูมิ 45 °C
  answer:
    value: 60
    tolerance: 3
    unit: s
  misconceptions:
  - match: 45
    feedback: นำอุณหภูมิมาตอบ ต้องอ่านค่าบนแกนตั้ง
  - match: 16
    feedback: นี่คือผลต่างของเวลาระหว่าง 40 °C กับ 50 °C
  hints:
  - 45 °C อยู่ระหว่างจุด 40 °C กับ 50 °C
  - อ่านค่าบนเส้นที่อยู่กึ่งกลางระหว่างสองจุดนั้น
  solution: ที่ 40 °C ใช้ 68 s และที่ 50 °C ใช้ 52 s ค่ากึ่งกลางประมาณ $\frac{68 + 52}{2} = 60$ s นี่คือการประมาณ **ภายในช่วงข้อมูล** จึงค่อนข้างเชื่อถือได้
  figure:
    src: dissolve.svg
    alt: กราฟเส้นเวลาที่น้ำตาล 1 ช้อนชาละลายหมดในน้ำ 100 mL (ข้อมูลสมมติ) แกนนอนอุณหภูมิของน้ำ องศาเซลเซียส แกนตั้งเวลา วินาที จุดข้อมูล 20 °C 120 s, 30 °C 90 s, 40 °C 68 s, 50 °C 52 s, 60 °C 40 s ต่อจุดด้วยเส้น เส้นลาดลงและค่อย ๆ ชันน้อยลง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.data-analysis.p009
  topics:
  - science.inquiry.data-analysis
  difficulty: 3
  type: mcq
  stem: ข้อใดบรรยายแนวโน้มของกราฟได้ถูกต้องและครบที่สุด
  choices:
  - id: a
    text: เมื่ออุณหภูมิสูงขึ้น เวลาที่ละลายหมดลดลง และลดลงช้าลงเมื่ออุณหภูมิสูง
    correct: true
  - id: b
    text: เมื่ออุณหภูมิสูงขึ้น เวลาที่ละลายหมดเพิ่มขึ้น
    feedback: เส้นลาดลง แปลว่าเวลาลดลง
  - id: c
    text: เวลาลดลงเท่ากันทุก 10 °C
    feedback: ลดลง 30, 22, 16, 12 s ไม่เท่ากัน
  - id: d
    text: อุณหภูมิไม่มีผลต่อการละลาย
    feedback: เวลาลดลงจาก 120 เหลือ 40 s แสดงว่ามีผลชัดเจน
  hints:
  - ดูทิศทางของเส้นก่อน
  - แล้วดูว่าระยะที่ลดลงในแต่ละช่วงเท่ากันหรือไม่
  solution: ความสัมพันธ์เชิงลบ เวลาลดลง 30, 22, 16 และ 12 s ในแต่ละช่วง 10 °C จึงลดลงช้าลงเรื่อย ๆ กราฟเป็นเส้นโค้ง ไม่ใช่เส้นตรง
  figure:
    src: dissolve.svg
    alt: กราฟเส้นเวลาที่น้ำตาล 1 ช้อนชาละลายหมดในน้ำ 100 mL (ข้อมูลสมมติ) แกนนอนอุณหภูมิของน้ำ องศาเซลเซียส แกนตั้งเวลา วินาที จุดข้อมูล 20 °C 120 s, 30 °C 90 s, 40 °C 68 s, 50 °C 52 s, 60 °C 40 s ต่อจุดด้วยเส้น เส้นลาดลงและค่อย ๆ ชันน้อยลง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.data-analysis.p010
  topics:
  - science.inquiry.data-analysis
  difficulty: 3
  type: numeric
  stem: รถของเล่นวิ่งได้ 1.5 m ในเวลา 2.5 s อัตราเร็วเฉลี่ยเท่าใด (ตอบหน่วย m/s)
  answer:
    value: 0.6
    tolerance: 0.01
    unit: m/s
  misconceptions:
  - match: 1.67
    feedback: หารกลับด้าน (เวลา ÷ ระยะทาง)
  - match: 3.75
    feedback: คูณระยะทางกับเวลา ต้องหาร
  hints:
  - อัตราเร็ว = ระยะทาง ÷ เวลา
  - 1.5 ÷ 2.5
  solution: $v = \frac{1.5\,\mathrm{m}}{2.5\,\mathrm{s}} = 0.6\,\mathrm{m/s}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.data-analysis.p011
  topics:
  - science.inquiry.data-analysis
  difficulty: 3
  type: order
  stem: เรียงขั้นตอนการจัดกระทำและวิเคราะห์ข้อมูลหลังการทดลอง
  items:
  - บันทึกผลดิบลงตารางพร้อมหน่วย
  - ตรวจหาค่าผิดปกติแล้วหาค่าเฉลี่ย
  - เขียนกราฟให้เหมาะกับชนิดข้อมูล
  - บรรยายแบบรูปและแนวโน้ม
  - สรุปเทียบกับการคาดคะเนและตั้งคำถามใหม่
  hints:
  - ต้องมีตัวเลขในตารางก่อนจึงหาค่าเฉลี่ยได้
  - สรุปผลเป็นขั้นสุดท้าย
  solution: ตาราง → ค่าผิดปกติและค่าเฉลี่ย → กราฟ → แบบรูป → ข้อสรุปและคำถามใหม่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.data-analysis.p012
  topics:
  - science.inquiry.data-analysis
  difficulty: 4
  type: numeric
  stem: จากกราฟ ลูกปิงปองเด้งได้ประมาณ 0.72 เท่าของความสูงที่ปล่อย ถ้าปล่อยจาก 120 cm คาดว่าจะเด้งสูงประมาณกี่ cm
  answer:
    value: 86.4
    tolerance: 1.5
    unit: cm
  misconceptions:
  - match: 166.67
    feedback: หาร 120 ด้วย 0.72 ต้องคูณ
  - match: 92
    feedback: บวก 72 + 20 ตามช่วงห่างของข้อมูล แต่ความสัมพันธ์เป็นอัตราส่วน ไม่ใช่การบวกเท่ากัน
  hints:
  - ใช้อัตราส่วน 0.72 จากเส้นแนวโน้ม
  - คูณ 0.72 กับความสูงที่ปล่อย
  solution: $0.72 \times 120 = 86.4$ cm แต่ 120 cm อยู่นอกช่วงที่วัด (20–100 cm) จึงเป็นการคาดการณ์ ควรทดลองยืนยัน
  figure:
    src: bounce-graph.svg
    alt: กราฟจุดความสูงที่ลูกปิงปองเด้งเฉลี่ยกับความสูงที่ปล่อย จุด (20, 14.3) (40, 29) (60, 43) (80, 57.5) (100, 72) เรียงเกือบเป็นเส้นตรงผ่านจุดกำเนิด เส้นแนวโน้มสีน้ำเงิน เด้ง ≈ 0.72 × ความสูงที่ปล่อย มีจุดวงกลมสีแดงที่ (80, 41) ระบุว่าเป็นค่าผิดปกติ ไม่นำมาเฉลี่ย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.data-analysis.p013
  topics:
  - science.inquiry.data-analysis
  difficulty: 4
  type: numeric
  stem: ต้นกล้าข้าวสูง 12 cm หลังใส่ปุ๋ยหมัก 1 สัปดาห์สูง 15 cm ความสูงเพิ่มขึ้นกี่เปอร์เซ็นต์
  answer:
    value: 25
    unit: '%'
  misconceptions:
  - match: 20
    feedback: หารด้วยค่าใหม่ 15 ต้องหารด้วยค่าเดิม 12
  - match: 3
    feedback: นี่คือความสูงที่เพิ่มเป็นเซนติเมตร ยังไม่ได้เทียบเป็นร้อยละ
  hints:
  - ร้อยละการเปลี่ยนแปลง = (ค่าใหม่ − ค่าเดิม) ÷ ค่าเดิม × 100
  - ค่าเดิมคือ 12 cm
  solution: $\frac{15 - 12}{12} \times 100 = 25\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: science.inquiry.data-analysis.p014
  topics:
  - science.inquiry.data-analysis
  difficulty: 4
  type: mcq
  stem: นิดคาดว่า "เมล็ดถั่วเขียวในน้ำเกลือเข้มข้นมากจะงอกน้อยลง" ผลการทดลอง (100 เมล็ดต่อชุด) น้ำเปล่างอก 92 เมล็ด เกลือ 1% งอก 85 เกลือ 2% งอก 61 เกลือ 4% งอก 12 ข้อสรุปใดเหมาะสมที่สุด
  choices:
  - id: a
    text: ยิ่งน้ำเกลือเข้มข้น ร้อยละการงอกยิ่งลดลง ตรงกับการคาดคะเน ควรทำซ้ำและทดลองความเข้มข้นระหว่าง 2–4% เพิ่ม
    correct: true
  - id: b
    text: เกลือทำให้ถั่วเขียวตายทุกเมล็ด
    feedback: แม้ที่ 4% ยังงอก 12% สรุปเกินข้อมูล
  - id: c
    text: การคาดคะเนผิด เพราะชุดเกลือ 1% ยังงอกเกินครึ่ง
    feedback: แนวโน้มลดลงตามความเข้มข้น ตรงกับการคาดคะเน
  - id: d
