    solution: "$20.1 + 30.1 + 15.05 = 65.25\\ \\mathrm{mm}$ ความยาวรวมอยู่ในช่วง $65 \\pm 0.25$ ซึ่งกว้างกว่าพิกัดของแต่ละช่วง ถ้าความยาวรวมสำคัญ ควรกำหนดขนาดรวมจากผิวอ้างอิงโดยตรง"
