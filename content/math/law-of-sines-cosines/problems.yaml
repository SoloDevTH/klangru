  - id: math.geometry.law-of-sines-cosines.p014
    topics: [math.geometry.law-of-sines-cosines]
    difficulty: 3
    type: mcq
    stem: "สามเหลี่ยมมีด้านยาว 5, 6 และ 8 หน่วย เป็นสามเหลี่ยมชนิดใด"
    choices:
      - { id: a, text: "สามเหลี่ยมมุมป้าน", correct: true }
      - { id: b, text: "สามเหลี่ยมมุมฉาก", feedback: "$5^2 + 6^2 = 61 \\ne 64 = 8^2$ จึงไม่ใช่มุมฉาก" }
      - { id: c, text: "สามเหลี่ยมมุมแหลม", feedback: "มุมที่ใหญ่ที่สุดมี $\\cos = \\tfrac{25 + 36 - 64}{60} = -0.05 < 0$ จึงเป็นมุมป้าน" }
      - { id: d, text: "สร้างสามเหลี่ยมไม่ได้", feedback: "$5 + 6 = 11 > 8$ จึงสร้างได้" }
    hints:
      - "ตรวจมุมที่ใหญ่ที่สุด ซึ่งอยู่ตรงข้ามด้านยาว 8"
      - "หา $\\cos$ ของมุมนั้นด้วยกฎของโคไซน์ แล้วดูเครื่องหมาย"
    solution: "$\\cos C = \\dfrac{5^2 + 6^2 - 8^2}{2(5)(6)} = \\dfrac{-3}{60} = -0.05$ โคไซน์เป็นลบ มุม $C \\approx 92.9°$ เป็นมุมป้าน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.law-of-sines-cosines.p015
    topics: [math.geometry.law-of-sines-cosines]
    difficulty: 5
    type: numeric
    stem: "เรือประมงออกจากท่าเรือสัตหีบ แล่นไป 12 กม. ในทิศแบริง 040° แล้วเปลี่ยนไปแล่นในทิศแบริง 100° อีก 9 กม. ตอนนี้เรืออยู่ห่างจากท่าเรือกี่กิโลเมตร (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 18.25, tolerance: 0.1, unit: กม. }
    hints:
      - "เรือเลี้ยวขวา $100° - 40° = 60°$ มุมภายในของสามเหลี่ยมที่จุดเลี้ยวจึงเป็น $180° - 60° = 120°$"
      - "$d^2 = 12^2 + 9^2 - 2(12)(9)\\cos 120°$"
    misconceptions:
      - { match: 10.82, feedback: "ใช้มุม 60° (มุมที่เลี้ยว) เป็นมุมภายใน มุมภายในที่จุดเลี้ยวคือ 120°" }
      - { match: 21, feedback: "บวกระยะทาง 12 + 9 ได้ระยะที่เรือแล่น ไม่ใช่ระยะห่างจากท่าเรือ" }
    solution: "มุมภายในที่จุดเลี้ยว $= 120°$ $d^2 = 144 + 81 - 216\\left(-\\tfrac12\\right) = 333$ ได้ $d \\approx 18.25$ กม."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.law-of-sines-cosines.p016
    topics: [math.geometry.law-of-sines-cosines]
    difficulty: 3
    type: numeric
    stem: "สามเหลี่ยม ABC มีพื้นที่ 30 ตร.ซม. ด้าน $a = 10$ ซม. และ $C = 30°$ จงหาความยาวด้าน $b$"
    answer: { value: 12, unit: ซม. }
    hints:
      - "พื้นที่ $= \\tfrac12 ab\\sin C$"
      - "$30 = \\tfrac12(10)(b)\\left(\\tfrac12\\right)$"
    misconceptions:
      - { match: 6, feedback: "ลืม $\\tfrac12$ หน้าสูตร (หรือลืมคูณ $\\sin 30°$) ได้ $30 = 5b$" }
    solution: "$30 = \\tfrac12 \\times 10 \\times b \\times \\tfrac12 = 2.5b$ ได้ $b = 12$ ซม."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.law-of-sines-cosines.p017
    topics: [math.geometry.law-of-sines-cosines]
    difficulty: 4
    type: numeric
    stem: "สามเหลี่ยมมีด้านยาว 7, 8 และ 13 หน่วย มุมที่ใหญ่ที่สุดมีขนาดกี่องศา"
    answer: { value: 120, tolerance: 0.5, unit: องศา }
    hints:
      - "มุมที่ใหญ่ที่สุดอยู่ตรงข้ามด้านที่ยาวที่สุด 13"
      - "$\\cos C = \\dfrac{7^2 + 8^2 - 13^2}{2(7)(8)}$"
    misconceptions:
      - { match: 60, feedback: "ได้ $\\cos C = -\\tfrac12$ แล้วทิ้งเครื่องหมายลบ โคไซน์ลบแปลว่ามุมป้าน" }
    solution: "$\\cos C = \\dfrac{49 + 64 - 169}{112} = \\dfrac{-56}{112} = -\\dfrac12$ ได้ $C = 120°$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.law-of-sines-cosines.p018
    topics: [math.geometry.law-of-sines-cosines]
    difficulty: 5
    type: mcq
    stem: "สามเหลี่ยม ABC มี $A = 40°$, $a = 8$ และ $b = 10$ มุม $B$ มีขนาดเท่าใด (ประมาณเป็นทศนิยม 1 ตำแหน่ง)"
    choices:
      - { id: a, text: "$53.5°$ หรือ $126.5°$", correct: true }
      - { id: b, text: "$53.5°$ เท่านั้น", feedback: "ลืมมุมป้าน $180° - 53.5° = 126.5°$ ที่มีไซน์เท่ากัน และ $126.5° + 40° < 180°$ จึงใช้ได้" }
      - { id: c, text: "$126.5°$ เท่านั้น", feedback: "มุมแหลม $53.5°$ ก็ใช้ได้เช่นกัน" }
      - { id: d, text: "ไม่มีสามเหลี่ยม เพราะ $\\sin B > 1$", feedback: "$\\sin B = \\tfrac{10\\sin 40°}{8} \\approx 0.80 < 1$ จึงมีสามเหลี่ยม" }
    hints:
      - "$\\dfrac{\\sin B}{10} = \\dfrac{\\sin 40°}{8}$"
      - "$\\sin B \\approx 0.80$ มุมที่มีไซน์เท่านี้มีทั้งมุมแหลมและมุมป้าน ตรวจทั้งสอง"
    solution: "$\\sin B = \\dfrac{10\\sin 40°}{8} \\approx 0.8035$ ได้ $B \\approx 53.5°$ หรือ $B \\approx 126.5°$ ทั้งสองค่ารวมกับ $40°$ ได้น้อยกว่า $180°$ จึงเป็นไปได้ทั้งคู่ (กรณีกำกวม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.law-of-sines-cosines.p019
    topics: [math.geometry.law-of-sines-cosines]
    difficulty: 2
    type: mcq
    stem: "ในสามเหลี่ยม ABC ลากส่วนสูง $h$ จากจุด B ตั้งฉากกับด้าน AC ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "$h = a\\sin C$", correct: true }
      - { id: b, text: "$h = b\\sin C$", feedback: "$b$ คือด้าน AC ซึ่งเป็นฐาน ส่วนสูงจาก B ต้องคิดจากด้านที่ออกจาก B คือ $a$ (BC) หรือ $c$ (AB)" }
      - { id: c, text: "$h = a\\cos C$", feedback: "$a\\cos C$ คือระยะตามฐานจาก C ถึงเท้าของส่วนสูง ส่วนสูงใช้ไซน์ (ด้านตรงข้ามมุม)" }
      - { id: d, text: "$h = c\\sin C$", feedback: "ในสามเหลี่ยมมุมฉากที่มีด้าน $c$ เป็นด้านตรงข้ามมุมฉาก มุมที่ใช้คือ $A$ ไม่ใช่ $C$ ($h = c\\sin A$)" }
    hints:
      - "ส่วนสูงจาก B แบ่งรูปเป็นสามเหลี่ยมมุมฉากสองรูป รูปหนึ่งมีด้าน BC = $a$ เป็นด้านตรงข้ามมุมฉาก"
      - "ในสามเหลี่ยมมุมฉากนั้น $h$ อยู่ตรงข้ามมุม $C$"
    solution: "ในสามเหลี่ยมมุมฉากที่มี BC เป็นด้านตรงข้ามมุมฉาก $\\sin C = \\dfrac{h}{a}$ จึง $h = a\\sin C$ แล้วพื้นที่ $= \\tfrac12 \\times b \\times a\\sin C = \\tfrac12 ab\\sin C$ ได้สูตรเดียวกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true
