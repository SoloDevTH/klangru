  - { front: "Baldrige 2026 ต่างจาก TQA 2567–2568 อย่างไร", back: "เหลือ 6 หมวด คำถามผลลัพธ์อยู่ในแต่ละหมวด" }
  - { front: "คะแนนหัวข้อ", back: "คะแนนเต็มของหัวข้อ × ร้อยละที่ได้ แล้วรวมทุกหัวข้อ" }
