      - { id: b, text: "ขายข้อมูลประวัติการสั่งอาหารของนักเรียนให้บริษัทโฆษณา", feedback: "เป็นการนำข้อมูลส่วนบุคคลไปใช้โดยไม่ได้รับความยินยอม ผิดจริยธรรมและอาจผิดกฎหมาย" }
      - { id: c, text: "บังคับให้แม่ค้าทุกร้านจ่ายเงินมากขึ้นโดยไม่ได้บริการเพิ่ม", feedback: "ไม่ได้สร้างคุณค่าเพิ่ม และเป็นผลเสียต่อผู้มีส่วนได้ส่วนเสีย" }
      - { id: d, text: "เก็บค่าธรรมเนียมเฉพาะนักเรียนที่ไม่มีโทรศัพท์", feedback: "ทำให้เกิดความไม่เท่าเทียมกับกลุ่มที่เสียเปรียบอยู่แล้ว" }
    hints:
