# หัวข้อในคลังที่สอนหลักการบริหารคุณภาพหรือข้อกำหนดของ ISO 9001:2015 บางส่วน (ระดับแนะนำ ไม่ใช่การอบรมผู้ตรวจ)
framework: iso-9001-2015
mappings:
  - topic: management.quality.concepts
    indicators: ["QMP1", "QMP2", "QMP3", "QMP4", "QMP5", "QMP6", "QMP7", "10.3"]
    coverage: partial
    note: "บทเรียนบอกชื่อและความหมายสั้น ๆ ของหลักการทั้ง 7 ข้อ วงจร PDCA และโครงข้อ 4-10 ที่เรียงตาม PDCA มีโจทย์จับคู่ข้อกำหนดกับขั้น PDCA ยังไม่ได้สอนข้อกำหนดรายข้อ การทำเอกสาร หรือการตรวจติดตาม"
  - topic: management.quality.qc-tools
    indicators: ["9.1"]
    coverage: partial
    note: "สอนเครื่องมือวิเคราะห์ข้อมูลและแผนภูมิควบคุมที่ใช้เฝ้าระวังและวัดกระบวนการ ยังไม่มีการวัดความพึงพอใจของลูกค้าและการประเมินประสิทธิผลของระบบ"
  - topic: management.operations.lean
    indicators: ["10.3"]
    coverage: partial
    note: "ไคเซ็นและการกำจัดความสูญเปล่าเป็นวิธีปรับปรุงต่อเนื่อง แต่ไม่ได้สอนข้อกำหนดของมาตรฐานโดยตรง"
  - topic: management.quality.iso-management-systems
    indicators: ["4.1", "4.2", "4.3", "4.4", "5.1", "5.2", "5.3", "6.2", "6.3", "7.2", "7.3", "7.4", "8.1", "8.2", "8.3", "8.5", "8.6", "8.7", "10.1"]
    coverage: partial
    note: สรุปสาระของข้อนี้ด้วยคำของคลังรู้ในตารางข้อ 4–10 พร้อมตัวอย่างหลักฐาน แต่ไม่ได้ลงรายละเอียดทุกข้อย่อย
  - topic: management.quality.iso-management-systems
    indicators: ["6.1", "7.1", "7.5", "8.4", "9.2", "9.3", "10.2"]
    coverage: full
    note: การคิดบนฐานความเสี่ยง เมทริกซ์ความเสี่ยง วิธีรับมือสี่แบบ และโอกาส (ตัวอย่าง p005–p007 p018)
  - topic: management.quality.spc
    indicators: ["9.1"]
    coverage: partial
    note: การเฝ้าระวังและวิเคราะห์ข้อมูลกระบวนการด้วย SPC ส่วนความพึงพอใจของลูกค้าอยู่ใน quality-planning
  - topic: management.project.risk-management
    indicators: ["6.1"]
    coverage: full
    note: รับมือความเสี่ยงและโอกาสอย่างได้สัดส่วนและฝังในกระบวนการ (p006 p002)
