id: earthscience.geology.geologic-history-maps
subject: earthscience
title: { th: ลำดับเหตุการณ์ทางธรณีวิทยาและแผนที่, en: "Geologic history and geological maps" }
summary: หลักการลำดับชั้นหิน ซากดึกดำบรรพ์ดัชนี อายุสัมพัทธ์และอายุสัมบูรณ์ มาตราธรณีกาลและประวัติยุคแรกของโลก และการอ่านแผนที่ภูมิประเทศกับแผนที่ธรณีวิทยา
difficulty: 5
minutes: 45
prerequisites: [earthscience.geology.minerals-rocks, earthscience.geology.plate-tectonics]
encompasses:
  - { id: earthscience.geology.minerals-rocks, weight: 0.3 }
  - { id: earthscience.geology.plate-tectonics, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ภาพตัดขวางชั้นหิน ตัวอย่าง
    src: cross-section-example.svg
    alt: "ภาพตัดขวาง ชั้นล่างสามชั้นเอียง คือ ก หินดินดาน ข หินทราย และ ค หินปูน ถูกตัดด้านบนด้วยเส้นหยักสีแดงเข้ม เขียนว่า ผิวกร่อน ความไม่ต่อเนื่อง เหนือขึ้นไปเป็นชั้นแนวราบ ง หินทราย และ จ หินกรวดมน หินอัคนี ฉ แทรกตัดชั้น ก ข ค แต่สิ้นสุดที่ผิวกร่อน ไม่ตัดชั้น ง"
    caption: "ภาพสมมติ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: เรียงลำดับเหตุการณ์จากภาพตัดขวาง
    problem: "ใช้ภาพตัดขวางตัวอย่าง เรียงเหตุการณ์ทั้งหมดจากเกิดก่อนไปเกิดหลัง"
    steps:
      - text: "ชั้น ก ข ค ทับถมตามลำดับจากล่างขึ้นบน"
        why: "กฎการลำดับชั้นหิน"
      - text: "ชั้น ก ข ค เอียง จึงถูกแรงกระทำให้เอียงหลังทับถม"
        why: "หลักการวางตัวในแนวราบ"
      - text: "หินอัคนี ฉ ตัดชั้น ก ข ค จึงเกิดหลังสามชั้นนี้ แต่ถูกผิวกร่อนตัด จึงเกิดก่อนการกร่อน (จากภาพบอกไม่ได้แน่ชัดว่า ฉ แทรกก่อนหรือหลังชั้นเอียง)"
        why: "หลักการตัดขวาง"
      - text: "พื้นที่ถูกยกขึ้นและกร่อน เกิดผิวกร่อนหรือความไม่ต่อเนื่อง"
      - text: "พื้นที่ลดระดับลง ชั้น ง แล้วชั้น จ ทับถมในแนวราบ"
    answer: "ก → ข → ค → ชั้นเอียงและ ฉ แทรก → กร่อน → ง → จ"
  - { type: check, problem: earthscience.geology.geologic-history-maps.p001, prompt: "ชั้นใดทับถมก่อน" }
  - type: worked-example
    title: หาอายุจากครึ่งชีวิต
    problem: "เถ้าภูเขาไฟชั้นหนึ่งเหลือโพแทสเซียม-40 ร้อยละ 25 ของตอนเกิด ครึ่งชีวิตของโพแทสเซียม-40 คือ 1,250 ล้านปี เถ้าชั้นนี้อายุเท่าไร"
    steps:
      - text: "ร้อยละ 100 → 50 → 25 คือผ่านไป 2 ครึ่งชีวิต"
        why: "ทุกครึ่งชีวิตเหลือครึ่งหนึ่งของที่มีอยู่ ไม่ได้ลดลงเท่าเดิมทุกช่วง"
      - text: "อายุ $= 2 \\times 1{,}250 = 2{,}500$ ล้านปี"
    answer: "ประมาณ 2,500 ล้านปี"
  - type: interactive
    title: ธาตุกัมมันตรังสีที่เหลือเมื่อเวลาผ่านไป
    caption: "เส้นคือร้อยละที่เหลือ $100 \\times 0.5^{x/T}$ เมื่อ $x$ คือเวลา และ $T$ คือครึ่งชีวิต ในหน่วยเดียวกัน ลองตั้ง $T = 1$ แล้วดูว่าที่ $x = 1, 2, 3$ เหลือร้อยละเท่าไร"
    widget:
      kind: function-plot
      functions: ["100\\cdot 0.5^{\\frac{x}{T}}"]
      sliders:
        - { name: T, min: 0.5, max: 3, step: 0.25, value: 1, label: ครึ่งชีวิต }
      x: [0, 6]
      y: [0, 100]
  - { type: check, problem: earthscience.geology.geologic-history-maps.p004, prompt: "หนึ่งในสี่คือกี่ครึ่งชีวิต" }
  - type: figure
    title: มาตราธรณีกาล
    src: geologic-time.svg
    alt: "แถบเวลา 4,600 ล้านปีจนถึงปัจจุบัน แบ่งเป็นบรมยุคเฮเดียน 4,600 ถึง 4,000 อาร์เคียน 4,000 ถึง 2,500 โพรเทอโรโซอิก 2,500 ถึง 539 และฟาเนอโรโซอิก 539 ถึงปัจจุบัน เหตุการณ์ โลกเกิด 4,600 แร่เซอร์คอนเก่าสุด 4,400 หลักฐานสิ่งมีชีวิตแรก ๆ 3,500 ออกซิเจนสะสมในอากาศ 2,400 แถบล่างขยายช่วง 539 ล้านปีล่าสุด มหายุคพาลีโอโซอิก 539 ถึง 252 มีโซโซอิก 252 ถึง 66 ซีโนโซอิก 66 ถึงปัจจุบัน เหตุการณ์ สัตว์มีเปลือกแข็งเพิ่มขึ้นมาก 539 การสูญพันธุ์ครั้งใหญ่ที่สุด 252 ไดโนเสาร์ภูเวียง 130 ไดโนเสาร์ที่ไม่ใช่นกสูญพันธุ์ 66 มนุษย์ปัจจุบันราว 0.3 ล้านปี"
    caption: "ช่วงที่มีซากดึกดำบรรพ์มากเป็นเพียงส่วนท้ายของประวัติโลก (วาดโดยทีมคลังรู้ ค่าปัดเศษ)"
  - type: figure
    title: เส้นชั้นความสูงและภาพตัดขวางภูมิประเทศ
    src: contour-profile.svg
    alt: "ด้านบนเป็นแผนที่เส้นชั้นความสูงของเนินเขารูปรี เส้น 100 200 300 400 และ 500 m ยอดสูง 530 m ด้านตะวันตกเส้นห่างกัน ด้านตะวันออกเส้นชิดกัน มีเส้นประ ก–ข ผ่านยอดในแนวตะวันตก–ตะวันออก ด้านล่างเป็นภาพตัดขวางตามแนว ก–ข แกนตั้งเป็นความสูง 0 ถึง 600 m เส้นชั้นความสูงแต่ละเส้นลากลงมาเป็นจุดบนภาพตัดขวาง ด้านตะวันตกลาดขึ้นค่อย ๆ ด้านตะวันออกลาดลงชันกว่า"
    caption: "ช่วงชั้นความสูง 100 m เส้นชิดกันคือด้านที่ชัน (วาดโดยทีมคลังรู้)"
  - { type: check, problem: earthscience.geology.geologic-history-maps.p003, prompt: "เส้นชิดหรือเส้นห่างคือชัน" }
glossary:
  - { term: กฎการลำดับชั้นหิน, definition: "ในชั้นหินตะกอนที่ไม่ถูกพลิกกลับ ชั้นล่างเกิดก่อนและมีอายุมากกว่าชั้นบน" }
  - { term: หลักการตัดขวาง, definition: "หินอัคนีที่แทรกตัดหรือรอยเลื่อนที่ตัดผ่านชั้นหิน เกิดหลังชั้นหินนั้น" }
  - { term: ความไม่ต่อเนื่องของชั้นหิน, definition: "ผิวกร่อนที่มีชั้นหินใหม่ทับ แสดงช่วงเวลาที่ไม่มีชั้นหินบันทึกไว้" }
  - { term: ซากดึกดำบรรพ์ดัชนี, definition: "ซากดึกดำบรรพ์ที่พบมาก กระจายกว้าง และมีชีวิตช่วงสั้น ใช้ระบุและเทียบอายุชั้นหิน" }
  - { term: อายุสัมพัทธ์, definition: "การบอกว่าหินหรือเหตุการณ์ใดเกิดก่อนหรือหลัง โดยไม่บอกเป็นจำนวนปี" }
  - { term: อายุสัมบูรณ์, definition: "อายุเป็นจำนวนปี หาได้จากการสลายตัวของธาตุกัมมันตรังสี" }
  - { term: ครึ่งชีวิต, definition: "เวลาที่ธาตุกัมมันตรังสีสลายตัวจนเหลือครึ่งหนึ่งของปริมาณเดิม" }
  - { term: เส้นชั้นความสูง, definition: "เส้นบนแผนที่ภูมิประเทศที่ลากผ่านจุดที่สูงเท่ากัน" }
flashcards:
  - { front: "หลักการหาอายุสัมพัทธ์", back: "ลำดับชั้นหิน วางตัวในแนวราบ ต่อเนื่องด้านข้าง ตัดขวาง เศษหินที่ฝังตัว ความไม่ต่อเนื่อง และลำดับซากดึกดำบรรพ์" }
  - { front: "ผ่านไป 3 ครึ่งชีวิตเหลือเท่าไร", back: "หนึ่งในแปด (ร้อยละ 12.5)" }
  - { front: "ทำไมรู้ว่าโลกอายุราว 4,600 ล้านปี", back: "อุกกาบาตอายุราว 4,570 ล้านปี หินดวงจันทร์ราว 4,500 ล้านปี และเซอร์คอนบนโลกราว 4,400 ล้านปี" }
  - { front: "อ่านความชันจากแผนที่ภูมิประเทศ", back: "เส้นชั้นความสูงชิดกันคือชัน ความชัน = ผลต่างความสูง ÷ ระยะทางราบ" }
  - { front: "แผนที่ธรณีวิทยาใช้ทำอะไร", back: "หาแหล่งแร่ น้ำบาดาล เชื้อเพลิง เลือกที่ตั้งเขื่อนและอาคาร หลีกเลี่ยงรอยเลื่อนและพื้นที่เสี่ยงภัย" }
