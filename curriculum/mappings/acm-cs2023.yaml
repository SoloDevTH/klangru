# หัวข้อในคลังที่ตรงกับ knowledge unit ของ ACM/IEEE-CS/AAAI CS2023
# CS2023 เป็นหลักสูตรระดับปริญญาตรี หัวข้อพื้นฐานของคลังจึงสอนได้เพียงบางส่วนของแต่ละ knowledge unit
framework: acm-cs2023
mappings:
  - topic: computer.algorithms.intro
    indicators: ["SDF-Algorithms"]
    coverage: partial
    note: "แนวคิดของอัลกอริทึมและการค้นหาแบบลำดับ ยังไม่มีการเรียงลำดับ การท่องต้นไม้และกราฟ และการวิเคราะห์ประสิทธิภาพ"
  - topic: computer.data.binary
    indicators: ["AR-Representation"]
    coverage: partial
    note: "บิต ไบต์ เลขฐาน และการแทนข้อมูลที่ไม่ใช่ตัวเลข ยังไม่มีจำนวนลบแบบส่วนเติมเต็มสอง จุดตรึง และจุดลอยตัว"
  - topic: computer.programming.basics
    indicators: ["SDF-Fundamentals"]
    coverage: partial
    note: "ตัวแปร ชนิดข้อมูล นิพจน์ การกำหนดค่า เงื่อนไข การวนซ้ำ การไล่โปรแกรม และข้อผิดพลาด ยังไม่มีฟังก์ชัน ข้อมูลแบบมีโครงสร้าง ไฟล์ การเรียกซ้ำ และการจัดการ exception"
  - topic: computer.data.number-representation
    indicators: [AR-Representation]
    coverage: full
    note: บิต ไบต์ เวิร์ด เลขฐานสิบหก จำนวนไม่มีเครื่องหมาย เครื่องหมายและขนาด ส่วนเติมเต็มสอง การล้น จุดตรึง จุดลอยตัว IEEE 754 32 บิต และรหัสตัวอักษรในฐานสิบหก (รายละเอียดการแทนอักขระอยู่ใน computer.data.binary)
  - topic: computer.systems.logic-gates
    indicators: [SF-Foundations, AR-Logic]
    coverage: partial
    note: ดิจิทัลกับแอนะล็อก เกตและพีชคณิตบูลีน สถานะและเครื่องสถานะจำกัดครบ การประมวลผลตามลำดับกับแบบขนานกล่าวถึงสั้น ๆ เท่านั้น
