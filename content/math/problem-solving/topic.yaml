id: math.reasoning.problem-solving
subject: math
title: { th: การให้เหตุผล การพิสูจน์ และการแก้ปัญหาทางคณิตศาสตร์, en: "Reasoning, proof and problem solving" }
summary: ตั้งข้อคาดการณ์และหาตัวอย่างค้าน แยกสมการกับเอกลักษณ์ พิสูจน์ด้วยพีชคณิต แจกแจงกรณีอย่างเป็นระบบ เลือกกลยุทธ์แก้ปัญหาที่ไม่คุ้นเคย และตรวจความสมเหตุสมผลของข้อโต้แย้ง
difficulty: 5
minutes: 40
prerequisites: [math.algebra.linear-eq, math.logic.propositions]
encompasses:
  - { id: math.algebra.linear-eq, weight: 0.3 }
  - { id: math.logic.propositions, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: odd-squares.svg
    alt: "ตาราง 4 × 4 ช่อง แต่ละช่องมีจุดหนึ่งจุด ระบายเป็นรูปตัวแอลซ้อนกันสี่ชั้นจากมุมล่างซ้าย ชั้นที่ 1 มี 1 จุด ชั้นที่ 2 มี 3 จุด ชั้นที่ 3 มี 5 จุด ชั้นที่ 4 มี 7 จุด ข้างตารางเขียนว่า 1 + 3 + 5 + 7 = 4 × 4 = 16"
    caption: "ตัวแอลแต่ละชั้นเพิ่มจุดเป็นจำนวนคี่ถัดไป และทำให้สี่เหลี่ยมจัตุรัสโตขึ้นหนึ่งแถวหนึ่งหลัก ผลบวกของจำนวนคี่ n ตัวแรกจึงเท่ากับ n²"
  - type: worked-example
    title: พิสูจน์ว่าผลบวกของจำนวนคี่สองจำนวนเป็นจำนวนคู่
    problem: "จงพิสูจน์ว่า ถ้า $p$ และ $q$ เป็นจำนวนคี่ แล้ว $p + q$ เป็นจำนวนคู่"
    steps:
      - text: "ให้ $p = 2a + 1$ และ $q = 2b + 1$ เมื่อ $a, b$ เป็นจำนวนเต็ม"
        why: "ใช้ตัวแปรคนละตัว เพราะ $p$ กับ $q$ ไม่จำเป็นต้องเท่ากัน ถ้าใช้ $2a + 1$ ทั้งคู่จะพิสูจน์ได้แค่กรณี $p = q$"
      - text: "$p + q = 2a + 2b + 2$"
      - text: "$= 2(a + b + 1)$"
        why: "ดึง 2 เป็นตัวร่วมเพื่อให้เห็นรูป $2m$ ของจำนวนคู่"
      - text: "$a + b + 1$ เป็นจำนวนเต็ม ดังนั้น $p + q$ เป็นจำนวนคู่ ซึ่งเป็นจริงกับจำนวนคี่ทุกคู่ ไม่ใช่เฉพาะตัวอย่างที่ลองแทน"
    answer: "$p + q = 2(a + b + 1)$ เป็นจำนวนคู่เสมอ"
  - { type: check, problem: math.reasoning.problem-solving.p002, prompt: "เอกลักษณ์ต่างจากสมการอย่างไร" }
  - type: worked-example
    title: แจกแจงคู่คำตอบอย่างเป็นระบบ
    problem: "ต้นข้าวมีเงิน 40 บาท ซื้อแสตมป์ดวงละ 5 บาทและดวงละ 3 บาท อย่างละอย่างน้อย 1 ดวง ใช้เงินหมดพอดี ซื้อได้กี่แบบ"
    steps:
      - text: "ให้ซื้อดวงละ 5 บาท $a$ ดวง และดวงละ 3 บาท $b$ ดวง ได้ $5a + 3b = 40$ โดย $a, b \\ge 1$"
      - text: "$5a = 40 - 3b$ ต้องหารด้วย 5 ลงตัว จึงต้องให้ $3b$ หารด้วย 5 ลงตัว นั่นคือ $b$ เป็นพหุคูณของ 5"
        why: "หาเงื่อนไขก่อนช่วยให้ไม่ต้องลองทุกค่า"
      - text: "ไล่ $b = 5$: $a = 5$ และ $b = 10$: $a = 2$ ส่วน $b = 15$ ได้ $3b = 45 > 40$ ใช้ไม่ได้"
      - text: "ตรวจ: $5(5) + 3(5) = 40$ และ $5(2) + 3(10) = 40$ ถูกทั้งสองแบบ"
    answer: "2 แบบ คือ (5 ดวง, 5 ดวง) และ (2 ดวง, 10 ดวง)"
  - type: figure
    src: circle-regions.svg
    alt: "วงกลมห้าวง วงแรกมีจุด 1 จุดบนเส้นรอบวง วงต่อไปมี 2, 3, 4, 5 จุด ลากเส้นเชื่อมทุกคู่ของจุด ใต้วงเขียนจำนวนส่วนที่วงกลมถูกแบ่ง ได้ 1, 2, 4, 8, 16 ส่วนตามลำดับ"
    caption: "จำนวนส่วนเพิ่มเป็นสองเท่าทุกครั้ง แบบรูปนี้จะเป็นจริงต่อไปหรือไม่ (ดูโจทย์ในคลัง)"
  - { type: check, problem: math.reasoning.problem-solving.p003, prompt: "ไล่ค่าตามลำดับเพื่อไม่ให้ตกหล่น" }
glossary:
  - { term: ข้อคาดการณ์, definition: "ข้อความที่คาดว่าเป็นจริงจากการสังเกตแบบรูป แต่ยังไม่ได้พิสูจน์" }
  - { term: ตัวอย่างค้าน, definition: "ตัวอย่างหนึ่งตัวที่ตรงเงื่อนไขของข้อความแต่ผลไม่เป็นจริง ใช้แสดงว่าข้อความ 'ทุก...' เป็นเท็จ" }
  - { term: เอกลักษณ์, definition: "ข้อความที่สองข้างเท่ากันทุกค่าของตัวแปร เช่น 2(x + 3) = 2x + 6" }
  - { term: การพิสูจน์, definition: "การให้เหตุผลทีละขั้นจากข้อเท็จจริงที่ยอมรับแล้ว จนได้ข้อสรุปที่เป็นจริงทุกกรณี" }
  - { term: การแจกแจงกรณี, definition: "การไล่ทุกความเป็นไปได้ตามลำดับที่เป็นระบบ เพื่อไม่ให้ตกหล่นหรือซ้ำ" }
flashcards:
  - { front: "ตัวอย่างที่เป็นจริง 100 ตัว พิสูจน์ข้อความ 'ทุก n' ได้หรือไม่", back: "ไม่ได้ ต้องพิสูจน์ด้วยเหตุผลทั่วไป แต่ตัวอย่างค้าน 1 ตัวพอที่จะแสดงว่าข้อความเป็นเท็จ" }
  - { front: "เขียนจำนวนคี่สองจำนวนที่ไม่จำเป็นต้องเท่ากันอย่างไร", back: "2a + 1 และ 2b + 1 (ใช้ตัวแปรคนละตัว)" }
  - { front: "สมการกับเอกลักษณ์ต่างกันอย่างไร", back: "สมการจริงบางค่า เอกลักษณ์จริงทุกค่าของตัวแปร" }
  - { front: "ขั้นตอนแก้ปัญหาของโพลยา", back: "เข้าใจปัญหา → วางแผน → ลงมือทำ → ตรวจย้อน" }
  - { front: "ลด 20% แล้วลดอีก 20% เท่ากับลดรวมเท่าไร", back: "36% เพราะ 0.8 × 0.8 = 0.64" }
