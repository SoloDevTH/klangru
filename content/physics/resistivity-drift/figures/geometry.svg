<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="sans-serif" font-size="14">
<title>ความต้านทานของลวดขึ้นกับความยาวและพื้นที่หน้าตัด</title>
<rect x="0" y="0" width="680" height="300" fill="#ffffff"/>
<rect x="40.0" y="30.0" width="150.0" height="30.0" rx="0" fill="#ffcc80" stroke="#15211e" stroke-width="2"/>
<path d="M 40 30 q -10 15.0 0 30" fill="#ffe0b2" stroke="#15211e" stroke-width="2"/>
<text x="204.0" y="43.0" text-anchor="start" fill="#15211e" font-size="14">ยาว L พื้นที่ A</text>
<text x="204.0" y="63.0" text-anchor="start" fill="#1f5fa8" font-size="14" font-weight="bold">R</text>
<rect x="40.0" y="110.0" width="300.0" height="30.0" rx="0" fill="#ffcc80" stroke="#15211e" stroke-width="2"/>
<path d="M 40 110 q -10 15.0 0 30" fill="#ffe0b2" stroke="#15211e" stroke-width="2"/>
<text x="354.0" y="123.0" text-anchor="start" fill="#15211e" font-size="14">ยาว 2L พื้นที่ A</text>
<text x="354.0" y="143.0" text-anchor="start" fill="#1f5fa8" font-size="14" font-weight="bold">2R</text>
<rect x="40.0" y="190.0" width="150.0" height="60.0" rx="0" fill="#ffcc80" stroke="#15211e" stroke-width="2"/>
<path d="M 40 190 q -10 30.0 0 60" fill="#ffe0b2" stroke="#15211e" stroke-width="2"/>
<text x="204.0" y="218.0" text-anchor="start" fill="#15211e" font-size="14">ยาว L พื้นที่ 2A</text>
<text x="204.0" y="238.0" text-anchor="start" fill="#1f5fa8" font-size="14" font-weight="bold">R/2</text>
<text x="560.0" y="90.0" text-anchor="middle" fill="#15211e" font-size="20" font-weight="bold">R = ρL / A</text>
<text x="560.0" y="120.0" text-anchor="middle" fill="#15211e" font-size="13">ยาวขึ้น → R มากขึ้น</text>
<text x="560.0" y="142.0" text-anchor="middle" fill="#15211e" font-size="13">หนาขึ้น → R น้อยลง</text>
<text x="560.0" y="164.0" text-anchor="middle" fill="#15211e" font-size="13">ρ ขึ้นกับชนิดวัสดุ</text>
<text x="560.0" y="186.0" text-anchor="middle" fill="#15211e" font-size="13">และอุณหภูมิ</text>
</svg>
