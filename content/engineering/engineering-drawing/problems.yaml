      - { left: "แบบชิ้นส่วน (งานเครื่องกล)", right: "รูปร่าง ขนาด พิกัดความเผื่อ และวัสดุของชิ้นส่วนชิ้นเดียว" }
      - { left: "แบบประกอบ (งานเครื่องกล)", right: "ชิ้นส่วนต่อกันอย่างไร พร้อมตารางรายการชิ้นส่วน" }
      - { left: "แผนภาพเส้นเดียว (งานไฟฟ้า)", right: "เส้นทางจ่ายไฟจากหม้อแปลงผ่านแผงสวิตช์ไปยังแผงย่อย" }
    hints:
      - "แบบชิ้นส่วนต้องมีข้อมูลพอให้ผลิตชิ้นนั้นได้"
      - "แผนภาพเส้นเดียวใช้เส้นเดียวแทนสายไฟหลายเส้นของระบบ"
    solution: "แปลนพื้นแสดงผังห้อง แบบชิ้นส่วนแสดงข้อมูลผลิตชิ้นเดียว แบบประกอบแสดงการต่อชิ้นส่วนและรายการชิ้นส่วน แผนภาพเส้นเดียวแสดงเส้นทางจ่ายไฟของระบบ"
