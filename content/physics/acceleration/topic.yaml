id: physics.kinematics.acceleration
subject: physics
title: { th: ความเร่ง, en: Acceleration }
summary: ความเร่งบอกว่าความเร็วเปลี่ยนไปเท่าใดในหนึ่งวินาที คำนวณจาก a = Δv/Δt มีหน่วย m/s² อ่านได้จากความชันของกราฟความเร็ว–เวลา
difficulty: 3.5
minutes: 30
prerequisites: [physics.kinematics.velocity]
encompasses:
  - { id: physics.kinematics.velocity, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: motion-diagram.svg
    alt: "แผนภาพการเคลื่อนที่สองแถว แสดงตำแหน่งของวัตถุทุก 1 วินาทีจาก t=0 ถึง t=4 แถวบนวัตถุเร็วขึ้น ระยะห่างระหว่างภาพเพิ่มขึ้น ลูกศรความเร็วยาวขึ้นเรื่อย ๆ และลูกศรความเร่งชี้ไปทางขวาทิศเดียวกับการเคลื่อนที่ แถวล่างวัตถุช้าลง ระยะห่างลดลง ลูกศรความเร็วสั้นลง และลูกศรความเร่งชี้ไปทางซ้าย ตรงข้ามกับการเคลื่อนที่"
    caption: "ภาพตำแหน่งในช่วงเวลาเท่ากัน: ระยะห่างที่เพิ่มขึ้นหรือลดลงบอกทิศของความเร่ง"
  - type: worked-example
    title: อ่านความเร่งทั้งสามช่วงจากกราฟของรถเมล์
    problem: "กราฟความเร็ว–เวลาของรถเมล์เป็นดังรูป หาความเร่งในแต่ละช่วง และบอกว่ารถกำลังทำอะไร"
    figure:
      src: vt-graph-bus.svg
      alt: "กราฟความเร็ว–เวลาของรถเมล์ แกนนอนคือเวลา 0 ถึง 20 วินาที แกนตั้งคือความเร็ว 0 ถึง 14 เมตรต่อวินาที ช่วง 1 เส้นตรงขึ้นจาก (0, 0) ถึง (6 s, 12 m/s) ช่วง 2 เส้นแนวนอนที่ 12 m/s จาก 6 s ถึง 14 s ช่วง 3 เส้นตรงลงจาก (14 s, 12 m/s) ถึง (20 s, 0)"
    steps:
      - text: "ช่วง 1 ($0$–$6\\ \\mathrm{s}$): ความเร็วเปลี่ยนจาก $0$ เป็น $12\\ \\mathrm{m/s}$ ได้ $a = \\dfrac{12 - 0}{6 - 0} = 2\\ \\mathrm{m/s^2}$"
        why: "ความเร่งคือความชันของกราฟ v–t คือ $\\Delta v \\div \\Delta t$ ของช่วงนั้น"
      - text: "ช่วง 2 ($6$–$14\\ \\mathrm{s}$): เส้นราบ ความเร็วคงที่ $12\\ \\mathrm{m/s}$ ได้ $a = \\dfrac{12 - 12}{8} = 0$"
        why: "รถยังวิ่งเร็ว $12\\ \\mathrm{m/s}$ แต่ความเร็วไม่เปลี่ยน ความเร่งจึงเป็นศูนย์"
      - text: "ช่วง 3 ($14$–$20\\ \\mathrm{s}$): $a = \\dfrac{0 - 12}{20 - 14} = \\dfrac{-12}{6} = -2\\ \\mathrm{m/s^2}$"
        why: "ต้องใช้ $\\Delta t = 20 - 14 = 6\\ \\mathrm{s}$ ไม่ใช่ $20\\ \\mathrm{s}$ เพราะคิดเฉพาะช่วงนี้"
      - text: "แปลความหมาย: รถออกตัวโดยเร็วขึ้น $2\\ \\mathrm{m/s}$ ทุกวินาที วิ่งคงที่ แล้วเบรกโดยช้าลง $2\\ \\mathrm{m/s}$ ทุกวินาทีจนหยุด"
    answer: "ช่วง 1: $2\\ \\mathrm{m/s^2}$ (เร่ง) · ช่วง 2: $0$ (ความเร็วคงที่) · ช่วง 3: $-2\\ \\mathrm{m/s^2}$ (เบรก)"
  - { type: check, problem: phy.acc.p013, prompt: "ลองอ่านกราฟของรถอีกคันด้วยตัวเอง" }
  - type: worked-example
    title: ความเร่งเฉลี่ยของลูกบอลที่กระดอนจากผนัง
    problem: "ลูกบอลกลิ้งเข้าชนผนังด้วยความเร็ว $8\\ \\mathrm{m/s}$ แล้วกระดอนกลับด้วยความเร็ว $6\\ \\mathrm{m/s}$ ลูกบอลแตะผนังนาน $0.05\\ \\mathrm{s}$ ความเร่งเฉลี่ยขณะแตะผนังเป็นเท่าใด"
    steps:
      - text: "ตั้งทิศที่ลูกบอลวิ่งเข้าหาผนังเป็นบวก: $u = +8\\ \\mathrm{m/s}$ และ $v = -6\\ \\mathrm{m/s}$"
        why: "ความเร็วเป็นเวกเตอร์ เมื่อกระดอนกลับทิศ เครื่องหมายต้องเปลี่ยน"
      - text: "$\\Delta v = v - u = -6 - 8 = -14\\ \\mathrm{m/s}$"
        why: "ลูกบอลต้องหยุด (เปลี่ยนไป $8\\ \\mathrm{m/s}$) แล้วเร่งกลับอีก $6\\ \\mathrm{m/s}$ รวม $14\\ \\mathrm{m/s}$ ถ้าคิด $6 - 8 = -2$ จะได้ค่าเล็กเกินจริงมาก"
      - text: "$a = \\dfrac{\\Delta v}{t} = \\dfrac{-14\\ \\mathrm{m/s}}{0.05\\ \\mathrm{s}} = -280\\ \\mathrm{m/s^2}$"
      - text: "เครื่องหมายลบบอกว่าความเร่งชี้ออกจากผนัง ซึ่งเป็นทิศของแรงที่ผนังดันลูกบอล"
    answer: "ความเร่งเฉลี่ยมีขนาด $280\\ \\mathrm{m/s^2}$ ทิศพุ่งออกจากผนัง"
  - { type: check, problem: phy.acc.p017, prompt: "สิ่งใดบ้างที่มีความเร่ง" }
  - type: simulation
    title: แรงและการเคลื่อนที่เบื้องต้น (PhET Forces and Motion Basics)
    url: https://phet.colorado.edu/en/simulations/forces-and-motion-basics
    provider: phet
    note: เปิดหน้าจอ Acceleration ติ๊กแสดง Speed และ Acceleration แล้วออกแรงผลักกล่อง สังเกตว่าเมื่อความเร่งเป็นศูนย์ ความเร็วไม่เปลี่ยน และเมื่อความเร่งมีทิศตรงข้ามกับการเคลื่อนที่ กล่องจะช้าลง
  - type: interactive
    title: กราฟความเร็ว–เวลา v = u + at
    caption: แกนนอนคือเวลา t (s) แกนตั้งคือความเร็ว v (m/s) แถบ u เลื่อนจุดเริ่มของกราฟขึ้นลง ส่วนแถบ a เปลี่ยนความชัน ลองตั้ง a = 0 เส้นจะราบ (ความเร็วคงที่) และลองตั้ง u เป็นบวกแต่ a เป็นลบ จะเห็นความเร็วลดลงจนเป็นศูนย์แล้วติดลบ (วัตถุหยุดแล้วเคลื่อนที่กลับทิศ)
    widget:
      kind: function-plot
      functions: ["u + a x"]
      sliders:
        - { name: u, min: -10, max: 20, step: 1, value: 5, label: ความเร็วต้น u (m/s) }
        - { name: a, min: -4, max: 4, step: 0.5, value: 2, label: ความเร่ง a (m/s²) }
      x: [0, 10]
      y: [-20, 30]
glossary:
  - { term: ความเร่ง, definition: "อัตราการเปลี่ยนความเร็วต่อหนึ่งหน่วยเวลา $a = \\Delta v / \\Delta t$ มีหน่วย $\\mathrm{m/s^2}$ เป็นปริมาณเวกเตอร์" }
  - { term: การหน่วง, definition: "การที่วัตถุเคลื่อนที่ช้าลง เกิดเมื่อความเร่งมีทิศตรงข้ามกับความเร็ว" }
  - { term: กราฟความเร็ว–เวลา, definition: "กราฟที่มีเวลาบนแกนนอนและความเร็วบนแกนตั้ง ความชันของกราฟคือความเร่ง" }
  - { term: ความเร่งขณะหนึ่ง, definition: "ความเร่ง ณ เวลาหนึ่ง หาได้จากความชันของเส้นสัมผัสกราฟความเร็ว–เวลาที่เวลานั้น ต่างจากความเร่งเฉลี่ยที่คิดตลอดช่วงเวลา" }
flashcards:
  - { front: "สูตรความเร่ง", back: "$a = \\dfrac{\\Delta v}{\\Delta t} = \\dfrac{v - u}{t}$ เมื่อ $u$ คือความเร็วต้น และ $v$ คือความเร็วปลาย" }
  - { front: "$a = 2\\ \\mathrm{m/s^2}$ หมายความว่าอะไร", back: "ความเร็วเพิ่มขึ้น $2\\ \\mathrm{m/s}$ ทุก ๆ 1 วินาที" }
  - { front: "กราฟ v–t เป็นเส้นแนวนอนหมายความว่าอะไร", back: "ความเร็วคงที่ ความเร่งเป็นศูนย์" }
  - { front: "ความเร่งเป็นลบแปลว่าช้าลงเสมอหรือไม่", back: "ไม่เสมอไป วัตถุจะช้าลงเมื่อความเร่งกับความเร็วมีเครื่องหมายตรงข้ามกัน ถ้าเครื่องหมายเหมือนกันจะเร็วขึ้น" }
  - { front: "แถบกระดาษจากเครื่องเคาะ 50 ครั้งต่อวินาที 5 ช่วงจุดใช้เวลาเท่าใด", back: "$5 \\times 0.02\\ \\mathrm{s} = 0.1\\ \\mathrm{s}$ ถ้าความยาวช่วงที่ติดกันเพิ่มขึ้นเท่ากันทุกครั้ง แปลว่าความเร่งคงตัว" }
