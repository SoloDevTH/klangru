  - id: computer.data.exploratory-analysis.p014
    topics: [computer.data.exploratory-analysis]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน `group_means(text)` รับข้อความ CSV ที่มีหัวคอลัมน์ `class,score` แล้วคืนค่าเป็นดิกชันนารี `{class: ค่าเฉลี่ยของคะแนนในห้องนั้น}` ใช้โมดูล `csv` และ `io` ได้"
    starter: |
      def group_means(text):
          pass
    tests: |
      r = group_means("class,score\nA,12\nB,18\nA,15\nB,20\nB,16\nA,14\n")
      assert set(r) == {"A", "B"}, f"ควรมีกลุ่ม A และ B แต่ได้ {set(r)}"
      assert abs(r["A"] - 41 / 3) < 1e-9, f"ค่าเฉลี่ยของ A ควรเป็น 41/3 แต่ได้ {r['A']}"
      assert abs(r["B"] - 18) < 1e-9, f"ค่าเฉลี่ยของ B ควรเป็น 18 แต่ได้ {r['B']}"
      r2 = group_means("class,score\n")
      assert r2 == {}, f"ไม่มีแถวข้อมูลควรได้ dict ว่าง แต่ได้ {r2}"
    reference: |
      import csv, io
      def group_means(text):
          totals = {}
          counts = {}
          for row in csv.DictReader(io.StringIO(text)):
              k = row["class"].strip()
              totals[k] = totals.get(k, 0) + float(row["score"])
              counts[k] = counts.get(k, 0) + 1
          return {k: totals[k] / counts[k] for k in totals}
    hints:
      - "ใช้ csv.DictReader กับ io.StringIO เพื่ออ่านข้อความเหมือนไฟล์"
      - "เก็บผลรวมและจำนวนของแต่ละกลุ่มในดิกชันนารีแยกกัน"
      - "ค่าเฉลี่ยของแต่ละกลุ่มคือผลรวมหารด้วยจำนวนของกลุ่มนั้น"
    solution: "วนอ่านทีละแถว สะสมผลรวมและจำนวนของแต่ละห้องในสองดิกชันนารี แล้วคืนค่าผลรวมหารจำนวนของแต่ละห้อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.exploratory-analysis.p015
    topics: [computer.data.exploratory-analysis]
    difficulty: 5
    type: code
    stem: "เขียนฟังก์ชัน `iqr_outliers(values)` รับลิสต์ตัวเลข คำนวณ Q1 และ Q3 ด้วย `statistics.quantiles(values, n=4)` (วิธีค่าเริ่มต้น) แล้วคืนลิสต์ของค่าที่ต่ำกว่า Q1 − 1.5 × IQR หรือสูงกว่า Q3 + 1.5 × IQR เรียงจากน้อยไปมาก"
    starter: |
      def iqr_outliers(values):
          pass
    tests: |
      r = iqr_outliers([4, 5, 5, 6, 7, 7, 8, 9, 10, 35])
      assert r == [35], f"ควรได้ [35] แต่ได้ {r}"
      r2 = iqr_outliers([1, 2, 3, 4, 5])
      assert r2 == [], f"ข้อมูลที่ไม่มีค่าผิดปกติควรได้ [] แต่ได้ {r2}"
      r3 = iqr_outliers([10, 10, 10, 10])
      assert r3 == [], f"ข้อมูลที่ทุกค่าเท่ากันควรได้ [] แต่ได้ {r3}"
    reference: |
      import statistics
      def iqr_outliers(values):
          q1, _, q3 = statistics.quantiles(values, n=4)
          iqr = q3 - q1
          low, high = q1 - 1.5 * iqr, q3 + 1.5 * iqr
          return sorted(v for v in values if v < low or v > high)
    hints:
      - "statistics.quantiles(values, n=4) คืนค่า Q1 มัธยฐาน และ Q3 ตามลำดับ"
      - "คำนวณขอบล่างและขอบบนก่อน แล้วเทียบแต่ละค่ากับขอบทั้งสอง"
      - "ใช้ sorted เพื่อให้ผลเรียงจากน้อยไปมาก"
    solution: "หา Q1 และ Q3 ด้วย statistics.quantiles แล้วคำนวณขอบล่างและขอบบน เก็บเฉพาะค่าที่อยู่นอกขอบแล้วเรียงผลลัพธ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.exploratory-analysis.p016
    topics: [computer.data.exploratory-analysis]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน `sum_by_class(json_text)` รับข้อความ JSON ที่มีรูปแบบ `{\"classes\": [{\"name\": ชื่อห้อง, \"students\": [{\"name\": ชื่อ, \"score\": คะแนน}, ...]}, ...]}` แล้วคืนดิกชันนารี `{ชื่อห้อง: ผลรวมคะแนนของนักเรียนในห้องนั้น}` ห้องที่ไม่มีนักเรียนให้ได้ 0 ใช้โมดูล `json` ได้"
    starter: |
      def sum_by_class(json_text):
          pass
    tests: |
      s = '{"classes": [{"name": "ม.4/1", "students": [{"name": "ก", "score": 80}, {"name": "ข", "score": 90}]}, {"name": "ม.4/2", "students": [{"name": "ค", "score": 45}, {"name": "ง", "score": 45}]}, {"name": "ม.4/3", "students": []}]}'
      r = sum_by_class(s)
      expected = {"ม.4/1": 170, "ม.4/2": 90, "ม.4/3": 0}
      assert r == expected, f"ได้ {r} ควรได้ {expected}"
    reference: |
      import json
      def sum_by_class(json_text):
          data = json.loads(json_text)
          result = {}
          for cls in data["classes"]:
              result[cls["name"]] = sum(st["score"] for st in cls["students"])
          return result
    hints:
      - "ใช้ json.loads แปลงข้อความเป็นดิกชันนารีและลิสต์"
      - "วนลูปทีละห้อง แล้วในแต่ละห้องวนลูปนักเรียนเพื่อรวมคะแนน"
      - "sum ของลิสต์ว่างจะได้ 0 โดยอัตโนมัติ"
    solution: "แปลง JSON เป็นโครงสร้างข้อมูล วนทีละห้อง แล้วรวมค่า score ของนักเรียนทุกคนในห้องนั้น ห้องที่ไม่มีนักเรียนได้ 0 จาก sum"
    license: CC-BY-SA-4.0
    ai_assisted: true

