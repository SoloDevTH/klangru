problems:
  - id: chemistry.water.potable-water.p001
    topics: [chemistry.water.potable-water]
    difficulty: 1
    type: mcq
    stem: "\"น้ำดื่มได้\" (potable water) หมายถึงข้อใด"
    choices:
      - { id: a, text: "น้ำที่ปลอดภัยต่อการดื่ม มีสารเจือปนและเชื้อโรคไม่เกินเกณฑ์", correct: true, feedback: "ถูก น้ำดื่มได้ยังมีแร่ธาตุละลายอยู่บ้าง แต่ไม่เกินเกณฑ์" }
      - { id: b, text: "น้ำบริสุทธิ์ที่มีแต่ H₂O เท่านั้น", feedback: "น้ำบริสุทธิ์ (เช่น น้ำกลั่น) เป็นสารบริสุทธิ์ แต่น้ำประปาและน้ำดื่มทั่วไปมีสารอื่นละลายอยู่เล็กน้อย" }
      - { id: c, text: "น้ำที่มองแล้วใส ไม่มีตะกอน", feedback: "น้ำใสอาจมีเชื้อโรค สารหนู หรือเกลือละลายอยู่ ความใสอย่างเดียวไม่พอ" }
    hints:
      - "น้ำประปามีคลอรีนและแร่ธาตุเล็กน้อย แต่เราก็ดื่มได้"
      - "คำสำคัญคือปลอดภัย ไม่ใช่บริสุทธิ์"
    solution: "น้ำดื่มได้คือ **น้ำที่ปลอดภัยต่อการดื่ม** มีสารเจือปนและเชื้อโรคไม่เกินเกณฑ์ ไม่จำเป็นต้องเป็นน้ำบริสุทธิ์ และน้ำใสก็ยังไม่แน่ว่าปลอดภัย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.water.potable-water.p002
    topics: [chemistry.water.potable-water]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนผลิตน้ำประปาจากน้ำในแม่น้ำ จากขั้นแรกไปขั้นสุดท้าย"
    items:
      - "ผ่านตะแกรงดักขยะและผักตบชวา"
      - "เติมสารส้มแล้วกวน ให้ตะกอนรวมตัวเป็นก้อน"
      - "ปล่อยให้ก้อนตะกอนจมลงในถังตกตะกอน"
      - "กรองผ่านชั้นทรายและกรวด"
      - "เติมคลอรีนฆ่าเชื้อแล้วเก็บในถังน้ำใส"
    hints:
      - "ต้องเอาของชิ้นใหญ่ออกก่อน แล้วค่อยจัดการอนุภาคเล็ก"
      - "ฆ่าเชื้อเป็นขั้นท้าย เพราะตะกอนที่ยังเหลือจะใช้คลอรีนไปเปล่า ๆ"
    solution: "ตะแกรง → สารส้มและกวน → ตกตะกอน → กรองทราย → คลอรีนแล้วเก็บในถังน้ำใส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.water.potable-water.p003
    topics: [chemistry.water.potable-water]
    difficulty: 2
    type: match
    stem: "จับคู่ขั้นตอนบำบัดน้ำกับสิ่งที่ขั้นนั้นกำจัดหรือทำ"
    pairs:
      - { left: "ตะแกรง", right: "ขยะชิ้นใหญ่ กิ่งไม้ ผักตบชวา" }
      - { left: "สารส้มและการตกตะกอน", right: "อนุภาคเล็กที่ทำให้น้ำขุ่น" }
      - { left: "กรองทราย", right: "ตะกอนที่ยังเหลือหลังถังตกตะกอน" }
      - { left: "คลอรีน", right: "เชื้อโรค" }
      - { left: "การกลั่นหรือ RO", right: "เกลือที่ละลายอยู่" }
    hints:
      - "แต่ละขั้นจัดการสิ่งเจือปนตามขนาดและสมบัติ"
      - "สิ่งที่ละลายอยู่ผ่านทรายกรองได้ ต้องใช้วิธีที่แยกตัวละลาย"
    solution: "ตะแกรง–ขยะชิ้นใหญ่ · สารส้ม/ตกตะกอน–อนุภาคเล็กที่ทำให้ขุ่น · กรองทราย–ตะกอนที่เหลือ · คลอรีน–เชื้อโรค · กลั่น/RO–เกลือที่ละลาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.water.potable-water.p004
    topics: [chemistry.water.potable-water]
    difficulty: 2
    type: mcq
    stem: "ชาวบ้านริมแม่น้ำมูลแกว่งสารส้มในโอ่งน้ำขุ่น ทิ้งไว้ข้ามคืนแล้วน้ำใส สารส้มทำหน้าที่อะไร"
    choices:
      - { id: a, text: "ทำให้อนุภาคเล็กที่ลอยอยู่จับกันเป็นก้อนใหญ่แล้วจมลง", correct: true, feedback: "ถูก อนุภาคเล็กมากตกตะกอนเองไม่ได้ สารส้มช่วยให้รวมตัวกัน" }
      - { id: b, text: "ฆ่าเชื้อโรคในน้ำ น้ำจึงดื่มได้ทันที", feedback: "สารส้มไม่ใช่สารฆ่าเชื้อ น้ำที่ใสแล้วยังต้องต้มหรือฆ่าเชื้อก่อนดื่ม" }
      - { id: c, text: "ละลายตะกอนให้หายไปในน้ำ", feedback: "ตะกอนไม่ได้ละลาย แต่จมลงก้นโอ่ง ถ้าคนน้ำจะขุ่นอีก" }
    hints:
      - "สังเกตว่าเช้าวันรุ่งขึ้นก้นโอ่งมีอะไร"
      - "อนุภาคเล็กมากลอยค้างได้นาน ต้องทำให้มันใหญ่ขึ้น"
    solution: "สารส้มทำให้อนุภาคเล็ก ๆ ที่ลอยอยู่ **จับกันเป็นก้อนแล้วตกตะกอน** ก้นโอ่งจึงมีตะกอน แต่สารส้มไม่ฆ่าเชื้อ น้ำยังต้องต้มก่อนดื่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.water.potable-water.p005
    topics: [chemistry.water.potable-water]
    difficulty: 2
    type: mcq
    stem: "ทำไมการประปาจึงตั้งใจให้น้ำที่ก๊อกบ้านยังมีคลอรีนเหลืออยู่เล็กน้อย"
    choices:
      - { id: a, text: "เพื่อฆ่าเชื้อโรคที่อาจปนเข้ามาระหว่างทางในท่อ", correct: true, feedback: "ถูก คลอรีนอิสระคงเหลือเป็นเกราะป้องกันตลอดเส้นทาง" }
      - { id: b, text: "เพื่อให้น้ำมีรสชาติดีขึ้น", feedback: "คลอรีนทำให้น้ำมีกลิ่น ไม่ได้ทำให้อร่อยขึ้น" }
      - { id: c, text: "เพราะกำจัดคลอรีนออกไม่ได้", feedback: "ปรับปริมาณที่เติมได้ ปริมาณที่เหลือเป็นค่าที่ตั้งใจให้มี" }
      - { id: d, text: "เพื่อทำให้น้ำกระด้างน้อยลง", feedback: "คลอรีนไม่กำจัด Ca²⁺ และ Mg²⁺ ซึ่งเป็นต้นเหตุความกระด้าง" }
    hints:
      - "ท่อประปายาวหลายกิโลเมตร อาจมีรอยรั่ว"
      - "น้ำเดินทางหลังออกจากโรงประปาแล้ว ยังต้องมีอะไรคุ้มครอง"
    solution: "ท่อยาวอาจมีเชื้อปนเข้ามาได้ คลอรีนอิสระคงเหลือ **ฆ่าเชื้อระหว่างทาง** กรมอนามัยแนะนำ 0.2–0.5 mg/L ที่ปลายท่อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.water.potable-water.p006
    topics: [chemistry.water.potable-water]
    difficulty: 3
    type: numeric
    stem: "หอถังประปาหมู่บ้านแห่งหนึ่งจุน้ำ 50 m³ เจ้าหน้าที่ต้องการเติมคลอรีน 2.0 mg/L ต้องใช้คลอรีน (คิดเป็นคลอรีนล้วน) กี่กรัม (ค่าสมมติ)"
    answer: { value: 100, unit: g }
    misconceptions:
      - { match: 0.1, feedback: "นี่คือคำตอบในหน่วยกิโลกรัม โจทย์ถามเป็นกรัม" }
      - { match: 25, feedback: "หาร 50 ด้วย 2 แต่ต้องคูณ ปริมาตรยิ่งมากยิ่งต้องใช้คลอรีนมาก" }
    hints:
      - "1 mg/L = 1 g/m³"
      - "มวล = ความเข้มข้น × ปริมาตร"
    solution: "$2.0\\ \\mathrm{mg/L} = 2.0\\ \\mathrm{g/m^3}$ มวล $= 2.0 \\times 50 =$ **100 g**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.water.potable-water.p007
    topics: [chemistry.water.potable-water]
    difficulty: 3
    type: mcq
    stem: "หมู่บ้านแห่งหนึ่งในภาคอีสานเจาะบ่อบาดาลได้น้ำใส แต่มีรสเค็ม วิธีใดทำให้น้ำนี้ดื่มได้"
    choices:
      - { id: a, text: "ผ่านเครื่องกรองแบบออสโมซิสผันกลับ (RO)", correct: true, feedback: "ถูก เยื่อ RO กั้นไอออนของเกลือไว้" }
      - { id: b, text: "กรองด้วยทรายและถ่าน", feedback: "เกลือละลายอยู่ ผ่านทรายและถ่านได้" }
      - { id: c, text: "ต้มให้เดือด 10 นาที", feedback: "การต้มฆ่าเชื้อแต่เกลือยังอยู่ และน้ำระเหยไปบางส่วนทำให้เค็มขึ้นอีก" }
      - { id: d, text: "เติมคลอรีน", feedback: "คลอรีนฆ่าเชื้อ ไม่กำจัดเกลือ" }
    hints:
      - "ความเค็มมาจากไอออนที่ละลายอยู่"
      - "วิธีที่ใช้ได้ต้องแยกน้ำออกจากตัวละลาย"
    solution: "เกลือ **ละลาย** อยู่ การกรอง การต้ม และคลอรีนแยกไม่ได้ ต้องใช้ **RO** หรือการกลั่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.water.potable-water.p008
    topics: [chemistry.water.potable-water]
    difficulty: 4
    type: numeric
    stem: "ถังพักน้ำ 12 m³ ต้องเติมคลอรีน 1.5 mg/L โดยใช้ผงปูนคลอรีนที่มีคลอรีนใช้ได้ 65% ต้องใช้ผงกี่กรัม (ตอบทศนิยมหนึ่งตำแหน่ง ค่าสมมติ)"
    answer: { value: 27.7, unit: g, tolerance: 0.3 }
    misconceptions:
      - { match: 18, feedback: "นี่คือมวลคลอรีนล้วน ผงมีคลอรีนเพียง 65% ต้องหารด้วย 0.65" }
      - { match: 11.7, feedback: "คูณด้วย 0.65 แทนการหาร ผงต้องใช้มากกว่ามวลคลอรีน ไม่ใช่น้อยกว่า" }
    hints:
      - "มวลคลอรีน = 1.5 g/m³ × 12 m³"
      - "ผงทุก 1 g ให้คลอรีน 0.65 g"
    solution: "คลอรีน $= 1.5 \\times 12 = 18$ g ผง $= 18 \\div 0.65 =$ **27.7 g**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.water.potable-water.p009
    topics: [chemistry.water.potable-water]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "จากภาพ เจ้าหน้าที่วัดคลอรีนอิสระคงเหลือที่ก๊อก 4 จุด ก๊อกใดมีค่าอยู่ในช่วงที่กรมอนามัยแนะนำ (0.2–0.5 mg/L) เลือกทุกข้อที่ถูก"
    figure:
      src: p-village-taps.svg
      alt: "ท่อประปาจากหอถังสูงต่อไปยังก๊อก 4 จุดเรียงจากใกล้ไปไกล ก๊อก A วัดได้ 0.8 mg/L ก๊อก B 0.5 mg/L ก๊อก C 0.3 mg/L ก๊อก D 0.1 mg/L (ข้อมูลสมมติ)"
    choices:
      - { id: a, text: "ก๊อก A", feedback: "0.8 mg/L มากกว่า 0.5 น้ำจะมีกลิ่นคลอรีนฉุน" }
      - { id: b, text: "ก๊อก B", correct: true, feedback: "0.5 mg/L อยู่ที่ขอบบนของช่วงพอดี จึงยังอยู่ในเกณฑ์" }
      - { id: c, text: "ก๊อก C", correct: true, feedback: "0.3 mg/L อยู่ในช่วง" }
      - { id: d, text: "ก๊อก D", feedback: "0.1 mg/L น้อยกว่า 0.2 อาจฆ่าเชื้อที่ปลายท่อไม่พอ" }
    hints:
      - "อ่านค่าใต้ก๊อกแต่ละจุด"
      - "ช่วง 0.2–0.5 รวมค่าที่ขอบด้วย"
    solution: "B (0.5) และ C (0.3) อยู่ในช่วง 0.2–0.5 mg/L ส่วน A มากเกิน และ D น้อยเกินเพราะคลอรีนถูกใช้ไปตามทางยาว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.water.potable-water.p010
    topics: [chemistry.water.potable-water]
    difficulty: 3
    type: text
    stem: "วิธีทำน้ำจืดจากน้ำทะเลโดยต้มให้น้ำกลายเป็นไอ แล้วทำให้ไอควบแน่นเป็นน้ำ เกลือค้างอยู่ในภาชนะ เรียกว่าอะไร (ตอบเป็นคำเดียว)"
    accepted: ["การกลั่น", "กลั่น", "การกลั่นอย่างง่าย", "distillation"]
    misconceptions:
      - { match: "การระเหย", feedback: "การระเหยแห้งเก็บตัวละลาย (เกลือ) ไว้และปล่อยน้ำทิ้งไป วิธีนี้เก็บไอน้ำกลับมาเป็นน้ำด้วย" }
      - { match: "การกรอง", feedback: "การกรองแยกของแข็งที่ไม่ละลาย เกลือละลายอยู่จึงผ่านกระดาษกรองได้" }
    hints:
      - "มีทั้งการเปลี่ยนสถานะเป็นไอและการควบแน่น"
      - "เป็นวิธีเดียวกับที่ใช้ทำน้ำกลั่นในห้องปฏิบัติการ"
    solution: "**การกลั่น** ต้มให้น้ำเป็นไอแล้วควบแน่น เกลือที่ระเหยไม่ได้ค้างอยู่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.water.potable-water.p011
    topics: [chemistry.water.potable-water]
    difficulty: 4
    type: numeric
    stem: "น้ำบาดาลตัวอย่างหนึ่งมี $\\mathrm{Ca^{2+}}$ 60 mg/L และ $\\mathrm{Mg^{2+}}$ 18 mg/L จงหาความกระด้างในรูป $\\mathrm{CaCO_3}$ เป็น mg/L (ใช้ตัวคูณ $\\mathrm{Ca^{2+}} \\to \\mathrm{CaCO_3}$ = 2.50 และ $\\mathrm{Mg^{2+}} \\to \\mathrm{CaCO_3}$ = 4.12)"
    answer: { value: 224.2, unit: mg/L, tolerance: 2 }
    misconceptions:
      - { match: 78, feedback: "บวกมวลไอออนตรง ๆ ความกระด้างต้องแปลงเป็นมวลในรูป CaCO₃ ก่อนบวก" }
      - { match: 150, feedback: "คิดเฉพาะ Ca²⁺ แต่ Mg²⁺ ก็ทำให้น้ำกระด้างด้วย" }
    hints:
      - "แปลงไอออนแต่ละชนิดเป็นมวลในรูป CaCO₃ แยกกัน"
      - "60 × 2.50 และ 18 × 4.12 แล้วบวกกัน"
    solution: "$60 \\times 2.50 = 150$ และ $18 \\times 4.12 = 74.2$ รวม **224 mg/L** ในรูป CaCO₃ ไม่เกินเกณฑ์ 300 mg/L"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.water.potable-water.p012
    topics: [chemistry.water.potable-water]
    difficulty: 4
    type: mcq
    stem: "น้ำบาดาลในหมู่บ้านแห่งหนึ่งตักมาใหม่ ๆ ใส แต่ทิ้งไว้ในถังสักพักกลายเป็นสีส้มและมีกลิ่นสนิม ระบบประปาบาดาลควรเพิ่มขั้นตอนใด"
    choices:
      - { id: a, text: "เติมอากาศให้เหล็กเกิดตะกอน แล้วกรองออก", correct: true, feedback: "ถูก ออกซิเจนเปลี่ยนเหล็กที่ละลายเป็นสารที่ไม่ละลาย จึงกรองออกได้" }
      - { id: b, text: "เติมคลอรีนให้มากขึ้นเพียงอย่างเดียว", feedback: "คลอรีนฆ่าเชื้อ (และออกซิไดส์เหล็กได้บ้าง) แต่ถ้าไม่กรอง ตะกอนสีส้มยังอยู่ในน้ำ" }
      - { id: c, text: "ต้มน้ำให้เดือด", feedback: "การต้มไม่กำจัดเหล็กออก" }
      - { id: d, text: "กรองทันทีโดยไม่เติมอากาศ", feedback: "ตอนตักมาใหม่เหล็กยังละลายอยู่ (Fe²⁺) จึงผ่านทรายกรองได้" }
    hints:
      - "สีส้มเกิดหลังน้ำสัมผัสอากาศ แปลว่าอะไรทำปฏิกิริยา"
