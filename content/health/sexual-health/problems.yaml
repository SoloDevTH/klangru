problems:
- id: health.sexuality.sexual-health.p001
  topics:
  - health.sexuality.sexual-health
  difficulty: 1
  type: mcq
  stem: เชื้อเอชไอวี **ไม่** ติดต่อทางใด
  choices:
  - id: a
    text: กอด จับมือ และกินข้าวร่วมกัน
    correct: true
  - id: b
    text: เพศสัมพันธ์ที่ไม่ได้ใช้ถุงยางอนามัย
    feedback: ทางนี้ติดต่อได้ เพราะเชื้ออยู่ในน้ำอสุจิและสารคัดหลั่งในช่องคลอด
  - id: c
    text: ใช้เข็มฉีดยาร่วมกัน
    feedback: ติดต่อทางเลือดได้
  - id: d
    text: จากแม่สู่ลูกระหว่างตั้งครรภ์และคลอด
    feedback: ติดได้ แต่ป้องกันได้ด้วยยาต้านไวรัส
  hints:
  - เชื้ออยู่ในเลือด น้ำอสุจิ สารคัดหลั่งในช่องคลอด และน้ำนม
  - การสัมผัสในชีวิตประจำวันไม่ได้แลกเปลี่ยนของเหลวเหล่านี้
  solution: WHO ระบุว่าเอชไอวีไม่ติดต่อจากการกอด จูบ จับมือ หรือกินอาหารร่วมกัน การรังเกียจผู้มีเชื้อจึงไม่มีเหตุผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.sexual-health.p002
  topics:
  - health.sexuality.sexual-health
  difficulty: 1
  type: mcq
  stem: เพื่อนพูดว่า "มีเพศสัมพันธ์ครั้งแรกไม่ท้องหรอก" ข้อใดถูกต้อง
  choices:
  - id: a
    text: ไม่จริง ตั้งครรภ์ได้ตั้งแต่ครั้งแรกถ้าไม่ได้ป้องกัน
    correct: true
  - id: b
    text: จริง เพราะร่างกายยังไม่พร้อม
    feedback: ถ้าเริ่มมีการตกไข่แล้วก็ตั้งครรภ์ได้ ไม่ว่าครั้งที่เท่าไร
  - id: c
    text: จริงถ้ายังไม่มีประจำเดือนครบปี
    feedback: ไข่อาจตกก่อนประจำเดือนรอบแรกหรือในช่วงที่รอบยังไม่สม่ำเสมอ
  - id: d
    text: ท้องได้เฉพาะเมื่อมีเพศสัมพันธ์บ่อย
    feedback: ครั้งเดียวก็ตั้งครรภ์ได้
  hints:
  - การตั้งครรภ์ขึ้นกับการตกไข่และอสุจิ ไม่ใช่จำนวนครั้ง
  - นี่เป็นความเชื่อผิดที่พบบ่อย
  solution: การตั้งครรภ์เกิดได้ตั้งแต่ครั้งแรกถ้าไม่ได้ป้องกัน ความเชื่อนี้ทำให้หลายคนไม่ป้องกันตัว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.sexual-health.p003
  topics:
  - health.sexuality.sexual-health
  difficulty: 2
  type: match
  stem: จับคู่เชื้อกับข้อเท็จจริงตาม WHO
  pairs:
  - left: เอชพีวี
    right: มีวัคซีน และเป็นสาเหตุหลักของมะเร็งปากมดลูก
  - left: เอชไอวี
    right: กินยาต้านจนตรวจไม่พบเชื้อในเลือดแล้วจะไม่ส่งต่อทางเพศสัมพันธ์
  - left: หนองในเทียม
    right: รักษาหายด้วยยา ถ้าไม่รักษาอาจทำให้มีบุตรยาก
  - left: ไวรัสตับอักเสบบี
    right: มีวัคซีน ถ้าติดเรื้อรังอาจเกิดตับแข็งและมะเร็งตับ
  hints:
  - มีวัคซีนสำหรับสองไวรัส
  - เชื้อแบคทีเรียรักษาหายด้วยยา
  solution: เอชพีวีกับไวรัสตับอักเสบบีมีวัคซีน เอชไอวีควบคุมได้ด้วยยาต้านไวรัส หนองในเทียมรักษาหายแต่ถ้าปล่อยไว้ทำให้มีบุตรยาก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.sexual-health.p004
  topics:
  - health.sexuality.sexual-health
  difficulty: 2
  type: numeric
  stem: WHO แนะนำให้ใช้การคุมกำเนิดฉุกเฉินภายใน 5 วันหลังมีเพศสัมพันธ์ที่ไม่ได้ป้องกัน 5 วันเท่ากับกี่ชั่วโมง
  answer:
    value: 120
    unit: ชั่วโมง
  misconceptions:
  - match: 72
    feedback: 72 ชั่วโมงคือ 3 วัน ข้อมูลเดิมบางแหล่งใช้ 3 วันสำหรับยาบางชนิด แต่ WHO ระบุภายใน 5 วัน
  - match: 60
    feedback: 1 วันมี 24 ชั่วโมง ไม่ใช่ 12
  hints:
  - 1 วันมี 24 ชั่วโมง
  - 5 × 24
  solution: $5 \times 24 = 120$ ชั่วโมง ยิ่งใช้เร็วยิ่งได้ผล จึงไม่ควรรอจนวันที่ห้า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.sexual-health.p005
  topics:
  - health.sexuality.sexual-health
  difficulty: 2
  type: mcq
  stem: สถานการณ์ใด **เพิ่มความเสี่ยง** ต่อการมีเพศสัมพันธ์ที่ไม่ได้ตั้งใจหรือไม่ได้ป้องกัน (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: ดื่มแอลกอฮอล์ในงานเลี้ยงที่ไม่มีผู้ใหญ่
    correct: true
    feedback: ถูก แอลกอฮอล์ทำให้ตัดสินใจและปฏิเสธได้ยาก
  - id: b
    text: ไปค้างที่ห้องแฟนตามลำพังตอนดึก
    correct: true
    feedback: ถูก เป็นที่ลับตาและยากจะออกมาเมื่ออึดอัด
  - id: c
    text: นัดเจอคนที่รู้จักทางออนไลน์ตามลำพัง
    correct: true
    feedback: ถูก ไม่รู้จักตัวตนจริง และเสี่ยงถูกล่วงละเมิด
  - id: d
    text: ไปดูหนังกับกลุ่มเพื่อนรอบหัวค่ำแล้วผู้ปกครองมารับ
    feedback: เป็นกิจกรรมในที่สาธารณะ มีเพื่อนและผู้ใหญ่รู้
  - id: e
    text: คุยกับผู้ปกครองเรื่องการคบเพื่อนต่างเพศ
    feedback: เป็นปัจจัยปกป้อง
  hints:
  - ดูว่ามีสิ่งที่ทำให้ขาดสติ อยู่ในที่ลับตา หรืออยู่กับคนที่ไม่รู้จักหรือไม่
  - สถานการณ์ที่มีคนรู้ว่าเราอยู่ที่ไหนปลอดภัยกว่า
  solution: แอลกอฮอล์ ที่ลับตา และการพบคนแปลกหน้าตามลำพังเพิ่มความเสี่ยง ส่วนกิจกรรมกลุ่มในที่สาธารณะและการคุยกับผู้ปกครองเป็นปัจจัยปกป้อง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.sexual-health.p006
  topics:
  - health.sexuality.sexual-health
  difficulty: 2
  type: text
  stem: สายด่วนปรึกษาเรื่องเอดส์และท้องไม่พร้อมคือหมายเลขใด (ตอบเป็นตัวเลข 4 หลัก)
  accepted:
  - '1663'
  misconceptions:
  - match: '1600'
    feedback: 1600 คือสายเลิกบุหรี่
  - match: '1300'
    feedback: 1300 คือศูนย์ช่วยเหลือสังคม ใช้เมื่อถูกบังคับหรือถูกล่วงละเมิด
  - match: '1323'
    feedback: 1323 คือสายด่วนสุขภาพจิต
  hints:
  - ขึ้นต้นด้วย 16
  - ไม่ใช่ 1600 ซึ่งเป็นสายเลิกบุหรี่
  solution: 1663 ให้คำปรึกษาเรื่องเอดส์และท้องไม่พร้อมโดยไม่ตัดสิน ช่วยคิดทุกทางเลือกและส่งต่อบริการ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.sexual-health.p007
  topics:
  - health.sexuality.sexual-health
  difficulty: 3
  type: mcq
  stem: วิธีใดเป็นวิธีเดียวที่ป้องกันได้ทั้งการตั้งครรภ์และโรคติดต่อทางเพศสัมพันธ์รวมทั้งเอชไอวี
  choices:
  - id: a
    text: ถุงยางอนามัย
    correct: true
  - id: b
    text: ยาเม็ดคุมกำเนิด
    feedback: ป้องกันการตั้งครรภ์ได้ดี แต่ไม่ป้องกันโรค
  - id: c
    text: ยาคุมฉุกเฉิน
    feedback: ใช้หลังเหตุการณ์เพื่อป้องกันการตั้งครรภ์ ไม่ป้องกันโรค
  - id: d
    text: การหลั่งภายนอก
    feedback: เชื่อถือได้น้อยและไม่ป้องกันโรค
  hints:
  - วิธีที่กั้นไม่ให้สารคัดหลั่งสัมผัสกัน
  - WHO เขียนไว้ใน fact sheet เรื่องการคุมกำเนิด
  solution: ถุงยางอนามัยเป็นวิธีเดียวที่ป้องกันทั้งสองอย่าง ใช้ถูกวิธีทุกครั้งป้องกันการตั้งครรภ์ได้ราว 98% และลดโอกาสติดเอชไอวีและโรคติดต่อทางเพศสัมพันธ์ส่วนใหญ่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.sexual-health.p008
  topics:
  - health.sexuality.sexual-health
  difficulty: 3
  type: mcq
  stem: แอนบอกว่าแฟนกินยาคุมกำเนิดอยู่แล้ว จึงไม่ต้องใช้ถุงยางอนามัยอีก ข้อใดตอบได้ถูกต้องที่สุด
  choices:
  - id: a
    text: ยาคุมช่วยป้องกันการตั้งครรภ์ แต่ไม่ป้องกันโรคติดต่อทางเพศสัมพันธ์และเอชไอวี จึงควรใช้ถุงยางร่วมด้วย
    correct: true
  - id: b
    text: ถูกต้อง ยาคุมป้องกันทุกอย่างแล้ว
    feedback: ยาคุมไม่ป้องกันโรค
  - id: c
    text: ยาคุมทำให้มีบุตรยากถาวร ควรเลิกกิน
    feedback: WHO ระบุว่าการคุมกำเนิดสมัยใหม่ไม่ทำให้มีบุตรยาก
  - id: d
    text: ใช้ถุงยางแล้วต้องหยุดยาคุม
    feedback: ใช้ร่วมกันได้และป้องกันได้ดีขึ้น
  hints:
  - แยกการป้องกันการตั้งครรภ์กับการป้องกันโรค
  - ส่วนใหญ่ของผู้ติดเชื้อไม่มีอาการ
  solution: ยาคุมกำเนิดไม่ป้องกันโรค การใช้ถุงยางอนามัยร่วมด้วยป้องกันได้ทั้งสองอย่าง และควรปรึกษาบุคลากรสุขภาพเรื่องการกินยาคุมให้ถูกวิธี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.sexual-health.p009
  topics:
  - health.sexuality.sexual-health
  difficulty: 3
  type: numeric
  stem: WHO ประมาณว่ามีการติดเชื้อโรคติดต่อทางเพศสัมพันธ์ที่รักษาหายได้มากกว่า 1 ล้านรายต่อวัน ถ้าใช้ 1 ล้านรายต่อวัน ใน 1 ปี (365 วัน) จะมีอย่างน้อยกี่ล้านราย
  answer:
    value: 365
    unit: ล้านราย
  misconceptions:
  - match: 12
    feedback: นี่คือจำนวนเดือน ต้องคูณด้วยจำนวนวัน
  - match: 52
    feedback: นี่คือจำนวนสัปดาห์ ต้องคูณด้วยจำนวนวัน
  hints:
  - คูณจำนวนต่อวันด้วยจำนวนวันใน 1 ปี
  - 1 ล้าน × 365
  solution: $1 \times 365 = 365$ ล้านราย ใกล้กับที่ WHO ประมาณการติดเชื้อใหม่ 4 โรคหลักในปี 2020 คือ 374 ล้านราย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.sexual-health.p010
  topics:
  - health.sexuality.sexual-health
  difficulty: 3
  type: mcq
  stem: นักเรียน ม.5 คนหนึ่งตั้งครรภ์ กังวลว่าจะต้องลาออก ถูกเพื่อนนินทา และไม่รู้จะบอกพ่อแม่อย่างไร ข้อใดจัดผลกระทบได้ถูกต้อง (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: กังวลและกลัวถูกตำหนิ เป็นผลด้านจิตใจและอารมณ์
    correct: true
    feedback: ถูก
  - id: b
    text: ถูกนินทา เป็นผลด้านสังคม
    correct: true
    feedback: ถูก
  - id: c
    text: อาจต้องพักการเรียน เป็นผลด้านการศึกษา
    correct: true
    feedback: ถูก
  - id: d
    text: แม่วัยรุ่นมีความเสี่ยงสุขภาพสูงกว่า เป็นผลด้านร่างกาย
    correct: true
    feedback: ถูก WHO ระบุว่าแม่วัยรุ่นและทารกเสี่ยงสูงกว่า
  - id: e
    text: ต้องลาออกจากโรงเรียนตามกฎหมาย
    feedback: ไม่จริง พ.ร.บ. ปี 2559 ให้สถานศึกษาช่วยให้เรียนต่อได้
  hints:
  - แยกเป็นด้านร่างกาย จิตใจ การเรียน สังคม
  - ตรวจข้อที่อ้างถึงกฎหมายให้ดี
  solution: ผลกระทบมีหลายด้าน ทั้งจิตใจ สังคม การเรียน และร่างกาย แต่กฎหมายไม่ได้บังคับให้ลาออก สถานศึกษาต้องช่วยให้เรียนต่อได้ และควรปรึกษา 1663
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.sexual-health.p011
  topics:
  - health.sexuality.sexual-health
  difficulty: 4
  type: mcq
  stem: ถุงยางอนามัยแตกระหว่างมีเพศสัมพันธ์ คนสองคนนั้นควรทำอย่างไร
  choices:
  - id: a
    text: ใช้การคุมกำเนิดฉุกเฉินให้เร็วที่สุดภายใน 5 วัน และไปโรงพยาบาลเพื่อปรึกษาเรื่อง PEP และตรวจโรค หรือโทร 1663
    correct: true
  - id: b
    text: รอดูว่าประจำเดือนมาไหมแล้วค่อยคิด
    feedback: การคุมกำเนิดฉุกเฉินยิ่งช้ายิ่งได้ผลน้อย และ PEP ต้องเริ่มให้เร็ว
  - id: c
    text: ล้างด้วยน้ำยาฆ่าเชื้อแล้วก็พอ
    feedback: การล้างไม่ป้องกันการตั้งครรภ์หรือการติดเชื้อ
  - id: d
    text: กินยาคุมฉุกเฉินทุกวันหลังจากนี้แทนการคุมกำเนิดปกติ
    feedback: ยาคุมฉุกเฉินไม่ควรใช้แทนการคุมกำเนิดปกติ
  hints:
  - 'มีสองความเสี่ยง: การตั้งครรภ์และการติดเชื้อ'
  - ทั้งการคุมกำเนิดฉุกเฉินและ PEP ยิ่งเร็วยิ่งดี
  solution: ใช้การคุมกำเนิดฉุกเฉินเร็วที่สุด (ภายใน 5 วัน) และไปรับคำปรึกษาเรื่อง PEP และการตรวจโรคที่โรงพยาบาลหรือคลินิกวัยรุ่น 1663 ช่วยแนะนำได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.sexuality.sexual-health.p012
  topics:
  - health.sexuality.sexual-health
  difficulty: 4
  type: mcq
