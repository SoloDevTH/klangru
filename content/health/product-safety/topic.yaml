id: health.consumer.product-safety
subject: health
title: { th: "ผลิตภัณฑ์สุขภาพที่ปลอดภัย: ฉลาก เครื่องหมาย อย. และของใช้ของเล่นอันตราย", en: "Safe health products: labels, Thai FDA marks and hazardous toys" }
summary: ของใช้และของเล่นที่เป็นอันตราย การอ่านฉลากอาหาร ยา และเครื่องสำอาง เลขสารบบอาหาร 13 หลัก วันควรบริโภคก่อนกับวันหมดอายุ เครื่องหมาย มอก. และการตรวจสอบผลิตภัณฑ์
difficulty: 2.5
minutes: 35
prerequisites: [health.nutrition.basics]
encompasses:
  - { id: health.nutrition.basics, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ฉลากอาหารสมมติสำหรับฝึกอ่าน
    src: food-label.svg
    alt: "ฉลากสมมติของข้าวเกรียบรสต้มยำ ตราใบเตย มีกรอบ อย. เลข 10-1-12345-6-0001 น้ำหนักสุทธิ 30 กรัม ผลิต 15/01/69 ควรบริโภคก่อน 15/07/69 ส่วนประกอบ แป้งมันสำปะหลัง 60% กุ้ง 20% น้ำมันปาล์ม เครื่องปรุงรสต้มยำ เกลือ น้ำตาล กรอบสีแดงเขียนว่า ข้อมูลสำหรับผู้แพ้อาหาร: มีกุ้ง อาจมีถั่วลิสง ใช้วัตถุกันเสีย ผลิตโดยบริษัท ขนมสมมติ จำกัด เขตบางกะปิ กรุงเทพมหานคร เก็บในที่แห้งและเย็น"
    caption: "ฉลากและเลขในภาพเป็นของสมมติ ใช้ฝึกหาข้อมูลที่ฉลากอาหารต้องแสดง"
  - type: figure
    title: โครงสร้างเลขสารบบอาหาร
    src: fda-number.svg
    alt: "แผนภาพกรอบ อย. ที่มีเลขสมมติ 10-1-12345-6-0001 แยกเป็นห้ากลุ่ม กลุ่ม 1 สองหลัก จังหวัดที่ตั้งสถานที่ผลิตหรือนำเข้า กลุ่ม 2 หนึ่งหลัก สถานะสถานที่และผู้อนุญาต กลุ่ม 3 ห้าหลัก เลขสถานที่ผลิตและปีที่อนุญาต กลุ่ม 4 หนึ่งหลัก หน่วยงานที่ออกเลข กลุ่ม 5 สี่หลัก ลำดับที่ของผลิตภัณฑ์"
    caption: "รวม 2 + 1 + 5 + 1 + 4 = 13 หลัก ความหมายของแต่ละกลุ่มตามสื่อการสอนของมูลนิธิการศึกษาทางไกลผ่านดาวเทียม (DLTV)"
  - type: worked-example
    title: อ่านฉลากก่อนตัดสินใจซื้อ
    problem: "วันที่ 20 กรกฎาคม 2569 น้ำเห็นข้าวเกรียบสมมติลดราคาในร้าน น้ำแพ้ถั่วลิสง ควรซื้อหรือไม่ เพราะอะไร"
    figure:
      src: food-label.svg
      alt: "ฉลากสมมติของข้าวเกรียบรสต้มยำ ตราใบเตย มีกรอบ อย. เลข 10-1-12345-6-0001 น้ำหนักสุทธิ 30 กรัม ผลิต 15/01/69 ควรบริโภคก่อน 15/07/69 ส่วนประกอบ แป้งมันสำปะหลัง 60% กุ้ง 20% น้ำมันปาล์ม เครื่องปรุงรสต้มยำ เกลือ น้ำตาล กรอบสีแดงเขียนว่า ข้อมูลสำหรับผู้แพ้อาหาร: มีกุ้ง อาจมีถั่วลิสง ใช้วัตถุกันเสีย ผลิตโดยบริษัท ขนมสมมติ จำกัด เขตบางกะปิ กรุงเทพมหานคร เก็บในที่แห้งและเย็น"
    steps:
      - text: "อ่านวันที่: ควรบริโภคก่อน 15/07/69 คือ 15 กรกฎาคม 2569"
      - text: "เทียบกับวันนี้ 20 กรกฎาคม 2569 เลยวันมาแล้ว $20 - 15 = 5$ วัน"
        why: "ตามประกาศกระทรวงสาธารณสุข (ฉบับที่ 367) อาหารที่เลยวันที่ระบุวางจำหน่ายไม่ได้"
      - text: "อ่านข้อมูลสำหรับผู้แพ้อาหาร: อาจมีถั่วลิสง"
        why: "คำว่า อาจมี แปลว่ากระบวนการผลิตอาจปนเปื้อน คนที่แพ้รุนแรงควรหลีกเลี่ยง"
      - text: "สรุป: ไม่ควรซื้อ ทั้งเพราะเลยวันที่และเสี่ยงต่อการแพ้ และควรบอกพนักงานให้นำออกจากชั้น"
    answer: "ไม่ควรซื้อ เพราะเลยวันควรบริโภคก่อน 5 วัน และอาจมีถั่วลิสงที่น้ำแพ้"
  - { type: check, problem: health.consumer.product-safety.p004 }
  - type: worked-example
    title: ของเล่นชิ้นนี้ปลอดภัยไหม
    problem: "ป้าจะซื้อชุดของเล่นทำครัวพลาสติกให้หลานอายุ 2 ขวบ กล่องมีเครื่องหมาย มอก. และเขียนว่า \"เหมาะสำหรับเด็กอายุ 3 ปีขึ้นไป มีชิ้นส่วนขนาดเล็ก\" ควรแนะนำป้าอย่างไร"
    steps:
      - text: "ตรวจเครื่องหมาย: มี มอก. แปลว่าผ่านมาตรฐานของเล่น ซึ่งรวมถึงเรื่องสารเคมีและโลหะหนัก"
      - text: "ตรวจอายุที่เหมาะสม: กล่องระบุ 3 ปีขึ้นไป แต่หลานอายุ 2 ขวบ"
        why: "ของเล่นที่ผ่านมาตรฐานก็ยังอันตรายได้ถ้าให้เด็กที่อายุต่ำกว่าที่กำหนดเล่น"
      - text: "ระบุอันตราย: ชิ้นส่วนเล็กเสี่ยงต่อการกลืนหรือสำลักในเด็กเล็กที่ชอบเอาของเข้าปาก"
      - text: "เสนอทางเลือก: เลือกของเล่นที่ระบุว่าเหมาะกับเด็กอายุต่ำกว่า 3 ปี ชิ้นใหญ่ ไม่มีชิ้นส่วนหลุด"
    answer: "ยังไม่เหมาะกับหลานอายุ 2 ขวบ ควรเลือกของเล่นชิ้นใหญ่ที่ระบุอายุเหมาะสมและมี มอก."
  - { type: check, problem: health.consumer.product-safety.p001 }
glossary:
  - { term: เลขสารบบอาหาร, definition: "เลข 13 หลักในกรอบเครื่องหมาย อย. บนอาหารที่ได้รับอนุญาต ใช้ตรวจสอบได้ว่าผลิตภัณฑ์ขึ้นทะเบียนถูกต้อง" }
  - { term: ควรบริโภคก่อน, definition: "วันสิ้นสุดช่วงที่อาหารยังมีคุณภาพดีเมื่อเก็บตามที่ฉลากบอก หลังวันนี้อาหารวางจำหน่ายไม่ได้" }
  - { term: หมดอายุ, definition: "วันสิ้นสุดคุณภาพของอาหารหรือยา ภาษาอังกฤษใช้ EXP" }
  - { term: เลขที่ใบรับจดแจ้ง, definition: "เลขที่เครื่องสำอางได้รับเมื่อแจ้งรายละเอียดต่อ อย. แสดงบนฉลากแทนกรอบ อย." }
  - { term: มอก., definition: "มาตรฐานผลิตภัณฑ์อุตสาหกรรม ของเล่นเด็กต้องเป็นไปตาม มอก. 685 เล่ม 1-2562 และมีเครื่องหมาย มอก." }
  - { term: ข้อมูลสำหรับผู้แพ้อาหาร, definition: "ข้อความบนฉลากที่บอกว่ามีหรืออาจมีสารก่อภูมิแพ้ เช่น กุ้ง ถั่วลิสง นม ไข่" }
flashcards:
  - { front: "เลขสารบบอาหารมีกี่หลัก เขียนแบบใด", back: "13 หลัก แบบ XX-X-XXXXX-X-XXXX กลุ่มแรก 2 หลักบอกจังหวัดที่ตั้งสถานที่ผลิตหรือนำเข้า" }
  - { front: "ยา เครื่องสำอาง และของเล่น ดูเลขหรือเครื่องหมายอะไร", back: "ยา: เลขทะเบียนตำรับยา เครื่องสำอาง: เลขที่ใบรับจดแจ้ง ของเล่น: เครื่องหมาย มอก." }
  - { front: "ควรบริโภคก่อน กับ หมดอายุ ต่างกันอย่างไร", back: "ควรบริโภคก่อนคือวันสิ้นสุดช่วงคุณภาพดี หมดอายุคือวันสิ้นสุดคุณภาพ ตามกฎหมายไทยหลังวันที่ระบุทั้งสองแบบวางขายไม่ได้" }
  - { front: "ของเล่นแบบใดอันตรายต่อเด็กเล็ก", back: "ชิ้นส่วนเล็ก ถ่านกระดุม แม่เหล็กเม็ดเล็ก ลูกโป่ง ขอบคม สีลอก และของเล่นที่ไม่มี มอก." }
  - { front: "พบผลิตภัณฑ์สุขภาพผิดกฎหมายแจ้งที่ไหน", back: "สายด่วน อย. 1556 และบอกผู้ปกครอง" }
