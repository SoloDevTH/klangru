  - ยอดแหลมเกินมีขนาดประมาณเก้าเปอร์เซ็นต์ของการกระโดดและไม่หายไปเมื่อเพิ่มพจน์
  solution: เรียกว่าปรากฏการณ์กิบส์ ที่ยอดแหลมเกินไม่หายไปแม้จำนวนพจน์เพิ่มขึ้น แต่จะขยับเข้าใกล้จุดกระโดด
