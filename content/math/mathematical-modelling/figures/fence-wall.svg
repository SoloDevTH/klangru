<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" font-family="sans-serif"><title>แปลงผักรูปสี่เหลี่ยมผืนผ้าติดกำแพงด้านบน ด้านที่ติดกำแพงยาว x เมตรไม่ต้องล้อมรั้ว อีกสามด้านล้อมรั้ว ด้านที่ตั้งฉากกับกำแพงยาว y เมตรสองด้าน และด้านตรงข้ามกำแพงยาว x เมตร พื้นที่ 200 ตารางเมตร</title><rect width="420" height="280" fill="#fff"/><rect x="40.0" y="30.0" width="340.0" height="22.0" fill="#ccc" stroke="#777" stroke-width="1.2"/>
<text x="210.0" y="41.0" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#333">กำแพง</text>
