<circle cx="525.0" cy="125.0" r="57.9" fill="#f0b45e" stroke="#1d3557" stroke-width="1.8" />
<text x="525.0" y="131.0" font-size="16" text-anchor="middle" fill="#222" font-weight="bold" font-family="sans-serif" >Cl⁻</text>
<text x="525.0" y="202.9" font-size="13" text-anchor="middle" fill="#333" font-weight="normal" font-family="sans-serif" >181 pm</text>
<text x="310.0" y="30.0" font-size="16" text-anchor="middle" fill="#222" font-weight="bold" font-family="sans-serif" >อะตอม → ไอออน</text>
<text x="640.0" y="95.0" font-size="15" text-anchor="start" fill="#222" font-weight="normal" font-family="sans-serif" >ไอออนบวกเล็กกว่าอะตอม</text>
<text x="640.0" y="118.0" font-size="13" text-anchor="start" fill="#444" font-weight="normal" font-family="sans-serif" >(เสียอิเล็กตรอนชั้นนอกทั้งชั้น)</text>
<text x="640.0" y="150.0" font-size="15" text-anchor="start" fill="#222" font-weight="normal" font-family="sans-serif" >ไอออนลบใหญ่กว่าอะตอม</text>
<text x="640.0" y="173.0" font-size="13" text-anchor="start" fill="#444" font-weight="normal" font-family="sans-serif" >(อิเล็กตรอนเพิ่ม ผลักกันมากขึ้น)</text>
<line x1="20.0" y1="230.0" x2="880.0" y2="230.0" stroke="#ccc" stroke-width="1" />
<text x="450.0" y="262.0" font-size="16" text-anchor="middle" fill="#222" font-weight="bold" font-family="sans-serif" >ไอออนที่มีอิเล็กตรอน 10 ตัวเท่ากัน: โปรตอนยิ่งมาก ไอออนยิ่งเล็ก</text>
