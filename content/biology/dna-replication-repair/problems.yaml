problems:
  - id: biology.genetics.dna-replication-repair.p001
    topics: [biology.genetics.dna-replication-repair]
    difficulty: 1
    type: mcq
    stem: "ดีเอ็นเอจำลองตัวเองแบบใดตามผลการทดลองของเมเซลสันและสตาห์ล"
    choices:
      - { id: a, text: "กึ่งอนุรักษ์ โมเลกุลใหม่แต่ละโมเลกุลมีสายเดิมหนึ่งสายและสายใหม่หนึ่งสาย", correct: true }
      - { id: b, text: "อนุรักษ์ โมเลกุลเดิมยังคงอยู่ครบและสร้างโมเลกุลใหม่ที่เป็นสายใหม่ทั้งหมด", feedback: "ถ้าเป็นแบบอนุรักษ์ ผลการทดลองจะไม่พบดีเอ็นเอระดับกลางหลังรอบแรก" }
      - { id: c, text: "กระจาย สายดีเอ็นเอถูกตัดเป็นชิ้นเล็กแล้วสร้างใหม่แบบสุ่ม", feedback: "ผลการทดลองไม่สนับสนุนการจำลองแบบกระจาย" }
      - { id: d, text: "ไม่มีการจำลอง เซลล์ใช้ดีเอ็นเอเดิมตลอด", feedback: "เซลล์ต้องคัดลอกดีเอ็นเอก่อนแบ่งตัวเพื่อให้เซลล์ลูกได้ข้อมูลครบ" }
    hints:
      - "ลองนึกว่าผลการทดลองมีดีเอ็นเอระดับความหนาแน่นกลาง ซึ่งแสดงว่ามีทั้งสายหนักและสายเบา"
      - "คำว่ากึ่งหมายถึงครึ่งหนึ่งของเดิมที่ยังคงอยู่"
    solution: "ผลการทดลองของเมเซลสันและสตาห์ลแสดงว่าดีเอ็นเอจำลองแบบกึ่งอนุรักษ์ แต่ละโมเลกุลลูกประกอบด้วยสายเดิมหนึ่งสายและสายใหม่หนึ่งสาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.dna-replication-repair.p002
    topics: [biology.genetics.dna-replication-repair]
    difficulty: 1
    type: text
    stem: "ชิ้นดีเอ็นเอสั้น ๆ ที่สังเคราะห์บนสายตามระหว่างการจำลองดีเอ็นเอมีชื่อเรียกว่าอะไร"
    accepted: ["ชิ้นโอคาซากิ", "โอคาซากิ", "Okazaki fragment", "Okazaki fragments", "โอคาซากิ (Okazaki)"]
    hints:
      - "ชื่อนี้ตั้งตามนักวิทยาศาสตร์ชาวญี่ปุ่น"
      - "ชิ้นเหล่านี้ต้องถูกเชื่อมภายหลังด้วยไลเกส"
    solution: "ชิ้นโอคาซากิ (Okazaki fragments) คือชิ้นดีเอ็นเอสั้นที่สังเคราะห์บนสายตาม และถูกเชื่อมเป็นสายต่อเนื่องด้วยดีเอ็นเอไลเกส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.dna-replication-repair.p003
    topics: [biology.genetics.dna-replication-repair]
    difficulty: 2
    type: mcq
    stem: "เอนไซม์ใดทำหน้าที่คลายเกลียวดีเอ็นเอและแยกสายออกจากกันที่ส้อมจำลอง"
    choices:
      - { id: a, text: "เฮลิเคส", correct: true }
      - { id: b, text: "ดีเอ็นเอไลเกส", feedback: "ไลเกสเชื่อมชิ้นดีเอ็นเอที่ขาดกัน ไม่ได้แยกสาย" }
      - { id: c, text: "ไพรเมส", feedback: "ไพรเมสสร้างไพรเมอร์ RNA ไม่ได้คลายเกลียว" }
      - { id: d, text: "เทโลเมอเรส", feedback: "เทโลเมอเรสเติมลำดับที่ปลายโครโมโซม ไม่ได้คลายเกลียวที่ส้อม" }
    hints:
      - "ชื่อเอนไซม์นี้มาจากคำที่แปลว่าเกลียว"
      - "เอนไซม์ตัวนี้ทำงานก่อนตัวอื่นที่ส้อมจำลอง"
    solution: "เฮลิเคสใช้พลังงานจาก ATP คลายเกลียวดีเอ็นเอและแยกสายออกจากกัน ทำให้เกิดส้อมจำลอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.dna-replication-repair.p004
    topics: [biology.genetics.dna-replication-repair]
    difficulty: 2
    type: mcq
    stem: "ไพรเมอร์ RNA ที่ไพรเมสสร้างขึ้นมีหน้าที่อะไรในการจำลองดีเอ็นเอ"
    choices:
      - { id: a, text: "เป็นจุดเริ่มให้ดีเอ็นเอพอลิเมอเรสเติมนิวคลีโอไทด์ต่อได้", correct: true }
      - { id: b, text: "เชื่อมชิ้นโอคาซากิเข้าด้วยกัน", feedback: "การเชื่อมชิ้นเป็นหน้าที่ของดีเอ็นเอไลเกส" }
      - { id: c, text: "คลายความตึงเครียดด้านหน้าส้อม", feedback: "การคลายความตึงเป็นหน้าที่ของโทโพไอโซเมอเรส" }
      - { id: d, text: "ทำให้สายดีเอ็นเอแยกออกจากกัน", feedback: "การแยกสายเป็นหน้าที่ของเฮลิเคส" }
    hints:
      - "พอลิเมอเรสไม่สามารถเริ่มเติมนิวคลีโอไทด์จากศูนย์ได้"
      - "ไพรเมอร์ให้ปลายอิสระที่มีหมู่ 3′-OH"
    solution: "ไพรเมอร์ RNA ให้ปลาย 3′-OH ที่ดีเอ็นเอพอลิเมอเรสใช้เริ่มเติมนิวคลีโอไทด์ได้ ต่อมาไพรเมอร์จะถูกแทนที่ด้วยดีเอ็นเอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.dna-replication-repair.p005
    topics: [biology.genetics.dna-replication-repair]
    difficulty: 2
    type: mcq
    stem: "เหตุใดสายตามจึงถูกสังเคราะห์เป็นชิ้นสั้น ๆ ในขณะที่สายนำสังเคราะห์ต่อเนื่อง"
    choices:
      - { id: a, text: "เพราะดีเอ็นเอพอลิเมอเรสเติมนิวคลีโอไทด์ได้เฉพาะทิศ 5′→3′ ซึ่งสวนทิศการคลายเกลียวบนสายตาม", correct: true }
      - { id: b, text: "เพราะสายตามมีนิวคลีโอไทด์น้อยกว่าสายนำ", feedback: "จำนวนนิวคลีโอไทด์ไม่ได้เป็นสาเหตุของการสังเคราะห์เป็นชิ้น" }
      - { id: c, text: "เพราะสายตามไม่ต้องใช้เอนไซม์ใด ๆ", feedback: "สายตามต้องใช้เอนไซม์หลายตัว รวมถึงพอลิเมอเรสและไลเกส" }
      - { id: d, text: "เพราะสายตามถูกทำลายโดยรังสี UV", feedback: "การสังเคราะห์เป็นชิ้นเป็นกระบวนการปกติของการจำลอง ไม่ได้เกิดจากความเสียหาย" }
    hints:
      - "ดีเอ็นเอพอลิเมอเรสเติมนิวคลีโอไทด์ในทิศเดียว"
      - "เมื่อส้อมคลายออกไป สายตามต้องสังเคราะห์ย้อนทิศกับการเคลื่อนของส้อม"
    solution: "ดีเอ็นเอพอลิเมอเรสสร้างสายได้เฉพาะ 5′→3′ สายตามจึงต้องสังเคราะห์ทีละชิ้นย้อนทิศกับการเคลื่อนที่ของส้อม แล้วเชื่อมด้วยไลเกส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.dna-replication-repair.p006
    topics: [biology.genetics.dna-replication-repair]
    difficulty: 2
    type: mcq
    stem: "ดีเอ็นเอไลเกสมีหน้าที่หลักอย่างไรในการจำลองดีเอ็นเอ"
    choices:
      - { id: a, text: "เชื่อมชิ้นดีเอ็นเอที่อยู่ติดกันให้เป็นสายเดียวต่อเนื่อง", correct: true }
      - { id: b, text: "คลายเกลียวดีเอ็นเอออกจากกัน", feedback: "การคลายเกลียวเป็นหน้าที่ของเฮลิเคส" }
      - { id: c, text: "สร้างไพรเมอร์ RNA ที่จุดเริ่มต้น", feedback: "การสร้างไพรเมอร์เป็นหน้าที่ของไพรเมส" }
      - { id: d, text: "ตัดดีเอ็นเอออกเป็นชิ้นเล็กเพื่อซ่อมแซม", feedback: "ไลเกสเชื่อมชิ้น ไม่ได้ตัดชิ้นดีเอ็นเอ" }
    hints:
      - "ชื่อเอนไซม์มาจากคำว่าเชื่อมหรือต่อ"
      - "ไลเกสทำงานหลังชิ้นดีเอ็นเอถูกสังเคราะห์แล้ว"
    solution: "ดีเอ็นเอไลเกสสร้างพันธะฟอสโฟไดเอสเทอร์เชื่อมปลายชิ้นดีเอ็นเอที่อยู่ติดกัน ทำให้ได้สายต่อเนื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.dna-replication-repair.p007
    topics: [biology.genetics.dna-replication-repair]
    difficulty: 2
    type: numeric
    stem: "โพรแคริโอตมีโครโมโซมวงกลมขนาด 4,600,000 คู่เบส มีจุดเริ่มจำลองเพียงหนึ่งจุดและมีส้อมจำลองสองทิศทาง สมมติว่าแต่ละส้อมเคลื่อนที่ได้ 1,000 คู่เบสต่อวินาที การจำลองทั้งโครโมโซมใช้เวลากี่นาที (ตอบทศนิยมหนึ่งตำแหน่ง)"
    answer: { value: 38.3, tolerance: 0.1, unit: "นาที" }
    misconceptions:
      - { match: 76.7, feedback: "ไม่ได้แบ่งโครโมโซมให้ส้อมทั้งสองทิศทางแต่ละส้อมทำครึ่งหนึ่ง ต้องหาร 2 ก่อน" }
      - { match: 2300, feedback: "ได้ผลเป็นวินาที ต้องแปลงเป็นนาทีโดยหารด้วย 60" }
    hints:
      - "แต่ละส้อมจำลองครึ่งหนึ่งของโครโมโซม"
      - "หน่วยเวลาในโจทย์เป็นวินาที ต้องแปลงเป็นนาทีที่ท้ายสุด"
    solution: "แต่ละส้อมจำลอง 4,600,000 ÷ 2 = 2,300,000 คู่เบส ใช้เวลา 2,300,000 ÷ 1,000 = 2,300 วินาที = 38.3 นาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.dna-replication-repair.p008
    topics: [biology.genetics.dna-replication-repair]
    difficulty: 2
    type: numeric
    stem: "(ตัวเลขสมมติ) โครโมโซมยูแคริโอตช่วงหนึ่งยาว 100,000 คู่เบส มีจุดเริ่มจำลองจุดแรกที่ตำแหน่ง 5,000 และมีจุดถัดไปทุก ๆ 10,000 คู่เบส (5,000, 15,000, 25,000, ...) จนสุดช่วง ช่วงนี้มีจุดเริ่มจำลองกี่จุด (ตอบเป็นจำนวนจุด)"
    answer: { value: 10, tolerance: 0, unit: "จุด" }
    misconceptions:
      - { match: 9, feedback: "นับเฉพาะจำนวนระยะห่างระหว่างจุดแรกกับจุดสุดท้าย (5,000 ถึง 95,000 มี 9 ช่วง) ต้องบวกจุดแรกอีก 1 จุด" }
      - { match: 11, feedback: "นับเกินไปถึงตำแหน่ง 105,000 ซึ่งอยู่นอกช่วง 100,000 คู่เบส" }
    hints:
      - "เขียนตำแหน่งของจุดเริ่มจำลองไล่ไปจนตำแหน่งสุดท้ายที่ยังไม่เกิน 100,000"
      - "จุดสุดท้ายอยู่ที่ 95,000 นับจำนวนจุดจาก 5,000 ถึง 95,000 ที่ห่างกันทีละ 10,000"
    solution: "จุดเริ่มจำลองอยู่ที่ 5,000, 15,000, ..., 95,000 จำนวนจุด = (95,000 − 5,000) ÷ 10,000 + 1 = 9 + 1 = 10 จุด การมีจุดเริ่มหลายจุดทำให้โครโมโซมยาวของยูแคริโอตจำลองเสร็จทันเวลา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.dna-replication-repair.p009
    topics: [biology.genetics.dna-replication-repair]
    difficulty: 2
    type: numeric
    stem: "นักเรียนไทยทดลองสกัดดีเอ็นเอจากกล้วยในห้องปฏิบัติการโรงเรียน แล้วสงสัยว่าดีเอ็นเอของกล้วยจำลองตัวอย่างไร สมมติว่าสายตามช่วงหนึ่งยาว 1,000 นิวคลีโอไทด์ และชิ้นโอคาซากิของยูแคริโอตแต่ละชิ้นยาว 200 นิวคลีโอไทด์พอดีโดยไม่คิดไพรเมอร์ สายตามจะมีชิ้นโอคาซากิกี่ชิ้น (ตอบเป็นจำนวนชิ้น)"
    answer: { value: 5, tolerance: 0, unit: "ชิ้น" }
    misconceptions:
      - { match: 4, feedback: "คิดว่าต้องตัดชิ้นแรกออกจึงได้ 4 ชิ้น แต่สายยาวพอดี 5 ชิ้น หารตรง ๆ ได้ 5" }
      - { match: 200, feedback: "ตอบความยาวของชิ้นแทนจำนวนชิ้น" }
    hints:
      - "หารความยาวทั้งสายด้วยความยาวของแต่ละชิ้น"
      - "จำนวนชิ้นเป็นจำนวนเต็ม"
    solution: "1,000 ÷ 200 = 5 ชิ้น (ชิ้นโอคาซากิของยูแคริโอตยาวราว 100–200 นิวคลีโอไทด์ ส่วนของแบคทีเรียยาวราว 1,000–2,000 นิวคลีโอไทด์)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.dna-replication-repair.p010
    topics: [biology.genetics.dna-replication-repair]
    difficulty: 3
    type: numeric
    stem: "(ตัวเลขสมมติ) นักวิจัยไทยศึกษาเซลล์ที่ไม่มีเทโลเมอเรส เทโลเมียร์ของเซลล์เริ่มยาว 10,000 คู่เบส ทุกการแบ่งเซลล์สั้นลง 50 คู่เบส ถ้าเทโลเมียร์สั้นลงจนเหลือ 5,000 คู่เบส เซลล์นี้แบ่งตัวได้กี่ครั้ง (ตอบเป็นจำนวนครั้ง)"
    answer: { value: 100, tolerance: 0, unit: "ครั้ง" }
    misconceptions:
      - { match: 200, feedback: "หาร 10,000 ด้วย 50 เหมือนเทโลเมียร์หายหมด แต่โจทย์ให้หยุดเมื่อเหลือ 5,000 คู่เบส ต้องใช้ส่วนที่สั้นลงจริง 5,000 คู่เบส" }
      - { match: 5000, feedback: "5,000 คือจำนวนคู่เบสที่สั้นลงทั้งหมด ยังต้องหารด้วย 50 คู่เบสต่อการแบ่ง" }
    hints:
      - "หาก่อนว่าเทโลเมียร์สั้นลงไปทั้งหมดกี่คู่เบส"
      - "จำนวนการแบ่งคือปริมาณที่สั้นลงทั้งหมดหารด้วยการสั้นลงต่อครั้ง"
    solution: "สั้นลงทั้งหมด = 10,000 − 5,000 = 5,000 คู่เบส จำนวนการแบ่ง = 5,000 ÷ 50 = 100 ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.dna-replication-repair.p011
    topics: [biology.genetics.dna-replication-repair]
    difficulty: 5
    type: numeric
    stem: "ดีเอ็นเอพอลิเมอเรสผิดพลาด 1 ครั้งต่อ 100,000 นิวคลีโอไทด์ที่เพิ่มเข้าไป การพิสูจน์อักษรของพอลิเมอเรสลดข้อผิดพลาดลงได้ราว 100 เท่า ผลสุดท้ายจะมีข้อผิดพลาดกี่ครั้งต่อ 1,000,000 นิวคลีโอไทด์ (ตอบทศนิยมหนึ่งตำแหน่ง)"
    answer: { value: 0.1, tolerance: 0.001, unit: "ครั้ง" }
    misconceptions:
      - { match: 10, feedback: "ลืมนำการพิสูจน์อักษรที่ลดข้อผิดพลาด 100 เท่ามาคิด ก่อนลดข้อผิดพลาดจะมี 10 ครั้งต่อ 1,000,000 นิวคลีโอไทด์" }
      - { match: 1, feedback: "หารผิดหนึ่งครั้งหรือปัดตัวเลขผิด ต้องคิด 10 ÷ 100 = 0.1" }
    hints:
      - "หาก่อนว่าก่อนการลดมีกี่ครั้งต่อ 1,000,000 นิวคลีโอไทด์"
      - "ตัวลดเป็นการหารด้วย 100"
