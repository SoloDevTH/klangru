completeness: full-text
strands:
  - id: "DT-K"
    title: "Knowledge and understanding"
    standards:
      - id: "DT-K-DS"
        text: "Digital systems"
        indicators:
          - { id: "AC9TDIFK01", level: "F", text: "recognise and explore digital systems (hardware and software) for a purpose" }
          - { id: "AC9TDI2K01", level: "1-2", text: "identify and explore digital systems and their components for a purpose" }
          - { id: "AC9TDI4K01", level: "3-4", text: "explore and describe a range of digital systems and their peripherals for a variety of purposes" }
          - { id: "AC9TDI4K02", level: "3-4", text: "explore transmitting different types of data between digital systems" }
          - { id: "AC9TDI6K01", level: "5-6", text: "investigate the main internal components of common digital systems and their function" }
          - { id: "AC9TDI6K02", level: "5-6", text: "examine how digital systems form networks to transmit data" }
          - { id: "AC9TDI8K01", level: "7-8", text: "explain how hardware specifications affect performance and select appropriate hardware for particular tasks and workloads" }
          - { id: "AC9TDI8K02", level: "7-8", text: "investigate how data is transmitted and secured in wired and wireless networks including the internet" }
          - { id: "AC9TDI10K01", level: "9-10", text: "investigate how hardware and software manage, control and secure access to data in networked digital systems" }
      - id: "DT-K-DR"
        text: "Data representation"
        indicators:
          - { id: "AC9TDIFK02", level: "F", text: "represent data as objects, pictures and symbols" }
          - { id: "AC9TDI2K02", level: "1-2", text: "represent data as pictures, symbols, numbers and words" }
          - { id: "AC9TDI4K03", level: "3-4", text: "recognise different types of data and explore how the same data can be represented differently depending on the purpose" }
          - { id: "AC9TDI6K03", level: "5-6", text: "explain how digital systems represent all data using numbers" }
          - { id: "AC9TDI6K04", level: "5-6", text: "explore how data can be represented by off and on states (zeros and ones in binary)" }
          - { id: "AC9TDI8K03", level: "7-8", text: "investigate how digital systems represent text, image and audio data using integers" }
          - { id: "AC9TDI8K04", level: "7-8", text: "explain how and why digital systems represent integers in binary" }
          - { id: "AC9TDI10K02", level: "9-10", text: "represent documents online as content (text), structure (markup) and presentation (styling) and explain why such representations are important" }
          - { id: "AC9TDI10K03", level: "9-10", text: "investigate simple data compression techniques" }
  - id: "DT-P"
    title: "Processes and production skills"
    standards:
      - id: "DT-P-PS"
        text: "Privacy and security"
        indicators:
          - { id: "AC9TDIFP01", level: "F", text: "identify some data that is personal and owned by them" }
          - { id: "AC9TDI2P06", level: "1-2", text: "access their school account with a recorded username and password" }
          - { id: "AC9TDI2P07", level: "1-2", text: "discuss that some websites and apps store their personal data online" }
          - { id: "AC9TDI4P08", level: "3-4", text: "access their school account using a memorised password and explain why it should be easy to remember, but hard for others to guess" }
          - { id: "AC9TDI4P09", level: "3-4", text: "identify what personal data is stored and shared in their online accounts and discuss any associated risks" }
          - { id: "AC9TDI6P09", level: "5-6", text: "access multiple personal accounts using unique passphrases and explain the risks of password re-use" }
          - { id: "AC9TDI6P10", level: "5-6", text: "explain the creation and permanence of their digital footprint and consider privacy when collecting user data" }
          - { id: "AC9TDI8P13", level: "7-8", text: "explain how multi-factor authentication protects an account when the password is compromised and identify phishing and other cyber security threats" }
          - { id: "AC9TDI8P14", level: "7-8", text: "investigate and manage the digital footprint existing systems and student solutions collect and assess if the data is essential to their purpose", note: "ข้อความตามเว็บไซต์ ACARA เอกสาร curriculum content (Word) พิมพ์ว่า \"investigate and manage the digital footprint existing systems and student solutions collect, and assess if the data is essential to their purpose\" · เอกสาร scope and sequence พิมพ์ว่า \"investigate and manage the digital footprint existing systems and student solutions collect, and assess if the data is essential to their purpose\"" }
          - { id: "AC9TDI10P13", level: "9-10", text: "develop cyber security threat models, and explore a software, user or software supply chain vulnerability" }
          - { id: "AC9TDI10P14", level: "9-10", text: "apply the Australian Privacy Principles to critique and manage the digital footprint that existing systems and student solutions collect" }
      - id: "DT-P-ID"
        text: "Investigating and defining"
        indicators:
          - { id: "AC9TDI2P01", level: "1-2", text: "investigate simple problems for known users that can be solved with digital systems" }
          - { id: "AC9TDI4P01", level: "3-4", text: "define problems with given design criteria and by co-creating user stories" }
          - { id: "AC9TDI6P01", level: "5-6", text: "define problems with given or co-developed design criteria and by creating user stories", note: "ข้อความตามเว็บไซต์ ACARA เอกสาร curriculum content (Word) พิมพ์ว่า \"define problems with given or codeveloped design criteria and by creating user stories\" · เอกสาร scope and sequence พิมพ์ว่า \"define problems with given or codeveloped design criteria and by creating user stories\"" }
          - { id: "AC9TDI8P04", level: "7-8", text: "define and decompose real-world problems with design criteria and by creating user stories" }
          - { id: "AC9TDI10P04", level: "9-10", text: "define and decompose real-world problems with design criteria and by interviewing stakeholders to create user stories" }
      - id: "DT-P-GD"
        text: "Generating and designing"
        indicators:
          - { id: "AC9TDI2P02", level: "1-2", text: "follow and describe algorithms involving a sequence of steps, branching (decisions) and iteration (repetition)" }
          - { id: "AC9TDI4P02", level: "3-4", text: "follow and describe algorithms involving sequencing, comparison operators (branching) and iteration" }
          - { id: "AC9TDI4P03", level: "3-4", text: "generate, communicate and compare designs" }
          - { id: "AC9TDI6P02", level: "5-6", text: "design algorithms involving multiple alternatives (branching) and iteration" }
          - { id: "AC9TDI6P03", level: "5-6", text: "design a user interface for a digital system" }
          - { id: "AC9TDI6P04", level: "5-6", text: "generate, modify, communicate and evaluate designs" }
          - { id: "AC9TDI8P05", level: "7-8", text: "design algorithms involving nested control structures and represent them using flowcharts and pseudocode" }
          - { id: "AC9TDI8P06", level: "7-8", text: "trace algorithms to predict output for a given input and to identify errors" }
          - { id: "AC9TDI8P07", level: "7-8", text: "design the user experience of a digital system" }
          - { id: "AC9TDI8P08", level: "7-8", text: "generate, modify, communicate and evaluate alternative designs" }
          - { id: "AC9TDI10P05", level: "9-10", text: "design algorithms involving logical operators and represent them as flowcharts and pseudocode" }
          - { id: "AC9TDI10P06", level: "9-10", text: "validate algorithms and programs by comparing their output against a range of test cases" }
          - { id: "AC9TDI10P07", level: "9-10", text: "design and prototype the user experience of a digital system" }
          - { id: "AC9TDI10P08", level: "9-10", text: "generate, modify, communicate and critically evaluate alternative designs" }
      - id: "DT-P-EVA"
        text: "Evaluating"
        indicators:
          - { id: "AC9TDI2P03", level: "1-2", text: "discuss how existing digital systems satisfy identified needs for known users" }
          - { id: "AC9TDI4P05", level: "3-4", text: "discuss how existing and student solutions satisfy the design criteria and user stories" }
          - { id: "AC9TDI6P06", level: "5-6", text: "evaluate existing and student solutions against the design criteria and user stories and their broader community impact" }
          - { id: "AC9TDI8P10", level: "7-8", text: "evaluate existing and student solutions against the design criteria, user stories and possible future impact" }
          - { id: "AC9TDI10P10", level: "9-10", text: "evaluate existing and student solutions against the design criteria, user stories, possible future impact and opportunities for enterprise" }
      - id: "DT-P-CM"
        text: "Collaborating and managing"
        indicators:
          - { id: "AC9TDI2P04", level: "1-2", text: "use the basic features of common digital tools to create, locate and communicate content" }
          - { id: "AC9TDI2P05", level: "1-2", text: "use the basic features of common digital tools to share content and collaborate demonstrating agreed behaviours, guided by trusted adults" }
          - { id: "AC9TDI4P06", level: "3-4", text: "use the core features of common digital tools to create, locate and communicate content, following agreed conventions" }
          - { id: "AC9TDI4P07", level: "3-4", text: "use the core features of common digital tools to share content, plan tasks, and collaborate, following agreed behaviours, supported by trusted adults" }
          - { id: "AC9TDI6P07", level: "5-6", text: "select and use appropriate digital tools effectively to create, locate and communicate content, applying common conventions" }
          - { id: "AC9TDI6P08", level: "5-6", text: "select and use appropriate digital tools effectively to share content online, plan tasks and collaborate on projects, demonstrating agreed behaviours" }
          - { id: "AC9TDI8P11", level: "7-8", text: "select and use a range of digital tools efficiently, including unfamiliar features, to create, locate and communicate content, consistently applying common conventions" }
          - { id: "AC9TDI8P12", level: "7-8", text: "select and use a range of digital tools efficiently and responsibly to share content online, and plan and manage individual and collaborative agile projects" }
          - { id: "AC9TDI10P11", level: "9-10", text: "select and use emerging digital tools and advanced features to create and communicate interactive content for a diverse audience" }
          - { id: "AC9TDI10P12", level: "9-10", text: "use simple project management tools to plan and manage individual and collaborative agile projects, accounting for risks and responsibilities" }
      - id: "DT-P-PI"
        text: "Producing and implementing"
        indicators:
          - { id: "AC9TDI4P04", level: "3-4", text: "implement simple algorithms as visual programs involving control structures and input" }
          - { id: "AC9TDI6P05", level: "5-6", text: "implement algorithms as visual programs involving control structures, variables and input" }
          - { id: "AC9TDI8P09", level: "7-8", text: "implement, modify and debug programs involving control structures and functions in a general-purpose programming language" }
          - { id: "AC9TDI10P09", level: "9-10", text: "implement, modify and debug modular programs, applying selected algorithms and data structures, including in an object-oriented programming language" }
      - id: "DT-P-AMA"
        text: "Acquiring, managing and analysing data"
        indicators:
          - { id: "AC9TDI8P01", level: "7-8", text: "acquire, store and validate data from a range of sources using software, including spreadsheets and databases" }
          - { id: "AC9TDI8P02", level: "7-8", text: "analyse and visualise data using a range of software, including spreadsheets and databases, to draw conclusions and make predictions by identifying trends" }
          - { id: "AC9TDI8P03", level: "7-8", text: "model and query the attributes of objects and events using structured data" }
          - { id: "AC9TDI10P01", level: "9-10", text: "develop techniques to acquire, store and validate data from a range of sources using software, including spreadsheets and databases" }
          - { id: "AC9TDI10P02", level: "9-10", text: "analyse and visualise data interactively using a range of software, including spreadsheets and databases, to draw conclusions and make predictions by identifying trends and outliers" }
          - { id: "AC9TDI10P03", level: "9-10", text: "model and query entities and their relationships using structured data" }
