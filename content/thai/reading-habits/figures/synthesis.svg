<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="sans-serif">
<title>การสังเคราะห์ความรู้จากหลายแหล่ง</title>
<defs><marker id="a555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="860" height="400" fill="#fff"/>
<text x="430.0" y="34.0" font-size="20" text-anchor="middle" fill="#1f5fbf" font-weight="bold">คำถาม: จะปลูกผักบุ้งในกระถางที่ระเบียงห้องได้อย่างไร</text>
<rect x="20.0" y="60.0" width="260.0" height="120.0" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="150.0" y="90.0" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">หนังสือห้องสมุด</text>
<text x="150.0" y="125.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">• แดดวันละหลายชั่วโมง</text>
<text x="150.0" y="155.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">• รดน้ำเช้าเย็น</text>
<line x1="150.0" y1="182.0" x2="430.0" y2="228.0" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#a555)"/>
<rect x="300.0" y="60.0" width="260.0" height="120.0" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="430.0" y="90.0" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">เว็บไซต์ของหน่วยงาน</text>
<text x="430.0" y="125.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">• แดดวันละหลายชั่วโมง</text>
<text x="430.0" y="155.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">• ดินร่วนระบายน้ำดี</text>
<line x1="430.0" y1="182.0" x2="430.0" y2="228.0" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#a555)"/>
<rect x="580.0" y="60.0" width="260.0" height="120.0" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="710.0" y="90.0" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">สัมภาษณ์ป้าที่ปลูกผัก</text>
<text x="710.0" y="125.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">• รดน้ำเช้าเย็น</text>
<text x="710.0" y="155.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">• ตัดยอดแล้วแตกใหม่</text>
<line x1="710.0" y1="182.0" x2="430.0" y2="228.0" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#a555)"/>
<rect x="140.0" y="232.0" width="580.0" height="80.0" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="430.0" y="262.0" font-size="17" text-anchor="middle" fill="#111" font-weight="normal">ข้อสรุปของเรา: วางกระถางที่ได้แดดหลายชั่วโมง ใช้ดินร่วน</text>
<text x="430.0" y="292.0" font-size="17" text-anchor="middle" fill="#111" font-weight="normal">รดน้ำเช้าเย็น และเก็บโดยตัดยอดเพื่อให้แตกใหม่</text>
<line x1="430.0" y1="314.0" x2="430.0" y2="340.0" stroke="#555" stroke-width="2" stroke-linecap="round" marker-end="url(#a555)"/>
<rect x="240.0" y="344.0" width="380.0" height="44.0" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
<text x="430.0" y="373.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">แผน: ลองปลูก 1 กระถาง จดผลทุกสัปดาห์</text>
</svg>
