<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
<title>กันสาดคอนกรีตยื่นออกจากผนัง</title>
<rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
<rect x="40.0" y="30.0" width="70.0" height="240.0" rx="0" fill="#adb5bd" stroke="#1d3557" stroke-width="2.5" />
<text x="75.0" y="290.0" font-size="14" text-anchor="middle" fill="#222" font-weight="normal" font-family="sans-serif" >ผนัง</text>
<rect x="110.0" y="120.0" width="410.0" height="55.0" rx="0" fill="#d9d9d9" stroke="#1d3557" stroke-width="2.5" />
<line x1="490.0" y1="40.0" x2="490.0" y2="105.2" stroke="#c0392b" stroke-width="4" />
<polygon points="490.0,118.0 483.8,103.3 496.2,103.3" fill="#c0392b" stroke="#c0392b" stroke-width="1" />
<text x="480.0" y="55.0" font-size="15" text-anchor="end" fill="#c0392b" font-weight="normal" font-family="sans-serif" >น้ำหนักที่ปลาย</text>
<text x="300.0" y="134.0" font-size="18" text-anchor="middle" fill="#222" font-weight="bold" font-family="sans-serif" >ก</text>
<line x1="275.0" y1="125.0" x2="285.0" y2="125.0" stroke="#222" stroke-width="0" />
<text x="300.0" y="171.0" font-size="18" text-anchor="middle" fill="#222" font-weight="bold" font-family="sans-serif" >ข</text>
<line x1="110.0" y1="147.5" x2="520.0" y2="147.5" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="560.0" y="125.5" font-size="14" text-anchor="start" fill="#222" font-weight="normal" font-family="sans-serif" >ก = ครึ่งบน</text>
<text x="560.0" y="177.5" font-size="14" text-anchor="start" fill="#222" font-weight="normal" font-family="sans-serif" >ข = ครึ่งล่าง</text>
</svg>
