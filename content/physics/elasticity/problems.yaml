problems:
  - id: physics.matter.elasticity.p001
    topics: [physics.matter.elasticity]
    difficulty: 1
    type: mcq
    stem: "ดึงหนังยางรัดถุงกับข้าวให้ยืดแล้วปล่อย หนังยางหดกลับยาวเท่าเดิม สมบัตินี้เรียกว่าอะไร"
    choices:
      - { id: a, text: "สภาพยืดหยุ่น", correct: true }
      - { id: b, text: "สภาพพลาสติก", feedback: "สภาพพลาสติกคือเปลี่ยนรูปแล้วไม่กลับคืนรูปเดิม เช่น ถุงพลาสติกที่ยืดย้วย" }
      - { id: c, text: "จุดแตกหัก", feedback: "จุดแตกหักคือจุดที่วัสดุขาดหรือหัก หนังยางในข้อนี้ยังไม่ขาด" }
    hints:
      - "หนังยางกลับคืนรูปเดิมหรือไม่เมื่อปล่อยแรง"
      - "คำที่ต้องการมีคำว่า \"ยืดหยุ่น\""
    solution: "วัสดุที่เปลี่ยนรูปเมื่อมีแรงกระทำ แล้วกลับคืนรูปเดิมเมื่อเอาแรงออก มีสภาพยืดหยุ่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.matter.elasticity.p002
    topics: [physics.matter.elasticity]
    difficulty: 1
    type: match
    stem: "จับคู่ปริมาณกับความหมาย"
    pairs:
      - { left: "ความเค้นตามยาว", right: "แรงต่อพื้นที่หน้าตัด" }
      - { left: "ความเครียดตามยาว", right: "ความยาวที่เปลี่ยนไปต่อความยาวเดิม" }
      - { left: "มอดุลัสของยัง", right: "ความเค้นหารด้วยความเครียด" }
      - { left: "ขีดจำกัดสภาพยืดหยุ่น", right: "ค่าที่เกินแล้ววัสดุไม่กลับคืนรูปเดิม" }
    hints:
      - "ความเค้นมีหน่วยเหมือนความดัน"
      - "ความเครียดเป็นอัตราส่วนของความยาวสองค่า"
    solution: "ความเค้น σ = F/A ความเครียด ε = ΔL/L₀ มอดุลัสของยัง Y = σ/ε และขีดจำกัดสภาพยืดหยุ่นคือค่าที่เกินแล้วจะเหลือความเครียดถาวร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.matter.elasticity.p003
    topics: [physics.matter.elasticity]
    difficulty: 2
    type: numeric
    stem: "แท่งโลหะพื้นที่หน้าตัด $4.0\\ \\mathrm{cm^2}$ ถูกดึงด้วยแรง $2000\\ \\mathrm{N}$ ความเค้นในแท่งเป็นเท่าใด (ตอบในหน่วย $10^{6}\\ \\mathrm{N/m^2}$ หรือ MPa)"
    answer: { value: 5, tolerance: 0.05, unit: MPa }
    misconceptions:
      - { match: 0.05, feedback: "แปลง $4.0\\ \\mathrm{cm^2}$ เป็น $0.04\\ \\mathrm{m^2}$ ซึ่งผิด เพราะ $1\\ \\mathrm{cm^2} = (10^{-2}\\ \\mathrm{m})^2 = 10^{-4}\\ \\mathrm{m^2}$" }
      - { match: 500, feedback: "ใช้พื้นที่เป็นตารางเซนติเมตรตรง ๆ ได้หน่วย N/cm² ต้องแปลงพื้นที่เป็นตารางเมตรก่อน" }
    hints:
      - "ความเค้น = แรง ÷ พื้นที่หน้าตัด"
      - "$1\\ \\mathrm{cm^2} = 10^{-4}\\ \\mathrm{m^2}$"
    solution: "$A = 4.0 \\times 10^{-4}\\ \\mathrm{m^2}$ ความเค้น $\\sigma = \\dfrac{2000}{4.0 \\times 10^{-4}} = 5.0 \\times 10^{6}\\ \\mathrm{N/m^2} = 5.0\\ \\mathrm{MPa}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.matter.elasticity.p004
    topics: [physics.matter.elasticity]
    difficulty: 2
    type: numeric
    stem: "ลวดยาว $2.00\\ \\mathrm{m}$ ถูกดึงจนยืดออก $1.0\\ \\mathrm{mm}$ ความเครียดตามยาวมีค่ากี่เท่าของ $10^{-4}$ (เช่น ถ้าได้ $3 \\times 10^{-4}$ ให้ตอบ 3)"
    answer: { value: 5, tolerance: 0.05 }
    misconceptions:
      - { match: 5000, feedback: "หาร 1.0 ด้วย 2.00 โดยไม่แปลงหน่วย ได้ 0.5 ซึ่งผิด เพราะมิลลิเมตรกับเมตรต่างกัน 1000 เท่า" }
      - { match: 50, feedback: "แปลง $1.0\\ \\mathrm{mm}$ เป็น $0.01\\ \\mathrm{m}$ ซึ่งผิด $1\\ \\mathrm{mm} = 0.001\\ \\mathrm{m}$" }
    hints:
      - "ความเครียด = ระยะยืด ÷ ความยาวเดิม"
      - "แปลง $1.0\\ \\mathrm{mm}$ เป็นเมตรก่อน"
    solution: "$\\varepsilon = \\dfrac{1.0 \\times 10^{-3}}{2.00} = 5.0 \\times 10^{-4}$ จึงตอบ 5"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.matter.elasticity.p005
    topics: [physics.matter.elasticity]
    difficulty: 2
    type: mcq
    stem: "บนกราฟความเค้นกับความเครียดของลวดโลหะ มีจุด O (เริ่มต้น) A (ขีดจำกัดการแปรผันตรง) B (ขีดจำกัดสภาพยืดหยุ่น) และ C (จุดแตกหัก) ช่วงใดใช้กฎของฮุกและสูตร $Y = \\sigma/\\varepsilon$ ได้"
    choices:
      - { id: a, text: "ช่วง O ถึง A", correct: true }
      - { id: b, text: "ช่วง O ถึง C", feedback: "หลังจุด B ลวดอยู่ในสภาพพลาสติก กราฟไม่เป็นเส้นตรง ความเค้นไม่แปรผันตรงกับความเครียด" }
      - { id: c, text: "ช่วง B ถึง C", feedback: "ช่วงนี้เป็นสภาพพลาสติก ปล่อยแรงแล้วลวดไม่กลับคืนรูปเดิม ใช้กฎของฮุกไม่ได้" }
    hints:
      - "กฎของฮุกบอกว่าแรงแปรผันตรงกับระยะยืด กราฟต้องเป็นอย่างไร"
      - "ชื่อของจุด A บอกคำตอบอยู่แล้ว"
    solution: "กฎของฮุกและ $Y = \\sigma/\\varepsilon$ ใช้ได้เมื่อความเค้นแปรผันตรงกับความเครียด คือช่วงเส้นตรง O ถึง A ซึ่งสิ้นสุดที่ขีดจำกัดการแปรผันตรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.matter.elasticity.p006
    topics: [physics.matter.elasticity]
    difficulty: 3
    type: numeric
    stem: "ลวดยาว $1.5\\ \\mathrm{m}$ พื้นที่หน้าตัด $1.0 \\times 10^{-6}\\ \\mathrm{m^2}$ รับแรงดึง $100\\ \\mathrm{N}$ แล้วยืดออก $0.75\\ \\mathrm{mm}$ มอดุลัสของยังของลวดเป็นกี่เท่าของ $10^{11}\\ \\mathrm{N/m^2}$"
    answer: { value: 2, tolerance: 0.02 }
    misconceptions:
      - { match: 1.33, feedback: "หารความเค้นด้วยระยะยืดโดยไม่หารด้วยความยาวเดิม ความเครียดต้องเป็น ΔL ÷ L₀" }
      - { match: 0.89, feedback: "คูณด้วยความยาวในตำแหน่งที่ผิด $Y = \\dfrac{F L_0}{A\\,\\Delta L}$ ให้ $L_0$ อยู่ที่ตัวเศษ" }
    hints:
      - "หาความเค้น F/A และความเครียด ΔL/L₀ แยกกันก่อน"
      - "แปลง $0.75\\ \\mathrm{mm}$ เป็นเมตร แล้ว $Y$ = ความเค้น ÷ ความเครียด"
    solution: "$\\sigma = \\dfrac{100}{1.0 \\times 10^{-6}} = 1.0 \\times 10^{8}\\ \\mathrm{N/m^2}$, $\\varepsilon = \\dfrac{7.5 \\times 10^{-4}}{1.5} = 5.0 \\times 10^{-4}$, $Y = \\dfrac{1.0 \\times 10^{8}}{5.0 \\times 10^{-4}} = 2.0 \\times 10^{11}\\ \\mathrm{N/m^2}$ ตอบ 2"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.matter.elasticity.p007
    topics: [physics.matter.elasticity]
    difficulty: 3
    type: numeric
    stem: "ลิฟต์ในคอนโดมิเนียมแขวนด้วยลวดสลิงเหล็กกล้า ($Y = 2.0 \\times 10^{11}\\ \\mathrm{N/m^2}$) ยาว $10\\ \\mathrm{m}$ พื้นที่หน้าตัดรวม $2.0 \\times 10^{-4}\\ \\mathrm{m^2}$ เมื่อลิฟต์และผู้โดยสารหนัก $40\\ \\mathrm{kN}$ ลวดยืดออกกี่มิลลิเมตร"
    answer: { value: 10, tolerance: 0.1, unit: mm }
    misconceptions:
      - { match: 0.01, feedback: "0.01 คือคำตอบในหน่วยเมตร โจทย์ถามเป็นมิลลิเมตร ต้องคูณ 1000" }
      - { match: 1, feedback: "แปลง 40 kN เป็น 4000 N ซึ่งผิด กิโลคือ 1000 เท่า $40\\ \\mathrm{kN} = 40000\\ \\mathrm{N}$" }
    hints:
      - "จัดสูตร $Y = \\dfrac{F L_0}{A\\,\\Delta L}$ ให้ $\\Delta L$ อยู่ข้างเดียว"
      - "$40\\ \\mathrm{kN} = 4.0 \\times 10^4\\ \\mathrm{N}$ คำตอบที่ได้เป็นเมตร แล้วแปลงเป็นมิลลิเมตร"
    solution: "$\\Delta L = \\dfrac{F L_0}{A Y} = \\dfrac{(4.0 \\times 10^4)(10)}{(2.0 \\times 10^{-4})(2.0 \\times 10^{11})} = 0.010\\ \\mathrm{m} = 10\\ \\mathrm{mm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.matter.elasticity.p008
    topics: [physics.matter.elasticity]
    difficulty: 3
    type: mcq
    stem: "ช่างสร้างบ้านวางเหล็กเส้นไว้ด้านล่างของคานคอนกรีตที่รับพื้นชั้นสอง เหตุผลใดถูกต้อง"
    choices:
      - { id: a, text: "ด้านล่างของคานถูกแรงดึงให้ยืด คอนกรีตรับแรงดึงได้น้อย เหล็กเส้นจึงรับแรงดึงแทน", correct: true }
      - { id: b, text: "เหล็กเส้นทำให้คานเบาลง", feedback: "เหล็กหนาแน่นกว่าคอนกรีต การใส่เหล็กไม่ได้ทำให้คานเบาลง" }
      - { id: c, text: "ด้านล่างของคานถูกแรงอัด เหล็กรับแรงอัดได้ดีกว่าคอนกรีต", feedback: "คานที่รับน้ำหนักจะแอ่นลง ด้านบนถูกอัด ด้านล่างถูกดึง และคอนกรีตรับแรงอัดได้ดีอยู่แล้ว" }
    hints:
      - "เมื่อคานรับน้ำหนักแล้วแอ่นลง ผิวด้านล่างยืดออกหรือหดลง"
      - "คอนกรีตรับแรงอัดได้ดี แต่รับแรงดึงได้ไม่ดี"
    solution: "คานที่รับน้ำหนักแอ่นลงเล็กน้อย ผิวด้านบนถูกอัด ผิวด้านล่างถูกดึงให้ยืด คอนกรีตเป็นวัสดุเปราะที่รับความเค้นดึงได้น้อยและจะแตกร้าว จึงต้องมีเหล็กเส้นซึ่งรับแรงดึงได้ดีอยู่ด้านล่าง เรียกว่าคอนกรีตเสริมเหล็ก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.matter.elasticity.p009
    topics: [physics.matter.elasticity]
    difficulty: 3
    type: order
    stem: "เรียงวัสดุจากมอดุลัสของยังมากที่สุด (แข็งตึง ยืดยากที่สุด) ไปน้อยที่สุด"
    items:
      - "เหล็กกล้า"
      - "ทองแดง"
      - "อะลูมิเนียม"
      - "ไม้สักตามแนวเสี้ยน"
      - "ยางพาราแผ่น"
    hints:
      - "ดูตารางมอดุลัสของยังในบทเรียน"
      - "ยางยืดง่ายที่สุด จึงมีมอดุลัสของยังน้อยที่สุด"
    solution: "เหล็กกล้า ($2.0 \\times 10^{11}$) > ทองแดง ($1.1 \\times 10^{11}$) > อะลูมิเนียม ($7.0 \\times 10^{10}$) > ไม้ (ราว $10^{10}$) > ยาง (ราว $10^{6}$–$10^{8}\\ \\mathrm{N/m^2}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.matter.elasticity.p010
    topics: [physics.matter.elasticity]
    difficulty: 4
    type: numeric
    stem: "ลวด A และลวด B ทำจากโลหะชนิดเดียวกัน ลวด B ยาวเป็น 2 เท่าและมีเส้นผ่านศูนย์กลางเป็น 2 เท่าของลวด A ถ้าดึงด้วยแรงเท่ากัน ระยะยืดของลวด B เป็นกี่เท่าของลวด A"
    answer: { value: 0.5, tolerance: 0.01 }
    misconceptions:
      - { match: 1, feedback: "คิดว่าพื้นที่หน้าตัดเพิ่ม 2 เท่าตามเส้นผ่านศูนย์กลาง แต่พื้นที่แปรผันตามกำลังสองของเส้นผ่านศูนย์กลาง จึงเพิ่ม 4 เท่า" }
      - { match: 2, feedback: "คิดเฉพาะความยาวที่เพิ่ม ลืมว่าหน้าตัดใหญ่ขึ้นทำให้ยืดยากขึ้น" }
    hints:
      - "$\\Delta L = \\dfrac{F L_0}{A Y}$ โดย $F$ และ $Y$ เท่ากัน"
      - "พื้นที่หน้าตัด $\\tfrac{\\pi d^2}{4}$ เพิ่มกี่เท่าเมื่อ $d$ เพิ่ม 2 เท่า"
    solution: "$\\Delta L \\propto \\dfrac{L_0}{A}$ ลวด B มี $L_0$ เป็น 2 เท่า และ $A$ เป็น $2^2 = 4$ เท่า ระยะยืดเป็น $\\dfrac{2}{4} = 0.5$ เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.matter.elasticity.p011
    topics: [physics.matter.elasticity]
    difficulty: 4
    type: numeric
    stem: "ลวดเหล็กกล้าเส้นผ่านศูนย์กลาง $2.0\\ \\mathrm{mm}$ มีขีดจำกัดสภาพยืดหยุ่นที่ความเค้น $2.5 \\times 10^{8}\\ \\mathrm{N/m^2}$ แขวนของหนักได้มากที่สุดกี่นิวตันโดยลวดยังกลับคืนรูปเดิมได้"
    answer: { value: 785, tolerance: 8, unit: N }
    misconceptions:
      - { match: 3142, feedback: "ใช้ $2.0\\ \\mathrm{mm}$ เป็นรัศมี ต้องใช้รัศมี $1.0\\ \\mathrm{mm}$" }
      - { match: 1000, feedback: "คิดพื้นที่หน้าตัดเป็น $d^2$ (สี่เหลี่ยม) ลวดกลมมีพื้นที่ $\\pi r^2$" }
    hints:
      - "แรงสูงสุด = ความเค้นที่ขีดจำกัด × พื้นที่หน้าตัด"
      - "รัศมี $= 1.0\\ \\mathrm{mm} = 1.0 \\times 10^{-3}\\ \\mathrm{m}$ และ $A = \\pi r^2$"
    solution: "$A = \\pi (1.0 \\times 10^{-3})^2 = 3.14 \\times 10^{-6}\\ \\mathrm{m^2}$ แรงสูงสุด $F = \\sigma A = (2.5 \\times 10^{8})(3.14 \\times 10^{-6}) \\approx 785\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.matter.elasticity.p012
    topics: [physics.matter.elasticity]
    difficulty: 4
    type: numeric
    stem: "จากกราฟความเค้นกับความเครียดของลวดโลหะในภาพ มอดุลัสของยังของลวดเป็นกี่เท่าของ $10^{10}\\ \\mathrm{N/m^2}$"
    figure: { src: p-stress-graph.svg, alt: "กราฟเส้นตรงผ่านจุดกำเนิด แกนนอนเป็นความเครียดหน่วย 10 ยกกำลังลบ 3 มีขีด 0 1 2 3 แกนตั้งเป็นความเค้นหน่วย MPa มีขีด 0 ถึง 250 ทุก 50 มีจุดข้อมูลสามจุด ที่ความเครียด 1 ความเค้น 70 ที่ความเครียด 2 ความเค้น 140 และที่ความเครียด 3 ความเค้น 210" }
    answer: { value: 7, tolerance: 0.1 }
    misconceptions:
      - { match: 0.007, feedback: "อ่านความเครียดเป็น 2 แทน $2 \\times 10^{-3}$ ต้องคูณด้วยตัวคูณที่เขียนบนแกน" }
    hints:
      - "มอดุลัสของยังคือความชันของกราฟ = ความเค้น ÷ ความเครียด"
      - "ความเค้น $140\\ \\mathrm{MPa} = 1.4 \\times 10^{8}\\ \\mathrm{N/m^2}$ ที่ความเครียด $2 \\times 10^{-3}$"
    solution: "$Y = \\dfrac{1.4 \\times 10^{8}}{2 \\times 10^{-3}} = 7.0 \\times 10^{10}\\ \\mathrm{N/m^2}$ ตอบ 7 (ค่านี้ตรงกับอะลูมิเนียม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.matter.elasticity.p013
    topics: [physics.matter.elasticity]
    difficulty: 4
    type: mcq
    stem: "ดึงลวดทองแดงจนความเค้นเลยขีดจำกัดสภาพยืดหยุ่นไปเล็กน้อย แล้วปล่อยแรงจนหมด ข้อใดบรรยายลวดได้ถูกต้อง"
    choices:
      - { id: a, text: "ลวดหดกลับบางส่วน แต่ยังยาวกว่าความยาวเดิม", correct: true }
      - { id: b, text: "ลวดหดกลับยาวเท่าเดิมพอดี", feedback: "เท่าเดิมพอดีเกิดเมื่อไม่เกินขีดจำกัดสภาพยืดหยุ่น ข้อนี้เกินไปแล้ว" }
