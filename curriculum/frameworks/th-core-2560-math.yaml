strands:
  - id: ค1
    title: จำนวนและพีชคณิต
    standards:
      - id: ค 1.1
        text: "เข้าใจความหลากหลายของการแสดงจำนวน ระบบจำนวน การดำเนินการของจำนวน ผลที่เกิดขึ้นจากการดำเนินการ สมบัติของการดำเนินการ และนำไปใช้"
        indicators:
          - { id: "ค 1.1 ป.1/1", level: ป.1, text: "บอกจำนวนของสิ่งต่าง ๆ แสดงสิ่งต่าง ๆ ตามจำนวนที่กำหนด อ่านและเขียนตัวเลขฮินดูอารบิก ตัวเลขไทยแสดงจำนวนนับไม่เกิน 100 และ 0" }
          - { id: "ค 1.1 ป.1/2", level: ป.1, text: "เปรียบเทียบจำนวนนับไม่เกิน 100 และ 0 โดยใช้เครื่องหมาย = ≠ > <" }
          - { id: "ค 1.1 ป.1/3", level: ป.1, text: "เรียงลำดับจำนวนนับไม่เกิน 100 และ 0 ตั้งแต่ 3 ถึง 5 จำนวน" }
          - { id: "ค 1.1 ป.1/4", level: ป.1, text: "หาค่าของตัวไม่ทราบค่าในประโยคสัญลักษณ์แสดงการบวกและประโยคสัญลักษณ์แสดงการลบของจำนวนนับไม่เกิน 100 และ 0" }
          - { id: "ค 1.1 ป.1/5", level: ป.1, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาการบวกและโจทย์ปัญหาการลบของจำนวนนับไม่เกิน 100 และ 0" }
          - { id: "ค 1.1 ป.2/1", level: ป.2, text: "บอกจำนวนของสิ่งต่าง ๆ แสดงสิ่งต่าง ๆ ตามจำนวนที่กำหนด อ่านและเขียนตัวเลขฮินดูอารบิก ตัวเลขไทย ตัวหนังสือแสดงจำนวนนับไม่เกิน 1,000 และ 0" }
          - { id: "ค 1.1 ป.2/2", level: ป.2, text: "เปรียบเทียบจำนวนนับไม่เกิน 1,000 และ 0 โดยใช้เครื่องหมาย = ≠ > <" }
          - { id: "ค 1.1 ป.2/3", level: ป.2, text: "เรียงลำดับจำนวนนับไม่เกิน 1,000 และ 0 ตั้งแต่ 3 ถึง 5 จำนวนจากสถานการณ์ต่าง ๆ" }
          - { id: "ค 1.1 ป.2/4", level: ป.2, text: "หาค่าของตัวไม่ทราบค่าในประโยคสัญลักษณ์แสดงการบวกและประโยคสัญลักษณ์แสดงการลบของจำนวนนับไม่เกิน 1,000 และ 0" }
          - { id: "ค 1.1 ป.2/5", level: ป.2, text: "หาค่าของตัวไม่ทราบค่าในประโยคสัญลักษณ์แสดงการคูณของจำนวน 1 หลักกับจำนวนไม่เกิน 2 หลัก" }
          - { id: "ค 1.1 ป.2/6", level: ป.2, text: "หาค่าของตัวไม่ทราบค่าในประโยคสัญลักษณ์แสดงการหารที่ตัวตั้งไม่เกิน 2 หลัก ตัวหาร 1 หลัก โดยที่ผลหารมี 1 หลักทั้งหารลงตัวและหารไม่ลงตัว" }
          - { id: "ค 1.1 ป.2/7", level: ป.2, text: "หาผลลัพธ์การบวก ลบ คูณ หารระคนของจำนวนนับไม่เกิน 1,000 และ 0" }
          - { id: "ค 1.1 ป.2/8", level: ป.2, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหา 2 ขั้นตอนของจำนวนนับไม่เกิน 1,000 และ 0" }
          - { id: "ค 1.1 ป.3/1", level: ป.3, text: "อ่านและเขียนตัวเลขฮินดูอารบิก ตัวเลขไทยและตัวหนังสือแสดงจำนวนนับไม่เกิน 100,000 และ 0" }
          - { id: "ค 1.1 ป.3/2", level: ป.3, text: "เปรียบเทียบและเรียงลำดับจำนวนนับไม่เกิน 100,000 จากสถานการณ์ต่าง ๆ" }
          - { id: "ค 1.1 ป.3/3", level: ป.3, text: "บอก อ่านและเขียนเศษส่วนแสดงปริมาณสิ่งต่าง ๆ และแสดงสิ่งต่าง ๆ ตามเศษส่วนที่กำหนด" }
          - { id: "ค 1.1 ป.3/4", level: ป.3, text: "เปรียบเทียบเศษส่วนที่ตัวเศษเท่ากัน โดยที่ตัวเศษน้อยกว่าหรือเท่ากับตัวส่วน" }
          - { id: "ค 1.1 ป.3/5", level: ป.3, text: "หาค่าของตัวไม่ทราบค่าในประโยคสัญลักษณ์แสดงการบวกและประโยคสัญลักษณ์แสดงการลบของจำนวนนับไม่เกิน 100,000 และ 0" }
          - { id: "ค 1.1 ป.3/6", level: ป.3, text: "หาค่าของตัวไม่ทราบค่าในประโยคสัญลักษณ์แสดงการคูณของจำนวน 1 หลักกับจำนวนไม่เกิน 4 หลัก และจำนวน 2 หลักกับจำนวน 2 หลัก" }
          - { id: "ค 1.1 ป.3/7", level: ป.3, text: "หาค่าของตัวไม่ทราบค่าในประโยคสัญลักษณ์แสดงการหารที่ตัวตั้งไม่เกิน 4 หลัก ตัวหาร 1 หลัก" }
          - { id: "ค 1.1 ป.3/8", level: ป.3, text: "หาผลลัพธ์การบวก ลบ คูณ หารระคนของจำนวนนับไม่เกิน 100,000 และ 0" }
          - { id: "ค 1.1 ป.3/9", level: ป.3, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหา 2 ขั้นตอนของจำนวนนับไม่เกิน 100,000 และ 0" }
          - { id: "ค 1.1 ป.3/10", level: ป.3, text: "หาผลบวกของเศษส่วนที่มีตัวส่วนเท่ากันและผลบวกไม่เกิน 1 และหาผลลบของเศษส่วนที่มีตัวส่วนเท่ากัน" }
          - { id: "ค 1.1 ป.3/11", level: ป.3, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาการบวกเศษส่วนที่มีตัวส่วนเท่ากันและผลบวกไม่เกิน 1 และโจทย์ปัญหาการลบเศษส่วนที่มีตัวส่วนเท่ากัน" }
          - { id: "ค 1.1 ป.4/1", level: ป.4, text: "อ่านและเขียนตัวเลขฮินดูอารบิก ตัวเลขไทยและตัวหนังสือแสดงจำนวนนับที่มากกว่า 100,000" }
          - { id: "ค 1.1 ป.4/2", level: ป.4, text: "เปรียบเทียบและเรียงลำดับจำนวนนับที่มากกว่า 100,000 จากสถานการณ์ต่าง ๆ" }
          - { id: "ค 1.1 ป.4/3", level: ป.4, text: "บอก อ่านและเขียนเศษส่วน จำนวนคละ แสดงปริมาณสิ่งต่าง ๆ และแสดงสิ่งต่าง ๆ ตามเศษส่วน จำนวนคละที่กำหนด" }
          - { id: "ค 1.1 ป.4/4", level: ป.4, text: "เปรียบเทียบ เรียงลำดับเศษส่วนและจำนวนคละที่ตัวส่วนตัวหนึ่งเป็นพหุคูณของอีกตัวหนึ่ง" }
          - { id: "ค 1.1 ป.4/5", level: ป.4, text: "อ่านและเขียนทศนิยมไม่เกิน 3 ตำแหน่ง แสดงปริมาณของสิ่งต่าง ๆ และแสดงสิ่งต่าง ๆ ตามทศนิยมที่กำหนด" }
          - { id: "ค 1.1 ป.4/6", level: ป.4, text: "เปรียบเทียบและเรียงลำดับทศนิยมไม่เกิน 3 ตำแหน่งจากสถานการณ์ต่างๆ" }
          - { id: "ค 1.1 ป.4/7", level: ป.4, text: "ประมาณผลลัพธ์ของการบวก การลบ การคูณ การหารจากสถานการณ์ต่าง ๆ อย่างสมเหตุสมผล" }
          - { id: "ค 1.1 ป.4/8", level: ป.4, text: "หาค่าของตัวไม่ทราบค่าในประโยคสัญลักษณ์แสดงการบวกและประโยคสัญลักษณ์แสดงการลบของจำนวนนับที่มากกว่า 100,000 และ 0" }
          - { id: "ค 1.1 ป.4/9", level: ป.4, text: "หาค่าของตัวไม่ทราบค่าในประโยคสัญลักษณ์แสดงการคูณของจำนวนหลายหลัก 2 จำนวนที่มีผลคูณไม่เกิน 6 หลัก และประโยคสัญลักษณ์แสดงการหารที่ตัวตั้งไม่เกิน 6 หลัก ตัวหารไม่เกิน 2 หลัก" }
          - { id: "ค 1.1 ป.4/10", level: ป.4, text: "หาผลลัพธ์การบวก ลบ คูณ หารระคนของจำนวนนับ และ 0" }
          - { id: "ค 1.1 ป.4/11", level: ป.4, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหา 2 ขั้นตอนของจำนวนนับที่มากกว่า 100,000 และ 0" }
          - { id: "ค 1.1 ป.4/12", level: ป.4, text: "สร้างโจทย์ปัญหา 2 ขั้นตอนของจำนวนนับและ 0 พร้อมทั้งหาคำตอบ" }
          - { id: "ค 1.1 ป.4/13", level: ป.4, text: "หาผลบวก ผลลบของเศษส่วนและจำนวนคละที่ตัวส่วนตัวหนึ่งเป็นพหุคูณของอีกตัวหนึ่ง" }
          - { id: "ค 1.1 ป.4/14", level: ป.4, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาการบวกและโจทย์ปัญหาการลบเศษส่วนและจำนวนคละที่ตัวส่วนตัวหนึ่งเป็นพหุคูณของอีกตัวหนึ่ง" }
          - { id: "ค 1.1 ป.4/15", level: ป.4, text: "หาผลบวก ผลลบของทศนิยมไม่เกิน 3 ตำแหน่ง" }
          - { id: "ค 1.1 ป.4/16", level: ป.4, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาการบวก การลบ 2 ขั้นตอน ของทศนิยมไม่เกิน 3 ตำแหน่ง" }
          - { id: "ค 1.1 ป.5/1", level: ป.5, text: "เขียนเศษส่วนที่มีตัวส่วนเป็นตัวประกอบของ 10 หรือ 100 หรือ 1,000 ในรูปทศนิยม" }
          - { id: "ค 1.1 ป.5/2", level: ป.5, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาโดยใช้บัญญัติไตรยางศ์" }
          - { id: "ค 1.1 ป.5/3", level: ป.5, text: "หาผลบวก ผลลบของเศษส่วนและจำนวนคละ" }
          - { id: "ค 1.1 ป.5/4", level: ป.5, text: "หาผลคูณ ผลหารของเศษส่วนและจำนวนคละ" }
          - { id: "ค 1.1 ป.5/5", level: ป.5, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาการบวก การลบ การคูณ การหารเศษส่วน 2 ขั้นตอน" }
          - { id: "ค 1.1 ป.5/6", level: ป.5, text: "หาผลคูณของทศนิยมที่ผลคูณเป็นทศนิยมไม่เกิน 3 ตำแหน่ง" }
          - { id: "ค 1.1 ป.5/7", level: ป.5, text: "หาผลหารที่ตัวตั้งเป็นจำนวนนับหรือทศนิยมไม่เกิน 3 ตำแหน่ง และตัวหารเป็นจำนวนนับ ผลหารเป็นทศนิยมไม่เกิน 3 ตำแหน่ง" }
          - { id: "ค 1.1 ป.5/8", level: ป.5, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาการบวก การลบ การคูณ การหารทศนิยม 2 ขั้นตอน" }
          - { id: "ค 1.1 ป.5/9", level: ป.5, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาร้อยละไม่เกิน 2 ขั้นตอน" }
          - { id: "ค 1.1 ป.6/1", level: ป.6, text: "เปรียบเทียบ เรียงลำดับเศษส่วนและจำนวนคละ จากสถานการณ์ต่าง ๆ" }
          - { id: "ค 1.1 ป.6/2", level: ป.6, text: "เขียนอัตราส่วนแสดงการเปรียบเทียบปริมาณ 2 ปริมาณ จากข้อความหรือสถานการณ์ โดยที่ปริมาณแต่ละปริมาณเป็นจำนวนนับ" }
          - { id: "ค 1.1 ป.6/3", level: ป.6, text: "หาอัตราส่วนที่เท่ากับอัตราส่วนที่กำหนดให้" }
          - { id: "ค 1.1 ป.6/4", level: ป.6, text: "หา ห.ร.ม. ของจำนวนนับไม่เกิน 3 จำนวน" }
          - { id: "ค 1.1 ป.6/5", level: ป.6, text: "หา ค.ร.น. ของจำนวนนับไม่เกิน 3 จำนวน" }
          - { id: "ค 1.1 ป.6/6", level: ป.6, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาโดยใช้ความรู้เกี่ยวกับ ห.ร.ม. และ ค.ร.น." }
          - { id: "ค 1.1 ป.6/7", level: ป.6, text: "หาผลลัพธ์ของการบวก ลบ คูณ หารระคนของเศษส่วนและจำนวนคละ" }
          - { id: "ค 1.1 ป.6/8", level: ป.6, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาเศษส่วนและจำนวนคละ 2 - 3 ขั้นตอน" }
          - { id: "ค 1.1 ป.6/9", level: ป.6, text: "หาผลหารของทศนิยมที่ตัวหารและผลหารเป็นทศนิยมไม่เกิน 3 ตำแหน่ง" }
          - { id: "ค 1.1 ป.6/10", level: ป.6, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาการบวก การลบ การคูณ การหารทศนิยม 3 ขั้นตอน" }
          - { id: "ค 1.1 ป.6/11", level: ป.6, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาอัตราส่วน" }
          - { id: "ค 1.1 ป.6/12", level: ป.6, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาร้อยละ 2 - 3 ขั้นตอน" }
          - { id: "ค 1.1 ม.1/1", level: ม.1, text: "เข้าใจจำนวนตรรกยะและความสัมพันธ์ของจำนวนตรรกยะ และใช้สมบัติของจำนวนตรรกยะในการแก้ปัญหาคณิตศาสตร์และปัญหาในชีวิตจริง" }
          - { id: "ค 1.1 ม.1/2", level: ม.1, text: "เข้าใจและใช้สมบัติของเลขยกกำลังที่มีเลขชี้กำลังเป็นจำนวนเต็มบวกในการแก้ปัญหาคณิตศาสตร์และปัญหาในชีวิตจริง" }
          - { id: "ค 1.1 ม.1/3", level: ม.1, text: "เข้าใจและประยุกต์ใช้อัตราส่วน สัดส่วน และร้อยละ ในการแก้ปัญหาคณิตศาสตร์และปัญหาในชีวิตจริง" }
          - { id: "ค 1.1 ม.2/1", level: ม.2, text: "เข้าใจและใช้สมบัติของเลขยกกำลังที่มีเลขชี้กำลังเป็นจำนวนเต็มในการแก้ปัญหาคณิตศาสตร์และปัญหาในชีวิตจริง" }
          - { id: "ค 1.1 ม.2/2", level: ม.2, text: "เข้าใจจำนวนจริงและความสัมพันธ์ของจำนวนจริง และใช้สมบัติของจำนวนจริงในการแก้ปัญหาคณิตศาสตร์และปัญหาในชีวิตจริง" }
          - { id: "ค 1.1 ม.4/1", level: ม.4, text: "เข้าใจและใช้ความรู้เกี่ยวกับเซตและตรรกศาสตร์เบื้องต้น ในการสื่อสารและสื่อความหมายทางคณิตศาสตร์" }
          - { id: "ค 1.1 ม.5/1", level: ม.5, text: "เข้าใจความหมายและใช้สมบัติเกี่ยวกับการบวก การคูณ การเท่ากัน และการไม่เท่ากันของจำนวนจริงในรูปกรณฑ์และจำนวนจริงในรูปเลขยกกำลังที่มีเลขชี้กำลังเป็นจำนวนตรรกยะ" }
      - id: ค 1.2
        text: "เข้าใจและวิเคราะห์แบบรูป ความสัมพันธ์ ฟังก์ชัน ลำดับและอนุกรม และนำไปใช้"
        indicators:
          - { id: "ค 1.2 ป.1/1", level: ป.1, text: "ระบุจำนวนที่หายไปในแบบรูปของจำนวนที่เพิ่มขึ้นหรือลดลงทีละ 1 และทีละ 10 และระบุรูปที่หายไปในแบบรูปซ้ำของรูปเรขาคณิตและรูปอื่น ๆ ที่สมาชิกในแต่ละชุดที่ซ้ำมี 2 รูป" }
          - { id: "ค 1.2 ป.3/1", level: ป.3, text: "ระบุจำนวนที่หายไปในแบบรูปของจำนวนที่เพิ่มขึ้นหรือลดลงทีละเท่า ๆ กัน" }
          - { id: "ค 1.2 ป.6/1", level: ป.6, text: "แสดงวิธีคิดและหาคำตอบของปัญหาเกี่ยวกับแบบรูป" }
          - { id: "ค 1.2 ม.2/1", level: ม.2, text: "เข้าใจหลักการการดำเนินการของพหุนามและใช้พหุนามในการแก้ปัญหาคณิตศาสตร์" }
          - { id: "ค 1.2 ม.2/2", level: ม.2, text: "เข้าใจและใช้การแยกตัวประกอบของพหุนามดีกรีสองในการแก้ปัญหาคณิตศาสตร์" }
          - { id: "ค 1.2 ม.3/1", level: ม.3, text: "เข้าใจและใช้การแยกตัวประกอบของพหุนามที่มีดีกรีสูงกว่าสองในการแก้ปัญหาคณิตศาสตร์" }
          - { id: "ค 1.2 ม.3/2", level: ม.3, text: "เข้าใจและใช้ความรู้เกี่ยวกับฟังก์ชันกำลังสองในการแก้ปัญหาคณิตศาสตร์" }
          - { id: "ค 1.2 ม.5/1", level: ม.5, text: "ใช้ฟังก์ชันและกราฟของฟังก์ชันอธิบายสถานการณ์ที่กำหนด" }
          - { id: "ค 1.2 ม.5/2", level: ม.5, text: "เข้าใจและนำความรู้เกี่ยวกับลำดับและอนุกรมไปใช้" }
      - id: ค 1.3
        text: "ใช้นิพจน์ สมการ และอสมการ อธิบายความสัมพันธ์ หรือช่วยแก้ปัญหาที่กำหนดให้"
        indicators:
          - { id: "ค 1.3 ม.1/1", level: ม.1, text: "เข้าใจและใช้สมบัติของการเท่ากันและสมบัติของจำนวน เพื่อวิเคราะห์และแก้ปัญหาโดยใช้สมการเชิงเส้นตัวแปรเดียว" }
          - { id: "ค 1.3 ม.1/2", level: ม.1, text: "เข้าใจและใช้ความรู้เกี่ยวกับกราฟในการแก้ปัญหาคณิตศาสตร์และปัญหาในชีวิตจริง" }
          - { id: "ค 1.3 ม.1/3", level: ม.1, text: "เข้าใจและใช้ความรู้เกี่ยวกับความสัมพันธ์เชิงเส้นในการแก้ปัญหาคณิตศาสตร์และปัญหาในชีวิตจริง" }
          - { id: "ค 1.3 ม.3/1", level: ม.3, text: "เข้าใจและใช้สมบัติของการไม่เท่ากัน เพื่อวิเคราะห์และแก้ปัญหาโดยใช้อสมการเชิงเส้นตัวแปรเดียว" }
          - { id: "ค 1.3 ม.3/2", level: ม.3, text: "ประยุกต์ใช้สมการกำลังสองตัวแปรเดียวในการแก้ปัญหาคณิตศาสตร์" }
          - { id: "ค 1.3 ม.3/3", level: ม.3, text: "ประยุกต์ใช้ระบบสมการเชิงเส้นสองตัวแปรในการแก้ปัญหาคณิตศาสตร์" }
          - { id: "ค 1.3 ม.5/1", level: ม.5, text: "เข้าใจและใช้ความรู้เกี่ยวกับดอกเบี้ยและมูลค่าของเงินในการแก้ปัญหา" }
  - id: ค2
    title: การวัดและเรขาคณิต
    standards:
      - id: ค 2.1
        text: "เข้าใจพื้นฐานเกี่ยวกับการวัด วัดและคาดคะเนขนาดของสิ่งที่ต้องการวัด และนำไปใช้"
        indicators:
          - { id: "ค 2.1 ป.1/1", level: ป.1, text: "วัดและเปรียบเทียบความยาวเป็นเซนติเมตร เป็นเมตร" }
          - { id: "ค 2.1 ป.1/2", level: ป.1, text: "วัดและเปรียบเทียบน้ำหนักเป็นกิโลกรัม เป็นขีด" }
          - { id: "ค 2.1 ป.2/1", level: ป.2, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาเกี่ยวกับเวลาที่มีหน่วยเดี่ยวและเป็นหน่วยเดียวกัน" }
          - { id: "ค 2.1 ป.2/2", level: ป.2, text: "วัดและเปรียบเทียบความยาวเป็นเมตรและเซนติเมตร" }
          - { id: "ค 2.1 ป.2/3", level: ป.2, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาการบวก การลบเกี่ยวกับความยาวที่มีหน่วยเป็นเมตรและเซนติเมตร" }
          - { id: "ค 2.1 ป.2/4", level: ป.2, text: "วัดและเปรียบเทียบน้ำหนักเป็นกิโลกรัมและกรัม กิโลกรัมและขีด" }
          - { id: "ค 2.1 ป.2/5", level: ป.2, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาการบวก การลบเกี่ยวกับน้ำหนักที่มีหน่วยเป็นกิโลกรัมและกรัม กิโลกรัมและขีด" }
          - { id: "ค 2.1 ป.2/6", level: ป.2, text: "วัดและเปรียบเทียบปริมาตรและความจุเป็นลิตร" }
          - { id: "ค 2.1 ป.3/1", level: ป.3, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาเกี่ยวกับเงิน" }
          - { id: "ค 2.1 ป.3/2", level: ป.3, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาเกี่ยวกับเวลา และระยะเวลา" }
          - { id: "ค 2.1 ป.3/3", level: ป.3, text: "เลือกใช้เครื่องวัดความยาวที่เหมาะสม วัดและบอกความยาวของสิ่งต่าง ๆ เป็นเซนติเมตรและมิลลิเมตร เมตรและเซนติเมตร" }
          - { id: "ค 2.1 ป.3/4", level: ป.3, text: "คาดคะเนความยาวเป็นเมตรและเป็นเซนติเมตร" }
          - { id: "ค 2.1 ป.3/5", level: ป.3, text: "เปรียบเทียบความยาวระหว่างเซนติเมตรกับมิลลิเมตร เมตรกับเซนติเมตร กิโลเมตรกับเมตรจากสถานการณ์ต่าง ๆ" }
          - { id: "ค 2.1 ป.3/6", level: ป.3, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาเกี่ยวกับความยาวที่มีหน่วยเป็นเซนติเมตรและมิลลิเมตร เมตรและเซนติเมตร กิโลเมตรและเมตร" }
          - { id: "ค 2.1 ป.3/7", level: ป.3, text: "เลือกใช้เครื่องชั่งที่เหมาะสม วัดและบอกน้ำหนักเป็นกิโลกรัมและขีด กิโลกรัมและกรัม" }
          - { id: "ค 2.1 ป.3/8", level: ป.3, text: "คาดคะเนน้ำหนักเป็นกิโลกรัมและเป็นขีด" }
          - { id: "ค 2.1 ป.3/9", level: ป.3, text: "เปรียบเทียบน้ำหนักระหว่างกิโลกรัมกับกรัม เมตริกตันกับกิโลกรัม จากสถานการณ์ต่าง ๆ" }
          - { id: "ค 2.1 ป.3/10", level: ป.3, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาเกี่ยวกับน้ำหนักที่มีหน่วยเป็นกิโลกรัมกับกรัม เมตริกตันกับกิโลกรัม" }
          - { id: "ค 2.1 ป.3/11", level: ป.3, text: "เลือกใช้เครื่องตวงที่เหมาะสม วัดและเปรียบเทียบปริมาตร ความจุเป็นลิตรและมิลลิลิตร" }
          - { id: "ค 2.1 ป.3/12", level: ป.3, text: "คาดคะเนปริมาตรและความจุเป็นลิตร" }
          - { id: "ค 2.1 ป.3/13", level: ป.3, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาเกี่ยวกับปริมาตรและความจุที่มีหน่วยเป็นลิตรและมิลลิลิตร" }
          - { id: "ค 2.1 ป.4/1", level: ป.4, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาเกี่ยวกับเวลา" }
          - { id: "ค 2.1 ป.4/2", level: ป.4, text: "วัดและสร้างมุมโดยใช้โพรแทรกเตอร์" }
          - { id: "ค 2.1 ป.4/3", level: ป.4, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาเกี่ยวกับความยาวรอบรูปและพื้นที่ของรูปสี่เหลี่ยมมุมฉาก" }
          - { id: "ค 2.1 ป.5/1", level: ป.5, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาเกี่ยวกับความยาวที่มีการเปลี่ยนหน่วยและเขียนในรูปทศนิยม" }
          - { id: "ค 2.1 ป.5/2", level: ป.5, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาเกี่ยวกับน้ำหนักที่มีการเปลี่ยนหน่วยและเขียนในรูปทศนิยม" }
          - { id: "ค 2.1 ป.5/3", level: ป.5, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาเกี่ยวกับปริมาตรของทรงสี่เหลี่ยมมุมฉากและความจุของภาชนะทรงสี่เหลี่ยมมุมฉาก" }
          - { id: "ค 2.1 ป.5/4", level: ป.5, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาเกี่ยวกับความยาวรอบรูปของรูปสี่เหลี่ยมและพื้นที่ของรูปสี่เหลี่ยมด้านขนานและรูปสี่เหลี่ยมขนมเปียกปูน" }
          - { id: "ค 2.1 ป.6/1", level: ป.6, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาเกี่ยวกับปริมาตรของรูปเรขาคณิตสามมิติที่ประกอบด้วยทรงสี่เหลี่ยมมุมฉาก" }
          - { id: "ค 2.1 ป.6/2", level: ป.6, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาเกี่ยวกับความยาวรอบรูปและพื้นที่ของรูปหลายเหลี่ยม" }
          - { id: "ค 2.1 ป.6/3", level: ป.6, text: "แสดงวิธีหาคำตอบของโจทย์ปัญหาเกี่ยวกับความยาวรอบรูปและพื้นที่ของวงกลม" }
          - { id: "ค 2.1 ม.2/1", level: ม.2, text: "ประยุกต์ใช้ความรู้เรื่องพื้นที่ผิวของปริซึมและทรงกระบอกในการแก้ปัญหาคณิตศาสตร์และปัญหาในชีวิตจริง" }
          - { id: "ค 2.1 ม.2/2", level: ม.2, text: "ประยุกต์ใช้ความรู้เรื่องปริมาตรของปริซึมและทรงกระบอกในการแก้ปัญหาคณิตศาสตร์และปัญหาในชีวิตจริง" }
          - { id: "ค 2.1 ม.3/1", level: ม.3, text: "ประยุกต์ใช้ความรู้เรื่องพื้นที่ผิวของพีระมิด กรวย และทรงกลม ในการแก้ปัญหาคณิตศาสตร์และปัญหาในชีวิตจริง" }
          - { id: "ค 2.1 ม.3/2", level: ม.3, text: "ประยุกต์ใช้ความรู้เรื่องปริมาตรของพีระมิด กรวย และทรงกลม ในการแก้ปัญหาคณิตศาสตร์และปัญหาในชีวิตจริง" }
      - id: ค 2.2
        text: "เข้าใจและวิเคราะห์รูปเรขาคณิต สมบัติของรูปเรขาคณิต ความสัมพันธ์ระหว่างรูปเรขาคณิต และทฤษฎีบททางเรขาคณิต และนำไปใช้"
        indicators:
          - { id: "ค 2.2 ป.1/1", level: ป.1, text: "จำแนกรูปสามเหลี่ยม รูปสี่เหลี่ยม วงกลม วงรี ทรงสี่เหลี่ยมมุมฉาก ทรงกลม ทรงกระบอก และกรวย" }
          - { id: "ค 2.2 ป.2/1", level: ป.2, text: "จำแนกและบอกลักษณะของรูปหลายเหลี่ยมและวงกลม" }
          - { id: "ค 2.2 ป.3/1", level: ป.3, text: "ระบุรูปเรขาคณิตสองมิติที่มีแกนสมมาตรและจำนวนแกนสมมาตร" }
          - { id: "ค 2.2 ป.4/1", level: ป.4, text: "จำแนกชนิดของมุม บอกชื่อมุม ส่วนประกอบของมุมและเขียนสัญลักษณ์แสดงมุม" }
          - { id: "ค 2.2 ป.4/2", level: ป.4, text: "สร้างรูปสี่เหลี่ยมมุมฉากเมื่อกำหนดความยาวของด้าน" }
          - { id: "ค 2.2 ป.5/1", level: ป.5, text: "สร้างเส้นตรงหรือส่วนของเส้นตรงให้ขนานกับเส้นตรงหรือส่วนของเส้นตรงที่กำหนดให้" }
          - { id: "ค 2.2 ป.5/2", level: ป.5, text: "จำแนกรูปสี่เหลี่ยมโดยพิจารณาจากสมบัติของรูป" }
          - { id: "ค 2.2 ป.5/3", level: ป.5, text: "สร้างรูปสี่เหลี่ยมชนิดต่าง ๆ เมื่อกำหนดความยาวของด้านและขนาดของมุมหรือเมื่อกำหนดความยาวของเส้นทแยงมุม" }
          - { id: "ค 2.2 ป.5/4", level: ป.5, text: "บอกลักษณะของปริซึม" }
          - { id: "ค 2.2 ป.6/1", level: ป.6, text: "จำแนกรูปสามเหลี่ยมโดยพิจารณาจากสมบัติของรูป" }
          - { id: "ค 2.2 ป.6/2", level: ป.6, text: "สร้างรูปสามเหลี่ยมเมื่อกำหนดความยาวของด้านและขนาดของมุม" }
          - { id: "ค 2.2 ป.6/3", level: ป.6, text: "บอกลักษณะของรูปเรขาคณิตสามมิติชนิดต่าง ๆ" }
          - { id: "ค 2.2 ป.6/4", level: ป.6, text: "ระบุรูปเรขาคณิตสามมิติที่ประกอบจากรูปคลี่และระบุรูปคลี่ของรูปเรขาคณิตสามมิติ" }
          - { id: "ค 2.2 ม.1/1", level: ม.1, text: "ใช้ความรู้ทางเรขาคณิตและเครื่องมือ เช่น วงเวียนและสันตรง รวมทั้งโปรแกรม The Geometer’s Sketchpad หรือโปรแกรมเรขาคณิตพลวัตอื่น ๆ เพื่อสร้างรูปเรขาคณิต ตลอดจนนำความรู้เกี่ยวกับการสร้างนี้ไปประยุกต์ใช้ในการแก้ปัญหาในชีวิตจริง" }
          - { id: "ค 2.2 ม.1/2", level: ม.1, text: "เข้าใจและใช้ความรู้ทางเรขาคณิตในการวิเคราะห์หาความสัมพันธ์ระหว่างรูปเรขาคณิตสองมิติและรูปเรขาคณิตสามมิติ" }
          - { id: "ค 2.2 ม.2/1", level: ม.2, text: "ใช้ความรู้ทางเรขาคณิตและเครื่องมือ เช่น วงเวียนและสันตรง รวมทั้งโปรแกรม The Geometer’s Sketchpad หรือโปรแกรมเรขาคณิตพลวัตอื่น ๆ เพื่อสร้างรูปเรขาคณิต ตลอดจนนำความรู้เกี่ยวกับการสร้างนี้ไปประยุกต์ใช้ในการแก้ปัญหาในชีวิตจริง" }
          - { id: "ค 2.2 ม.2/2", level: ม.2, text: "นำความรู้เกี่ยวกับสมบัติของเส้นขนานและรูปสามเหลี่ยมไปใช้ในการแก้ปัญหาคณิตศาสตร์" }
          - { id: "ค 2.2 ม.2/3", level: ม.2, text: "เข้าใจและใช้ความรู้เกี่ยวกับการแปลงทางเรขาคณิตในการแก้ปัญหาคณิตศาสตร์และปัญหาในชีวิตจริง" }
          - { id: "ค 2.2 ม.2/4", level: ม.2, text: "เข้าใจและใช้สมบัติของรูปสามเหลี่ยมที่เท่ากันทุกประการในการแก้ปัญหาคณิตศาสตร์และปัญหาในชีวิตจริง" }
          - { id: "ค 2.2 ม.2/5", level: ม.2, text: "เข้าใจและใช้ทฤษฎีบทพีทาโกรัสและบทกลับในการแก้ปัญหาคณิตศาสตร์และปัญหาในชีวิตจริง" }
          - { id: "ค 2.2 ม.3/1", level: ม.3, text: "เข้าใจและใช้สมบัติของรูปสามเหลี่ยมที่คล้ายกันในการแก้ปัญหาคณิตศาสตร์และปัญหาในชีวิตจริง" }
          - { id: "ค 2.2 ม.3/2", level: ม.3, text: "เข้าใจและใช้ความรู้เกี่ยวกับอัตราส่วนตรีโกณมิติในการแก้ปัญหาคณิตศาสตร์และปัญหาในชีวิตจริง" }
          - { id: "ค 2.2 ม.3/3", level: ม.3, text: "เข้าใจและใช้ทฤษฎีบทเกี่ยวกับวงกลมในการแก้ปัญหาคณิตศาสตร์" }
  - id: ค3
    title: สถิติและความน่าจะเป็น
    standards:
      - id: ค 3.1
        text: "เข้าใจกระบวนการทางสถิติ และใช้ความรู้ทางสถิติในการแก้ปัญหา"
        indicators:
          - { id: "ค 3.1 ป.1/1", level: ป.1, text: "ใช้ข้อมูลจากแผนภูมิรูปภาพในการหาคำตอบของโจทย์ปัญหา เมื่อกำหนดรูป 1 รูป แทน 1 หน่วย" }
          - { id: "ค 3.1 ป.2/1", level: ป.2, text: "ใช้ข้อมูลจากแผนภูมิรูปภาพในการหาคำตอบของโจทย์ปัญหาเมื่อกำหนดรูป 1 รูป แทน 2 หน่วย 5 หน่วย หรือ 10 หน่วย" }
          - { id: "ค 3.1 ป.3/1", level: ป.3, text: "เขียนแผนภูมิรูปภาพ และใช้ข้อมูลจากแผนภูมิรูปภาพในการหาคำตอบของโจทย์ปัญหา" }
          - { id: "ค 3.1 ป.3/2", level: ป.3, text: "เขียนตารางทางเดียวจากข้อมูลที่เป็นจำนวนนับ และใช้ข้อมูลจากตารางทางเดียวในการหาคำตอบของโจทย์ปัญหา" }
          - { id: "ค 3.1 ป.4/1", level: ป.4, text: "ใช้ข้อมูลจากแผนภูมิแท่ง ตารางสองทางในการหาคำตอบของโจทย์ปัญหา" }
          - { id: "ค 3.1 ป.5/1", level: ป.5, text: "ใช้ข้อมูลจากกราฟเส้นในการหาคำตอบของโจทย์ปัญหา" }
          - { id: "ค 3.1 ป.5/2", level: ป.5, text: "เขียนแผนภูมิแท่งจากข้อมูลที่เป็นจำนวนนับ" }
          - { id: "ค 3.1 ป.6/1", level: ป.6, text: "ใช้ข้อมูลจากแผนภูมิรูปวงกลมในการหาคำตอบของโจทย์ปัญหา" }
          - { id: "ค 3.1 ม.1/1", level: ม.1, text: "เข้าใจและใช้ความรู้ทางสถิติในการนำเสนอข้อมูลและแปลความหมายข้อมูล รวมทั้งนำสถิติไปใช้ในชีวิตจริงโดยใช้เทคโนโลยีที่เหมาะสม" }
          - { id: "ค 3.1 ม.2/1", level: ม.2, text: "เข้าใจและใช้ความรู้ทางสถิติในการนำเสนอข้อมูลและวิเคราะห์ข้อมูลจากแผนภาพจุด แผนภาพต้น - ใบ ฮิสโทแกรม และค่ากลางของข้อมูล และแปลความหมายผลลัพธ์ รวมทั้งนำสถิติไปใช้ในชีวิตจริงโดยใช้เทคโนโลยีที่เหมาะสม" }
          - { id: "ค 3.1 ม.3/1", level: ม.3, text: "เข้าใจและใช้ความรู้ทางสถิติในการนำเสนอและวิเคราะห์ข้อมูลจากแผนภาพกล่อง และแปลความหมายผลลัพธ์ รวมทั้งนำสถิติไปใช้ในชีวิตจริงโดยใช้เทคโนโลยีที่เหมาะสม" }
          - { id: "ค 3.1 ม.6/1", level: ม.6, text: "เข้าใจและใช้ความรู้ทางสถิติในการนำเสนอข้อมูล และแปลความหมายของค่าสถิติ เพื่อประกอบการตัดสินใจ" }
      - id: ค 3.2
        text: "เข้าใจหลักการนับเบื้องต้น ความน่าจะเป็น และนำไปใช้"
        indicators:
          - { id: "ค 3.2 ม.3/1", level: ม.3, text: "เข้าใจเกี่ยวกับการทดลองสุ่มและนำผลที่ได้ไปหาความน่าจะเป็นของเหตุการณ์" }
          - { id: "ค 3.2 ม.4/1", level: ม.4, text: "เข้าใจและใช้หลักการบวกและการคูณ การเรียงสับเปลี่ยน และการจัดหมู่ ในการแก้ปัญหา" }
          - { id: "ค 3.2 ม.4/2", level: ม.4, text: "หาความน่าจะเป็นและนำความรู้เกี่ยวกับความน่าจะเป็นไปใช้" }
