id: math.stats.discrete-distributions
subject: math
title: { th: การแจกแจงเรขาคณิตและไฮเปอร์จีโอเมตริก, en: Geometric and hypergeometric distributions }
summary: การแจกแจงที่นับจำนวนครั้งจนได้สำเร็จครั้งแรก และการแจกแจงเมื่อหยิบจากประชากรจำกัดโดยไม่ใส่คืน พร้อมวิธีเลือกให้ตรงกับสถานการณ์
difficulty: 7
minutes: 35
prerequisites: [math.stats.random-variables]
encompasses:
  - { id: math.stats.random-variables, weight: 0.4 }
curriculum_tags: []
lessons:
  - type: figure
    src: geometric-pmf.svg
    alt: "แผนภูมิแท่งของการแจกแจงเรขาคณิต เมื่อ p เท่ากับ 0.3 แท่งความสูงสำหรับ k เท่ากับ 1 ถึง 8 คือ 0.300, 0.210, 0.147, 0.103, 0.072, 0.050, 0.035 และ 0.025 แท่งลดลงเรื่อย ๆ"
    caption: "ความน่าจะเป็นที่สำเร็จครั้งแรกในครั้งที่ $k$ ลดลงทุกครั้งที่ $k$ เพิ่ม เพราะต้องพลาดมาก่อนทุกครั้ง"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: หาความน่าจะเป็นที่พบชิ้นเสียชิ้นแรกในครั้งที่ 3
    problem: "ชิ้นงานแต่ละชิ้นเสียด้วยโอกาส $0.3$ อย่างอิสระ จงหาความน่าจะเป็นที่พบชิ้นเสียชิ้นแรกเป็นชิ้นที่ 3"
    steps:
      - text: "ให้ $X$ เป็นจำนวนชิ้นที่ตรวจจนพบชิ้นเสียชิ้นแรก เป็นการแจกแจงเรขาคณิตที่มี $p = 0.3$"
        why: "ตรวจทีละชิ้นอย่างอิสระ และหยุดเมื่อพบชิ้นเสียครั้งแรก ซึ่งตรงกับนิยามของ $X$"
      - text: "เหตุการณ์ $X = 3$ หมายถึงชิ้นที่ 1 และ 2 ดี แล้วชิ้นที่ 3 เสีย จึงได้ $P(X=3) = (1-0.3)^{2}\\cdot 0.3$"
        why: "ชิ้นดีมีโอกาส $1-p = 0.7$ และต้องดีสองชิ้นก่อนหน้า"
      - text: "$P(X=3) = 0.7^2 \\cdot 0.3 = 0.49 \\cdot 0.3 = 0.147$"
    answer: "ความน่าจะเป็นเท่ากับ $0.147$ หรือประมาณ $14.7\\%$"
  - { type: check, problem: math.stats.discrete-distributions.p002, prompt: "ลองคิดก่อนอ่านต่อ: การแจกแจงแบบใดนับจำนวนครั้งจนสำเร็จครั้งแรก" }
  - type: worked-example
    title: หาความน่าจะเป็นในการหยิบโดยไม่ใส่คืน
    problem: "กล่องมีลูกบอล 10 ลูก เป็นสีแดง 3 ลูก สุ่มหยิบ 4 ลูกโดยไม่ใส่คืน จงหาความน่าจะเป็นที่ได้ลูกสีแดงพอดี 2 ลูก"
    steps:
      - text: "ให้ $X$ เป็นจำนวนลูกสีแดงในตัวอย่าง โดยมี $N=10$, $K=3$, $n=4$ และ $k=2$ จึงเป็นการแจกแจงไฮเปอร์จีโอเมตริก"
        why: "หยิบ 4 ลูกจากกล่องที่มีสองประเภทโดยไม่ใส่คืน"
      - text: "นับวิธีเลือกลูกสีแดง 2 ลูกจาก 3 ลูก และลูกอื่น 2 ลูกจาก 7 ลูก ได้ $\\binom{3}{2}\\binom{7}{2} = 3 \\cdot 21 = 63$ วิธี"
        why: "ทุกวิธีเลือกต้องมีลูกสีแดง 2 ลูกและลูกอื่น 2 ลูกพอดี"
      - text: "นับวิธีเลือก 4 ลูกจาก 10 ลูกทั้งหมด ได้ $\\binom{10}{4} = 210$ วิธี จึงได้ $P(X=2) = \\frac{63}{210} = 0.3$"
    answer: "ความน่าจะเป็นเท่ากับ $0.3$"
  - { type: check, problem: math.stats.discrete-distributions.p003, prompt: "ลองใช้สูตรค่าเฉลี่ยของการแจกแจงเรขาคณิตกับตัวเลขในโจทย์นี้" }
glossary:
  - { term: การแจกแจงเรขาคณิต, definition: "การแจกแจงความน่าจะเป็นของจำนวนครั้งที่ทดลองซ้ำอย่างอิสระจนได้ผลสำเร็จครั้งแรก มีฟังก์ชันความน่าจะเป็น $(1-p)^{k-1}p$" }
  - { term: การแจกแจงไฮเปอร์จีโอเมตริก, definition: "การแจกแจงของจำนวนหน่วยประเภทที่สนใจเมื่อหยิบ $n$ หน่วยจากประชากร $N$ หน่วยโดยไม่ใส่คืน ซึ่งมี $K$ หน่วยเป็นประเภทนั้น" }
  - { term: สมบัติไม่มีความจำ, definition: "สมบัติของการแจกแจงเรขาคณิตที่ความน่าจะเป็นของการต้องรอต่ออีกเท่าไรไม่ขึ้นกับว่ารอมาแล้วนานเท่าไร" }
  - { term: ตัวคูณประชากรจำกัด, definition: "พจน์ $\\frac{N-n}{N-1}$ ในความแปรปรวนของไฮเปอร์จีโอเมตริก ซึ่งน้อยกว่า 1 เมื่อ $n > 1$" }
flashcards:
  - { front: "สูตร $P(X=k)$ ของการแจกแจงเรขาคณิต", back: "$(1-p)^{k-1}\\,p$ สำหรับ $k=1,2,3,\\dots$" }
  - { front: "ค่าเฉลี่ยและความแปรปรวนของการแจกแจงเรขาคณิต", back: "$E(X)=\\frac{1}{p}$ และ $\\mathrm{Var}(X)=\\frac{1-p}{p^2}$" }
  - { front: "ค่าเฉลี่ยของการแจกแจงไฮเปอร์จีโอเมตริก", back: "$E(X)=\\frac{nK}{N}$ เมื่อหยิบ $n$ หน่วยจาก $N$ หน่วยที่มี $K$ หน่วยเป็นประเภทที่สนใจ" }
  - { front: "เมื่อใดใช้ไฮเปอร์จีโอเมตริกแทนทวินาม", back: "เมื่อหยิบโดยไม่ใส่คืนจากประชากรจำกัดที่มีสองประเภท และประชากรไม่ใหญ่มากเทียบกับตัวอย่าง" }
