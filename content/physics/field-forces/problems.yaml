problems:
  - id: physics.fields.field-forces.p001
    topics: [physics.fields.field-forces]
    difficulty: 1
    type: mcq
    stem: "มะม่วงน้ำดอกไม้สุกหล่นจากต้นลงสู่พื้นโดยไม่มีใครเขย่า แรงใดทำให้มะม่วงหล่น"
    choices:
      - { id: a, text: "แรงโน้มถ่วงของโลก", correct: true }
      - { id: b, text: "แรงแม่เหล็กของโลก", feedback: "แรงแม่เหล็กกระทำต่อแม่เหล็กและสารแม่เหล็ก มะม่วงไม่ใช่สารแม่เหล็ก" }
      - { id: c, text: "แรงไฟฟ้าจากก้อนเมฆ", feedback: "แรงไฟฟ้ากระทำต่อวัตถุที่มีประจุ มะม่วงทุกลูกหล่นได้แม้ไม่มีเมฆหรือประจุ" }
      - { id: d, text: "ไม่มีแรง มะม่วงหล่นเองเพราะหนัก", feedback: "ความหนักก็คือแรงโน้มถ่วงที่โลกดึงมะม่วง วัตถุจะเริ่มเคลื่อนที่ได้ต้องมีแรงกระทำ" }
    hints:
      - "อะไรดึงวัตถุทุกชนิดลงสู่พื้นโลก"
      - "แหล่งของแรงนี้คือมวลของโลก"
    solution: "โลกมีมวลมาก รอบโลกจึงมีสนามโน้มถ่วงที่ดึงวัตถุทุกชิ้นที่มีมวลเข้าหาศูนย์กลางโลก เมื่อขั้วผลหลุด มะม่วงจึงหล่นลงด้วยแรงโน้มถ่วง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.fields.field-forces.p002
    topics: [physics.fields.field-forces]
    difficulty: 1
    type: match
    stem: "จับคู่แหล่งของสนามกับชนิดของสนามที่เกิดขึ้นรอบแหล่งนั้น"
    pairs:
      - { left: "ดวงจันทร์ซึ่งมีมวลมาก", right: "สนามโน้มถ่วง" }
      - { left: "หวีพลาสติกที่ถูกับผมแห้งจนมีประจุ", right: "สนามไฟฟ้า" }
      - { left: "ขดลวดที่มีกระแสไฟฟ้าไหลผ่าน", right: "สนามแม่เหล็ก" }
    hints:
      - "สนามโน้มถ่วงเกิดจากมวล สนามไฟฟ้าเกิดจากประจุ"
      - "กระแสไฟฟ้าที่ไหลในลวดทำให้เข็มทิศที่อยู่ใกล้เบนได้"
    solution: "ดวงจันทร์มีมวล จึงมีสนามโน้มถ่วง หวีที่มีประจุมีสนามไฟฟ้า และกระแสไฟฟ้าในขดลวดสร้างสนามแม่เหล็ก (หลักของแม่เหล็กไฟฟ้า)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.fields.field-forces.p003
    topics: [physics.fields.field-forces]
    difficulty: 2
    type: mcq
    stem: "นักเรียนไทยคนหนึ่งบอกว่า \"คนที่อยู่ประเทศบราซิลซึ่งอยู่อีกฟากของโลก ต้องถูกแรงโน้มถ่วงดึงขึ้นฟ้า เพราะเขากลับหัวอยู่\" ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "แรงโน้มถ่วงดึงทุกคนเข้าหาศูนย์กลางโลก คนที่บราซิลจึงถูกดึงลงสู่พื้นใต้เท้าตัวเองเหมือนกัน", correct: true }
      - { id: b, text: "ถูกต้อง คนที่บราซิลถูกดึงขึ้นฟ้า แต่เกาะพื้นไว้ด้วยแรงเสียดทาน", feedback: "ถ้าแรงโน้มถ่วงดึงขึ้นฟ้าจริง ทุกอย่างที่บราซิลจะหลุดลอยไป แรงโน้มถ่วงชี้เข้าหาศูนย์กลางโลกเสมอ" }
      - { id: c, text: "คนที่บราซิลไม่มีแรงโน้มถ่วงกระทำเลย", feedback: "ทุกวัตถุที่มีมวลอยู่ในสนามโน้มถ่วงของโลก ไม่ว่าจะอยู่ส่วนใดของโลก" }
    hints:
      - "ทิศ \"ลง\" บนโลกกลมหมายถึงทิศใด"
      - "วาดโลกเป็นวงกลม แล้ววาดลูกศรแรงโน้มถ่วงที่คนสองคนอยู่คนละฟาก"
    solution: "สนามโน้มถ่วงของโลกชี้เข้าหาศูนย์กลางโลกทุกทิศ ทั้งคนไทยและคนบราซิลจึงถูกดึงเข้าหาศูนย์กลางโลก ซึ่งก็คือลงสู่พื้นใต้เท้าของแต่ละคน คำว่า \"กลับหัว\" เป็นเพียงมุมมองจากภาพแผนที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.fields.field-forces.p004
    topics: [physics.fields.field-forces]
    difficulty: 2
    type: mcq
    stem: "ร้านรับซื้อของเก่าใช้แม่เหล็กแรงสูงแยกกระป๋องออกจากกองเศษโลหะ กระป๋องชนิดใดถูกแม่เหล็กดูดขึ้นมา"
    choices:
      - { id: a, text: "กระป๋องเหล็กเคลือบดีบุก เช่น กระป๋องปลากระป๋อง", correct: true }
      - { id: b, text: "กระป๋องอะลูมิเนียม เช่น กระป๋องน้ำอัดลม", feedback: "อะลูมิเนียมเป็นโลหะแต่ไม่ใช่สารแม่เหล็ก แม่เหล็กจึงไม่ดูด ร้านใช้ข้อนี้แยกกระป๋องสองชนิดออกจากกัน" }
      - { id: c, text: "โลหะทุกชนิดถูกดูดเท่ากัน", feedback: "แม่เหล็กดูดเฉพาะสารแม่เหล็ก เช่น เหล็ก นิกเกิล โคบอลต์ ทองแดงและอะลูมิเนียมไม่ถูกดูด" }
    hints:
      - "สนามแม่เหล็กกระทำแรงต่อวัตถุชนิดใดบ้าง"
      - "เหล็ก นิกเกิล และโคบอลต์เป็นสารแม่เหล็ก"
    solution: "แม่เหล็กออกแรงต่อสารแม่เหล็กเท่านั้น กระป๋องอาหารทำจากแผ่นเหล็กเคลือบดีบุกจึงถูกดูด ส่วนกระป๋องน้ำอัดลมทำจากอะลูมิเนียมจึงตกอยู่ในกอง แยกออกจากกันได้ง่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.fields.field-forces.p005
    topics: [physics.fields.field-forces]
    difficulty: 2
    type: text
    stem: "ในงานวันเด็ก น้องถูลูกโป่งสองใบกับผมจนมีประจุลบทั้งคู่ แล้วแขวนไว้ใกล้กัน ลูกโป่งสองใบจะดูดกันหรือผลักกัน (ตอบหนึ่งคำ)"
    accepted: ["ผลัก", "ผลักกัน", "ผลักออกจากกัน", "repel"]
    misconceptions:
      - { match: "ดูด", feedback: "ประจุต่างชนิดกันจึงดูดกัน ลูกโป่งสองใบนี้มีประจุลบเหมือนกัน" }
      - { match: "ดูดกัน", feedback: "ประจุต่างชนิดกันจึงดูดกัน ลูกโป่งสองใบนี้มีประจุลบเหมือนกัน" }
    hints:
      - "ลูกโป่งทั้งสองมีประจุชนิดเดียวกันหรือต่างกัน"
      - "ประจุชนิดเดียวกันออกแรงต่อกันอย่างไร"
    solution: "ลูกโป่งทั้งสองมีประจุลบเหมือนกัน ประจุชนิดเดียวกันผลักกัน ลูกโป่งจึงแกว่งออกจากกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.fields.field-forces.p006
    topics: [physics.fields.field-forces]
    difficulty: 2
    type: mcq
    stem: "จากภาพ แท่งพลาสติกมีประจุบวกอยู่ทางซ้ายของลูกบอลที่มีประจุลบ ลูกศรใดแสดงทิศของแรงไฟฟ้าที่แท่งพลาสติกกระทำต่อลูกบอล"
    figure: { src: p-rod-ball.svg, alt: "แท่งพลาสติกตั้งอยู่ทางซ้ายมีเครื่องหมายบวกหลายตัว ลูกบอลมีเครื่องหมายลบอยู่ทางขวา มีลูกศรสี่ลูกออกจากลูกบอล A ชี้ไปทางซ้ายเข้าหาแท่ง B ชี้ไปทางขวาออกจากแท่ง C ชี้ขึ้น D ชี้ลง" }
    choices:
      - { id: a, text: "A", correct: true }
      - { id: b, text: "B", feedback: "ลูกบอลจะถูกผลักออกถ้ามีประจุชนิดเดียวกับแท่ง แต่ลูกบอลมีประจุลบ แท่งมีประจุบวก" }
      - { id: c, text: "C", feedback: "แรงไฟฟ้าระหว่างวัตถุสองชิ้นอยู่ในแนวที่เชื่อมวัตถุทั้งสอง ไม่ได้ชี้ขึ้น" }
      - { id: d, text: "D", feedback: "D คือทิศของน้ำหนักซึ่งเป็นแรงโน้มถ่วง ไม่ใช่แรงไฟฟ้า" }
    hints:
      - "ประจุบวกกับประจุลบดูดหรือผลักกัน"
      - "แรงดูดชี้จากลูกบอลเข้าหาวัตถุที่ดูด"
    solution: "ประจุต่างชนิดกันดูดกัน แรงไฟฟ้าต่อลูกบอลจึงชี้เข้าหาแท่งพลาสติก คือลูกศร A"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.fields.field-forces.p007
    topics: [physics.fields.field-forces]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "แรงใดบ้างที่มีขนาดลดลงเมื่อวัตถุอยู่ห่างจากแหล่งของสนามมากขึ้น (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "แรงโน้มถ่วง", correct: true }
      - { id: b, text: "แรงไฟฟ้า", correct: true }
      - { id: c, text: "แรงแม่เหล็ก", correct: true }
      - { id: d, text: "แรงเสียดทานระหว่างกล่องกับพื้น", feedback: "แรงเสียดทานเป็นแรงสัมผัส เกิดเมื่อผิวแตะกันเท่านั้น ไม่ได้มาจากสนามและไม่ได้ลดลงตามระยะ" }
    hints:
      - "ลองนึกถึงแม่เหล็กที่อยู่ไกลคลิปมาก ๆ"
      - "สนามทั้งสามชนิดมีลักษณะร่วมกันเรื่องระยะ"
    solution: "สนามโน้มถ่วง สนามไฟฟ้า และสนามแม่เหล็กล้วนแรงที่สุดใกล้แหล่ง และอ่อนลงเมื่อห่างออกไป แรงทั้งสามจึงลดลงตามระยะ ส่วนแรงเสียดทานเป็นแรงสัมผัส ไม่ได้ขึ้นกับระยะจากแหล่งของสนาม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.fields.field-forces.p008
    topics: [physics.fields.field-forces]
    difficulty: 4
    type: numeric
    stem: "ผลการวัดแรงไฟฟ้าระหว่างลูกบอลมีประจุสองลูก: ระยะ $10\\ \\mathrm{cm}$ แรง $0.36\\ \\mathrm{N}$, ระยะ $20\\ \\mathrm{cm}$ แรง $0.09\\ \\mathrm{N}$, ระยะ $30\\ \\mathrm{cm}$ แรง $0.04\\ \\mathrm{N}$ ใช้แบบรูปในข้อมูลทำนายแรงที่ระยะ $40\\ \\mathrm{cm}$ (ตอบในหน่วย N)"
    answer: { value: 0.0225, tolerance: 0.001, unit: N }
    misconceptions:
      - { match: 0.045, feedback: "คิดว่าระยะ 2 เท่าแรงลดครึ่งหนึ่ง แต่ข้อมูลบอกว่าระยะ 10 → 20 cm แรงเหลือ 1/4 ไม่ใช่ 1/2" }
      - { match: 0.09, feedback: "0.09 N เป็นแรงที่ระยะ 20 cm ระยะ 40 cm อยู่ไกลกว่า แรงต้องน้อยกว่านี้" }
    hints:
      - "เทียบแรงที่ระยะ 20 cm กับ 10 cm เป็นอัตราส่วน"
      - "ระยะ 2 เท่า แรงเหลือ 1/4 ระยะ 3 เท่า แรงเหลือ 1/9 แล้วระยะ 4 เท่าเหลือเท่าใด"
    solution: "ระยะ $40\\ \\mathrm{cm}$ เป็น 4 เท่าของ $10\\ \\mathrm{cm}$ แรงจึงเหลือ $\\tfrac{1}{4^2} = \\tfrac{1}{16}$ ของ $0.36\\ \\mathrm{N}$ ได้ $\\tfrac{0.36}{16} = 0.0225\\ \\mathrm{N}$ (หรือคิดจากระยะ 20 cm ที่เพิ่มอีก 2 เท่า: $\\tfrac{0.09}{4} = 0.0225\\ \\mathrm{N}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.fields.field-forces.p009
    topics: [physics.fields.field-forces]
    difficulty: 3
    type: order
    stem: "นักเรียนต้องการหาหลักฐานว่าสนามแม่เหล็กส่งแรงผ่านวัสดุบาง ๆ ได้หรือไม่ เรียงขั้นตอนการทดลองให้ถูกต้อง"
    items:
      - "ตั้งคำถาม: แรงแม่เหล็กผ่านกระดาษ แผ่นไม้บาง และแผ่นเหล็กได้หรือไม่"
      - "วางแม่เหล็กอันเดิมไว้ใต้วัสดุแผ่นแรกที่ระยะคงที่"
      - "โรยผงตะไบเหล็กบนวัสดุแล้วเคาะเบา ๆ บันทึกแบบรูปที่เห็น"
      - "เปลี่ยนเฉพาะวัสดุที่กั้น โดยคงแม่เหล็ก ระยะ และปริมาณผงเหล็กไว้เท่าเดิม แล้วทำซ้ำ"
      - "เปรียบเทียบแบบรูปของแต่ละวัสดุแล้วสรุปผล"
    hints:
      - "การทดลองเริ่มจากคำถาม และจบด้วยการสรุป"
      - "ต้องทำการทดลองกับวัสดุแผ่นแรกก่อนจึงจะเปลี่ยนวัสดุได้"
    solution: "ตั้งคำถาม → จัดอุปกรณ์กับวัสดุแผ่นแรก → โรยผงเหล็กและบันทึก → เปลี่ยนวัสดุทีละชนิดโดยควบคุมตัวแปรอื่น → เปรียบเทียบและสรุป แบบรูปของผงเหล็กที่เกิดขึ้นทั้งที่ไม่มีอะไรแตะผงเหล็กคือหลักฐานว่ามีสนาม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.fields.field-forces.p010
    topics: [physics.fields.field-forces]
    difficulty: 3
    type: mcq
    stem: "คลิปเหล็กผูกด้ายไว้กับโต๊ะ ลอยนิ่งอยู่ใต้แม่เหล็กโดยด้ายตึงและไม่แตะแม่เหล็ก แผนภาพแรงของคลิปควรมีแรงใดบ้าง"
    choices:
      - { id: a, text: "แรงแม่เหล็กชี้ขึ้น น้ำหนักชี้ลง และแรงตึงด้ายชี้ลง", correct: true }
      - { id: b, text: "แรงแม่เหล็กชี้ขึ้นและน้ำหนักชี้ลงเท่านั้น", feedback: "ด้ายตึงอยู่ จึงดึงคลิปลงหาโต๊ะด้วย ถ้าไม่มีด้าย คลิปจะพุ่งขึ้นไปติดแม่เหล็ก" }
      - { id: c, text: "แรงตึงด้ายชี้ขึ้นและน้ำหนักชี้ลง", feedback: "ด้ายผูกอยู่กับโต๊ะซึ่งอยู่ด้านล่าง แรงตึงจึงชี้ลง และลืมแรงแม่เหล็กที่ทำให้คลิปลอย" }
      - { id: d, text: "แรงแม่เหล็กชี้ขึ้นเพียงแรงเดียว เพราะคลิปลอยอยู่", feedback: "คลิปที่ลอยอยู่ก็ยังมีน้ำหนัก วัตถุบนโลกมีแรงโน้มถ่วงเสมอ" }
    hints:
      - "มีอะไรแตะคลิปบ้าง และมีสนามอะไรอยู่รอบคลิป"
      - "คลิปอยู่นิ่ง แรงขึ้นต้องเท่ากับแรงลง"
    solution: "สิ่งที่แตะคลิปคือด้ายซึ่งดึงลงหาโต๊ะ คลิปอยู่ในสนามโน้มถ่วงจึงมีน้ำหนักชี้ลง และอยู่ในสนามแม่เหล็กจึงถูกดูดขึ้น คลิปนิ่งเพราะแรงแม่เหล็ก = น้ำหนัก + แรงตึงด้าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.fields.field-forces.p011
    topics: [physics.fields.field-forces]
