id: biology.animals.movement
subject: biology
title: { th: การเคลื่อนที่ของสัตว์และมนุษย์, en: "Movement in animals and humans" }
summary: การเคลื่อนที่ของแมงกะพรุน หมึก ดาวทะเล ไส้เดือนดิน แมลง ปลา และนก โครงกระดูกและข้อต่อของมนุษย์ การหดตัวของกล้ามเนื้อโครงร่าง กล้ามเนื้อคู่ตรงข้าม และแขนในฐานะคาน
difficulty: 6
minutes: 45
prerequisites: [biology.animals.nervous-system, health.body.musculoskeletal-care]
encompasses:
  - { id: biology.animals.nervous-system, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: กล้ามเนื้อของไส้เดือนดิน
    src: earthworm.svg
    alt: "ด้านบนเป็นไส้เดือนดินเคลื่อนที่ไปทางขวา ปล้องด้านหน้าและด้านหลังสั้นอ้วนเพราะกล้ามเนื้อตามยาวหดตัวและใช้เดือยยึดดิน ปล้องตรงกลางยาวเรียวเพราะกล้ามเนื้อวงหดตัวดันปล้องไปข้างหน้า ด้านล่างเป็นภาคตัดขวาง ชั้นนอกสุดเป็นผิว ถัดเข้ามาเป็นกล้ามเนื้อวง แล้วเป็นกล้ามเนื้อตามยาว ตรงกลางเป็นช่องตัวที่มีของเหลว ทำหน้าที่เป็นโครงร่างค้ำจุนด้วยน้ำ"
    caption: "กล้ามเนื้อสองชุดทำงานสลับกันโดยมีของเหลวในช่องตัวเป็นโครงร่าง (วาดโดยทีมคลังรู้)"
  - type: figure
    title: ซาร์โคเมียร์ขณะคลายตัวและหดตัว
    src: sarcomere.svg
    alt: "ภาพบนเป็นซาร์โคเมียร์ขณะคลายตัว มีเส้น Z สองเส้นที่ปลาย แอกทินซึ่งเป็นเส้นใยบางสีเขียวยื่นจากเส้น Z เข้าหากลาง ไมโอซินซึ่งเป็นเส้นใยหนาสีม่วงอยู่ตรงกลาง มีช่องตรงกลางที่ไม่มีแอกทินเรียกว่าแถบ H ภาพล่างเป็นซาร์โคเมียร์ขณะหดตัว เส้น Z เข้าใกล้กัน แอกทินเลื่อนเข้าซ้อนกับไมโอซินมากขึ้น แถบ H แคบลงจนแทบหายไป ความยาวของแอกทินและไมโอซินเท่าเดิม"
    caption: "เส้นใยไม่หดสั้น แต่เลื่อนเข้าซ้อนกัน (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ไบเซปส์ต้องออกแรงเท่าใด
    problem: "นักเรียนถือขวดน้ำหนัก 20 N ไว้ในมือ ปลายแขนอยู่ในแนวระดับ ไบเซปส์ยึดกระดูกปลายแขนห่างข้อศอก 4 cm และมือห่างข้อศอก 32 cm ไม่คิดน้ำหนักของปลายแขน ไบเซปส์ต้องออกแรงเท่าใด"
    figure: { src: arm-lever.svg, alt: "ต้นแขนตั้งตรง ปลายแขนวางในแนวระดับ ข้อศอกเป็นจุดหมุนทางซ้าย ไบเซปส์ด้านหน้าต้นแขนหดตัวดึงปลายแขนขึ้นด้วยแรง F ที่ห่างจากข้อศอก 4 เซนติเมตร ไตรเซปส์ด้านหลังคลายตัว น้ำหนักในมือ W กดลงที่ระยะ 32 เซนติเมตรจากข้อศอก" }
    steps:
      - text: "จุดหมุนคือข้อศอก แรงที่ทำให้หมุนคือแรงของไบเซปส์ (ทวนเข็ม) และน้ำหนักในมือ (ตามเข็ม)"
      - text: "แขนอยู่นิ่ง โมเมนต์ทวนเข็มเท่ากับโมเมนต์ตามเข็ม $F \\times 4 = 20 \\times 32$"
        why: "ใช้หน่วยระยะเดียวกันทั้งสองข้าง จึงไม่ต้องแปลงเป็นเมตร"
      - text: "$F = \\frac{20 \\times 32}{4} = 160\\ \\mathrm{N}$"
      - text: "ไบเซปส์ออกแรงมากกว่าน้ำหนักในมือ 8 เท่า ซึ่งเท่ากับอัตราส่วนระยะ 32 ต่อ 4"
    answer: "160 N"
  - { type: check, problem: biology.animals.movement.p008, prompt: "เขียนสมการโมเมนต์รอบข้อศอกก่อน" }
  - type: worked-example
    title: ทำไมขาของนักวิ่งต้องมีกล้ามเนื้อคู่ตรงข้าม
    problem: "นักวิ่งเหยียดเข่าแล้วงอเข่าสลับกัน อธิบายการทำงานของกล้ามเนื้อต้นขาด้านหน้าและด้านหลัง"
    steps:
      - text: "กล้ามเนื้อออกแรงได้เมื่อหดตัวและดึงกระดูกเท่านั้น ดันกระดูกไม่ได้"
      - text: "เหยียดเข่า: กล้ามเนื้อต้นขาด้านหน้าหดตัวดึงกระดูกหน้าแข้ง กล้ามเนื้อต้นขาด้านหลังคลายตัว"
      - text: "งอเข่า: กล้ามเนื้อต้นขาด้านหลังหดตัว กล้ามเนื้อด้านหน้าคลายตัว"
        why: "ถ้าทั้งสองมัดหดพร้อมกัน ข้อจะแข็งอยู่กับที่ ใช้เมื่อต้องการให้ข้อมั่นคง"
      - text: "ข้อเข่าเป็นข้อต่อแบบบานพับ จึงงอและเหยียดได้ในระนาบเดียว"
    answer: "กล้ามเนื้อต้นขาด้านหน้าและด้านหลังเป็นคู่ตรงข้าม มัดหนึ่งหดอีกมัดคลาย จึงงอและเหยียดเข่าได้"
  - { type: check, problem: biology.animals.movement.p012, prompt: "กล้ามเนื้อดึงหรือดันกระดูก" }
glossary:
  - { term: โครงร่างค้ำจุนด้วยน้ำ, definition: "ของเหลวในช่องตัวที่บีบอัดไม่ได้ ใช้เป็นที่ให้กล้ามเนื้อดันและดึง เช่น ในไส้เดือนดิน" }
  - { term: โครงร่างภายนอก, definition: "เปลือกแข็งที่มีไคทินหุ้มลำตัวแมลง กล้ามเนื้อยึดอยู่ด้านใน" }
  - { term: ทิวบ์ฟีต, definition: "ท่อเล็กของระบบท่อน้ำในดาวทะเล ยืดและหดด้วยแรงดันน้ำและกล้ามเนื้อเพื่อเคลื่อนที่" }
  - { term: ซาร์โคเมียร์, definition: "หน่วยหดตัวของกล้ามเนื้อโครงร่าง อยู่ระหว่างเส้น Z สองเส้น" }
  - { term: เอ็นยึดข้อ, definition: "เนื้อเยื่อเหนียวที่ยึดกระดูกกับกระดูกตรงข้อต่อ" }
  - { term: เอ็นกล้ามเนื้อ, definition: "เนื้อเยื่อเหนียวที่ยึดกล้ามเนื้อกับกระดูก" }
  - { term: กล้ามเนื้อคู่ตรงข้าม, definition: "กล้ามเนื้อสองมัดที่ทำงานตรงข้ามกัน มัดหนึ่งหดอีกมัดคลาย เช่น ไบเซปส์กับไตรเซปส์" }
flashcards:
  - { front: "หมึกเคลื่อนที่อย่างไร", back: "หดกล้ามเนื้อลำตัวพ่นน้ำออกทางไซฟอน ตัวพุ่งไปทางตรงข้าม" }
  - { front: "ไส้เดือนดินใช้อะไรเป็นโครงร่าง", back: "ของเหลวในช่องตัว ร่วมกับกล้ามเนื้อวงและกล้ามเนื้อตามยาวที่ทำงานสลับกัน และเดือยยึดดิน" }
  - { front: "ข้อต่อแบบลูกกลมในเบ้า", back: "ข้อไหล่และข้อสะโพก เคลื่อนไหวได้รอบทิศ" }
  - { front: "ทฤษฎีการเลื่อนของเส้นใย", back: "หัวไมโอซินใช้ ATP ดึงแอกทินเข้าหากลางซาร์โคเมียร์ เส้นใยยาวเท่าเดิมแต่ซ้อนกันมากขึ้น" }
  - { front: "ทำไมกล้ามเนื้อต้องเป็นคู่ตรงข้าม", back: "กล้ามเนื้อดึงได้อย่างเดียว ดันไม่ได้" }
