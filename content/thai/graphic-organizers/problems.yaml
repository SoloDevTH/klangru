  difficulty: 5
  type: mcq
  stem: อ่านบทความในภาพ แล้วนำกิ่งใหญ่ของผังความคิดมาเขียน **ย่อความ** ข้อใดถูกต้องและครบที่สุด
  figure:
    src: bee-article.svg
    alt: บทความสมมติ ผึ้งตัวเล็ก งานใหญ่ 3 ย่อหน้า (1) ผึ้งไม่ได้ให้แค่น้ำผึ้ง ขณะผึ้งบินจากดอกหนึ่งไปอีกดอกหนึ่งเพื่อเก็บน้ำหวาน เรณูจะติดตัวผึ้งไปยังดอกอื่น ทำให้พืชติดผล ผลไม้และผักหลายชนิดที่เรากิน เช่น ลำไย แตงโม และฟักทอง จึงต้องพึ่งแมลงอย่างผึ้งช่วยถ่ายเรณู (2) ปัจจุบันผึ้งในหลายพื้นที่มีจำนวนลดลง สาเหตุสำคัญ ได้แก่ การใช้สารเคมีกำจัดแมลงโดยไม่ระวัง ป่าและทุ่งดอกไม้ซึ่งเป็นแหล่งอาหารของผึ้งลดลง และโรคกับปรสิตที่ระบาดในรังผึ้ง (3) เราช่วยผึ้งได้ เช่น ปลูกไม้ดอกหลายชนิดให้มีดอกบานตลอดปี ใช้สารเคมีเท่าที่จำเป็นและไม่ฉีดพ่นในช่วงที่ดอกบาน และสนับสนุนผู้เลี้ยงผึ้งในท้องถิ่น
  choices:
  - id: a
    text: ผึ้งทำน้ำผึ้งและช่วยให้ลำไย แตงโม ฟักทองติดผล
    feedback: มีแต่กิ่งที่หนึ่ง ขาดสาเหตุและวิธีช่วย
  - id: b
    text: ผึ้งช่วยถ่ายเรณูทำให้พืชผลหลายชนิดติดผล แต่ผึ้งลดลงเพราะสารเคมีกำจัดแมลง แหล่งอาหารที่ลดลง และโรค เราช่วยได้ด้วยการปลูกไม้ดอก ใช้สารเคมีอย่างระวัง และสนับสนุนผู้เลี้ยงผึ้ง
    correct: true
    feedback: ถูก ครบทั้งสามกิ่งใหญ่และเรียบเรียงเป็นประโยค
  - id: c
    text: ผึ้งลดลงเพราะคนไม่สนใจผึ้ง
    feedback: สาเหตุนี้ไม่มีในบทความ
  - id: d
    text: ทุกคนควรเลี้ยงผึ้งที่บ้าน
    feedback: เป็นข้อเสนอที่บทความไม่ได้บอก
  hints:
  - ย่อความต้องครบทุกกิ่งใหญ่
  - ระวังข้อที่เพิ่มข้อมูลจากนอกเรื่อง
  solution: ย่อความที่ดีเรียง **หน้าที่ → สาเหตุที่ลดลง → วิธีช่วย** และไม่เพิ่มข้อมูลนอกเรื่อง
  license: CC-BY-SA-4.0
  ai_assisted: true
