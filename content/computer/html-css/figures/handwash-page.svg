<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" font-family="sans-serif" font-size="14">
  <title>หน้าเว็บที่เบราว์เซอร์แสดง มีหัวเรื่อง รายการมีหมายเลข 3 ข้อ และลิงก์</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="460" height="300" fill="#ffffff"/>
  <rect x="10.0" y="10.0" width="440.0" height="280.0" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="10.0" y="10.0" width="440.0" height="30.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.2"/>
  <text x="30.0" y="31.0" font-size="13" text-anchor="start" fill="#6b7280" xml:space="preserve">ขั้นตอนล้างมือ</text>
  <text x="30.0" y="80.0" font-size="24" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">ขั้นตอนล้างมือ 7 ขั้น</text>
  <text x="50.0" y="125.0" font-size="16" text-anchor="start" fill="#1f2937" xml:space="preserve">1. ฝ่ามือถูฝ่ามือ</text>
  <text x="50.0" y="157.0" font-size="16" text-anchor="start" fill="#1f2937" xml:space="preserve">2. ฝ่ามือถูหลังมือ</text>
  <text x="50.0" y="189.0" font-size="16" text-anchor="start" fill="#1f2937" xml:space="preserve">3. ฝ่ามือถูฝ่ามือนิ้วสอดประสานกัน</text>
  <text x="30.0" y="250.0" font-size="16" text-anchor="start" fill="#1d4ed8" xml:space="preserve">อ่านต่อทั้ง 7 ขั้น</text>
  <line x1="30.0" y1="253.0" x2="150.0" y2="253.0" stroke="#1d4ed8" stroke-width="1"/>
</svg>
