problems:
  - id: phy.graph.p001
    topics: [physics.kinematics.motion-graphs]
    difficulty: 1
    type: mcq
    stem: "กราฟตำแหน่ง–เวลา ($x$–$t$) ของรถคันหนึ่งเป็นเส้นแนวนอนที่ $x = 50\\ \\mathrm{m}$ ตลอดช่วง $t = 0$ ถึง $10\\ \\mathrm{s}$ ข้อใดบรรยายการเคลื่อนที่ของรถได้ถูกต้อง"
    choices:
      - { id: a, text: "รถจอดนิ่งอยู่ที่ตำแหน่ง $50\\ \\mathrm{m}$", correct: true }
      - { id: b, text: "รถวิ่งด้วยความเร็วคงตัว $50\\ \\mathrm{m/s}$", feedback: "นี่เป็นการอ่านกราฟ $x$–$t$ เหมือนกราฟ $v$–$t$ แกนตั้งของกราฟนี้คือตำแหน่ง และตำแหน่งไม่เปลี่ยนเลย" }
      - { id: c, text: "รถวิ่งด้วยความเร็วคงตัว $5\\ \\mathrm{m/s}$", feedback: "ดูเหมือนนำ $50\\ \\mathrm{m}$ หารด้วย $10\\ \\mathrm{s}$ แต่ความเร็วคือความชัน $\\dfrac{\\Delta x}{\\Delta t}$ ซึ่งตำแหน่งไม่เปลี่ยน $\\Delta x = 0$" }
      - { id: d, text: "รถวิ่งไปตามถนนที่เรียบ ไม่มีเนิน", feedback: "กราฟไม่ใช่ภาพเส้นทาง เส้นแนวนอนบนกราฟ $x$–$t$ แปลว่าตำแหน่งไม่เปลี่ยนตามเวลา" }
    hints:
      - "แกนตั้งของกราฟนี้คือตำแหน่ง ตำแหน่งเปลี่ยนไปหรือไม่ตลอด $10\\ \\mathrm{s}$"
      - "ความเร็วคือความชันของกราฟ $x$–$t$ ลองหาความชันของเส้นแนวนอน"
    solution: "ตำแหน่งเท่ากับ $50\\ \\mathrm{m}$ ตลอดเวลา ความชัน $\\dfrac{\\Delta x}{\\Delta t} = \\dfrac{0}{10\\ \\mathrm{s}} = 0$ รถจึงจอดนิ่งอยู่ที่ตำแหน่ง $50\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.graph.p002
    topics: [physics.kinematics.motion-graphs]
    difficulty: 1
    type: numeric
    stem: "กราฟตำแหน่ง–เวลาของนักวิ่งเป็นเส้นตรงจากจุด $(t, x) = (0\\ \\mathrm{s}, 0\\ \\mathrm{m})$ ถึง $(6\\ \\mathrm{s}, 30\\ \\mathrm{m})$ นักวิ่งมีความเร็วเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 5, unit: m/s }
    hints:
      - "ความเร็วคือความชันของกราฟ $x$–$t$"
      - "ความชัน = การเปลี่ยนแปลงของแกนตั้ง ÷ การเปลี่ยนแปลงของแกนนอน คือ $\\dfrac{\\Delta x}{\\Delta t}$"
    misconceptions:
      - { match: 0.2, feedback: "ดูเหมือนนำเวลาหารด้วยตำแหน่ง ความชันคือแกนตั้งหารด้วยแกนนอน $\\dfrac{\\Delta x}{\\Delta t}$" }
      - { match: 180, feedback: "นั่นคือผลคูณของตำแหน่งกับเวลา ความเร็วต้องหาร ไม่ใช่คูณ" }
    solution: "$v = \\dfrac{\\Delta x}{\\Delta t} = \\dfrac{30\\ \\mathrm{m} - 0\\ \\mathrm{m}}{6\\ \\mathrm{s} - 0\\ \\mathrm{s}} = 5\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.graph.p003
    topics: [physics.kinematics.motion-graphs]
    difficulty: 2
    type: match
    stem: "จับคู่ลักษณะของกราฟกับการเคลื่อนที่ (ทิศที่เคลื่อนที่เป็นทิศบวก)"
    pairs:
      - { left: "กราฟ $x$–$t$ เป็นเส้นแนวนอน", right: "หยุดนิ่ง" }
      - { left: "กราฟ $x$–$t$ เป็นเส้นตรงเอียงขึ้น", right: "ความเร็วคงตัว" }
      - { left: "กราฟ $x$–$t$ เป็นเส้นโค้งที่ชันขึ้นเรื่อย ๆ", right: "เร็วขึ้นเรื่อย ๆ" }
      - { left: "กราฟ $v$–$t$ เป็นเส้นตรงเอียงขึ้นจากจุดกำเนิด", right: "ออกตัวจากหยุดนิ่งด้วยความเร่งคงตัว" }
      - { left: "กราฟ $v$–$t$ เป็นเส้นตรงเอียงลงจนแตะแกนเวลา", right: "ช้าลงอย่างสม่ำเสมอจนหยุด" }
    hints:
      - "บนกราฟ $x$–$t$ ความชันคือความเร็ว บนกราฟ $v$–$t$ ความชันคือความเร่ง"
      - "เส้นโค้งที่ชันขึ้นแปลว่าความชันเพิ่มขึ้น ส่วนกราฟ $v$–$t$ ที่แตะแกนเวลาแปลว่าความเร็วเป็นศูนย์"
    solution: "$x$–$t$ แนวนอน: ตำแหน่งไม่เปลี่ยน คือหยุดนิ่ง · $x$–$t$ เส้นตรงเอียงขึ้น: ความชันคงตัว คือความเร็วคงตัว · $x$–$t$ โค้งชันขึ้น: ความเร็วเพิ่มขึ้น · $v$–$t$ เส้นตรงขึ้นจากจุดกำเนิด: เริ่มจาก $v = 0$ และความเร่งคงตัว · $v$–$t$ เส้นตรงลงถึงแกน: ความเร็วลดลงสม่ำเสมอจนเป็นศูนย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.graph.p004
    topics: [physics.kinematics.motion-graphs]
    difficulty: 2
    type: numeric
    stem: "กราฟความเร็ว–เวลาของรถไฟฟ้าที่ออกจากสถานีเป็นเส้นตรงจาก $(0\\ \\mathrm{s}, 0\\ \\mathrm{m/s})$ ถึง $(10\\ \\mathrm{s}, 12\\ \\mathrm{m/s})$ รถไฟฟ้ามีความเร่งเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s²)"
    answer: { value: 1.2, tolerance: 0.012, unit: m/s² }
    hints:
      - "ความเร่งคือความชันของกราฟ $v$–$t$"
      - "หา $\\dfrac{\\Delta v}{\\Delta t}$ จากจุดสองจุดบนเส้นตรง"
    misconceptions:
      - { match: 0.83, feedback: "ดูเหมือนนำเวลาหารด้วยความเร็ว ความชันคือแกนตั้งหารด้วยแกนนอน $\\dfrac{\\Delta v}{\\Delta t}$" }
      - { match: 60, feedback: "นั่นคือพื้นที่ใต้กราฟ ซึ่งบอกการกระจัด (หน่วย m) ไม่ใช่ความเร่ง ความเร่งดูจากความชัน" }
    solution: "$a = \\dfrac{\\Delta v}{\\Delta t} = \\dfrac{12\\ \\mathrm{m/s} - 0}{10\\ \\mathrm{s} - 0} = 1.2\\ \\mathrm{m/s^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.graph.p005
    topics: [physics.kinematics.motion-graphs]
    difficulty: 3
    type: numeric
    stem: "กราฟความเร็ว–เวลาของรถยนต์เป็นเส้นตรงจาก $(0\\ \\mathrm{s}, 0\\ \\mathrm{m/s})$ ถึง $(8\\ \\mathrm{s}, 20\\ \\mathrm{m/s})$ ในช่วง 8 วินาทีนี้รถมีการกระจัดกี่เมตร (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 80, unit: m }
    hints:
      - "การกระจัดคือพื้นที่ระหว่างกราฟ $v$–$t$ กับแกนเวลา"
      - "พื้นที่นี้เป็นรูปสามเหลี่ยม ใช้ $\\tfrac{1}{2} \\times$ ฐาน $\\times$ สูง"
    misconceptions:
      - { match: 160, feedback: "ดูเหมือนลืม $\\tfrac{1}{2}$ พื้นที่ใต้เส้นตรงที่เริ่มจากศูนย์เป็นรูปสามเหลี่ยม ไม่ใช่สี่เหลี่ยม" }
      - { match: 2.5, feedback: "นั่นคือความชัน ซึ่งบอกความเร่ง ($\\mathrm{m/s^2}$) การกระจัดต้องหาจากพื้นที่ใต้กราฟ" }
    solution: "พื้นที่สามเหลี่ยม $= \\tfrac{1}{2}(8\\ \\mathrm{s})(20\\ \\mathrm{m/s}) = 80\\ \\mathrm{m}$ ตรวจด้วยสมการ: $s = \\tfrac{(u + v)t}{2} = \\tfrac{(0 + 20)(8)}{2} = 80\\ \\mathrm{m}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.graph.p006
    topics: [physics.kinematics.motion-graphs]
    difficulty: 3
    type: numeric
    stem: "รถไฟฟ้าใต้ดินออกจากสถานี เร่งจาก $0$ ถึง $15\\ \\mathrm{m/s}$ ใน $10\\ \\mathrm{s}$ วิ่งด้วยความเร็ว $15\\ \\mathrm{m/s}$ อีก $40\\ \\mathrm{s}$ แล้วเบรกจนหยุดที่สถานีถัดไปใน $10\\ \\mathrm{s}$ (ทุกช่วงเปลี่ยนความเร็วอย่างสม่ำเสมอ) สองสถานีห่างกันกี่เมตร (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 750, unit: m }
    hints:
      - "วาดกราฟ $v$–$t$ จะได้รูปสี่เหลี่ยมคางหมู ระยะห่างคือพื้นที่ใต้กราฟ"
      - "แบ่งเป็นสามเหลี่ยม สี่เหลี่ยมผืนผ้า และสามเหลี่ยม แล้วหาพื้นที่แต่ละส่วนมาบวกกัน"
    misconceptions:
      - { match: 900, feedback: "ดูเหมือนคิดเป็นสี่เหลี่ยมผืนผ้าทั้งหมด ($15 \\times 60$) แต่ช่วงเร่งและช่วงเบรกเป็นสามเหลี่ยม ต้องคูณ $\\tfrac{1}{2}$" }
      - { match: 600, feedback: "นั่นคือเฉพาะช่วงที่ความเร็วคงตัว รถยังเคลื่อนที่ในช่วงเร่งและช่วงเบรกด้วย ต้องรวมพื้นที่สามเหลี่ยมทั้งสองด้วย" }
    solution: "ช่วงเร่ง: $\\tfrac{1}{2}(10)(15) = 75\\ \\mathrm{m}$ ช่วงคงตัว: $(40)(15) = 600\\ \\mathrm{m}$ ช่วงเบรก: $\\tfrac{1}{2}(10)(15) = 75\\ \\mathrm{m}$ รวม $75 + 600 + 75 = 750\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.graph.p007
    topics: [physics.kinematics.motion-graphs]
    difficulty: 3
    type: mcq
    stem: "โยนลูกบอลขึ้นตรง ๆ แล้วรับคืนที่ระดับเดิม ไม่คิดแรงต้านอากาศ ให้ทิศขึ้นเป็นบวก กราฟความเร็ว–เวลาของลูกบอลตั้งแต่ปล่อยมือจนรับคืนมีลักษณะอย่างไร"
    choices:
      - { id: a, text: "เส้นตรงเส้นเดียว เริ่มที่ค่าบวก ลดลงผ่านศูนย์ แล้วเป็นลบด้วยขนาดเท่าค่าเริ่มต้น", correct: true }
      - { id: b, text: "รูปตัว V เริ่มที่ค่าบวก ลดลงถึงศูนย์ แล้วเพิ่มกลับเป็นบวกเท่าเดิม", feedback: "นี่คือกราฟของ **อัตราเร็ว** ซึ่งไม่มีทิศ ขาลงลูกบอลเคลื่อนที่ทิศลง ความเร็วจึงเป็นลบ" }
      - { id: c, text: "เส้นตรงเริ่มที่ค่าบวก ลดลงถึงศูนย์ แล้วเป็นเส้นแนวนอนที่ศูนย์", feedback: "ที่จุดสูงสุดความเร็วเป็นศูนย์เพียงชั่วขณะ ลูกบอลไม่ได้หยุดค้างอยู่ ความเร่งยังคงเป็น $g$ ทิศลง" }
      - { id: d, text: "เส้นแนวนอนที่ค่าบวกตลอดเวลา", feedback: "เส้นแนวนอนบนกราฟ $v$–$t$ แปลว่าความเร็วคงตัว แต่ลูกบอลมีความเร่ง $g$ ความเร็วจึงเปลี่ยนตลอดเวลา" }
    hints:
      - "ความเร่งของลูกบอลคงตัวตลอดการเคลื่อนที่ คือ $g$ ทิศลง ความชันของกราฟ $v$–$t$ จึงมีค่าอย่างไร"
      - "ขาขึ้นความเร็วเป็นบวก ขาลงลูกบอลเคลื่อนที่ทิศลง ความเร็วจึงมีเครื่องหมายใด"
    solution: "ความเร่งคงตัวเท่ากับ $-g$ (ทิศลง) กราฟ $v$–$t$ จึงเป็นเส้นตรงเส้นเดียวที่มีความชันเป็นลบ เริ่มที่ $+u$ ผ่านศูนย์ที่จุดสูงสุด แล้วลงไปถึง $-u$ เมื่อกลับถึงระดับเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.graph.p008
    topics: [physics.kinematics.motion-graphs]
    difficulty: 4
    type: numeric
    stem: "พี่วินมอเตอร์ไซค์ขี่เข้าซอยด้วยความเร็ว $+6\\ \\mathrm{m/s}$ นาน $4\\ \\mathrm{s}$ แล้วพบว่าเลยบ้านลูกค้า จึงถอยหลังด้วยความเร็ว $-2\\ \\mathrm{m/s}$ นาน $3\\ \\mathrm{s}$ ตลอด 7 วินาทีนี้มีการกระจัดกี่เมตร (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 18, unit: m }
    hints:
      - "วาดกราฟ $v$–$t$ จะมีสี่เหลี่ยมเหนือแกนเวลาหนึ่งรูปและใต้แกนเวลาหนึ่งรูป"
      - "การกระจัดคือผลรวมของพื้นที่ โดยพื้นที่ใต้แกนเวลานับเป็นลบ"
    misconceptions:
      - { match: 30, feedback: "นั่นคือระยะทาง ซึ่งบวกพื้นที่ทั้งสองเป็นบวก การกระจัดต้องนับพื้นที่ใต้แกน (ช่วงถอยหลัง) เป็นลบ" }
      - { match: 4, feedback: "ดูเหมือนนำความเร็ว $6$ กับ $-2$ มาบวกกัน การกระจัดต้องคิดเวลาของแต่ละช่วงด้วย คือพื้นที่ ความเร็ว × เวลา" }
    solution: "ช่วงแรก: $(+6\\ \\mathrm{m/s})(4\\ \\mathrm{s}) = +24\\ \\mathrm{m}$ ช่วงถอย: $(-2\\ \\mathrm{m/s})(3\\ \\mathrm{s}) = -6\\ \\mathrm{m}$ การกระจัด $= 24 - 6 = 18\\ \\mathrm{m}$ (ส่วนระยะทางคือ $24 + 6 = 30\\ \\mathrm{m}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.graph.p009
    topics: [physics.kinematics.motion-graphs]
    difficulty: 4
    type: numeric
    stem: "รถจักรยานยนต์มีความเร็ว $3\\ \\mathrm{m/s}$ ที่ $t = 0$ กราฟความเร่ง–เวลาเป็นเส้นแนวนอนที่ $a = 2\\ \\mathrm{m/s^2}$ ตั้งแต่ $t = 0$ ถึง $t = 5\\ \\mathrm{s}$ ที่ $t = 5\\ \\mathrm{s}$ รถมีความเร็วเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 13, unit: m/s }
    hints:
      - "พื้นที่ใต้กราฟ $a$–$t$ บอกความเร็วที่เปลี่ยนไป $\\Delta v$"
      - "หาพื้นที่สี่เหลี่ยมใต้กราฟ แล้วนำไปบวกกับความเร็วต้น"
    misconceptions:
      - { match: 10, feedback: "นั่นคือ $\\Delta v$ (พื้นที่ใต้กราฟ $a$–$t$) ซึ่งเป็นความเร็วที่ **เพิ่มขึ้น** ต้องบวกความเร็วต้น $3\\ \\mathrm{m/s}$ ด้วย" }
      - { match: 5, feedback: "ดูเหมือนบวกความเร็วต้นกับความเร่งเลย ($3 + 2$) ความเร่ง $2\\ \\mathrm{m/s^2}$ ทำให้ความเร็วเพิ่ม $2\\ \\mathrm{m/s}$ **ทุกวินาที** ต้องคูณด้วยเวลาก่อน" }
    solution: "พื้นที่ใต้กราฟ $a$–$t$: $\\Delta v = (2\\ \\mathrm{m/s^2})(5\\ \\mathrm{s}) = 10\\ \\mathrm{m/s}$ ความเร็วปลาย $= 3 + 10 = 13\\ \\mathrm{m/s}$ (ตรงกับ $v = u + at$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.graph.p010
    topics: [physics.kinematics.motion-graphs]
    difficulty: 3
    type: expression
    stem: "กราฟความเร็ว–เวลาเป็นเส้นตรงจากความเร็ว $u$ ที่เวลา $0$ ไปถึงความเร็ว $v$ ที่เวลา $t$ (ทั้ง $u$ และ $v$ เป็นบวก) เขียนพื้นที่ใต้กราฟซึ่งคือการกระจัด $s$ ในรูปของ $u$, $v$ และ $t$"
    prefix: "s ="
    answer: { latex: "\\frac{(u+v)t}{2}", variables: [u, v, t] }
    hints:
      - "พื้นที่ใต้เส้นตรงนี้เป็นรูปสี่เหลี่ยมคางหมู มีด้านคู่ขนานยาว $u$ และ $v$ สูง $t$"
      - "พื้นที่สี่เหลี่ยมคางหมู $= \\tfrac{1}{2} \\times$ (ผลบวกด้านคู่ขนาน) $\\times$ สูง"
    misconceptions:
      - { match: "(u+v)t", feedback: "ลืม $\\tfrac{1}{2}$ ของสูตรพื้นที่สี่เหลี่ยมคางหมู ผลจึงมากเป็นสองเท่า" }
