problems:
- id: thai.writing.spelling-basics.p001
  topics:
  - thai.writing.spelling-basics
  difficulty: 1
  type: text
  stem: 'แจกลูก: **ม + สระอา** อ่านเป็นคำว่าอะไร (พิมพ์คำ)'
  accepted:
  - มา
  misconceptions:
  - match: ม
    feedback: ยังขาดสระ ต้องเติมสระอาหลังพยัญชนะ
  - match: อามา
    feedback: สระอาเขียนหลังพยัญชนะ ไม่เขียนหน้า
  hints:
  - มอ + อา
  - สระอา (◌า) เขียนไว้หลังพยัญชนะ
  solution: มอ – อา – **มา**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.spelling-basics.p002
  topics:
  - thai.writing.spelling-basics
  difficulty: 1
  type: mcq
  stem: สะกดว่า **กอ – อา – งอ** อ่านเป็นคำว่าอะไร
  choices:
  - id: a
    text: กาง
    correct: true
    feedback: ถูก ก + อา + ง สะกด = กาง
  - id: b
    text: กา
    feedback: ลืมตัวสะกด ง ที่ท้ายคำ
  - id: c
    text: กัง
    feedback: สระที่สะกดคือ อา (เสียงยาว) ไม่ใช่ อะ
  - id: d
    text: งาก
    feedback: สลับพยัญชนะต้นกับตัวสะกด พยัญชนะต้นคือ ก
  hints:
  - ตัวแรกที่สะกดคือพยัญชนะต้น
  - ตัวสุดท้าย งอ คือตัวสะกด
  solution: ก + อา + ง = **กาง**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.spelling-basics.p003
  topics:
  - thai.writing.spelling-basics
  difficulty: 1
  type: match
  stem: แจกลูก **ป** กับสระ แล้วจับคู่ให้ถูก
  pairs:
  - left: ป + อา
    right: ปา
  - left: ป + อี
    right: ปี
  - left: ป + อู
    right: ปู
  - left: ป + โอ
    right: โป
  hints:
  - อ่าน ปอ แล้วตามด้วยเสียงสระ
  - สระโอ (โ) เขียนหน้าพยัญชนะ
  solution: ปา · ปี · ปู · โป
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.spelling-basics.p004
  topics:
  - thai.writing.spelling-basics
  difficulty: 1
  type: mcq
  stem: คำใดเป็นคำใน **แม่ ก กา** (ไม่มีตัวสะกด)
  choices:
  - id: a
    text: เสือ
    correct: true
    feedback: ถูก ส + สระเอือ ไม่มีตัวสะกด
  - id: b
    text: นก
    feedback: มี ก เป็นตัวสะกด
  - id: c
    text: มด
    feedback: มี ด เป็นตัวสะกด
  - id: d
    text: ช้าง
    feedback: มี ง เป็นตัวสะกด
  hints:
  - แม่ ก กา มีแค่พยัญชนะต้นกับสระ
  - ดูว่ามีพยัญชนะท้ายคำหลังสระหรือไม่
  solution: '**เสือ** ไม่มีตัวสะกด จึงเป็นแม่ ก กา'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.spelling-basics.p005
  topics:
  - thai.writing.spelling-basics
  difficulty: 2
  type: order
  stem: เรียงขั้นการสะกดคำว่า **บ้าน** ให้ถูกลำดับ
  items:
  - บอ
  - อา
  - นอ
  - บาน
  - ไม้โท
  - บ้าน
  hints:
  - สะกดพยัญชนะต้น สระ ตัวสะกด แล้วอ่านรวม
  - อ่านคำที่ยังไม่มีวรรณยุกต์ก่อน แล้วจึงเติมไม้โท
  solution: บอ – อา – นอ – **บาน** – ไม้โท – **บ้าน**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.spelling-basics.p006
  topics:
  - thai.writing.spelling-basics
  difficulty: 2
  type: text
  stem: 'เติมคำที่อ่านว่า **รด** ให้ถูกความหมาย: "ทุกเช้าฉันนั่ง___ไปโรงเรียน"'
  accepted:
  - รถ
  misconceptions:
  - match: รด
    feedback: รด หมายถึงเทน้ำลงไป เช่น รดน้ำต้นไม้
  - match: รส
    feedback: รส คือสิ่งที่ลิ้นรู้สึก เช่น รสหวาน
  hints:
  - ประโยคนี้พูดถึงยานพาหนะ
  - นึกคำคู่ เช่น รถยนต์ รถเมล์
  solution: นั่ง**รถ**ไปโรงเรียน (รถ = ยานพาหนะ ถ สะกดออกเสียง ด)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.spelling-basics.p007
  topics:
  - thai.writing.spelling-basics
  difficulty: 2
  type: match
  stem: คำทั้งสามอ่านว่า **รด** เหมือนกัน จับคู่คำกับความหมาย
  pairs:
  - left: รด
    right: เทน้ำลงไป
  - left: รส
    right: สิ่งที่ลิ้นรู้สึก
  - left: รถ
    right: ยานพาหนะ
  hints:
  - 'นึกคำคู่: รดน้ำ รสหวาน รถยนต์'
  - คำคู่บอกความหมายของแต่ละคำ
  solution: รด = เทน้ำลงไป · รส = สิ่งที่ลิ้นรู้สึก · รถ = ยานพาหนะ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.spelling-basics.p008
  topics:
  - thai.writing.spelling-basics
  difficulty: 2
  type: mcq
  stem: คำว่า **มด** อ่าน ม + โอะ + ด แต่ไม่เห็นรูปสระ เพราะอะไร
  choices:
  - id: a
    text: สระโอะลดรูปเมื่อมีตัวสะกด
    correct: true
    feedback: ถูก โอะ + ตัวสะกด ไม่ต้องเขียนรูปสระ เช่น มด นก กบ
  - id: b
    text: คำนี้ไม่มีสระ
    feedback: ทุกพยางค์ต้องมีสระ มด มีเสียงสระโอะ แต่ไม่เขียนรูป
  - id: c
    text: ตัว ด เป็นสระ
    feedback: ด เป็นพยัญชนะ ทำหน้าที่ตัวสะกด
  - id: d
    text: เขียนผิด ที่ถูกคือ โมด
    feedback: โมด เป็นเสียงยาว ไม่ใช่คำว่า มด
  hints:
  - ลองอ่านช้า ๆ ว่า มด มีเสียงสระอะไร
  - สระบางตัวลดรูปเมื่อมีตัวสะกด
  solution: มด = ม + โอะ + ด สระโอะ**ลดรูป**เมื่อมีตัวสะกด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.spelling-basics.p009
  topics:
  - thai.writing.spelling-basics
  difficulty: 3
  type: mcq
  stem: ดูรายการซื้อของของแม่ คำใด **เขียนผิด**
  figure: &id001
    src: shopping-list.svg
    alt: 'กระดาษรายการซื้อของของแม่ 5 รายการ: ๑. ไข่ไก่ ๑๐ ฟอง ๒. น้ำปลา ๑ ขวด ๓. ข้าวสาน ๑ ถุง ๔. ผักบุ้ง ๒ กำ ๕. กล้วยหอม ๑ หวี'
  choices:
  - id: a
    text: ข้าวสาน
    correct: true
    feedback: ถูก ข้าวที่สีแล้วเขียน ข้าวสาร (ร สะกด) ส่วน สาน แปลว่าจักสาน
  - id: b
    text: น้ำปลา
    feedback: เขียนถูกแล้ว
  - id: c
    text: ผักบุ้ง
    feedback: เขียนถูกแล้ว
  - id: d
    text: กล้วยหอม
    feedback: เขียนถูกแล้ว
  hints:
  - หาคำที่อ่านถูกแต่ความหมายไม่เข้ากับของที่ซื้อ
  - สาน แปลว่า ขัดตอกไขว้กัน เช่น จักสาน
  solution: '**ข้าวสาน** เขียนผิด ที่ถูกคือ **ข้าวสาร**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.spelling-basics.p010
  topics:
  - thai.writing.spelling-basics
  difficulty: 3
  type: text
  stem: จากรายการซื้อของของแม่ แก้คำที่เขียนผิดในข้อ ๓ ให้ถูก (พิมพ์ทั้งคำ)
  figure: *id001
  accepted:
  - ข้าวสาร
  misconceptions:
  - match: ข้าวสาน
    feedback: นี่คือคำเดิมที่ผิด สาน แปลว่าจักสาน
  - match: ข้าวศาล
    feedback: ศาล คือที่ตั้งพระภูมิ ไม่ใช่ข้าว
  - match: ข้าวสาล
    feedback: ไม่มีคำนี้ ข้าวที่สีแล้วใช้ ร สะกด
  hints:
  - คำนี้อ่านว่า ข้าว-สาน
  - นึกถึงถุงข้าวสารในครัว ตัวสะกดออกเสียง น แต่ไม่ใช่ น
  solution: '**ข้าวสาร** (ร สะกด ออกเสียง น)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.spelling-basics.p011
  topics:
  - thai.writing.spelling-basics
  difficulty: 3
  type: mcq
  stem: คำใดใช้ตัวสะกด **ไม่ตรงมาตรา** (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: สุข
    correct: true
    feedback: ถูก ข สะกด ออกเสียง ก
  - id: b
    text: ลาภ
    correct: true
    feedback: ถูก ภ สะกด ออกเสียง บ
  - id: c
    text: บาท
    correct: true
    feedback: ถูก ท สะกด ออกเสียง ด
  - id: d
    text: นก
    feedback: ก สะกด ออกเสียง ก ตรงมาตรา
  - id: e
    text: กบ
    feedback: บ สะกด ออกเสียง บ ตรงมาตรา
  hints:
  - ตรงมาตรา คือตัวสะกดเป็น ก ด บ ง น ม ย ว
  - ดูว่าตัวที่เขียนกับเสียงที่อ่านเป็นตัวเดียวกันหรือไม่
  solution: สุข ลาภ บาท ใช้ตัวสะกดไม่ตรงมาตรา ส่วน นก กบ ตรงมาตรา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.spelling-basics.p012
  topics:
  - thai.writing.spelling-basics
  difficulty: 3
  type: match
  stem: คำที่อ่านว่า **สาน** มี 3 แบบ เติมให้ถูก
  pairs:
  - left: หุงข้าว___
    right: สาร
  - left: จัก___ตะกร้า
    right: สาน
  - left: ___พระภูมิ
    right: ศาล
  hints:
  - นึกความหมายของแต่ละประโยค
  - ข้าวสาร · จักสาน · ศาลพระภูมิ
  solution: หุงข้าว**สาร** · จัก**สาน**ตะกร้า · **ศาล**พระภูมิ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.spelling-basics.p013
  topics:
  - thai.writing.spelling-basics
  difficulty: 4
  type: mcq
  stem: ประโยคใด **เขียนถูกทุกคำ**
  choices:
  - id: a
    text: ปีนี้ลุงได้โชคลาภ
    correct: true
    feedback: ถูก โชคลาภ ใช้ ภ สะกด
  - id: b
    text: มีดบาทมือน้อง
    feedback: บาท คือหน่วยเงิน มีดทำให้เป็นแผลต้องเขียน บาด
  - id: c
    text: แม่ต้มข้าวสุขแล้ว
    feedback: ข้าวที่กินได้แล้วเขียน สุก สุข แปลว่าสบายใจ
  - id: d
    text: พ่อชอบกินลาภหมู
    feedback: อาหารชนิดนี้เขียน ลาบ ส่วน ลาภ แปลว่าโชค
  hints:
  - ทุกตัวเลือกมีคำที่อ่านเหมือนกันแต่เขียนต่างกัน
  - 'ดูความหมายของคำในประโยค: เงิน แผล อาหาร โชค'
  solution: '**ปีนี้ลุงได้โชคลาภ** ถูกทุกคำ ตัวเลือกอื่นควรเป็น มีด**บาด** ข้าว**สุก** **ลาบ**หมู'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.spelling-basics.p014
  topics:
  - thai.writing.spelling-basics
  difficulty: 4
  type: text
  stem: 'แจกลูก: **ก + สระโอะ + บ สะกด** เขียนเป็นคำว่าอะไร'
  accepted:
  - กบ
  misconceptions:
  - match: โกบ
    feedback: โกบ เป็นสระโอ (เสียงยาว) ที่ถูกเป็นสระโอะ ซึ่งลดรูปเมื่อมีตัวสะกด
  - match: โกะบ
    feedback: สระโอะเมื่อมีตัวสะกดไม่ต้องเขียนรูป
  - match: กับ
    feedback: กับ เป็นสระอะ (ไม้หันอากาศ) ไม่ใช่สระโอะ
  hints:
  - สระโอะเมื่อมีตัวสะกดจะลดรูป
  - นึกถึงคำ มด นก ที่ไม่มีรูปสระ
  solution: ก + โอะ + บ = **กบ** (สระโอะลดรูป)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.spelling-basics.p015
  topics:
  - thai.writing.spelling-basics
  difficulty: 4
  type: order
  stem: เมื่อได้ยินคำที่ไม่แน่ใจว่าเขียนอย่างไร เรียงขั้นการคิดให้ถูก
  items:
  - ฟังคำให้ชัด
  - แยกพยัญชนะต้น สระ ตัวสะกด และวรรณยุกต์
  - นึกความหมายของคำในประโยค
  - เลือกตัวสะกดที่ตรงความหมาย
  - เขียนแล้วอ่านทวน
  hints:
  - เริ่มจากฟัง จบที่ตรวจทาน
  - ต้องรู้ความหมายก่อนจึงเลือกตัวสะกดได้
  solution: ฟัง → แยกส่วน → นึกความหมาย → เลือกตัวสะกด → เขียนแล้วอ่านทวน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.spelling-basics.p016
  topics:
  - thai.writing.spelling-basics
  difficulty: 5
  type: mcq
  stem: ครูพูดประโยค "พี่ทำ **กาน** บ้านเสร็จแล้ว" นักเรียนต้องเขียนคำที่อ่านว่า กาน อย่างไร
  choices:
  - id: a
    text: การ
    correct: true
    feedback: ถูก การบ้าน ใช้ ร สะกด
  - id: b
    text: กาน
    feedback: อ่านถูก แต่ไม่มีคำนี้ในความหมายนี้
  - id: c
    text: กาล
    feedback: กาล แปลว่าเวลา เช่น กาลเวลา
  - id: d
    text: ก้าน
    feedback: ก้าน เป็นเสียงโท และหมายถึงก้านดอกไม้
  hints:
  - คำนี้คืองานที่ครูให้ทำที่บ้าน
  - นึกคำคู่ที่คุ้นตา เช่น สมุดการบ้าน
  solution: การบ้าน เขียน **การ** (ร สะกด ออกเสียง น)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.writing.spelling-basics.p017
  topics:
  - thai.writing.spelling-basics
  difficulty: 5
  type: mcq
  stem: คู่ใด **อ่านออกเสียงเหมือนกันทุกอย่าง** (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: รด – รถ
    correct: true
    feedback: ถูก อ่านว่า รด ทั้งคู่
  - id: b
    text: สุข – สุก
    correct: true
    feedback: ถูก อ่านว่า สุก ทั้งคู่
  - id: c
    text: ลาภ – ลาบ
    correct: true
    feedback: ถูก อ่านว่า ลาบ ทั้งคู่
  - id: d
    text: ขัน – ขาน
    feedback: ขัน เสียงสั้น (สระอะ) ขาน เสียงยาว (สระอา) อ่านต่างกัน
  - id: e
    text: บาท – บ้าน
    feedback: ตัวสะกดต่างเสียง (ด กับ น) และวรรณยุกต์ต่างกัน
  hints:
  - 'เทียบทีละส่วน: พยัญชนะต้น สระ เสียงตัวสะกด และวรรณยุกต์'
  - ระวังสระเสียงสั้นกับเสียงยาว
  solution: รด–รถ · สุข–สุก · ลาภ–ลาบ อ่านเหมือนกันแต่เขียนและความหมายต่างกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
