<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Noto Sans Thai',sans-serif">
<title>แผนผังกริยาช่วย 想 要 会 能 可以 เทียบคำไทยและรูปปฏิเสธ</title>
<defs><marker id="a1f4e9c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker><marker id="a2a6a2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a6a2a"/></marker><marker id="a7a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5a00"/></marker><marker id="ab3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<rect x="0" y="0" width="720" height="450" fill="#fff"/>
<text x="360.0" y="30.0" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">กริยาช่วยวางหน้ากริยาหลัก: 我 + 想 + 去</text>
<text x="130.0" y="68.0" font-size="16" text-anchor="middle" fill="#666" font-weight="bold">คำไทยที่ใกล้เคียง</text>
<text x="360.0" y="68.0" font-size="16" text-anchor="middle" fill="#666" font-weight="bold">ภาษาจีน</text>
<text x="590.0" y="68.0" font-size="16" text-anchor="middle" fill="#666" font-weight="bold">รูปปฏิเสธ</text>
<rect x="30.0" y="82.0" width="200.0" height="54.0" rx="8" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="130.0" y="115.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">อยาก</text>
<rect x="290.0" y="82.0" width="140.0" height="54.0" rx="8" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="360.0" y="117.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="bold">想 xiǎng</text>
