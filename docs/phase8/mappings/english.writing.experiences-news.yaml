topic: english.writing.experiences-news
rows:
  - { framework: th-core-2551-foreign-languages, indicators: ["ต 1.2 ม.3/4", "ต 1.2 ม.4-6/4"], coverage: partial, note: "สอนการถามและให้ข้อมูลเกี่ยวกับข่าวที่อ่าน (5W, คำถามที่ข่าวตอบได้) บรรยาย อธิบาย เปรียบเทียบเหตุการณ์ (However, In contrast, busier than) และแสดงความคิดเห็นต่อข่าว ผู้เรียนเลือก เรียง และเติมประโยค แต่ไม่ได้พูด และไม่ได้เขียนอย่างอิสระ (ตรวจอัตโนมัติไม่ได้)" }
  - { framework: th-core-2551-foreign-languages, indicators: ["ต 1.3 ม.3/1", "ต 1.3 ม.4-6/1"], coverage: partial, note: "สอนการบรรยายและนำเสนอประสบการณ์ ข่าว เหตุการณ์ และประเด็นในสังคม (recount, ข่าวแบบพีระมิดกลับหัว) ผู้เรียนเรียงย่อหน้าและข่าว เลือก tense และตรวจข้อผิดพลาด แต่การพูดนำเสนอและการเขียนเองอย่างอิสระตรวจอัตโนมัติไม่ได้" }
  - { framework: th-core-2551-foreign-languages, indicators: ["ต 1.3 ม.1/1", "ต 1.3 ม.2/1"], coverage: partial, note: "แถวเพิ่มนอกแผนตามข้อเสนอในบันทึก english-13: บทเรียนสอนครบทุกเรื่องในตัวชี้วัด (ตนเอง กิจวัตร ประสบการณ์ สิ่งแวดล้อมใกล้ตัว และข่าวหรือเหตุการณ์ในสังคม) พร้อมการเลือก tense กิจวัตรเทียบวันพิเศษ แต่ตัวชี้วัดให้ทั้งพูดและเขียน แอปไม่มีเสียงและตรวจการเขียนอิสระไม่ได้" }
  - { framework: th-core-2551-foreign-languages, indicators: ["ต 1.2 ม.3/5", "ต 1.2 ม.4-6/5"], coverage: partial, note: "แถวเพิ่มนอกแผนตามข้อเสนอในบันทึก english-13: สอนการบรรยายความรู้สึกและความคิดเห็นต่อกิจกรรม ประสบการณ์ และข่าวหรือเหตุการณ์พร้อมเหตุผล (I was delighted to hear that ..., ตัวอย่างสรุปข่าวและแสดงความเห็นสองด้าน) แต่ผู้เรียนเลือกคำตอบ ไม่ได้พูดหรือเขียนเอง" }
  - { framework: cefr, indicators: ["CEFR-B1-spoken-production"], coverage: partial, note: "เรียงเรื่องเล่าประสบการณ์เป็นลำดับ (orientation → events → response) ในรูปเขียน แอปไม่มีเสียง" }
  - { framework: cefr, indicators: ["CEFR-B1-written-production"], coverage: partial, note: "เรียงย่อหน้าเล่าประสบการณ์และข่าว เลือกประโยคเปรียบเทียบที่ถูก และหาข้อผิดพลาด tense ในบันทึก แต่ไม่ได้เขียนข้อความต่อเนื่องเองอย่างอิสระ" }
  - { framework: cefr, indicators: ["CEFR-B1-written-interaction"], coverage: partial, note: "เลือกคำตอบเขียนที่แสดงความรู้สึกและความเห็นต่อข่าวพร้อมอ้างข้อมูล แต่ไม่ได้เขียนตอบโต้เองอย่างอิสระ" }
