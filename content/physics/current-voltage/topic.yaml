id: physics.electricity.current-voltage
subject: physics
title: { th: กระแสไฟฟ้า ความต่างศักย์ และกฎของโอห์ม, en: "Current, voltage and Ohm's law" }
summary: เข้าใจกระแสไฟฟ้า ความต่างศักย์ และความต้านทาน ใช้กฎของโอห์มคำนวณวงจรอย่างง่าย และต่อแอมมิเตอร์กับโวลต์มิเตอร์ให้ถูกวิธี
difficulty: 4
minutes: 35
prerequisites: [physics.units.si, math.algebra.rearrange-formula]
encompasses:
  - { id: math.algebra.rearrange-formula, weight: 0.4 }
  - { id: physics.units.si, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: iv-curves.svg
    alt: "กราฟกระแส I (แกนตั้ง) กับความต่างศักย์ V (แกนนอน) สามกราฟ ตัวต้านทานเป็นเส้นตรงผ่านจุดกำเนิด หลอดไส้เป็นเส้นโค้งที่ลาดน้อยลงเรื่อย ๆ เมื่อ V เพิ่ม ไดโอดมีกระแสเป็นศูนย์จนความต่างศักย์ประมาณ 0.6 V แล้วกระแสเพิ่มขึ้นอย่างรวดเร็ว"
    caption: "ตัวต้านทานโอห์มมิกมีกราฟเป็นเส้นตรง ส่วนหลอดไส้และไดโอดไม่เป็นไปตามกฎของโอห์ม"
  - type: worked-example
    title: ประจุและพลังงานจากพาวเวอร์แบงก์
    problem: "พาวเวอร์แบงก์จ่ายไฟ $5\\ \\mathrm{V}$ ชาร์จโทรศัพท์ด้วยกระแส $2\\ \\mathrm{A}$ นาน $30$ นาที มีประจุไหลผ่านเท่าใด และพาวเวอร์แบงก์ส่งพลังงานให้เท่าใด"
    steps:
      - text: "แปลงเวลา: $t = 30 \\times 60 = 1800\\ \\mathrm{s}$"
      - text: "ประจุ: $Q = It = (2)(1800) = 3600\\ \\mathrm{C}$"
        why: "กระแส 1 แอมแปร์คือประจุ 1 คูลอมบ์ต่อวินาที ประจุทั้งหมดจึงเป็นกระแสคูณเวลา (ซึ่งเท่ากับ $1\\ \\mathrm{Ah}$ พอดี)"
      - text: "พลังงาน: $W = QV = (3600)(5) = 18\\,000\\ \\mathrm{J}$"
        why: "ความต่างศักย์ $5\\ \\mathrm{V}$ หมายถึงประจุทุก 1 คูลอมบ์ได้พลังงาน $5\\ \\mathrm{J}$"
    answer: "ประจุ $3600\\ \\mathrm{C}$ และพลังงาน $18\\,000\\ \\mathrm{J}$ ($18\\ \\mathrm{kJ}$)"
  - { type: check, problem: phy.ohm.p014, prompt: "ลองคิดพลังงานของประจุ" }
  - type: worked-example
    title: หาความต้านทานจากกราฟผลการทดลอง
    problem: "นักเรียนวัดกระแสที่ไหลผ่านตัวต้านทานที่ความต่างศักย์ต่าง ๆ แล้วเขียนกราฟพร้อมเส้นตรงที่เหมาะสมดังรูป ตัวต้านทานมีความต้านทานเท่าใด"
    figure:
      src: we-iv-data.svg
      alt: "กราฟกระแส I (แอมแปร์) กับความต่างศักย์ V (โวลต์) มีจุดข้อมูลรูปกากบาท 5 จุดที่ 1 ถึง 5 V กระแสประมาณ 0.05, 0.10, 0.15, 0.20 และ 0.25 A จุดเบี่ยงจากเส้นเล็กน้อย เส้นตรงที่เหมาะสมผ่านจุดกำเนิดและจุด (6 V, 0.30 A)"
    steps:
      - text: "จุดข้อมูลเรียงเกือบเป็นเส้นตรงผ่านจุดกำเนิด ตัวต้านทานจึงเป็นแบบโอห์มมิก"
        why: "จุดที่เบี่ยงเล็กน้อยมาจากความคลาดเคลื่อนในการวัด จึงใช้เส้นที่เหมาะสมแทนการใช้จุดใดจุดหนึ่ง"
      - text: "เลือกสองจุดบนเส้นที่อยู่ห่างกัน เช่น $(0, 0)$ และ $(6\\ \\mathrm{V}, 0.30\\ \\mathrm{A})$ ความชัน $= \\dfrac{0.30}{6} = 0.05\\ \\mathrm{A/V}$"
      - text: "ความชันของกราฟ $I$–$V$ คือ $\\tfrac{1}{R}$ ดังนั้น $R = \\dfrac{1}{0.05} = 20\\ \\Omega$"
        why: "จาก $I = \\tfrac{1}{R}V$ เทียบกับ $y = mx$ ความชันคือ $\\tfrac{1}{R}$ ไม่ใช่ $R$"
    answer: "ความต้านทาน $20\\ \\Omega$"
  - { type: check, problem: phy.ohm.p015, prompt: "หลอดไส้ต่างจากตัวต้านทานอย่างไร" }
  - type: simulation
    title: กฎของโอห์ม (PhET Ohm's Law)
    url: https://phet.colorado.edu/en/simulations/ohms-law
    provider: phet
    note: เพิ่มความต่างศักย์ V ขณะที่ความต้านทาน R คงเดิม กระแส I จะเพิ่มตาม จากนั้นเพิ่ม R ขณะที่ V คงเดิม กระแสจะลดลง ตัวอักษรในสมการ V = IR จะโตหรือเล็กลงตามค่าจริง
  - type: interactive
    title: กราฟกระแสกับความต่างศักย์ของตัวต้านทาน
    caption: แกนนอนคือความต่างศักย์ V (โวลต์) แกนตั้งคือกระแส I (แอมแปร์) จาก I = V/R กราฟเป็นเส้นตรงผ่านจุดกำเนิด ลองเพิ่ม R เส้นจะลาดน้อยลง แปลว่าที่ความต่างศักย์เท่ากัน ตัวต้านทานที่มากกว่าให้กระแสน้อยกว่า
    widget:
      kind: function-plot
      functions: ["\\frac{x}{R}"]
      sliders:
        - { name: R, min: 2, max: 20, step: 1, value: 6, label: ความต้านทาน R (Ω) }
      x: [0, 12]
      y: [0, 3]
glossary:
  - { term: กระแสไฟฟ้า, definition: "ปริมาณประจุที่เคลื่อนผ่านภาคตัดขวางของตัวนำในหนึ่งวินาที $I = Q/t$ หน่วยแอมแปร์ ($\\mathrm{A} = \\mathrm{C/s}$)" }
  - { term: ความต่างศักย์, definition: "พลังงานที่ประจุหนึ่งคูลอมบ์ได้รับหรือเสียไประหว่างสองจุดในวงจร หน่วยโวลต์ ($\\mathrm{V} = \\mathrm{J/C}$)" }
  - { term: ความต้านทาน, definition: "สมบัติของตัวนำที่ต้านการไหลของกระแส $R = V/I$ หน่วยโอห์ม ($\\Omega$)" }
  - { term: แอมมิเตอร์, definition: "เครื่องวัดกระแส ต่ออนุกรมกับส่วนของวงจรที่ต้องการวัด" }
  - { term: โวลต์มิเตอร์, definition: "เครื่องวัดความต่างศักย์ ต่อขนานคร่อมส่วนของวงจรที่ต้องการวัด" }
flashcards:
  - { front: "กฎของโอห์ม", back: "$V = IR$ ความต่างศักย์ (V) = กระแส (A) × ความต้านทาน (Ω)" }
  - { front: "ต่อแอมมิเตอร์และโวลต์มิเตอร์อย่างไร", back: "แอมมิเตอร์ต่ออนุกรม (กระแสไหลผ่าน) โวลต์มิเตอร์ต่อขนานคร่อมอุปกรณ์" }
  - { front: "กระแส $1\\ \\mathrm{A}$ หมายความว่าอย่างไร", back: "ประจุ $1\\ \\mathrm{C}$ เคลื่อนผ่านจุดหนึ่งในวงจรทุก $1\\ \\mathrm{s}$" }
  - { front: "$250\\ \\mathrm{mA}$ เท่ากับกี่แอมแปร์", back: "$0.25\\ \\mathrm{A}$ (หารด้วย 1000)" }
  - { front: "กราฟ $I$–$V$ ของหลอดไส้เป็นอย่างไร เพราะอะไร", back: "โค้งลาดลง เพราะไส้หลอดร้อนขึ้นเมื่อกระแสมาก ความต้านทาน $V/I$ จึงเพิ่มขึ้น" }
