id: computer.security.hashing-authentication
subject: computer
title: { th: ฟังก์ชันแฮช การเก็บรหัสผ่าน และการยืนยันข้อความ, en: "Hash functions, password storage and message authentication" }
summary: สมบัติของฟังก์ชันแฮชและการใช้ตรวจไฟล์ เก็บรหัสผ่านด้วยซอลต์และแฮชที่ช้าโดยตั้งใจ ยืนยันข้อความด้วย HMAC และหลักการของรหัส TOTP
difficulty: 5.5
minutes: 45
prerequisites: [computer.security.encryption, computer.programming.functions]
encompasses:
  - { id: computer.security.encryption, weight: 0.3 }
  - { id: computer.programming.functions, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: avalanche.svg
    alt: "ข้อความ hello กับค่า SHA-256 ที่เขียนเป็นเลขฐานสิบหกสองบรรทัด ถัดลงมาเป็นข้อความ hellp ที่ต่างกันตัวสุดท้ายตัวเดียว และค่า SHA-256 ที่ต่างจากบรรทัดแรกเกือบทุกตำแหน่ง"
    caption: "อินพุตต่างกันตัวเดียว ค่าแฮชต่างกันเกือบทั้งหมด"
  - type: worked-example
    title: ตรวจไฟล์ดาวน์โหลดด้วยค่าแฮชที่ประกาศไว้
    problem: "เว็บผู้ผลิตประกาศว่าไฟล์ติดตั้งมีค่า SHA-256 เป็น 2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824 เมื่อดาวน์โหลดไฟล์ที่มีเนื้อหา hello มาแล้ว จะตรวจอย่างไรว่าไฟล์ไม่ถูกแก้"
    steps:
      - text: "คำนวณ SHA-256 ของเนื้อหาไฟล์ที่ได้มา ด้วย hashlib.sha256(data).hexdigest()"
        why: "ฟังก์ชันแฮชรับข้อมูลได้ทุกขนาด จึงใช้กับไฟล์ทั้งไฟล์ได้"
      - text: "เปรียบเทียบผลกับค่าที่ประกาศทีละตัวอักษร เพราะค่าเต็มยาว 64 ตัวอักษร การดูแค่ไม่กี่ตัวแรกไม่พอ"
      - text: "ผลตรงกันทุกตัวอักษร จึงสรุปว่าเนื้อหาตรงกับไฟล์ที่ผู้ผลิตประกาศ"
        why: "ถ้ามีการแก้ไขแม้ตัวเดียว ค่าแฮชจะไม่ตรงตามผลถล่ม"
      - text: "ถ้าไม่ตรง ให้ดาวน์โหลดใหม่หรือไม่ใช้ไฟล์นั้น เพราะไม่รู้ว่าเนื้อหาถูกเปลี่ยนไปตรงไหน"
    answer: "ค่าแฮชตรงกับที่ประกาศ จึงใช้ไฟล์นี้ได้ ถ้าไม่ตรงต้องไม่ใช้ไฟล์"
  - { type: check, problem: computer.security.hashing-authentication.p001, prompt: "ลองคิดก่อนว่าสมบัติใดทำให้ค่าแฮชย้อนกลับได้ยาก" }
  - type: figure
    src: salt-storage.svg
    alt: "ตารางจัดเก็บสองแถว แถวแรกคือผู้ใช้ชื่อฝน ซอลต์ salt-A และแฮชขึ้นต้นด้วย c94a5845 แถวที่สองคือผู้ใช้ชื่อปาน ซอลต์ salt-B และแฮชขึ้นต้นด้วย 89eb0f79 รหัสผ่านทั้งสองเหมือนกันแต่ค่าที่เก็บต่างกัน"
    caption: "ซอลต์ต่างกันทำให้รหัสเดียวกันได้แฮชต่างกัน"
  - type: worked-example
    title: ตรวจว่าแท็ก HMAC ของข้อความตรงกันหรือไม่
    problem: "ผู้ส่งและผู้รับใช้กุญแจลับ K ร่วมกัน ผู้รับได้ข้อความกับแท็กมา จะตรวจอย่างไรว่าข้อความถูกต้อง"
    steps:
      - text: "ผู้รับนำข้อความที่ได้รับมาคำนวณ HMAC ด้วยกุญแจ K ของตนเอง"
        why: "ต้องใช้กุญแจลับ ผู้อื่นที่ไม่มี K คำนวณแท็กที่ถูกต้องไม่ได้"
      - text: "เทียบแท็กที่คำนวณได้กับแท็กที่แนบมาด้วยฟังก์ชันเทียบแบบเวลาคงที่"
        why: "การเทียบแบบทั่วไปที่หยุดเมื่อเจอความต่างแรกอาจเผยข้อมูลจากเวลาที่ใช้"
      - text: "ถ้าตรงกันจึงสรุปว่าข้อความไม่ถูกแก้และมาจากผู้ที่มี K"
        why: "ถ้าข้อความถูกแก้ แท็กเดิมจะไม่ตรงกับแท็กที่คำนวณใหม่"
    answer: "คำนวณ HMAC ใหม่แล้วเทียบแบบเวลาคงที่ ตรงกันจึงยอมรับข้อความ"
  - { type: check, problem: computer.security.hashing-authentication.p010, prompt: "ซอลต์ช่วยอะไรบ้าง ลองนึกถึงผู้ใช้สองคนที่มีรหัสเดียวกัน" }
  - type: figure
    src: hmac-verify.svg
    alt: "แผนภาพผู้ส่งมีข้อความกับกุญแจ K ส่งไป HMAC ของข้อความและกุญแจ ได้แท็กหนึ่งค่า ผู้รับมีข้อความและกุญแจ K เช่นกัน แล้วคำนวณแท็กใหม่และเทียบแบบเวลาคงที่"
    caption: "ต้องรู้กุญแจลับจึงคำนวณแท็กที่ถูกต้องได้"
glossary:
  - { term: ฟังก์ชันแฮช (hash function), definition: "ฟังก์ชันที่รับข้อมูลขนาดใดก็ได้แล้วให้ค่าขนาดคงที่ เช่น SHA-256 ให้ 256 บิต" }
  - { term: ค่าแฮช (digest), definition: "ผลลัพธ์ของฟังก์ชันแฮชที่ใช้แทนข้อมูลเดิมในการเปรียบเทียบหรือตรวจความครบถ้วน" }
  - { term: ซอลต์ (salt), definition: "ค่าสุ่มที่สร้างใหม่สำหรับแต่ละผู้ใช้ เก็บคู่กับแฮชของรหัสผ่านเพื่อให้รหัสเดียวกันได้ค่าต่างกัน" }
  - { term: PBKDF2, definition: "ฟังก์ชันสร้างคีย์จากรหัสผ่านที่แฮชซ้ำจำนวนรอบที่กำหนดร่วมกับซอลต์ ตาม RFC 8018" }
  - { term: HMAC, definition: "รหัสยืนยันข้อความที่รวมกุญแจลับกับฟังก์ชันแฮช ใช้ตรวจว่าข้อความไม่ถูกแก้และมาจากผู้มีกุญแจ" }
  - { term: TOTP, definition: "รหัสใช้ครั้งเดียวที่คำนวณจากกุญแจลับและเวลาปัจจุบัน เปลี่ยนทุกช่วงเวลาที่กำหนด (ค่าเริ่มต้น 30 วินาที)" }
flashcards:
  - { front: "สมบัติทางเดียวของฟังก์ชันแฮชหมายถึงอะไร", back: "จากค่าแฮชย้อนกลับไปหาข้อความเดิมได้ยากมากในทางปฏิบัติ" }
  - { front: "ทำไมรหัสผ่านไม่ควรแฮชด้วย SHA-256 ตรง ๆ", back: "เป็นฟังก์ชันที่เร็วเกินไปสำหรับการเก็บรหัสผ่าน ควรใช้ฟังก์ชันที่ช้าโดยตั้งใจและมีซอลต์" }
  - { front: "ซอลต์ช่วยอะไร", back: "ทำให้รหัสเดียวกันได้ค่าแฮชต่างกันระหว่างผู้ใช้ และใช้ตารางคำนวณล่วงหน้าร่วมกันไม่ได้" }
  - { front: "HMAC ต่างจากแฮชธรรมดาอย่างไร", back: "ต้องใช้กุญแจลับร่วมกันจึงคำนวณแท็กที่ถูกต้องได้" }
  - { front: "TOTP เปลี่ยนรหัสทุกกี่วินาทีโดยค่าเริ่มต้น", back: "30 วินาที (RFC 6238)" }
