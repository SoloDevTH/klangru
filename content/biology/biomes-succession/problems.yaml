problems:
  - id: biology.ecology.biomes-succession.p001
    topics: [biology.ecology.biomes-succession]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นการเปลี่ยนแปลงแทนที่แบบปฐมภูมิ"
    choices:
      - { id: a, text: "พืชเริ่มขึ้นบนลาวาที่เย็นตัวแล้วหลังภูเขาไฟระเบิด", correct: true }
      - { id: b, text: "หญ้าขึ้นในไร่ข้าวโพดที่ถูกทิ้งร้าง", feedback: "ไร่ร้างยังมีดินและเมล็ด จึงเป็นแบบทุติยภูมิ" }
      - { id: c, text: "ป่าฟื้นตัวหลังไฟป่า", feedback: "หลังไฟป่ายังมีดิน จึงเป็นแบบทุติยภูมิ" }
      - { id: d, text: "วัชพืชขึ้นในแปลงผักที่ไม่ได้ดูแล", feedback: "แปลงผักมีดินอยู่แล้ว จึงเป็นแบบทุติยภูมิ" }
    hints:
      - "แบบปฐมภูมิเริ่มจากพื้นที่ที่ไม่มีดินเลย"
      - "ข้อใดเริ่มจากหินเปล่า"
    solution: "ลาวาที่เย็นตัวเป็นหินเปล่า ไม่มีดินและสิ่งมีชีวิต การเปลี่ยนแปลงแทนที่บนลาวาจึงเป็นแบบปฐมภูมิ ข้ออื่นยังมีดินเหลือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.biomes-succession.p002
    topics: [biology.ecology.biomes-succession]
    difficulty: 1
    type: text
    stem: "สิ่งมีชีวิตที่เป็นการอยู่ร่วมกันของราและสาหร่าย และมักเป็นผู้บุกเบิกบนหินเปล่า เรียกว่าอะไร"
    accepted: ["ไลเคน", "lichen", "lichens"]
    misconceptions:
      - { match: "มอส", feedback: "มอสเข้ามาหลังจากมีดินชั้นบางแล้ว และไม่ใช่การอยู่ร่วมกันของราและสาหร่าย" }
      - { match: "เฟิน", feedback: "เฟินต้องการดินมากกว่า จึงเข้ามาทีหลัง" }
    hints:
      - "เป็นการอยู่ร่วมกันของสิ่งมีชีวิตสองกลุ่ม"
      - "พบเป็นคราบสีเทาเขียวหรือส้มบนหินและเปลือกไม้"
    solution: "ไลเคนเป็นการอยู่ร่วมกันของราและสาหร่ายหรือไซยาโนแบคทีเรีย ทนแห้งได้ดีและหลั่งกรดที่ช่วยผุกร่อนหิน จึงเป็นผู้บุกเบิกบนหินเปล่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.biomes-succession.p003
    topics: [biology.ecology.biomes-succession]
    difficulty: 1
    type: match
    stem: "จับคู่ไบโอมกับลักษณะเด่น"
    pairs:
      - { left: "ป่าดิบชื้นเขตร้อน", right: "ร้อนและฝนชุกตลอดปี ต้นไม้สูงหลายชั้น" }
      - { left: "ทะเลทราย", right: "ฝนน้อยมาก พืชอวบน้ำและใบลดรูป" }
      - { left: "ไทกา", right: "หนาวยาวนาน สนใบเข็ม" }
      - { left: "ทุนดรา", right: "หนาวจัด ไม่มีต้นไม้ใหญ่ มีมอสและไลเคน" }
      - { left: "สะวันนา", right: "ทุ่งหญ้าในเขตร้อนที่มีต้นไม้ขึ้นกระจาย" }
    hints:
      - "ไทกาและทุนดราอยู่ในเขตหนาวทั้งคู่ แต่ทุนดราหนาวกว่า"
      - "สะวันนาอยู่ในเขตร้อนที่ฝนน้อยกว่าป่า"
    solution: "ป่าดิบชื้น–ร้อนฝนชุก ทะเลทราย–ฝนน้อยมาก ไทกา–สนใบเข็ม ทุนดรา–ไม่มีต้นไม้ใหญ่ สะวันนา–ทุ่งหญ้ามีต้นไม้กระจาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.biomes-succession.p004
    topics: [biology.ecology.biomes-succession]
    difficulty: 2
    type: mcq
    stem: "ช่วงเดือนกุมภาพันธ์ถึงเมษายน ต้นไม้หลายชนิดในป่าเบญจพรรณของเขตรักษาพันธุ์สัตว์ป่าห้วยขาแข้งทิ้งใบจนป่าโปร่ง ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "เป็นการปรับตัวต่อฤดูแล้ง การทิ้งใบลดการคายน้ำเมื่อดินขาดน้ำ", correct: true }
      - { id: b, text: "อากาศหนาวจัดจนใบแข็งตาย", feedback: "ช่วงนั้นเป็นฤดูร้อนและแล้ง ไม่ใช่หนาวจัด" }
      - { id: c, text: "ต้นไม้เป็นโรคระบาดพร้อมกัน", feedback: "การทิ้งใบเกิดทุกปีในหลายชนิดพร้อมกันตามฤดู เป็นการปรับตัว ไม่ใช่โรค" }
      - { id: d, text: "สัตว์กินใบจนหมด", feedback: "สัตว์ไม่ได้กินใบจนทั้งป่าโปร่งทุกปีในฤดูเดียวกัน" }
    hints:
      - "ป่าเบญจพรรณเป็นป่าเขตร้อนผลัดใบตามฤดู"
      - "ช่วงนั้นฝนตกน้อยมาก"
    solution: "ภาคตะวันตกของไทยมีฤดูแล้งยาว ต้นไม้ในป่าผลัดใบทิ้งใบเพื่อลดการสูญเสียน้ำทางการคายน้ำ แล้วแตกใบใหม่เมื่อฝนมา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.biomes-succession.p005
    topics: [biology.ecology.biomes-succession]
    difficulty: 2
    type: order
    stem: "เรียงลำดับการเปลี่ยนแปลงแทนที่แบบปฐมภูมิบนเกาะที่เกิดจากภูเขาไฟ"
    items:
      - "หินลาวาเปล่า"
      - "ไลเคนเกาะบนหิน"
      - "มอสขึ้นบนดินชั้นบาง"
      - "หญ้าและเฟินขึ้น"
      - "ไม้พุ่มเติบโต"
      - "ป่าที่มีต้นไม้ใหญ่"
    hints:
      - "เริ่มจากไม่มีสิ่งมีชีวิต"
      - "ดินหนาขึ้นเรื่อย ๆ พืชที่ต้องการดินมากจึงเข้ามาทีหลัง"
    solution: "หินเปล่า → ไลเคน → มอส → หญ้าและเฟิน → ไม้พุ่ม → ป่า แต่ละกลุ่มเพิ่มดินและอินทรียวัตถุให้กลุ่มต่อไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.biomes-succession.p006
    topics: [biology.ecology.biomes-succession]
    difficulty: 2
    type: mcq
    stem: "จากแผนภาพไบโอม พื้นที่ที่มีอุณหภูมิเฉลี่ย 27 °C และฝน 4,000 มม. ต่อปี น่าจะเป็นไบโอมใด"
    figure: { src: biome-climate.svg, alt: "แผนภาพอย่างง่าย แกนนอนคือปริมาณฝนเฉลี่ยต่อปี 0 ถึง 4,500 มิลลิเมตร แกนตั้งคืออุณหภูมิเฉลี่ยต่อปี −15 ถึง 30 องศาเซลเซียส ฝนน้อยกว่า 400 มิลลิเมตรเป็นทะเลทราย อุณหภูมิ 20 ถึง 30 องศาแบ่งเป็นสะวันนา (ฝน 400 ถึง 1,500) ป่าเขตร้อนผลัดใบตามฤดู (ฝน 1,500 ถึง 2,500) และป่าดิบชื้นเขตร้อน (ฝนมากกว่า 2,500) อุณหภูมิ 5 ถึง 20 องศาเป็นทุ่งหญ้าเขตอบอุ่นและป่าผลัดใบเขตอบอุ่น อุณหภูมิ −5 ถึง 5 องศาเป็นไทกา และต่ำกว่า −5 องศาเป็นทุนดรา" }
    choices:
      - { id: a, text: "ป่าดิบชื้นเขตร้อน", correct: true }
      - { id: b, text: "สะวันนา", feedback: "สะวันนาร้อนแต่ฝนน้อยกว่ามาก (ราว 400–1,500 มม.)" }
      - { id: c, text: "ป่าผลัดใบเขตอบอุ่น", feedback: "อุณหภูมิ 27 °C สูงกว่าเขตอบอุ่น" }
      - { id: d, text: "ทะเลทราย", feedback: "ทะเลทรายมีฝนน้อยกว่าราว 400 มม. ต่อปี" }
    hints:
      - "หาตำแหน่ง 27 °C บนแกนตั้ง และ 4,000 มม. บนแกนนอน"
      - "จุดนั้นอยู่ในพื้นที่สีใด"
    solution: "อุณหภูมิ 27 °C และฝน 4,000 มม. อยู่ในเขตร้อนและฝนมากกว่า 2,500 มม. จึงเป็นป่าดิบชื้นเขตร้อน เช่น ป่าในจังหวัดระนองและนราธิวาสซึ่งฝนชุก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.biomes-succession.p007
    topics: [biology.ecology.biomes-succession]
    difficulty: 2
    type: mcq
    stem: "ป่าชายเลนที่ปากแม่น้ำบางปะกงเป็นไบโอมในน้ำแบบใด และปัจจัยใดสำคัญที่สุดต่อสิ่งมีชีวิตที่นั่น"
    choices:
      - { id: a, text: "น้ำกร่อย ความเค็มเปลี่ยนไปตามน้ำขึ้นน้ำลง", correct: true }
      - { id: b, text: "น้ำจืดที่ไหลเร็ว", feedback: "ปากแม่น้ำมีน้ำทะเลหนุน ความเค็มสูงกว่าน้ำจืด" }
      - { id: c, text: "ทะเลลึก ไม่มีแสงส่องถึง", feedback: "ป่าชายเลนอยู่ในน้ำตื้นชายฝั่งที่แสงส่องถึง" }
      - { id: d, text: "บึงน้ำนิ่ง", feedback: "ปากแม่น้ำมีน้ำขึ้นน้ำลงทุกวัน ไม่ใช่น้ำนิ่ง" }
    hints:
      - "ปากแม่น้ำเป็นที่ที่น้ำจืดพบน้ำทะเล"
      - "ความเค็มที่นั่นคงที่หรือเปลี่ยนไปมา"
    solution: "ปากแม่น้ำเป็นเขตน้ำกร่อย ความเค็มเปลี่ยนตามน้ำขึ้นน้ำลงและฤดูกาล พืชป่าชายเลนจึงมีการปรับตัว เช่น รากค้ำจุนและการขับเกลือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.biomes-succession.p008
    topics: [biology.ecology.biomes-succession]
    difficulty: 3
    type: numeric
    stem: "สมมติว่าเชิงเขาที่สูง 300 m มีอุณหภูมิเฉลี่ย 26 °C และอากาศเย็นลง 6 °C ทุก 1,000 m ยอดดอยอินทนนท์สูงราว 2,565 m จะมีอุณหภูมิเฉลี่ยประมาณกี่องศาเซลเซียส (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 12.4, unit: "°C", tolerance: 0.1 }
    misconceptions:
      - { match: 10.6, feedback: "ใช้ความสูง 2,565 m ทั้งหมด ต้องใช้ความต่างจากเชิงเขาคือ 2,565 − 300 m" }
      - { match: 39.6, feedback: "ยิ่งสูงอากาศยิ่งเย็น ต้องลบ ไม่ใช่บวก" }
    hints:
      - "หาความสูงที่เพิ่มขึ้นจากเชิงเขาก่อน"
      - "อุณหภูมิลดลง $6 \\times \\frac{\\text{ความสูงที่เพิ่ม}}{1000}$ องศา"
    solution: "สูงขึ้น $2{,}565 - 300 = 2{,}265$ m อุณหภูมิลด $6 \\times 2.265 = 13.59$ °C ยอดดอยจึงราว $26 - 13.59 \\approx 12.4$ °C อากาศเย็นแบบนี้ทำให้มีป่าดิบเขาที่มีมอสคลุม แม้อยู่ในเขตร้อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.biomes-succession.p009
    topics: [biology.ecology.biomes-succession]
    difficulty: 3
    type: mcq
    stem: "ทำไมการเปลี่ยนแปลงแทนที่แบบทุติยภูมิจึงมักเกิดเร็วกว่าแบบปฐมภูมิมาก"
    choices:
      - { id: a, text: "แบบทุติยภูมิมีดิน เมล็ด และรากเหลืออยู่ จึงไม่ต้องรอให้หินผุกร่อนเป็นดิน", correct: true }
      - { id: b, text: "แบบทุติยภูมิเกิดเฉพาะในเขตร้อนที่ฝนชุก", feedback: "แบบทุติยภูมิเกิดได้ทุกเขต สิ่งที่ทำให้เร็วคือดินที่เหลืออยู่" }
      - { id: c, text: "แบบทุติยภูมิไม่มีผู้บุกเบิก", feedback: "แบบทุติยภูมิมีผู้บุกเบิก เช่น หญ้าและวัชพืชที่โตเร็ว" }
      - { id: d, text: "แบบปฐมภูมิมีสัตว์มากินพืชที่ขึ้นใหม่หมด", feedback: "สาเหตุหลักที่ช้าคือต้องสร้างดินขึ้นใหม่" }
    hints:
      - "เปรียบเทียบจุดเริ่มต้นของทั้งสองแบบ"
      - "การเกิดดินจากหินใช้เวลานานเท่าใด"
    solution: "แบบปฐมภูมิต้องรอให้ไลเคนและการผุพังสร้างดินจากหิน ซึ่งใช้เวลานานมาก แบบทุติยภูมิมีดิน ธาตุอาหาร เมล็ด และรากเหลืออยู่ พืชจึงขึ้นได้ทันที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.biomes-succession.p010
    topics: [biology.ecology.biomes-succession]
    difficulty: 3
    type: mcq
    stem: "ทุ่งหญ้าบางแห่งในเขตรักษาพันธุ์สัตว์ป่าทุ่งใหญ่นเรศวรคงสภาพเป็นทุ่งหญ้ามานาน ทั้งที่ฝนพอให้ป่าเติบโตได้ ปัจจัยใดน่าจะอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "ไฟที่เกิดเป็นประจำทำลายต้นกล้าไม้ป่าก่อนที่จะโต การเปลี่ยนแปลงแทนที่จึงหยุดอยู่ที่ระยะทุ่งหญ้า", correct: true }
      - { id: b, text: "ทุ่งหญ้าคือสังคมสมบูรณ์ของทุกพื้นที่ในเขตร้อน", feedback: "ในเขตร้อนที่ฝนพอ ถ้าไม่มีการรบกวน การเปลี่ยนแปลงแทนที่มักไปถึงป่า" }
      - { id: c, text: "ดินไม่มีอินทรียวัตถุเลย", feedback: "ทุ่งหญ้ามีดินและอินทรียวัตถุ จึงไม่ใช่ข้อจำกัดหลัก" }
      - { id: d, text: "อุณหภูมิหนาวเกินไปสำหรับต้นไม้", feedback: "พื้นที่นี้อยู่ในเขตร้อน อุณหภูมิไม่ได้จำกัดต้นไม้" }
    hints:
      - "การรบกวนบางอย่างทำให้การเปลี่ยนแปลงแทนที่ไม่ก้าวต่อ"
      - "หญ้าแตกใหม่หลังไฟได้เร็วกว่าต้นกล้าไม้ป่า"
    solution: "ไฟที่เกิดซ้ำบ่อยทำลายต้นกล้าและไม้พุ่ม ขณะที่หญ้าแตกยอดใหม่จากรากได้เร็ว ทุ่งหญ้าจึงคงอยู่ การรบกวนเป็นประจำจึงกำหนดชนิดของสังคมได้ไม่แพ้ภูมิอากาศ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.biomes-succession.p011
    topics: [biology.ecology.biomes-succession]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นการเปลี่ยนแปลงแทนที่แบบทุติยภูมิ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ป่าฟื้นตัวหลังถูกตัดไม้ แต่ยังมีตอและดินเดิม", correct: true }
      - { id: b, text: "นาข้าวที่เลิกทำนาแล้วมีหญ้าและไม้พุ่มขึ้น", correct: true }
      - { id: c, text: "พืชขึ้นบนหน้าผาหินที่เพิ่งพังลงมาจนเห็นหินสด", feedback: "หินสดไม่มีดิน จึงเป็นแบบปฐมภูมิ" }
