  difficulty: 5
  type: mcq
  stem: >-
    อ่านย่อหน้านี้แล้วตอบคำถาม: "Some educators have proposed a four-day school week for secondary schools. Advocates argue that a shorter week reduces stress and absenteeism, and that teachers could use the free day for planning. Critics, however, warn that longer school days may tire younger students and leave working parents without childcare on the fifth day. Both sides make reasonable points, but neither has strong evidence yet. Given the evidence so far, the most sensible approach is to pilot the scheme in a few schools before making a national decision." จุดยืนของผู้เขียนคืออะไร
  choices:
  - id: a
    text: ควรนำไปใช้ทั่วประเทศทันที
    feedback: ผู้เขียนบอกว่าควรทดลองก่อน ไม่ได้เสนอให้ใช้ทั่วประเทศทันที
  - id: b
    text: ไม่ควรใช้เลยเพราะเด็กเหนื่อย
    feedback: ผู้เขียนบอกว่าการเหนื่อยเป็นข้อกังวล ไม่ได้สรุปว่าไม่ควรใช้เลย
  - id: c
    text: ควรทดลองในบางโรงเรียนก่อนตัดสินใจระดับประเทศ
    correct: true
    feedback: ถูก ผู้เขียนชั่งน้ำหนักทั้งสองฝ่ายและเสนอให้ทดลองก่อนตัดสิน
  - id: d
    text: ผู้เขียนไม่มีจุดยืนที่ชัดเจน
    feedback: ผู้เขียนบอกชัดว่าควรทำอย่างไรในประโยคสุดท้าย
  hints:
