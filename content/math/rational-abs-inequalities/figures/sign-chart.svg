<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" font-family="sans-serif"><title>เส้นจำนวนแสดงเครื่องหมายของ (5 − x)/(x − 1) จุดวิกฤต 1 (วงกลมโปร่ง เพราะตัวส่วนเป็นศูนย์) และ 5 (วงกลมทึบ เพราะเศษเป็นศูนย์และอสมการมีเครื่องหมายเท่ากับ) เครื่องหมายเป็นลบเมื่อ x < 1 บวกเมื่อ 1 < x < 5 และลบเมื่อ x > 5 คำตอบคือ 1 < x ≤ 5</title><defs><marker id="arr222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="600" height="230" fill="#fff"/><text x="20.0" y="40.0" font-size="14" text-anchor="start" dominant-baseline="middle" fill="#333">5 − x</text>
<text x="190.0" y="40.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e8449" font-weight="bold">+</text>
<text x="390.0" y="40.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e8449" font-weight="bold">+</text>
<text x="555.0" y="40.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#c0392b" font-weight="bold">−</text>
<text x="20.0" y="80.0" font-size="14" text-anchor="start" dominant-baseline="middle" fill="#333">x − 1</text>
<text x="190.0" y="80.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#c0392b" font-weight="bold">−</text>
<text x="390.0" y="80.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e8449" font-weight="bold">+</text>
<text x="555.0" y="80.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e8449" font-weight="bold">+</text>
<text x="20.0" y="120.0" font-size="14" text-anchor="start" dominant-baseline="middle" fill="#333" font-weight="bold">(5 − x)/(x − 1)</text>
<text x="190.0" y="120.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#c0392b" font-weight="bold">−</text>
<text x="390.0" y="120.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e8449" font-weight="bold">+</text>
<text x="555.0" y="120.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#c0392b" font-weight="bold">−</text>
