    stem: "ครูในโรงเรียนไทยตั้งกล้องแสงไว้ที่ 400 เท่า แล้วให้นักเรียนถ่ายภาพปลายรากกระเทียม ภาพมีเซลล์ 5 เซลล์เรียงต่อกันเป็นแถวยาว 50 mm เซลล์แต่ละเซลล์จริงยาว 40 μm กำลังขยายที่ได้จากการวัดภาพนี้เป็นกี่เท่า (ตอบเป็นจำนวนเท่า)"
