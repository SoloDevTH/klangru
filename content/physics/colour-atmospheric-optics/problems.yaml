    ai_assisted: true

  - id: physics.light.colour-atmospheric-optics.p015
    topics: [physics.light.colour-atmospheric-optics]
    difficulty: 5
    type: numeric
    stem: "ยอดของรุ้งปฐมภูมิ (ขอบสีแดง) อยู่ห่างจากจุดตรงข้ามดวงอาทิตย์ $42^\\circ$ ถ้าดวงอาทิตย์อยู่สูงจากขอบฟ้า $30^\\circ$ จุดตรงข้ามดวงอาทิตย์จะอยู่ใต้ขอบฟ้า $30^\\circ$ ยอดรุ้งจะอยู่สูงจากขอบฟ้ากี่องศา (ตอบในหน่วยองศา)"
    answer: { value: 12, tolerance: 0.1, unit: องศา }
    hints:
      - "เริ่มจากจุดตรงข้ามดวงอาทิตย์ที่ $-30^\\circ$ (ใต้ขอบฟ้า)"
      - "ยอดรุ้งอยู่สูงกว่าจุดนั้น $42^\\circ$"
    misconceptions:
      - { match: 72, feedback: "ดูเหมือนบวก 42 กับ 30 แต่จุดตรงข้ามดวงอาทิตย์อยู่ใต้ขอบฟ้า ต้องเริ่มจาก $-30^\\circ$" }
      - { match: 42, feedback: "ยอดรุ้งอยู่สูงจากขอบฟ้า $42^\\circ$ เฉพาะตอนดวงอาทิตย์อยู่ที่ขอบฟ้าพอดี ถ้าดวงอาทิตย์สูงขึ้น รุ้งจะต่ำลงเท่ากัน" }
    solution: "ยอดรุ้งสูง $= -30^\\circ + 42^\\circ = 12^\\circ$ เหนือขอบฟ้า ยิ่งดวงอาทิตย์สูง รุ้งยิ่งต่ำ ถ้าดวงอาทิตย์สูงเกิน $42^\\circ$ รุ้งจะอยู่ใต้ขอบฟ้าทั้งหมด"
