problems:
- id: thai.grammar.loanwords.p001
  topics:
  - thai.grammar.loanwords
  difficulty: 1
  type: mcq
  stem: คำว่า **ก๋วยเตี๋ยว** มาจากภาษาใด
  choices:
  - id: a
    text: ภาษาเขมร
    feedback: คำเขมรมักเป็นราชาศัพท์หรือขึ้นต้นด้วย บัง บำ
  - id: b
    text: ภาษาอังกฤษ
    feedback: คำอังกฤษเป็นคำทับศัพท์ เช่น เค้ก
  - id: c
    text: ภาษาจีน
    correct: true
    feedback: ถูก พจนานุกรมระบุ (จ.)
  - id: d
    text: ภาษาบาลี
    feedback: คำบาลีมักมาทางศาสนา
  hints:
  - เป็นชื่ออาหาร
  - อักษรกลางผันด้วยไม้จัตวา
  solution: '**ก๋วยเตี๋ยว** มาจาก **ภาษาจีน** (พจนานุกรมระบุ จ.)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.loanwords.p002
  topics:
  - thai.grammar.loanwords
  difficulty: 1
  type: match
  stem: จับคู่คำกับภาษาที่มา
  pairs:
  - left: ศึกษา
    right: สันสกฤต
  - left: ถนน
    right: เขมร
  - left: เต้าหู้
    right: จีน
  - left: ฟุตบอล
    right: อังกฤษ
  hints:
  - ศ เป็นลักษณะของคำสันสกฤต
  - ฟุตบอล ทับศัพท์จาก football
  solution: ศึกษา = สันสกฤต · ถนน = เขมร · เต้าหู้ = จีน · ฟุตบอล = อังกฤษ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.loanwords.p003
  topics:
  - thai.grammar.loanwords
  difficulty: 2
  type: mcq
  stem: คู่คำ **วิชา–วิทยา** มีความหมายว่าความรู้เหมือนกัน คำใดเป็นรูป **สันสกฤต**
  choices:
  - id: a
    text: วิทยา
    correct: true
    feedback: ถูก สันสกฤตมี ย ควบ (วิทฺยา) บาลีเป็น วิชฺชา
  - id: b
    text: วิชา
    feedback: เป็นรูปบาลี
  - id: c
    text: ทั้งสองคำเป็นสันสกฤต
    feedback: สองคำนี้เป็นคู่บาลีกับสันสกฤต
  - id: d
    text: ทั้งสองคำเป็นคำไทยแท้
    feedback: คำไทยแท้มักเป็นคำพยางค์เดียว
  hints:
  - สันสกฤตมักมีคำควบกล้ำมากกว่า
  - ดูพยัญชนะที่ซ้อนกันในคำ
  solution: '**วิทยา** เป็นรูปสันสกฤต **วิชา** เป็นรูปบาลี'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.loanwords.p004
  topics:
  - thai.grammar.loanwords
  difficulty: 2
  type: mcq
  stem: ดูเมนูในภาพ รายการใดมี **คำที่มาจากภาษาจีน** (เลือกทุกข้อที่ถูก)
  figure:
    src: menu.svg
    alt: เมนูสมมติของร้านป้าแดง ริมคลอง 8 รายการ ก๋วยเตี๋ยวต้มยำ 50 บาท เกี๊ยวน้ำ 45 บาท เกาเหลาเลือดหมู 50 บาท ข้าวผัดกะเพรา 55 บาท ส้มตำไทย 40 บาท ซาลาเปาไส้หมู 15 บาท ไอศกรีมกะทิ 25 บาท เค้กมะพร้าว 35 บาท
  multiple: true
  choices:
  - id: a
    text: ก๋วยเตี๋ยวต้มยำ
    correct: true
    feedback: ถูก ก๋วยเตี๋ยว (จ.)
  - id: b
    text: เกี๊ยวน้ำ
    correct: true
    feedback: ถูก เกี๊ยว (จ.)
  - id: c
    text: ซาลาเปาไส้หมู
    correct: true
    feedback: ถูก ซาลาเปา (จ.)
  - id: d
    text: ไอศกรีมกะทิ
    feedback: ไอศกรีม ทับศัพท์จากอังกฤษ ice-cream
  - id: e
    text: ข้าวผัดกะเพรา
    feedback: เป็นคำไทย
  hints:
  - คำจีนมักเป็นชื่ออาหารที่รับมาจากคนจีน
  - ไอศกรีม และ เค้ก มาจากภาษาใด
  solution: 'คำจีน: **ก๋วยเตี๋ยว เกี๊ยว ซาลาเปา** (และ เกาเหลา) ส่วนไอศกรีมและเค้กมาจากอังกฤษ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.loanwords.p005
  topics:
  - thai.grammar.loanwords
  difficulty: 2
  type: text
  stem: ศัพท์บัญญัติของคำว่า **telephone** คือคำใด
  accepted:
  - โทรศัพท์
  misconceptions:
  - match: เทเลโฟน
    feedback: เป็นการทับศัพท์ ไม่ใช่ศัพท์บัญญัติ
  hints:
  - เป็นคำที่ใช้ทุกวัน
  - โทร (ไกล) + ศัพท์ (เสียง)
  solution: '**โทรศัพท์** (โทร = ไกล ศัพท์ = เสียง)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.loanwords.p006
  topics:
  - thai.grammar.loanwords
  difficulty: 3
  type: mcq
  stem: ตาม **ลักษณะของคำ** คำใดน่าจะเป็น **คำสันสกฤต** มากที่สุด
  choices:
  - id: a
    text: กีฬา
    feedback: ใช้ ฬ เป็นลักษณะคำบาลี
  - id: b
    text: ศึกษา
    correct: true
    feedback: ถูก มี ศ และ ษ ซึ่งพบในคำสันสกฤต
  - id: c
    text: อัคคี
    feedback: ตัวสะกดตัวตาม ค ค เป็นลักษณะคำบาลี
  - id: d
    text: ขจี
    feedback: อักษรนำ ข จ เป็นคำเขมร
  hints:
  - สันสกฤตมี ศ ษ ฤ รร
  - บาลีใช้ ฬ และตัวสะกดตัวตามคู่กัน
  solution: '**ศึกษา** มี ศ ษ จึงเป็นคำสันสกฤต (บาลีคือ สิกขา)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.loanwords.p007
  topics:
  - thai.grammar.loanwords
  difficulty: 3
  type: mcq
  stem: คำใดเป็น **คำเขมร** (พจนานุกรมระบุ ข.)
  choices:
  - id: a
    text: บำเพ็ญ
    correct: true
    feedback: ถูก ขึ้นต้นด้วย บำ และสะกดด้วย ญ
  - id: b
    text: บัญชี
    feedback: ขึ้นต้นด้วย บั แต่พจนานุกรมระบุว่ามาจากสันสกฤต
  - id: c
    text: บะหมี่
    feedback: เป็นคำจีน
  - id: d
    text: บุรุษ
    feedback: มี ษ เป็นคำสันสกฤต
  hints:
  - คำเขมรมักขึ้นต้นด้วย บัง บำ บรร
  - ระวังคำที่ขึ้นต้นคล้ายกัน
  solution: '**บำเพ็ญ** เป็นคำเขมร ส่วน บัญชี (ส.) บะหมี่ (จ.) บุรุษ (ส.)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.loanwords.p008
  topics:
  - thai.grammar.loanwords
  difficulty: 3
  type: mcq
  stem: คำทับศัพท์ข้อใด **สะกดถูกต้อง**
  choices:
  - id: a
    text: อินเตอร์เน็ท
    feedback: ต้นพยางค์ใช้ ท ท้ายพยางค์ใช้ ต สลับกัน
  - id: b
    text: อินเตอร์เน็ต
    feedback: รูปที่พบบ่อยแต่ผิดหลักเกณฑ์ ter ต้นพยางค์ใช้ ท
  - id: c
    text: อินเทอร์เนต
    feedback: ขาดไม้ไต่คู้ ออกเสียงเป็นสระยาว
  - id: d
    text: อินเทอร์เน็ต
    correct: true
    feedback: ถูก t ต้นพยางค์ใช้ ท
  hints:
  - t ต้นพยางค์ใช้ ท ท้ายพยางค์ใช้ ต
  - net เป็นเสียงสระสั้น
  solution: '**อินเทอร์เน็ต** (ศัพท์บัญญัติของ internet)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.loanwords.p009
  topics:
  - thai.grammar.loanwords
  difficulty: 3
  type: numeric
  stem: ดูประกาศในภาพ มีคำทับศัพท์ที่ **สะกดผิด** กี่คำ
  figure:
    src: camp-notice.svg
    alt: ประกาศสมมติที่นักเรียนเขียน ชมรมคอมพิวเตอร์ชวนน้องเข้าค่าย มี 6 ข้อ เรียนใช้อินเตอร์เน็ตอย่างปลอดภัย · ฝึกถ่ายภาพดิจิตอลและทำอินโฟกราฟิก · แข่งเกมส์ตอบคำถามชิงรางวัล · พักกินเค้กและคุกกี้ · รับสมัครทางเว็บไซต์ของชมรม · แจกไอศครีมทุกคนในวันสุดท้าย
  answer:
    value: 4
    unit: คำ
  misconceptions:
  - match: 3
    feedback: อาจลืม เกมส์ ซึ่งไม่ต้องเติม ส์
  - match: 5
    feedback: อินโฟกราฟิก เว็บไซต์ เค้ก คุกกี้ สะกดถูก
  hints:
  - ตรวจทีละคำ อินเตอร์เน็ต ดิจิตอล เกมส์ ไอศครีม
  - คำที่ถูกคือ อินเทอร์เน็ต ดิจิทัล เกม ไอศกรีม
  solution: 'ผิด 4 คำ: อินเตอร์เน็ต → **อินเทอร์เน็ต** · ดิจิตอล → **ดิจิทัล** · เกมส์ → **เกม** · ไอศครีม → **ไอศกรีม**'
  license: CC-BY-SA-4.0
  ai_assisted: true
