topic: engineering.safety.risk-assessment
rows:
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.12"], coverage: partial, note: "สอนการประเมินความเสี่ยง ลำดับชั้นการควบคุม และการวิเคราะห์อันตราย (JSA What-If HAZOP) ยังไม่ครอบคลุมระบบการจัดการความปลอดภัยทั้งระบบ เช่น นโยบาย การตรวจประเมิน และการสอบสวนอุบัติเหตุ" }
  - { framework: th-coe-engineering-basics, indicators: ["CHE-3.11"], coverage: partial, note: "สอนความปลอดภัยของกระบวนการด้วย HAZOP ชั้นการป้องกัน (LOPA) และ PFD ยังไม่สอนการออกแบบอุปกรณ์ระบายความดันหรือระบบความปลอดภัยเฉพาะโรงงานเคมี และไม่ได้เน้นความยั่งยืนของอุตสาหกรรม" }
  - { framework: th-coe-engineering-basics, indicators: ["IE-3.2"], coverage: partial, note: "สอนการประเมินความเสี่ยงในอุตสาหกรรมและการป้องกันอัคคีภัยเบื้องต้น ส่วนการออกแบบระบบงานและการยศาสตร์อยู่ที่ engineering.industrial.work-study-ergonomics ยังไม่สอนระบบดับเพลิงเชิงระบบและการจัดการกากอุตสาหกรรม น้ำเสีย และมลพิษทางอากาศ" }
  - { framework: th-coe-engineering-basics, indicators: ["ME-2.5"], coverage: partial, note: "สอนด้านความปลอดภัยของกลุ่ม ME-2.5 (การประเมินความเสี่ยงและลำดับการควบคุม) ส่วนสิ่งแวดล้อมและความยั่งยืนอยู่ที่หัวข้ออื่น" }
  - { framework: th-coe-engineering-basics, indicators: ["MET-2.10"], coverage: partial, note: "สอนการจัดการความปลอดภัยเชิงระบบและกรอบกฎหมายขั้นต้น ส่วนอาชีวอนามัย สิ่งแวดล้อม และการพัฒนาที่ยั่งยืนอยู่ที่หัวข้ออื่น" }
  - { framework: th-coe-engineering-basics, indicators: ["MIN-2.7"], coverage: partial, note: "สอนการจัดการความปลอดภัยและการประเมินความเสี่ยงทั่วไป ยังไม่ครอบคลุมบริบทเหมืองแร่และการประเมินผลกระทบจากการสำรวจแร่ (ดู engineering.environmental.eia)" }
  - { framework: th-coe-engineering-basics, indicators: ["ME-3.4"], coverage: partial, note: "สอนหลักการป้องกันอัคคีภัยเบื้องต้น (สามเหลี่ยมไฟ) เท่านั้น ยังไม่สอนระบบป้องกันอัคคีภัยเชิงวิศวกรรมและการคำนวณการออกแบบ" }
  - { framework: abet-eac, indicators: ["Chemical 1.c"], coverage: partial, note: "สอนการประยุกต์การวิเคราะห์อันตรายของกระบวนการ (HAZOP ชั้นการป้องกัน) ยังไม่สอนการออกแบบและควบคุมกระบวนการเคมีแบบเต็มรูปแบบ" }
