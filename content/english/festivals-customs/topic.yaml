id: english.culture.festivals-customs
subject: english
title: { th: "เทศกาล วันสำคัญ และวิถีชีวิตของเจ้าของภาษา", en: "Festivals, special days and ways of life" }
summary: คำศัพท์และข้อมูลเทศกาลและวันสำคัญของประเทศที่ใช้ภาษาอังกฤษ ความต่างระหว่างประเทศ วิถีชีวิต และการเทียบกับเทศกาลไทย
difficulty: 2
minutes: 30
prerequisites: [english.vocabulary.self-family-numbers]
encompasses:
  - { id: english.vocabulary.self-family-numbers, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: festival-calendar.svg
    alt: "ตารางปฏิทินรายเดือน คอลัมน์ประเทศที่ใช้ภาษาอังกฤษ: มกราคม New Year's Day (1) และ Australia Day (26 ออสเตรเลีย) กุมภาพันธ์ Valentine's Day (14) มีนาคม St Patrick's Day (17) และ Mothering Sunday (UK วันเปลี่ยนทุกปี) เมษายน Easter (วันเปลี่ยนทุกปี บางปีอยู่ปลายมีนาคม) พฤษภาคม Mother's Day (US CA AU NZ) มิถุนายน Father's Day (US UK CA) กรกฎาคม Canada Day (1) และ Independence Day (4 สหรัฐฯ) กันยายน Father's Day (AU NZ) ตุลาคม Thanksgiving (แคนาดา) และ Halloween (31) พฤศจิกายน Bonfire Night (5 UK) และ Thanksgiving (สหรัฐฯ) ธันวาคม Christmas Eve (24) Christmas Day (25) Boxing Day (26) คอลัมน์ประเทศไทย: วันขึ้นปีใหม่ 1 มกราคม สงกรานต์ 13–15 เมษายน วันแม่ 12 สิงหาคม ลอยกระทงมักเป็นพฤศจิกายน วันพ่อ 5 ธันวาคม"
    caption: "เทศกาลและวันสำคัญตลอดปี ดอกจัน (*) คือวันที่เปลี่ยนทุกปี"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.culture.festivals-customs.p005, prompt: "ทำไมคริสต์มาสในออสเตรเลียไม่หนาว" }
  - type: worked-example
    title: เขียนการ์ดอวยพรวันเกิด
    problem: "เขียนการ์ดวันเกิดถึงเพื่อนชื่อ Sam ที่อายุครบ 12 ปี จากผู้ส่งชื่อ Nam"
    steps:
      - text: "ขึ้นต้นด้วยชื่อผู้รับ: *Dear Sam,*"
      - text: "คำอวยพร: *Happy 12th birthday!*"
        why: "อายุใช้เลขลำดับที่ 12th (twelfth) ไม่ใช่ 12"
      - text: "เพิ่มคำอวยพรอีกหนึ่งประโยค: *Have a great day and eat lots of cake!*"
      - text: "ลงท้ายและชื่อผู้ส่ง: *Best wishes, Nam* (เพื่อนสนิทหรือครอบครัวใช้ *Love, Nam*)"
    answer: "*Dear Sam, Happy 12th birthday! Have a great day and eat lots of cake! Best wishes, Nam*"
  - { type: check, problem: english.culture.festivals-customs.p010, prompt: "ประเทศไหนฉลอง Thanksgiving" }
glossary:
  - { term: festival, definition: "เทศกาล งานฉลองที่จัดเป็นประจำ" }
  - { term: public holiday, definition: "วันหยุดราชการ (อเมริกันมักเรียก national holiday หรือ federal holiday)" }
  - { term: trick or treat, definition: "ประเพณีวัน Halloween เด็กแต่งชุดเคาะประตูบ้านขอขนม" }
  - { term: Boxing Day, definition: "26 ธันวาคม วันหยุดในสหราชอาณาจักร ออสเตรเลีย นิวซีแลนด์ และบางส่วนของแคนาดา" }
  - { term: custom, definition: "ขนบธรรมเนียม สิ่งที่คนในสังคมทำกันจนเป็นธรรมเนียม" }
flashcards:
  - { front: "อวยพรคริสต์มาส", back: "Merry Christmas! (ตอบ: Merry Christmas! / You too!)" }
  - { front: "Halloween วันที่", back: "31 October" }
  - { front: "Thanksgiving สหรัฐฯ / แคนาดา", back: "วันพฤหัสบดีที่ 4 ของ พ.ย. / วันจันทร์ที่ 2 ของ ต.ค." }
  - { front: "คริสต์มาสในออสเตรเลียเป็นฤดูอะไร", back: "summer (ฤดูร้อน) เพราะอยู่ซีกโลกใต้" }
  - { front: "on / at / in กับวันเวลาเทศกาล", back: "on 25 December · at Christmas · in December" }
