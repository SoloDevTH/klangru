<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 370" width="840" height="370" font-family="sans-serif" font-size="15">
  <title>ลำดับการทำงานของโครงงานกล้วยตาก ลูกค้าสแกน QR บนถุง เปิดหน้าเว็บเล่าเรื่องและแบบฟอร์มสั่งซื้อ คำสั่งซื้อเข้าตารางคำนวณที่สรุปยอดและกราฟ กลุ่มแม่บ้านดูยอดบนแท็บเล็ตแล้วแพ็กส่ง ผลการวิเคราะห์ย้อนกลับไปปรับสินค้าและสื่อ</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect x="0" y="0" width="840" height="370" fill="#ffffff"/>
  <text x="420.0" y="40.0" font-size="19" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">รวมหลายแอปและหลายอุปกรณ์ให้ทำงานต่อกัน</text>
  <rect x="20.0" y="90.0" width="170.0" height="120.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="105.0" y="128.0" font-size="17" text-anchor="middle" fill="#1d4ed8" font-weight="bold" xml:space="preserve">ลูกค้าสแกน QR</text>
  <text x="105.0" y="156.0" font-size="15" text-anchor="middle" fill="#111827" xml:space="preserve">บนถุงกล้วยตาก</text>
  <text x="105.0" y="190.0" font-size="13" text-anchor="middle" fill="#4b5563" xml:space="preserve">โทรศัพท์ของลูกค้า</text>
  <line x1="194.0" y1="150.0" x2="226.0" y2="150.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="230.0" y="90.0" width="170.0" height="120.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="315.0" y="128.0" font-size="17" text-anchor="middle" fill="#b45309" font-weight="bold" xml:space="preserve">หน้าเว็บเล่าเรื่อง</text>
  <text x="315.0" y="156.0" font-size="15" text-anchor="middle" fill="#111827" xml:space="preserve">+ แบบฟอร์มสั่งซื้อ</text>
  <text x="315.0" y="190.0" font-size="13" text-anchor="middle" fill="#4b5563" xml:space="preserve">สื่อดิจิทัล + IT</text>
  <line x1="404.0" y1="150.0" x2="436.0" y2="150.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="440.0" y="90.0" width="170.0" height="120.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="525.0" y="128.0" font-size="17" text-anchor="middle" fill="#15803d" font-weight="bold" xml:space="preserve">ตารางคำนวณ</text>
  <text x="525.0" y="156.0" font-size="15" text-anchor="middle" fill="#111827" xml:space="preserve">สรุปยอด กำไร กราฟ</text>
  <text x="525.0" y="190.0" font-size="13" text-anchor="middle" fill="#4b5563" xml:space="preserve">สูตร/โปรแกรมสรุปยอด</text>
  <line x1="614.0" y1="150.0" x2="646.0" y2="150.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="650.0" y="90.0" width="170.0" height="120.0" rx="6" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="735.0" y="128.0" font-size="17" text-anchor="middle" fill="#be185d" font-weight="bold" xml:space="preserve">กลุ่มแม่บ้าน</text>
  <text x="735.0" y="156.0" font-size="15" text-anchor="middle" fill="#111827" xml:space="preserve">ดูยอด แพ็ก ส่งของ</text>
  <text x="735.0" y="190.0" font-size="13" text-anchor="middle" fill="#4b5563" xml:space="preserve">แท็บเล็ตของกลุ่ม</text>
  <polyline points="525.0,214.0 525.0,290.0 105.0,290.0 105.0,220.0" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="99.0,224 111.0,224 105.0,214" fill="#7c3aed"/>
  <text x="315.0" y="278.0" font-size="15" text-anchor="middle" fill="#7c3aed" font-weight="bold" xml:space="preserve">วิเคราะห์ข้อมูล → ปรับรสชาติ ราคา ภาพ และข้อความ</text>
  <text x="315.0" y="316.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">แล้ววัดผลซ้ำกับลูกค้าจริง (วนรอบ)</text>
  <text x="420.0" y="355.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">ข้อมูลในภาพเป็นตัวอย่างสมมติ</text>
</svg>
