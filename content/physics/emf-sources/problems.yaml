problems:
  - id: physics.electricity.emf-sources.p001
    topics: [physics.electricity.emf-sources]
    difficulty: 1
    type: mcq
    stem: "ถ่านไฟฉายเขียนว่า 1.5 V ตัวเลขนี้คืออีเอ็มเอฟของถ่าน อีเอ็มเอฟหมายถึงข้อใด"
    choices:
      - { id: a, text: "พลังงานไฟฟ้าที่ถ่านให้แก่ประจุ 1 คูลอมบ์ที่เคลื่อนผ่าน", correct: true }
      - { id: b, text: "แรงที่ถ่านใช้ผลักอิเล็กตรอน มีหน่วยนิวตัน", feedback: "แม้ชื่อเต็มคือแรงเคลื่อนไฟฟ้า แต่อีเอ็มเอฟไม่ใช่แรง หน่วยคือจูลต่อคูลอมบ์หรือโวลต์" }
      - { id: c, text: "ปริมาณประจุที่ถ่านเก็บไว้ทั้งหมด", feedback: "ปริมาณประจุที่ถ่านจ่ายได้บอกด้วยหน่วย mAh บนถ่านชาร์จ ไม่ใช่โวลต์" }
    hints:
      - "หน่วยโวลต์เท่ากับจูลต่อคูลอมบ์"
      - "อีเอ็มเอฟบอกว่าแหล่งกำเนิดให้พลังงานแก่ประจุเท่าใด"
    solution: "อีเอ็มเอฟคือพลังงานไฟฟ้าที่แหล่งกำเนิดให้แก่ประจุหนึ่งคูลอมบ์ ถ่าน 1.5 V ให้พลังงาน 1.5 J ต่อประจุ 1 C"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.emf-sources.p002
    topics: [physics.electricity.emf-sources]
    difficulty: 1
    type: match
    stem: "จับคู่แหล่งพลังงานทดแทนกับวิธีเปลี่ยนเป็นพลังงานไฟฟ้า"
    pairs:
      - { left: "แสงอาทิตย์", right: "เซลล์สุริยะเปลี่ยนแสงเป็นไฟฟ้าโดยตรง" }
      - { left: "ลม", right: "ใบกังหันหมุนเครื่องกำเนิดไฟฟ้า" }
      - { left: "น้ำในเขื่อน", right: "น้ำไหลผ่านกังหันน้ำที่ต่อกับเครื่องกำเนิดไฟฟ้า" }
      - { left: "แกลบและชานอ้อย", right: "เผาให้ความร้อนต้มน้ำเป็นไอไปหมุนกังหัน" }
    hints:
      - "แหล่งใดไม่ต้องหมุนเครื่องกำเนิดไฟฟ้า"
      - "ชีวมวลให้พลังงานในรูปความร้อนเมื่อเผา"
    solution: "เซลล์สุริยะเปลี่ยนแสงเป็นไฟฟ้าโดยตรง ส่วนลม น้ำ และชีวมวลล้วนหมุนกังหันที่ต่อกับเครื่องกำเนิดไฟฟ้า ชีวมวลต้องเผาเพื่อผลิตไอน้ำก่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.emf-sources.p003
    topics: [physics.electricity.emf-sources]
    difficulty: 2
    type: numeric
    stem: "แบตเตอรี่อีเอ็มเอฟ $12\\ \\mathrm{V}$ ความต้านทานภายใน $0.5\\ \\Omega$ ต่อกับตัวต้านทาน $5.5\\ \\Omega$ กระแสในวงจรเป็นกี่แอมแปร์"
    answer: { value: 2, tolerance: 0.02, unit: A }
    misconceptions:
      - { match: 2.18, feedback: "ลืมความต้านทานภายใน กระแสต้องผ่านทั้ง $R$ และ $r$ จึงใช้ $R + r$" }
      - { match: 24, feedback: "ใช้แค่ความต้านทานภายใน ต้องรวม $R + r$" }
    hints:
      - "ความต้านทานภายในต่ออนุกรมกับตัวต้านทานภายนอก"
      - "$I = \\dfrac{E}{R + r}$"
    solution: "$I = \\dfrac{12}{5.5 + 0.5} = \\dfrac{12}{6.0} = 2.0\\ \\mathrm{A}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.emf-sources.p004
    topics: [physics.electricity.emf-sources]
    difficulty: 2
    type: numeric
    stem: "ถ่านไฟฉายอีเอ็มเอฟ $1.5\\ \\mathrm{V}$ ความต้านทานภายใน $0.2\\ \\Omega$ จ่ายกระแส $0.5\\ \\mathrm{A}$ ให้หลอดไฟ ความต่างศักย์ขั้วของถ่านเป็นกี่โวลต์"
    answer: { value: 1.4, tolerance: 0.01, unit: V }
    misconceptions:
      - { match: 1.6, feedback: "บวก $Ir$ ใช้ได้เมื่ออัดประจุให้ถ่าน ขณะถ่านจ่ายกระแส แรงดันขั้วต้องน้อยกว่าอีเอ็มเอฟ" }
      - { match: 1.5, feedback: "แรงดันขั้วเท่ากับอีเอ็มเอฟเฉพาะเมื่อไม่มีกระแส ข้อนี้มีกระแส 0.5 A" }
    hints:
      - "มีแรงดันส่วนหนึ่งหายไปในความต้านทานภายใน"
      - "$V = E - Ir$"
    solution: "$V = 1.5 - (0.5)(0.2) = 1.5 - 0.1 = 1.4\\ \\mathrm{V}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.emf-sources.p005
    topics: [physics.electricity.emf-sources]
    difficulty: 2
    type: numeric
    stem: "ถ่านเหมือนกัน 3 ก้อน แต่ละก้อนมีอีเอ็มเอฟ $1.5\\ \\mathrm{V}$ ต่อแบบขนาน อีเอ็มเอฟรวมเป็นกี่โวลต์"
    answer: { value: 1.5, tolerance: 0.01, unit: V }
    misconceptions:
      - { match: 4.5, feedback: "บวกอีเอ็มเอฟใช้กับการต่ออนุกรม ต่อขนานแล้วอีเอ็มเอฟเท่ากับก้อนเดียว" }
      - { match: 0.5, feedback: "หารด้วยจำนวนก้อนใช้กับความต้านทานภายใน ไม่ใช่อีเอ็มเอฟ" }
    hints:
      - "การต่อขนานคือขั้วบวกต่อรวมกัน ขั้วลบต่อรวมกัน"
      - "ความต่างศักย์คร่อมสิ่งที่ต่อขนานกันเท่ากัน"
    solution: "เซลล์เหมือนกันต่อขนาน อีเอ็มเอฟรวมเท่ากับก้อนเดียว คือ $1.5\\ \\mathrm{V}$ แต่ความต้านทานภายในลดเหลือหนึ่งในสาม จ่ายกระแสได้มากขึ้นและนานขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.emf-sources.p006
    topics: [physics.electricity.emf-sources]
    difficulty: 3
    type: numeric
    stem: "ต่อถ่าน 4 ก้อนแบบอนุกรม แต่ละก้อนมีอีเอ็มเอฟ $1.5\\ \\mathrm{V}$ และความต้านทานภายใน $0.25\\ \\Omega$ กับหลอดไฟความต้านทาน $5.0\\ \\Omega$ กระแสในวงจรเป็นกี่แอมแปร์"
    answer: { value: 1, tolerance: 0.01, unit: A }
    misconceptions:
      - { match: 1.2, feedback: "ลืมความต้านทานภายในรวม $4 \\times 0.25 = 1.0\\ \\Omega$" }
      - { match: 1.143, feedback: "ใช้ความต้านทานภายในของถ่านก้อนเดียว ต่ออนุกรมต้องรวมความต้านทานภายในทุกก้อน" }
    hints:
      - "ต่ออนุกรม อีเอ็มเอฟรวมและความต้านทานภายในรวมเป็นผลบวก"
      - "$I = \\dfrac{E_\\text{รวม}}{R + r_\\text{รวม}}$"
    solution: "$E_\\text{รวม} = 6.0\\ \\mathrm{V}$, $r_\\text{รวม} = 1.0\\ \\Omega$, $I = \\dfrac{6.0}{5.0 + 1.0} = 1.0\\ \\mathrm{A}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.emf-sources.p007
    topics: [physics.electricity.emf-sources]
    difficulty: 3
    type: numeric
    stem: "วัดคร่อมขั้วแบตเตอรี่ขณะยังไม่ต่อวงจรได้ $9.0\\ \\mathrm{V}$ เมื่อต่อกับตัวต้านทาน $4.0\\ \\Omega$ วัดคร่อมขั้วได้ $8.0\\ \\mathrm{V}$ ความต้านทานภายในของแบตเตอรี่เป็นกี่โอห์ม"
    answer: { value: 0.5, tolerance: 0.01, unit: Ω }
    misconceptions:
      - { match: 0.25, feedback: "หารแรงดันที่หายไป $1.0\\ \\mathrm{V}$ ด้วย $R$ ต้องหารด้วยกระแส $I = \\dfrac{8.0}{4.0} = 2.0\\ \\mathrm{A}$" }
      - { match: 4.5, feedback: "หารอีเอ็มเอฟด้วยกระแสได้ความต้านทานรวม $R + r$ ต้องลบ $R$ ออกก่อน" }
    hints:
      - "ขณะไม่ต่อวงจร ค่าที่อ่านได้คืออีเอ็มเอฟ"
      - "หากระแสจาก $I = V/R$ แล้วใช้ $E - V = Ir$"
    solution: "$E = 9.0\\ \\mathrm{V}$, $I = \\dfrac{8.0}{4.0} = 2.0\\ \\mathrm{A}$, $r = \\dfrac{E - V}{I} = \\dfrac{9.0 - 8.0}{2.0} = 0.50\\ \\Omega$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.emf-sources.p008
    topics: [physics.electricity.emf-sources]
    difficulty: 3
    type: mcq
    stem: "เปิดไฟหน้ารถไว้แล้วสตาร์ตเครื่องยนต์ ไฟหน้าหรี่ลงชั่วครู่ เหตุผลใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "มอเตอร์สตาร์ตดึงกระแสมาก แรงดันตกคร่อมความต้านทานภายใน Ir จึงมาก แรงดันขั้วแบตเตอรี่ลดลง", correct: true }
      - { id: b, text: "อีเอ็มเอฟของแบตเตอรี่ลดลงเพราะประจุหมดทันที", feedback: "อีเอ็มเอฟแทบไม่เปลี่ยนในเวลาสั้น ๆ ไฟหน้ากลับมาสว่างทันทีเมื่อหยุดสตาร์ต แสดงว่าเกิดจากกระแสชั่วขณะ" }
      - { id: c, text: "มอเตอร์สตาร์ตต่ออนุกรมกับไฟหน้า จึงแบ่งแรงดันไป", feedback: "อุปกรณ์ในรถต่อขนานกับแบตเตอรี่ ไฟหน้าหรี่เพราะแรงดันขั้วแบตเตอรี่ลดลง" }
    hints:
      - "มอเตอร์สตาร์ตต้องการกระแสมากเพียงใด"
      - "$V = E - Ir$ เมื่อ $I$ มาก $V$ เป็นอย่างไร"
    solution: "มอเตอร์สตาร์ตดึงกระแสหลายร้อยแอมแปร์ แม้ความต้านทานภายในจะน้อย แต่ $Ir$ ก็มาก แรงดันขั้ว $V = E - Ir$ จึงลดลงชั่วคราว ไฟหน้าซึ่งต่อขนานกับแบตเตอรี่ได้แรงดันน้อยลงจึงหรี่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.emf-sources.p009
    topics: [physics.electricity.emf-sources]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการทดลองหาอีเอ็มเอฟและความต้านทานภายในของแบตเตอรี่"
    items:
      - "ต่อแบตเตอรี่อนุกรมกับแอมมิเตอร์และตัวต้านทานปรับค่าได้ และต่อโวลต์มิเตอร์คร่อมขั้วแบตเตอรี่"
      - "ปรับตัวต้านทานหลายค่า บันทึกความต่างศักย์ขั้ว V และกระแส I ทุกครั้ง"
      - "เขียนกราฟ V แกนตั้งกับ I แกนนอน แล้วลากเส้นตรงที่เหมาะสมที่สุด"
      - "อ่านจุดตัดแกน V เป็นอีเอ็มเอฟ และหาความชันของเส้นตรง"
      - "สรุปว่าความต้านทานภายในเท่ากับขนาดของความชัน"
    hints:
      - "ต้องมีข้อมูลหลายคู่ก่อนจึงเขียนกราฟได้"
      - "อีเอ็มเอฟและความต้านทานภายในอ่านจากกราฟ"
    solution: "ต่อวงจร → เก็บข้อมูล V และ I หลายค่า → เขียนกราฟ → อ่านจุดตัดแกนและความชัน → r = |ความชัน|"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.emf-sources.p010
    topics: [physics.electricity.emf-sources]
    difficulty: 4
    type: numeric
    stem: "นักเรียนทดลองวัดความต่างศักย์ขั้วกับกระแสของแบตเตอรี่ก้อนหนึ่ง ได้กราฟดังภาพ ความต้านทานภายในของแบตเตอรี่เป็นกี่โอห์ม"
    figure: { src: p-vi-graph.svg, alt: "กราฟเส้นตรงลาดลง แกนนอนเป็นกระแส 0 ถึง 2 แอมแปร์ แกนตั้งเป็นความต่างศักย์ขั้ว 0 ถึง 6 โวลต์ เส้นเริ่มที่ 6.0 V เมื่อกระแสเป็นศูนย์ ผ่านจุดข้อมูล (0.5 A, 5.7 V) (1.0 A, 5.4 V) (1.5 A, 5.1 V) และ (2.0 A, 4.8 V)" }
    answer: { value: 0.6, tolerance: 0.01, unit: Ω }
    misconceptions:
      - { match: 2.4, feedback: "หาร V ด้วย I ที่จุดหนึ่ง ได้ความต้านทานภายนอก $R$ ไม่ใช่ $r$ ความต้านทานภายในคือขนาดของความชันของกราฟ" }
      - { match: 3, feedback: "หารอีเอ็มเอฟด้วยกระแส $2.0\\ \\mathrm{A}$ ได้ $R + r$ ไม่ใช่ $r$" }
    hints:
      - "กราฟ $V = E - rI$ ความชันคือ $-r$"
      - "ความชัน = $\\dfrac{4.8 - 6.0}{2.0 - 0}$"
    solution: "ความชัน $= \\dfrac{4.8 - 6.0}{2.0 - 0} = -0.60\\ \\mathrm{V/A}$ ดังนั้น $r = 0.60\\ \\Omega$ และอีเอ็มเอฟ $= 6.0\\ \\mathrm{V}$ จากจุดตัดแกน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.emf-sources.p011
    topics: [physics.electricity.emf-sources]
    difficulty: 4
    type: numeric
    stem: "แบตเตอรี่อีเอ็มเอฟ $12\\ \\mathrm{V}$ ความต้านทานภายใน $1.0\\ \\Omega$ จ่ายไฟให้ตัวต้านทาน $5.0\\ \\Omega$ ร้อยละของกำลังที่แบตเตอรี่ผลิตซึ่งส่งถึงตัวต้านทานเป็นเท่าใด (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 83.3, tolerance: 0.2, unit: "%" }
    misconceptions:
      - { match: 16.7, feedback: "นี่คือร้อยละที่สูญเสียในแบตเตอรี่ ($I^2r$) โจทย์ถามส่วนที่ส่งถึงตัวต้านทาน" }
      - { match: 100, feedback: "แบตเตอรี่จริงมีความต้านทานภายใน พลังงานส่วนหนึ่งกลายเป็นความร้อนในแบตเตอรี่" }
    hints:
      - "หากระแสก่อน แล้วเทียบ $I^2R$ กับ $IE$"
      - "ประสิทธิภาพ $= \\dfrac{R}{R + r} \\times 100\\%$"
    solution: "$I = \\dfrac{12}{6.0} = 2.0\\ \\mathrm{A}$ กำลังที่ผลิต $IE = 24\\ \\mathrm{W}$ กำลังที่ตัวต้านทาน $I^2R = 20\\ \\mathrm{W}$ ร้อยละ $\\dfrac{20}{24} \\times 100 \\approx 83.3\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.emf-sources.p012
    topics: [physics.electricity.emf-sources]
    difficulty: 4
    type: numeric
    stem: "แบตเตอรี่ $12\\ \\mathrm{V}$ (ความต้านทานภายใน $0.5\\ \\Omega$) และแบตเตอรี่ $6\\ \\mathrm{V}$ (ความต้านทานภายใน $0.5\\ \\Omega$) ต่อกลับขั้วกันในวงจรเดียวกับตัวต้านทาน $5\\ \\Omega$ ดังภาพ กระแสในวงจรเป็นกี่แอมแปร์"
    figure: { src: p-opposing.svg, alt: "วงจรอนุกรมวงเดียว ด้านบนมีแบตเตอรี่ 12 V ความต้านทานภายใน 0.5 Ω ขั้วบวกอยู่ทางซ้าย และแบตเตอรี่ 6 V ความต้านทานภายใน 0.5 Ω ขั้วบวกอยู่ทางขวา ขั้วลบของทั้งสองหันเข้าหากัน ด้านล่างมีตัวต้านทาน 5 Ω" }
    answer: { value: 1, tolerance: 0.01, unit: A }
    misconceptions:
      - { match: 3, feedback: "บวกอีเอ็มเอฟทั้งสอง แต่แบตเตอรี่ต่อกลับขั้ว อีเอ็มเอฟต้องลบกัน" }
      - { match: 1.2, feedback: "ลืมความต้านทานภายในของแบตเตอรี่ทั้งสองก้อน" }
    hints:
      - "แบตเตอรี่ที่ต่อกลับขั้ว อีเอ็มเอฟหักล้างกันบางส่วน"
      - "$I = \\dfrac{12 - 6}{5 + 0.5 + 0.5}$"
