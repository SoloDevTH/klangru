    solution: "รุ้งทุติยภูมิเกิดจากการสะท้อนสองครั้งในหยดน้ำ จึงจางกว่า เรียงสีกลับกัน (แดงอยู่ด้านใน) และอยู่ที่มุมประมาณ 51 องศา สูงกว่ารุ้งปฐมภูมิที่ประมาณ 42 องศา"
