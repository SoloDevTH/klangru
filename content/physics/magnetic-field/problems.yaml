problems:
  - id: phy.mag.p001
    topics: [physics.magnetism.magnetic-field]
    difficulty: 1
    type: mcq
    stem: "ข้อใดถูกต้องเกี่ยวกับเส้นสนามแม่เหล็กรอบแท่งแม่เหล็ก"
    choices:
      - { id: a, text: "นอกแท่งแม่เหล็ก เส้นสนามมีทิศออกจากขั้วเหนือเข้าสู่ขั้วใต้", correct: true }
      - { id: b, text: "นอกแท่งแม่เหล็ก เส้นสนามมีทิศออกจากขั้วใต้เข้าสู่ขั้วเหนือ", feedback: "กลับทิศ ทิศของสนามคือทิศที่ขั้วเหนือของเข็มทิศชี้ ซึ่งชี้ออกจากขั้ว N และเข้าหาขั้ว S" }
      - { id: c, text: "เส้นสนามตัดกันได้ที่บริเวณใกล้ขั้วแม่เหล็ก", feedback: "เส้นสนามไม่ตัดกันเลย ถ้าตัดกันจะแปลว่าจุดนั้นมีสนามสองทิศพร้อมกัน ซึ่งเป็นไปไม่ได้ ใกล้ขั้วเส้นแค่อยู่ชิดกันมาก" }
      - { id: d, text: "บริเวณที่เส้นสนามห่างกันมาก สนามแม่เหล็กมีค่ามาก", feedback: "กลับกัน เส้นที่อยู่ชิดกันแสดงว่าสนามแรง เส้นที่ห่างกันแสดงว่าสนามอ่อน" }
    hints:
      - "ทิศของสนามที่จุดใดคือทิศที่ขั้วเหนือของเข็มทิศชี้"
      - "ขั้วเหนือของเข็มทิศถูกผลักออกจากขั้ว N และถูกดูดเข้าหาขั้ว S"
    solution: "นอกแท่งแม่เหล็ก เส้นสนามออกจากขั้วเหนือไปเข้าขั้วใต้ เส้นไม่ตัดกัน และเส้นยิ่งชิดกันสนามยิ่งแรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.mag.p002
    topics: [physics.magnetism.magnetic-field]
    difficulty: 1
    type: match
    stem: "จับคู่ปริมาณกับหน่วย SI"
    pairs:
      - { left: "สนามแม่เหล็ก $B$", right: "เทสลา ($\\mathrm{T}$)" }
      - { left: "กระแสไฟฟ้า $I$", right: "แอมแปร์ ($\\mathrm{A}$)" }
      - { left: "แรง $F$", right: "นิวตัน ($\\mathrm{N}$)" }
      - { left: "ประจุไฟฟ้า $q$", right: "คูลอมบ์ ($\\mathrm{C}$)" }
      - { left: "ความยาวลวด $L$", right: "เมตร ($\\mathrm{m}$)" }
    hints:
      - "หน่วยของสนามแม่เหล็กตั้งชื่อตามนิโคลา เทสลา"
      - "ปริมาณที่เหลือเป็นหน่วยที่เคยเรียนในเรื่องแรงและไฟฟ้า"
    solution: "$B$ – เทสลา · $I$ – แอมแปร์ · $F$ – นิวตัน · $q$ – คูลอมบ์ · $L$ – เมตร และจาก $F = ILB$ ได้ $1\\ \\mathrm{T} = 1\\ \\mathrm{N/(A\\cdot m)}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.mag.p003
    topics: [physics.magnetism.magnetic-field]
    difficulty: 2
    type: numeric
    stem: "ลวดตรงยาว $50\\ \\mathrm{cm}$ มีกระแส $2\\ \\mathrm{A}$ วางตั้งฉากกับสนามแม่เหล็ก $0.3\\ \\mathrm{T}$ ลวดถูกแรงแม่เหล็กเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 0.3, tolerance: 0.01, unit: N }
    hints:
      - "เปลี่ยนความยาวเป็นเมตรก่อน"
      - "ลวดตั้งฉากกับสนาม ใช้ $F = ILB$ ($\\sin 90^\\circ = 1$)"
    misconceptions:
      - { match: 30, feedback: "ดูเหมือนแทน $L = 50$ โดยไม่เปลี่ยนเซนติเมตรเป็นเมตร ต้องใช้ $L = 0.5\\ \\mathrm{m}$" }
      - { match: 3.33, feedback: "ดูเหมือนหารด้วย $B$ แทนการคูณ แรงคือผลคูณ $F = ILB$" }
    solution: "$L = 50\\ \\mathrm{cm} = 0.5\\ \\mathrm{m}$ · $F = ILB = (2\\ \\mathrm{A})(0.5\\ \\mathrm{m})(0.3\\ \\mathrm{T}) = 0.3\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.mag.p004
    topics: [physics.magnetism.magnetic-field]
    difficulty: 2
    type: expression
    stem: "จัดสูตร $F = ILB$ (ลวดตั้งฉากกับสนาม) ให้ $B$ อยู่ข้างเดียว"
    prefix: "B ="
    answer: { latex: "\\frac{F}{IL}", variables: [F, I, L] }
    misconceptions:
      - { match: "FIL", feedback: "$B$ ถูกคูณด้วย $I$ และ $L$ อยู่ การย้ายข้างต้องหาร ไม่ใช่คูณ" }
      - { match: "\\frac{IL}{F}", feedback: "กลับเศษกับส่วน ถ้าวัดแรงได้มากขึ้นด้วยกระแสเท่าเดิม สนามต้องแรงขึ้น $F$ จึงต้องอยู่ที่เศษ" }
    hints:
      - "ฝั่งขวา $B$ ถูกคูณด้วยอะไรบ้าง"
      - "หารทั้งสองข้างด้วย $IL$"
    solution: "$F = ILB$ หารทั้งสองข้างด้วย $IL$ ได้ $B = \\dfrac{F}{IL}$ หน่วยจึงเป็น $\\mathrm{N/(A\\cdot m)} = \\mathrm{T}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.mag.p005
    topics: [physics.magnetism.magnetic-field]
    difficulty: 3
    type: numeric
    stem: "ลวดยาว $0.25\\ \\mathrm{m}$ มีกระแส $4\\ \\mathrm{A}$ วางทำมุม $30^\\circ$ กับสนามแม่เหล็ก $0.5\\ \\mathrm{T}$ ลวดถูกแรงแม่เหล็กเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 0.25, tolerance: 0.01, unit: N }
    hints:
      - "ลวดไม่ตั้งฉากกับสนาม ต้องใช้ $F = ILB\\sin\\theta$"
      - "$\\theta$ คือมุมระหว่างลวดกับสนาม และ $\\sin 30^\\circ = 0.5$"
    misconceptions:
      - { match: 0.5, feedback: "ดูเหมือนคิดแบบตั้งฉาก ลืมคูณ $\\sin 30^\\circ$ ลวดเอียงจึงได้แรงน้อยกว่าเมื่อตั้งฉาก" }
      - { match: 0.433, feedback: "ดูเหมือนใช้ $\\cos 30^\\circ$ สูตรใช้ $\\sin\\theta$ เพราะเมื่อลวดขนานกับสนาม ($\\theta = 0^\\circ$) แรงต้องเป็นศูนย์" }
    solution: "$F = ILB\\sin\\theta = (4)(0.25)(0.5)\\sin 30^\\circ = 0.5 \\times 0.5 = 0.25\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.mag.p006
    topics: [physics.magnetism.magnetic-field]
    difficulty: 3
    type: mcq
    stem: "บนหน้ากระดาษ ลวดตรงมีกระแสไหลไปทางขวา วางในสนามแม่เหล็กที่มีทิศพุ่งเข้าหน้ากระดาษ ($\\otimes$) แรงแม่เหล็กที่กระทำต่อลวดมีทิศใด"
    choices:
      - { id: a, text: "ขึ้นไปทางด้านบนของหน้ากระดาษ", correct: true }
      - { id: b, text: "ลงไปทางด้านล่างของหน้ากระดาษ", feedback: "ทิศกลับ อาจใช้มือซ้ายหรือสลับนิ้ว ใช้มือขวา: นิ้วโป้งชี้ทิศกระแส (ขวา) นิ้วทั้งสี่ชี้ทิศสนาม (เข้ากระดาษ) แรงมีทิศออกจากฝ่ามือ" }
      - { id: c, text: "พุ่งเข้าหน้ากระดาษ ตามทิศของสนาม", feedback: "แรงแม่เหล็กตั้งฉากกับสนามเสมอ จึงมีทิศตามสนามไม่ได้" }
      - { id: d, text: "ไปทางขวา ตามทิศของกระแส", feedback: "แรงแม่เหล็กตั้งฉากกับทิศกระแสเสมอ จึงไม่ชี้ไปตามลวด" }
    hints:
      - "แรงต้องตั้งฉากกับทั้งกระแสและสนาม จึงเหลือแค่ขึ้นหรือลงบนกระดาษ"
      - "แบมือขวา นิ้วโป้งชี้ทิศกระแส นิ้วทั้งสี่ชี้ทิศสนาม ดูว่าฝ่ามือหันไปทางใด"
    solution: "แบมือขวา นิ้วโป้งชี้ขวา (กระแส) นิ้วทั้งสี่ชี้เข้ากระดาษ (สนาม) ฝ่ามือหันขึ้นด้านบนของกระดาษ แรงจึงมีทิศขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.mag.p007
    topics: [physics.magnetism.magnetic-field]
    difficulty: 3
    type: mcq
    stem: "ลวดตรงตั้งในแนวดิ่ง มีกระแสไหล **ขึ้น** ถ้ามองลงมาจากด้านบน เส้นสนามแม่เหล็กรอบลวดมีลักษณะอย่างไร"
    choices:
      - { id: a, text: "เป็นวงกลมรอบลวด วนทวนเข็มนาฬิกา", correct: true }
      - { id: b, text: "เป็นวงกลมรอบลวด วนตามเข็มนาฬิกา", feedback: "ทิศกลับ อาจใช้มือซ้าย ใช้กฎกำมือขวา: นิ้วโป้งชี้ขึ้นตามกระแส นิ้วทั้งสี่ที่กำรอบลวดวนทวนเข็มนาฬิกาเมื่อมองจากด้านบน" }
      - { id: c, text: "เป็นเส้นตรงขนานกับลวด ชี้ขึ้นตามกระแส", feedback: "สนามรอบลวดตรงไม่ขนานกับลวด แต่วนเป็นวงกลมรอบลวด หาทิศด้วยกฎกำมือขวา" }
      - { id: d, text: "เป็นเส้นตรงพุ่งออกจากลวดทุกทิศ", feedback: "แบบนั้นคือลักษณะของสนามไฟฟ้ารอบประจุ สนามแม่เหล็กรอบลวดตรงเป็นวงกลมล้อมรอบลวด" }
    hints:
      - "ใช้กฎกำมือขวา: นิ้วโป้งชี้ทิศกระแส"
      - "ลองกำมือขวาโดยให้นิ้วโป้งชี้ขึ้น แล้วมองลงมาจากด้านบนว่านิ้ววนทางใด"
    solution: "กำลวดด้วยมือขวาให้นิ้วโป้งชี้ขึ้น นิ้วทั้งสี่วนรอบลวด เมื่อมองลงมาจากด้านบนจะวนทวนเข็มนาฬิกา เส้นสนามจึงเป็นวงกลมวนทวนเข็มนาฬิกา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.mag.p008
    topics: [physics.magnetism.magnetic-field]
    difficulty: 4
    type: numeric
    stem: "สายไฟฟ้าแรงสูงช่วงระหว่างเสาสองต้นยาว $100\\ \\mathrm{m}$ มีกระแส $500\\ \\mathrm{A}$ ส่วนประกอบของสนามแม่เหล็กโลกที่ตั้งฉากกับสายไฟในบริเวณนี้มีค่าประมาณ $40\\ \\mu\\mathrm{T}$ สายไฟช่วงนี้ถูกแรงแม่เหล็กเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 2, tolerance: 0.02, unit: N }
    hints:
      - "เปลี่ยน $\\mu\\mathrm{T}$ เป็นเทสลา: $1\\ \\mu\\mathrm{T} = 10^{-6}\\ \\mathrm{T}$"
      - "ใช้ส่วนประกอบที่ตั้งฉากกับสายไฟ แทนใน $F = ILB$"
    misconceptions:
      - { match: 2000000, feedback: "ดูเหมือนแทน $B = 40$ โดยไม่เปลี่ยนไมโครเทสลาเป็นเทสลา ต้องใช้ $B = 40 \\times 10^{-6}\\ \\mathrm{T}$" }
      - { match: 2000, feedback: "ดูเหมือนใช้ $\\mu = 10^{-3}$ (ซึ่งเป็นมิลลิ) ไมโครคือ $10^{-6}$" }
    solution: "$B = 40\\ \\mu\\mathrm{T} = 4.0 \\times 10^{-5}\\ \\mathrm{T}$ · $F = ILB = (500)(100)(4.0 \\times 10^{-5}) = 2\\ \\mathrm{N}$ แรงนี้เล็กมากเมื่อเทียบกับน้ำหนักของสายไฟ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.mag.p009
    topics: [physics.magnetism.magnetic-field]
    difficulty: 3
    type: numeric
    stem: "โปรตอน ($q = 1.6 \\times 10^{-19}\\ \\mathrm{C}$) เคลื่อนที่ด้วยความเร็ว $2 \\times 10^{6}\\ \\mathrm{m/s}$ ในทิศตั้งฉากกับสนามแม่เหล็ก $0.5\\ \\mathrm{T}$ โปรตอนถูกแรงแม่เหล็กเท่าใด (ตอบเป็นตัวเลขที่คูณกับ $10^{-13}\\ \\mathrm{N}$ เช่น ถ้าได้ $5 \\times 10^{-13}\\ \\mathrm{N}$ ให้ตอบ 5)"
    answer: { value: 1.6, tolerance: 0.02, unit: "× 10⁻¹³ N" }
    hints:
      - "ประจุเคลื่อนที่ตั้งฉากกับสนาม ใช้ $F = qvB$"
      - "คูณตัวเลขหน้าเลขยกกำลังด้วยกัน แล้วบวกเลขชี้กำลังของ 10"
    misconceptions:
      - { match: 6.4, feedback: "ดูเหมือนหารด้วย $B$ แทนการคูณ แรงคือผลคูณ $F = qvB$" }
    solution: "$F = qvB = (1.6 \\times 10^{-19})(2 \\times 10^{6})(0.5) = 1.6 \\times 10^{-13}\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.mag.p010
    topics: [physics.magnetism.magnetic-field]
    difficulty: 4
    type: mcq
    stem: "มอเตอร์ไฟฟ้ากระแสตรงในพัดลมของเล่นมี **คอมมิวเตเตอร์** (วงแหวนผ่าซีก) ต่ออยู่กับขดลวด หน้าที่ของคอมมิวเตเตอร์คืออะไร"
    choices:
      - { id: a, text: "กลับทิศกระแสในขดลวดทุกครึ่งรอบ ให้ขดลวดหมุนไปทางเดิมต่อเนื่อง", correct: true }
      - { id: b, text: "เพิ่มความเข้มของสนามแม่เหล็กให้มอเตอร์แรงขึ้น", feedback: "สนามแม่เหล็กมาจากแม่เหล็กถาวรรอบขดลวด คอมมิวเตเตอร์ไม่ได้เพิ่มสนาม แต่ทำหน้าที่กลับทิศกระแส" }
      - { id: c, text: "ทำให้กระแสในขดลวดไหลทางเดียวตลอดเวลา", feedback: "ถ้ากระแสในขดลวดไหลทางเดิมตลอด เมื่อหมุนเกินครึ่งรอบแรงจะดึงขดลวดกลับ ขดลวดจะแกว่งไปมาแทนการหมุน คอมมิวเตเตอร์จึงต้องกลับทิศกระแส" }
      - { id: d, text: "ลดกระแสไม่ให้ขดลวดร้อนเกินไป", feedback: "การจำกัดกระแสเป็นหน้าที่ของส่วนอื่นในวงจร คอมมิวเตเตอร์ทำหน้าที่สลับทิศกระแสทุกครึ่งรอบ" }
    hints:
      - "นึกถึงแรงที่ด้านทั้งสองของขดลวดเมื่อขดลวดหมุนไปครึ่งรอบ ด้านซ้ายกับด้านขวาสลับที่กัน"
      - "ถ้าทิศกระแสไม่เปลี่ยน แรงจะยังหมุนขดลวดไปทางเดิมหรือดึงกลับ"
    solution: "เมื่อขดลวดหมุนไปครึ่งรอบ ด้านทั้งสองสลับตำแหน่งกัน ถ้ากระแสยังไหลทางเดิม แรงจะดึงขดลวดกลับ คอมมิวเตเตอร์จึงกลับทิศกระแสในขดลวดทุกครึ่งรอบ ทำให้แรงหมุนขดลวดไปทางเดิมต่อเนื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.mag.p011
    topics: [physics.magnetism.magnetic-field]
    difficulty: 4
    type: numeric
    stem: "มอเตอร์ปั๊มน้ำในบ้านมีขดลวดสี่เหลี่ยม $50$ รอบ ด้านที่ตั้งฉากกับสนามยาว $0.1\\ \\mathrm{m}$ มีกระแส $2\\ \\mathrm{A}$ อยู่ในสนามแม่เหล็ก $0.2\\ \\mathrm{T}$ แรงแม่เหล็กรวมที่กระทำต่อด้านนั้นของขดลวด (ทั้ง 50 เส้นรวมกัน) เป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 2, tolerance: 0.02, unit: N }
    hints:
      - "ลวดแต่ละรอบถูกแรง $ILB$ ในทิศเดียวกัน"
      - "ขดลวด $N$ รอบจึงถูกแรงรวม $F = NILB$"
    misconceptions:
      - { match: 0.04, feedback: "นั่นคือแรงต่อลวดหนึ่งเส้น ด้านนี้มีลวด 50 เส้นวางซ้อนกัน แรงรวมจึงต้องคูณจำนวนรอบ" }
    solution: "$F = NILB = (50)(2\\ \\mathrm{A})(0.1\\ \\mathrm{m})(0.2\\ \\mathrm{T}) = 2\\ \\mathrm{N}$ การเพิ่มจำนวนรอบจึงทำให้มอเตอร์หมุนแรงขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.mag.p012
