<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="sans-serif" font-size="14">
<title>วงจรงบประมาณแผ่นดินสี่ขั้นและปีงบประมาณตุลาคมถึงกันยายน</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="860" height="470" fill="#ffffff"/>
<text x="430.0" y="30.0" text-anchor="middle" font-size="18" fill="#222" font-weight="bold">วงจรงบประมาณแผ่นดิน (ภาพรวม)</text>
<rect x="325.0" y="62.0" width="210.0" height="86.0" rx="8" fill="#f7f7f7" stroke="#1f5fa8" stroke-width="2"/>
<text x="430.0" y="84.0" text-anchor="middle" font-size="15" fill="#1f5fa8" font-weight="bold">1 จัดทำ</text>
<text x="430.0" y="104.0" text-anchor="middle" font-size="13" fill="#222">ส่วนราชการทำคำขอ</text>
<text x="430.0" y="121.0" text-anchor="middle" font-size="13" fill="#222">สำนักงบประมาณพิจารณา</text>
<text x="430.0" y="138.0" text-anchor="middle" font-size="13" fill="#222">ครม. เห็นชอบร่าง</text>
<rect x="555.0" y="192.0" width="210.0" height="86.0" rx="8" fill="#f7f7f7" stroke="#2e7d32" stroke-width="2"/>
<text x="660.0" y="214.0" text-anchor="middle" font-size="15" fill="#2e7d32" font-weight="bold">2 อนุมัติ</text>
<text x="660.0" y="234.0" text-anchor="middle" font-size="13" fill="#222">สภาผู้แทนราษฎร</text>
<text x="660.0" y="251.0" text-anchor="middle" font-size="13" fill="#222">แล้ววุฒิสภาพิจารณา</text>
<text x="660.0" y="268.0" text-anchor="middle" font-size="13" fill="#222">ประกาศเป็น พ.ร.บ.</text>
<rect x="325.0" y="322.0" width="210.0" height="86.0" rx="8" fill="#f7f7f7" stroke="#b26a00" stroke-width="2"/>
<text x="430.0" y="344.0" text-anchor="middle" font-size="15" fill="#b26a00" font-weight="bold">3 บริหารงบประมาณ</text>
<text x="430.0" y="364.0" text-anchor="middle" font-size="13" fill="#222">ใช้จ่ายตามปีงบประมาณ</text>
<text x="430.0" y="381.0" text-anchor="middle" font-size="13" fill="#222">1 ต.ค. – 30 ก.ย.</text>
<text x="430.0" y="398.0" text-anchor="middle" font-size="13" fill="#222">เบิกจ่าย โอนเปลี่ยนแปลง</text>
<rect x="95.0" y="192.0" width="210.0" height="86.0" rx="8" fill="#f7f7f7" stroke="#7b1fa2" stroke-width="2"/>
<text x="200.0" y="214.0" text-anchor="middle" font-size="15" fill="#7b1fa2" font-weight="bold">4 ติดตามและตรวจสอบ</text>
<text x="200.0" y="234.0" text-anchor="middle" font-size="13" fill="#222">รายงานผลตามตัวชี้วัด</text>
<text x="200.0" y="251.0" text-anchor="middle" font-size="13" fill="#222">ตรวจสอบการใช้เงิน</text>
<text x="200.0" y="268.0" text-anchor="middle" font-size="13" fill="#222">ป้อนกลับสู่ปีถัดไป</text>
<path d="M479.3,142.3 A105,105 0 0 1 522.7,185.7" stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M522.7,284.3 A105,105 0 0 1 479.3,327.7" stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M380.7,327.7 A105,105 0 0 1 337.3,284.3" stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M337.3,185.7 A105,105 0 0 1 380.7,142.3" stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<text x="430.0" y="231.0" text-anchor="middle" font-size="14" fill="#555">หนึ่งรอบกินเวลา</text>
<text x="430.0" y="251.0" text-anchor="middle" font-size="14" fill="#555">มากกว่าหนึ่งปี</text>
<text x="430.0" y="456.0" text-anchor="middle" font-size="13" fill="#444">ขั้นที่ 1–2 ทำในปีก่อนหน้า ขั้นที่ 3 คือปีงบประมาณ และขั้นที่ 4 ต่อเนื่องหลังปีงบประมาณ</text>
</svg>
