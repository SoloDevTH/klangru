problems:
- id: health.family.conflict-resolution.p001
  topics:
  - health.family.conflict-resolution
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นพฤติกรรมที่พึงประสงค์เมื่อขัดแย้งกับเพื่อน
  choices:
  - id: a
    text: ฟังเพื่อนพูดให้จบก่อนแล้วจึงบอกความรู้สึกของตัวเอง
    correct: true
  - id: b
    text: ตะโกนใส่เพื่อนให้เสียงดังกว่า
    feedback: การตะโกนทำให้อีกฝ่ายโกรธมากขึ้น ไม่ได้แก้ปัญหา
  - id: c
    text: โพสต์เรื่องของเพื่อนลงกลุ่มแชตห้อง
    feedback: การประจานทำให้เรื่องลุกลามและทำร้ายจิตใจเพื่อน
  hints:
  - พฤติกรรมที่พึงประสงค์ทำให้ปัญหาเล็กลง
  - การฟังช่วยให้เข้าใจกัน
  solution: การฟังให้จบแล้วบอกความรู้สึกอย่างสุภาพช่วยให้ทั้งสองฝ่ายเข้าใจกันและหาทางออกได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.conflict-resolution.p002
  topics:
  - health.family.conflict-resolution
  difficulty: 1
  type: mcq
  stem: ความขัดแย้งในครอบครัวคืออะไร
  choices:
  - id: a
    text: การที่สมาชิกในบ้านต้องการ คิด หรือรู้สึกไม่ตรงกัน
    correct: true
  - id: b
    text: การที่ครอบครัวไม่รักกัน
    feedback: ครอบครัวที่รักกันก็มีความขัดแย้งได้ เป็นเรื่องปกติ
  - id: c
    text: เรื่องที่เกิดขึ้นเฉพาะในครอบครัวที่มีปัญหา
    feedback: ความขัดแย้งเกิดขึ้นได้กับทุกครอบครัว
  hints:
  - ความขัดแย้งเกิดกับคนที่ใกล้ชิดกันได้
  - สิ่งสำคัญคือวิธีจัดการ
  solution: ความขัดแย้งคือความต้องการ ความคิด หรือความรู้สึกที่ไม่ตรงกัน เกิดได้ในทุกครอบครัว ไม่ได้แปลว่าไม่รักกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.conflict-resolution.p003
  topics:
  - health.family.conflict-resolution
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนการแก้ความขัดแย้งอย่างสันติ
  items:
  - หยุดให้ใจสงบ
  - ฟังอีกฝ่ายให้เข้าใจ
  - พูดบอกความรู้สึกแบบใช้ "ฉัน"
  - หาทางเลือกร่วมกัน
  - ตกลง ลองทำ และทบทวน
  hints:
  - ต้องใจเย็นก่อนจึงจะคุยกันได้
  - ขั้นสุดท้ายคือทำตามที่ตกลงและดูผล
  solution: หยุดให้ใจสงบ → ฟัง → พูดแบบใช้ "ฉัน" → หาทางเลือก → ตกลงและทบทวน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.conflict-resolution.p004
  topics:
  - health.family.conflict-resolution
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็นการพูดแบบใช้ "ฉัน"
  choices:
  - id: a
    text: ฉันรู้สึกน้อยใจที่ไม่มีใครบอกเรื่องนัดเล่นบอล ครั้งหน้าฉันอยากให้ชวนด้วย
    correct: true
  - id: b
    text: พวกเธอไม่เคยสนใจฉันเลย
    feedback: เป็นการกล่าวหาและใช้คำว่า "ไม่เคย" ทำให้อีกฝ่ายตั้งป้องกันตัว
  - id: c
    text: ถ้าไม่ชวนฉันอีก ฉันจะไม่คุยด้วยแล้ว
    feedback: เป็นการขู่ ไม่ได้บอกความรู้สึกและสิ่งที่ต้องการอย่างตรงไปตรงมา
  hints:
  - การพูดแบบใช้ "ฉัน" บอกความรู้สึก เหตุการณ์ และสิ่งที่อยากให้เกิด
  - ไม่กล่าวหาหรือขู่
  solution: ข้อแรกบอกความรู้สึก (น้อยใจ) เหตุการณ์ (ไม่มีใครบอก) และสิ่งที่ต้องการ (อยากให้ชวน) โดยไม่กล่าวหา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.conflict-resolution.p005
  topics:
  - health.family.conflict-resolution
  difficulty: 2
  type: match
  stem: จับคู่สาเหตุของความขัดแย้งกับกลุ่มที่มักเกิด
  pairs:
  - left: แบ่งงานบ้านไม่เท่ากัน
    right: ครอบครัว
  - left: อ่านข้อความในกลุ่มแชตแล้วเข้าใจผิด
    right: กลุ่มเพื่อน
  - left: กลุ่มวัยรุ่นต่างสถาบันยั่วยุกันในโซเชียลมีเดีย
    right: เยาวชนในชุมชน
  hints:
  - คิดว่าแต่ละเรื่องเกิดกับใคร
  - ความขัดแย้งระหว่างกลุ่มใหญ่ ๆ เป็นเรื่องของชุมชน
  solution: งานบ้านเป็นเรื่องในครอบครัว ข้อความในแชตเป็นเรื่องในกลุ่มเพื่อน และการยั่วยุระหว่างสถาบันเป็นความขัดแย้งของเยาวชนในชุมชน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.conflict-resolution.p006
  topics:
  - health.family.conflict-resolution
  difficulty: 2
  type: mcq
  stem: นิดกับน้อยแย่งกันใช้คอมพิวเตอร์เครื่องเดียวที่บ้านทำการบ้าน ทางเลือกใดทุกฝ่ายรับได้มากที่สุด
  choices:
  - id: a
    text: ดูกำหนดส่งการบ้านของทั้งคู่ แล้วแบ่งเวลาใช้ให้คนที่ต้องส่งก่อนได้ใช้ก่อน
    correct: true
  - id: b
    text: ให้คนที่ตัวโตกว่าใช้ก่อนเสมอ
    feedback: ไม่ยุติธรรมและไม่ได้ดูความจำเป็นจริง
  - id: c
    text: ไม่มีใครได้ใช้ ทั้งคู่จะได้ไม่ทะเลาะกัน
    feedback: ทั้งสองฝ่ายเสีย และการบ้านก็ไม่เสร็จ
  hints:
  - ทางออกที่ดีดูความต้องการจริงของทั้งสองคน
  - ทั้งคู่ต้องการทำการบ้านให้ทัน
  solution: การดูกำหนดส่งแล้วแบ่งเวลาเป็นการร่วมมือ ทั้งสองคนได้ทำการบ้านทันกำหนด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.conflict-resolution.p007
  topics:
  - health.family.conflict-resolution
  difficulty: 3
  type: text
  stem: ขั้นแรกของการแก้ความขัดแย้งเมื่อทั้งสองฝ่ายกำลังโกรธมาก คือการทำอะไร (ตอบสั้น ๆ)
  accepted:
  - หยุด
  - หยุดให้ใจสงบ
  - สงบสติอารมณ์
  - ทำใจให้สงบ
  - ใจเย็น
  - พักก่อน
  - แยกกันพัก
  misconceptions:
  - match: พูด
    feedback: ถ้าพูดตอนโกรธมาก มักพูดสิ่งที่ทำร้ายกัน ต้องสงบก่อน
  hints:
  - ตอนโกรธร่างกายพร้อมสู้ คิดได้ไม่ดี
  - ก่อนฟังและพูด ต้องทำให้อารมณ์ลดลงก่อน
  solution: ขั้นแรกคือหยุดให้ใจสงบ เช่น หายใจช้า ๆ หรือขอแยกกันพักก่อน แล้วจึงกลับมาคุยกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.conflict-resolution.p008
  topics:
  - health.family.conflict-resolution
  difficulty: 3
  type: mcq
  stem: "ข้อใดวิเคราะห์ \"สาเหตุ\" ของความขัดแย้งในครอบครัวนี้ได้ถูกต้อง: พ่อทำงานกะดึก กลับมาเหนื่อยและหงุดหงิด ลูกเปิดเพลงเสียงดังตอนกลางวัน พ่อจึงดุแรง"
  choices:
  - id: a
    text: พ่อต้องการพักผ่อนแต่ลูกไม่รู้ตารางนอนของพ่อ และพ่อเหนื่อยจึงควบคุมอารมณ์ได้ยาก
    correct: true
  - id: b
    text: ลูกเป็นเด็กไม่ดี
    feedback: เป็นการตัดสินคน ไม่ใช่การวิเคราะห์สาเหตุ ลูกอาจไม่รู้ว่าพ่อนอนอยู่
  - id: c
    text: พ่อไม่รักลูก
    feedback: การดุเพราะเหนื่อยไม่ได้แปลว่าไม่รัก
  hints:
  - มองหาความต้องการที่ไม่ตรงกัน
  - ความเหนื่อยและความเครียดมีผลต่ออารมณ์
  solution: สาเหตุคือความต้องการไม่ตรงกัน (พักผ่อนกับฟังเพลง) ข้อมูลไม่ครบ (ไม่รู้ตารางนอน) และความเหนื่อย แนวทางแก้คือคุยกันเรื่องเวลานอนของพ่อ และใช้หูฟังช่วงนั้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.conflict-resolution.p009
  topics:
  - health.family.conflict-resolution
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นผลดีของความขัดแย้งที่จัดการอย่างเหมาะสม
  choices:
  - id: a
    text: ทุกคนเข้าใจความต้องการของกันมากขึ้น และได้ข้อตกลงที่ยุติธรรมกว่าเดิม
    correct: true
  - id: b
    text: ไม่มีผลดีเลย ความขัดแย้งเป็นเรื่องเสียทั้งหมด
    feedback: ถ้าจัดการดี ความขัดแย้งช่วยให้ปรับปรุงความสัมพันธ์และกติกา
  - id: c
    text: ฝ่ายที่แข็งแรงกว่าจะชนะเสมอ
    feedback: การใช้กำลังไม่ใช่การจัดการที่เหมาะสม
  hints:
  - ความขัดแย้งมีทั้งผลเสียและผลดี
  - ผลดีเกิดเมื่อคุยกันอย่างสันติ
  solution: ความขัดแย้งที่จัดการดีช่วยให้เข้าใจกัน ปรับกติกาให้ยุติธรรม และความสัมพันธ์แน่นแฟ้นขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.conflict-resolution.p010
  topics:
  - health.family.conflict-resolution
  difficulty: 3
  type: match
  stem: จับคู่สถานการณ์กับวิธีรับมือที่เหมาะสม
  pairs:
  - left: คนเมาตะโกนหาเรื่องที่ป้ายรถเมล์
    right: หลีกเลี่ยง (เดินออกมา)
  - left: รุ่นพี่ชวนขี่มอเตอร์ไซค์ซ้อนสามโดยไม่สวมหมวก
    right: เอาชนะ (ยืนหยัดปฏิเสธ)
  - left: พี่น้องต้องแบ่งห้องนอนกันอีกหลายปี
    right: ร่วมมือ (หาทางที่ทุกคนได้)
  - left: เพื่อนอยากกินร้านส้มตำ เราอยากกินร้านก๋วยเตี๋ยว และเหลือเวลาพักไม่มาก
    right: ประนีประนอม (ยอมคนละนิด)
  hints:
  - เมื่อมีอันตราย ความปลอดภัยมาก่อน
  - เรื่องที่ต้องอยู่ด้วยกันนานควรหาทางที่ยั่งยืน
  solution: คนเมาอาจทำร้าย ให้หลีกเลี่ยง เรื่องอันตรายต้องยืนหยัดปฏิเสธ ห้องนอนร่วมกันระยะยาวควรร่วมมือ ส่วนเรื่องเล็กที่เวลาน้อยใช้การประนีประนอม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.conflict-resolution.p011
  topics:
  - health.family.conflict-resolution
  difficulty: 4
  type: mcq
  stem: วัยรุ่นคนหนึ่งอยากไปดูหนังกับเพื่อนต่างเพศตอนเย็น แต่ผู้ปกครองไม่อนุญาตเพราะห่วง ทักษะใดเหมาะที่สุดในการลดความขัดแย้ง
  choices:
  - id: a
    text: "เจรจา: เลือกเวลาที่ทุกคนใจเย็น บอกว่าไปที่ไหน กับใคร กลับกี่โมง และเสนอให้โทรบอกเมื่อถึงและก่อนกลับ"
    correct: true
  - id: b
    text: แอบไปโดยไม่บอก
    feedback: ทำให้ผู้ปกครองไม่ไว้ใจและไม่ปลอดภัย ถ้าเกิดเหตุจะไม่มีใครรู้ว่าอยู่ที่ไหน
  - id: c
    text: ขังตัวเองในห้องไม่คุยกับใครจนกว่าจะได้ไป
    feedback: เป็นการกดดัน ไม่ได้ตอบความห่วงใยของผู้ปกครอง
  hints:
  - ผู้ปกครองกังวลเรื่องใด
  - ข้อเสนอที่ดีตอบความกังวลของอีกฝ่าย
  solution: การเจรจาที่ให้ข้อมูลครบและเสนอวิธีลดความเสี่ยงตอบความห่วงใยเรื่องความปลอดภัย ผู้ปกครองจึงมีแนวโน้มยอมรับ และความไว้ใจเพิ่มขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.conflict-resolution.p012
  topics:
  - health.family.conflict-resolution
  difficulty: 4
  type: mcq
  stem: ข้อใดเป็นแนวทางป้องกันความขัดแย้งในครอบครัวได้ดีที่สุด
  choices:
  - id: a
    text: ประชุมครอบครัวสั้น ๆ ทุกสัปดาห์ ตกลงตารางงานบ้านและกติกาการใช้โทรศัพท์ร่วมกัน
    correct: true
  - id: b
    text: ให้ผู้ใหญ่ตัดสินทุกเรื่องโดยไม่ต้องถามเด็ก
    feedback: กติกาที่ทุกคนไม่ได้มีส่วนร่วมมักไม่มีใครอยากทำตาม
  - id: c
    text: ไม่ตั้งกติกาใด ๆ ใครอยากทำอะไรก็ทำ
    feedback: การไม่มีข้อตกลงทำให้แย่งกันและขัดแย้งบ่อย
  hints:
  - การป้องกันคือทำก่อนเกิดปัญหา
  - ข้อตกลงที่ทุกคนร่วมคิดทำให้ทุกคนยอมรับ
  solution: การประชุมครอบครัวและตกลงกติการ่วมกันช่วยให้ทุกคนรู้ความคาดหวังล่วงหน้า ลดเรื่องที่จะขัดแย้ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.conflict-resolution.p013
  topics:
  - health.family.conflict-resolution
  difficulty: 4
  type: mcq
  stem: ในงานวัด กลุ่มวัยรุ่นสองหมู่บ้านเริ่มด่ากันและมีคนถือขวดเหล้า เพื่อนในกลุ่มชวนเข้าไปช่วย ควรทำอย่างไร
  choices:
  - id: a
    text: ปฏิเสธ ชวนเพื่อนถอยออกห่าง และแจ้งผู้ใหญ่หรือเจ้าหน้าที่ ถ้ามีการทำร้ายโทร 191 และมีคนเจ็บโทร 1669
    correct: true
  - id: b
    text: เข้าไปห้ามเองเพราะรู้จักทั้งสองกลุ่ม
    feedback: การเข้าไปในวงที่กำลังเดือดและมีแอลกอฮอล์อาจบาดเจ็บ ให้ผู้ใหญ่หรือเจ้าหน้าที่จัดการ
  - id: c
    text: ถ่ายคลิปโพสต์ลงโซเชียลมีเดีย
    feedback: คลิปอาจยั่วยุให้เรื่องลุกลามและแก้แค้นกันต่อ
  hints:
