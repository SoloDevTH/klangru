      - { match: 50, feedback: "ถ้ามีอย่างละครึ่ง ค่าเฉลี่ยจะเป็น 63.93 แต่ค่าจริงคือ 63.55 จึงไม่ใช่ครึ่งต่อครึ่ง" }
