<text x="380.0" y="145.0" text-anchor="start" fill="#15211e" font-size="13">เส้นศูนย์กลาง แกนสมมาตร</text>
<text x="20.0" y="195.0" text-anchor="start" fill="#15211e" font-size="14" font-weight="bold">เส้นเต็มบาง</text>
<line x1="180.0" y1="190.0" x2="360.0" y2="190.0" stroke="#15211e" stroke-width="1.2"/>
<text x="380.0" y="195.0" text-anchor="start" fill="#15211e" font-size="13">เส้นช่วยกำหนดขนาด เส้นลายตัด</text>
<text x="20.0" y="245.0" text-anchor="start" fill="#15211e" font-size="14" font-weight="bold">เส้นลูกโซ่ปลายหนา</text>
<line x1="180.0" y1="240.0" x2="210.0" y2="240.0" stroke="#15211e" stroke-width="3.5"/>
