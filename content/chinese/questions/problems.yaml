  - 哪儿 = ที่ไหน · 那儿 = ที่นั่น
  solution: '**哪 nǎ** = ไหน (哪国人 哪儿) · **那 nà** = นั้น (那是… 那儿) ต่างกันทั้งตัวเขียนและวรรณยุกต์'
