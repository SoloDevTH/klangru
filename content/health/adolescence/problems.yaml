problems:
- id: health.growth.adolescence.p001
  topics:
  - health.growth.adolescence
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นการเปลี่ยนแปลงด้าน **อารมณ์** ในวัยรุ่น
  choices:
  - id: a
    text: หงุดหงิดง่ายและอารมณ์เปลี่ยนเร็วในวันเดียว
    correct: true
  - id: b
    text: สูงขึ้นเร็วจนเสื้อผ้าคับ
    feedback: เป็นการเปลี่ยนแปลงด้านร่างกาย
  - id: c
    text: อยากใช้เวลากับเพื่อนมากขึ้น
    feedback: เป็นการเปลี่ยนแปลงด้านสังคม
  - id: d
    text: คิดหาเหตุผลโต้แย้งได้ดีขึ้น
    feedback: เป็นการเปลี่ยนแปลงด้านสติปัญญา
  hints:
  - อารมณ์คือความรู้สึกที่แสดงออก
  - ตัดตัวเลือกที่เป็นร่างกาย สังคม และการคิดออกก่อน
  solution: อารมณ์เปลี่ยนเร็วและอ่อนไหวเป็นการเปลี่ยนแปลงด้านอารมณ์ ส่วนการสูงขึ้นเป็นด้านร่างกาย การอยากอยู่กับเพื่อนเป็นด้านสังคม และการใช้เหตุผลเป็นด้านสติปัญญา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.adolescence.p002
  topics:
  - health.growth.adolescence
  difficulty: 1
  type: match
  stem: จับคู่ด้านของการเปลี่ยนแปลงในวัยรุ่นกับตัวอย่าง
  pairs:
  - left: ร่างกาย
    right: เสียงแตก มีสิว
  - left: จิตใจ
    right: สงสัยว่าตัวเองเป็นใครและอยากได้รับการยอมรับ
  - left: อารมณ์
    right: อ่อนไหว น้อยใจง่าย
  - left: สังคม
    right: อยากตัดสินใจเองและให้ความสำคัญกับเพื่อน
  - left: สติปัญญา
    right: คิดเรื่องนามธรรมและตั้งคำถามได้ดีขึ้น
  hints:
  - ร่างกายคือสิ่งที่มองเห็นหรือวัดได้
  - จิตใจเกี่ยวกับความคิดต่อตัวเอง ส่วนอารมณ์คือความรู้สึกที่แสดงออก
  solution: 'ร่างกาย: เสียงแตก มีสิว จิตใจ: ค้นหาตัวตน อารมณ์: อ่อนไหว สังคม: อยากเป็นอิสระและใกล้ชิดเพื่อน สติปัญญา: คิดเชิงนามธรรม'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.adolescence.p003
  topics:
  - health.growth.adolescence
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็นปัจจัยที่วัยรุ่น **ปรับเองได้** เพื่อช่วยการเจริญเติบโต (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: นอนให้ได้ 8–10 ชั่วโมงต่อคืน
    correct: true
    feedback: ถูก
  - id: b
    text: กินอาหารครบหมู่และดื่มนม
    correct: true
    feedback: ถูก
  - id: c
    text: เคลื่อนไหวร่างกายทุกวัน
    correct: true
    feedback: ถูก
  - id: d
    text: ส่วนสูงของพ่อแม่
    feedback: เป็นพันธุกรรม เปลี่ยนเองไม่ได้
  - id: e
    text: อายุที่ร่างกายเริ่มเป็นวัยรุ่น
    feedback: ขึ้นกับพันธุกรรมและฮอร์โมนเป็นหลัก
  hints:
  - แยกปัจจัยภายในตัวกับปัจจัยภายนอก
  - ปัจจัยที่เป็นพฤติกรรมประจำวันมักปรับได้
  solution: การนอน อาหาร และการออกกำลังกายเป็นปัจจัยภายนอกที่ปรับได้ ส่วนพันธุกรรมและช่วงอายุที่เริ่มเป็นวัยรุ่นเป็นปัจจัยภายในที่เปลี่ยนเองไม่ได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.adolescence.p004
  topics:
  - health.growth.adolescence
  difficulty: 2
  type: numeric
  stem: ฟ้าวัดส่วนสูงที่โรงเรียนได้ 148.5 ซม. ในเดือนมิถุนายน 2568 และ 156.0 ซม. ในเดือนมิถุนายน 2569 ในหนึ่งปีนี้ฟ้าสูงขึ้นกี่เซนติเมตร (ตอบเป็น ซม./ปี)
  answer:
    value: 7.5
    tolerance: 0.1
    unit: ซม./ปี
  misconceptions:
  - match: 304.5
    feedback: ต้องลบกัน ไม่ใช่บวก
  - match: 0.625
    feedback: ไม่ต้องหารด้วย 12 เพราะถามเป็นต่อปี
  hints:
  - ใช้ส่วนสูงครั้งหลังลบครั้งแรก
  - ทั้งสองครั้งห่างกันพอดี 1 ปี
  solution: $156.0 - 148.5 = 7.5$ ซม. ในหนึ่งปี เป็นอัตราที่พบได้ในช่วงพุ่งสูงของวัยรุ่น ควรวัดซ้ำเป็นระยะและเทียบกับเกณฑ์อ้างอิง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.adolescence.p005
  topics:
  - health.growth.adolescence
  difficulty: 2
  type: mcq
  stem: ตาม NIMH สมองส่วนหน้า (prefrontal cortex) ที่ใช้วางแผนและตัดสินใจ พัฒนาเต็มที่ราวอายุเท่าใด
  choices:
  - id: a
    text: กลางถึงปลายวัย 20 ปี
    correct: true
  - id: b
    text: 12–13 ปี
    feedback: ช่วงนี้สมองยังปรับการทำงานอีกนานหลายปี
  - id: c
    text: 15 ปี พร้อมกับที่ส่วนสูงหยุดเพิ่ม
    feedback: ขนาดสมองใกล้คงที่ตั้งแต่ต้นวัยรุ่น แต่การทำงานยังพัฒนาต่อ
  - id: d
    text: หลังอายุ 40 ปี
    feedback: ช้าเกินไป สมองพัฒนาเต็มที่ก่อนนั้นมาก
  hints:
  - เป็นส่วนท้าย ๆ ที่พัฒนาเต็มที่
  - เลยวัยรุ่นไปอีกหลายปี
  solution: สมองส่วนหน้าพัฒนาเต็มที่ราวกลางถึงปลายวัย 20 ปี วัยรุ่นจึงยังฝึกการยั้งคิดและวางแผนอยู่ และให้น้ำหนักกับการยอมรับจากเพื่อนมาก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.adolescence.p006
  topics:
  - health.growth.adolescence
  difficulty: 1
  type: numeric
  stem: องค์การอนามัยโลกกำหนดให้วัยรุ่นคือช่วงอายุ 10 ปีถึงอายุกี่ปี
  answer:
    value: 19
    unit: ปี
  misconceptions:
  - match: 18
    feedback: 18 ปีเป็นเกณฑ์บรรลุนิติภาวะตามกฎหมายบางเรื่อง ไม่ใช่นิยามวัยรุ่นของ WHO
  - match: 24
    feedback: 10–24 ปีเป็นกลุ่มวัยรุ่นและคนหนุ่มสาวรวมกัน
  hints:
  - ช่วงนี้ยาว 10 ปี
  - เริ่มที่ 10 ปี
  solution: WHO กำหนดวัยรุ่นคืออายุ 10–19 ปี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.adolescence.p007
  topics:
  - health.growth.adolescence
  difficulty: 3
  type: mcq
  stem: ญาติผู้ใหญ่บอกเก่ง นักเรียนชาย ม.2 ที่ร้องไห้หลังทีมแพ้ว่า "ผู้ชายร้องไห้ไม่ได้" การวิเคราะห์ข้อใดเหมาะสมที่สุด
  choices:
  - id: a
    text: เป็นความคาดหวังตามค่านิยมทางเพศ ทำให้เก็บกดอารมณ์ได้ ทุกเพศแสดงความเสียใจได้และควรหาวิธีจัดการอารมณ์ที่เหมาะ
    correct: true
  - id: b
    text: ความคาดหวังนี้ถูกเสมอ เพราะผู้ใหญ่พูด
    feedback: ความคาดหวังบางอย่างไม่สมเหตุสมผลและทำร้ายสุขภาพใจได้
  - id: c
    text: เก่งควรเลิกเล่นกีฬาเพื่อจะได้ไม่เสียใจอีก
    feedback: ไม่ได้แก้ที่ความคาดหวัง และเสียประโยชน์จากกีฬา
  - id: d
    text: เก่งควรเถียงกลับอย่างรุนแรง
    feedback: อธิบายด้วยท่าทีเคารพดีกว่าการเถียงรุนแรง
  hints:
  - ถามว่าใครคาดหวัง คาดหวังอะไร และสมเหตุสมผลไหม
  - การเก็บกดอารมณ์มีผลต่อสุขภาพจิต
  solution: ความคาดหวังว่าผู้ชายห้ามร้องไห้มาจากค่านิยมทางเพศ ทำให้ไม่กล้าแสดงความรู้สึกและเก็บกด การร้องไห้เป็นการแสดงอารมณ์ปกติของทุกเพศ เก่งเลือกรับมือได้ เช่น อธิบายความรู้สึกอย่างสุภาพ หรือคุยกับคนที่เข้าใจ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.adolescence.p008
  topics:
  - health.growth.adolescence
  difficulty: 3
  type: numeric
  stem: ปลื้ม อายุ 14 ปี เข้านอนเวลา 23:30 น. และตื่นเวลา 06:00 น. ทุกวันเรียน ถ้าต้องการนอนอย่างน้อย 8 ชั่วโมงตามคำแนะนำสำหรับอายุ 13–17 ปี ปลื้มนอนขาดไปกี่ชั่วโมงต่อคืน
  answer:
    value: 1.5
    tolerance: 0.05
    unit: ชั่วโมง
  misconceptions:
  - match: 6.5
    feedback: นี่คือเวลานอนจริง คำถามถามเวลาที่ขาด
  - match: 2.5
    feedback: นับเวลาผิด จาก 23:30 ถึง 06:00 คือ 6 ชั่วโมงครึ่ง
  hints:
  - นับเวลาจาก 23:30 ถึงเที่ยงคืนก่อน แล้วต่อถึง 06:00
  - นำ 8 ชั่วโมงลบด้วยเวลานอนจริง
  solution: เวลานอนจริง $0.5 + 6 = 6.5$ ชั่วโมง ขาดไป $8 - 6.5 = 1.5$ ชั่วโมง ฮอร์โมนการนอนของวัยรุ่นหลั่งช้า จึงควรปิดจอก่อนนอนและเข้านอนให้เร็วขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.adolescence.p009
  topics:
  - health.growth.adolescence
  difficulty: 3
  type: mcq
  stem: ดูโฆษณาสมมติในภาพ ข้อความหรือเทคนิคใดเป็น **สัญญาณของโฆษณาเกินจริง** (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: อ้างว่าสูงเพิ่มได้แม้หยุดสูงแล้ว
    correct: true
    feedback: ถูก เมื่อแผ่นการเจริญเติบโตปิดแล้วจะไม่สูงขึ้นอีก
  - id: b
    text: สัญญาว่าเห็นผลมากในเวลาสั้น
    correct: true
    feedback: ถูก
  - id: c
    text: ใช้ภาพก่อนและหลังและคนดังรีวิว
    correct: true
    feedback: ถูก ภาพตัดต่อได้และคนดังได้รับค่าจ้าง
  - id: d
    text: เร่งให้ซื้อด้วยส่วนลดวันนี้
    correct: true
    feedback: ถูก เป็นเทคนิคเร่งการตัดสินใจ
  - id: e
    text: ระบุว่าเป็นโฆษณาสมมติ ไม่ใช่สินค้าจริง
    feedback: ข้อความนี้ใส่ไว้เพื่อบอกว่าภาพนี้ใช้ฝึกวิเคราะห์ ไม่ใช่เทคนิคของโฆษณา
  hints:
  - 'ใช้ขั้นที่ 2 ของการวิเคราะห์โฆษณา: เทคนิคจูงใจ'
  - ร่างกายสูงได้เฉพาะช่วงที่แผ่นการเจริญเติบโตยังไม่ปิด
  solution: สัญญาณเกินจริงมีครบทั้งการอ้างผลที่เป็นไปไม่ได้ (สูงขึ้นแม้หยุดสูงแล้ว) ผลเร็วเกินจริง ภาพก่อนและหลัง คนดังรีวิว อ้างหมอ และเร่งให้ซื้อ ควรตรวจกับกรมอนามัยหรือ อย. และปรึกษาบุคลากรสุขภาพก่อน
  figure:
    src: ad-quiz.svg
    alt: โฆษณาสมมติชื่อ สูงไว ซูเปอร์ไฮท์ ระบุว่าไม่ใช่สินค้าจริง มีภาพคนก่อนกินตัวเตี้ย และหลังกิน 30 วันตัวสูงกว่ามาก ข้อความว่า สูงเพิ่ม 10 ซม. ใน 30 วัน ทุกวัย แม้หยุดสูงแล้ว และ ดาราชื่อดังใช้จริง หมอแนะนำ ซื้อวันนี้ลด 70%
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.adolescence.p010
  topics:
  - health.growth.adolescence
  difficulty: 3
  type: order
  stem: เรียงขั้นตอนการวิเคราะห์โฆษณาเกี่ยวกับรูปร่างและการเติบโตตามที่เรียน
  items:
  - ระบุว่าใครสร้างและต้องการอะไร
  - ระบุเทคนิคจูงใจที่ใช้
  - ตรวจข้อเท็จจริงกับแหล่งที่เชื่อถือได้
  - ตัดสินใจและบอกต่ออย่างรับผิดชอบ
  hints:
  - เริ่มจากถามว่าใครได้ประโยชน์
  - ตัดสินใจเป็นขั้นสุดท้ายหลังตรวจข้อมูลแล้ว
  solution: ใครสร้างและต้องการอะไร → เทคนิคจูงใจ → ตรวจข้อเท็จจริง → ตัดสินใจ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.adolescence.p011
  topics:
  - health.growth.adolescence
  difficulty: 3
  type: mcq
  stem: ข้อใดอธิบายผลของการดูภาพที่ผ่านฟิลเตอร์และตัดต่อทุกวันต่อวัยรุ่นได้ถูกต้องที่สุด
  choices:
  - id: a
    text: อาจทำให้ไม่พอใจรูปร่างหน้าตาของตัวเองเพราะเทียบกับภาพที่ไม่ใช่ของจริง
    correct: true
  - id: b
    text: ไม่มีผลเพราะทุกคนรู้ว่าเป็นภาพแต่ง
    feedback: แม้รู้ แต่การเห็นซ้ำ ๆ ยังเปลี่ยนมาตรฐานที่เราใช้ตัดสินตัวเองได้
  - id: c
    text: ทำให้สุขภาพกายดีขึ้นเพราะมีแรงบันดาลใจ
    feedback: บางคนได้แรงบันดาลใจ แต่ภาพที่ไม่จริงมักนำไปสู่การอดอาหารหรือใช้ผลิตภัณฑ์เสี่ยง
  - id: d
    text: มีผลเฉพาะกับเพศหญิง
    feedback: ทุกเพศได้รับผล เช่น ภาพกล้ามชัดเกินจริงกดดันเพศชาย
  hints:
  - นึกถึงภาพลักษณ์ของร่างกาย
  - ภาพแต่งเป็นมาตรฐานที่คนจริงทำไม่ได้
  solution: การเทียบตัวเองกับภาพที่ผ่านฟิลเตอร์ทำให้ภาพลักษณ์ของร่างกายแย่ลงได้ในทุกเพศ ควรจำกัดเวลา เลือกติดตามบัญชีที่หลากหลาย และคุยกับคนที่ไว้ใจเมื่อรู้สึกแย่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.growth.adolescence.p012
  topics:
  - health.growth.adolescence
  difficulty: 4
  type: numeric
