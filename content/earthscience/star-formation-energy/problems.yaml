problems:
  - id: earthscience.astronomy.star-formation-energy.p001
    topics: [earthscience.astronomy.star-formation-energy]
    difficulty: 1
    type: order
    stem: "ช่วงหัวค่ำเดือนมกราคม คนไทยเห็นเนบิวลานายพรานเป็นฝ้าจาง ๆ ใต้เข็มขัดของกลุ่มดาวนายพราน ซึ่งเป็นแหล่งกำเนิดดาวฤกษ์ เรียงขั้นตอนการเกิดดาวฤกษ์มวลเท่าดวงอาทิตย์ในเนบิวลาเช่นนี้"
    items:
      - "เมฆโมเลกุลเย็นในเนบิวลาถูกบีบจนบางส่วนหนาแน่นขึ้น"
      - "แรงโน้มถ่วงชนะแรงดัน ก้อนแก๊สยุบตัวและแตกเป็นก้อนย่อย"
      - "ส่วนกลางร้อนและทึบแสง กลายเป็นดาวฤกษ์ก่อนเกิด"
      - "ดาวฤกษ์ก่อนเกิดหดตัวต่อ แกนร้อนขึ้นจนถึงราว 10 ล้านเคลวิน"
      - "ไฮโดรเจนที่แกนเริ่มหลอมเป็นฮีเลียม ดาวเข้าสู่ลำดับหลัก"
    hints:
      - "เริ่มจากสิ่งที่เย็นและเบาบางที่สุด"
      - "การหลอมนิวเคลียสเกิดหลังสุด เมื่อแกนร้อนพอ"
    solution: "เมฆโมเลกุลถูกบีบ → ยุบตัวและแตกเป็นก้อน → เป็นดาวฤกษ์ก่อนเกิด → หดตัวจนแกนร้อนราว 10 ล้าน K → เริ่มหลอมไฮโดรเจน เข้าสู่ลำดับหลัก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.star-formation-energy.p002
    topics: [earthscience.astronomy.star-formation-energy]
    difficulty: 2
    type: match
    stem: "จับคู่สภาวะกับผลที่เกิดขึ้นระหว่างการเกิดดาวฤกษ์"
    pairs:
      - { left: "ก้อนแก๊สยุบตัวด้วยแรงโน้มถ่วง", right: "พลังงานศักย์โน้มถ่วงเปลี่ยนเป็นความร้อน แกนร้อนขึ้น" }
      - { left: "แกนร้อนถึงราว 10 ล้านเคลวิน", right: "ไฮโดรเจนเริ่มหลอมเป็นฮีเลียม" }
      - { left: "แรงดันแก๊สเท่ากับแรงโน้มถ่วง", right: "ดาวหยุดหดตัว อยู่ในสมดุลอุทกสถิต" }
      - { left: "มวลน้อยกว่าราว 0.08 เท่าของดวงอาทิตย์", right: "กลายเป็นดาวแคระน้ำตาล" }
    hints:
      - "พลังงานในช่วงก่อนเกิดมาจากการหดตัว"
      - "มวลน้อยเกินไป แกนจะร้อนไม่พอ"
    solution: "การยุบตัวเปลี่ยนพลังงานโน้มถ่วงเป็นความร้อน แกนร้อนราว 10 ล้าน K เริ่มหลอมไฮโดรเจน แรงดันสมดุลแรงโน้มถ่วงจึงหยุดหด และมวลที่น้อยเกินไปกลายเป็นดาวแคระน้ำตาล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.star-formation-energy.p003
    topics: [earthscience.astronomy.star-formation-energy]
    difficulty: 2
    type: mcq
    stem: "ขณะที่ดาวฤกษ์ก่อนเกิดหดตัว ความดันที่แกน อุณหภูมิที่แกน และรัศมีของดาวเปลี่ยนอย่างไร"
    choices:
      - { id: a, text: "ความดันเพิ่ม อุณหภูมิเพิ่ม รัศมีลดลง", correct: true }
      - { id: b, text: "ความดันลด อุณหภูมิลด รัศมีลดลง", feedback: "การหดตัวอัดแก๊สให้แน่นขึ้น ความดันและอุณหภูมิจึงเพิ่ม ไม่ใช่ลด" }
      - { id: c, text: "ความดันเพิ่ม อุณหภูมิลด รัศมีเพิ่มขึ้น", feedback: "การหดตัวแปลว่ารัศมีลดลง และพลังงานโน้มถ่วงที่ปล่อยออกทำให้ร้อนขึ้น" }
      - { id: d, text: "ทุกอย่างคงที่จนเริ่มหลอมนิวเคลียส", feedback: "ช่วงก่อนเกิดดาวหดตัวต่อเนื่อง ทุกค่าจึงเปลี่ยน" }
    hints:
      - "อัดแก๊สให้ปริมาตรเล็กลง ความดันเป็นอย่างไร"
      - "พลังงานโน้มถ่วงที่ปล่อยออกครึ่งหนึ่งทำให้แก๊สร้อนขึ้น"
    solution: "การหดตัวทำให้รัศมีลดลง แก๊สถูกอัดแน่น ความดันเพิ่ม และพลังงานโน้มถ่วงที่ปล่อยออกทำให้อุณหภูมิเพิ่ม จนแกนร้อนพอจะหลอมไฮโดรเจน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.star-formation-energy.p004
    topics: [earthscience.astronomy.star-formation-energy]
    difficulty: 2
    type: mcq
    stem: "ผลรวมสุทธิของปฏิกิริยาลูกโซ่โปรตอน-โปรตอนคือข้อใด"
    choices:
      - { id: a, text: "ไฮโดรเจน-1 สี่นิวเคลียสกลายเป็นฮีเลียม-4 หนึ่งนิวเคลียส พร้อมโพซิตรอน นิวทริโน และพลังงาน", correct: true }
      - { id: b, text: "ฮีเลียมแตกตัวเป็นไฮโดรเจน", feedback: "การแตกตัวของฮีเลียมต้องใช้พลังงาน ดาวได้พลังงานจากการหลอมไฮโดรเจนเป็นฮีเลียม" }
      - { id: c, text: "ไฮโดรเจนรวมกับออกซิเจนเป็นน้ำ", feedback: "นั่นคือปฏิกิริยาเคมี ให้พลังงานน้อยกว่าการหลอมนิวเคลียสหลายล้านเท่า" }
      - { id: d, text: "ยูเรเนียมแตกตัวเป็นธาตุที่เบากว่า", feedback: "นั่นคือฟิชชันในโรงไฟฟ้านิวเคลียร์ ดาวฤกษ์ใช้ฟิวชันของไฮโดรเจน" }
    hints:
      - "ดาวฤกษ์ได้พลังงานจากฟิวชัน"
      - "ธาตุที่มีมากที่สุดในดาวคือไฮโดรเจน"
    solution: "ผลรวมคือ $4\\,{^1\\mathrm{H}} \\rightarrow {^4\\mathrm{He}} + 2e^+ + 2\\nu$ และให้พลังงานราว 26.7 MeV จากมวลที่หายไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.star-formation-energy.p005
    topics: [earthscience.astronomy.star-formation-energy]
    difficulty: 3
    type: numeric
    stem: "มวลอะตอมของ $^1\\mathrm{H}$ คือ $1.007825\\ \\mathrm{u}$ และ $^4\\mathrm{He}$ คือ $4.002603\\ \\mathrm{u}$ เมื่อ $4\\,{^1\\mathrm{H}} \\rightarrow {^4\\mathrm{He}}$ มวลหายไปกี่ u (ตอบทศนิยม 4 ตำแหน่ง)"
    answer: { value: 0.0287, tolerance: 0.0003, unit: u }
    misconceptions:
      - { match: 2.9948, feedback: "ลบมวลไฮโดรเจนเพียงอะตอมเดียว ต้องใช้ 4 อะตอม: $4 \\times 1.007825$" }
      - { match: 8.0339, feedback: "บวกมวลแทนที่จะลบ มวลที่หายไปคือมวลก่อนลบมวลหลัง" }
    hints:
      - "มวลก่อน $= 4 \\times 1.007825$"
      - "$\\Delta m =$ มวลก่อน $-\\ 4.002603$"
    solution: "$4 \\times 1.007825 = 4.031300\\ \\mathrm{u}$ $\\Delta m = 4.031300 - 4.002603 = 0.028697 \\approx 0.0287\\ \\mathrm{u}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.star-formation-energy.p006
    topics: [earthscience.astronomy.star-formation-energy]
    difficulty: 3
    type: numeric
    stem: "มวลที่หายไปจากการหลอม $4\\,{^1\\mathrm{H}} \\rightarrow {^4\\mathrm{He}}$ คือ $0.028697\\ \\mathrm{u}$ ถ้า $1\\ \\mathrm{u}$ เทียบเท่าพลังงาน $931.5\\ \\mathrm{MeV}$ ปฏิกิริยานี้ให้พลังงานกี่ MeV"
    answer: { value: 26.73, tolerance: 0.1, unit: MeV }
    misconceptions:
      - { match: 0.0000308, feedback: "นำ 0.028697 หารด้วย 931.5 ต้องคูณ" }
      - { match: 6.68, feedback: "หารด้วย 4 เป็นพลังงานต่อโปรตอนหนึ่งตัว โจทย์ถามพลังงานต่อฮีเลียมหนึ่งนิวเคลียส" }
    hints:
      - "$E = \\Delta m \\times 931.5\\ \\mathrm{MeV/u}$"
      - "$0.028697 \\times 931.5$"
    solution: "$E = 0.028697 \\times 931.5 \\approx 26.73\\ \\mathrm{MeV}$ นิวทริโนพาออกไปเพียงส่วนน้อย ที่เหลือให้ความร้อนแก่แกนดาว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.star-formation-energy.p007
    topics: [earthscience.astronomy.star-formation-energy]
    difficulty: 3
    type: mcq
    stem: "ทำไมวัฏจักรคาร์บอน–ไนโตรเจน–ออกซิเจนจึงเป็นแหล่งพลังงานหลักของดาวมวลมาก แต่ไม่ใช่ของดวงอาทิตย์"
    choices:
      - { id: a, text: "นิวเคลียส C N O มีประจุบวกมาก ต้องใช้อุณหภูมิสูงกว่า และอัตราปฏิกิริยาเพิ่มขึ้นเร็วมากเมื่อแกนร้อนขึ้น ดาวมวลมากแกนร้อนกว่าจึงใช้วัฏจักรนี้เป็นหลัก", correct: true }
      - { id: b, text: "ดวงอาทิตย์ไม่มีคาร์บอนเลย", feedback: "ดวงอาทิตย์มีคาร์บอนเล็กน้อย และได้พลังงานจากวัฏจักร CNO ราวร้อยละ 1" }
      - { id: c, text: "วัฏจักร CNO ให้พลังงานต่อฮีเลียมมากกว่าลูกโซ่ pp มาก", feedback: "ผลรวมเหมือนกันคือ 4 ¹H → ⁴He พลังงานต่อฮีเลียมจึงใกล้เคียงกัน" }
      - { id: d, text: "ดาวมวลมากมีอุณหภูมิที่แกนต่ำกว่า", feedback: "ดาวมวลมากต้องการแรงดันมากกว่าเพื่อต้านแรงโน้มถ่วง แกนจึงร้อนกว่า" }
    hints:
      - "แรงผลักไฟฟ้าระหว่างโปรตอนกับนิวเคลียสคาร์บอน (+6) มากกว่าระหว่างโปรตอนกับโปรตอน"
      - "ดาวมวลมากต้องการแรงดันมากกว่า แกนจึงร้อนกว่า"
    solution: "การรวมโปรตอนกับนิวเคลียส C N O ต้องเอาชนะแรงผลักไฟฟ้าที่มากกว่า จึงต้องการอุณหภูมิสูง แต่อัตราเพิ่มเร็วมากตามอุณหภูมิ ดาวที่มีมวลมากกว่าราว 1.3 เท่าของดวงอาทิตย์ซึ่งแกนร้อนเกินราว 17 ล้าน K จึงได้พลังงานจากวัฏจักร CNO เป็นหลัก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.star-formation-energy.p008
    topics: [earthscience.astronomy.star-formation-energy]
    difficulty: 3
    type: mcq
    stem: "ในวัฏจักรคาร์บอน–ไนโตรเจน–ออกซิเจน นิวเคลียสคาร์บอน-12 มีบทบาทใด"
    choices:
      - { id: a, text: "เป็นตัวเร่ง ถูกใช้ตอนต้นและได้คืนเมื่อจบรอบ", correct: true }
      - { id: b, text: "เป็นเชื้อเพลิงที่ถูกใช้หมดไป", feedback: "จบรอบได้ $^{12}\\mathrm{C}$ คืน เชื้อเพลิงที่ใช้หมดคือไฮโดรเจน" }
      - { id: c, text: "เป็นผลิตภัณฑ์สุดท้ายของวัฏจักร", feedback: "ผลิตภัณฑ์สุทธิคือฮีเลียม-4 ไม่ใช่คาร์บอน" }
      - { id: d, text: "ดูดกลืนพลังงานที่เกิดขึ้น", feedback: "คาร์บอนไม่ได้เก็บพลังงาน พลังงานมาจากมวลที่หายไปเมื่อไฮโดรเจนกลายเป็นฮีเลียม" }
    hints:
      - "ดูว่ารอบสุดท้ายได้อะไรคืนมา"
      - "สารที่ช่วยให้ปฏิกิริยาเกิดแต่ไม่ถูกใช้หมดเรียกว่าอะไร"
    solution: "โปรตอนรวมกับ $^{12}\\mathrm{C}$ ทีละตัวผ่าน N และ O หกขั้น สุดท้ายปล่อย $^4\\mathrm{He}$ และได้ $^{12}\\mathrm{C}$ คืน คาร์บอนจึงเป็นตัวเร่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.star-formation-energy.p009
    topics: [earthscience.astronomy.star-formation-energy]
    difficulty: 4
    type: numeric
    stem: "ดวงอาทิตย์มีกำลังส่องสว่าง $3.828 \\times 10^{26}\\ \\mathrm{W}$ ทุกวินาทีมวลของดวงอาทิตย์เปลี่ยนเป็นพลังงานกี่ $\\times 10^{9}\\ \\mathrm{kg}$ ($c = 2.998 \\times 10^8\\ \\mathrm{m/s}$)"
    answer: { value: 4.26, tolerance: 0.04, unit: "×10⁹ kg" }
    misconceptions:
      - { match: 1276851234, feedback: "หารด้วย $c$ ครั้งเดียว ต้องหารด้วย $c^2$ ตาม $E = mc^2$" }
      - { match: 3.4406e+34, feedback: "คูณด้วย $c^2$ แทนการหาร" }
    hints:
      - "พลังงานต่อวินาที $= L$ ใช้ $m = E/c^2$"
      - "$c^2 \\approx 8.988 \\times 10^{16}\\ \\mathrm{m^2/s^2}$"
    solution: "$m = \\dfrac{3.828 \\times 10^{26}}{(2.998 \\times 10^8)^2} \\approx 4.26 \\times 10^9\\ \\mathrm{kg}$ ต่อวินาที หรือราว 4.3 ล้านตันต่อวินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.star-formation-energy.p010
    topics: [earthscience.astronomy.star-formation-energy]
    difficulty: 4
    type: numeric
    stem: "วิศวกรที่ออกแบบโซลาร์ฟาร์มในไทยต้องรู้ว่าแสงอาทิตย์ที่ยอดบรรยากาศเข้มเท่าใด ดวงอาทิตย์มีกำลังส่องสว่าง $3.828 \\times 10^{26}\\ \\mathrm{W}$ พลังงานกระจายออกเป็นทรงกลมเท่ากันทุกทิศ ที่ระยะโลก $1.496 \\times 10^{11}\\ \\mathrm{m}$ ความเข้มของแสงอาทิตย์เป็นกี่ $\\mathrm{W/m^2}$"
    answer: { value: 1361, tolerance: 10, unit: W/m² }
    misconceptions:
      - { match: 5444, feedback: "ใช้พื้นที่ $\\pi d^2$ ต้องใช้พื้นที่ผิวทรงกลม $4\\pi d^2$" }
      - { match: 203624706602866, feedback: "หารด้วย $4\\pi d$ ลืมยกกำลังสองของระยะทาง" }
    hints:
      - "ความเข้ม $= \\dfrac{L}{4\\pi d^2}$"
      - "$4\\pi(1.496 \\times 10^{11})^2 \\approx 2.81 \\times 10^{23}\\ \\mathrm{m^2}$"
    solution: "$\\dfrac{3.828 \\times 10^{26}}{4\\pi(1.496 \\times 10^{11})^2} \\approx 1{,}361\\ \\mathrm{W/m^2}$ คือค่าคงตัวสุริยะที่ใช้คำนวณสมดุลพลังงานของโลก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.star-formation-energy.p011
    topics: [earthscience.astronomy.star-formation-energy]
    difficulty: 4
    type: mcq
    stem: "นักดาราศาสตร์ใช้กล้องโทรทรรศน์ที่หอดูดาวแห่งชาติบนดอยอินทนนท์วัดดาว 4 ดวง แล้วนำมาลงตำแหน่ง A–D บนแผนภาพกำลังส่องสว่างกับอุณหภูมิผิว ดาวดวงใดน่าจะเป็นดาวฤกษ์ก่อนเกิดที่ยังหดตัวอยู่"
    figure: { src: p-hr-points.svg, alt: "แผนภาพแกนนอนเป็นอุณหภูมิผิว ร้อนอยู่ทางซ้าย แกนตั้งเป็นกำลังส่องสว่างแบบลอการิทึม มีแถบลำดับหลักเฉียงจากซ้ายบนลงขวาล่าง ดาว B อยู่บนแถบลำดับหลักด้านบน อุณหภูมิราว 15,000 K สว่างราว 1,400 เท่าของดวงอาทิตย์ ดาว C อยู่บนแถบที่อุณหภูมิราว 5,800 K สว่าง 1 เท่า ดาว D อยู่บนแถบด้านล่าง อุณหภูมิราว 3,000 K สว่างราวหนึ่งในสองร้อยเท่า ดาว A อยู่เหนือแถบลำดับหลักทางขวา อุณหภูมิราว 3,800 K สว่างราว 30 เท่า" }
    choices:
