  <rect x="0" y="0" width="420" height="330" fill="#ffffff"/>
  <path d="M20,44 q42.5,-22 85.0,-6 L190,38 v42 H52 l-4,5 h-12 l-4,-5 H20 Z" fill="#f5c242" stroke="#b8860b" stroke-width="1.5" />
