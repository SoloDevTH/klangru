problems:
  - id: zh.stroke.p001
    topics: [chinese.hanzi.basic-strokes]
    difficulty: 1
    type: mcq
    stem: "ขีด 横 (héng) ลากอย่างไร"
    choices:
      - { id: a, text: "ขีดนอน ลากจากซ้ายไปขวา", correct: true, feedback: "ถูก 横 คือขีดนอน และลากจากซ้ายไปขวาเสมอ" }
      - { id: b, text: "ขีดนอน ลากจากขวาไปซ้าย", feedback: "เป็นขีดนอนถูกแล้ว แต่ทิศผิด ขีดนอนในอักษรจีนลากจากซ้ายไปขวาเสมอ" }
      - { id: c, text: "ขีดตั้ง ลากจากบนลงล่าง", feedback: "นั่นคือ 竖 (shù) ส่วน 横 คือขีดนอน" }
      - { id: d, text: "ขีดเฉียง ตวัดลงไปทางซ้าย", feedback: "นั่นคือ 撇 (piě) ส่วน 横 คือขีดนอน" }
    hints:
      - "อักษร 一 (หนึ่ง) เขียนด้วยขีด 横 ขีดเดียว"
      - "ทิศทางของขีดนอนเหมือนทิศที่เราอ่านหนังสือภาษาไทย"
    solution: "横 คือขีดนอน ลากจาก **ซ้ายไปขวา** เช่น อักษร 一"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.stroke.p002
    topics: [chinese.hanzi.basic-strokes]
    difficulty: 1
    type: hanzi
    stem: "เขียนอักษร 人 (rén) ที่แปลว่า คน ตามลำดับขีด"
    character: 人
    pinyin: rén
    meaning: คน
    max_mistakes: 3
    hints:
      - "人 มี 2 ขีด คือ 撇 กับ 捺"
      - "ตามกฎ 撇 ก่อน 捺: เริ่มจากเส้นที่ตวัดลงซ้าย แล้วจึงลากเส้นลงขวาจากกลางเส้นแรก"
    solution: "ขีดที่ 1 撇: จากบนตรงกลางตวัดลงซ้าย · ขีดที่ 2 捺: จากกลางเส้นแรกลากลงขวา รวม 2 ขีด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.stroke.p003
    topics: [chinese.hanzi.basic-strokes]
    difficulty: 1
    type: match
    stem: "จับคู่ชื่อขีดพื้นฐานกับลักษณะของขีด"
    pairs:
      - { left: "横 héng", right: "ขีดนอน ลากซ้ายไปขวา" }
      - { left: "竖 shù", right: "ขีดตั้ง ลากบนลงล่าง" }
      - { left: "撇 piě", right: "ตวัดเฉียงลงไปทางซ้าย" }
      - { left: "捺 nà", right: "ลากเฉียงลงไปทางขวา" }
      - { left: "点 diǎn", right: "จุดสั้น ๆ" }
    hints:
      - "นึกถึงอักษร 人: ขีดแรกคือ 撇 ขีดที่สองคือ 捺"
      - "อักษร 十 ประกอบด้วย 横 และ 竖 อย่างละหนึ่งขีด"
    solution: "横 ขีดนอน · 竖 ขีดตั้ง · 撇 ตวัดลงซ้าย · 捺 ลากลงขวา · 点 จุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.stroke.p004
    topics: [chinese.hanzi.basic-strokes]
    difficulty: 2
    type: hanzi
    stem: "ป้ายร้านค้าจีนหลายร้านในเยาวราชมีอักษร 大 (dà) ที่แปลว่า ใหญ่ ลองเขียนตามลำดับขีด"
    character: 大
    pinyin: dà
    meaning: ใหญ่
    max_mistakes: 3
    hints:
      - "大 มี 3 ขีด และคล้าย 人 ที่มีขีดนอนเพิ่ม"
      - "เริ่มด้วยขีดนอน (横) ก่อน แล้วเขียน 撇 ก่อน 捺 เหมือนตอนเขียน 人"
    solution: "ขีดที่ 1 横: ขีดนอนซ้ายไปขวา · ขีดที่ 2 撇: จากบนตวัดลงซ้ายผ่านขีดนอน · ขีดที่ 3 捺: จากจุดตัดลากลงขวา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.stroke.p005
    topics: [chinese.hanzi.basic-strokes]
    difficulty: 2
    type: numeric
    stem: "อักษร 口 (kǒu ปาก) มีกี่ขีด"
    answer: { value: 3, unit: ขีด }
    hints:
      - "ขีดที่หักมุมโดยไม่ยกปากกานับเป็นขีดเดียว"
      - "ด้านบนกับด้านขวาของ 口 ลากต่อกันเป็น 横折"
    misconceptions:
      - { match: 4, feedback: "ดูเหมือนนับแต่ละด้านของสี่เหลี่ยมเป็นหนึ่งขีด แต่ด้านบนกับด้านขวาลากต่อกันเป็น 横折 ขีดเดียว" }
    solution: "口 มี **3 ขีด**: 竖 (ด้านซ้าย) → 横折 (ด้านบนหักลงเป็นด้านขวา) → 横 (ด้านล่าง ปิดกรอบ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.stroke.p006
    topics: [chinese.hanzi.basic-strokes]
    difficulty: 2
    type: hanzi
    stem: "เขียนอักษร 口 (kǒu) ที่แปลว่า ปาก ตามลำดับขีด"
    character: 口
    pinyin: kǒu
    meaning: ปาก
    max_mistakes: 3
    hints:
      - "口 มี 3 ขีด ด้านบนกับด้านขวาเป็นขีดเดียวกัน"
      - "เริ่มจากด้านซ้าย แล้วลากด้านบนต่อลงด้านขวาโดยไม่ยกปากกา ปิดกรอบด้วยด้านล่างเป็นขีดสุดท้าย"
    solution: "ขีดที่ 1 竖: ด้านซ้าย บนลงล่าง · ขีดที่ 2 横折: ด้านบนซ้ายไปขวาแล้วหักลง · ขีดที่ 3 横: ด้านล่าง ซ้ายไปขวา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.stroke.p007
    topics: [chinese.hanzi.basic-strokes]
    difficulty: 3
    type: order
    stem: "เรียงลำดับขีดของอักษร 木 (mù ต้นไม้) ให้ถูกต้อง"
    items:
      - "横: ขีดนอน"
      - "竖: ขีดตั้งตรงกลาง"
      - "撇: ตวัดลงซ้าย"
      - "捺: ลากลงขวา"
    hints:
      - "木 ประกอบด้วยขีดนอนและขีดตั้งที่ตัดกันเหมือน 十 แล้วมีขาสองข้าง"
      - "ใช้กฎ 横 ก่อน 竖 และ 撇 ก่อน 捺"
    solution: "横 → 竖 → 撇 → 捺 (ส่วนบนเขียนแบบ 十 คือ 横 ก่อน 竖 แล้วเขียนขาซ้าย 撇 ก่อนขาขวา 捺)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.stroke.p008
    topics: [chinese.hanzi.basic-strokes]
    difficulty: 3
    type: mcq
    stem: "อักษร 日 (rì ดวงอาทิตย์ วัน) มี 4 ขีด ขีดใดเป็นขีดสุดท้าย"
    choices:
      - { id: a, text: "ขีดนอนด้านล่างที่ปิดกรอบ", correct: true, feedback: "ถูก ตามกฎเข้าบ้านก่อนปิดประตู ขีดข้างในต้องเขียนก่อนปิดกรอบ" }
      - { id: b, text: "ขีดนอนตรงกลาง", feedback: "ขีดนอนตรงกลางอยู่ข้างในกรอบ จึงเขียนก่อนปิดกรอบ มันเป็นขีดที่ 3 ไม่ใช่ขีดสุดท้าย" }
      - { id: c, text: "ขีดตั้งด้านซ้าย", feedback: "ขีดตั้งด้านซ้ายเป็นขีดแรก ไม่ใช่ขีดสุดท้าย" }
      - { id: d, text: "ขีดนอนด้านบนที่หักลงเป็นด้านขวา (横折)", feedback: "横折 เป็นขีดที่ 2 ต่อจากขีดตั้งด้านซ้าย" }
    hints:
      - "日 เริ่มเหมือน 口 คือ 竖 แล้ว 横折"
      - "นึกถึงกฎเข้าบ้านก่อนปิดประตู: ของข้างในต้องเข้าไปก่อนจึงปิดกรอบ"
    solution: "ลำดับของ 日: 竖 (ซ้าย) → 横折 (บนหักลงขวา) → 横 (กลาง) → 横 (ล่าง ปิดกรอบ) ขีดสุดท้ายจึงเป็นขีดนอนด้านล่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.stroke.p009
    topics: [chinese.hanzi.basic-strokes]
    difficulty: 3
    type: hanzi
    stem: "ดอยอินทนนท์เป็นภูเขาที่สูงที่สุดในประเทศไทย ภาษาจีนเรียกภูเขาว่า 山 (shān) ลองเขียนตามลำดับขีด"
    character: 山
    pinyin: shān
    meaning: ภูเขา
    max_mistakes: 3
    hints:
      - "山 มี 3 ขีด ขีดล่างซ้ายเป็นขีดหักมุม (竖折) ที่นับเป็นขีดเดียว"
      - "ใช้กฎกลางก่อนสองข้าง: เขียนยอดกลางก่อน แล้วจึงเขียนด้านซ้ายที่หักไปเป็นฐาน และจบด้วยด้านขวา"
    solution: "ขีดที่ 1 竖: ยอดกลาง บนลงล่าง · ขีดที่ 2 竖折: ด้านซ้ายลงแล้วหักไปทางขวาเป็นฐาน · ขีดที่ 3 竖: ด้านขวา บนลงล่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.stroke.p010
    topics: [chinese.hanzi.basic-strokes]
    difficulty: 4
    type: numeric
    stem: "โรงเรียนหลายแห่งในไทยเปิดสอนวิชาภาษาจีน (中文) อักษร 中 (zhōng กลาง) ประกอบด้วยกรอบคล้าย 口 กับขีดตั้งยาวผ่านกลาง 中 มีกี่ขีด"
    answer: { value: 4, unit: ขีด }
    hints:
      - "นับส่วนกรอบก่อน แล้วบวกขีดตั้งตรงกลาง"
      - "กรอบแบบ 口 มีขีดหักมุม 横折 ซึ่งนับเป็นขีดเดียว"
    misconceptions:
      - { match: 5, feedback: "ดูเหมือนนับ 横折 (ด้านบนกับด้านขวา) เป็นสองขีด ขีดที่หักมุมโดยไม่ยกปากกานับเป็นขีดเดียว" }
      - { match: 3, feedback: "นั่นคือจำนวนขีดของกรอบอย่างเดียว อย่าลืมขีดตั้งยาวที่ผ่านกลาง" }
    solution: "กรอบ 3 ขีด (竖 → 横折 → 横) + ขีดตั้งกลาง 1 ขีด (เขียนเป็นขีดสุดท้าย) รวม **4 ขีด**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.stroke.p011
    topics: [chinese.hanzi.basic-strokes]
    difficulty: 4
    type: mcq
    stem: "อักษร 小 (xiǎo เล็ก) เขียนขีดตั้งตรงกลาง (竖钩) ก่อน แล้วจึงเขียนจุดซ้ายและจุดขวา ลำดับนี้เป็นไปตามกฎข้อใด"
    choices:
      - { id: a, text: "กลางก่อนสองข้าง (先中间后两边)", correct: true, feedback: "ถูก ส่วนกลางเขียนก่อน แล้วจึงเขียนส่วนที่อยู่สองข้าง" }
      - { id: b, text: "ซ้ายไปขวา (从左到右)", feedback: "ถ้าใช้กฎนี้ จุดซ้ายจะต้องมาก่อนขีดกลาง แต่ 小 เขียนขีดกลางก่อน" }
      - { id: c, text: "นอกก่อนใน (从外到内)", feedback: "กฎนี้ใช้กับอักษรที่มีกรอบล้อม 小 ไม่มีกรอบ" }
      - { id: d, text: "ขีดนอนก่อนขีดตั้ง (先横后竖)", feedback: "小 ไม่มีขีดนอนเลย กฎนี้จึงไม่เกี่ยว" }
    hints:
      - "ดูตำแหน่งของขีดที่เขียนก่อนเทียบกับขีดที่เขียนทีหลัง"
      - "ขีดแรกอยู่ตรงกลาง ส่วนสองขีดหลังอยู่ด้านข้าง"
    solution: "小 เขียน 竖钩 ตรงกลางก่อน แล้วจึงจุดซ้ายและจุดขวา เป็นไปตามกฎ **กลางก่อนสองข้าง** อักษร 水 ก็ใช้กฎเดียวกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.stroke.p012
    topics: [chinese.hanzi.basic-strokes]
    difficulty: 5
    type: order
    stem: "อักษร 田 (tián นา) มี 5 ขีด เรียงลำดับขีดให้ถูกต้อง"
    items:
      - "ขีดตั้งด้านซ้าย"
      - "ขีดนอนด้านบนที่หักลงเป็นด้านขวา (横折)"
      - "ขีดนอนตรงกลาง"
      - "ขีดตั้งตรงกลาง"
      - "ขีดนอนด้านล่างที่ปิดกรอบ"
    hints:
      - "田 เริ่มเหมือน 口 และ 日"
      - "ข้างในกรอบเป็นรูป 十 ใช้กฎ 横 ก่อน 竖"
      - "ใช้กฎเข้าบ้านก่อนปิดประตู: ขีดข้างในทั้งหมดต้องเขียนก่อนปิดกรอบ"
    solution: "竖 (ซ้าย) → 横折 (บนหักลงขวา) → 横 (กลาง) → 竖 (กลาง) → 横 (ล่าง ปิดกรอบ) ใช้สามกฎร่วมกัน: นอกก่อนใน, 横 ก่อน 竖 และเข้าบ้านก่อนปิดประตู"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.stroke.p013
    topics: [chinese.hanzi.basic-strokes]
    difficulty: 5
    type: hanzi
    stem: "เขียนอักษร 水 (shuǐ) ที่แปลว่า น้ำ ตามลำดับขีด (ข้อนี้ผิดได้ไม่เกิน 2 ครั้ง)"
    character: 水
    pinyin: shuǐ
    meaning: น้ำ
    max_mistakes: 2
    hints:
      - "水 มี 4 ขีด และเริ่มด้วยขีดตั้งตรงกลางที่มีขอเกี่ยว (竖钩) ตามกฎกลางก่อนสองข้าง"
      - "ด้านซ้ายเป็นขีดนอนสั้นที่หักเฉียงลง (横撇) จากนั้นด้านขวาเขียน 撇 ก่อน 捺"
    solution: "ขีดที่ 1 竖钩: ขีดตั้งกลาง ปลายเกี่ยวไปทางซ้าย · ขีดที่ 2 横撇: ด้านซ้าย ขีดนอนสั้นแล้วหักเฉียงลงซ้าย · ขีดที่ 3 撇: ด้านขวาบน ตวัดลงซ้าย · ขีดที่ 4 捺: ด้านขวาล่าง ลากลงขวา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.stroke.p014
    topics: [chinese.hanzi.basic-strokes]
    difficulty: 1
    type: mcq
    stem: "ขีด 提 (tí) ลากไปทิศใด"
    choices:
      - { id: a, text: "จากล่างซ้ายตวัดขึ้นไปขวาบน", correct: true, feedback: "ถูก 提 เป็นขีดเดียวในกลุ่มขีดพื้นฐานที่ลากขึ้น" }
      - { id: b, text: "จากบนขวาตวัดลงไปซ้ายล่าง", feedback: "นั่นคือ 撇 ซึ่งตวัดลง ส่วน 提 ตวัดขึ้น" }
      - { id: c, text: "จากบนซ้ายลากลงไปขวาล่าง", feedback: "นั่นคือ 捺" }
      - { id: d, text: "จากซ้ายไปขวาในแนวนอน", feedback: "นั่นคือ 横" }
    hints:
      - "ขีดเกือบทุกแบบลากจากบนลงล่างหรือซ้ายไปขวา มีขีดเดียวที่ลากขึ้น"
      - "提 พบที่ด้านซ้ายล่างของ 地 ปลายชี้ขึ้นไปทางขวา"
    solution: "提 (ขีดตวัดขึ้น) เริ่มที่ซ้ายล่าง ตวัดเฉียง **ขึ้นไปทางขวา** มักอยู่ด้านซ้ายของอักษรเพื่อส่งปากกาไปยังส่วนขวา เช่น 地 และ 打"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: zh.stroke.p015
    topics: [chinese.hanzi.basic-strokes]
    difficulty: 2
    type: hanzi
    stem: "ป้ายร้านอาหารจีนหลายร้านมีคำว่า 天天 (ทุกวัน) ลองเขียนอักษร 天 (tiān) ที่แปลว่า ฟ้า หรือ วัน ตามลำดับขีด"
    character: 天
    pinyin: tiān
    meaning: ฟ้า วัน
    max_mistakes: 3
    hints:
      - "天 มี 4 ขีด เริ่มจากขีดนอนสั้นด้านบน"
      - "หลังขีดนอนสองขีด ให้เขียน 撇 ก่อน 捺 เหมือน 大"
    solution: "横 (บน สั้น) → 横 (ยาว) → 撇 (เริ่มที่ขีดนอนบน ตวัดลงซ้าย) → 捺 (ลากลงขวา) รวม 4 ขีด"
    license: CC-BY-SA-4.0
    ai_assisted: true

