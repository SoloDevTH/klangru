<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="sans-serif">
<title>ผู้เห็นเหตุการณ์ทำอะไรได้บ้าง</title>
<rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">ผู้เห็นเหตุการณ์ช่วยหยุดการกลั่นแกล้งได้</text>
<rect x="15.0" y="55.0" width="140.0" height="150.0" rx="8" fill="#fadbd8" stroke="#333" stroke-width="1.5"/>
<text x="85.0" y="85.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ไม่ร่วมวง</text>
<text x="85.0" y="120.0" font-size="12.5" text-anchor="middle" fill="#111">ไม่หัวเราะ</text>
<text x="85.0" y="144.0" font-size="12.5" text-anchor="middle" fill="#111">ไม่กดถูกใจ</text>
<text x="85.0" y="168.0" font-size="12.5" text-anchor="middle" fill="#111">ไม่ส่งต่อ</text>
<rect x="164.0" y="55.0" width="140.0" height="150.0" rx="8" fill="#fcf3cf" stroke="#333" stroke-width="1.5"/>
<text x="234.0" y="85.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">เบี่ยงเหตุการณ์</text>
<text x="234.0" y="120.0" font-size="12.5" text-anchor="middle" fill="#111">&quot;ครูเรียกเธอแน่ะ&quot;</text>
<text x="234.0" y="144.0" font-size="12.5" text-anchor="middle" fill="#111">พาเพื่อนออกมา</text>
<rect x="313.0" y="55.0" width="140.0" height="150.0" rx="8" fill="#d5f5e3" stroke="#333" stroke-width="1.5"/>
<text x="383.0" y="85.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">อยู่ข้างผู้ถูกกระทำ</text>
<text x="383.0" y="120.0" font-size="12.5" text-anchor="middle" fill="#111">ส่งข้อความให้กำลังใจ</text>
<text x="383.0" y="144.0" font-size="12.5" text-anchor="middle" fill="#111">ช่วยเก็บหลักฐาน</text>
<rect x="462.0" y="55.0" width="140.0" height="150.0" rx="8" fill="#d6eaf8" stroke="#333" stroke-width="1.5"/>
<text x="532.0" y="85.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ชวนให้หยุด</text>
<text x="532.0" y="120.0" font-size="12.5" text-anchor="middle" fill="#111">&quot;พอแล้ว ไม่ตลก&quot;</text>
<text x="532.0" y="144.0" font-size="12.5" text-anchor="middle" fill="#111">พูดสั้น ไม่ยั่วยุ</text>
<rect x="611.0" y="55.0" width="140.0" height="150.0" rx="8" fill="#e8daef" stroke="#333" stroke-width="1.5"/>
<text x="681.0" y="85.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">แจ้งผู้ใหญ่</text>
<text x="681.0" y="120.0" font-size="12.5" text-anchor="middle" fill="#111">ครู ผู้ปกครอง</text>
<text x="681.0" y="144.0" font-size="12.5" text-anchor="middle" fill="#111">191 ถ้ามีอันตราย</text>
<rect x="15.0" y="225.0" width="730.0" height="50.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="380.0" y="256.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#922b21">ห้ามเข้าไปแยกคนที่ต่อสู้หรือมีอาวุธด้วยตัวเอง ความปลอดภัยของเรามาก่อนเสมอ</text>
</svg>
