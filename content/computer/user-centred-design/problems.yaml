    choices:
      - { id: a, text: "ผู้ที่แยกสีแดงกับสีเขียวไม่ได้จะไม่รู้ว่าเมนูใดหมด ควรเพิ่มข้อความ หมดแล้ว หรือทำให้เมนูนั้นจางลง", correct: true }
      - { id: b, text: "สีแดงกับเขียวไม่สวย ควรเปลี่ยนเป็นสีชมพูกับฟ้า", feedback: "ปัญหาไม่ได้อยู่ที่ความสวย ถ้ายังใช้สีอย่างเดียวบอกความหมาย ผู้ที่แยกสีไม่ได้ก็ยังมีปัญหา" }
      - { id: c, text: "ไม่มีปัญหา เพราะทุกคนรู้ว่าสีแดงแปลว่าหยุด", feedback: "คนจำนวนหนึ่งแยกสีแดงกับเขียวได้ยาก สีอย่างเดียวจึงไม่พอ" }
      - { id: d, text: "ควรเอาเมนูที่หมดออกจากระบบถาวร", feedback: "เมนูอาจกลับมามีพรุ่งนี้ ปัญหาคือการบอกสถานะที่ทุกคนเข้าใจ" }
    hints:
