problems:
  - id: phy.force.p001
    topics: [physics.dynamics.forces]
    difficulty: 1
    type: mcq
    stem: "หน่วยของแรงในระบบ SI คือหน่วยใด"
    choices:
      - { id: a, text: "นิวตัน ($\\mathrm{N}$)", correct: true }
      - { id: b, text: "กิโลกรัม ($\\mathrm{kg}$)", feedback: "กิโลกรัมเป็นหน่วยของมวล บอกว่าวัตถุมีเนื้อสารมากเท่าใด ส่วนแรงคือการดึงหรือผลัก ใช้หน่วยนิวตัน" }
      - { id: c, text: "เมตรต่อวินาทีกำลังสอง ($\\mathrm{m/s^2}$)", feedback: "นั่นเป็นหน่วยของความเร่ง นิวตันสร้างจากหน่วยนี้คูณกับกิโลกรัม: $1\\ \\mathrm{N} = 1\\ \\mathrm{kg \\cdot m/s^2}$" }
      - { id: d, text: "นิวตันต่อกิโลกรัม ($\\mathrm{N/kg}$)", feedback: "นั่นเป็นหน่วยของแรงต่อมวลหนึ่งกิโลกรัม (เช่น ความแรงของสนามโน้มถ่วง) ไม่ใช่หน่วยของแรงเอง" }
    hints:
      - "หน่วยนี้ตั้งชื่อตามนักวิทยาศาสตร์ผู้เสนอกฎการเคลื่อนที่ 3 ข้อ"
      - "แยกให้ออกระหว่างหน่วยของมวล หน่วยของความเร่ง และหน่วยของแรง"
    solution: "หน่วยของแรงในระบบ SI คือนิวตัน ($\\mathrm{N}$) เป็นหน่วยอนุพันธ์ โดย $1\\ \\mathrm{N} = 1\\ \\mathrm{kg \\cdot m/s^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.force.p002
    topics: [physics.dynamics.forces]
    difficulty: 1
    type: numeric
    stem: "พี่กับน้องช่วยกันเข็นรถยนต์ที่น้ำมันหมดไปข้างหน้า พี่ดันด้วยแรง $30\\ \\mathrm{N}$ น้องดันด้วยแรง $45\\ \\mathrm{N}$ ทั้งสองดันไปทางเดียวกัน แรงลัพธ์ที่ทั้งสองคนกระทำต่อรถมีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 75, unit: N }
    hints:
      - "แรงทั้งสองชี้ไปทางเดียวกัน ให้ทิศข้างหน้าเป็นบวก"
      - "แรงที่มีเครื่องหมายเดียวกันนำมาบวกกันได้เลย"
    misconceptions:
      - { match: 15, feedback: "ดูเหมือนนำแรงมาลบกัน แต่ทั้งสองคนดันไปทางเดียวกัน แรงจึงเสริมกัน ต้องบวกกัน" }
    solution: "ให้ทิศข้างหน้าเป็นบวก: $F_\\text{net} = (+30\\ \\mathrm{N}) + (+45\\ \\mathrm{N}) = +75\\ \\mathrm{N}$ แรงลัพธ์มีขนาด $75\\ \\mathrm{N}$ ทิศไปข้างหน้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.force.p003
    topics: [physics.dynamics.forces]
    difficulty: 2
    type: numeric
    stem: "ในการชักเย่อวันกีฬาสี ทีมสีแดงดึงเชือกไปทางซ้ายด้วยแรงรวม $1250\\ \\mathrm{N}$ ทีมสีน้ำเงินดึงไปทางขวาด้วยแรงรวม $1180\\ \\mathrm{N}$ แรงลัพธ์ที่กระทำต่อเชือกมีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 70, unit: N }
    hints:
      - "แรงของสองทีมชี้ไปคนละทาง ต้องเลือกทิศหนึ่งเป็นบวกก่อน"
      - "ให้ทางซ้ายเป็นบวก แรงของทีมสีน้ำเงินจะมีเครื่องหมายลบ แล้วรวมแรงทั้งสอง"
    misconceptions:
      - { match: 2430, feedback: "ดูเหมือนบวกขนาดของสองแรงเข้าด้วยกัน แต่สองทีมดึงไปคนละทาง แรงจึงหักล้างกันบางส่วน ต้องใส่เครื่องหมายตามทิศก่อนรวม" }
      - { match: -70, feedback: "โจทย์ถามขนาดของแรงลัพธ์ ซึ่งเป็นค่าบวกเสมอ เครื่องหมายลบบอกเพียงทิศ (ในกรณีนี้คือทางซ้ายถ้าให้ทางขวาเป็นบวก)" }
    solution: "ให้ทางซ้ายเป็นบวก: $F_\\text{net} = (+1250\\ \\mathrm{N}) + (-1180\\ \\mathrm{N}) = +70\\ \\mathrm{N}$ แรงลัพธ์มีขนาด $70\\ \\mathrm{N}$ ทิศซ้าย เชือกจึงเคลื่อนไปทางทีมสีแดง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.force.p004
    topics: [physics.dynamics.forces]
    difficulty: 2
    type: match
    stem: "จับคู่ชื่อแรงกับลักษณะของแรงนั้น"
    pairs:
      - { left: "น้ำหนัก (แรงโน้มถ่วง)", right: "โลกดึงวัตถุลงในแนวดิ่ง" }
      - { left: "แรงตั้งฉาก", right: "ผิวที่วัตถุวางอยู่ดันวัตถุในแนวตั้งฉากกับผิว" }
      - { left: "แรงตึง", right: "เชือกที่ตึงดึงวัตถุไปตามแนวเชือก" }
      - { left: "แรงเสียดทาน", right: "ผิวสัมผัสต้านการไถล ขนานกับผิว" }
      - { left: "แรงต้านอากาศ", right: "อากาศต้านวัตถุที่เคลื่อนที่ผ่าน" }
    hints:
      - "นึกถึงว่าแรงแต่ละแรงมาจากสิ่งใด: โลก ผิวที่รองรับ เชือก หรืออากาศ"
      - "แรงตั้งฉากกับแรงเสียดทานมาจากผิวสัมผัสเดียวกัน แต่แรงหนึ่งตั้งฉากกับผิว อีกแรงหนึ่งขนานกับผิว"
    solution: "น้ำหนักคือแรงที่โลกดึงวัตถุลง · แรงตั้งฉากคือแรงที่ผิวดันวัตถุในแนวตั้งฉาก · แรงตึงคือแรงที่เชือกดึงตามแนวเชือก · แรงเสียดทานคือแรงที่ผิวต้านการไถลในแนวขนานกับผิว · แรงต้านอากาศคือแรงที่อากาศต้านการเคลื่อนที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.force.p005
    topics: [physics.dynamics.forces]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "แรงใดต่อไปนี้เป็นแรงไม่สัมผัส คือกระทำได้แม้วัตถุไม่แตะกัน (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "แรงที่โลกดึงมะม่วงที่กำลังหล่นจากต้น", correct: true }
      - { id: b, text: "แรงที่แม่เหล็กดูดคลิปหนีบกระดาษจากระยะ 1 เซนติเมตร", correct: true }
      - { id: c, text: "แรงที่หวีซึ่งถูกับผมแล้วดูดเศษกระดาษชิ้นเล็ก ๆ", correct: true }
      - { id: d, text: "แรงเสียดทานที่พื้นต้านรองเท้าขณะเดิน", feedback: "แรงเสียดทานเกิดที่ผิวที่แตะกัน ถ้ารองเท้าไม่แตะพื้นก็ไม่มีแรงเสียดทาน จึงเป็นแรงสัมผัส" }
      - { id: e, text: "แรงตึงของเชือกที่ใช้แขวนโคมไฟ", feedback: "เชือกต้องผูกติดกับโคมไฟจึงจะดึงได้ แรงตึงจึงเป็นแรงสัมผัส" }
    hints:
      - "ถามตัวเองว่า ถ้าแยกสองสิ่งออกจากกันเล็กน้อย แรงยังมีอยู่หรือไม่"
      - "แรงโน้มถ่วง แรงแม่เหล็ก และแรงไฟฟ้า กระทำผ่านระยะทางได้"
    solution: "แรงไม่สัมผัสได้แก่แรงโน้มถ่วง (โลกดึงมะม่วง) แรงแม่เหล็ก (แม่เหล็กดูดคลิป) และแรงไฟฟ้า (หวีที่มีประจุดูดกระดาษ) ส่วนแรงเสียดทานและแรงตึงเกิดได้เมื่อวัตถุแตะกันเท่านั้น จึงเป็นแรงสัมผัส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.force.p006
    topics: [physics.dynamics.forces]
    difficulty: 3
    type: numeric
    stem: "เรือหางยาวแล่นในแม่น้ำเจ้าพระยา เครื่องยนต์ดันเรือไปข้างหน้าด้วยแรง $900\\ \\mathrm{N}$ น้ำต้านเรือด้วยแรง $650\\ \\mathrm{N}$ และลมพัดปะทะด้านหน้าเรือด้วยแรง $150\\ \\mathrm{N}$ ทุกแรงอยู่ในแนวการเคลื่อนที่ แรงลัพธ์ที่กระทำต่อเรือในแนวนี้มีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 100, unit: N }
    hints:
      - "แรงใดชี้ไปข้างหน้า แรงใดชี้ไปข้างหลัง ลมที่ปะทะด้านหน้าดันเรือไปทางใด"
      - "ให้ทิศข้างหน้าเป็นบวก แรงต้านของน้ำและแรงลมจะมีเครื่องหมายลบ"
      - "รวมแรงทั้งสามพร้อมเครื่องหมาย"
    misconceptions:
      - { match: 1700, feedback: "ดูเหมือนบวกขนาดของทุกแรงเข้าด้วยกัน แรงต้านของน้ำและแรงลมชี้ไปข้างหลัง ต้องใส่เครื่องหมายลบ" }
      - { match: 250, feedback: "ดูเหมือนลืมแรงลมที่ปะทะด้านหน้าเรือ ต้องนับทุกแรงในแนวการเคลื่อนที่" }
    solution: "ให้ทิศข้างหน้าเป็นบวก: $F_\\text{net} = (+900) + (-650) + (-150) = +100\\ \\mathrm{N}$ แรงลัพธ์มีขนาด $100\\ \\mathrm{N}$ ทิศไปข้างหน้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.force.p007
    topics: [physics.dynamics.forces]
    difficulty: 3
    type: mcq
    stem: "หนังสือวางนิ่งอยู่บนโต๊ะ แผนภาพแรง (free-body diagram) ของ **หนังสือ** ควรมีแรงใดบ้าง"
    choices:
      - { id: a, text: "น้ำหนักของหนังสือชี้ลง และแรงตั้งฉากที่โต๊ะดันหนังสือชี้ขึ้น", correct: true }
      - { id: b, text: "น้ำหนักชี้ลง แรงตั้งฉากชี้ขึ้น และแรงที่หนังสือกดโต๊ะชี้ลง", feedback: "แรงที่หนังสือกดโต๊ะกระทำต่อโต๊ะ ไม่ได้กระทำต่อหนังสือ แผนภาพแรงของหนังสือจึงไม่ใส่แรงนี้" }
      - { id: c, text: "น้ำหนักชี้ลงเพียงแรงเดียว", feedback: "โต๊ะแตะหนังสืออยู่ จึงต้องมีแรงสัมผัสจากโต๊ะด้วย ถ้ามีแต่น้ำหนัก หนังสือจะตกลงไป" }
      - { id: d, text: "ไม่มีแรงใดเลย เพราะหนังสืออยู่นิ่ง", feedback: "วัตถุที่อยู่นิ่งก็มีแรงกระทำ แต่แรงเหล่านั้นสมดุลกันจนแรงลัพธ์เป็นศูนย์" }
    hints:
      - "เริ่มจากแรงไม่สัมผัสที่กระทำต่อทุกวัตถุใกล้ผิวโลก"
      - "แล้วไล่ดูว่ามีสิ่งใดแตะหนังสือบ้าง แต่ละสิ่งให้แรงต่อหนังสืออย่างไร"
    solution: "แรงที่กระทำต่อหนังสือมีสองแรง คือน้ำหนัก (โลกดึงหนังสือลง) และแรงตั้งฉาก (โต๊ะดันหนังสือขึ้น) แรงที่หนังสือกดโต๊ะเป็นแรงที่กระทำต่อโต๊ะ จึงไม่อยู่ในแผนภาพแรงของหนังสือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.force.p008
    topics: [physics.dynamics.forces]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการวาดแผนภาพแรงแล้วหาแรงลัพธ์ของกล่องที่ถูกดึงบนพื้นให้ถูกต้อง"
    items:
      - "เลือกกล่องเป็นวัตถุที่สนใจ แล้ววาดแยกออกมาเป็นกล่องเล็ก ๆ"
      - "วาดน้ำหนักของกล่องชี้ลง"
      - "ไล่ดูสิ่งที่แตะกล่อง แล้ววาดแรงตั้งฉาก แรงตึงเชือก และแรงเสียดทาน"
      - "เลือกทิศบวก แล้วใส่เครื่องหมายให้แต่ละแรง"
      - "รวมแรงพร้อมเครื่องหมายเพื่อหาแรงลัพธ์"
    hints:
      - "ต้องรู้ก่อนว่าวัตถุที่สนใจคืออะไร จึงจะรู้ว่าแรงใดกระทำต่อมัน"
      - "วาดแรงให้ครบก่อน แล้วจึงตั้งทิศบวกและรวมแรง"
    solution: "แยกวัตถุ → วาดน้ำหนัก (แรงไม่สัมผัส) → วาดแรงสัมผัสจากทุกสิ่งที่แตะกล่อง → เลือกทิศบวกและใส่เครื่องหมาย → รวมแรงเป็นแรงลัพธ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.force.p009
    topics: [physics.dynamics.forces]
    difficulty: 3
    type: expression
    stem: "กล่องบนพื้นถูกดึงไปทางขวาด้วยแรง $F$ พื้นให้แรงเสียดทาน $f$ ทิศซ้าย และเด็กคนหนึ่งดันกล่องไปทางซ้ายด้วยแรง $P$ (ทุกตัวแปรเป็นขนาดของแรง) ให้ทางขวาเป็นบวก เขียนแรงลัพธ์ในแนวราบในรูปของ $F$, $f$ และ $P$"
    prefix: "F_\\text{net} ="
    answer: { latex: "F - f - P", variables: [F, f, P] }
    hints:
      - "แรงที่ชี้ทางขวามีเครื่องหมายบวก แรงที่ชี้ทางซ้ายมีเครื่องหมายลบ"
      - "มีแรงที่ชี้ทางซ้ายสองแรง ทั้งสองต้องมีเครื่องหมายลบ"
    misconceptions:
      - { match: "F + f + P", feedback: "ดูเหมือนบวกขนาดของทุกแรง แรงเสียดทานและแรงดันของเด็กชี้ทางซ้าย จึงต้องใส่เครื่องหมายลบ" }
      - { match: "F - f + P", feedback: "เด็กดันไปทางซ้าย แรง $P$ จึงต้องมีเครื่องหมายลบเหมือนแรงเสียดทาน" }
    solution: "ให้ทางขวาเป็นบวก: $F_\\text{net} = (+F) + (-f) + (-P) = F - f - P$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.force.p010
    topics: [physics.dynamics.forces]
    difficulty: 4
    type: numeric
    stem: "แม่ค้าที่ตลาดนัดเข็นรถเข็นผลไม้ไปข้างหน้าด้วยแรง $80\\ \\mathrm{N}$ ลูกชายช่วยดึงเชือกที่ผูกด้านหน้ารถไปข้างหน้าด้วยแรง $35\\ \\mathrm{N}$ ถนนให้แรงเสียดทานรวม $60\\ \\mathrm{N}$ ต้านการเคลื่อนที่ แรงลัพธ์ในแนวราบที่กระทำต่อรถเข็นมีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 55, unit: N }
    hints:
      - "ลูกชายอยู่ด้านหน้ารถแต่ดึงไปข้างหน้า แรงดึงของเขาชี้ไปทางเดียวกับแรงดันของแม่หรือไม่"
      - "ให้ทิศข้างหน้าเป็นบวก แรงเสียดทานมีเครื่องหมายลบ"
      - "รวมแรงทั้งสามพร้อมเครื่องหมาย"
    misconceptions:
      - { match: 175, feedback: "ดูเหมือนบวกขนาดของทุกแรง แรงเสียดทานต้านการเคลื่อนที่ จึงชี้ไปข้างหลังและต้องมีเครื่องหมายลบ" }
