      - { match: "infrasound", feedback: "infrasound คือเสียงความถี่ต่ำกว่าที่หูได้ยิน ข้อนี้ถามเสียงความถี่สูงกว่าที่หูได้ยิน" }
      - { match: "เสียงความถี่สูง", feedback: "ถูกทาง แต่ยังกว้างไป เสียงความถี่สูงที่หูยังได้ยินก็มี โจทย์ถามชื่อเรียกเฉพาะของเสียงที่สูงเกินกว่าหูจะได้ยิน" }
    hints:
