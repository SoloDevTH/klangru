  ai_assisted: true
- id: thai.literature.literary-analysis.p015
  topics:
  - thai.literature.literary-analysis
  difficulty: 5
  type: mcq
  stem: โคลงนิราศนรินทร์ "จากมามาลิ่วล้ำ · ลำบาง / บางยี่เรือราพลาง · พี่พร้อง / เรือแผงช่วยพานาง · เมียงม่าน มานา / บางบ่รับคำคล้อง · คล่าวน้ำตาคลอ" ข้อใด **วิเคราะห์ได้ครบและมีหลักฐาน** ที่สุด
  choices:
  - id: a
    text: ใช้คำว่า บาง ซ้ำต่อกัน (ลำบาง บางยี่เรือ บางบ่) และเล่นคำ เรือ กับชื่อตำบลบางยี่เรือ จบด้วย คล่าวน้ำตาคลอ ซึ่งแสดงรสสัลลาปังคพิไสย ความเศร้าที่ต้องจากนาง
    correct: true
    feedback: ถูก ระบุกลวิธีทางภาษาและรสพร้อมคำในตัวบท
  - id: b
    text: เป็นโคลงชมความงามของเรือ จึงเป็นรสเสาวรจนี
    feedback: บทนี้ไม่ได้ชมความงามของเรือ
  - id: c
    text: ผู้แต่งโกรธชาวบาง จึงเป็นรสพิโรธวาทัง
    feedback: ไม่มีถ้อยคำโกรธ บาง ในบทหมายถึงตำบล
  - id: d
    text: โคลงบทนี้ไพเราะเพราะเป็นโคลง
    feedback: ไม่ได้ชี้กลวิธีใดเลย
  hints:
  - นับคำว่า บาง ในบท
  - คำท้ายบทบอกอารมณ์อะไร
  solution: เด่นที่ **การซ้ำและเล่นคำ บาง เรือ** และ **รสสัลลาปังคพิไสย** จาก คล่าวน้ำตาคลอ
