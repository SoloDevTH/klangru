problems:
  - id: business.econ.money-banking.p001
    topics: [business.econ.money-banking]
    difficulty: 1
    type: match
    stem: "จับคู่เหตุการณ์กับวิธีแลกเปลี่ยนสินค้าและบริการ"
    pairs:
      - { left: "ชาวประมงนำปลาไปแลกผักกับชาวสวนที่ตลาดนัดชุมชน", right: "แลกสิ่งของกับสิ่งของ" }
      - { left: "จ่ายธนบัตร 20 บาทซื้อขนมครก", right: "ใช้เงินสด" }
      - { left: "สแกนคิวอาร์โค้ดจ่ายค่าข้าวมันไก่ผ่านแอปธนาคาร", right: "ชำระเงินทางอิเล็กทรอนิกส์" }
      - { left: "รับน้ำปลาจากร้านชำ แล้วจ่ายเงินตอนสิ้นเดือน", right: "ซื้อเชื่อ" }
    hints:
      - "ดูว่าจ่ายด้วยอะไร: ของ เงินสด เงินในบัญชี หรือจ่ายทีหลัง"
      - "ซื้อเชื่อคือได้ของก่อนแล้วจ่ายเงินภายหลัง"
    solution: "แลกปลากับผัก → แลกสิ่งของโดยตรง · จ่ายธนบัตรซื้อขนม → ใช้เงินสด · สแกนคิวอาร์จ่ายค่าข้าว → ชำระเงินทางอิเล็กทรอนิกส์ · รับของจากร้านชำแล้วจ่ายสิ้นเดือน → ซื้อเชื่อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.money-banking.p002
    topics: [business.econ.money-banking]
    difficulty: 1
    type: mcq
    stem: "ป้ายในร้านเขียนว่า \"เสื้อยืด 199 บาท กางเกง 259 บาท\" ทำให้ลูกค้าเทียบได้ว่าอะไรแพงกว่า เป็นหน้าที่ของเงินข้อใด"
    choices:
      - { id: a, text: "หน่วยวัดมูลค่า", correct: true }
      - { id: b, text: "สื่อกลางในการแลกเปลี่ยน", feedback: "สื่อกลางคือเมื่อจ่ายเงินซื้อของจริง ข้อนี้แค่บอกราคา" }
      - { id: c, text: "เครื่องเก็บรักษามูลค่า", feedback: "เก็บรักษามูลค่าคือเก็บเงินไว้ใช้ภายหลัง" }
      - { id: d, text: "มาตรฐานการชำระหนี้ในอนาคต", feedback: "ใช้กับการกำหนดหนี้ที่จะจ่ายภายหลัง เช่น สัญญาผ่อน" }
    hints:
      - "ป้ายราคาไม่ได้มีการจ่ายเงินเกิดขึ้น"
      - "เงินใช้บอกว่าของแต่ละอย่างมีค่าเท่าไร"
    solution: "การบอกราคาและเทียบมูลค่าของสินค้าคือหน้าที่ **หน่วยวัดมูลค่า**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.money-banking.p003
    topics: [business.econ.money-banking]
    difficulty: 2
    type: match
    stem: "จับคู่ตัวอย่างกับหน้าที่ของเงิน"
    pairs:
      - { left: "จ่าย 10 บาทค่ารถสองแถวไปโรงเรียน", right: "สื่อกลางในการแลกเปลี่ยน" }
      - { left: "แม่ค้าบอกว่าทุเรียนกิโลกรัมละ 150 บาท", right: "หน่วยวัดมูลค่า" }
      - { left: "เก็บเงินในบัญชีออมทรัพย์ไว้ซื้อจักรยานปีหน้า", right: "เครื่องเก็บรักษามูลค่า" }
      - { left: "ทำสัญญาผ่อนโทรศัพท์เดือนละ 900 บาท 12 เดือน", right: "มาตรฐานการชำระหนี้ในอนาคต" }
    hints:
      - "หน้าที่ของเงินมี 4 ข้อ"
      - "คิดว่าเงินในตัวอย่างถูกใช้ตอนไหน: ตอนซื้อ ตอนบอกราคา ตอนเก็บ หรือตอนกำหนดหนี้"
    solution: "จ่ายค่ารถสองแถว → สื่อกลาง · บอกว่าทุเรียนกิโลละ 150 บาท → หน่วยวัดมูลค่า · เก็บเงินในบัญชีไว้ซื้อจักรยาน → เก็บรักษามูลค่า · สัญญาผ่อนโทรศัพท์เดือนละ 900 บาท → มาตรฐานการชำระหนี้ในอนาคต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.money-banking.p004
    topics: [business.econ.money-banking]
    difficulty: 2
    type: mcq
    stem: "ทำไมการแลกเปลี่ยนสิ่งของกับสิ่งของโดยตรงจึง **ไม่สะดวก** (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "ต้องหาคนที่ต้องการของของเราและมีของที่เราต้องการพอดี", correct: true }
      - { id: b, text: "ของบางอย่าง เช่น วัวหนึ่งตัว แบ่งเป็นส่วนเล็กเพื่อแลกไม่ได้", correct: true }
      - { id: c, text: "ไม่มีหน่วยกลางบอกว่าของแต่ละอย่างมีค่าเท่าไร", correct: true }
      - { id: d, text: "การแลกของผิดกฎหมาย", feedback: "การแลกของไม่ผิดกฎหมาย ปัจจุบันยังมีตลาดแลกของในบางชุมชน" }
    hints:
      - "นึกถึงป้าแก้วที่อยากได้ปลาแต่ลุงชายไม่อยากได้มะม่วง"
      - "ของบางอย่างแบ่งได้หรือไม่"
    solution: "การแลกของต้องหาคนที่ต้องการของของกันและกันพอดี ของบางอย่างแบ่งไม่ได้ และไม่มีหน่วยกลางบอกว่าของแต่ละอย่างมีค่าเท่าไร ส่วนข้อ ง ผิดเพราะการแลกของไม่ได้ผิดกฎหมาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.money-banking.p005
    topics: [business.econ.money-banking]
    difficulty: 2
    type: numeric
    stem: "น้ำฝากเงินประจำ $12$ เดือน $20{,}000$ บาท อัตราดอกเบี้ย $1.5\\%$ ต่อปี (สมมติ) เมื่อครบกำหนดได้ดอกเบี้ยกี่บาท (ไม่คิดภาษี ตอบเป็นบาท)"
    answer: { value: 300, unit: "บาท" }
    hints:
      - "ดอกเบี้ย $=$ เงินต้น $\\times$ อัตราต่อปี $\\times$ จำนวนปี"
      - "$1.5\\% = 0.015$"
    misconceptions:
      - { match: 30000, feedback: "คูณด้วย $1.5$ แทน $0.015$ ต้องแปลงร้อยละเป็นทศนิยมก่อน" }
      - { match: 20300, feedback: "นั่นคือเงินรวมเมื่อครบกำหนด โจทย์ถามเฉพาะดอกเบี้ย" }
    solution: "ดอกเบี้ย $= 20{,}000 \\times 0.015 \\times 1 = 300$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.money-banking.p006
    topics: [business.econ.money-banking]
    difficulty: 2
    type: mcq
    stem: "ข้อใด **ไม่ใช่** บทบาทของธนาคารพาณิชย์"
    choices:
      - { id: a, text: "ผลิตและออกธนบัตรใช้ในประเทศ", correct: true }
      - { id: b, text: "รับฝากเงินและจ่ายดอกเบี้ยแก่ผู้ฝาก", feedback: "เป็นบทบาทหลักของธนาคารพาณิชย์" }
      - { id: c, text: "ให้สินเชื่อแก่ครัวเรือนและธุรกิจ", feedback: "เป็นบทบาทหลักของธนาคารพาณิชย์" }
      - { id: d, text: "ให้บริการโอนเงินและชำระค่าสินค้า", feedback: "เป็นบริการของธนาคารพาณิชย์" }
    hints:
      - "ธนาคารพาณิชย์ให้บริการประชาชนและธุรกิจ"
      - "งานใดเป็นของธนาคารกลาง"
    solution: "การผลิตและออกธนบัตรเป็นหน้าที่ของธนาคารแห่งประเทศไทย ธนาคารพาณิชย์รับฝาก ให้กู้ และให้บริการโอนเงิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.money-banking.p007
    topics: [business.econ.money-banking]
    difficulty: 3
    type: numeric
    stem: "จากภาพบัญชีเงินฝากของคุณมาลี ถ้าธนาคารทั้งสองแห่งถูกปิดกิจการ เงินฝากส่วนที่ **ไม่ได้รับความคุ้มครอง** จากสถาบันคุ้มครองเงินฝากรวมกี่บาท (วงเงินคุ้มครอง 1 ล้านบาทต่อผู้ฝากต่อสถาบันการเงิน ตอบเป็นบาท)"
    figure:
      src: deposits.svg
      alt: "ตารางบัญชีเงินฝากของคุณมาลี (สมมติ) ธนาคารพาณิชย์ ก บัญชีออมทรัพย์ 650,000 บาท และบัญชีฝากประจำ 12 เดือน 500,000 บาท ธนาคารพาณิชย์ ข บัญชีออมทรัพย์ 300,000 บาท ยอดรวมดอกเบี้ยแล้ว ทุกบัญชีเป็นเงินฝากสกุลบาท ธนาคารทั้งสองอยู่ภายใต้กฎหมายคุ้มครองเงินฝาก"
    answer: { value: 150000, unit: "บาท" }
    hints:
      - "รวมเงินทุกบัญชีในธนาคารเดียวกันก่อน"
      - "เทียบยอดรวมของแต่ละธนาคารกับ 1 ล้านบาท แยกกันทีละธนาคาร"
    misconceptions:
      - { match: 0, feedback: "คิดว่าคุ้มครอง 1 ล้านบาทต่อบัญชี แต่วงเงินคือต่อผู้ฝากต่อสถาบันการเงิน รวมทุกบัญชี" }
      - { match: 450000, feedback: "รวมเงินทุกธนาคารแล้วเทียบกับ 1 ล้านบาท แต่วงเงินคุ้มครองแยกเป็นรายสถาบันการเงิน" }
    solution: "ธนาคาร ก: $650{,}000 + 500{,}000 = 1{,}150{,}000$ บาท ได้รับคุ้มครอง $1{,}000{,}000$ บาท ไม่คุ้มครอง $150{,}000$ บาท · ธนาคาร ข: $300{,}000$ บาท คุ้มครองเต็มจำนวน · รวมส่วนที่ไม่คุ้มครอง $150{,}000$ บาท (ส่วนนี้ยังอาจได้คืนจากการชำระบัญชีของสถาบันการเงิน แต่ไม่แน่นอน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.money-banking.p008
    topics: [business.econ.money-banking]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็น **ผลเสีย** ของการกู้ยืม (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "มีเงินซื้อเครื่องสีข้าวมาทำธุรกิจได้เร็วขึ้น", feedback: "เป็นผลดี การกู้ช่วยให้ลงทุนได้ก่อนเก็บเงินครบ" }
      - { id: b, text: "ต้องจ่ายดอกเบี้ย ของที่ได้จึงแพงกว่าซื้อเงินสด", correct: true }
      - { id: c, text: "ถ้ารายได้ลดลงอาจผ่อนไม่ไหวจนถูกยึดทรัพย์", correct: true }
      - { id: d, text: "ผิดนัดชำระทำให้เสียประวัติ กู้ครั้งต่อไปยากขึ้น", correct: true }
      - { id: "e", text: "มีเงินจ่ายค่ารักษาพยาบาลฉุกเฉินทันที", feedback: "เป็นผลดี การกู้ช่วยแก้ปัญหาเฉพาะหน้า" }
    hints:
      - "ผลเสียคือภาระและความเสี่ยงที่ตามมา"
      - "ข้อใดเป็นเหตุผลที่คนเลือกกู้"
    solution: "ข้อ ข ค และ ง เป็นผลเสีย (ดอกเบี้ย ภาระผ่อน ประวัติเครดิต) ข้อ ก และ จ เป็นผลดีของการกู้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.money-banking.p009
    topics: [business.econ.money-banking]
    difficulty: 3
    type: numeric
    stem: "พี่ต้นผ่อนรถจักรยานยนต์ ยอดจัด $48{,}000$ บาท ดอกเบี้ยแบบคงที่ $6\\%$ ต่อปี (สมมติ) ผ่อน $24$ เดือน ค่างวดเดือนละกี่บาท (ตอบเป็นบาท)"
    answer: { value: 2240, unit: "บาท" }
    hints:
      - "ดอกเบี้ยแบบคงที่คิดจากเงินต้นทั้งก้อนตลอดสัญญา $24$ เดือน $= 2$ ปี"
      - "ค่างวด $= \\dfrac{\\text{เงินต้น} + \\text{ดอกเบี้ยรวม}}{24}$"
    misconceptions:
      - { match: 2000, feedback: "ลืมบวกดอกเบี้ย คิดแค่ $48{,}000 \\div 24$" }
      - { match: 2120, feedback: "คิดดอกเบี้ยแค่ $1$ ปี แต่สัญญายาว $2$ ปี" }
    solution: "ดอกเบี้ยรวม $= 48{,}000 \\times 0.06 \\times 2 = 5{,}760$ บาท ยอดผ่อนรวม $= 53{,}760$ บาท ค่างวด $= 53{,}760 \\div 24 = 2{,}240$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.money-banking.p010
    topics: [business.econ.money-banking]
    difficulty: 3
    type: match
    stem: "จับคู่สถาบันการเงินกับลักษณะการทำงาน"
    pairs:
      - { left: "ธนาคารเพื่อการเกษตรและสหกรณ์การเกษตร (ธ.ก.ส.)", right: "ธนาคารเฉพาะกิจของรัฐ เน้นสินเชื่อแก่เกษตรกร" }
      - { left: "สหกรณ์ออมทรัพย์ครู", right: "สมาชิกออมเงินร่วมกันและกู้ยืมกันเอง" }
      - { left: "บริษัทประกันชีวิต", right: "รับเบี้ยประกันและจ่ายเงินเมื่อเกิดเหตุตามสัญญา" }
      - { left: "โรงรับจำนำ", right: "ให้กู้โดยนำทรัพย์สินมาวางเป็นประกัน" }
      - { left: "ธนาคารแห่งประเทศไทย", right: "ดูแลนโยบายการเงินและกำกับดูแลสถาบันการเงิน" }
    hints:
      - "สถาบันการเงินแต่ละแบบมีลูกค้าและวัตถุประสงค์ต่างกัน"
      - "ธนาคารเฉพาะกิจของรัฐตั้งเพื่อนโยบายของรัฐ"
    solution: "ธ.ก.ส. → สินเชื่อเพื่อเกษตรกร · สหกรณ์ออมทรัพย์ → สมาชิกออมและกู้กันเอง · บริษัทประกันชีวิต → รับเบี้ยประกันและจ่ายเงินเมื่อเกิดเหตุ · โรงรับจำนำ → กู้โดยนำทรัพย์สินมาวางเป็นประกัน · ธนาคารแห่งประเทศไทย → ดูแลนโยบายการเงินและกำกับสถาบันการเงิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.money-banking.p011
    topics: [business.econ.money-banking]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นหน้าที่ของ **ธนาคารแห่งประเทศไทย** (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "กำหนดอัตราดอกเบี้ยนโยบายเพื่อดูแลเงินเฟ้อ (ผ่าน กนง.)", correct: true }
      - { id: b, text: "ผลิตและออกธนบัตร", correct: true }
      - { id: c, text: "กำกับดูแลธนาคารพาณิชย์ให้มั่นคง", correct: true }
      - { id: d, text: "เปิดบัญชีออมทรัพย์ให้นักเรียน", feedback: "ธปท. ไม่รับฝากเงินจากประชาชนทั่วไป ต้องเปิดบัญชีกับธนาคารพาณิชย์หรือธนาคารเฉพาะกิจ" }
      - { id: "e", text: "ให้ประชาชนกู้ซื้อบ้าน", feedback: "สินเชื่อบ้านเป็นบริการของธนาคารพาณิชย์และธนาคารเฉพาะกิจ ไม่ใช่ ธปท." }
    hints:
      - "ธนาคารกลางดูแลระบบการเงินทั้งประเทศ"
      - "ธนาคารกลางให้บริการประชาชนทั่วไปโดยตรงหรือไม่"
    solution: "ธปท. ดำเนินนโยบายการเงิน ออกธนบัตร และกำกับดูแลสถาบันการเงิน แต่ไม่รับฝากเงินหรือให้กู้แก่ประชาชนทั่วไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.money-banking.p012
    topics: [business.econ.money-banking]
    difficulty: 4
    type: numeric
    stem: "ธนาคารพาณิชย์แห่งหนึ่ง (สมมติ) มีเงินฝาก $500$ ล้านบาท จ่ายดอกเบี้ยเงินฝากเฉลี่ย $1\\%$ ต่อปี และปล่อยกู้ $400$ ล้านบาท เก็บดอกเบี้ยเฉลี่ย $6\\%$ ต่อปี ธนาคารมีรายได้ดอกเบี้ยสุทธิปีละกี่ล้านบาท (ตอบเป็นล้านบาท)"
    answer: { value: 19, unit: "ล้านบาท" }
    hints:
      - "ดอกเบี้ยรับ $= 400 \\times 0.06$ ดอกเบี้ยจ่าย $= 500 \\times 0.01$"
      - "ธนาคารไม่ได้ปล่อยกู้เงินฝากทั้งหมด"
    misconceptions:
      - { match: 25, feedback: "คิดว่าปล่อยกู้ครบ $500$ ล้านบาท ($500 \\times 5\\%$) แต่ปล่อยกู้จริง $400$ ล้านบาท" }
      - { match: 20, feedback: "ใช้ส่วนต่างอัตรา $5\\%$ คูณยอดเงินกู้ $400$ ล้านบาท แต่ดอกเบี้ยจ่ายคิดจากเงินฝาก $500$ ล้านบาท" }
    solution: "ดอกเบี้ยรับ $= 400 \\times 0.06 = 24$ ล้านบาท ดอกเบี้ยจ่าย $= 500 \\times 0.01 = 5$ ล้านบาท รายได้ดอกเบี้ยสุทธิ $= 24 - 5 = 19$ ล้านบาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.money-banking.p013
    topics: [business.econ.money-banking]
    difficulty: 4
    type: numeric
    stem: "ลุงดำกู้เงินนอกระบบ $10{,}000$ บาท ถูกคิดดอกเบี้ย $20\\%$ ต่อเดือนจากเงินต้น (สมมติ) ถ้ากู้ $6$ เดือน ลุงดำต้องจ่ายดอกเบี้ยรวมกี่บาท (ตอบเป็นบาท)"
    answer: { value: 12000, unit: "บาท" }
    hints:
      - "ดอกเบี้ยต่อเดือน $= 10{,}000 \\times 0.20$"
      - "คูณจำนวนเดือน"
    misconceptions:
      - { match: 2000, feedback: "นั่นคือดอกเบี้ยเดือนเดียว ต้องคูณ $6$ เดือน" }
      - { match: 22000, feedback: "นั่นคือเงินที่ต้องคืนทั้งหมด (เงินต้นรวมดอกเบี้ย) โจทย์ถามเฉพาะดอกเบี้ย" }
    solution: "ดอกเบี้ยเดือนละ $10{,}000 \\times 0.20 = 2{,}000$ บาท $6$ เดือน $= 12{,}000$ บาท มากกว่าเงินต้นเสียอีก อัตรานี้เท่ากับ $240\\%$ ต่อปี สูงกว่าที่กฎหมายอนุญาตมาก ควรขอกู้จากสถาบันการเงินในระบบ สหกรณ์ หรือกลุ่มออมทรัพย์แทน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.money-banking.p014
    topics: [business.econ.money-banking]
    difficulty: 4
    type: mcq
    stem: "ถ้าอัตราดอกเบี้ยในประเทศสูงขึ้น ข้อใดน่าจะเกิดขึ้น (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "ธุรกิจบางรายชะลอการกู้เงินมาขยายโรงงาน", correct: true }
      - { id: b, text: "คนที่ผ่อนบ้านแบบดอกเบี้ยลอยตัวต้องจ่ายดอกเบี้ยมากขึ้น", correct: true }
      - { id: c, text: "บางครัวเรือนเลือกฝากเงินมากขึ้นเพราะได้ดอกเบี้ยสูงขึ้น", correct: true }
      - { id: d, text: "คนรีบกู้ซื้อรถมากขึ้นเพราะกู้ได้ถูกลง", feedback: "ดอกเบี้ยสูงขึ้นทำให้กู้แพงขึ้น คนจึงมักกู้น้อยลง" }
    hints:
      - "ดอกเบี้ยคือราคาของการกู้และผลตอบแทนของการออม"
      - "คิดทั้งฝั่งผู้กู้และผู้ฝาก"
    solution: "ดอกเบี้ยสูงขึ้นทำให้การกู้แพงขึ้น ธุรกิจชะลอการลงทุน ผู้กู้แบบอัตราลอยตัวผ่อนมากขึ้น และการออมได้ผลตอบแทนมากขึ้น ข้อ ง ผิดเพราะการกู้แพงขึ้น ไม่ใช่ถูกลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.money-banking.p015
    topics: [business.econ.money-banking]
    difficulty: 2
    type: order
    stem: "เรียงพัฒนาการของสิ่งที่ใช้แลกเปลี่ยน จากเก่าที่สุดไปใหม่ที่สุด"
    items:
      - "แลกสิ่งของกับสิ่งของโดยตรง"
      - "ใช้สิ่งของที่คนยอมรับเป็นเงิน เช่น เปลือกหอยเบี้ย"
      - "ใช้เหรียญโลหะ"
      - "ใช้ธนบัตร"
      - "โอนเงินผ่านแอปและสแกนคิวอาร์โค้ด"
    hints:
      - "เริ่มจากยังไม่มีเงิน"
      - "เงินอิเล็กทรอนิกส์อาศัยเทคโนโลยีสมัยใหม่"
    solution: "แลกสิ่งของโดยตรง → สิ่งของที่ใช้เป็นเงิน เช่น เบี้ย → เหรียญโลหะ → ธนบัตร → เงินอิเล็กทรอนิกส์และการโอนผ่านแอป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.money-banking.p016
    topics: [business.econ.money-banking]
    difficulty: 5
    type: numeric
    stem: "กู้เงิน $60{,}000$ บาท ผ่อน $36$ เดือนเท่ากันทั้งสองแบบ (สมมติ) แบบ ก คิดดอกเบี้ยแบบคงที่ $5\\%$ ต่อปี แบบ ข คิดดอกเบี้ย $9\\%$ ต่อปีจากเงินต้นคงเหลือ ค่างวดเดือนละ $1{,}908$ บาท แบบ ข จ่ายดอกเบี้ยรวม **น้อยกว่า** แบบ ก กี่บาท (ตอบเป็นบาท)"
    answer: { value: 312, unit: "บาท" }
    hints:
      - "แบบ ก: ดอกเบี้ยรวม $= 60{,}000 \\times 0.05 \\times 3$"
      - "แบบ ข: ดอกเบี้ยรวม $=$ ค่างวด $\\times 36 - 60{,}000$"
    misconceptions:
      - { match: 7200, feedback: "คิดดอกเบี้ยแบบ ข เป็นแบบคงที่ $9\\%$ ($16{,}200$ บาท) แต่แบบ ข คิดจากเงินต้นคงเหลือ ต้องใช้ค่างวดที่ให้มา" }
      - { match: 8688, feedback: "นั่นคือดอกเบี้ยรวมของแบบ ข ยังไม่ได้เทียบกับแบบ ก" }
    solution: "แบบ ก ดอกเบี้ย $= 60{,}000 \\times 0.05 \\times 3 = 9{,}000$ บาท แบบ ข จ่ายรวม $1{,}908 \\times 36 = 68{,}688$ บาท ดอกเบี้ย $= 8{,}688$ บาท แบบ ข ถูกกว่า $312$ บาท แม้อัตราที่ประกาศ $9\\%$ จะดูสูงกว่า $5\\%$ เพราะแบบคงที่คิดดอกเบี้ยจากเงินต้นเต็มก้อนตลอดสัญญา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.money-banking.p017
    topics: [business.econ.money-banking]
    difficulty: 5
    type: mcq
    stem: "ข้อใดอธิบาย **บทบาทของภาคการเงิน** ต่อการตัดสินใจทางเศรษฐกิจได้ถูกต้อง (เลือกได้มากกว่าหนึ่งข้อ)"
    multiple: true
    choices:
      - { id: a, text: "ธนาคารนำเงินออมของครัวเรือนไปให้ธุรกิจกู้ลงทุน ทำให้เศรษฐกิจขยายตัวได้", correct: true }
      - { id: b, text: "ระบบชำระเงินที่รวดเร็ว เช่น พร้อมเพย์ ทำให้ร้านค้าเล็ก ๆ ขายของออนไลน์ได้ง่ายขึ้น", correct: true }
      - { id: c, text: "การกำกับดูแลสถาบันการเงินและการคุ้มครองเงินฝากทำให้ประชาชนกล้าฝากเงินในระบบ", correct: true }
      - { id: d, text: "เงินที่ลงทุนในกองทุนรวมผ่านธนาคารได้รับความคุ้มครองเหมือนเงินฝาก จึงไม่มีความเสี่ยง", feedback: "กองทุนรวมไม่ใช่เงินฝาก ไม่อยู่ในความคุ้มครองของสถาบันคุ้มครองเงินฝาก และมีความเสี่ยงขาดทุนได้" }
    hints:
      - "ภาคการเงินเชื่อมคนที่มีเงินเหลือกับคนที่ต้องการเงิน"
      - "ความมั่นคงของสถาบันการเงินส่งผลต่อความเชื่อมั่นของผู้ฝาก"
    solution: "ข้อ ก ข และ ค ถูก ภาคการเงินนำเงินออมไปให้ผู้ที่ต้องการลงทุน มีระบบชำระเงินที่ทำให้ค้าขายสะดวก และการกำกับดูแลกับการคุ้มครองเงินฝากทำให้ผู้ฝากเชื่อมั่น ข้อ ง ผิด เพราะการลงทุนทุกชนิดมีความเสี่ยง และกองทุนรวมไม่อยู่ในความคุ้มครองเงินฝาก"
    license: CC-BY-SA-4.0
    ai_assisted: true
