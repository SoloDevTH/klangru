<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" width="520" height="370" font-family="sans-serif" font-size="14">
  <title>แผนภาพสมการบัญชีที่ไม่บอกส่วนของเจ้าของ: สินทรัพย์ 80,000 บาท หนี้สิน 30,000 บาท</title>
  <rect x="0" y="0" width="520" height="370" fill="#ffffff"/>
  <rect x="70" y="58.0" width="150" height="272.0" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="145.0" y="192.0" text-anchor="middle" fill="#1f2937" font-weight="bold">สินทรัพย์รวม</text>
  <text x="145.0" y="210.0" text-anchor="middle" fill="#1f2937">80,000</text>
  <text x="145.0" y="354" text-anchor="middle" fill="#1f2937" font-weight="bold">สินทรัพย์</text>
  <rect x="300" y="228.0" width="150" height="102.0" fill="#fee2e2" stroke="#1f2937" stroke-width="1.5"/>
  <text x="375.0" y="277.0" text-anchor="middle" fill="#1f2937" font-weight="bold">หนี้สิน</text>
  <text x="375.0" y="295.0" text-anchor="middle" fill="#1f2937">30,000</text>
  <rect x="300" y="58.0" width="150" height="170.0" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="375.0" y="141.0" text-anchor="middle" fill="#1f2937" font-weight="bold">ส่วนของเจ้าของ</text>
  <text x="375.0" y="159.0" text-anchor="middle" fill="#1f2937">?</text>
  <text x="375.0" y="354" text-anchor="middle" fill="#1f2937" font-weight="bold">หนี้สิน + ส่วนของเจ้าของ</text>
  <text x="260.0" y="202.0" text-anchor="middle" font-size="30" font-weight="bold" fill="#1f2937">=</text>
  <line x1="40" y1="330" x2="500" y2="330" stroke="#1f2937" stroke-width="2"/>
</svg>
