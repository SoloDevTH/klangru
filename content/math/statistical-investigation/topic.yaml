id: math.stats.statistical-investigation
subject: math
title: { th: การทำการสำรวจทางสถิติ, en: Statistical investigations }
summary: วางแผนและทำการสำรวจทางสถิติครบวงจร ตั้งคำถามเชิงสถิติ เลือกวิธีเก็บข้อมูล นำเสนอ วิเคราะห์ แล้วสรุปผลพร้อมบอกข้อจำกัด
difficulty: 2.5
minutes: 35
prerequisites: [math.stats.data-display, math.stats.central-tendency]
encompasses:
  - { id: math.stats.data-display, weight: 0.4 }
  - { id: math.stats.central-tendency, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: investigation-cycle.svg
    alt: "แผนภาพวงจรสี่ขั้นเชื่อมด้วยลูกศรตามเข็มนาฬิกา: 1 ตั้งคำถาม (คำถามเชิงสถิติ) ไป 2 เก็บข้อมูล (สำรวจ สังเกต ทดลอง) ไป 3 วิเคราะห์ (ตาราง แผนภูมิ ค่าสรุป) ไป 4 ตีความและสื่อสาร (ตอบคำถาม บอกข้อจำกัด) แล้ววนกลับไปขั้นที่ 1 ตรงกลางเขียนว่า ผลมักนำไปสู่คำถามใหม่"
    caption: "วงจรการสำรวจทางสถิติ"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: math.stats.statistical-investigation.p001, prompt: "คำถามไหนคาดว่าคำตอบจะแตกต่างกัน" }
  - type: worked-example
    title: วางแผนการสำรวจขนมขายดีในสหกรณ์
    problem: "สหกรณ์โรงเรียนอยากรู้ว่าควรสั่งขนมชนิดใดเพิ่ม วางแผนการสำรวจให้ครบสี่ขั้น"
    steps:
      - text: "ตั้งคำถาม: \"ในหนึ่งสัปดาห์ สหกรณ์ขายขนมแต่ละชนิดได้กี่ชิ้น\""
        why: "ระบุช่วงเวลาและสิ่งที่นับ ทำให้ตอบได้ด้วยตัวเลข"
      - text: "เก็บข้อมูล: ใช้บันทึกการขายที่สหกรณ์มีอยู่แล้ว ไม่ต้องถามความเห็น"
        why: "ยอดขายจริงเชื่อถือได้มากกว่าการถามว่าชอบขนมอะไร เพราะคนที่ชอบอาจไม่ได้ซื้อ"
      - text: "วิเคราะห์: ทำตารางความถี่ของขนมแต่ละชนิด แล้วเขียนแผนภูมิแท่ง เพราะชนิดขนมเป็นข้อมูลเชิงคุณภาพ"
      - text: "ตีความ: บอกขนมที่ขายได้มากที่สุดพร้อมจำนวนชิ้น และบอกข้อจำกัด เช่น สัปดาห์ที่สำรวจมีกีฬาสี ยอดขายอาจสูงกว่าปกติ"
    answer: "คำถามชัด ใช้ข้อมูลการขายที่มีอยู่ นำเสนอด้วยแผนภูมิแท่ง และสรุปพร้อมข้อจำกัด"
  - type: worked-example
    title: เลือกค่ากลางและเขียนข้อสรุป
    problem: "สำรวจเงินที่นักเรียน 10 คนใช้ที่โรงอาหารในหนึ่งวัน (บาท): 25, 30, 30, 35, 40, 40, 40, 45, 50, 120 สรุปผลเป็นประโยค"
    steps:
      - text: "ค่าเฉลี่ย $= 455 \\div 10 = 45.5$ บาท มัธยฐาน $= \\tfrac{40 + 40}{2} = 40$ บาท พิสัย $= 120 - 25 = 95$ บาท"
      - text: "มีค่า 120 บาทที่อยู่ห่างจากกลุ่ม ดึงค่าเฉลี่ยให้สูงกว่าที่คนส่วนใหญ่ใช้"
        why: "9 คนจาก 10 คนใช้ไม่เกิน 50 บาท แต่ค่าเฉลี่ยเกือบ 46 บาท"
      - text: "จึงใช้มัธยฐานเป็นตัวแทน"
      - text: "เขียนข้อสรุปในบริบท บอกกลุ่ม ตัวเลข และข้อจำกัด"
    answer: "\"นักเรียน 10 คนที่สำรวจใช้เงินที่โรงอาหารมัธยฐาน 40 บาทต่อวัน ส่วนใหญ่อยู่ระหว่าง 25–50 บาท มีหนึ่งคนใช้ 120 บาท ข้อมูลมาจากวันเดียวและกลุ่มเล็ก จึงควรสำรวจเพิ่มก่อนสรุปถึงทั้งโรงเรียน\""
  - { type: check, problem: math.stats.statistical-investigation.p007, prompt: "ข้อมูลชนิดนี้ใช้แผนภูมิอะไร" }
glossary:
  - { term: คำถามเชิงสถิติ, definition: "คำถามที่คาดว่าคำตอบจะแตกต่างกัน และต้องใช้ข้อมูลหลายค่ามาตอบ" }
  - { term: ข้อมูลเชิงคุณภาพ, definition: "ข้อมูลที่เป็นกลุ่มหรือคำ เช่น สีที่ชอบ วิธีมาโรงเรียน" }
  - { term: ข้อมูลเชิงปริมาณ, definition: "ข้อมูลที่เป็นตัวเลข แบบไม่ต่อเนื่องได้จากการนับ แบบต่อเนื่องได้จากการวัด" }
  - { term: กลุ่มตัวอย่าง, definition: "ส่วนหนึ่งของกลุ่มทั้งหมดที่เลือกมาเก็บข้อมูล ควรเป็นตัวแทนที่ดีของทั้งกลุ่ม" }
  - { term: ความลำเอียง, definition: "การที่วิธีเก็บข้อมูลทำให้ผลเอียงไปทางใดทางหนึ่ง เช่น ถามแต่คนกลุ่มเดียวหรือใช้คำถามชี้นำ" }
  - { term: ความสัมพันธ์, definition: "การที่สองตัวแปรเปลี่ยนไปด้วยกัน ซึ่งยังไม่ได้แปลว่าตัวหนึ่งเป็นสาเหตุของอีกตัว" }
flashcards:
  - { front: "สี่ขั้นของการสำรวจทางสถิติ", back: "ตั้งคำถาม → เก็บข้อมูล → วิเคราะห์ → ตีความและสื่อสาร" }
  - { front: "คำถามเชิงสถิติคืออะไร", back: "คำถามที่คาดว่าคำตอบจะแตกต่างกัน เช่น นักเรียนในห้องสูงเท่าไร (ไม่ใช่ ฉันสูงเท่าไร)" }
  - { front: "สำรวจ สังเกต ทดลอง ใช้เมื่อใด", back: "สำรวจ: ความชอบหรือความเห็น สังเกต: สิ่งที่เห็นและนับได้ ทดลอง: ผลของการเปลี่ยนแปลง" }
  - { front: "ข้อสรุปที่ดีมีอะไรบ้าง", back: "ตอบคำถามเดิม ใช้ตัวเลข อยู่ในบริบท และบอกข้อจำกัด" }
