problems:
  - id: biology.humans.circulatory-system.p001
    topics: [biology.humans.circulatory-system]
    difficulty: 1
    type: mcq
    stem: "หลอดเลือดชนิดใดนำเลือดออกจากหัวใจ"
    choices:
      - { id: a, text: "หลอดเลือดแดง", correct: true }
      - { id: b, text: "หลอดเลือดดำ", feedback: "หลอดเลือดดำนำเลือดกลับเข้าหัวใจ" }
      - { id: c, text: "หลอดเลือดฝอย", feedback: "หลอดเลือดฝอยเชื่อมระหว่างหลอดเลือดแดงกับหลอดเลือดดำ และแลกเปลี่ยนสารกับเซลล์" }
      - { id: d, text: "หลอดน้ำเหลือง", feedback: "หลอดน้ำเหลืองไม่ได้ต่อกับหัวใจโดยตรง และไม่ได้นำเลือด" }
    hints:
      - "หลอดเลือดที่คลำชีพจรได้ ได้รับแรงดันจากหัวใจโดยตรง"
      - "ชื่อหลอดเลือดบอกทิศทางการไหลเทียบกับหัวใจ"
    solution: "หลอดเลือดแดงนำเลือดออกจากหัวใจ ผนังหนาและยืดหยุ่นเพื่อทนแรงดันสูง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.circulatory-system.p002
    topics: [biology.humans.circulatory-system]
    difficulty: 1
    type: numeric
    stem: "หัวใจของคนมีกี่ห้อง"
    answer: { value: 4, unit: ห้อง }
    hints:
      - "หัวใจมีห้องบนและห้องล่าง"
      - "แต่ละระดับมีทั้งซีกซ้ายและซีกขวา"
    misconceptions:
      - { match: 2, feedback: "นับเพียงซีกซ้ายกับซีกขวา แต่ละซีกยังแบ่งเป็นห้องบนและห้องล่าง" }
      - { match: 3, feedback: "หัวใจ 3 ห้องพบในกบ หัวใจคนมีผนังกั้นห้องล่างสมบูรณ์" }
    solution: "หัวใจคนมี 4 ห้อง คือ ห้องบนขวา ห้องบนซ้าย ห้องล่างขวา และห้องล่างซ้าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.circulatory-system.p003
    topics: [biology.humans.circulatory-system]
    difficulty: 1
    type: match
    stem: "จับคู่ส่วนประกอบของเลือดกับหน้าที่"
    pairs:
      - { left: "เซลล์เม็ดเลือดแดง", right: "ลำเลียงออกซิเจน" }
      - { left: "เซลล์เม็ดเลือดขาว", right: "ทำลายเชื้อโรค" }
      - { left: "เพลตเลต", right: "ช่วยให้เลือดแข็งตัวเมื่อมีบาดแผล" }
      - { left: "น้ำเลือด (พลาสมา)", right: "ลำเลียงสารอาหาร น้ำ และของเสีย" }
    hints:
      - "เซลล์ที่มีฮีโมโกลบินทำหน้าที่ใด"
      - "ส่วนที่เป็นของเหลวพาสารที่ละลายน้ำได้"
    solution: "เซลล์เม็ดเลือดแดงลำเลียงออกซิเจน เซลล์เม็ดเลือดขาวทำลายเชื้อโรค เพลตเลตช่วยให้เลือดแข็งตัว และน้ำเลือดลำเลียงสารอาหาร น้ำ ฮอร์โมน และของเสีย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.circulatory-system.p004
    topics: [biology.humans.circulatory-system]
    difficulty: 2
    type: order
    stem: "เรียงเส้นทางของเลือดหนึ่งหยด เริ่มจากห้องบนขวา จนกลับเข้าหัวใจซีกซ้าย แล้วออกไปเลี้ยงร่างกาย"
    items:
      - "ห้องบนขวา"
      - "ห้องล่างขวา"
      - "ปอด"
      - "ห้องบนซ้าย"
      - "ห้องล่างซ้าย"
      - "หลอดเลือดแดงใหญ่ไปทั่วร่างกาย"
    hints:
      - "ห้องบนส่งเลือดลงห้องล่างข้างเดียวกัน"
      - "เลือดจากหัวใจซีกขวาไปปอดก่อน แล้วกลับเข้าหัวใจซีกซ้าย"
    solution: "ห้องบนขวา → ห้องล่างขวา → ปอด → ห้องบนซ้าย → ห้องล่างซ้าย → หลอดเลือดแดงใหญ่ไปทั่วร่างกาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.circulatory-system.p005
    topics: [biology.humans.circulatory-system]
    difficulty: 2
    type: numeric
    stem: "นักเรียนนับชีพจรที่ข้อมือได้ 18 ครั้งในเวลา 15 วินาที อัตราการเต้นของหัวใจเป็นกี่ครั้งต่อนาที"
    answer: { value: 72, unit: ครั้ง/นาที }
    hints:
      - "1 นาทีมี 60 วินาที"
      - "60 วินาทีเป็นกี่เท่าของ 15 วินาที"
    misconceptions:
      - { match: 18, feedback: "นี่คือจำนวนครั้งใน 15 วินาที ยังไม่ได้แปลงเป็นต่อนาที" }
      - { match: 36, feedback: "คูณ 2 ซึ่งได้ค่าใน 30 วินาที ต้องคูณ 4 เพื่อให้ได้ 60 วินาที" }
    solution: "1 นาทีมี 4 ช่วงของ 15 วินาที อัตราการเต้น $= 18 \\times 4 = 72$ ครั้งต่อนาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.circulatory-system.p006
    topics: [biology.humans.circulatory-system]
    difficulty: 2
    type: mcq
    stem: "จากภาพหัวใจที่มีตัวอักษร ก ข ค ง (มองจากด้านหน้า) ห้องใดบีบตัวส่งเลือดไปเลี้ยงทั่วร่างกาย"
    figure: { src: p-heart-letters.svg, alt: "แผนภาพหัวใจ 4 ห้อง มองจากด้านหน้า ด้านซ้ายของภาพคือด้านขวาของร่างกาย ห้องบนซ้ายของภาพเป็น ก ห้องล่างซ้ายของภาพเป็น ข ห้องบนขวาของภาพเป็น ค ห้องล่างขวาของภาพเป็น ง ห้อง ง มีผนังหนาที่สุดและยาวลงไปถึงปลายหัวใจ ห้อง ข ผนังบางกว่า" }
    choices:
      - { id: a, text: "ง", correct: true }
      - { id: b, text: "ข", feedback: "ห้อง ข อยู่ทางด้านขวาของร่างกาย คือห้องล่างขวา ซึ่งส่งเลือดไปปอด" }
      - { id: c, text: "ค", feedback: "ห้อง ค เป็นห้องบน ห้องบนรับเลือดที่ไหลกลับเข้าหัวใจ" }
      - { id: d, text: "ก", feedback: "ห้อง ก เป็นห้องบนขวา รับเลือดจากร่างกาย" }
    hints:
      - "ห้องที่ส่งเลือดออกจากหัวใจเป็นห้องบนหรือห้องล่าง"
      - "ห้องที่ส่งเลือดไปไกลที่สุดต้องมีผนังหนาที่สุด และภาพมองจากด้านหน้า ด้านซ้ายของภาพจึงเป็นด้านขวาของร่างกาย"
    solution: "ห้องที่ส่งเลือดไปทั่วร่างกายคือห้องล่างซ้าย ในภาพที่มองจากด้านหน้า ห้องล่างซ้ายอยู่ทางขวาของภาพและมีผนังหนาที่สุด คือห้อง ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.circulatory-system.p007
    topics: [biology.humans.circulatory-system]
    difficulty: 2
    type: mcq
    stem: "ทำไมการแลกเปลี่ยนออกซิเจนและสารอาหารกับเซลล์จึงเกิดที่หลอดเลือดฝอย"
    choices:
      - { id: a, text: "ผนังหลอดเลือดฝอยบางเพียงเซลล์เดียว สารจึงผ่านเข้าออกได้ง่าย", correct: true }
      - { id: b, text: "หลอดเลือดฝอยมีลิ้นที่ปั๊มสารเข้าเซลล์", feedback: "ลิ้นพบในหัวใจและหลอดเลือดดำ ใช้กันเลือดไหลย้อน ไม่ได้ปั๊มสาร" }
      - { id: c, text: "หลอดเลือดฝอยมีผนังหนาที่สุด จึงเก็บสารไว้ได้มาก", feedback: "หลอดเลือดฝอยมีผนังบางที่สุด" }
      - { id: d, text: "เลือดในหลอดเลือดฝอยไหลเร็วที่สุด", feedback: "เลือดไหลในหลอดเลือดฝอยช้าที่สุด ซึ่งก็ช่วยให้มีเวลาแลกเปลี่ยนสาร" }
    hints:
      - "สารต้องผ่านผนังหลอดเลือดไปถึงเซลล์"
      - "ผนังยิ่งบาง สารยิ่งผ่านง่าย"
    solution: "ผนังหลอดเลือดฝอยหนาเพียงเซลล์เดียว ออกซิเจนและสารอาหารจึงแพร่ออกไปที่เซลล์ได้ง่าย และของเสียจากเซลล์แพร่เข้าสู่เลือดได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.circulatory-system.p008
    topics: [biology.humans.circulatory-system]
    difficulty: 3
    type: numeric
    stem: "จากตารางผลการนับชีพจรใน 15 วินาที อัตราการเต้นของหัวใจเฉลี่ยขณะนั่งพักเป็นกี่ครั้งต่อนาที"
    figure: { src: p-pulse-table.svg, alt: "ตารางผลการนับชีพจรใน 15 วินาที 3 ครั้ง ขณะนั่งพัก ครั้งที่ 1 20 ครั้ง ครั้งที่ 2 19 ครั้ง ครั้งที่ 3 21 ครั้ง หลังกระโดดตบ 1 นาที ครั้งที่ 1 32 ครั้ง ครั้งที่ 2 34 ครั้ง ครั้งที่ 3 33 ครั้ง" }
    answer: { value: 80, unit: ครั้ง/นาที }
    hints:
      - "หาค่าเฉลี่ยของการนับขณะนั่งพักทั้ง 3 ครั้งก่อน"
      - "ค่าที่ได้เป็นจำนวนครั้งใน 15 วินาที ต้องแปลงเป็นต่อนาที"
    misconceptions:
      - { match: 20, feedback: "นี่คือค่าเฉลี่ยใน 15 วินาที ต้องคูณ 4" }
      - { match: 240, feedback: "รวม 3 ครั้งแล้วคูณ 4 แต่ลืมหารด้วย 3 เพื่อหาค่าเฉลี่ย" }
    solution: "ค่าเฉลี่ย $= \\frac{20 + 19 + 21}{3} = 20$ ครั้งใน 15 วินาที อัตราการเต้น $= 20 \\times 4 = 80$ ครั้งต่อนาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.circulatory-system.p009
    topics: [biology.humans.circulatory-system]
    difficulty: 3
    type: numeric
    stem: "จากตารางผลการนับชีพจรใน 15 วินาที อัตราการเต้นของหัวใจเฉลี่ยหลังกระโดดตบเพิ่มขึ้นจากขณะนั่งพักกี่ครั้งต่อนาที"
    figure: { src: p-pulse-table.svg, alt: "ตารางผลการนับชีพจรใน 15 วินาที 3 ครั้ง ขณะนั่งพัก ครั้งที่ 1 20 ครั้ง ครั้งที่ 2 19 ครั้ง ครั้งที่ 3 21 ครั้ง หลังกระโดดตบ 1 นาที ครั้งที่ 1 32 ครั้ง ครั้งที่ 2 34 ครั้ง ครั้งที่ 3 33 ครั้ง" }
    answer: { value: 52, unit: ครั้ง/นาที }
    hints:
      - "หาอัตราเฉลี่ยต่อนาทีของทั้งสองสภาพก่อน"
      - "นำค่าหลังกระโดดตบลบค่าขณะนั่งพัก"
    misconceptions:
      - { match: 13, feedback: "นี่คือความต่างใน 15 วินาที (33 − 20) ต้องคูณ 4 เพื่อเป็นต่อนาที" }
      - { match: 132, feedback: "นี่คืออัตราหลังกระโดดตบ โจทย์ถามว่าเพิ่มขึ้นเท่าใด" }
    solution: "ขณะพัก $20 \\times 4 = 80$ ครั้งต่อนาที หลังกระโดดตบเฉลี่ย $\\frac{32 + 34 + 33}{3} = 33$ ครั้งใน 15 วินาที $= 132$ ครั้งต่อนาที เพิ่มขึ้น $132 - 80 = 52$ ครั้งต่อนาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.circulatory-system.p010
    topics: [biology.humans.circulatory-system]
    difficulty: 3
    type: mcq
    stem: "ทำไมหัวใจจึงเต้นเร็วขึ้นขณะวิ่ง"
    choices:
      - { id: a, text: "กล้ามเนื้อใช้ออกซิเจนและสารอาหารมากขึ้น และสร้างคาร์บอนไดออกไซด์มากขึ้น เลือดต้องไหลเวียนเร็วขึ้น", correct: true }
      - { id: b, text: "หัวใจต้องการเลือดมากขึ้นเพื่อให้ตัวเองใหญ่ขึ้น", feedback: "หัวใจเต้นเร็วเพื่อส่งเลือดไปให้กล้ามเนื้อที่ทำงาน ไม่ได้เพื่อขยายตัวเอง" }
      - { id: c, text: "เลือดร้อนขึ้นจึงไหลเร็วเอง", feedback: "อัตราการเต้นเพิ่มเพราะร่างกายสั่งให้หัวใจทำงานหนักขึ้น ไม่ใช่เพราะเลือดร้อน" }
      - { id: d, text: "ปอดหยุดทำงานขณะวิ่ง หัวใจต้องทำแทน", feedback: "ปอดทำงานหนักขึ้นด้วยเช่นกัน ไม่ได้หยุดทำงาน" }
    hints:
      - "กล้ามเนื้อที่ทำงานหนักต้องใช้อะไรมากขึ้น"
      - "อะไรนำสิ่งเหล่านั้นไปส่ง"
    solution: "ขณะวิ่ง กล้ามเนื้อใช้ออกซิเจนและสารอาหารมากเพื่อสร้างพลังงาน และสร้างคาร์บอนไดออกไซด์มาก หัวใจจึงเต้นเร็วและแรงขึ้น เลือดจึงพาสารไปส่งและพาของเสียออกได้ทัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.circulatory-system.p011
    topics: [biology.humans.circulatory-system]
    difficulty: 3
    type: mcq
    stem: "เพื่อนบอกว่า \"หลอดเลือดแดงทุกเส้นนำเลือดที่มีออกซิเจนมาก\" ข้อใดเป็นหลักฐานที่แย้งคำกล่าวนี้"
    choices:
      - { id: a, text: "หลอดเลือดแดงที่ไปปอดนำเลือดที่มีออกซิเจนน้อยจากหัวใจซีกขวาไปปอด", correct: true }
      - { id: b, text: "หลอดเลือดแดงใหญ่นำเลือดจากห้องล่างซ้ายไปทั่วร่างกาย", feedback: "หลอดเลือดแดงใหญ่นำเลือดที่มีออกซิเจนมาก ข้อนี้สนับสนุนคำกล่าว ไม่ได้แย้ง" }
      - { id: c, text: "หลอดเลือดดำใหญ่นำเลือดที่มีออกซิเจนน้อยกลับเข้าหัวใจ", feedback: "ข้อนี้พูดถึงหลอดเลือดดำ ไม่ได้เกี่ยวกับคำกล่าวเรื่องหลอดเลือดแดง" }
      - { id: d, text: "เลือดในหลอดเลือดแดงมีสีแดงสด", feedback: "สีของเลือดไม่ได้ใช้นิยามชนิดหลอดเลือด และไม่ได้แย้งคำกล่าว" }
    hints:
      - "หลอดเลือดแดงหมายถึงหลอดเลือดที่นำเลือดออกจากหัวใจ"
      - "เลือดที่ไปปอดมีออกซิเจนมากหรือน้อย"
    solution: "หลอดเลือดแดงหมายถึงหลอดเลือดที่นำเลือดออกจากหัวใจ หลอดเลือดแดงที่ไปปอดนำเลือดที่มีออกซิเจนน้อยไปรับออกซิเจนที่ปอด จึงแย้งคำกล่าวที่ว่าหลอดเลือดแดงทุกเส้นมีออกซิเจนมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.humans.circulatory-system.p012
    topics: [biology.humans.circulatory-system]
    difficulty: 3
    type: mcq
    stem: "นักเรียนกลุ่มหนึ่งออกแบบการทดลองเปรียบเทียบอัตราการเต้นของหัวใจขณะพักกับหลังวิ่งเหยาะ 2 นาที ข้อใดเป็นตัวแปรควบคุมที่สำคัญ"
    choices:
      - { id: a, text: "วัดคนเดิม ตำแหน่งเดิม และนับเวลาเท่ากันทุกครั้ง", correct: true }
      - { id: b, text: "อัตราการเต้นของหัวใจ", feedback: "อัตราการเต้นของหัวใจเป็นตัวแปรตามที่วัดผล" }
      - { id: c, text: "การวิ่งหรือไม่วิ่ง", feedback: "การวิ่งหรือไม่วิ่งเป็นตัวแปรต้นที่จงใจเปลี่ยน" }
      - { id: d, text: "สีเสื้อของผู้ถูกวัด", feedback: "สีเสื้อไม่มีผลต่อชีพจร จึงไม่ใช่ตัวแปรที่ต้องควบคุม" }
    hints:
      - "ตัวแปรควบคุมคือสิ่งที่ต้องทำให้เหมือนกันทุกครั้ง"
      - "สิ่งใดถ้าเปลี่ยนแล้วอาจทำให้ชีพจรที่วัดได้ต่างไป"
    solution: "ตัวแปรต้นคือการวิ่ง ตัวแปรตามคืออัตราการเต้นของหัวใจ ตัวแปรควบคุมคือคนที่วัด ตำแหน่งที่วัด ช่วงเวลาที่นับ และช่วงเวลาหลังวิ่งที่เริ่มวัด ต้องเหมือนกันทุกครั้ง"
