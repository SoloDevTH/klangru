id: chemistry.bonding.formal-charge-resonance
subject: chemistry
title: { th: ข้อยกเว้นของกฎออกเตต ประจุฟอร์มัล และโครงสร้างเรโซแนนซ์, en: Octet exceptions, formal charge and resonance }
summary: เขียนโครงสร้างลิวอิสของโมเลกุลและไอออนหลายอะตอม คำนวณประจุฟอร์มัลเพื่อเลือกโครงสร้างที่เหมาะสม และอธิบายพันธะของโอโซนกับไนเทรตด้วยเรโซแนนซ์
difficulty: 6
minutes: 40
prerequisites: [chemistry.bonding.covalent, chemistry.bonding.polarity-intermolecular]
encompasses:
  - { id: chemistry.bonding.covalent, weight: 0.4 }
  - { id: chemistry.bonding.polarity-intermolecular, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: ozone-resonance.svg
    alt: "โครงสร้างลิวอิสสองแบบของโอโซนเรียงซ้ายขวาคั่นด้วยลูกศรสองหัว แบบซ้ายมีพันธะคู่ระหว่าง O ซ้ายกับ O กลาง และพันธะเดี่ยวระหว่าง O กลางกับ O ขวา O กลางมีเครื่องหมายบวก O ขวามีเครื่องหมายลบ แบบขวาสลับตำแหน่งพันธะคู่ไปอยู่ทางขวา O ซ้ายมีเครื่องหมายลบ O กลางมีเครื่องหมายบวก ทุกอะตอมมีจุดแทนอิเล็กตรอนคู่โดด"
    caption: "โอโซนเขียนได้สองแบบที่ต่างกันเฉพาะตำแหน่งพันธะคู่ ความจริงอยู่ระหว่างสองแบบ จึงเรียกว่าลูกผสมเรโซแนนซ์"
  - type: worked-example
    title: เขียนโครงสร้างลิวอิสของไนเทรตและหาประจุฟอร์มัล
    problem: "เขียนโครงสร้างลิวอิสของไอออน $\\mathrm{NO_3^{-}}$ แล้วคำนวณประจุฟอร์มัลของทุกอะตอมในโครงสร้างหนึ่งแบบ"
    steps:
      - text: "นับอิเล็กตรอนวาเลนซ์: $5 + 3 \\times 6 + 1 = 24$ ตัว"
        why: "ประจุลบ 1 หมายถึงมีอิเล็กตรอนเพิ่ม 1 ตัว ต้องนับรวมด้วย"
      - text: "ต่อ N กับ O สามตัวด้วยพันธะเดี่ยว ใช้ $3 \\times 2 = 6$ ตัว เหลือ $24 - 6 = 18$ ตัว"
      - text: "เติมคู่โดดให้ O แต่ละตัวครบออกเตต ใช้ $18$ ตัวพอดี แต่ N จะมีอิเล็กตรอนเพียง 6 ตัว"
        why: "N ต้องครบออกเตต จึงต้องเปลี่ยนคู่โดดบน O หนึ่งตัวเป็นพันธะคู่"
      - text: "ย้ายคู่โดดจาก O ตัวหนึ่งมาเป็นพันธะคู่ $\\mathrm{N{=}O}$ ตอนนี้ N ล้อมรอบด้วย 8 ตัวครบออกเตต"
      - text: "คำนวณ $FC_N = 5 - 0 - 4 = +1$, $FC_{O{=}} = 6 - 4 - 2 = 0$, $FC_{O^{-}} = 6 - 6 - 1 = -1$ (สองตำแหน่ง) รวม $+1 + 0 - 1 - 1 = -1$"
        why: "ผลรวมประจุฟอร์มัลต้องเท่ากับประจุของไอออนเสมอ ใช้ตรวจว่าคำนวณถูกหรือไม่"
    answer: "โครงสร้างหนึ่งแบบมี $\\mathrm{N{=}O}$ 1 พันธะ และ $\\mathrm{N{-}O^{-}}$ 2 พันธะ เนื่องจากพันธะคู่ย้ายไปอยู่ที่ O ใดก็ได้ จึงมีโครงสร้างเรโซแนนซ์ 3 แบบ"
  - { type: check, problem: chemistry.bonding.formal-charge-resonance.p002, prompt: "นับอิเล็กตรอนวาเลนซ์ก่อนเขียนโครงสร้าง" }
  - type: worked-example
    title: เลือกโครงสร้างที่เหมาะสมของ N₂O จากประจุฟอร์มัล
    problem: "$\\mathrm{N_2O}$ เขียนได้สองแบบ แบบแรกคือ $\\mathrm{N{\\equiv}N^{+}{-}O^{-}}$ และแบบที่สองคือ $\\mathrm{N^{-}{=}N^{+}{=}O}$ แบบใดเหมาะสมกว่า"
    steps:
      - text: "แบบแรก: N ปลาย $FC = 5 - 2 - 3 = 0$, N กลาง $FC = 5 - 0 - 4 = +1$, O $FC = 6 - 6 - 1 = -1$ รวมเป็น 0"
        why: "N ปลายมีพันธะสาม 3 พันธะและคู่โดด 1 คู่ จึงลบ 2 จากคู่โดด"
      - text: "แบบที่สอง: N ปลาย $FC = 5 - 4 - 2 = -1$, N กลาง $FC = +1$, O $FC = 6 - 4 - 2 = 0$ รวมเป็น 0"
      - text: "ทั้งสองแบบมีผลรวมประจุฟอร์มัลเป็นศูนย์ และมีค่าสัมบูรณ์รวมเท่ากัน จึงเกณฑ์นี้ยังตัดสินไม่ได้"
        why: "เกณฑ์รองคือประจุลบควรอยู่บนอะตอมที่ดึงอิเล็กตรอนได้ดีกว่า"
      - text: "ออกซิเจนมีค่าอิเล็กโทรเนกาติวิตีสูงกว่าไนโตรเจน แบบแรกจึงวางประจุลบบน O ดีกว่า"
    answer: "โครงสร้างที่เหมาะสมกว่าคือ $\\mathrm{N{\\equiv}N^{+}{-}O^{-}}$ เพราะประจุลบอยู่บน O ซึ่งดึงอิเล็กตรอนได้ดี"
  - { type: check, problem: chemistry.bonding.formal-charge-resonance.p006, prompt: "ดูว่า B มีอิเล็กตรอนรอบตัวกี่ตัว" }
glossary:
  - { term: ประจุฟอร์มัล, definition: "ประจุที่คำนวณได้ของอะตอมในโครงสร้างลิวอิส $FC = V - N - B/2$ โดย V คืออิเล็กตรอนวาเลนซ์ N คืออิเล็กตรอนในคู่โดด และ B คืออิเล็กตรอนในพันธะ" }
  - { term: โครงสร้างเรโซแนนซ์, definition: "โครงสร้างลิวอิสหลายแบบที่ต่างกันเฉพาะตำแหน่งของอิเล็กตรอน แต่ตำแหน่งของนิวเคลียสเหมือนกัน" }
  - { term: ลูกผสมเรโซแนนซ์, definition: "โครงสร้างจริงของโมเลกุลที่เป็นค่าเฉลี่ยของโครงสร้างเรโซแนนซ์ทุกแบบ" }
  - { term: อันดับพันธะ, definition: "จำนวนคู่อิเล็กตรอนที่ใช้ร่วมระหว่างอะตอมสองอะตอม (พันธะเดี่ยว 1 พันธะคู่ 2) ค่าอาจเป็นทศนิยมในลูกผสมเรโซแนนซ์" }
  - { term: ออกเตตขยาย, definition: "การที่อะตอมกลางมีอิเล็กตรอนล้อมรอบมากกว่า 8 ตัว พบได้ในอะตอมที่อยู่คาบ 3 ขึ้นไป" }
flashcards:
  - { front: "สูตรประจุฟอร์มัลของอะตอม", back: "$FC = V - N - B/2$ หรือ วาเลนซ์ − คู่โดด×2 − จำนวนพันธะ" }
  - { front: "ข้อยกเว้นของกฎออกเตต 3 แบบ", back: "จำนวนอิเล็กตรอนคี่ (NO), อะตอมกลางขาดออกเตต (BF₃), ออกเตตขยาย (PCl₅, SF₆)" }
  - { front: "อันดับพันธะของ NO₃⁻", back: "$4/3 \\approx 1.33$ ต่อตำแหน่ง N–O" }
  - { front: "เกณฑ์เลือกโครงสร้างลิวอิสที่ดี", back: "ประจุฟอร์มัลใกล้ศูนย์ ประจุลบบนอะตอมที่มี EN สูง ไม่มีประจุบวกและลบที่ขัดกันติดกัน" }
