  - id: earthscience.hazards.natural-hazards.p013
    topics: [earthscience.hazards.natural-hazards]
    difficulty: 3
    type: mcq
    stem: "ข่าวรายงานว่าน้ำท่วมเมื่อปีที่แล้วเป็น \"น้ำท่วมรอบ 100 ปี\" ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ทุกปีมีโอกาสเกิดน้ำท่วมขนาดนี้ราว 1 ใน 100 ปีนี้ก็เกิดซ้ำได้", correct: true }
      - { id: b, text: "เพิ่งเกิดไปแล้ว อีก 100 ปีจึงจะเกิดอีก", feedback: "โอกาสในแต่ละปีไม่ขึ้นกับว่าปีก่อนเกิดหรือไม่ ปีนี้ก็เกิดซ้ำได้" }
      - { id: c, text: "น้ำท่วมขนาดนี้เกิดได้ครั้งเดียวในชีวิต", feedback: "น้ำท่วมรอบ 100 ปีอาจเกิดสองครั้งในไม่กี่ปีก็ได้ เพียงแต่โอกาสต่ำ" }
      - { id: d, text: "น้ำท่วมครั้งนี้กินเวลานาน 100 วัน", feedback: "\"รอบ 100 ปี\" บอกความถี่โดยเฉลี่ยในระยะยาว ไม่ใช่ระยะเวลาที่น้ำท่วม" }
    hints:
      - "\"รอบ 100 ปี\" คือความถี่เฉลี่ยในระยะยาวมาก"
      - "โอกาสต่อปีเท่ากับ 1 หารด้วยจำนวนปีของรอบ"
    solution: "น้ำท่วมรอบ 100 ปีมีโอกาสเกิด 1 ใน 100 ในแต่ละปี ไม่ขึ้นกับว่าปีก่อนเกิดหรือไม่ จึงเกิดซ้ำในปีนี้ได้"
