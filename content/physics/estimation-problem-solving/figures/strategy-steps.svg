<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" font-family="sans-serif">
<title>ลำดับกลยุทธ์สี่ขั้นในการแก้โจทย์ฟิสิกส์</title>
<rect width="720" height="220" fill="#ffffff"/>
<rect x="14" y="40" width="162" height="120" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
<text x="95.0" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">1. วางกลยุทธ์</text>
<text x="95.0" y="102" text-anchor="middle" font-size="12" fill="#333">ประมาณปริมาณใดได้</text>
<text x="95.0" y="122" text-anchor="middle" font-size="12" fill="#333">บ้าง ต้องรู้อะไร</text>
<line x1="179" y1="100.0" x2="187" y2="100.0" stroke="#444" stroke-width="2"/>
<polygon points="187,94.0 195,100.0 187,106.0" fill="#444"/>
<rect x="190" y="40" width="162" height="120" rx="10" fill="#e8f6ec" stroke="#15803d" stroke-width="2"/>
<text x="271.0" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">2. วาดรูปและระบุตัวแปร</text>
<text x="271.0" y="102" text-anchor="middle" font-size="12" fill="#333">เขียนสิ่งที่รู้และ</text>
<text x="271.0" y="122" text-anchor="middle" font-size="12" fill="#333">ไม่รู้ลงบนรูป</text>
<line x1="355" y1="100.0" x2="363" y2="100.0" stroke="#444" stroke-width="2"/>
<polygon points="363,94.0 371,100.0 363,106.0" fill="#444"/>
<rect x="366" y="40" width="162" height="120" rx="10" fill="#fff4df" stroke="#b45309" stroke-width="2"/>
<text x="447.0" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">3. แก้สมการก่อนแทนค่า</text>
<text x="447.0" y="102" text-anchor="middle" font-size="12" fill="#333">หาคำตอบเชิงสัญลักษณ์</text>
<text x="447.0" y="122" text-anchor="middle" font-size="12" fill="#333">แล้วค่อยแทนตัวเลข</text>
<line x1="531" y1="100.0" x2="539" y2="100.0" stroke="#444" stroke-width="2"/>
<polygon points="539,94.0 547,100.0 539,106.0" fill="#444"/>
<rect x="542" y="40" width="162" height="120" rx="10" fill="#f6e8ff" stroke="#7e22ce" stroke-width="2"/>
<text x="623.0" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">4. ตรวจคำตอบ</text>
<text x="623.0" y="102" text-anchor="middle" font-size="12" fill="#333">หน่วย อันดับขนาด</text>
<text x="623.0" y="122" text-anchor="middle" font-size="12" fill="#333">และกรณีสุดขั้ว</text>
<text x="360.0" y="198" text-anchor="middle" font-size="13" fill="#444">ขั้นที่ 4 ไม่ใช่ขั้นสุดท้ายเสมอไป: ถ้าคำตอบไม่สมเหตุสมผล ให้กลับไปขั้นที่ 1 หรือ 2</text>
</svg>