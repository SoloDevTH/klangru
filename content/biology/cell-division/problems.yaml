  - id: biology.cells.cell-division.p013
    topics: [biology.cells.cell-division]
    difficulty: 4
    type: numeric
    stem: "เซลล์ในระยะ G1 ของสัตว์ชนิดหนึ่งมี DNA 6 พิโกกรัม เซลล์นี้ผ่านไมโอซิสจนสิ้นสุดเทโลเฟส II เซลล์ที่ได้แต่ละเซลล์มี DNA กี่พิโกกรัม"
    answer: { value: 3, unit: พิโกกรัม }
    hints:
      - "ในระยะ S ปริมาณ DNA เปลี่ยนไปอย่างไร"
      - "จากนั้นแบ่งนิวเคลียส 2 ครั้ง แต่ละครั้ง DNA ถูกแบ่งครึ่ง"
    misconceptions:
      - { match: 6, feedback: "นี่คือปริมาณหลังไมโอซิส I (12 ÷ 2) ยังต้องแบ่งครึ่งอีกในไมโอซิส II" }
      - { match: 1.5, feedback: "ลืมว่า DNA เพิ่มเป็นสองเท่าในระยะ S ก่อนเริ่มแบ่ง" }
    solution: "ระยะ S: $6 \\times 2 = 12$ พิโกกรัม ไมโอซิส I: $12 \\div 2 = 6$ ไมโอซิส II: $6 \\div 2 = 3$ พิโกกรัม ซึ่งเป็นครึ่งหนึ่งของเซลล์ G1 ตามที่เซลล์แฮพลอยด์ควรเป็น"
