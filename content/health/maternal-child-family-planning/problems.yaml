  stem: แม่หลังคลอด 4 สัปดาห์ร้องไห้เกือบทุกวัน นอนไม่หลับแม้ลูกหลับ รู้สึกว่าตัวเองเป็นแม่ที่ไม่ดี และเคยพูดว่าอยากหายไป ครอบครัวควรทำอย่างไร
