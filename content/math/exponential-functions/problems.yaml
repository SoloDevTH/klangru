problems:
  - id: math.ef.p001
    topics: [math.functions.exponential]
    difficulty: 1
    type: mcq
    stem: "ฟังก์ชันใดเป็นฟังก์ชันเอกซ์โพเนนเชียล"
    choices:
      - { id: a, text: "$y = 3 \\cdot 2^x$", correct: true }
      - { id: b, text: "$y = x^2$", feedback: "ตัวแปรอยู่ที่ฐาน ไม่ได้อยู่ที่เลขชี้กำลัง นี่คือฟังก์ชันกำลังสอง" }
      - { id: c, text: "$y = 2x$", feedback: "นี่คือฟังก์ชันเชิงเส้น ค่าเพิ่มขึ้นทีละ 2 (บวก) ไม่ได้คูณด้วยจำนวนเท่าเดิม" }
      - { id: d, text: "$y = x^3 + 2$", feedback: "ตัวแปรอยู่ที่ฐานและยกกำลังด้วยจำนวนคงที่ 3 จึงเป็นพหุนาม ไม่ใช่เอกซ์โพเนนเชียล" }
    hints:
      - "ฟังก์ชันเอกซ์โพเนนเชียลมีรูป $a \\cdot b^x$"
      - "ดูว่าตัวแปร $x$ อยู่ที่ฐานหรือที่เลขชี้กำลัง"
    solution: "ในฟังก์ชันเอกซ์โพเนนเชียล $x$ ต้องอยู่ที่เลขชี้กำลัง ข้อ a คือ $3 \\cdot 2^x$ มี $a = 3$, $b = 2$ ส่วนข้ออื่นมี $x$ อยู่ที่ฐาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p002
    topics: [math.functions.exponential]
    difficulty: 1
    type: numeric
    stem: "ให้ $f(x) = 2^x$ จงหา $f(5)$"
    answer: { value: 32 }
    hints:
      - "$2^5$ คือ 2 คูณตัวเอง 5 ตัว"
      - "คูณทีละขั้น: $2, 4, 8, \\ldots$"
    misconceptions:
      - { match: 10, feedback: "นั่นคือ $2 \\times 5$ แต่ $2^5$ หมายถึง $2 \\times 2 \\times 2 \\times 2 \\times 2$" }
      - { match: 25, feedback: "นั่นคือ $5^2$ ฐานคือ 2 และเลขชี้กำลังคือ 5" }
    solution: "$f(5) = 2^5 = 2 \\times 2 \\times 2 \\times 2 \\times 2 = 32$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p003
    topics: [math.functions.exponential]
    difficulty: 2
    type: numeric
    stem: "ให้ $f(x) = 3 \\cdot 2^x$ จงหา $f(3)$"
    answer: { value: 24 }
    hints:
      - "ลำดับการดำเนินการ: ยกกำลังก่อนคูณ"
      - "หา $2^3$ ก่อน แล้วจึงคูณด้วย 3"
    misconceptions:
      - { match: 216, feedback: "ดูเหมือนคูณ $3 \\times 2 = 6$ ก่อนแล้วยกกำลัง 3 แต่เลขชี้กำลังใช้กับฐาน 2 เท่านั้น" }
      - { match: 18, feedback: "ดูเหมือนคิด $2^3$ เป็น $2 \\times 3 = 6$ ที่ถูกคือ $2^3 = 8$" }
    solution: "$f(3) = 3 \\cdot 2^3 = 3 \\times 8 = 24$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p004
    topics: [math.functions.exponential]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดถูกต้องเกี่ยวกับกราฟของ $y = 2^x$ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ผ่านจุด $(0, 1)$", correct: true }
      - { id: b, text: "ค่า $y$ เป็นบวกเสมอ", correct: true }
      - { id: c, text: "เมื่อ $x$ เพิ่มขึ้น ค่า $y$ เพิ่มขึ้น", correct: true }
      - { id: d, text: "ผ่านจุด $(0, 0)$", feedback: "$2^0 = 1$ ไม่ใช่ 0 จำนวนใด ๆ (ที่ไม่ใช่ 0) ยกกำลังศูนย์ได้ 1" }
      - { id: e, text: "เมื่อ $x$ เป็นลบ ค่า $y$ เป็นลบ", feedback: "$2^{-1} = \\tfrac{1}{2}$ ยังเป็นบวก เลขชี้กำลังลบทำให้เป็นเศษส่วน ไม่ได้ทำให้ติดลบ" }
    hints:
      - "ลองแทน $x = 0$, $x = -1$ และ $x = 2$"
      - "จำ $b^0 = 1$ และ $b^{-n} = \\tfrac{1}{b^n}$"
    solution: "$2^0 = 1$ กราฟผ่าน $(0, 1)$ | $2^x > 0$ ทุกค่า $x$ เช่น $2^{-1} = 0.5$ | ฐาน $2 > 1$ จึงเป็นการเติบโต $y$ เพิ่มเมื่อ $x$ เพิ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p005
    topics: [math.functions.exponential]
    difficulty: 3
    type: numeric
    stem: "ข้าวผัดที่วางทิ้งไว้นอกตู้เย็นมีแบคทีเรีย 300 เซลล์ และแบคทีเรียเพิ่มเป็นสองเท่าทุก 30 นาที หลังจาก 3 ชั่วโมงจะมีแบคทีเรียกี่เซลล์"
    answer: { value: 19200, unit: เซลล์ }
    hints:
      - "หาก่อนว่าใน 3 ชั่วโมงแบคทีเรียเพิ่มเป็นสองเท่ากี่ครั้ง"
      - "3 ชั่วโมงคือ 180 นาที นับจำนวนช่วง 30 นาที"
      - "จำนวนเซลล์ $= 300 \\cdot 2^n$ เมื่อ $n$ คือจำนวนครั้งที่เพิ่มเป็นสองเท่า"
    misconceptions:
      - { match: 3600, feedback: "ดูเหมือนคิดเป็น $300 \\times 2 \\times 6$ แต่เพิ่มเป็นสองเท่าแต่ละครั้งคือการคูณ 2 ซ้ำ ๆ ต้องใช้ $2^6$" }
      - { match: 2400, feedback: "ดูเหมือนใช้จำนวนชั่วโมง (3) เป็นเลขชี้กำลัง แต่แบคทีเรียเพิ่มเป็นสองเท่าทุก 30 นาที ใน 3 ชั่วโมงจึงเพิ่ม 6 ครั้ง" }
    solution: "180 นาที ÷ 30 นาที = 6 ครั้ง จำนวนเซลล์ $= 300 \\cdot 2^6 = 300 \\times 64 = 19{,}200$ เซลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p006
    topics: [math.functions.exponential]
    difficulty: 3
    type: numeric
    stem: "ฝากเงิน 20,000 บาทกับธนาคาร ดอกเบี้ย 3% ต่อปี ทบต้นปีละครั้ง เมื่อครบ 4 ปีจะมีเงินรวมกี่บาท (ตอบเป็นจำนวนเต็มบาท)"
    answer: { value: 22510.18, tolerance: 1, unit: บาท }
    hints:
      - "ใช้สูตร $A = P(1 + r)^n$"
      - "$r = 3\\% = 0.03$ ตัวคูณต่อปีคือ $1.03$"
      - "คำนวณ $(1.03)^4$ ก่อน แล้วคูณด้วยเงินต้น"
    misconceptions:
      - { match: 22400, feedback: "นั่นคือดอกเบี้ยแบบไม่ทบต้น (ปีละ 600 บาท) แต่ทบต้นต้องคิดดอกเบี้ยจากเงินรวมดอกเบี้ยของปีก่อนด้วย" }
      - { match: 2510.18, feedback: "นั่นคือดอกเบี้ยอย่างเดียว โจทย์ถามเงินรวม ต้องรวมเงินต้น 20,000 บาทด้วย" }
    solution: "$A = 20{,}000(1.03)^4 = 20{,}000 \\times 1.12550881 \\approx 22{,}510.18$ บาท ประมาณ 22,510 บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p007
    topics: [math.functions.exponential]
    difficulty: 3
    type: match
    stem: "จับคู่ฟังก์ชันกับลักษณะของกราฟ"
    pairs:
      - { left: "$y = 2^x$", right: "เพิ่มขึ้น และตัดแกน $y$ ที่ 1" }
      - { left: "$y = \\left(\\tfrac{1}{2}\\right)^x$", right: "ลดลง และตัดแกน $y$ ที่ 1" }
      - { left: "$y = 3 \\cdot 2^x$", right: "เพิ่มขึ้น และตัดแกน $y$ ที่ 3" }
      - { left: "$y = 2^x + 1$", right: "เพิ่มขึ้น และเข้าใกล้เส้น $y = 1$ เมื่อ $x$ ติดลบมาก ๆ" }
    hints:
      - "จุดตัดแกน $y$ หาได้จากการแทน $x = 0$"
      - "ฐานมากกว่า 1 กราฟเพิ่มขึ้น ฐานระหว่าง 0 กับ 1 กราฟลดลง"
      - "ถ้าบวกค่าคงที่เข้าไป กราฟทั้งเส้นเลื่อนขึ้น รวมทั้งเส้นที่กราฟเข้าใกล้ด้วย"
    solution: "$2^0 = 1$ และฐาน 2 เพิ่มขึ้น | $(\\tfrac12)^0 = 1$ และฐาน $\\tfrac12$ ลดลง | $3 \\cdot 2^0 = 3$ | $2^x + 1$ คือกราฟ $2^x$ เลื่อนขึ้น 1 หน่วย เมื่อ $x$ ติดลบมาก $2^x \\to 0$ จึงเข้าใกล้ $y = 1$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p008
    topics: [math.functions.exponential]
    difficulty: 4
    type: numeric
    stem: "รถจักรยานยนต์คันหนึ่งซื้อมาราคา 60,000 บาท มูลค่าลดลง 20% ต่อปี (ลดจากมูลค่าที่เหลือในแต่ละปี) หลังจาก 3 ปีจะมีมูลค่ากี่บาท"
    answer: { value: 30720, tolerance: 1, unit: บาท }
    hints:
      - "ลดลง 20% ต่อปี แปลว่าแต่ละปีเหลือ 80% ของมูลค่าเดิม"
      - "ตัวคูณต่อปีคือ 0.8 ใช้ $V = 60{,}000(0.8)^n$"
    misconceptions:
      - { match: 24000, feedback: "ดูเหมือนคิดว่า 3 ปีลดรวม 60% แต่แต่ละปีลดจากมูลค่าที่เหลือ ไม่ใช่จากราคาเดิม" }
      - { match: 480, feedback: "ดูเหมือนใช้ตัวคูณ 0.2 แต่ลดลง 20% แปลว่าเหลือ 80% ต้องคูณ 0.8" }
    solution: "$V = 60{,}000(0.8)^3 = 60{,}000 \\times 0.512 = 30{,}720$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p009
    topics: [math.functions.exponential]
    difficulty: 4
    type: numeric
    stem: "ยาชนิดหนึ่งมีครึ่งชีวิตในร่างกาย 6 ชั่วโมง (ปริมาณยาลดลงเหลือครึ่งหนึ่งทุก 6 ชั่วโมง) ถ้ากินยา 200 มิลลิกรัม หลังจาก 24 ชั่วโมงจะเหลือยาในร่างกายกี่มิลลิกรัม"
    answer: { value: 12.5, tolerance: 0.13, unit: mg }
    hints:
      - "นับก่อนว่าใน 24 ชั่วโมงมีครึ่งชีวิตกี่ช่วง"
      - "แต่ละช่วงคูณด้วย $\\tfrac{1}{2}$ ใช้ $200 \\cdot \\left(\\tfrac{1}{2}\\right)^n$"
    misconceptions:
      - { match: 50, feedback: "ดูเหมือนหาร 4 ครั้งเดียว แต่ยาลดลงครึ่งหนึ่ง 4 ครั้งติดกัน ต้องหาร 2 สี่ครั้ง คือหาร 16" }
      - { match: 25, feedback: "ดูเหมือนนับได้ 3 ช่วง แต่ 24 ÷ 6 = 4 ช่วง" }
    solution: "24 ÷ 6 = 4 ช่วง ยาที่เหลือ $= 200 \\cdot \\left(\\tfrac{1}{2}\\right)^4 = \\tfrac{200}{16} = 12.5$ มิลลิกรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p010
    topics: [math.functions.exponential]
    difficulty: 4
    type: mcq
    stem: "ฟังก์ชัน $y = 5(0.8)^x$ แสดงการเปลี่ยนแปลงแบบใด"
    choices:
      - { id: a, text: "การสลาย ลดลง 20% ทุกครั้งที่ $x$ เพิ่มขึ้น 1", correct: true }
      - { id: b, text: "การเติบโต เพราะ $5 > 1$", feedback: "5 คือค่าเริ่มต้น ($y$ เมื่อ $x = 0$) การเติบโตหรือสลายดูจากฐาน $0.8$" }
      - { id: c, text: "การสลาย ลดลง 80% ทุกครั้งที่ $x$ เพิ่มขึ้น 1", feedback: "คูณ 0.8 แปลว่าเหลือ 80% จึงลดลง $100\\% - 80\\% = 20\\%$" }
      - { id: d, text: "การเติบโต เพิ่มขึ้น 80% ทุกครั้งที่ $x$ เพิ่มขึ้น 1", feedback: "ฐาน $0.8 < 1$ คูณแล้วได้ค่าน้อยลง จึงเป็นการสลาย" }
    hints:
      - "ดูฐาน $b$ ว่ามากกว่าหรือน้อยกว่า 1"
      - "คูณด้วย $b$ แปลว่าเหลือ $b \\times 100\\%$ ของค่าเดิม"
    solution: "ฐาน $0.8$ อยู่ระหว่าง 0 กับ 1 จึงเป็นการสลาย ทุกขั้นเหลือ 80% ของค่าเดิม คือลดลง 20%"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p011
    topics: [math.functions.exponential]
    difficulty: 5
    type: numeric
    stem: "แก้สมการ $2^{x+1} = 32$"
    answer: { value: 4 }
    hints:
      - "เขียน 32 ให้เป็นเลขยกกำลังฐาน 2"
      - "ถ้า $2^m = 2^n$ แล้ว $m = n$"
      - "เทียบเลขชี้กำลังทั้งสองข้าง แล้วแก้สมการเชิงเส้น"
    misconceptions:
      - { match: 15, feedback: "ดูเหมือนคิดว่า $2^{x+1}$ คือ $2(x + 1)$ แต่ $x + 1$ เป็นเลขชี้กำลัง ให้เขียน $32 = 2^5$" }
      - { match: 5, feedback: "5 คือค่าของ $x + 1$ ยังต้องลบ 1 อีกครั้ง" }
    solution: "$32 = 2^5$ ดังนั้น $2^{x+1} = 2^5$ → $x + 1 = 5$ → $x = 4$ ตรวจ: $2^{5} = 32$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p012
    topics: [math.functions.exponential]
    difficulty: 5
    type: expression
    stem: "ฟังก์ชันเอกซ์โพเนนเชียล $f(x) = a \\cdot b^x$ ผ่านจุด $(0, 3)$ และ $(2, 12)$ โดย $b > 0$ จงหา $f(x)$"
    prefix: "f(x) ="
    answer: { latex: "3\\cdot 2^{x}", variables: [x] }
    hints:
      - "แทนจุด $(0, 3)$ ก่อน เพราะ $b^0 = 1$ จะได้ค่า $a$ ทันที"
      - "แทนจุด $(2, 12)$ ได้ $a \\cdot b^2 = 12$"
      - "หา $b^2$ แล้วถอดรากที่สอง เลือกค่าที่เป็นบวก"
    misconceptions:
      - { match: "3\\cdot 4^{x}", feedback: "4 คือค่าของ $b^2$ ยังต้องถอดรากที่สองเพื่อหา $b$ ลองตรวจ: $3 \\cdot 4^2 = 48$ ไม่ใช่ 12" }
      - { match: "\\frac{9}{2}x+3", feedback: "นี่คือเส้นตรงที่ผ่านสองจุดนี้ แต่โจทย์ให้หาฟังก์ชันเอกซ์โพเนนเชียลรูป $a \\cdot b^x$" }
    solution: "จาก $(0, 3)$: $a \\cdot b^0 = a = 3$ จาก $(2, 12)$: $3b^2 = 12$ → $b^2 = 4$ → $b = 2$ (เพราะ $b > 0$) ดังนั้น $f(x) = 3 \\cdot 2^x$"
    license: CC-BY-SA-4.0
    ai_assisted: true
