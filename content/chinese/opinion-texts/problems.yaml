  items:
  - 学习语言不是背单词 (xuéxí yǔyán bú shì bèi dāncí)，而是要多说 (érshì yào duō shuō)、多听 (duō tīng)。
  - 很多人花很多时间做题 (hěn duō rén huā hěn duō shíjiān zuò tí)，却不敢开口 (què bù gǎn kāikǒu)。
  - 与其一直看书 (yǔqí yìzhí kànshū)，不如找朋友练习对话 (bùrú zhǎo péngyou liànxí duìhuà)。
  - 当然 (dāngrán)，词汇也很重要 (cíhuì yě hěn zhòngyào)，但它只是基础 (dàn tā zhǐshì jīchǔ)。
  - 总之 (zǒngzhī)，只有多练习 (zhǐyǒu duō liànxí)，才能真正学会一门语言 (cái néng zhēnzhèng xuéhuì yì mén yǔyán)。
