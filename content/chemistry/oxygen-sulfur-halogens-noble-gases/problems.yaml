  - id: chemistry.descriptive.oxygen-sulfur-halogens-noble-gases.p017
    topics: [chemistry.descriptive.oxygen-sulfur-halogens-noble-gases]
    difficulty: 4
    type: numeric
    stem: 'ภาชนะ 10.0 L บรรจุแก๊ส He 2.0 mol และแก๊ส Ne 3.0 mol ที่ 300 K แก๊สทั้งสองเป็นแก๊สอุดมคติและไม่ทำปฏิกิริยากัน ความดันย่อยของ He เท่าใด กำหนด $R = 0.08206$ L·atm/(mol·K) (ตอบเป็น atm)'
    answer: { value: 4.92, tolerance: 0.02, unit: atm }
    hints:
      - 'หาความดันรวมจาก $P = nRT/V$ โดยใช้จำนวนโมลรวมของแก๊สทั้งสอง'
      - 'ความดันย่อยของแก๊สแต่ละชนิดเท่ากับเศษส่วนโมลคูณความดันรวม'
    misconceptions:
      - { match: 7.39, feedback: 'ใช้สัดส่วนของ Ne แทน He ทำให้ได้ความดันย่อยที่สูงกว่า' }
    solution: '$n_{total} = 5.0$ mol $P_{total} = 5.0 \times 0.08206 \times 300 / 10.0 = 12.31$ atm เศษส่วนโมลของ He $= 2/5 = 0.40$ จึง $P_{He} = 0.40 \times 12.31 = 4.92$ atm'
