id: computer.programming.events-selection-primary
subject: computer
title: { th: เหตุการณ์ เงื่อนไข และตัวแปรในโปรแกรมแบบบล็อก, en: "Events, conditions and variables in block programs" }
summary: ใช้เหตุการณ์ วงวน และเงื่อนไขในโปรแกรมแบบบล็อก เก็บค่าที่เปลี่ยนได้ไว้ในตัวแปร วางแผนด้วยผังงาน อ่านว่าบล็อกแต่ละส่วนทำอะไรต่อโปรแกรม และเปรียบเทียบสองวิธีที่ให้ผลเหมือนกัน
difficulty: 2.5
minutes: 40
prerequisites: [computer.programming.block-programming, computer.algorithms.logical-reasoning]
encompasses:
  - { id: computer.programming.block-programming, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: block-script.svg
    alt: "สคริปต์แบบบล็อกเก็บผลไม้เรียงจากบนลงล่าง บล็อกแรกเมื่อกดธงเขียว บล็อกที่สองตั้งคะแนนเป็น 0 บล็อกที่สามทำซ้ำตลอดไป ข้างในมีให้ผลไม้เลื่อนลง 3 ก้าว และถ้าชนตะกร้าแล้วเปลี่ยนคะแนนทีละ 1 บล็อกที่ย่อหน้าเข้าไปอยู่ในวงวนหรือเงื่อนไข"
    caption: "อ่านสคริปต์จากบนลงล่าง ส่วนที่ย่อหน้าเข้าไปคือส่วนที่อยู่ในวงวนหรือเงื่อนไข"
  - type: worked-example
    title: คะแนนเปลี่ยนตามเหตุการณ์ที่เกิดขึ้น
    problem: "เกมเก็บผลไม้มีตัวแปร คะแนน เริ่มที่ 0 เมื่อตะกร้าชนมะม่วงให้เพิ่ม 1 คะแนน เมื่อชนสับปะรดให้เพิ่ม 2 คะแนน และเมื่อชนระเบิดจะลดชีวิตแต่ไม่เปลี่ยนคะแนน ถ้าเกิดเหตุการณ์ตามลำดับคือ มะม่วง สับปะรด มะม่วง ระเบิด แล้วมะม่วง คะแนนสุดท้ายเป็นเท่าใด"
    steps:
      - text: "เริ่มเกมด้วยคะแนน 0"
      - text: "มะม่วงครั้งแรก เพิ่ม 1 คะแนน รวมเป็น 1 คะแนน"
      - text: "สับปะรด เพิ่ม 2 คะแนน รวมเป็น 3 คะแนน"
      - text: "มะม่วงครั้งที่สอง เพิ่ม 1 คะแนนเป็น 4 คะแนน ส่วนระเบิดลดชีวิตแต่คะแนนยังเป็น 4"
        why: "เหตุการณ์ที่ไม่ได้เปลี่ยนค่าตัวแปรนี้ ทำให้คะแนนคงเดิม"
      - text: "มะม่วงครั้งสุดท้าย เพิ่ม 1 คะแนน รวมเป็น 5 คะแนน"
    answer: "คะแนนสุดท้ายคือ 5 คะแนน"
  - { type: check, problem: computer.programming.events-selection-primary.p013, prompt: "ลองคิดว่าการวางบล็อกตั้งค่าไว้ในวงวนจะเกิดผลอะไร" }
  - type: figure
    src: score-check.svg
    alt: "ผังงานการตัดสินใจเริ่มจากกล่องเริ่มรอบใหม่ แล้วถึงข้าวหลามตัดถามว่าคะแนนมากกว่าหรือเท่ากับ 10 หรือไม่ ถ้าใช่ลูกศรชี้ไปกล่องแสดงชนะ ถ้าไม่ใช่ลูกศรชี้ลงไปกล่องเล่นต่อ"
    caption: "ผังงานใช้รูปข้าวหลามตัดแทนการตัดสินใจ มีทางออกสองทางคือใช่และไม่ใช่"
  - type: worked-example
    title: ไล่ค่าตัวแปรทีละรอบในวงวนที่มีเงื่อนไข
    problem: "ตัวแปร คะแนน เริ่มที่ 0 ทำซ้ำ 5 รอบ ในแต่ละรอบ ถ้ารอบนั้นเป็นเลขคี่ ให้เพิ่มคะแนน 1 มิฉะนั้นให้เพิ่มคะแนน 2 หลังจบ 5 รอบ คะแนนเป็นเท่าใด"
    steps:
      - text: "รอบที่ 1 เป็นเลขคี่ เพิ่ม 1 คะแนน จึงได้ 1"
      - text: "รอบที่ 2 เป็นเลขคู่ เพิ่ม 2 คะแนน จึงได้ 3"
      - text: "รอบที่ 3 เป็นเลขคี่ เพิ่ม 1 คะแนน จึงได้ 4"
        why: "ค่าของรอบเปลี่ยนไปทุกครั้ง เงื่อนไขจึงต้องตรวจใหม่ทุกรอบ"
      - text: "รอบที่ 4 เป็นเลขคู่ เพิ่ม 2 คะแนน จึงได้ 6"
      - text: "รอบที่ 5 เป็นเลขคี่ เพิ่ม 1 คะแนน จึงได้ 7"
    answer: "คะแนนสุดท้ายคือ 7 คะแนน"
  - { type: check, problem: computer.programming.events-selection-primary.p016, prompt: "ก่อนต่อบล็อก ควรวางแผนขั้นตอนใดก่อนหลัง" }
glossary:
  - { term: เหตุการณ์ (event), definition: "สิ่งที่เกิดขึ้นแล้วทำให้บล็อกข้างใต้เริ่มทำงาน เช่น เมื่อกดธงเขียว หรือเมื่อตัวละครชนผลไม้" }
  - { term: ตัวแปร (variable), definition: "ชื่อของกล่องที่เก็บค่าซึ่งอาจเปลี่ยนได้ระหว่างโปรแกรมทำงาน เช่น คะแนน" }
  - { term: เงื่อนไข (condition), definition: "คำถามที่ตอบได้ว่าจริงหรือไม่จริง ใช้ตัดสินว่าจะทำบล็อกข้างในหรือไม่" }
  - { term: วงวน (loop), definition: "การทำบล็อกชุดเดิมซ้ำหลายรอบ เช่น ทำซ้ำ 10 ครั้ง หรือทำซ้ำตลอดไป" }
  - { term: ผังงาน (flowchart), definition: "แผนภาพที่ใช้รูปร่างต่างกันแทนขั้นตอน เช่น รูปข้าวหลามตัดแทนการตัดสินใจ" }
flashcards:
  - { front: "เหตุการณ์ในโปรแกรมแบบบล็อกคืออะไร", back: "สิ่งที่เกิดขึ้นแล้วทำให้บล็อกข้างใต้เริ่มทำงาน เช่น เมื่อกดธงเขียว" }
  - { front: "ค่าที่เปลี่ยนได้ในเกม ควรเก็บไว้ที่ไหน", back: "เก็บไว้ในตัวแปรที่มีชื่อบอกความหมาย เช่น คะแนน" }
  - { front: "ตั้งค่าตัวแปรไว้ในวงวนจะเกิดอะไร", back: "ค่าจะถูกรีเซ็ตทุกรอบ คะแนนจึงไม่สะสม" }
  - { front: "บล็อกถ้า–มิฉะนั้นต่างจากบล็อกถ้าอย่างไร", back: "บล็อกถ้า–มิฉะนั้นเลือกได้สองทาง ส่วนบล็อกถ้าเลือกทำหรือไม่ทำเพียงทางเดียว" }
