  - id: math.prob.p017
    topics: [math.prob.probability]
    difficulty: 3
    type: numeric
    stem: "ตารางสองทางแสดงนักเรียนชั้นหนึ่ง 40 คน จำแนกตามเพศและการชอบเล่นกีฬา สุ่มนักเรียน 1 คน ความน่าจะเป็นที่จะได้นักเรียนหญิง **หรือ** นักเรียนที่ชอบเล่นกีฬา (อย่างน้อยหนึ่งอย่าง) เป็นเท่าใด (ตอบเป็นทศนิยม)"
    figure: { src: two-way-table.svg, alt: "ตารางสองทาง แถวชาย: ชอบเล่นกีฬา 14 ไม่ชอบ 6 รวม 20 แถวหญิง: ชอบเล่นกีฬา 9 ไม่ชอบ 11 รวม 20 แถวรวม: ชอบเล่นกีฬา 23 ไม่ชอบ 17 รวม 40" }
    answer: { value: 0.85, tolerance: 0.005 }
    hints:
      - "นับนักเรียนที่เป็นหญิง หรือชอบเล่นกีฬา หรือทั้งสองอย่าง โดยไม่นับใครซ้ำ"
      - "ใช้ $P(A \\text{ หรือ } B) = P(A) + P(B) - P(A \\text{ และ } B)$ หญิง 20 คน ชอบกีฬา 23 คน หญิงที่ชอบกีฬา 9 คน"
    misconceptions:
