problems:
- id: thai.poetry.rhymes-slogans.p001
  topics:
  - thai.poetry.rhymes-slogans
  difficulty: 1
  type: mcq
  stem: คำใด **คล้องจอง** กับคำว่า **ปลา**
  choices:
  - id: a
    text: ตา
    correct: true
    feedback: ถูก สระอาเหมือนกัน และไม่มีตัวสะกดทั้งคู่
  - id: b
    text: ปลาย
    feedback: ปลาย มี ย สะกด (อา + ย) ไม่คล้องจองกับ ปลา
  - id: c
    text: ปู
    feedback: ปู ขึ้นต้นด้วย ป เหมือนกัน เป็นสัมผัสอักษร ไม่ใช่คล้องจองทางสระ
  - id: d
    text: ปัก
    feedback: สระอะ + ก สะกด ต่างจากสระอา
  hints:
  - ดูสระและตัวสะกดของ ปลา
  - ปลา = ปล + อา ไม่มีตัวสะกด
  solution: '**ตา** คล้องจองกับ ปลา (สระอา ไม่มีตัวสะกด)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.rhymes-slogans.p002
  topics:
  - thai.poetry.rhymes-slogans
  difficulty: 1
  type: text
  stem: คำว่า **มา** กับ **ตา** คล้องจองกันเพราะมีสระใดเหมือนกัน (พิมพ์ชื่อสระ)
  accepted:
  - อา
  - สระอา
  - า
  misconceptions:
  - match: ม
    feedback: ม เป็นพยัญชนะต้นของ มา ไม่ใช่สระ
  - match: อะ
    feedback: อะ เป็นสระเสียงสั้น มา กับ ตา ใช้สระเสียงยาว
  hints:
  - ตัดพยัญชนะต้นออก เหลืออะไร
  - เสียงที่เหลือคือเสียงสระ
  solution: มา กับ ตา มี **สระอา** เหมือนกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.rhymes-slogans.p003
  topics:
  - thai.poetry.rhymes-slogans
  difficulty: 1
  type: mcq
  stem: คู่ใดเป็น **สัมผัสอักษร**
  choices:
  - id: a
    text: สวย – ใส
    correct: true
    feedback: ถูก ขึ้นต้นด้วยเสียง ส เหมือนกัน
  - id: b
    text: กา – ปลา
    feedback: เป็นสัมผัสสระ (สระอา)
  - id: c
    text: ขัน – ฉัน
    feedback: เป็นสัมผัสสระ (อะ + น)
  - id: d
    text: ตัว – หัว
    feedback: เป็นสัมผัสสระ (อัว)
  hints:
  - สัมผัสอักษรดูพยัญชนะต้น
  - หาคู่ที่ขึ้นต้นด้วยเสียงเดียวกัน
  solution: '**สวย – ใส** เป็นสัมผัสอักษร (เสียง ส)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.rhymes-slogans.p004
  topics:
  - thai.poetry.rhymes-slogans
  difficulty: 2
  type: match
  stem: จับคู่คำที่คล้องจองกัน (สัมผัสสระ)
  pairs:
  - left: กา
    right: ปลา
  - left: ดี
    right: มี
  - left: ขัน
    right: ฉัน
  - left: ตัว
    right: หัว
  hints:
  - ตัดพยัญชนะต้นออกแล้วเทียบเสียงที่เหลือ
  - อย่าลืมดูตัวสะกดด้วย
  solution: กา–ปลา (อา) · ดี–มี (อี) · ขัน–ฉัน (อะ+น) · ตัว–หัว (อัว)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.rhymes-slogans.p005
  topics:
  - thai.poetry.rhymes-slogans
  difficulty: 2
  type: mcq
  stem: ทำไม **ขัน** กับ **ขาน** จึง **ไม่** คล้องจองกัน
  choices:
  - id: a
    text: สระเสียงสั้นกับสระเสียงยาวต่างกัน
    correct: true
    feedback: ถูก ขัน ใช้สระอะ (สั้น) ขาน ใช้สระอา (ยาว)
  - id: b
    text: ตัวสะกดต่างกัน
    feedback: ตัวสะกดคือ น เหมือนกันทั้งคู่
  - id: c
    text: พยัญชนะต้นต่างกัน
    feedback: พยัญชนะต้นคือ ข เหมือนกัน และพยัญชนะต้นไม่ได้ตัดสินสัมผัสสระ
  - id: d
    text: วรรณยุกต์ต่างกัน
    feedback: ทั้งสองคำเสียงจัตวา และวรรณยุกต์ต่างกันก็ยังคล้องจองได้
  hints:
  - แยกสระของแต่ละคำ
  - ไม้หันอากาศ ( ั ) มาจากสระอะ
  solution: ขัน (อะ) กับ ขาน (อา) **สระสั้นยาวต่างกัน** จึงไม่คล้องจอง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.rhymes-slogans.p006
  topics:
  - thai.poetry.rhymes-slogans
  difficulty: 2
  type: order
  stem: เรียงวรรคให้เป็นคำคล้องจองที่ต่อกัน (คำท้ายวรรคหน้าคล้องจองกับวรรคถัดไป)
  items:
  - ตื่นนอน
  - ก่อนไก่ขัน
  - ฉันล้างหน้า
  - ทาแป้ง
  - แต่งตัว
  - หวีหัว
  hints:
  - วรรคแรกคือ ตื่นนอน
  - หาวรรคที่มีคำคล้องจองกับ นอน แล้วต่อไปเรื่อย ๆ
  solution: ตื่นนอน → ก่อนไก่ขัน (นอน–ก่อน) → ฉันล้างหน้า (ขัน–ฉัน) → ทาแป้ง (หน้า–ทา) → แต่งตัว (แป้ง–แต่ง) → หวีหัว (ตัว–หัว)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.rhymes-slogans.p007
  topics:
  - thai.poetry.rhymes-slogans
  difficulty: 2
  type: mcq
  stem: ต่อคำคล้องจองจาก "ไปโรงเรียน" วรรคใดเหมาะที่สุด
  choices:
  - id: a
    text: เขียนหนังสือ
    correct: true
    feedback: ถูก เรียน – เขียน คล้องจองกัน (เอีย + น)
  - id: b
    text: อ่านหนังสือ
    feedback: อ่าน (อา + น) ไม่คล้องจองกับ เรียน
  - id: c
    text: ทำการบ้าน
    feedback: ไม่มีคำใดคล้องจองกับ เรียน
  - id: d
    text: ครูใจดี
    feedback: ไม่มีคำใดคล้องจองกับ เรียน
  hints:
  - คำท้ายคือ เรียน
  - หาคำที่มีเสียง /เอียน/
  solution: '**เขียนหนังสือ** (เรียน – เขียน)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.rhymes-slogans.p008
  topics:
  - thai.poetry.rhymes-slogans
  difficulty: 3
  type: mcq
  stem: ดูป้ายคำขวัญห้อง ป.3/2 คำคู่ใดในสองบรรทัดใหญ่ **คล้องจองกัน**
  figure:
    src: class-slogan.svg
    alt: 'ป้ายคำขวัญห้อง ป.3/2 ตัวใหญ่สองบรรทัด: ห้องเรียนสะอาด / ไม่ขาดน้ำใจ บรรทัดเล็กด้านล่าง: ช่วยกันเก็บขยะ แบ่งปันเพื่อนเสมอ'
  choices:
  - id: a
    text: สะอาด – ขาด
    correct: true
    feedback: ถูก เสียง /อาด/ เหมือนกัน (อา + ด สะกด)
  - id: b
    text: ห้อง – ไม่
    feedback: สระต่างกัน (ออ กับ ไอ)
  - id: c
    text: เรียน – ใจ
    feedback: สระต่างกัน (เอีย กับ ไอ)
  - id: d
    text: สะอาด – น้ำ
    feedback: สระและตัวสะกดต่างกัน
  hints:
  - ดูคำท้ายบรรทัดแรก
  - หาคำในบรรทัดที่สองที่มีเสียงท้ายเหมือนกัน
  solution: '**สะอาด – ขาด** คล้องจองกัน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.rhymes-slogans.p009
  topics:
  - thai.poetry.rhymes-slogans
  difficulty: 3
  type: mcq
  stem: คู่ใด **คล้องจองกัน** (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: บาท – ชาติ
    correct: true
    feedback: ถูก ออกเสียง /อาด/ เหมือนกัน แม้ตัวสะกดเขียนต่างกัน
  - id: b
    text: รด – รส
    correct: true
    feedback: ถูก ออกเสียง /โอะ + ด/ เหมือนกัน
  - id: c
    text: บาน – บาง
    feedback: ตัวสะกดต่างมาตรา (น กับ ง)
  - id: d
    text: ขัน – ขาน
    feedback: สระสั้นยาวต่างกัน
  hints:
  - ดูที่เสียงที่อ่าน ไม่ใช่ตัวเขียน
  - ท ติ ส ออกเสียงตัวสะกด /ด/ เหมือนกัน
  solution: '**บาท–ชาติ** และ **รด–รส** คล้องจองกัน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.rhymes-slogans.p010
  topics:
  - thai.poetry.rhymes-slogans
  difficulty: 3
  type: mcq
  stem: ข้อใด **ไม่ใช่** ลักษณะของคำขวัญที่ดี
  choices:
  - id: a
    text: ยาวหลายบรรทัด อธิบายรายละเอียดครบทุกเรื่อง
    correct: true
    feedback: ถูก คำขวัญต้องสั้น จำง่าย
  - id: b
    text: มีคำคล้องจองเชื่อมวรรค
    feedback: เป็นลักษณะที่ดีของคำขวัญ
  - id: c
    text: ใช้คำง่าย ความหมายดี
    feedback: เป็นลักษณะที่ดีของคำขวัญ
  - id: d
    text: บอกจุดเด่นหรือชวนให้ทำสิ่งดี
    feedback: เป็นจุดมุ่งหมายของคำขวัญ
  hints:
  - คำขวัญต้องจำได้ง่าย
  - ข้อใดทำให้จำยาก
  solution: คำขวัญ**ไม่ควรยาว**อธิบายละเอียด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.rhymes-slogans.p011
  topics:
  - thai.poetry.rhymes-slogans
  difficulty: 3
  type: match
  stem: คำขวัญจังหวัดชลบุรี "ทะเลงาม ข้าวหลามอร่อย อ้อยหวาน จักสานดี ประเพณีวิ่งควาย" จับคู่คำที่คล้องจองกัน
  pairs:
  - left: งาม
    right: หลาม
  - left: อร่อย
    right: อ้อย
  - left: หวาน
    right: สาน
  - left: ดี
    right: ประเพณี
  hints:
  - คำท้ายวรรคหน้าคล้องจองกับคำแรกของวรรคถัดไป
  - ประเพณี ลงท้ายด้วยเสียง /นี/
  solution: งาม–หลาม · อร่อย–อ้อย · หวาน–สาน · ดี–(ประเพ)ณี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.rhymes-slogans.p012
  topics:
  - thai.poetry.rhymes-slogans
  difficulty: 4
  type: mcq
  stem: คำขวัญจังหวัดสตูล "สตูล สงบ สะอาด ธรรมชาติบริสุทธิ์" มีสัมผัสแบบใดบ้าง (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: สัมผัสอักษรเสียง ส ใน สตูล สงบ สะอาด
    correct: true
    feedback: ถูก ขึ้นต้นด้วยเสียง ส ทั้งสามคำ
  - id: b
    text: สัมผัสสระระหว่าง สะอาด กับ (ธรรม)ชาติ
    correct: true
    feedback: ถูก ออกเสียง /อาด/ เหมือนกัน
  - id: c
    text: สัมผัสสระระหว่าง สตูล กับ สงบ
    feedback: สตูล (อู + น) กับ สงบ (โอะ + บ) สระต่างกัน
  hints:
  - ดูทั้งพยัญชนะต้นและเสียงท้ายของแต่ละคำ
  - ชาติ อ่านว่า ชาด
  solution: มี**สัมผัสอักษร** (ส) และ**สัมผัสสระ** (สะอาด–ชาติ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.rhymes-slogans.p013
  topics:
  - thai.poetry.rhymes-slogans
  difficulty: 4
  type: mcq
  stem: คำขวัญนครราชสีมา "...หมี่โคราช ปราสาทหิน..." คำว่า โคราช กับ ปราสาท คล้องจองกันเพราะอะไร
  choices:
  - id: a
    text: ออกเสียง /อาด/ เหมือนกัน แม้ตัวสะกด ช กับ ท เขียนต่างกัน
    correct: true
    feedback: ถูก ช และ ท สะกดออกเสียง /ด/ ทั้งคู่ (แม่กด)
  - id: b
    text: ขึ้นต้นด้วยพยัญชนะเดียวกัน
    feedback: โค กับ ปรา ขึ้นต้นต่างกัน
  - id: c
    text: มีจำนวนพยางค์เท่ากัน
    feedback: จำนวนพยางค์ไม่ได้ทำให้คล้องจอง
  - id: d
    text: ไม่คล้องจองกัน เพราะตัวสะกดต่างกัน
    feedback: ตัวเขียนต่างกัน แต่เสียงเหมือนกัน คำคล้องจองดูที่เสียง
  hints:
  - 'ดูพยางค์ท้าย: ราช กับ สาท'
  - ช และ ท สะกดอยู่มาตราใด
  solution: ราช กับ สาท ออกเสียง **/อาด/** เหมือนกัน (ช ท อยู่แม่กด)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.rhymes-slogans.p014
  topics:
  - thai.poetry.rhymes-slogans
  difficulty: 4
  type: mcq
  stem: ชมรมรักษ์น้ำต้องการคำขวัญชวนประหยัดน้ำ ข้อใดเหมาะที่สุด
  choices:
  - id: a
    text: ปิดก๊อกทุกครั้ง น้ำยังมีใช้
    correct: true
    feedback: ถูก สั้น มีสัมผัส ครั้ง–ยัง และชวนให้ทำสิ่งดี
  - id: b
    text: น้ำเป็นสิ่งสำคัญต่อชีวิตของมนุษย์ สัตว์ และพืชทุกชนิดในโลก
    feedback: ยาว ไม่มีคำคล้องจอง จำยาก
  - id: c
    text: เปิดน้ำทิ้งไว้ สนุกสบายใจ
    feedback: มีสัมผัส ไว้–ใจ แต่ความหมายชวนทำสิ่งไม่ดี
  - id: d
    text: น้ำ
    feedback: สั้นเกินไป ไม่มีความหมายชวนให้ทำ
  hints:
  - คำขวัญที่ดีต้องสั้น มีสัมผัส และความหมายดี
  - ตรวจทั้งเสียงและความหมาย
  solution: '**ปิดก๊อกทุกครั้ง น้ำยังมีใช้** (ครั้ง–ยัง)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.rhymes-slogans.p015
  topics:
  - thai.poetry.rhymes-slogans
  difficulty: 5
  type: numeric
  stem: คำขวัญจังหวัดสุราษฎร์ธานี "เมืองร้อยเกาะ เงาะอร่อย หอยใหญ่ ไข่แดง แหล่งธรรมะ" มีคู่คำคล้องจองที่เชื่อม **วรรคที่อยู่ติดกัน** กี่คู่
  answer:
    value: 4
    tolerance: 0
    unit: คู่
  misconceptions:
  - match: 5
    feedback: 5 คือจำนวนวรรค คู่ที่เชื่อมวรรคติดกันมีน้อยกว่าจำนวนวรรค 1
  - match: 3
    feedback: อาจลืมคู่ ใหญ่–ไข่ ซึ่ง ใ กับ ไ ออกเสียงเดียวกัน
  hints:
  - ดูคำท้ายของแต่ละวรรคกับคำแรกของวรรคถัดไป
  - ใ กับ ไ ออกเสียง /ไอ/ เหมือนกัน
  solution: เกาะ–เงาะ · อร่อย–หอย · ใหญ่–ไข่ · แดง–แหล่ง = **4 คู่**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.poetry.rhymes-slogans.p016
  topics:
  - thai.poetry.rhymes-slogans
