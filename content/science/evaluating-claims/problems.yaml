problems:
  - id: science.inquiry.evaluating-claims.p001
    topics: [science.inquiry.evaluating-claims]
    difficulty: 1
    type: match
    stem: "จับคู่คำกับความหมาย"
    pairs:
      - { left: "กลุ่มควบคุม", right: "กลุ่มที่ไม่ได้รับสิ่งที่ทดสอบ ใช้เปรียบเทียบ" }
      - { left: "ยาหลอก", right: "สิ่งที่หน้าตาเหมือนของจริงแต่ไม่มีสารทดสอบ" }
      - { left: "การทำซ้ำได้โดยผู้อื่น", right: "ทีมอื่นทดลองแล้วได้ผลสอดคล้องกัน" }
      - { left: "การทบทวนโดยผู้ทรงคุณวุฒิ", right: "ผู้เชี่ยวชาญในสาขาเดียวกันตรวจงานก่อนตีพิมพ์" }
    hints:
      - "นึกถึงการทดลองยาใหม่"
      - "ผลวิจัยจะได้รับการยอมรับต้องผ่านการตรวจและทำซ้ำ"
    solution: "กลุ่มควบคุมใช้เปรียบเทียบ ยาหลอกตัดผลจากความคาดหวัง การทำซ้ำโดยผู้อื่นยืนยันผล และการทบทวนโดยผู้ทรงคุณวุฒิกลั่นกรองงานก่อนตีพิมพ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.evaluating-claims.p002
    topics: [science.inquiry.evaluating-claims]
    difficulty: 1
    type: mcq
    stem: "ข้อความโฆษณาใดเป็น \"สัญญาณเตือน\" ว่าข้อกล่าวอ้างอาจไม่น่าเชื่อถือ"
    choices:
      - { id: a, text: "\"ได้ผล 100% ทุกคน แพทย์ไม่อยากให้คุณรู้ รีบแชร์ก่อนถูกลบ\"", correct: true }
      - { id: b, text: "\"การศึกษาในอาสาสมัคร 2,000 คน ตีพิมพ์ในวารสารวิชาการ พบผลข้างเคียงเล็กน้อยในบางคน\"", feedback: "บอกจำนวนตัวอย่าง แหล่งตีพิมพ์ และข้อจำกัด เป็นลักษณะของข้อมูลที่ตรวจสอบได้" }
      - { id: c, text: "\"ผลยังไม่แน่นอน ต้องศึกษาเพิ่มเติม\"", feedback: "การบอกความไม่แน่นอนเป็นลักษณะของการสื่อสารวิทยาศาสตร์ที่ดี" }
      - { id: d, text: "\"ข้อมูลจากหน่วยงานสาธารณสุข ปรับปรุงล่าสุดเดือนนี้\"", feedback: "ระบุแหล่งและวันที่ ตรวจสอบได้" }
    hints:
      - "วิทยาศาสตร์แทบไม่เคยพูดว่า 100%"
      - "การเร่งให้แชร์และอ้างว่ามีคนปิดบังเป็นสัญญาณอะไร"
    solution: "คำว่า 100% การอ้างว่ามีคนปิดบัง และการเร่งให้แชร์ เป็นสัญญาณเตือนของข้อมูลที่ไม่น่าเชื่อถือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.evaluating-claims.p003
    topics: [science.inquiry.evaluating-claims]
    difficulty: 2
    type: mcq
    stem: "นักเรียน 5 คนดื่มเครื่องดื่ม ก ทุกวันเป็นเวลา 1 เดือน แล้วคะแนนสอบเพิ่มขึ้น ทำไมยังสรุปไม่ได้ว่าเครื่องดื่มทำให้คะแนนเพิ่ม"
    choices:
      - { id: a, text: "ไม่มีกลุ่มควบคุมให้เปรียบเทียบ คะแนนอาจเพิ่มเพราะเหตุอื่น เช่น ได้เรียนและฝึกเพิ่มขึ้นในเดือนนั้น", correct: true }
      - { id: b, text: "เพราะเครื่องดื่มทุกชนิดไม่มีผลต่อสมอง", feedback: "เราไม่รู้ล่วงหน้า ปัญหาคือการทดลองนี้ไม่มีกลุ่มเปรียบเทียบ จึงสรุปไม่ได้ทั้งว่ามีผลหรือไม่มีผล" }
      - { id: c, text: "เพราะทดลองนานเกินไป", feedback: "ระยะเวลา 1 เดือนไม่ใช่ปัญหาหลัก ปัญหาคือไม่มีกลุ่มเปรียบเทียบและคนน้อย" }
      - { id: d, text: "สรุปได้แล้ว เพราะคะแนนเพิ่มขึ้นจริง", feedback: "คะแนนเพิ่มจริง แต่ไม่รู้ว่าเพิ่มเพราะเครื่องดื่มหรือเพราะอย่างอื่น" }
    hints:
      - "ถ้าไม่ดื่มเลย คะแนนจะเพิ่มหรือไม่"
      - "ต้องมีอะไรให้เปรียบเทียบ"
    solution: "ไม่มีกลุ่มควบคุมที่เหมือนกันทุกอย่างยกเว้นไม่ได้ดื่ม จึงแยกไม่ได้ว่าคะแนนเพิ่มเพราะเครื่องดื่มหรือเพราะการเรียนตามปกติ และ 5 คนก็น้อยเกินไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.evaluating-claims.p004
    topics: [science.inquiry.evaluating-claims]
    difficulty: 2
    type: mcq
    stem: "ในจังหวัดหนึ่ง เดือนเมษายนมียอดขายไอศกรีมสูงที่สุด และมีคนจมน้ำมากที่สุด คำอธิบายใดสมเหตุสมผลที่สุด"
    choices:
      - { id: a, text: "อากาศร้อนทำให้คนกินไอศกรีมมากขึ้นและไปเล่นน้ำมากขึ้น ทั้งสองอย่างจึงเพิ่มพร้อมกัน", correct: true }
      - { id: b, text: "กินไอศกรีมแล้วเป็นตะคริวจึงจมน้ำ", feedback: "ข้อมูลรวมรายเดือนไม่ได้บอกว่าคนที่จมน้ำกินไอศกรีม ต้องคิดถึงตัวแปรที่ทำให้ทั้งสองเพิ่มก่อน" }
      - { id: c, text: "คนจมน้ำมากทำให้ขายไอศกรีมได้มากขึ้น", feedback: "เป็นการกลับเหตุและผลโดยไม่มีกลไกที่สมเหตุสมผล" }
      - { id: d, text: "เป็นความบังเอิญล้วน ๆ ไม่มีคำอธิบาย", feedback: "แบบรูปนี้เกิดซ้ำทุกปีและมีคำอธิบายที่ดี คืออากาศร้อน" }
    hints:
      - "เดือนเมษายนอากาศเป็นอย่างไร"
      - "หาตัวแปรที่ทำให้ทั้งสองอย่างเพิ่มขึ้น"
    solution: "อากาศร้อนเป็นตัวแปรแทรกซ้อน ทำให้ทั้งยอดขายไอศกรีมและการเล่นน้ำเพิ่มขึ้น สองสิ่งจึงมีสหสัมพันธ์แต่ไม่ได้เป็นเหตุและผลของกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.evaluating-claims.p005
    topics: [science.inquiry.evaluating-claims]
    difficulty: 2
    type: text
    stem: "ในการทดลองยา กลุ่มควบคุมได้รับเม็ดที่หน้าตาเหมือนยาจริงแต่ไม่มีตัวยา เม็ดนี้เรียกว่าอะไร"
    accepted: ["ยาหลอก", "placebo", "พลาซีโบ", "ยาหลอก (placebo)"]
    misconceptions:
      - { match: "กลุ่มควบคุม", feedback: "กลุ่มควบคุมคือกลุ่มคน โจทย์ถามชื่อของเม็ดที่ไม่มีตัวยา" }
      - { match: "วัคซีน", feedback: "วัคซีนมีสารที่กระตุ้นภูมิคุ้มกัน ไม่ใช่เม็ดที่ไม่มีตัวยา" }
    hints:
      - "ใช้ตัดผลจากความเชื่อว่าได้รับการรักษา"
      - "ภาษาอังกฤษเรียกว่า placebo"
    solution: "ยาหลอก (placebo) ใช้ให้กลุ่มควบคุมรู้สึกเหมือนได้รับการรักษาเหมือนกลุ่มทดลอง ความต่างของผลจึงมาจากตัวยาจริง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.evaluating-claims.p006
    topics: [science.inquiry.evaluating-claims]
    difficulty: 3
    type: numeric
    stem: "ข่าวรายงานว่าพฤติกรรมหนึ่ง \"เพิ่มความเสี่ยงต่อโรค\" จาก 2 ใน 1,000 คน เป็น 3 ใน 1,000 คน (ข้อมูลสมมติ) ความเสี่ยงสัมพัทธ์เพิ่มขึ้นกี่เปอร์เซ็นต์"
    answer: { value: 50, tolerance: 0.5, unit: "%" }
    misconceptions:
      - { match: 0.1, feedback: "นี่คือความเสี่ยงสัมบูรณ์ที่เพิ่มขึ้น (จุดร้อยละ) ความเสี่ยงสัมพัทธ์เทียบกับความเสี่ยงเดิม 2 ใน 1,000" }
      - { match: 33.3, feedback: "หารด้วยค่าใหม่ 3 แต่การเพิ่มขึ้นต้องเทียบกับค่าเดิม 2" }
    hints:
      - "ความเสี่ยงสัมพัทธ์ที่เพิ่ม = (ใหม่ − เดิม) ÷ เดิม × 100"
      - "$(3 - 2) \\div 2$"
    solution: "$\\dfrac{3 - 2}{2} \\times 100 = 50\\%$ ฟังดูมาก แต่ความเสี่ยงจริงเพิ่มเพียง 1 คนใน 1,000 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.evaluating-claims.p007
    topics: [science.inquiry.evaluating-claims]
    difficulty: 3
    type: numeric
    stem: "จากข้อมูลเดิม ความเสี่ยงเพิ่มจาก 2 ใน 1,000 คน เป็น 3 ใน 1,000 คน ความเสี่ยงสัมบูรณ์เพิ่มขึ้นกี่จุดร้อยละ"
    answer: { value: 0.1, tolerance: 0.01, unit: "จุดร้อยละ" }
    misconceptions:
      - { match: 50, feedback: "50% คือความเสี่ยงสัมพัทธ์ ความเสี่ยงสัมบูรณ์คือผลต่างของร้อยละ 0.3% − 0.2%" }
      - { match: 1, feedback: "1 คือจำนวนคนที่เพิ่มใน 1,000 คน ต้องคิดเป็นร้อยละ 1/1000 × 100" }
    hints:
      - "2 ใน 1,000 = 0.2% และ 3 ใน 1,000 = 0.3%"
      - "หาผลต่างของสองค่านี้"
    solution: "$0.3\\% - 0.2\\% = 0.1$ จุดร้อยละ คือเพิ่ม 1 คนในทุก 1,000 คน การรายงานทั้งสองแบบช่วยให้ตัดสินใจได้ดีขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.evaluating-claims.p008
    topics: [science.inquiry.evaluating-claims]
    difficulty: 3
    type: mcq
    stem: "กราฟแสดงยอดขายไอศกรีมกับจำนวนคนจมน้ำในแต่ละเดือนของจังหวัดสมมติ ข้อสรุปใดถูกต้องที่สุด"
    figure: { src: p-scatter.svg, alt: "กราฟจุด 12 จุด แต่ละจุดคือหนึ่งเดือน แกนนอนยอดขายไอศกรีม 0–70 พันถ้วย แกนตั้งจำนวนคนจมน้ำ 0–12 คน จุดเรียงลาดขึ้นจากซ้ายล่างไปขวาบน ยอดขายราว 22 พันถ้วยมีคนจมน้ำราว 3 คน ยอดขายราว 54 พันถ้วยมีคนจมน้ำราว 10 คน ข้อมูลสมมติ" }
    choices:
      - { id: a, text: "สองตัวแปรมีสหสัมพันธ์เชิงบวก แต่ข้อมูลนี้บอกไม่ได้ว่าไอศกรีมเป็นสาเหตุ ควรดูตัวแปรอื่น เช่น อุณหภูมิ", correct: true }
      - { id: b, text: "ห้ามขายไอศกรีมจะลดการจมน้ำได้", feedback: "ข้อมูลสหสัมพันธ์ไม่ได้แสดงว่าไอศกรีมเป็นสาเหตุ นโยบายนี้จึงไม่มีหลักฐานรองรับ" }
      - { id: c, text: "สองตัวแปรไม่เกี่ยวข้องกันเลย", feedback: "จุดเรียงลาดขึ้นชัดเจน สองตัวแปรเปลี่ยนไปด้วยกัน คือมีสหสัมพันธ์" }
      - { id: d, text: "มีสหสัมพันธ์เชิงลบ", feedback: "เมื่อยอดขายเพิ่ม จำนวนคนจมน้ำก็เพิ่ม จึงเป็นเชิงบวก" }
    hints:
      - "จุดลาดขึ้นหรือลาดลง"
      - "สหสัมพันธ์บอกว่าเปลี่ยนไปด้วยกัน แต่ไม่ได้บอกว่าอะไรเป็นสาเหตุ"
    solution: "จุดลาดขึ้นแสดงสหสัมพันธ์เชิงบวก แต่อาจมีตัวแปรแทรกซ้อน เช่น อุณหภูมิ ต้องเก็บข้อมูลเพิ่มก่อนสรุปเหตุและผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.evaluating-claims.p009
    topics: [science.inquiry.evaluating-claims]
    difficulty: 3
    type: numeric
    stem: "นักเรียนวัดความเร่งโน้มถ่วงด้วยลูกตุ้มได้ $9.60\\ \\mathrm{m/s^2}$ ค่าที่ยอมรับคือ $9.81\\ \\mathrm{m/s^2}$ ร้อยละความคลาดเคลื่อนเป็นเท่าใด"
    answer: { value: 2.14, tolerance: 0.03, unit: "%" }
    misconceptions:
      - { match: 0.21, feedback: "นี่คือความคลาดเคลื่อนสัมบูรณ์ ($\\mathrm{m/s^2}$) ต้องหารด้วยค่าที่ยอมรับแล้วคูณ 100" }
      - { match: 2.19, feedback: "หารด้วยค่าที่วัดได้ ต้องหารด้วยค่าที่ยอมรับ 9.81" }
    hints:
      - "ร้อยละความคลาดเคลื่อน $= \\dfrac{|\\text{ค่าวัด} - \\text{ค่าที่ยอมรับ}|}{\\text{ค่าที่ยอมรับ}} \\times 100$"
      - "$\\dfrac{0.21}{9.81} \\times 100$"
    solution: "$\\dfrac{|9.60 - 9.81|}{9.81} \\times 100 \\approx 2.14\\%$ ถ้าวัดซ้ำแล้วได้ต่ำกว่าทุกครั้ง อาจมีความคลาดเคลื่อนเป็นระบบ เช่น วัดความยาวเชือกผิดตำแหน่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.evaluating-claims.p010
    topics: [science.inquiry.evaluating-claims]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของ \"การทำซ้ำได้โดยผู้อื่น\" (reproducibility)"
    choices:
      - { id: a, text: "ห้องปฏิบัติการอีกแห่งใช้เครื่องมือของตัวเองวัดค่าเดียวกัน และได้ผลสอดคล้องกัน", correct: true }
      - { id: b, text: "นักเรียนคนเดิมวัดซ้ำ 5 ครั้งด้วยเครื่องมือเดิมในวันเดียวกัน ได้ค่าใกล้เคียงกัน", feedback: "นี่คือการทำซ้ำได้ (repeatability) โดยคนเดิมและวิธีเดิม ยังไม่ใช่การทำซ้ำโดยผู้อื่น" }
      - { id: c, text: "นักเรียนคัดลอกผลของเพื่อนมาใส่ในรายงาน", feedback: "การคัดลอกไม่ใช่การทำซ้ำ และผิดจริยธรรม" }
      - { id: d, text: "บริษัทผู้ขายทดสอบสินค้าของตนเองซ้ำสองครั้ง", feedback: "ยังเป็นผู้ทดสอบกลุ่มเดิมและมีส่วนได้เสีย การทำซ้ำโดยผู้อื่นต้องเป็นทีมอิสระ" }
    hints:
      - "\"ผู้อื่น\" หมายถึงใคร"
      - "ต่างจากการวัดซ้ำโดยคนเดิม"
    solution: "การทำซ้ำได้โดยผู้อื่นคือทีมอื่น วิธีหรือเครื่องมืออื่น ได้ผลสอดคล้องกัน ส่วนการวัดซ้ำโดยคนเดิมคือการทำซ้ำได้ ซึ่งบอกความเที่ยงของการวัด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.evaluating-claims.p011
    topics: [science.inquiry.evaluating-claims]
    difficulty: 3
    type: order
    stem: "แม่ได้รับข้อความในกลุ่มไลน์ว่า \"ดื่มน้ำมะนาวผสมโซดาทุกเช้า รักษาโรคได้ 100%\" เรียงขั้นตอนตรวจข้อกล่าวอ้างนี้ก่อนตัดสินใจ"
    items:
      - "หยุดก่อนแชร์ สังเกตสัญญาณเตือน เช่น คำว่า 100%"
      - "ดูว่าใครเป็นผู้เผยแพร่และอ้างหลักฐานอะไร"
      - "ค้นจากแหล่งอื่นที่น่าเชื่อถือ เช่น หน่วยงานสาธารณสุขหรือบทความวิชาการ"
      - "เทียบว่าความเห็นร่วมของผู้เชี่ยวชาญเป็นอย่างไร"
      - "ตัดสินใจ และถ้าเกี่ยวกับการรักษาโรค ให้ปรึกษาแพทย์หรือเภสัชกร"
    hints:
      - "เริ่มจากไม่แชร์ทันที"
      - "ตัดสินใจหลังตรวจหลายแหล่งแล้ว"
    solution: "หยุดและสังเกต → ตรวจผู้พูดและหลักฐาน → อ่านด้านข้างจากแหล่งอื่น → เทียบกับความเห็นร่วม → ตัดสินใจ และปรึกษาบุคลากรทางการแพทย์เรื่องสุขภาพ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.evaluating-claims.p012
    topics: [science.inquiry.evaluating-claims]
    difficulty: 4
    type: numeric
    stem: "การทดลองแบบสุ่มและปกปิด (ข้อมูลสมมติ) กลุ่มที่ดื่มเครื่องดื่ม ก มีคะแนนเฉลี่ยเพิ่มจาก 60 เป็น 66 คะแนน กลุ่มที่ได้เครื่องดื่มหลอกเพิ่มจาก 60 เป็น 65 คะแนน ผลของเครื่องดื่ม ก จริง ๆ คือกี่คะแนน"
    answer: { value: 1, tolerance: 0.01, unit: "คะแนน" }
    misconceptions:
      - { match: 6, feedback: "6 คะแนนรวมผลของการฝึกทำข้อสอบและความคาดหวังด้วย ต้องลบส่วนที่กลุ่มยาหลอกก็เพิ่มขึ้น" }
      - { match: 10, feedback: "10% คือร้อยละที่คะแนนกลุ่มทดลองเพิ่ม ไม่ใช่ผลที่เกิดจากเครื่องดื่มเพียงอย่างเดียว" }
    hints:
      - "หาว่าแต่ละกลุ่มเพิ่มขึ้นกี่คะแนน"
      - "ผลของเครื่องดื่ม = ส่วนเพิ่มของกลุ่มทดลอง − ส่วนเพิ่มของกลุ่มยาหลอก"
    solution: "กลุ่มทดลองเพิ่ม 6 คะแนน กลุ่มยาหลอกเพิ่ม 5 คะแนน ผลของเครื่องดื่มคือ $6 - 5 = 1$ คะแนน โฆษณาที่อ้างว่า \"เพิ่ม 10%\" จึงเกินจริงมาก และต้องดูว่าความต่าง 1 คะแนนเกินความบังเอิญหรือไม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.evaluating-claims.p013
    topics: [science.inquiry.evaluating-claims]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "แผนการทดสอบครีมกันยุงสมมติ: \"เจ้าของบริษัททาครีมที่แขนตัวเองหนึ่งข้าง นั่งในสวนตอนเย็น 1 วัน แล้วนับรอยยุงกัด\" ข้อเสนอใดปรับปรุงแผนนี้ได้จริง (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "ใช้อาสาสมัครหลายคน และทดสอบหลายวัน", correct: true }
      - { id: b, text: "มีกลุ่มควบคุมที่ทาครีมไม่มีสารกันยุงซึ่งหน้าตาเหมือนกัน และสุ่มว่าใครได้ครีมใด", correct: true }
      - { id: c, text: "ให้ผู้นับรอยยุงกัดเป็นคนที่ไม่รู้ว่าใครทาครีมใด และไม่ใช่คนของบริษัท", correct: true }
      - { id: d, text: "ทาครีมให้หนาขึ้นจนยุงไม่กล้าเข้าใกล้", feedback: "การเปลี่ยนปริมาณครีมไม่ได้แก้จุดอ่อนของการออกแบบ เช่น ไม่มีกลุ่มควบคุมและมีส่วนได้เสีย" }
      - { id: e, text: "ทดสอบในห้องที่ไม่มียุง จะได้ไม่มีรอยกัดเลย", feedback: "ถ้าไม่มียุง ไม่มีรอยกัดทั้งสองกลุ่ม จึงทดสอบอะไรไม่ได้" }
    hints:
      - "แผนเดิมมีคนเดียว วันเดียว ไม่มีกลุ่มเปรียบเทียบ และผู้วัดมีส่วนได้เสีย"
      - "แต่ละข้อเสนอแก้จุดอ่อนข้อใด"
    solution: "เพิ่มขนาดตัวอย่างและการทำซ้ำ (a) มีกลุ่มควบคุมที่สุ่มและใช้ครีมหลอก (b) และให้ผู้วัดที่ปกปิดและไม่มีส่วนได้เสีย (c) ส่วน d และ e ไม่ได้ทำให้การทดสอบยุติธรรมขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.evaluating-claims.p014
    topics: [science.inquiry.evaluating-claims]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "นักเรียนโรงเรียนแห่งหนึ่งในเชียงราย จะต้มน้ำเกลือในบีกเกอร์ด้วยตะเกียงแอลกอฮอล์เพื่อดูผลึกเกลือ ข้อใดเป็นการประเมินและลดความเสี่ยงที่เหมาะสม (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "สวมแว่นตานิรภัย เพราะน้ำเกลือร้อนอาจกระเด็นเข้าตา ซึ่งรุนแรง", correct: true }
      - { id: b, text: "เก็บขวดแอลกอฮอล์ให้ห่างเปลวไฟ และเติมแอลกอฮอล์เมื่อดับตะเกียงและเย็นแล้วเท่านั้น", correct: true }
      - { id: c, text: "ใช้ที่จับหรือคีมจับบีกเกอร์ร้อน และวางบนแผ่นกันความร้อน", correct: true }
      - { id: d, text: "ใช้น้ำเกลือปริมาณมากที่สุดเท่าที่บีกเกอร์จุได้ จะได้ผลึกเยอะ", feedback: "น้ำเต็มบีกเกอร์เดือดล้นและกระเด็นง่าย ควรใช้ปริมาณน้อยที่พอสังเกตผลได้" }
      - { id: e, text: "ไม่ต้องกังวล เพราะเกลือเป็นสารที่กินได้", feedback: "อันตรายหลักไม่ใช่เกลือ แต่คือของเหลวร้อน เปลวไฟ และแอลกอฮอล์ที่ติดไฟง่าย" }
    hints:
      - "ระบุอันตราย: ของเหลวร้อน เปลวไฟ เชื้อเพลิงติดไฟ"
      - "ความเสี่ยง = โอกาส × ความรุนแรง ลดได้ทั้งสองทาง"
    solution: "อันตรายหลักคือของเหลวร้อนกระเด็น ไฟลุกจากแอลกอฮอล์ และแก้วร้อน มาตรการ a b c ลดโอกาสหรือความรุนแรงได้ ส่วน d เพิ่มความเสี่ยง และ e มองข้ามอันตรายจริง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.evaluating-claims.p015
    topics: [science.inquiry.evaluating-claims]
    difficulty: 4
    type: mcq
    stem: "มีงานวิจัยสองชิ้นเกี่ยวกับอาหารเสริมสมมติชนิดหนึ่ง ชิ้นที่ 1 ทุนจากบริษัทผู้ผลิต อาสาสมัคร 20 คน ไม่มีกลุ่มควบคุม พบว่าได้ผลดี ชิ้นที่ 2 ทีมมหาวิทยาลัยอิสระ อาสาสมัคร 1,500 คน สุ่ม มีกลุ่มยาหลอก ตีพิมพ์หลังผ่านการทบทวน พบว่าไม่ต่างจากยาหลอก ควรสรุปอย่างไร"
    choices:
      - { id: a, text: "หลักฐานที่มีคุณภาพสูงกว่าชี้ว่าอาหารเสริมนี้ไม่ได้ผล จึงให้น้ำหนักกับงานชิ้นที่ 2 มากกว่า แต่ยังติดตามงานวิจัยใหม่ได้", correct: true }
      - { id: b, text: "ได้ผลแน่นอน เพราะมีงานวิจัยหนึ่งชิ้นบอกว่าได้ผล", feedback: "งานวิจัยแต่ละชิ้นมีคุณภาพต่างกัน ต้องพิจารณาการออกแบบ ขนาดตัวอย่าง และผลประโยชน์ทับซ้อน" }
      - { id: c, text: "สรุปอะไรไม่ได้เลย เพราะงานวิจัยขัดแย้งกัน", feedback: "หลักฐานที่ขัดแย้งกันยังชั่งน้ำหนักได้ จากคุณภาพของการออกแบบการทดลอง" }
      - { id: d, text: "งานชิ้นที่ 2 ผิด เพราะผลไม่ตรงกับชิ้นแรก", feedback: "การไม่ตรงกับงานแรกไม่ได้แปลว่าผิด งานที่ 2 ออกแบบได้ดีกว่ามาก" }
    hints:
      - "เทียบขนาดตัวอย่าง กลุ่มควบคุม และผลประโยชน์ทับซ้อน"
      - "หลักฐานมีน้ำหนักไม่เท่ากัน"
    solution: "งานชิ้นที่ 2 มีตัวอย่างมาก สุ่ม มีกลุ่มยาหลอก อิสระ และผ่านการทบทวน จึงน่าเชื่อถือกว่ามาก ข้อสรุปที่ดีที่สุดคือยังไม่มีหลักฐานที่ดีว่าได้ผล และพร้อมปรับถ้ามีหลักฐานใหม่ที่มีคุณภาพ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.evaluating-claims.p016
    topics: [science.inquiry.evaluating-claims]
    difficulty: 5
    type: numeric
    stem: "การทดลองวัคซีนสมมติ แบ่งอาสาสมัครแบบสุ่มกลุ่มละ 1,000 คน กลุ่มยาหลอกป่วย 40 คน กลุ่มวัคซีนป่วย 4 คน ประสิทธิผลของวัคซีน $= \\left(1 - \\dfrac{\\text{อัตราป่วยกลุ่มวัคซีน}}{\\text{อัตราป่วยกลุ่มยาหลอก}}\\right) \\times 100$ เป็นกี่เปอร์เซ็นต์"
    answer: { value: 90, tolerance: 0.5, unit: "%" }
    misconceptions:
      - { match: 10, feedback: "นี่คืออัตราส่วนอัตราป่วย (4/40 × 100) ต้องนำไปลบออกจาก 100" }
      - { match: 36, feedback: "36 คือจำนวนคนป่วยที่ต่างกัน ต้องเทียบเป็นอัตรา" }
    hints:
      - "อัตราป่วยกลุ่มวัคซีน = 4/1000 กลุ่มยาหลอก = 40/1000"
      - "อัตราส่วน = 0.004/0.040 แล้วนำไปลบจาก 1"
    solution: "$1 - \\dfrac{0.004}{0.040} = 1 - 0.1 = 0.9$ ประสิทธิผล 90% แปลว่าในกลุ่มที่ได้วัคซีนป่วยน้อยลง 90% เมื่อเทียบกับกลุ่มยาหลอก ไม่ได้แปลว่า 10% ของคนที่ฉีดจะป่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.inquiry.evaluating-claims.p017
    topics: [science.inquiry.evaluating-claims]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "บทความหนึ่งอ้างว่า \"คนในหมู่บ้านสมมติแห่งหนึ่งดื่มน้ำจากบ่อโบราณทุกวัน และมีผู้สูงอายุอายุเกิน 90 ปีหลายคน แสดงว่าน้ำบ่อนี้ทำให้อายุยืน\" ข้อใดเป็นข้อสันนิษฐานหรือจุดอ่อนของข้อกล่าวอ้างนี้ (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "อาจมีตัวแปรแทรกซ้อน เช่น อาหาร การออกกำลังกาย หรือพันธุกรรมของคนในหมู่บ้าน", correct: true }
      - { id: b, text: "ไม่มีการเปรียบเทียบกับหมู่บ้านใกล้เคียงที่ไม่ได้ดื่มน้ำบ่อนี้ แต่มีวิถีชีวิตคล้ายกัน", correct: true }
      - { id: c, text: "ไม่ได้บอกว่ามีผู้สูงอายุกี่คนจากประชากรทั้งหมด และเทียบกับค่าเฉลี่ยของประเทศ", correct: true }
      - { id: d, text: "สันนิษฐานว่าทุกคนดื่มน้ำบ่อนี้ในปริมาณเท่ากันตลอดชีวิต โดยไม่มีข้อมูล", correct: true }
      - { id: e, text: "น้ำบ่อโบราณต้องมีสารพิษแน่นอน", feedback: "เป็นการสรุปเกินหลักฐานในทางตรงข้าม ไม่มีข้อมูลรองรับ" }
    hints:
      - "สหสัมพันธ์ในกลุ่มเดียว ไม่มีกลุ่มเปรียบเทียบ"
      - "คำว่า \"หลายคน\" เทียบกับอะไร"
    solution: "ข้อกล่าวอ้างนี้ขาดกลุ่มเปรียบเทียบ ไม่ตัดตัวแปรแทรกซ้อน ไม่มีตัวเลขที่เปรียบเทียบได้ และสันนิษฐานเรื่องการดื่มโดยไม่มีข้อมูล ส่วนข้อ e ก็เป็นการสรุปโดยไม่มีหลักฐานเช่นกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true
