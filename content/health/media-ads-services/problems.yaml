    text: ซื้อยาฆ่าเชื้อตามที่เพื่อนในเฟซบุ๊กแนะนำ
    feedback: ยาฆ่าเชื้อต้องใช้ตามแพทย์หรือเภสัชกรสั่ง หวัดส่วนใหญ่เกิดจากไวรัส
  hints:
