<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 490" width="700" height="490" font-family="sans-serif">
<title>ตารางประเมินความเสี่ยงอย่างง่าย</title>
<rect x="0" y="0" width="700" height="490" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="350.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">ประเมินความเสี่ยง = โอกาสเกิด × ความรุนแรง</text>
<text x="178.0" y="120.0" font-size="13" text-anchor="end" font-weight="bold" fill="#111">3 มาก</text>
<rect x="190.0" y="70.0" width="130.0" height="90.0" rx="0" fill="#f9e79f" stroke="#fff" stroke-width="3"/>
<text x="255.0" y="122.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">3 × 1 = 3</text>
<rect x="320.0" y="70.0" width="130.0" height="90.0" rx="0" fill="#f1948a" stroke="#fff" stroke-width="3"/>
<text x="385.0" y="122.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">3 × 2 = 6</text>
<rect x="450.0" y="70.0" width="130.0" height="90.0" rx="0" fill="#f1948a" stroke="#fff" stroke-width="3"/>
<text x="515.0" y="122.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">3 × 3 = 9</text>
<text x="178.0" y="210.0" font-size="13" text-anchor="end" font-weight="bold" fill="#111">2 ปานกลาง</text>
<rect x="190.0" y="160.0" width="130.0" height="90.0" rx="0" fill="#a9dfbf" stroke="#fff" stroke-width="3"/>
<text x="255.0" y="212.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">2 × 1 = 2</text>
<rect x="320.0" y="160.0" width="130.0" height="90.0" rx="0" fill="#f9e79f" stroke="#fff" stroke-width="3"/>
<text x="385.0" y="212.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">2 × 2 = 4</text>
<rect x="450.0" y="160.0" width="130.0" height="90.0" rx="0" fill="#f1948a" stroke="#fff" stroke-width="3"/>
<text x="515.0" y="212.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">2 × 3 = 6</text>
<text x="178.0" y="300.0" font-size="13" text-anchor="end" font-weight="bold" fill="#111">1 น้อย</text>
<rect x="190.0" y="250.0" width="130.0" height="90.0" rx="0" fill="#a9dfbf" stroke="#fff" stroke-width="3"/>
<text x="255.0" y="302.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">1 × 1 = 1</text>
<rect x="320.0" y="250.0" width="130.0" height="90.0" rx="0" fill="#a9dfbf" stroke="#fff" stroke-width="3"/>
<text x="385.0" y="302.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">1 × 2 = 2</text>
<rect x="450.0" y="250.0" width="130.0" height="90.0" rx="0" fill="#f9e79f" stroke="#fff" stroke-width="3"/>
<text x="515.0" y="302.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">1 × 3 = 3</text>
<text x="255.0" y="364.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">1 เล็กน้อย</text>
<text x="385.0" y="364.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">2 ปานกลาง</text>
<text x="515.0" y="364.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">3 รุนแรง</text>
<text x="385.0" y="390.0" font-size="13" text-anchor="middle" fill="#333">ความรุนแรงถ้าเกิดเหตุ</text>
<text x="40.0" y="90.0" font-size="13" text-anchor="start" fill="#333">โอกาสเกิด</text>
<rect x="190.0" y="400.0" width="18.0" height="18.0" rx="0" fill="#a9dfbf" stroke="#888" stroke-width="1.5"/>
<text x="216.0" y="414.0" font-size="13" text-anchor="start" fill="#111">1–2 เสี่ยงต่ำ: ทำได้ แต่ระวัง</text>
<rect x="190.0" y="426.0" width="18.0" height="18.0" rx="0" fill="#f9e79f" stroke="#888" stroke-width="1.5"/>
<text x="216.0" y="440.0" font-size="13" text-anchor="start" fill="#111">3–4 เสี่ยงปานกลาง: ต้องมีวิธีลดความเสี่ยง</text>
<rect x="190.0" y="452.0" width="18.0" height="18.0" rx="0" fill="#f1948a" stroke="#888" stroke-width="1.5"/>
<text x="216.0" y="466.0" font-size="13" text-anchor="start" fill="#111">6–9 เสี่ยงสูง: หลีกเลี่ยง</text>
</svg>
