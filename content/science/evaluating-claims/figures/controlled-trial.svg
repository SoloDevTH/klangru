<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="sans-serif" font-size="14">
<title>การทดลองแบบมีกลุ่มควบคุม สุ่ม และปกปิด</title>
<rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
<rect x="30.0" y="140.0" width="150.0" height="70.0" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="105.0" y="173.0" text-anchor="middle" font-size="15" fill="#111" font-weight="bold">อาสาสมัคร 200 คน</text>
<text x="105.0" y="193.0" text-anchor="middle" font-size="12" fill="#374151">ยินยอมเข้าร่วม</text>
<text x="215.0" y="112.0" text-anchor="middle" font-size="13" fill="#7c3aed" font-weight="bold">สุ่มแบ่งกลุ่ม</text>
<line x1="180.0" y1="165.0" x2="320.0" y2="85.0" stroke="#7c3aed" stroke-width="2.5"/>
<polygon points="320.0,85.0 314.5,92.2 311.1,86.1" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<line x1="180.0" y1="185.0" x2="320.0" y2="265.0" stroke="#7c3aed" stroke-width="2.5"/>
<polygon points="320.0,265.0 311.1,263.9 314.5,257.8" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<rect x="320.0" y="50.0" width="200.0" height="70.0" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="420.0" y="83.0" text-anchor="middle" font-size="15" fill="#111" font-weight="bold">กลุ่มทดลอง 100 คน</text>
<text x="420.0" y="103.0" text-anchor="middle" font-size="12" fill="#374151">ได้เครื่องดื่มที่มีสารทดสอบ</text>
<rect x="320.0" y="230.0" width="200.0" height="70.0" rx="10" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/>
<text x="420.0" y="263.0" text-anchor="middle" font-size="15" fill="#111" font-weight="bold">กลุ่มควบคุม 100 คน</text>
<text x="420.0" y="283.0" text-anchor="middle" font-size="12" fill="#374151">ได้เครื่องดื่มหน้าตาเหมือนกัน ไม่มีสาร</text>
<line x1="520.0" y1="85.0" x2="600.0" y2="160.0" stroke="#334155" stroke-width="2"/>
<polygon points="600.0,160.0 591.6,156.9 596.3,151.8" fill="#334155" stroke="#334155" stroke-width="1"/>
<line x1="520.0" y1="265.0" x2="600.0" y2="190.0" stroke="#334155" stroke-width="2"/>
<polygon points="600.0,190.0 596.3,198.2 591.6,193.1" fill="#334155" stroke="#334155" stroke-width="1"/>
<rect x="600.0" y="140.0" width="180.0" height="70.0" rx="10" fill="#e0e7ff" stroke="#334155" stroke-width="1.5"/>
<text x="690.0" y="173.0" text-anchor="middle" font-size="15" fill="#111" font-weight="bold">วัดผลแบบเดียวกัน</text>
<text x="690.0" y="193.0" text-anchor="middle" font-size="12" fill="#374151">แล้วเปรียบเทียบสองกลุ่ม</text>
<text x="420.0" y="160.0" text-anchor="middle" font-size="12" fill="#b45309" font-weight="bold">ปกปิด: ทั้งผู้เข้าร่วมและผู้วัดผล</text>
<text x="420.0" y="178.0" text-anchor="middle" font-size="12" fill="#b45309">ไม่รู้ว่าใครอยู่กลุ่มใด</text>
<text x="400.0" y="340.0" text-anchor="middle" font-size="12" fill="#334155">ความต่างระหว่างสองกลุ่มจึงเกิดจากสารทดสอบ ไม่ใช่ความคาดหวังหรือความบังเอิญในการแบ่งกลุ่ม</text>
</svg>