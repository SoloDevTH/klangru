<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif">
<title>ผลกระทบของสารเสพติด 5 ด้าน</title>
<rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">สารเสพติดกระทบชีวิตทุกด้าน</text>
<circle cx="380.0" cy="215.0" r="62" fill="#fdebd0" stroke="#a04000" stroke-width="2"/>
<text x="380.0" y="211.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">การใช้</text>
<text x="380.0" y="231.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">สารเสพติด</text>
<rect x="30.0" y="60.0" width="210.0" height="94.0" rx="10" fill="#fadbd8" stroke="#666" stroke-width="1.5"/>
<text x="135.0" y="84.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ร่างกาย</text>
<text x="135.0" y="106.0" font-size="12" text-anchor="middle" fill="#111">หัวใจเต้นผิดจังหวะ</text>
<text x="135.0" y="124.0" font-size="12" text-anchor="middle" fill="#111">น้ำหนักลด นอนไม่หลับ</text>
<text x="135.0" y="142.0" font-size="12" text-anchor="middle" fill="#111">เสี่ยงติดเชื้อ อุบัติเหตุ</text>
<line x1="321.4" y1="189.2" x2="244.0" y2="107.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="520.0" y="60.0" width="210.0" height="76.0" rx="10" fill="#e8daef" stroke="#666" stroke-width="1.5"/>
<text x="625.0" y="84.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">จิตใจ</text>
<text x="625.0" y="106.0" font-size="12" text-anchor="middle" fill="#111">ระแวง หูแว่ว ภาพหลอน</text>
<text x="625.0" y="124.0" font-size="12" text-anchor="middle" fill="#111">อยากใช้ซ้ำจนควบคุมไม่ได้</text>
<line x1="437.8" y1="187.4" x2="516.0" y2="98.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30.0" y="265.0" width="210.0" height="76.0" rx="10" fill="#d6eaf8" stroke="#666" stroke-width="1.5"/>
<text x="135.0" y="289.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">อารมณ์</text>
<text x="135.0" y="311.0" font-size="12" text-anchor="middle" fill="#111">หงุดหงิด ก้าวร้าว</text>
<text x="135.0" y="329.0" font-size="12" text-anchor="middle" fill="#111">วิตกกังวล ซึมเศร้า</text>
<line x1="319.8" y1="236.6" x2="244.0" y2="303.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="520.0" y="265.0" width="210.0" height="76.0" rx="10" fill="#d5f5e3" stroke="#666" stroke-width="1.5"/>
<text x="625.0" y="289.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">สังคม</text>
<text x="625.0" y="311.0" font-size="12" text-anchor="middle" fill="#111">เสียการเรียน งาน และเงิน</text>
<text x="625.0" y="329.0" font-size="12" text-anchor="middle" fill="#111">ครอบครัวทุกข์ ปัญหากฎหมาย</text>
<line x1="440.2" y1="236.6" x2="516.0" y2="303.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="270.0" y="315.0" width="220.0" height="76.0" rx="10" fill="#fcf3cf" stroke="#666" stroke-width="1.5"/>
<text x="380.0" y="339.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">สติปัญญา</text>
<text x="380.0" y="361.0" font-size="12" text-anchor="middle" fill="#111">ความจำ สมาธิ การตัดสินใจแย่ลง</text>
<text x="380.0" y="379.0" font-size="12" text-anchor="middle" fill="#111">สมองวัยรุ่นได้รับผลมาก</text>
<line x1="380.0" y1="277.0" x2="380.0" y2="313.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
</svg>
