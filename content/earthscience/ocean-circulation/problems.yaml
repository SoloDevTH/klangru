    stem: "เรียงลำดับเหตุและผลเมื่อเกิดเอลนีโญ จนส่งผลถึงประเทศไทย"
    items:
      - "ลมค้าตะวันออกบริเวณเส้นศูนย์สูตรแปซิฟิกอ่อนลง"
      - "น้ำอุ่นที่เคยกองอยู่ทางตะวันตกไหลกลับไปทางตะวันออก"
      - "น้ำผิวหน้าแปซิฟิกตอนกลางและตะวันออกอุ่นขึ้นผิดปกติ น้ำผุดที่เปรูอ่อนลง"
      - "บริเวณที่อากาศยกตัวและฝนชุกเลื่อนไปทางตะวันออก"
      - "อากาศเหนือเอเชียตะวันออกเฉียงใต้จมตัวมากขึ้น ไทยมีแนวโน้มฝนน้อยและแล้ง"
    hints:
      - "จุดเริ่มต้นอยู่ที่ลม"
      - "ฝนตามน้ำอุ่น เพราะอากาศเหนือน้ำอุ่นยกตัว"
    solution: "ลมค้าอ่อนลง → น้ำอุ่นไหลกลับทางตะวันออก → แปซิฟิกตะวันออกอุ่น น้ำผุดอ่อน → บริเวณฝนชุกเลื่อนตาม → ทางตะวันตกรวมทั้งไทยอากาศจมตัว ฝนน้อย"
