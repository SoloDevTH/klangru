problems:
  - id: biology.diversity.classifying-organisms.p001
    topics: [biology.diversity.classifying-organisms]
    difficulty: 1
    type: mcq
    stem: "เห็ดฟางจัดอยู่ในกลุ่มใด"
    choices:
      - { id: a, text: "กลุ่มที่ไม่ใช่พืชและสัตว์", correct: true }
      - { id: b, text: "กลุ่มพืช เพราะขึ้นอยู่กับที่", feedback: "เห็ดอยู่กับที่ก็จริง แต่ไม่มีสีเขียวและสร้างอาหารเองไม่ได้ จึงไม่ใช่พืช" }
      - { id: c, text: "กลุ่มสัตว์ เพราะสร้างอาหารเองไม่ได้", feedback: "เห็ดสร้างอาหารเองไม่ได้ก็จริง แต่เคลื่อนที่ไปหาอาหารไม่ได้และไม่ได้กินสิ่งมีชีวิตอื่นแบบสัตว์" }
    hints:
      - "เห็ดมีสีเขียวและสร้างอาหารเองได้หรือไม่"
      - "เห็ดเดินไปหาอาหารได้เหมือนสัตว์หรือไม่"
    solution: "เห็ดไม่มีสีเขียว สร้างอาหารเองไม่ได้ จึงไม่ใช่พืช และเคลื่อนที่ไปหาอาหารไม่ได้ จึงไม่ใช่สัตว์ เห็ดจึงอยู่ในกลุ่มที่ไม่ใช่พืชและสัตว์ เช่นเดียวกับรา ยีสต์ และแบคทีเรีย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.classifying-organisms.p002
    topics: [biology.diversity.classifying-organisms]
    difficulty: 1
    type: match
    stem: "จับคู่สัตว์กับกลุ่มของสัตว์มีกระดูกสันหลัง"
    pairs:
      - { left: "ปลานิล", right: "ปลา" }
      - { left: "กบ", right: "สัตว์สะเทินน้ำสะเทินบก" }
      - { left: "จิ้งจก", right: "สัตว์เลื้อยคลาน" }
      - { left: "นกกระจอก", right: "นก" }
      - { left: "แมว", right: "สัตว์เลี้ยงลูกด้วยน้ำนม" }
    hints:
      - "ดูสิ่งที่ปกคลุมตัว: เกล็ด ผิวหนังเปียกชื้น เกล็ดแห้ง ขนนก หรือขนเป็นเส้น"
      - "กบผิวหนังเปียกชื้นและตัวอ่อนอยู่ในน้ำ จิ้งจกผิวหนังแห้งมีเกล็ด"
    solution: "ปลานิลมีครีบและเหงือกเป็นปลา กบผิวหนังเปียกชื้นเป็นสัตว์สะเทินน้ำสะเทินบก จิ้งจกผิวหนังแห้งมีเกล็ดเป็นสัตว์เลื้อยคลาน นกกระจอกมีขนนกเป็นนก แมวมีขนเป็นเส้นและเลี้ยงลูกด้วยน้ำนม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.classifying-organisms.p003
    topics: [biology.diversity.classifying-organisms]
    difficulty: 1
    type: text
    stem: "ลักษณะที่เราใช้แบ่งสัตว์ออกเป็นสองกลุ่ม คือสัตว์ที่มีและไม่มีอวัยวะนี้ คืออะไร (ตอบชื่ออวัยวะ)"
    accepted: ["กระดูกสันหลัง", "การมีกระดูกสันหลัง", "มีกระดูกสันหลัง"]
    hints:
      - "คลำกลางหลังของตัวเองดู"
      - "เป็นกระดูกที่ต่อกันเป็นข้อ ๆ ตามแนวหลัง"
    misconceptions:
      - { match: "เปลือก", feedback: "ปูและหอยมีเปลือกแข็ง แต่ยังเป็นสัตว์ไม่มีกระดูกสันหลัง เกณฑ์คือกระดูกที่อยู่ข้างในตามแนวหลัง" }
      - { match: "ขา", feedback: "การมีขาใช้แบ่งสัตว์ได้ แต่ไม่ใช่เกณฑ์ที่ใช้แบ่งกลุ่มใหญ่สองกลุ่มนี้" }
    solution: "กระดูกสันหลัง สัตว์จึงแบ่งเป็นสัตว์มีกระดูกสันหลัง เช่น ปลา กบ งู นก แมว และสัตว์ไม่มีกระดูกสันหลัง เช่น ไส้เดือน แมลง ปู หอย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.classifying-organisms.p004
    topics: [biology.diversity.classifying-organisms]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "สัตว์ในข้อใดเป็นสัตว์ไม่มีกระดูกสันหลัง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ไส้เดือนดิน", correct: true }
      - { id: b, text: "ปูนา", correct: true }
      - { id: c, text: "ปลาหมึก", correct: true }
      - { id: d, text: "ผีเสื้อ", correct: true }
      - { id: e, text: "ปลาทู", feedback: "ปลาทูมีก้างกลางตัว ซึ่งก็คือกระดูกสันหลัง จึงเป็นสัตว์มีกระดูกสันหลัง" }
      - { id: f, text: "งูเห่า", feedback: "งูมีกระดูกสันหลังยาวตลอดตัว จึงเลื้อยและโค้งตัวได้" }
    hints:
      - "ชื่อที่มีคำว่า ปลา ไม่ได้แปลว่าเป็นปลาเสมอ"
      - "ปูมีเปลือกแข็งข้างนอก แต่ข้างในมีกระดูกหรือไม่"
    solution: "ไส้เดือนดิน ปูนา ปลาหมึก และผีเสื้อไม่มีกระดูกสันหลัง ปลาหมึกเป็นสัตว์พวกเดียวกับหอย ไม่ใช่ปลา ส่วนปลาทูและงูเห่ามีกระดูกสันหลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.classifying-organisms.p005
    topics: [biology.diversity.classifying-organisms]
    difficulty: 2
    type: mcq
    stem: "โลมาอาศัยอยู่ในทะเล โลมาจัดอยู่ในกลุ่มใด"
    choices:
      - { id: a, text: "สัตว์เลี้ยงลูกด้วยน้ำนม", correct: true }
      - { id: b, text: "ปลา", feedback: "โลมาอยู่ในน้ำและมีครีบ แต่หายใจด้วยปอดและแม่เลี้ยงลูกด้วยน้ำนม จึงไม่ใช่ปลา" }
      - { id: c, text: "สัตว์สะเทินน้ำสะเทินบก", feedback: "สัตว์สะเทินน้ำสะเทินบกมีผิวหนังเปียกชื้น ตัวอ่อนหายใจด้วยเหงือก เช่น กบ โลมาไม่ใช่แบบนั้น" }
      - { id: d, text: "สัตว์ไม่มีกระดูกสันหลัง", feedback: "โลมามีกระดูกสันหลังเหมือนคน" }
    hints:
      - "โลมาหายใจด้วยเหงือกหรือปอด ต้องโผล่ขึ้นมาหายใจหรือไม่"
      - "แม่โลมาเลี้ยงลูกอย่างไร"
    solution: "โลมาหายใจด้วยปอด ต้องโผล่ขึ้นมาหายใจที่ผิวน้ำ ออกลูกเป็นตัว และแม่เลี้ยงลูกด้วยน้ำนม จึงเป็นสัตว์เลี้ยงลูกด้วยน้ำนม เหมือนวาฬ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.classifying-organisms.p006
    topics: [biology.diversity.classifying-organisms]
    difficulty: 2
    type: mcq
    stem: "พืชในข้อใดเป็นพืชไม่มีดอก"
    choices:
      - { id: a, text: "เฟิร์น", correct: true }
      - { id: b, text: "ต้นข้าว", feedback: "ข้าวมีดอกเล็ก ๆ ไม่มีกลีบสีสวย แต่ดอกข้าวกลายเป็นเมล็ดข้าว จึงเป็นพืชดอก" }
      - { id: c, text: "หญ้าในสนาม", feedback: "หญ้ามีดอกเล็กมากที่ปลายช่อ จึงเป็นพืชดอก" }
      - { id: d, text: "ต้นกล้วย", feedback: "กล้วยมีหัวปลี ซึ่งเป็นช่อดอก จึงเป็นพืชดอก" }
    hints:
      - "พืชดอกบางชนิดมีดอกเล็กจนมองไม่ออก"
      - "จุดสีน้ำตาลใต้ใบเฟิร์นเป็นดอกหรือไม่"
    solution: "เฟิร์นไม่ออกดอกตลอดชีวิต จุดสีน้ำตาลใต้ใบไม่ใช่ดอก ส่วนข้าว หญ้า และกล้วยเป็นพืชดอก แม้ดอกข้าวและดอกหญ้าจะเล็กและไม่มีกลีบสีสวย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.classifying-organisms.p007
    topics: [biology.diversity.classifying-organisms]
    difficulty: 2
    type: match
    stem: "จับคู่สัตว์กับกลุ่มตามอาหารที่กิน"
    pairs:
      - { left: "ควาย", right: "สัตว์กินพืช" }
      - { left: "เหยี่ยว", right: "สัตว์กินสัตว์" }
      - { left: "ไก่", right: "สัตว์กินทั้งพืชและสัตว์" }
    hints:
      - "ควายกินหญ้า เหยี่ยวโฉบจับหนูและงู"
      - "ไก่กินทั้งข้าวเปลือกและไส้เดือน"
    solution: "ควายกินหญ้าเป็นสัตว์กินพืช เหยี่ยวจับสัตว์อื่นกินเป็นสัตว์กินสัตว์ ไก่กินทั้งเมล็ดพืชและหนอนเป็นสัตว์กินทั้งพืชและสัตว์ การจัดกลุ่มแบบนี้ใช้เกณฑ์คืออาหารที่กิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.classifying-organisms.p008
    topics: [biology.diversity.classifying-organisms]
    difficulty: 2
    type: mcq
    stem: "ชาวนาเห็นต้นข้าวในนาออกรวง ต้นข้าวจัดเป็นพืชกลุ่มใด"
    choices:
      - { id: a, text: "พืชดอก เพราะดอกข้าวเจริญเป็นเมล็ดข้าว", correct: true }
      - { id: b, text: "พืชไม่มีดอก เพราะไม่เห็นกลีบดอกสีสวย", feedback: "ดอกบางชนิดไม่มีกลีบสีสด ดอกข้าวเล็กและเป็นสีเขียว แต่ก็เป็นดอก" }
      - { id: c, text: "ไม่ใช่พืช เพราะเป็นหญ้า", feedback: "ข้าวเป็นพืชวงศ์เดียวกับหญ้า และหญ้าก็เป็นพืชดอก" }
    hints:
      - "เมล็ดข้าวเกิดจากส่วนใดของพืช"
      - "พืชที่มีเมล็ดอยู่ในผล เป็นพืชดอกหรือไม่"
    solution: "รวงข้าวคือช่อดอก ดอกข้าวเล็ก ไม่มีกลีบสีสวย เมื่อได้รับละอองเรณูจะเจริญเป็นผลที่มีเมล็ดข้าวอยู่ข้างใน ต้นข้าวจึงเป็นพืชดอก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.classifying-organisms.p009
    topics: [biology.diversity.classifying-organisms]
    difficulty: 3
    type: text
    stem: "ตะกวดที่พบในสวนสาธารณะ มีผิวหนังแห้ง มีเกล็ดเล็ก ๆ ทั่วตัว ไม่มีขน ไม่มีครีบ ใช้กุญแจจำแนกในภาพหาว่าตะกวดอยู่กลุ่มใด"
    figure: { src: animal-key.svg, alt: "กุญแจจำแนกสัตว์มีกระดูกสันหลังแบบสองทาง ข้อ 1 มีขนเป็นเส้นหรือไม่ ถ้าใช่ คือสัตว์เลี้ยงลูกด้วยน้ำนม ถ้าไม่ใช่ ไปข้อ 2 มีขนนกหรือไม่ ถ้าใช่ คือนก ถ้าไม่ใช่ ไปข้อ 3 มีครีบและเหงือกตลอดชีวิตหรือไม่ ถ้าใช่ คือปลา ถ้าไม่ใช่ ไปข้อ 4 ผิวหนังแห้งมีเกล็ดหรือไม่ ถ้าใช่ คือสัตว์เลื้อยคลาน ถ้าไม่ใช่ คือสัตว์สะเทินน้ำสะเทินบก" }
    accepted: ["สัตว์เลื้อยคลาน", "เลื้อยคลาน"]
    hints:
      - "เริ่มที่ข้อ 1 ตอบทีละข้อแล้วเดินตามเส้น"
      - "ตะกวดไม่มีขนเป็นเส้น ไม่มีขนนก ไม่มีครีบ ข้อ 4 ตอบว่าอย่างไร"
    misconceptions:
      - { match: "สัตว์สะเทินน้ำสะเทินบก", feedback: "ทางนั้นคือสัตว์ที่ผิวหนังไม่แห้งและไม่มีเกล็ด แต่ตะกวดผิวหนังแห้งมีเกล็ด" }
    solution: "ข้อ 1 ไม่มีขนเป็นเส้น → ข้อ 2 ไม่มีขนนก → ข้อ 3 ไม่มีครีบและเหงือก → ข้อ 4 ผิวหนังแห้งมีเกล็ด ใช่ ตะกวดจึงเป็นสัตว์เลื้อยคลาน เหมือนจิ้งจกและจระเข้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.classifying-organisms.p010
    topics: [biology.diversity.classifying-organisms]
    difficulty: 3
    type: numeric
    stem: "จากรายชื่อสัตว์ 10 ชนิดนี้ ปลาหมึก ปลาดาว ปลาทู ปูนา กบ ค้างคาว ไส้เดือน เต่า แมงมุม นกพิราบ มีสัตว์มีกระดูกสันหลังกี่ชนิด"
    answer: { value: 5, unit: ชนิด }
    hints:
      - "ระวังชื่อที่มีคำว่า ปลา แต่ไม่ใช่ปลา"
      - "ปลาหมึกเป็นพวกเดียวกับหอย ปลาดาวไม่มีกระดูกข้างใน"
    misconceptions:
      - { match: 7, feedback: "นับปลาหมึกและปลาดาวเป็นปลาด้วย ทั้งสองไม่มีกระดูกสันหลัง" }
      - { match: 6, feedback: "ปูนามีเปลือกแข็งข้างนอก แต่ไม่มีกระดูกสันหลัง หรือนับปลาหมึกหรือปลาดาวเกินมาหนึ่งตัว" }
    solution: "สัตว์มีกระดูกสันหลังคือ ปลาทู กบ ค้างคาว เต่า และนกพิราบ รวม 5 ชนิด ส่วนปลาหมึก ปลาดาว ปูนา ไส้เดือน และแมงมุมไม่มีกระดูกสันหลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.classifying-organisms.p011
    topics: [biology.diversity.classifying-organisms]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นเกณฑ์ที่ดีที่สุดสำหรับแบ่งสัตว์ในสวนสัตว์ออกเป็นสองกลุ่ม"
    choices:
      - { id: a, text: "มีปีกหรือไม่มีปีก", correct: true }
      - { id: b, text: "น่ารักหรือไม่น่ารัก", feedback: "แต่ละคนคิดไม่เหมือนกัน จึงใช้เป็นเกณฑ์ไม่ได้" }
      - { id: c, text: "ตัวใหญ่หรือตัวเล็ก", feedback: "ไม่ได้บอกว่าใหญ่แค่ไหนจึงนับว่าใหญ่ สัตว์ขนาดกลางจะจัดยาก" }
      - { id: d, text: "อยากเลี้ยงหรือไม่อยากเลี้ยง", feedback: "เป็นความรู้สึกของแต่ละคน ไม่ใช่ลักษณะของสัตว์" }
    hints:
      - "เกณฑ์ที่ดีต้องสังเกตได้ และทุกคนตอบเหมือนกัน"
      - "ตอบได้ชัดว่ามีหรือไม่มี"
    solution: "การมีปีกเป็นลักษณะที่มองเห็นได้และตอบได้ชัดว่ามีหรือไม่มี ทุกคนจึงจัดได้ตรงกัน ส่วนความน่ารักหรือความอยากเลี้ยงเป็นความรู้สึก และขนาดต้องกำหนดตัวเลขก่อนจึงใช้ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.diversity.classifying-organisms.p012
    topics: [biology.diversity.classifying-organisms]
    difficulty: 3
    type: mcq
    stem: "ขนมปังที่ทิ้งไว้หลายวันมีจุดสีเขียวขึ้น จุดนั้นคือรา ข้อใดอธิบายกลุ่มของราได้ถูกต้อง"
    choices:
      - { id: a, text: "ไม่ใช่พืชและไม่ใช่สัตว์ ราได้อาหารจากการย่อยขนมปัง", correct: true }
      - { id: b, text: "เป็นพืช เพราะมีสีเขียว", feedback: "สีเขียวของราไม่ใช่สีของส่วนที่ใช้สร้างอาหาร ราสร้างอาหารเองไม่ได้ ต้องย่อยขนมปัง" }
      - { id: c, text: "เป็นสัตว์ เพราะกินขนมปัง", feedback: "ราไม่ได้เคลื่อนที่ไปหาอาหารและไม่ได้กินแบบสัตว์ แต่ปล่อยน้ำย่อยออกมาย่อยอาหารที่มันขึ้นอยู่" }
    hints:
      - "ราสร้างอาหารเองได้ไหม ถ้าได้ทำไมต้องขึ้นบนขนมปัง"
      - "ราเดินไปหาอาหารได้ไหม"
    solution: "ราสร้างอาหารเองไม่ได้จึงไม่ใช่พืช และไม่เคลื่อนที่ไปหาอาหารจึงไม่ใช่สัตว์ ราขึ้นบนอาหารแล้วย่อยอาหารนั้น จัดอยู่กลุ่มเดียวกับเห็ดและยีสต์"
