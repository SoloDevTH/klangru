<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" font-family="sans-serif">
  <title>มาตรลิเคิร์ตห้าระดับ เรียงจากระดับ 1 น้อยที่สุด ถึงระดับ 5 มากที่สุด</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
<rect x="40" y="70" width="140" height="90" rx="8" fill="#eef6f3" stroke="#2f6b5e" stroke-width="2"/>
<text x="110.0" y="115.0" text-anchor="middle" dominant-baseline="middle" font-size="34" font-weight="bold" fill="#15211e">1</text>
<text x="110.0" y="186" text-anchor="middle" font-size="16" fill="#15211e">น้อยที่สุด</text>
<rect x="205" y="70" width="140" height="90" rx="8" fill="#eef6f3" stroke="#2f6b5e" stroke-width="2"/>
<text x="275.0" y="115.0" text-anchor="middle" dominant-baseline="middle" font-size="34" font-weight="bold" fill="#15211e">2</text>
<text x="275.0" y="186" text-anchor="middle" font-size="16" fill="#15211e">น้อย</text>
<rect x="370" y="70" width="140" height="90" rx="8" fill="#eef6f3" stroke="#2f6b5e" stroke-width="2"/>
<text x="440.0" y="115.0" text-anchor="middle" dominant-baseline="middle" font-size="34" font-weight="bold" fill="#15211e">3</text>
<text x="440.0" y="186" text-anchor="middle" font-size="16" fill="#15211e">ปานกลาง</text>
<rect x="535" y="70" width="140" height="90" rx="8" fill="#eef6f3" stroke="#2f6b5e" stroke-width="2"/>
<text x="605.0" y="115.0" text-anchor="middle" dominant-baseline="middle" font-size="34" font-weight="bold" fill="#15211e">4</text>
<text x="605.0" y="186" text-anchor="middle" font-size="16" fill="#15211e">มาก</text>
<rect x="700" y="70" width="140" height="90" rx="8" fill="#eef6f3" stroke="#2f6b5e" stroke-width="2"/>
<text x="770.0" y="115.0" text-anchor="middle" dominant-baseline="middle" font-size="34" font-weight="bold" fill="#15211e">5</text>
<text x="770.0" y="186" text-anchor="middle" font-size="16" fill="#15211e">มากที่สุด</text>
<line x1="40" y1="215" x2="840" y2="215" stroke="#15211e" stroke-width="2" marker-end="url(#ah)"/>
<text x="840" y="239" text-anchor="end" font-size="14" fill="#4a5b56">ความพึงพอใจเพิ่มขึ้น</text>
<text x="40" y="30" font-size="16" font-weight="bold" fill="#15211e">มาตรลิเคิร์ตห้าระดับ</text>
</svg>
