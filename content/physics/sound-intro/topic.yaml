id: physics.waves.sound-intro
subject: physics
title: { th: เสียงรอบตัวและมลพิษทางเสียง, en: Sound around us and noise pollution }
summary: เสียงเกิดจากการสั่นและเดินทางผ่านตัวกลาง เสียงสูงต่ำ เสียงดังค่อย ช่วงการได้ยินของคนและสัตว์ การวัดระดับเสียงเป็นเดซิเบล และการลดมลพิษทางเสียง
difficulty: 1.8
minutes: 30
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: วาดเสียงเป็นคลื่น
    src: sound-wave-model.svg
    alt: "คลื่นสี่แถว แถวที่หนึ่ง เสียงค่อย: ยอดคลื่นเตี้ย แถวที่สอง เสียงดัง: ยอดคลื่นสูงกว่าแต่ระยะห่างของยอดเท่าเดิม มีเส้นประบอกแอมพลิจูดคือความสูงของยอดจากเส้นกลาง แถวที่สาม เสียงต่ำ: ยอดคลื่นห่างกัน มีเส้นบอกความยาวคลื่นจากยอดถึงยอด แถวที่สี่ เสียงสูง: ยอดคลื่นชิดกันมาก"
    caption: "ยอดคลื่นสูง (แอมพลิจูดมาก) คือเสียงดัง ยอดคลื่นชิดกัน (ความยาวคลื่นสั้น) คือเสียงสูง"
  - type: worked-example
    title: ออกแบบการทดลองเสียงดังเสียงค่อย
    problem: "ออกแบบการทดลองเพื่อตอบคำถามว่า ความแรงในการตีกลองมีผลต่อความดังของเสียงหรือไม่"
    steps:
      - text: "ตั้งตัวแปรต้น (สิ่งที่เปลี่ยน): ความแรงในการตี เช่น ยกไม้ตีสูง 5 cm, 15 cm และ 30 cm แล้วปล่อยลงตี"
        why: "การปล่อยไม้จากความสูงที่วัดได้ ทำให้ความแรงแต่ละระดับซ้ำได้เท่าเดิม"
      - text: "ตั้งตัวแปรตาม (สิ่งที่วัด): ระดับเสียงที่อ่านจากเครื่องวัดระดับเสียง (dB)"
      - text: "ตั้งตัวแปรควบคุม: กลองใบเดิม ไม้ตีอันเดิม ตีตรงกลางหน้ากลอง และวางเครื่องวัดห่างกลองเท่าเดิม เช่น 1 m"
        why: "ถ้าย้ายเครื่องวัดไปใกล้หรือไกลขึ้น ระดับเสียงจะเปลี่ยนเพราะระยะ ไม่ใช่เพราะความแรง"
      - text: "ตีแต่ละระดับ 3 ครั้ง จดค่าแล้วหาค่าเฉลี่ย"
      - text: "คาดการณ์ผล: ตีแรงขึ้น หน้ากลองสั่นแรงขึ้น ระดับเสียงที่วัดได้มากขึ้น"
    answer: "เปลี่ยนเฉพาะความแรงในการตี วัดระดับเสียงด้วยเครื่องวัดที่ระยะคงที่ แล้วเปรียบเทียบ"
  - { type: check, problem: physics.waves.sound-intro.p004, prompt: "ลองคิดก่อนอ่านต่อ" }
  - type: figure
    title: ระดับเสียงรอบตัว
    src: decibel-scale.svg
    alt: "แถบแนวตั้งแสดงระดับเสียง 0 ถึง 140 dB ส่วนล่างถึง 85 dB เป็นสีเขียว ส่วนบนตั้งแต่ 85 dB เป็นสีส้มแดง มีป้ายว่า ตั้งแต่ 85 dB ฟังนานหลายชั่วโมงทำลายการได้ยิน ตัวอย่างเสียง: 0 dB เสียงเบาที่สุดที่หูได้ยิน 30 dB เสียงกระซิบ 60 dB พูดคุยตามปกติ 80 dB ถนนที่รถติด 100 dB ลำโพงในงานคอนเสิร์ต 120 dB ประทัดหรือแตรรถใกล้หู ทำให้เจ็บหู 140 dB เครื่องบินไอพ่นขึ้นใกล้ ๆ"
    caption: "ค่าโดยประมาณ ระดับเสียงจริงขึ้นกับระยะห่างจากแหล่งกำเนิดเสียง"
  - type: worked-example
    title: ร้านซ่อมรถควรป้องกันหูอย่างไร
    problem: "พี่ช่างในอู่ซ่อมรถจักรยานยนต์วัดระดับเสียงได้ ห้องรับรองลูกค้า 55 dB ลานซ่อมทั่วไป 78 dB และจุดที่ใช้เครื่องเจียรเหล็ก 98 dB พี่ช่างทำงานจุดเครื่องเจียรวันละหลายชั่วโมง ควรทำอย่างไร"
    steps:
      - text: "เทียบแต่ละค่ากับระดับอันตราย 85 dB: ห้องรับรอง 55 dB และลานซ่อม 78 dB ต่ำกว่า จุดเครื่องเจียร 98 dB สูงกว่า"
      - text: "อยู่ในเสียงตั้งแต่ 85 dB นานหลายชั่วโมงทำให้หูเสื่อมถาวร จุดเครื่องเจียรจึงต้องป้องกัน"
        why: "หูเสื่อมจากเสียงดังค่อยเป็นค่อยไป ไม่เจ็บ จึงมักรู้ตัวเมื่อสายเกินไป"
      - text: "ป้องกันที่ผู้ฟัง: ใส่ที่ครอบหูหรือที่อุดหูทุกครั้งที่ใช้เครื่องเจียร"
      - text: "ลดระหว่างทางและที่แหล่งกำเนิด: ย้ายเครื่องเจียรให้ห่างห้องรับรองลูกค้า ใช้ผนังกั้น และสลับคนทำงานเพื่อลดเวลาที่แต่ละคนต้องฟัง"
    answer: "จุดเครื่องเจียร 98 dB เกิน 85 dB ต้องใส่อุปกรณ์ป้องกันหู และลดเวลากับระยะที่ต้องสัมผัสเสียง"
  - { type: check, problem: physics.waves.sound-intro.p014, prompt: "ใช้แถบระดับเสียงด้านบนช่วยตอบ" }
  - type: simulation
    title: คลื่นเสียง (PhET Sound Waves)
    url: https://phet.colorado.edu/en/simulations/sound-waves
    provider: phet
    note: "เปิดลำโพงแล้วลองเลื่อนแถบความถี่ (Frequency) ให้สูงขึ้น ยอดคลื่นจะชิดกันและเสียงสูงขึ้น ลองเลื่อนแถบแอมพลิจูด (Amplitude) ให้มากขึ้น คลื่นจะเข้มขึ้นและเสียงดังขึ้น"
glossary:
  - { term: แหล่งกำเนิดเสียง, definition: "วัตถุที่สั่นแล้วทำให้เกิดเสียง เช่น หน้ากลอง สายกีตาร์ เส้นเสียงในลำคอ" }
  - { term: ตัวกลาง, definition: "สิ่งที่เสียงเดินทางผ่าน เช่น อากาศ น้ำ ของแข็ง เสียงเดินทางในสุญญากาศไม่ได้" }
  - { term: ระดับเสียง (เสียงสูงต่ำ), definition: "ความสูงต่ำของเสียง วัตถุสั่นเร็ว (ความถี่สูง) เสียงสูง สั่นช้าเสียงต่ำ" }
  - { term: ความดัง, definition: "ความแรงของเสียง วัตถุสั่นแรง (แอมพลิจูดมาก) เสียงดัง" }
  - { term: เดซิเบล, definition: "หน่วยวัดระดับเสียง (dB) ตั้งแต่ประมาณ 85 dB ถ้าฟังนานหลายชั่วโมงเป็นอันตรายต่อหู" }
  - { term: มลพิษทางเสียง, definition: "เสียงที่ดังเกินไปหรือรบกวน ทำให้หูเสื่อม เครียด และนอนไม่หลับ" }
flashcards:
  - { front: "เสียงเกิดจากอะไร", back: "การสั่นของวัตถุ" }
  - { front: "เสียงสูงกับเสียงดังต่างกันอย่างไร", back: "เสียงสูงเกิดจากการสั่นเร็ว เสียงดังเกิดจากการสั่นแรง" }
  - { front: "วัตถุแบบใดให้เสียงสูง", back: "วัตถุที่สั้น เล็ก บาง หรือขึงตึง เพราะสั่นเร็ว" }
  - { front: "หูคนได้ยินเสียงความถี่ช่วงใด", back: "ประมาณ 20 ถึง 20,000 Hz สูงกว่านี้คืออัลตราซาวด์ ต่ำกว่าคืออินฟราซาวด์" }
  - { front: "ลดมลพิษทางเสียงได้ที่ไหนบ้าง", back: "ที่แหล่งกำเนิด (ลดเสียง) ระหว่างทาง (ระยะห่าง ต้นไม้ กำแพง) และที่ผู้ฟัง (ที่อุดหู ที่ครอบหู)" }
