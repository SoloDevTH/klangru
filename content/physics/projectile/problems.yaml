    answer: { value: 1.225, tolerance: 0.012, unit: m }
    hints:
      - "ความเร็ว $24\\ \\mathrm{m/s}$ เป็นแนวราบ มีผลต่อการตกในแนวดิ่งหรือไม่"
      - "แนวดิ่งเริ่มจาก $u_y = 0$ ใช้ $y = \\tfrac{1}{2}gt^2$"
    misconceptions:
      - { match: 2.45, feedback: "ดูเหมือนใช้ $y = gt^2$ ลืมคูณ $\\tfrac{1}{2}$" }
