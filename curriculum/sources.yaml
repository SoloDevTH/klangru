      เนื้อหาเขียนโดยผู้ทรงคุณวุฒิ เหมาะเป็นลิงก์อ่านเพิ่มเติมระดับเยาวชน แต่ยังไม่พบหน้าที่ตรงกับหัวข้อในคลังพอจะใส่ใน references
    evidence_url: https://www.saranukromthai.or.th/

  - id: orst
    name: สำนักงานราชบัณฑิตยสภา (พจนานุกรมฉบับราชบัณฑิตยสถาน และคลังความรู้)
    url: https://dictionary.orst.go.th/
    languages: [th]
    subjects: [thai, math, physics, chemistry]
    license: All rights reserved
    reuse: link-only
    api: ไม่มี API สาธารณะ ค้นคำผ่านแบบฟอร์มบนเว็บ dictionary.orst.go.th
    notes: >-
      เว็บไซต์หลัก www.orst.go.th ระบุ "สงวนลิขสิทธิ์ © พ.ศ. ๒๕๖๓ สำนักงานราชบัณฑิตยสภา"
      พจนานุกรมและศัพท์บัญญัติเป็นงานของหน่วยงานรัฐ แต่ไม่อยู่ในรายการงานที่ไม่ถือเป็นงานอันมีลิขสิทธิ์ตาม พ.ร.บ.ลิขสิทธิ์ มาตรา 7 (ซึ่งครอบคลุมกฎหมาย ระเบียบ ประกาศ คำพิพากษา)
      ใช้อ้างอิงการสะกดและศัพท์บัญญัติได้ (ข้อเท็จจริงสั้น ๆ) แต่ห้ามคัดลอกนิยามเป็นชุด
      เว็บไซต์หลักตอบช้าและบางครั้งหมดเวลา (timeout)
    evidence_url: https://www.orst.go.th/

