      - { id: c, text: "สมันวิวัฒนาการไปเป็นกวางชนิดอื่นที่ยังมีอยู่", feedback: "สมันสูญพันธุ์ไป ไม่ได้เปลี่ยนเป็นสปีชีส์อื่นในช่วงเวลาไม่กี่สิบปี" }
