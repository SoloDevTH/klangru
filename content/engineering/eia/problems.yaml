  - id: engineering.environmental.eia.p012
    topics:
      - engineering.environmental.eia
    difficulty: 4
    type: numeric
    stem: (ข้อมูลสมมติ) ผู้ผลิตอาหารแปรรูปสองรายในจังหวัดนครปฐม ผลิตภัณฑ์ A ใช้พลังงาน 1,500 MJ ต่อการผลิต 300 กิโลกรัม ผลิตภัณฑ์ B ใช้พลังงาน 1,200 MJ ต่อการผลิต 200 กิโลกรัม ผลิตภัณฑ์ B ใช้พลังงานต่อกิโลกรัมมากกว่า A กี่เปอร์เซ็นต์ (ตอบทศนิยมหนึ่งตำแหน่ง ใช้หน่วยฐานการเทียบต่อกิโลกรัม)
    answer:
      value: 20.0
      tolerance: 0.1
      unit: '%'
    hints:
      - คำนวณพลังงานต่อกิโลกรัมของทั้งสองผลิตภัณฑ์ก่อน
      - เปอร์เซ็นต์ที่มากกว่า = (ค่า B − ค่า A) ÷ ค่า A × 100
    misconceptions:
      - match: 16.7
        feedback: หารด้วยค่าของ B แทนค่าของ A ทำให้ได้ร้อยละที่ผิดฐาน
      - match: 1.0
        feedback: ได้ผลต่างของพลังงานต่อกิโลกรัม แต่ยังไม่ได้แปลงเป็นเปอร์เซ็นต์เทียบกับ A
    solution: A = 1,500 ÷ 300 = 5.0 MJ/kg B = 1,200 ÷ 200 = 6.0 MJ/kg ส่วนต่าง = (6.0 − 5.0) ÷ 5.0 × 100 = 20% การเทียบต่อหน่วยผลิตภัณฑ์ช่วยให้ไม่สับสนเมื่อปริมาณผลิตต่างกัน
    license: CC-BY-SA-4.0
    ai_assisted: true
