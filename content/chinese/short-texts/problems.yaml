  topics:
  - chinese.reading.short-texts
  difficulty: 4
  type: mcq
  stem: อ่านเรื่องสั้น ทำไมผู้เขียนจึงไม่เหนื่อย ทั้งที่นั่งรถไฟนาน
  figure: *id002
  choices:
  - id: a
    text: เพราะรถไฟเร็วมาก
    feedback: เรื่องบอกว่า 火车很慢 (รถไฟช้ามาก)
  - id: b
    text: เพราะนั่งเพียง 2 ชั่วโมง
    feedback: 十二个小时 = 12 ชั่วโมง
  - id: c
    text: เพราะนอนหลับตลอดทาง
    feedback: เรื่องไม่ได้บอก
  - id: d
    text: เพราะทิวทัศน์นอกหน้าต่างสวย
    correct: true
    feedback: ถูก 因为窗外的风景很美
  hints:
  - หาคำว่า 因为
  - 因为 นำเหตุผลที่อยู่หลัง 不累
  solution: …但是我一点儿也不累，**因为窗外的风景很美**。
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.reading.short-texts.p015
  topics:
  - chinese.reading.short-texts
  difficulty: 4
  type: mcq
  stem: อ่านเรื่องสั้นแล้วเลือกข้อความที่ **ตรงกับเรื่อง** ทุกข้อ
  figure: *id002
  multiple: true
  choices:
  - id: a
    text: 他们坐飞机去清迈。
    feedback: เรื่องบอกว่า 坐火车
  - id: b
    text: 晚上清迈很热。
    feedback: 晚上我们都穿外套 แสดงว่าตอนกลางคืนเย็น
  - id: c
    text: 他们先看了大象，然后去了夜市。
    correct: true
    feedback: ถูก 先去看了大象，然后去夜市
  - id: d
    text: 作者觉得清迈比曼谷凉快。
    correct: true
    feedback: ถูก 清迈比曼谷凉快
  - id: e
    text: 如果有机会，作者明年还想去清迈。
    correct: true
    feedback: ถูก ประโยคสุดท้ายของเรื่อง
  hints:
  - ตรวจทีละข้อกับประโยคในเรื่อง
  - 先…然后 บอกลำดับ
  solution: 'ตรงกับเรื่อง: **先看大象，然后去夜市** · **清迈比曼谷凉快** · **明年还想去**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.reading.short-texts.p016
  topics:
  - chinese.reading.short-texts
