<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="sans-serif" font-size="14">
  <title>เปรียบเทียบการเข้ารหัสแบบกุญแจสมมาตรซึ่งใช้กุญแจดอกเดียวกัน กับแบบกุญแจสาธารณะซึ่งเข้ารหัสด้วยกุญแจสาธารณะของผู้รับและถอดด้วยกุญแจส่วนตัว</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>
  <rect x="15.0" y="10.0" width="850.0" height="185.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="30.0" y="38.0" font-size="16" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">กุญแจสมมาตร (เช่น AES)</text>
  <rect x="40.0" y="60.0" width="170.0" height="64.0" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="125.0" y="87.8" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ผู้ส่ง (ปุ้ย)</text>
  <text x="125.0" y="111.2" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">MEET AT NOON</text>
  <rect x="355.0" y="60.0" width="170.0" height="64.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440.0" y="87.8" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ข้อความเข้ารหัส</text>
  <text x="440.0" y="111.2" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">อ่านไม่ออก</text>
  <rect x="670.0" y="60.0" width="170.0" height="64.0" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="755.0" y="87.8" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ผู้รับ (ต้นข้าว)</text>
  <text x="755.0" y="111.2" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">MEET AT NOON</text>
  <line x1="212.0" y1="92.0" x2="353.0" y2="92.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="527.0" y1="92.0" x2="668.0" y2="92.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="282.0" y="150.0" font-size="13" text-anchor="middle" fill="#b91c1c" font-weight="bold" xml:space="preserve">เข้ารหัสด้วยกุญแจ K</text>
  <text x="597.0" y="150.0" font-size="13" text-anchor="middle" fill="#b91c1c" font-weight="bold" xml:space="preserve">ถอดรหัสด้วยกุญแจ K ดอกเดียวกัน</text>
  <text x="440.0" y="180.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">เร็ว แต่ต้องหาทางส่งกุญแจ K ให้ผู้รับอย่างปลอดภัยก่อน</text>
  <rect x="15.0" y="220.0" width="850.0" height="185.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="30.0" y="248.0" font-size="16" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">กุญแจสาธารณะ</text>
  <rect x="40.0" y="270.0" width="170.0" height="64.0" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="125.0" y="297.8" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ผู้ส่ง (ปุ้ย)</text>
  <text x="125.0" y="321.1" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">MEET AT NOON</text>
  <rect x="355.0" y="270.0" width="170.0" height="64.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440.0" y="297.8" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ข้อความเข้ารหัส</text>
  <text x="440.0" y="321.1" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">อ่านไม่ออก</text>
  <rect x="670.0" y="270.0" width="170.0" height="64.0" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="755.0" y="297.8" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ผู้รับ (ต้นข้าว)</text>
  <text x="755.0" y="321.1" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">MEET AT NOON</text>
  <line x1="212.0" y1="302.0" x2="353.0" y2="302.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="527.0" y1="302.0" x2="668.0" y2="302.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="282.0" y="360.0" font-size="13" text-anchor="middle" fill="#b91c1c" font-weight="bold" xml:space="preserve">เข้ารหัสด้วยกุญแจสาธารณะของต้นข้าว</text>
  <text x="597.0" y="360.0" font-size="13" text-anchor="middle" fill="#b91c1c" font-weight="bold" xml:space="preserve">ถอดด้วยกุญแจส่วนตัวของต้นข้าว</text>
  <text x="440.0" y="390.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">กุญแจสาธารณะแจกได้ทุกคน กุญแจส่วนตัวมีแค่ต้นข้าว แต่คำนวณช้ากว่า</text>
</svg>
