  - id: computer.programming.block-programming.p012
    topics: [computer.programming.block-programming]
    difficulty: 3
    type: numeric
    stem: "ถ้าเขียนโปรแกรมให้หุ่นยนต์เดินรอบสี่เหลี่ยมจัตุรัส (เดินหน้า 2 ช่อง แล้วเลี้ยวขวา ทำ 4 ด้าน) โดย **ไม่ใช้** บล็อกทำซ้ำ ต้องใช้บล็อกเดินหน้าและเลี้ยวรวมกันกี่บล็อก"
    answer: { value: 8, unit: บล็อก }
    hints:
      - "หนึ่งด้านใช้บล็อกกี่บล็อก"
      - "สี่เหลี่ยมมี 4 ด้าน"
    misconceptions:
      - { match: 2, feedback: "2 บล็อกคือจำนวนที่อยู่ในวงวน ถ้าไม่ใช้วงวนต้องต่อซ้ำครบทั้ง 4 ด้าน" }
      - { match: 4, feedback: "4 คือจำนวนด้าน แต่แต่ละด้านใช้ 2 บล็อก คือเดินหน้าและเลี้ยวขวา" }
    solution: "แต่ละด้านใช้ เดินหน้า 2 ช่อง + เลี้ยวขวา = 2 บล็อก 4 ด้านจึงใช้ 4 × 2 = 8 บล็อก แต่ถ้าใช้วงวนเหลือแค่ 3 บล็อก"
