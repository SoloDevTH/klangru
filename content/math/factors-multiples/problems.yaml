  - id: math.fm.p020
    topics: [math.number.factors-multiples]
    difficulty: 5
    type: numeric
    stem: "โรงเรียนมีตู้ล็อกเกอร์หมายเลข 1–100 ปิดอยู่ทั้งหมด นักเรียนคนที่ 1 เปิดทุกตู้ คนที่ 2 สลับสถานะ (เปิดเป็นปิด ปิดเป็นเปิด) ตู้หมายเลขที่เป็นพหุคูณของ 2 คนที่ 3 สลับตู้ที่เป็นพหุคูณของ 3 ทำแบบนี้จนคนที่ 100 เมื่อจบ มีตู้เปิดอยู่กี่ตู้ (ตอบเป็นจำนวนตู้)"
    answer: { value: 10, unit: ตู้ }
    hints:
      - "ตู้หมายเลข $n$ ถูกสลับโดยนักเรียนคนที่เป็นตัวประกอบของ $n$ เท่านั้น"
      - "ตู้จะเปิดอยู่ตอนจบเมื่อถูกสลับเป็นจำนวนคี่ครั้ง คือหมายเลขที่มีตัวประกอบเป็นจำนวนคี่ตัว"
      - "ตัวประกอบมาเป็นคู่ ยกเว้นเมื่อคู่นั้นซ้ำกันเอง จำนวนแบบใดเป็นเช่นนั้น"
    misconceptions:
      - { match: 50, feedback: "ไม่ใช่ครึ่งหนึ่ง สถานะของตู้ขึ้นกับว่ามีตัวประกอบเป็นจำนวนคู่หรือคี่ตัว ไม่ใช่ว่าหมายเลขเป็นเลขคู่หรือคี่" }
      - { match: 25, feedback: "25 คือจำนวนจำนวนเฉพาะที่ไม่เกิน 100 แต่จำนวนเฉพาะมีตัวประกอบ 2 ตัว ถูกสลับ 2 ครั้ง จึงปิดอยู่ตอนจบ" }
    solution: "ตู้ $n$ ถูกสลับครั้งละหนึ่งต่อตัวประกอบหนึ่งตัวของ $n$ ตัวประกอบจับคู่กันได้ ($a \\times b = n$) ยกเว้นเมื่อ $a = b$ ซึ่งเกิดเฉพาะจำนวนกำลังสอง จำนวนกำลังสองจึงมีตัวประกอบเป็นจำนวนคี่ตัวและเปิดอยู่ตอนจบ ได้แก่ 1, 4, 9, 16, 25, 36, 49, 64, 81, 100 รวม 10 ตู้"
