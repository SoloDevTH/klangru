  <text x="105.0" y="181.9" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ตัวจับเวลาครบ</text>
  <rect x="20.0" y="216.0" width="170.0" height="46.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="105.0" y="243.9" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">เซนเซอร์ส่งค่า</text>
  <text x="105.0" y="300.0" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="bold" xml:space="preserve">เหตุการณ์</text>
  <text x="300.0" y="40.0" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="bold" xml:space="preserve">คิวเหตุการณ์</text>
