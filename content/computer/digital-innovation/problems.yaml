  - id: computer.projects.digital-innovation.p014
    topics: [computer.projects.digital-innovation]
    difficulty: 5
    type: numeric
    stem: "กลุ่มแม่บ้านจ้างออกแบบถุงใหม่พร้อมเรื่องเล่าและคิวอาร์โค้ด ค่าออกแบบ 1,500 บาท (จ่ายครั้งเดียว) ถุงใหม่แพงกว่าถุงเดิมใบละ 8 บาท ขายกล้วยตากแบบเดิมได้ราคาขึ้นจาก 60 เป็น 75 บาท ถ้ายังขายได้เดือนละ 120 ถุงเท่าเดิม ต้องขายกี่เดือนเต็มกำไรที่เพิ่มขึ้นจึงคืนค่าออกแบบได้ครบ"
    answer: { value: 2, unit: "เดือน" }
    hints:
      - "กำไรที่เพิ่มต่อถุง = ราคาที่เพิ่ม − ต้นทุนถุงที่เพิ่ม"
      - "หากำไรที่เพิ่มต่อเดือน แล้วดูว่ากี่เดือนจึงรวมได้ถึง 1,500 บาท (ปัดขึ้นเป็นเดือนเต็ม)"
    misconceptions:
      - { match: 1, feedback: "ลืมหักค่าถุงที่แพงขึ้น 8 บาท กำไรที่เพิ่มต่อถุงจึงไม่ใช่ 15 บาท" }
      - { match: 1.79, feedback: "1.79 เดือนยังไม่ใช่เดือนเต็ม เมื่อจบเดือนที่ 1 ยังคืนทุนไม่ครบ ต้องปัดขึ้น" }
    solution: "กำไรที่เพิ่มต่อถุง (75 − 60) − 8 = 7 บาท × 120 ถุง = 840 บาทต่อเดือน 1,500 ÷ 840 ≈ 1.79 จบเดือนที่ 1 ได้คืน 840 บาท จบเดือนที่ 2 ได้คืน 1,680 บาท จึงต้อง 2 เดือน (ถ้ายอดขายลดลงเพราะราคาสูงขึ้น จะต้องใช้เวลานานกว่านี้)"
    license: CC-BY-SA-4.0
    ai_assisted: true

