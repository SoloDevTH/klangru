<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="sans-serif">
<title>ห้าขั้นของการแก้ปัญหาสุขภาพชุมชน</title>
<rect x="0" y="0" width="700" height="470" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="350.0" y="30.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">ห้าขั้นของการแก้ปัญหาสุขภาพชุมชน</text>
<line x1="420.5" y1="131.0" x2="475.6" y2="163.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="529.5" y1="245.0" x2="487.9" y2="347.5" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="373.2" y1="388.5" x2="326.8" y2="388.5" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="212.1" y1="347.5" x2="170.5" y2="245.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="224.4" y1="163.0" x2="279.5" y2="131.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="258.0" y="55.0" width="184.0" height="70.0" rx="8" fill="#eaf2f8" stroke="#333" stroke-width="1.5"/>
<text x="350.0" y="78.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1 รวบรวมข้อมูล</text>
<text x="350.0" y="98.0" font-size="11.5" text-anchor="middle" fill="#111">สถิติ รพ.สต. แบบสำรวจ</text>
<text x="350.0" y="113.0" font-size="11.5" text-anchor="middle" fill="#111">แผนที่ชุมชน จุดเสี่ยง</text>
<rect x="454.2" y="169.0" width="184.0" height="70.0" rx="8" fill="#eaf2f8" stroke="#333" stroke-width="1.5"/>
<text x="546.2" y="192.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">2 วิเคราะห์ จัดลำดับ</text>
<text x="546.2" y="212.0" font-size="11.5" text-anchor="middle" fill="#111">ขนาด ความรุนแรง</text>
<text x="546.2" y="227.0" font-size="11.5" text-anchor="middle" fill="#111">ความยากง่าย ความร่วมมือ</text>
<rect x="379.2" y="353.5" width="184.0" height="70.0" rx="8" fill="#eaf2f8" stroke="#333" stroke-width="1.5"/>
<text x="471.2" y="376.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">3 วางแผน</text>
<text x="471.2" y="396.5" font-size="11.5" text-anchor="middle" fill="#111">เป้าหมายวัดได้ กิจกรรม</text>
<text x="471.2" y="411.5" font-size="11.5" text-anchor="middle" fill="#111">ผู้รับผิดชอบ งบ ตัวชี้วัด</text>
<rect x="136.8" y="353.5" width="184.0" height="70.0" rx="8" fill="#eaf2f8" stroke="#333" stroke-width="1.5"/>
<text x="228.8" y="376.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">4 ลงมือทำ</text>
<text x="228.8" y="396.5" font-size="11.5" text-anchor="middle" fill="#111">คนในชุมชนร่วมทำ</text>
<text x="228.8" y="411.5" font-size="11.5" text-anchor="middle" fill="#111">อสม. รพ.สต. อบต. โรงเรียน</text>
<rect x="61.8" y="169.0" width="184.0" height="70.0" rx="8" fill="#eaf2f8" stroke="#333" stroke-width="1.5"/>
<text x="153.8" y="192.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">5 ประเมินผล</text>
<text x="153.8" y="212.0" font-size="11.5" text-anchor="middle" fill="#111">เทียบข้อมูลก่อน–หลัง</text>
<text x="153.8" y="227.0" font-size="11.5" text-anchor="middle" fill="#111">ปรับแผนแล้ววนใหม่</text>
<text x="350.0" y="260.0" font-size="13" text-anchor="middle" fill="#555">ชุมชนร่วมคิด ร่วมทำ</text>
<text x="350.0" y="278.0" font-size="13" text-anchor="middle" fill="#555">ร่วมประเมิน</text>
</svg>
