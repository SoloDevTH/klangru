id: english.grammar.past-simple
subject: english
title: { th: Past simple (อดีตกาลธรรมดา), en: Past simple }
summary: เล่าเหตุการณ์ที่จบแล้วในอดีตด้วยกริยาช่องที่ 2 ทั้งกริยาปกติที่เติม -ed และกริยาไม่ปกติที่ใช้บ่อย และใช้ did ในประโยคปฏิเสธและคำถาม
difficulty: 2
minutes: 30
prerequisites: [english.grammar.present-simple]
encompasses:
  - { id: english.grammar.present-simple, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
glossary:
  - { term: past simple, definition: "รูปประโยคที่ใช้กับเหตุการณ์ที่เกิดและจบแล้วในอดีต เช่น I watched a movie yesterday." }
  - { term: กริยาช่องที่ 2 (V2), definition: "รูปอดีตของกริยา กริยาปกติเติม -ed เช่น played ส่วนกริยาไม่ปกติเปลี่ยนรูปเฉพาะตัว เช่น go → went" }
  - { term: กริยาไม่ปกติ, definition: "กริยาที่ไม่ได้เติม -ed ในรูปอดีต ต้องจำเป็นคำ ๆ เช่น buy → bought, eat → ate" }
flashcards:
  - { front: "ปฏิเสธและคำถามของ past simple ใช้อะไร", back: "didn't หรือ Did แล้วตามด้วยกริยาช่องที่ 1 เช่น Did you see it? / I didn't go." }
  - { front: "stop, study เติม -ed อย่างไร", back: "stopped (เพิ่มตัวสะกด) และ studied (พยัญชนะ + y เปลี่ยนเป็น ied)" }
  - { front: "ช่องที่ 2 ของ go, buy, teach, eat", back: "went, bought, taught, ate" }
  - { front: "Did Nok buy a new phone? (ตอบปฏิเสธสั้น)", back: "No, she didn't." }
