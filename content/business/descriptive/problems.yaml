  - id: business.stats.descriptive.p017
    topics: [business.stats.descriptive]
    difficulty: 5
    type: numeric
    stem: "ปีนี้ปุ๋ยสูตรหนึ่งราคากิโลกรัมละ $50$ บาท และดัชนีราคาปุ๋ยปีนี้เท่ากับ $125$ (ปีฐาน $= 100$) ถ้าราคาปุ๋ยเปลี่ยนตามดัชนี ราคาปีฐานกิโลกรัมละกี่บาท (ตอบเป็นบาท)"
    answer: { value: 40, unit: บาท }
    hints:
      - "ดัชนี $= \\dfrac{p_1}{p_0} \\times 100$ แทนค่า $p_1 = 50$ และดัชนี $125$"
      - "จัดรูปให้ $p_0$ อยู่ข้างเดียว"
    misconceptions:
      - { match: 62.5, feedback: "คูณด้วย 1.25 แต่ 50 บาทคือราคาปีนี้ซึ่งแพงกว่าแล้ว ต้องหารด้วย 1.25" }
      - { match: 37.5, feedback: "ลบ 25% ของราคาปีนี้ แต่ 25% คิดจากราคาปีฐาน ต้องหารด้วย 1.25" }
    solution: "$125 = \\dfrac{50}{p_0} \\times 100 \\Rightarrow p_0 = \\dfrac{50 \\times 100}{125} = 40$ บาท"
