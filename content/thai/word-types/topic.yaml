id: thai.grammar.word-types
subject: thai
title: { th: ชนิดของคำ 7 ชนิด, en: The seven Thai parts of speech }
summary: แยกคำนาม สรรพนาม กริยา วิเศษณ์ บุพบท สันธาน และอุทาน จากหน้าที่ในประโยค และบอกประธาน กริยา กรรมได้
difficulty: 3
minutes: 30
prerequisites: [thai.writing.consonants]
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: sentence-parts.svg
    alt: "แผนภาพประโยค แมวอ้วนของป้าจับหนูในครัว วงเล็บซ้ายคือภาคประธาน คลุมคำว่า แมว อ้วน ของ ป้า วงเล็บขวาคือภาคแสดง คลุมคำว่า จับ หนู ใน ครัว ใต้แต่ละคำบอกชนิดและหน้าที่: แมว คำนาม ประธาน, อ้วน คำวิเศษณ์ ส่วนขยาย, ของ คำบุพบท ส่วนขยาย, ป้า คำนาม ส่วนขยาย, จับ คำกริยา กริยา, หนู คำนาม กรรม, ใน คำบุพบท ส่วนขยาย, ครัว คำนาม ส่วนขยาย"
    caption: "ภาคประธานคือประธานกับส่วนขยาย ภาคแสดงคือกริยา กรรม และส่วนขยาย"
  - type: figure
    src: word-type-flow.svg
    alt: "ผังคำถามบอกชนิดของคำ ถามทีละข้อจากบนลงล่าง ถ้าใช่ไปทางขวา: แสดงอารมณ์ความรู้สึก ใช่ คือคำอุทาน; เชื่อมคำหรือข้อความสองส่วน ใช่ คือคำสันธาน; นำหน้าคำนามบอกความสัมพันธ์ ใช่ คือคำบุพบท; ใช้แทนคำนาม ใช่ คือคำสรรพนาม; เป็นชื่อคน สัตว์ สิ่งของ ความคิด ใช่ คือคำนาม; บอกการกระทำหรือสภาพ ใช่ คือคำกริยา; ถ้าไม่ใช่ทั้งหมดและขยายคำอื่น คือคำวิเศษณ์"
    caption: "ใช้ผังนี้ตรวจคำที่ไม่แน่ใจ โดยดูหน้าที่ในประโยค ไม่ใช่ดูแค่รูปคำ"
  - type: worked-example
    title: บอกชนิดของคำในประโยคสั้น
    problem: "บอกชนิดของคำทุกคำในประโยค \"โอ้โฮ แมวกระโดดสูงมาก\""
    steps:
      - text: "โอ้โฮ แสดงความรู้สึกประหลาดใจ → คำอุทาน"
      - text: "แมว เป็นชื่อสัตว์ → คำนาม ทำหน้าที่ประธาน"
      - text: "กระโดด บอกการกระทำ → คำกริยา"
      - text: "สูง บอกว่ากระโดดอย่างไร ขยายกริยา → คำวิเศษณ์"
      - text: "มาก บอกว่าสูงแค่ไหน ขยายคำวิเศษณ์ สูง → คำวิเศษณ์"
        why: "คำวิเศษณ์ขยายคำวิเศษณ์ด้วยกันได้"
    answer: "โอ้โฮ อุทาน · แมว นาม · กระโดด กริยา · สูง วิเศษณ์ · มาก วิเศษณ์"
  - { type: check, problem: thai.word.p015, prompt: "ลองเลือกลักษณนามให้ถูก" }
  - type: worked-example
    title: แยกภาคประธาน ภาคแสดง และชนิดของคำ
    problem: "ประโยค \"คุณตาของฉันปลูกมะพร้าวสองต้นที่สวนหลังบ้าน\" แยกภาคประธานกับภาคแสดง และบอกชนิดของคำ ต้น"
    steps:
      - text: "ถามว่าใครปลูก: คุณตา คือประธาน"
      - text: "ของฉัน ขยายว่าเป็นคุณตาของใคร ภาคประธานจึงเป็น คุณตาของฉัน"
        why: "ภาคประธานรวมส่วนขยายของประธานเสมอ"
      - text: "ส่วนที่เหลือคือภาคแสดง: ปลูก (กริยา) มะพร้าว (กรรม) สองต้น และ ที่สวนหลังบ้าน (ส่วนขยาย)"
      - text: "ต้น ตามหลังตัวเลข สอง บอกลักษณะของมะพร้าว → ลักษณนาม ซึ่งเป็นคำนาม ส่วน สอง เป็นคำวิเศษณ์บอกจำนวน"
      - text: "ที่ นำหน้าคำนาม สวนหลังบ้าน บอกสถานที่ → คำบุพบท"
        why: "ที่ ในประโยคนี้ไม่ได้แทนคำนามข้างหน้า จึงไม่ใช่สรรพนาม"
    answer: "ภาคประธาน: คุณตาของฉัน · ภาคแสดง: ปลูกมะพร้าวสองต้นที่สวนหลังบ้าน · ต้น เป็นคำนาม (ลักษณนาม)"
  - { type: check, problem: thai.word.p017, prompt: "ลองหาภาคประธานด้วยตัวเอง" }
glossary:
  - { term: คำสรรพนาม, definition: "คำที่ใช้แทนคำนาม เช่น ฉัน เธอ ใคร นี่ และ ที่ ซึ่ง อัน เมื่อใช้เชื่อมประโยคกับคำนามข้างหน้า" }
  - { term: คำวิเศษณ์, definition: "คำที่ขยายคำนาม คำกริยา หรือคำวิเศษณ์ด้วยกัน เช่น เร็ว มาก ใหญ่ นี้" }
  - { term: คำบุพบท, definition: "คำที่นำหน้าคำนามหรือสรรพนามเพื่อบอกความสัมพันธ์ เช่น ใน บน ของ จาก" }
  - { term: คำสันธาน, definition: "คำที่เชื่อมคำกับคำหรือประโยคกับประโยค เช่น และ แต่ หรือ เพราะ" }
flashcards:
  - { front: "คำ 7 ชนิดในภาษาไทยมีอะไรบ้าง", back: "นาม สรรพนาม กริยา วิเศษณ์ บุพบท สันธาน อุทาน" }
  - { front: "นี่ กับ นี้ ต่างกันอย่างไร", back: "นี่ ใช้แทนสิ่งของ เป็นคำสรรพนาม (นี่คือบ้าน) ส่วน นี้ ขยายคำนาม เป็นคำวิเศษณ์ (บ้านนี้)" }
  - { front: "ความรู้ การวิ่ง เป็นคำชนิดใด", back: "คำนาม เพราะมี ความ หรือ การ นำหน้าคำกริยาหรือคำวิเศษณ์" }
  - { front: "ภาคประธานกับภาคแสดงต่างกันอย่างไร", back: "ภาคประธาน = ประธาน + ส่วนขยาย (น้องสาวของฉัน) ภาคแสดง = กริยา + กรรม + ส่วนขยาย (กินขนมอย่างอร่อย)" }
  - { front: "คำบุพบทต่างจากคำวิเศษณ์บอกตำแหน่งอย่างไร", back: "บุพบทต้องมีคำนามตามหลัง เช่น บนโต๊ะ ถ้าไม่มี เช่น อยู่ข้างบน เป็นคำวิเศษณ์" }
