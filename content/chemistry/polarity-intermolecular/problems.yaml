    solution: "ทั้งสองมีแต่แรงลอนดอนและมวลเท่ากัน แต่โมเลกุลโซ่ตรงเรียงแนบกันได้ยาว พื้นที่ผิวสัมผัสมาก แรงลอนดอนรวมจึงมากกว่าโมเลกุลทรงกลมที่แตะกันได้น้อย"
