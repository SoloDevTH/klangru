  - id: biology.cells.bioenergetics.p019
    topics: [biology.cells.bioenergetics]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน `delta_g(dh, t, ds)` ที่คืนค่าพลังงานอิสระของกิบส์ ΔG = ΔH − TΔS เมื่อ dh เป็น ΔH (kJ/mol) t เป็นอุณหภูมิเคลวิน และ ds เป็น ΔS (kJ/(mol·K))"
    starter: |
      def delta_g(dh, t, ds):
          pass
    tests: |
      r = delta_g(50, 300, 0.1)
      assert r is not None, "ไม่ได้คืนค่า (ได้ None) ต้องใช้ return ไม่ใช่ print"
      assert abs(r - 20) < 1e-6, f"delta_g(50, 300, 0.1) ควรได้ 20 แต่ได้ {r} ตรวจเครื่องหมายของ TΔS"
      r2 = delta_g(-100, 298, -0.2)
      assert abs(r2 - (-40.4)) < 1e-6, f"delta_g(-100, 298, -0.2) ควรได้ -40.4 แต่ได้ {r2}"
      assert abs(delta_g(0, 300, 1) - (-300)) < 1e-6, "เมื่อ ΔH เป็นศูนย์และ ΔS เป็นบวก ΔG ต้องเท่ากับ −TΔS"
    reference: |
      def delta_g(dh, t, ds):
          return dh - t * ds
    hints:
      - "สูตรคือ ΔH ลบด้วยผลคูณของ T และ ΔS"
      - "ระวังเครื่องหมายลบหน้า TΔS เมื่อ ΔS เป็นลบ TΔS จะเป็นลบ"
    solution: "return dh - t * ds เช่น delta_g(50, 300, 0.1) = 50 − 300 × 0.1 = 20"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.bioenergetics.p020
    topics: [biology.cells.bioenergetics]
    difficulty: 5
    type: numeric
    stem: "ATP ไฮโดรไลซ์ที่ 310 K (37 °C) โดย ΔG°′ = −30.5 kJ/mol เมื่อความเข้มข้นในเซลล์ทำให้ [ADP][Pi]/[ATP] = 0.001 ใช้สมการ ΔG = ΔG°′ + RT ln([ADP][Pi]/[ATP]) โดย R = 8.314 J/(mol·K) คำนวณ ΔG ในเซลล์ (ตอบเป็น kJ/mol ทศนิยมหนึ่งตำแหน่ง)"
    answer: { value: -48.3, tolerance: 0.2, unit: "kJ/mol" }
    misconceptions:
      - { match: -12.7, feedback: "ใส่เครื่องหมายผิดในพจน์ ln ln(0.001) เป็นลบ ต้องนำไปบวกกับ ΔG°′ ตามเครื่องหมายจริง" }
      - { match: -30.5, feedback: "ตอบ ΔG°′ ที่สภาวะมาตรฐาน โดยไม่รวมพจน์ของความเข้มข้น" }
    hints:
      - "คำนวณ RT ก่อน โดยแปลง R เป็น kJ/(mol·K)"
      - "ln(0.001) มีค่าประมาณ −6.9 และต้องคูณด้วย RT แล้วบวกกับ ΔG°′"
    solution: "RT = 8.314 × 10⁻³ × 310 ≈ 2.58 kJ/mol ln(0.001) ≈ −6.908 ΔG = −30.5 + 2.58 × (−6.908) ≈ −48.3 kJ/mol"
    license: CC-BY-SA-4.0
    ai_assisted: true

