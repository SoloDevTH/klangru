topic: english.writing.notices-announcements
rows:
  - { framework: th-core-2551-foreign-languages, indicators: ["ต 4.2 ม.2/2", "ต 4.2 ม.3/2"], coverage: partial, note: "สอนการเขียนประกาศ โปสเตอร์ อีเมลเชิญ และข่าวประชาสัมพันธ์ของโรงเรียนและชุมชน ผู้เรียนเติมคำบุพบทวันเวลา เรียงประกาศและอีเมล หาข้อมูลที่ขาด และเลือกข่าวประชาสัมพันธ์ที่ดี แต่การเขียนเองอย่างอิสระและการเผยแพร่จริงเป็นกิจกรรมนอกแอป" }
  - { framework: th-core-2551-foreign-languages, indicators: ["ต 4.2 ม.4-6/2"], coverage: partial, note: "ครอบคลุมข่าวสารของโรงเรียน ชุมชน และท้องถิ่น แต่ยังไม่มีข่าวสารระดับประเทศ และการเผยแพร่จริงเป็นกิจกรรมนอกแอป" }
  - { framework: cefr, indicators: ["CEFR-B1-written-interaction"], coverage: partial, note: "สอนโครงสร้างอีเมลเชิญ (Subject, Dear ..., I'm writing to ..., Best wishes) และให้เรียงส่วนของอีเมล แต่ผู้เรียนไม่ได้เขียนอีเมลเอง" }
  - { framework: cefr, indicators: ["CEFR-B1-written-production"], coverage: partial, note: "เรียงประกาศและข่าวสั้นที่ร้อยข้อมูลเป็นลำดับ และตรวจร่างโปสเตอร์ แต่ไม่ได้เขียนข้อความต่อเนื่องเองอย่างอิสระ" }
