id: physics.thermal.phase-change
subject: physics
title: { th: การเปลี่ยนสถานะและความร้อนแฝง, en: Change of state and latent heat }
summary: อธิบายว่าทำไมอุณหภูมิคงที่ขณะเปลี่ยนสถานะ คำนวณความร้อนแฝง และอ่านกราฟอุณหภูมิกับเวลาเมื่อให้ความร้อนน้ำแข็งจนกลายเป็นไอ
difficulty: 4.5
minutes: 35
prerequisites: [physics.thermal.temperature-heat]
encompasses:
  - { id: physics.thermal.temperature-heat, weight: 0.5 }
curriculum_tags: []
lessons:
  - type: figure
    src: particle-model-states.svg
    alt: "กล่องสามกล่องแสดงอนุภาคเป็นวงกลม ของแข็ง: อนุภาคเรียงเป็นแถวเป็นระเบียบชิดกัน ของเหลว: อนุภาคชิดกันแต่เรียงไม่เป็นระเบียบ อยู่ส่วนล่างของกล่อง แก๊ส: อนุภาคน้อยตัวกระจายห่างกันทั่วกล่อง แต่ละตัวมีลูกศรบอกว่ากำลังเคลื่อนที่ไปคนละทิศ"
    caption: "แบบจำลองอนุภาค: เปลี่ยนสถานะคือเปลี่ยนการจัดเรียงและระยะห่างของอนุภาค ชนิดและจำนวนอนุภาคเท่าเดิม"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: อ่านกราฟให้ความร้อนน้ำแข็งจนเป็นไอ
    problem: "กราฟในภาพแสดงอุณหภูมิของน้ำแข็ง $1\\ \\mathrm{kg}$ ที่ $-20\\ ^\\circ\\mathrm{C}$ เมื่อให้ความร้อนจนเป็นไอน้ำ $120\\ ^\\circ\\mathrm{C}$ จงคำนวณความร้อนของแต่ละช่วงให้ตรงกับกราฟ และบอกว่าช่วงใดใช้ความร้อนมากที่สุด"
    figure:
      src: heating-curve-water.svg
      alt: "กราฟอุณหภูมิ (°C) กับความร้อนที่ให้ (kJ) ห้าช่วง: ช่วง 1 เส้นชันจาก −20 ถึง 0 °C ใช้ 42 kJ ช่วง 2 เส้นราบที่ 0 °C ยาว 336 kJ (หลอมเหลว) ช่วง 3 เส้นเอียงจาก 0 ถึง 100 °C ใช้ 420 kJ ช่วง 4 เส้นราบที่ 100 °C ยาว 2260 kJ (เดือด) และช่วง 5 เส้นชันจาก 100 ถึง 120 °C"
    steps:
      - text: "ช่วง ① น้ำแข็งร้อนขึ้น: $Q = (1)(2100)(20) = 42\\,000\\ \\mathrm{J} = 42\\ \\mathrm{kJ}$"
      - text: "ช่วง ② หลอมเหลว: $Q = (1)(3.36 \\times 10^5) = 336\\ \\mathrm{kJ}$ อุณหภูมิค้างที่ $0\\ ^\\circ\\mathrm{C}$"
      - text: "ช่วง ③ น้ำร้อนขึ้น: $Q = (1)(4200)(100) = 420\\ \\mathrm{kJ}$ ความชันน้อยกว่าช่วง ① เพราะ $c$ ของน้ำมากกว่าน้ำแข็งสองเท่า"
        why: "บนกราฟที่แกนนอนเป็นความร้อน ความชันคือ $\\dfrac{\\Delta T}{Q} = \\dfrac{1}{mc}$ ถ้า $c$ มากขึ้น เส้นจึงลาดลง"
      - text: "ช่วง ④ เดือด: $Q = (1)(2.26 \\times 10^6) = 2260\\ \\mathrm{kJ}$ มากที่สุด ช่วง ⑤ ไอน้ำร้อนขึ้น $20\\ \\mathrm{K}$ (ใช้ $c$ ของไอน้ำราว $2000\\ \\mathrm{J/(kg\\cdot K)}$) ได้ $40\\ \\mathrm{kJ}$"
    answer: "ช่วงเดือดใช้ความร้อนมากที่สุด $2260\\ \\mathrm{kJ}$ มากกว่าความร้อนของช่วงอื่นรวมกันเกือบสามเท่า"
  - { type: check, problem: phy.phase.p013, prompt: "ทำไมช่วงราบที่ 100 °C ยาวกว่า" }
  - type: worked-example
    title: กาต้มน้ำไฟฟ้า ต้มให้เดือดแล้วปล่อยให้เดือดต่อ
    problem: "กาต้มน้ำไฟฟ้ากำลัง $2000\\ \\mathrm{W}$ ต้มน้ำ $1.5\\ \\mathrm{kg}$ ที่ $30\\ ^\\circ\\mathrm{C}$ ถ้าความร้อนทั้งหมดเข้าสู่น้ำ น้ำจะเริ่มเดือดในเวลาเท่าใด และถ้าลืมปิด ต้องเดือดต่ออีกนานเท่าใดน้ำจึงหายไป $0.2\\ \\mathrm{kg}$"
    steps:
      - text: "ความร้อนที่ทำให้น้ำร้อนถึง $100\\ ^\\circ\\mathrm{C}$: $Q_1 = (1.5)(4200)(70) = 441\\,000\\ \\mathrm{J}$"
      - text: "กำลัง $2000\\ \\mathrm{W}$ คือ $2000\\ \\mathrm{J}$ ต่อวินาที เวลา $= \\dfrac{441\\,000}{2000} \\approx 221\\ \\mathrm{s}$ (ราว 3.7 นาที)"
      - text: "ความร้อนที่ทำให้น้ำ $0.2\\ \\mathrm{kg}$ กลายเป็นไอ: $Q_2 = (0.2)(2.26 \\times 10^6) = 452\\,000\\ \\mathrm{J}$ ใช้เวลา $\\dfrac{452\\,000}{2000} = 226\\ \\mathrm{s}$"
        why: "ระหว่างเดือด อุณหภูมิค้างที่ $100\\ ^\\circ\\mathrm{C}$ ความร้อนทั้งหมดใช้เปลี่ยนสถานะ จึงใช้ $Q = mL_v$"
    answer: "เดือดหลังประมาณ $221\\ \\mathrm{s}$ และต้องเดือดต่ออีกประมาณ $226\\ \\mathrm{s}$ น้ำจึงหายไป $0.2\\ \\mathrm{kg}$ (น้ำเพียง 13% ของกา ใช้เวลาพอ ๆ กับการต้มทั้งกาจาก $30$ ถึง $100\\ ^\\circ\\mathrm{C}$)"
  - { type: check, problem: phy.phase.p001, prompt: "ความร้อนไปไหนระหว่างน้ำแข็งละลาย" }
  - type: interactive
    title: กราฟอุณหภูมิของน้ำแข็งที่ได้รับความร้อน
    caption: แกนนอนคือความร้อนที่ให้ (kJ) แกนตั้งคืออุณหภูมิ (°C) เริ่มจากน้ำแข็ง −20 °C ใช้ c น้ำแข็ง 2,100 J/(kg·K) c น้ำ 4,200 J/(kg·K) L_f 3.36 × 10⁵ J/kg และ L_v 2.26 × 10⁶ J/kg ช่วงราบที่ 0 °C คือการหลอมเหลว ส่วนเส้นราบที่ 100 °C คือการเดือด ซึ่งยาวกว่ามากและยาวเลยขอบกราฟ ลองเพิ่มมวล m จะเห็นทุกช่วงยืดออกตามมวล
    widget:
      kind: function-plot
      functions: ["\\min(0, -20 + \\frac{x}{2.1 m}) + \\max(0, \\min(100, \\frac{x - 378 m}{4.2 m}))"]
      sliders:
        - { name: m, min: 0.75, max: 2, step: 0.25, value: 1, label: มวลของน้ำแข็ง m (kg) }
      x: [0, 2000]
      y: [-30, 120]
  - type: simulation
    title: สถานะของสสาร (PhET States of Matter Basics)
    url: https://phet.colorado.edu/en/simulations/states-of-matter-basics
    provider: phet
    note: เลือกน้ำแล้วกดให้ความร้อน สังเกตว่าเมื่อโมเลกุลเริ่มหลุดจากโครงสร้างผลึก อุณหภูมิแทบไม่เปลี่ยน จนเปลี่ยนสถานะเสร็จจึงร้อนขึ้นต่อ
glossary:
  - { term: ความร้อนแฝง, definition: "ความร้อนที่สารรับหรือคายขณะเปลี่ยนสถานะ โดยอุณหภูมิไม่เปลี่ยน" }
  - { term: ความร้อนแฝงจำเพาะ, definition: "ความร้อนที่ใช้เปลี่ยนสถานะสาร $1\\ \\mathrm{kg}$ ที่อุณหภูมิคงที่ หน่วย $\\mathrm{J/kg}$ ใช้ใน $Q = mL$" }
  - { term: การหลอมเหลว, definition: "การเปลี่ยนจากของแข็งเป็นของเหลว เช่น น้ำแข็งละลายที่ $0\\ ^\\circ\\mathrm{C}$ ต้องรับความร้อน" }
  - { term: การควบแน่น, definition: "การเปลี่ยนจากแก๊สเป็นของเหลว เช่น ไอน้ำกลายเป็นหยดน้ำ คายความร้อนแฝงออกมา" }
flashcards:
  - { front: "ทำไมอุณหภูมิไม่เพิ่มขณะน้ำแข็งละลาย", back: "ความร้อนที่ได้รับถูกใช้ทำลายแรงยึดเหนี่ยวระหว่างโมเลกุลเพื่อเปลี่ยนสถานะ ไม่ได้เพิ่มพลังงานจลน์ของโมเลกุล" }
  - { front: "สูตรความร้อนแฝง", back: "$Q = mL$ โดย $L$ มีหน่วย $\\mathrm{J/kg}$" }
  - { front: "$L_f$ ของน้ำแข็ง และ $L_v$ ของน้ำ (ค่าในหัวข้อนี้)", back: "$L_f = 3.36 \\times 10^5\\ \\mathrm{J/kg}$, $L_v = 2.26 \\times 10^6\\ \\mathrm{J/kg}$" }
  - { front: "ช่วงราบบนกราฟอุณหภูมิกับเวลาหมายถึงอะไร", back: "ช่วงที่สารกำลังเปลี่ยนสถานะ ถ้าให้ความร้อนอัตราคงที่ ช่วงยิ่งยาว ความร้อนแฝงยิ่งมาก" }
