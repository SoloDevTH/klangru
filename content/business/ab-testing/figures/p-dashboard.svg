<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" font-family="sans-serif">
<title>ผลการทดลอง A/B ของร้านผ้าไหมออนไลน์</title>
<defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#222"/></marker></defs>
<rect width="600" height="200" fill="#ffffff"/>
<rect x="20.0" y="20.0" width="560.0" height="36.0" fill="#e8eef6" stroke="#222" stroke-width="1.2" rx="0"/>
<text x="30.0" y="44.0" font-size="14" text-anchor="start" fill="#222" font-weight="bold">กลุ่ม</text>
<text x="250.0" y="44.0" font-size="14" text-anchor="start" fill="#222" font-weight="bold">ผู้เข้าชม</text>
<text x="400.0" y="44.0" font-size="14" text-anchor="start" fill="#222" font-weight="bold">ผู้ซื้อ</text>
<rect x="20.0" y="56.0" width="560.0" height="40.0" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="0"/>
<text x="30.0" y="82.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">A ปุ่ม &quot;ใส่ตะกร้า&quot; สีเทา (เดิม)</text>
<text x="250.0" y="82.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">5,000</text>
<text x="400.0" y="82.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">200</text>
<rect x="20.0" y="96.0" width="560.0" height="40.0" fill="#f7f7f7" stroke="#bbb" stroke-width="1" rx="0"/>
<text x="30.0" y="122.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">B ปุ่ม &quot;ใส่ตะกร้า&quot; สีส้ม (ใหม่)</text>
<text x="250.0" y="122.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">5,000</text>
<text x="400.0" y="122.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">245</text>
<text x="30.0" y="170.0" font-size="13" text-anchor="start" fill="#444" font-weight="normal">สุ่มผู้เข้าชมเข้ากลุ่มละครึ่ง ทดลองพร้อมกัน 14 วัน</text>
