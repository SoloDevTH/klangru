  - id: computer.data.number-representation.p019
    topics: [computer.data.number-representation]
    difficulty: 5
    type: numeric
    stem: "เก็บ $10.0$ แบบจุดลอยตัว 32 บิต (IEEE 754) ซึ่งเก็บเลขชี้กำลังโดยบวก 127 ช่องเลขชี้กำลัง 8 บิตมีค่าเท่าใดในฐานสิบ"
    answer: { value: 130 }
    hints:
      - "เขียน 10 เป็นฐานสองแล้วจัดให้อยู่ในรูป $1.\\text{xxx}_2 \\times 2^e$"
      - "$10 = 1010_2 = 1.010_2 \\times 2^3$ แล้วบวก 127 กับเลขชี้กำลัง"
    misconceptions:
      - { match: 3, feedback: "3 คือเลขชี้กำลังจริง แต่ช่องเลขชี้กำลังเก็บ $e + 127$" }
      - { match: 137, feedback: "ดูเหมือนใช้ 10 เป็นเลขชี้กำลัง ต้องเขียน 10 ในรูป $1.\\text{xxx} \\times 2^e$ ก่อน ซึ่ง $e = 3$" }
    solution: "$10 = 1010_2 = 1.01_2 \\times 2^3$ เลขชี้กำลัง $e = 3$ ช่องเลขชี้กำลังเก็บ $3 + 127 = 130 = 1000\\,0010_2$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.number-representation.p020
    topics: [computer.data.number-representation]
    difficulty: 5
    type: mcq
    stem: "จำนวนจุดลอยตัว 32 บิตมี บิตเครื่องหมาย = 1, ช่องเลขชี้กำลัง = $1000\\,0000_2$ (128) และส่วนเศษขึ้นต้นด้วย 1 แล้วตามด้วย 0 ทั้งหมด จำนวนนี้คือเท่าใด"
    choices:
      - { id: a, text: "−3", correct: true }
      - { id: b, text: "3", feedback: "บิตเครื่องหมายเป็น 1 แปลว่าเป็นจำนวนลบ" }
      - { id: c, text: "−1.5", feedback: "$-1.1_2 = -1.5$ ยังต้องคูณ $2^{128 - 127} = 2$" }
      - { id: d, text: "−6", feedback: "เลขชี้กำลังจริงคือ $128 - 127 = 1$ ไม่ใช่ 2 จึงคูณ 2 ไม่ใช่ 4" }
    hints:
      - "เลขชี้กำลังจริง = ค่าในช่อง − 127"
      - "ส่วนเศษ 1000… แปลว่า $1.1_2 = 1.5$"
    solution: "เครื่องหมายลบ เลขชี้กำลัง $128 - 127 = 1$ ส่วนเศษ $1.1_2 = 1.5$ จึงได้ $-1.5 \\times 2^1 = -3$"
    license: CC-BY-SA-4.0
    ai_assisted: true
