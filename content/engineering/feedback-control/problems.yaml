  difficulty: 5
  type: numeric
  stem: 'ระบบวงปิดหนึ่งหน่วยมี $G(s)=\dfrac{2}{s^2+s}$ ใช้ตัวควบคุม $C(s)=K_p+K_d s$ โดย $K_p=3$ และ $K_d=1$ (ค่าสมมติ) จงหาอัตราส่วนการหน่วง $\zeta$ ของวงปิด (ตอบทศนิยม 4 ตำแหน่ง)'
  answer:
    value: 0.6124
