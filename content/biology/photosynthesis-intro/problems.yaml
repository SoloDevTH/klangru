  - id: biology.plants.photosynthesis-intro.p012
    topics: [biology.plants.photosynthesis-intro]
    difficulty: 5
    type: numeric
    stem: "จากข้อมูลต้นหลิวที่หนักขึ้น 74 กิโลกรัม ขณะที่ดินหายไป 0.06 กิโลกรัม ถ้าดินที่หายไปกลายเป็นเนื้อของต้นหลิวทั้งหมด ดินจะคิดเป็นร้อยละเท่าไรของมวลที่ต้นหลิวเพิ่มขึ้น (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.08, tolerance: 0.005, unit: "%" }
    hints:
      - "ร้อยละ = ส่วน ÷ ทั้งหมด × 100"
      - "ส่วนคือดินที่หายไป ทั้งหมดคือมวลที่ต้นหลิวเพิ่มขึ้น"
    misconceptions:
      - { match: 1233.33, feedback: "หารกลับด้าน ต้องเอามวลดินหารด้วยมวลที่ต้นไม้เพิ่มขึ้น" }
      - { match: 0.06, feedback: "นี่คือมวลดินเป็นกิโลกรัม ยังไม่ได้เปลี่ยนเป็นร้อยละ" }
    solution: "ร้อยละ $= \\frac{0.06}{74} \\times 100 \\approx 0.08\\%$ ดินจึงให้มวลไม่ถึงหนึ่งในพันของที่เพิ่มขึ้น ที่เหลือเกือบทั้งหมดมาจากแก๊สคาร์บอนไดออกไซด์และน้ำ"
