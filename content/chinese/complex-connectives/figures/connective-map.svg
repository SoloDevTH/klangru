<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Loma','Noto Sans Thai',sans-serif">
<title>แผนภาพคู่คำเชื่อมแบ่งตามความหมาย</title>
<rect x="0" y="0" width="1000" height="640" fill="#fff"/>
<text x="500" y="44" font-size="28" fill="#111" text-anchor="middle" font-weight="bold">คู่คำเชื่อมแบ่งตามความหมาย</text>
<rect x="30" y="70" width="300" height="200" rx="14" fill="#fff" stroke="#1f4e9c" stroke-width="3"/>
<rect x="30" y="70" width="300" height="46" rx="14" fill="#1f4e9c" stroke="#1f4e9c" stroke-width="3"/>
<text x="180.0" y="102" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">เพิ่มเติม</text>
<text x="180.0" y="160" font-size="24" fill="#1f4e9c" text-anchor="middle" font-weight="bold">不仅…而且 / 还</text>
<text x="180.0" y="198" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">ไม่เพียง…แต่ยัง…</text>
<text x="180.0" y="236" font-size="17" fill="#444" text-anchor="middle" font-weight="normal">ความหมายเหมือน 不但</text>
<rect x="360" y="70" width="300" height="200" rx="14" fill="#fff" stroke="#8a5a00" stroke-width="3"/>
<rect x="360" y="70" width="300" height="46" rx="14" fill="#8a5a00" stroke="#8a5a00" stroke-width="3"/>
<text x="510.0" y="102" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">ยอมรับ</text>
<text x="510.0" y="160" font-size="24" fill="#8a5a00" text-anchor="middle" font-weight="bold">即使…也</text>
<text x="510.0" y="198" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">แม้…ก็… (สมมติ)</text>
<text x="510.0" y="236" font-size="17" fill="#444" text-anchor="middle" font-weight="normal">เรื่องจริงใช้ 虽然…还是</text>
<rect x="690" y="70" width="300" height="200" rx="14" fill="#fff" stroke="#2a6a2a" stroke-width="3"/>
<rect x="690" y="70" width="300" height="46" rx="14" fill="#2a6a2a" stroke="#2a6a2a" stroke-width="3"/>
<text x="840.0" y="102" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">เงื่อนไข</text>
<text x="840.0" y="160" font-size="24" fill="#2a6a2a" text-anchor="middle" font-weight="bold">只要…就</text>
<text x="840.0" y="198" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">ขอแค่…ก็… (พอ)</text>
<text x="840.0" y="236" font-size="17" fill="#444" text-anchor="middle" font-weight="normal">只有…才 ต้อง…จึงจะ (จำเป็น)</text>
<rect x="30" y="290" width="300" height="200" rx="14" fill="#fff" stroke="#b3261e" stroke-width="3"/>
<rect x="30" y="290" width="300" height="46" rx="14" fill="#b3261e" stroke="#b3261e" stroke-width="3"/>
<text x="180.0" y="322" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">ไม่มีเงื่อนไข</text>
<text x="180.0" y="380" font-size="24" fill="#b3261e" text-anchor="middle" font-weight="bold">无论 / 不管…都</text>
<text x="180.0" y="418" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">ไม่ว่า…ก็… (ผลไม่เปลี่ยน)</text>
<text x="180.0" y="456" font-size="17" fill="#444" text-anchor="middle" font-weight="normal">ตามด้วยคำถามหรือทางเลือก</text>
<rect x="360" y="290" width="300" height="200" rx="14" fill="#fff" stroke="#5b3e96" stroke-width="3"/>
<rect x="360" y="290" width="300" height="46" rx="14" fill="#5b3e96" stroke="#5b3e96" stroke-width="3"/>
<text x="510.0" y="322" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">เหตุที่รู้แล้ว</text>
<text x="510.0" y="380" font-size="24" fill="#5b3e96" text-anchor="middle" font-weight="bold">既然…就</text>
<text x="510.0" y="418" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">ในเมื่อ…ก็… (ข้อสรุป)</text>
<text x="510.0" y="456" font-size="17" fill="#444" text-anchor="middle" font-weight="normal">ใช้กับเรื่องที่รู้กันแล้ว</text>
<rect x="690" y="290" width="300" height="200" rx="14" fill="#fff" stroke="#0f6b6b" stroke-width="3"/>
<rect x="690" y="290" width="300" height="46" rx="14" fill="#0f6b6b" stroke="#0f6b6b" stroke-width="3"/>
<text x="840.0" y="322" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">ลำดับและความยิ่ง</text>
<text x="840.0" y="380" font-size="24" fill="#0f6b6b" text-anchor="middle" font-weight="bold">一…就</text>
<text x="840.0" y="418" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">พอ…ก็… (ทันทีหลังเหตุแรก)</text>
<text x="840.0" y="456" font-size="17" fill="#444" text-anchor="middle" font-weight="normal">越…越 ยิ่ง…ยิ่ง</text>
<rect x="30" y="516" width="940" height="70" rx="14" fill="#f6f6f6" stroke="#888" stroke-width="2"/>
<text x="500" y="546" font-size="21" fill="#111" text-anchor="middle" font-weight="bold">แม้แต่: 连…都 / 也 (เน้นสิ่งที่คาดไม่ถึง)</text>
<text x="500" y="574" font-size="19" fill="#333" text-anchor="middle" font-weight="normal">นอกจาก: 除了…以外，…都 (ยกเว้น) หรือ …还 (เพิ่ม)</text>
</svg>
