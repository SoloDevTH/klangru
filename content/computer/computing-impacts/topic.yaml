id: computer.society.computing-impacts
subject: computer
title: { th: คอมพิวเตอร์เปลี่ยนชีวิตและสังคมอย่างไร, en: "How computing changes lives and society" }
summary: เปรียบเทียบชีวิตก่อนและหลังมีเทคโนโลยี ประวัติคอมพิวเตอร์โดยย่อ เทคโนโลยีกับวัฒนธรรม ข้อแลกเปลี่ยนต่อชีวิตและอาชีพ และประเมินผลกระทบห้าด้าน
difficulty: 2.5
minutes: 30
prerequisites: [computer.data.internet-search]
encompasses:
  - { id: computer.data.internet-search, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: timeline.svg
    alt: "เส้นเวลาประวัติศาสตร์คอมพิวเตอร์ จากซ้ายไปขวา ค.ศ. 1837 แบบเบจออกแบบเครื่องวิเคราะห์ ค.ศ. 1843 เลิฟเลซเขียนโปรแกรมแรก แล้วมีรอยตัดย่อระยะ ต่อด้วยช่วง ค.ศ. 1930 ถึง 2030 ที่วาดตามสัดส่วนเวลา ค.ศ. 1936 ทัวริงเสนอเครื่องจักรทัวริง ค.ศ. 1945 ENIAC ใช้หลอดสุญญากาศ ค.ศ. 1947 ประดิษฐ์ทรานซิสเตอร์ ค.ศ. 1963 หรือ พ.ศ. 2506 ไทยเริ่มมีคอมพิวเตอร์ ค.ศ. 1971 ไมโครโพรเซสเซอร์ Intel 4004 ค.ศ. 1981 คอมพิวเตอร์ส่วนบุคคล IBM PC ค.ศ. 1991 เวิลด์ไวด์เว็บเปิดให้ใช้ ค.ศ. 2007 สมาร์ตโฟนจอสัมผัส ค.ศ. 2022 แชตบอต AI ใช้กันทั่วไป"
    caption: "จากเครื่องขนาดเท่าห้องสู่คอมพิวเตอร์ในกระเป๋า"
  - type: worked-example
    title: เปรียบเทียบการจ่ายค่าไฟก่อนและหลังมีแอปธนาคาร
    problem: "สมัยก่อนคุณยายจ่ายค่าไฟโดยนั่งรถไปที่การไฟฟ้า 40 นาที (ไปและกลับ) ต่อแถวอีก 25 นาที ตอนนี้แม่จ่ายผ่านแอปธนาคารใช้เวลา 3 นาที ให้เปรียบเทียบสองวิธีนี้ให้รอบด้าน"
    steps:
      - text: "ทำอย่างไร: แบบเดิมต้องเดินทางไปจ่ายเงินสดที่สำนักงาน แบบใหม่สแกนบาร์โค้ดบนใบแจ้งหนี้แล้วยืนยันในแอป"
        why: "เทียบงานเดียวกัน คือการจ่ายค่าไฟ จึงจะเห็นความเปลี่ยนแปลงจริง"
      - text: "เวลา: แบบเดิม 40 + 25 = 65 นาที แบบใหม่ 3 นาที ประหยัดได้ 65 − 3 = 62 นาทีต่อครั้ง และไม่เสียค่ารถ"
      - text: "ใครทำ: งานรับเงินที่เคาน์เตอร์ลดลง ระบบธนาคารรับงานนั้นไปแทน"
      - text: "ทักษะและการเข้าถึง: ต้องมีสมาร์ตโฟน อินเทอร์เน็ต บัญชีธนาคาร และรู้วิธีใช้แอป คุณยายที่ไม่มีสิ่งเหล่านี้ยังต้องใช้วิธีเดิม"
        why: "ผลดีไม่ได้เกิดกับทุกคนเท่ากัน ต้องถามเสมอว่าใครยังเข้าไม่ถึง"
      - text: "ข้อควรระวัง: ต้องระวังข้อความหลอกให้กดลิงก์ชำระเงินปลอม ซึ่งไม่มีในวิธีเดิม"
    answer: "แบบใหม่เร็วกว่า 62 นาทีต่อครั้งและไม่ต้องเดินทาง แต่ต้องมีอุปกรณ์ ทักษะ และความระวังเรื่องมิจฉาชีพ จึงควรมีช่องทางเดิมไว้ให้คนที่ยังใช้แอปไม่ได้"
  - { type: check, problem: computer.society.computing-impacts.p004, prompt: "ลองคำนวณเวลาที่ประหยัดได้ด้วยตัวเอง" }
  - type: figure
    src: impact-map.svg
    alt: "ผังประเมินผลกระทบของแอปสั่งอาหาร ตรงกลางเขียนว่า แอปสั่งอาหาร ใครได้ ใครเสีย ล้อมด้วย 5 กล่อง ส่วนบุคคล ผลดี สะดวก ไม่ต้องออกจากบ้าน ผลเสีย ใช้เงินเกินตัวง่ายขึ้น เศรษฐกิจ ผลดี ร้านเล็กขายได้ไกลขึ้น ผลเสีย ร้านเสียค่าคอมมิชชัน สังคม ผลดี เกิดงานไรเดอร์จำนวนมาก ผลเสีย ไรเดอร์ไม่มีสวัสดิการประจำ วัฒนธรรม ผลดี ลองอาหารต่างถิ่นได้ง่าย ผลเสีย คนกินข้าวด้วยกันน้อยลง จริยธรรม ผลดี ให้คะแนนร้านอย่างเปิดเผย ผลเสีย แอปเก็บตำแหน่งและข้อมูลการกิน"
    caption: "ประเมินให้ครบห้าด้าน และเขียนทั้งผลดีและผลเสีย"
  - type: worked-example
    title: ชั่งข้อแลกเปลี่ยนของเครื่องคิดเงินอัตโนมัติ
    problem: "ซูเปอร์มาร์เก็ตแห่งหนึ่งในจังหวัดขอนแก่นจะเปลี่ยนเคาน์เตอร์คิดเงิน 6 ช่องจาก 8 ช่องเป็นเครื่องคิดเงินอัตโนมัติ ให้ประเมินข้อแลกเปลี่ยนและเสนอวิธีลดผลเสีย"
    steps:
      - text: "ระบุผู้เกี่ยวข้อง: ลูกค้าทั่วไป ลูกค้าสูงอายุ พนักงานแคชเชียร์ และเจ้าของร้าน"
        why: "ข้อแลกเปลี่ยนต่างกันไปตามกลุ่มคน ถ้าไม่แยกกลุ่มจะมองไม่เห็นคนที่เสียประโยชน์"
      - text: "ผลดี: ลูกค้าที่ซื้อของน้อยชิ้นจ่ายเงินได้เร็ว ร้านลดต้นทุนค่าจ้างและเปิดได้หลายช่องพร้อมกัน"
      - text: "ผลเสีย: แคชเชียร์บางคนอาจถูกลดชั่วโมงงาน ลูกค้าสูงอายุหรือคนที่ไม่ถนัดหน้าจออาจใช้ไม่เป็น และร้านต้องรับความเสี่ยงที่สินค้าไม่ถูกสแกน"
      - text: "ด้านอาชีพ: งานแบบใหม่เกิดขึ้น เช่น พนักงานช่วยเหลือที่เครื่องอัตโนมัติ และช่างดูแลระบบ ร้านอาจฝึกแคชเชียร์เดิมให้ทำงานเหล่านี้"
      - text: "เสนอวิธีลดผลเสีย: เก็บเคาน์เตอร์ที่มีพนักงานไว้อย่างน้อย 2 ช่อง ทำหน้าจอให้ตัวอักษรใหญ่และมีเสียงอ่าน และมีพนักงานคอยช่วย"
    answer: "ได้ความเร็วและลดต้นทุน แต่เสียงานบางส่วนและอาจกีดกันคนบางกลุ่ม ลดผลเสียได้ด้วยการเก็บช่องที่มีพนักงาน ออกแบบให้ทุกคนใช้ได้ และฝึกพนักงานเดิมให้ทำงานใหม่"
  - { type: check, problem: computer.society.computing-impacts.p005, prompt: "ข้อความใดเป็นข้อแลกเปลี่ยนจริง" }
glossary:
  - { term: เทคโนโลยีสารสนเทศ (IT), definition: "การใช้คอมพิวเตอร์ อุปกรณ์ และเครือข่ายเพื่อเก็บ ประมวลผล และสื่อสารข้อมูล" }
  - { term: ข้อแลกเปลี่ยน (tradeoff), definition: "การได้ประโยชน์อย่างหนึ่งโดยต้องเสียอีกอย่างหนึ่ง เช่น ได้ความสะดวกแต่เสียความเป็นส่วนตัว" }
  - { term: ช่องว่างทางดิจิทัล (digital divide), definition: "ความไม่เท่าเทียมในการเข้าถึงอุปกรณ์ อินเทอร์เน็ต และทักษะดิจิทัลระหว่างคนกลุ่มต่าง ๆ หรือระหว่างประเทศ" }
  - { term: ทรานซิสเตอร์ (transistor), definition: "สวิตช์อิเล็กทรอนิกส์ขนาดเล็กที่แทนหลอดสุญญากาศ ทำให้คอมพิวเตอร์เล็กลง ถูกลง และใช้ไฟน้อยลง" }
  - { term: กฎของมัวร์ (Moore's law), definition: "ข้อสังเกตว่าจำนวนทรานซิสเตอร์บนชิปเพิ่มขึ้นราวเท่าตัวทุก 2 ปี เป็นแนวโน้ม ไม่ใช่กฎธรรมชาติ" }
flashcards:
  - { front: "เปรียบเทียบก่อนและหลังมีเทคโนโลยี ต้องถามอะไรบ้าง", back: "ทำอย่างไร ใช้เวลาและเงินเท่าไร ใครทำ และต้องมีทักษะหรืออุปกรณ์อะไร (เทียบงานเดียวกัน)" }
  - { front: "ผลกระทบห้าด้านของเทคโนโลยี", back: "ส่วนบุคคล จริยธรรม สังคม เศรษฐกิจ วัฒนธรรม (เขียนทั้งผลดีและผลเสีย)" }
  - { front: "ประเทศไทยเริ่มมีคอมพิวเตอร์ใช้เมื่อใด", back: "พ.ศ. 2506 (IBM 1620 ที่จุฬาลงกรณ์มหาวิทยาลัย และ IBM 1401 ที่สำนักงานสถิติแห่งชาติ)" }
  - { front: "ตัวอย่างวัฒนธรรมที่เปลี่ยนเทคโนโลยี", back: "แป้นพิมพ์และฟอนต์ภาษาไทย ปฏิทิน พ.ศ. ในโทรศัพท์ การจ่ายเงินด้วย QR ที่เหมาะกับร้านเล็ก" }
