problems:
  - id: phy.vel.p001
    topics: [physics.kinematics.velocity]
    difficulty: 1
    type: text
    stem: "ปริมาณที่มีทั้ง **ขนาด** และ **ทิศทาง** เรียกว่าปริมาณอะไร"
    accepted: ["ปริมาณเวกเตอร์", "เวกเตอร์", "vector", "vector quantity"]
    hints:
      - "ปริมาณในฟิสิกส์แบ่งเป็นสองแบบ แบบหนึ่งมีแต่ขนาด อีกแบบมีทิศทางด้วย"
      - "การกระจัดและความเร็วเป็นปริมาณแบบนี้ ส่วนระยะทางและอัตราเร็วไม่ใช่"
    misconceptions:
      - { match: "ปริมาณสเกลาร์", feedback: "ปริมาณสเกลาร์มีแต่ขนาด ไม่มีทิศทาง เช่น ระยะทาง เวลา ปริมาณที่มีทิศทางด้วยคืออีกแบบหนึ่ง" }
      - { match: "สเกลาร์", feedback: "ปริมาณสเกลาร์มีแต่ขนาด ไม่มีทิศทาง เช่น ระยะทาง เวลา ปริมาณที่มีทิศทางด้วยคืออีกแบบหนึ่ง" }
    solution: "ปริมาณที่มีทั้งขนาดและทิศทางคือ **ปริมาณเวกเตอร์** เช่น การกระจัด ความเร็ว ความเร่ง และแรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vel.p002
    topics: [physics.kinematics.velocity]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "ข้อใดเป็น **ปริมาณเวกเตอร์** (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "การกระจัด", correct: true, feedback: "ถูก การกระจัดบอกทั้งขนาดและทิศทางของการเปลี่ยนตำแหน่ง" }
      - { id: b, text: "ความเร็ว", correct: true, feedback: "ถูก ความเร็วบอกทั้งความเร็วมากน้อยและทิศที่เคลื่อนที่" }
      - { id: c, text: "ระยะทาง", feedback: "ระยะทางบอกแค่ความยาวของเส้นทาง ไม่บอกทิศ จึงเป็นสเกลาร์" }
      - { id: d, text: "อัตราเร็ว", feedback: "อัตราเร็วบอกแค่ว่าเร็วเท่าไร ไม่บอกว่าไปทางไหน จึงเป็นสเกลาร์" }
      - { id: e, text: "เวลา", feedback: "เวลามีแต่ขนาด เช่น 5 วินาที ไม่มีทิศทาง จึงเป็นสเกลาร์" }
    hints:
      - "ถามตัวเองว่า ปริมาณนี้ต้องบอกด้วยไหมว่า 'ไปทางไหน'"
      - "ระยะทางคู่กับอัตราเร็ว ส่วนการกระจัดคู่กับความเร็ว คู่หนึ่งเป็นสเกลาร์ อีกคู่เป็นเวกเตอร์"
    solution: "การกระจัดและความเร็วเป็นปริมาณเวกเตอร์ เพราะต้องบอกทิศทาง ส่วนระยะทาง อัตราเร็ว และเวลาเป็นปริมาณสเกลาร์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vel.p003
    topics: [physics.kinematics.velocity]
    difficulty: 2
    type: numeric
    stem: "ลูกบอลกลิ้งบนเส้นตรงจากตำแหน่ง $x_1 = 3\\ \\mathrm{m}$ ไปหยุดที่ตำแหน่ง $x_2 = -5\\ \\mathrm{m}$ การกระจัดของลูกบอลเป็นเท่าใด (ตอบเป็นตัวเลขพร้อมเครื่องหมาย ในหน่วย m)"
    answer: { value: -8, unit: m }
    hints:
      - "การกระจัด $\\Delta x = x_2 - x_1$ คือสุดท้ายลบเริ่มต้น"
      - "แทนค่า $(-5) - (3)$ ระวังเครื่องหมาย"
    misconceptions:
      - { match: 8, feedback: "ขนาดถูกแล้ว แต่ลูกบอลเคลื่อนไปทางลบ (จาก 3 ไปทาง −5) การกระจัดจึงต้องมีเครื่องหมายลบ หรืออาจเป็นเพราะลบกลับด้านเป็น $x_1 - x_2$" }
      - { match: -2, feedback: "ดูเหมือนนำ $3 + (-5)$ มาบวกกัน การกระจัดต้องเป็นตำแหน่งสุดท้าย **ลบ** ตำแหน่งเริ่มต้น" }
    solution: "$\\Delta x = x_2 - x_1 = (-5\\ \\mathrm{m}) - (3\\ \\mathrm{m}) = -8\\ \\mathrm{m}$ คือเคลื่อนที่ไปทางลบ 8 เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vel.p004
    topics: [physics.kinematics.velocity]
    difficulty: 2
    type: numeric
    stem: "เด็กคนหนึ่งเดินไปทางทิศตะวันออก $500\\ \\mathrm{m}$ แล้วเดินกลับทางทิศตะวันตก $200\\ \\mathrm{m}$ ให้ทิศตะวันออกเป็นบวก การกระจัดของเด็กเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m)"
    answer: { value: 300, unit: m }
    hints:
      - "การกระจัดสนใจแค่จุดเริ่มต้นกับจุดสุดท้าย ไม่สนเส้นทางระหว่างทาง"
      - "เดินไปทางตะวันออกคือ $+500$ เดินกลับทางตะวันตกคือ $-200$ หาตำแหน่งสุดท้ายจากผลรวม"
    misconceptions:
      - { match: 700, feedback: "นั่นคือระยะทาง (500 + 200) ซึ่งนับทุกเมตรที่เดิน แต่การกระจัดดูแค่ว่าตอนจบอยู่ห่างจากจุดเริ่มเท่าใดและไปทางไหน" }
      - { match: -300, feedback: "ขนาดถูก แต่ทิศผิด เด็กยังอยู่ทางตะวันออกของจุดเริ่ม ซึ่งเราตั้งให้เป็นบวก" }
    solution: "ตำแหน่งสุดท้าย $x_2 = 0 + 500 - 200 = 300\\ \\mathrm{m}$ ดังนั้น $\\Delta x = 300\\ \\mathrm{m} - 0 = +300\\ \\mathrm{m}$ คือ 300 เมตรไปทางทิศตะวันออก (ส่วนระยะทางคือ 700 เมตร)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vel.p005
    topics: [physics.kinematics.velocity]
    difficulty: 3
    type: mcq
    stem: "รถคันหนึ่งวิ่งรอบวงเวียนครบ 1 รอบพอดีแล้วกลับมาที่จุดเริ่ม ข้อใดถูกต้องเกี่ยวกับการเคลื่อนที่ครบรอบนี้"
    choices:
      - { id: a, text: "อัตราเร็วเฉลี่ยไม่เป็นศูนย์ แต่ความเร็วเฉลี่ยเป็นศูนย์", correct: true }
      - { id: b, text: "ทั้งอัตราเร็วเฉลี่ยและความเร็วเฉลี่ยเป็นศูนย์", feedback: "รถวิ่งไปเป็นระยะทางจริงตลอดรอบ ระยะทางรวมไม่เป็นศูนย์ อัตราเร็วเฉลี่ยจึงไม่เป็นศูนย์" }
      - { id: c, text: "อัตราเร็วเฉลี่ยเท่ากับความเร็วเฉลี่ย", feedback: "สองค่านี้เท่ากันเฉพาะเมื่อวิ่งเป็นเส้นตรงทางเดียว แต่รถกลับมาที่เดิม การกระจัดเป็นศูนย์ ขณะที่ระยะทางไม่เป็นศูนย์" }
      - { id: d, text: "ความเร็วเฉลี่ยไม่เป็นศูนย์ แต่อัตราเร็วเฉลี่ยเป็นศูนย์", feedback: "กลับด้าน ลองคิดว่าระยะทางรวมเป็นศูนย์ได้ไหม เมื่อรถวิ่งไปจริงทั้งรอบ" }
    hints:
      - "อัตราเร็วเฉลี่ยใช้ระยะทางรวม ความเร็วเฉลี่ยใช้การกระจัด"
      - "ถ้ากลับมาที่จุดเริ่ม การกระจัดเป็นเท่าใด"
    solution: "ระยะทางรวมคือเส้นรอบวงเวียน ซึ่งไม่เป็นศูนย์ อัตราเร็วเฉลี่ย = ระยะทาง ÷ เวลา จึงไม่เป็นศูนย์ แต่รถกลับมาที่เดิม การกระจัดเป็น $0$ ความเร็วเฉลี่ย $= \\dfrac{0\\ \\mathrm{m}}{\\Delta t} = 0\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vel.p006
    topics: [physics.kinematics.velocity]
    difficulty: 3
    type: numeric
    stem: "เด็กคนหนึ่งเดินไปทางทิศตะวันออก $500\\ \\mathrm{m}$ แล้วเดินกลับทางทิศตะวันตก $200\\ \\mathrm{m}$ ใช้เวลารวม $150\\ \\mathrm{s}$ ให้ทิศตะวันออกเป็นบวก ความเร็วเฉลี่ยเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 2, unit: m/s }
    hints:
      - "ความเร็วเฉลี่ยใช้การกระจัด ไม่ใช่ระยะทาง"
      - "การกระจัดคือ $500 - 200$ เมตรไปทางตะวันออก"
      - "นำการกระจัดหารด้วยเวลารวม $150\\ \\mathrm{s}$"
    misconceptions:
      - { match: 4.667, feedback: "นั่นคืออัตราเร็วเฉลี่ย (ระยะทาง 700 m ÷ 150 s) ความเร็วเฉลี่ยต้องใช้การกระจัด 300 m" }
      - { match: -2, feedback: "ขนาดถูก แต่การกระจัดไปทางตะวันออกซึ่งเป็นบวก ความเร็วเฉลี่ยจึงเป็นบวก" }
    solution: "$\\Delta x = +500 - 200 = +300\\ \\mathrm{m}$ ดังนั้น $\\bar{v} = \\dfrac{\\Delta x}{\\Delta t} = \\dfrac{+300\\ \\mathrm{m}}{150\\ \\mathrm{s}} = +2\\ \\mathrm{m/s}$ คือ $2\\ \\mathrm{m/s}$ ไปทางทิศตะวันออก ส่วนอัตราเร็วเฉลี่ยคือ $\\dfrac{700\\ \\mathrm{m}}{150\\ \\mathrm{s}} \\approx 4.67\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vel.p007
    topics: [physics.kinematics.velocity]
    difficulty: 4
    type: numeric
    stem: "ให้ทิศขวาเป็นบวก รถของเล่นเริ่มที่ตำแหน่ง $x_1 = +40\\ \\mathrm{m}$ แล้ววิ่งไปทางซ้ายจนถึงตำแหน่ง $x_2 = -20\\ \\mathrm{m}$ ในเวลา $12\\ \\mathrm{s}$ ความเร็วเฉลี่ยเป็นเท่าใด (ตอบเป็นตัวเลขพร้อมเครื่องหมาย ในหน่วย m/s)"
    answer: { value: -5, unit: m/s }
    hints:
      - "หาการกระจัดก่อนด้วย $\\Delta x = x_2 - x_1$"
      - "$(-20) - (+40)$ ลบจำนวนบวกออกจากจำนวนลบ ผลยิ่งติดลบมากขึ้น"
      - "นำการกระจัดที่ได้หารด้วยเวลา 12 s โดยเก็บเครื่องหมายไว้"
    misconceptions:
      - { match: 5, feedback: "ขนาดถูก แต่รถวิ่งไปทางซ้ายซึ่งเป็นทิศลบ ความเร็วต้องมีเครื่องหมายลบ" }
      - { match: -1.667, feedback: "ดูเหมือนคิดการกระจัดเป็น $-20$ m (เอา 40 กับ 20 มาลบกันเฉย ๆ) ต้องคิด $(-20) - (+40) = -60\\ \\mathrm{m}$ เพราะรถต้องผ่าน 40 m ทางขวาของศูนย์ไปอีก 20 m ทางซ้าย" }
    solution: "$\\Delta x = (-20\\ \\mathrm{m}) - (+40\\ \\mathrm{m}) = -60\\ \\mathrm{m}$ ดังนั้น $\\bar{v} = \\dfrac{-60\\ \\mathrm{m}}{12\\ \\mathrm{s}} = -5\\ \\mathrm{m/s}$ คือ $5\\ \\mathrm{m/s}$ ไปทางซ้าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vel.p008
    topics: [physics.kinematics.velocity]
    difficulty: 5
    type: numeric
    stem: "นักวิ่งวิ่งไปทางทิศตะวันออก $100\\ \\mathrm{m}$ ในเวลา $20\\ \\mathrm{s}$ แล้ววิ่งกลับทางทิศตะวันตก $60\\ \\mathrm{m}$ ในเวลา $15\\ \\mathrm{s}$ ให้ทิศตะวันออกเป็นบวก ความเร็วเฉลี่ยตลอดการวิ่งเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.143, tolerance: 0.01, unit: m/s }
    hints:
      - "ความเร็วเฉลี่ยตลอดการวิ่ง = การกระจัดรวม ÷ เวลารวม"
      - "การกระจัดรวมคือ $+100 + (-60)$ เมตร และเวลารวมคือ $20 + 15$ วินาที"
      - "อย่าหาความเร็วแต่ละช่วงแล้วเฉลี่ย เพราะสองช่วงใช้เวลาไม่เท่ากัน"
    misconceptions:
      - { match: 4.571, feedback: "นั่นคืออัตราเร็วเฉลี่ย (ระยะทาง 160 m ÷ 35 s) ความเร็วเฉลี่ยต้องใช้การกระจัดรวม ซึ่งหักส่วนที่วิ่งย้อนกลับออก" }
      - { match: 0.5, feedback: "ดูเหมือนหาความเร็วแต่ละช่วง ($+5$ และ $-4\\ \\mathrm{m/s}$) แล้วเฉลี่ยกัน ใช้ไม่ได้เพราะสองช่วงใช้เวลาไม่เท่ากัน ต้องใช้การกระจัดรวม ÷ เวลารวม" }
    solution: "การกระจัดรวม $\\Delta x = +100 - 60 = +40\\ \\mathrm{m}$ เวลารวม $\\Delta t = 20 + 15 = 35\\ \\mathrm{s}$ ดังนั้น $\\bar{v} = \\dfrac{+40\\ \\mathrm{m}}{35\\ \\mathrm{s}} \\approx +1.14\\ \\mathrm{m/s}$ ไปทางทิศตะวันออก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vel.p009
    topics: [physics.kinematics.velocity]
    difficulty: 2
    type: numeric
    stem: "ให้ทิศเหนือเป็นบวก รถตุ๊กตุ๊กวิ่งบนถนนตรงไปทางทิศเหนือ $1.2\\ \\mathrm{km}$ แล้วกลับรถวิ่งไปทางทิศใต้ $3\\ \\mathrm{km}$ การกระจัดของรถตุ๊กตุ๊กเป็นเท่าใด (ตอบเป็นตัวเลขพร้อมเครื่องหมาย ในหน่วย km)"
    answer: { value: -1.8, tolerance: 0.01, unit: km }
    hints:
      - "ไปทางเหนือเป็น $+1.2$ ไปทางใต้เป็น $-3$"
      - "การกระจัดคือผลรวมของการเคลื่อนที่แต่ละช่วงโดยคิดเครื่องหมาย"
    misconceptions:
      - { match: 4.2, feedback: "นั่นคือระยะทาง ($1.2 + 3$) ซึ่งนับทุกกิโลเมตรที่วิ่ง แต่การกระจัดดูแค่ว่าตอนจบอยู่ห่างจากจุดเริ่มเท่าใดและไปทางไหน" }
      - { match: 1.8, feedback: "ขนาดถูก แต่รถวิ่งไปทางใต้ไกลกว่าทางเหนือ ตอนจบจึงอยู่ทางใต้ของจุดเริ่ม ซึ่งเป็นทิศลบ" }
    solution: "$\\Delta x = (+1.2\\ \\mathrm{km}) + (-3\\ \\mathrm{km}) = -1.8\\ \\mathrm{km}$ คือรถอยู่ห่างจากจุดเริ่ม $1.8\\ \\mathrm{km}$ ไปทางทิศใต้ (ส่วนระยะทางคือ $4.2\\ \\mathrm{km}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vel.p010
    topics: [physics.kinematics.velocity]
    difficulty: 3
    type: numeric
    stem: "นักกีฬาวิ่งรอบลู่วิ่งยาวรอบละ $400\\ \\mathrm{m}$ ที่สนามกีฬาแห่งชาติ ครบ 2 รอบพอดี โดยเริ่มและจบที่เส้นเดียวกัน ใช้เวลา $160\\ \\mathrm{s}$ ความเร็วเฉลี่ยตลอดการวิ่งเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 0, unit: m/s }
    hints:
      - "ความเร็วเฉลี่ยใช้การกระจัด ไม่ใช่ระยะทาง"
      - "เริ่มและจบที่จุดเดียวกัน การกระจัดเป็นเท่าใด"
    misconceptions:
      - { match: 5, feedback: "นั่นคืออัตราเร็วเฉลี่ย (ระยะทาง 800 m ÷ 160 s) ความเร็วเฉลี่ยต้องใช้การกระจัด ซึ่งเป็นศูนย์เพราะกลับมาที่จุดเดิม" }
      - { match: 2.5, feedback: "ดูเหมือนใช้ระยะทางรอบเดียว (400 m) หารด้วยเวลา ทั้งที่ความเร็วเฉลี่ยต้องใช้การกระจัด ซึ่งเป็นศูนย์เพราะจบที่จุดเริ่ม" }
    solution: "จุดเริ่มกับจุดจบเป็นที่เดียวกัน การกระจัด $\\Delta x = 0$ ดังนั้น $\\bar{v} = \\dfrac{0\\ \\mathrm{m}}{160\\ \\mathrm{s}} = 0\\ \\mathrm{m/s}$ แม้นักกีฬาจะวิ่งด้วยอัตราเร็วเฉลี่ย $\\dfrac{800\\ \\mathrm{m}}{160\\ \\mathrm{s}} = 5\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.vel.p011
    topics: [physics.kinematics.velocity]
    difficulty: 4
    type: numeric
