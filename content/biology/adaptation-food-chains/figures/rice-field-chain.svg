<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" font-family="sans-serif" font-size="14">
<title>โซ่อาหารในนาข้าว</title>
<rect x="0" y="0" width="1000" height="260" fill="#ffffff"/>
<text x="500.0" y="32.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">โซ่อาหารในนาข้าว (ลูกศรชี้จากสิ่งที่ถูกกินไปหาผู้กิน)</text>
<rect x="31.0" y="70" width="150" height="90" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="106.0" y="98.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">ข้าว</text>
<text x="106.0" y="120.0" text-anchor="middle" font-size="13" fill="#444">ผู้ผลิต</text>
<text x="106.0" y="138.0" text-anchor="middle" font-size="13" fill="#444">สร้างอาหารเองได้</text>
<line x1="185.0" y1="115.0" x2="224.0" y2="115.0" stroke="#333" stroke-width="3"/>
<polygon points="224.0,115.0 213.9,119.3 213.9,110.7" fill="#333"/>
<rect x="228.0" y="70" width="150" height="90" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="303.0" y="98.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">ตั๊กแตน</text>
<text x="303.0" y="120.0" text-anchor="middle" font-size="13" fill="#444">ผู้บริโภคพืช</text>
<text x="303.0" y="138.0" text-anchor="middle" font-size="13" fill="#444">เหยื่อของกบ</text>
<line x1="382.0" y1="115.0" x2="421.0" y2="115.0" stroke="#333" stroke-width="3"/>
<polygon points="421.0,115.0 410.9,119.3 410.9,110.7" fill="#333"/>
<rect x="425.0" y="70" width="150" height="90" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="500.0" y="98.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">กบ</text>
<text x="500.0" y="120.0" text-anchor="middle" font-size="13" fill="#444">ผู้บริโภคสัตว์</text>
<text x="500.0" y="138.0" text-anchor="middle" font-size="13" fill="#444">ผู้ล่าตั๊กแตน</text>
<line x1="579.0" y1="115.0" x2="618.0" y2="115.0" stroke="#333" stroke-width="3"/>
<polygon points="618.0,115.0 607.9,119.3 607.9,110.7" fill="#333"/>
<rect x="622.0" y="70" width="150" height="90" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="697.0" y="98.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">งู</text>
<text x="697.0" y="120.0" text-anchor="middle" font-size="13" fill="#444">ผู้บริโภคสัตว์</text>
<text x="697.0" y="138.0" text-anchor="middle" font-size="13" fill="#444">ผู้ล่ากบ</text>
<line x1="776.0" y1="115.0" x2="815.0" y2="115.0" stroke="#333" stroke-width="3"/>
<polygon points="815.0,115.0 804.9,119.3 804.9,110.7" fill="#333"/>
<rect x="819.0" y="70" width="150" height="90" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="894.0" y="98.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">เหยี่ยว</text>
<text x="894.0" y="120.0" text-anchor="middle" font-size="13" fill="#444">ผู้บริโภคสัตว์</text>
<text x="894.0" y="138.0" text-anchor="middle" font-size="13" fill="#444">ผู้ล่าลำดับสุดท้าย</text>
<rect x="31.0" y="190" width="938" height="50" rx="10" fill="#efebe9" stroke="#6d4c41" stroke-width="2"/>
<text x="500.0" y="212.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#4e342e">ผู้ย่อยสลาย (เห็ด รา แบคทีเรีย) ย่อยซากและมูลของทุกตัวในโซ่อาหาร</text>
<text x="500.0" y="231.0" text-anchor="middle" font-size="13" fill="#4e342e">ได้แร่ธาตุคืนสู่ดิน ให้ข้าวนำไปใช้อีก</text>
</svg>