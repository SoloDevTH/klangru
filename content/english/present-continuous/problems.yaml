problems:
  - id: english.grammar.present-continuous.p001
    topics: [english.grammar.present-continuous]
    difficulty: 1
    type: text
    stem: "เติมกริยาในรูป present continuous: *I ___ (read) a book now.* (พิมพ์สองคำ)"
    accepted: ["am reading"]
    misconceptions:
      - { match: "reading", feedback: "ต้องมี am หน้า reading: I am reading." }
      - { match: "am read", feedback: "หลัง am ต้องเติม ing ที่กริยา: am reading" }
      - { match: "read", feedback: "now บอกว่ากำลังทำ ใช้ am + reading" }
      - { match: "is reading", feedback: "ประธาน I ใช้ am" }
    hints:
      - "now บอกว่ากำลังทำอยู่ตอนนี้"
      - "โครงสร้างคือ am/is/are + กริยาเติม ing"
    solution: "*I **am reading** a book now.* (ย่อเป็น I'm reading.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.present-continuous.p002
    topics: [english.grammar.present-continuous]
    difficulty: 1
    type: mcq
    stem: "เลือกคำที่ถูกต้อง: *Look! She ___ TV.*"
    choices:
      - { id: a, text: "is watching", correct: true, feedback: "ถูก she ใช้ is + watching" }
      - { id: b, text: "are watching", feedback: "she ใช้ is ไม่ใช่ are" }
      - { id: c, text: "watching", feedback: "ขาด be: ต้องเป็น is watching" }
      - { id: d, text: "is watch", feedback: "หลัง is ต้องใช้กริยาเติม ing" }
    hints:
      - "Look! บอกว่ากำลังเกิดขึ้นตอนนี้"
      - "she + is + V-ing"
    solution: "*Look! She **is watching** TV.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.present-continuous.p003
    topics: [english.grammar.present-continuous]
    difficulty: 1
    type: match
    stem: "จับคู่กริยากับรูปเติม -ing"
    pairs:
      - { left: "swim", right: "swimming" }
      - { left: "make", right: "making" }
      - { left: "play", right: "playing" }
      - { left: "sit", right: "sitting" }
      - { left: "lie", right: "lying" }
    hints:
      - "ลงท้าย e ตัด e ก่อน ส่วน ie เปลี่ยนเป็น y"
      - "พยางค์เดียวแบบ พยัญชนะ-สระ-พยัญชนะ ซ้ำตัวสุดท้าย"
    solution: "swim → swimming (ซ้ำ m) · make → making (ตัด e) · play → playing (+ing) · sit → sitting (ซ้ำ t) · lie → lying (ie → y)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.present-continuous.p004
    topics: [english.grammar.present-continuous]
    difficulty: 2
    type: text
    stem: "เติมกริยาในรูป present continuous: *They ___ (play) football at the moment.* (พิมพ์สองคำ)"
    accepted: ["are playing"]
    misconceptions:
      - { match: "is playing", feedback: "they ใช้ are" }
      - { match: "playing", feedback: "ต้องมี are หน้า playing" }
      - { match: "are plaing", feedback: "play ลงท้ายด้วย y เติม ing ได้เลย ไม่ตัด y: playing" }
      - { match: "play", feedback: "at the moment บอกว่ากำลังทำ ใช้ are playing" }
    hints:
      - "at the moment = ตอนนี้"
      - "they ใช้ be ตัวไหน"
    solution: "*They **are playing** football at the moment.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.present-continuous.p005
    topics: [english.grammar.present-continuous]
    difficulty: 2
    type: text
    stem: "เขียนกริยา *run* ในรูปเติม -ing"
    accepted: ["running"]
    misconceptions:
      - { match: "runing", feedback: "run เป็นพยางค์เดียวแบบ พยัญชนะ-สระ-พยัญชนะ ต้องซ้ำ n: running" }
      - { match: "runnning", feedback: "ซ้ำ n เพียงตัวเดียว: running" }
    hints:
      - "run ลงท้ายด้วย พยัญชนะ-สระ-พยัญชนะ (r-u-n)"
      - "ซ้ำพยัญชนะตัวสุดท้ายก่อนเติม ing"
    solution: "run → **running** (ซ้ำ n แล้วเติม ing)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.present-continuous.p006
    topics: [english.grammar.present-continuous]
    difficulty: 2
    type: mcq
    stem: "ข้อใดแปลว่า \"แม่กำลังทำกับข้าว\" ได้ถูกต้อง"
    choices:
      - { id: a, text: "My mother is cooking.", correct: true, feedback: "ถูก กำลัง... = is + V-ing" }
      - { id: b, text: "My mother cooking.", feedback: "ขาด is ภาษาไทยไม่มีคำที่ตรงกับ is แต่ภาษาอังกฤษต้องมี" }
      - { id: c, text: "My mother is cook.", feedback: "หลัง is ต้องเติม ing ที่กริยา (ถ้าเป็น is a cook จะแปลว่าแม่เป็นพ่อครัว)" }
      - { id: d, text: "My mother cooks every day.", feedback: "ประโยคนี้บอกกิจวัตร ไม่ได้บอกว่ากำลังทำตอนนี้" }
    hints:
      - "คำว่า กำลัง บอกว่าเกิดขึ้นตอนนี้"
      - "ต้องมีทั้ง be และ V-ing"
    solution: "**My mother is cooking.** (my mother = she → is + cooking)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.present-continuous.p007
    topics: [english.grammar.present-continuous]
    difficulty: 2
    type: text
    stem: "เติมคำให้เป็นประโยคปฏิเสธ: *He ___ (not / sleep). He is reading.* (พิมพ์คำในช่องว่าง)"
    accepted: ["isn't sleeping", "is not sleeping", "'s not sleeping"]
    misconceptions:
      - { match: "doesn't sleeping", feedback: "present continuous ปฏิเสธด้วย not หลัง is ไม่ใช้ doesn't" }
      - { match: "doesn't sleep", feedback: "doesn't sleep แปลว่าไม่นอน (เป็นนิสัย) ประโยคนี้บอกว่าตอนนี้ไม่ได้กำลังนอน ใช้ isn't sleeping" }
      - { match: "not sleeping", feedback: "ต้องมี is ก่อน not: isn't sleeping" }
      - { match: "isn't sleep", feedback: "หลัง isn't ต้องใช้ sleeping" }
    hints:
      - "ปฏิเสธของ present continuous ใส่ not หลัง be"
      - "he + isn't + V-ing"
    solution: "*He **isn't sleeping** (is not sleeping). He is reading.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.present-continuous.p008
    topics: [english.grammar.present-continuous]
    difficulty: 3
    type: text
    stem: "เติมคำขึ้นต้นคำถาม: *___ you listening to me?*"
    accepted: ["Are", "are"]
    misconceptions:
      - { match: "do", feedback: "present continuous สร้างคำถามด้วย be (Are) ไม่ใช้ do" }
      - { match: "is", feedback: "you ใช้ are" }
    hints:
      - "บอกเล่าคือ You are listening to me."
      - "ย้าย be ขึ้นหน้าประธาน"
    solution: "***Are** you listening to me?* — Yes, I am. / No, I'm not."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.present-continuous.p009
    topics: [english.grammar.present-continuous]
    difficulty: 3
    type: mcq
    stem: "เส้นเวลาใดตรงกับประโยค *Look! It is raining.*"
    figure: { src: timelines-quiz.svg, alt: "เส้นเวลา 3 เส้น จากอดีตทางซ้ายไปอนาคตทางขวา มีขีดแดงบอกตอนนี้: A มีกากบาทเว้นระยะเท่ากันตลอดเส้นทั้งก่อนและหลังตอนนี้ B มีเส้นหยักช่วงสั้นที่ครอบขีดตอนนี้ เริ่มก่อนตอนนี้เล็กน้อยและยังไม่จบ C มีกากบาทจุดเดียวในอดีต" }
    choices:
      - { id: a, text: "A", feedback: "A คือทำซ้ำเป็นประจำ ใช้ present simple เช่น It rains every afternoon in July." }
      - { id: b, text: "B", correct: true, feedback: "ถูก ฝนกำลังตกอยู่ตอนนี้ เริ่มไม่นานและยังไม่หยุด" }
      - { id: c, text: "C", feedback: "C คือเหตุการณ์ครั้งเดียวในอดีต ใช้ past simple เช่น It rained yesterday." }
    hints:
      - "Look! บอกว่ากำลังเกิดขึ้นตรงหน้า"
      - "หาเส้นเวลาที่มีเหตุการณ์ครอบตอนนี้และยังไม่จบ"
    solution: "*It is raining.* คือฝนกำลังตกตอนนี้ ตรงกับเส้นเวลา **B** ที่ครอบขีดตอนนี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.present-continuous.p010
    topics: [english.grammar.present-continuous]
    difficulty: 3
    type: order
    stem: "เรียงคำให้เป็นคำถาม \"เธอกำลังทำอะไรอยู่\""
    items: ["What", "are", "you", "doing?"]
    hints:
      - "คำแสดงคำถามวางหน้าสุด"
      - "What + are + you + V-ing?"
    solution: "*What are you doing?* — I'm doing my homework."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.present-continuous.p011
    topics: [english.grammar.present-continuous]
    difficulty: 3
    type: mcq
    stem: "เลือกคำที่ถูกต้อง: *Every Sunday, my family ___ to the temple.*"
    choices:
      - { id: a, text: "goes", correct: true, feedback: "ถูก every Sunday บอกกิจวัตร ใช้ present simple" }
      - { id: b, text: "is going", feedback: "every Sunday ทำเป็นประจำ ไม่ใช่กำลังทำตอนนี้ ใช้ present simple" }
      - { id: c, text: "are going", feedback: "every Sunday บอกกิจวัตร และ my family ใช้กับกริยาเอกพจน์" }
      - { id: d, text: "going", feedback: "ขาด be และ every Sunday ต้องใช้ present simple" }
    hints:
      - "every Sunday บอกว่าทำบ่อยแค่ไหน"
      - "กิจวัตรใช้ present simple"
    solution: "every Sunday บอกกิจวัตร: *Every Sunday, my family **goes** to the temple.*"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.present-continuous.p012
    topics: [english.grammar.present-continuous]
    difficulty: 4
    type: text
    stem: "เติมกริยาในรูปที่ถูกต้อง: *Listen! The baby ___ (cry).* (พิมพ์คำในช่องว่าง)"
    accepted: ["is crying", "'s crying"]
    misconceptions:
      - { match: "cries", feedback: "Listen! บอกว่ากำลังเกิดขึ้นตอนนี้ ใช้ is crying" }
      - { match: "is criing", feedback: "cry ลงท้ายด้วย y เติม ing ได้เลย ไม่เปลี่ยน y: crying" }
      - { match: "is cring", feedback: "ไม่ตัด y ออก: cry + ing = crying" }
      - { match: "crying", feedback: "ต้องมี is หน้า crying" }
    hints:
      - "Listen! บอกว่าได้ยินอยู่ตอนนี้"
      - "the baby = it ใช้ is และ cry + ing ไม่เปลี่ยน y"
    solution: "*Listen! The baby **is crying**.* (y ท้ายคำไม่ต้องเปลี่ยนเมื่อเติม ing)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.present-continuous.p013
    topics: [english.grammar.present-continuous]
    difficulty: 4
    type: mcq
    stem: "เลือกคำที่ถูกต้อง: *I ___ this song. It's beautiful.*"
    choices:
      - { id: a, text: "like", correct: true, feedback: "ถูก like เป็นกริยาความรู้สึก ปกติไม่ใช้รูป -ing" }
      - { id: b, text: "am liking", feedback: "like บอกความรู้สึก ใช้ present simple แม้จะพูดถึงตอนนี้" }
      - { id: c, text: "liking", feedback: "ขาด be และ like ไม่ใช้รูป -ing ในความหมายนี้" }
      - { id: d, text: "am like", feedback: "ไม่ใช้ am หน้ากริยารูปเดิม" }
    hints:
      - "like เป็นการกระทำ หรือความรู้สึก"
      - "กริยาความรู้สึก เช่น like, love, want, know ปกติไม่เติม ing"
    solution: "*I **like** this song.* like เป็นกริยาบอกความรู้สึก (stative verb) จึงใช้ present simple"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.present-continuous.p014
    topics: [english.grammar.present-continuous]
    difficulty: 4
    type: mcq
    stem: "อ่านข้อความ LINE แล้วตอบคำถาม\n\n*Hi Dad! I'm at Grandma's house in Ayutthaya. Grandma is cooking tom yum. Uncle Lek is fixing his motorbike, and my cousins are swimming in the river. I'm not swimming because I have a cold, so I'm helping Grandma in the kitchen.*\n\nข้อความนี้มีใจความสำคัญว่าอะไร"
    choices:
      - { id: a, text: "แต่ละคนที่บ้านยายกำลังทำอะไรอยู่", correct: true, feedback: "ถูก ทุกประโยคบอกว่าใครกำลังทำอะไรที่บ้านยาย" }
      - { id: b, text: "วิธีทำต้มยำ", feedback: "ยายกำลังทำต้มยำเป็นรายละเอียดหนึ่ง ข้อความไม่ได้บอกวิธีทำ" }
      - { id: c, text: "ทำไมผู้เขียนเป็นหวัด", feedback: "ข้อความบอกแค่ว่าเป็นหวัด ไม่ได้อธิบายสาเหตุ" }
      - { id: d, text: "รถมอเตอร์ไซค์ของลุงเล็ก", feedback: "เป็นรายละเอียดของประโยคเดียว ไม่ใช่ใจความของทั้งข้อความ" }
    hints:
      - "ดูว่าทุกประโยคพูดถึงอะไรร่วมกัน"
      - "ใจความสำคัญครอบคลุมทั้งข้อความ ไม่ใช่รายละเอียดเดียว"
    solution: "ทุกประโยคใช้ present continuous เล่าว่าแต่ละคนที่บ้านยายในอยุธยา **กำลังทำอะไรอยู่** (ยายทำต้มยำ ลุงซ่อมรถ ญาติว่ายน้ำ ผู้เขียนช่วยยาย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.present-continuous.p015
    topics: [english.grammar.present-continuous]
    difficulty: 4
    type: mcq
    stem: "จากข้อความ LINE ข้อก่อน (*... I'm not swimming because I have a cold, so I'm helping Grandma in the kitchen.*) ผู้เขียน **กำลังทำอะไร**"
    choices:
      - { id: a, text: "ช่วยยายในครัว", correct: true, feedback: "ถูก I'm helping Grandma in the kitchen." }
      - { id: b, text: "ว่ายน้ำในแม่น้ำ", feedback: "ผู้เขียนบอกว่า I'm not swimming คือไม่ได้ว่ายน้ำ" }
      - { id: c, text: "ซ่อมรถมอเตอร์ไซค์", feedback: "ลุงเล็กเป็นคนซ่อมรถ ไม่ใช่ผู้เขียน" }
      - { id: d, text: "นอนพักเพราะเป็นหวัด", feedback: "ข้อความบอกว่าเป็นหวัด แต่ไม่ได้บอกว่ากำลังนอน" }
    hints:
      - "หาประโยคที่มีประธาน I และกริยา -ing ที่ไม่มี not"
      - "so บอกผลของการเป็นหวัด"
    solution: "*I'm not swimming ... so **I'm helping Grandma in the kitchen**.* ผู้เขียนไม่ได้ว่ายน้ำ แต่ **ช่วยยายในครัว**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.present-continuous.p016
    topics: [english.grammar.present-continuous]
    difficulty: 5
    type: text
    stem: "เติมกริยาสองช่องให้ถูก: *Nid usually ___ (walk) to school, but today she ___ (ride) her bike.* (พิมพ์คำในช่องว่างทั้งสองช่องตามลำดับ คั่นด้วยเครื่องหมายจุลภาค)"
    accepted: ["walks, is riding", "walks is riding", "walks; is riding"]
    misconceptions:
      - { match: "is walking, is riding", feedback: "usually บอกกิจวัตร ช่องแรกใช้ present simple: walks" }
      - { match: "walks, rides", feedback: "today บอกเรื่องที่ต่างจากปกติในวันนี้ ช่องที่สองใช้ is riding" }
      - { match: "walks, is rideing", feedback: "ride ลงท้ายด้วย e ตัด e ก่อนเติม ing: riding" }
      - { match: "walks, is ridding", feedback: "ride ลงท้ายด้วย e ตัด e แล้วเติม ing ไม่ต้องซ้ำ d: riding" }
      - { match: "walk, is riding", feedback: "Nid = she ใน present simple ต้องเติม s: walks" }
    hints:
      - "usually บอกกิจวัตร ส่วน today บอกสิ่งที่ต่างไปในวันนี้"
      - "ride ลงท้ายด้วย e ตัด e ก่อนเติม ing"
    solution: "*Nid usually **walks** to school, but today she **is riding** her bike.* ช่องแรกเป็นกิจวัตร (present simple) ช่องที่สองเป็นสิ่งที่ทำวันนี้ (present continuous)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: english.grammar.present-continuous.p017
    topics: [english.grammar.present-continuous]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "เลือกประโยคที่ **ถูกต้อง** ทั้งหมด"
    choices:
      - { id: a, text: "We are having lunch now.", correct: true }
      - { id: b, text: "She is writing a letter.", correct: true }
      - { id: c, text: "Are they waiting for the bus?", correct: true }
      - { id: d, text: "I am knowing the answer.", feedback: "know เป็นกริยาความรู้สึกนึกคิด ใช้ I know the answer." }
      - { id: e, text: "He is swiming.", feedback: "swim ต้องซ้ำ m: swimming" }
      - { id: f, text: "They is playing.", feedback: "they ใช้ are: They are playing." }
    hints:
      - "ตรวจ be ให้ตรงกับประธาน และการสะกด -ing"
      - "have ที่แปลว่า กิน ใช้รูป -ing ได้ แต่ know ไม่ใช้"
    solution: "ถูก: We are having lunch now. (have = กิน) · She is writing a letter. · Are they waiting for the bus? ผิด: I am knowing → I know · swiming → swimming · They is → They are"
    license: CC-BY-SA-4.0
    ai_assisted: true
