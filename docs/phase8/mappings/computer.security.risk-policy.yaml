topic: computer.security.risk-policy
rows:
  - { framework: acm-cs2023, indicators: ["SEC-Governance"], coverage: partial, note: "สอนการประเมินความเสี่ยง ทางจัดการ นโยบาย และการเข้าถึงตามบทบาท แต่ยังไม่สอนโครงสร้างการกำกับดูแลขององค์กรและการตรวจสอบเชิงระบบ" }
  - { framework: acm-cs2023, indicators: ["SEP-Security"], coverage: partial, note: "สอนกฎหมายพื้นฐาน (พ.ร.บ.ความมั่นคงไซเบอร์ PDPA ISO 27001 ภาพรวม) และวิศวกรรมสังคม แต่อาชญากรรมคอมพิวเตอร์ (ฉ้อโกง มัลแวร์ โจมตีโครงสร้างพื้นฐาน) สอนเพียงกล่าวถึง" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-CYB-CP-11"], coverage: full, note: "สินทรัพย์ ภัย ช่องโหว่ และความเสี่ยง และเหตุผลที่นโยบายช่วยปกป้องสินทรัพย์และลดความเสี่ยง" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-CYB-CP-12"], coverage: full, note: "องค์ประกอบของนโยบาย (ขอบเขต บทบาท การใช้ที่ยอมรับได้ รหัสผ่าน การสำรองข้อมูล)" }
  - { framework: csta-k12-cs-2026, indicators: ["S2-CYB-CP-09"], coverage: partial, note: "สอนกฎหมายและมาตรฐานที่ต้องตรวจก่อนเผยแพร่ แต่การอภิปรายผลต่อนโยบายขององค์กรเป็นกิจกรรมกลุ่มที่แอปไม่ได้จัด" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-CYB-TS-08"], coverage: full, note: "ประเมินภัยด้วย CIA สถานะของข้อมูล (at rest in transit in use) และชนิดของมาตรการ (เทคนิค บริหาร กายภาพ ป้องกัน ตรวจจับ แก้ไข) โจทย์ p001 p002 p003 p006" }
  - { framework: csta-k12-cs-2026, indicators: ["S2-CYB-TS-06"], coverage: partial, note: "สอนหลักสิทธิ์น้อยที่สุดและการควบคุมตามบทบาท พร้อมตัวอย่างออกแบบสิทธิ์และโจทย์ p007 p013 p016 แต่การออกแบบระบบสิทธิ์ทั้งระบบเป็นงานลงมือทำซึ่งอยู่นอกแอป" }
  - { framework: csta-k12-cs-2026, indicators: ["S2-CYB-TS-07"], coverage: full, note: "ประเมินความเสี่ยงด้วยโอกาสคูณผลกระทบ เลือกทางจัดการสี่แบบ และการคำนวณความเสียหายรายปี โจทย์ p004 p005 p008 p009 p018" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-CYB-PP-13"], coverage: partial, note: "วิเคราะห์ผลของการตัดสินใจต่อโรงเรียน ผู้ปกครอง และนักเรียนผ่านกรณีตัวอย่างและจริยธรรมการเปิดเผยช่องโหว่ (p019) แต่ยังไม่ครอบคลุมผลต่อสังคมในระดับกว้างอย่างลึก" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-CYB-PP-14"], coverage: partial, note: "สอนวิศวกรรมสังคมด้วยความเร่งรีบและการอ้างอำนาจ (p010) และการป้องกันด้วยการยืนยันช่องทางที่สอง แต่อคติเห็นตามกลุ่มและอคติอื่นสอนเพียงสั้น ๆ" }
  - { framework: csta-k12-cs-2026, indicators: ["S1-CYB-PP-15"], coverage: partial, note: "สอนการอธิบายความเสี่ยงโดยใช้ภาษาของผลกระทบแก่ผู้ไม่ใช่สายเทคนิค แต่ยังไม่มีแบบฝึกเขียนรายงานให้ผู้บริหาร" }
