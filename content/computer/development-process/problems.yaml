problems:
  - id: computer.programming.development-process.p001
    topics: [computer.programming.development-process]
    difficulty: 1
    type: mcq
    stem: "ข้อใดอธิบาย **การพัฒนาแบบวนรอบ** ได้ถูกต้อง"
    choices:
      - { id: a, text: "ทำชิ้นงานที่ใช้ได้บางส่วนในรอบสั้น ๆ ให้ผู้ใช้ลอง แล้วนำความเห็นไปปรับในรอบถัดไป", correct: true }
      - { id: b, text: "เขียนโปรแกรมให้เสร็จทั้งหมดก่อน แล้วจึงให้ผู้ใช้ลองครั้งเดียวตอนท้าย", feedback: "นี่คือการรอจนจบแล้วค่อยฟังผู้ใช้ ซึ่งเป็นปัญหาของแอปสั่งข้าวในบทเรียน" }
      - { id: c, text: "เขียนโปรแกรมเดิมซ้ำหลายรอบโดยไม่เปลี่ยนอะไร", feedback: "แต่ละรอบต้องปรับปรุงจากความเห็นที่ได้ ไม่ใช่ทำซ้ำเหมือนเดิม" }
      - { id: d, text: "ใช้วงวน for ในโปรแกรมให้มากที่สุด", feedback: "วนรอบในที่นี้หมายถึงรอบของการพัฒนา ไม่ใช่วงวนในโค้ด" }
    hints:
      - "คำว่า วนรอบ หมายถึงการทำทุกขั้นซ้ำเป็นรอบ ๆ"
      - "ผู้ใช้ได้ลองงานบ่อยแค่ไหนในวิธีนี้"
    solution: "การพัฒนาแบบวนรอบทำทุกขั้น (ความต้องการ ออกแบบ พัฒนา ทดสอบ) แบบย่อในรอบสั้น ได้ชิ้นงานที่ลองใช้ได้ แล้วนำความเห็นของผู้ใช้ไปปรับในรอบถัดไป จึงแก้ทิศทางได้เร็ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.development-process.p002
    topics: [computer.programming.development-process]
    difficulty: 1
    type: match
    stem: "จับคู่ขั้นในวงจรชีวิตของซอฟต์แวร์กับงานในโครงการแอปสั่งข้าวกลางวัน"
    pairs:
      - { left: "เก็บความต้องการ", right: "สัมภาษณ์แม่ค้าว่าอยากเห็นข้อมูลอะไรตอนเช้า" }
      - { left: "ออกแบบ", right: "วาดหน้าจอสั่งอาหารและแบ่งโปรแกรมเป็นฟังก์ชัน" }
      - { left: "พัฒนา", right: "เขียนฟังก์ชัน total_price" }
      - { left: "ทดสอบ", right: "รันกรณีทดสอบเทียบกับข้อกำหนด" }
      - { left: "นำไปใช้และดูแล", right: "แก้บั๊กที่ผู้ใช้แจ้งหลังเปิดใช้จริง" }
    hints:
      - "ความต้องการมาจากการถามผู้ใช้ก่อนเริ่มทำ"
      - "งานใดเกิดหลังโปรแกรมถูกใช้จริงแล้ว"
    solution: "สัมภาษณ์คือเก็บความต้องการ วาดหน้าจอคือออกแบบ เขียนฟังก์ชันคือพัฒนา รันกรณีทดสอบคือทดสอบ และแก้บั๊กหลังเปิดใช้คือการดูแล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.development-process.p003
    topics: [computer.programming.development-process]
    difficulty: 2
    type: order
    stem: "เรียงงานในหนึ่งรอบของการพัฒนาแบบวนรอบ"
    items:
      - "ฟังความต้องการของผู้ใช้หลายกลุ่ม"
      - "สร้างต้นแบบที่ทำงานหลักได้"
      - "ให้ผู้ใช้ลองทำงานจริงแล้วสังเกต"
      - "รวบรวมและจัดลำดับความเห็น"
      - "ปรับปรุงแล้วบันทึกเหตุผลของการเปลี่ยน"
    hints:
      - "ต้องมีต้นแบบก่อน ผู้ใช้จึงลองได้"
      - "ความเห็นต้องจัดลำดับก่อนจึงรู้ว่าจะแก้อะไรก่อน"
    solution: "ฟังความต้องการ → สร้างต้นแบบ → ให้ผู้ใช้ลอง → จัดลำดับความเห็น → ปรับปรุงและบันทึกเหตุผล จากนั้นเริ่มรอบใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.development-process.p004
    topics: [computer.programming.development-process]
    difficulty: 2
    type: text
    stem: "รุ่นทดลองที่ทำอย่างรวดเร็วและต้นทุนต่ำ เช่น ภาพหน้าจอบนกระดาษ เพื่อทดสอบความคิดกับผู้ใช้ก่อนลงแรงเขียนโปรแกรมจริง เรียกว่าอะไร"
    accepted: ["ต้นแบบ", "prototype", "โปรโตไทป์", "ต้นแบบ (prototype)"]
    misconceptions:
      - { match: "เวอร์ชันสมบูรณ์", feedback: "รุ่นนี้ตั้งใจทำแค่บางส่วนเพื่อทดลอง ยังไม่สมบูรณ์" }
    hints:
      - "ภาษาอังกฤษขึ้นต้นด้วย proto"
      - "ดูหัวข้อสร้างต้นแบบแล้วฟังผู้ใช้"
    solution: "ต้นแบบ (prototype) ทำเร็วและถูก จึงทิ้งหรือแก้ได้ง่ายเมื่อผู้ใช้ชี้ปัญหา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.development-process.p005
    topics: [computer.programming.development-process]
    difficulty: 2
    type: mcq
    stem: "ปลื้มพบเกมจับคู่คำศัพท์ที่รุ่นพี่เขียนไว้และเผยแพร่แบบโอเพนซอร์ส อยากนำมาเพิ่มด่านคำศัพท์วิทยาศาสตร์ ข้อใดควรทำ"
    choices:
      - { id: a, text: "อ่านสัญญาอนุญาตว่ายอมให้ดัดแปลง แล้วต่อยอดโดยให้เครดิตรุ่นพี่ในเกมและในเอกสาร", correct: true }
      - { id: b, text: "คัดลอกมาทั้งหมดแล้วใส่ชื่อตัวเองเป็นผู้สร้าง เพราะโค้ดเปิดเผยอยู่แล้ว", feedback: "โอเพนซอร์สไม่ได้แปลว่าไม่มีเจ้าของ ต้องทำตามสัญญาอนุญาตและให้เครดิต" }
      - { id: c, text: "ห้ามนำโค้ดคนอื่นมาใช้เด็ดขาด ต้องเขียนใหม่ทั้งหมด", feedback: "การต่อยอดโปรแกรมที่มีอยู่เป็นเรื่องปกติและดี ถ้าทำตามสัญญาอนุญาต" }
      - { id: d, text: "ใช้ได้เลยโดยไม่ต้องบอกใคร ถ้าแก้โค้ดเกินครึ่ง", feedback: "แก้มากแค่ไหนก็ยังต้องให้เครดิตส่วนที่นำมา" }
    hints:
      - "โค้ดที่เปิดเผยยังมีเจ้าของและมีเงื่อนไขการใช้"
      - "ทบทวนส่วนต่อยอดโปรแกรมที่มีอยู่"
    solution: "การดัดแปลงหรือรวมโปรแกรมของผู้อื่นทำได้เมื่อสัญญาอนุญาตยอม และต้องให้เครดิตเจ้าของเสมอ เช่น เขียนในหน้าเครดิตว่าต่อยอดจากเกมของใคร พร้อมลิงก์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.development-process.p006
    topics: [computer.programming.development-process]
    difficulty: 2
    type: numeric
    stem: "ทดสอบต้นแบบแอปสั่งข้าวกับนักเรียน 40 คน มี 26 คนบอกว่าตัวอักษรเล็กเกินไป คิดเป็นกี่เปอร์เซ็นต์ของผู้ทดสอบ"
    answer: { value: 65, unit: "%" }
    hints:
      - "เปอร์เซ็นต์ = จำนวนที่สนใจ ÷ จำนวนทั้งหมด × 100"
      - "26 ÷ 40 แล้วคูณ 100"
    misconceptions:
      - { match: 35, feedback: "นี่คือเปอร์เซ็นต์ของคนที่ไม่ได้บอกว่าตัวอักษรเล็ก" }
      - { match: 26, feedback: "26 คือจำนวนคน ต้องเทียบกับผู้ทดสอบทั้งหมด 40 คน" }
    solution: "26 ÷ 40 × 100 = 65% เกินครึ่งของผู้ทดสอบ เรื่องนี้จึงควรแก้ในรอบถัดไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.development-process.p007
    topics: [computer.programming.development-process]
    difficulty: 3
    type: mcq
    stem: "ทีมรวบรวมความเห็นสี่เรื่องแล้ววางในตารางชั่งผลต่อผู้ใช้กับแรงที่ต้องใช้ (ดูภาพ) ตามหลักในบทเรียน ควรทำเรื่องใด **ก่อน**"
    figure:
      src: priority-problem.svg
      alt: "ตารางสองแกน แกนนอนคือแรงที่ต้องใช้ จากน้อยทางซ้ายไปมากทางขวา แกนตั้งคือผลต่อผู้ใช้ จากน้อยด้านล่างไปมากด้านบน มีจุด 4 จุด P แสดงยอดรวมรายเมนูให้แม่ค้า อยู่ซ้ายบน (ผลมาก แรงน้อย) Q แจ้งเตือนผ่านแอปแชท อยู่ขวาบน (ผลมาก แรงมาก) R เพิ่มอีโมจิในเมนู อยู่ซ้ายล่าง (ผลน้อย แรงน้อย) S เปลี่ยนเป็นแอปเฉพาะระบบ อยู่ขวาล่าง (ผลน้อย แรงมาก)"
    choices:
      - { id: a, text: "P แสดงยอดรวมรายเมนูให้แม่ค้า", correct: true }
      - { id: b, text: "Q แจ้งเตือนผ่านแอปแชท", feedback: "Q มีผลมากแต่ใช้แรงมาก ควรวางแผนทำในรอบถัดไป หลังเรื่องที่ได้ผลเท่ากันแต่ใช้แรงน้อยกว่า" }
      - { id: c, text: "R เพิ่มอีโมจิในเมนู", feedback: "R ทำง่ายแต่ผลต่อผู้ใช้น้อย ทำได้เมื่อมีเวลาเหลือ" }
      - { id: d, text: "S เปลี่ยนเป็นแอปเฉพาะระบบ", feedback: "S ใช้แรงมากแต่ผลน้อย ควรพักไว้ก่อน" }
    hints:
      - "หาเรื่องที่ได้ประโยชน์ต่อผู้ใช้มากที่สุดเมื่อเทียบกับแรงที่ใช้"
      - "มุมใดของตารางคือผลมากแต่แรงน้อย"
    solution: "P อยู่มุมผลมากแรงน้อย จึงทำก่อน Q ผลมากแต่แรงมาก วางแผนทำต่อ R ผลน้อยแรงน้อย ทำถ้ามีเวลา S ผลน้อยแรงมาก พักไว้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.development-process.p008
    topics: [computer.programming.development-process]
    difficulty: 3
    type: numeric
    stem: |
      ข้อกำหนดค่าส่งอาหาร: ยอดสั่ง **ต่ำกว่า 100 บาท** คิดค่าส่ง 20 บาท ยอด **ตั้งแต่ 100 บาทขึ้นไป** ส่งฟรี นักเรียนเขียนฟังก์ชันและกรณีทดสอบ 5 กรณีดังนี้ ถ้ารันแต่ละกรณีแยกกัน จะ **ผ่าน** กี่กรณี

      ```python
      def delivery_fee(total):
          if total > 100:
              return 0
          return 20

      tests = [(50, 20), (99, 20), (100, 0), (150, 0), (0, 20)]
      passed = 0
      for total, expected in tests:
          if delivery_fee(total) == expected:
              passed = passed + 1
      print(passed)
      ```
    answer: { value: 4, unit: "กรณี" }
    hints:
      - "หาค่าที่ฟังก์ชันคืนสำหรับแต่ละยอด แล้วเทียบกับค่าที่คาด"
      - "ยอด 100 พอดี ผ่านเงื่อนไข total > 100 หรือไม่"
    misconceptions:
      - { match: 5, feedback: "ยอด 100 ตามข้อกำหนดต้องส่งฟรี แต่ 100 > 100 เป็นเท็จ ฟังก์ชันจึงคืน 20 กรณีนี้ไม่ผ่าน" }
    solution: "50 → 20 ผ่าน, 99 → 20 ผ่าน, 100 → 20 แต่คาด 0 ไม่ผ่าน, 150 → 0 ผ่าน, 0 → 20 ผ่าน รวม 4 กรณี กรณีที่ค่าขอบ 100 จับบั๊กได้ แก้เป็น total >= 100"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.development-process.p009
    topics: [computer.programming.development-process]
    difficulty: 3
    type: mcq
    stem: "ทีมแก้ฟังก์ชันคิดเงินเพื่อเพิ่มส่วนลดสมาชิก แล้วรันกรณีทดสอบชุดเดิมทั้งหมดอีกรอบ ทั้งที่กรณีเดิมไม่เกี่ยวกับส่วนลด เหตุผลข้อใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "เพื่อตรวจว่าการแก้ครั้งนี้ไม่ได้ทำให้ความสามารถเดิมที่เคยถูกพังโดยไม่ตั้งใจ", correct: true }
      - { id: b, text: "เพราะกรณีทดสอบต้องรันวันละครั้งตามกฎ", feedback: "จุดประสงค์คือหาผลข้างเคียงของการแก้ ไม่ใช่ทำตามรอบเวลา" }
      - { id: c, text: "เพื่อให้โปรแกรมทำงานเร็วขึ้น", feedback: "การทดสอบไม่ได้ทำให้โปรแกรมเร็วขึ้น" }
      - { id: d, text: "ไม่จำเป็น ถ้ากรณีทดสอบใหม่ของส่วนลดผ่านก็พอ", feedback: "การแก้อาจกระทบส่วนอื่น เช่น ทำให้คนที่ไม่ใช่สมาชิกได้ส่วนลดไปด้วย" }
    hints:
      - "การแก้โค้ดส่วนหนึ่งกระทบส่วนอื่นได้หรือไม่"
      - "การทดสอบนี้มีชื่อเรียกในบทเรียน"
    solution: "การทดสอบถดถอยรันกรณีทดสอบเดิมทุกครั้งที่แก้ เพื่อจับผลที่ไม่ตั้งใจ เช่น ราคาของคนที่ไม่ใช่สมาชิกเปลี่ยนไป ถ้าไม่รัน ผู้ใช้จะเป็นคนเจอบั๊กแทน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.development-process.p010
    topics: [computer.programming.development-process]
    difficulty: 4
    type: numeric
    stem: |
      สมาชิกในทีมแก้ฟังก์ชันคิดเงินเพื่อเพิ่มส่วนลดสมาชิก แต่ตั้งค่าเริ่มต้นของพารามิเตอร์ผิด ส่วนอื่นของแอปที่ยังเรียกแบบเดิมจะได้ราคาเท่าใด (บาท)

      ```python
      def total_price(items, member=True):
          total = sum(items)
          if member:
              total = total * 0.9
          return total

      # ส่วนอื่นของแอปเรียกแบบเดิม สำหรับลูกค้าทั่วไป
      print(total_price([40, 15]))
      ```
    answer: { value: 49.5, tolerance: 0.01, unit: "บาท" }
    hints:
      - "การเรียกนี้ไม่ได้ส่ง member จึงใช้ค่าเริ่มต้นในบรรทัด def"
      - "ค่าเริ่มต้น member=True ทำให้เข้าเงื่อนไข if หรือไม่"
    misconceptions:
      - { match: 55, feedback: "นี่คือราคาที่ควรได้ แต่ค่าเริ่มต้น member=True ทำให้ลูกค้าทั่วไปได้ส่วนลดไปด้วย" }
    solution: "ไม่ได้ส่ง member จึงใช้ค่าเริ่มต้น True ยอด 55 ถูกลด 10% เหลือ 49.5 บาท ทั้งที่ลูกค้าทั่วไปควรจ่าย 55 บาท กรณีทดสอบเดิม assert total_price([40, 15]) == 55 จะจับบั๊กนี้ได้ทันที แก้เป็น member=False"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.development-process.p011
    topics: [computer.programming.development-process]
    difficulty: 4
    type: mcq
    stem: "ข้อใดเป็น **บันทึกการตัดสินใจออกแบบ** ที่มีประโยชน์ที่สุดต่อคนที่จะมาดูแลแอปในปีหน้า"
    choices:
      - { id: a, text: "ย้ายปุ่มยืนยันไปล่างจอและทำให้ใหญ่ขึ้น เพราะรอบทดสอบที่ 1 มี 4 ใน 10 คนหาปุ่มไม่เจอ รอบที่ 2 หาเจอทุกคน เคยลองปุ่มลอยมุมขวาแต่บังรายการอาหาร", correct: true }
      - { id: b, text: "แก้ปุ่มแล้ว", feedback: "ไม่บอกว่าแก้อะไร ทำไม และมีหลักฐานอะไร" }
      - { id: c, text: "ปุ่มยืนยันอยู่ล่างจอเพราะทีมชอบแบบนี้", feedback: "ความชอบของทีมไม่ใช่หลักฐานจากผู้ใช้ และไม่บอกทางเลือกที่ลองแล้ว" }
      - { id: d, text: "รูปหน้าจอใหม่หนึ่งรูปโดยไม่มีคำอธิบาย", feedback: "ภาพช่วยได้ แต่ไม่บอกเหตุผลและทางเลือกที่ไม่เลือก" }
    hints:
      - "บันทึกที่ดีบอก สิ่งที่ตัดสินใจ เหตุผลพร้อมหลักฐาน และทางเลือกอื่น"
      - "ข้อใดมีครบทั้งสามส่วน"
    solution: "ข้อ a บอกสิ่งที่ตัดสินใจ หลักฐานจากการทดสอบสองรอบ และทางเลือกที่ลองแล้วไม่ได้ผล คนรุ่นต่อไปจึงไม่ย้ายปุ่มกลับไปเป็นแบบที่เคยมีปัญหา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.development-process.p012
    topics: [computer.programming.development-process]
    difficulty: 4
    type: match
    stem: "จับคู่ภาษาโปรแกรมกับงานที่เหมาะสมที่สุดตามบทเรียน"
    pairs:
      - { left: "Python", right: "วิเคราะห์ข้อมูลคะแนนสอบด้วยไลบรารีสำเร็จรูป" }
      - { left: "JavaScript", right: "ทำปุ่มโต้ตอบบนหน้าเว็บในเบราว์เซอร์" }
      - { left: "C", right: "เขียนโปรแกรมบนไมโครคอนโทรลเลอร์ที่มีหน่วยความจำน้อย" }
      - { left: "SQL", right: "ดึงรายการสั่งอาหารของวันนี้จากฐานข้อมูล" }
      - { left: "Scratch", right: "ให้นักเรียนประถมสร้างเกมแรกด้วยบล็อก" }
    hints:
      - "ภาษาใดทำงานในเบราว์เซอร์ทุกตัว"
      - "ภาษาใดออกแบบมาเพื่อสืบค้นข้อมูลในตาราง"
    solution: "Python อ่านง่ายและมีไลบรารีวิเคราะห์ข้อมูลมาก JavaScript ทำงานในเบราว์เซอร์ C เร็วและใช้หน่วยความจำน้อย SQL ใช้สืบค้นฐานข้อมูล Scratch ใช้บล็อกเหมาะกับผู้เริ่มต้น"
