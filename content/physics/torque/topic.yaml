id: physics.rotation.torque
subject: physics
title: { th: โมเมนต์ของแรงและสมดุลการหมุน, en: Torque and rotational equilibrium }
summary: หาโมเมนต์ของแรงจากแรงและแขนของโมเมนต์ ใช้หลักของโมเมนต์แก้โจทย์ไม้กระดก คานงัด และคานที่มีน้ำหนัก
difficulty: 5
minutes: 35
prerequisites: [physics.dynamics.forces, physics.dynamics.newton-first]
encompasses:
  - { id: physics.dynamics.forces, weight: 0.4 }
  - { id: physics.dynamics.newton-first, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: beam-example.svg
    alt: "คานไม้สม่ำเสมอยาว 2 m วางบนจุดหมุนที่ห่างปลายซ้าย 0.5 m ปลายซ้ายแขวนถุงที่ไม่รู้มวล น้ำหนัก mg ชี้ลง น้ำหนักคาน 39.2 N (คานมวล 4 kg) กระทำที่กึ่งกลางคาน ห่างจุดหมุนไปทางขวา 0.5 m จุดหมุนดันคานขึ้นด้วยแรง N ระยะที่กำกับคือ 0.5 m, 0.5 m และ 1.0 m ความยาวลูกศรเป็นสัดส่วนกับขนาดแรง"
    caption: "ภาพของตัวอย่างที่ 2 ในบทเรียน ถุงและน้ำหนักคานอยู่ห่างจุดหมุนข้างละ $0.5\\ \\mathrm{m}$ เท่ากัน ถุงจึงต้องมีมวลเท่าคาน และ $N$ เท่ากับน้ำหนักรวม"
  - type: figure
    src: angled-force.svg
    alt: "ประแจหมุนรอบจุด O แรง F กระทำที่ปลายด้ามซึ่งห่าง O เป็นระยะ r โดยทำมุม theta กับแนวด้าม เส้นประต่อแนวแรงย้อนออกไป และเส้นสีน้ำเงินตั้งฉากจาก O ถึงแนวแรงคือแขนของโมเมนต์ l = r sin theta"
    caption: "แขนของโมเมนต์คือระยะตั้งฉากจากจุดหมุนถึงแนวแรง ไม่ใช่ระยะถึงจุดที่แรงกระทำ"
  - type: worked-example
    title: ดึงประแจเฉียง ๆ ได้โมเมนต์เท่าใด
    problem: "ออกแรง $40\\ \\mathrm{N}$ ที่ปลายด้ามประแจซึ่งห่างจากน็อต $0.25\\ \\mathrm{m}$ โดยแรงทำมุม $30^\\circ$ กับแนวด้าม โมเมนต์รอบน็อตเป็นเท่าใด และถ้าดึงตั้งฉากกับด้ามจะได้โมเมนต์เท่าใด"
    steps:
      - text: "หาแขนของโมเมนต์: $l = r\\sin\\theta = 0.25 \\times \\sin 30^\\circ = 0.25 \\times 0.5 = 0.125\\ \\mathrm{m}$"
        why: "แขนของโมเมนต์ต้องตั้งฉากกับแนวแรง เมื่อแรงเฉียง ระยะตั้งฉากจึงสั้นกว่าความยาวด้าม"
      - text: "โมเมนต์: $M = F l = 40 \\times 0.125 = 5\\ \\mathrm{N\\,m}$"
      - text: "ถ้าดึงตั้งฉาก ($\\theta = 90^\\circ$): $M = 40 \\times 0.25 = 10\\ \\mathrm{N\\,m}$"
        why: "$\\sin 90^\\circ = 1$ แขนของโมเมนต์ยาวเท่าด้ามพอดี"
    answer: "ดึงเฉียง $30^\\circ$ ได้ $5\\ \\mathrm{N\\,m}$ ส่วนดึงตั้งฉากได้ $10\\ \\mathrm{N\\,m}$ เป็นสองเท่า"
  - { type: check, problem: phy.torq.p016, prompt: "ลองกับมุมอื่น" }
  - type: figure
    src: lever-classes.svg
    alt: "คานสามแบบเรียงจากบนลงล่าง อันดับ 1: น้ำหนัก W อยู่ปลายซ้าย จุดหมุนอยู่กลาง แรงพยายาม F กดลงที่ปลายขวา ตัวอย่าง กรรไกร ชะแลง ไม้กระดก อันดับ 2: จุดหมุนอยู่ปลายซ้าย น้ำหนักอยู่กลาง แรงพยายามยกขึ้นที่ปลายขวา ตัวอย่าง รถเข็นดิน ที่เปิดขวด อันดับ 3: จุดหมุนอยู่ปลายซ้าย แรงพยายามยกขึ้นตรงกลาง น้ำหนักอยู่ปลายขวา ตัวอย่าง แหนบ คีมคีบน้ำแข็ง แขนคน"
    caption: "จำอันดับของคานจากสิ่งที่อยู่ตรงกลาง: จุดหมุน (1) น้ำหนัก (2) แรงพยายาม (3)"
  - type: worked-example
    title: ยกรถเข็นปูน
    problem: "รถเข็นปูนบรรจุปูนแล้วมีมวลรวม $60\\ \\mathrm{kg}$ จุดศูนย์ถ่วงอยู่ห่างเพลาล้อในแนวราบ $0.5\\ \\mathrm{m}$ มือจับห่างเพลาล้อในแนวราบ $1.4\\ \\mathrm{m}$ ต้องยกมือจับขึ้นด้วยแรงเท่าใด และรถเข็นได้เปรียบเชิงกลกี่เท่า ใช้ $g = 9.8\\ \\mathrm{m/s^2}$"
    steps:
      - text: "เลือกเพลาล้อเป็นจุดหมุน รถเข็นเป็นคานอันดับ 2 น้ำหนักอยู่ระหว่างจุดหมุนกับมือ"
        why: "เลือกจุดหมุนที่พื้นดันล้อ จะได้ไม่ต้องรู้แรงที่ล้อ"
      - text: "น้ำหนัก: $W = 60 \\times 9.8 = 588\\ \\mathrm{N}$"
      - text: "หลักของโมเมนต์: $F \\times 1.4 = 588 \\times 0.5$"
      - text: "$F = \\dfrac{294}{1.4} = 210\\ \\mathrm{N}$"
      - text: "การได้เปรียบเชิงกล $= \\dfrac{W}{F} = \\dfrac{588}{210} = 2.8$ เท่า (เท่ากับ $\\tfrac{1.4}{0.5}$)"
        why: "แขนของแรงพยายามยาวกว่าแขนของน้ำหนัก 2.8 เท่า แรงที่ต้องใช้จึงน้อยลง 2.8 เท่า"
    answer: "ต้องยกด้วยแรง $210\\ \\mathrm{N}$ และได้เปรียบเชิงกล $2.8$ เท่า"
  - { type: check, problem: phy.torq.p013 }
  - type: interactive
    title: ระยะที่ต้องนั่งเพื่อให้ไม้กระดกสมดุล
    caption: คนแรกมวล a (kg) นั่งห่างจุดหมุน b (m) แกนนอนคือมวลของคนที่สอง (kg) แกนตั้งคือระยะจากจุดหมุนที่คนที่สองต้องนั่ง (m) ตามหลักของโมเมนต์ ระยะนี้เท่ากับ ab หารด้วยมวลของคนที่สอง สังเกตว่าเมื่อมวลของคนที่สองเพิ่มเป็นสองเท่า ระยะจะลดลงครึ่งหนึ่ง และเมื่อมวลเท่ากับ a ระยะจะเท่ากับ b พอดี
    widget:
      kind: function-plot
      functions: ["\\frac{a b}{x}"]
      sliders:
        - { name: a, min: 10, max: 60, step: 5, value: 30, label: มวลของคนแรก (kg) }
        - { name: b, min: 0.5, max: 3, step: 0.25, value: 2, label: ระยะของคนแรกจากจุดหมุน (m) }
      x: [5, 80]
      y: [0, 8]
  - type: simulation
    title: ไม้กระดกสมดุล (PhET Balancing Act)
    url: https://phet.colorado.edu/en/simulations/balancing-act
    provider: phet
    note: วางของมวลต่าง ๆ บนไม้กระดก เปิดแสดงระยะ (ruler) แล้วเอาที่ค้ำออก ลองหาตำแหน่งที่ทำให้ไม้กระดกอยู่ในแนวระดับ แล้วตรวจว่ามวล × ระยะ ของสองข้างเท่ากัน
glossary:
  - { term: โมเมนต์ของแรง, definition: "ผลของแรงที่ทำให้วัตถุหมุนรอบจุดหมุน $M = F \\times l$ มีหน่วย $\\mathrm{N\\,m}$" }
  - { term: แขนของโมเมนต์, definition: "ระยะตั้งฉากจากจุดหมุนถึงแนวแรง ถ้าแนวแรงผ่านจุดหมุน แขนของโมเมนต์เป็นศูนย์" }
  - { term: หลักของโมเมนต์, definition: "เมื่อวัตถุอยู่ในสมดุลการหมุน ผลรวมโมเมนต์ทวนเข็มนาฬิกาเท่ากับผลรวมโมเมนต์ตามเข็มนาฬิกา" }
  - { term: จุดหมุน, definition: "จุดที่วัตถุหมุนรอบ เช่น บานพับประตู หรือจุดรองรับของไม้กระดก" }
flashcards:
  - { front: "สูตรโมเมนต์ของแรงและหน่วย", back: "$M = F \\times l$ โดย $l$ คือระยะตั้งฉากจากจุดหมุนถึงแนวแรง หน่วย $\\mathrm{N\\,m}$" }
  - { front: "เงื่อนไขของสมดุลการหมุน", back: "$\\sum M_{\\text{ทวน}} = \\sum M_{\\text{ตาม}}$ (ถ้าต้องการให้นิ่งสนิท ต้องมี $\\sum F = 0$ ด้วย)" }
  - { front: "ทำไมประแจด้ามยาวคลายน็อตง่ายกว่า", back: "แขนของโมเมนต์ยาวขึ้น แรงเท่าเดิมจึงได้โมเมนต์มากขึ้น" }
  - { front: "น้ำหนักของคานสม่ำเสมอกระทำที่ใด", back: "ที่กึ่งกลางคาน (จุดศูนย์ถ่วง)" }
