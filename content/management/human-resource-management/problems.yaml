problems:
  - id: management.hr.human-resource-management.p001
    topics: [management.hr.human-resource-management]
    difficulty: 1
    type: match
    stem: "จับคู่วิธีวัดผลการฝึกอบรมกับระดับการประเมินของเคิร์กแพทริก"
    pairs:
      - { left: "แบบสอบถามความพึงพอใจท้ายการอบรม", right: "ระดับ 1 ปฏิกิริยา" }
      - { left: "ทดสอบก่อนและหลังการอบรม", right: "ระดับ 2 การเรียนรู้" }
      - { left: "หัวหน้าสังเกตการทำงานหลังอบรม 2 เดือน", right: "ระดับ 3 พฤติกรรม" }
      - { left: "จำนวนข้อร้องเรียนของลูกค้าลดลงในครึ่งปี", right: "ระดับ 4 ผลลัพธ์" }
    hints:
      - "ระดับเรียงจากสิ่งที่วัดได้ในวันอบรมไปถึงผลต่อองค์การ"
      - "พฤติกรรมวัดในงานจริงหลังอบรม ผลลัพธ์วัดที่ตัวชี้วัดขององค์การ"
    solution: "ความพึงพอใจคือปฏิกิริยา ผลทดสอบคือการเรียนรู้ การนำไปใช้ในงานคือพฤติกรรม และข้อร้องเรียนที่ลดลงคือผลลัพธ์ขององค์การ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.hr.human-resource-management.p002
    topics: [management.hr.human-resource-management]
    difficulty: 1
    type: mcq
    stem: "ฝ่ายบุคคลดูผลประเมินรายคนเพื่อหาว่าพนักงานคนใดยังใช้โปรแกรมบัญชีใหม่ไม่คล่อง เป็นการวิเคราะห์ความต้องการการฝึกอบรมระดับใด"
    choices:
      - { id: a, text: "ระดับบุคคล", correct: true }
      - { id: b, text: "ระดับองค์การ", feedback: "ระดับองค์การดูว่าเป้าหมายขององค์การต้องการทักษะอะไร ไม่ได้ดูรายคน" }
      - { id: c, text: "ระดับงาน", feedback: "ระดับงานดูว่างานต้องใช้ความรู้และทักษะอะไร ยังไม่ได้ดูว่าใครขาด" }
      - { id: d, text: "ระดับผลลัพธ์", feedback: "ผลลัพธ์เป็นระดับของการประเมินหลังอบรม ไม่ใช่ระดับของการวิเคราะห์ความต้องการ" }
    hints:
      - "TNA มีสามระดับ: องค์การ งาน บุคคล"
      - "คำถามคือ \"ใคร\" ยังขาดทักษะ"
    solution: "การหาว่าใครยังขาดทักษะคือการวิเคราะห์ระดับบุคคล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.hr.human-resource-management.p003
    topics: [management.hr.human-resource-management]
    difficulty: 1
    type: mcq
    stem: "หัวหน้าให้คะแนนพนักงานคนหนึ่ง \"ดีเยี่ยม\" ทุกด้าน เพราะเขาพูดเก่งในที่ประชุม ทั้งที่งานเอกสารของเขาผิดบ่อย นี่คือความคลาดเคลื่อนแบบใด"
    choices:
      - { id: a, text: "ผลรัศมี", correct: true }
      - { id: b, text: "แนวโน้มเข้าหากลาง", feedback: "แนวโน้มเข้าหากลางคือให้คะแนนปานกลางกับทุกคน ไม่ใช่ให้ดีเยี่ยมทุกด้าน" }
      - { id: c, text: "ผลจากเหตุการณ์ล่าสุด", feedback: "ผลจากเหตุการณ์ล่าสุดคือให้น้ำหนักกับสิ่งที่เพิ่งเกิด ในข้อนี้หัวหน้าใช้จุดเด่นเรื่องเดียวตัดสินทุกด้าน" }
      - { id: d, text: "ความเข้มงวดเกิน", feedback: "ความเข้มงวดเกินคือให้คะแนนต่ำกว่าความจริง ข้อนี้ให้สูงเกินจริง" }
    hints:
      - "จุดเด่นเรื่องเดียวไปส่งผลกับการประเมินด้านอื่น"
      - "ชื่อของความคลาดเคลื่อนนี้มาจาก \"รัศมี\" ที่ส่องไปรอบตัว"
    solution: "การใช้ความประทับใจเรื่องเดียวไปตัดสินทุกด้านคือผลรัศมี แก้ได้ด้วยการประเมินทีละด้านตามหลักฐานของด้านนั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.hr.human-resource-management.p004
    topics: [management.hr.human-resource-management]
    difficulty: 2
    type: numeric
    stem: "บริษัทแห่งหนึ่งมีพนักงาน 110 คนเมื่อต้นปี และ 130 คนเมื่อปลายปี ระหว่างปีมีผู้ลาออก 18 คน อัตราการลาออกต่อปีเป็นร้อยละเท่าใด"
    answer: { value: 15, unit: "%" }
    hints:
      - "อัตราการลาออก = ผู้ลาออก ÷ จำนวนพนักงานเฉลี่ย × 100"
      - "จำนวนพนักงานเฉลี่ย = (ต้นปี + ปลายปี) ÷ 2"
    misconceptions:
      - { match: 16.36, feedback: "หารด้วยจำนวนต้นปี ต้องใช้จำนวนพนักงานเฉลี่ยของปี" }
      - { match: 13.85, feedback: "หารด้วยจำนวนปลายปี ต้องใช้จำนวนพนักงานเฉลี่ยของปี" }
    solution: "จำนวนเฉลี่ย $(110 + 130) \\div 2 = 120$ คน อัตราการลาออก $18 \\div 120 \\times 100 = 15\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.hr.human-resource-management.p005
    topics: [management.hr.human-resource-management]
    difficulty: 2
    type: numeric
    stem: "ศูนย์บริการแห่งหนึ่ง (สมมติ) คาดว่าปีหน้าจะมีคำขอ 31,200 เรื่อง ใช้เวลาเรื่องละ 20 นาที เจ้าหน้าที่หนึ่งคนมีเวลาทำงานจริง 1,560 ชั่วโมงต่อปี ต้องมีเจ้าหน้าที่อย่างน้อยกี่คน"
    answer: { value: 7, unit: คน }
    hints:
      - "ภาระงานรวมเป็นชั่วโมง = 31,200 × 20 ÷ 60"
      - "หารด้วยชั่วโมงทำงานจริงต่อคน แล้วปัดขึ้นเป็นจำนวนเต็ม"
    misconceptions:
      - { match: 6, feedback: "ปัดลง ภาระงานต้องการ 6.67 คน ถ้ามี 6 คนจะมีงานเหลือที่ไม่มีคนทำ" }
      - { match: 400, feedback: "ลืมแปลงนาทีเป็นชั่วโมง ภาระงานต้องหาร 60 ก่อน" }
    solution: "ภาระงาน $31{,}200 \\times 20 = 624{,}000$ นาที $= 10{,}400$ ชั่วโมง FTE $= 10{,}400 \\div 1{,}560 \\approx 6.67$ ปัดขึ้นเป็น 7 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.hr.human-resource-management.p006
    topics: [management.hr.human-resource-management]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการสรรหาและคัดเลือกพนักงานใหม่ให้ถูกต้อง"
    items:
      - "วิเคราะห์งานและกำหนดคุณสมบัติ"
      - "ประกาศรับสมัคร"
      - "คัดกรองใบสมัคร"
      - "ทดสอบและสัมภาษณ์"
      - "ตรวจสอบประวัติและบุคคลอ้างอิง"
      - "เสนอจ้างและปฐมนิเทศ"
    hints:
      - "ต้องรู้ก่อนว่างานต้องการคนแบบไหน จึงจะประกาศได้"
      - "ตรวจประวัติเฉพาะผู้ที่ผ่านการสัมภาษณ์แล้ว"
    solution: "วิเคราะห์งาน → ประกาศ → คัดกรอง → ทดสอบและสัมภาษณ์ → ตรวจสอบประวัติ → เสนอจ้างและปฐมนิเทศ ถ้าไม่วิเคราะห์งานก่อน จะไม่มีเกณฑ์ที่ใช้คัดกรองและสัมภาษณ์อย่างเป็นธรรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.hr.human-resource-management.p007
    topics: [management.hr.human-resource-management]
    difficulty: 3
    type: numeric
    stem: "จากกรวยการสรรหาในภาพ ฝ่ายผลิตต้องการพนักงานใหม่ 6 คน ต้องมีผู้สมัครอย่างน้อยกี่คน"
    figure:
      src: p-funnel.svg
      alt: "กรวยการสรรหาสี่ขั้นจากบนลงล่าง ผู้สมัครทั้งหมด (ไม่ทราบจำนวน) ผ่านคัดกรองเอกสารร้อยละ 40 ของผู้สมัคร และทุกคนที่ผ่านได้สัมภาษณ์ ได้รับข้อเสนอจ้าง 1 ใน 4 ของผู้ที่ได้สัมภาษณ์ ตอบรับเข้าทำงานร้อยละ 75 ของผู้ได้รับข้อเสนอ ต้องการ 6 คน"
    answer: { value: 80, unit: คน }
    hints:
      - "คิดย้อนจากล่างขึ้นบน: ต้องเสนอจ้างกี่คนจึงจะมีผู้ตอบรับ 6 คน"
      - "หารด้วยอัตราผ่านของแต่ละขั้น: 6 ÷ 0.75 ÷ 0.25 ÷ 0.40"
    misconceptions:
      - { match: 60, feedback: "ลืมว่าผู้ได้รับข้อเสนอตอบรับแค่ร้อยละ 75 ต้องเสนอจ้าง 8 คน ไม่ใช่ 6 คน" }
      - { match: 32, feedback: "นั่นคือจำนวนผู้ที่ต้องได้สัมภาษณ์ ยังต้องย้อนอีกขั้นไปหาจำนวนผู้สมัคร" }
    solution: "เสนอจ้าง $6 \\div 0.75 = 8$ คน สัมภาษณ์ $8 \\div 0.25 = 32$ คน ผู้สมัคร $32 \\div 0.40 = 80$ คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.hr.human-resource-management.p008
    topics: [management.hr.human-resource-management]
    difficulty: 3
    type: numeric
    stem: "โรงงานเซรามิกในลำปาง (สมมติ) จ่ายค่าอบรมการเคลือบผิว 85,000 บาท หลังอบรมชิ้นงานเสียลดลงเดือนละ 1,200 ชิ้น ชิ้นละ 25 บาท ROI ของการอบรมใน 6 เดือนแรกเป็นร้อยละเท่าใด (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 111.8, unit: "%", tolerance: 0.1 }
    hints:
      - "ผลประโยชน์ 6 เดือน = 1,200 × 25 × 6"
      - "ROI = (ผลประโยชน์ − ต้นทุน) ÷ ต้นทุน × 100"
    misconceptions:
      - { match: 211.8, feedback: "นั่นคือผลประโยชน์ ÷ ต้นทุน ROI ต้องหักต้นทุนออกจากผลประโยชน์ก่อน" }
      - { match: -64.7, feedback: "ใช้ผลประโยชน์เพียงเดือนเดียว โจทย์ถามผลของ 6 เดือน" }
    solution: "ผลประโยชน์ $1{,}200 \\times 25 \\times 6 = 180{,}000$ บาท ROI $= (180{,}000 - 85{,}000) \\div 85{,}000 \\times 100 \\approx 111.8\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.hr.human-resource-management.p009
    topics: [management.hr.human-resource-management]
    difficulty: 3
    type: mcq
    stem: "หลังอบรมการบริการลูกค้า ผู้เข้าอบรมให้คะแนนพอใจ 4.8 จาก 5 และทำแบบทดสอบได้เฉลี่ย 90% แต่สามเดือนต่อมาข้อร้องเรียนไม่ลดลง ข้อสรุปใดเหมาะที่สุด"
    choices:
      - { id: a, text: "ควรตรวจระดับพฤติกรรมว่าพนักงานนำไปใช้จริงหรือไม่ และมีอะไรขวางอยู่ที่หน้างาน", correct: true }
      - { id: b, text: "การอบรมได้ผลดีแล้ว เพราะผู้เข้าอบรมพอใจและสอบผ่าน", feedback: "ระดับ 1 และ 2 ดีไม่ได้รับประกันว่าจะเกิดผลระดับ 3 และ 4" }
      - { id: c, text: "ควรจัดอบรมหลักสูตรเดิมซ้ำอีกรอบ", feedback: "ผลทดสอบสูงแปลว่าพนักงานรู้แล้ว ปัญหาน่าจะอยู่ที่การนำไปใช้ ไม่ใช่ความรู้" }
      - { id: d, text: "ข้อร้องเรียนไม่เกี่ยวกับการอบรม ไม่ต้องวัด", feedback: "ข้อร้องเรียนคือผลลัพธ์ที่องค์การต้องการจากการอบรมนี้ จึงควรวัด" }
    hints:
      - "ระดับ 1 และ 2 ดี แต่ระดับ 4 ไม่เปลี่ยน"
      - "ระดับที่ยังไม่ได้วัดคือระดับใด"
    solution: "ความพอใจและความรู้ดีแล้ว แต่ผลลัพธ์ไม่เปลี่ยน ช่องว่างจึงน่าจะอยู่ที่ระดับพฤติกรรม เช่น หัวหน้าไม่สนับสนุน ขั้นตอนเดิมไม่เอื้อ หรือคนไม่พอ ต้องสังเกตหน้างานก่อนตัดสินใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.hr.human-resource-management.p010
    topics: [management.hr.human-resource-management]
    difficulty: 3
    type: numeric
    stem: "บริษัทประเมินค่างานด้วยวิธีให้คะแนนปัจจัย น้ำหนัก: ความรู้ 40% ความรับผิดชอบ 30% ความพยายาม 20% สภาพงาน 10% งานหัวหน้าคลังสินค้าได้ระดับ 4, 3, 2 และ 3 ตามลำดับ (เต็ม 5) คะแนนถ่วงน้ำหนักของงานนี้เป็นเท่าใด"
    answer: { value: 3.2, unit: คะแนน, tolerance: 0.01 }
    hints:
      - "คูณระดับของแต่ละปัจจัยด้วยน้ำหนัก แล้วรวมกัน"
      - "0.4 × 4 + 0.3 × 3 + 0.2 × 2 + 0.1 × 3"
    misconceptions:
      - { match: 3, feedback: "นั่นคือค่าเฉลี่ยธรรมดา ปัจจัยมีน้ำหนักไม่เท่ากัน ต้องถ่วงน้ำหนัก" }
      - { match: 12, feedback: "นั่นคือผลรวมของระดับโดยไม่ถ่วงน้ำหนัก" }
    solution: "$0.4(4) + 0.3(3) + 0.2(2) + 0.1(3) = 1.6 + 0.9 + 0.4 + 0.3 = 3.2$ คะแนน แล้วนำไปจัดเข้ากระบอกเงินเดือนตามช่วงคะแนนที่บริษัทกำหนด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.hr.human-resource-management.p011
    topics: [management.hr.human-resource-management]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ในการสัมภาษณ์ตำแหน่งพนักงานบัญชี คำถามใดเหมาะสม เพราะเกี่ยวกับงานและไม่เลือกปฏิบัติ (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "เล่าเหตุการณ์ที่คุณพบตัวเลขในงบไม่ตรงกัน และคุณทำอย่างไร", correct: true }
      - { id: b, text: "ลองกระทบยอดบัญชีธนาคารจากเอกสารตัวอย่างนี้ภายใน 20 นาที", correct: true }
      - { id: c, text: "คุณแต่งงานแล้วหรือยัง วางแผนจะมีลูกเมื่อไร", feedback: "สถานภาพสมรสและการมีบุตรไม่เกี่ยวกับความสามารถในงาน และนำไปสู่การเลือกปฏิบัติ" }
      - { id: d, text: "คุณนับถือศาสนาอะไร", feedback: "ศาสนาไม่เกี่ยวกับงานบัญชี การถามเรื่องนี้เสี่ยงต่อการเลือกปฏิบัติ" }
    hints:
      - "คำถามที่ดีทำนายผลงานได้ และใช้กับผู้สมัครทุกคนเหมือนกัน"
      - "เรื่องส่วนตัวที่ไม่เกี่ยวกับงานไม่ควรถาม"
    solution: "คำถามเชิงพฤติกรรม (a) และการให้ลองทำงานตัวอย่าง (b) เกี่ยวกับงานโดยตรงและทำนายผลงานได้ดี ส่วนคำถามเรื่องสมรส บุตร และศาสนา (c, d) ไม่เกี่ยวกับงานและนำไปสู่การเลือกปฏิบัติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.hr.human-resource-management.p012
    topics: [management.hr.human-resource-management]
    difficulty: 4
    type: numeric
    stem: "ลูกจ้างรายวันได้ค่าจ้างวันละ 480 บาท ทำงานปกติวันละ 8 ชั่วโมง สัปดาห์นี้ทำงานล่วงเวลาในวันทำงาน 6 ชั่วโมง และทำงานล่วงเวลาในวันหยุด 8 ชั่วโมง สมมติให้อัตราค่าล่วงเวลาในวันทำงานเป็น 1.5 เท่า และในวันหยุดเป็น 3 เท่าของค่าจ้างต่อชั่วโมง ลูกจ้างได้ค่าล่วงเวลารวมกี่บาท"
    answer: { value: 1980, unit: บาท }
    hints:
      - "ค่าจ้างต่อชั่วโมง = 480 ÷ 8"
      - "คิดแยกสองส่วน: 6 ชั่วโมง × 1.5 เท่า และ 8 ชั่วโมง × 3 เท่า"
    misconceptions:
      - { match: 1260, feedback: "ใช้อัตรา 1.5 เท่ากับทุกชั่วโมง ชั่วโมงล่วงเวลาในวันหยุดใช้อัตรา 3 เท่า" }
      - { match: 15840, feedback: "ใช้ค่าจ้างรายวัน 480 บาทแทนค่าจ้างต่อชั่วโมง ต้องหาร 8 ก่อน" }
    solution: "ค่าจ้างต่อชั่วโมง $480 \\div 8 = 60$ บาท ล่วงเวลาวันทำงาน $60 \\times 1.5 \\times 6 = 540$ บาท ล่วงเวลาวันหยุด $60 \\times 3 \\times 8 = 1{,}440$ บาท รวม $1{,}980$ บาท (อัตราจริงตามกฎหมายต้องตรวจจากกระทรวงแรงงาน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.hr.human-resource-management.p013
    topics: [management.hr.human-resource-management]
    difficulty: 4
    type: mcq
    stem: "ผลประเมินประจำปีของสำนักงานแห่งหนึ่งพบว่า พนักงาน 92% ได้ระดับ \"ดี\" (กลาง) ผู้บริหารจึงแยกคนที่ควรได้เลื่อนขั้นกับคนที่ต้องพัฒนาไม่ได้ วิธีแก้ใดตรงปัญหาที่สุด"
    choices:
      - { id: a, text: "เขียนเกณฑ์พฤติกรรมของแต่ละระดับให้ชัด ให้หัวหน้าบันทึกหลักฐานตลอดปี และประชุมเทียบมาตรฐานการให้คะแนนระหว่างหัวหน้า", correct: true }
      - { id: b, text: "บังคับให้แต่ละหน่วยงานมีคนได้ระดับต่ำสุดอย่างน้อย 10%", feedback: "การบังคับสัดส่วนอาจลงโทษคนที่ทำงานดีในทีมที่เก่ง และทำลายความร่วมมือ โดยไม่ได้แก้ที่ต้นเหตุ" }
      - { id: c, text: "ยกเลิกการประเมินผลการปฏิบัติงาน", feedback: "ยังต้องมีข้อมูลสำหรับพัฒนาคนและให้ค่าตอบแทนอย่างเป็นธรรม" }
      - { id: d, text: "ให้พนักงานประเมินตนเองแทนหัวหน้า", feedback: "การประเมินตนเองอย่างเดียวมักผ่อนปรนยิ่งกว่า ไม่ได้แก้แนวโน้มเข้าหากลาง" }
    hints:
      - "นี่คือความคลาดเคลื่อนแบบแนวโน้มเข้าหากลาง"
      - "หัวหน้าให้ระดับกลางเพราะไม่มีหลักฐานและเกณฑ์ที่ชัด"
