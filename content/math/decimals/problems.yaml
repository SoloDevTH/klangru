    solution: "ให้ $x = 0.2727\\ldots$ จะได้ $100x = 27.2727\\ldots$ ลบกัน: $99x = 27$ ดังนั้น $x = \\tfrac{27}{99} = \\tfrac{3}{11}$ ตรวจ: $3 \\div 11 = 0.2727\\ldots$ ✓"
