          - { id: "ต 4.2 ป.3/1", level: ป.3, text: "ใช้ภาษาต่างประเทศเพื่อรวบรวมคำศัพท์ที่เกี่ยวข้องใกล้ตัว", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “เพื่อรวบรวม|คำศัพท์ที่” ไม่เว้นวรรค" }
          - { id: "ต 4.2 ป.4/1", level: ป.4, text: "ใช้ภาษาต่างประเทศในการสืบค้นและรวบรวมข้อมูลต่างๆ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ในการสืบค้น|และรวบรวม” ไม่เว้นวรรค" }
          - { id: "ต 4.2 ป.5/1", level: ป.5, text: "ใช้ภาษาต่างประเทศในการสืบค้นและรวบรวมข้อมูลต่างๆ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ในการสืบค้น|และรวบรวม” ไม่เว้นวรรค" }
          - { id: "ต 4.2 ป.6/1", level: ป.6, text: "ใช้ภาษาต่างประเทศในการสืบค้นและรวบรวมข้อมูลต่างๆ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ในการสืบค้น|และรวบรวม” ไม่เว้นวรรค" }
          - { id: "ต 4.2 ม.1/1", level: ม.1, text: "ใช้ภาษาต่างประเทศในการสืบค้น/ค้นคว้าความรู้/ข้อมูลต่างๆ จากสื่อและแหล่งการเรียนรู้ต่างๆ ในการศึกษาต่อ และประกอบอาชีพ" }
          - { id: "ต 4.2 ม.2/1", level: ม.2, text: "ใช้ภาษาต่างประเทศในการสืบค้น/ค้นคว้า รวบรวมและสรุปความรู้/ข้อมูลต่างๆ จากสื่อและแหล่งการเรียนรู้ต่างๆ ในการศึกษาต่อและประกอบอาชีพ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…วบรวมและสรุปความรู้/|ข้อมูลต่างๆ” ไม่เว้นวรรค" }
          - { id: "ต 4.2 ม.2/2", level: ม.2, text: "เผยแพร่/ประชาสัมพันธ์ข้อมูล ข่าวสารของโรงเรียนเป็นภาษาต่างประเทศ" }
          - { id: "ต 4.2 ม.3/1", level: ม.3, text: "ใช้ภาษาต่างประเทศในการสืบค้น/ค้นคว้า รวบรวมและสรุปความรู้/ข้อมูลต่างๆ จากสื่อและแหล่งการเรียนรู้ต่างๆ ในการศึกษาต่อและประกอบอาชีพ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…วบรวมและสรุปความรู้/|ข้อมูลต่างๆ” ไม่เว้นวรรค" }
          - { id: "ต 4.2 ม.3/2", level: ม.3, text: "เผยแพร่/ประชาสัมพันธ์ข้อมูล ข่าวสารของโรงเรียน ชุมชน และท้องถิ่น เป็นภาษาต่างประเทศ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ชุมชน|และท้องถิ่น” เว้นวรรค" }
          - { id: "ต 4.2 ม.4-6/1", level: ม.4-6, text: "ใช้ภาษาต่างประเทศ ในการสืบค้น/ค้นคว้า รวบรวม วิเคราะห์ และสรุปความรู้/ข้อมูลต่างๆ จากสื่อและแหล่งการเรียนรู้ต่างๆ ในการศึกษาต่อและประกอบอาชีพ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ในการสืบค้น/|ค้นคว้า” ไม่เว้นวรรค" }
          - { id: "ต 4.2 ม.4-6/2", level: ม.4-6, text: "เผยแพร่/ประชาสัมพันธ์ ข้อมูล ข่าวสารของโรงเรียน ชุมชน และท้องถิ่น/ประเทศชาติเป็นภาษาต่างประเทศ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ข้อมูล|ข่าวสารของโรงเรียน” เว้นวรรค" }
