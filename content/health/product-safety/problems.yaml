      - { id: b, text: "ซื้อได้ เพราะคนรีวิวเยอะ", feedback: "รีวิวไม่ได้ยืนยันความปลอดภัย และอาจเป็นรีวิวปลอม" }
      - { id: c, text: "ซื้อมาทาเฉพาะใบหน้าน้อย ๆ ก่อน", feedback: "สารอย่างปรอทเป็นอันตรายแม้ใช้น้อย และผิวหน้าบอบบาง" }
