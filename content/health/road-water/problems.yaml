  - id: health.safety.road-water.p018
    topics: [health.safety.road-water]
    difficulty: 5
    type: numeric
    stem: "จากแผนภูมิ เด็กจมน้ำ 16 เหตุการณ์ ถ้ารวมคลองและแม่น้ำ (ร้อยละ 50) กับแหล่งน้ำเกษตร (ร้อยละ 31) ซึ่งเป็นแหล่งน้ำที่มักไม่มีคนดูแล จะคิดเป็นประมาณกี่เหตุการณ์ (ตอบเป็นจำนวนเต็มที่ใกล้ที่สุด)"
    figure:
      src: drowning-places.svg
      alt: "แผนภูมิแท่ง แหล่งน้ำที่เกิดเหตุเด็กอายุต่ำกว่า 15 ปีจมน้ำ 16 เหตุการณ์ ช่วง 1 ม.ค.–6 มิ.ย. 2565 ข้อมูลกรมควบคุมโรค คลองและแม่น้ำร้อยละ 50 แหล่งน้ำเกษตรร้อยละ 31 ทะเลร้อยละ 13 สระว่ายน้ำร้อยละ 6"
    answer: { value: 13, tolerance: 0.05, unit: เหตุการณ์ }
    misconceptions:
      - { match: 81, feedback: "81 คือร้อยละรวม ต้องแปลงเป็นจำนวนเหตุการณ์จาก 16" }
      - { match: 8, feedback: "8 คือคลองและแม่น้ำอย่างเดียว ต้องรวมแหล่งน้ำเกษตรด้วย" }
    hints:
      - "รวมร้อยละก่อน: 50 + 31"
      - "คำนวณ 81 ÷ 100 × 16 แล้วปัดเป็นจำนวนเต็ม"
    solution: "50 + 31 = ร้อยละ 81, 81 ÷ 100 × 16 = 12.96 ≈ 13 เหตุการณ์ คือเกือบทั้งหมดเกิดในแหล่งน้ำใกล้บ้านที่ไม่มีคนดูแล"
    license: CC-BY-SA-4.0
    ai_assisted: true
