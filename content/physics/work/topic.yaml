id: physics.energy.work
subject: physics
title: { th: งาน, en: Work }
summary: งานที่แรงทำเมื่อวัตถุเคลื่อนที่ไปตามแนวแรง หน่วยจูล แรงที่ทำมุมกับการเคลื่อนที่ งานเป็นศูนย์ งานเป็นลบ และงานรวมของหลายแรง
difficulty: 4
minutes: 30
prerequisites: [physics.dynamics.newton-second]
encompasses:
  - { id: physics.dynamics.newton-second, weight: 0.3 }
  - { id: physics.dynamics.forces, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: angled-pull.svg
    alt: "รถลากกระเป๋าบนพื้นราบ แรงดึง F ทำมุม theta กับพื้น แยกเป็นองค์ประกอบ F cos theta ตามแนวพื้นซึ่งทำงาน และ F sin theta ตั้งฉากกับพื้นซึ่งไม่ทำงาน การกระจัด s อยู่ในแนวพื้น"
    caption: "เฉพาะองค์ประกอบของแรงตามแนวการกระจัด $F\\cos\\theta$ เท่านั้นที่ทำงาน"
  - type: figure
    src: fx-lesson.svg
    alt: "กราฟแรง F (นิวตัน) กับตำแหน่ง x (เมตร) แรงคงที่ 20 N จาก x = 0 ถึง 2 m แล้วลดลงเป็นเส้นตรงจนเป็นศูนย์ที่ x = 4 m พื้นที่ใต้กราฟแรเงา แบ่งเป็นสี่เหลี่ยมผืนผ้า 40 J และสามเหลี่ยม 20 J"
    caption: "งานคือพื้นที่ใต้กราฟแรงกับตำแหน่ง ส่วนสี่เหลี่ยม $20 \\times 2 = 40\\ \\mathrm{J}$ ส่วนสามเหลี่ยม $\\tfrac{1}{2} \\times 2 \\times 20 = 20\\ \\mathrm{J}$"
  - type: worked-example
    title: หางานจากกราฟแรงกับตำแหน่ง
    problem: "แรงที่ดันกล่องไปตามพื้นเปลี่ยนตามตำแหน่งดังกราฟด้านบน แรงนี้ทำงานรวมเท่าใดตั้งแต่ $x = 0$ ถึง $x = 4\\ \\mathrm{m}$"
    steps:
      - text: "แบ่งพื้นที่ใต้กราฟเป็นรูปที่หาพื้นที่ง่าย: สี่เหลี่ยมผืนผ้าจาก $0$ ถึง $2\\ \\mathrm{m}$ และสามเหลี่ยมจาก $2$ ถึง $4\\ \\mathrm{m}$"
        why: "งานคือพื้นที่ใต้กราฟ ส่วนที่แรงคงที่ใช้ $Fs$ ได้ทันที ส่วนที่แรงเปลี่ยนต้องใช้พื้นที่"
      - text: "สี่เหลี่ยม: $20\\ \\mathrm{N} \\times 2\\ \\mathrm{m} = 40\\ \\mathrm{J}$"
      - text: "สามเหลี่ยม: $\\tfrac{1}{2} \\times 2\\ \\mathrm{m} \\times 20\\ \\mathrm{N} = 20\\ \\mathrm{J}$"
        why: "ช่วงนี้แรงลดจาก 20 เหลือ 0 แรงเฉลี่ยคือ 10 N พอดี ได้ $10 \\times 2 = 20\\ \\mathrm{J}$ ตรงกัน"
      - text: "รวม: $40 + 20 = 60\\ \\mathrm{J}$"
    answer: "$60\\ \\mathrm{J}$ (ถ้าใช้ $20\\ \\mathrm{N} \\times 4\\ \\mathrm{m} = 80\\ \\mathrm{J}$ จะผิด เพราะแรงไม่ได้เป็น 20 N ตลอด)"
  - { type: check, problem: phy.work.p021, prompt: "ลองอ่านกราฟแรงคงที่" }
  - type: worked-example
    title: เข็นถังขึ้นทางลาด
    problem: "เข็นถังมวล $50\\ \\mathrm{kg}$ ขึ้นไม้กระดานยาว $5\\ \\mathrm{m}$ ไปวางบนท้ายรถกระบะสูง $1.2\\ \\mathrm{m}$ ด้วยแรง $150\\ \\mathrm{N}$ ขนานกับไม้กระดาน (ความเร็วคงตัว) จงหางานที่ใส่ งานที่ได้ ประสิทธิภาพ และแรงที่ต้องใช้ถ้าไม่มีแรงเสียดทาน"
    steps:
      - text: "งานที่ใส่: $W_{\\text{ใส่}} = F L = 150 \\times 5 = 750\\ \\mathrm{J}$"
      - text: "งานที่ได้ (ยกถังสูง $1.2\\ \\mathrm{m}$): $W_{\\text{ได้}} = mgh = 50 \\times 9.8 \\times 1.2 = 588\\ \\mathrm{J}$"
        why: "ถ้ายกตรง ๆ ต้องใช้แรงเท่าน้ำหนัก $490\\ \\mathrm{N}$ เป็นระยะ $1.2\\ \\mathrm{m}$ ได้งานเท่านี้"
      - text: "ประสิทธิภาพ: $\\dfrac{588}{750} \\times 100\\% = 78.4\\%$"
      - text: "ถ้าไม่มีแรงเสียดทาน งานที่ใส่เท่ากับงานที่ได้: $F \\times 5 = 588$ ได้ $F = 117.6\\ \\mathrm{N}$"
        why: "ทางลาดลดแรงจาก $490\\ \\mathrm{N}$ เหลือ $117.6\\ \\mathrm{N}$ แต่ต้องเข็นไกลขึ้นจาก $1.2$ เป็น $5\\ \\mathrm{m}$ งานไม่ได้ลดลง"
    answer: "งานที่ใส่ $750\\ \\mathrm{J}$ งานที่ได้ $588\\ \\mathrm{J}$ ประสิทธิภาพ $78.4\\%$ ถ้าไม่มีแรงเสียดทานใช้แรงเพียง $117.6\\ \\mathrm{N}$"
  - { type: check, problem: phy.work.p015 }
  - type: interactive
    title: งานเปลี่ยนไปอย่างไรเมื่อมุมของแรงเปลี่ยน
    caption: 'แกนนอนคือมุม θ ระหว่างแรงกับการเคลื่อนที่ (องศา) แกนตั้งคืองาน W = Fs cos θ (จูล) ลองเลื่อน F และ s แล้วสังเกตว่างานเป็นบวกเมื่อมุมน้อยกว่า 90° เป็นศูนย์ที่ 90° พอดี และเป็นลบเมื่อมุมเกิน 90°'
    widget:
      kind: function-plot
      functions: ['F s \cos(\frac{\pi x}{180})']
      sliders:
        - { name: F, min: 0, max: 50, step: 5, value: 20, label: แรง F (N) }
        - { name: s, min: 0, max: 5, step: 0.5, value: 3, label: การกระจัด s (m) }
      x: [0, 180]
      y: [-260, 260]
glossary:
  - { term: งาน (W), definition: 'ผลคูณของแรงกับการกระจัดตามแนวแรง $W = Fs\cos\theta$ เป็นปริมาณสเกลาร์ มีหน่วยจูล' }
  - { term: จูล (J), definition: 'หน่วยของงานและพลังงาน $1\ \mathrm{J} = 1\ \mathrm{N \cdot m}$' }
  - { term: งานรวม, definition: 'ผลบวกของงานจากทุกแรงที่กระทำต่อวัตถุ โดยคิดเครื่องหมายบวกลบ เท่ากับงานของแรงลัพธ์' }
flashcards:
  - { front: 'สูตรงานเมื่อแรงทำมุม $\theta$ กับการเคลื่อนที่', back: '$W = Fs\cos\theta$ หน่วยจูล ($\mathrm{J} = \mathrm{N \cdot m}$)' }
  - { front: 'ยืนถือถุงข้าวนิ่ง ๆ นาน 10 นาที แรงยกทำงานเท่าใด', back: 'ศูนย์ เพราะถุงข้าวไม่มีการกระจัด ($s = 0$)' }
  - { front: 'งานของแรงเสียดทานที่ต้านการไถลเป็นบวกหรือลบ', back: 'เป็นลบ เพราะแรงสวนทางการเคลื่อนที่ ($\theta = 180^\circ$, $\cos\theta = -1$)' }
  - { front: 'แรงตั้งฉากกับการเคลื่อนที่ทำงานเท่าใด', back: 'ศูนย์ เพราะ $\cos 90^\circ = 0$' }
