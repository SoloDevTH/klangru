problems:
  - id: biology.plants.reproduction-propagation.p001
    topics: [biology.plants.reproduction-propagation]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นการสืบพันธุ์แบบไม่อาศัยเพศของพืช"
    choices:
      - { id: a, text: "หน่อกล้วยงอกขึ้นข้างต้นแม่แล้วแยกไปปลูก", correct: true }
      - { id: b, text: "เพาะเมล็ดมะละกอจนงอกเป็นต้นใหม่", feedback: "เมล็ดเกิดจากการปฏิสนธิระหว่างเซลล์สืบพันธุ์เพศผู้กับเซลล์ไข่ จึงเป็นแบบอาศัยเพศ" }
      - { id: c, text: "ผึ้งพาละอองเรณูไปยังดอกทานตะวันอีกดอก แล้วเกิดเมล็ด", feedback: "การถ่ายเรณูและการเกิดเมล็ดเป็นขั้นตอนของการสืบพันธุ์แบบอาศัยเพศ" }
    hints:
      - "แบบไม่อาศัยเพศไม่มีการปฏิสนธิ ต้นใหม่เกิดจากส่วนของต้นเดิม"
      - "หน่อกล้วยเกิดจากส่วนใดของต้นกล้วย"
    solution: "หน่อกล้วยงอกจากลำต้นใต้ดินของต้นเดิม ไม่มีการปฏิสนธิ จึงเป็นการสืบพันธุ์แบบไม่อาศัยเพศ ต้นใหม่มีลักษณะเหมือนต้นแม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-propagation.p002
    topics: [biology.plants.reproduction-propagation]
    difficulty: 1
    type: match
    stem: "จับคู่ส่วนของดอกกับหน้าที่"
    pairs:
      - { left: "อับเรณู", right: "สร้างละอองเรณู" }
      - { left: "ยอดเกสรเพศเมีย", right: "รับละอองเรณู" }
      - { left: "รังไข่", right: "เจริญเป็นผล" }
      - { left: "ออวุล", right: "เจริญเป็นเมล็ด" }
      - { left: "กลีบดอก", right: "มีสีสดล่อสัตว์ที่ช่วยถ่ายเรณู" }
    hints:
      - "รังไข่หุ้มออวุลไว้ข้างใน เหมือนผลหุ้มเมล็ด"
      - "อับเรณูเป็นส่วนของเกสรเพศผู้"
    solution: "อับเรณูสร้างละอองเรณู ยอดเกสรเพศเมียรับละอองเรณู รังไข่เจริญเป็นผล ออวุลเจริญเป็นเมล็ด และกลีบดอกล่อสัตว์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-propagation.p003
    topics: [biology.plants.reproduction-propagation]
    difficulty: 1
    type: text
    stem: "การที่ละอองเรณูไปตกบนยอดเกสรเพศเมีย เรียกว่าอะไร"
    accepted: ["การถ่ายเรณู", "การถ่ายละอองเรณู", "ถ่ายเรณู", "ถ่ายละอองเรณู", "pollination"]
    hints:
      - "เป็นขั้นตอนก่อนการปฏิสนธิ"
      - "ผึ้งและลมช่วยให้เกิดขั้นตอนนี้"
    misconceptions:
      - { match: "การปฏิสนธิ", feedback: "การปฏิสนธิเกิดภายหลังในออวุล เมื่อสเปิร์มนิวเคลียสรวมกับเซลล์ไข่" }
    solution: "การถ่ายเรณู (การถ่ายละอองเรณู) หลังจากนั้นละอองเรณูจึงงอกหลอดลงไปสู่ออวุลเพื่อปฏิสนธิ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-propagation.p004
    topics: [biology.plants.reproduction-propagation]
    difficulty: 2
    type: mcq
    stem: "จากภาพดอกผ่าครึ่ง หลังการปฏิสนธิ ส่วนใดจะเจริญเป็นผล"
    figure: { src: p-flower-letters.svg, alt: "ดอกผ่าครึ่งมีตัวอักษรชี้ 5 ตำแหน่ง ก ชี้ที่ปลายบนสุดของแท่งกลางดอก ข ชี้ที่ก้อนสีเหลืองส้มบนปลายก้านเรียวด้านข้าง ค ชี้ที่ผนังของกระเปาะสีเขียวที่โคนแท่งกลาง ง ชี้ที่เม็ดสีเหลืองเล็ก ๆ ภายในกระเปาะนั้น จ ชี้ที่แผ่นสีชมพูขนาดใหญ่ด้านข้าง" }
    choices:
      - { id: a, text: "ค", correct: true }
      - { id: b, text: "ง", feedback: "ง คือออวุลที่อยู่ในรังไข่ ออวุลเจริญเป็นเมล็ด ไม่ใช่ผล" }
      - { id: c, text: "ก", feedback: "ก คือยอดเกสรเพศเมีย ทำหน้าที่รับละอองเรณู แล้วจะเหี่ยวไป" }
      - { id: d, text: "จ", feedback: "จ คือกลีบดอก ซึ่งมักร่วงไปหลังการปฏิสนธิ" }
    hints:
      - "หาส่วนที่ห่อหุ้มออวุลไว้"
      - "ผลหุ้มเมล็ด เหมือนรังไข่หุ้มออวุล"
    solution: "ค คือรังไข่ ซึ่งเจริญเป็นผล ส่วน ง คือออวุลที่อยู่ข้างใน เจริญเป็นเมล็ด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-propagation.p005
    topics: [biology.plants.reproduction-propagation]
    difficulty: 2
    type: mcq
    stem: "ดอกข้าวโพดมีกลีบดอกเล็กมาก ไม่มีกลิ่น สร้างละอองเรณูจำนวนมากที่เบาและแห้ง และมีไหมข้าวโพดเป็นยอดเกสรเพศเมียที่ยาวฟู ดอกข้าวโพดน่าจะถ่ายเรณูด้วยอะไร"
    choices:
      - { id: a, text: "ลม", correct: true }
      - { id: b, text: "ผึ้งและผีเสื้อ", feedback: "ดอกที่อาศัยแมลงมักมีกลีบดอกสีสด มีกลิ่น และมีน้ำหวาน ซึ่งดอกข้าวโพดไม่มี" }
      - { id: c, text: "นกกินปลี", feedback: "นกกินปลีมาหาดอกที่มีน้ำหวานและสีสด ดอกข้าวโพดไม่มีสิ่งเหล่านี้" }
      - { id: d, text: "น้ำ", feedback: "ดอกข้าวโพดอยู่สูงในอากาศ ไม่ได้อยู่ในน้ำ" }
    hints:
      - "ละอองเรณูเบาและมีจำนวนมาก เหมาะกับการถูกพัดไปไกล"
      - "ยอดเกสรที่ยาวฟูช่วยดักอะไรจากอากาศ"
    solution: "ดอกที่อาศัยลมไม่ต้องล่อสัตว์ จึงมีกลีบเล็ก ไม่มีกลิ่น แต่สร้างละอองเรณูเบาจำนวนมาก และมียอดเกสรเพศเมียยาวฟูไว้ดักละอองเรณูในอากาศ ดอกข้าวโพดจึงถ่ายเรณูด้วยลม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-propagation.p006
    topics: [biology.plants.reproduction-propagation]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "เมล็ดถั่วเขียวต้องการสิ่งใดในการงอก (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "น้ำ", correct: true }
      - { id: b, text: "แก๊สออกซิเจน", correct: true }
      - { id: c, text: "อุณหภูมิที่เหมาะสม", correct: true }
      - { id: d, text: "แสงแดด", feedback: "การเพาะถั่วงอกในที่มืดก็งอกได้ เมล็ดใช้อาหารสะสมในเมล็ด จึงยังไม่ต้องใช้แสง" }
      - { id: e, text: "ปุ๋ย", feedback: "เมล็ดมีอาหารสะสมเพียงพอสำหรับการงอก เพาะบนสำลีชื้นก็งอกได้" }
    hints:
      - "นึกถึงการเพาะถั่วงอกในโอ่งทึบ"
      - "เมล็ดที่จมอยู่ใต้น้ำนาน ๆ ขาดอะไร"
    solution: "เมล็ดต้องการน้ำ แก๊สออกซิเจน และอุณหภูมิที่เหมาะสม ใช้อาหารที่สะสมในเมล็ด จึงยังไม่ต้องใช้แสงหรือปุ๋ย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-propagation.p007
    topics: [biology.plants.reproduction-propagation]
    difficulty: 2
    type: numeric
    stem: "เพาะเมล็ดข้าวโพด 50 เมล็ด งอก 46 เมล็ด ร้อยละการงอกเป็นเท่าไร"
    answer: { value: 92, unit: "%" }
    hints:
      - "ร้อยละการงอก = เมล็ดที่งอก ÷ เมล็ดทั้งหมด × 100"
      - "46 ÷ 50 แล้วคูณ 100"
    misconceptions:
      - { match: 8, feedback: "นี่คือร้อยละของเมล็ดที่ไม่งอก (4 จาก 50)" }
      - { match: 46, feedback: "46 คือจำนวนเมล็ดที่งอก ต้องเทียบกับทั้งหมด 50 เมล็ดก่อน" }
    solution: "ร้อยละการงอก $= \\frac{46}{50} \\times 100 = 92\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-propagation.p008
    topics: [biology.plants.reproduction-propagation]
    difficulty: 3
    type: order
    stem: "เรียงลำดับเหตุการณ์ตั้งแต่การถ่ายเรณูจนเกิดผลของพืชดอก"
    items:
      - "ละอองเรณูตกบนยอดเกสรเพศเมีย"
      - "ละอองเรณูงอกหลอดละอองเรณูลงไปตามก้านเกสรเพศเมีย"
      - "หลอดละอองเรณูเข้าสู่ออวุล ปล่อยสเปิร์มนิวเคลียส 2 นิวเคลียส"
      - "เกิดการปฏิสนธิซ้อน ได้ไซโกตและเอนโดสเปิร์ม"
      - "ออวุลเจริญเป็นเมล็ด รังไข่เจริญเป็นผล"
    hints:
      - "เริ่มจากด้านบนของเกสรเพศเมียลงไปหาออวุล"
      - "การปฏิสนธิเกิดในออวุล หลังจากหลอดละอองเรณูไปถึง"
    solution: "การถ่ายเรณู → งอกหลอดละอองเรณู → หลอดถึงออวุล → ปฏิสนธิซ้อน → ออวุลเป็นเมล็ด รังไข่เป็นผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-propagation.p009
    topics: [biology.plants.reproduction-propagation]
    difficulty: 3
    type: match
    stem: "จับคู่การรวมกันในการปฏิสนธิซ้อนกับผลที่ได้"
    pairs:
      - { left: "สเปิร์มนิวเคลียส + เซลล์ไข่", right: "ไซโกต" }
      - { left: "สเปิร์มนิวเคลียส + โพลาร์นิวคลีไอ", right: "เอนโดสเปิร์ม" }
      - { left: "ไซโกตที่แบ่งเซลล์และเจริญต่อ", right: "เอ็มบริโอ (ต้นอ่อนในเมล็ด)" }
    hints:
      - "เซลล์ไข่ที่ได้รับการปฏิสนธิจะกลายเป็นต้นอ่อน"
      - "อาหารสะสมในเมล็ดเกิดจากการรวมกับนิวเคลียสอีกคู่หนึ่ง"
    solution: "สเปิร์มนิวเคลียสหนึ่งรวมกับเซลล์ไข่ได้ไซโกต ซึ่งเจริญเป็นเอ็มบริโอ อีกนิวเคลียสหนึ่งรวมกับโพลาร์นิวคลีไอได้เอนโดสเปิร์ม เป็นอาหารสะสมของเมล็ด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-propagation.p010
    topics: [biology.plants.reproduction-propagation]
    difficulty: 3
    type: mcq
    stem: "ป้าต้องการปลูกมะม่วงน้ำดอกไม้ในบ้าน ให้ผลรสเหมือนต้นที่บ้านเพื่อนทุกอย่างและออกผลเร็ว ควรใช้วิธีใด"
    choices:
      - { id: a, text: "ตอนกิ่งจากต้นของเพื่อน", correct: true }
      - { id: b, text: "เพาะเมล็ดจากผลมะม่วงต้นของเพื่อน", feedback: "ต้นจากเมล็ดได้ลักษณะจากทั้งสองฝ่าย อาจรสไม่เหมือนต้นแม่ และใช้เวลานานกว่าจะออกผล" }
      - { id: c, text: "เด็ดใบมะม่วงไปปักชำ", feedback: "มะม่วงไม่สามารถงอกเป็นต้นใหม่จากใบได้" }
      - { id: d, text: "ถ่ายเรณูด้วยมือแล้วเพาะเมล็ด", feedback: "ยังเป็นการสืบพันธุ์แบบอาศัยเพศ ลักษณะของลูกจึงอาจต่างจากต้นแม่" }
    hints:
      - "ต้องการต้นที่เหมือนต้นแม่ทุกอย่าง ต้องใช้แบบอาศัยเพศหรือไม่อาศัยเพศ"
      - "วิธีใดทำให้กิ่งออกรากขณะยังติดอยู่กับต้นแม่"
    solution: "ตอนกิ่งเป็นการขยายพันธุ์แบบไม่อาศัยเพศ ต้นใหม่จึงเหมือนต้นแม่ทุกอย่าง และเป็นกิ่งที่โตแล้วจึงออกผลเร็ว (เสียบยอดหรือติดตาบนต้นตอก็ใช้ได้เช่นกัน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-propagation.p011
    topics: [biology.plants.reproduction-propagation]
    difficulty: 3
    type: mcq
    stem: "ชาวสวนลำไยในภาคเหนือนำรังผึ้งมาวางในสวนช่วงที่ลำไยออกดอก เพราะเหตุใด"
    choices:
      - { id: a, text: "ผึ้งช่วยถ่ายเรณู ทำให้ดอกลำไยติดผลมากขึ้น", correct: true }
      - { id: b, text: "ผึ้งช่วยกินแมลงศัตรูพืช", feedback: "ผึ้งกินน้ำหวานและละอองเรณู ไม่ได้กินแมลงอื่น" }
      - { id: c, text: "ผึ้งช่วยรดน้ำให้ดอก", feedback: "ผึ้งไม่ได้ให้น้ำแก่ดอก แต่พาละอองเรณูจากดอกหนึ่งไปอีกดอกหนึ่ง" }
      - { id: d, text: "ผึ้งทำให้ผลลำไยหวานขึ้น", feedback: "ความหวานของผลขึ้นกับพันธุ์และการดูแล ผึ้งช่วยในขั้นการถ่ายเรณูก่อนเกิดผล" }
    hints:
      - "ผึ้งบินไปหาน้ำหวานจากดอกหลาย ๆ ดอก"
      - "ละอองเรณูติดตัวผึ้งไปตกที่ไหน"
    solution: "ผึ้งพาละอองเรณูไปตกบนยอดเกสรเพศเมียของดอกอื่น ดอกจึงได้รับการปฏิสนธิและติดผลมากขึ้น ชาวสวนจึงควรเลี่ยงการฉีดยาฆ่าแมลงช่วงออกดอก เพื่อไม่ทำลายสัตว์ที่ช่วยถ่ายเรณู"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-propagation.p012
    topics: [biology.plants.reproduction-propagation]
    difficulty: 4
    type: numeric
    stem: "ห้องปฏิบัติการเพาะเลี้ยงเนื้อเยื่อกล้วยไม้ เริ่มจากต้นอ่อน 1 ต้น ทุกรอบการเลี้ยง (4 สัปดาห์) ต้นอ่อนแต่ละต้นแตกเป็น 4 ต้น เมื่อครบ 5 รอบจะได้ต้นอ่อนกี่ต้น"
    answer: { value: 1024, unit: ต้น }
    hints:
      - "รอบแรกได้ 4 ต้น รอบที่สองแต่ละต้นแตกเป็น 4 อีก"
      - "จำนวนต้นคูณด้วย 4 ทุกรอบ ครบ 5 รอบคือ 4 คูณกันกี่ครั้ง"
    misconceptions:
      - { match: 20, feedback: "บวกเพิ่มรอบละ 4 แต่ต้นอ่อนทุกต้นแตกเป็น 4 จำนวนจึงเพิ่มแบบคูณ" }
      - { match: 256, feedback: "นับได้เพียง 4 รอบ ต้องคูณ 4 ทั้งหมด 5 ครั้ง" }
