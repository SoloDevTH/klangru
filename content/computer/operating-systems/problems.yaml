    difficulty: 5
    type: mcq
    stem: "โปรแกรม A ขอใช้เครื่องสแกนได้แล้ว และกำลังรอเครื่องพิมพ์ ขณะที่โปรแกรม B ขอใช้เครื่องพิมพ์ได้แล้ว และกำลังรอเครื่องสแกน ทั้งสองค้างอยู่อย่างนั้น ข้อใดอธิบายและป้องกันได้ถูกต้อง"
    choices:
      - { id: a, text: "เป็นภาวะติดตาย ป้องกันได้โดยกำหนดให้ทุกโปรแกรมขออุปกรณ์ตามลำดับเดียวกัน เช่น ขอเครื่องสแกนก่อนเครื่องพิมพ์เสมอ", correct: true }
      - { id: b, text: "เป็นเพราะหน่วยความจำไม่พอ แก้โดยเพิ่ม RAM", feedback: "ปัญหาอยู่ที่ต่างฝ่ายถือทรัพยากรและรอของอีกฝ่าย RAM เพิ่มไม่ช่วย" }
      - { id: c, text: "รอไปเรื่อย ๆ เดี๋ยวก็หายเอง", feedback: "ทั้งสองฝ่ายรอกันและไม่มีใครปล่อยก่อน จึงรอได้ตลอดไป" }
      - { id: d, text: "เป็นเพราะใช้การจัดคิวแบบวนรอบ ต้องเปลี่ยนเป็นมาก่อนได้ก่อน", feedback: "การจัดคิวหน่วยประมวลผลไม่ได้แก้ปัญหาการถืออุปกรณ์แล้วรอกัน" }
    hints:
      - "สังเกตว่าแต่ละโปรแกรมถืออะไรไว้และรออะไร"
      - "ถ้าทุกโปรแกรมขออุปกรณ์ตามลำดับเดียวกัน จะเกิดวงรอกันได้หรือไม่"
    solution: "A ถือเครื่องสแกนรอเครื่องพิมพ์ B ถือเครื่องพิมพ์รอเครื่องสแกน เกิดวงรอกันจึงติดตาย ถ้าทุกโปรแกรมต้องขอเครื่องสแกนก่อนเสมอ B จะไม่ได้เครื่องพิมพ์ก่อนเครื่องสแกน วงรอจึงเกิดไม่ได้"
