  - id: computer.programming.collections.p016
    topics: [computer.programming.collections]
    difficulty: 5
    type: code
    stem: |
      เขียนฟังก์ชัน `rotate_clockwise(grid)` ที่รับกริดสี่เหลี่ยมเป็นลิสต์ซ้อน และ **คืนค่า** กริดใหม่ที่หมุนตามเข็มนาฬิกา 90 องศา โดยไม่แก้กริดเดิม เช่น แถวแรกของผลลัพธ์คือคอลัมน์ซ้ายสุดของกริดเดิมอ่านจากล่างขึ้นบน
    starter: |
      def rotate_clockwise(grid):
          pass
    tests: |
      g = [[1, 2], [3, 4]]
      r = rotate_clockwise(g)
      assert r is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return"
      assert r == [[3, 1], [4, 2]], f"rotate_clockwise([[1, 2], [3, 4]]) ควรได้ [[3, 1], [4, 2]] แต่ได้ {r}"
      assert g == [[1, 2], [3, 4]], "ห้ามแก้กริดเดิม กริด g ต้องไม่เปลี่ยน"
      r2 = rotate_clockwise([[1, 2, 3], [4, 5, 6]])
      assert r2 == [[4, 1], [5, 2], [6, 3]], f"กริดสองแถวสามคอลัมน์ควรหมุนได้ [[4, 1], [5, 2], [6, 3]] แต่ได้ {r2}"
    reference: |
      def rotate_clockwise(grid):
          return [list(row) for row in zip(*grid[::-1])]
    hints:
      - "ลองเขียนกริดเดิมกับกริดที่หมุนแล้วบนกระดาษ แล้วดูว่าคอลัมน์ไหนกลายเป็นแถวไหน"
      - "กลับลำดับแถวก่อนด้วย `grid[::-1]` แล้ว `zip(*...)` จะได้คอลัมน์ที่เรียงเป็นแถว"
      - "แปลงทูเพิลที่ได้จาก `zip` กลับเป็นลิสต์ด้วย `list(row)` ทุกแถว"
    solution: "return [list(row) for row in zip(*grid[::-1])] กลับลำดับแถวก่อน แล้ว zip อ่านคอลัมน์เป็นแถว เช่น [[1, 2], [3, 4]] ได้ [[3, 1], [4, 2]]"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.collections.p017
    topics: [computer.programming.collections]
    difficulty: 5
    type: code
    stem: |
      ฝ่ายบัญชีของร้านมีรายการยอดขายเป็นคู่ `(สาขา, ยอด)` เขียนฟังก์ชัน `group_by_key(records)` ที่รับลิสต์ของคู่เหล่านี้ และ **คืนค่า** ดิกชันนารีที่คีย์คือชื่อสาขา ค่าคือลิสต์ของยอดขายของสาขานั้นตามลำดับที่พบ ถ้า records ว่างให้คืน `{}`
    starter: |
      def group_by_key(records):
          pass
    tests: |
      r = group_by_key([("สีลม", 120), ("ท่าพระ", 80), ("สีลม", 45)])
      assert r is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return"
      assert r == {"สีลม": [120, 45], "ท่าพระ": [80]}, f"ผลการจัดกลุ่มไม่ถูก ได้ {r}"
      assert group_by_key([]) == {}, f"รายการว่างควรคืน {{}} แต่ได้ {group_by_key([])}"
      assert group_by_key([("ก", 1)]) == {"ก": [1]}, "สาขาเดียวที่มีรายการเดียวควรได้ลิสต์ที่มีหนึ่งค่า"
    reference: |
      def group_by_key(records):
          out = {}
          for key, value in records:
              out.setdefault(key, []).append(value)
          return out
    hints:
      - "สร้างดิกชันนารีว่างแล้ววนผ่านคู่ทีละคู่"
      - "`setdefault(คีย์, [])` คืนลิสต์ของคีย์นั้นเสมอ ทำให้ต่อท้ายด้วย `append` ได้โดยไม่ต้องตรวจก่อน"
    solution: "สร้าง out = {} แล้ววน for key, value in records และทำ out.setdefault(key, []).append(value) ก่อน return out"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.programming.collections.p018
    topics: [computer.programming.collections]
    difficulty: 5
    type: code
    stem: |
      เขียนฟังก์ชัน `top_students(data, n)` โดย `data` เป็นดิกชันนารีซ้อนที่คีย์คือชื่อ และค่าคือดิกชันนารีที่มี `"math"` กับ `"eng"` ให้คำนวณคะแนนเฉลี่ยของแต่ละคน แล้ว **คืนค่า** ลิสต์ชื่อของ `n` คนที่คะแนนเฉลี่ยสูงสุด เรียงจากมากไปน้อย ถ้าคะแนนเฉลี่ยเท่ากันให้เรียงตามชื่อจากน้อยไปมาก
    starter: |
      def top_students(data, n):
          pass
    tests: |
      d = {"ฟ้า": {"math": 18, "eng": 15}, "ต้น": {"math": 12, "eng": 20}, "มด": {"math": 17, "eng": 16}}
      r = top_students(d, 2)
      assert r is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return"
      assert r == ["ฟ้า", "มด"], f"top_students(d, 2) ควรได้ ['ฟ้า', 'มด'] (ฟ้าและมดเฉลี่ย 16.5 เท่ากัน เรียงตามชื่อ) แต่ได้ {r}"
      assert top_students(d, 1) == ["ฟ้า"], f"top_students(d, 1) ควรได้ ['ฟ้า'] แต่ได้ {top_students(d, 1)}"
      assert top_students(d, 3) == ["ฟ้า", "มด", "ต้น"], f"top_students(d, 3) ควรได้ ['ฟ้า', 'มด', 'ต้น'] แต่ได้ {top_students(d, 3)}"
    reference: |
      def top_students(data, n):
          ranked = sorted(data, key=lambda k: (-(data[k]["math"] + data[k]["eng"]) / 2, k))
          return ranked[:n]
    hints:
      - "คำนวณค่าเฉลี่ยจาก `(math + eng) / 2` แล้วใช้เป็นส่วนหนึ่งของคีย์การเรียง"
      - "ทำคีย์เป็นทูเพิลที่มีค่าเฉลี่ยติดเครื่องหมายลบ และตามด้วยชื่อ แล้วตัดเอา n ตัวแรกด้วยการตัดช่วง"
    solution: "return sorted(data, key=lambda k: (-(data[k][\"math\"] + data[k][\"eng\"]) / 2, k))[:n] ค่าเฉลี่ยมากสุดอยู่ก่อนและเมื่อเท่ากันเรียงตามชื่อ"
    license: CC-BY-SA-4.0
    ai_assisted: true
