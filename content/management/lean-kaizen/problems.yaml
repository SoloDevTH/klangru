  - id: mgt.lean.p023
    topics: [management.operations.lean]
    difficulty: 3
    type: expression
    stem: "กะทำงานยาว $H$ ชั่วโมง มีเวลาพัก $b$ นาที และลูกค้าต้องการ $D$ ชิ้นต่อกะ เขียนสูตรเวลาแท็กต์ในหน่วย **วินาที** ต่อชิ้น"
    prefix: "แท็กต์ ="
    answer: { latex: "\\frac{60\\cdot(60H-b)}{D}", variables: [H, b, D] }
    misconceptions:
      - { match: "\\frac{3600H}{D}", feedback: "ยังไม่ได้หักเวลาพัก $b$ นาทีออกจากเวลากะ" }
      - { match: "\\frac{60H-b}{D}", feedback: "นั่นคือเวลาแท็กต์ในหน่วยนาที ต้องคูณ 60 เพื่อแปลงเป็นวินาที" }
    hints:
      - "แปลงเวลากะเป็นนาทีก่อน ($60H$) แล้วหักเวลาพัก"
      - "แปลงนาทีเป็นวินาที แล้วหารด้วยความต้องการ"
    solution: "เวลาที่ใช้ได้ $= 60H - b$ นาที $= 60\\cdot(60H - b)$ วินาที ดังนั้น เวลาแท็กต์ $= \\dfrac{60\\cdot(60H - b)}{D}$ วินาทีต่อชิ้น เช่น $H = 8$, $b = 30$, $D = 900$ ได้ 30 วินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true
