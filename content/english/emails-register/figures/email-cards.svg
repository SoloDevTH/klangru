<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="sans-serif">
<title>อีเมลสองฉบับถึงครูเรื่องการส่งรายงาน</title>
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<rect x="20" y="56" width="350" height="340" rx="6" fill="#fffdf6" stroke="#555" stroke-width="1.5"/>
<text x="195.0" y="42" font-size="17" fill="#111" text-anchor="middle" font-weight="bold">อีเมล ก</text>
<text x="40" y="96" font-size="15" fill="#111" text-anchor="start" font-weight="normal">Subject: Homework deadline</text>
<text x="40" y="148" font-size="15" fill="#111" text-anchor="start" font-weight="normal">Dear Mr Lee,</text>
<text x="40" y="174" font-size="15" fill="#111" text-anchor="start" font-weight="normal">I'm writing to ask whether I could hand in my</text>
<text x="40" y="200" font-size="15" fill="#111" text-anchor="start" font-weight="normal">report on Monday instead of Friday.</text>
<text x="40" y="226" font-size="15" fill="#111" text-anchor="start" font-weight="normal">I would be grateful for your advice.</text>
<text x="40" y="252" font-size="15" fill="#111" text-anchor="start" font-weight="normal">Thank you for your time.</text>
<text x="40" y="304" font-size="15" fill="#111" text-anchor="start" font-weight="normal">Yours sincerely,</text>
<text x="40" y="330" font-size="15" fill="#111" text-anchor="start" font-weight="normal">Pim</text>
<rect x="390" y="56" width="350" height="340" rx="6" fill="#fffdf6" stroke="#555" stroke-width="1.5"/>
<text x="565.0" y="42" font-size="17" fill="#111" text-anchor="middle" font-weight="bold">อีเมล ข</text>
<text x="410" y="96" font-size="15" fill="#111" text-anchor="start" font-weight="normal">Subject: homework??</text>
<text x="410" y="148" font-size="15" fill="#111" text-anchor="start" font-weight="normal">hey sir, can i hand it in on monday</text>
<text x="410" y="174" font-size="15" fill="#111" text-anchor="start" font-weight="normal">instead of friday?? pls tell me</text>
<text x="410" y="200" font-size="15" fill="#111" text-anchor="start" font-weight="normal">asap. thx!!</text>
<text x="410" y="252" font-size="15" fill="#111" text-anchor="start" font-weight="normal">pim</text>
<text x="20" y="418" font-size="13" fill="#444" text-anchor="start" font-weight="normal">ทั้งสองฉบับส่งถึงครูประจำวิชาเดียวกัน</text>
</svg>
