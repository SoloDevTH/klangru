    stem: "โรงงานน้ำแข็งทดลองเปลี่ยนวิธีล้างถังเก็บน้ำ 2 เดือน ผลตรวจเชื้อผ่านเกณฑ์ทุกครั้งและดีกว่าวิธีเดิม ในขั้น A (Act) ของวงจร PDCA ควรทำสิ่งใดเป็นอันดับแรก"
    choices:
      - { id: a, text: "เขียนวิธีล้างใหม่เป็นขั้นตอนมาตรฐาน อบรมพนักงานทุกกะ แล้วหาเรื่องที่จะปรับปรุงในรอบถัดไป", correct: true }
      - { id: b, text: "กลับไปใช้วิธีเดิม เพราะการทดลองจบแล้ว", feedback: "ถ้าวิธีใหม่ได้ผลแต่ไม่ทำเป็นมาตรฐาน พนักงานจะกลับไปทำแบบเดิมและปัญหาจะกลับมา" }
      - { id: c, text: "ทดลองต่ออีก 2 เดือนโดยไม่บันทึกอะไร", feedback: "ผลชัดเจนแล้ว และการทดลองโดยไม่เก็บข้อมูลไม่ช่วยให้เรียนรู้อะไรเพิ่ม" }
      - { id: d, text: "ลดการตรวจเชื้อลงเพราะผ่านเกณฑ์แล้ว", feedback: "การตรวจเชื้อยังจำเป็นเพื่อยืนยันว่าวิธีใหม่ได้ผลต่อเนื่อง ขั้น A คือการทำเป็นมาตรฐาน ไม่ใช่การเลิกวัดผล" }
