id: earthscience.atmosphere.greenhouse-climate-intro
subject: earthscience
title: { th: ปรากฏการณ์เรือนกระจกและการเปลี่ยนแปลงภูมิอากาศเบื้องต้น, en: "The greenhouse effect and climate change: an introduction" }
summary: แก๊สเรือนกระจกกับการกักเก็บความร้อน กิจกรรมของมนุษย์ที่เพิ่มแก๊สเรือนกระจก สถานการณ์และผลกระทบของการเปลี่ยนแปลงภูมิอากาศ และการลดแก๊สเรือนกระจกกับการปรับตัว
difficulty: 2.8
minutes: 35
prerequisites: [earthscience.atmosphere.air-wind]
encompasses:
  - { id: earthscience.atmosphere.air-wind, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ปรากฏการณ์เรือนกระจก
    src: greenhouse-model.svg
    alt: "ดวงอาทิตย์อยู่ในอวกาศด้านซ้ายบน ลูกศรสีเหลืองสองเส้นส่องผ่านบรรยากาศลงถึงผิวโลก เขียนว่า แสงอาทิตย์ผ่านเข้ามา ทำให้ผิวโลกอุ่น ในบรรยากาศมีจุดสีเทาแทนแก๊สเรือนกระจก เส้นหยักสีแดงจากผิวโลกแทนรังสีอินฟราเรด เส้นหนึ่งผ่านออกสู่อวกาศ เขียนว่า ความร้อนบางส่วนออกสู่อวกาศ อีกเส้นขึ้นไปแล้วถูกแก๊สเรือนกระจกดูดกลืนและแผ่กลับลงมาที่ผิวโลก"
    caption: "แสงอาทิตย์ผ่านเข้ามาได้ง่าย แต่รังสีอินฟราเรดจากผิวโลกถูกแก๊สเรือนกระจกดูดกลืนไว้ส่วนหนึ่ง (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: แบบจำลองเรือนกระจกด้วยผ้าห่ม
    problem: "ตอนกลางคืน คนที่ห่มผ้าห่มรู้สึกอุ่นกว่าคนที่ไม่ห่ม ใช้แบบจำลองนี้อธิบายว่าแก๊สเรือนกระจกทำให้ผิวโลกอุ่นได้อย่างไร และแบบจำลองนี้ต่างจากของจริงอย่างไร"
    steps:
      - text: "ร่างกายเปรียบเหมือนผิวโลกที่แผ่ความร้อนออกมา"
      - text: "ผ้าห่มเปรียบเหมือนแก๊สเรือนกระจก ทำให้ความร้อนออกไปได้ช้าลง ร่างกายจึงอุ่น"
        why: "ผิวโลกยังได้รับพลังงานจากดวงอาทิตย์ตลอด เมื่อความร้อนออกได้ช้าลง อุณหภูมิจึงสูงขึ้นจนสมดุลใหม่"
      - text: "ผ้าห่มหนาขึ้นเปรียบเหมือนแก๊สเรือนกระจกที่มากขึ้น ยิ่งอุ่นขึ้น"
      - text: "ข้อต่าง: ผ้าห่มกันลมและกันอากาศร้อนไม่ให้ลอยออกไป แต่แก๊สเรือนกระจกดูดกลืนรังสีอินฟราเรดแล้วแผ่กลับลงมา"
    answer: "แก๊สเรือนกระจกทำให้ความร้อนจากผิวโลกออกสู่อวกาศได้ช้าลง ผิวโลกจึงอุ่นขึ้น ยิ่งแก๊สมาก ยิ่งอุ่น"
  - { type: check, problem: earthscience.atmosphere.greenhouse-climate-intro.p002, prompt: "ถ้าไม่มีผ้าห่มเลย" }
  - type: figure
    title: คาร์บอนไดออกไซด์ในบรรยากาศ
    src: co2-mauna-loa.svg
    alt: "กราฟเส้นคาร์บอนไดออกไซด์เฉลี่ยรายปีที่หอสังเกตการณ์เมานาโลอา ข้อมูล NOAA แกนนอนปี ค.ศ. 1959 ถึง 2025 แกนตั้ง 260 ถึง 440 ppm เส้นสีแดงเพิ่มขึ้นตลอดจากราว 316 ppm ใน ค.ศ. 1959 ผ่านราว 339 ใน ค.ศ. 1980 ราว 370 ใน ค.ศ. 2000 ราว 414 ใน ค.ศ. 2020 ถึงราว 427 ใน ค.ศ. 2025 และชันขึ้นเรื่อย ๆ เส้นประสีเขียวที่ 280 ppm คือระดับก่อนยุคอุตสาหกรรม"
    caption: "ค่าเฉลี่ยรายปีจาก NOAA Global Monitoring Laboratory ระดับก่อนยุคอุตสาหกรรมจากการวัดฟองอากาศในแกนน้ำแข็ง (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: คาร์บอนไดออกไซด์จากการเดินทาง
    problem: "สมมติว่ารถยนต์คันหนึ่งใช้น้ำมัน 1 ลิตรต่อการวิ่ง 12 กิโลเมตร และน้ำมัน 1 ลิตรเผาแล้วได้คาร์บอนไดออกไซด์ราว 2.3 กิโลกรัม ถ้าขับรถไปกลับโรงเรียนวันละ 6 กิโลเมตร ใน 20 วันจะปล่อยคาร์บอนไดออกไซด์เท่าไร"
    steps:
      - text: "ระยะทางรวม $6 \\times 20 = 120$ กิโลเมตร"
      - text: "น้ำมันที่ใช้ $120 \\div 12 = 10$ ลิตร"
      - text: "คาร์บอนไดออกไซด์ $10 \\times 2.3 = 23$ กิโลกรัม"
        why: "คาร์บอนในน้ำมันรวมกับออกซิเจนในอากาศ แก๊สที่ได้จึงหนักกว่าน้ำมันที่เผา"
      - text: "ถ้าเปลี่ยนเป็นปั่นจักรยานหรือเดิน จะลดคาร์บอนไดออกไซด์ส่วนนี้ได้เกือบทั้งหมด"
    answer: "ประมาณ 23 กิโลกรัม"
  - { type: check, problem: earthscience.atmosphere.greenhouse-climate-intro.p011, prompt: "ปรับตัวกับลดแก๊สต่างกันอย่างไร" }
  - type: simulation
    title: "ปรากฏการณ์เรือนกระจก (PhET Greenhouse Effect)"
    url: https://phet.colorado.edu/en/simulations/greenhouse-effect
    provider: phet
    note: "เริ่มจากไม่มีแก๊สเรือนกระจก แล้วค่อย ๆ เพิ่มความเข้มข้น สังเกตว่าแสงอาทิตย์ (สีเหลือง) ผ่านลงมาได้ ส่วนอินฟราเรด (สีแดง) ถูกดูดกลืนและแผ่กลับลงมามากขึ้น และอุณหภูมิผิวโลกสูงขึ้น"
glossary:
  - { term: ปรากฏการณ์เรือนกระจก, definition: "การที่แก๊สในบรรยากาศดูดกลืนรังสีอินฟราเรดจากผิวโลกแล้วแผ่ส่วนหนึ่งกลับลงมา ทำให้ผิวโลกอุ่น" }
  - { term: แก๊สเรือนกระจก, definition: "แก๊สที่ดูดกลืนรังสีอินฟราเรด เช่น ไอน้ำ คาร์บอนไดออกไซด์ มีเทน ไนตรัสออกไซด์" }
  - { term: ภูมิอากาศ, definition: "สภาพลมฟ้าอากาศเฉลี่ยของพื้นที่หนึ่งในระยะยาวหลายสิบปี" }
  - { term: การเปลี่ยนแปลงภูมิอากาศ, definition: "การเปลี่ยนแปลงของภูมิอากาศในระยะยาว ปัจจุบันเกิดจากกิจกรรมของมนุษย์ที่เพิ่มแก๊สเรือนกระจกเป็นหลัก" }
  - { term: ปะการังฟอกขาว, definition: "การที่ปะการังซีดขาวเพราะสาหร่ายที่อาศัยร่วมกันออกไปเมื่อน้ำทะเลร้อนผิดปกติ" }
  - { term: IPCC, definition: "คณะกรรมการระหว่างรัฐบาลว่าด้วยการเปลี่ยนแปลงสภาพภูมิอากาศ ประเมินและสรุปงานวิจัยด้านภูมิอากาศจากทั่วโลก" }
flashcards:
  - { front: "แก๊สเรือนกระจกที่สำคัญ", back: "ไอน้ำ คาร์บอนไดออกไซด์ มีเทน ไนตรัสออกไซด์ ซีเอฟซี" }
  - { front: "แหล่งคาร์บอนไดออกไซด์ที่ใหญ่ที่สุดจากมนุษย์", back: "การเผาเชื้อเพลิงซากดึกดำบรรพ์ ถ่านหิน น้ำมัน แก๊สธรรมชาติ" }
  - { front: "IPCC สรุปเรื่องโลกร้อนว่าอย่างไร", back: "ชัดเจนแน่นอนว่ามนุษย์ทำให้โลกร้อนขึ้น ช่วง ค.ศ. 2011–2020 อุ่นกว่า ค.ศ. 1850–1900 ราว 1.1 °C" }
  - { front: "ลดแก๊สกับปรับตัวต่างกันอย่างไร", back: "ลดแก๊สคือลดสาเหตุ เช่น ประหยัดไฟ ปรับตัวคือรับมือผลกระทบ เช่น เก็บน้ำ ระวังคลื่นความร้อน" }
