  - id: computer.algorithms.design-strategies.p016
    topics: [computer.algorithms.design-strategies]
    difficulty: 4
    type: code
    stem: |
      เขียนฟังก์ชัน `merge_sort(nums)` ด้วยกลยุทธ์แบ่งแยกและเอาชนะ ที่แบ่งลิสต์เป็นสองครึ่ง เรียงแต่ละครึ่งด้วยการเรียกตัวเอง แล้วรวมสองครึ่งที่เรียงแล้ว และ **คืนค่า** ลิสต์ใหม่ที่เรียงจากน้อยไปมาก ห้ามใช้ `sorted` หรือ `sort`
    starter: |
      def merge_sort(nums):
          pass
    tests: |
      r = merge_sort([5, 2, 9, 1])
      assert r is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return"
      assert r == [1, 2, 5, 9], f"merge_sort([5, 2, 9, 1]) ควรได้ [1, 2, 5, 9] แต่ได้ {r}"
      assert merge_sort([]) == [], f"รายการว่างควรได้ [] แต่ได้ {merge_sort([])}"
      assert merge_sort([3, 3, 1]) == [1, 3, 3], f"ค่าซ้ำต้องคงไว้ครบ merge_sort([3, 3, 1]) ควรได้ [1, 3, 3] แต่ได้ {merge_sort([3, 3, 1])}"
      assert merge_sort([-2, 0, -5]) == [-5, -2, 0], f"ค่าลบต้องเรียงถูกต้อง ได้ {merge_sort([-2, 0, -5])}"
    reference: |
      def merge_sort(nums):
          if len(nums) <= 1:
              return list(nums)
          mid = len(nums) // 2
          left = merge_sort(nums[:mid])
          right = merge_sort(nums[mid:])
          out = []
          i = j = 0
          while i < len(left) and j < len(right):
              if left[i] <= right[j]:
                  out.append(left[i])
                  i += 1
              else:
                  out.append(right[j])
                  j += 1
          out.extend(left[i:])
          out.extend(right[j:])
          return out
    hints:
      - "กรณีฐานคือรายการที่มีหนึ่งตัวหรือไม่มีเลย ซึ่งเรียงแล้วอยู่แล้ว"
      - "ในการรวม ใช้ดัชนีสองตัวชี้หัวของสองครึ่ง แล้วเลือกตัวที่เล็กกว่าใส่ผลลัพธ์"
    solution: "แบ่งที่ mid แล้วเรียก merge_sort กับทั้งสองครึ่ง จากนั้นรวมด้วยดัชนีสองตัวและต่อส่วนที่เหลือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.design-strategies.p017
    topics: [computer.algorithms.design-strategies]
    difficulty: 5
    type: code
    stem: |
      เขียนฟังก์ชัน `min_coins(coins, amount)` ที่รับลิสต์ของชนิดเหรียญและจำนวนเงินเป็นจำนวนเต็ม แล้ว **คืนค่า** จำนวนเหรียญน้อยที่สุดที่รวมเป็นจำนวนเงินนั้นได้ ใช้กำหนดการพลวัตด้วยตารางจากค่าเล็กไปใหญ่ ถ้ารวมไม่ได้ให้คืน `-1` และถ้าจำนวนเงินเป็น 0 ให้คืน 0
    starter: |
      def min_coins(coins, amount):
          pass
    tests: |
      r = min_coins([1, 3, 4], 6)
      assert r is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return"
      assert r == 2, f"min_coins([1, 3, 4], 6) ควรได้ 2 (3 + 3) แต่ได้ {r}"
      assert min_coins([1, 5, 10], 27) == 5, f"min_coins([1, 5, 10], 27) ควรได้ 5 แต่ได้ {min_coins([1, 5, 10], 27)}"
      assert min_coins([2], 3) == -1, f"เหรียญ 2 รวมเป็น 3 ไม่ได้ ควรได้ -1 แต่ได้ {min_coins([2], 3)}"
      assert min_coins([1], 0) == 0, f"จำนวนเงิน 0 ควรได้ 0 แต่ได้ {min_coins([1], 0)}"
    reference: |
      def min_coins(coins, amount):
          INF = float("inf")
          best = [0] + [INF] * amount
          for a in range(1, amount + 1):
              for c in coins:
                  if c <= a and best[a - c] + 1 < best[a]:
                      best[a] = best[a - c] + 1
          return best[amount] if best[amount] != INF else -1
    hints:
      - "สร้างลิสต์ best ที่ best[a] คือจำนวนเหรียญน้อยที่สุดของจำนวนเงิน a เริ่มจาก best[0] = 0"
      - "สำหรับจำนวนเงิน a ลองใช้เหรียญ c แต่ละชนิดแล้วดูค่า best[a - c] + 1"
    solution: "สร้างตาราง best ขนาด amount + 1 ค่าเริ่มต้นเป็นอนันต์ยกเว้น best[0] = 0 แล้วในแต่ละจำนวนเงิน a ลองเหรียญทุกชนิดเพื่ออัปเดตค่าต่ำสุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.design-strategies.p018
    topics: [computer.algorithms.design-strategies]
    difficulty: 5
    type: code
    stem: |
      การเทียบทุกคู่ของรายการ `nums` เพื่อหาสองตำแหน่งที่รวมกันได้ค่า `target` ใช้เวลาประมาณ n ยกกำลังสอง เขียนฟังก์ชัน `has_pair_with_sum(nums, target)` ที่คืนค่า `True` ถ้ามีคู่ของสองตำแหน่งที่ต่างกันซึ่งรวมกันได้ `target` และคืนค่า `False` ถ้าไม่มี โดยใช้เซตที่เก็บค่าที่เห็นแล้วเพื่อให้เวลาประมาณ n ค่าเดียว
    starter: |
      def has_pair_with_sum(nums, target):
          pass
    tests: |
      assert has_pair_with_sum([3], 6) is False, "ตำแหน่งเดียวจับคู่กับตัวเองไม่ได้ ควรได้ False"
      assert has_pair_with_sum([3, 3], 6) is True, "สองตำแหน่งที่มีค่า 3 ทั้งคู่รวมได้ 6 ควรได้ True"
      assert has_pair_with_sum([1, 4, 7], 11) is True, "4 กับ 7 รวมได้ 11 ควรได้ True"
      assert has_pair_with_sum([1, 4, 7], 9) is False, "ไม่มีคู่ที่รวมได้ 9 ควรได้ False"
      big = list(range(50000))
      assert has_pair_with_sum(big, 99997) is True, "49998 กับ 49999 รวมได้ 99997 ควรได้ True และต้องเร็วพอ"
    reference: |
      def has_pair_with_sum(nums, target):
          seen = set()
          for x in nums:
              if target - x in seen:
                  return True
              seen.add(x)
          return False
    hints:
      - "สำหรับแต่ละค่า x ให้ตรวจว่า target - x เคยเห็นแล้วหรือไม่"
      - "ตรวจก่อนเพิ่ม x เข้าเซต เพื่อไม่ให้ตำแหน่งเดียวจับคู่กับตัวเองได้"
    solution: "วนค่า x ทีละค่า ถ้า target - x อยู่ในเซตที่เห็นแล้วคืน True มิฉะนั้นเพิ่ม x เข้าเซต ตรวจก่อนเพิ่มทำให้ [3] ได้ False และ [3, 3] ได้ True"
    license: CC-BY-SA-4.0
    ai_assisted: true
