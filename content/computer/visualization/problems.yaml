  - id: computer.data.visualization.p014
    topics: [computer.data.visualization]
    difficulty: 4
    type: code
    stem: |
      เขียนฟังก์ชัน `truncated_scale_ratio(a, b, baseline)` ที่รับค่าสองค่า `a` และ `b` กับค่าเริ่มต้นของแกน `baseline` แล้วคืนอัตราส่วนความยาวแท่งที่เห็นบนกราฟ คือ (b − baseline) ÷ (a − baseline) โดยสมมติว่า `a` มากกว่า `baseline`
    starter: |
      def truncated_scale_ratio(a, b, baseline):
          return 1.0
    tests: |
      assert abs(truncated_scale_ratio(92, 96, 90) - 3) < 1e-9, f"แกนเริ่มที่ 90 ควรได้ 3 แต่ได้ {truncated_scale_ratio(92, 96, 90)}"
      assert abs(truncated_scale_ratio(92, 96, 0) - 96 / 92) < 1e-9, f"แกนเริ่มที่ 0 ควรได้ {96 / 92} แต่ได้ {truncated_scale_ratio(92, 96, 0)}"
      assert abs(truncated_scale_ratio(480, 510, 470) - 4) < 1e-9, f"ควรได้ 4 แต่ได้ {truncated_scale_ratio(480, 510, 470)}"
    reference: |
      def truncated_scale_ratio(a, b, baseline):
          return (b - baseline) / (a - baseline)
    hints:
      - "ความยาวที่เห็นของแท่งคือค่าลบด้วย baseline"
      - "อัตราส่วนคือความยาวของแท่ง b หารด้วยความยาวของแท่ง a"
      - "ถ้า baseline เป็น 0 ผลลัพธ์จะเท่ากับ b ÷ a ตามปกติ"
    solution: "ความยาวที่เห็นของ a คือ a − baseline และของ b คือ b − baseline อัตราส่วนคือ (b − baseline) ÷ (a − baseline) ตัวอย่างแกนเริ่มที่ 90 ได้ 6 ÷ 2 = 3"
    license: CC-BY-SA-4.0
    ai_assisted: true

