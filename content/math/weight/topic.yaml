id: math.measure.weight
subject: math
title: { th: การชั่งน้ำหนัก, en: Measuring mass }
summary: เปรียบเทียบน้ำหนัก ชั่งเป็นกรัม ขีด กิโลกรัม เมตริกตัน เลือกเครื่องชั่ง อ่านหน้าปัด คาดคะเน เปลี่ยนหน่วย และแก้โจทย์ปัญหาน้ำหนัก
difficulty: 1.5
minutes: 30
prerequisites: [math.number.whole-add-sub]
encompasses:
  - { id: math.number.whole-add-sub, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: balance.svg
    alt: "ตาชั่งสองแขน คานเอียง จานด้านซ้ายมีมะม่วงและลดต่ำลง จานด้านขวามีส้มและยกสูงขึ้น"
    caption: "ข้างที่ลดต่ำลงหนักกว่า มะม่วงหนักกว่าส้ม"
  - { type: check, problem: math.measure.weight.p009, prompt: "เปลี่ยนเป็นกรัมก่อนเปรียบเทียบ" }
  - type: figure
    src: dial-scale.svg
    alt: "เครื่องชั่งสปริงแบบหน้าปัด ตัวเลข 0 ถึง 5 กิโลกรัมเรียงตามเข็มนาฬิกาเริ่มจาก 0 ด้านบน ระหว่างตัวเลขสองตัวติดกันแบ่งเป็น 10 ช่อง เข็มสีแดงชี้เลย 2 ไป 3 ช่อง ข้างภาพเขียนว่า ระหว่าง 2 กับ 3 แบ่งเป็น 10 ช่อง 1 ช่อง = 1 ขีด = 100 กรัม เข็มเลย 2 ไป 3 ช่อง อ่านได้ 2 กิโลกรัม 3 ขีด = 2,300 กรัม"
    caption: "หาค่าของ 1 ช่องก่อน แล้วนับช่องต่อจากตัวเลขที่เข็มเพิ่งเลยมา"
  - type: worked-example
    title: อ่านหน้าปัดที่แบ่ง 4 ช่อง
    problem: "หน้าปัดเครื่องชั่งระหว่าง 0 กับ 1 กิโลกรัมแบ่งเป็น 4 ช่องเท่ากัน เข็มชี้เลย 3 กิโลกรัมไป 3 ช่อง ของหนักกี่กรัม"
    steps:
      - text: "1 กิโลกรัม = 1,000 กรัม แบ่ง 4 ช่อง: ช่องละ $1{,}000 \\div 4 = 250$ กรัม"
        why: "ต้องรู้ค่าของ 1 ช่องก่อนจึงนับช่องได้"
      - text: "3 ช่อง $= 250 + 250 + 250 = 750$ กรัม"
      - text: "รวม 3 กิโลกรัม $= 3{,}000$ กรัม กับ 750 กรัม ได้ $3{,}750$ กรัม"
    answer: "3,750 กรัม (3 กิโลกรัม 750 กรัม)"
  - { type: check, problem: math.measure.weight.p006, prompt: "1 ช่องบนหน้าปัดนี้มีค่าเท่าไร" }
  - type: worked-example
    title: บวกน้ำหนักที่มีการทด
    problem: "ถุงแรกหนัก 1 กิโลกรัม 750 กรัม ถุงที่สองหนัก 2 กิโลกรัม 600 กรัม รวมหนักเท่าไร"
    steps:
      - text: "บวกกรัม: $750 + 600 = 1{,}350$ กรัม"
      - text: "1,350 กรัม เกิน 1,000 กรัม ทดเป็น 1 กิโลกรัม เหลือ 350 กรัม"
        why: "1,000 กรัม = 1 กิโลกรัม"
      - text: "บวกกิโลกรัม: $1 + 2 + 1 = 4$ กิโลกรัม"
      - text: "ตรวจด้วยกรัม: $1{,}750 + 2{,}600 = 4{,}350$ กรัม ✓"
    answer: "4 กิโลกรัม 350 กรัม"
glossary:
  - { term: กรัม, definition: "หน่วยน้ำหนักเล็ก 1,000 กรัม = 1 กิโลกรัม" }
  - { term: ขีด, definition: "หน่วยน้ำหนักที่ใช้ซื้อขายในไทย 1 ขีด = 100 กรัม และ 10 ขีด = 1 กิโลกรัม" }
  - { term: กิโลกรัม, definition: "หน่วยน้ำหนักมาตรฐาน 1 กิโลกรัม = 1,000 กรัม" }
  - { term: เมตริกตัน, definition: "หน่วยน้ำหนักของของหนักมาก 1 เมตริกตัน = 1,000 กิโลกรัม" }
  - { term: ตาชั่งสองแขน, definition: "เครื่องชั่งที่วางของเทียบกันสองข้าง ข้างที่ลดต่ำลงหนักกว่า" }
flashcards:
  - { front: "1 กิโลกรัม เท่ากับกี่กรัม", back: "1,000 กรัม" }
  - { front: "1 ขีด เท่ากับกี่กรัม", back: "100 กรัม (10 ขีด = 1 กิโลกรัม)" }
  - { front: "1 เมตริกตัน เท่ากับกี่กิโลกรัม", back: "1,000 กิโลกรัม" }
  - { front: "อ่านหน้าปัดเครื่องชั่งขั้นแรกทำอะไร", back: "หาว่า 1 ช่องมีค่าเท่าไร" }
