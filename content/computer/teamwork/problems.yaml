      - "ข้อมูลลับไม่ควรอยู่ในประวัติของคลัง"
    solution: "ข้อ a, b และ c ถูก คอมมิตเล็กพร้อมข้อความชัด ตรวจก่อนรวม และมีเอกสาร ข้อ d ทำให้รหัสผ่านรั่ว ข้อ e ทำให้กิ่งหลักพังบ่อย"
