<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 375" width="720" height="375" font-family="sans-serif">
<title>เติม e ท้ายคำ เสียงสระเปลี่ยนจากสั้นเป็นยาว</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7b3c"/></marker></defs>
<rect x="0" y="0" width="720" height="375" fill="#fff"/>
<text x="360.0" y="34.0" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">magic e: เติม e ท้ายคำ สระข้างหน้าออกเสียงยาวเหมือนชื่อตัวอักษร</text>
<text x="150.0" y="85.0" font-size="30" text-anchor="middle" fill="#1f4e9c" font-weight="bold">kit</text>
<text x="150.0" y="109.0" font-size="13" text-anchor="middle" fill="#555">ชุดอุปกรณ์ · สระเสียงสั้น อิ</text>
<line x1="250.0" y1="76.0" x2="420.0" y2="76.0" stroke="#1e7b3c" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="335.0" y="67.0" font-size="18" text-anchor="middle" fill="#1e7b3c" font-weight="bold">+ e</text>
<text x="530.0" y="85.0" font-size="30" text-anchor="end" fill="#c0392b" font-weight="bold">kit</text>
<text x="530.0" y="85.0" font-size="30" text-anchor="start" fill="#1e7b3c" font-weight="bold">e</text>
<text x="530.0" y="109.0" font-size="13" text-anchor="middle" fill="#555">ว่าว · สระเสียงยาว ไอ</text>
<text x="150.0" y="155.0" font-size="30" text-anchor="middle" fill="#1f4e9c" font-weight="bold">cap</text>
<text x="150.0" y="179.0" font-size="13" text-anchor="middle" fill="#555">หมวกแก๊ป · สระเสียงสั้น แอ</text>
<line x1="250.0" y1="146.0" x2="420.0" y2="146.0" stroke="#1e7b3c" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="335.0" y="137.0" font-size="18" text-anchor="middle" fill="#1e7b3c" font-weight="bold">+ e</text>
<text x="530.0" y="155.0" font-size="30" text-anchor="end" fill="#c0392b" font-weight="bold">cap</text>
<text x="530.0" y="155.0" font-size="30" text-anchor="start" fill="#1e7b3c" font-weight="bold">e</text>
<text x="530.0" y="179.0" font-size="13" text-anchor="middle" fill="#555">เสื้อคลุม · สระเสียงยาว เอ</text>
<text x="150.0" y="225.0" font-size="30" text-anchor="middle" fill="#1f4e9c" font-weight="bold">hop</text>
<text x="150.0" y="249.0" font-size="13" text-anchor="middle" fill="#555">กระโดด · สระเสียงสั้น เอาะ</text>
<line x1="250.0" y1="216.0" x2="420.0" y2="216.0" stroke="#1e7b3c" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="335.0" y="207.0" font-size="18" text-anchor="middle" fill="#1e7b3c" font-weight="bold">+ e</text>
<text x="530.0" y="225.0" font-size="30" text-anchor="end" fill="#c0392b" font-weight="bold">hop</text>
<text x="530.0" y="225.0" font-size="30" text-anchor="start" fill="#1e7b3c" font-weight="bold">e</text>
<text x="530.0" y="249.0" font-size="13" text-anchor="middle" fill="#555">หวัง · สระเสียงยาว โอ</text>
<text x="150.0" y="295.0" font-size="30" text-anchor="middle" fill="#1f4e9c" font-weight="bold">cut</text>
<text x="150.0" y="319.0" font-size="13" text-anchor="middle" fill="#555">ตัด · สระเสียงสั้น อะ</text>
<line x1="250.0" y1="286.0" x2="420.0" y2="286.0" stroke="#1e7b3c" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="335.0" y="277.0" font-size="18" text-anchor="middle" fill="#1e7b3c" font-weight="bold">+ e</text>
<text x="530.0" y="295.0" font-size="30" text-anchor="end" fill="#c0392b" font-weight="bold">cut</text>
<text x="530.0" y="295.0" font-size="30" text-anchor="start" fill="#1e7b3c" font-weight="bold">e</text>
<text x="530.0" y="319.0" font-size="13" text-anchor="middle" fill="#555">น่ารัก · สระเสียงยาว ยู</text>
<text x="360.0" y="369.0" font-size="15" text-anchor="middle" fill="#111">ตัว e ท้ายคำไม่ออกเสียง แต่ทำให้สระตัวก่อนหน้า “พูดชื่อตัวเอง”</text>
</svg>
