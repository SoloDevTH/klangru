  - { title: "5.2 Vector Addition and Subtraction: Analytical Methods (Physics, OpenStax)", url: "https://openstax.org/books/physics/pages/5-2-vector-addition-and-subtraction-analytical-methods", source: openstax, lang: en, license: CC-BY-4.0 }
