problems:
  - id: phy.phase.p001
    topics: [physics.thermal.phase-change]
    difficulty: 1
    type: mcq
    stem: "ให้ความร้อนแก่น้ำผสมน้ำแข็งอย่างต่อเนื่อง ระหว่างที่น้ำแข็งยังละลายไม่หมด อุณหภูมิค้างอยู่ที่ประมาณ $0\\ ^\\circ\\mathrm{C}$ เพราะเหตุใด"
    choices:
      - { id: a, text: "ความร้อนที่ได้รับถูกใช้ทำลายแรงยึดเหนี่ยวระหว่างโมเลกุลเพื่อเปลี่ยนสถานะ", correct: true }
      - { id: b, text: "ความร้อนหยุดไหลเข้าสู่น้ำแข็งชั่วคราว", feedback: "ความร้อนยังไหลเข้าตลอด ไม่อย่างนั้นน้ำแข็งก็จะไม่ละลาย พลังงานนั้นถูกใช้เปลี่ยนสถานะ จึงไม่ได้ทำให้อุณหภูมิสูงขึ้น" }
      - { id: c, text: "น้ำแข็งปล่อยความเย็นออกมาหักล้างกับความร้อนพอดี", feedback: "ไม่มีความเย็นที่ไหลได้ มีแต่ความร้อนที่ไหลจากของร้อนไปของเย็น น้ำแข็ง **รับ** ความร้อนเข้าไปเพื่อละลาย" }
      - { id: d, text: "อุณหภูมิสูงขึ้นจริง แต่เทอร์โมมิเตอร์วัดไม่ทัน", feedback: "อุณหภูมิค้างที่ $0\\ ^\\circ\\mathrm{C}$ จริงตราบที่ยังมีน้ำแข็งเหลือ แม้ให้ความร้อนช้า ๆ วัดนาน ๆ ก็ได้ผลเดิม" }
    hints:
      - "ความร้อนยังไหลเข้าอยู่ แต่อุณหภูมิไม่ขึ้น พลังงานต้องถูกนำไปใช้ทำอย่างอื่น"
      - "นึกถึงสิ่งที่ต้องเกิดกับโมเลกุลเมื่อของแข็งกลายเป็นของเหลว"
    solution: "ขณะหลอมเหลว พลังงานที่ได้รับถูกใช้แยกโมเลกุลออกจากโครงสร้างผลึกของน้ำแข็ง (ความร้อนแฝง) ไม่ได้เพิ่มพลังงานจลน์เฉลี่ยของโมเลกุล อุณหภูมิจึงคงที่จนกว่าน้ำแข็งจะละลายหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.phase.p002
    topics: [physics.thermal.phase-change]
    difficulty: 1
    type: match
    stem: "จับคู่ชื่อการเปลี่ยนสถานะกับสิ่งที่เกิดขึ้น"
    pairs:
      - { left: "การหลอมเหลว", right: "ของแข็ง → ของเหลว" }
      - { left: "การแข็งตัว", right: "ของเหลว → ของแข็ง" }
      - { left: "การกลายเป็นไอ", right: "ของเหลว → แก๊ส" }
      - { left: "การควบแน่น", right: "แก๊ส → ของเหลว" }
      - { left: "การระเหิด", right: "ของแข็ง → แก๊ส" }
    hints:
      - "หลอมเหลวกับแข็งตัวเป็นคู่ตรงข้ามกัน กลายเป็นไอกับควบแน่นก็เช่นกัน"
      - "การระเหิดคือการข้ามสถานะของเหลวไปเลย เหมือนลูกเหม็นที่ค่อย ๆ หายไปในตู้เสื้อผ้า"
    solution: "หลอมเหลว: ของแข็ง → ของเหลว · แข็งตัว: ของเหลว → ของแข็ง · กลายเป็นไอ: ของเหลว → แก๊ส · ควบแน่น: แก๊ส → ของเหลว · ระเหิด: ของแข็ง → แก๊ส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.phase.p003
    topics: [physics.thermal.phase-change]
    difficulty: 2
    type: numeric
    stem: "น้ำแข็ง $0.5\\ \\mathrm{kg}$ ที่ $0\\ ^\\circ\\mathrm{C}$ ต้องได้รับความร้อนเท่าใดจึงละลายเป็นน้ำ $0\\ ^\\circ\\mathrm{C}$ ทั้งหมด ใช้ $L_f = 3.36 \\times 10^5\\ \\mathrm{J/kg}$ (ตอบเป็นตัวเลขในหน่วย kJ)"
    answer: { value: 168, unit: kJ }
    hints:
      - "อุณหภูมิไม่เปลี่ยน มีแต่การเปลี่ยนสถานะ"
      - "ใช้ $Q = mL_f$ แล้วเปลี่ยนจูลเป็นกิโลจูล"
    misconceptions:
      - { match: 336, feedback: "ดูเหมือนลืมคูณมวล $L_f$ คือความร้อนสำหรับน้ำแข็ง $1\\ \\mathrm{kg}$ ข้อนี้มีเพียง $0.5\\ \\mathrm{kg}$" }
      - { match: 1130, feedback: "ดูเหมือนใช้ความร้อนแฝงของการกลายเป็นไอ ($L_v$) การละลายน้ำแข็งต้องใช้ $L_f$" }
    solution: "$Q = mL_f = (0.5\\ \\mathrm{kg})(3.36 \\times 10^5\\ \\mathrm{J/kg}) = 1.68 \\times 10^5\\ \\mathrm{J} = 168\\ \\mathrm{kJ}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.phase.p004
    topics: [physics.thermal.phase-change]
    difficulty: 2
    type: numeric
    stem: "ต้มแกงจืดในหม้อที่เปิดฝาไว้ น้ำในหม้อที่เดือดอยู่ที่ $100\\ ^\\circ\\mathrm{C}$ กลายเป็นไอไป $0.2\\ \\mathrm{kg}$ น้ำส่วนนี้ได้รับความร้อนเท่าใด ใช้ $L_v = 2.26 \\times 10^6\\ \\mathrm{J/kg}$ (ตอบเป็นตัวเลขในหน่วย kJ)"
    answer: { value: 452, unit: kJ }
    hints:
      - "น้ำเดือดแล้วกลายเป็นไอที่ $100\\ ^\\circ\\mathrm{C}$ อุณหภูมิไม่เปลี่ยน"
      - "ใช้ $Q = mL_v$ แล้วหารด้วย 1,000 เพื่อตอบเป็นกิโลจูล"
    misconceptions:
      - { match: 67.2, feedback: "ดูเหมือนใช้ $L_f$ ของน้ำแข็ง การเดือดกลายเป็นไอต้องใช้ $L_v = 2.26 \\times 10^6\\ \\mathrm{J/kg}$" }
      - { match: 84, feedback: "ดูเหมือนใช้ $Q = mc\\Delta T$ กับ $\\Delta T = 100$ แต่ขณะเดือดอุณหภูมิไม่เปลี่ยน ต้องใช้ความร้อนแฝง $Q = mL_v$" }
    solution: "$Q = mL_v = (0.2\\ \\mathrm{kg})(2.26 \\times 10^6\\ \\mathrm{J/kg}) = 4.52 \\times 10^5\\ \\mathrm{J} = 452\\ \\mathrm{kJ}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.phase.p005
    topics: [physics.thermal.phase-change]
    difficulty: 2
    type: order
    stem: "ให้ความร้อนอัตราคงที่แก่น้ำแข็งที่ $-20\\ ^\\circ\\mathrm{C}$ จนกลายเป็นไอน้ำ $120\\ ^\\circ\\mathrm{C}$ เรียงช่วงบนกราฟอุณหภูมิกับเวลาตามลำดับที่เกิดขึ้น"
    items:
      - "น้ำแข็งร้อนขึ้นจาก $-20$ ถึง $0\\ ^\\circ\\mathrm{C}$ (กราฟเอียงขึ้น)"
      - "น้ำแข็งหลอมเหลวที่ $0\\ ^\\circ\\mathrm{C}$ (กราฟราบ)"
      - "น้ำร้อนขึ้นจาก $0$ ถึง $100\\ ^\\circ\\mathrm{C}$ (กราฟเอียงขึ้น)"
      - "น้ำเดือดกลายเป็นไอที่ $100\\ ^\\circ\\mathrm{C}$ (กราฟราบที่ยาวที่สุด)"
      - "ไอน้ำร้อนขึ้นจาก $100$ ถึง $120\\ ^\\circ\\mathrm{C}$ (กราฟเอียงขึ้น)"
    hints:
      - "สารต้องร้อนขึ้นถึงจุดหลอมเหลวก่อนจึงจะเริ่มละลาย"
      - "สลับกันระหว่างช่วงที่อุณหภูมิเพิ่มกับช่วงที่เปลี่ยนสถานะ"
    solution: "น้ำแข็งร้อนขึ้น → หลอมเหลวที่ $0\\ ^\\circ\\mathrm{C}$ → น้ำร้อนขึ้น → เดือดที่ $100\\ ^\\circ\\mathrm{C}$ → ไอน้ำร้อนขึ้น ช่วงเอียงใช้ $Q = mc\\Delta T$ ช่วงราบใช้ $Q = mL$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.phase.p006
    topics: [physics.thermal.phase-change]
    difficulty: 3
    type: numeric
    stem: "ต้องใช้ความร้อนเท่าใดจึงเปลี่ยนน้ำแข็ง $1\\ \\mathrm{kg}$ ที่ $0\\ ^\\circ\\mathrm{C}$ ให้เป็นน้ำเดือดที่ $100\\ ^\\circ\\mathrm{C}$ (ยังไม่กลายเป็นไอ) ใช้ $L_f = 3.36 \\times 10^5\\ \\mathrm{J/kg}$ และ $c$ ของน้ำ $= 4{,}200\\ \\mathrm{J/(kg\\cdot K)}$ (ตอบเป็นตัวเลขในหน่วย kJ)"
    answer: { value: 756, unit: kJ }
    hints:
      - "แบ่งเป็นสองช่วง: ละลายที่ $0\\ ^\\circ\\mathrm{C}$ แล้วน้ำร้อนขึ้นจาก $0$ ถึง $100\\ ^\\circ\\mathrm{C}$"
      - "ช่วงแรกใช้ $Q_1 = mL_f$ ช่วงที่สองใช้ $Q_2 = mc\\Delta T$ แล้วรวมกัน"
    misconceptions:
      - { match: 420, feedback: "นี่คือความร้อนเฉพาะช่วงที่น้ำร้อนขึ้น ลืมความร้อนที่ใช้ละลายน้ำแข็ง ($mL_f$) ก่อน" }
      - { match: 336, feedback: "นี่คือความร้อนที่ใช้ละลายน้ำแข็งเท่านั้น ยังต้องบวกความร้อนที่ทำให้น้ำ $0\\ ^\\circ\\mathrm{C}$ ร้อนขึ้นถึง $100\\ ^\\circ\\mathrm{C}$" }
    solution: "$Q_1 = mL_f = (1)(3.36 \\times 10^5) = 336{,}000\\ \\mathrm{J}$ · $Q_2 = mc\\Delta T = (1)(4{,}200)(100) = 420{,}000\\ \\mathrm{J}$ · รวม $Q = 756{,}000\\ \\mathrm{J} = 756\\ \\mathrm{kJ}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.phase.p007
    topics: [physics.thermal.phase-change]
    difficulty: 3
    type: expression
    stem: "น้ำแข็งมวล $m$ ที่ $0\\ ^\\circ\\mathrm{C}$ ละลายแล้วร้อนขึ้นเป็นน้ำที่ $T\\ ^\\circ\\mathrm{C}$ เขียนความร้อนทั้งหมดที่ใช้ในรูปของ $m$, $L$ (ความร้อนแฝงจำเพาะของการหลอมเหลว), $c$ (ความจุความร้อนจำเพาะของน้ำ) และ $T$"
    prefix: "Q ="
    answer: { latex: "mL + mcT", variables: [m, L, c, T] }
    misconceptions:
      - { match: "mcT", feedback: "ขาดความร้อนที่ใช้ละลายน้ำแข็ง ต้องบวก $mL$ เข้าไปด้วย" }
      - { match: "mL", feedback: "นั่นคือความร้อนที่ใช้ละลายอย่างเดียว ยังต้องบวกความร้อนที่ทำให้น้ำร้อนขึ้นจาก $0$ ถึง $T$ คือ $mcT$" }
      - { match: "mLcT", feedback: "สองช่วงนี้เกิดต่อกัน ความร้อนของแต่ละช่วงต้อง **บวก** กัน ไม่ใช่คูณกัน" }
    hints:
      - "แบ่งเป็นสองช่วง: ละลาย แล้วน้ำร้อนขึ้น"
      - "ช่วงละลายใช้ $mL$ ช่วงร้อนขึ้นใช้ $mc\\Delta T$ โดย $\\Delta T = T - 0$ แล้วบวกกัน"
    solution: "ละลาย: $Q_1 = mL$ · ร้อนขึ้นจาก $0$ ถึง $T$: $Q_2 = mc(T - 0) = mcT$ · รวม $Q = mL + mcT = m(L + cT)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.phase.p008
    topics: [physics.thermal.phase-change]
    difficulty: 4
    type: numeric
    stem: "น้ำแข็ง $0.2\\ \\mathrm{kg}$ จากช่องแช่แข็งที่ $-10\\ ^\\circ\\mathrm{C}$ กลายเป็นน้ำที่ $20\\ ^\\circ\\mathrm{C}$ ใช้ความร้อนทั้งหมดเท่าใด ใช้ $c$ ของน้ำแข็ง $= 2{,}100$, $c$ ของน้ำ $= 4{,}200\\ \\mathrm{J/(kg\\cdot K)}$ และ $L_f = 3.36 \\times 10^5\\ \\mathrm{J/kg}$ (ตอบเป็นตัวเลขในหน่วย kJ)"
    answer: { value: 88.2, tolerance: 0.5, unit: kJ }
    hints:
      - "มีสามช่วง: น้ำแข็งร้อนขึ้นถึง $0\\ ^\\circ\\mathrm{C}$, ละลาย, น้ำร้อนขึ้นถึง $20\\ ^\\circ\\mathrm{C}$"
      - "ช่วงแรกใช้ $c$ ของน้ำแข็ง ช่วงสุดท้ายใช้ $c$ ของน้ำ"
      - "คำนวณแต่ละช่วงเป็นจูล แล้วรวมกันและหาร 1,000"
    misconceptions:
      - { match: 84, feedback: "ดูเหมือนลืมช่วงแรกที่น้ำแข็งร้อนขึ้นจาก $-10$ ถึง $0\\ ^\\circ\\mathrm{C}$ น้ำแข็งต้องถึงจุดหลอมเหลวก่อนจึงจะละลาย" }
      - { match: 92.4, feedback: "ดูเหมือนใช้ $c$ ของน้ำ ($4{,}200$) กับน้ำแข็ง น้ำแข็งมี $c = 2{,}100\\ \\mathrm{J/(kg\\cdot K)}$" }
    solution: "$Q_1 = (0.2)(2{,}100)(10) = 4{,}200\\ \\mathrm{J}$ · $Q_2 = (0.2)(3.36 \\times 10^5) = 67{,}200\\ \\mathrm{J}$ · $Q_3 = (0.2)(4{,}200)(20) = 16{,}800\\ \\mathrm{J}$ · รวม $88{,}200\\ \\mathrm{J} = 88.2\\ \\mathrm{kJ}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.phase.p009
    topics: [physics.thermal.phase-change]
    difficulty: 4
    type: numeric
    stem: "ร้านชาเย็นชงชา (ถือว่าเป็นน้ำ) $0.3\\ \\mathrm{kg}$ ที่ $30\\ ^\\circ\\mathrm{C}$ ต้องใส่น้ำแข็งที่ $0\\ ^\\circ\\mathrm{C}$ อย่างน้อยกี่กรัม จึงทำให้ชาเย็นลงถึง $0\\ ^\\circ\\mathrm{C}$ พอดีโดยน้ำแข็งละลายหมด ใช้ $c$ ของน้ำ $= 4{,}200\\ \\mathrm{J/(kg\\cdot K)}$ และ $L_f = 3.36 \\times 10^5\\ \\mathrm{J/kg}$ ไม่คิดความร้อนจากแก้วและอากาศ (ตอบเป็นตัวเลขในหน่วย g)"
    answer: { value: 112.5, tolerance: 1, unit: g }
    hints:
      - "ความร้อนที่ชาให้ออกไปเมื่อเย็นลงจาก $30$ เป็น $0\\ ^\\circ\\mathrm{C}$ = ความร้อนที่น้ำแข็งใช้ละลาย"
      - "ตั้งสมการ $m_{\\text{ชา}}\\,c\\,\\Delta T = m_{\\text{น้ำแข็ง}}\\,L_f$"
      - "แก้หามวลน้ำแข็งเป็นกิโลกรัม แล้วคูณ 1,000 เพื่อเปลี่ยนเป็นกรัม"
    misconceptions:
      - { match: 16.7, feedback: "ดูเหมือนใช้ $L_v$ ของการกลายเป็นไอ น้ำแข็งละลายต้องใช้ $L_f = 3.36 \\times 10^5\\ \\mathrm{J/kg}$" }
      - { match: 0.1125, feedback: "ตัวเลขถูกแล้วแต่เป็นหน่วยกิโลกรัม โจทย์ถามเป็นกรัม ให้คูณ 1,000" }
    solution: "ชาให้ความร้อน $Q = (0.3)(4{,}200)(30) = 37{,}800\\ \\mathrm{J}$ · น้ำแข็งที่ละลายได้ $m = \\dfrac{Q}{L_f} = \\dfrac{37{,}800}{3.36 \\times 10^5} = 0.1125\\ \\mathrm{kg} = 112.5\\ \\mathrm{g}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.phase.p010
    topics: [physics.thermal.phase-change]
    difficulty: 4
    type: numeric
    stem: "ให้ความร้อนแก่น้ำแข็ง $0.5\\ \\mathrm{kg}$ ที่ $0\\ ^\\circ\\mathrm{C}$ ด้วยอัตราคงที่ $2{,}100\\ \\mathrm{J}$ ทุก ๆ วินาที บนกราฟอุณหภูมิกับเวลา ช่วงราบที่ $0\\ ^\\circ\\mathrm{C}$ จะยาวกี่วินาที ใช้ $L_f = 3.36 \\times 10^5\\ \\mathrm{J/kg}$ และไม่คิดความร้อนสูญเสีย (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 80, unit: s }
    hints:
      - "ช่วงราบที่ $0\\ ^\\circ\\mathrm{C}$ คือช่วงที่น้ำแข็งละลาย"
      - "หาความร้อนที่ต้องใช้ละลายทั้งหมดด้วย $Q = mL_f$"
      - "เวลา = ความร้อนทั้งหมด ÷ ความร้อนที่ให้ในแต่ละวินาที"
    misconceptions:
      - { match: 160, feedback: "ดูเหมือนลืมคูณมวล $0.5\\ \\mathrm{kg}$ ความร้อนที่ต้องใช้คือ $mL_f$ ไม่ใช่ $L_f$" }
      - { match: 538, feedback: "ดูเหมือนใช้ $L_v$ ซึ่งเป็นช่วงราบที่ $100\\ ^\\circ\\mathrm{C}$ (การเดือด) ช่วงที่ $0\\ ^\\circ\\mathrm{C}$ ต้องใช้ $L_f$" }
    solution: "$Q = mL_f = (0.5)(3.36 \\times 10^5) = 168{,}000\\ \\mathrm{J}$ · เวลา $= \\dfrac{168{,}000\\ \\mathrm{J}}{2{,}100\\ \\mathrm{J/s}} = 80\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.phase.p011
    topics: [physics.thermal.phase-change]
    difficulty: 5
    type: numeric
