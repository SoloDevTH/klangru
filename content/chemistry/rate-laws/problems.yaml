    stem: 'ปฏิกิริยามีกฎอัตรา $\text{rate} = k[\mathrm{A}][\mathrm{B}]^2$ ตอนนี้อัตรามีค่า $0.012\ \mathrm{M/s}$ ถ้าเพิ่ม $[\mathrm{A}]$ เป็นสองเท่า และเพิ่ม $[\mathrm{B}]$ เป็นสามเท่า โดยอุณหภูมิคงที่ อัตราใหม่มีค่าเท่าใดในหน่วย $\mathrm{M/s}$'
