id: computer.data.number-representation
subject: computer
title: { th: จำนวนลบ เลขฐานสิบหก และทศนิยมในคอมพิวเตอร์, en: "Negative numbers, hexadecimal and fractions in computers" }
summary: เลขฐานสิบหก จำนวนลบแบบเครื่องหมายและขนาดและแบบส่วนเติมเต็มสอง การล้นของจำนวนที่มีบิตจำกัด จุดตรึงและจุดลอยตัว และสาเหตุที่ 0.1 + 0.2 ไม่เท่ากับ 0.3 พอดี
difficulty: 4
minutes: 40
prerequisites: [computer.data.binary, math.number.integers]
encompasses:
  - { id: computer.data.binary, weight: 0.5 }
  - { id: math.number.integers, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: hex-nibbles.svg
    alt: "เลขฐานสอง 8 บิต 1101 0110 แบ่งเป็นสองกลุ่ม กลุ่มละ 4 บิต ค่าประจำหลักในแต่ละกลุ่มคือ 8 4 2 1 กลุ่มซ้าย 1101 คือ 8 + 4 + 1 = 13 เขียนเป็น D กลุ่มขวา 0110 คือ 4 + 2 = 6 รวมได้ D6 ในฐานสิบหก"
    caption: "เลขฐานสิบหก 1 หลักแทน 4 บิตพอดี"
  - type: worked-example
    title: แปลงฐานสิบเป็นฐานสิบหกผ่านฐานสอง
    problem: "เขียน $200_{10}$ เป็นเลขฐานสิบหก"
    steps:
      - text: "แปลงเป็นฐานสอง 8 บิต: $200 = 128 + 64 + 8$ จึงได้ $1100\\,1000_2$"
      - text: "แบ่งจากขวาเป็นกลุ่มละ 4 บิต: $1100$ กับ $1000$"
        why: "หนึ่งหลักฐานสิบหกแทน 4 บิตพอดี เพราะ $16 = 2^4$"
      - text: "แปลงทีละกลุ่ม: $1100 = 12 = \\mathrm{C}$ และ $1000 = 8$"
      - text: "ตรวจ: $\\mathrm{C8}_{16} = 12 \\times 16 + 8 = 200$ ✓"
        why: "ตรวจกลับด้วยค่าประจำหลักของฐานสิบหก (16 และ 1) ช่วยจับการเรียงหลักสลับกัน เช่น 8C ซึ่งคือ 140"
    answer: "$200_{10} = \\mathrm{C8}_{16}$"
  - type: figure
    src: twos-wheel.svg
    alt: "วงล้อ 16 ตำแหน่งของจำนวน 4 บิต เรียงตามเข็มนาฬิกาจาก 0000 ด้านบนไปจนถึง 1111 วงกลางเป็นค่าไม่มีเครื่องหมาย 0 ถึง 15 วงในเป็นค่าแบบส่วนเติมเต็มสอง 0 ถึง 7 สำหรับ 0000 ถึง 0111 และ −8 ถึง −1 สำหรับ 1000 ถึง 1111 มีเส้นประสีแดงคั่นระหว่าง 0111 (7) กับ 1000 (−8) เขียนว่า ล้น: 7 + 1 → −8 ตรงกลางเขียนว่า บวก 1 = หมุนตามเข็ม 1 ช่อง"
    caption: "รูปบิตเดียวกันอ่านได้สองแบบ และการบวกที่ข้ามเส้นประคือการล้น"
  - { type: check, problem: computer.data.number-representation.p007, prompt: "ใช้ค่าประจำหลัก −128 ของบิตซ้ายสุด" }
  - type: worked-example
    title: หาค่าลบแบบส่วนเติมเต็มสองแล้วตรวจด้วยการบวก
    problem: "ตู้แช่แข็งเก็บอุณหภูมิเป็นจำนวนเต็มแบบส่วนเติมเต็มสอง 8 บิต จงเขียน $-20$ และตรวจว่า $20 + (-20) = 0$"
    steps:
      - text: "เขียน $+20$: $0001\\,0100$"
      - text: "กลับทุกบิต: $1110\\,1011$"
        why: "ผลรวมของจำนวนกับรูปที่กลับบิตแล้วคือ $1111\\,1111$ ซึ่งแทน $-1$ จึงต้องบวก 1 อีกครั้งเพื่อให้ได้ค่าลบที่ถูก"
      - text: "บวก 1: $1110\\,1100$ ตรวจด้วยค่าประจำหลัก $-128 + 64 + 32 + 8 + 4 = -20$ ✓"
      - text: "บวก $0001\\,0100 + 1110\\,1100 = 1\\,0000\\,0000$ บิตที่ 9 เกินขนาด 8 บิตจึงถูกทิ้ง เหลือ $0000\\,0000 = 0$ ✓"
        why: "นี่คือเหตุที่คอมพิวเตอร์ใช้ส่วนเติมเต็มสอง: บวกลบด้วยวงจรบวกตัวเดียวกับจำนวนบวกได้เลย"
    answer: "$-20 = 1110\\,1100_2$ และ $20 + (-20)$ ได้ $0000\\,0000$"
  - type: figure
    src: float-layout.svg
    alt: "จำนวน 6.5 เก็บแบบจุดลอยตัว 32 บิต แบ่งเป็นสามส่วน บิตเครื่องหมาย 1 บิตคือ 0 เลขชี้กำลัง 8 บิตคือ 10000001 และส่วนเศษ 23 บิตคือ 101 ตามด้วย 0 อีก 20 ตัว ใต้ภาพอธิบายว่า 6.5 = 110.1 ฐานสอง = 1.101 ฐานสอง คูณ 2 ยกกำลัง 2 เลขชี้กำลังเก็บ 2 + 127 = 129 และส่วนเศษเก็บเฉพาะหลังจุด"
    caption: "จุดลอยตัวแบบ 32 บิต (IEEE 754): เครื่องหมาย 1 บิต เลขชี้กำลัง 8 บิต ส่วนเศษ 23 บิต"
glossary:
  - { term: เลขฐานสิบหก (hexadecimal), definition: "ระบบเลขที่ใช้เลขโดด 0–9 และ A–F ค่าประจำหลักเพิ่มทีละ 16 เท่า 1 หลักแทน 4 บิต" }
  - { term: เครื่องหมายและขนาด (sign-magnitude), definition: "แทนจำนวนลบด้วยบิตซ้ายสุดเป็นเครื่องหมาย บิตที่เหลือเป็นขนาด" }
  - { term: ส่วนเติมเต็มสอง (two's complement), definition: "แทนจำนวนลบโดยให้บิตซ้ายสุดมีค่าประจำหลักติดลบ หาค่าลบได้ด้วยการกลับทุกบิตแล้วบวก 1" }
  - { term: การล้น (overflow), definition: "ผลการคำนวณเกินช่วงที่จำนวนบิตเก็บได้ ทำให้ได้ค่าที่ผิด เช่น 127 + 1 ได้ −128 ใน 8 บิต" }
  - { term: จุดตรึง (fixed point), definition: "การเก็บทศนิยมโดยกำหนดตำแหน่งจุดไว้ตายตัว" }
  - { term: จุดลอยตัว (floating point), definition: "การเก็บจำนวนแบบสัญกรณ์วิทยาศาสตร์ฐานสอง มีบิตเครื่องหมาย เลขชี้กำลัง และส่วนเศษ" }
flashcards:
  - { front: "เลขฐานสิบหก 1 หลักแทนกี่บิต", back: "4 บิต เพราะ $16 = 2^4$" }
  - { front: "หาค่าลบแบบส่วนเติมเต็มสองอย่างไร", back: "กลับทุกบิต แล้วบวก 1" }
  - { front: "ช่วงของจำนวนเต็มส่วนเติมเต็มสอง 8 บิต", back: "$-128$ ถึง $127$" }
  - { front: "ทำไม 0.1 + 0.2 ไม่เท่ากับ 0.3 พอดีในคอมพิวเตอร์", back: "0.1 ในฐานสองเป็นทศนิยมไม่รู้จบ เก็บได้แค่ค่าประมาณ" }
  - { front: "จุดลอยตัว 32 บิตแบ่งอย่างไร", back: "เครื่องหมาย 1 บิต เลขชี้กำลัง 8 บิต (บวก 127) ส่วนเศษ 23 บิต" }
