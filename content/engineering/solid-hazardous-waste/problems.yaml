  - id: "engineering.environmental.solid-hazardous-waste.p018"
    topics: ["engineering.environmental.solid-hazardous-waste"]
    difficulty: 5
    type: "numeric"
    stem: "เทศบาลสมมติ (ประชากร 200,000 คน ขยะ 220 t/d) ต้องการหลุมฝังกลบรองรับ 30 ปี ขยะที่บดอัดแล้วมีความหนาแน่น 0.8 t/m³ และแบ่งเซลล์ฝังกลบสูง 15 m (ค่าสมมติ) พื้นที่ฐานของเซลล์ที่ต้องใช้โดยประมาณกี่ m² (จำนวนเต็ม)"
