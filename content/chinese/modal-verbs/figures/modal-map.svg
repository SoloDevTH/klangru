<text x="590.0" y="116.0" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="normal">不想</text>
<line x1="234.0" y1="109.0" x2="286.0" y2="109.0" stroke="#1f4e9c" stroke-width="2" stroke-linecap="round" marker-end="url(#a1f4e9c)"/>
<line x1="434.0" y1="109.0" x2="466.0" y2="109.0" stroke="#1f4e9c" stroke-width="2" stroke-linecap="round" marker-end="url(#a1f4e9c)"/>
<rect x="30.0" y="148.0" width="200.0" height="54.0" rx="8" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="130.0" y="181.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ต้องการ จะ ต้อง</text>
<rect x="290.0" y="148.0" width="140.0" height="54.0" rx="8" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="360.0" y="183.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="bold">要 yào</text>
