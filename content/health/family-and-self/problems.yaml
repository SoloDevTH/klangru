    choices:
      - { id: a, text: "บ้านรายได้ไม่มาก แต่กินข้าวเย็นพร้อมกัน คุยเรื่องในวัน ช่วยกันทำงานบ้าน และพาลูกไปเยี่ยมยาย", correct: true }
      - { id: b, text: "บ้านรายได้มาก ลูกมีของเล่นครบทุกอย่าง แต่พ่อแม่แทบไม่ได้คุยกับลูก", feedback: "ทรัพย์สินช่วยให้สะดวก แต่ความอบอุ่นมาจากเวลา การพูดคุย และการดูแลกัน" }
      - { id: c, text: "บ้านที่ทุกคนเงียบตลอดเวลาเพราะกลัวพ่อดุ", feedback: "ความกลัวไม่ใช่ความอบอุ่น ครอบครัวอบอุ่นคุยกันได้อย่างสบายใจ" }
      - { id: d, text: "บ้านที่พี่น้องทะเลาะกันทุกวันและไม่มีใครห้าม", feedback: "ความขัดแย้งเกิดได้ แต่ครอบครัวอบอุ่นช่วยกันแก้ปัญหาและให้อภัยกัน" }
    hints:
      - "ความอบอุ่นไม่ได้วัดจากเงิน"
      - "มองหาครอบครัวที่ใช้เวลาร่วมกัน พูดคุย และช่วยเหลือกัน"
    solution: "ครอบครัวแรกมีเวลาร่วมกัน พูดคุย ช่วยกันทำงาน และนับถือญาติ ซึ่งเป็นลักษณะของครอบครัวที่อบอุ่นตามวัฒนธรรมไทย แม้รายได้จะไม่มาก"
