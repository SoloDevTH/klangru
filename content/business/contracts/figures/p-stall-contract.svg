<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" font-family="sans-serif" font-size="14">
  <title>ข้อความบางส่วนจากสัญญาเช่าแผงในตลาดนัด (สมมติ)</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="600" height="360" fill="#ffffff"/>
  <rect x="20.0" y="14.0" width="560.0" height="332.0" rx="6" fill="#fffbeb" stroke="#92400e" stroke-width="1.5"/>
  <text x="300.0" y="44.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">สัญญาเช่าแผงค้า ตลาดนัดชุมชนบ้านสวน (สมมติ)</text>
  <text x="44.0" y="82.0" text-anchor="start" fill="#1f2937" font-size="13.5">ผู้ให้เช่า: นางสมพร (เจ้าของตลาด) · ผู้เช่า: นายวินัย</text>
  <text x="44.0" y="114.0" text-anchor="start" fill="#1f2937" font-size="13.5">ข้อ 1 ให้เช่าแผงเลขที่ 12 ขนาด 2 × 3 เมตร กำหนด 1 ปี</text>
  <text x="44.0" y="146.0" text-anchor="start" fill="#1f2937" font-size="13.5">ข้อ 2 ค่าเช่าเดือนละ 4,500 บาท ชำระภายในวันที่ 5 ของทุกเดือน</text>
  <text x="44.0" y="178.0" text-anchor="start" fill="#1f2937" font-size="13.5">ข้อ 3 ผู้เช่าวางเงินประกันเท่ากับค่าเช่า 3 เดือน</text>
  <text x="44.0" y="210.0" text-anchor="start" fill="#1f2937" font-size="13.5">ข้อ 4 เมื่อสัญญาสิ้นสุด ผู้ให้เช่าคืนเงินประกันภายใน 30 วัน</text>
  <text x="102.0" y="242.0" text-anchor="start" fill="#1f2937" font-size="13.5">หลังหักค่าเช่าค้างชำระและค่าซ่อมความเสียหายที่ผู้เช่าก่อ</text>
  <text x="44.0" y="274.0" text-anchor="start" fill="#1f2937" font-size="13.5">ข้อ 5 ห้ามผู้เช่านำแผงไปให้ผู้อื่นเช่าช่วงโดยไม่ได้รับอนุญาตเป็นหนังสือ</text>
  <text x="44.0" y="306.0" text-anchor="start" fill="#1f2937" font-size="13.5">ลงชื่อ ............ ผู้ให้เช่า · ลงชื่อ ............ ผู้เช่า</text>
</svg>
