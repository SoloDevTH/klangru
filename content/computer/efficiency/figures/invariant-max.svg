<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="sans-serif" font-size="15">
  <title>ลิสต์ 31, 27, 35, 29, 40, 33 ขณะ i = 3 ส่วน a[0] ถึง a[2] คือ 31, 27, 35 ตรวจแล้ว (สีเขียว) best = 35 เป็นค่ามากที่สุดของส่วนนี้ ส่วนดัชนี 3 ถึง 5 ยังไม่ตรวจ (สีเทา) ลูกศรชี้ i ที่ดัชนี 3</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
  <text x="360.0" y="40.0" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">ค่าคงตัวของวงวน: ก่อนตรวจ a[i] ทุกรอบ best คือค่ามากที่สุดของ a[0] ถึง a[i−1]</text>
  <rect x="120.0" y="90.0" width="80.0" height="64.0" rx="0" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="160.0" y="131.0" font-size="22" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">31</text>
  <text x="160.0" y="176.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">0</text>
  <rect x="200.0" y="90.0" width="80.0" height="64.0" rx="0" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="240.0" y="131.0" font-size="22" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">27</text>
  <text x="240.0" y="176.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">1</text>
  <rect x="280.0" y="90.0" width="80.0" height="64.0" rx="0" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="320.0" y="131.0" font-size="22" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">35</text>
  <text x="320.0" y="176.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">2</text>
  <rect x="360.0" y="90.0" width="80.0" height="64.0" rx="0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="400.0" y="131.0" font-size="22" text-anchor="middle" fill="#6b7280" font-weight="bold" xml:space="preserve">29</text>
  <text x="400.0" y="176.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">3</text>
  <rect x="440.0" y="90.0" width="80.0" height="64.0" rx="0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="480.0" y="131.0" font-size="22" text-anchor="middle" fill="#6b7280" font-weight="bold" xml:space="preserve">40</text>
  <text x="480.0" y="176.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">4</text>
  <rect x="520.0" y="90.0" width="80.0" height="64.0" rx="0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="560.0" y="131.0" font-size="22" text-anchor="middle" fill="#6b7280" font-weight="bold" xml:space="preserve">33</text>
  <text x="560.0" y="176.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">5</text>
  <text x="108.0" y="176.0" font-size="14" text-anchor="end" fill="#4b5563" xml:space="preserve">ดัชนี</text>
  <line x1="400.0" y1="226.0" x2="400.0" y2="186.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="400.0" y="246.0" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" xml:space="preserve">i = 3 (กำลังจะตรวจ)</text>
  <text x="240.0" y="76.0" font-size="15" text-anchor="middle" fill="#15803d" font-weight="bold" xml:space="preserve">ตรวจแล้ว: best = 35</text>
  <text x="480.0" y="76.0" font-size="15" text-anchor="middle" fill="#6b7280" font-weight="bold" xml:space="preserve">ยังไม่ตรวจ</text>
  <text x="360.0" y="285.0" font-size="14" text-anchor="middle" fill="#4b5563" xml:space="preserve">ตรวจ 29 แล้ว best ยังเป็น 35 ค่าคงตัวยังจริงสำหรับ a[0] ถึง a[3]</text>
</svg>
