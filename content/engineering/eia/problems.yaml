problems:
  - id: engineering.environmental.eia.p001
    topics:
      - engineering.environmental.eia
    difficulty: 1
    type: mcq
    stem: ในประเทศไทย รายงาน EIA กับ IEE ต่างกันอย่างไร
    choices:
      - id: a
        text: EIA เป็นการวิเคราะห์อย่างละเอียดสำหรับโครงการผลกระทบรุนแรง ส่วน IEE เป็นการประเมินเบื้องต้นสำหรับโครงการผลกระทบน้อยกว่า
        correct: true
      - id: b
        text: IEE ใช้กับโครงการของรัฐเท่านั้น ส่วน EIA ใช้กับเอกชนเท่านั้น
        feedback: การแบ่งประเภทไม่ได้แยกตามผู้ลงทุน แต่ตามประเภทและขนาดของโครงการ
      - id: c
        text: EIA ไม่ต้องรับฟังความเห็นของประชาชน
        feedback: การมีส่วนร่วมของประชาชนเป็นส่วนสำคัญของกระบวนการ EIA
      - id: d
        text: ทั้งสองรายงานเหมือนกันทุกประการ ต่างกันเพียงชื่อ
        feedback: ระดับความละเอียดของการวิเคราะห์ต่างกันชัดเจน
    hints:
      - ลองดูว่าโครงการแบบใดมีผลกระทบรุนแรงกว่าและต้องการการประเมินเต็มรูปแบบ
      - IEE เป็นการประเมินเบื้องต้นที่ใช้กับโครงการขนาดหรือผลกระทบน้อยกว่า
    solution: รายงาน EIA เป็นการวิเคราะห์ผลกระทบอย่างละเอียดสำหรับโครงการที่มีผลกระทบรุนแรงหรือมีขนาดใหญ่ ส่วน IEE เป็นการประเมินเบื้องต้นสำหรับโครงการที่ผลกระทบน้อยกว่า ประเภทและขนาดของโครงการที่ต้องจัดทำแต่ละรายงานกำหนดโดยประกาศที่เกี่ยวข้อง ต้องตรวจกับประกาศปัจจุบัน
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.eia.p002
    topics:
      - engineering.environmental.eia
    difficulty: 1
    type: mcq
    stem: ขั้นตอนใดบ้างอยู่ในการจัดทำรายงานผลกระทบสิ่งแวดล้อม (เลือกทุกข้อที่ถูก)
    multiple: true
    choices:
      - id: a
        text: การกำหนดขอบเขตการศึกษา
        correct: true
      - id: b
        text: การสำรวจสภาพแวดล้อมพื้นฐานก่อนโครงการ
        correct: true
      - id: c
        text: การทำนายผลกระทบและเสนอมาตรการลดผลกระทบ
        correct: true
      - id: d
        text: การขายผลิตภัณฑ์ในตลาดต่างประเทศ
        feedback: การตลาดไม่ได้เป็นส่วนของการประเมินผลกระทบสิ่งแวดล้อม
    hints:
      - ก่อนทำนายผลกระทบต้องรู้ก่อนว่าสภาพเดิมเป็นอย่างไร และต้องกำหนดขอบเขตการศึกษาให้ชัด
      - มาตรการลดผลกระทบและการติดตามเป็นส่วนหนึ่งของรายงาน
    solution: การกำหนดขอบเขต การสำรวจสภาพพื้นฐาน การทำนายผลกระทบ และการเสนอมาตรการพร้อมแผนติดตามเป็นขั้นตอนหลักของ EIA ส่วนการขายผลิตภัณฑ์หลังโครงการไม่ได้อยู่ในการประเมินผลกระทบ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.eia.p003
    topics:
      - engineering.environmental.eia
    difficulty: 1
    type: match
    stem: จับคู่เครื่องมือการจัดการสิ่งแวดล้อมกับหน้าที่หลัก
    pairs:
      - left: ระบบจัดการสิ่งแวดล้อม (EMS)
        right: กรอบการวางแผนและปรับปรุงต่อเนื่องขององค์กร
      - left: การประเมินวัฏจักรชีวิต (LCA)
        right: วิเคราะห์ผลกระทบตลอดอายุผลิตภัณฑ์ตั้งแต่วัตถุดิบถึงการกำจัด
      - left: เทคโนโลยีสะอาด
        right: ลดของเสียและมลพิษตั้งแต่ต้นทางของกระบวนการ
      - left: ฉลากสิ่งแวดล้อม
        right: ให้ข้อมูลแก่ผู้บริโภคว่าผลิตภัณฑ์มีผลกระทบต่อสิ่งแวดล้อมอย่างไร
    hints:
      - ระบบจัดการสิ่งแวดล้อมเน้นการวางแผนและปรับปรุงอย่างต่อเนื่อง
      - การประเมินวัฏจักรชีวิตดูผลกระทบตลอดอายุของผลิตภัณฑ์ตั้งแต่วัตถุดิบถึงการกำจัด
    solution: ระบบจัดการสิ่งแวดล้อม (EMS) วางกรอบการควบคุมต่อเนื่อง การประเมินวัฏจักรชีวิตดูผลกระทบตลอดอายุผลิตภัณฑ์ เทคโนโลยีสะอาดลดของเสียตั้งแต่ต้นทาง และฉลากสิ่งแวดล้อมให้ข้อมูลแก่ผู้บริโภคเกี่ยวกับผลิตภัณฑ์
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.eia.p004
    topics:
      - engineering.environmental.eia
    difficulty: 2
    type: numeric
    stem: ในเมทริกซ์ Leopold กิจกรรม A1 (ขุดหน้าดิน) มีผลต่อคุณภาพอากาศ ขนาด m = −6 และความสำคัญ i = 8 คะแนนของช่องนี้เท่ากับเท่าไร (ตอบจำนวนเต็ม)
    answer:
      value: -48
      tolerance: 0.1
    hints:
      - คะแนนของช่องในเมทริกซ์ Leopold = ขนาด × ความสำคัญ
      - ขนาดมีเครื่องหมาย ค่าลบหมายถึงผลเสีย
    misconceptions:
      - match: 14
        feedback: บวกขนาดกับความสำคัญแทนการคูณ และไม่ได้คำนึงถึงเครื่องหมายของผลกระทบ
      - match: 48
        feedback: ได้ค่าขนาดของผลแต่ไม่ได้ใส่เครื่องหมายลบซึ่งบอกว่าเป็นผลเสีย
    solution: คะแนน = m × i = (−6) × 8 = −48 ค่าลบบอกว่าเป็นผลกระทบเชิงลบต่อคุณภาพอากาศ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.eia.p005
    topics:
      - engineering.environmental.eia
    difficulty: 2
    type: numeric
    stem: จากเมทริกซ์ Leopold ในภาพ กิจกรรม A3 (ปลูกป่าฟื้นฟู) มีคะแนนรวมจากทั้งสามปัจจัย (F1 ถึง F3) เท่าไร (ตอบจำนวนเต็ม)
    figure:
      src: leopold-matrix.svg
      alt: ตารางสามคูณสาม แถวคือกิจกรรม A1 ขุดหน้าดิน A2 ขนส่งแร่ และ A3 ปลูกป่าฟื้นฟู คอลัมน์คือ F1 คุณภาพอากาศ F2 คุณภาพน้ำผิวดิน และ F3 การจ้างงานท้องถิ่น ช่อง A1 มีค่า m = −6 i = 8, m = −7 i = 9, m = +3 i = 6 ช่อง A2 มีค่า m = −4 i = 5, m = −2 i = 4, m = +2 i = 3 ช่อง A3 มีค่า m = +2 i = 6, m = +4 i = 7, m = +5 i = 8
    answer:
      value: 80
      tolerance: 0.1
    hints:
      - คำนวณคะแนนของแต่ละปัจจัยก่อนด้วย m × i แล้วจึงนำมารวมกัน
      - อย่ารวมค่า m หรือ i ก่อนคูณ
    misconceptions:
      - match: 11
        feedback: รวมค่าขนาดตรง ๆ แทนที่จะคูณด้วยความสำคัญของแต่ละปัจจัย
      - match: 21
        feedback: รวมค่าความสำคัญแทนคะแนนผลกระทบ
    solution: 'F1: 2 × 6 = 12 F2: 4 × 7 = 28 F3: 5 × 8 = 40 รวม = 12 + 28 + 40 = 80 คะแนนบวกบอกว่ากิจกรรมนี้มีผลดีโดยรวม'
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.eia.p006
    topics:
      - engineering.environmental.eia
    difficulty: 2
    type: order
    stem: เรียงลำดับขั้นตอนหลักของการจัดทำรายงานผลกระทบสิ่งแวดล้อม
    items:
      - กำหนดขอบเขตการศึกษาและประเด็นที่ต้องประเมิน
      - สำรวจสภาพแวดล้อมพื้นฐานก่อนโครงการ
      - ทำนายผลกระทบและประเมินความสำคัญของผลกระทบ
      - เสนอมาตรการลดผลกระทบและแผนติดตามตรวจสอบ
      - รับฟังความเห็นของประชาชนและจัดทำรายงานฉบับสมบูรณ์
    hints:
      - ต้องรู้ขอบเขตก่อนจะเริ่มเก็บข้อมูล
      - ต้องรู้สภาพเดิมก่อนจะทำนายว่าโครงการจะเปลี่ยนอะไร
    solution: ขั้นตอนทั่วไปเริ่มจากการกำหนดขอบเขต แล้วสำรวจสภาพพื้นฐาน ทำนายผลกระทบ เสนอมาตรการและแผนติดตาม และสุดท้ายรับฟังความเห็นของประชาชนก่อนจัดทำรายงานฉบับสมบูรณ์ ลำดับจริงต้องตรวจกับหลักเกณฑ์ปัจจุบัน
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.eia.p007
    topics:
      - engineering.environmental.eia
    difficulty: 3
    type: numeric
    stem: (ข้อมูลสมมติ) โครงการเหมืองหินปูนในสระบุรีคาดว่าขุดได้แร่ 3,000 ลูกบาศก์เมตร โดยมีอัตราส่วนการขุดดินทิ้งต่อแร่ 2.5 ต่อ 1 จะเกิดดินทิ้งกี่ลูกบาศก์เมตร (ตอบจำนวนเต็ม)
    answer:
      value: 7500
      tolerance: 1
      unit: ลบ.ม.
    hints:
      - ดินทิ้งรวม = อัตราส่วนดินทิ้งต่อแร่ × ปริมาณแร่
      - อัตราส่วน 2.5 ต่อ 1 หมายถึงดินทิ้ง 2.5 ลูกบาศก์เมตรต่อแร่ 1 ลูกบาศก์เมตร
    misconceptions:
      - match: 3000
        feedback: ลืมนำอัตราส่วนมาคิด ปริมาณดินทิ้งในเหมืองนี้มากกว่าแร่
      - match: 10500
        feedback: รวมปริมาณแร่เข้าไปในดินทิ้งด้วย ซึ่งไม่ใช่ความหมายของอัตราส่วน
      - match: 1200
        feedback: หารปริมาณแร่ด้วยอัตราส่วนแทนการคูณ
    solution: ดินทิ้ง = 2.5 × 3,000 = 7,500 ลูกบาศก์เมตร ปริมาณที่ต้องขุดรวมทั้งหมดคือ 10,500 ลูกบาศก์เมตร ซึ่งต้องวางแผนที่ทิ้งและการป้องกันการพังทลายด้วย
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.eia.p008
    topics:
      - engineering.environmental.eia
    difficulty: 3
    type: numeric
    stem: '(ข้อมูลสมมติ) สำหรับโครงการพัฒนาแห่งหนึ่งในภาคตะวันออก กิจกรรมหนึ่งมีสามสถานการณ์ โดยคะแนนผลกระทบและความน่าจะเป็นคือ สถานการณ์ 1: ความน่าจะเป็น 0.5 คะแนน −40 สถานการณ์ 2: ความน่าจะเป็น 0.3 คะแนน −80 และสถานการณ์ 3: ความน่าจะเป็น 0.2 คะแนน +10 คะแนนผลกระทบคาดหมาย (ผลรวมความน่าจะเป็นคูณคะแนน) เท่าไร (ตอบจำนวนเต็ม)'
    answer:
      value: -42.0
      tolerance: 0.1
    hints:
      - คะแนนคาดหมาย = ผลรวมของ (ความน่าจะเป็น × คะแนน) ทุกสถานการณ์
      - อย่าหาค่าเฉลี่ยธรรมดาโดยไม่สนใจความน่าจะเป็น
    misconceptions:
      - match: -37
        feedback: หาค่าเฉลี่ยธรรมดาของสามสถานการณ์โดยไม่ถ่วงน้ำหนักด้วยความน่าจะเป็น
    solution: คะแนนคาดหมาย = 0.5 × (−40) + 0.3 × (−80) + 0.2 × 10 = −20 − 24 + 2 = −42 ค่าที่ได้บอกว่าโดยเฉลี่ยมีผลเชิงลบ แม้จะมีสถานการณ์ที่เป็นผลบวกอยู่บ้าง
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.eia.p009
    topics:
      - engineering.environmental.eia
    difficulty: 3
    type: numeric
    stem: จากเมทริกซ์ Leopold ในภาพ กิจกรรม A1 มีคะแนนรวมจากทั้งสามปัจจัย −93 หากมาตรการลดขนาดผลกระทบต่อคุณภาพน้ำผิวดิน (F2) ของ A1 ลงครึ่งหนึ่ง (จาก m = −7 เป็น m = −3.5) คะแนนรวมของ A1 จะเปลี่ยนเป็นเท่าไร (ตอบทศนิยมหนึ่งตำแหน่ง)
    figure:
      src: leopold-matrix.svg
      alt: ตารางสามคูณสาม แถวคือกิจกรรม A1 ขุดหน้าดิน A2 ขนส่งแร่ และ A3 ปลูกป่าฟื้นฟู คอลัมน์คือ F1 คุณภาพอากาศ F2 คุณภาพน้ำผิวดิน และ F3 การจ้างงานท้องถิ่น ช่อง A1 มีค่า m = −6 i = 8, m = −7 i = 9, m = +3 i = 6 ช่อง A2 มีค่า m = −4 i = 5, m = −2 i = 4, m = +2 i = 3 ช่อง A3 มีค่า m = +2 i = 6, m = +4 i = 7, m = +5 i = 8
    answer:
      value: -61.5
      tolerance: 0.1
    hints:
      - คำนวณคะแนนใหม่ของ F2 ด้วย m ใหม่ × i เดิม (i = 9)
      - คะแนน F1 และ F3 ไม่เปลี่ยน ให้นำมารวมกับคะแนนใหม่ของ F2
    misconceptions:
      - match: -46.5
        feedback: หารคะแนนรวมด้วยสองแทนที่จะลดเฉพาะปัจจัย F2 และเปลี่ยน m ไม่ได้เปลี่ยน i
    solution: F2 ใหม่ = (−3.5) × 9 = −31.5 คะแนนรวม A1 = −48 + (−31.5) + 18 = −61.5 การลดขนาดผลกระทบจึงทำให้คะแนนรวมดีขึ้นจาก −93 เป็น −61.5
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.environmental.eia.p010
    topics:
      - engineering.environmental.eia
    difficulty: 3
    type: mcq
    stem: ข้อใดเป็นการมีส่วนร่วมของประชาชนที่มีประสิทธิผลมากที่สุดในกระบวนการ EIA
    choices:
      - id: a
        text: เปิดรับความเห็นตั้งแต่ขั้นกำหนดขอบเขต และตอบกลับว่าความเห็นใดถูกนำไปใช้หรือไม่และเพราะเหตุใด
        correct: true
      - id: b
        text: จัดเวทีรับฟังครั้งเดียวหลังรายงานเสร็จเพื่อให้ผ่านขั้นตอน
        feedback: เวทีที่มาช้าเกินไปทำให้ความเห็นไม่มีผลต่อการออกแบบโครงการ
      - id: c
        text: ส่งเอกสารทางอินเทอร์เน็ตโดยไม่มีช่องทางตอบกลับ
        feedback: การให้ข้อมูลอย่างเดียวไม่เท่ากับการมีส่วนร่วม
      - id: d
        text: เลือกเฉพาะผู้ที่สนับสนุนโครงการมาให้ความเห็น
        feedback: การเลือกเฉพาะบางกลุ่มทำให้ผลการรับฟังไม่สะท้อนผู้ได้รับผลกระทบจริง
    hints:
