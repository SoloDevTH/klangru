<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="sans-serif">
<title>ทางเดินของอาหารและของเสียในร่างกาย</title>
<rect x="0" y="0" width="700" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="350.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">อาหารเข้า ของเสียออก: ระบบย่อยอาหารกับระบบขับถ่าย</text>
<text x="125.0" y="60.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#9c4f1f">ระบบย่อยอาหาร</text>
<rect x="40.0" y="72.0" width="170.0" height="38.0" rx="8" fill="#fff1e6" stroke="#b5562b" stroke-width="2"/>
<text x="125.0" y="97.0" font-size="15" text-anchor="middle" fill="#111">ปากและฟัน</text>
<line x1="125.0" y1="111.0" x2="125.0" y2="123.0" stroke="#b5562b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40.0" y="124.0" width="170.0" height="38.0" rx="8" fill="#fff1e6" stroke="#b5562b" stroke-width="2"/>
<text x="125.0" y="149.0" font-size="15" text-anchor="middle" fill="#111">หลอดอาหาร</text>
<line x1="125.0" y1="163.0" x2="125.0" y2="175.0" stroke="#b5562b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40.0" y="176.0" width="170.0" height="38.0" rx="8" fill="#fff1e6" stroke="#b5562b" stroke-width="2"/>
<text x="125.0" y="201.0" font-size="15" text-anchor="middle" fill="#111">กระเพาะอาหาร</text>
<line x1="125.0" y1="215.0" x2="125.0" y2="227.0" stroke="#b5562b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40.0" y="228.0" width="170.0" height="38.0" rx="8" fill="#fff1e6" stroke="#b5562b" stroke-width="2"/>
<text x="125.0" y="253.0" font-size="15" text-anchor="middle" fill="#111">ลำไส้เล็ก</text>
<line x1="125.0" y1="267.0" x2="125.0" y2="279.0" stroke="#b5562b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40.0" y="280.0" width="170.0" height="38.0" rx="8" fill="#fff1e6" stroke="#b5562b" stroke-width="2"/>
<text x="125.0" y="305.0" font-size="15" text-anchor="middle" fill="#111">ลำไส้ใหญ่</text>
<line x1="125.0" y1="319.0" x2="125.0" y2="331.0" stroke="#b5562b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40.0" y="332.0" width="170.0" height="38.0" rx="8" fill="#fff1e6" stroke="#b5562b" stroke-width="2"/>
<text x="125.0" y="357.0" font-size="15" text-anchor="middle" fill="#111">ทวารหนัก</text>
<text x="220.0" y="97.0" font-size="12.5" text-anchor="start" fill="#444">เคี้ยวให้ละเอียด</text>
<text x="220.0" y="201.0" font-size="12.5" text-anchor="start" fill="#444">ย่อยด้วยน้ำย่อย</text>
<text x="220.0" y="253.0" font-size="12.5" text-anchor="start" fill="#444">ดูดซึมสารอาหาร (ตับ ตับอ่อนช่วย)</text>
<text x="220.0" y="305.0" font-size="12.5" text-anchor="start" fill="#444">ดูดน้ำกลับ เก็บกากอาหาร</text>
<text x="220.0" y="357.0" font-size="12.5" text-anchor="start" fill="#444">ขับกากออกเป็นอุจจาระ</text>
<text x="560.0" y="60.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f4f94">ระบบขับถ่าย</text>
<rect x="440.0" y="72.0" width="240.0" height="38.0" rx="8" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/>
<text x="560.0" y="97.0" font-size="13.5" text-anchor="middle" fill="#111">ไต (2 ข้าง) กรองของเสียจากเลือด</text>
<line x1="560.0" y1="111.0" x2="560.0" y2="123.0" stroke="#3b6ea5" stroke-width="2" marker-end="url(#ah)"/>
<rect x="440.0" y="124.0" width="240.0" height="38.0" rx="8" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/>
<text x="560.0" y="149.0" font-size="13.5" text-anchor="middle" fill="#111">ท่อไต</text>
<line x1="560.0" y1="163.0" x2="560.0" y2="175.0" stroke="#3b6ea5" stroke-width="2" marker-end="url(#ah)"/>
<rect x="440.0" y="176.0" width="240.0" height="38.0" rx="8" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/>
<text x="560.0" y="201.0" font-size="13.5" text-anchor="middle" fill="#111">กระเพาะปัสสาวะ เก็บปัสสาวะ</text>
<line x1="560.0" y1="215.0" x2="560.0" y2="227.0" stroke="#3b6ea5" stroke-width="2" marker-end="url(#ah)"/>
<rect x="440.0" y="228.0" width="240.0" height="38.0" rx="8" fill="#eef4fb" stroke="#3b6ea5" stroke-width="2"/>
<text x="560.0" y="253.0" font-size="13.5" text-anchor="middle" fill="#111">ท่อปัสสาวะ ขับออก</text>
<text x="560.0" y="294.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f4f94">ทางขับของเสียอื่น</text>
<text x="560.0" y="318.0" font-size="13.5" text-anchor="middle" fill="#111">ลำไส้ใหญ่ → อุจจาระ</text>
<text x="560.0" y="340.0" font-size="13.5" text-anchor="middle" fill="#111">ผิวหนัง → เหงื่อ</text>
<text x="560.0" y="362.0" font-size="13.5" text-anchor="middle" fill="#111">ปอด → คาร์บอนไดออกไซด์</text>
</svg>
