  - ฟังก์ชันที่เป็นฟังก์ชันคู่มีเฉพาะกำลังคู่ของ $x$
  solution: $e^x$ มีทุกกำลังของ $x$ ส่วน $\sin x$ มีเฉพาะกำลังคี่ และ $\cos x$ มีเฉพาะกำลังคู่ ส่วน $(1+x)^k$ ใช้สัมประสิทธิ์ทวินาม
  license: CC-BY-SA-4.0
