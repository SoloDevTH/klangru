    hints:
      - "หาความเร็วแนวดิ่งตอนกระทบน้ำก่อน ความเร็วแนวราบยังเป็น $8\\ \\mathrm{m/s}$"
      - "มุมกับแนวราบหาจาก $\\tan\\alpha = \\dfrac{v_y}{v_x}$"
    misconceptions:
      - { match: 22.2, feedback: "ดูเหมือนใช้ $\\tan\\alpha = \\dfrac{v_x}{v_y}$ ซึ่งเป็นมุมที่วัดจากแนวดิ่ง มุมกับแนวราบใช้ $\\dfrac{v_y}{v_x}$" }
      - { match: 50.8, feedback: "ดูเหมือนใช้มุมของเส้นที่ลากจากจุดขว้างไปยังจุดตก ($\\tan^{-1}\\tfrac{19.6}{16}$) ทิศของความเร็วต้องหาจากองค์ประกอบความเร็ว $\\dfrac{v_y}{v_x}$ ไม่ใช่จากตำแหน่ง $\\dfrac{y}{x}$" }
    solution: "$v_y = \\sqrt{2gh} = \\sqrt{2(9.8)(19.6)} = 19.6\\ \\mathrm{m/s}$ และ $v_x = 8\\ \\mathrm{m/s}$ จึงได้ $\\tan\\alpha = \\dfrac{19.6}{8} = 2.45$ ได้ $\\alpha \\approx 67.8^\\circ$ ใต้แนวราบ (อัตราเร็วขณะกระทบ $\\sqrt{8^2 + 19.6^2} \\approx 21.2\\ \\mathrm{m/s}$)"
