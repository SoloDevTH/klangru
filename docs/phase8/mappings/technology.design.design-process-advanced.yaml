rows:
  - { framework: th-core-2560-science, indicators: ["ว 4.1 ม.3/2", "ว 4.1 ม.4/2"], coverage: full, note: "ปัญหาชุมชนที่มีผู้มีส่วนได้ส่วนเสียหลายกลุ่ม (รวมงานอาชีพ ผู้เลี้ยงปลาริมคลอง) สรุปกรอบปัญหาเป็นข้อจำกัดกับเกณฑ์ ข้อมูลปฐมภูมิและทุติยภูมิ วิเคราะห์ข้อมูลสำรวจ และการใช้ภาพ โค้ด และสิ่งประดิษฐ์ของผู้อื่นให้ถูกต้องด้านทรัพย์สินทางปัญญา (ลิขสิทธิ์ สัญญาอนุญาต สิทธิบัตร อนุสิทธิบัตร)" }
  - { framework: th-core-2560-science, indicators: ["ว 4.1 ม.3/3", "ว 4.1 ม.4/3"], coverage: partial, note: "ตัดทางเลือกด้วยข้อจำกัดก่อนเมทริกซ์ถ่วงน้ำหนัก การแลกได้แลกเสีย ผลที่พลิกเมื่อปรับน้ำหนัก รายการวัสดุและต้นทุน เลือกเทคนิคนำเสนอ (ภาพร่าง CAD สามมิติ ผังงาน จำลองวงจร สาธิต) ให้เหมาะกับผู้ฟัง แต่การใช้ซอฟต์แวร์ช่วยออกแบบจริงและการดำเนินการแก้ปัญหาทำนอกแอป" }
  - { framework: th-core-2560-science, indicators: ["ว 4.1 ม.3/4", "ว 4.1 ม.4/4"], coverage: partial, note: "ทดสอบตามข้อจำกัดและเกณฑ์ วิเคราะห์ข้อมูลเซนเซอร์ ให้เหตุผลของข้อบกพร่องด้วยการถามว่าทำไม คำนวณเวลาใช้แบตเตอรี่ ปรับปรุง 3 รอบ และเสนอแนวทางต่อยอด แต่การทดสอบชิ้นงานจริงและนำเสนอผลงานของตนเองทำนอกแอป" }
