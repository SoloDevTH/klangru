id: business.accounting.equation
subject: business
title: { th: สมการบัญชีและงบกำไรขาดทุน, en: The accounting equation and the income statement }
summary: สินทรัพย์เท่ากับหนี้สินบวกส่วนของเจ้าของ รายการค้าแต่ละแบบเปลี่ยนสมการอย่างไร และหากำไรสุทธิจากรายได้ลบค่าใช้จ่าย
difficulty: 4
minutes: 40
prerequisites: [math.algebra.linear-eq]
encompasses:
  - { id: math.algebra.linear-eq, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: equation-bars.svg
    alt: "แผนภาพแท่งสองแท่งสูงเท่ากันตามสัดส่วนจริง แท่งซ้ายคือสินทรัพย์รวม 37,000 บาท แบ่งเป็นเงินสด 29,000 บาทกับอุปกรณ์ 8,000 บาท แท่งขวาคือหนี้สิน 10,000 บาทกับส่วนของเจ้าของ 27,000 บาท รวม 37,000 บาท มีเครื่องหมายเท่ากับอยู่ระหว่างสองแท่ง"
    caption: "แผงตลาดนัดของฝนสิ้นเดือน: สองฝั่งของสมการบัญชีเท่ากันเสมอ"
  - { type: check, problem: bus.acc.p006, prompt: "ลองคิดก่อนดูตัวอย่าง" }
  - type: worked-example
    title: หาส่วนของเจ้าของของร้านค้าออนไลน์
    problem: "ร้านขายเสื้อผ้าออนไลน์ของบีมมีเงินสด $15{,}000$ บาท เงินฝากธนาคาร $60{,}000$ บาท สินค้าคงเหลือ $45{,}000$ บาท ค้างจ่ายค่าสินค้าแก่ผู้ขายส่ง (เจ้าหนี้) $12{,}000$ บาท และมีเงินกู้ $23{,}000$ บาท ส่วนของเจ้าของเป็นเท่าใด"
    steps:
      - text: "แยกประเภท: เงินสด เงินฝาก สินค้าคงเหลือ เป็นสินทรัพย์ เจ้าหนี้และเงินกู้เป็นหนี้สิน"
        why: "สินทรัพย์คือสิ่งที่กิจการมีและใช้ประโยชน์ได้ หนี้สินคือสิ่งที่ต้องชดใช้ให้คนอื่น"
      - text: "สินทรัพย์รวม $= 15{,}000 + 60{,}000 + 45{,}000 = 120{,}000$ บาท"
      - text: "หนี้สินรวม $= 12{,}000 + 23{,}000 = 35{,}000$ บาท"
      - text: "ส่วนของเจ้าของ $=$ สินทรัพย์ $-$ หนี้สิน $= 120{,}000 - 35{,}000 = 85{,}000$ บาท"
        why: "จัดรูปสมการบัญชี $A = L + E$ ให้ $E$ อยู่ข้างเดียว"
    answer: "ส่วนของเจ้าของ $85{,}000$ บาท"
  - type: worked-example
    title: ติดตามสมการบัญชีของแผงตลาดนัดตลอดเดือน
    problem: "ฝนเปิดแผงตลาดนัด (1) นำเงินส่วนตัวมาลงทุน $20{,}000$ บาท (2) ยืมเงินแม่ $10{,}000$ บาท (3) ซื้อเต็นท์และโต๊ะด้วยเงินสด $8{,}000$ บาท (4) ขายได้เงินสด $15{,}000$ บาท (5) จ่ายค่าวัตถุดิบ $5{,}000$ บาทและค่าเช่าแผง $2{,}000$ บาท (6) ถอนเงินไปใช้ส่วนตัว $1{,}000$ บาท หากำไรสุทธิของเดือน และตรวจสมการบัญชีสิ้นเดือน"
    steps:
      - text: "(1) เงินสด $+20{,}000$ ทุน $+20{,}000$ (2) เงินสด $+10{,}000$ หนี้สิน $+10{,}000$"
        why: "เงินที่ยืมมาต้องคืน จึงเป็นหนี้สิน ไม่ใช่รายได้"
      - text: "(3) อุปกรณ์ $+8{,}000$ เงินสด $-8{,}000$ สินทรัพย์รวมเท่าเดิม"
      - text: "(4) เงินสด $+15{,}000$ รายได้ $+15{,}000$ (5) เงินสด $-7{,}000$ ค่าใช้จ่าย $7{,}000$"
      - text: "กำไรสุทธิ $= 15{,}000 - 7{,}000 = 8{,}000$ บาท"
        why: "การถอนใช้ส่วนตัวในข้อ (6) ไม่ใช่ค่าใช้จ่ายของกิจการ จึงไม่นำมาหักในงบกำไรขาดทุน"
      - text: "(6) เงินสด $-1{,}000$ ส่วนของเจ้าของ $-1{,}000$ ได้เงินสดสิ้นเดือน $20{,}000 + 10{,}000 - 8{,}000 + 15{,}000 - 7{,}000 - 1{,}000 = 29{,}000$ บาท"
      - text: "ตรวจ: สินทรัพย์ $29{,}000 + 8{,}000 = 37{,}000$ บาท หนี้สิน $10{,}000$ บาท ส่วนของเจ้าของ $20{,}000 + 8{,}000 - 1{,}000 = 27{,}000$ บาท และ $10{,}000 + 27{,}000 = 37{,}000$ บาท"
    answer: "กำไรสุทธิ $8{,}000$ บาท สิ้นเดือน สินทรัพย์ $37{,}000$ บาท $=$ หนี้สิน $10{,}000$ บาท $+$ ส่วนของเจ้าของ $27{,}000$ บาท"
  - { type: check, problem: bus.acc.p010, prompt: "ลองหาส่วนของเจ้าของปลายงวด" }
glossary:
  - { term: สินทรัพย์, definition: "ทรัพยากรที่กิจการเป็นเจ้าของและให้ประโยชน์ในอนาคต เช่น เงินสด ลูกหนี้ สินค้า อุปกรณ์" }
  - { term: หนี้สิน, definition: "ภาระที่กิจการต้องชดใช้ให้ผู้อื่น เช่น เงินกู้ เจ้าหนี้การค้า" }
  - { term: ส่วนของเจ้าของ, definition: "สิทธิของเจ้าของในสินทรัพย์หลังหักหนี้สิน เพิ่มเมื่อลงทุนเพิ่มหรือมีกำไร ลดเมื่อขาดทุนหรือถอนใช้ส่วนตัว" }
  - { term: งบกำไรขาดทุน, definition: "รายงานผลการดำเนินงานของช่วงเวลาหนึ่ง แสดงรายได้ ค่าใช้จ่าย และกำไรหรือขาดทุนสุทธิ" }
  - { term: ถอนใช้ส่วนตัว, definition: "เงินหรือของที่เจ้าของนำออกจากกิจการไปใช้ส่วนตัว ลดส่วนของเจ้าของแต่ไม่ใช่ค่าใช้จ่ายของกิจการ" }
flashcards:
  - { front: "สมการบัญชี", back: "สินทรัพย์ $=$ หนี้สิน $+$ ส่วนของเจ้าของ" }
  - { front: "กู้เงินธนาคาร $20{,}000$ บาท สมการเปลี่ยนอย่างไร", back: "สินทรัพย์ (เงินสด) เพิ่ม $20{,}000$ และหนี้สินเพิ่ม $20{,}000$ ไม่ใช่รายได้" }
  - { front: "กำไรสุทธิ", back: "รายได้ $-$ ค่าใช้จ่าย ถ้าติดลบคือขาดทุนสุทธิ" }
  - { front: "ส่วนของเจ้าของปลายงวด", back: "ต้นงวด $+$ ลงทุนเพิ่ม $+$ กำไรสุทธิ $-$ ถอนใช้ส่วนตัว" }
