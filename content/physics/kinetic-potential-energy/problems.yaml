      - 'ได้ผลเป็นจูลแล้วหารด้วย $10^6$ เพื่อเปลี่ยนเป็นเมกะจูล'
    misconceptions:
      - { match: 0.12, feedback: 'ดูเหมือนลืมคูณ $g$ ผลคูณ $mh$ ยังไม่ใช่พลังงาน' }
      - { match: 1176, feedback: 'นั่นคือค่าในหน่วยกิโลจูล โจทย์ถามเป็นเมกะจูล ($1\ \mathrm{MJ} = 1000\ \mathrm{kJ}$)' }
    solution: '$E_p = mgh = (1000)(9.8)(120) = 1\,176\,000\ \mathrm{J} \approx 1.18\ \mathrm{MJ}$ ต่อน้ำหนึ่งลูกบาศก์เมตร เขื่อนปล่อยน้ำหลายร้อยลูกบาศก์เมตรต่อวินาที จึงได้พลังงานมหาศาล'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ke.p019
    topics: [physics.energy.kinetic-potential]
    difficulty: 4
    type: numeric
    stem: 'นักตะกร้อเตะลูกตะกร้อมวล $0.17\ \mathrm{kg}$ ที่เกือบหยุดนิ่งให้พุ่งออกไปด้วยอัตราเร็ว $20\ \mathrm{m/s}$ ถ้าเท้าสัมผัสลูกตะกร้อเป็นระยะทาง $0.10\ \mathrm{m}$ เท้าออกแรงเฉลี่ยต่อลูกตะกร้อเท่าใด ถือว่าลูกเริ่มจากหยุดนิ่ง (ตอบเป็นตัวเลขในหน่วย N)'
    answer: { value: 340, tolerance: 3.4, unit: N }
    hints:
      - 'งานที่เท้าทำต่อลูกตะกร้อเท่ากับพลังงานจลน์ที่ลูกได้รับ (ทฤษฎีบทงาน–พลังงาน)'
      - 'หาพลังงานจลน์สุดท้าย $\tfrac{1}{2}mv^2$ ก่อน'
      - 'งาน $= F \times s$ จึงได้ $F = \dfrac{\Delta E_k}{s}$'
    misconceptions:
      - { match: 34, feedback: 'นั่นคืองาน (หน่วย J) ที่เท้าทำ ยังต้องหารด้วยระยะสัมผัส $0.10\ \mathrm{m}$ จึงได้แรง' }
      - { match: 680, feedback: 'ดูเหมือนลืม $\tfrac{1}{2}$ ในพลังงานจลน์' }
    solution: '$\Delta E_k = \tfrac{1}{2}(0.17)(20)^2 = 34\ \mathrm{J}$ ซึ่งเท่ากับงานของเท้า $F(0.10) = 34$ → $F = 340\ \mathrm{N}$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ke.p020
    topics: [physics.energy.kinetic-potential]
    difficulty: 4
    type: numeric
    stem: 'รถยนต์วิ่งบนถนนพหลโยธินด้วยอัตราเร็ว $60\ \mathrm{km/h}$ เมื่อเบรกเต็มที่จะไถลไป $18\ \mathrm{m}$ จึงหยุด ถ้ารถคันเดิมวิ่งด้วย $90\ \mathrm{km/h}$ และเบรกด้วยแรงเบรกเท่าเดิม จะไถลไปไกลเท่าใดจึงหยุด (ตอบเป็นตัวเลขในหน่วย m)'
    answer: { value: 40.5, tolerance: 0.4, unit: m }
    hints:
      - 'งานของแรงเบรก $F \cdot s$ ต้องเท่ากับพลังงานจลน์ที่ต้องกำจัดออก'
      - 'แรงเบรกเท่าเดิม ระยะเบรกจึงแปรผันตรงกับพลังงานจลน์ ซึ่งแปรตาม $v^2$'
      - 'อัตราเร็วเพิ่มเป็น $\tfrac{90}{60} = 1.5$ เท่า ระยะเบรกเพิ่มเป็น $1.5^2$ เท่า'
    misconceptions:
      - { match: 27, feedback: 'ดูเหมือนคิดว่าระยะเบรกแปรผันตรงกับอัตราเร็ว แต่พลังงานจลน์แปรตาม $v^2$ ระยะเบรกจึงเพิ่มเป็น $1.5^2 = 2.25$ เท่า' }
    solution: '$Fs = \tfrac{1}{2}mv^2$ แรงเท่าเดิม → $s \propto v^2$ ได้ $s = 18 \times \left(\dfrac{90}{60}\right)^2 = 18 \times 2.25 = 40.5\ \mathrm{m}$ เร็วขึ้นเพียงครึ่งหนึ่ง แต่ระยะเบรกเพิ่มกว่าสองเท่า'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ke.p021
    topics: [physics.energy.kinetic-potential]
