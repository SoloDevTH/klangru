    solution: "ผลรวมคือผลรวมรีมันน์ปลายขวาของ $x^2$ บน $[1, 4]$ จึงเท่ากับ $\\Big[\\tfrac{x^3}{3}\\Big]_1^4 = \\tfrac{64 - 1}{3} = 21$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.calculus.definite-integral.p019
    topics: [math.calculus.definite-integral]
