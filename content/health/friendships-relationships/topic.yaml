id: health.family.friendships-relationships
subject: health
title: { th: เพื่อนและการสร้างสัมพันธภาพ, en: "Friends and building relationships" }
summary: ความสำคัญของเพื่อน คุณลักษณะของเพื่อนและสมาชิกที่ดีของครอบครัว วิธีสร้างและรักษาสัมพันธภาพ การสื่อสารอย่างให้เกียรติ และการขอความช่วยเหลือเมื่อความสัมพันธ์ไม่ปลอดภัย
difficulty: 1.5
minutes: 25
prerequisites: [health.family.family-and-self]
encompasses:
  - { id: health.family.family-and-self, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: พูดแบบใช้ "ฉัน"
    src: i-message.svg
    alt: "สูตรพูดบอกความรู้สึกแบบให้เกียรติสี่ขั้น 1 ฉันรู้สึก... บอกความรู้สึก เช่น เรารู้สึกเสียใจ 2 เมื่อ... บอกสิ่งที่เกิดขึ้น เช่น ตอนที่เธอล้อชื่อพ่อแม่ของเรา 3 เพราะ... บอกเหตุผล เช่น เพราะเราอายเพื่อนคนอื่น 4 ฉันอยากให้... บอกสิ่งที่ขอ เช่น เราอยากให้เธอเรียกชื่อเราแทน ด้านล่างเตือนว่าไม่ควรพูดต่อว่า เช่น เธอนิสัยไม่ดี เธอชอบแกล้งคนอื่นตลอด เพราะทำให้ทะเลาะกันมากขึ้น"
    caption: "บอกความรู้สึกของเราและสิ่งที่อยากให้เป็น โดยไม่ตัดสินว่าอีกฝ่ายเป็นคนไม่ดี"
  - type: worked-example
    title: เปลี่ยนคำต่อว่าเป็นการพูดแบบใช้ "ฉัน"
    problem: "ต้นข้าวยืมดินสอสีของแพรไปแล้วไม่คืนมาสามวัน แพรอยากพูดว่า \"เธอนี่ขี้ลืม ไม่น่าไว้ใจเลย\" ช่วยเปลี่ยนเป็นคำพูดที่ให้เกียรติ"
    steps:
      - text: "ฉันรู้สึก...: \"เรารู้สึกกังวล\""
        why: "บอกความรู้สึกของเรา ไม่ได้ตัดสินว่าเพื่อนเป็นคนไม่ดี เพื่อนจึงไม่รู้สึกถูกโจมตี"
      - text: "เมื่อ...: \"ที่ดินสอสียังไม่ได้คืนมาสามวันแล้ว\""
        why: "พูดถึงสิ่งที่เกิดขึ้นจริง ไม่ใช่นิสัยของเพื่อน"
      - text: "เพราะ...: \"เพราะพรุ่งนี้เราต้องใช้ระบายสีงานศิลปะ\""
      - text: "ฉันอยากให้...: \"เธอช่วยเอามาคืนพรุ่งนี้เช้าได้ไหม\""
    answer: "\"เรารู้สึกกังวลที่ดินสอสียังไม่ได้คืนมาสามวันแล้ว เพราะพรุ่งนี้ต้องใช้ระบายสีงานศิลปะ ช่วยเอามาคืนพรุ่งนี้เช้าได้ไหม\""
  - { type: check, problem: health.family.friendships-relationships.p006, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: อ่านผลสำรวจเรื่องเพื่อน
    problem: "จากแผนภูมิผลสำรวจสิ่งที่นักเรียนชอบที่สุดในตัวเพื่อนสนิท นักเรียนที่เลือกเรื่องซื่อสัตย์จริงใจคิดเป็นร้อยละเท่าไร และผลนี้บอกอะไร"
    figure:
      src: friend-survey.svg
      alt: "แผนภูมิแท่งแนวนอน สิ่งที่ชอบที่สุดในตัวเพื่อนสนิท สำรวจห้องหนึ่ง คนละ 1 คำตอบ ซื่อสัตย์จริงใจ 12 คน ใจดีช่วยเหลือกัน 9 คน ตลกเล่นด้วยแล้วสนุก 5 คน เรียนเก่ง 3 คน มีของเล่นเยอะ 1 คน"
    steps:
      - text: "หาจำนวนคนทั้งหมด: 12 + 9 + 5 + 3 + 1 = 30 คน"
        why: "แต่ละคนตอบได้ 1 คำตอบ ผลรวมจึงเท่ากับจำนวนนักเรียน"
      - text: "หาร้อยละ: 12 ÷ 30 × 100 = 40"
      - text: "แปลผล: คำตอบที่มากที่สุดคือความซื่อสัตย์และความใจดี ส่วนของเล่นมีคนเลือกน้อยที่สุด"
        why: "แสดงว่าสิ่งที่ทำให้คนอยากเป็นเพื่อนด้วยคือนิสัย ไม่ใช่สิ่งของ"
    answer: "ร้อยละ 40 และผลสำรวจบอกว่านักเรียนให้ความสำคัญกับนิสัยของเพื่อนมากกว่าสิ่งของ"
  - { type: check, problem: health.family.friendships-relationships.p004 }
glossary:
  - { term: สัมพันธภาพ, definition: "ความสัมพันธ์ระหว่างเรากับผู้อื่น เช่น เพื่อน ครอบครัว ครู" }
  - { term: การพูดแบบใช้ ฉัน, definition: "การบอกความรู้สึก สิ่งที่เกิดขึ้น เหตุผล และสิ่งที่ขอ โดยไม่ต่อว่าอีกฝ่าย" }
  - { term: การกลั่นแกล้ง, definition: "การทำให้ผู้อื่นเจ็บกายหรือเจ็บใจซ้ำ ๆ โดยตั้งใจ ทั้งต่อหน้าและทางออนไลน์" }
  - { term: การปฏิเสธ, definition: "การบอกว่าไม่ทำอย่างสุภาพแต่ชัดเจน เมื่อถูกชวนทำสิ่งที่ไม่ถูกต้องหรือไม่ปลอดภัย" }
flashcards:
  - { front: "เพื่อนสำคัญอย่างไร", back: "ช่วยเหลือกัน ให้กำลังใจ ได้เรียนรู้ร่วมกัน และมีความสุข" }
  - { front: "เพื่อนที่ดีมีลักษณะอย่างไร", back: "ซื่อสัตย์ ช่วยเหลือแบ่งปัน ให้เกียรติ รักษาคำพูด และชวนกันทำดี" }
  - { front: "พูดแบบใช้ ฉัน มีกี่ส่วน", back: "4 ส่วน: ฉันรู้สึก... เมื่อ... เพราะ... ฉันอยากให้..." }
  - { front: "ถูกรังแกซ้ำ ๆ ควรทำอย่างไร", back: "บอกพ่อแม่ ครู หรือผู้ใหญ่ที่ไว้ใจ ผู้ใหญ่โทรปรึกษา 1323 หรือ 1300 ได้" }
