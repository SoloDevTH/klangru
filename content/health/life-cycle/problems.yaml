problems:
  - id: health.body.life-cycle.p001
    topics: [health.body.life-cycle]
    difficulty: 1
    type: order
    stem: "เรียงธรรมชาติของชีวิตมนุษย์ตามลำดับ"
    items:
      - "เกิด"
      - "เจริญเติบโต"
      - "แก่"
      - "ตาย"
    hints:
      - "ทุกคนเริ่มชีวิตจากการเป็นทารก"
      - "ร่างกายโตขึ้นก่อน แล้วจึงค่อย ๆ เสื่อมลงเมื่ออายุมาก"
    solution: "เกิด → เจริญเติบโต → แก่ → ตาย ระหว่างทางมีการเปลี่ยนแปลงตลอดเวลา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.life-cycle.p002
    topics: [health.body.life-cycle]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นสิ่งที่มนุษย์ทุกช่วงวัยต้องการเหมือนกัน"
    choices:
      - { id: a, text: "อาหาร น้ำ อากาศ การพักผ่อน และความรักความเอาใจใส่", correct: true }
      - { id: b, text: "โทรศัพท์มือถือ", feedback: "โทรศัพท์เป็นของใช้ ไม่ใช่ความต้องการพื้นฐานของชีวิต ทารกไม่ต้องใช้โทรศัพท์" }
      - { id: c, text: "ของเล่นชิ้นใหม่ทุกวัน", feedback: "ของเล่นช่วยให้สนุก แต่ไม่ใช่สิ่งที่ทุกวัยต้องการเพื่อมีชีวิตอยู่" }
    hints:
      - "นึกถึงสิ่งที่ทั้งทารกและคุณยายขาดไม่ได้"
      - "ความต้องการพื้นฐานมีทั้งด้านร่างกายและจิตใจ"
    solution: "ทุกวัยต้องการอาหาร น้ำ อากาศ ที่อยู่อาศัย การพักผ่อน และความรักความเอาใจใส่จากคนรอบข้าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.life-cycle.p003
    topics: [health.body.life-cycle]
    difficulty: 2
    type: match
    stem: "จับคู่การเปลี่ยนแปลงกับด้านของการเปลี่ยนแปลง"
    pairs:
      - { left: "ส่วนสูงเพิ่มขึ้น 5 เซนติเมตรในหนึ่งปี", right: "ด้านร่างกาย" }
      - { left: "รู้สึกภูมิใจในตัวเองที่วาดรูปได้รางวัล", right: "ด้านจิตใจ" }
      - { left: "โกรธน้องแต่ไม่ตะโกนใส่ หายใจลึก ๆ ก่อน", right: "ด้านอารมณ์" }
      - { left: "ทำงานกลุ่มกับเพื่อนและแบ่งหน้าที่กันได้", right: "ด้านสังคม" }
      - { left: "คิดโจทย์ปัญหาได้หลายวิธี", right: "ด้านสติปัญญา" }
    hints:
      - "ร่างกายคือสิ่งที่วัดหรือมองเห็นได้ สติปัญญาคือการคิดและเรียนรู้"
      - "ความรู้สึกต่อตัวเองเป็นด้านจิตใจ การแสดงและควบคุมอารมณ์เป็นด้านอารมณ์"
    solution: "ส่วนสูง-ร่างกาย, ความภูมิใจในตัวเอง-จิตใจ, ควบคุมความโกรธ-อารมณ์, ทำงานกลุ่ม-สังคม, คิดโจทย์-สติปัญญา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.life-cycle.p004
    topics: [health.body.life-cycle]
    difficulty: 2
    type: order
    stem: "ภาพแสดงคนห้าคนติดตัวอักษร A ถึง E แต่ละคนอยู่คนละช่วงวัย เรียงตัวอักษรจากคนที่อายุน้อยที่สุดไปมากที่สุด"
    figure:
      src: life-stages-quiz.svg
      alt: "ภาพคนห้าคนยืนเรียงกันไม่ได้เรียงตามอายุ A ผู้ใหญ่ตัวสูงที่สุด ยืนตัวตรง B ทารกตัวเล็กที่สุดนั่งอยู่บนพื้น C คนหลังค่อมเล็กน้อยถือไม้เท้า D เด็กตัวเล็ก สูงประมาณครึ่งหนึ่งของผู้ใหญ่ E วัยรุ่นตัวสูงเกือบเท่าผู้ใหญ่"
    items:
      - "B"
      - "D"
      - "E"
      - "A"
      - "C"
    hints:
      - "หาคนที่ยังเดินไม่ได้และคนที่ต้องใช้ไม้เท้าก่อน"
      - "ระหว่างคนที่ยืนได้ คนที่ตัวสูงที่สุดและยืนตัวตรงคือผู้ใหญ่ ส่วนเด็กตัวเล็กที่สุด"
    solution: "B ทารก → D วัยเด็ก → E วัยรุ่น → A วัยผู้ใหญ่ → C วัยสูงอายุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.life-cycle.p005
    topics: [health.body.life-cycle]
    difficulty: 2
    type: mcq
    stem: "ช่วงวัยใดที่ฟันน้ำนมหลุดและฟันแท้ขึ้นมาแทน"
    choices:
      - { id: a, text: "วัยเด็ก", correct: true }
      - { id: b, text: "วัยทารก", feedback: "วัยทารกเป็นช่วงที่ฟันน้ำนมเริ่มขึ้น ยังไม่หลุด" }
      - { id: c, text: "วัยสูงอายุ", feedback: "ผู้สูงอายุบางคนสูญเสียฟันแท้ แต่ฟันแท้ไม่ได้ขึ้นใหม่ในวัยนี้" }
    hints:
      - "นึกถึงตอนที่เพื่อนในชั้นประถมฟันหลอ"
      - "ฟันน้ำนมขึ้นตอนเป็นทารก แล้วหลุดในช่วงวัยถัดไป"
    solution: "ฟันน้ำนมหลุดและฟันแท้ขึ้นในวัยเด็ก (ราว 6–12 ปี)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.life-cycle.p006
    topics: [health.body.life-cycle]
    difficulty: 2
    type: text
    stem: "ตามกฎหมายไทย คนที่อายุ 60 ปีขึ้นไปอยู่ในช่วงวัยใด (ตอบชื่อช่วงวัย)"
    accepted: ["วัยสูงอายุ", "สูงอายุ", "ผู้สูงอายุ", "วัยผู้สูงอายุ", "วัยชรา"]
    misconceptions:
      - { match: "วัยผู้ใหญ่", feedback: "วัยผู้ใหญ่คือราว 20–59 ปี เมื่ออายุ 60 ปีขึ้นไปนับเป็นผู้สูงอายุ" }
    hints:
      - "เป็นช่วงวัยสุดท้ายของชีวิต"
      - "คุณตาคุณยายหลายคนอยู่ในวัยนี้"
    solution: "วัยสูงอายุ กฎหมายผู้สูงอายุของไทยนับคนอายุ 60 ปีขึ้นไปเป็นผู้สูงอายุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.life-cycle.p007
    topics: [health.body.life-cycle]
    difficulty: 2
    type: numeric
    stem: "ปู่ของมิ้นอายุ 67 ปี ปู่เข้าสู่วัยสูงอายุ (อายุ 60 ปี) มาแล้วกี่ปี (ตอบเป็นปี)"
    answer: { value: 7, unit: ปี }
    misconceptions:
      - { match: 127, feedback: "ต้องนำอายุปู่ลบด้วย 60 ไม่ใช่บวก" }
      - { match: 67, feedback: "67 คืออายุของปู่ ต้องหาว่าเกิน 60 มาแล้วกี่ปี" }
    hints:
      - "วัยสูงอายุเริ่มที่ 60 ปี"
      - "นำอายุปัจจุบันลบด้วยอายุที่เริ่มเป็นผู้สูงอายุ"
    solution: "67 − 60 = 7 ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.life-cycle.p008
    topics: [health.body.life-cycle]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นการเปลี่ยนแปลงที่พบบ่อยในวัยรุ่น (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ส่วนสูงเพิ่มขึ้นอย่างรวดเร็ว", correct: true }
      - { id: b, text: "อารมณ์เปลี่ยนแปลงง่าย", correct: true }
      - { id: c, text: "ให้ความสำคัญกับเพื่อนมากขึ้น", correct: true }
      - { id: d, text: "ฟันน้ำนมเริ่มขึ้นซี่แรก", feedback: "ฟันน้ำนมเริ่มขึ้นในวัยทารก" }
      - { id: e, text: "ผมเริ่มขาวและสายตายาว", feedback: "เป็นการเปลี่ยนแปลงที่พบในวัยผู้ใหญ่ตอนปลายและวัยสูงอายุ" }
    hints:
      - "วัยรุ่นมีฮอร์โมนที่ทำให้ร่างกายเปลี่ยนเร็ว"
      - "ข้อที่ถูกมีสามข้อ ครอบคลุมด้านร่างกาย อารมณ์ และสังคม"
    solution: "วัยรุ่นสูงขึ้นเร็ว (ร่างกาย) อารมณ์เปลี่ยนง่าย (อารมณ์) และให้ความสำคัญกับเพื่อน (สังคม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.life-cycle.p009
    topics: [health.body.life-cycle]
    difficulty: 3
    type: mcq
    stem: "น้องสาวของภูมิอายุ 1 ขวบ ชอบหยิบของทุกอย่างเข้าปาก ภูมิควรช่วยดูแลน้องอย่างไร"
    choices:
      - { id: a, text: "เก็บของชิ้นเล็ก เช่น ลูกปัด เหรียญ ยางลบ ให้พ้นมือน้อง", correct: true }
      - { id: b, text: "ดุน้องเสียงดังทุกครั้งจนน้องเลิกทำ", feedback: "ทารกเรียนรู้โลกด้วยการหยิบจับและใส่ปาก ยังเข้าใจคำห้ามได้น้อย การจัดของให้ปลอดภัยได้ผลกว่า" }
      - { id: c, text: "ปล่อยไว้ เพราะน้องโตแล้วจะเลิกเอง", feedback: "ของชิ้นเล็กอาจติดคอทารกได้ ต้องป้องกันก่อน" }
    hints:
      - "ทารกยังไม่รู้ว่าอะไรอันตราย"
      - "เลือกวิธีที่ป้องกันไม่ให้เกิดอันตรายตั้งแต่แรก"
    solution: "ทารกเรียนรู้ด้วยการหยิบจับและใส่ปาก จึงต้องเก็บของชิ้นเล็กที่อาจติดคอให้พ้นมือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.life-cycle.p010
    topics: [health.body.life-cycle]
    difficulty: 3
    type: mcq
    stem: "คุณยายของแก้มอายุ 78 ปี หูไม่ค่อยได้ยิน เวลาคุยกับคุณยาย แก้มควรทำอย่างไร"
    choices:
      - { id: a, text: "หันหน้าเข้าหาคุณยาย พูดช้า ๆ ชัด ๆ และใจเย็น", correct: true }
      - { id: b, text: "ตะโกนเสียงดังด้วยความหงุดหงิด", feedback: "เสียงดังอาจช่วยให้ได้ยิน แต่ความหงุดหงิดทำให้คุณยายเสียใจ ควรพูดชัดและใจเย็น" }
      - { id: c, text: "ไม่ชวนคุยเพราะต้องพูดซ้ำหลายครั้ง", feedback: "ผู้สูงอายุอาจเหงาและน้อยใจง่าย การพูดคุยช่วยด้านจิตใจและสังคมของคุณยาย" }
    hints:
      - "การได้ยินลดลงเป็นการเปลี่ยนแปลงด้านร่างกายของวัยสูงอายุ"
      - "ผู้สูงอายุต้องการความเอาใจใส่ด้วย"
    solution: "หันหน้าเข้าหาให้คุณยายเห็นปาก พูดช้าและชัด และใจเย็น เพื่อช่วยทั้งการได้ยินและความรู้สึกของคุณยาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.life-cycle.p011
    topics: [health.body.life-cycle]
    difficulty: 3
    type: numeric
    stem: "ครอบครัวหนึ่งมี 6 คน อายุ 2, 9, 15, 41, 44 และ 68 ปี มีกี่คนอยู่ในวัยผู้ใหญ่ (ราว 20–59 ปี) (ตอบเป็นคน)"
    answer: { value: 2, unit: คน }
    misconceptions:
      - { match: 3, feedback: "68 ปีเป็นวัยสูงอายุแล้ว ไม่นับเป็นวัยผู้ใหญ่" }
      - { match: 4, feedback: "15 ปีเป็นวัยรุ่น ยังไม่ถึงวัยผู้ใหญ่" }
    hints:
      - "วัยผู้ใหญ่อยู่ระหว่างราว 20 ถึง 59 ปี"
      - "ตรวจทีละคนว่าอายุอยู่ในช่วงนี้หรือไม่"
    solution: "41 และ 44 ปีอยู่ในวัยผู้ใหญ่ รวม 2 คน (2 ทารก, 9 เด็ก, 15 วัยรุ่น, 68 สูงอายุ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.life-cycle.p012
    topics: [health.body.life-cycle]
    difficulty: 3
    type: text
    stem: "ช่วงวัยใดที่ร่างกายเติบโตเร็วที่สุดในชีวิต (ตอบชื่อช่วงวัย)"
    accepted: ["วัยทารก", "ทารก"]
    misconceptions:
      - { match: "วัยรุ่น", feedback: "วัยรุ่นโตเร็วเป็นช่วงที่สอง แต่วัยทารกโตเร็วที่สุด" }
    hints:
      - "ร่างกายโตเร็วเป็นพิเศษสองช่วง"
      - "เป็นช่วงที่เร็วกว่าในสองช่วงนั้น และเกิดก่อน"
    solution: "วัยทารก ร่างกายโตเร็วที่สุดในชีวิต รองลงมาคือวัยรุ่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.life-cycle.p013
    topics: [health.body.life-cycle]
    difficulty: 4
    type: match
    stem: "เปรียบเทียบการเปลี่ยนแปลงด้านสติปัญญา จับคู่ช่วงวัยกับความสามารถที่เด่นในวัยนั้น"
    pairs:
      - { left: "วัยทารก", right: "เริ่มพูดคำง่าย ๆ และจำหน้าคนเลี้ยงได้" }
      - { left: "วัยเด็ก", right: "เรียนอ่าน เขียน และคิดเลข" }
      - { left: "วัยรุ่น", right: "คิดเรื่องนามธรรมและวางแผนอนาคต" }
      - { left: "วัยผู้ใหญ่", right: "ใช้ประสบการณ์ตัดสินใจเรื่องงานและครอบครัว" }
    hints:
      - "สติปัญญาพัฒนาจากสิ่งง่ายไปสิ่งซับซ้อน"
      - "การวางแผนอนาคตต้องคิดถึงสิ่งที่ยังไม่เกิดขึ้น ซึ่งทำได้ดีขึ้นตั้งแต่วัยรุ่น"
    solution: "ทารก-พูดคำง่าย ๆ, เด็ก-อ่านเขียนคิดเลข, วัยรุ่น-คิดนามธรรมและวางแผน, ผู้ใหญ่-ใช้ประสบการณ์ตัดสินใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.body.life-cycle.p014
    topics: [health.body.life-cycle]
    difficulty: 4
    type: mcq
    stem: "ในห้อง ป.6 ของโรงเรียนแห่งหนึ่ง เพื่อนบางคนเริ่มสูงขึ้นเร็ว มีสิว และเสียงเปลี่ยน แต่บางคนยังไม่เปลี่ยนเลย ข้อใดอธิบายถูกต้อง"
    choices:
      - { id: a, text: "แต่ละคนเข้าสู่วัยรุ่นไม่พร้อมกัน เป็นเรื่องปกติ", correct: true }
      - { id: b, text: "คนที่ยังไม่เปลี่ยนแปลงมีความผิดปกติ ต้องรีบกินยา", feedback: "การเริ่มเข้าวัยรุ่นช้าหรือเร็วกว่าเพื่อนเล็กน้อยเป็นเรื่องปกติ ถ้ากังวลให้ปรึกษาผู้ปกครองหรือแพทย์ ไม่ซื้อยากินเอง" }
