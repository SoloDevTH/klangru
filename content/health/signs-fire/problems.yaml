  - id: health.safety.signs-fire.p017
    topics: [health.safety.signs-fire]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ครอบครัวของต้นวางแผนหนีไฟไว้ดังนี้ \"ถ้าไฟไหม้ ทุกคนวิ่งไปเก็บของมีค่าก่อน ใครอยู่ชั้นบนให้ใช้บันไดหลักทางเดียว ถ้ามีควันให้เดินตัวตรงเร็ว ๆ ออกมาแล้วรอที่หน้าประตูบ้าน\" ข้อใดเป็นสิ่งที่ควรแก้ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ไม่เก็บของ ออกจากบ้านทันที", correct: true }
      - { id: b, text: "เตรียมทางหนีไว้อย่างน้อย 2 ทาง เผื่อทางหลักมีไฟ", correct: true }
      - { id: c, text: "ถ้ามีควัน ให้ก้มต่ำหรือคลานและปิดจมูก", correct: true }
      - { id: d, text: "นัดจุดรวมพลที่ห่างจากตัวบ้าน ไม่ใช่หน้าประตู", correct: true }
      - { id: e, text: "ไม่ต้องซ้อมแผน เพราะเขียนไว้แล้ว", feedback: "แผนต้องซ้อมจริงจึงจะทำได้เร็วเมื่อเกิดเหตุ" }
    hints:
      - "ตรวจทีละประโยคของแผน"
      - "ควันลอยสูง ไฟอาจปิดทางหลัก และหน้าประตูบ้านยังใกล้ไฟเกินไป"
    solution: "ต้องแก้สี่เรื่อง: ไม่เก็บของ มีทางหนีสำรอง ก้มต่ำใต้ควัน และมีจุดรวมพลห่างจากบ้าน และควรซ้อมแผนจริง"
