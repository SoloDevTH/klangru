<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" font-family="sans-serif">
<title>ระนาบเชิงซ้อนแสดงตำแหน่งขั้ว ขั้วสามตัวอยู่ทางซ้ายของแกนจินตภาพ ได้แก่ ขั้วจริงที่ -3 และขั้วคู่ -1 บวกลบ 2i ทำให้ผลตอบสนองลดลง ครึ่งระนาบด้านขวาเป็นบริเวณของขั้วที่ทำให้ระบบไม่เสถียร</title>
<rect width="420" height="300" fill="#ffffff"/>
<rect x="20" y="20" width="170" height="260" fill="#eaf4ea"/>
<rect x="190" y="20" width="210" height="260" fill="#f8e9e6"/>
<line x1="20" y1="150" x2="400" y2="150" stroke="#444" stroke-width="1.5"/>
<line x1="190" y1="20" x2="190" y2="280" stroke="#444" stroke-width="1.5"/>
<text x="396" y="142" font-size="13" fill="#333">Re</text>
<text x="198" y="26" font-size="13" fill="#333">Im</text>
<text x="185" y="156" font-size="12" text-anchor="end" fill="#333">0</text>
<text x="26" y="268" font-size="13" fill="#2e6b2e">ส่วนจริงลบ: ลดลง</text>
<text x="204" y="268" font-size="13" fill="#8a3b2b">ส่วนจริงบวก: โตขึ้น</text>
<line x1="49" y1="144" x2="61" y2="156" stroke="#15211e" stroke-width="2.4"/><line x1="49" y1="156" x2="61" y2="144" stroke="#15211e" stroke-width="2.4"/>
<text x="47.0" y="172.0" font-size="13" text-anchor="middle" fill="#15211e">−3</text>
<line x1="139" y1="54" x2="151" y2="66" stroke="#1f5fa8" stroke-width="2.4"/><line x1="139" y1="66" x2="151" y2="54" stroke="#1f5fa8" stroke-width="2.4"/>
<line x1="139" y1="234" x2="151" y2="246" stroke="#1f5fa8" stroke-width="2.4"/><line x1="139" y1="246" x2="151" y2="234" stroke="#1f5fa8" stroke-width="2.4"/>
<text x="133.0" y="64.0" font-size="13" text-anchor="end" fill="#1f5fa8">−1 + 2i</text>
<text x="133.0" y="250.0" font-size="13" text-anchor="end" fill="#1f5fa8">−1 − 2i</text>
<text x="196.0" y="168.0" font-size="0" fill="#fff"></text>
</svg>
