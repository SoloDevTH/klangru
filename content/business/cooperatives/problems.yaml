    feedback: คิดปันผลเป็น 6% ของกำไรสุทธิ ปันผลต้องคิดจากค่าหุ้น
  - match: 135000
    feedback: ลืมหักทุนสำรอง
  hints:
  - คำนวณแต่ละรายการก่อน ระวังว่าปันผลคิดจากค่าหุ้น ไม่ใช่กำไรสุทธิ
  - เงินเฉลี่ยคืน $=$ กำไรสุทธิ $-$ รายการอื่นทั้งหมด
  solution: ทุนสำรอง $= 25{,}000$ · ปันผล $= 1{,}500{,}000 \times 0.06 = 90{,}000$ · ทุนสวัสดิการ $= 12{,}500$ · โบนัส $= 12{,}500$ · เฉลี่ยคืน $= 250{,}000 - 25{,}000 - 90{,}000 - 12{,}500 - 12{,}500 = 110{,}000$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
