id: math.modelling.mathematical-modelling
subject: math
title: { th: การสร้างแบบจำลองทางคณิตศาสตร์, en: Mathematical modelling }
summary: วงจรการสร้างแบบจำลอง ตั้งสมมติฐาน เลือกปริมาณและหน่วย เลือกแบบจำลองเชิงเส้น กำลังสอง หรือเอกซ์โพเนนเชียล ตีความ ประเมิน และปรับ รวมแบบจำลองการเงินและเรขาคณิต
difficulty: 6.5
minutes: 40
prerequisites: [math.functions.exponential, math.functions.quadratic, math.number.direct-inverse-proportion]
encompasses:
  - { id: math.functions.exponential, weight: 0.3 }
  - { id: math.functions.quadratic, weight: 0.3 }
  - { id: math.number.direct-inverse-proportion, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: modelling-cycle.svg
    alt: "แผนภาพวงจรหกกล่องเชื่อมด้วยลูกศรเป็นวง: 1 ระบุปัญหา ตั้งสมมติฐาน → 2 เลือกตัวแปร ปริมาณ และหน่วย → 3 สร้างแบบจำลอง สูตร ตาราง กราฟ → 4 คำนวณ หาคำตอบ → 5 ตีความในสถานการณ์จริง → 6 ประเมินและปรับแบบจำลอง → กลับไปขั้น 1 ตรงกลางเขียนว่า ดีพอหรือยัง?"
    caption: "สร้างแบบจำลองเป็นวงจร วนซ้ำจนคำตอบดีพอสำหรับคำถาม"
  - type: worked-example
    title: เลือกแบบจำลองจากข้อมูล
    problem: "เพจขายผ้าทอมือของกลุ่มแม่บ้านมีผู้ติดตาม (ข้อมูลสมมติ) เดือนที่ 0 ถึง 3 เป็น 1,000, 1,500, 2,250, 3,375 คน จงสร้างแบบจำลอง ทำนายเดือนที่ 6 และประเมินแบบจำลอง"
    steps:
      - text: "ผลต่าง 500, 750, 1,125 ไม่คงที่ จึงไม่ใช่เชิงเส้น"
      - text: "อัตราส่วน $\\tfrac{1500}{1000} = \\tfrac{2250}{1500} = \\tfrac{3375}{2250} = 1.5$ คงที่ จึงใช้แบบจำลองเอกซ์โพเนนเชียล"
        why: "เพิ่มขึ้น 50% ต่อเดือนทุกเดือน"
      - text: "แบบจำลอง: $y = 1000(1.5)^t$ เมื่อ $t$ เป็นจำนวนเดือน $y$ เป็นจำนวนผู้ติดตาม (คน)"
      - text: "ทำนาย: $y(6) = 1000(1.5)^6 \\approx 11{,}391$ คน"
      - text: "ประเมิน: ถ้าใช้ต่อไปถึงเดือนที่ 36 จะได้ประมาณ $2.2 \\times 10^9$ คน มากกว่าประชากรโลกหนึ่งในสี่ แบบจำลองจึงใช้ได้แค่ระยะสั้น ระยะยาวการเพิ่มต้องช้าลง"
        why: "สมมติฐาน 'เพิ่ม 50% ทุกเดือน' เป็นจริงได้ไม่นาน"
    answer: "$y = 1000(1.5)^t$ ทำนายเดือนที่ 6 ได้ประมาณ 11,391 คน ใช้ได้เฉพาะระยะสั้น"
  - { type: check, problem: math.modelling.mathematical-modelling.p004, prompt: "ดูอัตราส่วนของค่าที่อยู่ติดกัน" }
  - type: figure
    src: growth-compare.svg
    alt: "กราฟสามเส้นจาก x = 0 ถึง 14 เส้นตรงสีเขียว y = 100 + 50x เริ่มสูงที่สุด พาราโบลาสีส้ม y = 5x² และเส้นโค้งสีน้ำเงิน y = 10(1.5)ˣ เริ่มต่ำที่สุด แต่ราว x = 10 เส้นสีน้ำเงินแซงทั้งสองเส้นแล้วพุ่งขึ้นเร็วกว่ามาก"
    caption: "เอกซ์โพเนนเชียลแซงเชิงเส้นและกำลังสองเสมอในที่สุด"
  - type: interactive
    title: เส้นตรงกับเอกซ์โพเนนเชียล
    caption: "เส้นแรกคือ y = kx เส้นที่สองคือ y = 1.5ˣ เพิ่มความชัน k ให้มากเท่าไรก็ได้ แล้วดูว่าเส้นเอกซ์โพเนนเชียลยังแซงได้เมื่อ x มากพอ (จุดตัดเลื่อนไปทางขวาเท่านั้น)"
    widget:
      kind: function-plot
      functions: ["k x", "1.5^x"]
      sliders:
        - { name: k, min: 1, max: 40, step: 1, value: 10, label: ความชัน k }
      x: [0, 22]
      y: [0, 600]
  - type: worked-example
    title: ออกแบบแปลงผักติดลำคลอง
    problem: "ชาวสวนมีรั้ว 60 เมตร ล้อมแปลงผักรูปสี่เหลี่ยมผืนผ้าติดลำคลอง (ด้านที่ติดคลองไม่ต้องล้อม) ควรทำแปลงขนาดเท่าใดจึงได้พื้นที่มากที่สุด"
    steps:
      - text: "สมมติฐาน: แปลงเป็นสี่เหลี่ยมผืนผ้า ใช้รั้วหมดพอดี ตัวแปร: ด้านที่ตั้งฉากกับคลองยาว $x$ เมตร"
      - text: "ด้านที่ขนานกับคลองยาว $60 - 2x$ เมตร พื้นที่ $A = x(60 - 2x) = 60x - 2x^2$ ตารางเมตร"
        why: "รั้วใช้กับสองด้านที่ตั้งฉากกับคลองและอีกหนึ่งด้านที่ขนาน"
      - text: "เป็นพาราโบลาคว่ำ ค่าสูงสุดที่จุดยอด $x = -\\dfrac{60}{2(-2)} = 15$"
      - text: "ได้แปลงกว้าง 15 เมตร ยาว 30 เมตร พื้นที่ $15 \\times 30 = 450$ ตารางเมตร"
      - text: "ตรวจ: $x = 14$ ได้ $14 \\times 32 = 448$ และ $x = 16$ ได้ $16 \\times 28 = 448$ น้อยกว่าทั้งคู่ ✓"
    answer: "กว้าง 15 เมตร (ตั้งฉากกับคลอง) ยาว 30 เมตร พื้นที่ 450 ตารางเมตร"
  - { type: check, problem: math.modelling.mathematical-modelling.p002, prompt: "นักเรียนที่เหลือต้องมีที่นั่ง" }
glossary:
  - { term: แบบจำลองทางคณิตศาสตร์, definition: "สูตร ตาราง หรือกราฟที่แทนสถานการณ์จริง ใช้ทำนายหรือตัดสินใจ" }
  - { term: สมมติฐาน, definition: "ข้อตกลงที่ทำให้ปัญหาง่ายพอจะสร้างแบบจำลองได้ ต้องบอกให้ชัดเพราะมีผลต่อคำตอบ" }
  - { term: ความหนาแน่น, definition: "ปริมาณต่อหน่วยพื้นที่หรือหน่วยปริมาตร เช่น คนต่อตารางกิโลเมตร" }
  - { term: การประเมินแบบจำลอง, definition: "ตรวจว่าคำตอบสมเหตุสมผล เทียบกับข้อมูลจริง และระบุช่วงที่แบบจำลองใช้ได้" }
flashcards:
  - { front: "ข้อมูลมีอัตราส่วนคงที่ ใช้แบบจำลองใด", back: "เอกซ์โพเนนเชียล y = abˣ" }
  - { front: "ข้อมูลมีผลต่างครั้งที่สองคงที่", back: "กำลังสอง y = ax² + bx + c" }
  - { front: "ย่อส่วนด้วยมาตราส่วน k ปริมาตรเปลี่ยนเท่าใด", back: "คูณ k³ (พื้นที่คูณ k²)" }
  - { front: "คำนวณได้ว่าต้องใช้ปูน 12.3 ถุง ควรซื้อกี่ถุง", back: "13 ถุง ปัดขึ้นเพราะ 12 ถุงไม่พอ" }
  - { front: "ขั้นตอนหลักของวงจรการสร้างแบบจำลอง", back: "ตั้งสมมติฐาน → เลือกตัวแปร → สร้าง → คำนวณ → ตีความ → ประเมินและปรับ" }
