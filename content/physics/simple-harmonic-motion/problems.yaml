problems:
  - id: phy.shm.p001
    topics: [physics.waves.shm]
    difficulty: 1
    type: mcq
    stem: "การเคลื่อนที่แบบใดเป็นการเคลื่อนที่แบบฮาร์มอนิกอย่างง่าย"
    choices:
      - { id: a, text: "แรงดึงกลับแปรผันตรงกับการกระจัดจากตำแหน่งสมดุล และมีทิศตรงข้ามกับการกระจัด", correct: true }
      - { id: b, text: "แรงที่กระทำมีขนาดและทิศคงที่ตลอดการเคลื่อนที่", feedback: "แรงคงที่ให้ความเร่งคงที่ เช่น การตกอิสระ วัตถุจะไม่แกว่งกลับไปกลับมา" }
      - { id: c, text: "วัตถุเคลื่อนที่ไปกลับด้วยอัตราเร็วคงที่ตลอด", feedback: "ใน SHM อัตราเร็วเปลี่ยนตลอด เป็นศูนย์ที่ปลายและมากที่สุดที่ตำแหน่งสมดุล" }
      - { id: d, text: "แรงแปรผันตรงกับการกระจัดและมีทิศเดียวกับการกระจัด", feedback: "ถ้าแรงชี้ไปทางเดียวกับการกระจัด วัตถุจะถูกผลักให้ห่างออกไปเรื่อย ๆ ไม่กลับมาที่ตำแหน่งสมดุล" }
    hints:
      - "อะไรทำให้วัตถุกลับมาที่ตำแหน่งสมดุลทุกครั้ง"
      - "นึกถึงกฎของฮุก $F = -kx$ เครื่องหมายลบบอกอะไร"
    solution: "SHM ต้องมีแรงดึงกลับ $F = -kx$ คือแปรผันตรงกับการกระจัดและชี้กลับเข้าหาตำแหน่งสมดุลเสมอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p002
    topics: [physics.waves.shm]
    difficulty: 1
    type: numeric
    stem: "ก้อนน้ำหนักแขวนกับสปริงสั่นขึ้นลงครบ 20 รอบในเวลา $40\\ \\mathrm{s}$ คาบของการสั่นเป็นกี่วินาที (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 2, unit: s }
    hints:
      - "คาบคือเวลาที่ใช้ต่อ 1 รอบ"
      - "นำเวลาทั้งหมดหารด้วยจำนวนรอบ"
    misconceptions:
      - { match: 0.5, feedback: "นั่นคือความถี่ (รอบต่อวินาที) คาบคือวินาทีต่อรอบ ต้องหารเวลาด้วยจำนวนรอบ" }
    solution: "$T = \\dfrac{40\\ \\mathrm{s}}{20\\ \\text{รอบ}} = 2\\ \\mathrm{s}$ (ความถี่ $f = \\tfrac{1}{T} = 0.5\\ \\mathrm{Hz}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p003
    topics: [physics.waves.shm]
    difficulty: 2
    type: numeric
    stem: "ก้อนมวล $0.5\\ \\mathrm{kg}$ ติดกับสปริงที่มีค่านิจสปริง $200\\ \\mathrm{N/m}$ บนพื้นลื่น คาบของการสั่นเป็นกี่วินาที (ตอบเป็นตัวเลขในหน่วย s ทศนิยม 3 ตำแหน่ง)"
    answer: { value: 0.314, tolerance: 0.003, unit: s }
    hints:
      - "ใช้ $T = 2\\pi\\sqrt{\\dfrac{m}{k}}$"
      - "หา $\\dfrac{m}{k}$ ก่อน ถอดราก แล้วคูณด้วย $2\\pi$"
    misconceptions:
      - { match: 125.66, feedback: "ดูเหมือนสลับเศษกับส่วนเป็น $\\sqrt{k/m}$ ลองคิดว่าคาบ 2 นาทีสำหรับสปริงแข็งและมวลเบาสมเหตุสมผลหรือไม่ สูตรที่ถูกคือ $\\sqrt{m/k}$" }
      - { match: 0.05, feedback: "นั่นคือ $\\sqrt{m/k}$ อย่างเดียว ยังต้องคูณด้วย $2\\pi$" }
    solution: "$T = 2\\pi\\sqrt{\\dfrac{0.5\\ \\mathrm{kg}}{200\\ \\mathrm{N/m}}} = 2\\pi\\sqrt{0.0025\\ \\mathrm{s^2}} = 2\\pi(0.05\\ \\mathrm{s}) \\approx 0.314\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p004
    topics: [physics.waves.shm]
    difficulty: 3
    type: match
    stem: "จับคู่การเปลี่ยนแปลงกับผลที่เกิดกับคาบของการแกว่ง (เปลี่ยนเพียงอย่างเดียว อย่างอื่นคงเดิม)"
    pairs:
      - { left: "มวลติดสปริง: เพิ่มมวลเป็น 4 เท่า", right: "คาบเพิ่มเป็น 2 เท่า" }
      - { left: "มวลติดสปริง: เปลี่ยนเป็นสปริงที่ $k$ มากเป็น 4 เท่า", right: "คาบลดเหลือครึ่งหนึ่ง" }
      - { left: "ลูกตุ้ม: เพิ่มความยาวเชือกเป็น 2 เท่า", right: "คาบเพิ่มเป็น $\\sqrt{2}$ เท่า" }
      - { left: "ลูกตุ้ม: เปลี่ยนเป็นลูกตุ้มที่หนักเป็น 2 เท่า", right: "คาบเท่าเดิม" }
      - { left: "ลูกตุ้ม: นำไปแกว่งในที่ที่ $g$ น้อยกว่าโลก 6 เท่า", right: "คาบเพิ่มเป็น $\\sqrt{6}$ เท่า" }
    hints:
      - "เขียน $T = 2\\pi\\sqrt{m/k}$ และ $T = 2\\pi\\sqrt{L/g}$ แล้วดูว่าปริมาณใดอยู่ในเศษ ปริมาณใดอยู่ในส่วน"
      - "คาบแปรผันตามรากที่สองของปริมาณในเศษ และแปรผกผันกับรากที่สองของปริมาณในส่วน"
    solution: "$m \\times 4$ → $T \\times \\sqrt{4} = 2$ เท่า · $k \\times 4$ → $T \\div \\sqrt{4}$ = ครึ่งหนึ่ง · $L \\times 2$ → $T \\times \\sqrt{2}$ · มวลลูกตุ้มไม่อยู่ในสูตร คาบเท่าเดิม · $g \\div 6$ → $T \\times \\sqrt{6}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p005
    topics: [physics.waves.shm]
    difficulty: 3
    type: numeric
    stem: "ชิงช้าในสวนสาธารณะแขวนด้วยโซ่ยาว $2.45\\ \\mathrm{m}$ ถ้าคิดว่าเป็นลูกตุ้มอย่างง่ายที่แกว่งมุมเล็ก ชิงช้าแกว่งครบ 1 รอบใช้เวลากี่วินาที ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย s ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 3.14, tolerance: 0.03, unit: s }
    hints:
      - "ใช้ $T = 2\\pi\\sqrt{\\dfrac{L}{g}}$"
      - "หา $\\dfrac{L}{g}$ ก่อน ซึ่งออกมาเป็นจำนวนที่ถอดรากง่าย"
      - "ถอดรากแล้วคูณด้วย $2\\pi$"
    misconceptions:
      - { match: 12.57, feedback: "ดูเหมือนสลับเป็น $\\sqrt{g/L}$ โซ่ที่ยาวขึ้นต้องแกว่งช้าลง ความยาวจึงต้องอยู่ในเศษ" }
      - { match: 0.5, feedback: "นั่นคือ $\\sqrt{L/g}$ อย่างเดียว ยังต้องคูณด้วย $2\\pi$" }
    solution: "$T = 2\\pi\\sqrt{\\dfrac{2.45\\ \\mathrm{m}}{9.8\\ \\mathrm{m/s^2}}} = 2\\pi\\sqrt{0.25\\ \\mathrm{s^2}} = 2\\pi(0.5\\ \\mathrm{s}) = \\pi\\ \\mathrm{s} \\approx 3.14\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p006
    topics: [physics.waves.shm]
    difficulty: 3
    type: numeric
    stem: "ก้อนมวล $0.8\\ \\mathrm{kg}$ ติดสปริงบนพื้นลื่น สั่นด้วยคาบ $0.4\\ \\mathrm{s}$ สปริงมีค่านิจสปริงเท่าใด (ตอบเป็นตัวเลขในหน่วย N/m)"
    answer: { value: 197.4, tolerance: 2, unit: N/m }
    hints:
      - "เริ่มจาก $T = 2\\pi\\sqrt{\\dfrac{m}{k}}$ แล้วจัดรูปหา $k$"
      - "ยกกำลังสองทั้งสองข้างก่อนเพื่อกำจัดราก: $T^2 = \\dfrac{4\\pi^2 m}{k}$"
      - "$k = \\dfrac{4\\pi^2 m}{T^2}$ ระวังต้องยกกำลังสองของคาบ"
    misconceptions:
      - { match: 78.96, feedback: "ดูเหมือนลืมยกกำลังสองของคาบ ($T = 0.4$ ต้องใช้ $T^2 = 0.16$)" }
      - { match: 5, feedback: "นั่นคือ $\\dfrac{m}{T^2}$ ยังไม่ได้คูณ $4\\pi^2$ ซึ่งมาจากการยกกำลังสองของ $2\\pi$" }
    solution: "$k = \\dfrac{4\\pi^2 m}{T^2} = \\dfrac{4\\pi^2 (0.8\\ \\mathrm{kg})}{(0.4\\ \\mathrm{s})^2} = \\dfrac{31.58}{0.16}\\ \\mathrm{N/m} \\approx 197\\ \\mathrm{N/m}$ ตรวจ: $2\\pi\\sqrt{\\tfrac{0.8}{197.4}} \\approx 0.40\\ \\mathrm{s}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p007
    topics: [physics.waves.shm]
    difficulty: 4
    type: numeric
    stem: "ช่างซ่อมนาฬิกาลูกตุ้มในบ้านคุณยายต้องการให้ลูกตุ้มแกว่งด้วยคาบ $1.0\\ \\mathrm{s}$ พอดี ถ้าคิดเป็นลูกตุ้มอย่างง่ายที่แกว่งมุมเล็ก ลูกตุ้มต้องยาวกี่เซนติเมตร ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย cm ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 24.8, tolerance: 0.25, unit: cm }
    hints:
      - "จัดรูป $T = 2\\pi\\sqrt{\\dfrac{L}{g}}$ ให้ $L$ อยู่ข้างเดียว"
      - "ยกกำลังสองทั้งสองข้าง: $T^2 = \\dfrac{4\\pi^2 L}{g}$"
      - "$L = \\dfrac{gT^2}{4\\pi^2}$ คำนวณเป็นเมตรแล้วแปลงเป็นเซนติเมตร"
    misconceptions:
      - { match: 156.0, feedback: "ดูเหมือนหารด้วย $2\\pi$ แทนที่จะหารด้วย $(2\\pi)^2 = 4\\pi^2$ เมื่อยกกำลังสองทั้งสองข้าง $2\\pi$ ก็ต้องยกกำลังสองด้วย" }
    solution: "$L = \\dfrac{gT^2}{4\\pi^2} = \\dfrac{(9.8\\ \\mathrm{m/s^2})(1.0\\ \\mathrm{s})^2}{39.48} \\approx 0.248\\ \\mathrm{m} = 24.8\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p008
    topics: [physics.waves.shm]
    difficulty: 4
    type: numeric
    stem: "ตุ๊กตาส่ายหัวหน้ารถมีหัวมวล $0.5\\ \\mathrm{kg}$ ติดอยู่กับสปริง $k = 50\\ \\mathrm{N/m}$ หัวตุ๊กตาส่ายไปมาในแนวระดับแบบฮาร์มอนิกอย่างง่ายด้วยแอมพลิจูด $4\\ \\mathrm{cm}$ อัตราเร็วสูงสุดของหัวตุ๊กตาเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 0.4, tolerance: 0.01, unit: m/s }
    hints:
      - "อัตราเร็วสูงสุดเกิดที่ตำแหน่งสมดุล และเท่ากับ $\\omega A$"
      - "หา $\\omega = \\sqrt{\\dfrac{k}{m}}$ ก่อน"
      - "แปลงแอมพลิจูดเป็นเมตรก่อนคูณ"
    misconceptions:
      - { match: 4, feedback: "นั่นคือ $\\omega^2 A$ ซึ่งเป็นความเร่งสูงสุด ($\\mathrm{m/s^2}$) อัตราเร็วสูงสุดคือ $\\omega A$" }
      - { match: 40, feedback: "ดูเหมือนใช้แอมพลิจูด 4 โดยไม่แปลงเป็นเมตร ได้ค่าในหน่วย cm/s แต่โจทย์ถามหน่วย m/s" }
    solution: "$\\omega = \\sqrt{\\dfrac{50\\ \\mathrm{N/m}}{0.5\\ \\mathrm{kg}}} = 10\\ \\mathrm{rad/s}$ และ $A = 0.04\\ \\mathrm{m}$ ดังนั้น $v_{\\max} = \\omega A = (10)(0.04) = 0.4\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p009
    topics: [physics.waves.shm]
    difficulty: 4
    type: expression
    stem: "นักเรียนวัดคาบ $T$ ของลูกตุ้มอย่างง่ายยาว $L$ เพื่อหาค่า $g$ จงจัดรูป $T = 2\\pi\\sqrt{\\dfrac{L}{g}}$ ให้ $g$ อยู่ข้างเดียว"
    prefix: "g ="
    answer: { latex: "\\frac{4\\pi^2 L}{T^2}", variables: [L, T] }
    misconceptions:
      - { match: "\\frac{2\\pi L}{T^2}", feedback: "เมื่อยกกำลังสองทั้งสองข้าง $2\\pi$ ก็ต้องยกกำลังสองเป็น $4\\pi^2$ ด้วย" }
      - { match: "\\frac{4\\pi^2 T^2}{L}", feedback: "สลับ $L$ กับ $T^2$ ตรวจด้วยหน่วย: $\\mathrm{s^2/m}$ ไม่ใช่หน่วยของความเร่ง ต้องได้ $\\mathrm{m/s^2}$" }
    hints:
      - "ยกกำลังสองทั้งสองข้างเพื่อกำจัดราก"
      - "จะได้ $T^2 = \\dfrac{4\\pi^2 L}{g}$ แล้วสลับ $g$ กับ $T^2$"
    solution: "ยกกำลังสอง: $T^2 = \\dfrac{4\\pi^2 L}{g}$ คูณ $g$ ทั้งสองข้างแล้วหารด้วย $T^2$: $g = \\dfrac{4\\pi^2 L}{T^2}$ ตรวจหน่วย: $\\dfrac{\\mathrm{m}}{\\mathrm{s^2}}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p010
    topics: [physics.waves.shm]
    difficulty: 5
    type: numeric
    stem: "ในห้องปฏิบัติการของโรงเรียนแห่งหนึ่งในเชียงใหม่ นักเรียนแกว่งลูกตุ้มอย่างง่ายยาว $0.90\\ \\mathrm{m}$ ด้วยมุมเล็ก จับเวลาได้ 20 รอบใน $38.1\\ \\mathrm{s}$ ค่า $g$ ที่วัดได้เป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s² ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 9.79, tolerance: 0.1, unit: m/s² }
    hints:
      - "หาคาบของ 1 รอบก่อน"
      - "จัดรูป $T = 2\\pi\\sqrt{\\dfrac{L}{g}}$ ได้ $g = \\dfrac{4\\pi^2 L}{T^2}$"
      - "แทนค่าคาบที่หาได้ (ไม่ใช่เวลา 20 รอบ) และอย่าลืมยกกำลังสอง"
    misconceptions:
      - { match: 18.65, feedback: "ดูเหมือนลืมยกกำลังสองของคาบ สูตรคือ $g = \\dfrac{4\\pi^2 L}{T^2}$" }
      - { match: 0.0245, feedback: "ดูเหมือนใช้เวลาทั้งหมด $38.1\\ \\mathrm{s}$ เป็นคาบ ต้องหารด้วย 20 รอบก่อน" }
    solution: "$T = \\dfrac{38.1\\ \\mathrm{s}}{20} = 1.905\\ \\mathrm{s}$ ดังนั้น $g = \\dfrac{4\\pi^2 (0.90\\ \\mathrm{m})}{(1.905\\ \\mathrm{s})^2} = \\dfrac{35.53}{3.629}\\ \\mathrm{m/s^2} \\approx 9.79\\ \\mathrm{m/s^2}$ ใกล้เคียงค่า $9.8\\ \\mathrm{m/s^2}$ การจับเวลาหลายรอบช่วยลดความคลาดเคลื่อนจากการกดนาฬิกา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p011
    topics: [physics.waves.shm]
    difficulty: 5
    type: numeric
    stem: "แขวนก้อนมวล $0.2\\ \\mathrm{kg}$ กับสปริง สปริงยืดออก $4.9\\ \\mathrm{cm}$ แล้วหยุดนิ่ง จากนั้นดึงก้อนมวลลงเล็กน้อยแล้วปล่อยให้สั่นขึ้นลง คาบของการสั่นเป็นกี่วินาที ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย s ทศนิยม 3 ตำแหน่ง)"
    answer: { value: 0.444, tolerance: 0.005, unit: s }
    hints:
      - "ขณะหยุดนิ่ง แรงสปริงเท่ากับน้ำหนัก: $kx = mg$"
      - "หา $k$ โดยแปลงระยะยืดเป็นเมตรก่อน"
      - "แทน $k$ ใน $T = 2\\pi\\sqrt{\\dfrac{m}{k}}$"
    misconceptions:
      - { match: 4.443, feedback: "ดูเหมือนใช้ระยะยืด 4.9 เป็นเมตร (ไม่ได้แปลงจาก cm) ทำให้ $k$ น้อยไป 100 เท่า ต้องใช้ $x = 0.049\\ \\mathrm{m}$" }
      - { match: 1.391, feedback: "ดูเหมือนคิด $k = \\tfrac{m}{x}$ โดยไม่คูณ $g$ แรงสปริงต้องเท่ากับน้ำหนัก $mg$ ซึ่งมีหน่วยนิวตัน" }
    solution: "$k = \\dfrac{mg}{x} = \\dfrac{(0.2\\ \\mathrm{kg})(9.8\\ \\mathrm{m/s^2})}{0.049\\ \\mathrm{m}} = 40\\ \\mathrm{N/m}$ ดังนั้น $T = 2\\pi\\sqrt{\\dfrac{0.2}{40}} = 2\\pi\\sqrt{0.005} \\approx 0.444\\ \\mathrm{s}$ (สังเกตว่าเท่ากับ $2\\pi\\sqrt{x/g}$ เหมือนลูกตุ้มยาว $4.9\\ \\mathrm{cm}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p012
    topics: [physics.waves.shm]
    difficulty: 2
    type: mcq
    stem: "ก้อนมวลติดสปริงสั่นแบบฮาร์มอนิกอย่างง่าย ขณะที่ก้อนมวลเคลื่อนผ่านตำแหน่งสมดุล ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "อัตราเร็วมากที่สุด ความเร่งเป็นศูนย์", correct: true }
      - { id: b, text: "อัตราเร็วเป็นศูนย์ ความเร่งมากที่สุด", feedback: "นั่นคือสภาพที่ปลายทั้งสองข้าง ($x = \\pm A$) ที่ตำแหน่งสมดุล $x = 0$ แรงสปริงจึงเป็นศูนย์" }
      - { id: c, text: "อัตราเร็วและความเร่งมากที่สุดทั้งคู่", feedback: "ความเร่ง $a = -\\tfrac{k}{m}x$ แปรผันตามการกระจัด ที่ $x = 0$ ความเร่งจึงเป็นศูนย์" }
      - { id: d, text: "อัตราเร็วและความเร่งเป็นศูนย์ทั้งคู่", feedback: "ถ้าอัตราเร็วเป็นศูนย์และไม่มีแรงที่ตำแหน่งสมดุล ก้อนมวลจะหยุดนิ่ง แต่ที่จริงมันวิ่งผ่านด้วยอัตราเร็วสูงสุด" }
    hints:
      - "ที่ตำแหน่งสมดุลการกระจัด $x = 0$ แรงสปริง $F = -kx$ เป็นเท่าใด"
      - "ระหว่างทางจากปลายเข้าหาตำแหน่งสมดุล วัตถุถูกเร่งให้เร็วขึ้นตลอด"
    solution: "ที่ตำแหน่งสมดุล $x = 0$ จึงได้ $F = 0$ และ $a = 0$ แต่วัตถุถูกเร่งมาตลอดทางจากปลาย อัตราเร็วจึงมากที่สุด $v_{\\max} = \\omega A$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p013
    topics: [physics.waves.shm]
    difficulty: 3
    type: mcq
    stem: "ลูกตุ้มสองลูกแขวนด้วยเชือกยาวเท่ากัน ลูกหนึ่งเป็นเหล็กมวล $2\\ \\mathrm{kg}$ อีกลูกเป็นไม้มวล $0.2\\ \\mathrm{kg}$ แกว่งด้วยมุมเล็กในที่เดียวกัน ($g = 9.8\\ \\mathrm{m/s^2}$ ไม่คิดแรงต้านอากาศ) ข้อใดถูกต้องเกี่ยวกับคาบ"
    choices:
      - { id: a, text: "คาบเท่ากัน", correct: true }
      - { id: b, text: "ลูกเหล็กมีคาบยาวกว่า เพราะหนักกว่าจึงแกว่งช้ากว่า", feedback: "ความรู้สึกนี้มาจากสปริง ($T = 2\\pi\\sqrt{m/k}$) แต่สำหรับลูกตุ้ม แรงดึงกลับก็มากขึ้นตามมวลด้วย มวลจึงหักล้างกันหมด" }
      - { id: c, text: "ลูกเหล็กมีคาบสั้นกว่า เพราะถูกแรงโน้มถ่วงดึงแรงกว่า", feedback: "แรงมากขึ้นจริง แต่มวล (ความเฉื่อย) ก็มากขึ้นในสัดส่วนเดียวกัน ความเร่งจึงเท่าเดิม" }
      - { id: d, text: "ลูกไม้มีคาบยาวกว่า เพราะเบาจึงลอยค้างนานกว่า", feedback: "เมื่อไม่คิดแรงต้านอากาศ วัตถุเบาและหนักตกด้วยความเร่งเท่ากัน คาบของลูกตุ้มจึงไม่ขึ้นกับมวล" }
    hints:
      - "สูตรคาบของลูกตุ้มอย่างง่ายมีตัวแปรอะไรบ้าง"
      - "$T = 2\\pi\\sqrt{L/g}$ มีมวลอยู่ในสูตรหรือไม่"
    solution: "$T = 2\\pi\\sqrt{\\dfrac{L}{g}}$ ไม่มีมวลอยู่ในสูตร เมื่อ $L$ และ $g$ เท่ากัน คาบจึงเท่ากัน (ทั้งคู่ประมาณ $2\\pi\\sqrt{L/9.8}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p014
    topics: [physics.waves.shm]
    difficulty: 1
    type: numeric
    stem: "ก้อนมวลติดสปริงสั่นด้วยความถี่ $4\\ \\mathrm{Hz}$ คาบของการสั่นเป็นกี่วินาที (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 0.25, tolerance: 0.001, unit: s }
    hints:
      - "คาบคือเวลาต่อ 1 รอบ ส่วนความถี่คือจำนวนรอบต่อวินาที"
      - "$T = \\dfrac{1}{f}$"
    misconceptions:
      - { match: 4, feedback: "4 คือความถี่ (รอบต่อวินาที) คาบเป็นส่วนกลับของความถี่" }
    solution: "$T = \\dfrac{1}{f} = \\dfrac{1}{4\\ \\mathrm{Hz}} = 0.25\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p015
    topics: [physics.waves.shm]
    difficulty: 2
    type: mcq
    stem: "ก้อนมวลติดสปริงบนพื้นลื่นสั่นแบบฮาร์มอนิกอย่างง่าย ขณะก้อนมวลอยู่ที่ปลายสุดของการสั่น (การกระจัดเท่ากับแอมพลิจูด) พลังงานกลของระบบอยู่ในรูปใด"
    choices:
      - { id: a, text: "พลังงานศักย์ยืดหยุ่นของสปริงทั้งหมด", correct: true }
      - { id: b, text: "พลังงานจลน์ของก้อนมวลทั้งหมด", feedback: "ที่ปลายก้อนมวลหยุดนิ่งชั่วขณะก่อนเลี้ยวกลับ พลังงานจลน์จึงเป็นศูนย์ พลังงานจลน์มากที่สุดที่ตำแหน่งสมดุล" }
      - { id: c, text: "พลังงานจลน์ครึ่งหนึ่ง พลังงานศักย์ครึ่งหนึ่ง", feedback: "แบ่งครึ่งเท่ากันเกิดที่ตำแหน่ง $x = \\tfrac{A}{\\sqrt{2}}$ ไม่ใช่ที่ปลาย" }
      - { id: d, text: "เป็นศูนย์ เพราะก้อนมวลหยุดนิ่ง", feedback: "ก้อนมวลหยุดนิ่ง แต่สปริงยืดหรือหดมากที่สุด พลังงานจึงสะสมอยู่ในสปริง ไม่ได้หายไป" }
    hints:
      - "ที่ปลาย อัตราเร็วของก้อนมวลเป็นเท่าใด"
      - "ที่ปลาย สปริงยืดหรือหดมากหรือน้อยที่สุด"
    solution: "ที่ปลายก้อนมวลหยุดนิ่งชั่วขณะ พลังงานจลน์เป็นศูนย์ และสปริงยืดหรือหดมากที่สุด พลังงานกลทั้งหมด $\\tfrac{1}{2}kA^2$ จึงอยู่ในรูปพลังงานศักย์ยืดหยุ่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p016
    topics: [physics.waves.shm]
    difficulty: 3
    type: numeric
    stem: "ก้อนมวล $0.5\\ \\mathrm{kg}$ ติดกับสปริง $k = 200\\ \\mathrm{N/m}$ บนพื้นลื่น สั่นแบบฮาร์มอนิกอย่างง่าย ขณะที่ก้อนมวลอยู่ห่างตำแหน่งสมดุล $3\\ \\mathrm{cm}$ ความเร่งของก้อนมวลมีขนาดเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s²)"
    answer: { value: 12, tolerance: 0.1, unit: m/s² }
    hints:
      - "แรงดึงกลับของสปริงคือ $F = kx$ แล้วใช้ $a = \\dfrac{F}{m}$"
      - "ขนาดความเร่ง $a = \\dfrac{k}{m}x$ อย่าลืมแปลงเซนติเมตรเป็นเมตร"
    misconceptions:
      - { match: 1200, feedback: "ดูเหมือนแทน $x = 3$ โดยไม่แปลงเป็นเมตร $3\\ \\mathrm{cm} = 0.03\\ \\mathrm{m}$" }
      - { match: 6, feedback: "นี่คือแรงดึงกลับในหน่วยนิวตัน ($kx$) ยังต้องหารด้วยมวลเพื่อหาความเร่ง" }
    solution: "$a = \\dfrac{k}{m}x = \\dfrac{200}{0.5}(0.03) = 400 \\times 0.03 = 12\\ \\mathrm{m/s^2}$ ทิศเข้าหาตำแหน่งสมดุล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p017
    topics: [physics.waves.shm]
    difficulty: 3
    type: numeric
    stem: "กราฟในภาพแสดงการกระจัดกับเวลาของก้อนมวลที่สั่นแบบฮาร์มอนิกอย่างง่าย อัตราเร็วสูงสุดของก้อนมวลเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s ทศนิยม 2 ตำแหน่ง)"
    figure:
      src: xt-graph-problem.svg
      alt: "กราฟการกระจัด x (เมตร) กับเวลา t (วินาที) ตั้งแต่ 0 ถึง 1.6 วินาที เส้นตารางทุก 0.1 วินาทีและทุก 0.01 เมตร กราฟเริ่มที่ศูนย์ ขึ้นถึง 0.05 m ที่ 0.2 s กลับมาศูนย์ที่ 0.4 s ลงถึง −0.05 m ที่ 0.6 s กลับมาศูนย์ที่ 0.8 s และซ้ำรูปเดิมอีกรอบจนถึง 1.6 s"
    answer: { value: 0.39, tolerance: 0.01, unit: m/s }
    hints:
      - "อ่านแอมพลิจูด (ยอดของกราฟ) และคาบ (เวลาครบ 1 รอบ) จากกราฟ"
      - "หา $\\omega = \\dfrac{2\\pi}{T}$ แล้วใช้ $v_{\\max} = \\omega A$"
    misconceptions:
      - { match: 0.79, feedback: "ดูเหมือนใช้คาบ $0.4\\ \\mathrm{s}$ (เวลาจากศูนย์ถึงศูนย์ครั้งถัดไป) ซึ่งเป็นแค่ครึ่งรอบ คาบคือเวลาจากยอดถึงยอด $0.8\\ \\mathrm{s}$" }
      - { match: 0.06, feedback: "ดูเหมือนหาร $A$ ด้วย $T$ ($\\tfrac{0.05}{0.8}$) ต้องใช้ความถี่เชิงมุม $\\omega = \\tfrac{2\\pi}{T}$ คูณกับ $A$" }
    solution: "จากกราฟ $A = 0.05\\ \\mathrm{m}$ และ $T = 0.8\\ \\mathrm{s}$ ได้ $\\omega = \\dfrac{2\\pi}{0.8} \\approx 7.85\\ \\mathrm{rad/s}$ และ $v_{\\max} = \\omega A \\approx 7.85 \\times 0.05 \\approx 0.39\\ \\mathrm{m/s}$ เกิดขณะผ่านตำแหน่งสมดุล เช่น ที่ $t = 0.4\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p018
    topics: [physics.waves.shm]
    difficulty: 4
    type: numeric
    stem: "ก้อนมวล $0.5\\ \\mathrm{kg}$ ติดกับสปริง $k = 200\\ \\mathrm{N/m}$ บนพื้นลื่น สั่นด้วยแอมพลิจูด $5\\ \\mathrm{cm}$ ขณะก้อนมวลอยู่ห่างตำแหน่งสมดุล $3\\ \\mathrm{cm}$ มีอัตราเร็วเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    answer: { value: 0.8, tolerance: 0.01, unit: m/s }
    hints:
      - "พลังงานกลคงตัว: $\\tfrac{1}{2}kA^2 = \\tfrac{1}{2}mv^2 + \\tfrac{1}{2}kx^2$"
      - "หรือใช้ $v = \\omega\\sqrt{A^2 - x^2}$ โดย $\\omega = \\sqrt{\\tfrac{k}{m}}$"
    misconceptions:
      - { match: 1, feedback: "นี่คืออัตราเร็วสูงสุด $\\omega A$ ซึ่งเกิดที่ตำแหน่งสมดุลเท่านั้น ที่ $x = 3\\ \\mathrm{cm}$ สปริงยังเก็บพลังงานไว้บางส่วน" }
      - { match: 0.6, feedback: "ดูเหมือนใช้ $v = \\omega x$ ความเร็วไม่ได้แปรผันตรงกับการกระจัด ที่ถูกคือ $\\omega\\sqrt{A^2 - x^2}$" }
    solution: "$\\omega = \\sqrt{\\dfrac{200}{0.5}} = 20\\ \\mathrm{rad/s}$ และ $v = 20\\sqrt{0.05^2 - 0.03^2} = 20\\sqrt{0.0016} = 20(0.04) = 0.8\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p019
    topics: [physics.waves.shm]
    difficulty: 5
    type: numeric
    stem: "รถยนต์มวลรวม $1{,}000\\ \\mathrm{kg}$ ตั้งอยู่บนสปริงช่วงล่างซึ่งรวมกันมีค่านิจสปริง $4.0 \\times 10^{4}\\ \\mathrm{N/m}$ ถนนในหมู่บ้านมีลูกระนาดวางห่างกันทุก $10\\ \\mathrm{m}$ ถ้าโช้กอัพเสื่อม รถจะเด้งแรงที่สุด (สั่นพ้อง) เมื่อวิ่งด้วยอัตราเร็วเท่าใด (ตอบเป็นตัวเลขในหน่วย km/h)"
    answer: { value: 36.2, tolerance: 0.4, unit: km/h }
    hints:
      - "หาความถี่ธรรมชาติของรถบนสปริง $f_0 = \\dfrac{1}{2\\pi}\\sqrt{\\dfrac{k}{m}}$"
      - "สั่นพ้องเมื่อรถตกลูกระนาด $f_0$ ครั้งต่อวินาที อัตราเร็ว = ระยะห่างของลูกระนาด × $f_0$ แล้วแปลงเป็น km/h"
    misconceptions:
      - { match: 10.07, feedback: "นี่คืออัตราเร็วในหน่วย m/s โจทย์ถามเป็น km/h คูณด้วย 3.6" }
      - { match: 227.7, feedback: "ดูเหมือนใช้ความถี่เชิงมุม $\\omega = \\sqrt{k/m}$ แทนความถี่ $f_0 = \\tfrac{\\omega}{2\\pi}$ จำนวนครั้งที่ตกลูกระนาดต่อวินาทีคือ $f$ ไม่ใช่ $\\omega$" }
    solution: "$f_0 = \\dfrac{1}{2\\pi}\\sqrt{\\dfrac{40{,}000}{1{,}000}} = \\dfrac{\\sqrt{40}}{2\\pi} \\approx 1.007\\ \\mathrm{Hz}$ รถต้องตกลูกระนาดประมาณ 1.007 ครั้งต่อวินาที อัตราเร็ว $= 10 \\times 1.007 \\approx 10.07\\ \\mathrm{m/s} \\approx 36.2\\ \\mathrm{km/h}$ โช้กอัพที่ดีจะหน่วงการสั่นไม่ให้แอมพลิจูดโตขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p020
    topics: [physics.waves.shm]
    difficulty: 2
    type: mcq
    stem: "ทหารที่เดินแถวข้ามสะพานแขวนมักถูกสั่งให้เดินไม่พร้อมกัน เหตุผลที่ถูกต้องที่สุดคือข้อใด"
    choices:
      - { id: a, text: "ป้องกันไม่ให้จังหวะเท้าตรงกับความถี่ธรรมชาติของสะพาน จนสะพานสั่นพ้องด้วยแอมพลิจูดมาก", correct: true }
      - { id: b, text: "ลดน้ำหนักรวมที่กดลงบนสะพาน", feedback: "จำนวนคนและน้ำหนักรวมเท่าเดิมไม่ว่าจะเดินพร้อมกันหรือไม่ สิ่งที่เปลี่ยนคือจังหวะของแรงที่กระทุ้งสะพาน" }
      - { id: c, text: "ทำให้ทหารเดินได้เร็วขึ้น", feedback: "การเดินไม่พร้อมกันไม่ได้ทำให้เร็วขึ้น จุดประสงค์คือไม่ให้แรงกระทุ้งเป็นจังหวะเดียวกัน" }
    hints:
      - "สะพานสั่นได้ และมีความถี่ธรรมชาติค่าหนึ่ง"
      - "ถ้าแรงภายนอกกระทุ้งเป็นจังหวะที่ตรงกับความถี่ธรรมชาติ จะเกิดอะไรขึ้น"
    solution: "การเดินพร้อมกันทำให้เกิดแรงกระทุ้งสะพานเป็นจังหวะเดียว ถ้าจังหวะนี้ตรงกับความถี่ธรรมชาติของสะพาน จะเกิดการสั่นพ้อง แอมพลิจูดเพิ่มขึ้นมากจนอาจเป็นอันตราย การเดินไม่พร้อมกันทำให้แรงไม่เป็นจังหวะเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p021
    topics: [physics.waves.shm]
    difficulty: 3
    type: expression
    stem: "ก้อนมวล $m$ ติดสปริงที่มีค่านิจสปริง $k$ สั่นด้วยแอมพลิจูด $A$ เขียนอัตราเร็วสูงสุดของก้อนมวลในรูปของ $m$, $k$ และ $A$"
    prefix: "v_{\\max} ="
    answer: { latex: "A\\sqrt{\\frac{k}{m}}", variables: [A, k, m] }
    hints:
      - "อัตราเร็วสูงสุดคือ $\\omega A$"
      - "สำหรับมวลติดสปริง $\\omega = \\sqrt{\\dfrac{k}{m}}$ (หรือใช้ $\\tfrac{1}{2}kA^2 = \\tfrac{1}{2}mv_{\\max}^2$)"
    misconceptions:
      - { match: "A\\sqrt{\\frac{m}{k}}", feedback: "สลับเศษกับส่วน สปริงแข็ง ($k$ มาก) ต้องทำให้ก้อนมวลเคลื่อนที่เร็วขึ้น $k$ จึงต้องอยู่ที่ตัวเศษ" }
      - { match: "\\frac{kA^2}{m}", feedback: "นี่คือ $v_{\\max}^2$ ยังไม่ได้ถอดรากที่สอง" }
    solution: "จาก $\\tfrac{1}{2}kA^2 = \\tfrac{1}{2}mv_{\\max}^2$ ได้ $v_{\\max} = A\\sqrt{\\dfrac{k}{m}} = \\omega A$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.shm.p022
    topics: [physics.waves.shm]
