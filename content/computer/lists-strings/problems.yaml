  - id: computer.programming.lists-strings.p004
    topics: [computer.programming.lists-strings]
    difficulty: 2
    type: mcq
    stem: |
      วันที่ถูกเก็บเป็นสตริง (ดูภาพที่แสดงอักขระทีละช่อง) คำสั่งนี้ได้สตริงใด

      ```python
