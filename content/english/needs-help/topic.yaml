id: english.speaking.needs-help
subject: english
title: { th: "บอกความต้องการ ขอ เสนอ ตอบรับ และปฏิเสธความช่วยเหลือ", en: "Needs, asking for help, offering, accepting and refusing" }
summary: บอกความต้องการด้วย want need would like ขอและเสนอความช่วยเหลือ ตอบรับหรือปฏิเสธอย่างสุภาพ ทั้งพูดและเขียนข้อความ รวมถึงเหตุฉุกเฉิน
difficulty: 3
minutes: 35
prerequisites: [english.grammar.can-modals]
encompasses:
  - { id: english.grammar.can-modals, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: help-flow.svg
    alt: "แผนผังสองฝั่ง ฝั่งซ้าย ขอความช่วยเหลือ (Ask for help): I need help with ..., Can you help me, please?, Could you ..., please? มีลูกศรไปตอบรับ: Sure. Of course. No problem. และปฏิเสธ: Sorry, I can't. I'm busy now. Maybe later? ฝั่งขวา เสนอความช่วยเหลือ (Offer help): Can I help you?, Would you like some help?, Shall I ...? / Let me ... มีลูกศรไปตอบรับ: Yes, please. That would be great, thanks! และปฏิเสธ: No, thank you. I'm OK, thanks. Thanks anyway."
    caption: "ขอ หรือ เสนอ แล้วตอบรับหรือปฏิเสธ"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.speaking.needs-help.p001, prompt: "ตอบ Would you like ...? อย่างไร" }
  - type: worked-example
    title: เสนอความช่วยเหลือคุณยายในซอย
    problem: "คุณยายชาวต่างชาติที่พักอยู่ในซอยเดียวกันถือถุงผลไม้หนักสามถุง เขียนบทสนทนาสั้น ๆ: เสนอช่วยถือ คุณยายตอบรับ และขอบคุณ"
    steps:
      - text: "เรียกความสนใจและเสนอช่วยด้วย Shall I ...?: *Excuse me. Shall I carry your bags?*"
        why: "Shall I + กริยา ใช้เสนอทำบางอย่างให้ (พูดว่า Can I help you with your bags? ก็ได้)"
      - text: "คุณยายตอบรับ: *Yes, please. That's very kind of you.*"
      - text: "ช่วยและถามต่อ: *Where would you like me to put them?* — *On the table, please.*"
      - text: "คุณยายขอบคุณ เราตอบ: *Thank you so much!* — *You're welcome.*"
    answer: "*Excuse me. Shall I carry your bags? — Yes, please. That's very kind of you. ... Thank you so much! — You're welcome.*"
  - type: figure
    src: chat.svg
    alt: "ข้อความแชต Ben: Hi Nam! Are you free on Saturday? Ben: I need help with my Thai homework. Could you help me? Nam: Sorry, I can't. I visit my grandma on Saturdays. Nam: But I'm free on Sunday afternoon. Would you like to meet at the library at 2 p.m.? Ben: Yes, please! That would be great. Thanks a lot!"
    caption: "แชตขอความช่วยเหลือ ปฏิเสธ เสนอทางอื่น และตอบรับ"
  - { type: check, problem: english.speaking.needs-help.p009, prompt: "Nam ตอบคำขอของ Ben อย่างไร" }
glossary:
  - { term: "I'd like", definition: "ย่อจาก I would like อยากได้ (สุภาพ)" }
  - { term: offer, definition: "เสนอ เช่น เสนอความช่วยเหลือ Can I help you?" }
  - { term: "Shall I ...?", definition: "ให้ฉัน ... ไหม ใช้เสนอทำบางอย่างให้ นิยมในอังกฤษ" }
  - { term: "I can manage.", definition: "ฉันทำเองได้ ใช้ปฏิเสธความช่วยเหลืออย่างสุภาพ" }
  - { term: "Thanks anyway.", definition: "ขอบคุณนะ (แม้จะไม่ได้รับความช่วยเหลือ)" }
flashcards:
  - { front: "Would you like some help? ตอบรับ / ปฏิเสธ", back: "Yes, please. / No, thank you." }
  - { front: "ขอให้ช่วย vs เสนอช่วย", back: "Can you help me? / Can I help you?" }
  - { front: "อยากได้อย่างสุภาพ", back: "I'd like ..., please." }
  - { front: "ปฏิเสธคำขอสุภาพ", back: "Sorry, I can't. + เหตุผล" }
  - { front: "เบอร์ฉุกเฉินการแพทย์ในไทย", back: "1669" }
