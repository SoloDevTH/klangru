problems:
  - id: phy.meas.p001
    topics: [physics.units.measurement]
    difficulty: 1
    type: mcq
    stem: "วัดความยาวยางลบด้วยไม้บรรทัดที่มีขีดทุก $1\\ \\mathrm{mm}$ ปลายยางลบอยู่เลยขีด $4.3\\ \\mathrm{cm}$ ไปประมาณครึ่งช่องก่อนถึงขีด $4.4\\ \\mathrm{cm}$ ควรบันทึกผลการวัดอย่างไร"
    choices:
      - { id: a, text: "$4.35\\ \\mathrm{cm}$", correct: true }
      - { id: b, text: "$4.3\\ \\mathrm{cm}$", feedback: "อ่านถึงช่องสเกลเล็กที่สุดแล้ว แต่ยังขาดหลักที่ประมาณเพิ่มอีก 1 ตำแหน่ง ปลายยางลบอยู่กลางช่อง จึงควรจดหลักนั้นด้วย" }
      - { id: c, text: "$4\\ \\mathrm{cm}$", feedback: "ทิ้งข้อมูลไปมากเกินไป ไม้บรรทัดอ่านได้ละเอียดถึงมิลลิเมตร และยังประมาณได้อีก 1 ตำแหน่ง" }
      - { id: d, text: "$4.352\\ \\mathrm{cm}$", feedback: "ละเอียดเกินกว่าที่ไม้บรรทัดทำได้ ประมาณได้เพียง 1 ตำแหน่งเลยช่องสเกลเล็กที่สุด หลักที่สองที่เดาเพิ่มไม่มีความหมาย" }
    hints:
      - "ช่องสเกลเล็กที่สุดของไม้บรรทัดนี้มีค่าเท่าใดในหน่วยเซนติเมตร"
      - "กติกาคืออ่านให้ถึงช่องสเกลเล็กที่สุด แล้วประมาณเพิ่มอีก 1 ตำแหน่ง"
    solution: "ช่องสเกลเล็กที่สุดคือ $0.1\\ \\mathrm{cm}$ อ่านได้แน่นอนถึง $4.3\\ \\mathrm{cm}$ แล้วประมาณเพิ่มอีก 1 ตำแหน่ง ปลายอยู่กลางช่องจึงได้ $4.35\\ \\mathrm{cm}$ (เขียนเต็มได้เป็น $(4.35 \\pm 0.05)\\ \\mathrm{cm}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.meas.p002
    topics: [physics.units.measurement]
    difficulty: 1
    type: numeric
    stem: "ความหนาของแผ่นพลาสติกวัดได้ $0.00520\\ \\mathrm{m}$ ตัวเลขนี้มีเลขนัยสำคัญกี่ตัว (ตอบเป็นจำนวนเต็ม)"
    answer: { value: 3, unit: ตัว }
    hints:
      - "ศูนย์ที่อยู่หน้าเลข 5 ทำหน้าที่อะไร บอกความละเอียดหรือแค่บอกตำแหน่งจุดทศนิยม"
      - "ศูนย์ท้ายที่อยู่หลังจุดทศนิยมนับเป็นเลขนัยสำคัญ ให้นับตั้งแต่เลขตัวแรกที่ไม่ใช่ศูนย์ไปจนสุด"
    misconceptions:
      - { match: 6, feedback: "ศูนย์ข้างหน้า $0.00$ ไม่นับ เพราะแค่บอกตำแหน่งจุดทศนิยม ถ้าเขียนเป็น $5.20 \\times 10^{-3}\\ \\mathrm{m}$ ศูนย์เหล่านั้นก็หายไป" }
      - { match: 2, feedback: "ศูนย์ตัวท้ายหลังจุดทศนิยมต้องนับด้วย เพราะผู้วัดตั้งใจบอกว่าวัดได้ละเอียดถึงหลักนั้น" }
    solution: "ไม่นับศูนย์ข้างหน้า เริ่มนับที่ 5 ได้ 5, 2 และ 0 ตัวท้าย รวม 3 ตัว เขียนเป็นสัญกรณ์วิทยาศาสตร์ได้ $5.20 \\times 10^{-3}\\ \\mathrm{m}$ ซึ่งเห็นเลขนัยสำคัญ 3 ตัวชัดเจน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.meas.p003
    topics: [physics.units.measurement]
    difficulty: 2
    type: match
    stem: "จับคู่ผลการวัดกับจำนวนเลขนัยสำคัญ"
    pairs:
      - { left: "$0.08\\ \\mathrm{m}$", right: "1 ตัว" }
      - { left: "$2.0 \\times 10^{3}\\ \\mathrm{g}$", right: "2 ตัว" }
      - { left: "$3.40\\ \\mathrm{s}$", right: "3 ตัว" }
      - { left: "$1005\\ \\mathrm{mL}$", right: "4 ตัว" }
      - { left: "$12.050\\ \\mathrm{kg}$", right: "5 ตัว" }
    hints:
      - "ศูนย์ข้างหน้าไม่นับ ศูนย์ระหว่างเลขอื่นนับ ศูนย์ท้ายหลังจุดทศนิยมนับ"
      - "สำหรับสัญกรณ์วิทยาศาสตร์ ให้นับเฉพาะตัวเลขข้างหน้า $\\times 10^{n}$"
    solution: "$0.08$ มี 1 ตัว (ศูนย์ข้างหน้าไม่นับ) · $2.0 \\times 10^{3}$ มี 2 ตัว (นับเฉพาะ $2.0$) · $3.40$ มี 3 ตัว (ศูนย์ท้ายหลังจุดนับ) · $1005$ มี 4 ตัว (ศูนย์ระหว่างเลขนับ) · $12.050$ มี 5 ตัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.meas.p004
    topics: [physics.units.measurement]
    difficulty: 2
    type: numeric
    stem: "แม่ค้าที่ตลาดสังเกตว่าตาชั่งแบบเข็มชี้ $0.2\\ \\mathrm{kg}$ ทั้งที่ยังไม่มีของวางอยู่ เมื่อนำมะม่วงไปชั่ง เข็มชี้ $3.5\\ \\mathrm{kg}$ มะม่วงมีมวลจริงกี่กิโลกรัม (ตอบเป็นตัวเลขในหน่วย kg)"
    answer: { value: 3.3, tolerance: 0.01, unit: kg }
    hints:
      - "ตาชั่งไม่ได้ตั้งศูนย์ ทุกครั้งที่ชั่ง เข็มจะชี้เกินค่าจริงไปเท่าเดิม"
      - "นี่คือความคลาดเคลื่อนเชิงระบบ แก้โดยนำค่าที่ชี้ตอนว่างไปปรับค่าที่อ่านได้ ให้คิดว่าต้องบวกหรือลบ"
    misconceptions:
      - { match: 3.7, feedback: "ตาชั่งชี้เกินค่าจริงไป $0.2\\ \\mathrm{kg}$ ตั้งแต่ยังไม่มีของ จึงต้องลบออก ไม่ใช่บวกเพิ่ม" }
    solution: "ตาชั่งชี้เกินจริงอยู่แล้ว $0.2\\ \\mathrm{kg}$ (ความคลาดเคลื่อนเชิงระบบ) มวลจริง $= 3.5\\ \\mathrm{kg} - 0.2\\ \\mathrm{kg} = 3.3\\ \\mathrm{kg}$ ความคลาดเคลื่อนแบบนี้วัดซ้ำกี่ครั้งก็ไม่หาย ต้องตั้งศูนย์ตาชั่งก่อนใช้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.meas.p005
    topics: [physics.units.measurement]
    difficulty: 2
    type: mcq
    stem: "ปัดผลการวัด $15.348\\ \\mathrm{cm}$ ให้เหลือเลขนัยสำคัญ 3 ตัว"
    choices:
      - { id: a, text: "$15.3\\ \\mathrm{cm}$", correct: true }
      - { id: b, text: "$15.4\\ \\mathrm{cm}$", feedback: "ดูเหมือนปัดทีละขั้น ($15.348 \\to 15.35 \\to 15.4$) การปัดต้องดูหลักถัดไปเพียงหลักเดียวจากตัวเลขเดิม หลักนั้นคือ 4 ซึ่งน้อยกว่า 5" }
      - { id: c, text: "$15.35\\ \\mathrm{cm}$", feedback: "นี่มีเลขนัยสำคัญ 4 ตัว (ปัดเป็นทศนิยม 2 ตำแหน่ง) โจทย์ต้องการ 3 ตัว คือ 1, 5 และหลักทศนิยมแรก" }
      - { id: d, text: "$15\\ \\mathrm{cm}$", feedback: "นี่เหลือเลขนัยสำคัญเพียง 2 ตัว ต้องเก็บหลักทศนิยมแรกไว้ด้วย" }
    hints:
      - "เลขนัยสำคัญ 3 ตัวแรกคือ 1, 5 และ 3 หลักถัดไปคือเลขใด"
      - "ดูหลักถัดไปเพียงหลักเดียว ถ้าเป็น 5 ขึ้นไปปัดขึ้น ถ้าน้อยกว่า 5 ตัดทิ้ง และปัดครั้งเดียว"
    solution: "เก็บ 1, 5, 3 ไว้ หลักถัดไปคือ 4 ซึ่งน้อยกว่า 5 จึงตัดทิ้ง ได้ $15.3\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.meas.p006
    topics: [physics.units.measurement]
    difficulty: 3
    type: mcq
    stem: "เส้นผ่านศูนย์กลางของลวดวัดได้ $0.000450\\ \\mathrm{m}$ ข้อใดเขียนเป็นสัญกรณ์วิทยาศาสตร์โดยคงจำนวนเลขนัยสำคัญไว้เท่าเดิม"
    choices:
      - { id: a, text: "$4.50 \\times 10^{-4}\\ \\mathrm{m}$", correct: true }
      - { id: b, text: "$4.5 \\times 10^{-4}\\ \\mathrm{m}$", feedback: "ค่าเท่ากัน แต่ศูนย์ตัวท้ายหายไป เลขนัยสำคัญจึงลดจาก 3 ตัวเหลือ 2 ตัว ทำให้ดูเหมือนวัดได้หยาบกว่าความจริง" }
      - { id: c, text: "$4.50 \\times 10^{4}\\ \\mathrm{m}$", feedback: "เลขชี้กำลังผิดเครื่องหมาย จำนวนที่น้อยกว่า 1 ต้องมีเลขชี้กำลังเป็นลบ ค่านี้คือ $45\\,000\\ \\mathrm{m}$" }
      - { id: d, text: "$45.0 \\times 10^{-5}\\ \\mathrm{m}$", feedback: "ค่าเท่ากัน แต่ยังไม่ใช่สัญกรณ์วิทยาศาสตร์ เพราะตัวเลขข้างหน้าต้องอยู่ระหว่าง 1 ถึงน้อยกว่า 10" }
    hints:
      - "ตัวเลขเดิมมีเลขนัยสำคัญกี่ตัว อย่าลืมศูนย์ตัวท้าย"
      - "เลื่อนจุดทศนิยมไปทางขวาจนได้ตัวเลขระหว่าง 1 กับ 10 นับจำนวนตำแหน่งที่เลื่อนเพื่อหาเลขชี้กำลัง"
    solution: "$0.000450$ มีเลขนัยสำคัญ 3 ตัว (4, 5, 0) เลื่อนจุดทศนิยมไปทางขวา 4 ตำแหน่งได้ $4.50$ จึงเขียนเป็น $4.50 \\times 10^{-4}\\ \\mathrm{m}$ โดยต้องคงศูนย์ตัวท้ายไว้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.meas.p007
    topics: [physics.units.measurement]
    difficulty: 3
    type: numeric
    stem: "ช่างวัดพื้นห้องได้กว้าง $2.35\\ \\mathrm{m}$ ยาว $1.2\\ \\mathrm{m}$ พื้นที่ห้องเป็นเท่าใด เมื่อปัดตามกติกาเลขนัยสำคัญ (ตอบเป็นตัวเลขในหน่วย m²)"
    answer: { value: 2.8, tolerance: 0.001, unit: m² }
    hints:
      - "คูณกันก่อนแล้วค่อยปัด ผลคูณจากเครื่องคิดเลขยังละเอียดเกินไป"
      - "การคูณ ผลลัพธ์มีเลขนัยสำคัญเท่ากับตัวที่มีเลขนัยสำคัญน้อยที่สุด ให้นับว่า $2.35$ และ $1.2$ มีกี่ตัว"
    misconceptions:
      - { match: 2.82, feedback: "นี่คือผลจากเครื่องคิดเลขซึ่งมีเลขนัยสำคัญ 3 ตัว แต่ $1.2\\ \\mathrm{m}$ มีเพียง 2 ตัว ผลคูณจึงต้องปัดให้เหลือ 2 ตัว" }
      - { match: 3, feedback: "ปัดมากเกินไปจนเหลือ 1 ตัว ข้อมูลที่หยาบที่สุดคือ $1.2\\ \\mathrm{m}$ ซึ่งมี 2 ตัว ผลคูณจึงควรมี 2 ตัว" }
    solution: "$2.35\\ \\mathrm{m} \\times 1.2\\ \\mathrm{m} = 2.82\\ \\mathrm{m^2}$ ข้อมูลมีเลขนัยสำคัญ 3 ตัวและ 2 ตัว ผลคูณจึงเก็บ 2 ตัว ได้ $2.8\\ \\mathrm{m^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.meas.p008
    topics: [physics.units.measurement]
    difficulty: 3
    type: numeric
    stem: "ชาวสวนชั่งมังคุดหนึ่งเข่งด้วยตาชั่งใหญ่ได้ $102.3\\ \\mathrm{kg}$ แล้วชั่งมังคุดอีกหนึ่งถุงด้วยตาชั่งดิจิทัลได้ $0.456\\ \\mathrm{kg}$ มวลรวมเป็นเท่าใด เมื่อปัดตามกติกาการบวก (ตอบเป็นตัวเลขในหน่วย kg)"
    answer: { value: 102.8, tolerance: 0.01, unit: kg }
    hints:
      - "บวกกันก่อนแล้วค่อยปัด"
      - "การบวกให้ดูจำนวนตำแหน่งทศนิยม ไม่ใช่จำนวนเลขนัยสำคัญ ค่าใดละเอียดน้อยที่สุด"
    misconceptions:
      - { match: 102.756, feedback: "ยังไม่ได้ปัด ตาชั่งใหญ่อ่านได้ละเอียดแค่ $0.1\\ \\mathrm{kg}$ ผลรวมจึงละเอียดเกินกว่านั้นไม่ได้" }
      - { match: 103, feedback: "ดูเหมือนใช้กติกาของการคูณหาร (เลขนัยสำคัญ 3 ตัวตาม $0.456$) การบวกลบต้องดูตำแหน่งทศนิยม ซึ่ง $102.3$ มี 1 ตำแหน่ง" }
    solution: "$102.3\\ \\mathrm{kg} + 0.456\\ \\mathrm{kg} = 102.756\\ \\mathrm{kg}$ ค่าที่มีตำแหน่งทศนิยมน้อยที่สุดคือ $102.3$ (1 ตำแหน่ง) จึงปัดเป็นทศนิยม 1 ตำแหน่ง ได้ $102.8\\ \\mathrm{kg}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.meas.p009
    topics: [physics.units.measurement]
    difficulty: 3
    type: numeric
    stem: "นักเรียนจับเวลาลูกบอลกลิ้งลงรางด้วยนาฬิกาจับเวลา 5 ครั้ง ได้ $2.31$, $2.35$, $2.28$, $2.34$ และ $2.32\\ \\mathrm{s}$ เวลาเฉลี่ยเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย s ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 2.32, tolerance: 0.02, unit: s }
    hints:
      - "การวัดซ้ำแล้วหาค่าเฉลี่ยช่วยลดความคลาดเคลื่อนแบบสุ่ม เช่น จังหวะกดนาฬิกา"
      - "บวกค่าทั้งหมด แล้วหารด้วยจำนวนครั้งที่วัด"
    misconceptions:
      - { match: 2.9, feedback: "ผลรวมคือ $11.60\\ \\mathrm{s}$ จากการวัด 5 ครั้ง ดูเหมือนหารด้วย 4 ต้องหารด้วยจำนวนครั้งที่วัดทั้งหมด" }
    solution: "ผลรวม $= 2.31 + 2.35 + 2.28 + 2.34 + 2.32 = 11.60\\ \\mathrm{s}$ ค่าเฉลี่ย $= \\dfrac{11.60\\ \\mathrm{s}}{5} = 2.32\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.meas.p010
    topics: [physics.units.measurement]
    difficulty: 4
    type: mcq
    stem: "นักเรียน 4 กลุ่มวัดความยาวโต๊ะตัวเดียวกัน ซึ่งยาวจริง $120.0\\ \\mathrm{cm}$ กลุ่มละ 3 ครั้ง ผลการวัดของกลุ่มใด **เที่ยงแต่ไม่แม่น**"
    choices:
      - { id: a, text: "กลุ่ม ก: $125.1$, $125.0$, $125.2\\ \\mathrm{cm}$", correct: true }
      - { id: b, text: "กลุ่ม ข: $120.1$, $119.9$, $120.0\\ \\mathrm{cm}$", feedback: "ผลกลุ่มนี้ใกล้กันและใกล้ค่าจริงด้วย จึงทั้งเที่ยงและแม่น" }
      - { id: c, text: "กลุ่ม ค: $116.0$, $124.5$, $119.8\\ \\mathrm{cm}$", feedback: "ค่าเฉลี่ยของกลุ่มนี้ใกล้ค่าจริง (ราว $120.1\\ \\mathrm{cm}$) แต่ผลแต่ละครั้งกระจายมาก จึงแม่นแต่ไม่เที่ยง ตรงข้ามกับที่ถาม" }
      - { id: d, text: "กลุ่ม ง: $112.0$, $128.3$, $131.5\\ \\mathrm{cm}$", feedback: "ผลกลุ่มนี้ทั้งกระจายมากและห่างจากค่าจริง จึงไม่เที่ยงและไม่แม่น" }
    hints:
      - "ความเที่ยงดูว่าผลแต่ละครั้งใกล้กันเองหรือไม่ ความแม่นดูว่าใกล้ค่าจริงหรือไม่"
      - "หากลุ่มที่ผลทั้งสามครั้งใกล้กันมาก แต่ทั้งหมดห่างจาก $120.0\\ \\mathrm{cm}$"
    solution: "กลุ่ม ก ได้ผลต่างกันไม่เกิน $0.2\\ \\mathrm{cm}$ จึงเที่ยง แต่ทุกครั้งเกินค่าจริงไปราว $5\\ \\mathrm{cm}$ จึงไม่แม่น ลักษณะนี้มักมาจากความคลาดเคลื่อนเชิงระบบ เช่น วัดโดยไม่ได้เริ่มที่ขีดศูนย์ของตลับเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.meas.p011
    topics: [physics.units.measurement]
    difficulty: 4
    type: numeric
