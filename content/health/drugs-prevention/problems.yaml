problems:
- id: health.substances.drugs-prevention.p001
  topics:
  - health.substances.drugs-prevention
  difficulty: 1
  type: mcq
  stem: ยาบ้า (เมทแอมเฟตามีน) ออกฤทธิ์ต่อระบบประสาทแบบใด
  choices:
  - id: a
    text: กระตุ้นประสาท
    correct: true
  - id: b
    text: กดประสาท
    feedback: สารกดประสาท เช่น เฮโรอีน สารระเหย ทำให้ง่วงซึม ส่วนยาบ้าทำให้ใจสั่น นอนไม่หลับ
  - id: c
    text: ไม่มีผลต่อระบบประสาท
    feedback: ยาบ้ามีผลต่อสมองโดยตรง ทำให้ระแวงและนอนไม่หลับ
  hints:
  - นึกถึงอาการใจสั่นและนอนไม่หลับ
  - ชื่อของยานี้ในภาษาไทยเคยถูกเปลี่ยนเพื่อให้คนรู้ว่าทำให้ควบคุมตัวเองไม่ได้
  solution: ยาบ้าเป็นสารกระตุ้นประสาท ทำให้หัวใจเต้นเร็ว นอนไม่หลับ หวาดระแวง และอาจทำให้หัวใจเต้นผิดจังหวะจนเสียชีวิต
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.drugs-prevention.p002
  topics:
  - health.substances.drugs-prevention
  difficulty: 1
  type: mcq
  stem: ระหว่างรอผู้ปกครองหน้าโรงเรียน มีคนที่ไม่รู้จักแจกลูกอมและเครื่องดื่มฟรีที่ไม่มีฉลาก ข้อใดปลอดภัยที่สุด
  choices:
  - id: a
    text: ไม่รับ เดินไปอยู่ใกล้ครูเวร และบอกครูทันที
    correct: true
  - id: b
    text: รับไว้แต่ยังไม่กิน
    feedback: ของที่ไม่รู้ส่วนผสมอาจมีสารเสพติดหรือสารอันตราย ไม่รับเลยปลอดภัยกว่า
  - id: c
    text: ชิมนิดเดียวก่อนว่าอร่อยไหม
    feedback: แม้ชิมเล็กน้อยก็อาจได้รับสารอันตรายถ้าของนั้นมีสารผสม
  hints:
  - รู้ไหมว่าของนั้นมีอะไรผสม
  - ใครในโรงเรียนช่วยได้ทันที
  solution: ไม่รับของกินหรือเครื่องดื่มที่ไม่รู้ที่มาและไม่มีฉลาก และบอกครูหรือผู้ใหญ่ทันที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.drugs-prevention.p003
  topics:
  - health.substances.drugs-prevention
  difficulty: 2
  type: match
  stem: จับคู่กลุ่มสารเสพติดตามการออกฤทธิ์กับตัวอย่าง
  pairs:
  - left: กดประสาท
    right: สารระเหย เช่น กาว ทินเนอร์
  - left: กระตุ้นประสาท
    right: ยาบ้า
  - left: หลอนประสาท
    right: เห็ดขี้ควาย
  - left: ออกฤทธิ์ผสม
    right: กัญชา
  hints:
  - สารกดประสาททำให้ง่วงซึม ตอบสนองช้า
  - สารที่ออกฤทธิ์ได้หลายแบบพร้อมกันคือพืชที่เป็นข่าวเรื่องกฎหมายบ่อย
  solution: สารระเหยกดประสาท ยาบ้ากระตุ้นประสาท เห็ดขี้ควายหลอนประสาท และกัญชาออกฤทธิ์ผสมทั้งกด กระตุ้น และหลอนประสาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.drugs-prevention.p004
  topics:
  - health.substances.drugs-prevention
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็นผลกระทบด้านสังคมของการใช้สารเสพติด (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: ขาดเรียนบ่อยจนเรียนไม่จบ
    correct: true
    feedback: ถูก
  - id: b
    text: ครอบครัวทุกข์ใจและมีปัญหาการเงิน
    correct: true
    feedback: ถูก
  - id: c
    text: มีปัญหากับกฎหมาย
    correct: true
    feedback: ถูก
  - id: d
    text: หัวใจเต้นผิดจังหวะ
    feedback: เป็นผลด้านร่างกาย
  - id: e
    text: หวาดระแวง หูแว่ว
    feedback: เป็นผลด้านจิตใจ
  hints:
  - ด้านสังคมเกี่ยวกับการเรียน ครอบครัว เงิน และกฎหมาย
  - อาการที่เกิดในร่างกายหรือความคิดเป็นด้านอื่น
  solution: ผลด้านสังคม ได้แก่ เสียการเรียน ครอบครัวเดือดร้อน และปัญหากฎหมาย ส่วนหัวใจเต้นผิดจังหวะเป็นด้านร่างกาย และหวาดระแวงเป็นด้านจิตใจ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.drugs-prevention.p005
  topics:
  - health.substances.drugs-prevention
  difficulty: 2
  type: text
  stem: สายด่วนบำบัดยาเสพติดของสถาบันบำบัดรักษาและฟื้นฟูผู้ติดยาเสพติดแห่งชาติบรมราชชนนี (สบยช.) คือหมายเลขใด (ตอบเป็นตัวเลข 4 หลัก)
  accepted:
  - '1165'
  misconceptions:
  - match: '1600'
    feedback: 1600 คือสายเลิกบุหรี่
  - match: '1323'
    feedback: 1323 คือสายด่วนสุขภาพจิต
  - match: '1669'
    feedback: 1669 คือหมายเลขแจ้งเหตุฉุกเฉินทางการแพทย์
  hints:
  - ขึ้นต้นด้วย 11
  - ให้คำปรึกษาตลอด 24 ชั่วโมงทั้งผู้ใช้และครอบครัว
  solution: โทร 1165 เพื่อปรึกษาเรื่องการบำบัดยาเสพติด ถ้ามีอาการฉุกเฉิน เช่น หมดสติหรือหายใจผิดปกติ โทร 1669
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.drugs-prevention.p006
  topics:
  - health.substances.drugs-prevention
  difficulty: 2
  type: numeric
  stem: ตามประกาศกระทรวงสาธารณสุขที่ใช้ตั้งแต่ปี 2565 สารสกัดจากกัญชาหรือกัญชงที่มีสาร THC เกินร้อยละเท่าใดโดยน้ำหนัก ยังเป็นยาเสพติดให้โทษประเภท 5 (ตอบเป็นร้อยละ)
  answer:
    value: 0.2
    tolerance: 0.01
    unit: "%"
  misconceptions:
  - match: 2
    feedback: คลาดไป 10 เท่า เกณฑ์คือร้อยละ 0.2
  - match: 5
    feedback: 5 คือเลขประเภทของยาเสพติด ไม่ใช่ร้อยละของ THC
  hints:
  - เป็นตัวเลขน้อยกว่า 1
  - ศูนย์จุดสอง
  solution: สารสกัดที่มี THC เกินร้อยละ 0.2 โดยน้ำหนักยังเป็นยาเสพติดให้โทษประเภท 5 ส่วนพืชกัญชาออกจากบัญชีประเภท 5 ตั้งแต่ 9 มิถุนายน 2565 (ข้อมูล ณ ตุลาคม 2569)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.drugs-prevention.p007
  topics:
  - health.substances.drugs-prevention
  difficulty: 3
  type: mcq
  stem: ข้อใดอธิบายความสัมพันธ์ระหว่างการใช้สารเสพติดกับการเกิดโรคได้ถูกต้อง
  choices:
  - id: a
    text: การใช้เข็มและอุปกรณ์ฉีดร่วมกันทำให้ติดเชื้อเอชไอวีและไวรัสตับอักเสบได้
    correct: true
  - id: b
    text: สารเสพติดทำให้ภูมิคุ้มกันแข็งแรงขึ้น
    feedback: ไม่มีหลักฐาน สารเสพติดทำร้ายร่างกายหลายระบบ
  - id: c
    text: สารเสพติดเกี่ยวข้องกับอุบัติเหตุเท่านั้น ไม่เกี่ยวกับโรค
    feedback: สารเสพติดเกี่ยวข้องทั้งโรคติดต่อ โรคหัวใจ และโรคทางจิตเวช
  hints:
  - WHO ระบุทางติดต่อของเชื้อเอชไอวีไว้หลายทาง
  - เลือดที่ติดอยู่ในเข็มส่งเชื้อต่อได้
  solution: การใช้เข็มและอุปกรณ์ฉีดร่วมกันเป็นทางติดต่อของเชื้อเอชไอวีตามที่ WHO ระบุ และยังติดเชื้อไวรัสตับอักเสบได้ นอกจากนี้สารเสพติดยังเกี่ยวกับโรคหัวใจ โรคทางจิตเวช และอุบัติเหตุ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.drugs-prevention.p008
  topics:
  - health.substances.drugs-prevention
  difficulty: 3
  type: numeric
  stem: ตามประกาศเรื่องสมุนไพรควบคุม (กัญชา) พ.ศ. 2568 ผู้ประกอบวิชาชีพสั่งจ่ายช่อดอกกัญชาเพื่อการรักษาได้ครั้งละไม่เกินกี่วัน (ตอบเป็นวัน)
  answer:
    value: 30
    unit: วัน
  misconceptions:
  - match: 7
    feedback: น้อยกว่าที่ประกาศกำหนด ประกาศกำหนดไม่เกินสามสิบวัน
  - match: 90
    feedback: มากกว่าที่ประกาศกำหนด
  hints:
  - ประมาณหนึ่งเดือน
  - ประกาศเขียนว่า "ไม่เกินสามสิบวัน"
  solution: ประกาศกำหนดให้สั่งจ่ายตามความจำเป็นเพื่อการรักษา ใช้ได้ไม่เกิน 30 วัน และร้านต้องมีใบอนุญาต ห้ามขายออนไลน์และห้ามโฆษณา (ข้อมูล ณ ตุลาคม 2569)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.drugs-prevention.p009
  topics:
  - health.substances.drugs-prevention
  difficulty: 3
  type: order
  stem: รุ่นพี่ในซอยชวนต้าร์ลองยาบ้าโดยบอกว่า "ช่วยให้อ่านหนังสือได้ทั้งคืน" เรียงขั้นการปฏิเสธที่เหมาะสม
  items:
  - ปฏิเสธชัดว่า "ไม่เอา"
  - บอกเหตุผลของตัวเอง เช่น "ผมอยากสุขภาพดีและสอบได้จริง"
  - เสนอทางเลือก เช่น "ไปติวที่ห้องสมุดกันดีกว่า"
  - ถ้ายังถูกตื๊อ เดินออกจากที่นั่นและบอกผู้ใหญ่ที่ไว้ใจ
  hints:
  - เริ่มด้วยคำว่าไม่
  - ขั้นสุดท้ายใช้เมื่อพูดแล้วไม่ได้ผล
  solution: ปฏิเสธชัด → บอกเหตุผล → เสนอทางเลือก → ออกจากสถานการณ์และบอกผู้ใหญ่ ส่วนข้ออ้างว่าช่วยอ่านหนังสือไม่จริง ยาบ้าทำให้นอนไม่หลับและความจำแย่ลง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.drugs-prevention.p010
  topics:
  - health.substances.drugs-prevention
  difficulty: 3
  type: mcq
  stem: แบงก์อายุ 15 ปี เพิ่งย้ายโรงเรียน ไม่มีเพื่อน พ่อแม่ทะเลาะกันบ่อย และเชื่อว่ากัญชา "เป็นสมุนไพร ไม่อันตราย" ข้อใดเป็นปัจจัยเสี่ยงของแบงก์ (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: ไม่มีเพื่อนและรู้สึกโดดเดี่ยว
    correct: true
    feedback: ถูก
  - id: b
    text: ความเครียดจากปัญหาในครอบครัว
    correct: true
    feedback: ถูก
  - id: c
    text: ความเข้าใจผิดว่าสมุนไพรไม่อันตราย
    correct: true
    feedback: ถูก
  - id: d
    text: การเข้าร่วมชมรมกีฬาของโรงเรียน
    feedback: กิจกรรมที่ดีเป็นปัจจัยปกป้อง ไม่ใช่ปัจจัยเสี่ยง
  hints:
  - ปัจจัยเสี่ยงเพิ่มโอกาสใช้ ปัจจัยปกป้องลดโอกาส
  - ดูทั้งด้านตัวเอง ครอบครัว และเพื่อน
  solution: ความโดดเดี่ยว ความเครียดในครอบครัว และความเข้าใจผิดเป็นปัจจัยเสี่ยง ส่วนชมรมกีฬาเป็นปัจจัยปกป้องที่ช่วยให้มีเพื่อนและจัดการความเครียด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.drugs-prevention.p011
  topics:
  - health.substances.drugs-prevention
  difficulty: 3
  type: numeric
  stem: ตาม พ.ร.บ.พืชกระท่อม พ.ศ. 2565 ห้ามขายใบกระท่อมให้ผู้ที่อายุต่ำกว่ากี่ปี (ตอบเป็นปี)
  answer:
    value: 18
    unit: ปี
  misconceptions:
  - match: 20
    feedback: 20 ปีเป็นเกณฑ์ของเครื่องดื่มแอลกอฮอล์และบุหรี่ ส่วนกระท่อมใช้อีกเกณฑ์หนึ่ง
  - match: 15
    feedback: ต่ำกว่าที่กฎหมายกำหนด
  hints:
  - ต่ำกว่าเกณฑ์อายุของเหล้าและบุหรี่
  - กฎหมายยังห้ามขายให้หญิงตั้งครรภ์และหญิงให้นมบุตรด้วย
  solution: กฎหมายห้ามขายใบกระท่อมให้ผู้ที่อายุต่ำกว่า 18 ปี หญิงตั้งครรภ์ และหญิงให้นมบุตร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.drugs-prevention.p012
  topics:
  - health.substances.drugs-prevention
  difficulty: 3
  type: mcq
  stem: ช่วงนี้เพื่อนของเราขาดเรียนบ่อย หงุดหงิดง่าย และขอยืมเงินบ่อย ข้อใดเป็นวิธีคิดที่เหมาะสมที่สุด
  choices:
  - id: a
    text: สัญญาณเหล่านี้อาจเกิดจากหลายสาเหตุ ควรถามด้วยความห่วงใย รับฟัง และชวนคุยกับครูหรือผู้ใหญ่ที่ไว้ใจ
    correct: true
  - id: b
    text: สรุปทันทีว่าเพื่อนติดยาแล้วบอกทุกคนในห้อง
    feedback: สัญญาณเหล่านี้เกิดจากสาเหตุอื่นได้ และการประจานทำให้เพื่อนไม่กล้าขอความช่วยเหลือ
  - id: c
    text: ทำเป็นไม่เห็นเพราะไม่ใช่เรื่องของเรา
    feedback: การถามด้วยความห่วงใยอาจช่วยให้เพื่อนได้รับความช่วยเหลือเร็วขึ้น
  hints:
  - สัญญาณไม่ใช่หลักฐาน
  - วิธีที่ดีทั้งช่วยเพื่อนและให้เกียรติเพื่อน
  solution: การเปลี่ยนแปลงพฤติกรรมอาจมาจากความเครียด การเจ็บป่วย หรือสารเสพติด จึงควรเปิดใจคุยด้วยความห่วงใยและชวนขอความช่วยเหลือ ไม่ตัดสินหรือประจาน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.drugs-prevention.p013
  topics:
  - health.substances.drugs-prevention
  difficulty: 4
  type: mcq
  stem: ข้อใดถูกต้องเกี่ยวกับกัญชาตามกฎหมายไทย (ข้อมูล ณ ตุลาคม 2569)
  choices:
  - id: a
    text: ช่อดอกกัญชาเป็นสมุนไพรควบคุม ร้านที่มีใบอนุญาตขายได้เฉพาะให้ผู้มีใบสั่งจ่ายจากผู้ประกอบวิชาชีพ และห้ามขายออนไลน์
    correct: true
  - id: b
    text: กัญชาทุกส่วนขายให้ใครก็ได้อย่างเสรี
    feedback: ตั้งแต่ 26 มิถุนายน 2568 ช่อดอกเป็นสมุนไพรควบคุม การขายต้องมีใบอนุญาตและใบสั่งจ่าย
  - id: c
    text: สารสกัดกัญชาทุกชนิดถูกกฎหมายแล้ว
    feedback: สารสกัดที่มี THC เกินร้อยละ 0.2 โดยน้ำหนักยังเป็นยาเสพติดให้โทษประเภท 5
  hints:
