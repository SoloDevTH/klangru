  - id: computer.algorithms.efficiency.p016
    topics: [computer.algorithms.efficiency]
    difficulty: 4
    type: numeric
    stem: |
      ฟังก์ชันนี้ตั้งใจหาผลรวมของลิสต์แต่มีบั๊ก โปรแกรมแสดงตัวเลขใด

      ```python
      def total(a):
          s = 0
          for i in range(1, len(a)):
              s = s + a[i]
          return s

      print(total([4, 7, 1]))
      ```
    answer: { value: 8, unit: "" }
    hints:
      - "range(1, len(a)) เริ่มที่ดัชนีใด"
      - "ค่าคงตัว s = ผลรวมของ a[0] ถึง a[i−1] จริงก่อนรอบแรก (i = 1) หรือไม่"
    misconceptions:
      - { match: 12, feedback: "12 คือผลรวมที่ถูกต้อง แต่วงวนเริ่มที่ดัชนี 1 จึงข้าม a[0] = 4" }
      - { match: 11, feedback: "วงวนไม่ได้ข้ามตัวสุดท้าย range(1, 3) ให้ i = 1 และ 2" }
    solution: "i = 1 บวก 7 และ i = 2 บวก 1 ได้ s = 8 ข้าม a[0] = 4 ค่าคงตัวไม่จริงตั้งแต่ขั้นเริ่มต้น (ก่อนรอบ i = 1 ต้องมี s = a[0] = 4 แต่ s = 0) แก้โดยใช้ range(len(a)) หรือเริ่ม s = a[0]"
    license: CC-BY-SA-4.0
    ai_assisted: true

