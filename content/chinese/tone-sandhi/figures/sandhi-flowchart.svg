<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Noto Sans Thai',sans-serif">
<title>ผังการเปลี่ยนเสียงของ 一 不 และเสียง 3 ตามพยางค์ที่ตามหลัง</title>
<defs><marker id="a1a1a1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<rect x="0" y="0" width="720" height="470" fill="#fff"/>
<text x="360.0" y="30.0" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="bold">อ่านพยางค์นี้อย่างไร? ดูเสียงเดิมของพยางค์ถัดไป</text>
<rect x="50.0" y="58.0" width="150.0" height="44.0" rx="10" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="125.0" y="86.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">一 yī</text>
<line x1="125.0" y1="103.0" x2="125.0" y2="134.0" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" marker-end="url(#a1a1a1a)"/>
<rect x="30.0" y="136.0" width="190.0" height="48.0" rx="10" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="125.0" y="166.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">หน้าเสียง 4 ?</text>
<rect x="22.0" y="227.0" width="100.0" height="56.0" rx="10" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="72.0" y="251.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ใช่</text>
<text x="72.0" y="271.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">→ yí</text>
<rect x="128.0" y="227.0" width="104.0" height="56.0" rx="10" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="180.0" y="251.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">เสียง 1 2 3</text>
<text x="180.0" y="271.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">→ yì</text>
<line x1="125.0" y1="185.0" x2="72.0" y2="225.0" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" marker-end="url(#a1a1a1a)"/>
<line x1="125.0" y1="185.0" x2="180.0" y2="225.0" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" marker-end="url(#a1a1a1a)"/>
<rect x="25.0" y="318.0" width="200.0" height="74.0" rx="10" fill="#fff" stroke="#1f4e9c" stroke-width="2"/>
<text x="125.0" y="341.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ไม่เปลี่ยน yī: นับเลข</text>
<text x="125.0" y="361.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ลำดับ ท้ายคำ</text>
<text x="125.0" y="381.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">กริยาซ้ำ 看一看 → yi</text>
<rect x="285.0" y="58.0" width="150.0" height="44.0" rx="10" fill="#dcefd6" stroke="#2a6a2a" stroke-width="2"/>
<text x="360.0" y="86.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">不 bù</text>
<line x1="360.0" y1="103.0" x2="360.0" y2="134.0" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" marker-end="url(#a1a1a1a)"/>
<rect x="265.0" y="136.0" width="190.0" height="48.0" rx="10" fill="#dcefd6" stroke="#2a6a2a" stroke-width="2"/>
<text x="360.0" y="166.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">หน้าเสียง 4 ?</text>
<rect x="257.0" y="227.0" width="100.0" height="56.0" rx="10" fill="#dcefd6" stroke="#2a6a2a" stroke-width="2"/>
<text x="307.0" y="251.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ใช่</text>
<text x="307.0" y="271.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">→ bú</text>
<rect x="363.0" y="227.0" width="104.0" height="56.0" rx="10" fill="#dcefd6" stroke="#2a6a2a" stroke-width="2"/>
<text x="415.0" y="251.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ไม่ใช่</text>
<text x="415.0" y="271.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">→ bù</text>
<line x1="360.0" y1="185.0" x2="307.0" y2="225.0" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" marker-end="url(#a1a1a1a)"/>
<line x1="360.0" y1="185.0" x2="415.0" y2="225.0" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" marker-end="url(#a1a1a1a)"/>
<rect x="260.0" y="318.0" width="200.0" height="74.0" rx="10" fill="#fff" stroke="#2a6a2a" stroke-width="2"/>
<text x="360.0" y="341.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">กลาง A不A</text>
<text x="360.0" y="361.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">好不好 → bu</text>
<text x="360.0" y="381.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">(เสียงเบา)</text>
<rect x="520.0" y="58.0" width="150.0" height="44.0" rx="10" fill="#fbe0dc" stroke="#b3261e" stroke-width="2"/>
<text x="595.0" y="86.0" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="normal">เสียง 3</text>
<line x1="595.0" y1="103.0" x2="595.0" y2="134.0" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" marker-end="url(#a1a1a1a)"/>
<rect x="500.0" y="136.0" width="190.0" height="48.0" rx="10" fill="#fbe0dc" stroke="#b3261e" stroke-width="2"/>
<text x="595.0" y="166.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ตามด้วยเสียง 3 ?</text>
<rect x="492.0" y="227.0" width="100.0" height="56.0" rx="10" fill="#fbe0dc" stroke="#b3261e" stroke-width="2"/>
<text x="542.0" y="251.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ใช่</text>
<text x="542.0" y="271.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">→ เสียง 2</text>
<rect x="598.0" y="227.0" width="104.0" height="56.0" rx="10" fill="#fbe0dc" stroke="#b3261e" stroke-width="2"/>
<text x="650.0" y="251.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">เสียงอื่น</text>
<text x="650.0" y="271.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">→ 3 ครึ่ง</text>
<line x1="595.0" y1="185.0" x2="542.0" y2="225.0" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" marker-end="url(#a1a1a1a)"/>
<line x1="595.0" y1="185.0" x2="650.0" y2="225.0" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" marker-end="url(#a1a1a1a)"/>
<rect x="495.0" y="318.0" width="200.0" height="74.0" rx="10" fill="#fff" stroke="#b3261e" stroke-width="2"/>
<text x="595.0" y="341.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ท้ายวลี</text>
<text x="595.0" y="361.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">หรืออ่านเดี่ยว</text>
<text x="595.0" y="381.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">→ เสียง 3 เต็ม</text>
<text x="360.0" y="428.0" font-size="14" text-anchor="middle" fill="#666" font-weight="normal">ตัวอย่าง: 一定 yídìng · 一起 yìqǐ · 不错 búcuò · 不好 bù hǎo · 水果 shuíguǒ · 老师 lǎoshī</text>
<text x="360.0" y="452.0" font-size="13" text-anchor="middle" fill="#666" font-weight="normal">หนังสือเรียนมักเขียน 一 不 ตามเสียงที่เปลี่ยน แต่เสียง 3 ยังเขียนเสียงเดิม</text>
</svg>
