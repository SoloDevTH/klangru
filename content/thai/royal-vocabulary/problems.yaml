problems:
- id: thai.grammar.royal-vocabulary.p001
  topics:
  - thai.grammar.royal-vocabulary
  difficulty: 1
  type: mcq
  stem: คำว่า **เสวย** แปลว่าอะไร
  choices:
  - id: a
    text: กิน
    correct: true
    feedback: ถูก เสวย = กิน ใช้กับพระมหากษัตริย์และพระราชวงศ์
  - id: b
    text: นอน
    feedback: นอน ใช้ว่า บรรทม
  - id: c
    text: พูด
    feedback: พูด ใช้ว่า ตรัส
  - id: d
    text: ดู
    feedback: ดู ใช้ว่า ทอดพระเนตร
  hints:
  - นึกถึงคำว่า เครื่องเสวย
  - เครื่องเสวยคืออาหาร
  solution: '**เสวย = กิน** เช่น เครื่องเสวย คืออาหาร'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.royal-vocabulary.p002
  topics:
  - thai.grammar.royal-vocabulary
  difficulty: 1
  type: match
  stem: ดูภาพ จับคู่หมายเลขกับคำราชาศัพท์
  figure:
    src: royal-face-quiz.svg
    alt: ภาพใบหน้าการ์ตูนมีหมายเลขชี้อวัยวะ หมายเลข 1 ชี้ที่ผม หมายเลข 2 ชี้ที่คิ้ว หมายเลข 3 ชี้ที่ตา หมายเลข 4 ชี้ที่จมูก หมายเลข 5 ชี้ที่ปาก หมายเลข 6 ชี้ที่หู
  pairs:
  - left: หมายเลข 1
    right: พระเกศา
  - left: หมายเลข 3
    right: พระเนตร
  - left: หมายเลข 4
    right: พระนาสิก
  - left: หมายเลข 5
    right: พระโอษฐ์
  - left: หมายเลข 6
    right: พระกรรณ
  hints:
  - ดูว่าแต่ละหมายเลขชี้ที่อวัยวะใด
  - ผม = พระเกศา ตา = พระเนตร หู = พระกรรณ
  solution: 1 ผม = พระเกศา · 3 ตา = พระเนตร · 4 จมูก = พระนาสิก · 5 ปาก = พระโอษฐ์ · 6 หู = พระกรรณ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.royal-vocabulary.p003
  topics:
  - thai.grammar.royal-vocabulary
  difficulty: 1
  type: mcq
  stem: พระสงฆ์ **กิน** อาหาร ใช้คำว่าอะไร
  choices:
  - id: a
    text: ฉัน
    correct: true
    feedback: ถูก พระสงฆ์ฉันภัตตาหาร
  - id: b
    text: เสวย
    feedback: เสวย ใช้กับพระมหากษัตริย์และพระราชวงศ์
  - id: c
    text: รับประทาน
    feedback: รับประทาน เป็นคำสุภาพสำหรับบุคคลทั่วไป
  - id: d
    text: จำวัด
    feedback: จำวัด แปลว่า นอน
  hints:
  - คำที่ใช้กับพระสงฆ์ต่างจากพระราชวงศ์
  - นึกถึงคำว่า ฉันเพล
  solution: พระสงฆ์ **ฉัน** ภัตตาหาร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.royal-vocabulary.p004
  topics:
  - thai.grammar.royal-vocabulary
  difficulty: 2
  type: match
  stem: จับคู่คำกริยาราชาศัพท์กับความหมาย
  pairs:
  - left: บรรทม
    right: นอน
  - left: ประทับ
    right: นั่ง อยู่
  - left: ตรัส
    right: พูด
  - left: ทอดพระเนตร
    right: ดู
  - left: สรง
    right: อาบน้ำ
  hints:
  - ทอดพระเนตร มีคำว่า พระเนตร (ตา)
  - สรงน้ำพระ ในวันสงกรานต์คือรดน้ำ อาบน้ำ
  solution: บรรทม = นอน · ประทับ = นั่ง/อยู่ · ตรัส = พูด · ทอดพระเนตร = ดู · สรง = อาบน้ำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.royal-vocabulary.p005
  topics:
  - thai.grammar.royal-vocabulary
  difficulty: 2
  type: mcq
  stem: ข้อใดใช้คำ **ถูกต้อง**
  choices:
  - id: a
    text: ผมรับประทานข้าวแล้ว
    correct: true
    feedback: ถูก ใช้คำสุภาพกับตัวเอง
  - id: b
    text: ผมเสวยข้าวแล้ว
    feedback: ไม่ใช้ราชาศัพท์กับตัวเอง
  - id: c
    text: พระสงฆ์เสวยภัตตาหาร
    feedback: พระสงฆ์ใช้ ฉัน
  - id: d
    text: คุณยายบรรทมแล้ว
    feedback: บรรทม ใช้กับพระมหากษัตริย์และพระราชวงศ์ คุณยายใช้ นอน หรือ หลับ
  hints:
  - ราชาศัพท์ใช้กับใคร ไม่ใช้กับใคร
  - บุคคลทั่วไปใช้คำสุภาพ
  solution: '**ผมรับประทานข้าวแล้ว** ราชาศัพท์ไม่ใช้กับตนเองหรือบุคคลทั่วไป'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.royal-vocabulary.p006
  topics:
  - thai.grammar.royal-vocabulary
  difficulty: 2
  type: text
  stem: คำสุภาพของคำว่า **หัว** คือคำใด
  accepted:
  - ศีรษะ
  misconceptions:
  - match: พระเศียร
    feedback: พระเศียร เป็นราชาศัพท์ ใช้กับพระมหากษัตริย์และพระราชวงศ์ ไม่ใช่คำสุภาพสำหรับคนทั่วไป
  - match: ศรีษะ
    feedback: สะกดผิด ที่ถูกคือ ศีรษะ (ศี-ร-ษะ)
  hints:
  - คำนี้ใช้ในประโยค สวมหมวกนิรภัยป้องกัน___
  - ขึ้นต้นด้วย ศ
  solution: คำสุภาพของ หัว คือ **ศีรษะ**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.royal-vocabulary.p007
  topics:
  - thai.grammar.royal-vocabulary
  difficulty: 3
  type: mcq
  stem: ข้อใดใช้คำว่า **ทรง** ผิด
  choices:
  - id: a
    text: ทรงเสด็จไปเปิดงาน
    correct: true
    feedback: ถูกที่ว่าผิด เสด็จ เป็นราชาศัพท์อยู่แล้ว ห้ามใส่ ทรง ซ้อน
  - id: b
    text: ทรงม้า
    feedback: ถูกต้อง ทรง + นามสามัญ = ขี่ม้า
  - id: c
    text: ทรงพระอักษร
    feedback: ถูกต้อง ทรง + นามราชาศัพท์ = เรียน อ่าน เขียน
  - id: d
    text: ทรงยินดี
    feedback: ถูกต้อง ทรง + กริยาสามัญ
  hints:
  - ทรง ใช้ได้กับนามสามัญ กริยาสามัญ และนามราชาศัพท์
  - ห้ามใช้ ทรง กับกริยาที่เป็นราชาศัพท์อยู่แล้ว
  solution: '**ทรงเสด็จ** ผิด เพราะ เสด็จ เป็นกริยาราชาศัพท์อยู่แล้ว'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.royal-vocabulary.p008
  topics:
  - thai.grammar.royal-vocabulary
  difficulty: 3
  type: mcq
  stem: ชาวบ้านร่วมกันสร้างอาคารเรียนแล้วถวายแด่พระมหากษัตริย์ ควรใช้คำใด
  choices:
  - id: a
    text: น้อมเกล้าฯ ถวาย
    correct: true
    feedback: ถูก อาคารเป็นสิ่งที่ยกไม่ได้
  - id: b
    text: ทูลเกล้าฯ ถวาย
    feedback: ทูลเกล้าฯ ใช้กับสิ่งของที่ยกได้ เช่น หนังสือ
  - id: c
    text: ประเคน
    feedback: ประเคน ใช้กับการถวายของแด่พระสงฆ์
  - id: d
    text: พระราชทาน
    feedback: พระราชทาน ใช้เมื่อพระมหากษัตริย์ให้ผู้อื่น
  hints:
  - อาคารยกขึ้นได้หรือไม่
  - ยกได้ = ทูลเกล้าฯ ยกไม่ได้ = น้อมเกล้าฯ
  solution: อาคารยกไม่ได้ ใช้ **น้อมเกล้าฯ ถวาย**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.royal-vocabulary.p009
  topics:
  - thai.grammar.royal-vocabulary
  difficulty: 3
  type: mcq
  stem: ในวันสงกรานต์ คุณยายนิมนต์พระมาที่บ้าน แล้วยกสำรับอาหารส่งถึงมือพระ การยกส่งให้ถึงมือพระเรียกว่าอะไร
  choices:
  - id: a
    text: ประเคน
    correct: true
    feedback: ถูก ประเคน คือยกของส่งให้ถึงมือพระสงฆ์
  - id: b
    text: ทูลเกล้าฯ
    feedback: ทูลเกล้าฯ ใช้กับพระมหากษัตริย์
  - id: c
    text: พระราชทาน
    feedback: พระราชทาน ใช้เมื่อพระมหากษัตริย์ให้
  - id: d
    text: จำวัด
    feedback: จำวัด แปลว่า นอน (ของพระสงฆ์)
  hints:
  - คำนี้ใช้กับพระสงฆ์
  - ถวายแล้วยกส่งถึงมือ
  solution: การยกของส่งให้ถึงมือพระคือ **ประเคน**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.royal-vocabulary.p010
  topics:
  - thai.grammar.royal-vocabulary
  difficulty: 3
  type: numeric
  stem: ประโยค "พระองค์ทรงเสวยพระกระยาหาร แล้วทรงบรรทม" ใช้ ทรง **ผิด** กี่แห่ง
  answer:
    value: 2
    tolerance: 0
    unit: แห่ง
  misconceptions:
  - match: 1
    feedback: ทั้ง เสวย และ บรรทม เป็นราชาศัพท์อยู่แล้ว ผิดทั้งสองแห่ง
  - match: 0
    feedback: เสวย และ บรรทม เป็นราชาศัพท์อยู่แล้ว ห้ามใส่ ทรง
  hints:
  - หาคำว่า ทรง ทุกแห่ง
  - ดูว่าคำที่ตามหลัง ทรง เป็นราชาศัพท์อยู่แล้วหรือไม่
  solution: ทรง**เสวย** และ ทรง**บรรทม** ผิดทั้งคู่ = **2 แห่ง** ที่ถูกคือ "พระองค์เสวยพระกระยาหาร แล้วบรรทม"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.royal-vocabulary.p011
  topics:
  - thai.grammar.royal-vocabulary
  difficulty: 4
  type: match
  stem: จับคู่บุคคลกับคำที่ใช้แทนคำว่า **ตาย**
  pairs:
  - left: พระมหากษัตริย์
    right: สวรรคต
  - left: พระภิกษุสงฆ์
    right: มรณภาพ
  - left: นายกรัฐมนตรี
    right: ถึงแก่อนิจกรรม
  - left: บุคคลทั่วไป
    right: ถึงแก่กรรม
  hints:
  - แต่ละระดับบุคคลใช้คำต่างกัน
  - ดูตารางระดับบุคคลในบทเรียน
  solution: พระมหากษัตริย์ สวรรคต · พระภิกษุ มรณภาพ · ข้าราชการชั้นผู้ใหญ่ ถึงแก่อนิจกรรม · บุคคลทั่วไป ถึงแก่กรรม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.royal-vocabulary.p012
  topics:
  - thai.grammar.royal-vocabulary
  difficulty: 4
  type: mcq
  stem: ข้อใดใช้คำนำหน้าคำนามของพระมหากษัตริย์ **ถูกต้อง**
  choices:
  - id: a
    text: พระบรมฉายาลักษณ์
    correct: true
    feedback: ถูก รูปถ่ายของพระมหากษัตริย์ใช้ พระบรม
  - id: b
    text: พระฉายาลักษณ์ของพระมหากษัตริย์
    feedback: สิ่งสำคัญของพระมหากษัตริย์ใช้ พระบรม
  - id: c
    text: พระเสด็จ
    feedback: เสด็จ เป็นกริยา ไม่ใช่คำนาม และไม่เติม พระ นำหน้า
  - id: d
    text: พระราชหัว
    feedback: หัว ของพระมหากษัตริย์ใช้ พระเศียร
  hints:
  - พระบรม ใช้กับสิ่งสำคัญของพระมหากษัตริย์
  - รูปถ่าย รูปปั้น คำสอน ใช้ พระบรม
  solution: '**พระบรมฉายาลักษณ์** (รูปถ่ายของพระมหากษัตริย์)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.royal-vocabulary.p013
  topics:
  - thai.grammar.royal-vocabulary
  difficulty: 4
  type: mcq
  stem: พระสงฆ์รูปหนึ่งพูดกับชาวบ้านว่า "___ ขออนุโมทนาด้วย" ควรเติมคำใด
  choices:
  - id: a
    text: อาตมา
    correct: true
    feedback: ถูก พระสงฆ์ใช้ อาตมา แทนตัวเอง
  - id: b
    text: ข้าพระพุทธเจ้า
    feedback: ข้าพระพุทธเจ้า ใช้เมื่อกราบบังคมทูลพระมหากษัตริย์
  - id: c
    text: โยม
    feedback: โยม เป็นคำที่พระใช้เรียกชาวบ้าน ไม่ใช่เรียกตัวเอง
  - id: d
    text: พระองค์
    feedback: พระองค์ ใช้กล่าวถึงพระมหากษัตริย์หรือพระราชวงศ์
  hints:
  - ผู้พูดคือพระสงฆ์ พูดถึงตัวเอง
  - พระเรียกชาวบ้านว่า โยม แล้วเรียกตัวเองว่าอะไร
  solution: พระสงฆ์ใช้ **อาตมา** แทนตัวเอง และเรียกชาวบ้านว่า โยม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.royal-vocabulary.p014
  topics:
  - thai.grammar.royal-vocabulary
  difficulty: 4
  type: mcq
  stem: ป้ายเมนูร้านอาหารแบบทางการ ข้อใดใช้ **คำสุภาพ** ทั้งหมด
  choices:
  - id: a
    text: ผัดผักทอดยอด · ผัดถั่วเพาะ · ขนมทราย
    correct: true
    feedback: ถูก ทั้งสามเป็นคำสุภาพของ ผักบุ้ง ถั่วงอก ขนมขี้หนู
  - id: b
    text: ผัดผักบุ้ง · ผัดถั่วเพาะ · ขนมทราย
    feedback: ผักบุ้ง คำสุภาพคือ ผักทอดยอด
  - id: c
    text: ผัดผักทอดยอด · ผัดถั่วงอก · ขนมทราย
    feedback: ถั่วงอก คำสุภาพคือ ถั่วเพาะ
  - id: d
    text: ผัดผักทอดยอด · ผัดถั่วเพาะ · ขนมขี้หนู
    feedback: ขนมขี้หนู คำสุภาพคือ ขนมทราย
  hints:
  - ตรวจทีละคำ
  - ผักบุ้ง ถั่วงอก ขนมขี้หนู มีคำสุภาพทุกคำ
  solution: ผักทอดยอด (ผักบุ้ง) · ถั่วเพาะ (ถั่วงอก) · ขนมทราย (ขนมขี้หนู)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.royal-vocabulary.p015
  topics:
  - thai.grammar.royal-vocabulary
  difficulty: 5
  type: text
  stem: 'แก้คำที่ผิดให้ถูก แล้วพิมพ์ประโยคใหม่ทั้งประโยค: "พระมหากษัตริย์ทรงเสด็จไปทรงเปิดโรงพยาบาล"'
  accepted:
  - พระมหากษัตริย์เสด็จพระราชดำเนินไปทรงเปิดโรงพยาบาล
  misconceptions:
