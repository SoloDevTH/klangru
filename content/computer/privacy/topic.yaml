id: computer.society.privacy
subject: computer
title: { th: ข้อมูลส่วนบุคคลและความเป็นส่วนตัว, en: "Personal data and privacy" }
summary: ข้อมูลที่ระบุตัวบุคคลทั้งทางตรงและทางอ้อม ร่องรอยดิจิทัลจากคุกกี้ ตำแหน่ง และประวัติการใช้งาน หลักการของ PDPA การออกแบบระบบที่เก็บข้อมูลเท่าที่จำเป็น และผลต่อสังคม
difficulty: 3.5
minutes: 40
prerequisites: [computer.society.responsible-ict, computer.data.data-processing]
encompasses:
  - { id: computer.society.responsible-ict, weight: 0.3 }
  - { id: computer.data.data-processing, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: footprint.svg
    alt: "แผนภาพสามคอลัมน์ ร่องรอยดิจิทัลมาจากสามทาง คอลัมน์แรก ข้อมูลที่เราให้เอง รู้ตัวว่ากำลังให้ เช่น โพสต์ รูป ความคิดเห็น ชื่อ เบอร์โทรในฟอร์ม ข้อความแชต รีวิวร้านอาหาร คอลัมน์ที่สอง ข้อมูลที่ระบบเก็บอัตโนมัติ มักไม่รู้ตัว เช่น คุกกี้และตัวติดตาม ตำแหน่ง GPS และ Wi-Fi ประวัติการค้นหาและการคลิก เวลาและอุปกรณ์ที่ใช้ คอลัมน์ที่สาม ข้อมูลที่ระบบอนุมาน ไม่เคยบอกเลย เช่น ความชอบและงานอดิเรก ช่วงอายุ รายได้โดยประมาณ ที่อยู่บ้านและที่เรียน แนวโน้มจะซื้อสินค้า ลูกศรชี้จากคอลัมน์แรกไปคอลัมน์ที่สองและสาม และทั้งสามรวมกันเป็นร่องรอยดิจิทัลที่ถูกคัดลอก เก็บ และส่งต่อได้ ลบให้หมดยาก"
    caption: "ร่องรอยดิจิทัลไม่ได้มีแค่สิ่งที่เราโพสต์"
  - type: figure
    src: pdpa-cycle.svg
    alt: "วงจรข้อมูลส่วนบุคคลสี่ขั้นตาม PDPA ขั้น 1 ก่อนเก็บ แจ้งวัตถุประสงค์ ขอความยินยอมชัดแจ้ง มาตรา 19 และ 23 ขั้น 2 เก็บ เก็บเท่าที่จำเป็น ข้อมูลอ่อนไหวเข้มกว่า มาตรา 22 และ 26 ขั้น 3 ใช้และเปิดเผย ใช้ตามวัตถุประสงค์ที่แจ้ง รักษาความปลอดภัย มาตรา 21 27 และ 37 ขั้น 4 ลบหรือทำลาย เมื่อพ้นความจำเป็นหรือเจ้าของถอนความยินยอม มาตรา 33 และ 37 ข้อความใต้ภาพบอกว่าผู้ควบคุมข้อมูลต้องแจ้งเหตุข้อมูลรั่วภายใน 72 ชั่วโมงนับแต่ทราบเหตุ กรอบล่างคือสิทธิของเจ้าของข้อมูล หกข้อ ขอเข้าถึงและขอสำเนา มาตรา 30 ขอรับข้อมูลไปใช้ที่อื่น มาตรา 31 คัดค้านการเก็บหรือใช้ มาตรา 32 ขอให้ลบหรือทำให้ระบุตัวไม่ได้ มาตรา 33 ขอให้ระงับการใช้ มาตรา 34 ถอนความยินยอมเมื่อใดก็ได้ มาตรา 19"
    caption: "หน้าที่ของผู้ควบคุมข้อมูลในแต่ละขั้น และสิทธิของเจ้าของข้อมูล (สรุปเพื่อการเรียน ไม่ใช่คำแนะนำทางกฎหมาย)"
  - type: worked-example
    title: ตรวจฟอร์มสมัครชมรมว่าเก็บเกินจำเป็นหรือไม่
    problem: |
      ชมรมดนตรีไทยทำฟอร์มออนไลน์รับสมัครสมาชิก เพื่อจัดกลุ่มซ้อมตามเครื่องดนตรีและแจ้งตารางซ้อม ฟอร์มมีช่อง
      ชื่อเล่น ห้องเรียน เครื่องดนตรีที่อยากเล่น อีเมลโรงเรียน เลขบัตรประชาชน ศาสนา และน้ำหนัก
      ช่องใดควรตัดออก และทำไม
    steps:
      - text: "เขียนวัตถุประสงค์ให้ชัด: จัดกลุ่มซ้อมตามเครื่องดนตรี และส่งตารางซ้อม"
        why: "หลักเก็บเท่าที่จำเป็น (PDPA มาตรา 22) ตัดสินจากวัตถุประสงค์ ถ้าไม่เขียนให้ชัดจะบอกไม่ได้ว่าอะไรจำเป็น"
      - text: "ไล่ทีละช่อง: ชื่อเล่นกับห้องเรียนใช้เรียกและนัดซ้อม เครื่องดนตรีใช้จัดกลุ่ม อีเมลโรงเรียนใช้ส่งตาราง จึงจำเป็นทั้งสี่ช่อง"
      - text: "เลขบัตรประชาชนและน้ำหนักไม่เกี่ยวกับการซ้อม ถ้ารั่วยังนำไปใช้ปลอมตัวหรือล้อเลียนได้ จึงตัดออก"
      - text: "ศาสนาเป็นข้อมูลอ่อนไหวตามมาตรา 26 ไม่เกี่ยวกับวัตถุประสงค์ ต้องตัดออก"
        why: "ข้อมูลอ่อนไหวคุมเข้มกว่าปกติ เก็บโดยไม่จำเป็นยิ่งเสี่ยง"
      - text: "เพิ่มข้อความบนฟอร์มว่าเก็บข้อมูลไปทำอะไร ใครเห็น และจะลบเมื่อจบปีการศึกษา"
    answer: "ตัดเลขบัตรประชาชน ศาสนา และน้ำหนัก เหลือชื่อเล่น ห้องเรียน เครื่องดนตรี และอีเมลโรงเรียน พร้อมแจ้งวัตถุประสงค์และระยะเวลาเก็บ"
  - { type: check, problem: computer.society.privacy.p007, prompt: "ใช้หลักเก็บเท่าที่จำเป็นกับฟอร์มอื่น" }
  - type: worked-example
    title: ลบชื่อแล้วยังรู้ได้ไหมว่าเป็นใคร
    problem: |
      ครูแชร์ผลสำรวจชั่วโมงนอนของนักเรียนห้องหนึ่งในกลุ่มผู้ปกครอง โดยลบชื่อออกแล้ว เหลือคอลัมน์ ชั้น เพศ อายุ และชั่วโมงนอน

      | ชั้น | เพศ | อายุ | ชั่วโมงนอน |
      |---|---|---|---|
      | ม.2 | ชาย | 13 | 7 |
      | ม.2 | ชาย | 14 | 6 |
      | ม.2 | หญิง | 13 | 8 |
      | ม.2 | หญิง | 14 | 7 |
      | ม.2 | ชาย | 13 | 9 |
      | ม.2 | หญิง | 13 | 6 |

      มีกี่แถวที่ผู้ปกครองซึ่งรู้จักเด็กทุกคนชี้ตัวได้ และควรแก้อย่างไร
    steps:
      - text: "จัดกลุ่มแถวตามข้อมูลที่คนอื่นรู้อยู่แล้ว คือ ชั้น เพศ และอายุ"
        why: "ชั่วโมงนอนคือข้อมูลที่อยากปกปิด ส่วนชั้น เพศ อายุ คนอื่นรู้ได้ จึงใช้เป็นตัวชี้"
      - text: "นับขนาดกลุ่ม: ชาย 13 มี 2 แถว หญิง 13 มี 2 แถว ชาย 14 มี 1 แถว หญิง 14 มี 1 แถว"
      - text: "กลุ่มที่มี 1 แถวชี้ตัวได้ทันที ถ้าห้องนี้มีเด็กชายอายุ 14 คนเดียว ทุกคนจะรู้ว่าเขานอน 6 ชั่วโมง จึงชี้ตัวได้ 2 แถว"
      - text: "แก้โดยตัดคอลัมน์อายุ (หรือเขียนเป็นช่วง 13–14) แล้วนับใหม่ ได้กลุ่มชาย 3 แถว และหญิง 3 แถว"
        why: "ทุกแถวมีคนที่ข้อมูลเหมือนกันอย่างน้อย 3 คน จึงชี้ตัวไม่ได้แน่ชัด เรียกว่า k = 3"
    answer: "ชี้ตัวได้ 2 แถว (ชายอายุ 14 และหญิงอายุ 14) ตัดหรือหยาบคอลัมน์อายุจนทุกกลุ่มมีอย่างน้อย 3 คน"
  - { type: check, problem: computer.society.privacy.p009, prompt: "นับแถวที่ชี้ตัวได้ในตารางที่ใหญ่ขึ้น" }
glossary:
  - { term: ข้อมูลส่วนบุคคล (personal data), definition: "ข้อมูลเกี่ยวกับบุคคลที่ทำให้ระบุตัวบุคคลนั้นได้ ไม่ว่าทางตรงหรือทางอ้อม (PDPA มาตรา 6)" }
  - { term: ข้อมูลอ่อนไหว (sensitive data), definition: "ข้อมูลส่วนบุคคลที่ถ้ารั่วอาจทำให้ถูกเลือกปฏิบัติ เช่น ศาสนา สุขภาพ ความพิการ ข้อมูลพันธุกรรม ข้อมูลชีวภาพ กฎหมายคุมเข้มกว่าปกติ (มาตรา 26)" }
  - { term: ร่องรอยดิจิทัล (digital footprint), definition: "ข้อมูลทั้งหมดที่เราทิ้งไว้เมื่อใช้เทคโนโลยี ทั้งที่ให้เอง ที่ระบบเก็บอัตโนมัติ และที่ระบบอนุมาน" }
  - { term: คุกกี้ (cookie), definition: "ไฟล์เล็ก ๆ ที่เว็บไซต์ฝากไว้ในเบราว์เซอร์ คุกกี้ของบุคคลที่สามใช้ติดตามการเข้าเว็บหลายแห่ง" }
  - { term: ผู้ควบคุมข้อมูล (data controller), definition: "บุคคลหรือนิติบุคคลที่ตัดสินใจเก็บ ใช้ หรือเปิดเผยข้อมูลส่วนบุคคล เช่น โรงเรียน ร้านค้า" }
  - { term: เก็บเท่าที่จำเป็น (data minimisation), definition: "เก็บเฉพาะข้อมูลที่ต้องใช้ตามวัตถุประสงค์ที่แจ้งไว้ (มาตรา 22)" }
  - { term: แฝงชื่อ (pseudonymisation), definition: "แทนชื่อด้วยรหัส แล้วเก็บตารางจับคู่รหัสกับชื่อแยกไว้อย่างปลอดภัย" }
flashcards:
  - { front: "ข้อมูลส่วนบุคคลทางอ้อม", back: "ข้อมูลที่ชิ้นเดียวระบุตัวไม่ได้ แต่รวมกันแล้วรู้ว่าเป็นใคร เช่น ห้อง เพศ ปีเกิด" }
  - { front: "ร่องรอยดิจิทัลมาจากสามทาง", back: "ข้อมูลที่ให้เอง ข้อมูลที่ระบบเก็บอัตโนมัติ และข้อมูลที่ระบบอนุมาน" }
  - { front: "ข้อมูลรั่วต้องแจ้งสำนักงานคุ้มครองข้อมูลส่วนบุคคลภายในกี่ชั่วโมง", back: "72 ชั่วโมงนับแต่ทราบเหตุ (PDPA มาตรา 37)" }
  - { front: "สิทธิของเจ้าของข้อมูลตาม PDPA", back: "ขอดูและขอสำเนา ขอรับไปใช้ที่อื่น คัดค้าน ขอให้ลบ ขอให้ระงับการใช้ และถอนความยินยอม" }
  - { front: "คำถามก่อนเปิดเผยข้อมูล", back: "ใครจะเห็น เห็นไปเพื่ออะไร และถ้าไปถึงคนไม่หวังดีจะเกิดอะไร" }
