      - "คำนวณ $\\sqrt{6^2 + 0.5^2}$"
      - "ทางลาดที่ชันน้อยจะยาวกว่าระยะแนวราบเพียงเล็กน้อย"
    misconceptions:
      - { match: 6.5, feedback: "ดูเหมือนบวก $6 + 0.5$ ตรง ๆ ต้องบวกในรูปกำลังสองแล้วถอดราก" }
      - { match: 5.98, feedback: "ดูเหมือนใช้ $6^2 - 0.5^2$ ทางลาดเป็นด้านตรงข้ามมุมฉาก ต้องยาวกว่า $6\\ \\mathrm{m}$ จึงต้องบวก" }
    solution: "ทางลาด $= \\sqrt{6^2 + 0.5^2} = \\sqrt{36 + 0.25} = \\sqrt{36.25} \\approx 6.02\\ \\mathrm{m}$"
