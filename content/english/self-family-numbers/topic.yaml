id: english.vocabulary.self-family-numbers
subject: english
title: { th: "คำศัพท์เกี่ยวกับตนเอง ครอบครัว ตัวเลข สี และสิ่งรอบตัว", en: "Words about me, my family, numbers, colours and things around me" }
summary: คำศัพท์ร่างกาย ครอบครัว ตัวเลข 1–100 สี ขนาด รูปทรง ของในโรงเรียนและอาหาร เลือกภาพให้ตรงกับคำที่อ่าน และใช้คำเหล่านี้เล่าเรื่องตนเอง
difficulty: 1.5
minutes: 30
prerequisites: [english.grammar.be-have-there]
encompasses:
  - { id: english.grammar.be-have-there, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: family-tree.svg
    alt: "แผนผังครอบครัวของน้ำสามรุ่น แถวบนคือ grandfather (ปู่) และ grandmother (ย่า) แถวกลางคือลูกของปู่ย่าสองคน ได้แก่ father (พ่อ) ซึ่งแต่งงานกับ mother (แม่) และ uncle (ลุง พี่ชายของพ่อ) ซึ่งแต่งงานกับ aunt (ป้า) แถวล่างใต้พ่อแม่คือ brother (พี่ชาย) me (Nam, ฉัน) และ sister (น้องสาว) ใต้ลุงกับป้าคือ cousin (ลูกพี่ลูกน้อง)"
    caption: "My grandfather and my grandmother have two sons: my father and my uncle."
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.vocabulary.self-family-numbers.p006, prompt: "forty เป็นหลักอะไร seven เป็นหลักอะไร" }
  - type: worked-example
    title: แนะนำตัวด้วยคำศัพท์ใกล้ตัว
    problem: "เขียน 4 ประโยคแนะนำตัวของต้น: ชื่อต้น อายุ 9 ขวบ มีน้องสาว 2 คน ชอบสีฟ้า (สีน้ำเงิน)"
    steps:
      - text: "บอกชื่อด้วย is: *My name is Ton.*"
      - text: "บอกอายุด้วย am และเขียนตัวเลขเป็นคำ 9 = nine: *I am nine years old.*"
        why: "ภาษาอังกฤษบอกอายุด้วย be ไม่ใช้ have"
      - text: "น้องสาวคือ younger sister มีสองคนจึงเติม s: *I have two younger sisters.*"
      - text: "บอกสีที่ชอบ: *My favourite colour is blue.*"
        why: "สีฟ้าและสีน้ำเงินภาษาอังกฤษใช้ blue (ฟ้าอ่อนคือ light blue)"
    answer: "*My name is Ton. I am nine years old. I have two younger sisters. My favourite colour is blue.*"
  - { type: check, problem: english.vocabulary.self-family-numbers.p012, prompt: "อย่าลืมนับคนที่เล่าเรื่อง" }
  - type: worked-example
    title: อ่านตัวเลขที่ลงท้าย -teen และ -ty
    problem: "แม่ซื้อไข่ *eighteen* ฟอง และส้ม *eighty* ลูก รวมทั้งหมดกี่ชิ้น"
    steps:
      - text: "*eighteen* ลงท้าย -teen จึงอยู่ระหว่าง 13–19: eighteen = 18"
      - text: "*eighty* ลงท้าย -ty จึงเป็นหลักสิบ: eighty = 80"
        why: "eight + ty ตัด t ซ้ำออกตัวหนึ่ง สะกดว่า eighty"
      - text: "บวกกัน 18 + 80 = 98"
      - text: "เขียนเป็นคำ: 98 = *ninety-eight*"
    answer: "98 ชิ้น (*ninety-eight*)"
glossary:
  - { term: -teen, definition: "ส่วนท้ายของตัวเลข 13–19 เช่น thirteen, fifteen ลงเสียงหนักท้ายคำ" }
  - { term: -ty, definition: "ส่วนท้ายของตัวเลขหลักสิบ 20–90 เช่น twenty, forty ลงเสียงหนักหน้าคำ" }
  - { term: hyphen (-), definition: "ขีดสั้นที่ใช้เชื่อมตัวเลข 21–99 เช่น twenty-one, forty-seven" }
  - { term: cousin, definition: "ลูกพี่ลูกน้อง คือลูกของลุง ป้า น้า หรืออา ใช้ได้ทั้งชายและหญิง" }
  - { term: older / younger, definition: "ใช้หน้า brother หรือ sister เพื่อบอกว่าเป็นพี่หรือน้อง เช่น older sister = พี่สาว" }
flashcards:
  - { front: "40 เขียนเป็นคำอย่างไร", back: "forty (ไม่มี u ต่างจาก four)" }
  - { front: "13 กับ 30 ต่างกันอย่างไร", back: "thirteen (13, ลงเสียงหนักท้ายคำ) / thirty (30, ลงเสียงหนักหน้าคำ)" }
  - { front: "\"รถสีแดง\" ภาษาอังกฤษพูดว่าอะไร", back: "a red car (สีอยู่หน้าคำนาม)" }
  - { front: "พี่ชาย / น้องสาว", back: "older brother / younger sister" }
  - { front: "\"ลูกบอลสีแดงลูกใหญ่\" เรียงคำอย่างไร", back: "a big red ball (ขนาด → สี → คำนาม)" }
