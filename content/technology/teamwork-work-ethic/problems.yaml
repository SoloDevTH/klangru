problems:
- id: technology.living.teamwork-work-ethic.p001
  topics:
  - technology.living.teamwork-work-ethic
  difficulty: 1
  type: order
  stem: "เรียงลำดับขั้นตอนการทำงานกลุ่มให้สำเร็จ"
  items:
  - "ตั้งเป้าหมายร่วมของกลุ่มให้ชัดและวัดได้"
  - "แบ่งบทบาทและงานตามความถนัดของแต่ละคน"
  - "วางแผนลำดับงานและเวลาเป็นตาราง"
  - "ติดตามความคืบหน้าเป็นระยะ"
  - "สรุปผลร่วมกันและให้เครดิตทุกคนที่มีส่วนร่วม"
  hints:
  - "ก่อนแบ่งงานต้องรู้ก่อนว่ากลุ่มต้องการไปถึงอะไร"
  - "แผนที่ดีต้องมีการติดตามเพื่อดูว่าเป็นไปตามที่วางไว้หรือไม่"
  - "ขั้นสุดท้ายคือการสรุปผลและยอมรับผลงานของทุกคน"
  solution: "ตั้งเป้าหมายร่วมก่อน แล้วแบ่งบทบาทและงาน วางแผนลำดับงานและเวลา ติดตามความคืบหน้า และสุดท้ายสรุปผลร่วมกันพร้อมให้เครดิตทุกคน เพราะการทำงานกลุ่มต้องรู้ทิศทางก่อนลงมือ"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.teamwork-work-ethic.p002
  topics:
  - technology.living.teamwork-work-ethic
  difficulty: 1
  type: mcq
  stem: "บทบาทใดในกลุ่มทำหน้าที่บันทึกสิ่งที่ตกลงกันและติดตามกำหนดส่งงาน"
  choices:
  - id: a
    text: "ผู้นำ ที่ตัดสินทุกเรื่องแทนกลุ่ม"
    feedback: "ผู้นำควรช่วยให้กลุ่มตัดสินใจร่วมกัน ไม่ได้ตัดสินแทนทุกคน"
  - id: b
    text: "เลขานุการ"
    correct: true
  - id: c
    text: "สมาชิก ที่ทำเฉพาะงานที่ได้รับ"
    feedback: "สมาชิกรับผิดชอบงานของตน แต่ไม่ได้มีหน้าที่บันทึกและติดตามงานรวมของกลุ่ม"
  - id: d
    text: "ไม่มีบทบาทใดในกลุ่ม ให้ทุกคนจดเอง"
    feedback: "การไม่มีบทบาทที่ชัดเจนทำให้ไม่มีคนติดตามงานรวม"
  hints:
  - "บทบาทนี้เกี่ยวข้องกับการจดและการเตือนกำหนดส่ง"
  - "ลองนึกถึงคนที่เปิดสมุดบันทึกการประชุมของกลุ่ม"
  solution: "เลขานุการทำหน้าที่บันทึกสิ่งที่ตกลงกันและติดตามกำหนดส่งงาน เพื่อให้กลุ่มรู้ความคืบหน้าและไม่ลืมสิ่งที่ตกลงไว้"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.teamwork-work-ethic.p003
  topics:
  - technology.living.teamwork-work-ethic
  difficulty: 2
  type: match
  stem: "จับคู่บทบาทในกลุ่มกับหน้าที่ของบทบาทนั้น"
  pairs:
  - left: "ผู้นำ"
    right: "ประสานงานและช่วยให้กลุ่มตัดสินใจร่วมกัน"
  - left: "เลขานุการ"
    right: "บันทึกความคืบหน้าและติดตามกำหนดส่ง"
  - left: "สมาชิก"
    right: "รับผิดชอบงานที่ได้รับให้เสร็จตามเวลา"
  - left: "ผู้ดูแลวัสดุ"
    right: "จัดหาและดูแลอุปกรณ์ที่ใช้ร่วมกัน"
  hints:
  - "แต่ละบทบาทมีหน้าที่ต่างกันตามคำที่ใช้เรียก"
  - "ลองคิดว่าใครต้องติดต่อคนอื่นและใครต้องดูแลวัตถุ"
  - "หน้าที่ของสมาชิกเกี่ยวกับงานที่ตนรับผิดชอบโดยตรง"
  solution: "ผู้นำประสานงาน เลขานุการบันทึกและติดตาม สมาชิกรับผิดชอบงานของตน และผู้ดูแลวัสดุจัดหาและดูแลอุปกรณ์ที่ใช้ร่วมกัน"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.teamwork-work-ethic.p004
  topics:
  - technology.living.teamwork-work-ethic
  difficulty: 2
  type: mcq
  stem: "สมาชิกคนหนึ่งยังไม่ส่งงานที่รับผิดชอบ ข้อใดเป็นการรับมือที่เหมาะสม"
  choices:
  - id: a
    text: "ทำงานแทนทั้งหมดโดยไม่บอกใคร"
    feedback: "การทำงานแทนโดยไม่บอกทำให้กลุ่มไม่รู้ปัญหาและไม่ได้แก้ที่ต้นเหตุ"
  - id: b
    text: "ถามด้วยความเข้าใจ หาสาเหตุ แล้วปรับการแบ่งงานร่วมกันอย่างยุติธรรม"
    correct: true
  - id: c
    text: "ตำหนิต่อหน้าทุกคนเพื่อให้รู้สึกผิด"
    feedback: "การตำหนิต่อหน้าคนอื่นทำให้สมาชิกไม่กล้าบอกปัญหาในครั้งต่อไป"
  - id: d
    text: "ตัดชื่อออกจากงานโดยไม่แจ้งเจ้าตัว"
    feedback: "การตัดสินใจโดยไม่แจ้งทำให้ขาดความเป็นธรรมและความไว้ใจในกลุ่ม"
  hints:
  - "ก่อนสรุปว่าใครผิด ควรรู้ก่อนว่าเกิดอะไรขึ้น"
  - "การแก้ปัญหาร่วมกันทำให้ทุกคนได้เรียนรู้และรักษาความไว้ใจในกลุ่ม"
  solution: "การถามด้วยความเข้าใจทำให้รู้สาเหตุที่แท้จริง เช่น ไม่เข้าใจงานหรือมีภาระอื่น แล้วการปรับแผนร่วมกันช่วยให้งานเสร็จโดยไม่ทำลายความไว้ใจ"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.teamwork-work-ethic.p005
  topics:
  - technology.living.teamwork-work-ethic
  difficulty: 2
  type: numeric
  stem: "งานกลุ่ม 5 คน แบ่งงานเท่ากัน คนละ 12 หน้า ต่อมามีสมาชิกคนหนึ่งไม่ส่งงาน จึงแบ่งงาน 12 หน้านั้นให้สมาชิกที่เหลือ 4 คนเท่า ๆ กัน แต่ละคนต้องเขียนเพิ่มกี่หน้า (ตอบเป็นหน้า)"
  answer:
    value: 3
    tolerance: 0
    unit: "หน้า"
  misconceptions:
  - match: 4
    feedback: "ตอบ 4 เกิดจากหาร 12 ด้วย 3 โดยคิดว่ามีสมาชิกที่เหลือ 3 คน แต่จริงมี 4 คน"
  - match: 2.4
    feedback: "ตอบ 2.4 เกิดจากหาร 12 ด้วย 5 โดยรวมคนที่ไม่ส่งงานเข้าไปด้วย"
  hints:
  - "งานของคนที่ไม่ส่งยังต้องมีคนทำ จึงต้องนำมาแบ่งให้คนที่เหลือ"
  - "จำนวนคนที่เหลือคือ 4 คน ไม่รวมคนที่ไม่ส่งงาน"
  - "นำหน้าที่ต้องแบ่งเพิ่มไปหารด้วยจำนวนคนที่เหลือ"
  solution: "งานที่ต้องแบ่งเพิ่มคือ 12 หน้า แบ่งให้สมาชิก 4 คนที่เหลือ ได้คนละ 12 ÷ 4 = 3 หน้า ทำให้แต่ละคนเขียนรวมเป็น 15 หน้า (ตรวจด้วย python3: 12/4 = 3)"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.teamwork-work-ethic.p006
  topics:
  - technology.living.teamwork-work-ethic
  difficulty: 2
  type: text
  stem: "การไม่คัดลอกงานของผู้อื่นและอ้างแหล่งที่มาให้ถูกต้อง สะท้อนคุณธรรมข้อใด (ตอบเป็นคำ 1 คำ)"
  accepted:
  - "ซื่อสัตย์"
  - "ความซื่อสัตย์"
  misconceptions:
  - match: "ขยัน"
    feedback: "ความขยันคือการตั้งใจทำงานให้สม่ำเสมอ แต่การอ้างแหล่งที่มาเป็นเรื่องของความซื่อสัตย์"
  hints:
  - "คิดถึงสิ่งที่ผู้ทำงานบอกกับคนอื่นเกี่ยวกับที่มาของผลงานตนเอง"
  - "คุณธรรมที่ตรงข้ามกับการแอบอ้างผลงาน"
  solution: "การอ้างแหล่งที่มาและไม่คัดลอกงานของผู้อื่นแสดงถึงความซื่อสัตย์ต่อผลงานและต่อผู้อื่น"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.teamwork-work-ethic.p007
  topics:
  - technology.living.teamwork-work-ethic
  difficulty: 3
  type: mcq
  stem: "ข้อใดเป็นการทำงานอย่างมีความเสียสละในกลุ่ม"
  choices:
  - id: a
    text: "ทำเฉพาะงานที่ตนชอบเพราะสนุกกว่า"
    feedback: "การเลือกทำเฉพาะงานที่ชอบโดยไม่สนใจภาพรวมไม่ใช่ความเสียสละ"
  - id: b
    text: "รับงานที่ยากกว่าบ้างเพื่อให้กลุ่มไปถึงเป้าหมาย โดยไม่หวังเครดิตคนเดียว"
    correct: true
  - id: c
    text: "ให้คนอื่นทำงานหนักขณะตนเองพักผ่อน"
    feedback: "การผลักภาระให้ผู้อื่นทำให้กลุ่มเสียความไว้ใจ"
  - id: d
    text: "เก็บความรู้ไว้ไม่แบ่งปันเพื่อให้ตนเองโดดเด่น"
    feedback: "การไม่แบ่งปันความรู้ทำให้กลุ่มไม่ไปถึงเป้าหมายร่วม"
  hints:
  - "ความเสียสละคือการให้ความสำคัญกับเป้าหมายส่วนรวมมากกว่าประโยชน์ส่วนตัว"
  - "ดูว่าการกระทำนั้นช่วยให้กลุ่มไปถึงเป้าหมายหรือไม่"
  solution: "การรับงานที่ยากกว่าบ้างโดยไม่หวังเครดิตคนเดียวเป็นการเสียสละเพื่อเป้าหมายร่วม ซึ่งเป็นพื้นฐานของการทำงานกลุ่มที่มีคุณธรรม"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.teamwork-work-ethic.p008
  topics:
  - technology.living.teamwork-work-ethic
  difficulty: 3
  type: mcq
  stem: "ลักษณะนิสัยใดช่วยให้งานกลุ่มไปถึงเป้าหมายได้เมื่อเจอปัญหาซ้ำ ๆ"
  choices:
  - id: a
    text: "อดทนและรับผิดชอบ"
    correct: true
  - id: b
    text: "ทำเร็วโดยไม่ตรวจงาน"
    feedback: "การรีบทำโดยไม่ตรวจอาจทำให้งานผิดพลาดและต้องแก้ใหม่"
  - id: c
    text: "ไม่บอกใครเมื่อติดขัด"
    feedback: "การเก็บปัญหาไว้คนเดียวทำให้กลุ่มไม่สามารถช่วยแก้ไขได้ทัน"
  - id: d
    text: "รอให้คนอื่นแก้ปัญหาให้เสมอ"
    feedback: "การรอให้คนอื่นทำทุกครั้งทำให้กลุ่มต้องแบกภาระและไม่เกิดการเรียนรู้"
  hints:
  - "ปัญหาที่เกิดซ้ำต้องการความต่อเนื่องและความใส่ใจในการแก้ไข"
  - "ลักษณะนิสัยที่ช่วยให้ผ่านช่วงยากได้คือความอดทนและความรับผิดชอบ"
  solution: "ความอดทนทำให้ไม่ยอมแพ้เมื่อปัญหาซ้ำ และความรับผิดชอบทำให้ยังคงรับผิดชอบงานของตนจนเสร็จและแจ้งกลุ่มเมื่อจำเป็น"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.teamwork-work-ethic.p009
  topics:
  - technology.living.teamwork-work-ethic
  difficulty: 3
  type: numeric
  stem: "กราฟแสดงความคืบหน้าของสมาชิกทั้งสี่คนในงานกลุ่ม ถ้าทุกคนได้รับงานปริมาณเท่ากัน ค่าเฉลี่ยความคืบหน้าของกลุ่มเท่ากับเท่าใด (ตอบเป็นร้อยละ)"
  figure:
    src: progress.svg
    alt: "แผนภูมิแท่งแสดงความคืบหน้าของสมาชิกสี่คน สมาชิก A ทำได้ 100 เปอร์เซ็นต์ สมาชิก B ได้ 80 เปอร์เซ็นต์ สมาชิก C ได้ 60 เปอร์เซ็นต์ และสมาชิก D ได้ 40 เปอร์เซ็นต์ แกนตั้งแสดงร้อยละตั้งแต่ 0 ถึง 100"
  answer:
    value: 70
    tolerance: 0
    unit: "%"
  misconceptions:
  - match: 100
    feedback: "ตอบ 100 คือความคืบหน้าของสมาชิกที่ทำได้มากที่สุด ไม่ใช่ค่าเฉลี่ยของทั้งกลุ่ม"
  - match: 60
    feedback: "ตอบ 60 คือความคืบหน้าของสมาชิก C เพียงคนเดียว"
  hints:
  - "อ่านค่าความคืบหน้าของสมาชิกทั้งสี่คนจากแท่งกราฟให้ครบ"
  - "ค่าเฉลี่ยคือผลรวมของทุกคนหารด้วยจำนวนคน"
  solution: "ค่าเฉลี่ย = (100 + 80 + 60 + 40) ÷ 4 = 280 ÷ 4 = 70 เปอร์เซ็นต์ (ตรวจด้วย python3: (100+80+60+40)/4 = 70)"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.teamwork-work-ethic.p010
  topics:
  - technology.living.teamwork-work-ethic
  difficulty: 3
  type: mcq
  stem: "กลุ่มของคุณนำข้อมูลที่เพื่อนคนหนึ่งหามาใส่ในงานโดยไม่ได้อ้างที่มา ข้อใดควรทำก่อนส่งงาน"
  choices:
  - id: a
    text: "แก้เฉพาะส่วนที่เห็นว่าไม่สำคัญ"
    feedback: "การแก้เฉพาะส่วนไม่สำคัญไม่ได้แก้ปัญหาการไม่อ้างที่มา"
  - id: b
    text: "แจ้งให้กลุ่มทราบ แล้วระบุที่มาหรือขออนุญาตใช้ข้อมูลนั้นก่อนส่งงาน"
    correct: true
  - id: c
    text: "ไม่บอกใครเพื่อไม่ให้บรรยากาศกลุ่มเสีย"
    feedback: "การปิดบังปัญหาทำให้ปัญหาใหญ่ขึ้นเมื่อครูหรือเจ้าของข้อมูลพบภายหลัง"
  - id: d
    text: "ลบชื่อเพื่อนออกจากรายชื่อผู้มีส่วนร่วม"
    feedback: "การลบชื่อผู้มีส่วนร่วมทำให้ไม่ซื่อสัตย์ต่อผู้ที่ช่วยทำงาน"
  hints:
  - "ก่อนส่งงานต้องแก้ไขเรื่องที่มาของข้อมูลให้ถูกต้อง"
  - "ความซื่อสัตย์และการให้เครดิตผู้ช่วยงานเป็นสิ่งที่ควรทำเสมอ"
  solution: "ควรแจ้งกลุ่มก่อน แล้วระบุที่มาหรือขออนุญาตใช้ข้อมูลนั้น เพื่อให้งานถูกต้องและให้เครดิตผู้ที่ช่วยหาข้อมูลตามจริง"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.living.teamwork-work-ethic.p011
  topics:
  - technology.living.teamwork-work-ethic
  difficulty: 2
  type: text
  stem: "ลักษณะนิสัยของผู้ที่ทำงานที่รับไว้ให้เสร็จทันเวลาที่กำหนด เรียกว่าอะไรได้บ้าง (ตอบเป็นคำ 1 คำ)"
  accepted:
  - "ตรงเวลา"
  - "รับผิดชอบ"
  - "ตรงต่อเวลา"
  - "ความรับผิดชอบ"
  hints:
