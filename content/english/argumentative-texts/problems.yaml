  - id: c
    text: เป็นกลางและให้ข้อมูลเท่านั้น
    feedback: น้ำเสียงไม่เป็นกลาง เพราะผู้เขียนใช้คำที่แสดงการประเมินเชิงลบ
  - id: d
    text: ขบขันกับบรรจุภัณฑ์
