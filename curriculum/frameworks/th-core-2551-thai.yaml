          - { id: "ท 2.1 ม.4-6/4", level: ม.4-6, text: "ผลิตงานเขียนของตนเองในรูปแบบต่างๆ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ผลิตงานเขียนของตนเอง|ในรูปแบบต่างๆ” ไม่เว้นวรรค" }
          - { id: "ท 2.1 ม.4-6/5", level: ม.4-6, text: "ประเมินงานเขียนของผู้อื่น แล้วนำมาพัฒนางานเขียนของตนเอง" }
          - { id: "ท 2.1 ม.4-6/6", level: ม.4-6, text: "เขียนรายงานการศึกษาค้นคว้าเรื่องที่สนใจ ตามหลักการเขียนเชิงวิชาการ และใช้ข้อมูลสารสนเทศอ้างอิงอย่างถูกต้อง" }
          - { id: "ท 2.1 ม.4-6/7", level: ม.4-6, text: "บันทึกการศึกษาค้นคว้า เพื่อนำไปพัฒนาตนเองอย่างสม่ำเสมอ" }
          - { id: "ท 2.1 ม.4-6/8", level: ม.4-6, text: "มีมารยาทในการเขียน" }
  - id: ท3
    title: การฟัง การดู และการพูด
    standards:
      - id: ท 3.1
        text: "สามารถเลือกฟังและดูอย่างมีวิจารณญาณ และพูดแสดงความรู้ ความคิด ความรู้สึกในโอกาสต่างๆ อย่างมีวิจารณญาณ และสร้างสรรค์"
        indicators:
          - { id: "ท 3.1 ป.1/1", level: ป.1, text: "ฟังคำแนะนำ คำสั่งง่ายๆ และปฏิบัติตาม" }
          - { id: "ท 3.1 ป.1/2", level: ป.1, text: "ตอบคำถามและเล่าเรื่องที่ฟังและดู ทั้งที่เป็นความรู้และความบันเทิง" }
          - { id: "ท 3.1 ป.1/3", level: ป.1, text: "พูดแสดงความคิดเห็น และความรู้สึกจากเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ป.1/4", level: ป.1, text: "พูดสื่อสารได้ตามวัตถุประสงค์" }
          - { id: "ท 3.1 ป.1/5", level: ป.1, text: "มีมารยาทในการฟัง การดู และการพูด", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การดู|และการพูด” เว้นวรรค" }
          - { id: "ท 3.1 ป.2/1", level: ป.2, text: "ฟังคำแนะนำ คำสั่งที่ซับซ้อน และปฏิบัติตาม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “คำสั่งที่ซับซ้อน|และปฏิบัติตาม” เว้นวรรค" }
          - { id: "ท 3.1 ป.2/2", level: ป.2, text: "เล่าเรื่องที่ฟังและดู ทั้งที่เป็นความรู้ และความบันเทิง" }
          - { id: "ท 3.1 ป.2/3", level: ป.2, text: "บอกสาระสำคัญของเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ป.2/4", level: ป.2, text: "ตั้งคำถามและตอบคำถามเกี่ยวกับเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ป.2/5", level: ป.2, text: "พูดแสดงความคิดเห็นและความรู้สึกจากเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ป.2/6", level: ป.2, text: "พูดสื่อสารได้ชัดเจนตรงตามวัตถุประสงค์" }
          - { id: "ท 3.1 ป.2/7", level: ป.2, text: "มีมารยาทในการฟัง การดู และการพูด", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การดู|และการพูด” เว้นวรรค" }
          - { id: "ท 3.1 ป.3/1", level: ป.3, text: "เล่ารายละเอียดเกี่ยวกับเรื่องที่ฟังและดู ทั้งที่เป็นความรู้ และความบันเทิง" }
          - { id: "ท 3.1 ป.3/2", level: ป.3, text: "บอกสาระสำคัญจากการฟัง และการดู" }
          - { id: "ท 3.1 ป.3/3", level: ป.3, text: "ตั้งคำถามและตอบคำถามเกี่ยวกับเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ป.3/4", level: ป.3, text: "พูดแสดงความคิดเห็นและความรู้สึกจากเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ป.3/5", level: ป.3, text: "พูดสื่อสารได้ชัดเจนตรงตามวัตถุประสงค์" }
          - { id: "ท 3.1 ป.3/6", level: ป.3, text: "มีมารยาทในการฟัง การดู และการพูด" }
          - { id: "ท 3.1 ป.4/1", level: ป.4, text: "จำแนกข้อเท็จจริง และข้อคิดเห็นจากเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ป.4/2", level: ป.4, text: "พูดสรุปความจากการฟังและดู" }
          - { id: "ท 3.1 ป.4/3", level: ป.4, text: "พูดแสดงความรู้ ความคิดเห็น และความรู้สึกเกี่ยวกับเรื่องที่ฟังและดู", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความคิดเห็น|และความรู้สึก” เว้นวรรค" }
          - { id: "ท 3.1 ป.4/4", level: ป.4, text: "ตั้งคำถาม และตอบคำถามเชิงเหตุผลจากเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ป.4/5", level: ป.4, text: "รายงานเรื่องหรือประเด็นที่ศึกษาค้นคว้าจากการฟัง การดู และการสนทนา" }
          - { id: "ท 3.1 ป.4/6", level: ป.4, text: "มีมารยาทในการฟัง การดู และการพูด", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การดู|และการพูด” เว้นวรรค" }
          - { id: "ท 3.1 ป.5/1", level: ป.5, text: "พูดแสดงความรู้ ความคิดเห็น และความรู้สึกจากเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ป.5/2", level: ป.5, text: "ตั้งคำถาม และตอบคำถามเชิงเหตุผลจากเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ป.5/3", level: ป.5, text: "วิเคราะห์ความน่าเชื่อถือจากเรื่องที่ฟังและดูอย่างมีเหตุผล" }
          - { id: "ท 3.1 ป.5/4", level: ป.5, text: "พูดรายงานเรื่องหรือประเด็นที่ศึกษาค้นคว้าจากการฟัง การดู และการสนทนา" }
          - { id: "ท 3.1 ป.5/5", level: ป.5, text: "มีมารยาทในการฟัง การดู และการพูด", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การดู|และการพูด” เว้นวรรค" }
          - { id: "ท 3.1 ป.6/1", level: ป.6, text: "พูดแสดงความรู้ ความเข้าใจจุดประสงค์ของเรื่องที่ฟังและดู", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความเข้าใจ|จุดประสงค์ของ” ไม่เว้นวรรค" }
          - { id: "ท 3.1 ป.6/2", level: ป.6, text: "ตั้งคำถามและตอบคำถามเชิงเหตุผลจากเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ป.6/3", level: ป.6, text: "วิเคราะห์ความน่าเชื่อถือจากการฟังและดูสื่อโฆษณาอย่างมีเหตุผล" }
          - { id: "ท 3.1 ป.6/4", level: ป.6, text: "พูดรายงานเรื่องหรือประเด็นที่ศึกษาค้นคว้าจากการฟัง การดู และการสนทนา" }
          - { id: "ท 3.1 ป.6/5", level: ป.6, text: "พูดโน้มน้าวอย่างมีเหตุผล และน่าเชื่อถือ" }
          - { id: "ท 3.1 ป.6/6", level: ป.6, text: "มีมารยาทในการฟัง การดู และการพูด", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การดู|และการพูด” เว้นวรรค" }
          - { id: "ท 3.1 ม.1/1", level: ม.1, text: "พูดสรุปใจความสำคัญของเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ม.1/2", level: ม.1, text: "เล่าเรื่องย่อจากเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ม.1/3", level: ม.1, text: "พูดแสดงความคิดเห็นอย่างสร้างสรรค์เกี่ยวกับเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ม.1/4", level: ม.1, text: "ประเมินความน่าเชื่อถือของสื่อที่มีเนื้อหาโน้มน้าวใจ" }
          - { id: "ท 3.1 ม.1/5", level: ม.1, text: "พูดรายงานเรื่องหรือประเด็นที่ศึกษาค้นคว้าจากการฟัง การดู และการสนทนา" }
          - { id: "ท 3.1 ม.1/6", level: ม.1, text: "มีมารยาทในการฟัง การดู และการพูด" }
          - { id: "ท 3.1 ม.2/1", level: ม.2, text: "พูดสรุปใจความสำคัญของเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ม.2/2", level: ม.2, text: "วิเคราะห์ข้อเท็จจริง ข้อคิดเห็นและความน่าเชื่อถือของข่าวสารจากสื่อต่างๆ" }
          - { id: "ท 3.1 ม.2/3", level: ม.2, text: "วิเคราะห์และวิจารณ์เรื่องที่ฟังและดูอย่างมีเหตุผล เพื่อนำข้อคิดมาประยุกต์ใช้ในการดำเนินชีวิต" }
          - { id: "ท 3.1 ม.2/4", level: ม.2, text: "พูดในโอกาสต่างๆ ได้ตรงตามวัตถุประสงค์" }
          - { id: "ท 3.1 ม.2/5", level: ม.2, text: "พูดรายงานเรื่องหรือประเด็นที่ศึกษาค้นคว้าจากการฟัง การดู และการสนทนา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การดู|และการสนทนา” เว้นวรรค" }
          - { id: "ท 3.1 ม.2/6", level: ม.2, text: "มีมารยาทในการฟัง การดู และการพูด" }
          - { id: "ท 3.1 ม.3/1", level: ม.3, text: "แสดงความคิดเห็นและประเมินเรื่องจากการฟังและการดู" }
          - { id: "ท 3.1 ม.3/2", level: ม.3, text: "วิเคราะห์และวิจารณ์เรื่องที่ฟังและดู เพื่อนำข้อคิดมาประยุกต์ใช้ในการดำเนินชีวิต" }
          - { id: "ท 3.1 ม.3/3", level: ม.3, text: "พูดรายงานเรื่องหรือประเด็นที่ศึกษาค้นคว้าจากการฟัง การดู และการสนทนา" }
          - { id: "ท 3.1 ม.3/4", level: ม.3, text: "พูดในโอกาสต่างๆ ได้ตรงตามวัตถุประสงค์" }
          - { id: "ท 3.1 ม.3/5", level: ม.3, text: "พูดโน้มน้าว โดยนำเสนอหลักฐานตามลำดับเนื้อหาอย่างมีเหตุผล และน่าเชื่อถือ" }
          - { id: "ท 3.1 ม.3/6", level: ม.3, text: "มีมารยาทในการฟัง การดู และการพูด" }
          - { id: "ท 3.1 ม.4-6/1", level: ม.4-6, text: "สรุปแนวคิด และแสดงความคิดเห็นจากเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ม.4-6/2", level: ม.4-6, text: "วิเคราะห์ แนวคิด การใช้ภาษา และความน่าเชื่อถือจากเรื่องที่ฟังและดูอย่างมีเหตุผล" }
          - { id: "ท 3.1 ม.4-6/3", level: ม.4-6, text: "ประเมินเรื่องที่ฟังและดู แล้วกำหนดแนวทางนำไปประยุกต์ใช้ในการดำเนินชีวิต" }
          - { id: "ท 3.1 ม.4-6/4", level: ม.4-6, text: "มีวิจารณญาณในการเลือกเรื่องที่ฟังและดู" }
          - { id: "ท 3.1 ม.4-6/5", level: ม.4-6, text: "พูดในโอกาสต่างๆ พูดแสดงทรรศนะ โต้แย้ง โน้มน้าวใจ และเสนอแนวคิดใหม่ด้วยภาษาที่ถูกต้องเหมาะสม", note: "เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง กลุ่มสาระการเรียนรู้ภาษาไทย (สพฐ. 2551) พิมพ์ว่า “...และเสนอแนวคิดใหม่ด้วยภาษาถูกต้องเหมาะสม” (ไม่มีคำว่า ที่) ไฟล์นี้ยึดตามเล่มหลักสูตรแกนกลาง" }
          - { id: "ท 3.1 ม.4-6/6", level: ม.4-6, text: "มีมารยาทในการฟัง การดู และการพูด" }
  - id: ท4
    title: หลักการใช้ภาษาไทย
    standards:
      - id: ท 4.1
        text: "เข้าใจธรรมชาติของภาษาและหลักภาษาไทย การเปลี่ยนแปลงของภาษาและพลังของภาษา ภูมิปัญญาทางภาษา และรักษาภาษาไทยไว้เป็นสมบัติของชาติ"
        indicators:
