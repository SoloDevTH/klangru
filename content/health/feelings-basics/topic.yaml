id: health.mental.feelings-basics
subject: health
title: { th: รู้จักอารมณ์ของตัวเอง บอกความรู้สึก และทำให้ใจสงบ, en: "Knowing my feelings, saying how I feel and calming down" }
summary: รู้จักอารมณ์พื้นฐานและสัญญาณในร่างกาย บอกความรู้สึกด้วยประโยค ฉันรู้สึก...เพราะ... และฝึกวิธีทำให้ใจสงบเมื่อรู้สึกแรง
difficulty: 1
minutes: 25
prerequisites: [health.family.family-and-self]
encompasses:
  - { id: health.family.family-and-self, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: อารมณ์พื้นฐานและสีหน้า
    src: emotion-faces.svg
    alt: "หน้าการ์ตูนเจ็ดหน้า มีชื่ออารมณ์ใต้แต่ละหน้า แถวบน: ดีใจ (ยิ้ม) เสียใจ (มุมปากตก มีน้ำตาไหล) โกรธ (คิ้วขมวด ปากเม้ม) กลัว (ตาเบิกโต ปากอ้า) แถวล่าง: ตื่นเต้น (ยิ้มกว้างอ้าปาก) เบื่อ (ตาครึ่งหลับ ปากตรง) ภูมิใจ (ยิ้มและคิ้วสูง)"
    caption: "อารมณ์บางอย่างมีสีหน้าคล้ายกันได้ จึงควรดูทั้งสีหน้า ท่าทาง และเหตุการณ์ประกอบกัน"
  - type: worked-example
    title: บอกความรู้สึกด้วยประโยคที่ชัดเจน
    problem: "น้องโกรธเพราะเพื่อนหยิบของเล่นไปโดยไม่บอก น้องจะพูดบอกความรู้สึกอย่างไรให้เพื่อนเข้าใจ"
    steps:
      - text: "หาอารมณ์ก่อน: น้องรู้สึกโกรธ"
        why: "การเรียกชื่ออารมณ์ให้ถูกช่วยให้เราพูดได้ตรงกับที่รู้สึก"
      - text: "หาเหตุการณ์: เพื่อนหยิบของเล่นไปโดยไม่บอก"
      - text: "ต่อเป็นประโยคแบบ \"ฉันรู้สึก...เพราะ...\""
      - text: "เติมสิ่งที่อยากให้เกิดขึ้น: \"ฉันอยากให้เธอขอก่อนนะ\""
        why: "บอกว่าอยากให้ทำอย่างไร ช่วยให้เพื่อนรู้ว่าต้องทำอะไรต่อ"
    answer: 'ฉันรู้สึกโกรธ เพราะเธอหยิบของเล่นไปโดยไม่บอก ฉันอยากให้เธอขอก่อนนะ'
  - { type: check, problem: health.mental.feelings-basics.p005, prompt: "ลองคิดก่อนอ่านต่อ: ประโยคไหนบอกความรู้สึกได้ชัดที่สุด" }
  - type: figure
    title: วงนับการหายใจให้ใจสงบ
    src: breath-count.svg
    alt: "วงกลมมีจุดหมายเลข 1 ถึง 8 วางรอบวง จุดหมายเลข 1 ถึง 4 เป็นสีน้ำเงิน หมายถึงหายใจเข้า จุดหมายเลข 5 ถึง 8 เป็นสีส้ม หมายถึงหายใจออก ตรงกลางเขียนว่า 1 รอบ 8 วินาที"
    caption: "นับช้า ๆ ทีละจังหวะ 1 รอบมี 8 จังหวะ ทำให้สบายและไม่ต้องกลั้นลมหายใจ"
  - type: worked-example
    title: หายใจนับ 8 จังหวะทำได้กี่วินาที
    problem: "น้องนับลมหายใจ 1 ถึง 8 ตามวงในภาพ ทำ 3 รอบ โดยให้ 1 จังหวะใช้เวลา 1 วินาที ใช้เวลาทั้งหมดกี่วินาที"
    steps:
      - text: "1 รอบมี 8 จังหวะ และ 1 จังหวะใช้ 1 วินาที จึงใช้ 8 วินาทีต่อรอบ"
        why: "ต้องรู้เวลาของหนึ่งรอบก่อนจึงจะคิดหลายรอบได้"
      - text: "3 รอบใช้เวลา 3 × 8 = 24 วินาที"
      - text: "ถ้าทำได้ช้ากว่านี้ เช่น 1 จังหวะใช้ 2 วินาที ก็ให้ปรับตามความสบาย"
        why: "หลักสำคัญคือให้สบาย ไม่ต้องรีบ"
    answer: "24 วินาที (เมื่อ 1 จังหวะใช้เวลา 1 วินาที)"
  - { type: check, problem: health.mental.feelings-basics.p004, prompt: "ลองคิดก่อนอ่านต่อ: หายใจ 5 รอบแบบนี้ใช้เวลากี่วินาที" }
glossary:
  - { term: อารมณ์, definition: "ความรู้สึกที่เกิดขึ้นกับเราในแต่ละช่วงเวลา เช่น ดีใจ เสียใจ โกรธ หรือกลัว อารมณ์เกิดได้กับทุกคน" }
  - { term: สัญญาณในร่างกาย, definition: "อาการที่ร่างกายแสดงออกเมื่อเรารู้สึกอะไรบางอย่าง เช่น หน้าร้อน ใจเต้นแรง หรือท้องปั่นป่วน" }
  - { term: ประโยค ฉันรู้สึก...เพราะ..., definition: "วิธีบอกความรู้สึกของเราเองพร้อมสาเหตุ โดยไม่โทษผู้อื่น" }
  - { term: การหายใจเพื่อให้ใจสงบ, definition: "การหายใจช้า ๆ อย่างสบาย โดยนับจังหวะไปพร้อมกัน ช่วยให้ร่างกายค่อย ๆ ผ่อนลง" }
flashcards:
  - { front: "อารมณ์พื้นฐานมีอะไรบ้าง", back: "ดีใจ เสียใจ โกรธ กลัว ตื่นเต้น เบื่อ และภูมิใจ" }
  - { front: "สัญญาณในร่างกายที่บอกว่าเรารู้สึกแรงมีอะไรบ้าง", back: "หน้าร้อน ใจเต้นแรง และท้องปั่นป่วน" }
  - { front: "ทำไมควรบอกความรู้สึกด้วยประโยค ฉันรู้สึก...เพราะ...", back: "เพราะบอกทั้งความรู้สึกและเหตุผลของเราเอง โดยไม่โทษใคร" }
  - { front: "สายด่วนที่ควรโทรเมื่อมีเหตุฉุกเฉิน สายเด็ก และสายด่วนสุขภาพจิต", back: "1669 เหตุฉุกเฉิน, 1387 สายเด็ก, 1323 สุขภาพจิต" }
