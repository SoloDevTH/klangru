# หัวข้อในคลังที่ตรงกับ knowledge unit ของ ACM/IEEE-CS/AAAI CS2023
# CS2023 เป็นหลักสูตรระดับปริญญาตรี หัวข้อพื้นฐานของคลังจึงสอนได้เพียงบางส่วนของแต่ละ knowledge unit
framework: acm-cs2023
mappings:
  - topic: computer.algorithms.intro
    indicators: ["SDF-Algorithms"]
    coverage: partial
    note: "แนวคิดของอัลกอริทึมและการค้นหาแบบลำดับ ยังไม่มีการเรียงลำดับ การท่องต้นไม้และกราฟ และการวิเคราะห์ประสิทธิภาพ"
  - topic: computer.data.binary
    indicators: ["AR-Representation"]
    coverage: partial
    note: "บิต ไบต์ เลขฐาน และการแทนข้อมูลที่ไม่ใช่ตัวเลข ยังไม่มีจำนวนลบแบบส่วนเติมเต็มสอง จุดตรึง และจุดลอยตัว"
  - topic: computer.programming.basics
    indicators: ["SDF-Fundamentals"]
    coverage: partial
    note: "ตัวแปร ชนิดข้อมูล นิพจน์ การกำหนดค่า เงื่อนไข การวนซ้ำ การไล่โปรแกรม และข้อผิดพลาด ยังไม่มีฟังก์ชัน ข้อมูลแบบมีโครงสร้าง ไฟล์ การเรียกซ้ำ และการจัดการ exception"
  - topic: computer.data.number-representation
    indicators: [AR-Representation]
    coverage: full
    note: บิต ไบต์ เวิร์ด เลขฐานสิบหก จำนวนไม่มีเครื่องหมาย เครื่องหมายและขนาด ส่วนเติมเต็มสอง การล้น จุดตรึง จุดลอยตัว IEEE 754 32 บิต และรหัสตัวอักษรในฐานสิบหก (รายละเอียดการแทนอักขระอยู่ใน computer.data.binary)
  - topic: computer.systems.logic-gates
    indicators: [SF-Foundations, AR-Logic]
    coverage: partial
    note: ดิจิทัลกับแอนะล็อก เกตและพีชคณิตบูลีน สถานะและเครื่องสถานะจำกัดครบ การประมวลผลตามลำดับกับแบบขนานกล่าวถึงสั้น ๆ เท่านั้น
  - topic: computer.data.data-processing
    indicators: [DM-Data]
    coverage: full
    note: วงจรชีวิตข้อมูลหกขั้นรวมการเก็บรักษาและทำลาย
  - topic: computer.networks.internet-basics
    indicators: [NC-Fundamentals, NC-Applications]
    coverage: full
  - topic: computer.programming.design-debug
    indicators: [SDF-Practices, SE-Validation]
    coverage: partial
    note: การออกแบบกรณีทดสอบ รูปแบบโค้ดที่อ่านง่าย และคอมเมนต์ครบ ยังไม่มีการใช้ IDE และตัวดีบักจริงหรือการเขียนข้อกำหนดของโมดูล
  - topic: computer.society.computing-impacts
    indicators: [SEP-Context, SEP-History]
    coverage: partial
    note: ผลต่อบุคคลและสังคมและการเข้าถึงไม่ได้ครบ ผลของความไม่หลากหลายของทีมพัฒนามีเพียงประเด็นความแม่นยำที่ลำเอียงในโจทย์ p012
  - topic: computer.society.responsible-ict
    indicators: [SEP-IP, SDF-SEP]
    coverage: full
  - topic: computer.society.responsible-ict
    indicators: [SEP-Security, SEP-Professional-Ethics]
    coverage: partial
    note: กฎหมายอาชญากรรมคอมพิวเตอร์ของไทยและการเข้าถึงโดยมิชอบ มัลแวร์ สแปม ส่วนวิศวกรรมสังคมและการโจมตีโครงสร้างพื้นฐานกล่าวถึงสั้น ๆ (มาตรา 12 ไม่ได้สอน) และนโยบายความปลอดภัยขององค์กรไม่ได้สอน
  - topic: computer.systems.computer-systems
    indicators: [SF-Overview, AR-Memory]
    coverage: full
    note: "AR-Memory: ลำดับชั้นหน่วยความจำ แคช และเวลาเข้าถึงเฉลี่ย (p013) ส่วนหน่วยความจำเสมือนกล่าวเพียงว่าระบบสลับข้อมูลไปหน่วยเก็บถาวรเมื่อ RAM เต็ม"
  - topic: computer.systems.computer-systems
    indicators: [AR-Assembly, AR-IO]
    coverage: partial
    note: สถาปัตยกรรมฟอน นอยมันน์ วงรอบดึง ถอดรหัส ทำคำสั่งด้วยเครื่องจำลอง LOAD/ADD/STORE และหลายแกน (p016) แต่ไม่มีภาษาแอสเซมบลีจริงหรือการกระโดด
  - topic: computer.programming.functions
    indicators: [SDF-Fundamentals]
    coverage: partial
    note: ตัวแปร นิพจน์ เงื่อนไข วงวน ฟังก์ชัน ขอบเขต ลิสต์ การเรียกซ้ำ และการไล่การทำงาน ยังไม่มีการอ่านเขียนไฟล์และการจัดการข้อผิดพลาดด้วย try
  - topic: computer.security.cybersecurity-basics
    indicators: [SEC-Foundations]
    coverage: full
    note: CIA การยืนยันตัวตนและการกำหนดสิทธิ์ ภัยคุกคามและช่องโหว่ สิทธิ์น้อยที่สุด และการป้องกันหลายชั้น
  - topic: computer.security.cybersecurity-basics
    indicators: [NC-Security]
    coverage: partial
    note: การดักข้อมูลบน Wi-Fi DoS ไฟร์วอลล์ WPA2/WPA3 และ HTTPS ยังไม่มี VPN ระบบตรวจจับการบุกรุก และการโจมตีระดับโพรโทคอล
  - topic: computer.security.encryption
    indicators: [SEC-Crypto]
    coverage: partial
    note: รหัสแบบดั้งเดิมพร้อมจุดอ่อน (ลองทุกกุญแจ การนับความถี่) ปริภูมิกุญแจ กุญแจสมมาตร กุญแจสาธารณะ ลายมือชื่อดิจิทัล ใบรับรอง และ HTTPS ยังไม่มีฟังก์ชันแฮชและรหัสยืนยันความถูกต้องของข้อความ (MAC)
  - topic: computer.society.inclusive-design
    indicators: [HCI-Accessibility]
    coverage: full
    note: ข้อจำกัดถาวร ชั่วคราว ตามสถานการณ์ หลัก WCAG สี่ข้อ อัตราส่วนความต่างของสี ข้อความแทนภาพ และเทคโนโลยีช่วยเหลือ
  - topic: computer.society.inclusive-design
    indicators: [HCI-User, SEP-DEIA]
    coverage: partial
    note: การสังเกตผู้ใช้จริงและการทดสอบกับผู้ใช้หลากหลาย ส่วนการออกแบบที่ยึดผู้ใช้เป็นศูนย์กลางแบบเต็ม (user story ต้นแบบ การประเมิน) อยู่ใน computer.design.user-centred-design
  - topic: computer.society.privacy
    indicators: [SEP-Privacy]
    coverage: partial
    note: ผลของการเก็บข้อมูลจำนวนมาก การระบุตัวซ้ำจากข้อมูลที่ลบชื่อแล้ว k-anonymity แฝงชื่อ และกล้องจดจำใบหน้ากับสิทธิพลเมือง ยังไม่มี differential privacy และกรอบกฎหมายหลายประเทศในเชิงลึก
  - topic: computer.systems.operating-systems
    indicators: [OS-Purpose, SF-Resource]
    coverage: full
    note: ระบบปฏิบัติการเป็นตัวกลางระหว่างฮาร์ดแวร์กับแอป การจัดสรรหน่วยประมวลผลแบบ FCFS SJF และวนรอบพร้อมการคำนวณเวลารอ การแบ่งหน้าหน่วยความจำ คิวอุปกรณ์ และภาวะติดตาย
  - topic: computer.systems.operating-systems
    indicators: [OS-Principles]
    coverage: partial
    note: นามธรรม กระบวนการและสถานะ โหมดผู้ใช้กับโหมดเคอร์เนล และ system call ยังไม่มีอินเทอร์รัปต์และการทำงานพร้อมกันของเธรด
