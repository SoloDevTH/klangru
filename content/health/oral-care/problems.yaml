problems:
  - id: health.hygiene.oral-care.p001
    topics: [health.hygiene.oral-care]
    difficulty: 1
    type: mcq
    stem: "ช่วงเวลาใดสำคัญที่สุดที่ต้องแปรงฟันทุกวัน"
    choices:
      - { id: a, text: "ก่อนนอน", correct: true }
      - { id: b, text: "ก่อนกินข้าวกลางวัน", feedback: "แปรงก่อนกินแล้วก็มีเศษอาหารติดฟันอีก ช่วงที่สำคัญที่สุดคือก่อนนอน" }
      - { id: c, text: "ตอนอาบน้ำเย็นหลังเลิกเรียน", feedback: "ถ้ากินข้าวเย็นหลังจากนั้น เศษอาหารจะติดฟันทั้งคืน ควรแปรงก่อนนอน" }
    hints:
      - "ตอนหลับ น้ำลายในปากออกมากหรือน้อย"
      - "เชื้อโรคชอบช่วงที่น้ำลายน้อย"
    solution: "ก่อนนอน เพราะตอนหลับน้ำลายออกน้อย เชื้อโรคเพิ่มจำนวนได้ดี ถ้ามีเศษอาหารค้างฟันจะผุง่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.oral-care.p002
    topics: [health.hygiene.oral-care]
    difficulty: 1
    type: mcq
    stem: "เมื่อแปรงด้านนอกของฟันบน ควรปัดแปรงไปทางไหน"
    choices:
      - { id: a, text: "ปัดลง จากเหงือกไปทางปลายฟัน", correct: true }
      - { id: b, text: "ปัดขึ้น จากปลายฟันไปที่เหงือก", feedback: "ปัดขึ้นจะดันเศษอาหารเข้าไปที่ขอบเหงือก ฟันบนต้องปัดลง" }
      - { id: c, text: "ถูไปมาแนวนอนแรง ๆ", feedback: "ถูแรงแนวนอนทำให้เหงือกบาดเจ็บและฟันสึก ควรขยับเบา ๆ แล้วปัด" }
    hints:
      - "ปัดออกจากเหงือกเสมอ"
      - "ฟันบนมีเหงือกอยู่ด้านบน"
    solution: "วางแปรงเอียง 45 องศาที่ขอบเหงือก ขยับสั้น ๆ แล้วปัดลงไปทางปลายฟัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.oral-care.p003
    topics: [health.hygiene.oral-care]
    difficulty: 1
    type: text
    stem: "ยาสีฟันควรผสมสารอะไรเพื่อช่วยป้องกันฟันผุ (ตอบชื่อสาร)"
    accepted: ["ฟลูออไรด์", "ฟลูโอไรด์", "fluoride"]
    misconceptions:
      - { match: "เกลือ", feedback: "เกลือไม่ได้ทำให้ผิวฟันแข็งแรง สารที่ช่วยคือฟลูออไรด์" }
      - { match: "แคลเซียม", feedback: "แคลเซียมได้จากอาหาร แต่สารที่ผสมในยาสีฟันเพื่อป้องกันฟันผุคือฟลูออไรด์" }
    hints:
      - "ดูบนกล่องยาสีฟัน มักเขียนว่า ppm"
      - "ชื่อขึ้นต้นด้วย ฟลู"
    solution: "ฟลูออไรด์ ช่วยให้ผิวฟันแข็งแรงและทนกรดมากขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.oral-care.p004
    topics: [health.hygiene.oral-care]
    difficulty: 2
    type: numeric
    stem: "ถ้าแปรงฟันวันละ 2 ครั้ง ครั้งละ 2 นาที ทุกวัน ใน 1 สัปดาห์ (7 วัน) จะแปรงฟันรวมกี่นาที (ตอบเป็นนาที)"
    answer: { value: 28, unit: นาที }
    misconceptions:
      - { match: 4, feedback: "4 นาทีคือเวลาแปรงใน 1 วัน ต้องคูณด้วย 7 วัน" }
      - { match: 14, feedback: "14 คือจำนวนครั้งที่แปรงใน 1 สัปดาห์ แต่ละครั้งแปรง 2 นาที" }
    hints:
      - "หาเวลาที่แปรงใน 1 วันก่อน"
      - "1 วันแปรง 2 × 2 นาที แล้วคูณด้วยจำนวนวัน"
    solution: "1 วัน: 2 × 2 = 4 นาที, 7 วัน: 4 × 7 = 28 นาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.oral-care.p005
    topics: [health.hygiene.oral-care]
    difficulty: 2
    type: match
    stem: "ดูภาพแปรงสีฟัน A B C ที่บีบยาสีฟันผสมฟลูออไรด์ไว้ แล้วจับคู่กับอายุของผู้ใช้ตามคำแนะนำของกรมอนามัย"
    figure:
      src: toothpaste-quiz.svg
      alt: "แปรงสีฟันสามอันติดตัวอักษร แปรง A มียาสีฟันก้อนเล็กยาวเท่าความกว้างของแปรง แปรง B มียาสีฟันยาวเต็มหัวแปรง แปรง C มียาสีฟันแตะขนแปรงเป็นชั้นบาง ๆ พอเปียก"
    pairs:
      - { left: "A", right: "อายุ 3–6 ปี" }
      - { left: "B", right: "อายุมากกว่า 6 ปี" }
      - { left: "C", right: "อายุ 0–3 ปี" }
    hints:
      - "ยิ่งเด็กเล็ก ยิ่งใช้ยาสีฟันน้อย เพราะเด็กเล็กกลืนยาสีฟันได้"
      - "แตะพอเปียก → เท่าความกว้างของแปรง → เท่าความยาวของแปรง"
    solution: "C แตะพอเปียก: 0–3 ปี, A เท่าความกว้างของแปรง: 3–6 ปี, B เท่าความยาวของแปรง: มากกว่า 6 ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.oral-care.p006
    topics: [health.hygiene.oral-care]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการแปรงฟันก่อนนอนให้ถูกต้อง"
    items:
      - "บีบยาสีฟันผสมฟลูออไรด์ในปริมาณที่เหมาะกับวัย"
      - "แปรงแบบขยับแล้วปัดให้ครบทุกซี่ทุกด้าน นานอย่างน้อย 2 นาที"
      - "แปรงลิ้นเบา ๆ"
      - "บ้วนฟองยาสีฟันออก"
      - "เข้านอนโดยไม่กินหรือดื่มอะไรอีก"
    hints:
      - "เริ่มจากเตรียมแปรง จบที่เข้านอน"
      - "หลังแปรงฟันไม่กินอะไรอีก 2 ชั่วโมง"
    solution: "บีบยาสีฟัน → แปรงฟันทุกซี่ทุกด้าน 2 นาที → แปรงลิ้น → บ้วนฟองออก → เข้านอนโดยไม่กินอะไร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.oral-care.p007
    topics: [health.hygiene.oral-care]
    difficulty: 2
    type: numeric
    stem: "ฟันแท้ที่ขึ้นครบมีมากกว่าฟันน้ำนมกี่ซี่ (ตอบเป็นซี่)"
    answer: { value: 12, unit: ซี่ }
    misconceptions:
      - { match: 52, feedback: "52 คือนำจำนวนมาบวกกัน คำถามถามว่ามากกว่ากันเท่าไร ต้องลบ" }
      - { match: 8, feedback: "ฟันแท้มี 32 ซี่ ไม่ใช่ 28 ซี่ (28 คือจำนวนที่ขึ้นก่อนฟันคุด)" }
    hints:
      - "ฟันน้ำนม 20 ซี่ ฟันแท้ 32 ซี่"
      - "มากกว่ากันเท่าไร ใช้การลบ"
    solution: "32 − 20 = 12 ซี่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.oral-care.p008
    topics: [health.hygiene.oral-care]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดทำให้ฟันผุง่ายขึ้น (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "อมลูกอมทีละเม็ดตลอดบ่าย", correct: true }
      - { id: b, text: "ดื่มนมหวานแล้วเข้านอนโดยไม่แปรงฟัน", correct: true }
      - { id: c, text: "จิบน้ำอัดลมทีละนิดทั้งวัน", correct: true }
      - { id: d, text: "ดื่มน้ำเปล่าหลังกินอาหาร", feedback: "น้ำเปล่าไม่มีน้ำตาล ช่วยล้างเศษอาหาร ไม่ได้ทำให้ฟันผุ" }
      - { id: e, text: "กินผักและผลไม้ที่ต้องเคี้ยว", feedback: "อาหารที่ต้องเคี้ยวและไม่หวานจัดไม่ใช่สาเหตุหลักของฟันผุ" }
    hints:
      - "เชื้อโรคใช้น้ำตาลสร้างกรด"
      - "ยิ่งฟันเจอน้ำตาลบ่อยและนาน ยิ่งผุง่าย"
    solution: "ลูกอม นมหวานก่อนนอนโดยไม่แปรงฟัน และจิบน้ำอัดลมทั้งวัน ทำให้ฟันเจอน้ำตาลบ่อยและนาน จึงผุง่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.oral-care.p009
    topics: [health.hygiene.oral-care]
    difficulty: 3
    type: mcq
    stem: "น้องต้นข้าวอายุ 6 ขวบ มีฟันกรามซี่ใหม่ขึ้นด้านในสุด โดยไม่มีฟันซี่ใดหลุดก่อน แม่บอกว่า \"ฟันน้ำนม เดี๋ยวก็หลุด ไม่ต้องแปรงมากก็ได้\" ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "เป็นฟันกรามแท้ซี่แรก ต้องแปรงให้สะอาดเพราะจะใช้ไปตลอดชีวิต", correct: true }
      - { id: b, text: "เป็นฟันน้ำนม จะหลุดเมื่ออายุ 12 ปี", feedback: "ฟันที่ขึ้นตอน 6 ขวบด้านหลังฟันกรามน้ำนม โดยไม่มีซี่ใดหลุดก่อน คือฟันกรามแท้ซี่แรก" }
      - { id: c, text: "เป็นฟันคุด ควรถอนทิ้ง", feedback: "ฟันคุดมักขึ้นช่วงอายุประมาณ 17–21 ปี ไม่ใช่ตอน 6 ขวบ" }
    hints:
      - "ฟันแท้ซี่แรกขึ้นตอนอายุประมาณกี่ปี"
      - "ฟันซี่นี้ไม่ได้ขึ้นแทนฟันน้ำนมซี่ใด"
    solution: "ฟันกรามแท้ซี่แรกขึ้นตอนอายุประมาณ 6 ปี ถัดจากฟันกรามน้ำนม โดยไม่มีฟันน้ำนมหลุดก่อน คนจึงมักเข้าใจผิดว่าเป็นฟันน้ำนม ต้องดูแลให้ดีเพราะไม่มีฟันใหม่มาแทน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.oral-care.p010
    topics: [health.hygiene.oral-care]
    difficulty: 3
    type: numeric
    stem: "ปลาอายุ 8 ปี ฟันน้ำนมหลุดไปแล้ว 6 ซี่ ปลายังมีฟันน้ำนมเหลืออยู่กี่ซี่ (ตอบเป็นซี่)"
    answer: { value: 14, unit: ซี่ }
    misconceptions:
      - { match: 26, feedback: "26 ได้จากนำฟันแท้ 32 ซี่มาลบ คำถามถามฟันน้ำนมซึ่งมีทั้งหมด 20 ซี่" }
      - { match: 6, feedback: "6 คือจำนวนที่หลุดไปแล้ว คำถามถามจำนวนที่เหลือ" }
    hints:
      - "ฟันน้ำนมมีทั้งหมดกี่ซี่"
      - "นำจำนวนที่หลุดไปลบออกจากจำนวนทั้งหมด"
    solution: "ฟันน้ำนมมี 20 ซี่ หลุดไป 6 ซี่ เหลือ 20 − 6 = 14 ซี่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.oral-care.p011
    topics: [health.hygiene.oral-care]
    difficulty: 3
    type: mcq
    stem: "ร้านค้าในโรงเรียนขายของว่างตอนบ่าย ของว่างข้อใดดีต่อฟันที่สุด"
    choices:
      - { id: a, text: "ฝรั่งหั่นชิ้นกับน้ำเปล่า", correct: true }
      - { id: b, text: "ทอฟฟี่กับน้ำแดง", feedback: "ทอฟฟี่เหนียวติดฟันนาน และน้ำแดงมีน้ำตาลมาก ทำให้ฟันผุง่าย" }
      - { id: c, text: "ขนมปังกรอบเคลือบน้ำตาลกับน้ำอัดลม", feedback: "ทั้งสองอย่างมีน้ำตาลมาก และน้ำอัดลมมีกรดด้วย" }
      - { id: d, text: "อมยิ้มกับนมเปรี้ยวรสหวาน", feedback: "อมยิ้มอยู่ในปากนาน ฟันจึงเจอน้ำตาลนาน" }
    hints:
      - "ของที่หวานและเหนียวติดฟันทำให้ฟันผุง่าย"
      - "เลือกของที่ไม่เติมน้ำตาลและต้องเคี้ยว"
    solution: "ฝรั่งไม่หวานจัดและต้องเคี้ยว น้ำเปล่าไม่มีน้ำตาล จึงดีต่อฟันที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.oral-care.p012
    topics: [health.hygiene.oral-care]
    difficulty: 3
    type: numeric
    stem: "ตามสูตร 2-2-2 หลังแปรงฟันแล้ว ควรงดกินอาหารและเครื่องดื่มอย่างน้อยกี่นาที (ตอบเป็นนาที)"
    answer: { value: 120, unit: นาที }
    misconceptions:
      - { match: 2, feedback: "2 คือจำนวนชั่วโมง โจทย์ให้ตอบเป็นนาที 1 ชั่วโมงมี 60 นาที" }
      - { match: 60, feedback: "60 นาทีคือ 1 ชั่วโมง แต่สูตรให้งด 2 ชั่วโมง" }
    hints:
      - "สูตรให้งดกินดื่มกี่ชั่วโมง"
      - "เปลี่ยนชั่วโมงเป็นนาทีโดยคูณ 60"
    solution: "งด 2 ชั่วโมง = 2 × 60 = 120 นาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.oral-care.p013
    topics: [health.hygiene.oral-care]
    difficulty: 3
    type: mcq
    stem: "ช่วงนี้เวลาแปรงฟัน เหงือกของบีมมีเลือดออกบ่อย และฟันกรามมีจุดดำ แต่ยังไม่ปวด บีมควรทำอย่างไร"
    choices:
      - { id: a, text: "บอกพ่อแม่ แล้วไปพบทันตแพทย์ เช่น ที่โรงพยาบาลหรือ รพ.สต. ใกล้บ้าน", correct: true }
      - { id: b, text: "หยุดแปรงฟันจนกว่าเลือดจะหยุด", feedback: "การหยุดแปรงทำให้คราบจุลินทรีย์สะสม เหงือกจะอักเสบมากขึ้น" }
      - { id: c, text: "รอให้ปวดก่อนแล้วค่อยไปหาหมอฟัน", feedback: "ฟันผุระยะแรกมักไม่ปวด ถ้ารอจนปวด ฟันอาจผุลึกจนรักษายาก" }
      - { id: d, text: "แปรงให้แรงขึ้นเพื่อขัดจุดดำออก", feedback: "การแปรงแรงทำให้เหงือกบาดเจ็บ และจุดดำที่เป็นฟันผุขัดออกไม่ได้" }
    hints:
      - "เลือดออกตอนแปรงและจุดดำบนฟันเป็นสัญญาณผิดปกติ"
      - "ฟันผุระยะแรกมักไม่เจ็บ"
    solution: "บอกผู้ใหญ่และไปพบทันตแพทย์ตั้งแต่ยังไม่ปวด ระหว่างนั้นแปรงฟันเบา ๆ ให้สะอาดต่อไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.oral-care.p014
    topics: [health.hygiene.oral-care]
    difficulty: 4
    type: numeric
    stem: "ห้อง ป.3/2 มีนักเรียน 30 คน สำรวจพบว่าแปรงฟันก่อนนอนทุกคืน 18 คน คิดเป็นร้อยละเท่าไรของนักเรียนทั้งห้อง (ตอบเป็นร้อยละ)"
    answer: { value: 60, unit: "%" }
    misconceptions:
      - { match: 40, feedback: "40 คือร้อยละของคนที่ไม่ได้แปรงฟันก่อนนอนทุกคืน (12 คน)" }
      - { match: 18, feedback: "18 คือจำนวนคน ต้องหารด้วย 30 แล้วคูณ 100" }
    hints:
      - "ร้อยละ = ส่วน ÷ ทั้งหมด × 100"
      - "นำ 18 หารด้วย 30 แล้วคูณ 100"
    solution: "18 ÷ 30 × 100 = 60 คือร้อยละ 60"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.hygiene.oral-care.p015
    topics: [health.hygiene.oral-care]
    difficulty: 4
    type: numeric
