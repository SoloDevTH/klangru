  - id: phy.chg.p020
    topics: [physics.electricity.charge]
    difficulty: 4
    type: numeric
    stem: "ประจุ A $= +4\\ \\mathrm{\\mu C}$ อยู่ที่ $x = 0$ ประจุ B $= +1\\ \\mathrm{\\mu C}$ อยู่ที่ $x = 0.3\\ \\mathrm{m}$ และประจุ C $= +1\\ \\mathrm{\\mu C}$ อยู่ที่ $x = 0.1\\ \\mathrm{m}$ ดังรูป แรงลัพธ์บนประจุ C มีขนาดกี่นิวตัน ใช้ $k = 9.0 \\times 10^9\\ \\mathrm{N\\,m^2/C^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    figure: { src: p-three-charges.svg, alt: "ประจุบวกสามตัวบนเส้นตรง A มีประจุ +4 ไมโครคูลอมบ์ที่ x = 0 C มีประจุ +1 ไมโครคูลอมบ์ที่ x = 0.1 m และ B มีประจุ +1 ไมโครคูลอมบ์ที่ x = 0.3 m" }
    answer: { value: 3.375, tolerance: 0.03, unit: N }
    hints:
      - "ประจุทั้งหมดเป็นบวก A ผลัก C ไปทางขวา B ผลัก C ไปทางซ้าย"
      - "หาแรงจาก A (ระยะ $0.1\\ \\mathrm{m}$) และแรงจาก B (ระยะ $0.2\\ \\mathrm{m}$) แยกกัน"
      - "แรงทั้งสองสวนทางกัน ให้ลบกัน"
    misconceptions:
      - { match: 3.825, feedback: "ดูเหมือนบวกแรงทั้งสอง แต่ A ผลัก C ไปทางขวา ส่วน B ผลัก C ไปทางซ้าย ต้องลบกัน" }
      - { match: 3.6, feedback: "นั่นคือแรงจาก A อย่างเดียว ยังต้องหักแรงจาก B" }
    solution: "$F_A = \\dfrac{(9 \\times 10^9)(4 \\times 10^{-6})(1 \\times 10^{-6})}{0.1^2} = 3.6\\ \\mathrm{N}$ ไปทางขวา $F_B = \\dfrac{(9 \\times 10^9)(1 \\times 10^{-6})^2}{0.2^2} = 0.225\\ \\mathrm{N}$ ไปทางซ้าย แรงลัพธ์ $= 3.6 - 0.225 = 3.375\\ \\mathrm{N}$ ไปทางขวา"
