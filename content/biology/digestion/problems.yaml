problems:
  - id: biology.animals.digestion.p001
    topics: [biology.animals.digestion]
    difficulty: 1
    type: match
    stem: "จับคู่สัตว์กับลักษณะการย่อยอาหารหรือทางเดินอาหาร"
    pairs:
      - { left: "ฟองน้ำ", right: "ไม่มีทางเดินอาหาร ย่อยภายในเซลล์" }
      - { left: "ไฮดรา", right: "ช่องเปิดทางเดียว ใช้เทนทาเคิลที่มีเข็มพิษจับเหยื่อ" }
      - { left: "พลานาเรีย", right: "ช่องเปิดทางเดียว ยื่นคอหอยออกมาดูดอาหาร ทางเดินอาหารแตกแขนง" }
      - { left: "ไส้เดือนดิน", right: "มีปากและทวารหนัก มีกึ๋นบดอาหาร" }
    hints:
      - "สัตว์ที่ไม่มีทางเดินอาหารต้องย่อยอาหารที่ใด"
      - "สัตว์ที่ทางเดินอาหารสมบูรณ์มีช่องเปิดกี่ช่อง"
    solution: "ฟองน้ำย่อยภายในเซลล์ ไฮดราและพลานาเรียมีทางเดินอาหารไม่สมบูรณ์ (ไฮดราใช้เทนทาเคิล พลานาเรียใช้คอหอย) ไส้เดือนดินมีทางเดินอาหารสมบูรณ์และมีกึ๋น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.digestion.p002
    topics: [biology.animals.digestion]
    difficulty: 1
    type: mcq
    stem: "ในมนุษย์ การย่อยโปรตีนด้วยเอนไซม์เริ่มขึ้นที่อวัยวะใด"
    choices:
      - { id: a, text: "กระเพาะอาหาร", correct: true }
      - { id: b, text: "ปาก", feedback: "น้ำลายมีอะไมเลสที่ย่อยแป้ง ไม่มีเอนไซม์ย่อยโปรตีน" }
      - { id: c, text: "ลำไส้เล็ก", feedback: "ลำไส้เล็กย่อยโปรตีนต่อด้วยทริปซินและเอนไซม์อื่น แต่การย่อยเริ่มก่อนหน้านั้น" }
      - { id: d, text: "ลำไส้ใหญ่", feedback: "ลำไส้ใหญ่ดูดน้ำกลับ อาหารส่วนใหญ่ถูกย่อยและดูดซึมไปก่อนแล้ว" }
    hints:
      - "เพปซินเป็นเอนไซม์ย่อยโปรตีนที่ทำงานในสภาพเป็นกรด"
      - "อวัยวะใดหลั่งกรดไฮโดรคลอริก"
    solution: "กระเพาะอาหารหลั่งกรดไฮโดรคลอริกและเพปซิโนเจน ซึ่งกรดเปลี่ยนเป็นเพปซิน ย่อยโปรตีนเป็นเพปไทด์สายสั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.digestion.p003
    topics: [biology.animals.digestion]
    difficulty: 2
    type: text
    stem: "ไฮดราใช้โครงสร้างใดบนเทนทาเคิลยิงใส่เหยื่อให้เป็นอัมพาต"
    accepted: ["เข็มพิษ", "นีมาโทซิสต์", "nematocyst", "เซลล์เข็มพิษ", "cnidocyte", "ไนโดไซต์"]
    hints:
      - "เป็นโครงสร้างที่พบในสัตว์กลุ่มเดียวกับแมงกะพรุน"
      - "แมงกะพรุนก็ใช้โครงสร้างนี้ทำให้ผิวหนังคนแสบร้อน"
    misconceptions:
      - { match: "คอหอย", feedback: "คอหอยที่ยื่นออกมาจับอาหารเป็นของพลานาเรีย ไฮดราใช้เทนทาเคิลและเข็มพิษ" }
      - { match: "ฟัน", feedback: "ไฮดราไม่มีฟัน มันทำให้เหยื่อเป็นอัมพาตด้วยเข็มพิษบนเทนทาเคิล" }
    solution: "เข็มพิษ (นีมาโทซิสต์) อยู่ในเซลล์บนเทนทาเคิล ยิงเส้นใยที่มีพิษใส่เหยื่อ แล้วเทนทาเคิลม้วนส่งเหยื่อเข้าปาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.digestion.p004
    topics: [biology.animals.digestion]
    difficulty: 2
    type: order
    stem: "เรียงอวัยวะในทางเดินอาหารของไส้เดือนดิน จากปากถึงทวารหนัก"
    items:
      - "ปาก"
      - "คอหอย"
      - "หลอดอาหาร"
      - "กระเพาะพักอาหาร"
      - "กึ๋น"
      - "ลำไส้"
      - "ทวารหนัก"
    hints:
      - "อาหารต้องถูกเก็บพักไว้ก่อนถูกบด"
      - "ลำไส้เป็นส่วนที่ยาวที่สุด ก่อนถึงทวารหนัก"
    solution: "ปาก → คอหอย → หลอดอาหาร → กระเพาะพักอาหาร → กึ๋น → ลำไส้ → ทวารหนัก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.digestion.p005
    topics: [biology.animals.digestion]
    difficulty: 2
    type: match
    stem: "จับคู่เอนไซม์ในระบบย่อยอาหารของมนุษย์กับสิ่งที่มันย่อย"
    pairs:
      - { left: "อะไมเลส", right: "แป้ง → มอลโทส" }
      - { left: "เพปซิน", right: "โปรตีน → เพปไทด์สายสั้น (ในกระเพาะ)" }
      - { left: "ไลเพส", right: "ไขมัน → กรดไขมันและกลีเซอรอล" }
      - { left: "มอลเทส", right: "มอลโทส → กลูโคส" }
      - { left: "แลกเทส", right: "แลกโทส → กลูโคสและกาแลกโทส" }
    hints:
      - "ชื่อเอนไซม์หลายตัวมาจากชื่อสารตั้งต้นแล้วเติม -เอส"
      - "เพปซินทำงานในอวัยวะที่เป็นกรด"
    solution: "อะไมเลส → แป้ง, เพปซิน → โปรตีน, ไลเพส → ไขมัน, มอลเทส → มอลโทส, แลกเทส → แลกโทส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.digestion.p006
    topics: [biology.animals.digestion]
    difficulty: 2
    type: mcq
    stem: "น้ำดีช่วยในการย่อยไขมันอย่างไร"
    choices:
      - { id: a, text: "ทำให้ไขมันแตกเป็นหยดเล็ก เพิ่มพื้นที่ผิวให้ไลเพสย่อยได้เร็วขึ้น", correct: true }
      - { id: b, text: "มีเอนไซม์ไลเพสที่ย่อยไขมันเป็นกรดไขมัน", feedback: "น้ำดีไม่มีเอนไซม์ ไลเพสมาจากตับอ่อน" }
      - { id: c, text: "เปลี่ยนไขมันเป็นกลูโคส", feedback: "ไขมันถูกย่อยเป็นกรดไขมันและกลีเซอรอล ไม่ใช่กลูโคส และน้ำดีไม่ได้ย่อยเอง" }
      - { id: d, text: "ทำให้ลำไส้เล็กเป็นกรด", feedback: "สภาพในลำไส้เล็กเป็นเบสอ่อน ๆ จากโซเดียมไฮโดรเจนคาร์บอเนตของตับอ่อน" }
    hints:
      - "ไขมันไม่ละลายน้ำ จึงรวมเป็นก้อนใหญ่"
      - "เอนไซม์ย่อยได้เฉพาะที่ผิวของก้อนไขมัน"
    solution: "น้ำดีจากตับไม่มีเอนไซม์ แต่ทำให้ไขมันแตกเป็นหยดเล็ก (อิมัลชัน) พื้นที่ผิวมากขึ้น ไลเพสจากตับอ่อนจึงย่อยได้เร็ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.digestion.p007
    topics: [biology.animals.digestion]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ทางเดินอาหารแบบสมบูรณ์มีข้อดีกว่าแบบไม่สมบูรณ์อย่างไร (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "อาหารเคลื่อนทางเดียว ไม่ปนกับกาก", correct: true }
      - { id: b, text: "แต่ละส่วนของทางเดินอาหารทำหน้าที่เฉพาะได้ เช่น บด ย่อย ดูดซึม", correct: true }
      - { id: c, text: "กินอาหารมื้อใหม่ได้ขณะยังย่อยมื้อก่อนอยู่", correct: true }
      - { id: d, text: "ไม่ต้องใช้เอนไซม์ในการย่อย", feedback: "สัตว์ทุกชนิดต้องใช้เอนไซม์ย่อยอาหาร ไม่ว่าทางเดินอาหารเป็นแบบใด" }
      - { id: e, text: "ย่อยอาหารภายในเซลล์ได้ทั้งหมด", feedback: "ทางเดินอาหารแบบสมบูรณ์เน้นการย่อยภายนอกเซลล์ในท่อทางเดินอาหาร" }
    hints:
      - "คิดถึงสายพานในโรงงานที่ของเข้าทางหนึ่งออกอีกทางหนึ่ง"
      - "ไฮดราต้องขับกากออกก่อนจึงรับอาหารใหม่ได้สะดวก"
    solution: "ช่องเปิดสองทางทำให้อาหารเคลื่อนทางเดียว แต่ละส่วนพัฒนาหน้าที่เฉพาะ และกินต่อเนื่องได้ ทุกแบบยังใช้เอนไซม์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.digestion.p008
    topics: [biology.animals.digestion]
    difficulty: 3
    type: mcq
    stem: "นักเรียนวางตับไก่ชิ้นเล็กในจานที่มีพลานาเรีย ข้อใดบรรยายการกินอาหารของพลานาเรียได้ถูกต้อง"
    choices:
      - { id: a, text: "ยื่นคอหอยออกทางด้านล่างของลำตัวไปดูดอาหาร อาหารเข้าสู่ทางเดินอาหารที่แตกแขนง กากออกทางคอหอย", correct: true }
      - { id: b, text: "ใช้เทนทาเคิลที่มีเข็มพิษจับอาหารเข้าปากที่หัว", feedback: "เทนทาเคิลและเข็มพิษเป็นของไฮดรา พลานาเรียไม่มีเทนทาเคิล" }
      - { id: c, text: "กินอาหารทางปากที่หัว แล้วขับกากทางทวารหนักที่หาง", feedback: "พลานาเรียมีทางเดินอาหารไม่สมบูรณ์ ไม่มีทวารหนัก ปากอยู่ที่ปลายคอหอยด้านล่าง" }
      - { id: d, text: "ดูดซึมอาหารผ่านผิวหนังทั้งตัวโดยไม่ย่อย", feedback: "อาหารต้องถูกย่อยก่อน พลานาเรียย่อยในทางเดินอาหารทั้งภายนอกและภายในเซลล์" }
    hints:
      - "ปากของพลานาเรียไม่ได้อยู่ที่หัว"
      - "พลานาเรียมีทางเดินอาหารแบบที่มีช่องเปิดกี่ทาง"
    solution: "พลานาเรียยื่นคอหอยออกทางด้านล่างกลางลำตัว ดูดอาหารเข้าสู่ทางเดินอาหารที่แตกแขนงทั่วตัว ย่อยภายนอกและภายในเซลล์ แล้วขับกากออกทางเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.digestion.p009
    topics: [biology.animals.digestion]
    difficulty: 3
    type: match
    stem: "จับคู่สารที่ได้จากการย่อยกับทางที่ถูกดูดซึมจากวิลลัส"
    pairs:
      - { left: "กลูโคส", right: "หลอดเลือดฝอย แล้วไปที่ตับ" }
      - { left: "กรดอะมิโน", right: "หลอดเลือดฝอยเช่นกัน แล้วไปที่ตับ" }
      - { left: "กรดไขมันและกลีเซอรอล", right: "รวมเป็นไขมันในเซลล์บุผิว แล้วเข้าแลกทีล" }
    hints:
      - "สารที่ละลายน้ำได้ดีเข้าสู่เลือดโดยตรง"
      - "ดูภาพวิลลัส: แลกทีลคือหลอดน้ำเหลืองตรงกลาง"
    solution: "กลูโคสและกรดอะมิโนเข้าหลอดเลือดฝอยไปตับ ส่วนกรดไขมันและกลีเซอรอลรวมกลับเป็นไขมันแล้วเข้าแลกทีลสู่ระบบน้ำเหลือง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.digestion.p010
    topics: [biology.animals.digestion]
    difficulty: 3
    type: numeric
    stem: "จากตารางผลการทดลอง อัตราการย่อยแป้งของน้ำลายในหลอด ก (37 °C) เร็วกว่าหลอด ง (5 °C) กี่เท่า (อัตรา = 1 ÷ เวลาที่ใช้)"
    figure: { src: amylase-table.svg, alt: "ตารางผลการทดลอง ทุกหลอดมีแป้ง 5 mL หลอด ก น้ำลาย 1 mL ที่ 37 °C ใช้ 2 นาทีจนไอโอดีนไม่เป็นสีน้ำเงินดำ หลอด ข น้ำลายที่ต้มเดือดแล้วที่ 37 °C เกิน 20 นาที หลอด ค น้ำลายกับกรดไฮโดรคลอริกเจือจางที่ 37 °C เกิน 20 นาที หลอด ง น้ำลาย 1 mL ที่ 5 °C ใช้ 12 นาที หลอด จ น้ำกลั่น 1 mL ที่ 37 °C เกิน 20 นาที" }
    answer: { value: 6, unit: เท่า }
    hints:
      - "อัตราแปรผกผันกับเวลา ใช้เวลาน้อยแปลว่าเร็ว"
      - "อัตรา ก ÷ อัตรา ง = (1/2) ÷ (1/12)"
    misconceptions:
      - { match: 10, feedback: "นำเวลามาลบกัน (12 − 2) การเปรียบเทียบว่าเร็วกว่ากี่เท่าต้องหาร" }
      - { match: 0.17, feedback: "หารกลับด้าน ได้อัตราของหลอด ง เทียบกับหลอด ก" }
    solution: "อัตรา ก $= \\frac{1}{2}$ ต่อนาที อัตรา ง $= \\frac{1}{12}$ ต่อนาที ก เร็วกว่า $\\frac{1/2}{1/12} = \\frac{12}{2} = 6$ เท่า เพราะอะไมเลสทำงานได้ดีที่อุณหภูมิร่างกาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.digestion.p011
    topics: [biology.animals.digestion]
    difficulty: 3
    type: mcq
    stem: "จากตารางผลการทดลอง หลอด ข (น้ำลายต้มเดือด) และหลอด ค (น้ำลายกับกรด) ไม่ย่อยแป้ง ข้อสรุปใดถูกต้องที่สุด"
    figure: { src: amylase-table.svg, alt: "ตารางผลการทดลอง ทุกหลอดมีแป้ง 5 mL หลอด ก น้ำลาย 1 mL ที่ 37 °C ใช้ 2 นาทีจนไอโอดีนไม่เป็นสีน้ำเงินดำ หลอด ข น้ำลายที่ต้มเดือดแล้วที่ 37 °C เกิน 20 นาที หลอด ค น้ำลายกับกรดไฮโดรคลอริกเจือจางที่ 37 °C เกิน 20 นาที หลอด ง น้ำลาย 1 mL ที่ 5 °C ใช้ 12 นาที หลอด จ น้ำกลั่น 1 mL ที่ 37 °C เกิน 20 นาที" }
    choices:
      - { id: a, text: "อะไมเลสเสียสภาพเมื่อถูกความร้อนสูง และทำงานไม่ได้ในสภาพเป็นกรด อะไมเลสจากน้ำลายจึงหยุดทำงานเมื่อลงไปในกระเพาะ", correct: true }
      - { id: b, text: "น้ำลายไม่มีเอนไซม์ เพราะหลอด ข ไม่ย่อยแป้ง", feedback: "หลอด ก ที่ใช้น้ำลายปกติย่อยแป้งได้ใน 2 นาที แสดงว่าน้ำลายมีเอนไซม์" }
      - { id: c, text: "กรดช่วยให้อะไมเลสทำงานเร็วขึ้น", feedback: "หลอด ค ที่เติมกรดไม่ย่อยแป้งเลย กรดจึงยับยั้ง ไม่ได้ช่วย" }
      - { id: d, text: "แป้งย่อยตัวเองได้ที่ 37 °C", feedback: "หลอด จ ที่มีน้ำกลั่นแทนน้ำลายไม่ย่อยแป้ง แสดงว่าแป้งไม่ย่อยเอง" }
    hints:
      - "เทียบหลอด ข และ ค กับหลอด ก ซึ่งต่างกันเพียงปัจจัยเดียว"
      - "หลอด จ เป็นชุดควบคุมที่บอกอะไร"
    solution: "หลอด ก ย่อยได้ หลอด ข ต่างเฉพาะการต้ม แสดงว่าความร้อนทำให้อะไมเลสเสียสภาพ หลอด ค ต่างเฉพาะกรด แสดงว่าอะไมเลสทำงานไม่ได้ในกรด อะไมเลสจากน้ำลายจึงหยุดทำงานในกระเพาะ และการย่อยแป้งทำต่อในลำไส้เล็ก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.digestion.p012
    topics: [biology.animals.digestion]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนการกินและย่อยอาหารของไฮดรา"
    items:
      - "เข็มพิษบนเทนทาเคิลยิงใส่ไรน้ำจนเป็นอัมพาต"
      - "เทนทาเคิลม้วนส่งเหยื่อเข้าปาก"
      - "เซลล์ต่อมหลั่งเอนไซม์ย่อยเหยื่อในช่องว่างลำตัว"
      - "เซลล์ผนังช่องนำชิ้นอาหารเข้าไปย่อยต่อในฟูดแวคิวโอล"
      - "กากที่ย่อยไม่ได้ถูกขับออกทางปาก"
    hints:
      - "การย่อยภายนอกเซลล์เกิดก่อนการย่อยภายในเซลล์"
      - "ไฮดรามีช่องเปิดทางเดียว"
    solution: "จับเหยื่อด้วยเข็มพิษ → ส่งเข้าปาก → ย่อยภายนอกเซลล์ในช่องว่างลำตัว → ย่อยภายในเซลล์ในฟูดแวคิวโอล → ขับกากออกทางปาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.digestion.p013
    topics: [biology.animals.digestion]
    difficulty: 4
    type: mcq
    stem: "ป้าวัย 50 ปีดื่มนมสดแล้วท้องอืดและท้องเสียทุกครั้ง แต่กินโยเกิร์ตได้สบาย ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "ร่างกายสร้างแลกเทสได้น้อย แลกโทสที่ไม่ถูกย่อยลงไปถึงลำไส้ใหญ่แล้วแบคทีเรียหมักจนเกิดแก๊ส ส่วนโยเกิร์ตมีแลกโทสน้อยกว่าเพราะแบคทีเรียย่อยไปบางส่วนแล้ว", correct: true }
      - { id: b, text: "ป้าแพ้โปรตีนนมทุกชนิด", feedback: "โยเกิร์ตมีโปรตีนนมเหมือนนมสด ถ้าแพ้โปรตีนนมจะมีอาการกับโยเกิร์ตด้วย" }
      - { id: c, text: "กระเพาะอาหารของป้าไม่หลั่งเพปซิน", feedback: "เพปซินย่อยโปรตีน อาการนี้สัมพันธ์กับน้ำตาลแลกโทสที่ย่อยไม่ได้" }
      - { id: d, text: "นมสดมีเอนไซม์ที่ทำลายลำไส้", feedback: "นมไม่ได้ทำลายลำไส้ อาการเกิดจากแลกโทสที่ไม่ถูกย่อย" }
    hints:
      - "นมมีน้ำตาลชนิดใด และเอนไซม์ใดย่อยมัน"
      - "ระหว่างทำโยเกิร์ต แบคทีเรียใช้น้ำตาลชนิดเดียวกันนี้"
    solution: "ผู้ใหญ่จำนวนมากสร้างแลกเทสลดลง (แลกโทสอินทอเลอแรนซ์) แลกโทสที่ไม่ถูกย่อยดึงน้ำและถูกแบคทีเรียในลำไส้ใหญ่หมักจนเกิดแก๊ส โยเกิร์ตมีแลกโทสเหลือน้อยกว่าเพราะแบคทีเรียหมักไปแล้ว ถ้ามีอาการรุนแรงหรือเรื้อรังควรปรึกษาแพทย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.digestion.p014
    topics: [biology.animals.digestion]
    difficulty: 4
    type: mcq
    stem: "ทำไมเพปซินในกระเพาะอาหารจึงไม่ย่อยผนังกระเพาะของตัวเอง"
    choices:
      - { id: a, text: "เซลล์หลั่งเพปซินในรูปเพปซิโนเจนที่ยังไม่ทำงาน และผนังกระเพาะมีเมือกเคลือบป้องกัน", correct: true }
      - { id: b, text: "ผนังกระเพาะไม่มีโปรตีน", feedback: "ผนังกระเพาะเป็นเซลล์ที่มีโปรตีนมาก จึงต้องมีกลไกป้องกัน" }
      - { id: c, text: "เพปซินย่อยเฉพาะโปรตีนจากพืช", feedback: "เพปซินย่อยโปรตีนได้ทั่วไป ทั้งจากพืชและสัตว์" }
      - { id: d, text: "กรดในกระเพาะทำให้เพปซินหยุดทำงาน", feedback: "ตรงกันข้าม เพปซินทำงานได้ดีในสภาพกรด pH ราว 2" }
    hints:
      - "เอนไซม์บางชนิดถูกสร้างในรูปที่ยังไม่ทำงาน"
      - "อะไรเคลือบผิวด้านในของกระเพาะ"
    solution: "เซลล์หลั่งเพปซิโนเจนซึ่งยังไม่ทำงาน กรดในช่องกระเพาะจึงเปลี่ยนเป็นเพปซิน และเมือกเคลือบผนังกันกรดและเพปซิน ถ้าเมือกบกพร่อง เช่น จากยาแก้ปวดบางชนิดหรือเชื้อแบคทีเรีย อาจเกิดแผลในกระเพาะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.digestion.p015
    topics: [biology.animals.digestion]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "แบคทีเรียและจุลินทรีย์ในทางเดินอาหารมีความสำคัญอย่างไร (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "จุลินทรีย์ในรูเมนของวัวย่อยเซลลูโลสในหญ้าให้วัว", correct: true }
      - { id: b, text: "แบคทีเรียในลำไส้ใหญ่ของคนสร้างวิตามินเค", correct: true }
      - { id: c, text: "แบคทีเรียประจำถิ่นแย่งที่อยู่และอาหารกับเชื้อก่อโรค", correct: true }
      - { id: d, text: "แบคทีเรียในกระเพาะอาหารของคนสร้างเพปซิน", feedback: "เพปซินมาจากเซลล์ของผนังกระเพาะ ไม่ได้มาจากแบคทีเรีย" }
      - { id: e, text: "ยิ่งกินยาปฏิชีวนะบ่อยยิ่งช่วยให้แบคทีเรียที่มีประโยชน์เพิ่มขึ้น", feedback: "ยาปฏิชีวนะฆ่าแบคทีเรียที่มีประโยชน์ไปด้วย ควรใช้ตามที่แพทย์สั่งเท่านั้น" }
    hints:
      - "สัตว์สร้างเอนไซม์ย่อยเซลลูโลสเองได้หรือไม่"
      - "ยาปฏิชีวนะเลือกฆ่าเฉพาะเชื้อก่อโรคได้หรือไม่"
    solution: "จุลินทรีย์ช่วยย่อยเซลลูโลสในสัตว์กินพืช แบคทีเรียในลำไส้ใหญ่สร้างวิตามินเคและกันเชื้อก่อโรค ส่วนเพปซินสร้างจากเซลล์กระเพาะ และยาปฏิชีวนะลดแบคทีเรียที่มีประโยชน์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.digestion.p016
    topics: [biology.animals.digestion]
    difficulty: 5
    type: numeric
    stem: "ผนังลำไส้เล็กพื้นที่ 1 ตารางมิลลิเมตรมีวิลลัส 25 อัน ถ้าประมาณวิลลัสแต่ละอันเป็นทรงกระบอกสูง 0.8 mm รัศมี 0.05 mm และคิดพื้นที่ผิวข้าง ($2\\pi r h$) ของวิลลัสเพิ่มจากพื้นเรียบเดิม (ปลายวิลลัสถือว่าแทนพื้นที่ฐานที่ถูกบัง) พื้นที่ผิวรวมเป็นกี่เท่าของผนังเรียบ (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 7.28, tolerance: 0.07, unit: เท่า }
    hints:
      - "หาพื้นที่ผิวข้างของวิลลัส 1 อัน แล้วคูณ 25"
      - "พื้นที่รวม = พื้นเรียบ 1 mm² + พื้นที่ผิวข้างของวิลลัสทั้งหมด แล้วหารด้วย 1 mm²"
    misconceptions:
      - { match: 6.28, feedback: "ลืมรวมพื้นที่เรียบเดิม 1 ตารางมิลลิเมตร" }
      - { match: 13.57, feedback: "ใช้เส้นผ่านศูนย์กลาง 0.1 mm เป็นรัศมี รัศมีคือ 0.05 mm" }
    solution: "วิลลัส 1 อัน $= 2\\pi (0.05)(0.8) \\approx 0.251\\ \\mathrm{mm^2}$ 25 อัน $\\approx 6.28\\ \\mathrm{mm^2}$ พื้นที่รวม $\\approx 1 + 6.28 = 7.28\\ \\mathrm{mm^2}$ จึงเพิ่มเป็นราว 7.28 เท่า และไมโครวิลลัสยังเพิ่มพื้นที่อีกหลายสิบเท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.digestion.p017
    topics: [biology.animals.digestion]
    difficulty: 5
    type: mcq
    stem: "ผู้ป่วยรายหนึ่งท่อตับอ่อนอุดตัน น้ำย่อยจากตับอ่อนลงสู่ดูโอดีนัมไม่ได้ ผลใดน่าจะพบมากที่สุด"
    choices:
      - { id: a, text: "อุจจาระมีไขมันมาก เพราะไลเพสจากตับอ่อนไม่มี และอาหารที่เป็นกรดจากกระเพาะไม่ถูกสะเทิน", correct: true }
      - { id: b, text: "ย่อยแป้งไม่ได้เลยตั้งแต่ปาก", feedback: "อะไมเลสในน้ำลายยังทำงานได้ที่ปาก แม้การย่อยแป้งในลำไส้เล็กจะลดลง" }
      - { id: c, text: "ย่อยโปรตีนไม่ได้เลย", feedback: "เพปซินในกระเพาะและเอนไซม์ที่ผนังลำไส้เล็กยังย่อยโปรตีนได้บางส่วน" }
      - { id: d, text: "ไม่มีผล เพราะน้ำดียังย่อยไขมันได้", feedback: "น้ำดีไม่มีเอนไซม์ ทำให้ไขมันแตกเป็นหยดเล็กได้ แต่ต้องมีไลเพสจึงย่อยได้" }
    hints:
      - "ตับอ่อนส่งเอนไซม์อะไรบ้างและสารอะไรที่สะเทินกรด"
      - "ไขมันมีเอนไซม์ย่อยจากแหล่งอื่นที่สำคัญหรือไม่"
    solution: "ตับอ่อนส่งไลเพส ทริปซิน อะไมเลส และโซเดียมไฮโดรเจนคาร์บอเนต ไขมันพึ่งไลเพสจากตับอ่อนเป็นหลัก จึงถูกย่อยและดูดซึมน้อย อุจจาระมีไขมันมาก ส่วนแป้งและโปรตีนยังมีเอนไซม์จากแหล่งอื่นช่วยบางส่วน"
    license: CC-BY-SA-4.0
    ai_assisted: true
