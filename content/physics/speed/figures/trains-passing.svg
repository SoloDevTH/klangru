<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 170" width="580" height="170" font-family="sans-serif" font-size="16">
  <title>รถไฟสองขบวนวิ่งสวนกันบนรางคู่ขนาน</title>
  <rect x="60" y="42" width="240" height="36" fill="#cfe3f5" stroke="#15211e" stroke-width="2" rx="6"/>
  <text x="180" y="65" font-size="14" text-anchor="middle" font-weight="bold">ขบวน A ยาว 150 m</text>
  <line x1="310" y1="60" x2="362" y2="60" stroke="#15211e" stroke-width="2.4"/>
  <polygon points="370,60 360,64.5 360,55.5" fill="#15211e"/>
  <text x="340" y="50" font-size="13" text-anchor="middle">20 m/s</text>
  <rect x="330" y="112" width="160" height="36" fill="#fbe1cc" stroke="#15211e" stroke-width="2" rx="6"/>
  <text x="410" y="135" font-size="14" text-anchor="middle" font-weight="bold">ขบวน B ยาว 100 m</text>
  <line x1="320" y1="130" x2="268" y2="130" stroke="#15211e" stroke-width="2.4"/>
  <polygon points="260,130 270,125.5 270,134.5" fill="#15211e"/>
  <text x="290" y="120" font-size="13" text-anchor="middle">30 m/s</text>
  <line x1="20" y1="95" x2="560" y2="95" stroke="#6b7570" stroke-width="1.5" stroke-dasharray="8 6"/>
</svg>
