id: health.sexuality.gender-and-respect
subject: health
title: { th: เพศ ความหลากหลาย ค่านิยม และความเสมอภาคทางเพศ, en: "Sex, gender diversity, values and gender equality" }
summary: ความแตกต่างทางร่างกายระหว่างเพศ เพศกำเนิดและเพศสภาพ ความภาคภูมิใจในตนเอง พฤติกรรมที่ให้เกียรติตามวัฒนธรรมไทย ปัจจัยที่มีผลต่อค่านิยมเรื่องเพศ ภาพเหมารวม และความเสมอภาคทางเพศ
difficulty: 2.5
minutes: 30
prerequisites: [health.family.friendships-relationships]
encompasses:
  - { id: health.family.friendships-relationships, weight: 0.15 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: อะไรหล่อหลอมความคิดเรื่องเพศ
    src: influences.svg
    alt: "แผนภาพวงรีตรงกลางเขียนว่า เจตคติและค่านิยมเรื่องเพศของเรา มีลูกศรชี้เข้าหาจากห้ากล่องรอบ ๆ ได้แก่ ครอบครัว (ใครทำงานบ้าน คำสอน) เพื่อน (คำล้อ การยอมรับ) สื่อ (โฆษณา ละคร โซเชียล) ศาสนาและวัฒนธรรม (ประเพณี ความเชื่อ) และกฎหมาย (สิทธิและความคุ้มครอง)"
    caption: "ค่านิยมเรื่องเพศเรียนรู้มาจากคนและสิ่งรอบตัว จึงเปลี่ยนแปลงได้"
  - type: worked-example
    title: ภาพเหมารวมหรือข้อเท็จจริง
    problem: "ข้อความต่อไปนี้ ข้อใดเป็นข้อเท็จจริง ข้อใดเป็นภาพเหมารวม: (1) เพศหญิงมีมดลูกและรังไข่ (2) ผู้หญิงไม่เหมาะกับงานช่าง (3) ผู้ชายต้องไม่ร้องไห้"
    steps:
      - text: "ข้อ (1) เป็นเรื่องของร่างกายที่ตรวจสอบได้ จึงเป็นข้อเท็จจริง"
      - text: "ข้อ (2) ตัดสินว่าผู้หญิงทุกคนทำงานช่างไม่ได้ แต่ความสามารถมาจากการฝึกฝนและความสนใจ มีช่างและวิศวกรหญิงจำนวนมาก จึงเป็นภาพเหมารวม"
        why: "ภาพเหมารวมคือความเชื่อว่าคนทั้งเพศต้องเป็นแบบเดียวกัน"
      - text: "ข้อ (3) การร้องไห้เป็นอารมณ์ปกติของมนุษย์ทุกเพศ จึงเป็นภาพเหมารวม"
      - text: "ผลของภาพเหมารวม: ทำให้คนไม่กล้าแสดงความรู้สึกหรือไม่กล้าเลือกสิ่งที่ตนชอบ"
    answer: "(1) ข้อเท็จจริง (2) และ (3) เป็นภาพเหมารวม"
  - { type: check, problem: health.sexuality.gender-and-respect.p003, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: อ่านผลสำรวจเรื่องงานบ้าน
    problem: "จากผลสำรวจ นักเรียนที่ตอบว่าแม่ทำงานบ้านเป็นส่วนใหญ่คิดเป็นร้อยละเท่าไร และผลนี้บอกอะไรเกี่ยวกับค่านิยมเรื่องเพศ"
    figure:
      src: chores-survey.svg
      alt: "แผนภูมิแท่งแนวนอน ใครทำงานบ้านเป็นส่วนใหญ่ในบ้านของเรา สำรวจนักเรียน ป.5 ห้องหนึ่ง คนละ 1 คำตอบ ข้อมูลสมมติ แม่ 18 คน ทุกคนช่วยกัน 12 คน พ่อ 5 คน ยายหรือย่า 4 คน ตัวนักเรียนเอง 1 คน"
    steps:
      - text: "จำนวนนักเรียนทั้งหมด: 18 + 12 + 5 + 4 + 1 = 40 คน"
      - text: "ร้อยละที่ตอบว่าแม่: 18 ÷ 40 × 100 = 45"
      - text: "เทียบกับพ่อ: 5 คน น้อยกว่าแม่ 13 คน และมีนักเรียนเพียง 1 คนที่ตอบว่าตนเองทำงานบ้านเป็นส่วนใหญ่"
      - text: "แปลผล: ในห้องนี้งานบ้านตกอยู่กับผู้หญิงมากกว่า ซึ่งสะท้อนค่านิยมเดิมว่างานบ้านเป็นงานผู้หญิง แต่มี 12 บ้านที่ทุกคนช่วยกัน แสดงว่าเปลี่ยนได้"
        why: "ข้อมูลมาจากห้องเดียว จึงสรุปได้เฉพาะห้องนี้ ไม่ใช่ทุกบ้านในประเทศ"
    answer: "ร้อยละ 45 ห้องนี้ผู้หญิงรับงานบ้านมากกว่า สะท้อนค่านิยมเดิมที่เปลี่ยนได้ถ้าทุกคนช่วยกัน"
  - { type: check, problem: health.sexuality.gender-and-respect.p006 }
glossary:
  - { term: เพศกำเนิด, definition: "เพศที่ระบุตามลักษณะร่างกายตอนแรกเกิด" }
  - { term: เพศสภาพ, definition: "ความรู้สึกของคนคนหนึ่งว่าตนเป็นเพศใด และการแสดงออก เช่น การแต่งกาย ท่าทาง" }
  - { term: ความหลากหลายทางเพศ, definition: "การที่คนมีเพศกำเนิด เพศสภาพ และความรักความชอบต่อผู้อื่นแตกต่างกันหลายแบบ" }
  - { term: ภาพเหมารวม, definition: "ความเชื่อว่าคนกลุ่มหนึ่ง เช่น คนเพศหนึ่ง ต้องมีนิสัยหรือความสามารถเหมือนกันหมด" }
  - { term: ความเสมอภาคทางเพศ, definition: "การที่ทุกเพศมีสิทธิ โอกาส และได้รับการปฏิบัติอย่างเป็นธรรมเท่ากัน" }
  - { term: เจตคติ, definition: "ความคิดความรู้สึกที่มีต่อเรื่องใดเรื่องหนึ่ง ซึ่งส่งผลต่อการกระทำ" }
flashcards:
  - { front: "ร่างกายเพศหญิงและเพศชายต่างกันที่ใด", back: "อวัยวะเพศและอวัยวะสืบพันธุ์ ความสามารถและสติปัญญาไม่ได้ขึ้นกับเพศ" }
  - { front: "เพศกำเนิดต่างจากเพศสภาพอย่างไร", back: "เพศกำเนิดดูจากร่างกายตอนเกิด เพศสภาพคือเพศที่คนนั้นรู้สึกและแสดงออก" }
  - { front: "ปัจจัยที่มีผลต่อค่านิยมเรื่องเพศ", back: "ครอบครัว เพื่อน สื่อ ศาสนาและวัฒนธรรม กฎหมาย" }
  - { front: "กฎหมายไทยที่ห้ามเลือกปฏิบัติโดยไม่เป็นธรรมระหว่างเพศ", back: "พระราชบัญญัติความเท่าเทียมระหว่างเพศ พ.ศ. 2558" }
