    type: mcq
    stem: "ทำไมการทดลองการงอกจึงใช้ชุดละ 50 เมล็ด แทนที่จะใช้ชุดละ 1 เมล็ด"
    choices:
      - { id: a, text: "เพื่อลดผลของความบังเอิญ เช่น เมล็ดบางเมล็ดเสียตั้งแต่แรก ทำให้ผลเชื่อถือได้มากขึ้น", correct: true }
      - { id: b, text: "เพื่อให้กราฟสูงขึ้นและอ่านง่าย", feedback: "จำนวนเมล็ดไม่ได้ใช้เพื่อความสวยงามของกราฟ แต่เพื่อลดความคลาดเคลื่อนจากเมล็ดแต่ละเมล็ด" }
      - { id: c, text: "เพราะเมล็ดเดียวงอกไม่ได้", feedback: "เมล็ดเดียวก็งอกได้ แต่ถ้าเมล็ดนั้นเสียมาก่อน ผลของทั้งชุดจะผิดไปหมด" }
      - { id: d, text: "เพื่อให้มีตัวแปรต้นมากขึ้น", feedback: "จำนวนเมล็ดเท่ากันทุกชุด จึงเป็นตัวแปรควบคุม ไม่ได้เพิ่มตัวแปรต้น" }
    hints:
      - "ถ้าใช้เมล็ดเดียวแล้วเมล็ดนั้นเสียอยู่แล้ว จะเกิดอะไรขึ้นกับข้อสรุป"
      - "การใช้ตัวอย่างมากหรือทำซ้ำหลายครั้งช่วยเรื่องอะไร"
    solution: "เมล็ดแต่ละเมล็ดต่างกันเล็กน้อย บางเมล็ดอาจเสียตั้งแต่แรก การใช้ตัวอย่างจำนวนมากหรือทำซ้ำช่วยเฉลี่ยความแตกต่างเหล่านี้ ทำให้ผลสะท้อนผลของเกลือจริง ๆ"
