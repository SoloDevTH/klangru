    choices:
      - { id: a, text: "ทิศตะวันตก", correct: true }
      - { id: b, text: "ทิศตะวันออก", feedback: "การเลี้ยวและการหมุนทุกครั้งเปลี่ยนทิศที่หันหน้า ต้องติดตามทีละคำสั่ง" }
      - { id: c, text: "ทิศเหนือ", feedback: "หลังเลี้ยวซ้ายหุ่นยนต์หันไปทิศเหนือจริง แต่ยังหมุนครึ่งรอบและเลี้ยวขวาอีก" }
      - { id: d, text: "ทิศใต้", feedback: "หลังหมุนครึ่งรอบหุ่นยนต์หันไปทิศใต้ แต่ยังมีคำสั่งเลี้ยวขวาอีกหนึ่งคำสั่ง" }
    hints:
      - "การเดินไม่เปลี่ยนทิศที่หันหน้า ดูเฉพาะคำสั่งเลี้ยวและหมุน"
      - "ไล่ทีละขั้น: ตะวันออก → เลี้ยวซ้าย → หมุนครึ่งรอบ → เลี้ยวขวา"
    solution: "เริ่มหันทิศตะวันออก เลี้ยวซ้าย (หมุนทวนเข็มหนึ่งในสี่รอบ) หันทิศเหนือ หมุนครึ่งรอบหันทิศใต้ เลี้ยวขวา (หมุนตามเข็มหนึ่งในสี่รอบ) จากทิศใต้หันไปทิศตะวันตก"
