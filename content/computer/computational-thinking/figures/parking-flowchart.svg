  <text x="20.0" y="545.0" font-size="12" text-anchor="start" fill="#6b7280">ปัดเศษขึ้น เช่น 121 นาที ÷ 60 = 2.02 ปัดขึ้นเป็น 3 ชั่วโมง</text>
