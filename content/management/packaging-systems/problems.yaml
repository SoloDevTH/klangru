  - id: management.operations.packaging-systems.p015
    topics: [management.operations.packaging-systems]
    difficulty: 3
    type: expression
    stem: "ต้นทุนรวมต่อชิ้นที่ส่งถึงลูกค้า $K$ เท่ากับค่าบรรจุต่อชิ้น $p$ บวกกับมูลค่าสินค้า $v$ คูณอัตราการเสียหาย $r$ จงจัดรูปสมการให้ $r$ อยู่ข้างเดียว"
    prefix: "r ="
    answer: { latex: "\\frac{K-p}{v}", variables: [K, p, v] }
    misconceptions:
      - { match: "\\frac{K-v}{p}", feedback: "สลับตัวแปร ต้องลบค่าบรรจุ $p$ ออกจาก $K$ ก่อน แล้วจึงหารด้วยมูลค่า $v$" }
      - { match: "K-p\\cdot v", feedback: "ลืมหารด้วย $v$ เมื่อย้ายตัวคูณของ $r$ ไปอีกข้าง" }
    hints:
      - "แยกพจน์ที่มี $r$ ไว้ข้างเดียวของสมการ"
      - "ย้าย $p$ ไปอีกข้าง แล้วหารทั้งสองข้างด้วย $v$"
    solution: "$K = p + rv \\Rightarrow rv = K - p \\Rightarrow r = \\dfrac{K-p}{v}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.packaging-systems.p016
    topics: [management.operations.packaging-systems]
    difficulty: 4
    type: numeric
    figure:
      src: p016-pallet-dims.svg
      alt: "ภาพเปรียบเทียบพาเลทสี่เหลี่ยมผืนผ้ากว้าง 1,200 มม. ยาว 1,000 มม. กับกรอบกล่องสี่เหลี่ยมผืนผ้าขนาด 350 × 250 มม. ซึ่งวาดแยกกันเป็นกรอบเปล่า ไม่มีการเรียงกล่องบนพาเลท"
      caption: "ขนาดพาเลทและกล่องตามสัดส่วนจริง"
    stem: "จากภาพ วางกล่องทุกกล่องในทิศทางเดียวกันบนพาเลท โดยเลือกทิศทางที่ได้จำนวนมากที่สุด วางได้กี่กล่องต่อชั้น (ตอบเป็นจำนวนกล่อง)"
    answer: { value: 12, tolerance: 0, unit: "กล่อง" }
    hints:
      - "ลองนับว่าด้านกว้าง 1,200 มม. ใส่กล่องด้านกว้าง 350 มม. ได้กี่กล่องเต็ม และด้านยาว 1,000 มม. ใส่ด้านยาว 250 มม. ได้กี่กล่องเต็ม"
      - "ทำทั้งสองทิศแล้วเปรียบเทียบ อย่าคิดแค่จากพื้นที่รวม เพราะกล่องต้องเรียงเป็นแถวเต็ม"
    misconceptions:
      - { match: 13, feedback: "หารพื้นที่พาเลทด้วยพื้นที่กล่องได้ 13.7 แล้วปัดลง แต่ไม่ได้คำนึงว่ากล่องต้องเรียงเป็นแถวเต็มในแต่ละด้าน" }
      - { match: 8, feedback: "นั่นคือจำนวนเมื่อหมุนกล่องเป็น 250 × 350 ซึ่งได้น้อยกว่าทิศที่ไม่หมุน" }
    solution: "ทิศที่ไม่หมุน $\\lfloor 1200/350 \\rfloor \\times \\lfloor 1000/250 \\rfloor = 3 \\times 4 = 12$ กล่อง ทิศที่หมุน $\\lfloor 1200/250 \\rfloor \\times \\lfloor 1000/350 \\rfloor = 4 \\times 2 = 8$ กล่อง จึงเลือกได้ 12 กล่อง คลุมพื้นที่ $87.5\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.packaging-systems.p017
