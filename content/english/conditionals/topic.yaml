id: english.grammar.conditionals
subject: english
title: { th: "If-clauses และ so...that / such...that", en: "Conditionals and so...that / such...that" }
summary: zero, first และ second conditional, unless และ If I were you ใช้ so...that กับ such...that บอกเหตุและผล และอ่านหาเงื่อนไขกับผลในบทความ
difficulty: 5
minutes: 45
prerequisites: [english.grammar.future-forms, english.grammar.sentence-types]
encompasses:
  - { id: english.grammar.future-forms, weight: 0.3 }
  - { id: english.grammar.sentence-types, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: conditional-types.svg
    alt: "แผนภาพสามแถว มีลูกศรด้านซ้ายจาก จริง ลงไป สมมุติ เขียนว่า ความเป็นจริงลดลง แถว ZERO สีเขียว: ข้อเท็จจริง เกิดทุกครั้ง · If + present, present · If you heat ice, it melts. แถว FIRST สีส้ม: เป็นไปได้จริงในอนาคต · If + present, will + V1 · If it rains, we will stay at home. แถว SECOND สีม่วง: สมมุติ ไม่จริงตอนนี้ · If + past, would + V1 · If I had wings, I would fly."
    caption: "conditional สามแบบ เรียงจากจริงที่สุดไปสมมุติที่สุด"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.grammar.conditionals.p003, prompt: "present + present บอกอะไร" }
  - type: figure
    src: so-such.svg
    alt: "แผนภาพสองประโยค ประโยคแรก The soup was | so | spicy | that | I couldn't finish it. ใต้ภาพเขียนว่า so + คุณศัพท์ (ไม่มีคำนามตาม) ประโยคที่สอง It was | such | a | spicy | soup | that | I couldn't finish it. ใต้ภาพเขียนว่า such + (a/an) + คุณศัพท์ + คำนาม"
    caption: "so ... that กับ such ... that"
  - type: worked-example
    title: ให้คำแนะนำและบอกผลที่ตามมา
    problem: "เพื่อนพูดว่า *I always play games until 2 a.m., and I'm so tired at school.* เขียนคำแนะนำหนึ่งประโยคด้วย If I were you และบอกผลดีด้วย first conditional อีกหนึ่งประโยค"
    steps:
      - text: "คำแนะนำเป็นเรื่องสมมุติ (เราไม่ใช่เพื่อน) → second conditional: *If I were you, I would go to bed before 11 p.m.*"
        why: "ภาษาเขียนนิยม If I were you ภาษาพูดใช้ If I was you ได้"
      - text: "ผลที่เป็นไปได้จริงถ้าเพื่อนทำตาม → first conditional: if + present simple"
      - text: "*If you sleep earlier, you will feel more awake in class.*"
        why: "ไม่ใช้ will ใน if-clause"
    answer: "*If I were you, I would go to bed before 11 p.m. If you sleep earlier, you will feel more awake in class.*"
  - { type: check, problem: english.grammar.conditionals.p007, prompt: "หลังช่องว่างมีคำนาม ใช้ so หรือ such" }
glossary:
  - { term: conditional, definition: "ประโยคเงื่อนไข มี if-clause (เงื่อนไข) และ main clause (ผล)" }
  - { term: zero conditional, definition: "If + present, present ข้อเท็จจริงที่เกิดทุกครั้ง" }
  - { term: first conditional, definition: "If + present, will + V1 สิ่งที่เป็นไปได้จริงในอนาคต" }
  - { term: second conditional, definition: "If + past, would + V1 เรื่องสมมุติที่ไม่จริงตอนนี้" }
  - { term: unless, definition: "ถ้า ... ไม่ (= if ... not)" }
  - { term: so ... that / such ... that, definition: "มากจนกระทั่ง so + คุณศัพท์ · such + (a/an) + คุณศัพท์ + คำนาม" }
flashcards:
  - { front: "zero / first / second conditional", back: "If + present, present · If + present, will · If + past, would" }
  - { front: "If it will rain, ... ผิดตรงไหน", back: "ห้ามใช้ will ใน if-clause: If it rains, ..." }
  - { front: "ถ้าฉันเป็นเธอ ฉันจะ ...", back: "If I were you, I would ..." }
  - { front: "unless you hurry =", back: "if you don't hurry" }
  - { front: "so หรือ such: ___ a hot day / ___ hot", back: "such a hot day · so hot" }
