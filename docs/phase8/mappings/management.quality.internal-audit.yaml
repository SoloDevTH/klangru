  - { framework: iso-9001-2015, indicators: ["9.2"], coverage: full, note: "สรุปข้อกำหนดด้วยคำของคลังรู้ (ไม่ยกข้อความมาตรฐาน) โปรแกรมการตรวจตามความสำคัญ ความเสี่ยง การเปลี่ยนแปลง และผลครั้งก่อน เกณฑ์และขอบเขต ผู้ตรวจที่เป็นกลาง การรายงาน การแก้ไขโดยไม่ล่าช้า และบันทึก (บทเรียน ตัวอย่างแสดงวิธีทำ 1, p003 p006 p007 p013 p016) ผู้ประสานงานควรลดแถวเดิมของ management.quality.iso-management-systems เป็น partial" }
