  - { framework: university-foundations, indicators: ["CHEM 18.2"], coverage: full, note: "สอนแหล่งที่พบและการผลิตโลหะแอลคาไล แอลคาไลน์เอิร์ท อะลูมิเนียม ดีบุก และตะกั่ว ด้วยอิเล็กโทรไลซิสหรือการรีดิวซ์" }
  - { framework: university-foundations, indicators: ["CHEM 18.3"], coverage: full, note: "สอนโครงสร้างและสมบัติทั่วไปของกึ่งโลหะโบรอน ซิลิคอน และเจอร์เมเนียม รวมถึงซิลิคอนกับสารกึ่งตัวนำและซิลิเกต" }
  - { framework: university-foundations, indicators: ["CHEM 19.1"], coverage: partial, note: "สอนแร่และการถลุงเหล็ก การทำทองแดงให้บริสุทธิ์ การรีดิวซ์ ZnO และสมบัติทั่วไปของโลหะแทรนซิชัน (เลขออกซิเดชันหลายค่า สารประกอบมีสี ตัวเร่ง) ยังไม่สอนโลหะแทรนซิชันอื่น เช่น Ti, Cr, Mn, Ni และสารประกอบ (เฮไลด์ ออกไซด์ ไฮดรอกไซด์) อย่างเป็นระบบ" }
