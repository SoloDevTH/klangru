problems:
- id: health.consumer.consumer-rights.p001
  topics:
  - health.consumer.consumer-rights
  difficulty: 1
  type: mcq
  stem: ร้านขายอาหารเสริมบอกว่า "ถ้าไม่ซื้อคอร์สนี้ จะไม่ให้ออกจากร้าน" เป็นการละเมิดสิทธิผู้บริโภคข้อใดชัดเจนที่สุด
  choices:
  - id: a
    text: สิทธิที่จะมีอิสระในการเลือก
    correct: true
  - id: b
    text: สิทธิที่จะได้รับความปลอดภัย
    feedback: สินค้ายังไม่ได้ทำให้เกิดอันตราย ปัญหาหลักคือการบังคับให้ซื้อ
  - id: c
    text: สิทธิในการทำสัญญาที่เป็นธรรม
    feedback: ยังไม่มีการทำสัญญา ปัญหาหลักคือการกดดันไม่ให้เลือกเอง
  hints:
  - ผู้บริโภคควรได้ตัดสินใจด้วยความสมัครใจ
  - การบังคับให้ซื้อขัดกับสิทธิข้อใด
  solution: การบังคับหรือกดดันให้ซื้อละเมิดสิทธิที่จะมีอิสระในการเลือกหาสินค้าและบริการ ผู้บริโภคปฏิเสธได้และร้องเรียน สคบ. 1166
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.consumer-rights.p002
  topics:
  - health.consumer.consumer-rights
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นตัวอย่างของสิทธิที่จะได้รับความปลอดภัยจากการใช้สินค้า
  choices:
  - id: a
    text: เครื่องสำอางต้องไม่ผสมสารอันตรายที่ทำให้แพ้หรือเป็นพิษ
    correct: true
  - id: b
    text: ได้รับส่วนลดเมื่อซื้อจำนวนมาก
    feedback: ส่วนลดเป็นโปรโมชัน ไม่ใช่สิทธิพื้นฐาน
  - id: c
    text: ได้เลือกสีของสินค้าตามชอบ
    feedback: เกี่ยวกับความชอบ ไม่ใช่ความปลอดภัย
  hints:
  - สิทธินี้เกี่ยวกับอันตรายต่อร่างกาย
  - สินค้าต้องปลอดภัยเมื่อใช้ตามปกติ
  solution: สิทธิที่จะได้รับความปลอดภัยหมายถึงสินค้าและบริการต้องไม่เป็นอันตรายต่อชีวิตและสุขภาพเมื่อใช้ตามปกติ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.consumer-rights.p003
  topics:
  - health.consumer.consumer-rights
  difficulty: 2
  type: match
  stem: จับคู่ปัญหากับหน่วยงานที่ควรติดต่อ
  pairs:
  - left: ซื้อลิปสติกที่ไม่มีฉลากภาษาไทยแล้วปากบวม
    right: อย. 1556
  - left: ฟิตเนสไม่ยอมยกเลิกสัญญาทั้งที่ปิดสาขา
    right: สคบ. 1166
  - left: โรงพยาบาลตามสิทธิบัตรทองเรียกเก็บเงินโดยไม่แจ้งเหตุผล
    right: สปสช. 1330
  - left: ร้านออนไลน์รับเงินแล้วปิดเพจหนี
    right: บก.ปคบ. 1135
  hints:
  - เครื่องสำอางเป็นผลิตภัณฑ์สุขภาพที่ อย. ดูแล
  - การหลอกให้โอนเงินเป็นความผิดอาญา
  solution: เครื่องสำอางไม่ปลอดภัย → อย. 1556 สัญญาบริการไม่เป็นธรรม → สคบ. 1166 ปัญหาสิทธิบัตรทอง → สปสช. 1330 หลอกโอนเงิน → บก.ปคบ. 1135
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.consumer-rights.p004
  topics:
  - health.consumer.consumer-rights
  difficulty: 2
  type: text
  stem: สายด่วนของสำนักงานคณะกรรมการคุ้มครองผู้บริโภค (สคบ.) คือหมายเลขใด (ตอบเป็นตัวเลข 4 หลัก)
  accepted:
  - '1166'
  misconceptions:
  - match: '1556'
    feedback: 1556 คือสายด่วน อย.
  - match: '1330'
    feedback: 1330 คือสายด่วน สปสช.
  hints:
  - ขึ้นต้นด้วย 11
  - ลงท้ายด้วยเลขซ้ำกันสองตัว
  solution: สายด่วน สคบ. คือ 1166 หรือร้องเรียนผ่านแอป OCPB Connect เว็บไซต์ ocpb.go.th และศูนย์ดำรงธรรมทุกจังหวัด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.consumer-rights.p005
  topics:
  - health.consumer.consumer-rights
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนเมื่อใช้ครีมที่ซื้อมาแล้วผิวหน้าแพ้
  items:
  - หยุดใช้และไปพบแพทย์ถ้าอาการไม่ดีขึ้นหรือรุนแรง
  - เก็บหลักฐาน เช่น ใบเสร็จ ฉลาก ภาพถ่าย และแชต
  - ติดต่อผู้ขายเพื่อแจ้งปัญหาและสิ่งที่ต้องการ
  - ร้องเรียนหน่วยงานถ้าตกลงไม่ได้หรือสินค้าผิดกฎหมาย
  hints:
  - สุขภาพมาก่อนเสมอ
  - ต้องมีหลักฐานก่อนจึงร้องเรียนได้ผล
  solution: หยุดใช้และดูแลสุขภาพ → เก็บหลักฐาน → ติดต่อผู้ขาย → ร้องเรียนหน่วยงาน เช่น อย. 1556
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.consumer-rights.p006
  topics:
  - health.consumer.consumer-rights
  difficulty: 2
  type: mcq
  stem: มิ้นท์ซื้อนมกล่องที่ร้านสะดวกซื้อหน้าโรงเรียน กลับมาพบว่าเลยวันหมดอายุไปแล้ว 5 วัน ข้อใดเหมาะสมที่สุด
  choices:
  - id: a
    text: ไม่ดื่ม เก็บกล่องและใบเสร็จ นำไปแจ้งร้านเพื่อขอเปลี่ยนหรือคืนเงิน และบอกร้านให้ตรวจสินค้าบนชั้น
    correct: true
  - id: b
    text: ดื่มไปเพราะเลยมาแค่ 5 วัน
    feedback: อาหารที่เลยวันหมดอายุอาจไม่ปลอดภัย ไม่ควรเสี่ยง
  - id: c
    text: ทิ้งไปโดยไม่บอกใคร
    feedback: การแจ้งร้านเป็นการใช้สิทธิ และช่วยไม่ให้คนอื่นซื้อสินค้าหมดอายุ
  hints:
  - ใช้สิทธิความปลอดภัยและสิทธิได้รับการชดเชย
  - หลักฐานอะไรบ้างที่ควรเก็บไว้
  solution: ไม่บริโภคสินค้าหมดอายุ เก็บหลักฐาน แจ้งผู้ขายเพื่อเปลี่ยนหรือคืนเงิน ถ้าร้านไม่แก้ไขหรือพบว่าวางขายสินค้าหมดอายุเป็นประจำ ร้องเรียนหน่วยงานได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.consumer-rights.p007
  topics:
  - health.consumer.consumer-rights
  difficulty: 3
  type: mcq
  stem: นนท์อายุ 14 ปี ต้องผ่าตัดเล็กที่นัดไว้ล่วงหน้า ซึ่งไม่ใช่กรณีฉุกเฉิน ใครเป็นผู้ใช้สิทธิลงนามยินยอมแทนนนท์ได้ตามคำประกาศสิทธิของผู้ป่วย
  choices:
  - id: a
    text: บิดา มารดา หรือผู้แทนโดยชอบธรรม
    correct: true
  - id: b
    text: ครูประจำชั้น
    feedback: ครูไม่ใช่ผู้แทนโดยชอบธรรมตามกฎหมาย
  - id: c
    text: เพื่อนสนิทของนนท์
    feedback: เพื่อนไม่มีสิทธิใช้สิทธิแทนผู้ป่วย
  hints:
  - ผู้ป่วยอายุไม่เกิน 18 ปีบริบูรณ์
  - ใครเป็นผู้ดูแลตามกฎหมาย
  solution: คำประกาศสิทธิผู้ป่วย พ.ศ. 2558 ระบุว่าบิดา มารดา หรือผู้แทนโดยชอบธรรม ใช้สิทธิแทนผู้ป่วยที่อายุไม่เกิน 18 ปีบริบูรณ์ได้ แต่นนท์ก็ยังควรได้รับคำอธิบายที่เข้าใจง่ายเกี่ยวกับการรักษาของตน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.consumer-rights.p008
  topics:
  - health.consumer.consumer-rights
  difficulty: 3
  type: numeric
  stem: ครีมกันแดดยี่ห้อเดียวกัน ขวด 50 มิลลิลิตรราคา 199 บาท ขวด 120 มิลลิลิตรราคา 399 บาท ขวดที่คุ้มกว่าราคามิลลิลิตรละกี่บาท (ตอบเป็นบาท ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 3.33
    tolerance: 0.01
    unit: บาท
  misconceptions:
  - match: 3.98
    feedback: 3.98 คือราคาต่อมิลลิลิตรของขวดเล็ก ซึ่งแพงกว่า
  - match: 0.3
    feedback: หารกลับด้าน ต้องเอาราคาหารด้วยปริมาณ
  hints:
  - ราคาต่อหน่วย = ราคา ÷ ปริมาณ
  - เทียบ 199 ÷ 50 กับ 399 ÷ 120
  solution: ขวดเล็ก $199 \div 50 = 3.98$ บาท/มล. ขวดใหญ่ $399 \div 120 \approx 3.33$ บาท/มล. ขวดใหญ่คุ้มกว่า แต่ควรเลือกขนาดที่ใช้หมดก่อนหมดอายุ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.consumer-rights.p009
  topics:
  - health.consumer.consumer-rights
  difficulty: 3
  type: numeric
  stem: คลินิกแห่งหนึ่งโฆษณาแพ็กเกจตรวจสุขภาพ 1,500 บาท แต่ตอนจ่ายเงินเรียกเก็บ 1,850 บาท โดยบอกว่ามี "ค่าธรรมเนียม" ที่ไม่ได้แจ้งไว้ก่อน ถูกเรียกเก็บเกินจากที่โฆษณากี่บาท (ตอบเป็นบาท)
  answer:
    value: 350
    unit: บาท
  misconceptions:
  - match: 1850
    feedback: 1,850 คือยอดที่ถูกเรียกเก็บทั้งหมด ต้องลบราคาที่โฆษณา
  - match: 3350
    feedback: บวกกันแทนการลบ
  hints:
  - ส่วนที่เกิน = ยอดที่ถูกเรียกเก็บ − ราคาที่โฆษณา
  - 1,850 − 1,500
  solution: $1{,}850 - 1{,}500 = 350$ บาท การซ่อนค่าใช้จ่ายขัดกับสิทธิที่จะได้รับข่าวสารที่ถูกต้องและเพียงพอ ควรขอใบเสร็จแจกแจงรายการ และร้องเรียน สคบ. 1166 ถ้าไม่ได้รับการแก้ไข
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.consumer-rights.p010
  topics:
  - health.consumer.consumer-rights
  difficulty: 3
  type: mcq
  stem: ร้านออนไลน์โฆษณาเครื่องวัดความดันว่า "แม่นยำระดับโรงพยาบาล" แต่สินค้าที่ได้รับเป็นรุ่นอื่นที่ไม่มีคู่มือภาษาไทยและวัดค่าผิดเพี้ยน สิทธิข้อใดถูกละเมิด (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: สิทธิที่จะได้รับข่าวสารที่ถูกต้องและเพียงพอ
    correct: true
    feedback: ถูก โฆษณาไม่ตรงกับสินค้าและไม่มีคู่มือ
  - id: b
    text: สิทธิที่จะได้รับความปลอดภัย
    correct: true
    feedback: ถูก เครื่องที่วัดผิดอาจทำให้ตัดสินใจเรื่องสุขภาพผิด
  - id: c
    text: สิทธิที่จะได้รับการพิจารณาและชดเชยความเสียหาย
    correct: true
    feedback: ถูก ผู้ซื้อมีสิทธิร้องเรียนและเรียกร้องการเยียวยา
  - id: d
    text: ไม่มีสิทธิใดถูกละเมิดเพราะซื้อออนไลน์
    feedback: ผู้ซื้อออนไลน์ก็เป็นผู้บริโภคที่ได้รับความคุ้มครอง
  hints:
  - เทียบสิ่งที่โฆษณากับสิ่งที่ได้รับ
  - อุปกรณ์การแพทย์ที่วัดผิดมีผลต่อสุขภาพอย่างไร
  solution: โฆษณาไม่ตรงความจริงละเมิดสิทธิได้รับข่าวสาร เครื่องที่วัดผิดกระทบความปลอดภัย และผู้ซื้อมีสิทธิได้รับการพิจารณาชดเชย ร้องเรียนได้ทั้ง อย. 1556 (เครื่องมือแพทย์) และ สคบ. 1166
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.consumer-rights.p011
  topics:
  - health.consumer.consumer-rights
  difficulty: 3
  type: mcq
  stem: ก่อนผ่าตัด แพทย์อธิบายวิธีรักษา ผลดี และความเสี่ยงให้ยายของเก่งฟัง แต่ยายยังไม่เข้าใจบางคำ ข้อใดเป็นการใช้สิทธิและข้อพึงปฏิบัติของผู้ป่วยที่เหมาะสมที่สุด
  choices:
  - id: a
    text: ถามแพทย์ให้อธิบายด้วยคำที่เข้าใจง่ายจนเข้าใจ ก่อนตัดสินใจลงนามยินยอมหรือไม่ยินยอม
    correct: true
  - id: b
    text: ลงนามไปก่อนเพราะเกรงใจแพทย์
    feedback: ผู้ป่วยมีสิทธิได้รับข้อมูลด้วยภาษาที่เข้าใจ และควรถามก่อนลงนาม
  - id: c
    text: ไม่บอกโรคประจำตัวกับแพทย์เพราะกลัวไม่ได้ผ่าตัด
    feedback: ข้อพึงปฏิบัติคือให้ข้อมูลสุขภาพตามความจริง การปกปิดอาจเป็นอันตราย
  hints:
  - สิทธิได้รับข้อมูลเพื่อตัดสินใจยินยอม
  - ข้อพึงปฏิบัติข้อแรกคือสอบถามก่อนลงนาม
  solution: ผู้ป่วยมีสิทธิได้รับข้อมูลที่จริงและเพียงพอด้วยภาษาที่เข้าใจได้ และมีข้อพึงปฏิบัติคือสอบถามให้เข้าใจก่อนลงนาม รวมทั้งให้ข้อมูลสุขภาพตามความจริง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.consumer-rights.p012
  topics:
  - health.consumer.consumer-rights
  difficulty: 4
  type: mcq
  stem: แม่ของฝ้ายแพ้อาหารเสริมที่ซื้อจากไลฟ์สด ข้อใดเป็นหลักฐานที่ควรเก็บไว้ก่อนร้องเรียน (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: ภาพหน้าจอไลฟ์และข้อความโฆษณา
    correct: true
    feedback: ถูก แสดงสิ่งที่ผู้ขายอ้าง
  - id: b
    text: หลักฐานการโอนเงินและแชตสั่งซื้อ
    correct: true
    feedback: ถูก แสดงว่าซื้อจากใคร เมื่อไร ราคาเท่าไร
  - id: c
    text: กล่อง ฉลาก และสินค้าที่เหลือ
    correct: true
    feedback: ถูก ใช้ตรวจเลข อย. และส่งตรวจได้
  - id: d
    text: ใบรับรองแพทย์หรือบันทึกการรักษาอาการแพ้
    correct: true
    feedback: ถูก แสดงความเสียหายต่อสุขภาพ
  - id: e
    text: คอมเมนต์ด่าร้านจากคนที่ไม่รู้จัก
