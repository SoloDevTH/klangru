    standards:
      - id: "HASS56-K-EB"
        text: "Knowledge and understanding: Economics and business"
        indicators:
          - { id: "AC9HS5K08", level: "5", text: "types of resources, including natural, human and capital, and how they satisfy needs and wants" }
          - { id: "AC9HS6K08", level: "6", text: "influences on consumer choices and strategies that can be used to help make informed personal consumer and financial choices" }
  - id: "EB-K"
    title: "Knowledge and understanding"
    standards:
      - id: "EB-K"
        text: "Knowledge and understanding"
        indicators:
          - { id: "AC9HE7K01", level: "7", text: "why opportunity cost exists as decisions are made to allocate limited resources to meet unlimited needs and wants" }
          - { id: "AC9HE7K02", level: "7", text: "the reasons businesses exist and how different types of businesses provide goods and services" }
          - { id: "AC9HE7K03", level: "7", text: "characteristics of entrepreneurs and how these influence the success of a business" }
          - { id: "AC9HE7K04", level: "7", text: "the reasons individuals work, the types of work they are involved in, and how they may derive an income" }
          - { id: "AC9HE7K05", level: "7", text: "the rights and responsibilities of individuals and businesses in relation to consumer and financial products and services" }
          - { id: "AC9HE8K01", level: "8", text: "how markets influence decisions about the allocation of resources to the production of goods and services, and the effect of prices on these decisions" }
          - { id: "AC9HE8K02", level: "8", text: "different ways that businesses adapt to opportunities in the market and respond to the changing nature of work" }
          - { id: "AC9HE8K03", level: "8", text: "how First Nations Australian businesses and entrepreneurs develop opportunities in the market", note: "เอกสาร scope and sequence พิมพ์ว่า \"how businesses operated by First Nations Australians develop opportunities in the market\"" }
          - { id: "AC9HE8K04", level: "8", text: "the importance of Australia’s system of taxation and how this system affects decision-making by individuals and businesses" }
          - { id: "AC9HE8K05", level: "8", text: "processes that individuals and/or businesses use to plan and budget to achieve short-term and long-term financial objectives", note: "ข้อความตามเว็บไซต์ ACARA เอกสาร curriculum content (Word) พิมพ์ว่า \"processes that individuals and/or businesses use to plan and budget to achieve short- and long-term financial objectives\" · เอกสาร scope and sequence พิมพ์ว่า \"processes individuals and/or businesses use to plan and budget to achieve short-term and long-term financial objectives\"" }
          - { id: "AC9HE9K01", level: "9", text: "the role of Australia’s financial sector and its effect on economic decision-making by individuals, businesses and global markets" }
          - { id: "AC9HE9K02", level: "9", text: "how economic decision-making involves the interdependence of consumers, businesses, the financial sector and government" }
          - { id: "AC9HE9K03", level: "9", text: "the reasons Australia trades with other nations, and the patterns of trade between Australia and Asia" }
          - { id: "AC9HE9K04", level: "9", text: "processes that businesses use to create and maintain competitive advantage, including the role of entrepreneurs" }
          - { id: "AC9HE9K05", level: "9", text: "how individuals and businesses manage consumer and financial risks and rewards" }
          - { id: "AC9HE10K01", level: "10", text: "how and why the economic indicators influence economic decision-making" }
          - { id: "AC9HE10K02", level: "10", text: "the ways that government intervenes in the economy to improve economic performance and living standards within Australian society" }
          - { id: "AC9HE10K03", level: "10", text: "factors that influence major consumer and financial decisions, and the short- and long-term consequences of these decisions", note: "เอกสาร scope and sequence พิมพ์ว่า \"factors that influence major consumer and financial decisions and the short- and long-term consequences of these decisions\"" }
          - { id: "AC9HE10K04", level: "10", text: "the importance of Australia’s superannuation system and how this system affects consumer and financial decision-making" }
          - { id: "AC9HE10K05", level: "10", text: "processes that businesses use to manage the workforce and improve productivity, including the role of entrepreneurs" }
