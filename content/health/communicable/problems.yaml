problems:
  - id: health.disease.communicable.p001
    topics: [health.disease.communicable]
    difficulty: 1
    type: mcq
    stem: "โรคใดเป็นโรคติดต่อ"
    choices:
      - { id: a, text: "ไข้หวัด", correct: true }
      - { id: b, text: "เบาหวาน", feedback: "เบาหวานเป็นโรคไม่ติดต่อ ไม่ได้เกิดจากเชื้อโรค" }
      - { id: c, text: "สายตาสั้น", feedback: "สายตาสั้นไม่ได้เกิดจากเชื้อโรค จึงไม่ติดต่อกัน" }
    hints:
      - "โรคติดต่อเกิดจากเชื้อโรค"
      - "โรคใดที่เพื่อนแพร่ให้เราได้ทางการไอจาม"
    solution: "ไข้หวัดเกิดจากไวรัส ติดต่อทางละอองฝอยจากการไอจาม จึงเป็นโรคติดต่อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.communicable.p002
    topics: [health.disease.communicable]
    difficulty: 1
    type: mcq
    stem: "เวลาจามในห้องเรียน ควรทำอย่างไร"
    choices:
      - { id: a, text: "ใช้กระดาษทิชชูหรือข้อพับแขนปิดปากและจมูก", correct: true }
      - { id: b, text: "ใช้ฝ่ามือปิด แล้วจับของต่อได้เลย", feedback: "เชื้อโรคติดที่ฝ่ามือแล้วไปติดของที่จับ ถ้าใช้มือต้องล้างมือทันที" }
      - { id: c, text: "จามใส่อากาศโดยไม่ปิด", feedback: "ละอองฝอยจากการจามพาเชื้อโรคไปถึงคนรอบข้าง" }
    hints:
      - "ละอองฝอยจากการจามมีเชื้อโรค"
      - "เลือกวิธีที่เชื้อไม่ติดมือ"
    solution: "ปิดปากและจมูกด้วยทิชชูแล้วทิ้งลงถัง หรือใช้ข้อพับแขน เพื่อไม่ให้ละอองฝอยและมือพาเชื้อไปถึงคนอื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.communicable.p003
    topics: [health.disease.communicable]
    difficulty: 2
    type: match
    stem: "จับคู่โรคกับทางติดต่อหลักของโรค"
    pairs:
      - { left: "ไข้หวัดใหญ่", right: "ละอองฝอยจากการไอจาม" }
      - { left: "ไข้เลือดออก", right: "ยุงลายกัด" }
      - { left: "โรคอุจจาระร่วง", right: "อาหารและน้ำที่ปนเปื้อน" }
      - { left: "โรคมือ เท้า ปาก", right: "การสัมผัสมือและของใช้ร่วมกัน" }
    hints:
      - "ไข้เลือดออกมีแมลงเป็นพาหะ"
      - "โรคที่ทำให้ท้องเสียมักมาทางปาก"
    solution: "ไข้หวัดใหญ่-ละอองฝอย, ไข้เลือดออก-ยุงลาย, อุจจาระร่วง-อาหารและน้ำ, มือเท้าปาก-การสัมผัส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.communicable.p004
    topics: [health.disease.communicable]
    difficulty: 2
    type: numeric
    stem: "เวลาล้างมือด้วยน้ำและสบู่ ควรถูมือให้ทั่วอย่างน้อยกี่วินาที (ตอบเป็นวินาที)"
    answer: { value: 20, unit: วินาที }
    misconceptions:
      - { match: 5, feedback: "5 วินาทีสั้นเกินไป สบู่ยังไม่ทันชะล้างเชื้อโรคออก" }
    hints:
      - "นานประมาณร้องเพลงแฮปปีเบิร์ทเดย์สองรอบ"
      - "เป็นตัวเลขสองหลัก"
    solution: "ถูมือด้วยสบู่อย่างน้อย 20 วินาที แล้วล้างน้ำและเช็ดให้แห้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.communicable.p005
    topics: [health.disease.communicable]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการล้างมือให้สะอาด"
    items:
      - "ทำมือให้เปียกด้วยน้ำสะอาด"
      - "ฟอกสบู่"
      - "ถูให้ทั่วทั้งฝ่ามือ หลังมือ ซอกนิ้ว และเล็บ อย่างน้อย 20 วินาที"
      - "ล้างสบู่ออกด้วยน้ำสะอาด"
      - "เช็ดมือให้แห้งด้วยผ้าสะอาดหรือกระดาษ"
    hints:
      - "สบู่ต้องมีน้ำจึงจะเกิดฟอง"
      - "ขั้นสุดท้ายคือทำให้มือแห้ง"
    solution: "ทำมือให้เปียก → ฟอกสบู่ → ถูให้ทั่ว 20 วินาที → ล้างออก → เช็ดให้แห้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.communicable.p006
    topics: [health.disease.communicable]
    difficulty: 2
    type: text
    stem: "มาตรการ \"3 เก็บ ป้องกัน 3 โรค\" ของกรมควบคุมโรค ได้แก่ เก็บบ้าน เก็บขยะ และเก็บอะไร"
    accepted: ["เก็บน้ำ", "น้ำ"]
    misconceptions:
      - { match: "เก็บยา", feedback: "มาตรการนี้ใช้กำจัดแหล่งเพาะพันธุ์ยุงลาย ซึ่งวางไข่ในน้ำขัง" }
    hints:
      - "ยุงลายวางไข่ที่ใด"
      - "ปิดฝาภาชนะและเปลี่ยนน้ำในแจกันทุกสัปดาห์"
    solution: "เก็บน้ำ คือปิดฝาภาชนะใส่น้ำ และเปลี่ยนน้ำในแจกันทุกสัปดาห์พร้อมขัดขอบ เพื่อไม่ให้ยุงลายวางไข่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.communicable.p007
    topics: [health.disease.communicable]
    difficulty: 3
    type: numeric
    stem: "จากแบบจำลองในภาพ ผู้ป่วย 1 คนแพร่เชื้อให้คนใหม่ 2 คนในแต่ละรอบ ในรอบที่ 3 มีผู้ป่วยใหม่กี่คน (ตอบเป็นคน)"
    figure:
      src: spread-model.svg
      alt: "แผนภาพต้นไม้ แบบจำลองอย่างง่าย ผู้ป่วย 1 คนแพร่เชื้อให้คนใหม่ 2 คนในแต่ละรอบ รอบที่ 0 มีวงกลม 1 วง แต่ละวงแตกออกเป็น 2 วงในรอบถัดไป รอบที่ 1 2 และ 3 มีวงกลมเพิ่มตามนั้น"
    answer: { value: 8, unit: คน }
    misconceptions:
      - { match: 6, feedback: "จำนวนไม่ได้เพิ่มทีละ 2 แต่ละคนแพร่ต่อให้ 2 คน จำนวนจึงเพิ่มเป็นสองเท่าทุกรอบ" }
      - { match: 15, feedback: "15 คือผู้ป่วยรวมทุกรอบตั้งแต่รอบที่ 0 โจทย์ถามเฉพาะผู้ป่วยใหม่ในรอบที่ 3" }
    hints:
      - "รอบที่ 0 มี 1 คน รอบที่ 1 มี 2 คน"
      - "แต่ละรอบเป็นสองเท่าของรอบก่อน"
    solution: "1 → 2 → 4 → 8 รอบที่ 3 มีผู้ป่วยใหม่ 8 คน (2 × 2 × 2)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.communicable.p008
    topics: [health.disease.communicable]
    difficulty: 3
    type: numeric
    stem: "จากแผนภูมิของกรมควบคุมโรค ผู้ป่วยโรคมือ เท้า ปาก รายใหม่อายุ 0–4 ปี คิดเป็นร้อยละเท่าไรของผู้ป่วยรายใหม่ทั้งหมด 695 ราย (ตอบเป็นร้อยละ ทศนิยม 1 ตำแหน่ง)"
    figure:
      src: hfmd-ages.svg
      alt: "แผนภูมิแท่งแนวนอน ผู้ป่วยโรคมือ เท้า ปาก รายใหม่ 23 ถึง 29 มีนาคม 2568 แยกตามกลุ่มอายุ ข้อมูลกรมควบคุมโรค รวมทุกอายุ 695 ราย อายุ 0 ถึง 4 ปี 513 ราย อายุ 5 ถึง 9 ปี 152 ราย อายุ 10 ถึง 14 ปี 21 ราย อายุอื่น 9 ราย"
    answer: { value: 73.8, tolerance: 0.1, unit: "%" }
    misconceptions:
      - { match: 513, feedback: "513 คือจำนวนราย ต้องหารด้วย 695 แล้วคูณ 100" }
      - { match: 26.2, feedback: "26.2 คือร้อยละของผู้ป่วยกลุ่มอื่นที่ไม่ใช่อายุ 0–4 ปี" }
    hints:
      - "ร้อยละ = ส่วน ÷ ทั้งหมด × 100"
      - "513 ÷ 695 × 100 แล้วปัดเป็นทศนิยม 1 ตำแหน่ง"
    solution: "513 ÷ 695 × 100 ≈ 73.8 แสดงว่าผู้ป่วยส่วนใหญ่เป็นเด็กเล็ก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.communicable.p009
    topics: [health.disease.communicable]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดช่วยป้องกันโรคไข้เลือดออก (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ปิดฝาโอ่งและภาชนะใส่น้ำให้มิดชิด", correct: true }
      - { id: b, text: "เปลี่ยนน้ำในแจกันทุกสัปดาห์และขัดขอบแจกัน", correct: true }
      - { id: c, text: "นอนในมุ้งหรือทายากันยุง", correct: true }
      - { id: d, text: "ปิดปากเวลาไอจาม", feedback: "ช่วยป้องกันโรคที่ติดต่อทางละอองฝอย แต่ไข้เลือดออกติดต่อทางยุงลายกัด" }
      - { id: e, text: "ใช้ช้อนกลาง", feedback: "ช่วยป้องกันโรคที่ติดต่อทางน้ำลาย ไม่เกี่ยวกับยุงลาย" }
    hints:
      - "ไข้เลือดออกมียุงลายเป็นพาหะ"
      - "ข้อที่ถูกมีสามข้อ ทั้งกำจัดแหล่งเพาะพันธุ์และป้องกันยุงกัด"
    solution: "ปิดฝาภาชนะ เปลี่ยนน้ำแจกัน กำจัดแหล่งเพาะพันธุ์ยุงลาย และนอนในมุ้งหรือทายากันยุงเพื่อป้องกันยุงกัด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.communicable.p010
    topics: [health.disease.communicable]
    difficulty: 3
    type: mcq
    stem: "นักเรียนบางคนรู้ว่าเพื่อนร่วมห้องคนหนึ่งมีเชื้อเอชไอวี จึงไม่ยอมนั่งกินข้าวด้วย ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "เอชไอวีไม่ติดต่อจากการกินข้าวด้วยกัน กอด หรือเล่นด้วยกัน จึงทำกิจกรรมร่วมกันได้ตามปกติ", correct: true }
      - { id: b, text: "ควรแยกเพื่อนไปนั่งคนเดียวเพื่อป้องกันโรค", feedback: "การแยกเพื่อนไม่ได้ป้องกันโรค เพราะเอชไอวีไม่ติดต่อจากการใช้ชีวิตร่วมกัน และทำให้เพื่อนเสียใจ" }
      - { id: c, text: "ไม่ควรใช้ห้องน้ำร่วมกับเพื่อน", feedback: "องค์การอนามัยโลกยืนยันว่าเอชไอวีไม่ติดต่อจากการใช้ชีวิตประจำวันร่วมกัน" }
    hints:
      - "เอชไอวีติดต่อทางเลือดและสารคัดหลั่งบางชนิด ไม่ใช่ทางละอองฝอยหรือการสัมผัสทั่วไป"
      - "การรังเกียจผู้ป่วยไม่ช่วยป้องกันโรค"
    solution: "องค์การอนามัยโลกระบุว่าเอชไอวีไม่ติดต่อจากการกอด จับมือ หรือกินอาหารและน้ำร่วมกัน เพื่อนจึงใช้ชีวิตร่วมกันได้ตามปกติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.communicable.p011
    topics: [health.disease.communicable]
    difficulty: 3
    type: mcq
    stem: "น้องชายของต้นกล้าเรียนชั้นอนุบาล มีไข้ เจ็บปาก และมีตุ่มที่ฝ่ามือและฝ่าเท้า แพทย์บอกว่าเป็นโรคมือ เท้า ปาก ครอบครัวควรทำอย่างไรตามคำแนะนำของกรมควบคุมโรค"
    choices:
      - { id: a, text: "ให้น้องหยุดเรียนราว 1 สัปดาห์ แยกของใช้ ล้างมือบ่อย และแจ้งครู", correct: true }
      - { id: b, text: "ส่งน้องไปโรงเรียนตามปกติเพราะไข้ไม่สูง", feedback: "ช่วง 7 วันแรกหลังเริ่มมีอาการแพร่เชื้อได้มาก จะทำให้เพื่อนในห้องติดโรค" }
      - { id: c, text: "ให้น้องเล่นของเล่นร่วมกับพี่เพื่อไม่ให้เหงา", feedback: "โรคนี้ติดต่อทางการสัมผัสและของใช้ร่วมกัน ควรแยกของเล่นและของใช้" }
    hints:
      - "โรคนี้แพร่เชื้อได้มากในช่วงสัปดาห์แรก"
      - "ติดต่อทางการสัมผัส น้ำลาย และของใช้ร่วมกัน"
    solution: "กรมควบคุมโรคแนะนำให้เด็กป่วยหยุดเรียน 1 สัปดาห์หรือจนพ้นระยะแพร่เชื้อ แยกจากเด็กอื่น ไม่ใช้ของใช้ร่วมกัน และล้างมือบ่อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.communicable.p012
    topics: [health.disease.communicable]
    difficulty: 4
    type: numeric
    stem: "ระหว่างวันที่ 23–29 มีนาคม 2568 (7 วัน) ประเทศไทยพบผู้ป่วยโรคมือ เท้า ปาก รายใหม่ 695 ราย เฉลี่ยวันละกี่ราย (ตอบเป็นราย ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 99.3, tolerance: 0.1, unit: ราย }
    misconceptions:
      - { match: 4865, feedback: "ต้องหารด้วยจำนวนวัน ไม่ใช่คูณ" }
      - { match: 115.8, feedback: "ช่วง 23 ถึง 29 มีนาคมมี 7 วัน (นับวันแรกและวันสุดท้ายด้วย) ไม่ใช่ 6 วัน" }
    hints:
      - "นับจำนวนวันตั้งแต่ 23 ถึง 29 มีนาคม รวมวันแรกและวันสุดท้าย"
      - "ค่าเฉลี่ยต่อวัน = จำนวนผู้ป่วย ÷ จำนวนวัน"
    solution: "695 ÷ 7 ≈ 99.3 ราย หรือราว 100 รายต่อวัน ตรงกับที่กรมควบคุมโรครายงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.disease.communicable.p013
    topics: [health.disease.communicable]
    difficulty: 4
    type: numeric
    stem: "ใช้แบบจำลองที่ผู้ป่วย 1 คนแพร่ให้คนใหม่ 2 คนในแต่ละรอบ เริ่มจากผู้ป่วย 1 คนในรอบที่ 0 เมื่อจบรอบที่ 4 มีผู้ป่วยรวมทั้งหมดกี่คน (นับรอบที่ 0 ถึงรอบที่ 4) (ตอบเป็นคน)"
    figure:
      src: spread-model.svg
      alt: "แผนภาพต้นไม้ แบบจำลองอย่างง่าย ผู้ป่วย 1 คนแพร่เชื้อให้คนใหม่ 2 คนในแต่ละรอบ รอบที่ 0 มีวงกลม 1 วง รอบที่ 1 มี 2 วง รอบที่ 2 มี 4 วง รอบที่ 3 มี 8 วง"
    answer: { value: 31, unit: คน }
    misconceptions:
      - { match: 16, feedback: "16 คือผู้ป่วยใหม่เฉพาะรอบที่ 4 ต้องรวมทุกรอบ" }
      - { match: 15, feedback: "15 คือผลรวมถึงรอบที่ 3 ยังขาดรอบที่ 4" }
    hints:
      - "หาผู้ป่วยใหม่ของแต่ละรอบ: 1, 2, 4, 8, ..."
      - "รอบที่ 4 มีผู้ป่วยใหม่ 2 × 8 คน แล้วบวกทุกรอบ"
    solution: "1 + 2 + 4 + 8 + 16 = 31 คน แสดงว่าการระบาดโตเร็วมาก ถ้าไม่ตัดเส้นทางของเชื้อตั้งแต่ต้น"
