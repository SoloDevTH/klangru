# 国际中文教育中文水平等级标准 (GF 0025—2021) หรือที่นิยมเรียกว่า "HSK 3.0"
# Chinese Proficiency Grading Standards for International Chinese Language Education
# ประกาศโดยกระทรวงศึกษาธิการและคณะกรรมการภาษาและอักษรแห่งชาติจีน 24 มี.ค. 2021 มีผล 1 ก.ค. 2021 (หน้าปกของมาตรฐาน)
#
# ลิขสิทธิ์ (ตรวจเมื่อ 2026-10-24)
# - ไฟล์ PDF ทางการที่ jsj.moe.gov.cn ประทับลายน้ำ "仅供查阅" (ใช้เพื่ออ่านอ้างอิงเท่านั้น) และไม่มีข้อความอนุญาตให้ทำซ้ำ
# - กฎหมายลิขสิทธิ์จีนมาตรา 5 ยกเว้นกฎหมาย ระเบียบ และเอกสารเชิงนิติบัญญัติ บริหาร หรือตุลาการของรัฐ แต่ไม่ชัดว่ามาตรฐานภาษา
#   ประเภท GF เข้าข่ายหรือไม่ จึงถือว่ายังไม่ได้รับอนุญาตให้คัดข้อความเต็ม
# - ไฟล์นี้เก็บเฉพาะตัวเลขเชิงปริมาณ (ข้อเท็จจริง) และสรุปความสามารถเป็นภาษาไทยด้วยคำของเราเอง ไม่ได้คัดข้อความภาษาจีน
#
# ที่มาของข้อมูล
# - ตัวเลขทุกตัวอ่านจากตาราง "语言量化指标总表" (หน้า 1–2 ของมาตรฐาน) และหัวข้อ 3 等级描述 (หน้า 2–8)
#   ไฟล์ PDF เป็นภาพเวกเตอร์ที่ดึงข้อความไม่ได้ จึงเรนเดอร์หน้าแล้วอ่านด้วยตา และเทียบยอดรวมกับข้อความในหน้า 3.1/3.2/3.3
#   และกับบทสัมภาษณ์ของศูนย์ความร่วมมือและการแลกเปลี่ยนภาษาจีนกับต่างประเทศ (语合中心/CLEC) บนเว็บ moe.gov.cn
#   (音节 1110 汉字 3000 词汇 11092 语法 572) ตรงกันทุกตัว
# - รูปแบบตัวเลข "เพิ่ม/สะสม" ตามหมายเหตุใต้ตาราง (前面=本级新增 后面=截至本级累积) ระดับ 7–9 ไม่แบ่งตัวเลขรายระดับ
# - จำนวนอักษรที่ต้องเขียนด้วยมือ (手写汉字) ยึดตามหัวข้อ 写 ของแต่ละระดับ: ระดับต้น 100/200/300 ตัวจาก "初等手写汉字表",
#   ระดับกลาง 100/250/400 ตัวจาก "中等手写汉字表" (รวมระดับต้นและกลาง 700 ตัว) ระดับสูงรวม 1200 ตัว
#
# สถานะการเปลี่ยนจาก HSK 2.0 (6 ระดับ) เป็น HSK 3.0 (ตรวจเมื่อ 2026-10-24)
# - 2021-04-02 語合中心ระบุว่า HSK จะปรับตามมาตรฐานนี้ โดยคงความต่อเนื่องของ 6 ระดับเดิมแล้วแบ่งละเอียดเป็น 三等九级
#   (http://www.moe.gov.cn/jyb_xwfb/s271/202104/t20210402_524194.html)
# - ปฏิทินสอบปี 2026 ของ chinesetest.cn (ประกาศ 2025-12-24) ยังจัดสอบ HSK ระดับ 1–6 เดือนละครั้ง และ HSK ระดับ 7–9
#   แบบ iBT วันที่ 9 พ.ค. และ 22 พ.ย. 2026 (https://www.chinesetest.cn/news/50278989)
# - IT之家 (2025-12-19 อ้างข่าว CCTV และ CLEC): HSK3.0 ประกาศรูปแบบเมื่อ พ.ย. 2025 เปิดสอบทดลองระดับ 1–6 ในบางศูนย์สอบ
#   ตั้งแต่ 31 ม.ค. 2026 (https://www.ithome.com/0/906/161.htm)
# - ประกาศ chinesetest.cn (2026-09-08): "HSK 3.0 will be officially launched worldwide on December 13, 2026!"
#   (https://www.chinesetest.cn/news/51336883) ประกาศนี้ไม่ได้บอกว่าจะเลิกสอบ HSK 2.0 เมื่อใด
# - สรุป ณ วันที่ตรวจ: การสอบปกติระดับ 1–6 ยังเป็นรูปแบบเดิม (2.0) จนกว่าจะเปิดสอบ 3.0 อย่างเป็นทางการ 13 ธ.ค. 2026
#   ส่วนระดับ 7–9 ใช้มาตรฐานนี้อยู่แล้ว มาตรฐาน GF 0025—2021 ในไฟล์นี้เป็นฐานของทั้งสองรูปแบบ
#   (ยังไม่ได้เปิดอ่าน "新版HSK考试大纲" บน chinesetest.cn ซึ่งอาจมีรายละเอียดการสอบแต่ละระดับ)
