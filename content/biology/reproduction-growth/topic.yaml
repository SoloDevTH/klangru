id: biology.plants.reproduction-growth
subject: biology
title: { th: การสืบพันธุ์และการเจริญเติบโตของพืชดอก, en: "Reproduction and growth of flowering plants" }
summary: วัฏจักรชีวิตแบบสลับ การสร้างละอองเรณูและถุงเอ็มบริโอ การปฏิสนธิซ้อนและจำนวนโครโมโซม การเกิดเมล็ดและผล ชนิดของผล การใช้ประโยชน์ การงอกของเมล็ด และสภาพพักตัว
difficulty: 5.5
minutes: 50
prerequisites: [biology.plants.plant-structure, biology.cells.cell-division, biology.plants.reproduction-propagation]
encompasses:
  - { id: biology.plants.reproduction-propagation, weight: 0.3 }
  - { id: biology.cells.cell-division, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: วัฏจักรชีวิตแบบสลับของพืชดอก
    src: alternation.svg
    alt: "แผนภาพวงกลมแบ่งครึ่ง ครึ่งบนสีเขียวอ่อนคือรุ่นสปอโรไฟต์ (2n) ครึ่งล่างสีม่วงอ่อนคือรุ่นแกมีโทไฟต์ (n) มีกล่อง 6 กล่องเรียงตามเข็มนาฬิกา ต้นพืชดอก (สปอโรไฟต์) 2n → เซลล์แม่ของสปอร์ 2n → (ไมโอซิส) → สปอร์ n → (ไมโทซิส) → แกมีโทไฟต์ n → (ไมโทซิส) → เซลล์สืบพันธุ์ n → (การปฏิสนธิ) → ไซโกต → เอ็มบริโอในเมล็ด 2n → (ไมโทซิส เจริญเติบโต) → กลับไปที่ต้นพืชดอก"
    caption: "ในพืชดอก แกมีโทไฟต์คือละอองเรณูและถุงเอ็มบริโอ ซึ่งอาศัยอยู่ในดอกของสปอโรไฟต์ (วาดโดยทีมคลังรู้)"
  - type: figure
    title: การสร้างเซลล์สืบพันธุ์เพศผู้และเพศเมีย
    src: gametophytes.svg
    alt: "ภาพ 2 แถว แถวบน เพศผู้ (ในอับเรณู) เซลล์แม่ไมโครสปอร์ 2n → ไมโอซิส → ไมโครสปอร์ 4 เซลล์ (n) → ไมโทซิส → ละอองเรณู (n) มีเซลล์ทิวบ์และเจเนอเรทีฟเซลล์ → ไมโทซิส → ละอองเรณูงอกหลอดที่มีสเปิร์ม 2 เซลล์ ข้อความ 1 เซลล์แม่ → ละอองเรณู 4 เม็ด 1 ละอองเรณู → สเปิร์ม 2 เซลล์ แถวล่าง เพศเมีย (ในออวุล) เซลล์แม่เมกะสปอร์ 2n → ไมโอซิส → 4 เซลล์เรียงกัน เหลือ 1 ใน 4 (n) อีก 3 สลายไป → ไมโทซิส 3 ครั้ง → ถุงเอ็มบริโอรูปไข่ มีแอนติโพดัล 3 เซลล์ที่ปลายด้านหนึ่ง โพลาร์นิวคลีไอ 2 นิวเคลียสตรงกลาง เซลล์ไข่ 1 เซลล์และซินเนอร์จิด 2 เซลล์ที่ปลายอีกด้าน ข้อความ 8 นิวเคลียส 7 เซลล์"
    caption: "เพศผู้ได้ละอองเรณู 4 เม็ดจากเซลล์แม่ 1 เซลล์ ส่วนเพศเมียได้ถุงเอ็มบริโอเพียง 1 ถุง (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: นับจำนวนโครโมโซมในการปฏิสนธิซ้อน
    problem: "ข้าวโพดมี 2n = 20 หาจำนวนโครโมโซมในสเปิร์ม เซลล์ไข่ ไซโกต และเอนโดสเปิร์ม"
    steps:
      - text: "หนึ่งชุด $n = 20 \\div 2 = 10$ แท่ง สเปิร์มและเซลล์ไข่เป็น n จึงมี 10 แท่ง"
      - text: "ไซโกต = สเปิร์ม + เซลล์ไข่ $= 10 + 10 = 20$ แท่ง (2n)"
      - text: "เอนโดสเปิร์ม = สเปิร์ม + โพลาร์นิวคลีไอ 2 นิวเคลียส $= 10 + 10 + 10 = 30$ แท่ง (3n)"
        why: "สเปิร์มเซลล์ที่สองรวมกับนิวเคลียสสองนิวเคลียสในเซลล์กลาง"
    answer: "สเปิร์ม 10 เซลล์ไข่ 10 ไซโกต 20 เอนโดสเปิร์ม 30 แท่ง"
  - { type: check, problem: biology.plants.reproduction-growth.p005, prompt: "ใช้วิธีเดียวกันกับข้าว" }
  - type: figure
    title: โครงสร้างเมล็ดถั่วและผลข้าวโพด
    src: seed-structure.svg
    alt: "ภาพ 2 ช่อง ช่อง ก. เมล็ดถั่ว (ใบเลี้ยงคู่) ผ่าแยก มีเปลือกเมล็ดหุ้มด้านนอก ข้างในเกือบทั้งหมดเป็นใบเลี้ยงที่เก็บอาหาร ที่ขอบด้านหนึ่งมีรากแรกเกิดและยอดอ่อน ช่อง ข. ผลข้าวโพด (ใบเลี้ยงเดี่ยว) ผ่าตามยาว ส่วนใหญ่เป็นเอนโดสเปิร์ม ด้านล่างมีใบเลี้ยง (สคิวเทลลัม) และเอ็มบริโอ ผิวนอกคือเปลือกผลที่เชื่อมกับเปลือกเมล็ด"
    caption: "ถั่วเก็บอาหารในใบเลี้ยง ส่วนข้าวโพดเก็บในเอนโดสเปิร์ม (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: เลือกวิธีแก้สภาพพักตัว
    problem: "เมล็ดมะขามเทศชนิดหนึ่งเปลือกแข็งและเป็นมัน เมื่อแช่น้ำเย็นทั้งคืนเมล็ดไม่พองเลย และเพาะแล้วงอกน้อยมาก ควรแก้อย่างไร"
    steps:
      - text: "สังเกตว่าเมล็ดไม่พองหลังแช่น้ำ แปลว่าน้ำซึมผ่านเปลือกไม่ได้"
      - text: "สาเหตุของการพักตัวจึงน่าจะเป็นเปลือกแข็ง ไม่ใช่สารยับยั้งหรือเอ็มบริโอที่ยังไม่เจริญ"
        why: "ถ้ามีสารยับยั้ง เมล็ดจะพองน้ำได้ แต่ยังไม่งอก"
      - text: "ทำให้เปลือกเป็นแผลด้วยการตัดหรือขัดปลายเมล็ด หรือแช่น้ำร้อนแล้วปล่อยให้เย็น น้ำจึงซึมเข้าได้"
    answer: "ตัดหรือขัดเปลือกเมล็ด หรือแช่น้ำร้อน เพื่อให้น้ำและแก๊สผ่านเปลือกได้"
  - { type: check, problem: biology.plants.reproduction-growth.p007, prompt: "ปัจจัยการงอกใดขาดไปในสถานการณ์นี้" }
glossary:
  - { term: วัฏจักรชีวิตแบบสลับ, definition: "วัฏจักรที่สลับระหว่างรุ่นสปอโรไฟต์ (2n) ที่สร้างสปอร์ และรุ่นแกมีโทไฟต์ (n) ที่สร้างเซลล์สืบพันธุ์" }
  - { term: ถุงเอ็มบริโอ, definition: "แกมีโทไฟต์เพศเมียของพืชดอก มี 7 เซลล์ 8 นิวเคลียส อยู่ในออวุล" }
  - { term: เจเนอเรทีฟเซลล์, definition: "เซลล์ในละอองเรณูที่แบ่งตัวได้สเปิร์ม 2 เซลล์" }
  - { term: โพลาร์นิวคลีไอ, definition: "นิวเคลียส 2 นิวเคลียสในเซลล์กลางของถุงเอ็มบริโอ รวมกับสเปิร์มได้เอนโดสเปิร์ม" }
  - { term: เปลือกผล, definition: "ผนังของผลที่เจริญจากผนังรังไข่ แบ่งเป็นชั้นนอก ชั้นกลาง และชั้นใน" }
  - { term: สภาพพักตัวของเมล็ด, definition: "สภาพที่เมล็ดซึ่งยังมีชีวิตไม่งอกแม้ได้ปัจจัยครบ เช่น เพราะเปลือกแข็งหรือมีสารยับยั้ง" }
flashcards:
