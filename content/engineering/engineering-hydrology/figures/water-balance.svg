<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" font-family="sans-serif"><title>แผนผังสมดุลน้ำของลุ่มน้ำ ฝนเข้า น้ำท่า การระเหย และน้ำใต้ดิน</title><rect x="0" y="0" width="640" height="240" fill="#ffffff"/><rect x="230" y="110" width="200" height="80" rx="8" fill="#eef4fb" stroke="#1f3a5f" stroke-width="2"/><text x="330.0" y="144.0" text-anchor="middle" font-size="17" fill="#111">ลุ่มน้ำ</text><text x="330.0" y="166.0" text-anchor="middle" font-size="13" fill="#333">พื้นที่รับน้ำฝน</text><line x1="400" y1="30" x2="400.0" y2="98.0" stroke="#1f3a5f" stroke-width="2.5"/><polygon points="400,104 406.0,94.0 394.0,94.0" fill="#1f3a5f"/><text x="418" y="26" text-anchor="middle" font-size="13" fill="#333">ฝน P</text><line x1="290" y1="110" x2="290.0" y2="42.0" stroke="#1f3a5f" stroke-width="2.5"/><polygon points="290,36 284.0,46.0 296.0,46.0" fill="#1f3a5f"/><text x="290" y="26" text-anchor="middle" font-size="13" fill="#333">การระเหย ET</text><line x1="430" y1="150" x2="574.0" y2="150.0" stroke="#1f3a5f" stroke-width="2.5"/><polygon points="580,150 570.0,144.0 570.0,156.0" fill="#1f3a5f"/><text x="505" y="140" text-anchor="middle" font-size="13" fill="#333">น้ำท่า Q</text><line x1="230" y1="150" x2="96.0" y2="150.0" stroke="#1f3a5f" stroke-width="2.5"/><polygon points="90,150 100.0,156.0 100.0,144.0" fill="#1f3a5f"/><text x="160" y="140" text-anchor="middle" font-size="13" fill="#333">น้ำใต้ดิน G</text><text x="30" y="225" font-size="15" fill="#333">สมดุลน้ำในช่วงเวลาหนึ่ง: ฝนเข้า = น้ำท่า + การระเหย + น้ำที่กักเก็บเพิ่มขึ้น</text></svg>
