    choices:
      - { id: a, text: "กระแสน้ำแอตแลนติกเหนือซึ่งต่อจากกัลฟ์สตรีมนำน้ำอุ่นจากเขตร้อนมาถึงชายฝั่งนอร์เวย์ ส่วนแคนาดาตะวันออกมีกระแสน้ำเย็นลาบราดอร์", correct: true }
      - { id: b, text: "นอร์เวย์อยู่ใกล้ดวงอาทิตย์มากกว่า", feedback: "ระยะห่างจากดวงอาทิตย์ของสองเมืองต่างกันน้อยมาก ไม่มีผลต่ออุณหภูมิ" }
      - { id: c, text: "แคนาดามีภูเขาสูงกว่า", feedback: "เมืองชายฝั่งทั้งสองอยู่ระดับทะเล ความต่างหลักมาจากกระแสน้ำในมหาสมุทร" }
      - { id: d, text: "นอร์เวย์มีกระแสน้ำเย็นซึ่งปล่อยความร้อนออกมา", feedback: "กระแสน้ำเย็นดึงความร้อนออกจากอากาศ ทำให้อากาศเย็นลง ไม่ใช่อุ่นขึ้น" }
    hints:
      - "ดูแผนที่กระแสน้ำผิวหน้าในมหาสมุทรแอตแลนติกเหนือ"
      - "กระแสน้ำที่ไหลจากเขตร้อนไปขั้วโลกเป็นกระแสน้ำอุ่น"
    solution: "กัลฟ์สตรีมและกระแสน้ำแอตแลนติกเหนือขนน้ำอุ่นจากเขตร้อนไปถึงยุโรปตะวันตกและนอร์เวย์ น้ำอุ่นถ่ายความร้อนให้อากาศ ส่วนชายฝั่งแคนาดาตะวันออกได้กระแสน้ำเย็นลาบราดอร์จากอาร์กติก"
