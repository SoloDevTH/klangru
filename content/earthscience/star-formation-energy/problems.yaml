      - { id: c, text: "C", feedback: "C อยู่บนแถบลำดับหลักตรงตำแหน่งของดวงอาทิตย์ หลอมไฮโดรเจนแล้ว" }
      - { id: d, text: "D", feedback: "D อยู่บนแถบลำดับหลักด้านล่าง เป็นดาวมวลน้อยที่หลอมไฮโดรเจนแล้ว" }
    hints:
