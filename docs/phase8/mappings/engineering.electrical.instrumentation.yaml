topic: engineering.electrical.instrumentation
rows:
  - { framework: th-coe-engineering-basics, indicators: ["CHE-3.6"], coverage: full, note: "สอนพื้นฐานเครื่องมือวัดอุตสาหกรรมครบ ได้แก่ องค์ประกอบของระบบวัด เซนเซอร์อุณหภูมิ (เทอร์โมคัปเปิล RTD) เซนเซอร์ความดันและสเตรนเกจผ่านวงจรบริดจ์ สัญญาณ 4–20 mA ADC และแผนภาพ P&ID เบื้องต้น ยังไม่สอนวาล์วควบคุมและการปรับจูนลูปควบคุม ซึ่งอยู่นอกขอบเขตของหัวข้อนี้" }
  - { framework: th-coe-engineering-basics, indicators: ["EE-3.2"], coverage: partial, note: "สอนเฉพาะส่วนการวัดและเครื่องมือวัดทางไฟฟ้า ยังไม่สอนระบบสื่อสาร การรับส่งคลื่นวิทยุ และการแปลงรูปพลังงานไฟฟ้าเชิงกล (มีหัวข้อ engineering.electrical.communication-systems แยกต่างหาก)" }
  - { framework: abet-eac, indicators: ["Mechatronics 1"], coverage: partial, note: "สอนเซนเซอร์และการปรับสภาพสัญญาณ แต่ยังไม่สอนแอกชูเอเตอร์ ตัวควบคุมแบบฝังตัว การออกแบบระบบควบคุม และการทำงานร่วมกันของฮาร์ดแวร์กับซอฟต์แวร์" }
