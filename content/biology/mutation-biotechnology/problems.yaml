problems:
  - id: biology.genetics.mutation-biotechnology.p001
    topics: [biology.genetics.mutation-biotechnology]
    difficulty: 1
    type: match
    stem: "ตัวอักษรแทนช่วงยีนบนโครโมโซมเดิม ABCDEF จับคู่โครโมโซมหลังเปลี่ยนแปลงกับชนิดของมิวเทชัน"
    pairs:
      - { left: "ABDEF", right: "การขาดหาย" }
      - { left: "ABCBCDEF", right: "การเพิ่มซ้ำ" }
      - { left: "ADCBEF", right: "การกลับทิศ" }
      - { left: "ABCNO (NO มาจากโครโมโซมอื่น)", right: "การย้ายตำแหน่ง" }
    hints:
      - "เทียบกับ ABCDEF ทีละตัวอักษร ส่วนใดหาย ซ้ำ หรือสลับลำดับ"
      - "ถ้ามีตัวอักษรที่ไม่เคยอยู่บนโครโมโซมนี้ แปลว่าส่วนนั้นย้ายมาจากโครโมโซมอื่น"
    solution: "ABDEF ขาด C ไป ABCBCDEF มี BC ซ้ำ ADCBEF มี BCD กลับทิศ และ ABCNO ได้ส่วน NO จากโครโมโซมอื่น เป็นการย้ายตำแหน่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mutation-biotechnology.p002
    topics: [biology.genetics.mutation-biotechnology]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นสิ่งก่อกลายพันธุ์"
    choices:
      - { id: a, text: "รังสีอัลตราไวโอเลตจากแสงแดด", correct: true }
      - { id: b, text: "วิตามินซีในผลไม้", feedback: "วิตามินซีเป็นสารอาหาร ไม่ได้ทำให้ DNA เปลี่ยน" }
      - { id: c, text: "การออกกำลังกาย", feedback: "การออกกำลังกายไม่ได้เปลี่ยนลำดับเบสใน DNA" }
      - { id: d, text: "แสงสีแดงจากหลอดไฟ", feedback: "แสงสีแดงมีพลังงานต่ำ ไม่ทำลาย DNA เหมือนรังสียูวี" }
    hints:
      - "สิ่งก่อกลายพันธุ์ทำให้ลำดับเบสหรือโครโมโซมเปลี่ยน"
      - "รังสีพลังงานสูงทำลาย DNA ได้"
    solution: "รังสีอัลตราไวโอเลตทำให้เบสใน DNA จับกันผิดปกติ เป็นสาเหตุหนึ่งของมะเร็งผิวหนัง จึงเป็นสิ่งก่อกลายพันธุ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mutation-biotechnology.p003
    topics: [biology.genetics.mutation-biotechnology]
    difficulty: 1
    type: text
    stem: "เอนไซม์ที่ใช้เชื่อมชิ้น DNA สองชิ้นเข้าด้วยกันเมื่อสร้าง DNA รีคอมบิแนนท์ชื่ออะไร"
    accepted: ["ไลเกส", "DNA ไลเกส", "ดีเอ็นเอไลเกส", "ligase", "DNA ligase"]
    misconceptions:
      - { match: "เอนไซม์ตัดจำเพาะ", feedback: "เอนไซม์ตัดจำเพาะใช้ตัด ไม่ได้ใช้เชื่อม" }
      - { match: "DNA พอลิเมอเรส", feedback: "DNA พอลิเมอเรสต่อนิวคลีโอไทด์ทีละหน่วยเพื่อสร้างสายใหม่ ไม่ได้ใช้เชื่อมชิ้น DNA สองชิ้น" }
    hints:
      - "คำว่า ligate แปลว่าผูกหรือเชื่อม"
      - "เอนไซม์นี้สร้างพันธะระหว่างน้ำตาลกับฟอสเฟตตรงรอยต่อ"
    solution: "DNA ไลเกสเชื่อมพันธะระหว่างปลายของชิ้น DNA ที่ปลายเหนียวจับคู่กันแล้ว ได้ DNA รีคอมบิแนนท์ที่ต่อกันสมบูรณ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mutation-biotechnology.p004
    topics: [biology.genetics.mutation-biotechnology]
    difficulty: 2
    type: numeric
    stem: "เริ่มต้นด้วย DNA ช่วงที่ต้องการ 1 โมเลกุล ทำ PCR 10 รอบ โดยแต่ละรอบเพิ่มเป็น 2 เท่าพอดี จะได้กี่โมเลกุล"
    answer: { value: 1024, unit: โมเลกุล }
    misconceptions:
      - { match: 20, feedback: "คูณ 2 กับ 10 แต่จำนวนเพิ่มเป็น 2 เท่าซ้ำกัน 10 ครั้ง ต้องเป็น 2 ยกกำลัง 10" }
      - { match: 100, feedback: "10 ยกกำลัง 2 สลับฐานกับเลขชี้กำลัง" }
    hints:
      - "หลังรอบที่ 1 ได้ 2 หลังรอบที่ 2 ได้ 4"
      - "หลัง n รอบได้ 2ⁿ โมเลกุล"
    solution: "$2^{10} = 1{,}024$ โมเลกุล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mutation-biotechnology.p005
    topics: [biology.genetics.mutation-biotechnology]
    difficulty: 2
    type: numeric
    stem: "DNA สายคู่เส้นตรงช่วงหนึ่ง สายบนมีลำดับ 5′-ATGGAATTCCGTAGAATTCTTAAGGCCGAATTCTA-3′ ถ้าตัดด้วย EcoRI ซึ่งจดจำลำดับ GAATTC จะได้ DNA กี่ชิ้น"
    answer: { value: 4, unit: ชิ้น }
    misconceptions:
      - { match: 3, feedback: "3 คือจำนวนตำแหน่งตัด DNA เส้นตรงที่ตัด 3 ตำแหน่งได้ 4 ชิ้น" }
      - { match: 2, feedback: "ยังนับลำดับ GAATTC ไม่ครบ ลองไล่หาทีละตัวอักษรอีกครั้ง" }
    hints:
      - "ไล่หาลำดับ GAATTC ในสายบนให้ครบทุกตำแหน่ง"
      - "DNA เส้นตรงที่ตัด k ตำแหน่งได้ k + 1 ชิ้น"
    solution: "พบ GAATTC 3 ตำแหน่ง (ATG[GAATTC]CGTA[GAATTC]TTAAGGCC[GAATTC]TA) DNA เส้นตรงที่ตัด 3 ตำแหน่งได้ $3 + 1 = 4$ ชิ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mutation-biotechnology.p006
    topics: [biology.genetics.mutation-biotechnology]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการโคลนยีนด้วยพลาสมิดในแบคทีเรีย"
    items:
      - "ตัดยีนที่ต้องการและพลาสมิดด้วยเอนไซม์ตัดจำเพาะชนิดเดียวกัน"
      - "ผสมให้ปลายเหนียวจับคู่กัน แล้วเชื่อมด้วย DNA ไลเกส"
      - "นำพลาสมิดรีคอมบิแนนท์เข้าสู่เซลล์แบคทีเรีย"
      - "เลี้ยงบนอาหารที่มียาปฏิชีวนะเพื่อคัดเลือกเซลล์ที่ได้รับพลาสมิด"
      - "เลี้ยงเซลล์ที่คัดได้ให้เพิ่มจำนวนและสร้างโปรตีน"
    hints:
      - "ต้องตัดก่อนเชื่อม และต้องเชื่อมก่อนใส่เข้าเซลล์"
      - "การคัดเลือกอาศัยยีนต้านยาปฏิชีวนะบนพลาสมิด"
    solution: "ตัดด้วยเอนไซม์เดียวกัน → เชื่อมด้วยไลเกส → ใส่เข้าแบคทีเรีย → คัดเลือกด้วยยาปฏิชีวนะ → เลี้ยงให้เพิ่มจำนวนและสร้างโปรตีน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mutation-biotechnology.p007
    topics: [biology.genetics.mutation-biotechnology]
    difficulty: 2
    type: mcq
    stem: "ข้าวเหนียวพันธุ์ กข6 ที่ปลูกมากในภาคอีสาน ได้มาด้วยวิธีใด"
    choices:
      - { id: a, text: "ฉายรังสีแกมมาให้ข้าวขาวดอกมะลิ 105 กลายพันธุ์ แล้วคัดเลือกต้นที่ต้องการ", correct: true }
      - { id: b, text: "ตัดต่อยีนจากแบคทีเรียใส่ในข้าว", feedback: "กข6 ไม่ใช่ข้าวดัดแปรพันธุกรรม ได้จากการชักนำมิวเทชัน" }
      - { id: c, text: "เพาะเลี้ยงเนื้อเยื่อข้าวขาวดอกมะลิ 105", feedback: "การเพาะเลี้ยงเนื้อเยื่อให้ต้นที่มียีนเหมือนเดิม จึงไม่ได้พันธุ์ใหม่" }
      - { id: d, text: "ใช้ CRISPR แก้ไขยีนในห้องปฏิบัติการ", feedback: "กข6 รับรองพันธุ์มานานก่อนมีเทคโนโลยี CRISPR" }
    hints:
      - "กข6 เป็นตัวอย่างการนำมิวเทชันไปใช้ประโยชน์"
      - "รังสีพลังงานสูงชักนำให้เกิดมิวเทชันได้"
    solution: "กข6 ได้จากการฉายรังสีแกมมาให้ข้าวขาวดอกมะลิ 105 เกิดมิวเทชัน แล้วคัดเลือกต้นที่เป็นข้าวเหนียวและให้ผลผลิตดี เป็นการใช้ประโยชน์จากมิวเทชัน ไม่ใช่การตัดต่อยีน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mutation-biotechnology.p008
    topics: [biology.genetics.mutation-biotechnology]
    difficulty: 3
    type: mcq
    stem: "ตำรวจนำ DNA จากหลักฐานในที่เกิดเหตุและจากผู้ต้องสงสัย 3 คนมาตัดด้วยเอนไซม์ชุดเดียวกันแล้วแยกด้วยเจลอิเล็กโทรโฟรีซิส ได้ผลตามภาพ DNA ของใครตรงกับหลักฐาน"
    figure: { src: gel-forensic.svg, alt: "แผ่นเจลมี 5 ช่อง หลุมใส่ตัวอย่างอยู่ด้านบนที่ขั้วลบ DNA เคลื่อนที่ลง ช่อง M เป็นชิ้น DNA มาตรฐานขนาด 1000 800 600 500 400 300 และ 200 คู่เบส ช่องหลักฐานมีแถบที่ 800 500 และ 300 คู่เบส ช่องผู้ต้องสงสัย 1 มีแถบที่ 800 450 และ 300 คู่เบส ช่องผู้ต้องสงสัย 2 มีแถบที่ 800 500 และ 300 คู่เบส ช่องผู้ต้องสงสัย 3 มีแถบที่ 700 500 และ 200 คู่เบส" }
    choices:
      - { id: a, text: "ผู้ต้องสงสัย 1", feedback: "แถบกลางของผู้ต้องสงสัย 1 อยู่ต่ำกว่าแถบ 500 คู่เบสของหลักฐาน ต้องตรงกันทุกแถบ" }
      - { id: b, text: "ผู้ต้องสงสัย 2", correct: true }
      - { id: c, text: "ผู้ต้องสงสัย 3", feedback: "ตรงกันเพียงแถบ 500 คู่เบส ไม่ตรงทุกแถบ" }
      - { id: d, text: "ไม่มีใครตรงเลย", feedback: "มีช่องหนึ่งที่แถบตรงกับหลักฐานทุกแถบ" }
    hints:
      - "เทียบตำแหน่งแถบทุกแถบกับช่องหลักฐาน"
      - "ใช้ช่อง M บอกขนาดของแต่ละแถบ"
    solution: "ผู้ต้องสงสัย 2 มีแถบที่ 800 500 และ 300 คู่เบสตรงกับหลักฐานทุกแถบ ในงานจริงต้องตรวจหลายตำแหน่งและใช้หลักฐานอื่นร่วมด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mutation-biotechnology.p009
    topics: [biology.genetics.mutation-biotechnology]
    difficulty: 3
    type: numeric
    stem: "กล้วยหอมทองเป็นพืชทริพลอยด์ (3n) ถ้าโครโมโซมหนึ่งชุด (n) ของกล้วยมี 11 แท่ง เซลล์ใบของกล้วยหอมทองมีโครโมโซมกี่แท่ง"
    answer: { value: 33, unit: แท่ง }
    misconceptions:
      - { match: 22, feedback: "22 คือจำนวนของพืชดิพลอยด์ (2n) กล้วยหอมทองมี 3 ชุด" }
      - { match: 14, feedback: "บวก 3 ไม่ได้ ทริพลอยด์คือมีโครโมโซม 3 ชุด ต้องคูณ" }
    hints:
      - "ทริพลอยด์คือมีโครโมโซมกี่ชุด"
      - "จำนวนแท่ง = จำนวนชุด × จำนวนแท่งต่อชุด"
    solution: "$3n = 3 \\times 11 = 33$ แท่ง จำนวนชุดที่เป็นเลขคี่ทำให้ไมโอซิสจับคู่ไม่ลงตัว กล้วยหอมจึงแทบไม่มีเมล็ด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mutation-biotechnology.p010
    topics: [biology.genetics.mutation-biotechnology]
    difficulty: 3
    type: mcq
    stem: "คนที่มีแอลลีลเซลล์รูปเคียว 1 แอลลีล (เฮเทอโรไซกัส) มักไม่มีอาการ และป่วยเป็นมาลาเรียรุนแรงน้อยกว่าคนทั่วไป ข้อใดสรุปได้ถูกต้อง"
    choices:
      - { id: a, text: "ผลของมิวเทชันขึ้นกับสภาพแวดล้อม ในพื้นที่ที่มีมาลาเรีย แอลลีลนี้ให้ประโยชน์แก่คนที่เป็นเฮเทอโรไซกัส", correct: true }
      - { id: b, text: "มิวเทชันนี้ไม่มีผลเสียในทุกจีโนไทป์", feedback: "คนที่มีแอลลีลนี้ 2 แอลลีลป่วยเป็นโรคโลหิตจางชนิดเซลล์รูปเคียว" }
      - { id: c, text: "มิวเทชันทุกแบบมีประโยชน์", feedback: "มิวเทชันส่วนใหญ่ไม่มีผล บางแบบมีผลเสีย เป็นประโยชน์เฉพาะบางกรณี" }
      - { id: d, text: "คนที่ได้รับเชื้อมาลาเรียจึงเกิดมิวเทชันนี้ขึ้น", feedback: "มิวเทชันเกิดขึ้นแบบสุ่มก่อนแล้ว มาลาเรียไม่ได้ทำให้เกิดมิวเทชันนี้" }
    hints:
      - "พิจารณาผลของแอลลีลนี้ต่อทั้งเฮเทอโรไซกัสและฮอมอไซกัส"
      - "ประโยชน์เกิดเฉพาะในพื้นที่ที่มีมาลาเรีย"
    solution: "แอลลีลเดียวกันมีผลเสียเมื่อเป็นฮอมอไซกัส แต่ช่วยเฮเทอโรไซกัสในพื้นที่ที่มีมาลาเรีย ผลของมิวเทชันจึงเป็นผลเสีย ผลดี หรือไม่มีผล ขึ้นกับจีโนไทป์และสภาพแวดล้อม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mutation-biotechnology.p011
    topics: [biology.genetics.mutation-biotechnology]
    difficulty: 3
    type: mcq
    stem: "กลุ่มอาการคริดูชาต์ ซึ่งทารกมีเสียงร้องแหลมคล้ายแมว เกิดจากมิวเทชันแบบใด"
    choices:
      - { id: a, text: "แขนข้างสั้นของโครโมโซมคู่ที่ 5 ขาดหายไปบางส่วน", correct: true }
      - { id: b, text: "โครโมโซมคู่ที่ 21 เกินมา 1 แท่ง", feedback: "เป็นสาเหตุของดาวน์ซินโดรม" }
      - { id: c, text: "เบสเดียวในยีนฮีโมโกลบินถูกแทนที่", feedback: "เป็นสาเหตุของโรคโลหิตจางชนิดเซลล์รูปเคียว" }
      - { id: d, text: "โครโมโซมเพิ่มเป็นสามชุด", feedback: "สามชุด (3n) พบได้ในพืช เช่น กล้วยหอม ไม่ใช่สาเหตุของกลุ่มอาการนี้" }
    hints:
      - "เป็นมิวเทชันระดับโครโมโซมแบบเปลี่ยนโครงสร้าง"
      - "คำว่า ขาดหาย เกี่ยวกับส่วนของโครโมโซมที่หายไป"
    solution: "กลุ่มอาการคริดูชาต์เกิดจากการขาดหายของส่วนหนึ่งบนแขนข้างสั้นของโครโมโซมคู่ที่ 5"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mutation-biotechnology.p012
    topics: [biology.genetics.mutation-biotechnology]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเปรียบเทียบการผสมพันธุ์คัดเลือกกับการสร้างสิ่งมีชีวิตดัดแปรพันธุกรรมได้ถูกต้อง"
    choices:
