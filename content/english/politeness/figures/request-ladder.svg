<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" width="780" height="410" font-family="sans-serif">
<title>ระดับความสุภาพของคำขอร้อง จากห้วนถึงทางการมาก</title>
<rect x="0" y="30.0" width="780" height="410" fill="#fff"/>
<text x="30.0" y="30.0" font-size="18" text-anchor="start" fill="#111" font-weight="bold">ระดับความสุภาพของคำขอร้อง</text>
<rect x="30.0" y="320.0" width="30.0" height="40.0" rx="4" fill="#e8a598" stroke="#777" stroke-width="1.2"/>
<text x="202.0" y="346.0" font-size="16" text-anchor="start" fill="#111" font-weight="bold" font-style="italic">Open the window.</text>
<text x="760.0" y="346.0" font-size="14" text-anchor="end" fill="#444" font-weight="normal">คำสั่ง ห้วน</text>
<rect x="30.0" y="268.0" width="52.0" height="40.0" rx="4" fill="#f0c39a" stroke="#777" stroke-width="1.2"/>
<text x="202.0" y="294.0" font-size="16" text-anchor="start" fill="#111" font-weight="bold" font-style="italic">Open the window, please.</text>
<text x="760.0" y="294.0" font-size="14" text-anchor="end" fill="#444" font-weight="normal">มี please ดีขึ้น</text>
<rect x="30.0" y="216.0" width="74.0" height="40.0" rx="4" fill="#ead98f" stroke="#777" stroke-width="1.2"/>
<text x="202.0" y="242.0" font-size="16" text-anchor="start" fill="#111" font-weight="bold" font-style="italic">Can you open the window?</text>
<text x="760.0" y="242.0" font-size="14" text-anchor="end" fill="#444" font-weight="normal">เพื่อน คนในครอบครัว</text>
<rect x="30.0" y="164.0" width="96.0" height="40.0" rx="4" fill="#b9df9f" stroke="#777" stroke-width="1.2"/>
<text x="202.0" y="190.0" font-size="16" text-anchor="start" fill="#111" font-weight="bold" font-style="italic">Could you open the window, please?</text>
<text x="760.0" y="190.0" font-size="14" text-anchor="end" fill="#444" font-weight="normal">ครู คนแปลกหน้า</text>
<rect x="30.0" y="112.0" width="118.0" height="40.0" rx="4" fill="#9fd3c7" stroke="#777" stroke-width="1.2"/>
<text x="202.0" y="138.0" font-size="16" text-anchor="start" fill="#111" font-weight="bold" font-style="italic">Would you mind opening the window?</text>
<text x="760.0" y="138.0" font-size="14" text-anchor="end" fill="#444" font-weight="normal">สุภาพมาก</text>
<rect x="30.0" y="60.0" width="140.0" height="40.0" rx="4" fill="#a9bfe8" stroke="#777" stroke-width="1.2"/>
<text x="202.0" y="86.0" font-size="16" text-anchor="start" fill="#111" font-weight="bold" font-style="italic">I was wondering if you could open the window.</text>
<text x="760.0" y="86.0" font-size="14" text-anchor="end" fill="#444" font-weight="normal">ทางการมาก</text>
<line x1="210.0" y1="375.0" x2="210.0" y2="390.0" stroke="#fff" stroke-width="0.1" stroke-linecap="round"/>
<polygon points="210.0,390.0 205.7,381.0 214.3,381.0" fill="#fff" stroke="#fff" stroke-width="1" stroke-linejoin="round"/>
<line x1="18.0" y1="360.0" x2="18.0" y2="90.0" stroke="#2f5fa8" stroke-width="3" stroke-linecap="round"/>
<polygon points="18.0,90.0 22.3,99.0 13.7,99.0" fill="#2f5fa8" stroke="#2f5fa8" stroke-width="1" stroke-linejoin="round"/>
<text x="30.0" y="395.0" font-size="14" text-anchor="start" fill="#2f5fa8" font-weight="normal">แถบยาวขึ้น = สุภาพและเป็นทางการมากขึ้น (ล่างสุดห้วนที่สุด)</text>
</svg>
