# หัวข้อที่เสนอให้เขียนใหม่ เพื่อครอบคลุมผลการเรียนรู้รายวิชาเพิ่มเติม ม.4–6 (ฉบับปรับปรุง พ.ศ. 2560)
# ฟิสิกส์ เคมี ชีววิทยา และโลก ดาราศาสตร์ และอวกาศ
#
# - indicators อ้างรหัสในรูป "<framework-id>:<รหัสผลการเรียนรู้>" ตาม curriculum/frameworks/th-core-2560-*-additional.yaml
#   รหัสผลการเรียนรู้เป็นรหัสที่คลังรู้ตั้งเอง (ดูหมายเหตุในไฟล์ framework) ข้อความผลการเรียนรู้คัดจากต้นฉบับ
# - รวมผลการเรียนรู้ที่ยังไม่มีหัวข้อสอน และผลการเรียนรู้ที่หัวข้อเดิมสอนได้เพียงบางส่วนเมื่อหัวข้อใหม่เติมส่วนที่ขาด
# - เรียงตาม prerequisite: prereq ทุกตัวเป็นหัวข้อที่มีในคลังแล้วหรือหัวข้อที่อยู่ก่อนหน้าในไฟล์นี้ (วิชาเรียงเป็น เคมี ฟิสิกส์ ชีววิทยา โลกฯ
#   เพราะฟิสิกส์บางหัวข้ออ้างเคมี และชีววิทยากับโลกฯ อ้างทั้งสองวิชา)
# - difficulty เทียบกับหัวข้อเดิม (ฟิสิกส์ ม.4–6 ในคลังอยู่ที่ 5–7) scope เป็นคำของเรา ไม่ใช่ข้อความจากหลักสูตร
# - ไม่ได้เสนอ: เคมี 3 ม.6/4 (แสดงหลักฐานการเข้าร่วมสัมมนา ประชุมวิชาการ หรือนิทรรศการ) เพราะเป็นกิจกรรมนอกแอป
# - หัวข้อที่เสนอบางส่วนอาจซ้อนกับตัวชี้วัดรายวิชาพื้นฐาน (ว 1.x–ว 3.x ม.4–6) ซึ่งผู้รับผิดชอบหลักสูตรแกนกลางจะเสนอแยก
#   ควรรวมเป็นหัวข้อเดียวก่อนลงมือเขียน
