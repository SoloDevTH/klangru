id: thai.reading.instructions-charts
subject: thai
title: { th: การอ่านคำสั่ง ข้อแนะนำ แผนภาพ และแผนภูมิ, en: "Reading instructions, signs, diagrams and charts" }
summary: บอกความหมายของเครื่องหมายและสัญลักษณ์ อ่านคำสั่ง ข้อแนะนำ และคู่มือแล้วทำตามได้ถูกลำดับ และอ่านข้อมูลจากแผนภาพ แผนผัง แผนที่ แผนภูมิ และกราฟ
difficulty: 3
minutes: 30
prerequisites: [thai.reading.comprehension]
encompasses:
  - { id: thai.reading.comprehension, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: sign-shapes.svg
    alt: "ป้ายสัญลักษณ์ 4 แบบ วงกลมขอบแดงมีขีดทับ หมายถึงห้ามทำ สามเหลี่ยมสีเหลืองมีเครื่องหมายตกใจ หมายถึงเตือนให้ระวัง วงกลมสีน้ำเงินมีรูปคนสีขาว หมายถึงต้องทำตาม สี่เหลี่ยมสีเขียวมีลูกศรสีขาว หมายถึงปลอดภัยหรือทางออก หมายเหตุว่าป้ายจราจรของไทยมีแบบของตัวเอง เช่น ป้ายเตือนเป็นสี่เหลี่ยมข้าวหลามตัดสีเหลือง"
    caption: "รูปทรงและสีของป้ายบอกความหมายได้ก่อนอ่านตัวหนังสือ"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: อ่านวิธีปรุงแล้วทำตาม
    problem: "ซองบะหมี่สมมุติเขียนว่า 1. ต้มน้ำ 400 มิลลิลิตรให้เดือด 2. ใส่เส้น ต้มต่อ 3 นาที 3. ปิดไฟ แล้วใส่ผงปรุงรส 4. คนให้เข้ากัน ข้อควรระวัง: ระวังน้ำร้อนลวก ให้ผู้ใหญ่ช่วยยกหม้อ ควรเติมผักและไข่ ถ้าจะต้มให้น้อง 1 ซอง ต้องทำอะไรบ้างตามลำดับ และต้องระวังอะไร"
    steps:
      - text: "อ่านให้จบทั้งซองก่อน พบว่ามีวิธีปรุง 4 ขั้น และกรอบข้อควรระวัง"
        why: "ข้อควรระวังมักอยู่ท้ายสุด ถ้าลงมือก่อนจะพลาด"
      - text: "จดตัวเลขและหน่วย: น้ำ 400 มิลลิลิตร ต้มเส้น 3 นาที"
      - text: "เรียงลำดับ: ต้มน้ำให้เดือด → ใส่เส้น ต้ม 3 นาที → ปิดไฟ แล้วใส่เครื่องปรุง → คนให้เข้ากัน"
        why: "คำว่า ปิดไฟ แล้ว บอกว่าการใส่เครื่องปรุงต้องเกิดหลังปิดไฟ"
      - text: "ข้อควรระวัง: น้ำร้อนลวกได้ ให้ผู้ใหญ่ช่วยยกหม้อ และข้อแนะนำให้เติมผักกับไข่"
    answer: "ต้มน้ำ 400 มิลลิลิตรให้เดือด ใส่เส้นต้ม 3 นาที ปิดไฟแล้วใส่เครื่องปรุง คนให้เข้ากัน ระวังน้ำร้อนและให้ผู้ใหญ่ช่วยยกหม้อ"
  - { type: check, problem: thai.reading.instructions-charts.p004, prompt: "หาคำว่า ปิดไฟ แล้ว" }
  - type: worked-example
    title: อ่านแผนภูมิรูปภาพ
    problem: "แผนภูมิรูปภาพกำหนดให้ 1 รูปแทนหนังสือ 4 เล่ม วันศุกร์มี 4 รูปครึ่ง วันศุกร์ยืมหนังสือกี่เล่ม"
    steps:
      - text: "อ่านคำอธิบายสัญลักษณ์: 1 รูป = 4 เล่ม"
        why: "จำนวนรูปไม่ใช่จำนวนเล่ม ต้องแปลงก่อน"
      - text: "นับรูป: 4 รูปเต็มกับครึ่งรูป = 4.5 รูป"
      - text: "คูณ: 4.5 × 4 = 18"
    answer: "18 เล่ม"
  - { type: check, problem: thai.reading.instructions-charts.p007, prompt: "ครึ่งรูปแทนกี่เล่ม" }
glossary:
  - { term: สัญลักษณ์, definition: "ภาพหรือเครื่องหมายที่ใช้แทนความหมาย เช่น ป้ายห้ามสูบบุหรี่" }
  - { term: คำสั่ง, definition: "ข้อความบอกสิ่งที่ต้องทำหรือห้ามทำ มักมีคำว่า ต้อง ห้าม จง" }
  - { term: ข้อแนะนำ, definition: "ข้อความบอกสิ่งที่ควรทำเพื่อให้ได้ผลดี มักมีคำว่า ควร" }
  - { term: แผนผัง, definition: "ภาพแสดงตำแหน่งของสิ่งต่าง ๆ ในพื้นที่ มองจากด้านบน" }
  - { term: แผนภูมิ, definition: "ภาพแสดงข้อมูลตัวเลข เช่น แผนภูมิรูปภาพ แผนภูมิแท่ง" }
  - { term: มาตราส่วน, definition: "อัตราส่วนระหว่างระยะบนแผนที่กับระยะจริง" }
flashcards:
  - { front: "วงกลมขอบแดงมีขีดทับ", back: "ห้ามทำสิ่งที่อยู่ในรูป" }
  - { front: "คำสั่ง กับ ข้อแนะนำ ต่างกันอย่างไร", back: "คำสั่งต้องทำ (ต้อง ห้าม จง) ข้อแนะนำควรทำ (ควร)" }
  - { front: "อ่านแผนภูมิรูปภาพต้องดูอะไรก่อน", back: "คำอธิบายว่า 1 รูปแทนเท่าไร แล้วคูณกับจำนวนรูป" }
  - { front: "อ่านแผนผังหรือแผนที่ต้องหาอะไร", back: "ลูกศรทิศเหนือและมาตราส่วน" }
