  - id: health.family.friendships-relationships.p015
    topics: [health.family.friendships-relationships]
    difficulty: 4
    type: mcq
    stem: "มีนักเรียนใหม่ย้ายมาจากจังหวัดอุบลราชธานี พูดสำเนียงอีสาน และใส่เครื่องช่วยฟัง เพื่อนบางคนแอบหัวเราะเวลาเขาพูด ข้อใดเป็นการสร้างสัมพันธภาพที่ดีที่สุด"
    choices:
      - { id: a, text: "ทักทาย ชวนเข้ากลุ่ม พูดให้ชัดและหันหน้าเข้าหาเขาเวลาคุย และบอกเพื่อนให้หยุดหัวเราะ", correct: true }
      - { id: b, text: "ไม่ยุ่ง เพราะเขาไม่เหมือนเรา", feedback: "ความแตกต่างไม่ใช่เหตุผลที่จะไม่คบกัน การเพิกเฉยทำให้เขารู้สึกโดดเดี่ยว" }
      - { id: c, text: "หัวเราะตามเพื่อน เพื่อให้กลุ่มยอมรับเรา", feedback: "การหัวเราะเยาะเป็นการไม่ให้เกียรติและทำร้ายจิตใจ" }
    hints:
      - "เพื่อนที่ดียอมรับความแตกต่าง"
      - "ทำอย่างไรให้เขาสื่อสารกับเราได้ง่ายขึ้น"
    solution: "ให้เกียรติและยอมรับความแตกต่าง ชวนเข้ากลุ่ม ปรับการสื่อสารให้เขาได้ยินและอ่านปากได้ง่าย และช่วยหยุดการหัวเราะเยาะ"
