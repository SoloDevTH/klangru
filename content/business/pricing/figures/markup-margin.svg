<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="sans-serif">
<title>markup กับ margin</title>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="700" height="300" fill="#ffffff"/>
<text x="60.0" y="40.0" font-size="14" text-anchor="start" fill="#222" font-weight="bold">ราคาขาย 100 บาท</text>
<rect x="60.0" y="60.0" width="448.0" height="46.0" fill="#d9e4f2" stroke="#222" stroke-width="1.5" rx="0"/>
<text x="284.0" y="89.0" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">ต้นทุน 80 บาท</text>
<rect x="508.0" y="60.0" width="112.0" height="46.0" fill="#f6d7a7" stroke="#222" stroke-width="1.5" rx="0"/>
<text x="564.0" y="89.0" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">กำไร 20</text>
<line x1="60.0" y1="112.0" x2="60.0" y2="120.0" stroke="#1f5fa8" stroke-width="2"/>
<line x1="508.0" y1="112.0" x2="508.0" y2="120.0" stroke="#1f5fa8" stroke-width="2"/>
<line x1="60.0" y1="120.0" x2="508.0" y2="120.0" stroke="#1f5fa8" stroke-width="2"/>
<text x="284.0" y="142.0" font-size="14" text-anchor="middle" fill="#1f5fa8" font-weight="bold">ฐานของ markup = ต้นทุน 80</text>
<text x="620.0" y="150.0" font-size="16" text-anchor="end" fill="#1f5fa8" font-weight="bold">markup = 20 ÷ 80 = 25%</text>
<rect x="60.0" y="180.0" width="560.0" height="46.0" fill="#eeeeee" stroke="#222" stroke-width="1.5" rx="0"/>
<text x="340.0" y="209.0" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">ราคาขาย 100 บาท</text>
<rect x="508.0" y="180.0" width="112.0" height="46.0" fill="#f6d7a7" stroke="#222" stroke-width="1.5" rx="0"/>
<text x="564.0" y="209.0" font-size="15" text-anchor="middle" fill="#222" font-weight="normal">กำไร 20</text>
<line x1="60.0" y1="232.0" x2="60.0" y2="240.0" stroke="#c0392b" stroke-width="2"/>
<line x1="620.0" y1="232.0" x2="620.0" y2="240.0" stroke="#c0392b" stroke-width="2"/>
<line x1="60.0" y1="240.0" x2="620.0" y2="240.0" stroke="#c0392b" stroke-width="2"/>
<text x="340.0" y="262.0" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">ฐานของ margin = ราคาขาย 100</text>
<text x="620.0" y="290.0" font-size="16" text-anchor="end" fill="#c0392b" font-weight="bold">margin = 20 ÷ 100 = 20%</text>
</svg>