problems:
- id: thai.grammar.word-formation.p001
  topics:
  - thai.grammar.word-formation
  difficulty: 1
  type: mcq
  stem: คำใดเป็น **คำมูล**
  choices:
  - id: a
    text: แม่น้ำ
    feedback: เป็นคำประสม แม่ + น้ำ
  - id: b
    text: บ้านเรือน
    feedback: เป็นคำซ้อน
  - id: c
    text: มะละกอ
    correct: true
    feedback: ถูก แยกเป็น มะ ละ กอ แล้วไม่มีความหมายเกี่ยวกับคำเดิม
  - id: d
    text: เด็ก ๆ
    feedback: เป็นคำซ้ำ
  hints:
  - คำมูลไม่ได้สร้างจากคำอื่น
  - ลองแยกพยางค์แล้วดูว่ามีความหมายที่เกี่ยวข้องหรือไม่
  solution: '**มะละกอ** เป็นคำมูลหลายพยางค์'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.word-formation.p002
  topics:
  - thai.grammar.word-formation
  difficulty: 1
  type: match
  stem: จับคู่คำกับวิธีสร้างคำ
  pairs:
  - left: แม่น้ำ
    right: คำประสม
  - left: เด็ก ๆ
    right: คำซ้ำ
  - left: บ้านเรือน
    right: คำซ้อน
  - left: สุขภาพ
    right: คำสมาส
  hints:
  - คำบาลีสันสกฤตต่อกันคือสมาส
  - คำความหมายเหมือนกันวางคู่กันคือคำซ้อน
  solution: แม่น้ำ = ประสม · เด็ก ๆ = ซ้ำ · บ้านเรือน = ซ้อน · สุขภาพ = สมาส
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.word-formation.p003
  topics:
  - thai.grammar.word-formation
  difficulty: 2
  type: mcq
  stem: ข้อใด **ไม่ใช่** คำประสม
  choices:
  - id: a
    text: รถสีแดง
    correct: true
    feedback: ถูก แทรกคำได้ว่า รถที่มีสีแดง ความหมายไม่เปลี่ยน จึงเป็นกลุ่มคำ
  - id: b
    text: รถไฟ
    feedback: เป็นคำประสม ไม่ได้หมายถึงรถที่ทำจากไฟ
  - id: c
    text: ลูกเสือ
    feedback: เป็นคำประสม ไม่ใช่ลูกของเสือ
  - id: d
    text: ตู้เย็น
    feedback: เป็นคำประสม เป็นชื่อเครื่องใช้ไฟฟ้า
  hints:
  - ลองแทรกคำว่า ของ ที่ ซึ่ง
  - ถ้าแทรกแล้วความหมายไม่เปลี่ยน แปลว่าอะไร
  solution: '**รถสีแดง** เป็นกลุ่มคำ เพราะแทรกเป็น "รถที่มีสีแดง" ได้โดยความหมายเดิม'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.word-formation.p004
  topics:
  - thai.grammar.word-formation
  difficulty: 2
  type: mcq
  stem: ข้อใดใช้ **ไม้ยมก** ถูกต้อง
  choices:
  - id: a
    text: คน ๆ นี้ใจดีมาก
    feedback: คน ตัวแรกเป็นนาม ตัวที่สองเป็นลักษณนาม ต้องเขียน คนคนนี้
  - id: b
    text: นายดำ ๆ นาตั้งแต่เช้า
    feedback: ดำ ตัวแรกเป็นชื่อ ตัวที่สองเป็นกริยา ดำนา ต้องเขียน นายดำดำนา
  - id: c
    text: ฉันมีเพื่อน ๆ คนหนึ่งชื่อมุก
    feedback: เพื่อน ๆ บอกว่ามีหลายคน ขัดกับ คนหนึ่ง
  - id: d
    text: เด็ก ๆ วิ่งเล่นในสนาม
    correct: true
    feedback: ถูก คำเดียวกัน หน้าที่เดียวกัน
  hints:
  - ไม้ยมกใช้กับคำเดียวกันที่ทำหน้าที่เดียวกัน
  - ลองดูหน้าที่ของคำแต่ละตัว
  solution: '**เด็ก ๆ** ใช้ไม้ยมกถูก ส่วน คนคนนี้ ต้องเขียนเต็มเพราะคำต่างหน้าที่'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.word-formation.p005
  topics:
  - thai.grammar.word-formation
  difficulty: 2
  type: mcq
  stem: คำใดเป็น **คำซ้อนเพื่อเสียง**
  choices:
  - id: a
    text: บ้านเรือน
    feedback: ซ้อนเพื่อความหมาย บ้านกับเรือนความหมายเหมือนกัน
  - id: b
    text: ตู้เย็น
    feedback: เป็นคำประสม
  - id: c
    text: โยกเยก
    correct: true
    feedback: ถูก สองพยางค์มีเสียงคล้องกัน
  - id: d
    text: ดี ๆ
    feedback: เป็นคำซ้ำ
  hints:
  - ซ้อนเพื่อเสียงเน้นเสียงคล้องกัน
  - ส่วนหลัง เยก มีความหมายชัดเจนเองหรือไม่
  solution: '**โยกเยก** ซ้อนเพื่อเสียง ส่วนบ้านเรือนซ้อนเพื่อความหมาย'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.word-formation.p006
  topics:
  - thai.grammar.word-formation
  difficulty: 3
  type: mcq
  stem: คำใด **ไม่ใช่** คำสมาส
  choices:
  - id: a
    text: สุขภาพ
    feedback: สุข และ ภาพ เป็นบาลีสันสกฤต
  - id: b
    text: พลเมือง
    correct: true
    feedback: ถูก เมือง เป็นคำไทย จึงไม่ใช่สมาส แม้จะอ่าน พน-ละ-เมือง
  - id: c
    text: อุบัติเหตุ
    feedback: อุบัติ และ เหตุ เป็นบาลีสันสกฤต
  - id: d
    text: ภูมิศาสตร์
    feedback: ภูมิ และ ศาสตร์ เป็นบาลีสันสกฤต
  hints:
  - ทุกส่วนของคำสมาสต้องเป็นบาลีหรือสันสกฤต
  - คำใดมีคำไทยปน
  solution: '**พลเมือง** มีคำไทย (เมือง) จึงไม่ใช่คำสมาส'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.word-formation.p007
  topics:
  - thai.grammar.word-formation
  difficulty: 3
  type: text
  stem: ดูแผนภาพในภาพ นำ **กุศล** มาสนธิกับ **อุบาย** จะได้คำว่าอะไร
  figure:
    src: sandhi-quiz.svg
    alt: แผนภาพต่อคำบาลีสันสกฤตแบบสระสนธิ กล่องซ้าย กุศล บวก กล่องขวา อุบาย ลูกศรชี้ลงไปที่กล่องผลลัพธ์ซึ่งเว้นว่างไว้เป็นเครื่องหมายคำถาม หมายเหตุว่า คำหน้าลงท้ายเสียง อะ คำหลังขึ้นต้นด้วย อุ
  accepted:
  - กุศโลบาย
  misconceptions:
  - match: กุศลอุบาย
    feedback: ยังไม่ได้เชื่อมเสียง อะ + อุ ต้องกลายเป็น โอ
  - match: กุศลุบาย
    feedback: อะ + อุ ในสระสนธิกลายเป็น โอ ไม่ใช่ อุ
  hints:
  - อะ + อุ กลายเป็น โอ
  - ตัด อุ ของคำหลัง แล้วเติม โ- ที่ ล
  solution: กุศล + อุบาย = **กุศโลบาย** (อะ + อุ → โอ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.word-formation.p008
  topics:
  - thai.grammar.word-formation
  difficulty: 3
  type: mcq
  stem: ข้อใดสะกด **คำสมาส** ถูกต้อง
  choices:
  - id: a
    text: แพทย์ศาสตร์
    feedback: คำสมาสไม่ใส่การันต์ท้ายคำหน้า
  - id: b
    text: แพทยะศาสตร์
    feedback: คำสมาสไม่ประวิสรรชนีย์ท้ายคำหน้า
  - id: c
    text: แพดทะยะศาสตร์
    feedback: เขียนตามเสียงอ่าน ไม่ใช่ตามรูปคำ
  - id: d
    text: แพทยศาสตร์
    correct: true
    feedback: ถูก ท้ายคำหน้าไม่ใส่การันต์
  hints:
  - คำสมาสเขียนติดกันโดยไม่มีเครื่องหมายใดท้ายคำหน้า
  - แพทย์ + ศาสตร์
  solution: '**แพทยศาสตร์** ตัดการันต์ของ แพทย์ ออก'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.word-formation.p009
  topics:
  - thai.grammar.word-formation
  difficulty: 3
  type: mcq
  stem: คำสมาส **ภูมิศาสตร์** หมายความว่าอย่างไร
  choices:
  - id: a
    text: แผ่นดินของวิชา
    feedback: แปลจากหน้าไปหลัง ผิดหลักคำสมาส
  - id: b
    text: ผู้รู้เรื่องดวงดาว
    feedback: ไม่ตรงกับความหมายของคำ
  - id: c
    text: วิชาว่าด้วยแผ่นดิน
    correct: true
    feedback: ถูก แปลจากหลังไปหน้า ศาสตร์ (วิชา) ว่าด้วย ภูมิ (แผ่นดิน)
  - id: d
    text: การวาดแผนที่
    feedback: เป็นงานส่วนหนึ่ง ไม่ใช่ความหมายของคำ
  hints:
  - คำหลักของคำสมาสอยู่หลัง
  - ภูมิ = แผ่นดิน ศาสตร์ = วิชา
  solution: 'แปลจากหลังไปหน้า: **วิชาว่าด้วยแผ่นดิน**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.word-formation.p010
  topics:
  - thai.grammar.word-formation
  difficulty: 3
  type: match
  stem: จับคู่คำซ้ำกับความหมายที่เกิดขึ้น
  pairs:
  - left: เพื่อน ๆ มาหาแล้ว
    right: มีหลายคน
  - left: เช้า ๆ อากาศเย็น
    right: ช่วงเวลาไม่เจาะจง
  - left: จัดหนังสือเป็นเรื่อง ๆ
    right: แยกเป็นส่วน
  - left: ไป ๆ มา ๆ ก็ต้องทำเอง
    right: ในที่สุด
  hints:
  - คำซ้ำบางคำเกิดความหมายใหม่
  - ไป ๆ มา ๆ ไม่ได้หมายถึงการเดินทาง
  solution: เพื่อน ๆ = หลายคน · เช้า ๆ = ไม่เจาะจง · เป็นเรื่อง ๆ = แยกส่วน · ไป ๆ มา ๆ = ในที่สุด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.word-formation.p011
  topics:
  - thai.grammar.word-formation
  difficulty: 4
  type: mcq
  stem: คำใดเป็น **คำซ้อนที่ซ้อนคำยืมกับคำไทย**
  choices:
  - id: a
    text: ทรัพย์สิน
    correct: true
    feedback: ถูก ทรัพย์ มาจากสันสกฤต สิน เป็นคำไทย
  - id: b
    text: บ้านเรือน
    feedback: คำไทยทั้งสองคำ
  - id: c
    text: โยกเยก
    feedback: คำไทย ซ้อนเพื่อเสียง
  - id: d
    text: ธนาคาร
    feedback: เป็นคำสนธิของบาลี
  hints:
  - ดูที่มาของแต่ละคำ
  - คำใดมีส่วนหนึ่งเป็นบาลีสันสกฤต อีกส่วนเป็นคำไทย
  solution: '**ทรัพย์สิน** = ทรัพย์ (ส.) + สิน (ไทย) ความหมายใกล้กัน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.word-formation.p012
  topics:
  - thai.grammar.word-formation
  difficulty: 4
  type: mcq
  stem: คำว่า **ประวัติศาสตร์** อ่านอย่างไรตามพจนานุกรม
  choices:
  - id: a
    text: ประ-หวัด-สาด-ตะ
    feedback: สลับตำแหน่งเสียง ติ
  - id: b
    text: ประ-วัด-ติ-สาด
    feedback: เสียงวรรณยุกต์ของ วัติ ต้องเป็นเสียงเอก หวัด
  - id: c
    text: ประ-วัด-ศา-สะ-ตระ
    feedback: อ่านตามตัวอักษรทุกตัว
  - id: d
    text: ประ-หวัด-ติ-สาด
    correct: true
    feedback: ถูก อ่านเชื่อมเสียงตามหลักคำสมาส (พจนานุกรมให้ ปฺระ-หฺวัด-สาด ได้ด้วย)
  hints:
  - คำสมาสมักออกเสียงสระท้ายคำหน้า
  - ประวัติ อ่านว่า ประ-หวัด
  solution: อ่าน **ประ-หวัด-ติ-สาด** (ออกเสียง ติ เชื่อมระหว่างคำ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.word-formation.p013
  topics:
  - thai.grammar.word-formation
  difficulty: 4
  type: numeric
  stem: จากคำต่อไปนี้ สุขภาพ · อุบัติเหตุ · พลเมือง · เทพเจ้า · ศิลปกรรม · ตู้เย็น มี **คำสมาส** กี่คำ
  answer:
    value: 3
    unit: คำ
  misconceptions:
  - match: 5
    feedback: พลเมือง และ เทพเจ้า มีคำไทยปน จึงไม่ใช่สมาส
  - match: 4
    feedback: พลเมือง อ่านเชื่อมเสียงแต่ เมือง เป็นคำไทย
  hints:
  - ทุกส่วนต้องเป็นบาลีหรือสันสกฤต
  - เมือง เจ้า ตู้ เย็น เป็นคำไทย
  solution: 'คำสมาส 3 คำ: **สุขภาพ อุบัติเหตุ ศิลปกรรม**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.word-formation.p014
  topics:
  - thai.grammar.word-formation
  difficulty: 4
  type: mcq
  stem: ชล + อุทร = **ชโลทร** ข้อใดอธิบายการเปลี่ยนเสียงได้ถูกต้อง
  choices:
  - id: a
    text: ตัดคำว่า อุทร ทิ้งทั้งคำ
    feedback: ยังเหลือ ทร ในคำ
  - id: b
    text: เสียง อะ ท้าย ชล รวมกับ อุ ต้น อุทร กลายเป็น โอ
    correct: true
    feedback: ถูก อะ + อุ → โอ
  - id: c
    text: เพิ่มการันต์บน ล
    feedback: คำสนธิไม่ใส่การันต์
  - id: d
    text: ไม่มีการเปลี่ยนเสียง
    feedback: เสียง อุ หายไปและเกิดเสียง โอ
  hints:
  - เทียบ ชล-อุทร กับ ชโล-ทร
  - สระใดหายไป สระใดเกิดขึ้น
  solution: สระสนธิ **อะ + อุ → โอ** จึงได้ ชโลทร (แม่น้ำ ทะเล ห้วงน้ำ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.word-formation.p015
  topics:
  - thai.grammar.word-formation
  difficulty: 5
  type: mcq
  stem: ชมรมต้องการคำใหม่เรียกสมาชิกที่ชอบอ่านหนังสือ ข้อใดสร้างด้วยวิธี **คำประสม** และใช้ได้เป็นธรรมชาติ
  choices:
  - id: a
    text: นักอ่าน
    correct: true
    feedback: ถูก นัก + อ่าน เหมือน นักเรียน นักร้อง
  - id: b
    text: อ่าน ๆ
    feedback: เป็นคำซ้ำ และไม่ได้เป็นคำเรียกคน
  - id: c
    text: อ่านเขียน
    feedback: เป็นการวางสองกริยาคู่กัน ไม่ได้เรียกคน
  - id: d
    text: ภาพยนตร์
    feedback: เป็นคำสมาสที่มีความหมายอื่น
  hints:
  - คำว่า นัก ใช้นำหน้าเพื่อเรียกผู้ทำสิ่งใด
  - ต้องได้คำเรียกคน
  solution: '**นักอ่าน** = นัก + อ่าน เป็นคำประสมแบบเดียวกับ นักเรียน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.grammar.word-formation.p016
  topics:
  - thai.grammar.word-formation
