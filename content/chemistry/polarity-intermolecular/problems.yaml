    solution: "ในเพชร C ยึดกับ C อีก 4 อะตอม ใช้เวเลนซ์อิเล็กตรอนครบ 4 ตัว จึงไม่มีอิเล็กตรอนอิสระ ส่วนในแกรไฟต์ C ยึดกับ C 3 อะตอมในแผ่นหกเหลี่ยม อิเล็กตรอนตัวที่ 4 เคลื่อนที่ได้ทั่วแผ่น จึงนำไฟฟ้าตามแนวแผ่น"
