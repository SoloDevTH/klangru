<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" width="520" height="370" font-family="sans-serif" font-size="14">
  <title>แผนภาพสมการบัญชีของแผงตลาดนัดสิ้นเดือน: สินทรัพย์ 37,000 บาท เท่ากับหนี้สิน 10,000 บาท บวกส่วนของเจ้าของ 27,000 บาท</title>
  <rect x="0" y="0" width="520" height="370" fill="#ffffff"/>
  <rect x="70" y="112.5" width="150" height="217.5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="145.0" y="219.2" text-anchor="middle" fill="#1f2937" font-weight="bold">เงินสด</text>
  <text x="145.0" y="237.2" text-anchor="middle" fill="#1f2937">29,000</text>
  <rect x="70" y="52.5" width="150" height="60.0" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="145.0" y="80.5" text-anchor="middle" fill="#1f2937" font-weight="bold">อุปกรณ์</text>
  <text x="145.0" y="98.5" text-anchor="middle" fill="#1f2937">8,000</text>
  <text x="145.0" y="354" text-anchor="middle" fill="#1f2937" font-weight="bold">สินทรัพย์</text>
  <text x="145.0" y="42.5" text-anchor="middle" fill="#1f2937">รวม 37,000 บาท</text>
  <rect x="300" y="255.0" width="150" height="75.0" fill="#fee2e2" stroke="#1f2937" stroke-width="1.5"/>
  <text x="375.0" y="290.5" text-anchor="middle" fill="#1f2937" font-weight="bold">หนี้สิน</text>
  <text x="375.0" y="308.5" text-anchor="middle" fill="#1f2937">10,000</text>
  <rect x="300" y="52.5" width="150" height="202.5" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="375.0" y="151.8" text-anchor="middle" fill="#1f2937" font-weight="bold">ส่วนของเจ้าของ</text>
  <text x="375.0" y="169.8" text-anchor="middle" fill="#1f2937">27,000</text>
  <text x="375.0" y="354" text-anchor="middle" fill="#1f2937" font-weight="bold">หนี้สิน + ส่วนของเจ้าของ</text>
  <text x="375.0" y="42.5" text-anchor="middle" fill="#1f2937">รวม 37,000 บาท</text>
  <text x="260.0" y="199.2" text-anchor="middle" font-size="30" font-weight="bold" fill="#1f2937">=</text>
  <line x1="40" y1="330" x2="500" y2="330" stroke="#1f2937" stroke-width="2"/>
</svg>
