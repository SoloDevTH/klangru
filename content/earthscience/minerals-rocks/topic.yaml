id: earthscience.geology.minerals-rocks
subject: earthscience
title: { th: แร่และหิน, en: "Minerals and rocks" }
summary: นิยามและกลุ่มของแร่ การตรวจสอบสมบัติเพื่อระบุแร่ หินอัคนี หินตะกอน หินแปร วัฏจักรหิน และการใช้ทรัพยากรแร่และหินที่กระจายไม่เท่ากันอย่างเหมาะสม
difficulty: 4.5
minutes: 40
prerequisites: [chemistry.matter.periodic-table]
encompasses:
  - { id: chemistry.matter.periodic-table, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ธาตุในเปลือกโลก
    src: crust-elements.svg
    alt: "กราฟแท่งร้อยละโดยมวลของธาตุในเปลือกโลก O 46.6, Si 27.7, Al 8.1, Fe 5.0, Ca 3.6, Na 2.8, K 2.6, Mg 2.1 ธาตุอื่นรวมราว 1.5"
    caption: "O และ Si มีมากที่สุด แร่ซิลิเกตจึงพบมากที่สุด (วาดโดยทีมคลังรู้ จากค่าประมาณในตำราธรณีวิทยา)"
  - type: figure
    title: มาตราความแข็งของโมส์
    src: mohs-scale.svg
    alt: "แถบความแข็ง 1 ถึง 10 จากอ่อนไปแข็ง 1 ทัลก์ 2 ยิปซัม 3 แคลไซต์ 4 ฟลูออไรต์ 5 อะพาไทต์ 6 ออร์โทเคลส 7 ควอตซ์ 8 โทแพซ 9 คอรันดัม 10 เพชร ใต้แถบมีเครื่องมือเทียบ เล็บมือ 2.5 เหรียญทองแดง 3.5 กระจกหรือมีด 5.5 ตะไบเหล็ก 6.5 ข้อความว่า แร่ที่แข็งกว่าขูดแร่ที่อ่อนกว่าให้เป็นรอยได้ ตัวเลขบอกลำดับ ไม่ใช่ปริมาณ"
    caption: "ใช้เครื่องมือรอบตัวช่วยประมาณความแข็งได้ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ระบุแร่จากผลการทดสอบ
    problem: "แร่ก้อนหนึ่งใส ไม่มีสี วาวแบบแก้ว ขูดกระจกเป็นรอย ไม่เกิดฟองกับกรด แตกเป็นรอยโค้งไม่มีแนวแตกเรียบ ความหนาแน่น $2.65\\ \\mathrm{g/cm^3}$ แร่นี้คืออะไร"
    steps:
      - text: "ขูดกระจก (5.5) เป็นรอย แปลว่าแข็งกว่า 5.5 ตัดแคลไซต์ ยิปซัม ฟลูออไรต์ออก"
      - text: "ไม่เกิดฟองกับกรด จึงไม่ใช่คาร์บอเนต"
      - text: "ไม่มีแนวแตกเรียบ แตกเป็นรอยโค้ง และความหนาแน่น 2.65 ตรงกับควอตซ์"
        why: "ออร์โทเคลสแข็ง 6 ใกล้เคียง แต่มีแนวแตกเรียบสองทิศ จึงแยกออกได้ด้วยรอยแตก"
    answer: "ควอตซ์ ($\\mathrm{SiO_2}$)"
  - { type: check, problem: earthscience.geology.minerals-rocks.p004, prompt: "เริ่มจากช่วงความแข็ง แล้วดูปฏิกิริยากับกรด" }
  - type: figure
    title: วัฏจักรหิน
    src: rock-cycle.svg
    alt: "แผนภาพวัฏจักรหิน กล่องแมกมา หินอัคนี ตะกอน หินตะกอน หินแปร ลูกศร แมกมาเย็นตัวตกผลึกเป็นหินอัคนี หินอัคนีผุพัง กร่อน พัดพาเป็นตะกอน ตะกอนทับถม อัดตัว เชื่อมประสานเป็นหินตะกอน หินตะกอนได้รับความร้อนความดันสูงเป็นหินแปร หินอัคนีได้รับความร้อนความดันโดยไม่หลอมเป็นหินแปร หินแปรหลอมละลายเป็นแมกมา หินอัคนีหลอมละลายเป็นแมกมา หินแปรยกตัวขึ้นผุพังเป็นตะกอน"
    caption: "หินเปลี่ยนประเภทได้หลายเส้นทาง แต่ละเส้นทางใช้เวลานานมาก (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: อ่านประวัติจากเนื้อหิน
    problem: "หินก้อนหนึ่งมีแถบสีอ่อนสลับสีเข้มเป็นริ้วคดโค้ง มีควอตซ์ เฟลด์สปาร์ และไมกา ผลึกมองเห็นได้ หินนี้คืออะไร และเคยผ่านอะไรมา"
    steps:
      - text: "ริ้วแถบที่แร่เรียงตัวเป็นลักษณะของหินแปรที่มีริ้วขนาน"
        why: "แร่เรียงตัวตั้งฉากกับแรงกดเมื่อได้รับความดันสูง"
      - text: "แถบสีอ่อนสลับเข้มที่ชัดและผลึกมองเห็นได้คือหินไนส์ ซึ่งแปรในระดับสูง"
      - text: "แร่ควอตซ์ เฟลด์สปาร์ และไมกาเหมือนหินแกรนิต หินเดิมจึงน่าจะเป็นหินแกรนิตหรือหินที่มีแร่คล้ายกัน"
    answer: "หินไนส์ เป็นหินแปรที่เกิดจากหินเดิม เช่น หินแกรนิต ถูกความร้อนและความดันสูงมากโดยไม่หลอม"
  - { type: check, problem: earthscience.geology.minerals-rocks.p010, prompt: "ขนาดผลึกบอกอัตราการเย็นตัว" }
  - type: simulation
    title: "ความหนาแน่น (PhET Density)"
    url: https://phet.colorado.edu/en/simulations/density
    provider: phet
    note: "ลองหามวลและปริมาตรของก้อนวัตถุจากระดับน้ำที่เพิ่มขึ้น แล้วคำนวณความหนาแน่น เป็นวิธีเดียวกับที่ใช้ระบุแร่ในห้องปฏิบัติการ"
glossary:
  - { term: แร่, definition: "ของแข็งที่เกิดเองตามธรรมชาติ เป็นอนินทรีย์ มีองค์ประกอบทางเคมีแน่นอนและโครงสร้างผลึก" }
  - { term: สีผงละเอียด, definition: "สีของผงแร่ที่ได้จากการขูดบนแผ่นกระเบื้องไม่เคลือบ คงที่กว่าสีของก้อนแร่" }
  - { term: แนวแตกเรียบ, definition: "แนวที่แร่แตกออกเป็นผิวเรียบตามระนาบในโครงสร้างผลึก" }
  - { term: หินอัคนี, definition: "หินที่เกิดจากแมกมาหรือลาวาเย็นตัวและตกผลึก" }
  - { term: หินตะกอน, definition: "หินที่เกิดจากตะกอนทับถม อัดตัว และเชื่อมประสาน หรือจากการตกผลึกของสารละลาย" }
  - { term: หินแปร, definition: "หินที่เปลี่ยนจากหินเดิมเพราะความร้อนและความดันสูงโดยไม่หลอม" }
  - { term: วัฏจักรหิน, definition: "การเปลี่ยนแปลงระหว่างหินอัคนี หินตะกอน และหินแปรผ่านกระบวนการทางธรณี" }
flashcards:
  - { front: "ทำไมสีจึงใช้ระบุแร่ได้ไม่ดี", back: "สารเจือปนเล็กน้อยเปลี่ยนสีแร่ได้ ควรใช้สีผง ความแข็ง แนวแตก และสมบัติอื่นร่วม" }
  - { front: "ผลึกใหญ่ในหินอัคนีบอกอะไร", back: "แมกมาเย็นตัวช้าใต้ผิวโลก เช่น หินแกรนิต" }
  - { front: "หินอ่อนกับหินปูน", back: "หินปูนแปรเป็นหินอ่อน ทั้งสองมีแคลไซต์ จึงเกิดฟองกับกรด" }
  - { front: "ทำไมเกลือหินพบใต้ที่ราบสูงโคราช", back: "ตกผลึกจากน้ำเค็มที่ระเหยในแอ่งโคราชและแอ่งสกลนครเมื่อหลายสิบล้านปีก่อน" }
