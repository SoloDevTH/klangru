      - { match: 50, feedback: "ดูเหมือนคิดค่าแผงแบบ ข เป็น $10$ บาทต่อแก้ว ($25\\%$) แต่ $10\\%$ ของ $40$ บาทคือ $4$ บาท" }
    solution: "แบบ ก: $18x - 500$ แบบ ข: $(40 - 4 - 22)\\,x = 14x$ ตั้ง $18x - 500 = 14x \\Rightarrow 4x = 500 \\Rightarrow x = 125$ แก้ว (กำไรทั้งสองแบบ $1{,}750$ บาท) ถ้าขายมากกว่านี้แบบเหมาจ่ายดีกว่า ถ้าขายน้อยกว่าแบบแบ่งเปอร์เซ็นต์ดีกว่า"
