<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" font-family="sans-serif" font-size="15">
  <title>ขณะรถบรรทุกชนรถจักรยานยนต์ แรงที่ทั้งสองกระทำต่อกันมีขนาดเท่ากันและทิศตรงข้ามกัน</title>
  <rect x="0" y="0" width="600" height="250" fill="#ffffff"/>
  <rect x="40.0" y="70.0" width="200.0" height="100.0" rx="6" fill="#d9e8f5" stroke="#15211e" stroke-width="2"/>
  <rect x="240.0" y="100.0" width="50.0" height="70.0" rx="6" fill="#d9e8f5" stroke="#15211e" stroke-width="2"/>
  <circle cx="80.0" cy="178.0" r="16.0" fill="#444" stroke="#15211e" stroke-width="2"/>
  <circle cx="200.0" cy="178.0" r="16.0" fill="#444" stroke="#15211e" stroke-width="2"/>
  <circle cx="262.0" cy="178.0" r="16.0" fill="#444" stroke="#15211e" stroke-width="2"/>
  <text x="120.0" y="125.0" fill="#15211e" font-size="15" text-anchor="middle">รถบรรทุก</text>
  <text x="120.0" y="147.0" fill="#15211e" font-size="13" text-anchor="middle">m = 6000 kg</text>
  <rect x="296.0" y="110.0" width="90.0" height="50.0" rx="8" fill="#fde9d9" stroke="#15211e" stroke-width="2"/>
  <circle cx="310.0" cy="172.0" r="14.0" fill="#444" stroke="#15211e" stroke-width="2"/>
  <circle cx="372.0" cy="172.0" r="14.0" fill="#444" stroke="#15211e" stroke-width="2"/>
  <text x="341.0" y="100.0" fill="#15211e" font-size="13" text-anchor="middle">จักรยานยนต์</text>
  <text x="341.0" y="140.0" fill="#15211e" font-size="13" text-anchor="middle">150 kg</text>
  <line x1="293.0" y1="60.0" x2="391.0" y2="60.0" stroke="#b3261e" stroke-width="3.4" stroke-linecap="butt"/>
  <polygon points="403.0,60.0 391.0,65.4 391.0,54.6" fill="#b3261e"/>
  <text x="411.0" y="65.0" fill="#b3261e" font-size="14" text-anchor="start">F บนจักรยานยนต์</text>
  <line x1="293.0" y1="60.0" x2="195.0" y2="60.0" stroke="#1f5fa8" stroke-width="3.4" stroke-linecap="butt"/>
  <polygon points="183.0,60.0 195.0,54.6 195.0,65.4" fill="#1f5fa8"/>
  <text x="175.0" y="65.0" fill="#1f5fa8" font-size="14" text-anchor="end">F บนรถบรรทุก</text>
  <line x1="293.0" y1="46.0" x2="293.0" y2="200.0" stroke="#6b7672" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text x="300.0" y="230.0" fill="#15211e" font-size="14" text-anchor="middle">แรงเท่ากัน แต่ความเร่ง a = F/m ของจักรยานยนต์มากกว่า 40 เท่า</text>
</svg>
