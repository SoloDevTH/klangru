- id: science.inquiry.data-analysis.p016
  topics:
  - science.inquiry.data-analysis
  difficulty: 5
  type: numeric
  stem: จับเวลาลูกตุ้มแกว่ง 10 รอบได้ 2.31, 2.45 และ 2.38 s (ค่าเฉลี่ย 2.38 s) ความไม่แน่นอนโดยประมาณ (± ครึ่งหนึ่งของพิสัย) เท่ากี่วินาที
  answer:
    value: 0.07
    tolerance: 0.004
    unit: s
  misconceptions:
  - match: 0.14
    feedback: นี่คือพิสัยทั้งหมด ต้องหารด้วย 2
  - match: 2.38
    feedback: นี่คือค่าเฉลี่ย ไม่ใช่ความไม่แน่นอน
  hints:
  - 'หาพิสัยก่อน: ค่ามากที่สุด − ค่าน้อยที่สุด'
  - แล้วหารด้วย 2
  solution: พิสัย $= 2.45 - 2.31 = 0.14$ s ความไม่แน่นอน $= \frac{0.14}{2} = 0.07$ s จึงรายงาน $2.38 \pm 0.07$ s (ลูกตุ้มดูเพิ่มใน [การเคลื่อนที่แบบฮาร์มอนิกอย่างง่าย](/topic/physics.waves.shm/))
