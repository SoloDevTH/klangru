problems:
  - id: biology.plants.reproduction-growth.p001
    topics: [biology.plants.reproduction-growth]
    difficulty: 1
    type: mcq
    stem: "ต้นมะม่วงที่ออกดอกออกผลในสวน อยู่ในรุ่นใดของวัฏจักรชีวิตแบบสลับ"
    choices:
      - { id: a, text: "รุ่นสปอโรไฟต์ (2n)", correct: true }
      - { id: b, text: "รุ่นแกมีโทไฟต์ (n)", feedback: "แกมีโทไฟต์ของพืชดอกเล็กมาก คือละอองเรณูและถุงเอ็มบริโอที่อยู่ในดอก" }
      - { id: c, text: "เป็นทั้งสองรุ่นพร้อมกันทั้งต้น", feedback: "ต้นที่เราเห็นเป็นรุ่นเดียว แกมีโทไฟต์อาศัยอยู่ในดอกของต้นนั้น" }
      - { id: d, text: "ไม่มีวัฏจักรชีวิตแบบสลับ", feedback: "พืชทุกชนิดรวมทั้งพืชดอกมีวัฏจักรชีวิตแบบสลับ" }
    hints:
      - "เซลล์ของลำต้นและใบมีโครโมโซมกี่ชุด"
      - "รุ่นที่สร้างสปอร์ด้วยไมโอซิสคือรุ่นใด"
    solution: "ต้นมะม่วงที่เห็นเป็นสปอโรไฟต์ (2n) ซึ่งสร้างสปอร์ด้วยไมโอซิสในดอก ส่วนแกมีโทไฟต์คือละอองเรณูและถุงเอ็มบริโอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-growth.p002
    topics: [biology.plants.reproduction-growth]
    difficulty: 1
    type: text
    stem: "เนื้อเยื่อสะสมอาหารในเมล็ดข้าวที่มีโครโมโซม 3 ชุด (3n) เรียกว่าอะไร"
    accepted: ["เอนโดสเปิร์ม", "เอ็นโดสเปิร์ม", "endosperm"]
    hints:
      - "เกิดจากสเปิร์มรวมกับโพลาร์นิวคลีไอ 2 นิวเคลียส"
      - "ข้าวสวยที่เรากินคือส่วนนี้"
    misconceptions:
      - { match: "ใบเลี้ยง", feedback: "ใบเลี้ยงเป็นส่วนของเอ็มบริโอซึ่งเป็น 2n" }
      - { match: "เอ็มบริโอ", feedback: "เอ็มบริโอเกิดจากไซโกต จึงเป็น 2n" }
    solution: "เอนโดสเปิร์ม เกิดจากสเปิร์ม (n) รวมกับโพลาร์นิวคลีไอ 2 นิวเคลียส (n + n) จึงเป็น 3n"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-growth.p003
    topics: [biology.plants.reproduction-growth]
    difficulty: 1
    type: match
    stem: "จับคู่ส่วนของดอกหรือออวุลกับส่วนที่เจริญไปเป็น"
    pairs:
      - { left: "ไซโกต", right: "เอ็มบริโอ" }
      - { left: "เยื่อหุ้มออวุล", right: "เปลือกเมล็ด" }
      - { left: "ผนังรังไข่", right: "เปลือกผล" }
      - { left: "ออวุล", right: "เมล็ด" }
    hints:
      - "รังไข่ทั้งรังไข่กลายเป็นผล ส่วนออวุลข้างในกลายเป็นเมล็ด"
      - "เปลือกที่หุ้มเมล็ดมาจากส่วนที่หุ้มออวุล"
    solution: "ไซโกต → เอ็มบริโอ เยื่อหุ้มออวุล → เปลือกเมล็ด ผนังรังไข่ → เปลือกผล และออวุล → เมล็ด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-growth.p004
    topics: [biology.plants.reproduction-growth]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการสร้างสเปิร์มของพืชดอก"
    items:
      - "เซลล์แม่ของไมโครสปอร์ (2n) ในอับเรณู"
      - "ไมโอซิส ได้ไมโครสปอร์ 4 เซลล์ (n)"
      - "ไมโทซิส ได้ละอองเรณูที่มีเซลล์ทิวบ์และเจเนอเรทีฟเซลล์"
      - "เจเนอเรทีฟเซลล์แบ่งแบบไมโทซิส"
      - "ได้สเปิร์ม 2 เซลล์"
    hints:
      - "ไมโอซิสเกิดก่อน เพื่อลดจำนวนโครโมโซม"
      - "สเปิร์มเกิดจากการแบ่งของเจเนอเรทีฟเซลล์"
    solution: "เซลล์แม่ไมโครสปอร์ → ไมโอซิส ได้ไมโครสปอร์ 4 เซลล์ → ไมโทซิส ได้ละอองเรณู → เจเนอเรทีฟเซลล์แบ่ง → สเปิร์ม 2 เซลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-growth.p005
    topics: [biology.plants.reproduction-growth]
    difficulty: 2
    type: numeric
    stem: "ข้าวมีโครโมโซม 2n = 24 เซลล์ของเอนโดสเปิร์มข้าวมีโครโมโซมกี่แท่ง"
    answer: { value: 36, unit: แท่ง }
    hints:
      - "หาจำนวนโครโมโซมหนึ่งชุด (n) ก่อน"
      - "เอนโดสเปิร์มมีโครโมโซม 3 ชุด"
    misconceptions:
      - { match: 24, feedback: "24 คือ 2n ของเซลล์ร่างกายและเอ็มบริโอ เอนโดสเปิร์มเป็น 3n" }
      - { match: 72, feedback: "คูณ 24 ด้วย 3 แต่ 24 เป็น 2 ชุดแล้ว ต้องใช้ n = 12" }
    solution: "$n = 24 \\div 2 = 12$ เอนโดสเปิร์มเป็น 3n $= 3 \\times 12 = 36$ แท่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-growth.p006
    topics: [biology.plants.reproduction-growth]
    difficulty: 2
    type: numeric
    stem: "ในอับเรณูมีเซลล์แม่ของไมโครสปอร์ 25 เซลล์ ถ้าเจริญครบทุกเซลล์ จะได้ละอองเรณูกี่เม็ด"
    answer: { value: 100, unit: เม็ด }
    hints:
      - "เซลล์แม่ 1 เซลล์แบ่งแบบไมโอซิสได้กี่เซลล์"
      - "ไมโครสปอร์ 1 เซลล์เจริญเป็นละอองเรณู 1 เม็ด"
    misconceptions:
      - { match: 25, feedback: "ไมโอซิสได้ 4 เซลล์จากเซลล์แม่ 1 เซลล์ ต้องคูณ 4" }
      - { match: 200, feedback: "200 คือจำนวนสเปิร์ม (ละอองเรณูละ 2) โจทย์ถามจำนวนละอองเรณู" }
    solution: "เซลล์แม่ 1 เซลล์ได้ไมโครสปอร์ 4 เซลล์ ซึ่งเจริญเป็นละอองเรณู 4 เม็ด จึงได้ $25 \\times 4 = 100$ เม็ด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-growth.p007
    topics: [biology.plants.reproduction-growth]
    difficulty: 2
    type: mcq
    stem: "เกษตรกรหว่านเมล็ดถั่วเขียวในแปลงที่มีน้ำท่วมขังหลายวัน เมล็ดส่วนใหญ่ไม่งอกและเน่า สาเหตุหลักคืออะไร"
    choices:
      - { id: a, text: "เมล็ดขาดแก๊สออกซิเจนสำหรับการหายใจระดับเซลล์", correct: true }
      - { id: b, text: "เมล็ดได้น้ำน้อยเกินไป", feedback: "แปลงน้ำท่วมขัง เมล็ดได้น้ำมากเกินพอ" }
      - { id: c, text: "เมล็ดไม่ได้รับแสง", feedback: "เมล็ดถั่วเขียวงอกในที่มืดได้ แสงไม่ใช่ปัจจัยหลัก" }
      - { id: d, text: "น้ำทำให้เมล็ดเกิดสภาพพักตัว", feedback: "ถั่วเขียวไม่ได้พักตัวเพราะน้ำ ปัญหาคือขาดแก๊สที่ใช้หายใจ" }
    hints:
      - "การงอกต้องใช้พลังงานมาก"
      - "พลังงานได้จากกระบวนการใด ซึ่งต้องใช้แก๊สอะไร"
    solution: "การงอกใช้พลังงานจากการหายใจระดับเซลล์ซึ่งต้องใช้ออกซิเจน ดินที่น้ำขังมีออกซิเจนน้อย เมล็ดจึงงอกไม่ได้และเน่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-growth.p008
    topics: [biology.plants.reproduction-growth]
    difficulty: 3
    type: numeric
    stem: "ถุงเอ็มบริโอที่เจริญเต็มที่ของพืชดอกส่วนใหญ่ประกอบด้วยเซลล์กี่เซลล์"
    answer: { value: 7, unit: เซลล์ }
    hints:
      - "นับเซลล์ไข่ ซินเนอร์จิด แอนติโพดัล และเซลล์กลาง"
      - "โพลาร์นิวคลีไอ 2 นิวเคลียสอยู่ในเซลล์กลางเซลล์เดียว"
    misconceptions:
      - { match: 8, feedback: "8 คือจำนวนนิวเคลียส แต่โพลาร์นิวคลีไอ 2 นิวเคลียสอยู่ในเซลล์เดียวกัน" }
      - { match: 4, feedback: "4 คือจำนวนเมกะสปอร์ที่ได้จากไมโอซิส ยังไม่ใช่ถุงเอ็มบริโอ" }
    solution: "เซลล์ไข่ 1 + ซินเนอร์จิด 2 + แอนติโพดัล 3 + เซลล์กลาง 1 (มี 2 นิวเคลียส) = 7 เซลล์ 8 นิวเคลียส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-growth.p009
    topics: [biology.plants.reproduction-growth]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเปรียบเทียบการสร้างเซลล์สืบพันธุ์เพศผู้กับเพศเมียของพืชดอกได้ถูกต้อง"
    choices:
      - { id: a, text: "ไมโครสปอร์ทั้ง 4 เซลล์เจริญต่อ แต่เมกะสปอร์เหลือเจริญต่อเพียง 1 ใน 4 เซลล์", correct: true }
      - { id: b, text: "เพศผู้ใช้ไมโทซิส เพศเมียใช้ไมโอซิส", feedback: "ทั้งสองเพศเริ่มด้วยไมโอซิส แล้วตามด้วยไมโทซิส" }
      - { id: c, text: "ละอองเรณูหนึ่งเม็ดมีสเปิร์ม 1 เซลล์ ถุงเอ็มบริโอมีเซลล์ไข่ 2 เซลล์", feedback: "ละอองเรณูสร้างสเปิร์ม 2 เซลล์ และถุงเอ็มบริโอมีเซลล์ไข่ 1 เซลล์" }
      - { id: d, text: "เมกะสปอร์แบ่งแบบไมโทซิส 1 ครั้ง ไมโครสปอร์แบ่ง 3 ครั้ง", feedback: "กลับกัน เมกะสปอร์แบ่งนิวเคลียส 3 ครั้ง" }
    hints:
      - "เซลล์แม่ 1 เซลล์ของแต่ละเพศได้ผลสุดท้ายกี่หน่วย"
      - "เมกะสปอร์ 3 ใน 4 เซลล์เป็นอย่างไร"
    solution: "ทั้งสองเพศเริ่มด้วยไมโอซิสได้ 4 เซลล์ ไมโครสปอร์ทั้ง 4 เจริญเป็นละอองเรณู ส่วนเมกะสปอร์สลายไป 3 เหลือ 1 ซึ่งแบ่งนิวเคลียส 3 ครั้งเป็นถุงเอ็มบริโอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-growth.p010
    topics: [biology.plants.reproduction-growth]
    difficulty: 3
    type: match
    stem: "จับคู่ส่วนของพืชที่คนไทยใช้ประโยชน์กับโครงสร้างที่มาของส่วนนั้น"
    pairs:
      - { left: "ข้าวสวย", right: "เอนโดสเปิร์มของผลข้าว" }
      - { left: "ใยมะพร้าวที่ใช้ทำเชือกและวัสดุปลูก", right: "ผนังผลชั้นกลางของมะพร้าว" }
      - { left: "เนื้อมะม่วงสุก", right: "ผนังผลชั้นกลางที่อวบน้ำของมะม่วง" }
      - { left: "ถั่วลิสงที่กะเทาะเปลือกแล้ว", right: "ใบเลี้ยงที่สะสมอาหาร" }
      - { left: "ปุยฝ้าย", right: "ขนที่เจริญจากเปลือกเมล็ด" }
    hints:
      - "พืชใบเลี้ยงเดี่ยวสะสมอาหารในเอนโดสเปิร์ม ถั่วสะสมในใบเลี้ยง"
      - "ผนังผลมีสามชั้น ชั้นกลางอาจเป็นเนื้อหรือเป็นเส้นใย"
    solution: "ข้าวสวยคือเอนโดสเปิร์ม ใยมะพร้าวคือผนังผลชั้นกลางที่เป็นเส้นใย เนื้อมะม่วงคือผนังผลชั้นกลางที่อวบน้ำ เมล็ดถั่วลิสงส่วนใหญ่คือใบเลี้ยง และปุยฝ้ายคือขนบนเปลือกเมล็ด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-growth.p011
    topics: [biology.plants.reproduction-growth]
    difficulty: 3
    type: mcq
    stem: "เมื่อเพาะถั่วเขียว ใบเลี้ยงถูกชูขึ้นมาเหนือดิน แต่เมื่อเพาะข้าวโพด ส่วนที่เก็บอาหารยังอยู่ใต้ดิน ความแตกต่างนี้เกิดจากอะไร"
    choices:
      - { id: a, text: "ถั่วเขียวมีไฮโพคอทิลยืดยาว ส่วนข้าวโพดมีเอพิคอทิลยืดยาว", correct: true }
      - { id: b, text: "ถั่วเขียวไม่มีราก จึงลอยขึ้นมา", feedback: "ถั่วเขียวมีรากแรกเกิดงอกออกมาก่อนเช่นเดียวกับพืชอื่น" }
      - { id: c, text: "ข้าวโพดถูกฝังลึกกว่าเสมอ", feedback: "แม้ฝังที่ความลึกเท่ากัน ส่วนที่ยืดยาวต่างกันก็ทำให้ผลต่างกัน" }
      - { id: d, text: "ใบเลี้ยงของข้าวโพดหนักกว่า", feedback: "ความต่างมาจากส่วนของลำต้นอ่อนที่ยืดยาว ไม่ใช่น้ำหนัก" }
    hints:
      - "ลำต้นอ่อนส่วนใต้ใบเลี้ยงและเหนือใบเลี้ยงมีชื่อต่างกัน"
      - "ถ้าส่วนใต้ใบเลี้ยงยืดยาว ใบเลี้ยงจะถูกดันไปทางใด"
    solution: "ในถั่วเขียว ไฮโพคอทิล (ใต้ใบเลี้ยง) ยืดยาวและโค้งดันใบเลี้ยงขึ้นเหนือดิน ส่วนในข้าวโพด เอพิคอทิล (เหนือใบเลี้ยง) ยืดยาว ส่วนที่เก็บอาหารจึงอยู่ใต้ดิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-growth.p012
    topics: [biology.plants.reproduction-growth]
    difficulty: 3
    type: numeric
    stem: "จากกราฟร้อยละการงอกของเมล็ดมะขาม ชุด ข. แช่น้ำร้อนก่อนเพาะ งอกสะสมได้ร้อยละเท่าใดในวันที่ 10"
    figure: { src: p-germination.svg, alt: "กราฟร้อยละการงอกสะสมกับเวลาหลังเพาะ 0 ถึง 14 วัน เพาะชุดละ 50 เมล็ด เส้นทึบสีแดง ข. แช่น้ำร้อนก่อนเพาะ ที่วัน 0 2 4 6 8 10 12 14 เป็น 0 10 36 60 74 82 86 88 เส้นประสีน้ำเงิน ก. ไม่แช่ (ชุดควบคุม) ที่วันเดียวกันเป็น 0 0 2 4 6 8 10 12" }
    answer: { value: 82, tolerance: 1, unit: "%" }
    hints:
      - "หาเส้นของชุด ข. (เส้นทึบ)"
      - "อ่านค่าบนแกนตั้งที่วันที่ 10"
    misconceptions:
      - { match: 8, feedback: "นี่คือค่าของชุดควบคุม (เส้นประ) ที่วันที่ 10" }
      - { match: 88, feedback: "นี่คือค่าที่วันที่ 14" }
    solution: "ที่วันที่ 10 เส้นของชุด ข. อยู่ที่ร้อยละ 82 ($41$ จาก 50 เมล็ด)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.reproduction-growth.p013
    topics: [biology.plants.reproduction-growth]
    difficulty: 4
    type: mcq
