  ai_assisted: true
- id: english.speaking.presentations.p017
  topics:
  - english.speaking.presentations
  difficulty: 5
  type: order
  stem: เรียงประโยคของการนำเสนอเรื่องแก้วน้ำในโรงอาหารของโรงเรียนให้เป็นลำดับที่ถูกต้อง
  items:
  - Good afternoon. Today I'll argue that our canteen should switch to reusable cups.
  - There are two main reasons for this.
  - First of all, reusable cups would cut the plastic waste from the canteen every day.
  - Let me give you an example. During a one-week trial at one drinks stall, we used 200 fewer plastic cups.
  - Moving on to my second point, students would learn to care about what they throw away.
  - What's really important is that this habit stays with them after they leave school.
  - To sum up, reusable cups cut waste and build good habits, so we should start next term. Thank you for listening.
  hints:
  - เริ่มด้วยการทักทายและบอกข้อเสนอ แล้วบอกจำนวนเหตุผล
  - ตัวอย่างเรื่องแก้วพลาสติกที่ลดลงสนับสนุนเหตุผลข้อแรก ส่วน this habit อ้างถึงเหตุผลข้อที่สอง
  solution: ลำดับคือ ทักทายและบอกข้อเสนอ → บอกจำนวนเหตุผล → เหตุผลที่ 1 (ลดขยะ) → ตัวอย่างประกอบเหตุผลที่ 1 → เหตุผลที่ 2 (นิสัยที่ดี) → เน้นประเด็นสำคัญของเหตุผลที่ 2 → สรุปและขอบคุณ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.speaking.presentations.p018
  topics:
  - english.speaking.presentations
  difficulty: 5
  type: text
  stem: 'เติมวลีบอกทิศทางที่ใช้เปิดส่วนสรุปปิด: *___, the school can recycle much more than it does now.*'
  accepted:
  - To sum up
  - In conclusion
  misconceptions:
  - match: First of all
    feedback: First of all ใช้ตอนเริ่มประเด็นแรก ไม่ใช่ตอนสรุป
  - match: Let me give you an example
    feedback: วลีนี้ใช้ตอนยกตัวอย่าง ไม่ใช่ตอนสรุป
  hints:
  - วลีนี้ใช้ตอนใกล้จบเมื่อต้องการทบทวนประเด็นทั้งหมด
  - ขึ้นต้นด้วย To หรือ In
  solution: '*To sum up,* the school can recycle much more than it does now. หรือ *In conclusion,* ... ก็ได้'
