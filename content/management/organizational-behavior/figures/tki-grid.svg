<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="sans-serif" font-size="14">
<title>รูปแบบการจัดการความขัดแย้งห้าแบบตามระดับการยืนยันความต้องการของตนและความร่วมมือ</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="640" height="520" fill="#ffffff"/>
<text x="320.0" y="32.0" text-anchor="middle" font-size="16" fill="#222" font-weight="bold" >ห้ารูปแบบการจัดการความขัดแย้ง</text>
<line x1="110.0" y1="440.0" x2="590.0" y2="440.0" stroke="#222" stroke-width="1.5" marker-end="url(#ahk)" />
