<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Noto Sans Thai',sans-serif">
<title>ช่องลำดับคำภาษาจีน ประธาน เวลา คำวิเศษณ์ สถานที่ กริยา กรรม เทียบกับภาษาไทย</title>
<defs></defs>
<rect x="0" y="0" width="740" height="400" fill="#fff"/>
<text x="370.0" y="30.0" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ลำดับคำ: เวลาและสถานที่อยู่หน้ากริยา</text>
<rect x="30.0" y="60.0" width="90.0" height="42.0" rx="8" fill="#e6dcf5" stroke="#5b3a8c" stroke-width="2"/>
<text x="75.0" y="87.0" font-size="15" text-anchor="middle" fill="#5b3a8c" font-weight="bold">ประธาน</text>
<rect x="30.0" y="110.0" width="90.0" height="52.0" rx="8" fill="#fff" stroke="#5b3a8c" stroke-width="2"/>
<text x="75.0" y="145.0" font-size="24" text-anchor="middle" fill="#1a1a1a" font-weight="normal">我们</text>
<rect x="132.0" y="60.0" width="90.0" height="42.0" rx="8" fill="#fbf0c0" stroke="#7a5a00" stroke-width="2"/>
<text x="177.0" y="87.0" font-size="15" text-anchor="middle" fill="#7a5a00" font-weight="bold">เวลา</text>
<rect x="132.0" y="110.0" width="90.0" height="52.0" rx="8" fill="#fff" stroke="#7a5a00" stroke-width="2"/>
<text x="177.0" y="145.0" font-size="24" text-anchor="middle" fill="#1a1a1a" font-weight="normal">下午</text>
<rect x="234.0" y="60.0" width="90.0" height="42.0" rx="8" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="279.0" y="87.0" font-size="15" text-anchor="middle" fill="#1f4e9c" font-weight="bold">也 / 都</text>
<rect x="234.0" y="110.0" width="90.0" height="52.0" rx="8" fill="#fff" stroke="#1f4e9c" stroke-width="2"/>
<text x="279.0" y="145.0" font-size="24" text-anchor="middle" fill="#1a1a1a" font-weight="normal">都</text>
<rect x="336.0" y="60.0" width="150.0" height="42.0" rx="8" fill="#dcefd6" stroke="#2a6a2a" stroke-width="2"/>
<text x="411.0" y="87.0" font-size="15" text-anchor="middle" fill="#2a6a2a" font-weight="bold">在 + สถานที่</text>
<rect x="336.0" y="110.0" width="150.0" height="52.0" rx="8" fill="#fff" stroke="#2a6a2a" stroke-width="2"/>
<text x="411.0" y="145.0" font-size="24" text-anchor="middle" fill="#1a1a1a" font-weight="normal">在图书馆</text>
<rect x="498.0" y="60.0" width="80.0" height="42.0" rx="8" fill="#fbe0dc" stroke="#b3261e" stroke-width="2"/>
<text x="538.0" y="87.0" font-size="15" text-anchor="middle" fill="#b3261e" font-weight="bold">กริยา</text>
<rect x="498.0" y="110.0" width="80.0" height="52.0" rx="8" fill="#fff" stroke="#b3261e" stroke-width="2"/>
<text x="538.0" y="145.0" font-size="24" text-anchor="middle" fill="#1a1a1a" font-weight="normal">看</text>
<rect x="590.0" y="60.0" width="80.0" height="42.0" rx="8" fill="#fbe0dc" stroke="#b3261e" stroke-width="2"/>
<text x="630.0" y="87.0" font-size="15" text-anchor="middle" fill="#b3261e" font-weight="bold">กรรม</text>
<rect x="590.0" y="110.0" width="80.0" height="52.0" rx="8" fill="#fff" stroke="#b3261e" stroke-width="2"/>
<text x="630.0" y="145.0" font-size="24" text-anchor="middle" fill="#1a1a1a" font-weight="normal">书</text>
<text x="370.0" y="190.0" font-size="17" text-anchor="middle" fill="#666" font-weight="normal">Wǒmen xiàwǔ dōu zài túshūguǎn kàn shū.</text>
<text x="30.0" y="240.0" font-size="17" text-anchor="start" fill="#1a1a1a" font-weight="bold">ภาษาไทย:</text>
<rect x="120.0" y="215.0" width="80.0" height="40.0" rx="8" fill="#fff" stroke="#5b3a8c" stroke-width="2"/>
<text x="160.0" y="242.0" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="normal">พวกเรา</text>
<rect x="210.0" y="215.0" width="70.0" height="40.0" rx="8" fill="#fff" stroke="#1f4e9c" stroke-width="2"/>
<text x="245.0" y="242.0" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ทุกคน</text>
<rect x="290.0" y="215.0" width="60.0" height="40.0" rx="8" fill="#fff" stroke="#b3261e" stroke-width="2"/>
<text x="320.0" y="242.0" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="normal">อ่าน</text>
<rect x="360.0" y="215.0" width="80.0" height="40.0" rx="8" fill="#fff" stroke="#b3261e" stroke-width="2"/>
<text x="400.0" y="242.0" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="normal">หนังสือ</text>
<rect x="450.0" y="215.0" width="110.0" height="40.0" rx="8" fill="#fff" stroke="#2a6a2a" stroke-width="2"/>
<text x="505.0" y="242.0" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ที่ห้องสมุด</text>
<rect x="570.0" y="215.0" width="90.0" height="40.0" rx="8" fill="#fff" stroke="#7a5a00" stroke-width="2"/>
<text x="615.0" y="242.0" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ตอนบ่าย</text>
<rect x="30.0" y="290.0" width="680.0" height="90.0" rx="10" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="370.0" y="318.0" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ภาษาไทยวางเวลาและสถานที่ไว้ท้ายประโยคได้</text>
<text x="370.0" y="344.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ภาษาจีนต้องวางไว้ก่อนกริยา (เวลาวางหน้าประธานได้: 下午我们都在图书馆看书。)</text>
<text x="370.0" y="368.0" font-size="15" text-anchor="middle" fill="#1f4e9c" font-weight="bold">也 都 อยู่หลังประธาน หน้ากริยา ถ้ามีทั้งคู่ใช้ 也都</text>
</svg>
