    stem: "ภูมิกับเพื่อนอายุ 10 ปีอีก 3 คน วางแผนปั่นจักรยานไปเล่นน้ำที่ฝายในทุ่งนาวันเสาร์ โดยไม่บอกผู้ปกครองเพราะกลัวไม่ให้ไป ข้อใดเป็นการปรับแผนที่ปลอดภัย (เลือกทุกข้อที่ถูก)"
    choices:
