problems:
  - id: math.measure.weight.p001
    topics: [math.measure.weight]
    difficulty: 1
    type: mcq
    stem: "ดูตาชั่งในภาพ ผลไม้ใดหนักกว่า"
    figure: { src: balance.svg, alt: "ตาชั่งสองแขน คานเอียง จานด้านซ้ายมีมะม่วงและลดต่ำลง จานด้านขวามีส้มและยกสูงขึ้น" }
    choices:
      - { id: a, text: "มะม่วง", correct: true }
      - { id: b, text: "ส้ม", feedback: "จานของส้มยกสูงขึ้น แปลว่าส้มเบากว่า" }
      - { id: c, text: "หนักเท่ากัน", feedback: "ถ้าหนักเท่ากัน คานจะอยู่ในแนวระดับ แต่คานในภาพเอียง" }
    hints:
      - "ดูว่าจานข้างไหนลดต่ำลง"
      - "ของที่หนักกว่ากดจานให้ต่ำลง"
    solution: "จานที่มีมะม่วงลดต่ำลง มะม่วงจึงหนักกว่าส้ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.weight.p002
    topics: [math.measure.weight]
    difficulty: 1
    type: numeric
    stem: "1 กิโลกรัม เท่ากับกี่ขีด"
    answer: { value: 10, unit: ขีด }
    hints:
      - "1 ขีด = 100 กรัม"
      - "1 กิโลกรัม = 1,000 กรัม มี 100 กรัมกี่ครั้ง"
    misconceptions:
      - { match: 100, feedback: "100 คือจำนวนกรัมใน 1 ขีด ไม่ใช่จำนวนขีดใน 1 กิโลกรัม" }
      - { match: 1000, feedback: "1,000 คือจำนวนกรัมใน 1 กิโลกรัม โจทย์ถามเป็นขีด" }
    solution: "1 กิโลกรัม = 1,000 กรัม = 100 กรัม 10 ครั้ง จึงเท่ากับ 10 ขีด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.weight.p003
    topics: [math.measure.weight]
    difficulty: 2
    type: numeric
    stem: "3 กิโลกรัม เท่ากับกี่กรัม"
    answer: { value: 3000, unit: g }
    hints:
      - "1 กิโลกรัม = 1,000 กรัม"
      - "1,000 สามครั้ง"
    misconceptions:
      - { match: 300, feedback: "ใช้ 1 กิโลกรัม = 100 กรัม แต่ 100 กรัมคือ 1 ขีด" }
      - { match: 30, feedback: "30 คือจำนวนขีด (3 กิโลกรัม = 30 ขีด) โจทย์ถามเป็นกรัม" }
    solution: "$3$ กิโลกรัม $= 1{,}000 + 1{,}000 + 1{,}000 = 3{,}000$ กรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.weight.p004
    topics: [math.measure.weight]
    difficulty: 2
    type: match
    stem: "จับคู่สิ่งที่ชั่งกับหน่วยที่เหมาะที่สุด"
    pairs:
      - { left: "ช้าง 1 เชือก", right: "เมตริกตัน" }
      - { left: "ข้าวสาร 1 ถุงใหญ่", right: "กิโลกรัม" }
      - { left: "หมูสับที่แม่ซื้อทำกับข้าวมื้อเดียว", right: "ขีด" }
      - { left: "เหรียญ 1 บาท", right: "กรัม" }
    hints:
      - "ของยิ่งหนักใช้หน่วยยิ่งใหญ่"
      - "กรัม < ขีด < กิโลกรัม < เมตริกตัน"
    solution: "ช้างหนักหลายพันกิโลกรัมใช้เมตริกตัน ข้าวสารใช้กิโลกรัม หมูสับซื้อทีละไม่กี่ขีด เหรียญเบามากใช้กรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.weight.p005
    topics: [math.measure.weight]
    difficulty: 2
    type: match
    stem: "จับคู่งานกับเครื่องชั่งที่เหมาะสม"
    pairs:
      - { left: "ชั่งน้ำหนักตัวของนักเรียน", right: "เครื่องชั่งน้ำหนักตัว" }
      - { left: "ชั่งผักผลไม้ที่แผงในตลาด", right: "เครื่องชั่งสปริงแบบจาน" }
      - { left: "ชั่งรถบรรทุกอ้อยที่ด่านชั่ง", right: "เครื่องชั่งรถบรรทุก" }
      - { left: "ชั่งผงฟู 5 กรัมทำขนม", right: "เครื่องชั่งดิจิทัลในครัว" }
    hints:
      - "เครื่องชั่งต้องชั่งได้หนักพอ"
      - "ของเบามากต้องใช้เครื่องชั่งที่ละเอียดถึงกรัม"
    solution: "คนยืนบนเครื่องชั่งน้ำหนักตัว ผักผลไม้ใช้เครื่องชั่งสปริงแบบจาน รถบรรทุกหนักเป็นตันใช้เครื่องชั่งรถบรรทุก ผงฟูไม่กี่กรัมใช้เครื่องชั่งดิจิทัลที่ละเอียด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.weight.p006
    topics: [math.measure.weight]
    difficulty: 2
    type: numeric
    stem: "อ่านน้ำหนักจากเครื่องชั่งในภาพ ของหนักกี่กรัม (ตอบในหน่วยกรัม)"
    figure: { src: dial-problem.svg, alt: "หน้าปัดเครื่องชั่ง ตัวเลข 0, 1, 2 กิโลกรัมเรียงตามเข็มนาฬิกาเริ่มจาก 0 ด้านบน ระหว่างตัวเลขติดกันแบ่งเป็น 10 ช่องเท่ากัน มีขีดยาวขึ้นที่ช่องที่ 5 เข็มสีแดงชี้เลยเลข 1 ไป 6 ช่อง" }
    answer: { value: 1600, unit: g }
    hints:
      - "ระหว่าง 1 กับ 2 กิโลกรัมแบ่งเป็น 10 ช่อง ช่องละกี่กรัม"
      - "1 ช่อง = 100 กรัม เข็มเลย 1 กิโลกรัมไปกี่ช่อง"
    misconceptions:
      - { match: 1006, feedback: "นับช่องละ 1 กรัม แต่ 1 ช่องคือ 100 กรัม (1 ขีด)" }
      - { match: 16, feedback: "16 คือจำนวนขีด โจทย์ให้ตอบเป็นกรัม" }
    solution: "1 ช่อง = $1{,}000 \\div 10 = 100$ กรัม เข็มเลย 1 กิโลกรัมไป 6 ช่อง ได้ $1{,}000 + 600 = 1{,}600$ กรัม (1 กิโลกรัม 6 ขีด)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.weight.p007
    topics: [math.measure.weight]
    difficulty: 2
    type: mcq
    stem: "ไข่ไก่ 1 ฟอง หนักประมาณเท่าใด"
    choices:
      - { id: a, text: "60 กรัม", correct: true }
      - { id: b, text: "6 กรัม", feedback: "6 กรัมเบาประมาณเหรียญ 1 บาท 2 เหรียญ ไข่ไก่หนักกว่านั้นมาก" }
      - { id: c, text: "600 กรัม", feedback: "600 กรัมคือ 6 ขีด หนักประมาณน้ำดื่ม 1 ขวดขนาด 600 มิลลิลิตร ไข่ไก่เบากว่านั้นมาก" }
      - { id: d, text: "6 กิโลกรัม", feedback: "6 กิโลกรัมหนักกว่าข้าวสารถุงใหญ่ ไข่ไก่ 1 ฟองเบากว่านั้นมาก" }
    hints:
      - "ไข่ไก่ 1 แผงมี 30 ฟอง หนักประมาณ 2 กิโลกรัม"
      - "ไข่ 1 ฟองหนักไม่ถึง 1 ขีด"
    solution: "ไข่ไก่ฟองหนึ่งหนักประมาณ 50–70 กรัม คำตอบที่ใกล้ที่สุดคือ 60 กรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.weight.p008
    topics: [math.measure.weight]
    difficulty: 3
    type: numeric
    stem: "แม่ซื้อหมูสับ 3 ขีด และกุ้ง 5 ขีด แม่ซื้อของรวมกี่กรัม (ตอบในหน่วยกรัม)"
    answer: { value: 800, unit: g }
    hints:
      - "รวมเป็นขีดก่อน แล้วเปลี่ยนเป็นกรัม"
      - "1 ขีด = 100 กรัม"
    misconceptions:
      - { match: 8, feedback: "8 คือจำนวนขีด โจทย์ให้ตอบเป็นกรัม" }
      - { match: 80, feedback: "ใช้ 1 ขีด = 10 กรัม ที่ถูกคือ 100 กรัม" }
    solution: "$3 + 5 = 8$ ขีด $= 8 \\times 100 = 800$ กรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.weight.p009
    topics: [math.measure.weight]
    difficulty: 3
    type: mcq
    stem: "เติมเครื่องหมายในช่องว่าง: 2 กิโลกรัม 50 กรัม ___ 2,500 กรัม"
    choices:
      - { id: a, text: "$<$", correct: true }
      - { id: b, text: "$>$", feedback: "2 กิโลกรัม 50 กรัม = 2,050 กรัม ซึ่งน้อยกว่า 2,500 กรัม" }
      - { id: c, text: "$=$", feedback: "เขียน 2 กับ 50 ติดกันเป็น 2,50_ แต่ 50 กรัมอยู่ในหลักสิบ 2 กิโลกรัม 50 กรัม = 2,050 กรัม" }
    hints:
      - "เปลี่ยน 2 กิโลกรัม 50 กรัม เป็นกรัม"
      - "$2{,}000 + 50$"
    solution: "2 กิโลกรัม 50 กรัม $= 2{,}050$ กรัม และ $2{,}050 < 2{,}500$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.weight.p010
    topics: [math.measure.weight]
    difficulty: 3
    type: order
    stem: "เรียงน้ำหนักจากเบาที่สุดไปหนักที่สุด"
    items: ["950 กรัม", "1 กิโลกรัม", "1 กิโลกรัม 2 ขีด", "1,250 กรัม", "1 กิโลกรัม 5 ขีด"]
    hints:
      - "เปลี่ยนทุกค่าเป็นกรัม"
      - "1 ขีด = 100 กรัม เช่น 1 กิโลกรัม 2 ขีด = 1,200 กรัม"
    solution: "950 < 1,000 < 1,200 < 1,250 < 1,500 กรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.weight.p011
    topics: [math.measure.weight]
    difficulty: 3
    type: numeric
    stem: "ถุงข้าวสารหนัก 5 กิโลกรัม ตักออกมาหุง 1 กิโลกรัม 350 กรัม เหลือข้าวสารกี่กรัม (ตอบในหน่วยกรัม)"
    answer: { value: 3650, unit: g }
    hints:
      - "เปลี่ยนเป็นกรัมทั้งสองค่า"
      - "$5{,}000 - 1{,}350$"
    misconceptions:
      - { match: 4650, feedback: "ลบแค่ 350 กรัม ลืมลบ 1 กิโลกรัม" }
      - { match: 4350, feedback: "ลบกิโลกรัมได้ 4 แล้วเขียน 350 กรัมไว้เฉย ๆ ต้องกระจาย 1 กิโลกรัมเป็น 1,000 กรัม แล้ว $1{,}000 - 350 = 650$" }
    solution: "$5{,}000 - 1{,}350 = 3{,}650$ กรัม (3 กิโลกรัม 650 กรัม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.weight.p012
    topics: [math.measure.weight]
    difficulty: 4
    type: numeric
    stem: "ที่ด่านชั่งน้ำหนัก รถบรรทุกเปล่าหนัก 3 เมตริกตัน 200 กิโลกรัม บรรทุกอ้อยหนัก 6 เมตริกตัน 900 กิโลกรัม รถกับอ้อยหนักรวมกี่กิโลกรัม (ตอบในหน่วยกิโลกรัม)"
    answer: { value: 10100, unit: kg }
    hints:
      - "1 เมตริกตัน = 1,000 กิโลกรัม เปลี่ยนเป็นกิโลกรัมทั้งสองค่า"
      - "$3{,}200 + 6{,}900$"
    misconceptions:
      - { match: 9100, feedback: "$200 + 900 = 1{,}100$ กิโลกรัม ต้องทด 1,000 กิโลกรัมเป็น 1 เมตริกตัน" }
      - { match: 3700, feedback: "ลบกัน แต่ต้องหาน้ำหนักรวมของรถกับอ้อย" }
    solution: "$3{,}200 + 6{,}900 = 10{,}100$ กิโลกรัม (10 เมตริกตัน 100 กิโลกรัม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.weight.p013
    topics: [math.measure.weight]
    difficulty: 3
    type: numeric
    stem: "ร้านขนมมีแป้ง 24 กิโลกรัม แบ่งใส่ถุงละ 3 กิโลกรัม ได้กี่ถุง (ตอบเป็นจำนวนถุง)"
    answer: { value: 8, unit: ถุง }
    hints:
      - "แบ่งเท่า ๆ กันใช้การหาร"
      - "3 คูณอะไรได้ 24"
    misconceptions:
      - { match: 72, feedback: "คูณ 24 กับ 3 แต่การแบ่งใส่ถุงต้องหาร" }
      - { match: 21, feedback: "ลบ 3 แค่ครั้งเดียว ต้องนับว่าลบ 3 ได้กี่ครั้งจนหมด" }
    solution: "$24 \\div 3 = 8$ ถุง ตรวจ: $8 \\times 3 = 24$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.weight.p014
    topics: [math.measure.weight]
    difficulty: 4
    type: numeric
    stem: "หน้าปัดเครื่องชั่งระหว่างเลข 0 กับ 1 กิโลกรัมแบ่งเป็น 4 ช่องเท่ากัน (มีขีดแบ่งทั้งหมด 5 ขีดรวมขีดที่ 0 และ 1) 1 ช่องมีค่ากี่กรัม (ตอบในหน่วยกรัม)"
    answer: { value: 250, unit: g }
    hints:
      - "1 กิโลกรัม = 1,000 กรัม"
      - "นับช่อง ไม่ใช่นับขีด แล้วหาร 1,000 ด้วยจำนวนช่อง"
    misconceptions:
      - { match: 200, feedback: "หารด้วยจำนวนขีด (5) แต่ต้องหารด้วยจำนวนช่อง (4)" }
      - { match: 25, feedback: "ใช้ 1 กิโลกรัม = 100 กรัม ที่ถูกคือ 1,000 กรัม" }
    solution: "$1{,}000 \\div 4 = 250$ กรัม ช่องละ 250 กรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.weight.p015
    topics: [math.measure.weight]
    difficulty: 4
    type: numeric
    stem: "พ่อซื้อทุเรียน 2 ลูก ลูกแรกหนัก 2 กิโลกรัม 7 ขีด ลูกที่สองหนัก 3 กิโลกรัม 6 ขีด ทุเรียนหนักรวมกี่กรัม (ตอบในหน่วยกรัม)"
    answer: { value: 6300, unit: g }
    hints:
      - "บวกขีด: $7 + 6 = 13$ ขีด ซึ่งเกิน 10 ขีด"
      - "10 ขีด ทดเป็น 1 กิโลกรัม หรือเปลี่ยนทั้งหมดเป็นกรัมก่อน"
    misconceptions:
      - { match: 5130, feedback: "เขียนเป็น 5 กิโลกรัม 13 ขีด แล้วต่อตัวเลขกัน ต้องทด 10 ขีดเป็น 1 กิโลกรัม ได้ 6 กิโลกรัม 3 ขีด" }
      - { match: 63, feedback: "63 คือจำนวนขีด โจทย์ให้ตอบเป็นกรัม" }
    solution: "$2{,}700 + 3{,}600 = 6{,}300$ กรัม (6 กิโลกรัม 3 ขีด)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.weight.p016
    topics: [math.measure.weight]
    difficulty: 5
    type: numeric
    stem: "ลิฟต์ขนของรับน้ำหนักได้ไม่เกิน 1 เมตริกตัน ในลิฟต์มีคนหนักรวม 720 กิโลกรัม และกล่องของ 2 กล่อง กล่องละ 85 กิโลกรัม ลิฟต์รับน้ำหนักเพิ่มได้อีกไม่เกินกี่กิโลกรัม (ตอบในหน่วยกิโลกรัม)"
    answer: { value: 110, unit: kg }
    hints:
      - "1 เมตริกตัน = 1,000 กิโลกรัม"
      - "รวมน้ำหนักทั้งคนและกล่องสองกล่อง แล้วลบออกจาก 1,000"
    misconceptions:
      - { match: 195, feedback: "ลบกล่องแค่กล่องเดียว แต่มี 2 กล่อง กล่องละ 85 กิโลกรัม" }
      - { match: 280, feedback: "ลบแค่น้ำหนักคน ลืมกล่องของ" }
    solution: "น้ำหนักในลิฟต์ $720 + 85 + 85 = 890$ กิโลกรัม รับเพิ่มได้ $1{,}000 - 890 = 110$ กิโลกรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.weight.p017
    topics: [math.measure.weight]
    difficulty: 5
    type: numeric
    stem: "บนตาชั่งสองแขน ส้ม 3 ผลหนักเท่ากับแอปเปิล 2 ผล (ผลไม้ชนิดเดียวกันหนักเท่ากันทุกผล) แอปเปิล 1 ผลหนัก 150 กรัม ส้ม 1 ผลหนักกี่กรัม (ตอบในหน่วยกรัม)"
    answer: { value: 100, unit: g }
    hints:
      - "หาน้ำหนักของแอปเปิล 2 ผลก่อน"
      - "ส้ม 3 ผลหนักเท่ากับน้ำหนักนั้น แบ่งเป็น 3 ส่วนเท่ากัน"
    misconceptions:
      - { match: 225, feedback: "คิดว่าส้มหนักกว่าแอปเปิล แต่ต้องใช้ส้มถึง 3 ผลจึงหนักเท่าแอปเปิล 2 ผล ส้มจึงเบากว่า" }
      - { match: 50, feedback: "หาร 150 ด้วย 3 แต่ส้ม 3 ผลหนักเท่าแอปเปิล 2 ผล ไม่ใช่ 1 ผล" }
    solution: "แอปเปิล 2 ผลหนัก $150 + 150 = 300$ กรัม ส้ม 3 ผลหนัก 300 กรัม ส้ม 1 ผลหนัก $300 \\div 3 = 100$ กรัม"
