  - { framework: th-core-2551-thai, indicators: ["ท 5.1 ป.2/2", "ท 5.1 ป.4/3"], coverage: partial, note: "สอนบทร้องเล่น (รีรีข้าวสาร มอญซ่อนผ้า โยกเยก) วิธีเล่น คำคล้องจอง และวิธีร้องเพลงพื้นบ้านกับลูกคู่ แต่แอปฟังการร้องของผู้เรียนไม่ได้" }
  - { framework: th-core-2551-thai, indicators: ["ท 5.1 ป.3/2"], coverage: full, note: "เพลงกล่อมเด็ก (เจ้าเนื้อละมุน เพลงร้องเรือของภาคใต้) และเพลงพื้นบ้านสี่ภาค (ฉ่อย ลำตัด อีแซว ซอ หมอลำ เพลงบอก) พร้อมความหมายที่สะท้อนวัฒนธรรม" }
