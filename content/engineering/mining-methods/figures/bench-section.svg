<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320">
  <title>หน้าตัดขั้นบันไดของเหมืองผิวดิน</title>
  <rect width="520" height="320" fill="#ffffff"/>
  <polygon points="60.0,270.0 106.0,218.0 136.0,218.0 182.0,166.0 212.0,166.0 258.0,114.0 288.0,114.0 60,270" fill="#e7e5e4" stroke="#44403c" stroke-width="2"/>
  <line x1="60" y1="270" x2="288.0" y2="114.0" stroke="#b45309" stroke-dasharray="6 4"/>
  <text x="300.0" y="108.0" font-size="13" fill="#b45309" font-family="sans-serif">เส้นมุมลาดรวม</text>
  <text x="150" y="190" font-size="13" text-anchor="end" font-family="sans-serif">หน้าดิน (bench face)</text>
  <text x="100" y="214" font-size="12" text-anchor="end" font-family="sans-serif">ขั้นพัก (berm) →</text>
  <text x="260.0" y="308" font-size="13" text-anchor="middle" font-family="sans-serif">ภาพแนวคิด: หน้าดินเอียงสลับกับขั้นพักแนวนอน (berm) ไม่ใช่แบบออกแบบ</text>
