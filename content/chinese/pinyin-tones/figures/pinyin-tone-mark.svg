<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="sans-serif">
<title>ผังการวางเครื่องหมายวรรณยุกต์บนพินอิน</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect x="0" y="0" width="720" height="300" fill="#fff"/>
<rect x="20.0" y="20.0" width="230.0" height="50.0" fill="#f2f2f2" stroke="#555" stroke-width="1.3" rx="25"/>
<text x="135.0" y="51.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" >พยางค์มี a ไหม</text>
<line x1="250.0" y1="45.0" x2="320.0" y2="45.0" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="285.0" y="37.0" font-size="12" text-anchor="middle" fill="#2a6a2a" font-weight="bold" >ใช่</text>
<rect x="322.0" y="23.0" width="160.0" height="44.0" fill="#d6efd0" stroke="#2a6a2a" stroke-width="1.3" rx="6"/>
<text x="402.0" y="51.0" font-size="15" text-anchor="middle" fill="#1d4d1d" font-weight="bold" >วางบน a</text>
<text x="496.0" y="51.0" font-size="18" text-anchor="start" fill="#1f4e9c" font-weight="bold" >hǎo · kuài · xiān</text>
<line x1="135.0" y1="70.0" x2="135.0" y2="110.0" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="143.0" y="95.0" font-size="12" text-anchor="start" fill="#a32a1c" font-weight="bold" >ไม่</text>
<rect x="20.0" y="110.0" width="230.0" height="50.0" fill="#f2f2f2" stroke="#555" stroke-width="1.3" rx="25"/>
<text x="135.0" y="141.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" >มี o หรือ e ไหม</text>
<line x1="250.0" y1="135.0" x2="320.0" y2="135.0" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="285.0" y="127.0" font-size="12" text-anchor="middle" fill="#2a6a2a" font-weight="bold" >ใช่</text>
<rect x="322.0" y="113.0" width="160.0" height="44.0" fill="#d6efd0" stroke="#2a6a2a" stroke-width="1.3" rx="6"/>
<text x="402.0" y="141.0" font-size="15" text-anchor="middle" fill="#1d4d1d" font-weight="bold" >วางบน o หรือ e</text>
<text x="496.0" y="141.0" font-size="18" text-anchor="start" fill="#1f4e9c" font-weight="bold" >dōu · xiè · guó</text>
<line x1="135.0" y1="160.0" x2="135.0" y2="200.0" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="143.0" y="185.0" font-size="12" text-anchor="start" fill="#a32a1c" font-weight="bold" >ไม่</text>
<rect x="20.0" y="200.0" width="230.0" height="50.0" fill="#f2f2f2" stroke="#555" stroke-width="1.3" rx="25"/>
<text x="135.0" y="231.0" font-size="15" text-anchor="middle" fill="#111" font-weight="normal" >เป็น iu หรือ ui</text>
<line x1="250.0" y1="225.0" x2="320.0" y2="225.0" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="285.0" y="217.0" font-size="12" text-anchor="middle" fill="#2a6a2a" font-weight="bold" >ใช่</text>
<rect x="322.0" y="203.0" width="160.0" height="44.0" fill="#d6efd0" stroke="#2a6a2a" stroke-width="1.3" rx="6"/>
<text x="402.0" y="231.0" font-size="15" text-anchor="middle" fill="#1d4d1d" font-weight="bold" >วางบนตัวหลัง</text>
<text x="496.0" y="231.0" font-size="18" text-anchor="start" fill="#1f4e9c" font-weight="bold" >liù · guì · jiǔ</text>
<text x="20.0" y="290.0" font-size="13" text-anchor="start" fill="#444" font-weight="normal" >สระเดี่ยว (i, u, ü) วางบนสระตัวนั้น เช่น nǐ · shū · nǚ ส่วน i ที่มีเครื่องหมายไม่ต้องมีจุด</text>
</svg>
