<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="sans-serif">
<title>พัฒนาการของเทคโนโลยีการเตรียมดินทำนาในไทย</title>
<rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="360.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">เทคโนโลยีเตรียมดินและดูแลนาข้าวที่เปลี่ยนไป</text>
<rect x="20.0" y="60.0" width="155.0" height="80.0" rx="8" fill="#ede9fe" stroke="#333" stroke-width="1.5"/>
<text x="97.5" y="92.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ควายลากคันไถ</text>
<text x="97.5" y="118.0" font-size="11.5" text-anchor="middle" fill="#111">แรงงานคนและสัตว์</text>
<line x1="176.0" y1="100.0" x2="193.0" y2="100.0" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="195.0" y="60.0" width="155.0" height="80.0" rx="8" fill="#ede9fe" stroke="#333" stroke-width="1.5"/>
<text x="272.5" y="92.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">รถไถเดินตาม</text>
<text x="272.5" y="118.0" font-size="11.5" text-anchor="middle" fill="#111">"ควายเหล็ก" เครื่องยนต์เล็ก</text>
<line x1="351.0" y1="100.0" x2="368.0" y2="100.0" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="370.0" y="60.0" width="155.0" height="80.0" rx="8" fill="#ede9fe" stroke="#333" stroke-width="1.5"/>
<text x="447.5" y="92.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">รถแทรกเตอร์</text>
<text x="447.5" y="118.0" font-size="11.5" text-anchor="middle" fill="#111">กำลังมาก ไถได้เร็ว</text>
<line x1="526.0" y1="100.0" x2="543.0" y2="100.0" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="545.0" y="60.0" width="155.0" height="80.0" rx="8" fill="#ede9fe" stroke="#333" stroke-width="1.5"/>
<text x="622.5" y="92.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">โดรนและดาวเทียม</text>
<text x="622.5" y="118.0" font-size="11.5" text-anchor="middle" fill="#111">พ่นปุ๋ยแม่นยำ แผนที่แปลง</text>
<line x1="20.0" y1="160.0" x2="700.0" y2="160.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="360.0" y="180.0" font-size="12" text-anchor="middle" fill="#444">เวลาผ่านไป</text>
<rect x="20.0" y="195.0" width="680.0" height="90.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="360.0" y="220.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ปัจจัยที่ทำให้เปลี่ยน</text>
<text x="360.0" y="245.0" font-size="12.5" text-anchor="middle" fill="#111">ต้องการทำงานเร็วขึ้นและเหนื่อยน้อยลง · ความรู้ด้านเครื่องยนต์และอิเล็กทรอนิกส์</text>
<text x="360.0" y="266.0" font-size="12.5" text-anchor="middle" fill="#111">แรงงานในภาคเกษตรลดลง ค่าแรงสูงขึ้น · ราคาเครื่องมือถูกลง · ต้องการลดการใช้ปุ๋ยและสารเคมี</text>
</svg>
