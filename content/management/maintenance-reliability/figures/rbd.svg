<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" font-family="sans-serif" font-size="14">
<title>แผนภาพบล็อกความเชื่อถือได้ของระบบจ่ายน้ำ</title>
<rect x="0" y="0" width="760" height="290" fill="#ffffff"/>
<text x="380.0" y="28.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">ระบบจ่ายน้ำประปาหมู่บ้าน (สมมติ)</text>
<line x1="20.0" y1="150.0" x2="70.0" y2="150.0" stroke="#333" stroke-width="2"/>
<text x="20.0" y="140.0" text-anchor="start" font-size="12" fill="#222">เข้า</text>
<rect x="70.0" y="122.0" width="120.0" height="56.0" rx="6" fill="#eef3fa" stroke="#2c4a7a" stroke-width="1.5"/>
<text x="130.0" y="146.0" text-anchor="middle" font-size="13" fill="#222">ปั๊มดิบ A</text>
<text x="130.0" y="166.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">R = 0.90</text>
<line x1="190.0" y1="150.0" x2="250.0" y2="150.0" stroke="#333" stroke-width="2"/>
<line x1="250.0" y1="95.0" x2="250.0" y2="205.0" stroke="#333" stroke-width="2"/>
<line x1="250.0" y1="95.0" x2="290.0" y2="95.0" stroke="#333" stroke-width="2"/>
<line x1="250.0" y1="205.0" x2="290.0" y2="205.0" stroke="#333" stroke-width="2"/>
<rect x="290.0" y="67.0" width="120.0" height="56.0" rx="6" fill="#eef3fa" stroke="#2c4a7a" stroke-width="1.5"/>
<text x="350.0" y="91.0" text-anchor="middle" font-size="13" fill="#222">ตัวกรอง B</text>
<text x="350.0" y="111.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">R = 0.80</text>
<rect x="290.0" y="177.0" width="120.0" height="56.0" rx="6" fill="#eef3fa" stroke="#2c4a7a" stroke-width="1.5"/>
<text x="350.0" y="201.0" text-anchor="middle" font-size="13" fill="#222">ตัวกรอง C</text>
<text x="350.0" y="221.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">R = 0.80</text>
<line x1="410.0" y1="95.0" x2="450.0" y2="95.0" stroke="#333" stroke-width="2"/>
<line x1="410.0" y1="205.0" x2="450.0" y2="205.0" stroke="#333" stroke-width="2"/>
<line x1="450.0" y1="95.0" x2="450.0" y2="205.0" stroke="#333" stroke-width="2"/>
<line x1="450.0" y1="150.0" x2="510.0" y2="150.0" stroke="#333" stroke-width="2"/>
<rect x="510.0" y="122.0" width="120.0" height="56.0" rx="6" fill="#eef3fa" stroke="#2c4a7a" stroke-width="1.5"/>
<text x="570.0" y="146.0" text-anchor="middle" font-size="13" fill="#222">ปั๊มจ่าย D</text>
<text x="570.0" y="166.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">R = 0.95</text>
<line x1="630.0" y1="150.0" x2="700.0" y2="150.0" stroke="#333" stroke-width="2"/>
<text x="700.0" y="140.0" text-anchor="end" font-size="12" fill="#222">ออก</text>
<text x="380.0" y="278.0" text-anchor="middle" font-size="12" fill="#444">B และ C ต่อขนานกัน ตัวใดตัวหนึ่งทำงานก็พอ ทุกส่วนเสียอิสระต่อกัน</text>
</svg>