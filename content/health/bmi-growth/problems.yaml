    type: numeric
    stem: "ผู้ใหญ่คนหนึ่งสูง 150 เซนติเมตร รอบเอว 78 เซนติเมตร อัตราส่วนรอบเอวต่อส่วนสูงเท่าใด (ตอบเป็นตัวเลขไม่มีหน่วย ทศนิยม 2 ตำแหน่ง)"
