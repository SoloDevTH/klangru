    solution: "$\\text{BMI} = \\dfrac{80}{1.80^2} = \\dfrac{80}{3.24} \\approx 24.7$ อยู่ในช่วง 23.0–24.9 คือน้ำหนักเกิน (อ้วนระดับ 1) ตามเกณฑ์ผู้ใหญ่ชาวเอเชีย"
