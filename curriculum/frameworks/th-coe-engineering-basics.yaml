    indicators:
    - id: ENV-1.1
      text: ฟิสิกส์
    - id: ENV-1.2
      text: เคมีพื้นฐาน
    - id: ENV-1.3
      text: แคลคูลัส
  - id: ENV-2
    text: องค์ความรู้พื้นฐานทางวิศวกรรม
    indicators:
    - id: ENV-2.1
      text: การเขียนแบบวิศวกรรม
    - id: ENV-2.2
      text: สถิตยศาสตร์
    - id: ENV-2.3
      text: การเขียนโปรแกรมพื้นฐาน
    - id: ENV-2.4
      text: สมดุลมวลสารและการถ่ายโอนมวลสาร
    - id: ENV-2.5
      text: จลนพลศาสตร์
    - id: ENV-2.6
      text: สมดุลเคมี
    - id: ENV-2.7
      text: ชีววิทยาพื้นฐาน
    - id: ENV-2.8
      text: ชลศาสตร์พื้นฐาน
    - id: ENV-2.9
      text: การสำรวจเบื้องต้น
    - id: ENV-2.10
      text: การแปลงหน่วยทางวิศวกรรม
  - id: ENV-3
    text: องค์ความรู้เฉพาะทางวิศวกรรม
    indicators:
    - id: ENV-3.1
      text: พารามิเตอร์ทางด้านสิ่งแวดล้อม
    - id: ENV-3.2
      text: หน่วยปฏิบัติการสำหรับวิศวกรรมสิ่งแวดล้อม
    - id: ENV-3.3
      text: การควบคุมและออกแบบระบบบำบัดน้ำเสีย
    - id: ENV-3.4
      text: การควบคุมและออกแบบระบบผลิตและแจกจ่ายน้ำประปา
    - id: ENV-3.5
      text: การควบคุมและออกแบบระบบควบคุมมลภาวะทางอากาศ
    - id: ENV-3.6
      text: การจัดการของเสียและของเสียอันตราย
    - id: ENV-3.7
      text: หน่วยกระบวนการทางชีวภาพสำหรับวิศวกรรมสิ่งแวดล้อม
    - id: ENV-3.8
      text: การควบคุมมลภาวะทางเสียง
    - id: ENV-3.9
      text: การออกแบบระบบสุขาภิบาลในอาคาร
    - id: ENV-3.10
      text: การประเมินผลกระทบสิ่งแวดล้อม
    - id: ENV-3.11
      text: เครื่องมือสำหรับการจัดการสิ่งแวดล้อม
    - id: ENV-3.12
      text: การจัดการความปลอดภัย
    - id: ENV-3.13
      text: สาธารณสุขพื้นฐาน
    - id: ENV-3.14
      text: มาตรฐานคุณภาพสิ่งแวดล้อม
    - id: ENV-3.15
      text: กฎหมายสิ่งแวดล้อม
    - id: ENV-3.16
      text: การฟื้นฟูพื้นที่ปนเปื้อน
    - id: ENV-3.17
      text: สิ่งแวดล้อมกับการพัฒนาอย่างยั่งยืน
    - id: ENV-3.18
      text: การปล่อยก๊าซเรือนกระจกสุทธิเป็นศูนย์และความเป็นกลางทางคาร์บอน
