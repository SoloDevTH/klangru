<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 245" width="300" height="245" font-family="sans-serif" font-size="16">
  <title>รูปคลี่ของทรงกระบอกรัศมี 4 cm สูง 10 cm</title>
  
  <rect x="40" y="76" width="175.9" height="70" fill="#dbe8f7" stroke="#15211e" stroke-width="2.5"/>
  <circle cx="128.0" cy="48.0" r="28.0" fill="#fbe9df" stroke="#15211e" stroke-width="2.5"/>
  <circle cx="128.0" cy="174.0" r="28.0" fill="#fbe9df" stroke="#15211e" stroke-width="2.5"/>
  <line x1="128.0" y1="48.0" x2="156.0" y2="48.0" stroke="#b4521f" stroke-width="2"/>
  <text x="162.0" y="48.0" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#b4521f">r = 4</text>
  <text x="128.0" y="103.0" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1f5fa8">ผิวข้าง</text>
  <text x="128.0" y="123.0" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#1f5fa8">2πr × h</text>
  <text x="223.9" y="111.0" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#0a6b60">h = 10</text>
  <text x="128.0" y="226.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#0a6b60">ยาว 2πr ≈ 25.1 cm</text>
  <line x1="40.0" y1="210.0" x2="215.9" y2="210.0" stroke="#0a6b60" stroke-width="1.5"/>
</svg>
