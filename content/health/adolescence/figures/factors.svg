<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="sans-serif">
<title>ปัจจัยที่มีผลต่อการเจริญเติบโตและพัฒนาการของวัยรุ่น</title>
<rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">ปัจจัยที่มีผลต่อการเจริญเติบโตและพัฒนาการของวัยรุ่น</text>
<circle cx="380.0" cy="195.0" r="84.0" fill="#fdebd0" stroke="#333" stroke-width="1.5"/>
<text x="380.0" y="180.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">วัยรุ่น</text>
<text x="380.0" y="198.8" font-size="13" text-anchor="middle" fill="#111">ร่างกาย จิตใจ อารมณ์</text>
<text x="380.0" y="217.7" font-size="13" text-anchor="middle" fill="#111">สังคม สติปัญญา</text>
<rect x="20.0" y="60.0" width="230.0" height="270.0" rx="8" fill="#d6eaf8" stroke="#333" stroke-width="1.5"/>
<text x="135.0" y="88.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ปัจจัยภายในตัว</text>
<text x="135.0" y="108.0" font-size="12" text-anchor="middle" fill="#444">(ส่วนใหญ่เปลี่ยนเองไม่ได้)</text>
<text x="135.0" y="145.0" font-size="14" text-anchor="middle" fill="#111">พันธุกรรม</text>
<text x="135.0" y="185.0" font-size="14" text-anchor="middle" fill="#111">ฮอร์โมน</text>
<text x="135.0" y="225.0" font-size="14" text-anchor="middle" fill="#111">เพศ</text>
<text x="135.0" y="265.0" font-size="14" text-anchor="middle" fill="#111">โรคประจำตัว</text>
<rect x="510.0" y="60.0" width="230.0" height="270.0" rx="8" fill="#d5f5e3" stroke="#333" stroke-width="1.5"/>
<text x="625.0" y="88.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ปัจจัยภายนอก</text>
<text x="625.0" y="108.0" font-size="12" text-anchor="middle" fill="#444">(หลายอย่างเราปรับได้)</text>
<text x="625.0" y="140.0" font-size="14" text-anchor="middle" fill="#111">อาหาร  การนอน</text>
<text x="625.0" y="173.0" font-size="14" text-anchor="middle" fill="#111">การออกกำลังกาย</text>
<text x="625.0" y="206.0" font-size="14" text-anchor="middle" fill="#111">ครอบครัว  เพื่อน</text>
<text x="625.0" y="239.0" font-size="14" text-anchor="middle" fill="#111">โรงเรียน  สื่อ</text>
<text x="625.0" y="272.0" font-size="14" text-anchor="middle" fill="#111">เศรษฐกิจ</text>
<text x="625.0" y="305.0" font-size="14" text-anchor="middle" fill="#111">สิ่งแวดล้อม มลพิษ</text>
<line x1="252.0" y1="195.0" x2="294.0" y2="195.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="508.0" y1="195.0" x2="466.0" y2="195.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
</svg>
