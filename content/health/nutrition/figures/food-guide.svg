<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" font-family="sans-serif" font-size="14">
<title>ปริมาณอาหารต่อวันตามธงโภชนาการของกรมอนามัย แบ่งตามพลังงาน 1,600 2,000 และ 2,400 กิโลแคลอรี</title>
<rect x="0" y="0" width="660" height="330" fill="#ffffff"/>
<polygon points="20.0,50 250.0,50 240.4,87 29.6,87" fill="#f3d9a4" stroke="#333" stroke-width="1"/>
<text x="135.0" y="74.0" text-anchor="middle" font-size="14">ข้าว แป้ง</text>
<text x="268" y="74.0" fill="#333">ทัพพี</text>
<text x="430" y="74.0" text-anchor="middle" font-weight="bold">8</text>
<text x="515" y="74.0" text-anchor="middle" font-weight="bold">10</text>
<text x="600" y="74.0" text-anchor="middle" font-weight="bold">12</text>
<line x1="262" y1="89" x2="640" y2="89" stroke="#ccc"/>
<polygon points="29.6,90 240.4,90 230.8,127 39.2,127" fill="#bfe3b4" stroke="#333" stroke-width="1"/>
<text x="135.0" y="114.0" text-anchor="middle" font-size="14">ผัก</text>
<text x="268" y="114.0" fill="#333">ทัพพี</text>
<text x="430" y="114.0" text-anchor="middle" font-weight="bold">4 (6)</text>
<text x="515" y="114.0" text-anchor="middle" font-weight="bold">5</text>
<text x="600" y="114.0" text-anchor="middle" font-weight="bold">6</text>
<line x1="262" y1="129" x2="640" y2="129" stroke="#ccc"/>
<polygon points="39.2,130 230.8,130 221.2,167 48.8,167" fill="#f7c6a3" stroke="#333" stroke-width="1"/>
<text x="135.0" y="154.0" text-anchor="middle" font-size="14">ผลไม้</text>
<text x="268" y="154.0" fill="#333">ส่วน</text>
<text x="430" y="154.0" text-anchor="middle" font-weight="bold">3 (4)</text>
<text x="515" y="154.0" text-anchor="middle" font-weight="bold">4</text>
<text x="600" y="154.0" text-anchor="middle" font-weight="bold">5</text>
<line x1="262" y1="169" x2="640" y2="169" stroke="#ccc"/>
<polygon points="48.8,170 221.2,170 211.7,207 58.3,207" fill="#e9b9b9" stroke="#333" stroke-width="1"/>
<text x="135.0" y="194.0" text-anchor="middle" font-size="12">เนื้อสัตว์ ถั่ว ไข่</text>
<text x="268" y="194.0" fill="#333">ช้อนกินข้าว</text>
<text x="430" y="194.0" text-anchor="middle" font-weight="bold">6</text>
<text x="515" y="194.0" text-anchor="middle" font-weight="bold">9</text>
<text x="600" y="194.0" text-anchor="middle" font-weight="bold">12</text>
<line x1="262" y1="209" x2="640" y2="209" stroke="#ccc"/>
<polygon points="58.3,210 211.7,210 202.1,247 67.9,247" fill="#cfe0f3" stroke="#333" stroke-width="1"/>
<text x="135.0" y="234.0" text-anchor="middle" font-size="14">นม</text>
<text x="268" y="234.0" fill="#333">แก้ว</text>
<text x="430" y="234.0" text-anchor="middle" font-weight="bold">2 (1)</text>
<text x="515" y="234.0" text-anchor="middle" font-weight="bold">1</text>
<text x="600" y="234.0" text-anchor="middle" font-weight="bold">1</text>
<line x1="262" y1="249" x2="640" y2="249" stroke="#ccc"/>
<polygon points="67.9,250 202.1,250 192.5,287 77.5,287" fill="#e6e6e6" stroke="#333" stroke-width="1"/>
<text x="135.0" y="274.0" text-anchor="middle" font-size="12">น้ำมัน น้ำตาล เกลือ</text>
<text x="268" y="274.0" fill="#333"></text>
<text x="515" y="274.0" text-anchor="middle">ใช้แต่น้อยเท่าที่จำเป็น</text>
<line x1="262" y1="289" x2="640" y2="289" stroke="#ccc"/>
<text x="268" y="36" font-weight="bold">หน่วย</text>
<text x="430" y="22" text-anchor="middle" font-weight="bold">1,600</text>
<text x="430" y="38" text-anchor="middle" font-size="12">กิโลแคลอรี</text>
<text x="515" y="22" text-anchor="middle" font-weight="bold">2,000</text>
<text x="515" y="38" text-anchor="middle" font-size="12">กิโลแคลอรี</text>
<text x="600" y="22" text-anchor="middle" font-weight="bold">2,400</text>
<text x="600" y="38" text-anchor="middle" font-size="12">กิโลแคลอรี</text>
<text x="135" y="36" text-anchor="middle" font-weight="bold">กินมาก ↓ กินน้อย</text>
<text x="20" y="312" font-size="12" fill="#333">ตัวเลขในวงเล็บคือปริมาณสำหรับผู้ใหญ่ที่ใช้พลังงาน 1,600 กิโลแคลอรี  ที่มา: ธงโภชนาการ กรมอนามัย (แผนภาพนี้วาดใหม่)</text>
</svg>
