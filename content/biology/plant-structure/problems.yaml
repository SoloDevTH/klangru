  - id: biology.plants.plant-structure.p014
    topics: [biology.plants.plant-structure]
    difficulty: 4
    type: mcq
    stem: "ชาวสวนตอนกิ่งมะนาวโดยควั่นเปลือกรอบกิ่งออกเป็นวงกว้างประมาณ 2 เซนติเมตร แล้วหุ้มด้วยขุยมะพร้าว หลายสัปดาห์ต่อมาเปลือกเหนือรอยควั่นบวมพองและงอกราก ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "การควั่นเอาโฟลเอ็มออก อาหารจากใบจึงลงไปต่อไม่ได้และสะสมเหนือรอยควั่น ช่วยให้เกิดราก", correct: true }
      - { id: b, text: "การควั่นเอาไซเลมออก น้ำจึงสะสมเหนือรอยควั่น", feedback: "ไซเลมอยู่ในเนื้อไม้ด้านในซึ่งยังไม่ถูกควั่นออก ใบเหนือรอยควั่นจึงไม่เหี่ยว ถ้าไซเลมถูกตัดใบจะเหี่ยวแทน" }
      - { id: c, text: "การควั่นเอาเนื้อเยื่อเจริญปลายยอดออก", feedback: "เนื้อเยื่อเจริญปลายยอดอยู่ที่ยอด ไม่ได้อยู่ที่เปลือกกิ่ง" }
      - { id: d, text: "ขุยมะพร้าวมีอาหารที่ทำให้เปลือกบวม", feedback: "ขุยมะพร้าวช่วยเก็บความชื้น อาหารที่สะสมมาจากใบของกิ่งเองผ่านโฟลเอ็ม" }
    hints:
      - "เปลือกไม้ด้านในติดกับเนื้อไม้มีเนื้อเยื่อลำเลียงชนิดใด"
      - "อาหารเคลื่อนจากใบลงไปทางไหน แล้วติดอยู่ที่ใด"
    solution: "ในลำต้นใบเลี้ยงคู่ โฟลเอ็มอยู่ด้านนอกของแคมเบียมจึงหลุดไปกับเปลือก อาหารจากใบลงต่อไม่ได้จึงสะสมเหนือรอยควั่น ส่วนไซเลมในเนื้อไม้ยังส่งน้ำขึ้นไปได้ ใบจึงไม่เหี่ยว"
