# หัวข้อในคลังที่สอนตัวชี้วัดแกนกลาง กลุ่มสาระการเรียนรู้วิทยาศาสตร์และเทคโนโลยี (ฉบับปรับปรุง พ.ศ. 2560)
# จับคู่จากเนื้อหาจริงใน lesson.md และ problems.yaml ของแต่ละหัวข้อ ไม่ใช่จากชื่อหัวข้อ
# coverage: full = บทเรียนและโจทย์สอนความรู้ของตัวชี้วัดที่ระบุครบ, partial = สอนบางส่วน
# ตัวชี้วัดที่ต้องลงมือทดลอง สำรวจ หรือสร้างชิ้นงานจริง ถ้าบทเรียนสอนความรู้ครบแต่ไม่มีกิจกรรมเหล่านั้น บอกไว้ใน note
# ตัวชี้วัดด้านเจตคติ ("ตระหนัก...") จับคู่เฉพาะเมื่อบทเรียนพูดถึงประเด็นนั้นจริง
# หัวข้อคณิตศาสตร์ในคลังตอนนี้ไม่ตรงกับตัวชี้วัดวิทยาศาสตร์ข้อใด และ physics.units.si, physics.units.measurement,
# physics.momentum.* ไม่มีตัวชี้วัดแกนกลางที่ตรง (โมเมนตัมอยู่ในรายวิชาเพิ่มเติม)
framework: th-core-2560-science
mappings:
  # ---------- ว 2.2 แรงและการเคลื่อนที่ ----------
  - topic: physics.dynamics.forces
    indicators: ["ว 2.2 ป.3/2", "ว 2.2 ป.5/1", "ว 2.2 ป.5/2", "ว 2.2 ม.2/1", "ว 2.2 ม.2/2"]
    coverage: partial
    note: "สอนแรงสัมผัสและแรงไม่สัมผัส การหาแรงลัพธ์ในแนวเดียวกัน และแผนภาพแรงครบ แต่ ป.3/2 มีเพียงการจำแนกชนิดแรง ไม่มีตัวอย่างผลต่อการเคลื่อนที่จากการทดลอง"
  - topic: physics.dynamics.newton-first
    indicators: ["ว 2.2 ม.2/1"]
    coverage: partial
    note: "สอนว่าแรงลัพธ์เป็นศูนย์แล้ววัตถุรักษาสภาพการเคลื่อนที่ ใช้ร่วมกับ physics.dynamics.forces"
  - topic: physics.dynamics.newton-second
    indicators: ["ว 2.2 ป.4/3", "ว 2.2 ม.5/3"]
    coverage: full
    note: "ความเร่งแปรผันตรงกับแรงลัพธ์และแปรผกผันกับมวล ครอบคลุมเรื่องมวลมีผลต่อการเปลี่ยนการเคลื่อนที่ใน ป.4/3 (ระดับเชิงปริมาณ)"
  - topic: physics.dynamics.newton-third
    indicators: ["ว 2.2 ม.5/4"]
    coverage: full
  - topic: physics.dynamics.weight-normal
    indicators: ["ว 2.2 ป.4/1"]
    coverage: partial
    note: "สอนน้ำหนักเป็นผลของแรงโน้มถ่วง ไม่มีการใช้เครื่องชั่งสปริง (ป.4/2)"
  - topic: physics.dynamics.friction
    indicators: ["ว 2.2 ป.5/4", "ว 2.2 ม.2/6", "ว 2.2 ม.2/7", "ว 2.2 ม.2/9"]
    coverage: partial
    note: "แรงเสียดทานสถิตและจลน์ครบ ปัจจัย (แรงปฏิกิริยาตั้งฉากและผิวสัมผัส) มีผ่านสูตร f = μN แต่ไม่มีการออกแบบการทดลอง ประโยชน์ของแรงเสียดทานมีย่อหน้าเดียว ไม่มีแผนภาพแรงเสียดทาน (ม.2/8)"
  - topic: physics.matter.pressure-fluids
    indicators: ["ว 2.2 ม.2/3", "ว 2.2 ม.2/4"]
    coverage: partial
    note: "ความดันของเหลวขึ้นกับความลึกและชนิดของเหลว แรงลอยตัวและการจมการลอยครบ ไม่มีการทดลองและไม่มีแผนภาพแรงที่กระทำต่อวัตถุในของเหลว (ม.2/5) ไม่มีความดันอากาศกับความสูง (ม.1/1)"
  - topic: physics.rotation.torque
    indicators: ["ว 2.2 ม.2/10", "ว 2.3 ม.2/2"]
    coverage: partial
    note: "โมเมนต์ M = Fl และสมดุลการหมุนครบ เครื่องกลอย่างง่ายมีเฉพาะคาน ไม่มีรอก พื้นเอียง ล้อและเพลา"
  - topic: physics.electricity.charge
    indicators: ["ว 2.2 ป.6/1", "ว 2.2 ม.2/11", "ว 2.2 ม.2/13"]
    coverage: partial
    note: "แรงไฟฟ้าจากการขัดถูครบ สนามไฟฟ้าและแรงไฟฟ้ากับระยะห่างตามกฎของคูลอมบ์มี แต่ไม่ได้เปรียบเทียบกับสนามแม่เหล็กและสนามโน้มถ่วง"
  - topic: physics.dynamics.gravitation
    indicators: ["ว 2.2 ม.2/13", "ว 2.2 ม.5/6", "ว 3.1 ม.3/1"]
    coverage: partial
    note: "แรงโน้มถ่วงกับระยะห่างและการโคจรของดาวเทียมครบ การโคจรของดาวเคราะห์รอบดวงอาทิตย์พูดถึงสั้น ๆ"
  - topic: physics.magnetism.magnetic-field
    indicators: ["ว 2.2 ม.5/7", "ว 2.2 ม.5/8"]
    coverage: full
  # ---------- การเคลื่อนที่ ----------
  - topic: physics.kinematics.speed
    indicators: ["ว 2.2 ม.2/14"]
    coverage: partial
    note: "ส่วนอัตราเร็ว v = s/t ส่วนความเร็วอยู่ใน physics.kinematics.velocity"
  - topic: physics.kinematics.velocity
    indicators: ["ว 2.2 ม.2/14", "ว 2.2 ม.2/15"]
    coverage: partial
    note: "ส่วนความเร็วและการกระจัด แผนภาพการกระจัดมีเฉพาะหนึ่งมิติ"
  - topic: physics.kinematics.acceleration
    indicators: ["ว 2.2 ม.5/1"]
    coverage: full
  - topic: physics.kinematics.motion-graphs
    indicators: ["ว 2.2 ม.5/1"]
    coverage: full
  - topic: physics.kinematics.constant-acceleration
    indicators: ["ว 2.2 ม.5/5"]
    coverage: partial
    note: "เฉพาะการเคลื่อนที่แนวตรง"
  - topic: physics.kinematics.free-fall
    indicators: ["ว 2.2 ม.5/5"]
    coverage: partial
    note: "เฉพาะการเคลื่อนที่แนวตรงในแนวดิ่ง"
  - topic: physics.kinematics.projectile
    indicators: ["ว 2.2 ม.5/5"]
    coverage: partial
    note: "เฉพาะการเคลื่อนที่แบบโพรเจกไทล์"
  - topic: physics.kinematics.circular
    indicators: ["ว 2.2 ม.5/5"]
    coverage: partial
    note: "เฉพาะการเคลื่อนที่แบบวงกลม"
  - topic: physics.waves.shm
    indicators: ["ว 2.2 ม.5/5"]
    coverage: partial
    note: "เฉพาะการเคลื่อนที่แบบสั่น"
  - topic: physics.units.vectors
    indicators: ["ว 2.2 ม.5/2"]
    coverage: partial
    note: "สอนการรวมเวกเตอร์แบบหางต่อหัวและด้วยองค์ประกอบ ตัวอย่างเป็นการกระจัดและความเร็ว ไม่ใช่แรงหลายแรงในระนาบ"
  # ---------- ว 2.3 พลังงาน ----------
  - topic: physics.energy.work
    indicators: ["ว 2.3 ม.2/1"]
    coverage: partial
    note: "ส่วนงาน W = Fs ส่วนกำลังอยู่ใน physics.energy.power"
  - topic: physics.energy.power
    indicators: ["ว 2.3 ม.2/1"]
    coverage: partial
    note: "ส่วนกำลัง P = W/t"
  - topic: physics.energy.kinetic-potential
    indicators: ["ว 2.3 ม.2/4"]
    coverage: full
    note: "ปัจจัยที่มีผลต่อพลังงานจลน์และพลังงานศักย์โน้มถ่วงสอนผ่านสูตรและโจทย์ ไม่มีการทดลองจริง"
  - topic: physics.energy.conservation
    indicators: ["ว 2.3 ม.2/5", "ว 2.3 ม.2/6"]
    coverage: partial
    note: "ม.2/5 ครบ ส่วน ม.2/6 มีเฉพาะพลังงานกลและพลังงานที่สูญเสียเพราะแรงเสียดทาน ไม่มีการเปลี่ยนพลังงานรูปอื่น"
  - topic: physics.thermal.temperature-heat
    indicators: ["ว 2.3 ม.1/1", "ว 2.3 ม.1/5"]
    coverage: partial
    note: "Q = mc∆t และสมดุลความร้อนครบ ส่วน Q = mL ของ ม.1/1 อยู่ใน physics.thermal.phase-change ไม่มีการขยายตัวของสสารและการถ่ายโอนความร้อน 3 แบบ"
  - topic: physics.thermal.phase-change
    indicators: ["ว 2.1 ป.5/1", "ว 2.1 ม.1/10", "ว 2.3 ม.1/1"]
    coverage: partial
    note: "ความร้อนแฝงและกราฟอุณหภูมิขณะเปลี่ยนสถานะครบ ไม่ได้อธิบายด้วยแบบจำลองอนุภาค"
  - topic: physics.electricity.current-voltage
    indicators: ["ว 2.3 ม.3/1", "ว 2.3 ม.3/2", "ว 2.3 ม.3/3"]
    coverage: partial
    note: "กฎของโอห์มและการต่อแอมมิเตอร์ โวลต์มิเตอร์ครบ กราฟระหว่างกระแสกับความต่างศักย์มีเพียงย่อหน้าสั้นและโจทย์ไม่กี่ข้อ"
  - topic: physics.electricity.circuits
    indicators: ["ว 2.3 ป.6/5", "ว 2.3 ป.6/6", "ว 2.3 ม.3/4"]
    coverage: partial
    note: "ม.3/4 ครบ การต่อหลอดไฟแบบอนุกรมและขนานกับข้อดีข้อเสียมีผ่านตัวอย่างไฟประดับและไฟบ้าน ไม่มีแผนภาพวงจรด้วยสัญลักษณ์ (ม.3/5)"
  - topic: physics.electricity.electric-power
    indicators: ["ว 2.3 ม.3/8"]
    coverage: full
  # ---------- คลื่น เสียง แสง ----------
  - topic: physics.waves.wave-basics
    indicators: ["ว 2.3 ม.3/10"]
    coverage: full
  - topic: physics.waves.wave-behaviour
    indicators: ["ว 2.3 ม.5/3"]
    coverage: full
  - topic: physics.waves.sound
    indicators: ["ว 2.3 ป.1/1", "ว 2.3 ป.5/1", "ว 2.3 ป.5/2", "ว 2.3 ป.5/3", "ว 2.3 ม.5/5", "ว 2.3 ม.5/6"]
    coverage: partial
    note: "การเกิดเสียง ตัวกลาง เสียงสูงต่ำ ดังค่อย และเดซิเบลครบ เสียงสะท้อนมี แต่ไม่มีการหักเห การเลี้ยวเบน การรวมคลื่นเสียง และผลของความถี่ต่อการได้ยินมีเพียงช่วงความถี่ที่หูได้ยิน"
  - topic: physics.light.reflection
    indicators: ["ว 2.3 ม.3/13", "ว 2.3 ม.3/14"]
    coverage: full
  - topic: physics.light.refraction
    indicators: ["ว 2.3 ม.3/15", "ว 2.3 ม.3/16"]
    coverage: partial
    note: "การหักเหและภาพจากเลนส์บางครบ ไม่มีการกระจายแสงขาวผ่านปริซึม"
  # ---------- ว 2.1 สสาร (เคมี) ----------
  - topic: chemistry.matter.atoms
    indicators: ["ว 2.1 ม.1/8", "ว 2.1 ม.5/3", "ว 2.1 ม.5/4"]
    coverage: full
  - topic: chemistry.matter.periodic-table
    indicators: ["ว 2.1 ม.5/5"]
    coverage: partial
    note: "หมู่ คาบ และโลหะ อโลหะ กึ่งโลหะครบ ธาตุแทรนซิชันบอกว่าอยู่นอกขอบเขต และไม่ได้ใช้คำว่ากลุ่มธาตุเรพรีเซนเททีฟ"
  - topic: chemistry.bonding.covalent
    indicators: ["ว 2.1 ม.5/8"]
    coverage: full
