<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="sans-serif">
<title>เส้นเวลาของ past simple: เหตุการณ์ที่จบแล้วเมื่อวานเรียงตามลำดับ</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect x="0" y="0" width="720" height="250" fill="#fff"/>
<text x="20.0" y="30.0" font-size="15" text-anchor="start" fill="#111" font-weight="bold" >Yesterday I got up at six, took the bus and arrived at school at eight.</text>
<line x1="30.0" y1="120.0" x2="690.0" y2="120.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/><line x1="510.0" y1="104.0" x2="510.0" y2="136.0" stroke="#c0392b" stroke-width="2.5" /><text x="510.0" y="154.0" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold" >now (ตอนนี้)</text><text x="34.0" y="154.0" font-size="13" text-anchor="start" fill="#555" font-weight="normal" >past (อดีต)</text><text x="686.0" y="154.0" font-size="13" text-anchor="end" fill="#555" font-weight="normal" >future (อนาคต)</text>
<rect x="110.0" y="58.0" width="320.0" height="112.0" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" rx="8"/>
<text x="270.0" y="164.0" font-size="13" text-anchor="middle" fill="#555" font-weight="normal" >yesterday (เมื่อวาน)</text>
<line x1="152.0" y1="112.0" x2="168.0" y2="128.0" stroke="#1f4e9c" stroke-width="3" /><line x1="152.0" y1="128.0" x2="168.0" y2="112.0" stroke="#1f4e9c" stroke-width="3" />
<text x="160.0" y="98.0" font-size="13" text-anchor="middle" fill="#1f4e9c" font-weight="bold" >1 got up</text>
<line x1="262.0" y1="112.0" x2="278.0" y2="128.0" stroke="#1f4e9c" stroke-width="3" /><line x1="262.0" y1="128.0" x2="278.0" y2="112.0" stroke="#1f4e9c" stroke-width="3" />
<text x="270.0" y="98.0" font-size="13" text-anchor="middle" fill="#1f4e9c" font-weight="bold" >2 took the bus</text>
<line x1="372.0" y1="112.0" x2="388.0" y2="128.0" stroke="#1f4e9c" stroke-width="3" /><line x1="372.0" y1="128.0" x2="388.0" y2="112.0" stroke="#1f4e9c" stroke-width="3" />
<text x="380.0" y="98.0" font-size="13" text-anchor="middle" fill="#1f4e9c" font-weight="bold" >3 arrived</text>
<text x="360.0" y="210.0" font-size="13" text-anchor="middle" fill="#444" font-weight="normal" >เหตุการณ์จบลงแล้วในอดีตทีละเหตุการณ์ เรียงตามลำดับเวลา ไม่ต่อเนื่องมาถึงตอนนี้</text>
</svg>
