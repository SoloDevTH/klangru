  - { framework: th-core-2551-health-pe, indicators: ["พ 5.1 ม.4-6/3"], coverage: full, note: "สอนส่วนความรุนแรง (ปัจจัยหลายระดับในสังคมไทยและแนวทางป้องกัน) ครบ ส่วนปัจจัยที่มีผลต่อสุขภาพอยู่ใน health.disease.ncd-leading-causes" }
  - { framework: th-core-2551-health-pe, indicators: ["พ 5.1 ม.3/2"], coverage: partial, note: "สอนวิธีหลีกเลี่ยงและประโยคชักชวนเพื่อนให้แก้ปัญหาโดยสันติผ่านสถานการณ์ แต่การหลีกเลี่ยงและชักชวนต้องปฏิบัติจริง" }
  - { framework: th-core-2551-health-pe, indicators: ["พ 5.1 ม.4-6/6"], coverage: partial, note: "แถวเพิ่มตามบันทึก health-32: ส่วน \"ความรุนแรง\" ของตัวชี้วัดนี้ฝึกการตัดสินใจในสถานการณ์ความรุนแรงในคู่รัก การกลั่นแกล้ง และความรุนแรงในครอบครัว (ผู้เรียนเป็นผู้ถูกกระทำหรือผู้เห็นเหตุการณ์) ส่วนสุขภาพอยู่ใน health.safety.risk-behaviour-life-skills และการใช้ทักษะต้องฝึกในสถานการณ์จริง" }
