    ai_assisted: true

  - id: biology.ecology.biomes-succession.p014
    topics: [biology.ecology.biomes-succession]
    difficulty: 4
    type: numeric
    stem: "นักเรียนสำรวจจำนวนชนิดพืชในไร่ร้างที่ทิ้งไว้นานต่างกัน (ข้อมูลสมมติ) ทิ้ง 1 ปี พบ 12 ชนิด 5 ปี พบ 25 ชนิด 15 ปี พบ 40 ชนิด 40 ปี พบ 55 ชนิด ระหว่างปีที่ 5 ถึงปีที่ 15 จำนวนชนิดเพิ่มขึ้นเฉลี่ยปีละกี่ชนิด"
    answer: { value: 1.5, unit: "ชนิดต่อปี", tolerance: 0.02 }
    misconceptions:
      - { match: 15, feedback: "15 ชนิดคือที่เพิ่มขึ้นทั้งหมดใน 10 ปี ต้องหารด้วยจำนวนปี" }
      - { match: 1.36, feedback: "หารด้วย 15 − 5 + 1 = 11 ไม่ถูก ช่วงเวลาคือ 15 − 5 = 10 ปี" }
    hints:
      - "อัตราเฉลี่ย = จำนวนที่เปลี่ยน ÷ เวลาที่ผ่านไป"
      - "$\\frac{40 - 25}{15 - 5}$"
    solution: "$\\frac{40 - 25}{15 - 5} = \\frac{15}{10} = 1.5$ ชนิดต่อปี ช่วงหลังจากนั้น (15 ถึง 40 ปี) เพิ่มเพียง 0.6 ชนิดต่อปี แสดงว่าการเปลี่ยนแปลงช้าลงเมื่อเข้าใกล้สังคมสมบูรณ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.biomes-succession.p015
