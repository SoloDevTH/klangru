<rect x="400.0" y="112.0" width="340.0" height="46.0" rx="8" fill="#d5f5e3" stroke="#333" stroke-width="1.5"/>
<text x="570.0" y="140.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#111">คลินิกวัยรุ่นในโรงพยาบาลรัฐ</text>
<rect x="20.0" y="172.0" width="330.0" height="46.0" rx="8" fill="#f8f9f9" stroke="#333" stroke-width="1.5"/>
<text x="185.0" y="200.0" font-size="13" text-anchor="middle" fill="#111">ถุงยางแตกหรือไม่ได้ป้องกัน</text>
<line x1="352.0" y1="195.0" x2="398.0" y2="195.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="400.0" y="172.0" width="340.0" height="46.0" rx="8" fill="#d6eaf8" stroke="#333" stroke-width="1.5"/>
<text x="570.0" y="200.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#111">คุมกำเนิดฉุกเฉินภายใน 5 วัน + ปรึกษาเรื่อง PEP</text>
<rect x="20.0" y="232.0" width="330.0" height="46.0" rx="8" fill="#f8f9f9" stroke="#333" stroke-width="1.5"/>
<text x="185.0" y="260.0" font-size="13" text-anchor="middle" fill="#111">ถูกบังคับหรือถูกล่วงละเมิดทางเพศ</text>
<line x1="352.0" y1="255.0" x2="398.0" y2="255.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="400.0" y="232.0" width="340.0" height="46.0" rx="8" fill="#fadbd8" stroke="#333" stroke-width="1.5"/>
<text x="570.0" y="260.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#111">1300  ศูนย์พึ่งได้  191</text>
<rect x="20.0" y="292.0" width="330.0" height="46.0" rx="8" fill="#f8f9f9" stroke="#333" stroke-width="1.5"/>
<text x="185.0" y="320.0" font-size="13" text-anchor="middle" fill="#111">เลือดออกมาก ปวดท้องรุนแรง หมดสติ</text>
<line x1="352.0" y1="315.0" x2="398.0" y2="315.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="400.0" y="292.0" width="340.0" height="46.0" rx="8" fill="#f5b7b1" stroke="#333" stroke-width="1.5"/>
<text x="570.0" y="320.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#111">1669 ทันที</text>
