problems:
  - id: physics.light.light-shadows.p001
    topics: [physics.light.light-shadows]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นแหล่งกำเนิดแสง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ดวงอาทิตย์", correct: true }
      - { id: b, text: "หลอดไฟที่เปิดอยู่", correct: true }
      - { id: c, text: "หิ่งห้อย", correct: true }
      - { id: d, text: "ดวงจันทร์", feedback: "ดวงจันทร์ไม่ได้ให้แสงเอง เราเห็นดวงจันทร์สว่างเพราะดวงจันทร์สะท้อนแสงจากดวงอาทิตย์" }
      - { id: e, text: "กระจกเงา", feedback: "กระจกเงาสะท้อนแสงที่มาตกกระทบ ในห้องมืดกระจกเงาไม่สว่างเลย จึงไม่ใช่แหล่งกำเนิดแสง" }
    hints:
      - "แหล่งกำเนิดแสงต้องให้แสงออกมาเอง"
      - "ลองนึกว่าถ้าอยู่ในที่มืดสนิท สิ่งนั้นยังสว่างอยู่หรือไม่"
    solution: "ดวงอาทิตย์ หลอดไฟที่เปิดอยู่ และหิ่งห้อยให้แสงออกมาเอง จึงเป็นแหล่งกำเนิดแสง ดวงจันทร์และกระจกเงาเพียงสะท้อนแสงจากที่อื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.light-shadows.p002
    topics: [physics.light.light-shadows]
    difficulty: 1
    type: mcq
    stem: "ในห้องที่มืดสนิท ไม่มีแสงเข้ามาเลย เราจะมองเห็นลูกบอลสีขาวที่วางอยู่หรือไม่"
    choices:
      - { id: a, text: "มองไม่เห็น เพราะไม่มีแสงสะท้อนจากลูกบอลเข้าตา", correct: true }
      - { id: b, text: "มองเห็นลาง ๆ เพราะลูกบอลเป็นสีขาว", feedback: "สีขาวสะท้อนแสงได้ดี แต่ถ้าไม่มีแสงมาตกกระทบเลย ก็ไม่มีแสงให้สะท้อนเข้าตา" }
      - { id: c, text: "มองเห็นเมื่อรอสักพักจนตาชินกับความมืด", feedback: "ตาชินกับความมืดช่วยได้เมื่อมีแสงน้อย ๆ แต่ถ้ามืดสนิทจริง ไม่มีแสงเลย ตาก็ไม่มีอะไรให้รับ" }
    hints:
      - "เรามองเห็นวัตถุเมื่อมีอะไรเข้าตา"
      - "ความมืดสนิทคือไม่มีแสงเลย"
    solution: "เรามองเห็นวัตถุเมื่อแสงจากวัตถุเข้าตา ลูกบอลไม่ได้ให้แสงเอง ในห้องมืดสนิทไม่มีแสงให้สะท้อน จึงมองไม่เห็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.light-shadows.p003
    topics: [physics.light.light-shadows]
    difficulty: 1
    type: match
    stem: "จับคู่วัตถุกับชนิดของวัตถุตามการให้แสงผ่าน"
    pairs:
      - { left: "กระจกหน้าต่างใส", right: "ตัวกลางโปร่งใส" }
      - { left: "กระดาษไข", right: "ตัวกลางโปร่งแสง" }
      - { left: "แผ่นไม้อัด", right: "วัตถุทึบแสง" }
    hints:
      - "มองผ่านวัตถุนั้นเห็นชัด เห็นไม่ชัด หรือไม่เห็นเลย"
      - "โปร่งใส: แสงผ่านเกือบหมด โปร่งแสง: ผ่านบางส่วน ทึบแสง: ไม่ผ่าน"
    solution: "กระจกใสให้แสงผ่านเกือบหมด (โปร่งใส) กระดาษไขให้แสงผ่านบางส่วน (โปร่งแสง) แผ่นไม้อัดไม่ให้แสงผ่าน (ทึบแสง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.light-shadows.p004
    topics: [physics.light.light-shadows]
    difficulty: 2
    type: order
    stem: "เรียงลำดับเหตุการณ์ที่ทำให้เรามองเห็นดอกชบาในสวนตอนกลางวัน"
    items:
      - "ดวงอาทิตย์ให้แสงออกมา"
      - "แสงเดินทางเป็นเส้นตรงมาถึงดอกชบา"
      - "แสงสะท้อนจากดอกชบา"
      - "แสงที่สะท้อนเดินทางเข้าสู่ตา"
    hints:
      - "เริ่มจากแหล่งกำเนิดแสง"
      - "ดอกชบาไม่ได้ให้แสงเอง แสงต้องไปถึงดอกไม้ก่อน แล้วจึงมาที่ตา"
    solution: "ดวงอาทิตย์ให้แสง → แสงเดินทางเป็นเส้นตรงถึงดอกชบา → แสงสะท้อนจากดอกชบา → แสงเข้าตา เราจึงมองเห็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.light-shadows.p005
    topics: [physics.light.light-shadows]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นวิธีป้องกันอันตรายต่อดวงตาที่ถูกต้อง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "สวมหมวกปีกกว้างหรือแว่นกันแดดที่กันรังสียูวีเมื่ออยู่กลางแดดจ้า", correct: true }
      - { id: b, text: "อ่านหนังสือในที่ที่มีแสงสว่างเพียงพอ", correct: true }
      - { id: c, text: "ดูสุริยุปราคาผ่านแว่นสำหรับดูดวงอาทิตย์โดยเฉพาะ", correct: true }
      - { id: d, text: "มองดวงอาทิตย์ได้ ถ้าสวมแว่นกันแดดสีเข้ม", feedback: "แว่นกันแดดธรรมดาลดแสงได้ไม่พอ การมองดวงอาทิตย์ยังทำลายจอตาได้ ห้ามมองดวงอาทิตย์โดยตรงเลย" }
      - { id: e, text: "ดูสุริยุปราคาผ่านฟิล์มเอกซเรย์หรือกระจกรมควัน", feedback: "ฟิล์มเอกซเรย์และกระจกรมควันกันแสงที่เป็นอันตรายได้ไม่พอ ต้องใช้แว่นที่ทำมาสำหรับดูดวงอาทิตย์เท่านั้น" }
    hints:
      - "แสงจ้าจากดวงอาทิตย์ทำร้ายตาได้แม้มองเพียงครู่เดียว"
      - "อุปกรณ์ที่ใช้ดูดวงอาทิตย์ต้องผลิตมาเพื่อการนั้นโดยเฉพาะ"
    solution: "ข้อ ก ข ค ถูก การมองดวงอาทิตย์โดยตรง แม้ใส่แว่นกันแดดหรือผ่านฟิล์มเอกซเรย์ เป็นอันตรายต่อจอตา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.light-shadows.p006
    topics: [physics.light.light-shadows]
    difficulty: 2
    type: mcq
    stem: "เงาของมือที่ทำเป็นรูปนกบนผนังมีรูปร่างเหมือนมือ เพราะเหตุใด"
    choices:
      - { id: a, text: "แสงเดินทางเป็นเส้นตรง แสงที่ผ่านขอบมือจึงวาดโครงร่างของมือบนผนัง", correct: true }
      - { id: b, text: "ผนังสะท้อนภาพของมือกลับมาเหมือนกระจกเงา", feedback: "ถ้าเป็นภาพสะท้อนจะต้องเห็นสีและลายของมือด้วย แต่เงาเป็นสีดำ เพราะเป็นบริเวณที่แสงไปไม่ถึง" }
      - { id: c, text: "แสงเลี้ยวอ้อมมือไปตามรูปร่างของมือ", feedback: "ถ้าแสงเลี้ยวอ้อมได้ จะไม่เกิดเงาชัด เงาเกิดเพราะแสงเดินทางตรงและผ่านมือไม่ได้" }
    hints:
      - "แสงเดินทางเป็นเส้นตรงหรือเลี้ยวได้"
      - "ลองนึกถึงเส้นตรงจากดวงไฟผ่านขอบนิ้วไปถึงผนัง"
    solution: "แสงเดินทางเป็นเส้นตรง มือทึบแสงจึงบังแสงไว้ แสงที่ผ่านขอบมือไปถึงผนังเป็นเส้นตรงตามขอบ เงาจึงมีรูปร่างเหมือนมือ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.light-shadows.p007
    topics: [physics.light.light-shadows]
    difficulty: 2
    type: text
    stem: "วัตถุที่แสงผ่านไม่ได้เลย มองผ่านไม่เห็นอะไร และทำให้เกิดเงาชัด เรียกว่าวัตถุอะไร"
    accepted: ["ทึบแสง", "วัตถุทึบแสง", "opaque"]
    misconceptions:
      - { match: "โปร่งแสง", feedback: "ตัวกลางโปร่งแสงยังให้แสงผ่านได้บางส่วน เช่น กระดาษไข แต่โจทย์บอกว่าแสงผ่านไม่ได้เลย" }
      - { match: "โปร่งใส", feedback: "ตัวกลางโปร่งใสให้แสงผ่านได้เกือบหมด เช่น กระจกใส ตรงข้ามกับที่โจทย์บอก" }
    hints:
      - "มีสามชนิด: โปร่งใส โปร่งแสง และ..."
      - "ชนิดที่แสงผ่านไม่ได้เลย"
    solution: "วัตถุทึบแสง เช่น แผ่นไม้ หนังสือ ผนังปูน แสงผ่านไม่ได้ จึงเกิดเงาด้านหลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.light-shadows.p008
    topics: [physics.light.light-shadows]
    difficulty: 3
    type: match
    stem: "นักเรียนส่องไฟฉายผ่านแผ่นวัสดุสามแผ่นไปที่ผนัง แล้วจดผลไว้ จับคู่ผลการทดลองกับชนิดของวัสดุ"
    pairs:
      - { left: "ผนังสว่างเกือบเท่าเดิม และมองผ่านแผ่นเห็นของอีกฝั่งชัด", right: "ตัวกลางโปร่งใส" }
      - { left: "ผนังสว่างจาง ๆ และมองผ่านแผ่นเห็นของอีกฝั่งไม่ชัด", right: "ตัวกลางโปร่งแสง" }
      - { left: "ผนังมืดเป็นเงา และมองผ่านแผ่นไม่เห็นอะไร", right: "วัตถุทึบแสง" }
    hints:
      - "แสงผ่านได้มากเท่าไร ผนังก็สว่างมากเท่านั้น"
      - "ผ่านได้เกือบหมด ผ่านได้บางส่วน หรือไม่ผ่านเลย"
    solution: "แสงผ่านเกือบหมดและมองเห็นชัด → โปร่งใส แสงผ่านบางส่วนและเห็นไม่ชัด → โปร่งแสง แสงไม่ผ่านและเกิดเงา → ทึบแสง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.light-shadows.p009
    topics: [physics.light.light-shadows]
    difficulty: 3
    type: mcq
    stem: "นายหนังตะลุงอยากให้เงาของรูปหนังบนจอใหญ่ขึ้น ควรเลื่อนรูปหนังไปทางใด"
    choices:
      - { id: a, text: "เลื่อนเข้าใกล้ดวงไฟ (ห่างจากจอมากขึ้น)", correct: true }
      - { id: b, text: "เลื่อนเข้าใกล้จอ (ห่างจากดวงไฟมากขึ้น)", feedback: "เมื่อรูปหนังชิดจอ เงาจะมีขนาดใกล้กับรูปหนังจริงและคมขึ้น แต่จะเล็กลง ไม่ใช่ใหญ่ขึ้น" }
      - { id: c, text: "ไม่ต้องเลื่อน ขนาดเงาเท่ากับรูปหนังเสมอ", feedback: "ขนาดเงาเปลี่ยนได้ตามระยะระหว่างวัตถุกับดวงไฟ ลองใช้มือทำเงากับไฟฉายดู" }
    hints:
      - "ลองใช้มือบังไฟฉาย แล้วเลื่อนมือเข้าหาไฟฉาย"
      - "ยิ่งวัตถุใกล้ดวงไฟ วัตถุยิ่งบังแสงเป็นมุมกว้าง"
    solution: "ยิ่งวัตถุอยู่ใกล้ดวงไฟ วัตถุยิ่งบังแสงเป็นมุมกว้าง เงาบนจอจึงใหญ่ขึ้น นายหนังตะลุงจึงขยับรูปหนังเข้าหาดวงไฟเมื่อต้องการเงาใหญ่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.light-shadows.p010
    topics: [physics.light.light-shadows]
    difficulty: 3
    type: mcq
    stem: "ในวันที่ฟ้าแจ่มใส เงาของเสาธงหน้าโรงเรียนจะยาวที่สุดในเวลาใด"
    choices:
      - { id: a, text: "07.30 น.", correct: true }
      - { id: b, text: "10.00 น.", feedback: "ตอน 10 โมง ดวงอาทิตย์ขึ้นสูงแล้ว เงาจึงสั้นกว่าตอนเช้าตรู่" }
      - { id: c, text: "12.00 น.", feedback: "ตอนเที่ยงดวงอาทิตย์อยู่สูงที่สุด เงาจึงสั้นที่สุด ไม่ใช่ยาวที่สุด" }
      - { id: d, text: "14.00 น.", feedback: "ตอนบ่ายสองโมงดวงอาทิตย์ยังค่อนข้างสูง เงายาวขึ้นจากตอนเที่ยงแต่ยังสั้นกว่าตอนเช้าตรู่" }
    hints:
      - "ดวงอาทิตย์อยู่ต่ำหรือสูง เงาจึงยาว"
      - "ดวงอาทิตย์อยู่ต่ำใกล้ขอบฟ้าในตอนเช้าตรู่และตอนเย็น"
    solution: "ตอน 07.30 น. ดวงอาทิตย์อยู่ต่ำใกล้ขอบฟ้า แสงส่องเฉียงมาก เงาจึงยาวที่สุดในตัวเลือก ส่วนตอนเที่ยงดวงอาทิตย์อยู่สูง เงาสั้นที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.light-shadows.p011
    topics: [physics.light.light-shadows]
    difficulty: 3
    type: mcq
    stem: "นักเรียนเจาะรูกลางกระดาษแข็ง 3 แผ่น แล้วตั้งเรียงกันหน้าเปลวเทียน จะมองเห็นเปลวเทียนผ่านรูทั้งสามได้เมื่อใด"
    choices:
      - { id: a, text: "เมื่อรูทั้งสามและเปลวเทียนอยู่ในแนวเส้นตรงเดียวกัน", correct: true }
      - { id: b, text: "เมื่อเลื่อนแผ่นกลางให้เยื้องออกไปเล็กน้อย", feedback: "ถ้ารูเยื้องออกจากแนว แสงที่เดินทางเป็นเส้นตรงจะชนกระดาษ ไม่ผ่านรูทั้งสาม" }
      - { id: c, text: "มองเห็นได้เสมอไม่ว่าจะวางอย่างไร", feedback: "แสงเลี้ยวตามรูที่วางเยื้องกันไม่ได้ การทดลองนี้จึงเป็นหลักฐานว่าแสงเดินทางเป็นเส้นตรง" }
    hints:
      - "แสงเดินทางเป็นเส้นตรงหรือเส้นคด"
      - "แสงต้องผ่านรูทั้งสามโดยไม่เลี้ยว"
    solution: "แสงเดินทางเป็นเส้นตรง จะผ่านรูทั้งสามมาถึงตาได้ก็ต่อเมื่อเปลวเทียน รูทั้งสาม และตาอยู่ในแนวเส้นตรงเดียวกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.light-shadows.p012
    topics: [physics.light.light-shadows]
    difficulty: 4
    type: mcq
    stem: "ข้อใดอธิบายความแตกต่างระหว่างเงามืดกับเงามัวได้ถูกต้อง"
    choices:
      - { id: a, text: "เงามืดไม่มีแสงจากแหล่งกำเนิดแสงไปถึงเลย ส่วนเงามัวมีแสงจากบางส่วนของแหล่งกำเนิดแสงไปถึง", correct: true }
      - { id: b, text: "เงามืดเกิดจากวัตถุทึบแสง ส่วนเงามัวเกิดจากวัตถุโปร่งใส", feedback: "เงามืดและเงามัวเกิดจากวัตถุทึบแสงชิ้นเดียวกันได้พร้อมกัน ความต่างอยู่ที่แสงไปถึงแต่ละบริเวณมากน้อยเท่าไร" }
      - { id: c, text: "เงามัวอยู่ตรงกลาง ล้อมรอบด้วยเงามืด", feedback: "สลับกัน เงามืดอยู่ตรงกลางเพราะถูกบังมากที่สุด เงามัวอยู่รอบนอก" }
    hints:
      - "ดูว่าแต่ละบริเวณได้รับแสงจากแหล่งกำเนิดแสงมากน้อยแค่ไหน"
      - "ตรงกลางเงาถูกบังจากทุกส่วนของดวงไฟ ขอบนอกถูกบังเพียงบางส่วน"
    solution: "เงามืดคือบริเวณที่แสงจากทุกส่วนของแหล่งกำเนิดแสงถูกบัง จึงมืดสนิท เงามัวคือบริเวณรอบนอกที่แสงจากบางส่วนของแหล่งกำเนิดแสงยังไปถึง จึงมืดไม่สนิท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.light-shadows.p013
    topics: [physics.light.light-shadows]
    difficulty: 4
    type: mcq
    stem: "ส่องลูกบอลด้วยไฟ LED ดวงเล็กมาก 1 ดวง แล้วเปลี่ยนเป็นหลอดไฟยาวขนาดใหญ่ เงาบนฉากจะเปลี่ยนไปอย่างไร"
    choices:
      - { id: a, text: "จากมีแต่เงามืดขอบคม เป็นมีเงามืดตรงกลางและเงามัวล้อมรอบ", correct: true }
      - { id: b, text: "จากมีเงามืดและเงามัว เป็นมีแต่เงามืด", feedback: "สลับกัน แหล่งกำเนิดแสงที่เล็กมากให้เงามืดขอบคม แหล่งกำเนิดแสงใหญ่จึงทำให้เกิดเงามัว" }
      - { id: c, text: "เงาหายไป เพราะหลอดไฟใหญ่สว่างกว่า", feedback: "ลูกบอลยังทึบแสงและยังบังแสงอยู่ เงาจึงไม่หายไป เพียงแต่ขอบเงาเปลี่ยน" }
    hints:
      - "แหล่งกำเนิดแสงจุดให้เงาแบบใด"
      - "หลอดไฟใหญ่มีหลายส่วน บางบริเวณถูกบังจากบางส่วนเท่านั้น"
    solution: "ไฟ LED ดวงเล็กเปรียบเหมือนแหล่งกำเนิดแสงจุด ให้แต่เงามืดขอบคม หลอดไฟใหญ่มีแสงมาจากหลายตำแหน่ง ขอบเงาบางบริเวณถูกบังเพียงบางส่วน จึงเกิดเงามัวล้อมรอบเงามืด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.light-shadows.p014
    topics: [physics.light.light-shadows]
    difficulty: 4
    type: numeric
    stem: "นักเรียนวางกระดาษแข็งไว้ระหว่างดวงไฟกับฉากที่อยู่กับที่ แล้วเลื่อนกระดาษแข็งไปที่ระยะต่าง ๆ จากดวงไฟ วัดความสูงของเงาได้ดังนี้ ห่างดวงไฟ 10 cm เงาสูง 24 cm ห่าง 20 cm เงาสูง 12 cm ห่าง 30 cm เงาสูง 8 cm ถ้าห่างดวงไฟ 40 cm เงาจะสูงกี่เซนติเมตร (ตอบในหน่วย cm)"
    answer: { value: 6, unit: cm }
    hints:
      - "ลองคูณระยะจากดวงไฟกับความสูงของเงาในแต่ละแถว"
      - "10 × 24, 20 × 12, 30 × 8 ได้ค่าเท่ากันทุกแถว ใช้ค่านั้นหาเงาที่ 40 cm"
    misconceptions:
      - { match: 4, feedback: "ดูเหมือนคิดว่าเงาลดลงทีละ 4 cm ตามคู่สุดท้าย แต่เงาลดลง 12 แล้ว 4 ไม่ได้ลดเท่ากันทุกครั้ง ลองหาแบบรูปด้วยการคูณ" }
    solution: "ระยะ × ความสูงเงา $= 10 \\times 24 = 20 \\times 12 = 30 \\times 8 = 240$ ทุกแถว ที่ 40 cm เงาสูง $240 \\div 40 = 6$ cm (ยิ่งห่างดวงไฟ เงายิ่งเล็ก)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.light-shadows.p015
    topics: [physics.light.light-shadows]
    difficulty: 5
    type: numeric
    stem: "จากภาพ หลอดไฟดวงเล็กอยู่ห่างแผ่นกระดาษแข็ง 20 cm และห่างฉาก 60 cm กระดาษแข็งสูง 10 cm ตั้งตรงขนานกับฉาก เงาของกระดาษแข็งบนฉากสูงกี่เซนติเมตร (ตอบในหน่วย cm)"
    figure: { src: shadow-setup.svg, alt: "หลอดไฟดวงเล็กอยู่ทางซ้าย ห่างไปทางขวา 20 cm มีแผ่นกระดาษแข็งตั้งตรงสูง 10 cm โดยหลอดไฟอยู่ระดับกึ่งกลางของแผ่น ฉากตั้งตรงอยู่ห่างจากหลอดไฟ 60 cm ภาพไม่ได้วาดเงา" }
    answer: { value: 30, unit: cm }
    hints:
      - "แสงเดินทางเป็นเส้นตรงจากหลอดไฟผ่านขอบบนและขอบล่างของกระดาษแข็งไปถึงฉาก"
      - "ฉากอยู่ไกลจากหลอดไฟเป็นกี่เท่าของระยะถึงกระดาษแข็ง"
      - "เส้นตรงสองเส้นถ่างออกเป็นสามเหลี่ยม ความกว้างเพิ่มขึ้นตามระยะทาง"
    misconceptions:
      - { match: 10, feedback: "เงาจะเท่ากับวัตถุเมื่อวัตถุชิดฉาก แต่ที่นี่แสงถ่างออกตลอดทางจากกระดาษถึงฉาก เงาจึงใหญ่กว่าวัตถุ" }
      - { match: 20, feedback: "ดูเหมือนใช้ระยะจากกระดาษถึงฉาก (40 cm) เทียบกับ 20 cm ต้องเทียบระยะจากหลอดไฟถึงฉาก (60 cm) กับระยะจากหลอดไฟถึงกระดาษ (20 cm)" }
    solution: "แสงจากหลอดไฟเป็นเส้นตรงถ่างออกเป็นสามเหลี่ยม ฉากไกลกว่ากระดาษ $60 \\div 20 = 3$ เท่า เงาจึงสูง $10 \\times 3 = 30$ cm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.light-shadows.p016
    topics: [physics.light.light-shadows]
    difficulty: 5
    type: mcq
    stem: "ระหว่างสุริยุปราคา ดวงจันทร์บังแสงอาทิตย์และทอดเงาลงบนโลก คนที่อยู่ในบริเวณเงามืดของดวงจันทร์ กับคนที่อยู่ในบริเวณเงามัว จะเห็นต่างกันอย่างไร"
    choices:
      - { id: a, text: "คนในเงามืดเห็นดวงอาทิตย์ถูกบังทั้งดวง คนในเงามัวเห็นดวงอาทิตย์ถูกบังบางส่วน", correct: true }
      - { id: b, text: "คนในเงามัวเห็นดวงอาทิตย์ถูกบังทั้งดวง คนในเงามืดเห็นถูกบังบางส่วน", feedback: "สลับกัน เงามืดคือบริเวณที่แสงจากดวงอาทิตย์ทั้งดวงถูกบัง จึงเห็นถูกบังทั้งดวง" }
      - { id: c, text: "ทั้งสองบริเวณเห็นเหมือนกัน เพราะเป็นเงาของดวงจันทร์ดวงเดียวกัน", feedback: "ดวงอาทิตย์เป็นแหล่งกำเนิดแสงขนาดใหญ่ เงาจึงแบ่งเป็นเงามืดและเงามัวที่ได้รับแสงไม่เท่ากัน" }
    hints:
      - "ดวงอาทิตย์เป็นแหล่งกำเนิดแสงขนาดใหญ่ เงาของดวงจันทร์จึงมีสองส่วน"
      - "เงามืด: แสงจากทุกส่วนถูกบัง เงามัว: แสงจากบางส่วนยังมาถึง"
    solution: "ในเงามืด แสงจากทุกส่วนของดวงอาทิตย์ถูกดวงจันทร์บัง จึงเห็นสุริยุปราคาเต็มดวง ในเงามัว แสงจากบางส่วนของดวงอาทิตย์ยังมาถึง จึงเห็นสุริยุปราคาบางส่วน (ทั้งสองแบบห้ามมองด้วยตาเปล่า)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.light-shadows.p017
    topics: [physics.light.light-shadows]
    difficulty: 4
    type: mcq
    stem: "ข้อใดเป็นแนวคิดที่ผิดเกี่ยวกับการมองเห็น"
    choices:
      - { id: a, text: "ตาส่งแสงออกไปกระทบวัตถุ เราจึงมองเห็นวัตถุ", correct: true }
      - { id: b, text: "เรามองเห็นหลอดไฟที่เปิดอยู่เพราะแสงจากหลอดไฟเข้าตาโดยตรง", feedback: "ข้อนี้ถูกต้อง หลอดไฟเป็นแหล่งกำเนิดแสง แสงของมันเข้าตาเราได้โดยตรง" }
      - { id: c, text: "เรามองเห็นหนังสือเพราะแสงสะท้อนจากหนังสือเข้าตา", feedback: "ข้อนี้ถูกต้อง หนังสือไม่ได้ให้แสงเอง เราเห็นเพราะแสงสะท้อนจากหนังสือ" }
    hints:
      - "โจทย์ถามหาแนวคิดที่ผิด"
      - "ถ้าตาส่งแสงได้เอง เราจะมองเห็นในห้องมืดสนิทหรือไม่"
    solution: "แนวคิดที่ผิดคือ ตาส่งแสงออกไป ถ้าเป็นจริง เราต้องมองเห็นในที่มืดสนิทได้ ที่จริงตารับแสงที่มาจากวัตถุ"
