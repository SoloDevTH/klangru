id: math.geometry.nets-views
subject: math
title: { th: รูปคลี่ หน้าตัด และภาพจากมุมมองต่าง ๆ, en: "Nets, cross-sections and views" }
summary: เชื่อมรูปสามมิติกับรูปสองมิติ ระบุทรงจากรูปคลี่ ตรวจรูปคลี่ลูกบาศก์ หาหน้าตัด ทรงที่เกิดจากการหมุน และภาพด้านหน้า ด้านข้าง ด้านบนของทรงที่ต่อจากลูกบาศก์
difficulty: 2.5
minutes: 35
prerequisites: [math.geometry.shapes]
encompasses:
  - { id: math.geometry.shapes, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: common-nets.svg
    alt: "รูปคลี่ห้าแบบ ทรงสี่เหลี่ยมมุมฉากเป็นสี่เหลี่ยมมุมฉากสี่รูปเรียงตั้งและมีสองรูปยื่นออกข้าง ปริซึมสามเหลี่ยมเป็นสี่เหลี่ยมมุมฉากสามรูปเรียงกันมีสามเหลี่ยมติดบนและล่าง พีระมิดฐานสี่เหลี่ยมเป็นจัตุรัสตรงกลางมีสามเหลี่ยมสี่รูปติดทุกด้าน ทรงกระบอกเป็นสี่เหลี่ยมมุมฉากมีวงกลมติดด้านบนและด้านล่าง กรวยเป็นรูปเสี้ยววงกลมมีวงกลมเล็กติดอยู่ข้างล่าง"
    caption: "นับรูปแต่ละชนิดในรูปคลี่ แล้วจะรู้ว่าเป็นทรงอะไร"
  - type: figure
    src: cube-nets.svg
    alt: "รูปจัตุรัสหกรูปต่อกันห้าแบบ สามแบบแรกพับเป็นลูกบาศก์ได้ ได้แก่ รูปกากบาท แถวยาวสี่ช่องที่มีช่องยื่นลงทางซ้ายและยื่นขึ้นทางขวา และรูปขั้นบันได สองแบบหลังพับไม่ได้ แบบหนึ่งมีกลุ่มสองคูณสองช่อง อีกแบบเป็นแถวยาวห้าช่อง"
    caption: "รูปคลี่ลูกบาศก์มี 11 แบบ แบบที่มีกลุ่ม $2 \\times 2$ หรือแถวยาวเกิน 4 ช่องพับไม่ได้"
  - { type: check, problem: math.geometry.nets-views.p003, prompt: "ตรวจกลุ่ม 2 × 2 และลองพับในใจ" }
  - type: worked-example
    title: หาหน้าตรงข้ามในรูปคลี่ลูกบาศก์
    problem: "รูปคลี่รูปกากบาทมีแถวตั้ง 4 ช่อง จากบนลงล่างเป็น P, Q, R, S และมีช่อง T ติดทางซ้ายของ Q กับช่อง U ติดทางขวาของ Q หน้าใดอยู่ตรงข้ามกัน"
    steps:
      - text: "ในแถวตรง หน้าที่เว้นกันหนึ่งช่องอยู่ตรงข้ามกัน แถวตั้งคือ P, Q, R, S จึงได้ P ตรงข้าม R และ Q ตรงข้าม S"
        why: "แถวตั้ง 4 ช่องพับพันรอบเป็นผนังสี่ด้าน ช่องที่ 1 กับช่องที่ 3 จึงอยู่คนละฝั่ง"
      - text: "แถวนอนคือ T, Q, U ซึ่ง T กับ U เว้นกันหนึ่งช่อง (Q) จึงอยู่ตรงข้ามกัน"
      - text: "ตรวจ: ได้คู่ตรงข้าม 3 คู่ ครบทั้ง 6 หน้า และไม่มีหน้าใดซ้ำ"
    answer: "P–R, Q–S และ T–U"
  - type: figure
    src: cross-sections.svg
    alt: "ทรงสี่แบบที่ถูกตัด หน้าตัดระบายสีส้ม ปริซึมสามเหลี่ยมตัดขนานกับหน้าสามเหลี่ยมได้สามเหลี่ยม พีระมิดฐานสี่เหลี่ยมตัดขนานกับฐานได้สี่เหลี่ยมที่เล็กกว่าฐาน ทรงกระบอกตัดตามแนวแกนได้สี่เหลี่ยมมุมฉาก กรวยตัดผ่านยอดตั้งฉากกับฐานได้สามเหลี่ยม"
    caption: "ปริซึมตัดขนานกับฐานได้รูปเท่าฐานเสมอ ส่วนพีระมิดได้รูปที่เล็กลง"
  - type: figure
    src: cube-views.svg
    alt: "ทางซ้ายเป็นภาพไอโซเมตริกของทรงที่ต่อจากลูกบาศก์ 5 ก้อน แถวหน้าสามกองสูง 2, 1, 1 จากซ้ายไปขวา และมีอีกหนึ่งก้อนอยู่หลังกองซ้าย มีลูกศรบอกด้านหน้าและด้านขวา ทางขวาเป็นภาพสามด้าน ภาพด้านหน้าเป็นแถวล่าง 3 ช่องและช่องบน 1 ช่องทางซ้าย ภาพด้านข้างจากด้านขวาเป็นแถวล่าง 2 ช่องและช่องบน 1 ช่องทางซ้าย ภาพด้านบนเป็นแถวล่าง 3 ช่องและแถวบน 1 ช่องทางซ้าย"
    caption: "ภาพด้านหน้ามี 4 ช่องแม้ทรงมี 5 ก้อน เพราะก้อนหลังซ่อนอยู่หลังกองที่สูงกว่า"
  - { type: check, problem: math.geometry.nets-views.p007, prompt: "ความสูงในภาพด้านหน้าคือกองที่สูงที่สุดในคอลัมน์" }
  - type: worked-example
    title: ทรงจากภาพสามด้าน
    problem: "ภาพด้านบนเป็นแถวเดียว 3 ช่อง ภาพด้านหน้าเป็นคอลัมน์สูง 1, 3, 2 จากซ้ายไปขวา ทรงนี้มีลูกบาศก์กี่ก้อน"
    steps:
      - text: "ภาพด้านบนเป็นแถวเดียว แปลว่ามีกองเรียงหน้ากระดานแถวเดียว 3 กอง ไม่มีกองซ้อนอยู่ข้างหลัง"
      - text: "เมื่อไม่มีกองข้างหลัง ความสูงในภาพด้านหน้าคือความสูงของแต่ละกองพอดี"
        why: "ถ้ามีหลายแถว กองหลังอาจซ่อนอยู่ จะบอกจำนวนแน่นอนไม่ได้"
      - text: "รวม $1 + 3 + 2 = 6$ ก้อน"
    answer: "6 ก้อน"
glossary:
  - { term: รูปคลี่, definition: "รูปสองมิติที่ได้จากการคลี่ผิวของทรงสามมิติออกเป็นแผ่นเดียว พับกลับแล้วได้ทรงเดิม" }
  - { term: หน้าตัด, definition: "รูปสองมิติที่เกิดจากการตัดทรงสามมิติด้วยระนาบ" }
  - { term: ภาพด้านหน้า, definition: "รูปที่เห็นเมื่อมองทรงตรงจากด้านหน้า แสดงความกว้างและความสูง" }
  - { term: ภาพด้านบน, definition: "รูปที่เห็นเมื่อมองลงมาจากข้างบน หรือแปลน แสดงตำแหน่งที่มีของวางอยู่" }
  - { term: ทรงที่เกิดจากการหมุน, definition: "ทรงสามมิติที่ได้จากการหมุนรูปสองมิติรอบเส้นตรงเส้นหนึ่งครบรอบ เช่น ทรงกระบอก กรวย ทรงกลม" }
flashcards:
  - { front: "รูปคลี่: รูป n เหลี่ยม 2 รูป กับสี่เหลี่ยมมุมฉาก n รูป", back: "ปริซึม n เหลี่ยม" }
  - { front: "รูปคลี่ลูกบาศก์: หน้าใดอยู่ตรงข้ามกัน", back: "หน้าที่เว้นกันหนึ่งช่องในแถวตรง" }
  - { front: "ตัดพีระมิดขนานกับฐาน", back: "ได้รูปทรงเดียวกับฐานแต่เล็กลงเมื่อตัดใกล้ยอด" }
  - { front: "หมุนสามเหลี่ยมมุมฉากรอบด้านประกอบมุมฉาก", back: "ได้กรวย" }
  - { front: "ความสูงแต่ละคอลัมน์ในภาพด้านหน้า", back: "เท่ากับกองที่สูงที่สุดในคอลัมน์นั้น" }
