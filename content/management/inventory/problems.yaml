problems:
  - id: management.operations.inventory.p001
    topics: [management.operations.inventory]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นต้นทุนการเก็บรักษาสินค้าคงคลัง"
    choices:
      - { id: a, text: "ดอกเบี้ยของเงินที่จมอยู่ในสินค้า และค่าเช่าพื้นที่โกดัง", correct: true }
      - { id: b, text: "ค่าขนส่งต่อเที่ยวที่ผู้ขายเรียกเก็บ", feedback: "ค่าขนส่งต่อเที่ยวเกิดทุกครั้งที่สั่ง จึงเป็นต้นทุนการสั่งซื้อ" }
      - { id: c, text: "เวลาที่เจ้าหน้าที่ใช้ทำใบสั่งซื้อ", feedback: "เกิดต่อการสั่งหนึ่งครั้ง จึงเป็นต้นทุนการสั่งซื้อ" }
      - { id: d, text: "ราคาสินค้าที่จ่ายให้ผู้ขาย", feedback: "ราคาสินค้าไม่ใช่ต้นทุนการเก็บ แต่ใช้คำนวณต้นทุนการเก็บเป็นร้อยละของราคาได้" }
    hints:
      - "ต้นทุนการเก็บเพิ่มตามจำนวนของที่ถืออยู่และระยะเวลาที่ถือ"
      - "ต้นทุนการสั่งเกิดต่อครั้งที่สั่ง"
    solution: "ดอกเบี้ยของเงินที่จมและค่าพื้นที่เพิ่มตามปริมาณของในคลัง จึงเป็นต้นทุนการเก็บรักษา ส่วนค่าขนส่งต่อเที่ยวและการทำใบสั่งเป็นต้นทุนการสั่งซื้อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.inventory.p002
    topics: [management.operations.inventory]
    difficulty: 1
    type: match
    stem: "จับคู่คำกับความหมาย"
    pairs:
      - { left: "EOQ", right: "ปริมาณสั่งต่อครั้งที่ทำให้ต้นทุนการสั่งและการเก็บรวมต่ำสุด" }
      - { left: "จุดสั่งซื้อใหม่", right: "ระดับคงคลังที่เป็นสัญญาณให้สั่งของ" }
      - { left: "สินค้าคงคลังสำรอง", right: "ของที่เก็บเพิ่มไว้รับความต้องการที่สูงกว่าเฉลี่ยในช่วงรอของ" }
      - { left: "ระดับบริการ", right: "ความน่าจะเป็นที่ของไม่ขาดในรอบการสั่งหนึ่งรอบ" }
    hints:
      - "EOQ ตอบว่าสั่งเท่าไร จุดสั่งซื้อใหม่ตอบว่าสั่งเมื่อไร"
      - "สินค้าคงคลังสำรองเพิ่มขึ้นเมื่อต้องการระดับบริการสูงขึ้น"
    solution: "EOQ คือปริมาณสั่งที่ประหยัดที่สุด จุดสั่งซื้อใหม่คือสัญญาณให้สั่ง สินค้าคงคลังสำรองรับความผันแปร และระดับบริการคือโอกาสที่ของไม่ขาด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.inventory.p003
    topics: [management.operations.inventory]
    difficulty: 2
    type: numeric
    stem: "ร้านวัสดุก่อสร้าง (สมมติ) ขายปูนซีเมนต์ปีละ 2,400 ถุง ต้นทุนการสั่งครั้งละ 200 บาท ต้นทุนการเก็บถุงละ 6 บาทต่อปี ปริมาณการสั่งซื้อที่ประหยัดเป็นกี่ถุง"
    answer: { value: 400, unit: ถุง }
    hints:
      - "$Q^* = \\sqrt{\\dfrac{2DS}{H}}$"
      - "$\\sqrt{\\dfrac{2 \\times 2{,}400 \\times 200}{6}}$"
    misconceptions:
      - { match: 282.84, feedback: "ลืมคูณ 2 ใต้เครื่องหมายราก" }
      - { match: 160000, feedback: "ลืมถอดรากที่สอง" }
    solution: "$Q^* = \\sqrt{\\dfrac{2(2{,}400)(200)}{6}} = \\sqrt{160{,}000} = 400$ ถุง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.inventory.p004
    topics: [management.operations.inventory]
    difficulty: 2
    type: numeric
    stem: "ร้านกาแฟใช้นมสดวันละ 30 ลิตรคงที่ ผู้ขายส่งของภายใน 7 วัน ถ้าไม่เก็บสินค้าคงคลังสำรอง จุดสั่งซื้อใหม่เป็นกี่ลิตร"
    answer: { value: 210, unit: ลิตร }
    hints:
      - "ROP = ความต้องการต่อวัน × จำนวนวันที่รอของ"
      - "30 × 7"
    misconceptions:
      - { match: 37, feedback: "บวกแทนคูณ ต้องใช้นมวันละ 30 ลิตรตลอด 7 วันที่รอ" }
      - { match: 4.29, feedback: "หารแทนคูณ" }
    solution: "$\\text{ROP} = 30 \\times 7 = 210$ ลิตร เมื่อนมเหลือ 210 ลิตรให้สั่ง ของใหม่จะมาถึงพอดีตอนนมหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.inventory.p005
    topics: [management.operations.inventory]
    difficulty: 2
    type: match
    stem: "จับคู่งานขนถ่ายวัสดุในศูนย์กระจายสินค้ากับอุปกรณ์ที่เหมาะสม"
    pairs:
      - { left: "ย้ายพาเลทจากรถบรรทุกไปวางพื้นใกล้ประตู ระยะ 10 เมตร", right: "รถลากพาเลทมือ" }
      - { left: "ยกพาเลทขึ้นชั้นวางสูง 6 เมตร", right: "รถยก" }
      - { left: "ส่งกล่องพัสดุเล็กจำนวนมากต่อเนื่องจากจุดคัดแยกไปจุดบรรจุ", right: "สายพานลำเลียง" }
      - { left: "ขนชั้นวางสินค้าตามเส้นทางเดิมซ้ำ ๆ ตลอดวันโดยไม่ใช้คนขับ", right: "รถขนส่งอัตโนมัติ" }
    hints:
      - "ดูระยะทาง ความสูง และความต่อเนื่องของงาน"
      - "งานซ้ำ ๆ เส้นทางเดิมเหมาะกับระบบอัตโนมัติ"
    solution: "ระยะสั้นบนพื้นใช้รถลากพาเลทมือ ยกขึ้นที่สูงใช้รถยก ของเล็กปริมาณมากต่อเนื่องใช้สายพาน และเส้นทางเดิมซ้ำ ๆ ใช้รถขนส่งอัตโนมัติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.inventory.p006
    topics: [management.operations.inventory]
    difficulty: 3
    type: numeric
    stem: "ร้านวัสดุก่อสร้างในข้อก่อน (D = 2,400 ถุงต่อปี, S = 200 บาท, H = 6 บาทต่อถุงต่อปี) สั่งครั้งละ 400 ถุง ต้นทุนการสั่งรวมกับต้นทุนการเก็บต่อปีเป็นกี่บาท"
    answer: { value: 2400, unit: บาท }
    hints:
      - "ต้นทุนการสั่ง = (D/Q) × S และต้นทุนการเก็บ = (Q/2) × H"
      - "ที่ EOQ ทั้งสองส่วนเท่ากัน"
    misconceptions:
      - { match: 1200, feedback: "คิดแค่ส่วนเดียว ต้นทุนรวมต้องบวกทั้งต้นทุนการสั่งและการเก็บ" }
      - { match: 3600, feedback: "ใช้ Q แทน Q/2 ในต้นทุนการเก็บ คงคลังเฉลี่ยคือครึ่งหนึ่งของปริมาณสั่ง" }
    solution: "ต้นทุนการสั่ง $(2{,}400 \\div 400) \\times 200 = 1{,}200$ บาท ต้นทุนการเก็บ $(400 \\div 2) \\times 6 = 1{,}200$ บาท รวม $2{,}400$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.inventory.p007
    topics: [management.operations.inventory]
    difficulty: 3
    type: numeric
    stem: "ความต้องการน้ำเกลือของโรงพยาบาลมีส่วนเบี่ยงเบนมาตรฐานวันละ 8 ขวด ผู้ขายส่งของภายใน 9 วัน ต้องการระดับบริการ 95% ($z = 1.645$) ต้องเก็บสินค้าคงคลังสำรองอย่างน้อยกี่ขวด (ปัดขึ้นเป็นจำนวนเต็ม)"
    answer: { value: 40, unit: ขวด }
    hints:
      - "$SS = z\\,\\sigma_d\\sqrt{L}$"
      - "$\\sqrt{9} = 3$"
    misconceptions:
      - { match: 14, feedback: "ลืมคูณ $\\sqrt{L}$ ความผันแปรสะสมตลอด 9 วันที่รอของ" }
      - { match: 119, feedback: "คูณด้วย $L$ แทน $\\sqrt{L}$ ความแปรปรวนบวกกันได้ แต่ส่วนเบี่ยงเบนมาตรฐานเพิ่มตามรากที่สองของจำนวนวัน" }
    solution: "$SS = 1.645 \\times 8 \\times \\sqrt{9} = 1.645 \\times 24 = 39.48$ ปัดขึ้นเป็น 40 ขวด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.inventory.p008
    topics: [management.operations.inventory]
    difficulty: 3
    type: numeric
    stem: "จากแผนภูมิพาเรโตของวัสดุ 10 รายการในภาพ ถ้ากำหนดให้กลุ่ม A คือรายการแรก ๆ ที่ร้อยละสะสมของมูลค่าไม่เกิน 80% กลุ่ม A คิดเป็นร้อยละเท่าใดของจำนวนรายการทั้งหมด"
    figure:
      src: p-abc.svg
      alt: "แผนภูมิพาเรโตของวัสดุสิบรายการ M1 ถึง M10 มูลค่าการใช้ต่อปี (พันบาท) M1 420, M2 250, M3 130, M4 70, M5 50, M6 30, M7 20, M8 15, M9 10, M10 5 รวม 1,000 พันบาท เส้นสีม่วงคือร้อยละสะสม"
    answer: { value: 30, unit: "%" }
    hints:
      - "คิดร้อยละสะสมทีละรายการจากมากไปน้อย จนเกิน 80%"
      - "นับจำนวนรายการที่อยู่ในกลุ่ม A แล้วหารด้วย 10"
    misconceptions:
      - { match: 80, feedback: "นั่นคือร้อยละของมูลค่า โจทย์ถามร้อยละของจำนวนรายการ" }
      - { match: 3, feedback: "นั่นคือจำนวนรายการ ต้องแปลงเป็นร้อยละของ 10 รายการ" }
    solution: "ร้อยละสะสม M1 42% M2 67% M3 80% M4 87% กลุ่ม A คือ M1–M3 จำนวน 3 จาก 10 รายการ $= 30\\%$ ของรายการ แต่มีมูลค่า 80% ของทั้งหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.inventory.p009
    topics: [management.operations.inventory]
    difficulty: 3
    type: mcq
    stem: "ผู้ขายขึ้นค่าขนส่งต่อเที่ยว ทำให้ต้นทุนการสั่งซื้อเพิ่มเป็น 2 เท่า โดยค่าอื่นเท่าเดิม EOQ จะเปลี่ยนไปอย่างไร"
    choices:
      - { id: a, text: "เพิ่มขึ้นประมาณ 1.41 เท่า", correct: true }
      - { id: b, text: "เพิ่มขึ้น 2 เท่า", feedback: "S อยู่ใต้เครื่องหมายราก การเพิ่ม S 2 เท่าทำให้ EOQ เพิ่ม $\\sqrt{2}$ เท่า" }
      - { id: c, text: "ลดลงครึ่งหนึ่ง", feedback: "ต้นทุนการสั่งแพงขึ้น ควรสั่งครั้งละมากขึ้นและสั่งน้อยครั้งลง EOQ จึงเพิ่ม" }
      - { id: d, text: "ไม่เปลี่ยน", feedback: "EOQ ขึ้นกับ S โดยตรง เมื่อ S เปลี่ยน EOQ ก็เปลี่ยน" }
    hints:
      - "$Q^* = \\sqrt{2DS/H}$"
      - "ถ้า S คูณ 2 ค่าใต้รากก็คูณ 2"
    solution: "$Q^*_{\\text{ใหม่}} = \\sqrt{2D(2S)/H} = \\sqrt{2} \\, Q^* \\approx 1.41\\, Q^*$ สั่งครั้งละมากขึ้นราว 41% เพื่อลดจำนวนครั้งที่สั่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.inventory.p010
    topics: [management.operations.inventory]
    difficulty: 4
    type: numeric
    stem: "ร้านขายยาใช้ชุดตรวจโควิดเฉลี่ยวันละ 25 ชุด ส่วนเบี่ยงเบนมาตรฐานรายวัน 6 ชุด ผู้ขายส่งของภายใน 4 วัน ต้องการระดับบริการ 99% ($z = 2.326$) จุดสั่งซื้อใหม่เป็นกี่ชุด (ปัดขึ้นเป็นจำนวนเต็ม)"
    answer: { value: 128, unit: ชุด }
    hints:
      - "ROP = dL + zσd√L"
      - "dL = 25 × 4 และ √4 = 2"
    misconceptions:
      - { match: 114, feedback: "ลืมคูณ $\\sqrt{L}$ ในคงคลังสำรอง" }
      - { match: 120, feedback: "ใช้ $z = 1.645$ ของระดับบริการ 95% โจทย์ต้องการ 99% จึงใช้ $z = 2.326$" }
    solution: "$dL = 25 \\times 4 = 100$ ชุด $SS = 2.326 \\times 6 \\times 2 = 27.91$ ชุด $\\text{ROP} = 127.91$ ปัดขึ้นเป็น 128 ชุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.inventory.p011
    topics: [management.operations.inventory]
    difficulty: 4
    type: numeric
    stem: "ร้านค้าปลีก (สมมติ) ใช้ระบบทบทวนเป็นรอบ นับของทุก 10 วัน ผู้ขายส่งของใน 6 วัน สินค้าขายเฉลี่ยวันละ 20 ชิ้น ส่วนเบี่ยงเบนมาตรฐานรายวัน 5 ชิ้น ระดับบริการ 95% ($z = 1.645$) วันนี้นับได้ 150 ชิ้น ต้องสั่งกี่ชิ้น (ปัดขึ้นเป็นจำนวนเต็ม)"
    answer: { value: 203, unit: ชิ้น }
    hints:
      - "ระดับเป้าหมาย $T = d(R + L) + z\\,\\sigma_d\\sqrt{R + L}$ โดย $R + L = 16$ วัน"
      - "ปริมาณสั่ง = T − คงคลังที่มี"
    misconceptions:
      - { match: 170, feedback: "ลืมคงคลังสำรอง $z\\sigma_d\\sqrt{R + L}$" }
      - { match: 353, feedback: "นั่นคือระดับเป้าหมาย ยังต้องหักคงคลังที่มี 150 ชิ้น" }
    solution: "$T = 20 \\times 16 + 1.645 \\times 5 \\times \\sqrt{16} = 320 + 32.9 = 352.9$ ชิ้น สั่ง $352.9 - 150 = 202.9$ ปัดขึ้นเป็น 203 ชิ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.inventory.p012
    topics: [management.operations.inventory]
    difficulty: 4
    type: numeric
    stem: "โรงงานซื้อวัตถุดิบปีละ 6,000 กิโลกรัม ราคากิโลกรัมละ 120 บาท ต้นทุนการสั่งครั้งละ 600 บาท ต้นทุนการเก็บต่อปีเท่ากับ 25% ของราคาสินค้า EOQ เป็นกี่กิโลกรัม (ตอบเป็นจำนวนเต็มใกล้ที่สุด)"
    answer: { value: 490, unit: กิโลกรัม, tolerance: 0.5 }
    hints:
      - "แปลงต้นทุนการเก็บเป็นบาทต่อกิโลกรัมต่อปีก่อน: H = 0.25 × 120"
      - "แทนค่าใน $\\sqrt{2DS/H}$"
    misconceptions:
      - { match: 536.66, feedback: "ใช้ 25 เป็น H โดยตรง ต้องคิด 25% ของราคา 120 บาท ได้ H = 30 บาท" }
      - { match: 346.41, feedback: "ลืมคูณ 2 ใต้เครื่องหมายราก" }
    solution: "$H = 0.25 \\times 120 = 30$ บาทต่อกิโลกรัมต่อปี $Q^* = \\sqrt{2(6{,}000)(600)/30} = \\sqrt{240{,}000} \\approx 489.9$ ประมาณ 490 กิโลกรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.inventory.p013
    topics: [management.operations.inventory]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนการวิเคราะห์ ABC ของคลังวัสดุ"
    items:
      - "หาปริมาณใช้ต่อปีและราคาต่อหน่วยของทุกรายการ"
      - "คำนวณมูลค่าการใช้ต่อปีของแต่ละรายการ"
      - "เรียงรายการจากมูลค่ามากไปน้อย"
      - "คำนวณร้อยละสะสมของมูลค่า"
      - "แบ่งกลุ่ม A B C ตามเกณฑ์ และกำหนดวิธีควบคุมของแต่ละกลุ่ม"
    hints:
      - "มูลค่าการใช้ต่อปี = ปริมาณ × ราคา"
      - "ต้องเรียงก่อนจึงคิดร้อยละสะสมได้"
    solution: "ข้อมูล → มูลค่าต่อปี → เรียงมากไปน้อย → ร้อยละสะสม → แบ่งกลุ่มและกำหนดวิธีควบคุม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.inventory.p014
    topics: [management.operations.inventory]
    difficulty: 5
    type: numeric
