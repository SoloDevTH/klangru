      - { id: c, text: "โต๊ะ", feedback: "โต๊ะเป็นชื่อสิ่งของ จึงเป็นคำนาม" }
      - { id: d, text: "และ", feedback: "และใช้เชื่อมคำหรือข้อความ จึงเป็นคำสันธาน" }
