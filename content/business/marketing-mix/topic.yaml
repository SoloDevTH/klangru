id: business.marketing.marketing-mix
subject: business
title:
  th: ตลาดเป้าหมายและส่วนประสมทางการตลาด (4P)
  en: Target markets and the marketing mix (4P)
summary: ความต้องการของลูกค้า การแบ่งส่วนตลาด ตลาดเป้าหมาย การวางตำแหน่ง ผลิตภัณฑ์ ราคา ช่องทางจัดจำหน่าย การส่งเสริมการตลาด และวงจรชีวิตผลิตภัณฑ์
difficulty: 3.5
minutes: 40
prerequisites:
- business.econ.consumer-rights
- management.principles.functions
encompasses:
- id: business.econ.consumer-rights
  weight: 0.2
- id: management.principles.functions
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: stp-4p.svg
  alt: แผนภาพแถวบนสี่กล่องเรียงต่อกันด้วยลูกศร ความต้องการของลูกค้า → แบ่งส่วนตลาด (Segmentation) → เลือกตลาดเป้าหมาย (Targeting) → วางตำแหน่ง (Positioning) จากกล่องวางตำแหน่งมีเส้นแตกออกลงไปสี่กล่องแถวล่าง คือ ผลิตภัณฑ์ (คุณภาพ แบรนด์ บรรจุภัณฑ์) ราคา (ต้นทุน คู่แข่ง คุณค่า) ช่องทางจัดจำหน่าย (หน้าร้าน ออนไลน์ ขนส่ง) และการส่งเสริมการตลาด (โฆษณา ลดราคา โซเชียล) ข้อความบอกว่าต้องออกแบบ 4P ให้สอดคล้องกับตำแหน่ง ตัวอย่างน้ำพริกแม่ศรี (สมมติ) เป้าหมายคนทำงานในเมือง ตำแหน่งน้ำพริกสูตรบ้าน สะอาด พกง่าย ใช้กระปุกเล็ก ราคา 59 บาท ขายในร้านสะดวกซื้อและออนไลน์ และใช้รีวิวในโซเชียล
  caption: เลือกลูกค้าให้ชัดก่อน แล้วจึงออกแบบ 4P ให้สอดคล้องกัน
- type: check
  problem: business.marketing.marketing-mix.p001
  prompt: แต่ละการตัดสินใจเป็น P ตัวไหน
- type: worked-example
  title: ประมาณขนาดตลาดและกำไรของสินค้า OTOP
  problem: กลุ่มแม่บ้านทำกล้วยตาก (สมมติ) ตั้งเป้านักท่องเที่ยวที่แวะร้านของฝากริมทาง เดือนละ $6{,}000$ คน คาดว่า $8\%$ จะซื้อ คนละ $2$ ถุง ราคาถุงละ $45$ บาท ต้นทุนถุงละ $27$ บาท หายอดขายและกำไรขั้นต้นต่อเดือน
  steps:
  - text: ผู้ซื้อ $= 6{,}000 \times 0.08 = 480$ คน
    why: ไม่ใช่ทุกคนที่แวะจะซื้อ จึงคูณสัดส่วนที่คาดว่าจะซื้อ
  - text: จำนวนถุง $= 480 \times 2 = 960$ ถุง ยอดขาย $= 960 \times 45 = 43{,}200$ บาท
  - text: กำไรต่อถุง $= 45 - 27 = 18$ บาท คิดเป็น $\dfrac{18}{45} = 40\%$ ของราคาขาย
    why: อัตรากำไรเทียบกับราคาขาย ไม่ใช่ต้นทุน
  - text: กำไรขั้นต้น $= 960 \times 18 = 17{,}280$ บาทต่อเดือน (ยังไม่หักค่าเช่าและค่าแรง)
  answer: ยอดขาย $43{,}200$ บาท กำไรขั้นต้น $17{,}280$ บาทต่อเดือน
- type: figure
  src: plc.svg
  alt: กราฟวงจรชีวิตผลิตภัณฑ์ แกนนอนคือเวลา แบ่งเป็นสี่ช่วง แนะนำ เติบโต อิ่มตัว ถดถอย เส้นยอดขายเริ่มจากศูนย์ เพิ่มช้าในขั้นแนะนำ เพิ่มเร็วในขั้นเติบโต สูงสุดในขั้นอิ่มตัว แล้วลดลงในขั้นถดถอย เส้นประของกำไรติดลบในขั้นแนะนำ เริ่มเป็นบวกในขั้นเติบโต สูงสุดราวรอยต่อขั้นเติบโตกับอิ่มตัว แล้วลดลงจนติดลบในช่วงท้ายของขั้นถดถอย
  caption: ยอดขายและกำไรเปลี่ยนไปตามขั้นของวงจรชีวิตผลิตภัณฑ์
- type: check
  problem: business.marketing.marketing-mix.p009
  prompt: อ่านแผนที่ตำแหน่ง
- type: worked-example
  title: ลดราคาแล้วต้องขายเพิ่มเท่าไร
  problem: ร้านชานม (สมมติ) ขายแก้วละ $40$ บาท ต้นทุน $24$ บาท ขายวันละ $200$ แก้ว ถ้าจัดโปรลด $5$ บาทต่อแก้ว ต้องขายวันละกี่แก้วกำไรรวมจึงเท่าเดิม
  steps:
  - text: กำไรเดิม $= (40 - 24) \times 200 = 3{,}200$ บาทต่อวัน
  - text: กำไรต่อแก้วหลังลด $= 35 - 24 = 11$ บาท
    why: ส่วนลดตัดออกจากกำไรทั้งหมด ต้นทุนไม่ได้ลดตาม
  - text: ต้องขาย $= 3{,}200 \div 11 \approx 290.9$ จึงต้องขายอย่างน้อย $291$ แก้ว
  - text: ลดราคา $12.5\%$ แต่ต้องขายเพิ่มประมาณ $45.5\%$ โปรโมชันจึงคุ้มเมื่อดึงลูกค้าใหม่ได้มากจริง
  answer: อย่างน้อย $291$ แก้วต่อวัน
glossary:
- term: การแบ่งส่วนตลาด (Segmentation)
  definition: การแบ่งลูกค้าเป็นกลุ่มที่มีความต้องการหรือลักษณะคล้ายกัน
- term: ตลาดเป้าหมาย (Targeting)
  definition: กลุ่มลูกค้าที่ธุรกิจเลือกเสนอสินค้าให้ เพราะได้ประโยชน์จากจุดเด่นของสินค้ามากที่สุด
- term: การวางตำแหน่ง (Positioning)
  definition: การทำให้ลูกค้าจดจำสินค้าในแบบที่ต่างจากคู่แข่ง เช่น ถูกและเร็ว หรือพรีเมียม
- term: ส่วนประสมทางการตลาด (4P)
  definition: ผลิตภัณฑ์ ราคา ช่องทางจัดจำหน่าย และการส่งเสริมการตลาด ที่ธุรกิจปรับให้ตรงกับตลาดเป้าหมาย
- term: แผนที่ตำแหน่ง
  definition: แผนภาพที่วางสินค้าหรือร้านตามสองคุณสมบัติที่ลูกค้าใช้ตัดสินใจ เช่น ราคาและคุณภาพ
- term: วงจรชีวิตผลิตภัณฑ์
  definition: ขั้นแนะนำ เติบโต อิ่มตัว และถดถอยของยอดขายสินค้าตามเวลา
- term: การส่งเสริมการขาย
  definition: สิ่งจูงใจระยะสั้นให้ลูกค้าซื้อทันที เช่น ส่วนลด ของแถม แต้มสะสม
flashcards:
- front: 4P
  back: Product ผลิตภัณฑ์ · Price ราคา · Place ช่องทางจัดจำหน่าย · Promotion การส่งเสริมการตลาด
- front: STP
  back: แบ่งส่วนตลาด → เลือกตลาดเป้าหมาย → วางตำแหน่ง
- front: เกณฑ์แบ่งส่วนตลาด
  back: ภูมิศาสตร์ · ประชากรศาสตร์ · จิตวิทยาและไลฟ์สไตล์ · พฤติกรรม
- front: วงจรชีวิตผลิตภัณฑ์
  back: แนะนำ → เติบโต → อิ่มตัว → ถดถอย
- front: อัตรากำไรต่อราคาขาย
  back: (ราคา − ต้นทุน) ÷ ราคา × 100
