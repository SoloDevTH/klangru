      - { id: c, text: "กฎข้อ 4: 8 จุดติดกันด้านเดียว", feedback: "มีข้อมูลเพียง 3 จุด" }
      - { id: d, text: "ไม่เข้ากฎข้อใดเลย", feedback: "104.8 และ 105.1 อยู่เลย +2σ (104) ทั้งคู่ เป็น 2 ใน 3 จุด" }
