id: computer.algorithms.intro
subject: computer
title: { th: อัลกอริทึม ผังงาน และการแก้ปัญหาทีละขั้น, en: "Algorithms, flowcharts and step-by-step problem solving" }
summary: เขียนลำดับขั้นตอนแก้ปัญหาให้ชัดเจน ใช้ผังงานและรหัสลำลอง รู้จักโครงสร้างแบบลำดับ ทางเลือก และวนซ้ำ ไล่การทำงานเพื่อทายผลลัพธ์ และหาข้อผิดพลาด
difficulty: 1.5
minutes: 35
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - type: figure
    src: flowchart-symbols.svg
    alt: "สัญลักษณ์ผังงาน 4 แบบเรียงจากซ้ายไปขวา: วงรีเขียนว่าเริ่ม ใช้แทนเริ่มต้นหรือจบ, สี่เหลี่ยมด้านขนานเขียนว่ารับ/แสดง ใช้แทนรับข้อมูลหรือแสดงผล, สี่เหลี่ยมผืนผ้าเขียนว่า x = x + 1 ใช้แทนการประมวลผล, สี่เหลี่ยมข้าวหลามตัดเขียนว่า x > 5 ? ใช้แทนการตัดสินใจตามเงื่อนไข"
    caption: "สัญลักษณ์ผังงานที่ใช้บ่อย ต่อกันด้วยลูกศรบอกทิศทางการทำงาน"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: com.alg.p004, prompt: "ลองไล่ทีละขั้นก่อนดูตัวอย่างถัดไป" }
  - type: worked-example
    title: ส่งฟรีเมื่อซื้อครบ 300 บาท
    problem: "ร้านค้าออนไลน์ใช้อัลกอริทึม: รับยอดซื้อ `total` ถ้า `total >= 300` ไม่คิดค่าส่ง ไม่เช่นนั้นบวกค่าส่ง 40 บาท แล้วแสดงยอดที่ต้องจ่าย ถ้าซื้อของ 280 บาท ต้องจ่ายเท่าใด"
    steps:
      - text: "รับข้อมูลเข้า: `total = 280`"
      - text: "ตรวจเงื่อนไข `280 >= 300` เป็น **เท็จ**"
        why: "280 น้อยกว่า 300 จึงไม่ถึงเกณฑ์ส่งฟรี ทางออกของการตัดสินใจคือทาง \"ไม่ใช่\""
      - text: "ทำคำสั่งในทาง \"ไม่ใช่\": `total = total + 40 = 280 + 40 = 320`"
      - text: "แสดงผล `total` ซึ่งตอนนี้เป็น 320"
        why: "ค่า total ถูกเปลี่ยนในขั้นก่อนแล้ว ค่าที่แสดงจึงเป็นค่าใหม่ ไม่ใช่ 280"
    answer: "ต้องจ่าย 320 บาท"
  - type: worked-example
    title: ออมเงินกี่วันจึงถึง 200 บาท
    problem: "ไล่รหัสลำลองแล้วบอกค่า `days` และ `m` ที่แสดง\n\n```\nm = 100\ndays = 0\nwhile m < 200:\n    m = m + 30\n    days = days + 1\nshow days, m\n```"
    steps:
      - text: "ก่อนวน: `m = 100`, `days = 0` ตรวจ `100 < 200` จริง จึงเข้าวน"
      - text: "รอบ 1: `m = 130`, `days = 1` ตรวจ `130 < 200` จริง วนต่อ"
      - text: "รอบ 2: `m = 160`, `days = 2` ตรวจ `160 < 200` จริง วนต่อ"
      - text: "รอบ 3: `m = 190`, `days = 3` ตรวจ `190 < 200` จริง วนต่อ"
        why: "190 ยังน้อยกว่า 200 อยู่ แม้จะใกล้แล้วก็ต้องวนอีกรอบ"
      - text: "รอบ 4: `m = 220`, `days = 4` ตรวจ `220 < 200` เท็จ จึงออกจากวน"
        why: "while ตรวจเงื่อนไขก่อนเริ่มทุกรอบ เมื่อเป็นเท็จจะข้ามไปทำคำสั่งหลังวงวนทันที"
      - text: "แสดงผล `days = 4` และ `m = 220`"
    answer: "`days = 4`, `m = 220`"
  - { type: check, problem: com.alg.p007, prompt: "คำสั่งนี้ใช้โครงสร้างแบบใด" }
glossary:
  - { term: อัลกอริทึม (algorithm), definition: "ลำดับขั้นตอนที่ชัดเจนและมีจุดจบ สำหรับทำงานหรือแก้ปัญหาให้ได้ผลลัพธ์ที่ต้องการ" }
  - { term: ผังงาน (flowchart), definition: "แผนภาพแสดงอัลกอริทึมด้วยสัญลักษณ์มาตรฐาน เช่น วงรี สี่เหลี่ยม ข้าวหลามตัด ต่อกันด้วยลูกศร" }
  - { term: รหัสลำลอง (pseudocode), definition: "การเขียนอัลกอริทึมคล้ายโปรแกรม แต่ไม่ต้องถูกไวยากรณ์ของภาษาใดภาษาหนึ่ง" }
  - { term: การวนซ้ำ (loop), definition: "การทำชุดคำสั่งเดิมซ้ำตามจำนวนรอบ หรือซ้ำขณะที่เงื่อนไขยังเป็นจริง" }
  - { term: การไล่โปรแกรม (trace), definition: "การทำตามอัลกอริทึมทีละขั้นด้วยมือ และจดค่าของตัวแปรทุกตัวเพื่อทายผลลัพธ์หรือหาข้อผิดพลาด" }
flashcards:
  - { front: "โครงสร้างพื้นฐานของอัลกอริทึม 3 แบบ", back: "แบบลำดับ แบบมีทางเลือก (เงื่อนไข) และแบบวนซ้ำ" }
  - { front: "สัญลักษณ์ข้าวหลามตัดในผังงานหมายถึงอะไร", back: "การตัดสินใจตามเงื่อนไข มีทางออกสองทาง ใช่ และ ไม่ใช่" }
  - { front: "`s = s + i` ในรหัสลำลองหมายถึงอะไร", back: "นำค่า s เดิมบวก i แล้วเก็บผลกลับลงใน s (ไม่ใช่สมการ)" }
  - { front: "ลักษณะของอัลกอริทึมที่ดี", back: "ทุกขั้นชัดเจน เรียงลำดับถูก มีจุดจบ และบอกข้อมูลเข้ากับผลลัพธ์" }
