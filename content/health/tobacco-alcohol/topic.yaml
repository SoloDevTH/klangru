id: health.substances.tobacco-alcohol
subject: health
title: { th: "บุหรี่ บุหรี่ไฟฟ้า และเครื่องดื่มแอลกอฮอล์", en: "Cigarettes, e-cigarettes and alcohol" }
summary: ผลเสียของบุหรี่ บุหรี่ไฟฟ้า และแอลกอฮอล์ต่อร่างกายและสมองวัยรุ่น แอลกอฮอล์กับอุบัติเหตุ กฎหมายเรื่องอายุ 20 ปีและการห้ามบุหรี่ไฟฟ้า ทักษะการปฏิเสธ และสายเลิกบุหรี่ 1600
difficulty: 3
minutes: 30
prerequisites: [health.safety.medicine-use]
encompasses:
  - { id: health.safety.medicine-use, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ผลต่อร่างกาย
    src: body-effects.svg
    alt: "แผนภาพร่างกายอย่างง่าย ฝั่งซ้ายผลของบุหรี่และบุหรี่ไฟฟ้า สมอง นิโคตินทำให้ติด รบกวนสมองวัยรุ่น ปากและฟัน ฟันเหลือง กลิ่นปาก มะเร็งช่องปาก ปอด ไอเรื้อรัง ถุงลมโป่งพอง มะเร็งปอด หัวใจและหลอดเลือด เสี่ยงหัวใจขาดเลือด อัมพาต ควันมือสองทำร้ายคนรอบข้าง ฝั่งขวาผลของแอลกอฮอล์ สมอง ตัดสินใจช้า เสียการทรงตัว หัวใจ ความดันสูง หัวใจเต้นผิดจังหวะ ตับ ตับอักเสบ ตับแข็ง กระเพาะอาหาร อักเสบ เป็นแผล เมาแล้วขับ อุบัติเหตุ"
    caption: "แผนภาพอย่างง่าย ตำแหน่งอวัยวะโดยประมาณ"
  - type: figure
    title: สี่ขั้นการปฏิเสธ
    src: refusal-steps.svg
    alt: "ผังสี่ขั้น 1 ปฏิเสธชัด ไม่เอา ขอบใจ 2 บอกเหตุผล ฉันไม่อยากให้ปอดพังตั้งแต่อายุ 14 3 เสนอทางเลือก ไปเตะบอลกันดีกว่า 4 ออกจากที่นั่น ถ้ายังถูกตื๊อ เดินออกมาเลย ด้านล่างเขียนว่าไม่ต้องตำหนิหรือดูถูกคนที่สูบหรือดื่ม บอกการตัดสินใจของเราเท่านั้น"
  - type: worked-example
    title: ปฏิเสธในงานเลี้ยง
    problem: "ในงานวันเกิด ลูกพี่ลูกน้องยื่นบุหรี่ไฟฟ้าให้นนท์ (อายุ 14) และบอกว่า \"แค่ไอน้ำ ไม่อันตรายหรอก\" นนท์ควรตอบอย่างไร"
    steps:
      - text: "ตรวจข้อเท็จจริง: บุหรี่ไฟฟ้าไม่ใช่แค่ไอน้ำ มีนิโคตินที่ทำให้ติด และผิดกฎหมายไทยทั้งการนำเข้าและการขาย"
      - text: "ปฏิเสธชัด: \"ไม่เอา ขอบใจนะ\""
      - text: "บอกเหตุผลของตัวเองโดยไม่ตำหนิ: \"ผมซ้อมบอลอยู่ อยากให้ปอดดี ๆ\""
        why: "การพูดถึงตัวเองแทนการว่าอีกฝ่ายทำให้ไม่เสียความสัมพันธ์"
      - text: "เสนอทางเลือก: \"ไปกินเค้กกันดีกว่า\" ถ้ายังถูกตื๊อ ให้เดินไปหาผู้ใหญ่หรือเพื่อนกลุ่มอื่น"
    answer: "ปฏิเสธชัด บอกเหตุผลของตัวเอง เสนอทางเลือก และออกจากสถานการณ์ถ้าจำเป็น"
  - { type: check, problem: health.substances.tobacco-alcohol.p002, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: เกณฑ์แอลกอฮอล์ของผู้ขับขี่
    problem: "ผู้ขับขี่สองคนมีแอลกอฮอล์ในเลือด 35 มิลลิกรัมเปอร์เซ็นต์เท่ากัน คนหนึ่งอายุ 19 ปี อีกคนอายุ 30 ปีและมีใบขับขี่ตลอดชีพ กฎหมายถือว่าใครเมาสุรา"
    steps:
      - text: "ผู้ขับขี่อายุไม่ถึง 20 ปีใช้เกณฑ์เกิน 20 มก.% ส่วนผู้ขับขี่ทั่วไปใช้เกณฑ์เกิน 50 มก.%"
      - text: "คนอายุ 19 ปี: 35 > 20 จึงถือว่าเมาสุรา"
      - text: "คนอายุ 30 ปี: 35 ไม่เกิน 50 จึงยังไม่ถึงเกณฑ์ตามกฎหมาย"
      - text: "แต่แอลกอฮอล์ระดับนี้ก็ทำให้ตอบสนองช้าลงแล้ว"
        why: "เกณฑ์กฎหมายไม่ใช่ระดับที่ปลอดภัย วิธีที่ปลอดภัยที่สุดคือดื่มไม่ขับ"
    answer: "คนอายุ 19 ปีถือว่าเมาสุรา และทั้งสองคนไม่ควรขับ"
  - { type: check, problem: health.substances.tobacco-alcohol.p009 }
glossary:
  - { term: นิโคติน, definition: "สารในยาสูบและน้ำยาบุหรี่ไฟฟ้าส่วนใหญ่ ทำให้ติดง่าย โดยเฉพาะในวัยรุ่น" }
  - { term: ควันบุหรี่มือสอง, definition: "ควันที่คนไม่ได้สูบหายใจเข้าไปจากคนรอบข้าง เป็นอันตรายต่อสุขภาพ" }
  - { term: บุหรี่ไฟฟ้า, definition: "อุปกรณ์ที่ให้ความร้อนกับน้ำยาจนเป็นละอองให้สูด ห้ามนำเข้าและห้ามขายในประเทศไทย" }
  - { term: มิลลิกรัมเปอร์เซ็นต์, definition: "หน่วยวัดแอลกอฮอล์ในเลือด คือจำนวนมิลลิกรัมของแอลกอฮอล์ในเลือด 100 มิลลิลิตร" }
  - { term: ทักษะการปฏิเสธ, definition: "การพูดไม่อย่างชัดเจน บอกเหตุผล เสนอทางเลือก และออกจากสถานการณ์เมื่อจำเป็น" }
flashcards:
  - { front: "อายุขั้นต่ำที่ร้านขายเหล้าและบุหรี่ให้ได้", back: "20 ปีบริบูรณ์" }
  - { front: "บุหรี่ไฟฟ้าในประเทศไทย", back: "ห้ามนำเข้า (ประกาศพาณิชย์ 2557) และห้ามขาย (คำสั่ง สคบ. 9/2558)" }
  - { front: "เกณฑ์เมาสุราของผู้ขับขี่อายุไม่ถึง 20 ปี", back: "แอลกอฮอล์ในเลือดเกิน 20 มก.% (ผู้ขับขี่ทั่วไปเกิน 50 มก.%)" }
  - { front: "สายเลิกบุหรี่ / สายเลิกเหล้า", back: "1600 (ฟรีทุกเครือข่าย) / 1413" }
