  - id: computer.ai.supervised-learning.p014
    topics: [computer.ai.supervised-learning]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน `fit_line(xs, ys)` ที่รับลิสต์ของ x และ y แล้วคืนค่าเป็นทูเพิล (a, b) ของเส้นถดถอย y = ax + b ด้วยกำลังสองน้อยที่สุด ตามสูตรในบทเรียน"
    starter: |
      def fit_line(xs, ys):
          pass
    tests: |
      a, b = fit_line([1, 2, 3, 4], [1, 3, 2, 4])
      assert abs(a - 0.8) < 1e-9, f"ความชันควรเป็น 0.8 แต่ได้ {a}"
      assert abs(b - 0.5) < 1e-9, f"จุดตัดควรเป็น 0.5 แต่ได้ {b}"
      a2, b2 = fit_line([0, 1, 2], [1, 3, 5])
      assert abs(a2 - 2) < 1e-9 and abs(b2 - 1) < 1e-9, f"ข้อมูลที่อยู่บนเส้น y = 2x + 1 ควรได้ (2, 1) แต่ได้ ({a2}, {b2})"
    reference: |
      def fit_line(xs, ys):
          n = len(xs)
          mx = sum(xs) / n
          my = sum(ys) / n
          a = sum((x - mx) * (y - my) for x, y in zip(xs, ys)) / sum((x - mx) ** 2 for x in xs)
          b = my - a * mx
          return a, b
    hints:
      - "หาค่าเฉลี่ยของ x และ y ก่อน"
      - "ความชันคือผลรวมของ (x − x̄)(y − ȳ) หารด้วยผลรวมของ (x − x̄)²"
      - "จุดตัดคือ ȳ − a × x̄"
    solution: "คำนวณ x̄ และ ȳ แล้วหาความชัน a จากผลรวมสองตัวตามสูตร จากนั้นหาจุดตัด b = ȳ − a x̄ คืนค่า (a, b)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.supervised-learning.p015
    topics: [computer.ai.supervised-learning]
    difficulty: 5
    type: code
    stem: "เขียนฟังก์ชัน `best_threshold(xs, labels)` เพื่อหาจุดแบ่งหนึ่งจุดสำหรับต้นไม้ชั้นเดียว จุดแบ่งที่ใช้ได้คือค่ากึ่งกลางระหว่างค่า x ที่เรียงกันสองค่าที่ต่างกัน กลุ่มซ้ายคือ x ≤ จุดแบ่ง และกลุ่มขวาคือ x > จุดแบ่ง ให้เลือกจุดที่ทำให้จินีถ่วงน้ำหนักของสองกลุ่มต่ำที่สุด ถ้ามีหลายจุดให้ค่าเท่ากันให้เลือกจุดที่เล็กที่สุด คืนค่าเป็นจุดแบ่ง (จำนวนทศนิยม) ใช้ `collections.Counter` ได้"
    starter: |
      def best_threshold(xs, labels):
          pass
    tests: |
      t = best_threshold([20, 25, 30, 35, 40], ["ไม่", "ไม่", "ใช่", "ใช่", "ใช่"])
      assert t == 27.5, f"ควรได้ 27.5 เพราะแบ่งแยกได้สมบูรณ์ แต่ได้ {t}"
      t2 = best_threshold([1, 2, 3, 4, 5, 6], ["ก", "ก", "ข", "ก", "ข", "ข"])
      assert t2 == 2.5, f"ควรได้ 2.5 (จุดเล็กที่สุดในกลุ่มที่ให้ค่าดีที่สุด) แต่ได้ {t2}"
    reference: |
      from collections import Counter
      def best_threshold(xs, labels):
          def gini(group):
              n = len(group)
              if n == 0:
                  return 0.0
              return 1 - sum((c / n) ** 2 for c in Counter(group).values())
          pairs = sorted(zip(xs, labels))
          values = sorted(set(xs))
          best = None
          for lo, hi in zip(values, values[1:]):
              t = (lo + hi) / 2
              left = [y for x, y in pairs if x <= t]
              right = [y for x, y in pairs if x > t]
              score = (len(left) * gini(left) + len(right) * gini(right)) / len(pairs)
              if best is None or score < best[0] - 1e-12:
                  best = (score, t)
          return best[1]
    hints:
      - "สร้างจุดแบ่งที่เป็นไปได้จากค่า x ที่เรียงแล้วและไม่ซ้ำ"
      - "สำหรับแต่ละจุดแบ่ง แยกลาเบลเป็นกลุ่มซ้ายและขวา แล้วคำนวณจินีของแต่ละกลุ่ม"
      - "เก็บจุดที่ค่าถ่วงน้ำหนักต่ำกว่าเท่านั้น เพื่อให้ได้จุดที่เล็กที่สุดเมื่อเท่ากัน"
    solution: "สร้างจุดกึ่งกลางระหว่างค่า x ที่ติดกัน คำนวณจินีถ่วงน้ำหนักของทั้งสองกลุ่ม แล้วเก็บจุดที่ค่าต่ำสุดโดยเก็บจุดแรกเมื่อค่าเท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.supervised-learning.p016
    topics: [computer.ai.supervised-learning]
    difficulty: 3
    type: code
    stem: "เขียนฟังก์ชัน `knn_predict(train, x, k)` ที่รับ `train` เป็นลิสต์ของคู่ (ค่า, ลาเบล) และค่า x ที่ต้องการทำนาย คืนลาเบลที่พบมากที่สุดในตัวอย่างใกล้ x ที่สุด k ตัว ระยะห่างคือค่าสัมบูรณ์ของผลต่าง ใช้ `collections.Counter` ได้"
    starter: |
      def knn_predict(train, x, k):
          pass
    tests: |
      T = [(1, "A"), (2, "A"), (8, "B"), (9, "B"), (10, "B")]
      r1 = knn_predict(T, 3, 3)
      assert r1 == "A", f"x=3, k=3 ควรได้ A (ใกล้ที่สุดคือ 2, 1, 8) แต่ได้ {r1}"
      r2 = knn_predict(T, 7, 3)
      assert r2 == "B", f"x=7, k=3 ควรได้ B (ใกล้ที่สุดคือ 8, 9, 10) แต่ได้ {r2}"
      r3 = knn_predict(T, 3, 1)
      assert r3 == "A", f"x=3, k=1 ควรได้ A แต่ได้ {r3}"
    reference: |
      from collections import Counter
      def knn_predict(train, x, k):
          near = sorted(train, key=lambda p: abs(p[0] - x))[:k]
          return Counter(label for _, label in near).most_common(1)[0][0]
    hints:
      - "เรียงตัวอย่างฝึกตามระยะห่างจาก x"
      - "เลือกตัวอย่าง k ตัวแรกหลังเรียงแล้ว"
      - "นับลาเบลของตัวอย่างเหล่านั้น แล้วเลือกลาเบลที่มีจำนวนมากที่สุด"
    solution: "เรียงตัวอย่างตามค่า |p − x| แล้วเลือก k ตัวแรก นับลาเบลด้วย Counter และคืนลาเบลที่พบบ่อยที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

