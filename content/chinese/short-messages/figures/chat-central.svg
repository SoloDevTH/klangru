<text x="232.0" y="326.0" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="normal">星巴克门口见。</text>
<circle cx="42.0" cy="370.0" r="16.0" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1.5"/>
<text x="42.0" y="376.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">王</text>
<rect x="70.0" y="352.0" width="154.0" height="42.0" rx="10" fill="#fff" stroke="#aaa" stroke-width="1"/>
<text x="84.0" y="382.0" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="normal">好的，明天见！</text>
