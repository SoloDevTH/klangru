  - id: computer.web.web-apps.p018
    topics: [computer.web.web-apps]
    difficulty: 5
    type: code
    stem: "เขียนชุดฟังก์ชันจำลองเซสชันฝั่งเซิร์ฟเวอร์ โดยเก็บข้อมูลใน dict ชื่อ store: create_session(store, user) สร้างโทเค็นใหม่ที่สุ่มและเดายาก (ยาวอย่างน้อย 16 ตัวอักษร ใช้โมดูล secrets ได้) เก็บ user ไว้ แล้วคืนโทเค็น current_user(store, token) คืนชื่อผู้ใช้หรือ None และ logout(store, token) ลบเซสชันนั้น"
    starter: |
      import secrets

      def create_session(store, user):
          # สร้างโทเค็นและเก็บ user ใน store แล้วคืนโทเค็น
          return ""

      def current_user(store, token):
          return None

      def logout(store, token):
          pass
    tests: |
      store = {}
      t = create_session(store, "ฝน")
      assert isinstance(t, str) and len(t) >= 16, f"โทเค็นควรเป็นสตริงสุ่มยาวอย่างน้อย 16 ตัวอักษร แต่ได้ {t!r}"
      assert current_user(store, t) == "ฝน", "หลังสร้างเซสชันต้องได้ชื่อผู้ใช้ที่เก็บไว้"
      t2 = create_session(store, "ปาน")
      assert t2 != t, "แต่ละเซสชันต้องได้โทเค็นไม่ซ้ำกัน"
      logout(store, t)
      assert current_user(store, t) is None, "หลัง logout โทเค็นนั้นต้องไม่ใช้ได้แล้ว"
      assert current_user(store, t2) == "ปาน", "logout เซสชันหนึ่งต้องไม่กระทบเซสชันอื่น"
      t3 = create_session(store, "ต้น")
      assert t3 != t2 and current_user(store, t2) == "ปาน", "เซสชันใหม่ต้องไม่ทับเซสชันเดิมที่ยังใช้อยู่ (โทเค็นที่นับจากจำนวนรายการอาจซ้ำหลัง logout)"
      assert current_user(store, "เดาเอาเอง") is None, "โทเค็นที่ไม่มีในระบบต้องได้ None"
    reference: |
      import secrets

      def create_session(store, user):
          token = secrets.token_urlsafe(16)
          while token in store:
              token = secrets.token_urlsafe(16)
          store[token] = user
          return token

      def current_user(store, token):
          return store.get(token)

      def logout(store, token):
          store.pop(token, None)
    hints:
      - "เก็บคู่ โทเค็น กับ ชื่อผู้ใช้ ใน store ด้วยการกำหนดค่าให้ดิกชันนารี"
      - "โทเค็นเซสชันต้องเดาไม่ได้ ใช้ secrets.token_urlsafe(16) แทนเลขลำดับ เพราะเลขลำดับเดาง่ายและอาจซ้ำหลัง logout"
    solution: "ใช้ dict เป็นตารางเซสชัน create สร้างโทเค็นสุ่มด้วย secrets.token_urlsafe แล้วใส่คู่ใหม่ current ใช้ get ที่คืน None ได้เอง logout ใช้ pop พร้อมค่าเริ่มต้น None โทเค็นที่เป็นเลขลำดับ เช่น t1 t2 ไม่ปลอดภัย เพราะผู้อื่นเดาโทเค็นของคนอื่นได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

