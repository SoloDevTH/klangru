problems:
  - id: hlt.nut.p001
    topics: [health.nutrition.basics]
    difficulty: 1
    type: mcq
    stem: "ข้าวเหนียว ขนมปัง เผือก และมันเทศ อยู่ในอาหารหลักหมู่ใด"
    choices:
      - { id: a, text: "หมู่ 2 ให้คาร์โบไฮเดรต", correct: true }
      - { id: b, text: "หมู่ 1 ให้โปรตีน", feedback: "หมู่ 1 คือเนื้อสัตว์ นม ไข่ และถั่วเมล็ดแห้ง อาหารในโจทย์เป็นแป้ง" }
      - { id: c, text: "หมู่ 3 ให้เกลือแร่", feedback: "หมู่ 3 คือผักต่าง ๆ เผือกและมันเป็นหัวที่สะสมแป้ง จึงจัดอยู่กับข้าวและแป้ง" }
      - { id: d, text: "หมู่ 5 ให้ไขมัน", feedback: "หมู่ 5 คือไขมันและน้ำมันจากพืชและสัตว์ อาหารในโจทย์ให้แป้งเป็นหลัก" }
    hints:
      - "อาหารทั้งสี่อย่างมีส่วนประกอบหลักร่วมกันคืออะไร"
      - "ข้าว แป้ง น้ำตาล เผือก มัน อยู่หมู่เดียวกัน"
    solution: "ข้าวเหนียว ขนมปัง เผือก และมันเทศ มีแป้งเป็นส่วนใหญ่ จึงอยู่ในหมู่ 2 ซึ่งให้สารอาหารคาร์โบไฮเดรต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p002
    topics: [health.nutrition.basics]
    difficulty: 1
    type: match
    stem: "จับคู่อาหารหลักแต่ละหมู่กับสารอาหารหลักที่ได้"
    pairs:
      - { left: "หมู่ 1 เนื้อสัตว์ นม ไข่ ถั่วเมล็ดแห้ง", right: "โปรตีน" }
      - { left: "หมู่ 2 ข้าว แป้ง น้ำตาล เผือก มัน", right: "คาร์โบไฮเดรต" }
      - { left: "หมู่ 3 ผักต่าง ๆ", right: "เกลือแร่ (แร่ธาตุ)" }
      - { left: "หมู่ 4 ผลไม้ต่าง ๆ", right: "วิตามิน" }
      - { left: "หมู่ 5 ไขมันจากพืชและสัตว์", right: "ไขมัน" }
    hints:
      - "เริ่มจากคู่ที่ชื่อบอกอยู่แล้ว เช่น หมู่ไขมัน"
      - "เนื้อสัตว์ใช้สร้างกล้ามเนื้อ ข้าวเป็นแหล่งพลังงานหลัก ผักกับผลไม้ให้สารที่ไม่ให้พลังงาน"
    solution: "หมู่ 1 → โปรตีน, หมู่ 2 → คาร์โบไฮเดรต, หมู่ 3 (ผัก) → เกลือแร่, หมู่ 4 (ผลไม้) → วิตามิน, หมู่ 5 → ไขมัน ผักและผลไม้ให้ทั้งวิตามินและแร่ธาตุ แต่ตามการจัดหมู่ของไทยถือว่าผักเด่นด้านเกลือแร่และผลไม้เด่นด้านวิตามิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p003
    topics: [health.nutrition.basics]
    difficulty: 1
    type: mcq
    stem: "สารอาหารชนิดใดให้พลังงานต่อกรัมมากที่สุด"
    choices:
      - { id: a, text: "ไขมัน (9 กิโลแคลอรีต่อกรัม)", correct: true }
      - { id: b, text: "คาร์โบไฮเดรต", feedback: "คาร์โบไฮเดรตเป็นแหล่งพลังงานหลักเพราะเรากินมาก แต่ต่อกรัมให้เพียง 4 กิโลแคลอรี" }
      - { id: c, text: "โปรตีน", feedback: "โปรตีนให้ 4 กิโลแคลอรีต่อกรัม เท่ากับคาร์โบไฮเดรต" }
      - { id: d, text: "วิตามิน", feedback: "วิตามินจำเป็นต่อร่างกายแต่ไม่ให้พลังงาน" }
    hints:
      - "ในสามชนิดที่ให้พลังงาน มีชนิดหนึ่งให้มากกว่าอีกสองชนิดเกินสองเท่า"
      - "ค่าที่ใช้บนฉลากคือ 4, 4 และ 9 กิโลแคลอรีต่อกรัม"
    solution: "คาร์โบไฮเดรตและโปรตีนให้ 4 กิโลแคลอรีต่อกรัม ไขมันให้ 9 กิโลแคลอรีต่อกรัม ส่วนวิตามิน แร่ธาตุ และน้ำไม่ให้พลังงาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p004
    topics: [health.nutrition.basics]
    difficulty: 2
    type: numeric
    stem: "ข้าวสุกส่วนหนึ่งมีคาร์โบไฮเดรต 20 กรัม คาร์โบไฮเดรตส่วนนี้ให้พลังงานกี่กิโลแคลอรี (ตอบเป็นตัวเลขในหน่วย kcal)"
    answer: { value: 80, unit: kcal }
    hints:
      - "คาร์โบไฮเดรต 1 กรัมให้พลังงานกี่กิโลแคลอรี"
      - "คูณมวลเป็นกรัมด้วยพลังงานต่อกรัมของคาร์โบไฮเดรต"
    misconceptions:
      - { match: 180, feedback: "นั่นคือการใช้ 9 กิโลแคลอรีต่อกรัม ซึ่งเป็นค่าของไขมัน คาร์โบไฮเดรตให้ 4 กิโลแคลอรีต่อกรัม" }
      - { match: 20, feedback: "20 คือมวลเป็นกรัม ยังต้องคูณด้วยพลังงานต่อกรัมเพื่อเปลี่ยนเป็นกิโลแคลอรี" }
    solution: "คาร์โบไฮเดรตให้ $4\\ \\mathrm{kcal/g}$ พลังงาน $= 20\\ \\mathrm{g} \\times 4\\ \\mathrm{kcal/g} = 80\\ \\mathrm{kcal}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p005
    topics: [health.nutrition.basics]
    difficulty: 2
    type: numeric
    stem: "น้ำมันพืช 1 ช้อนโต๊ะมีไขมันประมาณ 10 กรัม ไขมันนี้ให้พลังงานกี่กิโลแคลอรี (ตอบเป็นตัวเลขในหน่วย kcal)"
    answer: { value: 90, unit: kcal }
    hints:
      - "ไขมันให้พลังงานต่อกรัมมากกว่าคาร์โบไฮเดรตและโปรตีน"
      - "ใช้ 9 กิโลแคลอรีต่อกรัม แล้วคูณกับมวลเป็นกรัม"
    misconceptions:
      - { match: 40, feedback: "นั่นคือการใช้ 4 กิโลแคลอรีต่อกรัม ไขมันให้ 9 กิโลแคลอรีต่อกรัม" }
    solution: "พลังงาน $= 10\\ \\mathrm{g} \\times 9\\ \\mathrm{kcal/g} = 90\\ \\mathrm{kcal}$ น้ำมันเพียงช้อนเดียวให้พลังงานมากกว่าข้าวที่มีคาร์โบไฮเดรต 20 กรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p006
    topics: [health.nutrition.basics]
    difficulty: 2
    type: numeric
    stem: "แซนด์วิชชิ้นหนึ่งมีคาร์โบไฮเดรต 30 กรัม โปรตีน 8 กรัม และไขมัน 5 กรัม แซนด์วิชชิ้นนี้ให้พลังงานรวมกี่กิโลแคลอรี (ตอบเป็นตัวเลขในหน่วย kcal)"
    answer: { value: 197, unit: kcal }
    hints:
      - "หาพลังงานจากสารอาหารแต่ละชนิดแยกกันก่อน แล้วจึงรวม"
      - "ใช้ $4C + 4P + 9F$"
    misconceptions:
      - { match: 43, feedback: "43 คือผลรวมของกรัม ยังไม่ได้แปลงเป็นพลังงาน ต้องคูณแต่ละชนิดด้วยพลังงานต่อกรัมก่อนรวม" }
      - { match: 172, feedback: "ดูเหมือนคูณทุกชนิดด้วย 4 ไขมันต้องคูณด้วย 9" }
    solution: "$4(30) + 4(8) + 9(5) = 120 + 32 + 45 = 197\\ \\mathrm{kcal}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p007
    topics: [health.nutrition.basics]
    difficulty: 2
    type: mcq
    stem: "ตามธงโภชนาการของกรมอนามัย อาหารกลุ่มใดควรกินในปริมาณมากที่สุดต่อวัน"
    choices:
      - { id: a, text: "ข้าว แป้ง", correct: true }
      - { id: b, text: "เนื้อสัตว์ ถั่ว ไข่", feedback: "เนื้อสัตว์อยู่ชั้นที่สามจากบน ควรกินพอเหมาะ ไม่ใช่มากที่สุด" }
      - { id: c, text: "นม", feedback: "นมอยู่ชั้นเดียวกับเนื้อสัตว์ แนะนำวันละ 1–2 แก้ว" }
      - { id: d, text: "น้ำมัน น้ำตาล เกลือ", feedback: "กลุ่มนี้อยู่ชั้นล่างสุดซึ่งแคบที่สุด ควรใช้แต่น้อยเท่าที่จำเป็น" }
    hints:
      - "ธงโภชนาการเป็นสามเหลี่ยมหัวกลับ ชั้นที่กว้างที่สุดอยู่ด้านบน"
      - "ชั้นบนสุดคือแหล่งพลังงานหลักของอาหารไทย"
    solution: "ชั้นบนสุดซึ่งกว้างที่สุดคือข้าว แป้ง (8–12 ทัพพีต่อวันตามระดับพลังงาน) ส่วนชั้นล่างสุดแคบที่สุดคือน้ำมัน น้ำตาล เกลือ ที่ควรใช้แต่น้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p008
    topics: [health.nutrition.basics]
    difficulty: 2
    type: numeric
    stem: "ฉลากข้าวเกรียบซองหนึ่งบอกว่า หนึ่งหน่วยบริโภคมีไขมัน 13 กรัม ถ้าค่าอ้างอิงไขมันต่อวันคือ 65 กรัม ไขมันนี้คิดเป็นร้อยละเท่าใดของปริมาณที่แนะนำต่อวัน (ตอบเป็นตัวเลขในหน่วย %)"
    answer: { value: 20, unit: "%" }
    hints:
      - "ร้อยละ = ส่วนที่ได้ หารด้วยค่าอ้างอิงทั้งหมด แล้วคูณ 100"
      - "นำ 13 หารด้วย 65 แล้วคูณ 100"
    misconceptions:
      - { match: 5, feedback: "นั่นคือ $65 \\div 13$ ซึ่งหารกลับด้าน ต้องเอาปริมาณที่ได้ (13) เป็นตัวตั้ง" }
      - { match: 0.2, feedback: "0.2 คือสัดส่วน ยังต้องคูณ 100 เพื่อให้เป็นร้อยละ" }
    solution: "$\\frac{13}{65} \\times 100 = 20\\%$ ของปริมาณไขมันที่แนะนำต่อวัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p009
    topics: [health.nutrition.basics]
    difficulty: 3
    type: numeric
    stem: "จากฉลากสมมติในภาพ ถ้ากินขนมปังกรอบหมดซอง จะได้พลังงานทั้งหมดกี่กิโลแคลอรี (ตอบเป็นตัวเลขในหน่วย kcal)"
    figure: { src: nutrition-label.svg, alt: "ฉลากข้อมูลโภชนาการสมมติของขนมปังกรอบ หนึ่งหน่วยบริโภคคือครึ่งซอง 30 กรัม จำนวนหน่วยบริโภคต่อซอง 2 พลังงานทั้งหมดต่อหนึ่งหน่วยบริโภค 150 กิโลแคลอรี ไขมันทั้งหมด 7 กรัม 11% คาร์โบไฮเดรตทั้งหมด 19 กรัม 6% น้ำตาล 6 กรัม โซเดียม 160 มิลลิกรัม 8%" }
    answer: { value: 300, unit: kcal }
    hints:
      - "ตัวเลข 150 กิโลแคลอรีเป็นของปริมาณเท่าใด"
      - "ดูจำนวนหน่วยบริโภคต่อซอง แล้วคูณ"
    misconceptions:
      - { match: 150, feedback: "150 กิโลแคลอรีเป็นของหนึ่งหน่วยบริโภค (ครึ่งซอง) ซองนี้มี 2 หน่วยบริโภค" }
      - { match: 75, feedback: "ดูเหมือนหารด้วย 2 แต่ 150 เป็นของครึ่งซองอยู่แล้ว ทั้งซองต้องคูณ 2" }
    solution: "หนึ่งหน่วยบริโภค (ครึ่งซอง) ให้ 150 กิโลแคลอรี ซองหนึ่งมี 2 หน่วยบริโภค กินหมดซองได้ $150 \\times 2 = 300\\ \\mathrm{kcal}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p010
    topics: [health.nutrition.basics]
    difficulty: 3
    type: numeric
    stem: "จากฉลากสมมติในภาพ (ค่าอ้างอิงไขมัน 65 กรัมต่อวัน) ถ้ากินหมดซอง จะได้ไขมันคิดเป็นร้อยละเท่าใดของปริมาณที่แนะนำต่อวัน (ตอบเป็นตัวเลขในหน่วย % ทศนิยม 1 ตำแหน่ง)"
    figure: { src: nutrition-label.svg, alt: "ฉลากข้อมูลโภชนาการสมมติของขนมปังกรอบ หนึ่งหน่วยบริโภคคือครึ่งซอง 30 กรัม จำนวนหน่วยบริโภคต่อซอง 2 ไขมันทั้งหมดต่อหนึ่งหน่วยบริโภค 7 กรัม คิดเป็น 11% ของปริมาณที่แนะนำต่อวัน ค่าอ้างอิงไขมัน 65 กรัม" }
    answer: { value: 21.5, tolerance: 0.6, unit: "%" }
    hints:
      - "ไขมันทั้งซองมีกี่กรัม"
      - "คูณไขมันต่อหนึ่งหน่วยบริโภคด้วยจำนวนหน่วยบริโภค แล้วเทียบกับ 65 กรัม"
    misconceptions:
      - { match: 10.8, feedback: "นั่นคือร้อยละของหนึ่งหน่วยบริโภค (ครึ่งซอง) เท่านั้น กินหมดซองได้ไขมันเป็น 2 เท่า" }
    solution: "ไขมันทั้งซอง $= 7 \\times 2 = 14$ กรัม คิดเป็น $\\frac{14}{65} \\times 100 \\approx 21.5\\%$ (ถ้าใช้ตัวเลขบนฉลาก $11\\% \\times 2 = 22\\%$ ต่างเล็กน้อยเพราะฉลากปัดเศษ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p011
    topics: [health.nutrition.basics]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการอ่านฉลากโภชนาการเพื่อรู้ว่าตัวเองได้สารอาหารเท่าไร"
    items:
      - "ดูว่าหนึ่งหน่วยบริโภคคือปริมาณเท่าใด"
      - "ดูจำนวนหน่วยบริโภคต่อภาชนะ"
      - "อ่านพลังงานและสารอาหารต่อหนึ่งหน่วยบริโภค"
      - "คูณด้วยจำนวนหน่วยบริโภคที่กินจริง"
      - "เทียบกับร้อยละของปริมาณที่แนะนำต่อวัน"
    hints:
      - "ตัวเลขสารอาหารทุกตัวขึ้นกับว่า 'หนึ่งหน่วย' คือเท่าไร"
      - "ต้องรู้ว่ากินไปกี่หน่วยก่อนจะเทียบกับปริมาณทั้งวัน"
    solution: "เริ่มจากหนึ่งหน่วยบริโภคและจำนวนหน่วยต่อภาชนะ จากนั้นอ่านค่าต่อหน่วย คูณตามที่กินจริง และเทียบกับปริมาณที่แนะนำต่อวัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p012
    topics: [health.nutrition.basics]
    difficulty: 3
    type: numeric
    stem: "ชานมไข่มุกแก้วหนึ่งมีน้ำตาลประมาณ 40 กรัม (สมมติว่าเป็นน้ำตาลที่เติมทั้งหมด) องค์การอนามัยโลกแนะนำให้ได้น้ำตาลอิสระไม่เกินราว 50 กรัมต่อวันสำหรับคนที่ใช้พลังงาน 2,000 กิโลแคลอรี ชานมแก้วนี้มีน้ำตาลคิดเป็นร้อยละเท่าใดของปริมาณนี้ (ตอบเป็นตัวเลขในหน่วย %)"
    answer: { value: 80, unit: "%" }
    hints:
      - "เทียบน้ำตาลในแก้วกับปริมาณที่แนะนำทั้งวัน"
      - "$\\frac{40}{50} \\times 100$"
    misconceptions:
      - { match: 125, feedback: "นั่นคือ $\\frac{50}{40} \\times 100$ ซึ่งหารกลับด้าน ปริมาณที่ได้ต้องเป็นตัวตั้ง" }
      - { match: 0.8, feedback: "0.8 คือสัดส่วน คูณ 100 เพื่อเป็นร้อยละ" }
    solution: "$\\frac{40}{50} \\times 100 = 80\\%$ ชานมแก้วเดียวให้น้ำตาลถึงสี่ในห้าของปริมาณที่ WHO แนะนำต่อวัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: hlt.nut.p013
    topics: [health.nutrition.basics]
    difficulty: 3
    type: numeric
    stem: "น้ำอัดลมกระป๋องหนึ่งมีน้ำตาล 32 กรัม ถ้าน้ำตาลทราย 1 ช้อนชามีประมาณ 4 กรัม น้ำตาลในกระป๋องนี้เท่ากับประมาณกี่ช้อนชา (ตอบเป็นตัวเลขในหน่วยช้อนชา)"
    answer: { value: 8, unit: ช้อนชา }
    hints:
      - "หนึ่งช้อนชามี 4 กรัม 32 กรัมต้องใช้กี่ช้อน"
      - "นำ 32 หารด้วย 4"
