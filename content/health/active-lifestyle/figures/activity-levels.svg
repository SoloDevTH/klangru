<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" font-family="sans-serif">
<title>สี่ระดับความหนักของกิจกรรมทางกายตามการทดสอบการพูด</title>
<rect x="0" y="0" width="760" height="280" fill="#ffffff"/>
<rect x="60.0" y="90" width="160.0" height="110" fill="#d9d9d9" stroke="#222" stroke-width="2"/>
<text x="140.0" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">เนือยนิ่ง</text>
<text x="140.0" y="160" text-anchor="middle" font-size="17" fill="#222">นั่ง เอน</text>
<text x="140.0" y="182" text-anchor="middle" font-size="17" fill="#222">หรือนอนตื่นอยู่</text>
<rect x="220.0" y="90" width="160.0" height="110" fill="#cfe9c4" stroke="#222" stroke-width="2"/>
<text x="300.0" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">เบา</text>
<text x="300.0" y="160" text-anchor="middle" font-size="17" fill="#222">ร้องเพลงได้</text>
<text x="300.0" y="182" text-anchor="middle" font-size="17" fill="#222">สบาย ๆ</text>
<rect x="380.0" y="90" width="160.0" height="110" fill="#8fcf7d" stroke="#222" stroke-width="2"/>
<text x="460.0" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">ปานกลาง</text>
<text x="460.0" y="160" text-anchor="middle" font-size="17" fill="#222">พูดได้เป็นประโยค</text>
<text x="460.0" y="182" text-anchor="middle" font-size="17" fill="#222">แต่ร้องเพลงไม่ได้</text>
<rect x="540.0" y="90" width="160.0" height="110" fill="#f2a65a" stroke="#222" stroke-width="2"/>
<text x="620.0" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">หนัก</text>
<text x="620.0" y="160" text-anchor="middle" font-size="17" fill="#222">พูดได้เป็นคำ ๆ</text>
<text x="60" y="72" font-size="18" fill="#222">ระดับความหนักของกิจกรรม (ทดสอบด้วยการพูดคุย)</text>
<text x="60" y="240" font-size="16" fill="#555">การทดสอบการพูดเป็นการประเมินคร่าว ๆ ไม่ใช่การวัดที่แม่นยำ</text>
</svg>
