        feedback: การรอโดยไม่ติดตามทำให้พลาดสัญญาณเตือนที่เกิดขึ้นระหว่างนั้น
    hints:
      - ความไม่แน่นอนควรแสดงให้ผู้ตัดสินใจเห็นอย่างโปร่งใส ไม่ควรซ่อนไว้
      - แผนติดตามที่ปรับได้เมื่อมีข้อมูลเพิ่มช่วยลดความเสี่ยงจากความไม่แน่นอน
    solution: แนวทางที่เหมาะสมคือระบุความไม่แน่นอนและสมมติฐานอย่างชัดเจน ออกแบบแผนติดตามที่ปรับได้ พร้อมเกณฑ์ที่กำหนดว่าเมื่อผลเกินค่าที่คาดจะต้องดำเนินการเพิ่มเติมอย่างไร การเลือกค่าที่ดูดีที่สุดโดยไม่บอกความไม่แน่นอนเป็นการบิดเบือนข้อมูล
