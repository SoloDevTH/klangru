id: physics.dynamics.forces-intro
subject: physics
title: { th: แรงรอบตัวและการวัดแรง, en: Forces around us and measuring force }
summary: การดึงและการผลักทำให้วัตถุเริ่มเคลื่อนที่ หยุด เปลี่ยนทิศ หรือเปลี่ยนรูปร่าง แรงสัมผัสกับแรงไม่สัมผัส แรงโน้มถ่วง และการใช้เครื่องชั่งสปริง
difficulty: 1.5
minutes: 25
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แรงทำอะไรกับวัตถุได้บ้าง
    src: force-effects.svg
    alt: "ภาพสี่ช่อง ลูกศรสีส้มทึบคือแรง ลูกศรสีน้ำเงินเส้นประคือทิศที่วัตถุเคลื่อนที่ ช่อง 1 เริ่มเคลื่อนที่: มือผลักกล่องที่วางนิ่งไปทางขวา กล่องเคลื่อนไปทางขวา ช่อง 2 หยุด: ลูกบอลกลิ้งมาทางขวา มีแรงดันกลับไปทางซ้าย ลูกบอลหยุด ช่อง 3 เปลี่ยนทิศ: ลูกบอลวิ่งเข้ามาทางขวา ถูกเตะขึ้นจากด้านล่าง แล้วพุ่งเฉียงขึ้นไปทางใหม่ ช่อง 4 เปลี่ยนรูปร่าง: ดินน้ำมันก้อนกลมถูกบีบจากด้านบนและด้านล่าง กลายเป็นก้อนแบนรี"
    caption: "แรงทำให้วัตถุเริ่มเคลื่อนที่ หยุด เปลี่ยนทิศ หรือเปลี่ยนรูปร่าง"
  - type: worked-example
    title: ชั่งมะม่วงในถุง
    problem: "แม่ค้าแขวนถุงเปล่ากับเครื่องชั่งสปริง เข็มชี้ที่ 1 N เมื่อใส่มะม่วงแล้วเข็มชี้กึ่งกลางระหว่างขีด 6 กับ 7 มะม่วงหนักกี่นิวตัน"
    steps:
      - text: "ก่อนชั่ง ดูว่าเข็มชี้ที่ 0 เมื่อยังไม่แขวนอะไร"
        why: "ถ้าเข็มไม่เริ่มที่ 0 ทุกค่าที่อ่านจะผิดไปเท่ากัน"
      - text: "อ่านค่าเมื่อแขวนมะม่วงในถุง: เข็มอยู่กึ่งกลางระหว่าง 6 กับ 7 จึงเป็น 6.5 N"
        why: "ขีดกึ่งกลางระหว่างตัวเลขสองตัวที่ห่างกัน 1 N มีค่าครึ่งนิวตัน"
      - text: "ค่า 6.5 N เป็นน้ำหนักของมะม่วงรวมกับถุง จึงหักน้ำหนักถุงออก: 6.5 − 1 = 5.5 N"
    answer: "มะม่วงหนัก 5.5 N"
  - { type: check, problem: physics.dynamics.forces-intro.p005, prompt: "ลองอ่านเครื่องชั่งสปริงด้วยตัวเอง" }
  - type: figure
    title: ส่วนประกอบของเครื่องชั่งสปริง
    src: spring-scale.svg
    alt: "เครื่องชั่งสปริงแนวตั้ง ด้านบนมีห่วงสำหรับถือ ตัวเครื่องมีสเกลตัวเลข 0 ถึง 10 หน่วยนิวตัน (N) และขีดเล็กกึ่งกลางระหว่างตัวเลข เข็มชี้สีส้มอยู่ที่ 0 ข้างในมีสปริงซึ่งยืดมากขึ้นเมื่อแรงมากขึ้น ด้านล่างมีตะขอสำหรับแขวนวัตถุ"
    caption: "ก่อนชั่งต้องดูว่าเข็มชี้อยู่ที่ 0 แรงยิ่งมาก สปริงยิ่งยืด เข็มยิ่งเลื่อนลง"
  - type: worked-example
    title: ชักเย่อ แรงสมดุลหรือไม่สมดุล
    problem: "ชักเย่อรอบแรก ทีมเหลืองดึง 400 N ทีมเขียวดึง 400 N รอบที่สอง ทีมเหลืองดึง 430 N ทีมเขียวดึง 400 N แต่ละรอบเชือกเป็นอย่างไร"
    steps:
      - text: "รอบแรก แรงสองข้างเท่ากันและทิศตรงข้าม เป็นแรงสมดุล"
      - text: "แรงสมดุลไม่ทำให้การเคลื่อนที่เปลี่ยน เชือกที่อยู่นิ่งจึงยังนิ่ง"
        why: "แรงสองแรงหักล้างกันพอดี เหมือนไม่มีแรงลัพธ์"
      - text: "รอบที่สอง 430 N มากกว่า 400 N เป็นแรงไม่สมดุล เหลือแรง 430 − 400 = 30 N ไปทางทีมเหลือง"
      - text: "แรงไม่สมดุลทำให้เชือกเริ่มเคลื่อนไปทางทีมเหลือง"
    answer: "รอบแรกเชือกนิ่ง รอบที่สองเชือกเคลื่อนไปทางทีมเหลือง"
  - { type: check, problem: physics.dynamics.forces-intro.p011, prompt: "ใช้แนวคิดแรงสมดุลและไม่สมดุลตอบ" }
  - type: simulation
    title: แรงและการเคลื่อนที่ (PhET Forces and Motion Basics)
    url: https://phet.colorado.edu/en/simulations/forces-and-motion-basics
    provider: phet
    note: "เลือกหน้า Net Force (ชักเย่อ) วางคนสองฝั่งให้แรงเท่ากันแล้วกด Go เชือกจะนิ่ง ลองให้ฝั่งหนึ่งแรงกว่า แล้วดูว่ารถเคลื่อนไปทางไหน หน้า Motion ลองผลักแรงต่าง ๆ แล้วดูว่าความเร็วเปลี่ยนอย่างไร"
glossary:
  - { term: แรง, definition: "การดึงหรือการผลัก มีขนาดและทิศทาง หน่วยคือนิวตัน (N)" }
  - { term: แรงสมดุล, definition: "แรงหลายแรงที่กระทำต่อวัตถุแล้วหักล้างกันพอดี การเคลื่อนที่ของวัตถุจึงไม่เปลี่ยน" }
  - { term: แรงสัมผัส, definition: "แรงที่เกิดเมื่อวัตถุแตะกัน เช่น แรงผลักของมือ แรงเสียดทาน แรงของลม" }
  - { term: แรงไม่สัมผัส, definition: "แรงที่ส่งผลได้แม้ไม่แตะกัน เช่น แรงโน้มถ่วง แรงแม่เหล็ก แรงไฟฟ้า" }
  - { term: น้ำหนัก, definition: "แรงที่โลก (หรือดาวดวงอื่น) ดึงดูดวัตถุ วัดเป็นนิวตันด้วยเครื่องชั่งสปริง" }
  - { term: เครื่องชั่งสปริง, definition: "เครื่องมือวัดแรงและน้ำหนัก สปริงข้างในยืดมากขึ้นเมื่อแรงมากขึ้น อ่านค่าเป็นนิวตัน" }
flashcards:
  - { front: "แรงทำอะไรกับวัตถุได้บ้าง", back: "ทำให้เริ่มเคลื่อนที่ หยุด เร็วขึ้นหรือช้าลง เปลี่ยนทิศ และเปลี่ยนรูปร่าง" }
  - { front: "ตัวอย่างแรงไม่สัมผัส", back: "แรงโน้มถ่วง แรงแม่เหล็ก และแรงไฟฟ้า (ลูกโป่งที่ถูกับผมดูดเศษกระดาษ)" }
  - { front: "ชักเย่อแรงเท่ากัน เชือกเป็นอย่างไร", back: "นิ่ง เพราะแรงสมดุล ถ้าแรงไม่เท่ากัน เชือกเคลื่อนไปทางแรงที่มากกว่า" }
  - { front: "ใช้เครื่องชั่งสปริงต้องทำอะไรก่อน", back: "ถือให้ตั้งตรงและดูว่าเข็มชี้อยู่ที่ 0 แล้วจึงแขวนวัตถุ" }
  - { front: "ถุงน้ำตาล 1 กิโลกรัมหนักกี่นิวตัน", back: "ประมาณ 10 นิวตัน (ค่าที่ละเอียดกว่าคือ 9.8 N)" }
