id: computer.safety.safe-ict-primary
subject: computer
title: { th: การใช้เทคโนโลยีสารสนเทศอย่างปลอดภัย (ประถม), en: "Using information technology safely (primary)" }
summary: ทำตามข้อตกลงการใช้คอมพิวเตอร์ร่วมกัน ดูแลอุปกรณ์ ตั้งรหัสผ่านที่ดีและเก็บเป็นความลับ ปกป้องข้อมูลส่วนตัว มีมารยาทออนไลน์ และรู้วิธีขอความช่วยเหลือ
difficulty: 1.5
minutes: 30
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: help-steps.svg
    alt: "สี่ขั้นเรียงจากซ้ายไปขวาเมื่อพบสิ่งไม่เหมาะสมทางออนไลน์ ขั้น 1 หยุด ไม่ตอบโต้ ไม่ส่งต่อ ขั้น 2 เก็บหลักฐาน จับภาพหน้าจอไว้ให้ผู้ใหญ่ดู ขั้น 3 บล็อกและรายงาน ใช้ปุ่มรายงานในแอปหรือเกม ขั้น 4 บอกผู้ใหญ่ พ่อแม่ ผู้ปกครอง หรือครูที่ไว้ใจ ใต้ภาพเขียนว่าถ้าเป็นเรื่องอันตรายหรือเร่งด่วนให้บอกผู้ใหญ่ทันที"
    caption: "เจอเรื่องไม่สบายใจทางออนไลน์ ไม่ต้องรับมือคนเดียว"
  - type: worked-example
    title: ตรวจรหัสผ่านทีละข้อ
    problem: "เก่งคิดรหัสผ่านบัญชีเกมไว้ 3 แบบ คือ `keng2558`, `123456` และ `Tiger#Moon42Rice` ควรเลือกแบบใด"
    steps:
      - text: "`123456` เป็นตัวเลขเรียงกัน คนนิยมใช้มากจนโปรแกรมเดารหัสลองเป็นอันดับแรก ๆ ตัดทิ้ง"
      - text: "`keng2558` คือชื่อเล่นกับปีเกิด คนที่รู้จักเก่งหรือเห็นโพสต์วันเกิดเดาได้ ตัดทิ้ง"
        why: "รหัสผ่านที่ดีต้องไม่ใช้ข้อมูลส่วนตัว เพราะคนอื่นหาข้อมูลเหล่านี้ได้ง่าย"
      - text: "`Tiger#Moon42Rice` ยาว 16 ตัว มีตัวพิมพ์ใหญ่ ตัวพิมพ์เล็ก ตัวเลข และสัญลักษณ์ และเป็นคำที่ไม่เกี่ยวกับตัวเก่ง"
        why: "ยิ่งยาวและผสมหลายชนิด จำนวนแบบที่ต้องลองเดายิ่งมาก"
      - text: "เมื่อเลือกแล้ว เก่งต้องไม่บอกเพื่อน และออกจากระบบทุกครั้งที่เล่นในเครื่องของคนอื่น"
    answer: "เลือก `Tiger#Moon42Rice` และเก็บเป็นความลับ"
  - { type: check, problem: computer.safety.safe-ict-primary.p004, prompt: "ลองใช้เกณฑ์เดียวกันกับรหัสผ่านชุดใหม่" }
  - type: worked-example
    title: เพื่อนใหม่ในเกมขอรูปและชื่อโรงเรียน
    problem: "ระหว่างเล่นเกมออนไลน์ ผู้เล่นที่ไม่เคยรู้จักส่งข้อความมาว่า \"ส่งรูปใส่ชุดนักเรียนกับชื่อโรงเรียนมาหน่อย แล้วจะให้ไอเทมฟรี อย่าบอกพ่อแม่นะ\" ควรทำอย่างไร"
    steps:
      - text: "สังเกตสัญญาณอันตราย: เป็นคนแปลกหน้า ขอข้อมูลส่วนตัว ล่อด้วยของฟรี และขอให้เก็บเป็นความลับจากพ่อแม่"
        why: "คนที่มีเจตนาดีจะไม่ขอให้เด็กปิดบังผู้ปกครอง"
      - text: "หยุด ไม่ตอบ และไม่ส่งรูปหรือชื่อโรงเรียน"
        why: "ชุดนักเรียนและชื่อโรงเรียนบอกได้ว่าเราอยู่ที่ไหนในแต่ละวัน"
      - text: "จับภาพหน้าจอข้อความไว้ แล้วบล็อกและกดรายงานผู้เล่นนั้นในเกม"
      - text: "เล่าให้พ่อแม่หรือครูฟังพร้อมให้ดูภาพหน้าจอ"
    answer: "ไม่ส่งข้อมูล เก็บหลักฐาน บล็อกและรายงาน แล้วบอกผู้ใหญ่ที่ไว้ใจ"
  - { type: check, problem: computer.safety.safe-ict-primary.p006, prompt: "ถ้าได้ข้อความนี้ ควรทำอย่างไร" }
glossary:
  - { term: รหัสผ่าน (password), definition: "ชุดตัวอักษร ตัวเลข หรือสัญลักษณ์ที่ใช้พิสูจน์ว่าเป็นเจ้าของบัญชี ต้องเก็บเป็นความลับ" }
  - { term: ออกจากระบบ (log out), definition: "การปิดการเข้าใช้บัญชีบนเครื่อง เพื่อไม่ให้คนที่ใช้เครื่องต่อเข้าบัญชีของเราได้" }
  - { term: ข้อมูลส่วนตัว, definition: "ข้อมูลที่ระบุได้ว่าเราคือใครหรืออยู่ที่ไหน เช่น ชื่อจริง ที่อยู่ เบอร์โทร ชื่อโรงเรียน" }
  - { term: ฟิชชิง (phishing), definition: "การหลอกลวงด้วยข้อความหรือเว็บไซต์ปลอมเพื่อขอรหัสผ่านหรือข้อมูลส่วนตัว" }
  - { term: มารยาทออนไลน์, definition: "การปฏิบัติต่อผู้อื่นบนโลกออนไลน์อย่างสุภาพ เคารพ และไม่ทำให้ผู้อื่นเดือดร้อน" }
flashcards:
  - { front: "รหัสผ่านที่ดีมีลักษณะอย่างไร", back: "ยาว ผสมตัวพิมพ์ใหญ่ เล็ก ตัวเลข สัญลักษณ์ ไม่ใช้ข้อมูลส่วนตัว และเก็บเป็นความลับ" }
  - { front: "ใช้คอมพิวเตอร์ส่วนรวมเสร็จแล้วต้องทำอะไรกับบัญชี", back: "ออกจากระบบทุกครั้ง และไม่ให้เครื่องจดจำรหัสผ่าน" }
  - { front: "พบสิ่งไม่เหมาะสมทางออนไลน์ ทำอย่างไร", back: "หยุด → เก็บหลักฐาน → บล็อกและรายงาน → บอกผู้ใหญ่ที่ไว้ใจ" }
  - { front: "บอกรหัส OTP ให้คนที่โทรมาอ้างเป็นเจ้าหน้าที่ได้หรือไม่", back: "ไม่ได้เด็ดขาด เจ้าหน้าที่จริงไม่ขอรหัส OTP" }
