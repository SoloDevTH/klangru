problems:
  - id: math.trig.p001
    topics: [math.geometry.trig-ratios]
    difficulty: 1
    type: mcq
    stem: "สามเหลี่ยมมุมฉากรูปหนึ่ง เมื่อมองจากมุม $\\theta$ ด้านตรงข้ามมุม $\\theta$ ยาว 3 ด้านประชิดมุม $\\theta$ ยาว 4 และด้านตรงข้ามมุมฉากยาว 5 ข้อใดคือค่าของ $\\sin\\theta$"
    choices:
      - { id: a, text: "$\\dfrac{3}{5}$", correct: true }
      - { id: b, text: "$\\dfrac{4}{5}$", feedback: "นั่นคือ ชิด/ฉาก ซึ่งเป็น $\\cos\\theta$ ส่วน $\\sin\\theta$ ใช้ด้านตรงข้ามมุม" }
      - { id: c, text: "$\\dfrac{3}{4}$", feedback: "นั่นคือ ข้าม/ชิด ซึ่งเป็น $\\tan\\theta$ ส่วน $\\sin\\theta$ ต้องหารด้วยด้านตรงข้ามมุมฉาก" }
      - { id: d, text: "$\\dfrac{5}{3}$", feedback: "กลับเศษส่วน ค่า $\\sin$ ของมุมแหลมต้องไม่เกิน 1 เพราะด้านตรงข้ามมุมฉากยาวที่สุดและอยู่ที่ตัวส่วน" }
    hints:
      - "$\\sin\\theta$ ใช้ด้านคู่ไหน: ข้าม ชิด หรือ ฉาก"
      - "$\\sin\\theta = \\dfrac{\\text{ข้าม}}{\\text{ฉาก}}$ นำความยาวด้านตรงข้ามมุมไปหารด้วยด้านตรงข้ามมุมฉาก"
    solution: "$\\sin\\theta = \\dfrac{\\text{ข้าม}}{\\text{ฉาก}} = \\dfrac{3}{5}$ (ส่วน $\\cos\\theta = \\tfrac{4}{5}$ และ $\\tan\\theta = \\tfrac{3}{4}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p002
    topics: [math.geometry.trig-ratios]
    difficulty: 1
    type: match
    stem: "จับคู่อัตราส่วนตรีโกณมิติของมุม $\\theta$ ในสามเหลี่ยมมุมฉากกับนิยามที่ถูกต้อง"
    pairs:
      - { left: "$\\sin\\theta$", right: "ด้านตรงข้ามมุม ÷ ด้านตรงข้ามมุมฉาก" }
      - { left: "$\\cos\\theta$", right: "ด้านประชิดมุม ÷ ด้านตรงข้ามมุมฉาก" }
      - { left: "$\\tan\\theta$", right: "ด้านตรงข้ามมุม ÷ ด้านประชิดมุม" }
    hints:
      - "มีเพียงอัตราส่วนเดียวที่ไม่ใช้ด้านตรงข้ามมุมฉาก"
      - "จำแบบย่อ: sin = ข้าม/ฉาก, cos = ชิด/ฉาก แล้ว tan คือคู่ที่เหลือ"
    solution: "$\\sin\\theta = \\tfrac{\\text{ข้าม}}{\\text{ฉาก}}$ | $\\cos\\theta = \\tfrac{\\text{ชิด}}{\\text{ฉาก}}$ | $\\tan\\theta = \\tfrac{\\text{ข้าม}}{\\text{ชิด}}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p003
    topics: [math.geometry.trig-ratios]
    difficulty: 2
    type: numeric
    stem: "ในสามเหลี่ยมมุมฉาก ด้านตรงข้ามมุม $\\theta$ ยาว $5\\ \\mathrm{cm}$ ด้านประชิดมุม $\\theta$ ยาว $12\\ \\mathrm{cm}$ และด้านตรงข้ามมุมฉากยาว $13\\ \\mathrm{cm}$ จงหาค่า $\\tan\\theta$ (ตอบเป็นทศนิยม)"
    answer: { value: 0.4167, tolerance: 0.004 }
    hints:
      - "$\\tan\\theta$ ไม่ใช้ด้านตรงข้ามมุมฉาก"
      - "$\\tan\\theta = \\dfrac{\\text{ข้าม}}{\\text{ชิด}}$ แล้วหารให้เป็นทศนิยม"
    misconceptions:
      - { match: 2.4, feedback: "กลับเศษส่วน ได้ ชิด/ข้าม ที่ถูกคือ $\\tan\\theta = \\tfrac{\\text{ข้าม}}{\\text{ชิด}}$" }
      - { match: 0.3846, feedback: "นั่นคือ $\\tfrac{5}{13}$ ซึ่งเป็น $\\sin\\theta$ ส่วน $\\tan\\theta$ ต้องหารด้วยด้านประชิดมุม" }
    solution: "$\\tan\\theta = \\dfrac{\\text{ข้าม}}{\\text{ชิด}} = \\dfrac{5}{12} \\approx 0.417$ (หน่วย cm ตัดกัน อัตราส่วนจึงไม่มีหน่วย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p004
    topics: [math.geometry.trig-ratios]
    difficulty: 2
    type: match
    stem: "จับคู่ค่าตรีโกณมิติของมุมพิเศษกับค่าที่ถูกต้อง"
    pairs:
      - { left: "$\\sin 30^\\circ$", right: "$\\dfrac{1}{2}$" }
      - { left: "$\\cos 30^\\circ$", right: "$\\dfrac{\\sqrt{3}}{2}$" }
      - { left: "$\\tan 45^\\circ$", right: "$1$" }
      - { left: "$\\tan 60^\\circ$", right: "$\\sqrt{3}$" }
      - { left: "$\\cos 45^\\circ$", right: "$\\dfrac{\\sqrt{2}}{2}$" }
    hints:
      - "วาดสามเหลี่ยมด้านเท่ายาวด้านละ 2 แล้วแบ่งครึ่ง จะได้ด้าน 1, $\\sqrt{3}$, 2 และมุม $30^\\circ$, $60^\\circ$"
      - "สามเหลี่ยมมุมฉากหน้าจั่วมีด้าน 1, 1, $\\sqrt{2}$ และมุม $45^\\circ$"
      - "ระบุข้าม ชิด ฉาก ของแต่ละมุมจากสองรูปนี้ แล้วหาอัตราส่วนตามนิยาม"
    solution: "จากสามเหลี่ยม 1, $\\sqrt{3}$, 2: $\\sin 30^\\circ = \\tfrac{1}{2}$, $\\cos 30^\\circ = \\tfrac{\\sqrt{3}}{2}$, $\\tan 60^\\circ = \\tfrac{\\sqrt{3}}{1} = \\sqrt{3}$ จากสามเหลี่ยม 1, 1, $\\sqrt{2}$: $\\tan 45^\\circ = \\tfrac{1}{1} = 1$, $\\cos 45^\\circ = \\tfrac{1}{\\sqrt{2}} = \\tfrac{\\sqrt{2}}{2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p005
    topics: [math.geometry.trig-ratios]
    difficulty: 3
    type: numeric
    stem: "ช่างติดป้ายร้านกาแฟใช้บันไดยาว $6\\ \\mathrm{m}$ พาดผนัง บันไดทำมุม $60^\\circ$ กับพื้นราบ ปลายบันไดสูงจากพื้นกี่เมตร (ตอบเป็นทศนิยม 2 ตำแหน่ง)"
    answer: { value: 5.196, tolerance: 0.05, unit: m }
    hints:
      - "บันไดเป็นด้านไหนของสามเหลี่ยมมุมฉาก และความสูงอยู่ตรงข้ามหรือประชิดมุม $60^\\circ$"
      - "ใช้ด้านตรงข้ามมุมกับด้านตรงข้ามมุมฉาก จึงใช้ $\\sin$"
      - "ความสูง $= 6 \\times \\sin 60^\\circ$ โดย $\\sin 60^\\circ = \\tfrac{\\sqrt{3}}{2}$"
    misconceptions:
      - { match: 3, feedback: "ใช้ $\\cos 60^\\circ$ ซึ่งให้ระยะจากโคนบันไดถึงผนัง ความสูงอยู่ตรงข้ามมุม $60^\\circ$ จึงต้องใช้ $\\sin$" }
      - { match: 10.392, feedback: "ใช้ $\\tan$ ซึ่งต้องรู้ด้านประชิดมุม แต่บันไดคือด้านตรงข้ามมุมฉาก จึงต้องใช้ $\\sin$ และความสูงต้องสั้นกว่าบันได" }
    solution: "บันได = ด้านตรงข้ามมุมฉาก, ความสูง $h$ = ด้านตรงข้ามมุม $60^\\circ$: $\\sin 60^\\circ = \\dfrac{h}{6}$ → $h = 6 \\times \\dfrac{\\sqrt{3}}{2} = 3\\sqrt{3} \\approx 5.20\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p006
    topics: [math.geometry.trig-ratios]
    difficulty: 3
    type: numeric
    stem: "นักเรียนยืนห่างโคนเสาธงของโรงเรียน $20\\ \\mathrm{m}$ มองยอดเสาด้วยมุมเงย $35^\\circ$ ระดับตาของนักเรียนสูงจากพื้น $1.5\\ \\mathrm{m}$ เสาธงสูงกี่เมตร (กำหนด $\\tan 35^\\circ \\approx 0.70$)"
    answer: { value: 15.5, tolerance: 0.15, unit: m }
    hints:
      - "สามเหลี่ยมมุมฉากเกิดที่ระดับตา ไม่ใช่ที่พื้น ด้านประชิดมุมเงยคือระยะ $20\\ \\mathrm{m}$"
      - "ใช้ $\\tan 35^\\circ = \\dfrac{x}{20}$ หาส่วนสูงจากระดับตาถึงยอดเสา"
      - "นำ $x$ ที่ได้ไปบวกกับความสูงของระดับตา"
    misconceptions:
      - { match: 14, feedback: "นั่นคือความสูงจากระดับตาถึงยอดเสาเท่านั้น ยังต้องบวกความสูงของระดับตาอีก $1.5\\ \\mathrm{m}$" }
      - { match: 30.07, feedback: "ดูเหมือนนำ 20 หารด้วย $\\tan 35^\\circ$ จาก $\\tan 35^\\circ = \\tfrac{x}{20}$ ต้องคูณ 20 ทั้งสองข้าง" }
    solution: "$\\tan 35^\\circ = \\dfrac{x}{20}$ → $x = 20 \\times 0.70 = 14\\ \\mathrm{m}$ (จากระดับตา) เสาธงสูง $14 + 1.5 = 15.5\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p007
    topics: [math.geometry.trig-ratios]
    difficulty: 3
    type: mcq
    stem: "ผู้ดูแลประภาคารมองเรือประมงจากยอดประภาคารด้วยมุมก้ม $30^\\circ$ คนบนเรือมองยอดประภาคารด้วยมุมเงยเท่าใด"
    choices:
      - { id: a, text: "$30^\\circ$", correct: true }
      - { id: b, text: "$60^\\circ$", feedback: "$60^\\circ$ คือมุมระหว่างแนวสายตากับแนวดิ่งของประภาคาร แต่มุมเงยวัดจากแนวระดับ" }
      - { id: c, text: "$150^\\circ$", feedback: "มุมเงยเป็นมุมแหลมเสมอ $150^\\circ$ คือมุมประกอบสองมุมฉากของ $30^\\circ$ ไม่ใช่มุมแย้ง" }
      - { id: d, text: "$90^\\circ$", feedback: "มุมเงย $90^\\circ$ หมายถึงมองตรงขึ้นฟ้า ซึ่งเกิดเมื่อเรืออยู่ที่โคนประภาคารพอดีเท่านั้น" }
    hints:
      - "มุมก้มและมุมเงยวัดจากแนวระดับทั้งคู่"
      - "แนวระดับที่ยอดประภาคารขนานกับแนวระดับที่เรือ แนวสายตาเป็นเส้นตัด ลองดูว่าเกิดมุมคู่ใด"
    solution: "แนวระดับที่ยอดประภาคารกับแนวผิวน้ำขนานกัน แนวสายตาเป็นเส้นตัด มุมก้มกับมุมเงยจึงเป็นมุมแย้งซึ่งเท่ากัน มุมเงยคือ $30^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p008
    topics: [math.geometry.trig-ratios]
    difficulty: 4
    type: numeric
    stem: "จากยอดประภาคารซึ่งสูงจากระดับน้ำทะเล $45\\ \\mathrm{m}$ มองเห็นเรือด้วยมุมก้ม $30^\\circ$ เรืออยู่ห่างจากฐานประภาคารในแนวระดับกี่เมตร (ตอบเป็นทศนิยม 1 ตำแหน่ง)"
    answer: { value: 77.94, tolerance: 0.78, unit: m }
    hints:
      - "มุมที่เรือในสามเหลี่ยมมุมฉากเท่ากับมุมก้ม $30^\\circ$ (มุมแย้ง)"
      - "เมื่อมองจากมุมที่เรือ ความสูง 45 เป็นด้านตรงข้ามมุม ระยะที่ต้องการเป็นด้านประชิดมุม"
      - "ใช้ $\\tan 30^\\circ = \\dfrac{45}{d}$ แล้วแก้หา $d$ โดย $\\tan 30^\\circ = \\tfrac{1}{\\sqrt{3}}$"
    misconceptions:
      - { match: 25.98, feedback: "นำ 45 คูณ $\\tan 30^\\circ$ ซึ่งเป็นการคิดว่า 45 เป็นด้านประชิดมุมที่เรือ แต่ 45 อยู่ตรงข้ามมุมที่เรือ จึงต้องหาร" }
      - { match: 90, feedback: "นั่นคือความยาวแนวสายตาจากยอดประภาคารถึงเรือ (ด้านตรงข้ามมุมฉาก) โจทย์ถามระยะในแนวระดับ" }
    solution: "ที่เรือ: $\\tan 30^\\circ = \\dfrac{45}{d}$ → $d = \\dfrac{45}{\\tan 30^\\circ} = 45\\sqrt{3} \\approx 77.9\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p009
    topics: [math.geometry.trig-ratios]
    difficulty: 4
    type: numeric
    stem: "ทางลาดสำหรับรถเข็นยาว $4\\ \\mathrm{m}$ (วัดตามพื้นเอียง) และยกสูงขึ้นจากพื้น $2\\ \\mathrm{m}$ ทางลาดทำมุมกับพื้นราบกี่องศา"
    answer: { value: 30, unit: องศา }
    hints:
      - "ความยาวทางลาดคือด้านตรงข้ามมุมฉาก ความสูงคือด้านตรงข้ามมุมที่ต้องการ"
      - "หาค่า $\\sin\\theta = \\dfrac{\\text{ข้าม}}{\\text{ฉาก}}$ ก่อน"
      - "นำค่าที่ได้ไปเทียบกับตารางมุมพิเศษ $30^\\circ$, $45^\\circ$, $60^\\circ$"
    misconceptions:
      - { match: 60, feedback: "ใช้ $\\cos\\theta = \\tfrac{2}{4}$ แต่ 2 เมตรคือความสูงซึ่งอยู่ตรงข้ามมุมที่พื้น จึงต้องใช้ $\\sin$" }
      - { match: 26.57, feedback: "ใช้ $\\tan\\theta = \\tfrac{2}{4}$ แต่ 4 เมตรคือความยาวตามพื้นเอียง (ด้านตรงข้ามมุมฉาก) ไม่ใช่ระยะตามแนวราบ" }
    solution: "$\\sin\\theta = \\dfrac{2}{4} = \\dfrac{1}{2}$ และ $\\sin 30^\\circ = \\dfrac{1}{2}$ จึงได้ $\\theta = 30^\\circ$ (ในชีวิตจริงทางลาดรถเข็นควรชันน้อยกว่านี้มาก)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p010
    topics: [math.geometry.trig-ratios]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการหาความสูงของตึก เมื่อยืนห่างตึก $d$ เมตรและวัดมุมเงยถึงยอดตึกได้ $\\theta$"
    items:
      - "วาดรูปสามเหลี่ยมมุมฉาก กำกับระยะ $d$ มุม $\\theta$ และความสูงที่ไม่รู้ค่า $h$"
      - "ระบุว่า $h$ เป็นด้านตรงข้ามมุม และ $d$ เป็นด้านประชิดมุม $\\theta$"
      - "เลือกใช้ $\\tan\\theta = \\dfrac{h}{d}$"
      - "คูณ $d$ ทั้งสองข้าง ได้ $h = d\\tan\\theta$ แล้วแทนค่า"
      - "บวกความสูงของระดับตา (ถ้ามี) เพื่อได้ความสูงจากพื้น"
    hints:
      - "เริ่มจากรูปเสมอ เพราะต้องรู้ว่าด้านไหนอยู่ตรงไหนก่อนเลือกอัตราส่วน"
      - "การเลือก sin cos หรือ tan ขึ้นกับว่ารู้ด้านไหนและต้องการด้านไหน"
    solution: "วาดรูป → ระบุข้าม/ชิด/ฉาก → เลือกอัตราส่วน ($\\tan$ เพราะเกี่ยวกับข้ามกับชิด) → แก้สมการหา $h$ → ปรับด้วยความสูงระดับตา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p011
    topics: [math.geometry.trig-ratios]
    difficulty: 5
    type: numeric
    stem: "ยืนที่จุด A มองยอดเจดีย์ด้วยมุมเงย $30^\\circ$ แล้วเดินตรงเข้าหาเจดีย์อีก $20\\ \\mathrm{m}$ ถึงจุด B มองยอดเจดีย์ด้วยมุมเงย $60^\\circ$ เจดีย์สูงกี่เมตร (ไม่คิดความสูงของระดับตา ตอบเป็นทศนิยม 1 ตำแหน่ง)"
    answer: { value: 17.32, tolerance: 0.17, unit: m }
    hints:
      - "ให้ $h$ เป็นความสูง และ $x$ เป็นระยะจาก B ถึงฐานเจดีย์ ระยะจาก A จึงเป็น $x + 20$"
      - "เขียนสองสมการ: $h = x\\tan 60^\\circ$ และ $h = (x + 20)\\tan 30^\\circ$"
      - "ให้สองนิพจน์ของ $h$ เท่ากัน แก้หา $x$ ก่อน แล้วนำไปแทนหา $h$"
    misconceptions:
      - { match: 10, feedback: "นั่นคือระยะจากจุด B ถึงฐานเจดีย์ ($x$) ยังต้องนำไปคูณ $\\tan 60^\\circ$ เพื่อหาความสูง" }
      - { match: 34.64, feedback: "ใช้ 20 เป็นระยะจาก B ถึงฐานเจดีย์ แต่ 20 เมตรคือระยะที่เดินระหว่าง A กับ B ระยะถึงฐานยังไม่รู้" }
    solution: "$x\\sqrt{3} = \\dfrac{x + 20}{\\sqrt{3}}$ → คูณ $\\sqrt{3}$: $3x = x + 20$ → $x = 10\\ \\mathrm{m}$ ดังนั้น $h = 10\\tan 60^\\circ = 10\\sqrt{3} \\approx 17.3\\ \\mathrm{m}$ ตรวจ: $(10 + 20)\\tan 30^\\circ = \\tfrac{30}{\\sqrt{3}} = 10\\sqrt{3}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p012
    topics: [math.geometry.trig-ratios]
    difficulty: 5
    type: numeric
    stem: "เล่นว่าวจุฬาที่ท้องสนามหลวง สายป่านตึงเป็นเส้นตรงยาว $50\\ \\mathrm{m}$ ทำมุม $60^\\circ$ กับแนวระดับ มือที่ถือสายป่านอยู่สูงจากพื้น $1.2\\ \\mathrm{m}$ ว่าวอยู่สูงจากพื้นกี่เมตร (ตอบเป็นทศนิยม 1 ตำแหน่ง)"
    answer: { value: 44.5, tolerance: 0.44, unit: m }
    hints:
      - "สายป่านเป็นด้านตรงข้ามมุมฉาก ความสูงของว่าวจากระดับมือเป็นด้านตรงข้ามมุม $60^\\circ$"
      - "หาความสูงจากระดับมือด้วย $\\sin 60^\\circ$"
      - "อย่าลืมบวกความสูงของมือจากพื้น"
    misconceptions:
      - { match: 43.3, feedback: "นั่นคือความสูงจากระดับมือเท่านั้น ต้องบวกอีก $1.2\\ \\mathrm{m}$ เพื่อวัดจากพื้น" }
      - { match: 26.2, feedback: "ใช้ $\\cos 60^\\circ$ ซึ่งให้ระยะในแนวระดับ ความสูงอยู่ตรงข้ามมุม $60^\\circ$ จึงต้องใช้ $\\sin$" }
    solution: "ความสูงจากระดับมือ $= 50\\sin 60^\\circ = 50 \\times \\dfrac{\\sqrt{3}}{2} = 25\\sqrt{3} \\approx 43.3\\ \\mathrm{m}$ ว่าวสูงจากพื้น $43.3 + 1.2 = 44.5\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p013
    topics: [math.geometry.trig-ratios]
    difficulty: 2
    type: numeric
    stem: "ถ้า $\\sin 40^\\circ = \\cos x^\\circ$ และ $x$ เป็นมุมแหลม $x$ มีค่าเท่าใด"
    answer: { value: 50, unit: องศา }
    hints:
      - "มุมแหลมสองมุมของสามเหลี่ยมมุมฉากรวมกันได้ $90^\\circ$"
      - "ด้านข้ามของมุมหนึ่งคือด้านชิดของอีกมุม จึงได้ $\\sin\\theta = \\cos(90^\\circ - \\theta)$"
    misconceptions:
      - { match: 40, feedback: "$\\sin 40^\\circ \\approx 0.643$ แต่ $\\cos 40^\\circ \\approx 0.766$ ไม่เท่ากัน ไซน์ของมุมหนึ่งเท่ากับโคไซน์ของมุมที่รวมกันได้ $90^\\circ$" }
      - { match: 140, feedback: "มุมที่รวมกันได้ $180^\\circ$ ใช้กับเรื่องอื่น ในสามเหลี่ยมมุมฉาก มุมแหลมสองมุมรวมกันได้ $90^\\circ$" }
    solution: "$\\sin 40^\\circ = \\cos(90^\\circ - 40^\\circ) = \\cos 50^\\circ$ จึงได้ $x = 50$ (ตรวจ: ทั้งสองค่าประมาณ $0.643$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p014
    topics: [math.geometry.trig-ratios]
    difficulty: 2
    type: numeric
    stem: "มุมแหลม $\\theta$ มี $\\cos\\theta = 0.6$ ค่าของ $\\sin\\theta$ เท่ากับเท่าใด (ตอบเป็นทศนิยม)"
    answer: { value: 0.8, tolerance: 0.001 }
    hints:
      - "ใช้ $\\sin^2\\theta + \\cos^2\\theta = 1$ หรือวาดสามเหลี่ยมที่ด้านชิด 3 ด้านฉาก 5"
      - "$\\sin^2\\theta = 1 - 0.36$ แล้วถอดรากที่สอง"
    misconceptions:
      - { match: 0.4, feedback: "$\\sin\\theta + \\cos\\theta$ ไม่ได้เท่ากับ 1 กำลังสองของทั้งคู่ต่างหากที่รวมกันได้ 1" }
      - { match: 0.64, feedback: "นั่นคือ $\\sin^2\\theta$ ยังต้องถอดรากที่สอง" }
    solution: "$\\sin^2\\theta = 1 - 0.6^2 = 0.64$ ได้ $\\sin\\theta = 0.8$ (มุมแหลมจึงเลือกค่าบวก) ตรงกับสามเหลี่ยม 3-4-5: $\\cos\\theta = \\tfrac35$, $\\sin\\theta = \\tfrac45$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p015
    topics: [math.geometry.trig-ratios]
    difficulty: 3
    type: numeric
    stem: "บันไดเลื่อนในห้างสรรพสินค้าพาขึ้นสูง $4.5\\ \\mathrm{m}$ ในระยะแนวราบ $7.8\\ \\mathrm{m}$ บันไดเลื่อนทำมุมกับพื้นราบประมาณกี่องศา (ตอบเป็นจำนวนเต็มองศา)"
    figure: { src: escalator.svg, alt: "สามเหลี่ยมมุมฉากของบันไดเลื่อน ด้านแนวราบยาว 7.8 m ด้านแนวตั้งยาว 4.5 m มุมฉากอยู่ใต้ปลายบน ด้านเอียงคือบันไดเลื่อน มุม θ อยู่ที่ปลายล่าง" }
    answer: { value: 30, tolerance: 0.5, unit: องศา }
    hints:
      - "รู้ด้านข้าม (ความสูง) และด้านชิด (ระยะราบ) ของมุม θ"
      - "ใช้ $\\theta = \\tan^{-1}\\dfrac{4.5}{7.8}$"
    misconceptions:
      - { match: 60, feedback: "นั่นคือมุมที่ปลายบน ใช้ $\\tan^{-1}\\tfrac{7.8}{4.5}$ ซึ่งกลับข้าม-ชิด มุมกับพื้นอยู่ที่ปลายล่าง" }
      - { match: 35.2, feedback: "ดูเหมือนใช้ $\\sin^{-1}\\tfrac{4.5}{7.8}$ แต่ $7.8\\ \\mathrm{m}$ เป็นระยะราบ (ชิด) ไม่ใช่ความยาวบันไดเลื่อน (ฉาก) ต้องใช้ $\\tan^{-1}$" }
    solution: "$\\tan\\theta = \\dfrac{4.5}{7.8} \\approx 0.577$ ได้ $\\theta = \\tan^{-1} 0.577 \\approx 30^\\circ$ (ซึ่งตรงกับ $\\tan 30^\\circ = \\tfrac{1}{\\sqrt3} \\approx 0.577$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p016
    topics: [math.geometry.trig-ratios]
    difficulty: 3
    type: numeric
    stem: "การไฟฟ้าขึงสายสลิงยึดเสาไฟฟ้า ปลายล่างยึดกับพื้นห่างจากโคนเสา $4\\ \\mathrm{m}$ สลิงทำมุม $50^\\circ$ กับพื้น สลิงยาวกี่เมตร (ตอบทศนิยม 2 ตำแหน่ง ในหน่วย m)"
    answer: { value: 6.22, tolerance: 0.05, unit: m }
    hints:
      - "ระยะบนพื้นเป็นด้านชิดมุม $50^\\circ$ สลิงเป็นด้านตรงข้ามมุมฉาก"
      - "ใช้ $\\cos 50^\\circ = \\dfrac{4}{L}$ แล้วจัดรูปหา $L$"
    misconceptions:
      - { match: 2.57, feedback: "ดูเหมือนคูณ $4 \\times \\cos 50^\\circ$ แต่สลิงเป็นด้านตรงข้ามมุมฉากซึ่งยาวที่สุด ต้องหาร: $L = \\tfrac{4}{\\cos 50^\\circ}$" }
      - { match: 5.22, feedback: "ดูเหมือนใช้ $\\sin 50^\\circ$ ระยะบนพื้นแตะมุม $50^\\circ$ จึงเป็นด้านชิด ต้องใช้ $\\cos$" }
    solution: "$\\cos 50^\\circ = \\dfrac{4}{L}$ → $L = \\dfrac{4}{\\cos 50^\\circ} \\approx \\dfrac{4}{0.6428} \\approx 6.22\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p017
    topics: [math.geometry.trig-ratios]
    difficulty: 4
    type: numeric
    stem: "เรือออกจากท่าเรือแล่นไปในทิศ $060^\\circ$ (วัดจากทิศเหนือตามเข็มนาฬิกา) เป็นระยะ $30\\ \\mathrm{km}$ ตอนนี้เรืออยู่ทางทิศตะวันออกของท่าเรือกี่กิโลเมตร (ตอบทศนิยม 1 ตำแหน่ง ในหน่วย km)"
    answer: { value: 26.0, tolerance: 0.1, unit: km }
    hints:
      - "แบริ่งวัดจากทิศเหนือ มุมระหว่างเส้นทางเรือกับแนวเหนือคือ $60^\\circ$"
      - "ระยะทางตะวันออกอยู่ตรงข้ามมุม $60^\\circ$ นั้น จึงใช้ $\\sin$"
    misconceptions:
      - { match: 15, feedback: "นั่นคือระยะทางทิศเหนือ ($30\\cos 60^\\circ$) แบริ่งวัดจากทิศเหนือ ระยะทางตะวันออกต้องใช้ $\\sin 60^\\circ$" }
      - { match: 17.3, feedback: "ดูเหมือนใช้ $30\\tan 30^\\circ$ เส้นทางเรือยาว $30\\ \\mathrm{km}$ เป็นด้านตรงข้ามมุมฉาก จึงใช้ $\\sin$ หรือ $\\cos$ ไม่ใช่ $\\tan$" }
    solution: "ระยะทางตะวันออก $= 30\\sin 60^\\circ = 30 \\times \\tfrac{\\sqrt3}{2} = 15\\sqrt3 \\approx 26.0\\ \\mathrm{km}$ (ระยะทางเหนือ $= 30\\cos 60^\\circ = 15\\ \\mathrm{km}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p018
    topics: [math.geometry.trig-ratios]
    difficulty: 5
    type: numeric
    stem: "กล่องลูกบาศก์ยาวด้านละ $10\\ \\mathrm{cm}$ เส้นทแยงมุมของลูกบาศก์ (จากมุมล่างไปมุมบนฝั่งตรงข้าม) ทำมุมกับพื้นกล่องกี่องศา (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 35.3, tolerance: 0.1, unit: องศา }
    hints:
      - "หาเส้นทแยงของพื้นกล่องก่อน: $\\sqrt{10^2 + 10^2}$"
      - "เส้นทแยงพื้น ความสูง และเส้นทแยงลูกบาศก์เป็นสามเหลี่ยมมุมฉาก ความสูงเป็นด้านข้าม เส้นทแยงพื้นเป็นด้านชิด"
      - "$\\theta = \\tan^{-1}\\dfrac{10}{10\\sqrt2}$"
    misconceptions:
      - { match: 45, feedback: "ดูเหมือนใช้ความยาวด้านพื้น $10$ เป็นด้านชิด เส้นทแยงลูกบาศก์ลากเหนือเส้นทแยงพื้นซึ่งยาว $10\\sqrt2$" }
      - { match: 54.7, feedback: "นั่นคือมุมกับแนวดิ่ง (สลับข้ามกับชิด) โจทย์ถามมุมกับพื้น" }
    solution: "เส้นทแยงพื้น $= 10\\sqrt2 \\approx 14.14\\ \\mathrm{cm}$ ได้ $\\tan\\theta = \\dfrac{10}{10\\sqrt2} = \\dfrac{1}{\\sqrt2}$ จึงได้ $\\theta = \\tan^{-1}(0.7071) \\approx 35.3^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p019
    topics: [math.geometry.trig-ratios]
    difficulty: 4
    type: numeric
    stem: "ในงานลอยกระทง โดรนถ่ายภาพลอยนิ่งสูงจากผิวน้ำ $80\\ \\mathrm{m}$ กล้องมองกระทงใบหนึ่งด้วยมุมก้ม $25^\\circ$ กระทงอยู่ห่างจากจุดใต้โดรนในแนวราบกี่เมตร (ตอบทศนิยม 1 ตำแหน่ง ในหน่วย m)"
    answer: { value: 171.6, tolerance: 1.5, unit: m }
    hints:
      - "มุมก้มเท่ากับมุมเงยจากกระทงขึ้นไปหาโดรน (มุมแย้ง)"
      - "ที่กระทง: ความสูง $80\\ \\mathrm{m}$ เป็นด้านข้าม ระยะราบเป็นด้านชิด"
      - "$\\tan 25^\\circ = \\dfrac{80}{d}$ แล้วจัดรูปหา $d$"
    misconceptions:
      - { match: 37.3, feedback: "ดูเหมือนคูณ $80 \\tan 25^\\circ$ ระยะราบเป็นด้านชิดของมุม $25^\\circ$ จึงต้องหาร: $d = \\tfrac{80}{\\tan 25^\\circ}$" }
      - { match: 189.3, feedback: "นั่นคือระยะในแนวเส้นสายตา ($\\tfrac{80}{\\sin 25^\\circ}$) โจทย์ถามระยะในแนวราบ" }
    solution: "$\\tan 25^\\circ = \\dfrac{80}{d}$ → $d = \\dfrac{80}{\\tan 25^\\circ} \\approx \\dfrac{80}{0.4663} \\approx 171.6\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.trig.p020
    topics: [math.geometry.trig-ratios]
    difficulty: 2
    type: numeric
    stem: "สามเหลี่ยมมุมฉากมีด้านยาว $8$, $15$ และ $17$ หน่วย มุม $A$ อยู่ตรงข้ามด้านที่ยาว $8$ หน่วย จงหา $\\cos A$ (ตอบทศนิยม 3 ตำแหน่ง)"
    answer: { value: 0.882, tolerance: 0.002 }
    hints:
      - "ด้านยาวที่สุด $17$ เป็นด้านตรงข้ามมุมฉาก"
      - "ด้าน $8$ อยู่ตรงข้ามมุม $A$ ด้านที่เหลือ $15$ จึงเป็นด้านชิดมุม $A$"
    misconceptions:
      - { match: 0.471, feedback: "นั่นคือ $\\tfrac{8}{17} = \\sin A$ เพราะใช้ด้านข้าม $\\cos A$ ใช้ด้านชิด" }
      - { match: 0.533, feedback: "นั่นคือ $\\tfrac{8}{15} = \\tan A$ $\\cos A$ ต้องหารด้วยด้านตรงข้ามมุมฉาก" }
    solution: "$\\cos A = \\dfrac{\\text{ชิด}}{\\text{ฉาก}} = \\dfrac{15}{17} \\approx 0.882$"
    license: CC-BY-SA-4.0
    ai_assisted: true
