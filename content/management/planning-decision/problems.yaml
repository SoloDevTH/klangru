    stem: "นักศึกษาคนหนึ่งสรุปเรื่อง EMV ไว้หลายข้อ ข้อใดถูก เลือกทุกข้อที่ถูก"
    choices:
      - { id: a, text: "EMV เป็นผลเฉลี่ยถ้าตัดสินใจแบบเดียวกันซ้ำหลายครั้ง", correct: true }
