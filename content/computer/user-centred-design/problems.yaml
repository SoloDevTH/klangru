      - "ส่วนย่อยที่ดีควรออกแบบและทดสอบแยกกันได้"
    solution: "แบ่งตามงานที่ระบบทำตั้งแต่ต้นจนจบ แต่ละส่วนมี user story ของตัวเอง และทดสอบแยกกันได้"
