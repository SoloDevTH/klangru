    stem: "MgO หลอมเหลวที่ประมาณ 2,850 °C แต่ NaCl หลอมเหลวที่ 801 °C เหตุผลหลักคือข้อใด"
    choices:
      - { id: a, text: "ไอออน $\\mathrm{Mg^{2+}}$ และ $\\mathrm{O^{2-}}$ มีประจุมากกว่าและมีขนาดเล็กกว่า แรงดึงดูดในโครงผลึกจึงแข็งแรงกว่ามาก", correct: true, feedback: "ถูก แรงดึงดูดเพิ่มตามประจุและเพิ่มเมื่อไอออนอยู่ใกล้กัน" }
      - { id: b, text: "MgO เป็นโมเลกุลขนาดใหญ่กว่า NaCl", feedback: "ทั้งสองไม่ได้เป็นโมเลกุล เป็นโครงผลึกไอออนิกทั้งคู่" }
