problems:
  - id: chemistry.organic.polymers.p001
    topics: [chemistry.organic.polymers]
    difficulty: 1
    type: mcq
    stem: "มอนอเมอร์ของพอลิเอทิลีน (PE) คือสารใด"
    choices:
      - { id: a, text: "เอทีน $\\mathrm{CH_2{=}CH_2}$", correct: true, feedback: "ถูก พันธะคู่ของเอทีนเปิดออกแล้วต่อกันเป็นสาย" }
      - { id: b, text: "อีเทน $\\mathrm{CH_3CH_3}$", feedback: "อีเทนไม่มีพันธะคู่ จึงต่อกันแบบเติมไม่ได้" }
      - { id: c, text: "เอทานอล $\\mathrm{C_2H_5OH}$", feedback: "เอทานอลใช้ผลิตเอทีนได้ แต่ไม่ใช่มอนอเมอร์โดยตรง" }
    hints:
      - "ชื่อพอลิเมอร์มาจาก พอลิ + ชื่อมอนอเมอร์"
      - "มอนอเมอร์แบบเติมต้องมีพันธะคู่"
    solution: "PE เกิดจาก **เอทีน** หลายโมเลกุลต่อกันแบบเติม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.polymers.p002
    topics: [chemistry.organic.polymers]
    difficulty: 2
    type: mcq
    stem: "เอทีนเป็นแก๊สที่อุณหภูมิห้อง แต่พอลิเอทิลีนเป็นของแข็ง เพราะเหตุใด"
    choices:
      - { id: a, text: "โมเลกุลของพอลิเอทิลีนใหญ่มาก แรงระหว่างโมเลกุลรวมจึงสูงกว่ามาก", correct: true, feedback: "ถูก แรงระหว่างโมเลกุลเพิ่มตามขนาดโมเลกุล" }
      - { id: b, text: "พอลิเอทิลีนเป็นสารประกอบไอออนิก", feedback: "พอลิเอทิลีนมีแต่พันธะโคเวเลนต์ระหว่าง C กับ C และ C กับ H" }
      - { id: c, text: "พอลิเอทิลีนมีพันธะคู่มากกว่าเอทีน", feedback: "พันธะคู่เปิดออกระหว่างการเกิดพอลิเมอร์ สายพอลิเอทิลีนมีแต่พันธะเดี่ยว" }
    hints:
      - "เทียบขนาดโมเลกุลของมอนอเมอร์กับพอลิเมอร์"
      - "สถานะขึ้นกับแรงระหว่างโมเลกุล"
    solution: "พอลิเอทิลีนมีโมเลกุลยาวหลายพันหน่วย **แรงระหว่างโมเลกุลรวมสูงมาก** จึงเป็นของแข็ง ส่วนเอทีนโมเลกุลเล็ก แรงน้อย จึงเป็นแก๊ส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.polymers.p003
    topics: [chemistry.organic.polymers]
    difficulty: 2
    type: match
    stem: "จับคู่พอลิเมอร์กับมอนอเมอร์"
    pairs:
      - { left: "PVC (ท่อน้ำ)", right: "ไวนิลคลอไรด์ CH₂=CHCl" }
      - { left: "PP (กล่องอาหารเข้าไมโครเวฟ)", right: "โพรพีน CH₂=CHCH₃" }
      - { left: "PS (กล่องโฟม)", right: "สไตรีน CH₂=CHC₆H₅" }
      - { left: "PTFE (เทฟลอนเคลือบกระทะ)", right: "เตตระฟลูออโรเอทีน CF₂=CF₂" }
      - { left: "ยางธรรมชาติ", right: "ไอโซพรีน" }
    hints:
      - "ดูหมู่ที่ติดกับ C=C ของมอนอเมอร์"
      - "Cl, CH₃, วงเบนซีน และ F ปรากฏในพอลิเมอร์ตรงตามมอนอเมอร์"
    solution: "PVC ← ไวนิลคลอไรด์ · PP ← โพรพีน · PS ← สไตรีน · PTFE ← เตตระฟลูออโรเอทีน · ยางธรรมชาติ ← ไอโซพรีน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.polymers.p004
    topics: [chemistry.organic.polymers]
    difficulty: 3
    type: mcq
    stem: "ภาพแสดงส่วนหนึ่งของสายพอลิเมอร์ X มอนอเมอร์ของ X คือสารใด"
    figure:
      src: p-repeat-unit.svg
      alt: "สายคาร์บอน 8 อะตอมต่อกันด้วยพันธะเดี่ยว ปลายทั้งสองข้างมีเส้นต่อออกไป คาร์บอนตัวที่ 1, 3, 5, 7 ต่อกับ H ด้านบนและ H ด้านล่าง คาร์บอนตัวที่ 2, 4, 6, 8 ต่อกับ H ด้านบนและ CH₃ ด้านล่าง"
    choices:
      - { id: a, text: "โพรพีน $\\mathrm{CH_2{=}CHCH_3}$", correct: true, feedback: "ถูก หน่วยซ้ำ –CH₂–CH(CH₃)– มาจากโพรพีน X คือ PP" }
      - { id: b, text: "เอทีน $\\mathrm{CH_2{=}CH_2}$", feedback: "ถ้าเป็นเอทีน ทุกคาร์บอนจะมีแต่ H ไม่มีหมู่ CH₃" }
      - { id: c, text: "บิวทีน $\\mathrm{CH_2{=}CHCH_2CH_3}$", feedback: "กิ่งในภาพเป็น CH₃ (หนึ่งคาร์บอน) ไม่ใช่ CH₂CH₃" }
      - { id: d, text: "โพรเพน $\\mathrm{CH_3CH_2CH_3}$", feedback: "โพรเพนไม่มีพันธะคู่ จึงต่อกันแบบเติมไม่ได้" }
    hints:
      - "หาหน่วยที่ซ้ำกัน ซึ่งมีคาร์บอนสายหลัก 2 อะตอม"
      - "ใส่พันธะคู่ระหว่างคาร์บอนสองตัวของหน่วยซ้ำ"
    solution: "หน่วยซ้ำคือ –CH₂–CH(CH₃)– ใส่พันธะคู่กลับได้ **โพรพีน** CH₂=CHCH₃ พอลิเมอร์ X คือพอลิโพรพิลีน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.polymers.p005
    topics: [chemistry.organic.polymers]
    difficulty: 3
    type: mcq
    stem: "สารคู่ใดทำปฏิกิริยาเกิดพอลิเมอร์แบบควบแน่นได้"
    choices:
      - { id: a, text: "กรดเทเรฟทาลิก (HOOC–C₆H₄–COOH) กับเอทิลีนไกลคอล (HO–CH₂CH₂–OH)", correct: true, feedback: "ถูก แต่ละตัวมีหมู่ฟังก์ชันสองหมู่ ต่อกันเป็นสายพอลิเอสเทอร์ (PET) และให้น้ำ" }
      - { id: b, text: "กรดเอทาโนอิก (CH₃COOH) กับเอทานอล", feedback: "แต่ละตัวมีหมู่ฟังก์ชันหมู่เดียว ได้เอสเทอร์โมเลกุลเดียวแล้วหยุด ไม่เป็นสายยาว" }
      - { id: c, text: "เอทีนกับโพรพีน", feedback: "สองตัวนี้มีพันธะคู่ ต่อกันได้แบบเติม (โคพอลิเมอร์) ไม่ใช่แบบควบแน่น" }
    hints:
      - "สายยาวเกิดได้เมื่อมอนอเมอร์ต่อได้ทั้งสองปลาย"
      - "นับหมู่ฟังก์ชันของแต่ละสาร"
    solution: "การเกิดพอลิเมอร์แบบควบแน่นต้องใช้มอนอเมอร์ที่มี **หมู่ฟังก์ชันสองหมู่** คู่ที่ถูกคือ **กรดเทเรฟทาลิกกับเอทิลีนไกลคอล** ได้ PET และน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.polymers.p006
    topics: [chemistry.organic.polymers]
    difficulty: 3
    type: numeric
    stem: "พอลิสไตรีนตัวอย่างหนึ่งมีมวลโมเลกุล 312,000 g/mol มอนอเมอร์สไตรีน $\\mathrm{C_8H_8}$ มีมวลโมเลกุล 104.15 สายนี้มีหน่วยซ้ำราวกี่หน่วย"
    answer: { value: 2996, unit: หน่วย, tolerance: 15 }
    misconceptions:
      - { match: 11123, feedback: "ใช้มวลของ C₂H₄ (28.05) แต่หน่วยซ้ำของพอลิสไตรีนคือสไตรีนทั้งโมเลกุล" }
      - { match: 3.0, feedback: "ลืมว่ามวลโมเลกุลเป็น 312,000 ไม่ใช่ 312" }
    hints:
      - "พอลิเมอร์แบบเติม มวลหน่วยซ้ำ = มวลมอนอเมอร์"
      - "n = มวลโมเลกุลพอลิเมอร์ ÷ มวลหน่วยซ้ำ"
    solution: "$n = 312000 / 104.15 \\approx$ **2,996 หน่วย** (ราว 3,000)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.polymers.p007
    topics: [chemistry.organic.polymers]
    difficulty: 4
    type: numeric
    stem: "สาย PVC สายหนึ่งมีหน่วยซ้ำ $\\mathrm{-CH_2-CHCl-}$ จำนวน 2,000 หน่วย มีมวลโมเลกุลประมาณกี่ g/mol (C 12.01 H 1.008 Cl 35.45)"
    answer: { value: 124980, unit: g/mol, tolerance: 1250 }
    misconceptions:
      - { match: 56100, feedback: "ใช้หน่วยซ้ำของ PE (C₂H₄) ต้องรวม Cl ด้วย หน่วยซ้ำคือ C₂H₃Cl" }
      - { match: 62.49, feedback: "นี่คือมวลของหน่วยซ้ำเพียงหน่วยเดียว ต้องคูณด้วย 2,000" }
    hints:
      - "มวลหน่วยซ้ำ C₂H₃Cl เท่ากับเท่าใด"
      - "มวลโมเลกุล = จำนวนหน่วย × มวลหน่วยซ้ำ"
    solution: "หน่วยซ้ำ $= 2(12.01) + 3(1.008) + 35.45 = 62.49$ มวลโมเลกุล $= 2000 \\times 62.49 \\approx$ **125,000 g/mol**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.polymers.p008
    topics: [chemistry.organic.polymers]
    difficulty: 4
    type: numeric
    stem: "สร้างสายไนลอน-6,6 หนึ่งสายจากกรดเฮกเซนไดโออิก 100 โมเลกุลกับเฮกเซน-1,6-ไดเอมีน 100 โมเลกุล ต่อสลับกันเป็นสายเส้นตรงเส้นเดียว จะมีน้ำหลุดออกกี่โมเลกุล"
    answer: { value: 199, unit: โมเลกุล }
    misconceptions:
      - { match: 200, feedback: "มอนอเมอร์ 200 ตัวต่อเป็นสายเส้นตรงมีรอยต่อ 199 จุด ไม่ใช่ 200 (ปลายสายไม่มีรอยต่อ)" }
      - { match: 100, feedback: "นับเฉพาะรอยต่อด้านเดียว มอนอเมอร์ทุกตัวยกเว้นที่ปลายต่อทั้งสองข้าง" }
    hints:
      - "รอยต่อแต่ละจุด (พันธะเอไมด์) ให้น้ำ 1 โมเลกุล"
      - "ของ 200 ชิ้นต่อเป็นแถวเดียวมีรอยต่อกี่จุด"
    solution: "มอนอเมอร์ทั้งหมด 200 ตัว ต่อเป็นสายเส้นตรงมีพันธะเอไมด์ $200 - 1 =$ **199** พันธะ จึงได้น้ำ 199 โมเลกุล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.polymers.p009
    topics: [chemistry.organic.polymers]
    difficulty: 3
    type: mcq
    stem: "แกลลอนนมทำจาก HDPE ส่วนถุงเย็นบางทำจาก LDPE ทั้งที่เป็นพอลิเอทิลีนเหมือนกัน ทำไม HDPE จึงแข็งและหนาแน่นกว่า"
    choices:
      - { id: a, text: "สาย HDPE เป็นสายตรง เรียงชิดกันได้ แรงระหว่างสายจึงมากกว่า", correct: true, feedback: "ถูก LDPE มีกิ่งมาก สายเรียงชิดกันไม่ได้" }
      - { id: b, text: "HDPE มีพันธะคู่มากกว่า", feedback: "ทั้งสองชนิดมีแต่พันธะเดี่ยวในสาย" }
      - { id: c, text: "HDPE เป็นเทอร์โมเซต ส่วน LDPE เป็นเทอร์โมพลาสติก", feedback: "ทั้งสองเป็นเทอร์โมพลาสติก หลอมขึ้นรูปใหม่ได้" }
    hints:
      - "ดูภาพเปรียบเทียบ HDPE กับ LDPE"
      - "กิ่งมีผลต่อการเรียงตัวของสายอย่างไร"
    solution: "HDPE เป็น **สายตรง เรียงชิดกันได้** แรงระหว่างสายมาก จึงหนาแน่นและแข็ง LDPE มีกิ่ง สายอยู่ห่างกัน จึงนิ่มและยืดหยุ่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.polymers.p010
    topics: [chemistry.organic.polymers]
    difficulty: 4
    type: mcq
    stem: "ทำไมจานเมลามีนจึงไม่อ่อนตัวเมื่อโดนความร้อน และหลอมนำกลับมาขึ้นรูปใหม่ไม่ได้"
    choices:
      - { id: a, text: "สายพอลิเมอร์เชื่อมกันด้วยพันธะโคเวเลนต์เป็นร่างแหทั่วทั้งชิ้น", correct: true, feedback: "ถูก ต้องสลายพันธะโคเวเลนต์จึงจะเปลี่ยนรูปได้ ซึ่งทำให้สลายตัวไหม้ไปก่อน" }
      - { id: b, text: "สายพอลิเมอร์สั้นมาก", feedback: "สายสั้นจะทำให้อ่อนตัวง่ายขึ้น ไม่ใช่ทนความร้อน" }
      - { id: c, text: "เมลามีนเป็นโลหะ", feedback: "เมลามีนเป็นพลาสติกเทอร์โมเซต ไม่ใช่โลหะ" }
    hints:
      - "เมลามีนเป็นเทอร์โมพลาสติกหรือเทอร์โมเซต"
      - "การหลอมต้องให้สายเลื่อนผ่านกันได้"
    solution: "เมลามีนเป็น **เทอร์โมเซต** สายเชื่อมกันเป็นร่างแหด้วยพันธะโคเวเลนต์ สายจึงเลื่อนผ่านกันไม่ได้เมื่อร้อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.polymers.p011
    topics: [chemistry.organic.polymers]
    difficulty: 4
    type: mcq
    stem: "ศูนย์รีไซเคิลแยกเศษพลาสติกด้วยการแช่ในของเหลว เศษชิ้นหนึ่ง **ลอย** ในน้ำ (1.00 g/cm³) แต่ **จม** ในสารละลายแอลกอฮอล์ที่มีความหนาแน่น 0.93 g/cm³ เศษนี้น่าจะเป็นพลาสติกชนิดใด (PP 0.90–0.91, LDPE 0.91–0.93, HDPE 0.94–0.97, PS 1.04–1.06, PET 1.38–1.40 g/cm³)"
    choices:
      - { id: a, text: "HDPE", correct: true, feedback: "ถูก ความหนาแน่นอยู่ระหว่าง 0.93 กับ 1.00 มีเพียง HDPE" }
      - { id: b, text: "PP", feedback: "PP มีความหนาแน่น 0.90–0.91 จะลอยในสารละลาย 0.93 ด้วย" }
      - { id: c, text: "PET", feedback: "PET หนาแน่นกว่าน้ำ จะจมน้ำ" }
      - { id: d, text: "PS", feedback: "PS หนาแน่นกว่าน้ำเล็กน้อย จะจมน้ำ" }
    hints:
      - "ลอยแปลว่าความหนาแน่นน้อยกว่าของเหลว จมแปลว่ามากกว่า"
      - "หาพลาสติกที่ความหนาแน่นอยู่ระหว่าง 0.93 กับ 1.00"
    solution: "ความหนาแน่นต้องมากกว่า 0.93 แต่น้อยกว่า 1.00 g/cm³ ตรงกับ **HDPE** (0.94–0.97)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.organic.polymers.p012
    topics: [chemistry.organic.polymers]
    difficulty: 4
    type: mcq
    stem: "โรงงานยางในภาคใต้นำยางดิบจากต้นยางพารามาผ่านกระบวนการวัลคาไนเซชันก่อนทำยางรถยนต์ กระบวนการนี้เปลี่ยนโครงสร้างและสมบัติอย่างไร"
    choices:
      - { id: a, text: "กำมะถันเชื่อมขวางสายพอลิไอโซพรีนบางจุด ยางจึงแข็งแรง คืนรูปได้ดี และไม่เหนียวเยิ้มเมื่อร้อน", correct: true, feedback: "ถูก การเชื่อมขวางบางจุดทำให้สายไม่เลื่อนหลุดจากกัน แต่ยังยืดได้" }
      - { id: b, text: "กำมะถันตัดสายยางให้สั้นลง ยางจึงนิ่มขึ้น", feedback: "กำมะถันเชื่อมสายเข้าด้วยกัน ไม่ได้ตัดสาย" }
      - { id: c, text: "เชื่อมขวางทุกจุดจนเป็นร่างแหแน่น ยางจึงยืดได้มากขึ้น", feedback: "ถ้าเชื่อมขวางมากเกินไป ยางจะแข็งเหมือนเทอร์โมเซต (เช่น เอโบไนต์) และยืดไม่ได้" }
    hints:
      - "วัลคาไนเซชันใช้ธาตุอะไร"
      - "การเชื่อมขวางน้อยกับมากให้สมบัติต่างกันอย่างไร"
