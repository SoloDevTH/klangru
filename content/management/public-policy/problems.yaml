    stem: "จังหวัดแห่งหนึ่ง (สมมติ) ต้องเลือกโครงการป้องกันน้ำท่วมเพียงหนึ่งโครงการบนพื้นที่เดียวกัน งบเพียงพอทั้งสองแบบ แบบ A มี NPV 20 ล้านบาท B/C = 1.5 แบบ B มี NPV 35 ล้านบาท B/C = 1.3 ควรเลือกแบบใด"
    choices:
