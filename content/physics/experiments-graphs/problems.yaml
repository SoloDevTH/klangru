problems:
  - id: physics.units.experiments-graphs.p001
    topics: [physics.units.experiments-graphs]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "เรื่องใดเป็นเรื่องที่วิชาฟิสิกส์ศึกษาโดยตรง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "รถเบรกแล้วไถลไปได้ไกลเท่าใดก่อนหยุด", correct: true }
      - { id: b, text: "แสงหักเหเมื่อผ่านจากอากาศเข้าสู่น้ำ", correct: true }
      - { id: c, text: "กระแสไฟฟ้าในวงจรของพัดลม", correct: true }
      - { id: d, text: "การแบ่งเซลล์ของรากหอม", feedback: "การแบ่งเซลล์ของสิ่งมีชีวิตเป็นเรื่องของชีววิทยา" }
      - { id: e, text: "การเรียกชื่อสารประกอบไอออนิก", feedback: "การเรียกชื่อสารเป็นเรื่องของเคมี" }
    hints:
      - "ฟิสิกส์ศึกษาสสาร พลังงาน การเคลื่อนที่ และแรง"
      - "เรื่องของสิ่งมีชีวิตและการเรียกชื่อสารเป็นของวิชาอื่น"
    solution: "การเคลื่อนที่ของรถ การหักเหของแสง และกระแสไฟฟ้าเป็นเรื่องของฟิสิกส์ ส่วนการแบ่งเซลล์เป็นชีววิทยา การเรียกชื่อสารเป็นเคมี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p002
    topics: [physics.units.experiments-graphs]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนการหาความรู้ทางวิทยาศาสตร์โดยทั่วไป"
    items:
      - "สังเกตปรากฏการณ์และตั้งคำถาม"
      - "ตั้งสมมติฐานที่ทดสอบได้"
      - "ออกแบบการทดลองและเก็บข้อมูล"
      - "วิเคราะห์ข้อมูลด้วยตารางและกราฟ"
      - "สรุปผลว่าสนับสนุนสมมติฐานหรือไม่"
    hints:
      - "ต้องมีคำถามก่อนจึงจะคาดคำตอบได้"
      - "สรุปผลได้หลังจากวิเคราะห์ข้อมูลแล้ว"
    solution: "สังเกตและตั้งคำถาม → ตั้งสมมติฐาน → ออกแบบการทดลองและเก็บข้อมูล → วิเคราะห์ข้อมูล → สรุปผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p003
    topics: [physics.units.experiments-graphs]
    difficulty: 2
    type: match
    stem: "จับคู่การค้นพบทางฟิสิกส์กับเทคโนโลยีที่พัฒนาต่อจากการค้นพบนั้น"
    pairs:
      - { left: "ฟาราเดย์: แม่เหล็กที่เคลื่อนที่ใกล้ขดลวดทำให้เกิดกระแสไฟฟ้า", right: "เครื่องกำเนิดไฟฟ้าในโรงไฟฟ้า" }
      - { left: "แมกซ์เวลล์และเฮิรตซ์: คลื่นแม่เหล็กไฟฟ้า", right: "วิทยุและโทรศัพท์มือถือ" }
      - { left: "นิวตัน: กฎการเคลื่อนที่และกฎแรงโน้มถ่วง", right: "การคำนวณวงโคจรเพื่อส่งดาวเทียม" }
      - { left: "ไอน์สไตน์: ทฤษฎีสัมพัทธภาพ", right: "การแก้เวลานาฬิกาบนดาวเทียมระบบ GPS" }
    hints:
      - "เครื่องกำเนิดไฟฟ้าใช้แม่เหล็กหมุนในขดลวด"
      - "วิทยุส่งข้อมูลด้วยคลื่นที่เดินทางผ่านอากาศและอวกาศได้"
    solution: "ฟาราเดย์ → เครื่องกำเนิดไฟฟ้า แมกซ์เวลล์และเฮิรตซ์ → วิทยุและโทรศัพท์มือถือ นิวตัน → วงโคจรดาวเทียม ไอน์สไตน์ → การแก้เวลาใน GPS"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p004
    topics: [physics.units.experiments-graphs]
    difficulty: 2
    type: numeric
    stem: "นักเรียนจับเวลาลูกตุ้มแกว่งไปกลับ 1 รอบ 5 ครั้ง ได้ 2.43, 2.47, 2.45, 2.41 และ 2.49 วินาที ค่าเฉลี่ยของคาบเป็นกี่วินาที (ตอบในหน่วย s ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 2.45, tolerance: 0.005, unit: s }
    hints:
      - "ค่าเฉลี่ย = ผลรวม ÷ จำนวนครั้ง"
      - "บวกทั้งห้าค่าแล้วหารด้วย 5"
    misconceptions:
      - { match: 12.25, feedback: "นั่นคือผลรวมของห้าครั้ง ยังต้องหารด้วยจำนวนครั้ง" }
    solution: "$\\dfrac{2.43 + 2.47 + 2.45 + 2.41 + 2.49}{5} = \\dfrac{12.25}{5} = 2.45\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p005
    topics: [physics.units.experiments-graphs]
    difficulty: 2
    type: numeric
    stem: "จากข้อมูลการจับเวลา 2.43, 2.47, 2.45, 2.41 และ 2.49 วินาที ถ้าประมาณความไม่แน่นอนจากครึ่งหนึ่งของช่วงข้อมูล ความไม่แน่นอนเป็นกี่วินาที (ตอบในหน่วย s)"
    answer: { value: 0.04, tolerance: 0.002, unit: s }
    hints:
      - "ช่วงข้อมูล = ค่ามากสุด − ค่าน้อยสุด"
      - "หารช่วงข้อมูลด้วย 2"
    misconceptions:
      - { match: 0.08, feedback: "0.08 s คือช่วงข้อมูลทั้งหมด ความไม่แน่นอนใช้ครึ่งหนึ่งของช่วง" }
      - { match: 0.02, feedback: "ดูเหมือนใช้ผลต่างของค่าที่อยู่ติดกัน (เช่น 2.45 − 2.43) ต้องใช้ค่ามากสุดลบค่าน้อยสุดของทั้งชุด" }
    solution: "ช่วงข้อมูล $= 2.49 - 2.41 = 0.08\\ \\mathrm{s}$ ความไม่แน่นอน $\\approx \\dfrac{0.08}{2} = 0.04\\ \\mathrm{s}$ รายงานผลว่า $(2.45 \\pm 0.04)\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p006
    topics: [physics.units.experiments-graphs]
    difficulty: 3
    type: numeric
    stem: "ร้านกาแฟโบราณต้มน้ำในกาต้มน้ำไฟฟ้า แล้ววัดอุณหภูมิทุก 1 นาที ได้กราฟตามภาพ ความชันของกราฟเป็นกี่องศาเซลเซียสต่อนาที (ตอบในหน่วย °C/min)"
    figure: { src: heating-graph.svg, alt: "กราฟอุณหภูมิ (องศาเซลเซียส) บนแกนตั้ง 0 ถึง 60 กับเวลา (นาที) บนแกนนอน 0 ถึง 5 มีจุดข้อมูลหกจุดที่ 0, 1, 2, 3, 4, 5 นาที อุณหภูมิ 30, 35, 40, 45, 50, 55 องศาเซลเซียส และเส้นตรงลากผ่านทุกจุด" }
    answer: { value: 5, tolerance: 0.1, unit: °C/min }
    hints:
      - "เลือกสองจุดบนเส้นที่อยู่ห่างกันและอ่านค่าง่าย เช่น ที่ 0 และ 4 นาที"
      - "ความชัน = การเปลี่ยนอุณหภูมิ ÷ การเปลี่ยนเวลา"
    misconceptions:
      - { match: 0.2, feedback: "ดูเหมือนนำเวลาหารอุณหภูมิ (Δx/Δy) ความชันต้องเป็นค่าแกนตั้งที่เปลี่ยนหารด้วยค่าแกนนอนที่เปลี่ยน" }
      - { match: 11, feedback: "ดูเหมือนนำ 55 °C หาร 5 นาที ซึ่งรวมอุณหภูมิเริ่มต้น 30 °C เข้าไปด้วย ต้องใช้ผลต่างของอุณหภูมิ" }
    solution: "ใช้จุด $(0, 30)$ และ $(4, 50)$: ความชัน $= \\dfrac{50 - 30}{4 - 0} = \\dfrac{20}{4} = 5\\ ^\\circ\\mathrm{C/min}$ คือน้ำร้อนขึ้นนาทีละ 5 องศาเซลเซียส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p007
    topics: [physics.units.experiments-graphs]
    difficulty: 3
    type: mcq
    stem: "จากกราฟอุณหภูมิของน้ำในกาต้มกับเวลาเดิม จุดตัดแกนตั้งที่ 30 °C มีความหมายว่าอะไร"
    figure: { src: heating-graph.svg, alt: "กราฟอุณหภูมิ (องศาเซลเซียส) บนแกนตั้ง 0 ถึง 60 กับเวลา (นาที) บนแกนนอน 0 ถึง 5 มีจุดข้อมูลหกจุดที่ 0, 1, 2, 3, 4, 5 นาที อุณหภูมิ 30, 35, 40, 45, 50, 55 องศาเซลเซียส และเส้นตรงลากผ่านทุกจุด" }
    choices:
      - { id: a, text: "อุณหภูมิของน้ำตอนเริ่มต้มเป็น 30 °C", correct: true }
      - { id: b, text: "น้ำร้อนขึ้นนาทีละ 30 °C", feedback: "อัตราที่น้ำร้อนขึ้นคือความชัน (5 °C/min) ไม่ใช่จุดตัดแกน" }
      - { id: c, text: "น้ำจะเดือดเมื่อถึง 30 °C", feedback: "น้ำเดือดที่ประมาณ 100 °C จุดตัดแกนตั้งคือค่าเมื่อเวลาเป็นศูนย์" }
    hints:
      - "จุดตัดแกนตั้งคือค่าบนแกนตั้งเมื่อค่าบนแกนนอนเป็นศูนย์"
      - "เวลาเป็นศูนย์คือตอนไหนของการทดลอง"
    solution: "จุดตัดแกนตั้งคืออุณหภูมิเมื่อเวลา $t = 0$ คืออุณหภูมิเริ่มต้นของน้ำ 30 °C ซึ่งใกล้อุณหภูมิห้องในไทย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p008
    topics: [physics.units.experiments-graphs]
    difficulty: 3
    type: mcq
    stem: "เขียนกราฟความยาวสปริง (cm) บนแกนตั้ง กับแรงดึง (N) บนแกนนอน ความชันของกราฟมีหน่วยอะไร"
    choices:
      - { id: a, text: "cm/N", correct: true }
      - { id: b, text: "N/cm", feedback: "นี่คือหน่วยเมื่อกลับเศษส่วน ความชันคือหน่วยแกนตั้งหารด้วยหน่วยแกนนอน" }
      - { id: c, text: "cm·N", feedback: "ความชันได้จากการหาร Δy ด้วย Δx หน่วยจึงต้องหารกัน ไม่ใช่คูณกัน" }
      - { id: d, text: "cm", feedback: "cm เป็นหน่วยของแกนตั้งและของจุดตัดแกน ความชันต้องหารด้วยหน่วยแกนนอนด้วย" }
    hints:
      - "ความชัน = Δy ÷ Δx"
      - "หน่วยของ Δy คือหน่วยแกนตั้ง หน่วยของ Δx คือหน่วยแกนนอน"
    solution: "ความชัน $= \\dfrac{\\Delta L}{\\Delta F}$ หน่วยคือ cm/N บอกว่าแรงดึง 1 N ทำให้สปริงยืดกี่เซนติเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p009
    topics: [physics.units.experiments-graphs]
    difficulty: 3
    type: mcq
    stem: "จุดข้อมูลบนกราฟเรียงตัวเกือบเป็นแนวเส้นตรงแต่ไม่ตรงพอดี ควรลากเส้นอย่างไร"
    choices:
      - { id: a, text: "ลากเส้นตรงเส้นเดียวให้จุดอยู่สองข้างเส้นพอ ๆ กัน", correct: true }
      - { id: b, text: "ลากเส้นต่อจุดทีละคู่ให้ผ่านทุกจุด", feedback: "จุดแต่ละจุดมีความคลาดเคลื่อน การลากต่อทุกจุดทำให้เส้นหยักตามความคลาดเคลื่อน ไม่แสดงความสัมพันธ์จริง" }
      - { id: c, text: "ลากเส้นตรงผ่านจุดแรกและจุดสุดท้าย", feedback: "สองจุดปลายอาจคลาดเคลื่อนมากที่สุดก็ได้ เส้นที่เหมาะสมต้องพิจารณาทุกจุด" }
      - { id: d, text: "ลากเส้นตรงผ่านจุดกำเนิดเสมอ", feedback: "ความสัมพันธ์หลายอย่างไม่ผ่านจุดกำเนิด เช่น ความยาวสปริงเมื่อไม่มีแรงดึงไม่ใช่ศูนย์ จุดตัดแกนเป็นข้อมูลสำคัญ" }
    hints:
      - "ข้อมูลแต่ละจุดมีความคลาดเคลื่อนแบบสุ่ม"
      - "เส้นที่ดีต้องเฉลี่ยความคลาดเคลื่อนของทุกจุด"
    solution: "ลากเส้นตรงที่เหมาะสมที่สุด ให้จุดอยู่เหนือและใต้เส้นพอ ๆ กัน และผ่านแถบความคลาดเคลื่อนให้ได้มากที่สุด เส้นนี้เฉลี่ยความคลาดเคลื่อนแบบสุ่มของทุกจุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p010
    topics: [physics.units.experiments-graphs]
    difficulty: 4
    type: numeric
    stem: "เส้นตรงที่เหมาะสมของกราฟความยาวสปริง $L$ (cm) กับแรงดึง $F$ (N) ผ่านจุด $(1\\ \\mathrm{N}, 12\\ \\mathrm{cm})$ และ $(4.5\\ \\mathrm{N}, 19\\ \\mathrm{cm})$ ความชันของเส้นเป็นกี่เซนติเมตรต่อนิวตัน (ตอบในหน่วย cm/N)"
    answer: { value: 2, tolerance: 0.02, unit: cm/N }
    hints:
      - "ความชัน = ΔL ÷ ΔF"
      - "ΔL = 19 − 12 และ ΔF = 4.5 − 1"
    misconceptions:
      - { match: 0.5, feedback: "ดูเหมือนนำ ΔF หาร ΔL ความชันคือค่าแกนตั้งที่เปลี่ยนหารด้วยค่าแกนนอนที่เปลี่ยน" }
      - { match: 4.22, feedback: "ดูเหมือนนำ 19 หาร 4.5 จากจุดเดียว ใช้ได้เฉพาะเส้นที่ผ่านจุดกำเนิด เส้นนี้ตัดแกนตั้งที่ความยาวเดิมของสปริง" }
    solution: "ความชัน $= \\dfrac{19 - 12}{4.5 - 1} = \\dfrac{7}{3.5} = 2.0\\ \\mathrm{cm/N}$ แรงดึงทุก 1 N ทำให้สปริงยืด 2 cm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p011
    topics: [physics.units.experiments-graphs]
    difficulty: 4
    type: numeric
    stem: "สปริงในตาชั่งแขวนของแม่ค้ามีกราฟความยาวกับแรงดึงเป็นเส้นตรง จุดตัดแกนความยาวที่ $10\\ \\mathrm{cm}$ และความชัน $2\\ \\mathrm{cm/N}$ เมื่อแขวนถุงผลไม้ที่หนัก $3.5\\ \\mathrm{N}$ สปริงจะยาวกี่เซนติเมตร (ตอบในหน่วย cm)"
    answer: { value: 17, tolerance: 0.1, unit: cm }
    hints:
      - "เขียนสมการเส้นตรง L = (ความชัน)F + (จุดตัดแกน)"
      - "แทน F = 3.5 N"
    misconceptions:
      - { match: 7, feedback: "7 cm คือระยะที่สปริงยืดออก ยังต้องบวกความยาวเดิม 10 cm" }
      - { match: 1.75, feedback: "ดูเหมือนนำ 3.5 หาร 2 ความชัน 2 cm/N แปลว่าแรงทุก 1 N ยืด 2 cm ต้องคูณ" }
    solution: "$L = 2F + 10 = 2(3.5) + 10 = 17\\ \\mathrm{cm}$ การอ่านค่าระหว่างจุดข้อมูลแบบนี้เชื่อถือได้ เพราะอยู่ในช่วงที่ทดลอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p012
    topics: [physics.units.experiments-graphs]
    difficulty: 4
    type: mcq
    stem: "วัตถุเริ่มจากหยุดนิ่งและเคลื่อนที่ด้วยความเร่งคงตัว ระยะทางเป็นไปตาม $s = \\tfrac12 at^2$ ควรเขียนกราฟของปริมาณใดจึงได้เส้นตรง"
    choices:
      - { id: a, text: "$s$ กับ $t^2$", correct: true }
      - { id: b, text: "$s$ กับ $t$", feedback: "$s$ แปรตาม $t^2$ กราฟ $s$ กับ $t$ จึงเป็นเส้นโค้งพาราโบลา" }
      - { id: c, text: "$s$ กับ $\\tfrac1t$", feedback: "ใช้ $\\tfrac1x$ เมื่อปริมาณแปรผกผัน เช่น ความดันกับปริมาตร ที่นี่ $s$ เพิ่มเมื่อ $t$ เพิ่ม" }
      - { id: d, text: "$s^2$ กับ $t$", feedback: "ถ้ายกกำลังสอง $s$ จะได้ $s^2 \\propto t^4$ ยิ่งโค้งกว่าเดิม" }
    hints:
      - "เทียบ $s = \\tfrac12 a t^2$ กับ $y = mx$"
      - "ปริมาณใดทำหน้าที่เป็น $x$"
    solution: "$s = \\left(\\tfrac12 a\\right) t^2$ มีรูปเหมือน $y = mx$ เมื่อ $y = s$ และ $x = t^2$ กราฟ $s$ กับ $t^2$ จึงเป็นเส้นตรงผ่านจุดกำเนิด ความชันเท่ากับ $\\tfrac12 a$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p013
    topics: [physics.units.experiments-graphs]
    difficulty: 4
    type: expression
    stem: "คาบของลูกตุ้มอย่างง่ายคือ $T = 2\\pi\\sqrt{\\tfrac{L}{g}}$ ถ้าเขียนกราฟ $T^2$ บนแกนตั้งกับ $L$ บนแกนนอน ความชันของกราฟเท่ากับเท่าใด (ตอบในรูปของ $g$)"
    prefix: "ความชัน ="
    answer: { latex: "\\frac{4\\pi^2}{g}", variables: [g] }
    misconceptions:
      - { match: "\\frac{2\\pi}{\\sqrt{g}}", feedback: "นั่นคือความชันของกราฟ $T$ กับ $\\sqrt{L}$ ถ้าใช้ $T^2$ ต้องยกกำลังสองทั้ง $2\\pi$ และ $\\sqrt{g}$" }
      - { match: "\\frac{2\\pi^2}{g}", feedback: "ยกกำลังสองของ $2\\pi$ คือ $4\\pi^2$ ไม่ใช่ $2\\pi^2$" }
    hints:
      - "ยกกำลังสองทั้งสองข้างของสมการ"
      - "จัดให้อยู่ในรูป $T^2 = (\\text{ค่าคงที่}) \\times L$"
    solution: "$T^2 = 4\\pi^2 \\dfrac{L}{g} = \\left(\\dfrac{4\\pi^2}{g}\\right) L$ ความชันของกราฟ $T^2$ กับ $L$ คือ $\\dfrac{4\\pi^2}{g}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p014
    topics: [physics.units.experiments-graphs]
    difficulty: 5
    type: numeric
    stem: "นักเรียนเขียนกราฟ $T^2$ (s²) กับความยาวเชือก $L$ (m) ของลูกตุ้ม ได้เส้นตรงผ่านจุดกำเนิดที่มีความชัน $4.00\\ \\mathrm{s^2/m}$ ความเร่งโน้มถ่วง $g$ จากการทดลองนี้เป็นเท่าใด (ตอบในหน่วย m/s² ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 9.87, tolerance: 0.05, unit: m/s² }
    hints:
      - "ความชัน $= \\dfrac{4\\pi^2}{g}$"
      - "จัดรูปให้ $g = \\dfrac{4\\pi^2}{\\text{ความชัน}}$"
    misconceptions:
      - { match: 0.10, feedback: "ดูเหมือนนำความชันหาร $4\\pi^2$ ต้องเป็น $4\\pi^2$ หารด้วยความชัน (ค่า $g$ บนโลกประมาณ 9.8 m/s²)" }
      - { match: 2.47, feedback: "ดูเหมือนใช้ $\\pi^2$ แทน $4\\pi^2$ ยกกำลังสองของ $2\\pi$ คือ $4\\pi^2$" }
    solution: "$g = \\dfrac{4\\pi^2}{4.00} = \\pi^2 \\approx 9.87\\ \\mathrm{m/s^2}$ ใกล้ค่ามาตรฐาน $9.8\\ \\mathrm{m/s^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p015
    topics: [physics.units.experiments-graphs]
    difficulty: 5
    type: numeric
    stem: "นักเรียนจับเวลาลูกตุ้มแกว่งครบ 20 รอบรวดเดียวได้ $(36.0 \\pm 0.2)\\ \\mathrm{s}$ ความไม่แน่นอนของคาบ 1 รอบเป็นกี่วินาที (ตอบในหน่วย s)"
    answer: { value: 0.01, tolerance: 0.001, unit: s }
    hints:
      - "คาบ 1 รอบ = เวลารวม ÷ 20"
      - "ความไม่แน่นอนของเวลารวมก็ถูกแบ่งด้วย 20 เช่นกัน"
    misconceptions:
      - { match: 0.2, feedback: "0.2 s คือความไม่แน่นอนของเวลา 20 รอบ เมื่อหารด้วย 20 เพื่อหาคาบ ความไม่แน่นอนก็ต้องหารด้วย 20" }
      - { match: 1.8, feedback: "1.8 s คือคาบ 1 รอบ แต่โจทย์ถามความไม่แน่นอนของคาบ" }
    solution: "คาบ $= \\dfrac{36.0}{20} = 1.80\\ \\mathrm{s}$ ความไม่แน่นอน $= \\dfrac{0.2}{20} = 0.01\\ \\mathrm{s}$ รายงานว่า $(1.80 \\pm 0.01)\\ \\mathrm{s}$ การจับเวลาหลายรอบจึงลดความคลาดเคลื่อนจากการกดนาฬิกา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p016
    topics: [physics.units.experiments-graphs]
    difficulty: 5
    type: mcq
    stem: "นักเรียนทดลองดึงสปริงด้วยแรง 0 ถึง 5 N ได้กราฟเส้นตรงที่มีความชัน 2 cm/N จากนั้นทำนายว่าแรงดึง 50 N จะทำให้สปริงยืด 100 cm ข้อสรุปนี้เป็นอย่างไร"
    choices:
      - { id: a, text: "ไม่น่าเชื่อถือ เพราะต่อเส้นออกไปไกลจากช่วงที่ทดลอง สปริงอาจยืดเกินขีดจำกัดแล้วไม่เป็นเส้นตรง", correct: true }
      - { id: b, text: "เชื่อถือได้ เพราะกราฟเป็นเส้นตรง จึงเป็นเส้นตรงตลอดไป", feedback: "เราตรวจสอบได้เฉพาะช่วง 0–5 N ที่ทดลอง วัสดุจริงมีขีดจำกัด สปริงที่ถูกดึงแรงเกินไปจะยืดจนไม่คืนรูป" }
      - { id: c, text: "ผิด เพราะคำนวณผิด ต้องยืด 25 cm", feedback: "ถ้าความสัมพันธ์ยังเป็นเส้นตรงจริง $2 \\times 50 = 100$ cm คำนวณถูก ปัญหาอยู่ที่การใช้ความสัมพันธ์นอกช่วงที่มีข้อมูล" }
    hints:
      - "ข้อมูลที่มีอยู่ครอบคลุมแรงช่วงใด"
      - "สปริงจริงยืดได้ไม่จำกัดหรือไม่"
    solution: "การต่อเส้นออกไปนอกช่วงข้อมูล (50 N ไกลจาก 5 N สิบเท่า) เสี่ยงมาก สปริงอาจเลยขีดจำกัดสภาพยืดหยุ่น ความสัมพันธ์จะไม่เป็นเส้นตรง ควรทดลองในช่วงนั้นจริงก่อนสรุป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p017
    topics: [physics.units.experiments-graphs]
    difficulty: 3
    type: numeric
    stem: "ตารางค่าโดยสารแท็กซี่ (สมมติ) ในกรุงเทพฯ เป็นเส้นตรงตามระยะทาง นั่ง 2 km จ่าย 45 บาท นั่ง 6 km จ่าย 71 บาท ความชันของกราฟค่าโดยสารกับระยะทางเป็นกี่บาทต่อกิโลเมตร (ตอบในหน่วย บาท/km)"
    answer: { value: 6.5, tolerance: 0.05, unit: บาท/km }
    hints:
      - "ความชัน = ค่าโดยสารที่เปลี่ยน ÷ ระยะทางที่เปลี่ยน"
      - "(71 − 45) ÷ (6 − 2)"
    misconceptions:
      - { match: 11.83, feedback: "ดูเหมือนนำ 71 หาร 6 จากจุดเดียว ค่าโดยสารมีค่าเริ่มต้น เส้นจึงไม่ผ่านจุดกำเนิด ต้องใช้ผลต่าง" }
      - { match: 0.15, feedback: "ดูเหมือนนำระยะทางหารค่าโดยสาร (Δx/Δy) ต้องเป็นค่าโดยสารหารระยะทาง" }
    solution: "ความชัน $= \\dfrac{71 - 45}{6 - 2} = \\dfrac{26}{4} = 6.5$ บาท/km จุดตัดแกนคือ $45 - 2(6.5) = 32$ บาท ซึ่งเป็นค่าเริ่มต้นตามสมการเส้นตรงนี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.units.experiments-graphs.p018
    topics: [physics.units.experiments-graphs]
    difficulty: 2
    type: mcq
    stem: "กาลิเลโอสำคัญต่อวิธีหาความรู้ทางฟิสิกส์อย่างไร"
    choices:
      - { id: a, text: "ทดลองและวัดผลจริงเพื่อตรวจสอบแนวคิด แทนการเชื่อตามคำสอนเดิม", correct: true }
      - { id: b, text: "พิสูจน์ว่าของหนักตกเร็วกว่าของเบาเสมอ", feedback: "แนวคิดว่าของหนักตกเร็วกว่าเป็นแนวคิดเดิมที่กาลิเลโอทดลองแล้วพบว่าไม่จริงเมื่อไม่คิดแรงต้านอากาศ" }
      - { id: c, text: "เป็นคนแรกที่สร้างเครื่องกำเนิดไฟฟ้า", feedback: "เครื่องกำเนิดไฟฟ้ามาจากการค้นพบของฟาราเดย์ในอีกกว่า 200 ปีต่อมา" }
    hints:
      - "กาลิเลโอปล่อยลูกบอลกลิ้งลงพื้นเอียงแล้วจับเวลา"
      - "คิดถึงวิธีการ ไม่ใช่สิ่งประดิษฐ์"
    solution: "กาลิเลโอใช้การทดลองและการวัดตรวจสอบแนวคิด เช่น ปล่อยลูกบอลลงพื้นเอียงแล้วจับเวลา แทนการเชื่อแนวคิดเดิมที่ว่าของหนักตกเร็วกว่า วิธีนี้เป็นหัวใจของฟิสิกส์จนถึงปัจจุบัน"
