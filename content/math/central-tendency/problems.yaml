  - id: math.ctr.p020
    topics: [math.stats.central-tendency]
    difficulty: 4
    type: numeric
    stem: "ห้อง ก มีนักเรียน 25 คน คะแนนเฉลี่ย 70 ห้อง ข มีนักเรียน 35 คน คะแนนเฉลี่ย 64 คะแนนเฉลี่ยของนักเรียนทั้งสองห้องรวมกันเป็นเท่าใด"
    answer: { value: 66.5, tolerance: 0.05, unit: คะแนน }
    hints:
      - "ค่าเฉลี่ยรวมต้องใช้ผลรวมคะแนนทั้งหมดหารด้วยจำนวนนักเรียนทั้งหมด"
      - "ผลรวมของแต่ละห้อง = จำนวนนักเรียน × ค่าเฉลี่ย"
    misconceptions:
      - { match: 67, feedback: "นำค่าเฉลี่ยสองห้องมาเฉลี่ยกันตรง ๆ ใช้ได้เมื่อสองห้องมีนักเรียนเท่ากันเท่านั้น ห้อง ข มีคนมากกว่า จึงมีน้ำหนักมากกว่า" }
    solution: "ผลรวมห้อง ก $= 25 \\times 70 = 1750$ ห้อง ข $= 35 \\times 64 = 2240$ รวม $3990$ จากนักเรียน $60$ คน ค่าเฉลี่ยรวม $= 3990 \\div 60 = 66.5$ คะแนน ซึ่งใกล้ 64 มากกว่า เพราะห้อง ข มีคนมากกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ctr.p021
    topics: [math.stats.central-tendency]
    difficulty: 5
    type: numeric
    stem: "ข้อมูล 6 ตัวเป็นจำนวนเต็มบวก มีค่าเฉลี่ย 10 มัธยฐาน 9 และมีฐานนิยมเพียงค่าเดียวคือ 8 ข้อมูลตัวที่มากที่สุดมีค่าได้มากที่สุดเท่าใด"
    answer: { value: 22 }
    hints:
      - "ผลรวมของข้อมูลคือ $6 \\times 10 = 60$ ถ้าอยากให้ตัวมากที่สุดใหญ่ที่สุด ตัวอื่นต้องเล็กที่สุดเท่าที่ทำได้"
      - "มัธยฐาน 9 คือค่าเฉลี่ยของตัวที่ 3 และ 4 และ 8 ต้องปรากฏบ่อยกว่าค่าอื่น จึงต้องเป็นตัวที่ 3 ซึ่งทำให้ตัวที่ 4 เป็น 10"
      - "ตัวที่ 5 เป็น 10 ไม่ได้ เพราะ 10 จะปรากฏสองครั้งเท่ากับ 8"
    misconceptions:
      - { match: 23, feedback: "ถ้าใช้ 1, 8, 8, 10, 10, 23 ค่า 10 จะปรากฏสองครั้งเท่ากับ 8 ทำให้มีฐานนิยมสองค่า ตัวที่ห้าจึงต้องเป็นอย่างน้อย 11" }
    solution: "เรียง $a_1 \\le \\dots \\le a_6$ ผลรวม 60 มัธยฐาน $\\tfrac{a_3 + a_4}{2} = 9$ และ 8 ต้องปรากฏอย่างน้อยสองครั้งโดยอยู่ในครึ่งล่าง จึงได้ $a_3 = 8$, $a_4 = 10$ ให้ $a_2 = 8$ และ $a_1 = 1$ (เล็กที่สุด) ส่วน $a_5$ ต้องมากกว่า 10 เพื่อไม่ให้ 10 ซ้ำ จึงเป็น 11 ได้ $a_6 = 60 - (1 + 8 + 8 + 10 + 11) = 22$ ข้อมูลคือ 1, 8, 8, 10, 11, 22 ตรวจ: ค่าเฉลี่ย 10 มัธยฐาน 9 ฐานนิยม 8 ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ctr.p022
    topics: [math.stats.central-tendency]
    difficulty: 3
    type: expression
    stem: "ข้อมูล 5 ตัวคือ $x$, $x + 2$, $x + 4$, $x + 9$ และ $x + 10$ เขียนค่าเฉลี่ยของข้อมูลชุดนี้ในรูปนิพจน์ของ $x$"
    prefix: "ค่าเฉลี่ย ="
    answer: { latex: "x + 5", variables: [x] }
    hints:
      - "รวมข้อมูลทั้งห้าตัว: รวมพจน์ $x$ และรวมค่าคงตัวแยกกัน"
      - "หารผลรวมด้วย 5 ทุกพจน์"
    misconceptions:
      - { match: "5x + 25", feedback: "นั่นคือผลรวม ยังต้องหารด้วยจำนวนข้อมูล 5" }
      - { match: "x + 4", feedback: "นั่นคือมัธยฐาน (ตัวตรงกลาง) ไม่ใช่ค่าเฉลี่ย" }
    solution: "ผลรวม $= 5x + (0 + 2 + 4 + 9 + 10) = 5x + 25$ ค่าเฉลี่ย $= \\dfrac{5x + 25}{5} = x + 5$ สังเกตว่าค่าเฉลี่ยมากกว่ามัธยฐาน $x + 4$ เพราะข้อมูลทางขวาอยู่ห่างกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true
