<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif">
  <title>แถบแสดงช่วงของบรรทัดที่ยังสงสัยลดลงครึ่งหนึ่งทุกขั้น จาก 64 เหลือ 32 16 8 4 2 และ 1 บรรทัด</title>
  <rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
  <rect x="40" y="40" width="380" height="22" rx="3" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="40" y="40" width="380.0" height="22" rx="3" fill="#fde68a" stroke="#b45309"/>
  <text x="432" y="56" font-size="13" fill="#374151">เริ่มต้น: เหลือ 64 บรรทัด</text>
  <rect x="40" y="80" width="380" height="22" rx="3" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="40" y="80" width="190.0" height="22" rx="3" fill="#fde68a" stroke="#b45309"/>
  <text x="432" y="96" font-size="13" fill="#374151">ตรวจครั้งที่ 1: เหลือ 32 บรรทัด</text>
  <rect x="40" y="120" width="380" height="22" rx="3" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="40" y="120" width="95.0" height="22" rx="3" fill="#fde68a" stroke="#b45309"/>
  <text x="432" y="136" font-size="13" fill="#374151">ตรวจครั้งที่ 2: เหลือ 16 บรรทัด</text>
  <rect x="40" y="160" width="380" height="22" rx="3" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="40" y="160" width="47.5" height="22" rx="3" fill="#fde68a" stroke="#b45309"/>
  <text x="432" y="176" font-size="13" fill="#374151">ตรวจครั้งที่ 3: เหลือ 8 บรรทัด</text>
  <rect x="40" y="200" width="380" height="22" rx="3" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="40" y="200" width="23.7" height="22" rx="3" fill="#fde68a" stroke="#b45309"/>
  <text x="432" y="216" font-size="13" fill="#374151">ตรวจครั้งที่ 4: เหลือ 4 บรรทัด</text>
  <rect x="40" y="240" width="380" height="22" rx="3" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="40" y="240" width="11.9" height="22" rx="3" fill="#fde68a" stroke="#b45309"/>
  <text x="432" y="256" font-size="13" fill="#374151">ตรวจครั้งที่ 5: เหลือ 2 บรรทัด</text>
  <rect x="40" y="280" width="380" height="22" rx="3" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="40" y="280" width="6.0" height="22" rx="3" fill="#fca5a5" stroke="#b45309"/>
  <text x="432" y="296" font-size="13" fill="#374151">ตรวจครั้งที่ 6: เหลือ 1 บรรทัด</text>
  <text x="40" y="324" font-size="13" fill="#6b7280">แต่ละขั้นตรวจค่าที่จุดกึ่งกลางของช่วงเดิมหนึ่งครั้ง แล้วเก็บเฉพาะครึ่งที่ผิด</text>
</svg>
