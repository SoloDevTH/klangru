- id: thai.grammar.loanwords.p011
  topics:
  - thai.grammar.loanwords
  difficulty: 4
  type: mcq
  stem: หลักเกณฑ์การทับศัพท์บอกว่าไม่ใส่วรรณยุกต์ แต่ coma เขียนว่า **โคม่า** เพราะเหตุใด
  choices:
  - id: a
    text: ถ้าเขียน โคมา จะอ่านซ้ำกับคำไทยว่า วัวมา จึงใส่วรรณยุกต์ให้ต่างกัน
    correct: true
    feedback: ถูก ยกเว้นเมื่อเสียงซ้ำกับคำไทยจนสับสน
  - id: b
    text: คำทับศัพท์ทุกคำต้องใส่วรรณยุกต์
    feedback: ผิด หลักทั่วไปคือไม่ใส่
  - id: c
    text: เพราะภาษาอังกฤษมีวรรณยุกต์
    feedback: ภาษาอังกฤษไม่มีวรรณยุกต์แบบภาษาไทย
  - id: d
    text: เพราะเป็นศัพท์บัญญัติ
    feedback: โคม่าเป็นคำทับศัพท์
  hints:
  - ลองอ่าน โคมา
  - หลักเกณฑ์มีข้อยกเว้นเรื่องเสียงซ้ำคำไทย
  solution: ใส่วรรณยุกต์ได้ **เมื่อเสียงซ้ำกับคำไทยจนสับสน** โคมา (วัวมา) จึงเขียน **โคม่า**
