<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif" font-size="14">
<title>แผนภาพการไหลของพลังงานในเครื่องยนต์ความร้อนและตู้เย็น</title>
<rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
<rect x="70.0" y="40.0" width="180.0" height="52.0" rx="8" fill="#f8d3cc" stroke="#15211e" stroke-width="2"/>
<text x="160.0" y="66.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">แหล่งร้อน</text>
<text x="160.0" y="84.0" text-anchor="middle" fill="#15211e" font-size="12">อุณหภูมิ Tʜ</text>
<rect x="70.0" y="240.0" width="180.0" height="52.0" rx="8" fill="#cfe0f3" stroke="#15211e" stroke-width="2"/>
<text x="160.0" y="266.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">แหล่งเย็น</text>
<text x="160.0" y="284.0" text-anchor="middle" fill="#15211e" font-size="12">อุณหภูมิ Tᴄ</text>
<circle cx="160.0" cy="166.0" r="32.0" fill="#eeeeee" stroke="#15211e" stroke-width="2"/>
<text x="160.0" y="171.0" text-anchor="middle" fill="#15211e" font-size="13" font-weight="bold">เครื่อง</text>
<path d="M 142 92 L 178 92 L 170 134 L 150 134 Z" fill="#c0392b"/>
<text x="134.0" y="118.0" text-anchor="end" fill="#c0392b" font-size="15" font-weight="bold">Qʜ</text>
<path d="M 152 198 L 168 198 L 172 240 L 148 240 Z" fill="#1f5fa8"/>
<text x="136.0" y="226.0" text-anchor="end" fill="#1f5fa8" font-size="15" font-weight="bold">Qᴄ</text>
<line x1="192.0" y1="166.0" x2="264.7" y2="166.0" stroke="#1e7a3c" stroke-width="8"/>
<polygon points="280.0,166.0 262.0,157.9 262.0,174.1" fill="#1e7a3c" stroke="#1e7a3c" stroke-width="1" stroke-linejoin="round"/>
<text x="240.0" y="152.0" text-anchor="middle" fill="#1e7a3c" font-size="16" font-weight="bold">W</text>
<text x="160.0" y="320.0" text-anchor="middle" fill="#15211e" font-size="14">e = W/Qʜ = 1 − Qᴄ/Qʜ</text>
<text x="160.0" y="24.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">เครื่องยนต์ความร้อน</text>
<rect x="390.0" y="40.0" width="180.0" height="52.0" rx="8" fill="#f8d3cc" stroke="#15211e" stroke-width="2"/>
<text x="480.0" y="66.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">แหล่งร้อน</text>
<text x="480.0" y="84.0" text-anchor="middle" fill="#15211e" font-size="12">อุณหภูมิ Tʜ</text>
<rect x="390.0" y="240.0" width="180.0" height="52.0" rx="8" fill="#cfe0f3" stroke="#15211e" stroke-width="2"/>
<text x="480.0" y="266.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">แหล่งเย็น</text>
<text x="480.0" y="284.0" text-anchor="middle" fill="#15211e" font-size="12">อุณหภูมิ Tᴄ</text>
<circle cx="480.0" cy="166.0" r="32.0" fill="#eeeeee" stroke="#15211e" stroke-width="2"/>
<text x="480.0" y="171.0" text-anchor="middle" fill="#15211e" font-size="13" font-weight="bold">ปั๊ม</text>
<path d="M 472 240 L 488 240 L 492 198 L 468 198 Z" fill="#1f5fa8"/>
<text x="456.0" y="226.0" text-anchor="end" fill="#1f5fa8" font-size="15" font-weight="bold">Qᴄ</text>
<path d="M 470 134 L 490 134 L 498 92 L 462 92 Z" fill="#c0392b"/>
<text x="454.0" y="118.0" text-anchor="end" fill="#c0392b" font-size="14" font-weight="bold">Qʜ = Qᴄ + W</text>
<line x1="600.0" y1="166.0" x2="529.3" y2="166.0" stroke="#1e7a3c" stroke-width="8"/>
<polygon points="514.0,166.0 532.0,174.1 532.0,157.9" fill="#1e7a3c" stroke="#1e7a3c" stroke-width="1" stroke-linejoin="round"/>
<text x="560.0" y="152.0" text-anchor="middle" fill="#1e7a3c" font-size="16" font-weight="bold">W</text>
<text x="480.0" y="320.0" text-anchor="middle" fill="#15211e" font-size="14">K = Qᴄ/W</text>
<text x="480.0" y="24.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">ตู้เย็น / เครื่องปรับอากาศ</text>
<line x1="330.0" y1="20.0" x2="330.0" y2="320.0" stroke="#cccccc" stroke-width="1"/>
</svg>
