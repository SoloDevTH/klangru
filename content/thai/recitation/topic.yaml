id: thai.literature.recitation
subject: thai
title: { th: บทอาขยานและการท่องจำบทร้อยกรอง, en: "Memorizing and reciting Thai verse" }
summary: รู้จักบทอาขยาน วิธีท่องจำทีละวรรคด้วยสัมผัส ความหมายและคุณค่าของบทร้อยกรองจากกาพย์พระไชยสุริยาและนิราศภูเขาทอง และการนำไปใช้อ้างอิงอย่างถูกต้อง
difficulty: 2
minutes: 25
prerequisites: [thai.reading.read-aloud]
encompasses:
  - { id: thai.reading.read-aloud, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: memorize-steps.svg
    alt: "ด้านบนเป็นกลอนจากนิราศภูเขาทองของสุนทรภู่ 4 วรรค: ถึงบางพูดพูดดีเป็นศรีศักดิ์ มีคนรักรสถ้อยอร่อยจิต แม้นพูดชั่วตัวตายทำลายมิตร จะชอบผิดในมนุษย์เพราะพูดจา คำ ศักดิ์ และ รัก เป็นสีแดง คำ จิต มิตร ผิด เป็นสีเขียว หมายเหตุว่าสีเดียวกันคือคำที่สัมผัสกัน ด้านล่างเป็นขั้นตอนท่องจำ 6 ขั้น: 1 อ่านให้เข้าใจความหมาย 2 แบ่งท่องทีละวรรค 3 ใช้คำสัมผัสช่วยจำ 4 ปิดหนังสือแล้วท่อง 5 ท่องซ้ำหลายวัน 6 ท่องให้คนอื่นฟัง"
    caption: "ท่องทีละวรรค และใช้คำสัมผัสบอกใบ้วรรคถัดไป"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: ท่องบทใหม่ด้วยสัมผัส
    problem: "ท่องจำกลอน \"ถึงบางพูดพูดดีเป็นศรีศักดิ์ · มีคนรักรสถ้อยอร่อยจิต / แม้นพูดชั่วตัวตายทำลายมิตร · จะชอบผิดในมนุษย์เพราะพูดจา\""
    steps:
      - text: "อ่านความหมาย: พูดดีคนรัก พูดไม่ดีเสียเพื่อน คนดีหรือไม่ดีก็เพราะคำพูด"
      - text: "ท่องวรรคแรกจนคล่อง แล้วจำว่าคำท้ายคือ ศักดิ์"
      - text: "ต่อวรรคสอง: นึกว่าวรรคนี้มีคำสัมผัสกับ ศักดิ์ คือ รัก จึงเริ่ม มีคนรัก..."
        why: "คำสัมผัสเป็นตัวบอกใบ้ ทำให้นึกวรรคถัดไปออก"
      - text: "ต่อวรรคสามและสี่: จิต สัมผัสกับ มิตร และ มิตร สัมผัสกับ ผิด"
      - text: "ปิดหนังสือท่องทั้งบท แล้วท่องซ้ำวันละรอบอีกหลายวัน"
    answer: "ใช้สัมผัส ศักดิ์–รัก จิต–มิตร–ผิด ช่วยต่อวรรค และท่องซ้ำหลายวัน"
  - { type: check, problem: thai.literature.recitation.p005, prompt: "คำนี้ต้องสัมผัสกับ จิต" }
  - type: worked-example
    title: นำบทอาขยานไปอ้างอิง
    problem: "เขียนเรียงความเรื่อง มารยาทในการใช้โซเชียลมีเดีย อยากยกบทกลอนมาประกอบ"
    steps:
      - text: "เลือกบทที่ตรงเรื่อง: การพิมพ์ข้อความก็คือการพูดอย่างหนึ่ง จึงใช้บท ถึงบางพูด... ได้"
      - text: "ยกให้ถูกทุกคำ เปิดตรวจกับต้นฉบับก่อน"
      - text: "บอกที่มา: สุนทรภู่ นิราศภูเขาทอง"
        why: "การบอกที่มาให้เกียรติผู้แต่ง และให้ผู้อ่านตรวจสอบได้"
      - text: "อธิบายการเชื่อมโยง: ถ้อยคำในโลกออนไลน์ก็ทำให้คนรักหรือเสียเพื่อนได้เช่นกัน"
    answer: "ดังที่สุนทรภู่กล่าวไว้ในนิราศภูเขาทองว่า \"แม้นพูดชั่วตัวตายทำลายมิตร จะชอบผิดในมนุษย์เพราะพูดจา\" ข้อความที่เราพิมพ์ก็เช่นกัน จึงควรคิดก่อนโพสต์"
  - { type: check, problem: thai.literature.recitation.p013, prompt: "ตรงเรื่อง ถูกคำ บอกที่มา" }
glossary:
  - { term: อาขยาน, definition: "บทท่องจำ" }
  - { term: บทอาขยานตามที่กำหนด, definition: "บทร้อยกรองที่หลักสูตรหรือโรงเรียนกำหนดให้นักเรียนแต่ละชั้นท่องจำ" }
  - { term: คุณค่าด้านเนื้อหา, definition: "ข้อคิดหรือความรู้ที่บทร้อยกรองให้ และนำไปใช้ในชีวิตได้" }
  - { term: คุณค่าด้านภาษา, definition: "ความไพเราะของถ้อยคำ เช่น สัมผัส การเล่นคำ การเลือกคำ" }
  - { term: สาธารณสมบัติ, definition: "งานที่หมดอายุการคุ้มครองลิขสิทธิ์แล้ว ทุกคนนำมาใช้ได้ เช่น วรรณคดีโบราณ" }
flashcards:
  - { front: "อาขยาน แปลว่า", back: "บทท่องจำ" }
  - { front: "ท่องจำให้ได้นานทำอย่างไร", back: "เข้าใจความหมาย ท่องทีละวรรค ใช้สัมผัสช่วย และท่องซ้ำหลายวัน" }
  - { front: "ถึงบางพูดพูดดีเป็นศรีศักดิ์ มาจากเรื่องใด", back: "นิราศภูเขาทอง ของสุนทรภู่" }
  - { front: "อ้างอิงบทร้อยกรองให้ถูกต้อง", back: "ตรงเรื่อง ยกถูกทุกคำ และบอกชื่อเรื่องกับผู้แต่ง" }
