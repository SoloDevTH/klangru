    misconceptions:
      - { match: 243, feedback: "นั่นคือรหัสที่มีเลข 7 **พอดีหนึ่งหลัก** ($3 \\times 9 \\times 9$) ยังขาดรหัสที่มี 7 สองหลักหรือสามหลัก" }
      - { match: 300, feedback: "คิดว่าแต่ละหลักเป็น 7 ได้ 100 แบบแล้วคูณ 3 แต่รหัสที่มี 7 หลายหลักถูกนับซ้ำ" }
    solution: "รหัสทั้งหมด $10^3 = 1000$ แบบ รหัสที่ไม่มีเลข 7 เลยมี $9^3 = 729$ แบบ จึงมีรหัสที่มีเลข 7 อย่างน้อยหนึ่งหลัก $1000 - 729 = 271$ แบบ การนับส่วนเติมเต็มแบบนี้ง่ายกว่าแยกนับกรณีหนึ่ง สอง สามหลัก"
