      - { id: b, text: "เป็นสันคลื่นด้านบนเหมือนเดิม เคลื่อนกลับมาหาผู้สะบัด", feedback: "แบบนี้เกิดกับปลายอิสระ เช่น ปลายเชือกผูกกับห่วงที่เลื่อนบนเสาได้ แต่ปลายที่ผูกแน่นเป็นปลายตรึง คลื่นสะท้อนจะกลับหัว" }
      - { id: c, text: "ไม่สะท้อน เพราะพลังงานถูกเสาดูดกลืนไปหมด", feedback: "ปลายตรึงสะท้อนคลื่นได้ดี จะสังเกตเห็นคลื่นดลวิ่งกลับมาชัดเจน" }
      - { id: d, text: "สะท้อนกลับมาด้วยแอมพลิจูดมากขึ้น", feedback: "การสะท้อนไม่เพิ่มพลังงานให้คลื่น แอมพลิจูดจึงเท่าเดิมหรือลดลงเล็กน้อย ไม่มากขึ้น" }
    hints:
