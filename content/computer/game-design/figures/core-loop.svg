<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" font-family="sans-serif" font-size="14">
<title>วงจรแกนของการเล่นเกมมีสามขั้นวนซ้ำ ทำกิจกรรมเล็ก ๆ แล้วได้รางวัล แล้วเจอความท้าทายที่ยากขึ้นและวนกลับไปทำกิจกรรมใหม่</title>
<rect x="0" y="0" width="520" height="320" fill="#ffffff"/>
<defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<line x1="274.7" y1="75.5" x2="343.9" y2="195.3" stroke="#1f2937" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="270.6" y1="222.5" x2="251.4" y2="222.5" stroke="#1f2937" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="175.1" y1="197.0" x2="244.3" y2="77.2" stroke="#1f2937" stroke-width="2" marker-end="url(#ar2)"/>
<rect x="175.0" y="28.0" width="170" height="44" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
<text x="260.0" y="55.0" text-anchor="middle" fill="#1f2937">ทำกิจกรรมเล็ก ๆ</text>
<rect x="274.6" y="200.5" width="170" height="44" rx="10" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
<text x="359.6" y="227.5" text-anchor="middle" fill="#1f2937">ได้รางวัลหรือคะแนน</text>
<rect x="75.4" y="200.5" width="170" height="44" rx="10" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/>
<text x="160.4" y="227.5" text-anchor="middle" fill="#1f2937">เจอความท้าทายที่ยากขึ้น</text>
<text x="260" y="169" text-anchor="middle" fill="#6b7280" font-size="13">วงจรแกนของการเล่น</text>
<text x="260" y="310" text-anchor="middle" fill="#6b7280" font-size="12">ปรับความยากให้วงจรนี้สนุก ไม่ยากเกินไปและไม่ง่ายเกินไป</text>
</svg>