<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" width="820" height="390" font-family="'Sarabun','Noto Sans Thai','Noto Sans Thai UI','Leelawadee UI','Tahoma','Loma',sans-serif">
<title>ประกาศสมมติ ชมรมคอมพิวเตอร์ชวนเข้าค่าย</title>
<defs></defs>
<rect x="0" y="0" width="820" height="390" fill="#fff"/>
<rect x="10.0" y="10.0" width="800.0" height="370.0" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
<text x="410.0" y="56.0" font-size="26" text-anchor="middle" fill="#0d47a1" font-weight="bold">ชมรมคอมพิวเตอร์ชวนน้องเข้าค่าย</text>
<text x="410.0" y="84.0" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">(ประกาศสมมติ เขียนโดยนักเรียน)</text>
<text x="70.0" y="132.0" font-size="21" text-anchor="start" fill="#111" font-weight="normal">• เรียนใช้อินเตอร์เน็ตอย่างปลอดภัย</text>
<text x="70.0" y="172.0" font-size="21" text-anchor="start" fill="#111" font-weight="normal">• ฝึกถ่ายภาพดิจิตอลและทำอินโฟกราฟิก</text>
<text x="70.0" y="212.0" font-size="21" text-anchor="start" fill="#111" font-weight="normal">• แข่งเกมส์ตอบคำถามชิงรางวัล</text>
<text x="70.0" y="252.0" font-size="21" text-anchor="start" fill="#111" font-weight="normal">• พักกินเค้กและคุกกี้</text>
<text x="70.0" y="292.0" font-size="21" text-anchor="start" fill="#111" font-weight="normal">• รับสมัครทางเว็บไซต์ของชมรม</text>
<text x="70.0" y="332.0" font-size="21" text-anchor="start" fill="#111" font-weight="normal">• แจกไอศครีมทุกคนในวันสุดท้าย</text>
</svg>
