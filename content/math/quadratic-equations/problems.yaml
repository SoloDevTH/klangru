problems:
  - id: math.quad.p001
    topics: [math.algebra.quadratic-eq]
    difficulty: 1
    type: numeric
    stem: "สมการ $(x - 3)(x + 5) = 0$ มีคำตอบที่เป็นจำนวนบวกเท่าใด"
    answer: { value: 3 }
    hints:
      - "ผลคูณเป็นศูนย์ แปลว่าวงเล็บใดวงเล็บหนึ่งต้องเป็นศูนย์"
      - "ตั้ง $x - 3 = 0$ และ $x + 5 = 0$ แล้วแก้ทีละสมการ"
    misconceptions:
      - { match: 5, feedback: "จาก $x + 5 = 0$ ได้ $x = -5$ ไม่ใช่ 5 คำตอบมีเครื่องหมายตรงข้ามกับตัวเลขในวงเล็บ" }
    solution: "$x - 3 = 0$ ได้ $x = 3$ หรือ $x + 5 = 0$ ได้ $x = -5$ คำตอบที่เป็นบวกคือ $3$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.quad.p002
    topics: [math.algebra.quadratic-eq]
    difficulty: 1
    type: mcq
    stem: "สมการใดเป็นสมการกำลังสองตัวแปรเดียว"
    choices:
      - { id: a, text: "$2x^2 - 3x = 0$", correct: true }
      - { id: b, text: "$2x - 3 = 0$", feedback: "เลขชี้กำลังสูงสุดของ $x$ คือ 1 จึงเป็นสมการเชิงเส้น" }
      - { id: c, text: "$x^3 + x = 0$", feedback: "เลขชี้กำลังสูงสุดคือ 3 จึงเป็นสมการกำลังสาม" }
      - { id: d, text: "$x^2 + y = 4$", feedback: "มีสองตัวแปรคือ $x$ และ $y$ จึงไม่ใช่สมการตัวแปรเดียว" }
    hints:
      - "สมการกำลังสองตัวแปรเดียวมีรูป $ax^2 + bx + c = 0$ โดย $a \\neq 0$"
      - "ดูเลขชี้กำลังสูงสุดของตัวแปร และนับจำนวนตัวแปร"
    solution: "$2x^2 - 3x = 0$ มีตัวแปรเดียว และเลขชี้กำลังสูงสุดคือ 2 (ในรูป $ax^2 + bx + c = 0$ คือ $a = 2$, $b = -3$, $c = 0$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.quad.p003
    topics: [math.algebra.quadratic-eq]
    difficulty: 2
    type: numeric
    stem: "แก้สมการ $x^2 - 5x + 6 = 0$ แล้วตอบคำตอบที่มากกว่า"
    answer: { value: 3 }
    hints:
      - "หาจำนวนสองจำนวนที่คูณกันได้ 6 และบวกกันได้ $-5$"
      - "แยกตัวประกอบแล้วให้แต่ละวงเล็บเท่ากับศูนย์"
    misconceptions:
      - { match: -2, feedback: "ดูเหมือนแยกเป็น $(x + 2)(x + 3)$ ซึ่งกระจายได้ $x^2 + 5x + 6$ พจน์กลางต้องเป็น $-5x$" }
    solution: "$x^2 - 5x + 6 = (x - 2)(x - 3) = 0$ ได้ $x = 2$ หรือ $x = 3$ คำตอบที่มากกว่าคือ $3$ ตรวจ: $9 - 15 + 6 = 0$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.quad.p004
    topics: [math.algebra.quadratic-eq]
    difficulty: 2
    type: mcq
    stem: "เซตคำตอบของสมการ $x^2 = 2x$ คือข้อใด"
    choices:
      - { id: a, text: "$\\{0, 2\\}$", correct: true }
      - { id: b, text: "$\\{2\\}$", feedback: "ดูเหมือนหารทั้งสองข้างด้วย $x$ ซึ่งทำให้คำตอบ $x = 0$ หายไป ให้ย้ายข้างแล้วดึงตัวร่วม $x$ ออกแทน" }
      - { id: c, text: "$\\{0, -2\\}$", feedback: "จาก $x - 2 = 0$ ได้ $x = 2$ ไม่ใช่ $-2$ ลองแทน $x = -2$ ดู: $4 \\neq -4$" }
      - { id: d, text: "$\\{\\sqrt{2}\\}$", feedback: "สมการไม่ใช่ $x^2 = 2$ ข้างขวาคือ $2x$ ให้ย้ายข้างเป็น $x^2 - 2x = 0$" }
    hints:
      - "ย้าย $2x$ มาข้างซ้ายให้ข้างขวาเป็นศูนย์"
      - "ดึงตัวร่วม $x$ ออก แล้วใช้หลักผลคูณเป็นศูนย์"
    solution: "$x^2 - 2x = 0$ → $x(x - 2) = 0$ → $x = 0$ หรือ $x = 2$ ตรวจ: $0 = 0$ ✓ และ $4 = 4$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.quad.p005
    topics: [math.algebra.quadratic-eq]
    difficulty: 3
    type: numeric
    stem: "หาค่าดิสคริมิแนนต์ $b^2 - 4ac$ ของสมการ $2x^2 - 3x - 5 = 0$"
    answer: { value: 49 }
    hints:
      - "ระบุ $a$, $b$, $c$ พร้อมเครื่องหมาย: $a = 2$, $b = -3$, $c = -5$"
      - "$(-3)^2$ เป็นบวก และ $-4(2)(-5)$ ลบคูณลบได้บวก"
    misconceptions:
      - { match: -31, feedback: "ลืมเครื่องหมายลบของ $c$ $-4ac = -4(2)(-5) = +40$ ไม่ใช่ $-40$" }
      - { match: 31, feedback: "$(-3)^2 = 9$ ไม่ใช่ $-9$ จำนวนลบยกกำลังสองได้บวกเสมอ" }
    solution: "$b^2 - 4ac = (-3)^2 - 4(2)(-5) = 9 + 40 = 49$ เป็นบวก สมการจึงมีสองคำตอบ ($x = 2.5$ และ $x = -1$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.quad.p006
    topics: [math.algebra.quadratic-eq]
    difficulty: 3
    type: numeric
    stem: "ใช้สูตรแก้สมการ $x^2 - 4x - 1 = 0$ แล้วตอบคำตอบที่เป็นบวก ปัดเป็นทศนิยม 2 ตำแหน่ง"
    answer: { value: 4.236, tolerance: 0.04 }
    hints:
      - "ระบุ $a = 1$, $b = -4$, $c = -1$"
      - "คำนวณ $b^2 - 4ac$ ก่อน แล้วถอดรากที่สอง"
      - "แทนในสูตร $x = \\dfrac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$ โดยใช้เครื่องหมาย $+$ จะได้คำตอบบวก"
    misconceptions:
      - { match: 0.236, feedback: "ดูเหมือนใช้ $b$ แทน $-b$ ในสูตร $b = -4$ จึงได้ $-b = 4$" }
      - { match: 3.732, feedback: "ตรวจ $b^2 - 4ac$ อีกครั้ง $-4(1)(-1) = +4$ จึงได้ $16 + 4 = 20$ ไม่ใช่ $16 - 4$" }
    solution: "$b^2 - 4ac = 16 + 4 = 20$ จึงได้ $x = \\dfrac{4 \\pm \\sqrt{20}}{2} = 2 \\pm \\sqrt{5}$ คำตอบบวกคือ $2 + \\sqrt{5} \\approx 4.24$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.quad.p007
    topics: [math.algebra.quadratic-eq]
    difficulty: 3
    type: match
    stem: "จับคู่สมการกับจำนวนคำตอบที่เป็นจำนวนจริง"
    pairs:
      - { left: "$x^2 - 6x + 9 = 0$", right: "มีคำตอบเดียว (คำตอบซ้ำ)" }
      - { left: "$x^2 + x + 1 = 0$", right: "ไม่มีคำตอบที่เป็นจำนวนจริง" }
      - { left: "$x^2 - 5x + 4 = 0$", right: "มีสองคำตอบ" }
    hints:
      - "คำนวณ $b^2 - 4ac$ ของแต่ละสมการ"
      - "บวกมีสองคำตอบ ศูนย์มีคำตอบเดียว ลบไม่มีคำตอบจริง"
    solution: "$x^2 - 6x + 9$: $D = 36 - 36 = 0$ คำตอบเดียว ($x = 3$) · $x^2 + x + 1$: $D = 1 - 4 = -3$ ไม่มีคำตอบจริง · $x^2 - 5x + 4$: $D = 25 - 16 = 9$ สองคำตอบ ($x = 1, 4$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.quad.p008
    topics: [math.algebra.quadratic-eq]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการแก้สมการ $2x^2 + 3x - 2 = 0$ ด้วยสูตรให้ถูกต้อง"
    items:
      - "ระบุ $a = 2$, $b = 3$, $c = -2$"
      - "คำนวณ $b^2 - 4ac = 9 + 16 = 25$"
      - "ถอดราก: $\\sqrt{25} = 5$"
      - "แทนในสูตร: $x = \\dfrac{-3 \\pm 5}{4}$"
      - "ได้ $x = \\dfrac{1}{2}$ หรือ $x = -2$"
    hints:
      - "ต้องรู้ค่า $a$, $b$, $c$ ก่อนจะคำนวณอะไรได้"
      - "ค่าใต้รากต้องคำนวณก่อนถอดราก และต้องถอดรากก่อนแทนในสูตร"
    solution: "ระบุ $a, b, c$ → $D = 25$ → $\\sqrt{D} = 5$ → $x = \\dfrac{-3 \\pm 5}{4}$ → $x = \\tfrac12$ หรือ $x = -2$ ตรวจ $x = \\tfrac12$: $2(\\tfrac14) + \\tfrac32 - 2 = 0$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.quad.p009
    topics: [math.algebra.quadratic-eq]
    difficulty: 4
    type: numeric
    stem: "ครอบครัวหนึ่งในจังหวัดเชียงใหม่ทำสวนผักรูปสี่เหลี่ยมผืนผ้า ด้านยาวยาวกว่าด้านกว้าง 3 เมตร และมีพื้นที่ 40 ตารางเมตร ด้านกว้างยาวกี่เมตร (ตอบเป็นตัวเลขในหน่วยเมตร)"
    answer: { value: 5, unit: m }
    hints:
      - "ให้ด้านกว้างเป็น $x$ เมตร ด้านยาวจึงเป็น $x + 3$ เมตร"
      - "ตั้งสมการ $x(x + 3) = 40$ แล้วจัดให้ข้างหนึ่งเป็นศูนย์"
      - "แยกตัวประกอบ $x^2 + 3x - 40$ แล้วเลือกคำตอบที่ความยาวเป็นไปได้"
    misconceptions:
      - { match: 8, feedback: "8 เมตรคือด้านยาว หรือเครื่องหมายในการแยกตัวประกอบสลับ ลองตรวจ: ถ้ากว้าง 8 ยาวต้องเป็น 11 พื้นที่ 88 ไม่ใช่ 40" }
      - { match: 13.333, feedback: "นั่นคือ $40 \\div 3$ ความยาวที่มากกว่า 3 เมตรไม่ได้แปลว่าหาร 3 ให้ตั้งสมการจากพื้นที่ = กว้าง × ยาว" }
    solution: "$x(x + 3) = 40$ → $x^2 + 3x - 40 = 0$ → $(x + 8)(x - 5) = 0$ → $x = 5$ หรือ $x = -8$ ความกว้างติดลบไม่ได้ จึงกว้าง 5 เมตร (ยาว 8 เมตร พื้นที่ $40\\ \\mathrm{m^2}$ ✓)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.quad.p010
    topics: [math.algebra.quadratic-eq]
    difficulty: 4
    type: numeric
    stem: "เตะลูกตะกร้อขึ้นไปตรง ๆ ความสูงของลูกตะกร้อจากจุดที่เตะคือ $h = 20t - 5t^2$ เมตร เมื่อ $t$ เป็นเวลาเป็นวินาที ลูกตะกร้อขึ้นไปถึงความสูง 15 เมตรครั้งแรกเมื่อเวลาผ่านไปกี่วินาที (ตอบเป็นตัวเลขในหน่วยวินาที)"
    answer: { value: 1, unit: s }
    hints:
      - "ตั้งสมการ $20t - 5t^2 = 15$ แล้วย้ายข้างให้ข้างหนึ่งเป็นศูนย์"
      - "หารทั้งสมการด้วย 5 จะได้ตัวเลขง่ายขึ้น: $t^2 - 4t + 3 = 0$"
      - "จะได้สองคำตอบ ครั้งแรกคือเวลาที่น้อยกว่า"
    misconceptions:
      - { match: 3, feedback: "$t = 3$ คือตอนที่ลูกตะกร้อตกลงมาผ่านความสูง 15 เมตร ครั้งแรกคือตอนขาขึ้น ซึ่งเป็นคำตอบที่น้อยกว่า" }
    solution: "$20t - 5t^2 = 15$ → $5t^2 - 20t + 15 = 0$ → $t^2 - 4t + 3 = 0$ → $(t - 1)(t - 3) = 0$ ได้ $t = 1$ หรือ $t = 3$ ครั้งแรกคือ $t = 1$ วินาที ตรวจ: $20 - 5 = 15$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.quad.p011
    topics: [math.algebra.quadratic-eq]
    difficulty: 4
    type: numeric
    stem: "น้องต้นเปิดหนังสือการ์ตูนค้างไว้ เลขหน้าซ้ายและหน้าขวาเป็นจำนวนเรียงติดกัน และคูณกันได้ 156 เลขหน้าขวา (หน้าที่มากกว่า) คือเท่าใด"
    answer: { value: 13 }
    hints:
      - "ให้หน้าซ้ายเป็น $n$ หน้าขวาจึงเป็น $n + 1$"
      - "ตั้งสมการ $n(n + 1) = 156$ แล้วจัดเป็น $n^2 + n - 156 = 0$"
      - "หาคู่ที่คูณได้ $-156$ และบวกได้ 1 แล้วเลือกคำตอบที่เป็นเลขหน้าได้ แล้วอย่าลืมว่าโจทย์ถามหน้าที่มากกว่า"
    misconceptions:
      - { match: 12, feedback: "12 คือหน้าซ้าย โจทย์ถามหน้าขวาซึ่งมากกว่า 1" }
    solution: "$n(n + 1) = 156$ → $n^2 + n - 156 = 0$ → $(n + 13)(n - 12) = 0$ → $n = 12$ (เลขหน้าติดลบไม่ได้) หน้าขวาคือ $13$ ตรวจ: $12 \\times 13 = 156$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.quad.p012
    topics: [math.algebra.quadratic-eq]
    difficulty: 5
    type: numeric
    stem: "ภาพวาดวัดอรุณขนาด $30 \\times 20$ เซนติเมตร ใส่กรอบไม้กว้างเท่ากันทุกด้าน ทำให้พื้นที่รวมทั้งภาพและกรอบเป็น 816 ตารางเซนติเมตร กรอบกว้างกี่เซนติเมตร (ตอบเป็นตัวเลขในหน่วยเซนติเมตร)"
    answer: { value: 2, unit: cm }
    hints:
      - "ให้กรอบกว้าง $x$ เซนติเมตร กรอบอยู่ทั้งสองข้างของภาพ ด้านยาวรวมจึงเป็น $30 + 2x$"
      - "ตั้งสมการ $(30 + 2x)(20 + 2x) = 816$ แล้วกระจาย"
      - "จัดให้ข้างหนึ่งเป็นศูนย์ หารด้วย 4 แล้วแยกตัวประกอบหรือใช้สูตร"
    misconceptions:
      - { match: 4, feedback: "ดูเหมือนบวกกรอบแค่ด้านเดียว $(30 + x)(20 + x)$ แต่กรอบอยู่ทั้งสองข้าง ความยาวรวมต้องเป็น $30 + 2x$" }
    solution: "$(30 + 2x)(20 + 2x) = 816$ → $600 + 100x + 4x^2 = 816$ → $4x^2 + 100x - 216 = 0$ → $x^2 + 25x - 54 = 0$ → $(x + 27)(x - 2) = 0$ ได้ $x = 2$ เซนติเมตร ตรวจ: $34 \\times 24 = 816$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.quad.p013
    topics: [math.algebra.quadratic-eq]
    difficulty: 5
    type: numeric
    stem: "ถ้าสมการ $x^2 + kx + 16 = 0$ มีคำตอบเพียงคำตอบเดียว (คำตอบซ้ำ) และ $k > 0$ แล้ว $k$ มีค่าเท่าใด"
    answer: { value: 8 }
    hints:
      - "คำตอบเดียวเกิดเมื่อดิสคริมิแนนต์เป็นศูนย์"
      - "ตั้ง $k^2 - 4(1)(16) = 0$"
      - "แก้หา $k$ แล้วเลือกค่าที่เป็นบวก"
    misconceptions:
      - { match: 4, feedback: "ดูเหมือนใช้ $k^2 = 16$ ลืมคูณ $4a$ ดิสคริมิแนนต์คือ $k^2 - 4(1)(16) = k^2 - 64$" }
      - { match: 64, feedback: "$k^2 = 64$ ถูกแล้ว แต่ยังต้องถอดรากที่สองเพื่อหา $k$" }
    solution: "คำตอบเดียวเมื่อ $k^2 - 64 = 0$ → $k^2 = 64$ → $k = \\pm 8$ เลือก $k = 8$ ตรวจ: $x^2 + 8x + 16 = (x + 4)^2 = 0$ มีคำตอบเดียวคือ $x = -4$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.quad.p014
    topics: [math.algebra.quadratic-eq]
    difficulty: 5
    type: numeric
    stem: "แก้สมการ $(x + 1)^2 = 3(x + 1) + 10$ แล้วตอบคำตอบที่เป็นจำนวนบวก"
    answer: { value: 4 }
    hints:
      - "ให้ $u = x + 1$ สมการจะกลายเป็น $u^2 = 3u + 10$"
      - "แก้หา $u$ ด้วยการแยกตัวประกอบ"
      - "อย่าลืมเปลี่ยนกลับเป็น $x$ โดยใช้ $x = u - 1$"
    misconceptions:
      - { match: 5, feedback: "5 คือค่าของ $u = x + 1$ ยังต้องลบ 1 เพื่อให้ได้ $x$" }
    solution: "ให้ $u = x + 1$: $u^2 - 3u - 10 = 0$ → $(u - 5)(u + 2) = 0$ → $u = 5$ หรือ $u = -2$ จึงได้ $x = 4$ หรือ $x = -3$ คำตอบบวกคือ $4$ ตรวจ: $25 = 15 + 10$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true
