      - "ข้อมูลตัวตรงกลางก็ได้เพิ่ม 5 เหมือนทุกตัว"
    misconceptions:
      - { match: 60, feedback: "มัธยฐานเปลี่ยน เพราะข้อมูลตัวตรงกลางเองก็ได้เพิ่ม 5 คะแนนเหมือนคนอื่น" }
      - { match: 110, feedback: "คะแนนที่เพิ่มรวม 50 คะแนนถูกแบ่งให้ 10 คน คนละ 5 มัธยฐานจึงเพิ่มแค่ 5" }
    solution: "บวก 5 ทุกตัวไม่เปลี่ยนลำดับ ข้อมูลตัวกลางจึงยังเป็นคนเดิมที่ได้เพิ่ม 5 มัธยฐานใหม่ $= 60 + 5 = 65$ คะแนน ในทำนองเดียวกัน ค่าเฉลี่ยใหม่ $= 62 + 5 = 67$ คะแนน"
