problems:
- id: chinese.writing.short-messages.p001
  topics:
  - chinese.writing.short-messages
  difficulty: 1
  type: match
  stem: จับคู่ส่วนของโปสการ์ดกับหน้าที่
  pairs:
  - left: 李明：
    right: คำขึ้นต้น (称呼)
  - left: 你好！
    right: คำทักทาย (问候)
  - left: 祝你天天开心！
    right: คำอวยพร (祝福)
  - left: 小美
    right: ชื่อผู้เขียน (署名)
  hints:
  - คำขึ้นต้นเป็นชื่อผู้รับ ตามด้วย ：
  - 祝 = อวยพร ชื่อผู้เขียนอยู่ท้าย
  solution: 李明： คำขึ้นต้น · 你好！ คำทักทาย · 祝你天天开心！ คำอวยพร · 小美 ชื่อผู้เขียน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.writing.short-messages.p002
  topics:
  - chinese.writing.short-messages
  difficulty: 2
  type: hanzi
  stem: เขียนอักษร 写 (xiě เขียน) ตามลำดับขีด
  character: 写
  pinyin: xiě
  meaning: เขียน
  hints:
  - 写 มี 5 ขีด ส่วนบนคือ 冖
  - ขีดที่ 4 เป็นขีดหักสองครั้งแล้วตวัดขอ (竖折折钩)
  solution: 点 → 横钩 (冖) → 横 → 竖折折钩 → 横 รวม 5 ขีด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.writing.short-messages.p003
  topics:
  - chinese.writing.short-messages
  difficulty: 2
  type: mcq
  stem: เพื่อนชาวจีนส่งมาว่า 明天下午三点在Central见，好吗？ เราตกลง ควรตอบว่าอะไร
  choices:
  - id: a
    text: 好的，明天见！
    correct: true
    feedback: ถูก ตอบรับและปิดด้วยการนัดเจอ
  - id: b
    text: 你好！
    feedback: เป็นเพียงคำทักทาย ไม่ได้ตอบคำชวน
  - id: c
    text: 不客气。
    feedback: ใช้ตอบคำขอบคุณ
  - id: d
    text: 对不起。
    feedback: เป็นคำขอโทษ ถ้าไปไม่ได้ควรบอกเหตุผลด้วย
  hints:
  - 好吗？ ถามว่าตกลงไหม
  - ตอบรับด้วย 好的 หรือ 没问题
  solution: '**好的，明天见！** Hǎo de, míngtiān jiàn!'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.writing.short-messages.p004
  topics:
  - chinese.writing.short-messages
  difficulty: 2
  type: mcq
  stem: นักเรียนจะส่งข้อความถึงครูหวังซึ่งเป็นครูภาษาจีน คำขึ้นต้นข้อใดเหมาะที่สุด
  choices:
  - id: a
    text: 小王：你好！
    feedback: 小 ใช้เรียกคนที่อายุน้อยกว่า
  - id: b
    text: 王老师：您好！
    correct: true
    feedback: ถูก เรียกตำแหน่ง 老师 และใช้ 您 แสดงความสุภาพ
  - id: c
    text: 老王，在吗？
    feedback: 老王 เป็นคำเรียกแบบคนสนิทหรือรุ่นเดียวกัน ไม่สุภาพกับครู
  - id: d
    text: 嗨，王！
    feedback: ภาษาแชตกับเพื่อน ไม่เหมาะกับครู
  hints:
  - ครูเป็นผู้ใหญ่
  - 您 nín เป็นรูปสุภาพของ 你
  solution: '**王老师：您好！**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.writing.short-messages.p005
  topics:
  - chinese.writing.short-messages
  difficulty: 3
  type: order
  stem: เรียงบรรทัดของโปสการ์ดจากเชียงใหม่ให้ถูกรูปแบบ (จากบนลงล่าง)
  items:
  - 张华：
  - 你好！
  - 我现在在清迈，这里很凉快。
  - 祝你
  - 身体健康！
  - 小美
  hints:
  - คำขึ้นต้น → คำทักทาย → เนื้อความ → คำอวยพร → ชื่อผู้เขียน
  - 祝你 กับ 身体健康 เป็นคำอวยพรสองบรรทัด
  solution: 张华： / 你好！ / 我现在在清迈，这里很凉快。 / 祝你 / 身体健康！ / 小美
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.writing.short-messages.p006
  topics:
  - chinese.writing.short-messages
  difficulty: 3
  type: mcq
  stem: จะลงวันที่ 2 พฤศจิกายน 2026 ท้ายจดหมาย เขียนแบบใดถูกต้อง
  choices:
  - id: a
    text: 2日11月2026年
    feedback: เรียงแบบไทย ภาษาจีนต้องเริ่มจากปี
  - id: b
    text: 2026年2日11月
    feedback: เดือนต้องมาก่อนวัน
  - id: c
    text: 11月2026年2日
    feedback: ปีต้องอยู่หน้าสุด
  - id: d
    text: 2026年11月2日
    correct: true
    feedback: ถูก ภาษาจีนเรียงจากหน่วยใหญ่ไปเล็ก ปี → เดือน → วัน
  hints:
  - ภาษาจีนเรียงจากหน่วยใหญ่ไปหน่วยเล็ก
  - 年 ปี → 月 เดือน → 日 วัน
  solution: '**2026年11月2日** (ทบทวนบท วัน เดือน ปี)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.writing.short-messages.p007
  topics:
  - chinese.writing.short-messages
  difficulty: 3
  type: order
  stem: 'เรียงประโยคแนะนำตัวให้เป็นลำดับที่อ่านง่าย: ข้อมูลส่วนตัว → ครอบครัว → โรงเรียน → งานอดิเรก → ความหวัง'
  items:
  - 我叫陈明，今年十五岁，是泰国人。
  - 我家有四口人：爸爸、妈妈、妹妹和我。
  - 我在普吉的一所中学上学。
  - 我的爱好是踢足球和听音乐。
  - 我希望将来能去北京留学。
  hints:
  - เริ่มจากชื่อและอายุ
  - ปิดด้วยความหวัง (希望) เกี่ยวกับอนาคต
  solution: ชื่อ อายุ สัญชาติ → ครอบครัว → โรงเรียน (所 = ลักษณนามของโรงเรียน) → งานอดิเรก → ความหวัง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.writing.short-messages.p008
  topics:
  - chinese.writing.short-messages
  difficulty: 3
  type: hanzi
  stem: เขียนอักษร 信 (xìn จดหมาย) ตามลำดับขีด
  character: 信
  pinyin: xìn
  meaning: จดหมาย เชื่อ
  hints:
  - 信 = 亻 (คน) + 言 (คำพูด) รวม 9 ขีด
  - เขียน 亻 ก่อน แล้วเขียน 言 จากบนลงล่าง ปิดด้วย 口
  solution: '亻: 撇 → 竖 แล้ว 言: 点 → 横 → 横 → 横 → 竖 → 横折 → 横 รวม 9 ขีด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.writing.short-messages.p009
  topics:
  - chinese.writing.short-messages
  difficulty: 3
  type: text
  stem: 'เติมคำอวยพรท้ายโปสการ์ดถึงคุณยาย (พิมพ์อักษรจีน 4 ตัว): 祝您＿＿＿＿！ (สุขภาพแข็งแรง)'
  accepted:
  - 身体健康
  - 身体健康。
  - 身体健康.
  - 身体健康？
  - 身体健康?
  - 身體健康
  - 身體健康。
  - 身體健康.
  - 身體健康？
  - 身體健康?
  misconceptions:
  - match: 生日快乐
    feedback: 生日快乐 = สุขสันต์วันเกิด ไม่ใช่สุขภาพแข็งแรง
  - match: 生日快乐。
    feedback: 生日快乐 = สุขสันต์วันเกิด ไม่ใช่สุขภาพแข็งแรง
  - match: 生日快乐？
    feedback: 生日快乐 = สุขสันต์วันเกิด ไม่ใช่สุขภาพแข็งแรง
  - match: 天天开心
    feedback: 天天开心 = มีความสุขทุกวัน ไม่ใช่เรื่องสุขภาพ
  - match: 天天开心。
    feedback: 天天开心 = มีความสุขทุกวัน ไม่ใช่เรื่องสุขภาพ
  - match: 天天开心？
    feedback: 天天开心 = มีความสุขทุกวัน ไม่ใช่เรื่องสุขภาพ
  hints:
  - 身体 = ร่างกาย
  - 健康 jiànkāng = แข็งแรง สุขภาพดี
  solution: 祝您**身体健康**！ Zhù nín shēntǐ jiànkāng!
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.writing.short-messages.p010
  topics:
  - chinese.writing.short-messages
  difficulty: 4
  type: numeric
  stem: เขียนแนะนำตัว 150 ตัวอักษร (นับรวมเครื่องหมายวรรคตอนแล้ว) เป็นย่อหน้าเดียวบนกระดาษตาราง 稿纸 แถวละ 20 ช่อง ต้องใช้อย่างน้อยกี่แถว
  answer:
    value: 8
    unit: แถว
  misconceptions:
  - match: 7.5
    feedback: จำนวนแถวต้องเป็นจำนวนเต็ม และอย่าลืมเว้น 2 ช่องต้นย่อหน้า
  - match: 7
    feedback: 7 แถวมีเพียง 140 ช่อง ไม่พอ ต้องปัดขึ้น
  hints:
  - ขึ้นย่อหน้าเว้น 2 ช่อง จึงใช้ 150 + 2 ช่อง
  - จำนวนช่อง ÷ 20 แล้วปัดขึ้นเป็นจำนวนเต็ม
  solution: ใช้ $150 + 2 = 152$ ช่อง · $152 \div 20 = 7.6$ ปัดขึ้นเป็น **8 แถว**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.writing.short-messages.p011
  topics:
  - chinese.writing.short-messages
  difficulty: 4
  type: mcq
  stem: ดูแชต เพื่อนรออยู่ที่ห้างแล้ว แต่เรายังอยู่บนรถไฟฟ้าและจะถึงในอีก 10 นาที ข้อความตอบกลับใดเหมาะที่สุด
  figure:
    src: chat-quiz.svg
    alt: 'หน้าจอแชตกับหวังหมิง (王明) ข้อความของหวังหมิง: 我到Central了。你在哪儿？ ข้อความตอบกลับของเรายังว่างอยู่ (มีเครื่องหมายคำถาม)'
    caption: ข้อความตอบกลับของเรายังว่าง
  choices:
  - id: a
    text: 不好意思，我还在车上，十分钟以后到。
    correct: true
    feedback: ถูก ขอโทษ บอกว่าอยู่ที่ไหน และจะถึงเมื่อไร
  - id: b
    text: 我也到了！
    feedback: ไม่ตรงความจริง เรายังไม่ถึง
  - id: c
    text: 明天见！
    feedback: ใช้ปิดบทสนทนาเมื่อจะเจอกันพรุ่งนี้
  - id: d
    text: 我在家。
    feedback: ไม่ตรงสถานการณ์ และไม่บอกว่าจะถึงเมื่อไร
  hints:
  - เพื่อนถามว่าเราอยู่ที่ไหน
  - ข้อความที่ดีบอกตำแหน่งและเวลาที่จะถึง
  solution: '**不好意思，我还在车上，十分钟以后到。** (还在 = ยังอยู่)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.writing.short-messages.p012
  topics:
  - chinese.writing.short-messages
  difficulty: 4
  type: mcq
  stem: ชมรมภาษาจีนจะเขียนประกาศ (通知) เรื่องไปทัศนศึกษา ข้อมูลใด **ต้องมี** ในประกาศ (เลือกทุกข้อ)
  multiple: true
  choices:
  - id: a
    text: สิ่งที่ต้องทำหรือเตรียม
    correct: true
    feedback: ถูก เช่น 请带水
  - id: b
    text: ผู้ประกาศและวันที่
    correct: true
    feedback: ถูก ลงไว้มุมขวาล่าง
  - id: c
    text: งานอดิเรกของผู้เขียนประกาศ
    feedback: ไม่เกี่ยวกับเรื่องที่ประกาศ
  - id: d
    text: เวลา (时间)
    correct: true
    feedback: ถูก ผู้อ่านต้องรู้ว่าเมื่อไร
  - id: e
    text: สถานที่นัดรวม (地点)
    correct: true
    feedback: ถูก
  hints:
  - นึกถึงประกาศในบทการอ่าน
  - ข้อมูลที่ผู้อ่านต้องใช้เพื่อไปให้ถูกเวลาและที่
  solution: ต้องมี **เวลา สถานที่ สิ่งที่ต้องทำ ผู้ประกาศและวันที่** ส่วนงานอดิเรกไม่เกี่ยว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.writing.short-messages.p013
  topics:
  - chinese.writing.short-messages
  difficulty: 4
  type: mcq
  stem: ประโยคใดในย่อหน้าแนะนำตัวต่อไปนี้ **ผิด**
  choices:
  - id: a
    text: 我的爱好是踢足球。
    feedback: ประโยคนี้ถูก
  - id: b
    text: 我希望将来当老师。
    feedback: ประโยคนี้ถูก (当 = เป็น)
  - id: c
    text: 我是十五岁。
    correct: true
    feedback: 'ผิด บอกอายุไม่ใช้ 是: 我十五岁 หรือ 我今年十五岁'
  - id: d
    text: 我家有四口人。
    feedback: ประโยคนี้ถูก
  hints:
  - ทบทวนการบอกอายุในบทแนะนำตัว
  - อายุไม่ต้องมีกริยา
  solution: '**我是十五岁** ผิด ต้องเป็น 我十五岁。 หรือ 我今年十五岁。'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.writing.short-messages.p014
  topics:
  - chinese.writing.short-messages
  difficulty: 4
  type: match
  stem: จับคู่จุดประสงค์กับรูปแบบงานเขียนที่เหมาะสม
  pairs:
  - left: ขอบคุณเพื่อนที่พาเที่ยวเมื่อวาน สั้น ๆ ทันที
    right: 微信
  - left: แจ้งนักเรียนทั้งชั้นว่าวันศุกร์งดเรียน
    right: 通知
  - left: ส่งจากเกาะภูเก็ตพร้อมรูปทะเล
    right: 明信片
  - left: ขอลาครูโดยมีหัวเรื่องชัดเจน
    right: 电子邮件
  hints:
  - 明信片 = โปสการ์ด 电子邮件 = อีเมล
  - 通知 = ประกาศ 微信 = แชต
  solution: ขอบคุณสั้น ๆ → 微信 · แจ้งทั้งชั้น → 通知 · จากที่เที่ยว → 明信片 · ขอลาครู → 电子邮件 (主题：请假)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.writing.short-messages.p015
  topics:
  - chinese.writing.short-messages
  difficulty: 5
  type: mcq
  stem: 'ข้อความเดิม: 我喜欢清迈。清迈很凉快。清迈有很多好吃的东西。清迈有点儿远。我每年都去。 ข้อใดเขียนใหม่ได้ต่อเนื่องและถูกต้องที่สุด'
  choices:
  - id: a
    text: 我很喜欢清迈，因为那儿不但很凉快，而且有很多好吃的东西。虽然清迈有点儿远，但是我每年都去。
    correct: true
    feedback: ถูก ใช้ 因为 ให้เหตุผล 不但…而且 รวมสองเหตุผล และ 虽然…但是 แสดงความขัดแย้ง
  - id: b
    text: 我很喜欢清迈，因为那儿不但很凉快，但是有很多好吃的东西。虽然清迈有点儿远，所以我每年都去。
    feedback: 'จับคู่ผิด: 不但 ต้องคู่ 而且 และ 虽然 ต้องคู่ 但是'
  - id: c
    text: 我很喜欢清迈，所以那儿很凉快，而且有很多好吃的东西。如果清迈有点儿远，就我每年都去。
    feedback: 所以 นำผล ไม่ใช่เหตุ และ 就 ต้องอยู่หลังประธาน
  - id: d
    text: 我很喜欢清迈和很凉快和有很多好吃的东西和有点儿远和我每年都去。
    feedback: 和 เชื่อมคำนาม ไม่ใช้ต่อประโยคแบบนี้
  hints:
  - หาเหตุผลที่ทำให้ชอบ และสิ่งที่ขัดแย้ง
  - ตรวจคู่คำเชื่อมทุกคู่
  solution: '**我很喜欢清迈，因为那儿不但很凉快，而且有很多好吃的东西。虽然清迈有点儿远，但是我每年都去。**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.writing.short-messages.p016
  topics:
  - chinese.writing.short-messages
