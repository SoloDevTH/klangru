      - { match: 42, feedback: "ดูเหมือนอ่าน 六十五 แบบบวกทุกตัว (6 + 10 + 5 = 21) แล้วคูณ 2 ตัวเลขหน้า 十 ต้องคูณ 10 ราคาจึงเป็น 65 ต่อกิโลกรัม" }
    solution: "六十五 = 6 × 10 + 5 = 65 บาทต่อกิโลกรัม ซื้อ 2 กิโลกรัม: 2 × 65 = **130 บาท** (ภาษาจีนพูดว่า 一百三十块)"
