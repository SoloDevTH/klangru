id: math.number.bounds-errors
subject: math
title: { th: การปัด ขอบเขตบนล่าง และความคลาดเคลื่อนของการวัด, en: Rounding, bounds and measurement error }
summary: ปัดตามความแม่นยำที่กำหนด เขียนขอบเขตบนและล่างด้วยอสมการ หาความคลาดเคลื่อนสัมบูรณ์ สัมพัทธ์ และร้อยละ และดูผลของค่าประมาณในการคำนวณ
difficulty: 3.5
minutes: 40
prerequisites: [math.number.place-value, math.algebra.linear-inequalities, physics.units.measurement]
encompasses:
  - { id: math.number.place-value, weight: 0.3 }
  - { id: physics.units.measurement, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: bounds-3-4.svg
    alt: "เส้นจำนวนจาก 3.3 ถึง 3.5 มีแถบระบายสีจาก 3.35 ถึง 3.45 ที่ 3.35 เป็นวงกลมทึบ เขียนว่า ขอบเขตล่าง (รวม) ที่ 3.45 เป็นวงกลมโปร่ง เขียนว่า ขอบเขตบน (ไม่รวม) มีลูกศรชี้ที่ 3.4 เขียนว่า ค่าที่ปัดแล้ว 3.4"
    caption: "ทุกค่าในแถบนี้ปัดเป็นทศนิยม 1 ตำแหน่งได้ 3.4: $3.35 \\le m < 3.45$"
  - { type: check, problem: math.number.bounds-errors.p004, prompt: "ขอบไหนรวม ขอบไหนไม่รวม" }
  - type: worked-example
    title: ขอบเขตของพื้นที่และความแม่นยำที่ควรรายงาน
    problem: "แปลงผักรูปสี่เหลี่ยมผืนผ้ากว้าง 8.7 m ยาว 12.4 m (ปัดเป็นทศนิยม 1 ตำแหน่ง) หาขอบเขตของพื้นที่ และควรรายงานพื้นที่ละเอียดแค่ไหน"
    steps:
      - text: "ขอบเขตของด้าน: $8.65 \\le w < 8.75$ และ $12.35 \\le l < 12.45$"
        why: "ปัดเป็นทศนิยม 1 ตำแหน่ง หน่วยคือ 0.1 ครึ่งหน่วยคือ 0.05"
      - text: "ขอบเขตล่างของพื้นที่ $= 8.65 \\times 12.35 = 106.8275\\ \\mathrm{m^2}$"
      - text: "ขอบเขตบนของพื้นที่ $= 8.75 \\times 12.45 = 108.9375\\ \\mathrm{m^2}$"
      - text: "ได้ $106.8275 \\le A < 108.9375$ พื้นที่จริงอาจต่างกันได้ราว 2 ตารางเมตร"
      - text: "ทั้งสองขอบเขตปัดเป็นเลขนัยสำคัญ 2 ตัวได้ 110 เท่ากัน แต่ปัด 3 ตัวได้ 107 กับ 109 ไม่เท่ากัน"
        why: "ความแม่นยำที่รายงานได้อย่างมั่นใจคือระดับที่ขอบเขตบนและล่างปัดแล้วได้ค่าเดียวกัน"
    answer: "$106.8275 \\le A < 108.9375\\ \\mathrm{m^2}$ รายงานได้อย่างมั่นใจว่าพื้นที่ประมาณ $110\\ \\mathrm{m^2}$ (เลขนัยสำคัญ 2 ตัว) ค่า $8.7 \\times 12.4 = 107.88$ จึงละเอียดเกินกว่าข้อมูล"
  - type: worked-example
    title: เทียบความแม่นยำด้วยร้อยละความคลาดเคลื่อน
    problem: "การวัด A: ความยาวสนามฟุตบอล $100\\ \\mathrm{m}$ คลาดเคลื่อนได้ $0.5\\ \\mathrm{m}$ การวัด B: เส้นผ่านศูนย์กลางเหรียญสิบบาท $2.6\\ \\mathrm{cm}$ คลาดเคลื่อนได้ $0.05\\ \\mathrm{cm}$ การวัดใดแม่นยำกว่า"
    steps:
      - text: "ความคลาดเคลื่อนสัมบูรณ์ของ A (0.5 m) ดูมากกว่า B (0.05 cm) มาก แต่เทียบกันตรง ๆ ไม่ได้ เพราะขนาดของสิ่งที่วัดต่างกันมาก"
      - text: "A: $\\tfrac{0.5}{100} \\times 100\\% = 0.5\\%$"
      - text: "B: $\\tfrac{0.05}{2.6} \\times 100\\% \\approx 1.9\\%$"
        why: "ร้อยละความคลาดเคลื่อนบอกว่าคลาดเคลื่อนไปกี่ส่วนจากขนาดของสิ่งที่วัด จึงใช้เทียบการวัดต่างขนาดกันได้"
    answer: "การวัด A แม่นยำกว่า (0.5% เทียบกับประมาณ 1.9%)"
  - { type: check, problem: math.number.bounds-errors.p009, prompt: "ใช้ขอบเขตบนของด้านก่อนแล้วจึงคูณ" }
glossary:
  - { term: ขอบเขตล่าง, definition: "ค่าน้อยที่สุดที่ปัดแล้วได้ค่าที่กำหนด (รวมในช่วง) เท่ากับค่าที่ปัดลบครึ่งหน่วย" }
  - { term: ขอบเขตบน, definition: "ค่าที่ค่าจริงเข้าใกล้ได้แต่ไม่ถึง (ไม่รวมในช่วง) เท่ากับค่าที่ปัดบวกครึ่งหน่วย" }
  - { term: การตัดทิ้ง, definition: "การตัดหลักที่เกินออกโดยไม่ปัดขึ้น ค่าจริงอยู่ระหว่างค่าที่แสดงกับค่าที่แสดงบวกหนึ่งหน่วย" }
  - { term: ความคลาดเคลื่อนสัมบูรณ์, definition: "$|\\text{ค่าที่วัดได้} - \\text{ค่าจริง}|$" }
  - { term: ร้อยละความคลาดเคลื่อน, definition: "$\\dfrac{\\text{ความคลาดเคลื่อนสัมบูรณ์}}{\\text{ค่าจริง}} \\times 100\\%$" }
  - { term: เลขนัยสำคัญ, definition: "เลขโดดที่นับตั้งแต่ตัวแรกที่ไม่ใช่ 0 ใช้บอกความละเอียดของค่า" }
flashcards:
  - { front: "3.4 ปัดเป็นทศนิยม 1 ตำแหน่ง ค่าจริงอยู่ช่วงใด", back: "$3.35 \\le x < 3.45$" }
  - { front: "ค่ามากที่สุดของ $a - b$", back: "ขอบเขตบนของ $a$ − ขอบเขตล่างของ $b$" }
  - { front: "ค่ามากที่สุดของ $a \\div b$", back: "ขอบเขตบนของ $a$ ÷ ขอบเขตล่างของ $b$" }
  - { front: "ร้อยละความคลาดเคลื่อน", back: "$\\dfrac{|\\text{วัดได้} - \\text{ค่าจริง}|}{\\text{ค่าจริง}} \\times 100\\%$ (หารด้วยค่าจริง)" }
  - { front: "ทำไมไม่ควรปัดระหว่างทาง", back: "ความคลาดเคลื่อนสะสม เช่น $1.4^{10}$ ต่างจาก $(\\sqrt2)^{10} = 32$ เกือบ 10%" }
