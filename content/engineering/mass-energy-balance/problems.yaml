      - { id: c, text: "จำนวนโมลรวมของแก๊สทั้งหมด", feedback: "โมลรวมเปลี่ยนได้เมื่อมีปฏิกิริยา (ในสมการนี้ 3 โมลเป็น 3 โมลพอดี แต่ไม่จริงทั่วไป) ที่คงตัวเสมอคือมวลรวมและอะตอม" }
      - { id: d, text: "จำนวนโมลของ $\\mathrm{CO_2}$", feedback: "$\\mathrm{CO_2}$ เกิดขึ้นในปฏิกิริยา ต้องมีพจน์ เกิด ด้วย" }
    hints:
