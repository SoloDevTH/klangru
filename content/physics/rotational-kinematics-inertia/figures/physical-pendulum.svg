<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" font-family="sans-serif">
  <title>ลูกตุ้มฟิสิคัลเป็นแท่งที่แกว่งรอบจุดแขวน O โดยมีจุดศูนย์กลางมวล C อยู่ที่ระยะ d</title>
  <rect width="600" height="340" fill="#ffffff"/>
  <line x1="180.0" y1="46.0" x2="420.0" y2="46.0" stroke="#333" stroke-width="3"/>
  <line x1="300.0" y1="60.0" x2="300.0" y2="300.0" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="300.0" y1="60.0" x2="368.0" y2="269.2" stroke="#1d1d1d" stroke-width="14" stroke-linecap="round" opacity="0.25"/>
  <line x1="300.0" y1="60.0" x2="368.0" y2="269.2" stroke="#1d4f91" stroke-width="4" stroke-linecap="round"/>
  <circle cx="300.0" cy="60.0" r="6" fill="#c0392b"/>
  <text x="286.0" y="64.0" font-size="16" text-anchor="end" fill="#c0392b">O</text>
  <circle cx="334.0" cy="164.6" r="5" fill="#1d4f91"/>
  <text x="346.0" y="158.6" font-size="16" fill="#1d4f91">C (จุดศูนย์กลางมวล)</text>
  <line x1="334.0" y1="178.6" x2="334.0" y2="246.6" stroke="#333" stroke-width="1.6" marker-end="url(#a4)"/>
  <defs><marker id="a4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
  <path d="M 300.0 120.0 A 60 60 0 0 1 309.4 119.3" fill="none" stroke="#333"/>
  <text x="334.0" y="126.0" font-size="15" fill="#333">θ</text>
  <line x1="300.0" y1="60.0" x2="334.0" y2="164.6" stroke="#7a4b00" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="295.0" y="112.3" font-size="16" text-anchor="end" fill="#7a4b00">d</text>
  <text x="322.0" y="224.6" font-size="15" text-anchor="end" fill="#333">mg</text>
  <text x="300.0" y="328.0" font-size="13" text-anchor="middle" fill="#555">ลูกตุ้มฟิสิคัลมีคาบ T = 2π√(I/(mgd)) โดย I วัดรอบจุด O และ d คือระยะ OC</text>
</svg>
