topic: engineering.environmental.eia
rows:
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.10"], coverage: partial, note: "สอนขั้นตอนการจัดทำรายงาน EIA กับ IEE ในไทย เมทริกซ์ Leopold การมีส่วนร่วมของประชาชน และการจัดการความไม่แน่นอน ยังไม่สอนแบบจำลองการกระจายมลพิษ เสียง และการทำนายเชิงปริมาณของแต่ละสาขาสิ่งแวดล้อม" }
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.11"], coverage: full, note: "ครอบคลุมเครื่องมือหลักที่ตามขอบเขต ได้แก่ ระบบจัดการสิ่งแวดล้อม (ISO 14001) เทคโนโลยีสะอาด LCA และฉลากสิ่งแวดล้อม" }
  - { framework: th-coe-engineering-basics, indicators: ["ENV-3.17"], coverage: partial, note: "สอนความคิดการพัฒนาที่ยั่งยืนและ SDGs ระดับแนวคิด ยังไม่สอนการวิเคราะห์ความยั่งยืนเชิงปริมาณหรือกรณีศึกษาโครงการ (ดูการคาร์บอนที่ engineering.environmental.carbon-neutrality)" }
  - { framework: th-coe-engineering-basics, indicators: ["MIN-2.7"], coverage: partial, note: "สอนการประเมินผลกระทบจากเหมืองหินปูนด้วยอัตราส่วนดินทิ้งต่อแร่และแผนฟื้นฟูเป็นตัวอย่าง ยังไม่ครอบคลุมนิเวศวิทยาเหมืองแร่ การควบคุมน้ำชะล้าง และการปิดเหมืองทั้งระบบ" }
  - { framework: abet-eac, indicators: ["Environmental 1.d"], coverage: partial, note: "สอนการคำนึงถึงความเสี่ยง ความไม่แน่นอน วัฏจักรชีวิต และผลกระทบ แต่ยังไม่สอนการออกแบบระบบวิศวกรรมสิ่งแวดล้อมที่สมบูรณ์" }
  - { framework: abet-eac, indicators: ["Environmental 1.e"], coverage: partial, note: "สอนแนวคิดการบริหารโครงการในระดับพื้นฐานและบทบาทของหน่วยงานรัฐกับเอกชนผ่านขั้นตอน EIA ยังไม่สอนกฎระเบียบรายละเอียดและการบริหารโครงการเชิงลึก" }
