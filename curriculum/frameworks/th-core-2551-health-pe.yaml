# หลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พุทธศักราช 2551 กลุ่มสาระการเรียนรู้สุขศึกษาและพลศึกษา
#
# สถานะการปรับปรุง (ตรวจเมื่อ 2026-10-24)
# - สุขศึกษาและพลศึกษาไม่ได้ปรับปรุงในปี 2560 เอกสาร "มาตรฐานการเรียนรู้และตัวชี้วัด ... (ฉบับปรับปรุง พ.ศ. 2560)"
#   ระบุชื่อไว้เพียงกลุ่มสาระคณิตศาสตร์ วิทยาศาสตร์ และสาระภูมิศาสตร์ และหนังสือ สพฐ. เรื่อง ซักซ้อมความเข้าใจเกี่ยวกับ
#   ตัวชี้วัดระหว่างทางและตัวชี้วัดปลายทาง (มิถุนายน 2566) เขียนว่า "ต่อมาปี พ.ศ. ๒๕๖๐ ได้ปรับปรุงมาตรฐานการเรียนรู้และตัวชี้วัด
#   กลุ่มสาระการเรียนรู้คณิตศาสตร์ วิทยาศาสตร์ และสาระภูมิศาสตร์ ..." เท่านั้น (ดู sources)
# - หนังสือ สพฐ. ปี 2566 แบ่งตัวชี้วัดเดิมเป็น "ตัวชี้วัดระหว่างทาง" กับ "ตัวชี้วัดปลายทาง" โดยไม่เปลี่ยนข้อความหรือจำนวน
#   ไฟล์นี้ยังไม่ได้เก็บการแบ่งนั้น (สรุปจำนวนที่โรงเรียนเผยแพร่: ป.1 15 = ระหว่างทาง 10 + ปลายทาง 5 ... ม.4-6 29 = 16 + 13
#   ตรงกับจำนวนรวมรายชั้นของไฟล์นี้ แต่ไม่ได้ระบุว่าข้อใดเป็นปลายทาง)
# - หลักสูตรประถมศึกษาตอนต้น (ป.1–3) พ.ศ. 2568 ซึ่งยึดฐานสมรรถนะ ใช้กับโรงเรียนที่สมัครใจตั้งแต่ปีการศึกษา 2568
#   ยังไม่ได้แทนหลักสูตร 2551 ทั้งระบบ จึงไม่ได้รวมไว้ในไฟล์นี้ และค้นไม่พบประกาศปรับปรุงสุขศึกษาและพลศึกษาฉบับอื่น
#
# วิธีคัดข้อความ
# - ต้นฉบับคือตาราง "ตัวชี้วัดชั้นปี/ตัวชี้วัดช่วงชั้น" ในเล่มหลักสูตร (หน้า 170–181 ของเล่ม) และมาตรฐานจากหน้า
#   "สาระและมาตรฐานการเรียนรู้" (หน้า 17) รหัสตัวชี้วัดสร้างจากโครงตารางตามที่เล่มอธิบายไว้ในหน้า 9
#   (เช่น พ ๕.๑ ม.๓/๕ = สาระที่ 5 มาตรฐานข้อ 1 ชั้น ม.3 ข้อที่ 5) ไฟล์นี้เขียนเลขในรหัสเป็นเลขอารบิก
# - PDF ใช้ฟอนต์ไทยรุ่นเก่ารหัส MacThai จึงถอดรหัสด้วยตาราง Apple THAI.TXT (unicode.org) ไม่ได้ใช้ OCR
#   ช่อง ป.6 ของ พ 3.1 (หน้า 174) ซึ่ง pypdf อ่านรวมเป็นก้อนเดียว แยกบรรทัดจากตำแหน่งอักขระ (pdfminer)
#   เทียบภาพหน้ากระดาษที่เรนเดอร์ด้วย pdftoppm ทุกตัวชี้วัดของหน้า 170, 174, 178 และ 181 (รวม 82 ตัวชี้วัด) ตรงทุกตัวอักษร
# - ช่องในตารางแคบ ข้อความจึงขึ้นบรรทัดใหม่บ่อย PDF ไม่ได้บอกว่าตรงรอยต่อมีเว้นวรรคหรือไม่ จึงเทียบกับเอกสาร สพฐ. อีกสองฉบับ
#   (ตัวชี้วัดและสาระการเรียนรู้แกนกลาง กลุ่มสาระฯ 2551 และสรุปตัวชี้วัดต้องรู้ควรรู้ 2559) ด้วยการจับคู่อักขระ
#   รอยต่อที่ทั้งสองฉบับขึ้นบรรทัดตรงเดียวกันหรือถ้อยคำต่างกัน ตัดสินตามรูปประโยค (รายการที่คั่นด้วยเว้นวรรคเว้นวรรค
#   คำประสมและวลีเดียวกันไม่เว้นวรรค) รอยต่อที่สองฉบับเว้นวรรคต่างกัน ใช้ตามเอกสารตัวชี้วัดฯ 2551 ทั้งหมดบันทึกไว้ใน note
# - ข้อความใช้รูปตามเล่ม เช่น "ต่างๆ" (ไม่เว้นวรรคหน้าไม้ยมก) ช่องว่างซ้อนสองช่องในเล่มลดเหลือช่องเดียว
# - ถ้อยคำบางข้อในเอกสาร สพฐ. อีกสองฉบับต่างจากเล่มหลักสูตร ไฟล์นี้ยึดเล่มหลักสูตรและบันทึกความต่างไว้ใน note
# - มาตรฐาน พ 3.2 ในหัวตารางพิมพ์ "...ในการแข่งขันและชื่นชม..." ไฟล์นี้ใช้ข้อความหน้ามาตรฐาน (หน้า 17) ซึ่งเว้นวรรคหน้า "และ"
#   มาตรฐาน พ 4.1 ขึ้นบรรทัดที่ "การป้องกันโรค|และการสร้างเสริม" และ พ 5.1 ที่ "การใช้ยา|สารเสพติด" ทั้งในหน้ามาตรฐาน หัวตาราง
#   และเอกสารตัวชี้วัดฯ จึงตัดสินเป็นเว้นวรรคตามรูปรายการ
# - จำนวนตัวชี้วัด 221 ตรงกับตาราง "สรุปตัวชี้วัด" ของ สพฐ. (15 ส.ค. 2559): ป.1 15, ป.2 21, ป.3 18, ป.4 19, ป.5 25, ป.6 22,
#   ม.1 23, ม.2 25, ม.3 24, ม.4-6 29
# - ใช้ไฟล์ PDF เล่มหลักสูตรฉบับเดียวกับ th-core-2551-thai (สพป.ชุมพร เขต 1 เผยแพร่ซ้ำผ่าน Google Drive) เพราะเข้า academic.obec.go.th
