problems:
  - id: chemistry.thermochem.enthalpy-hess.p001
    topics: [chemistry.thermochem.enthalpy-hess]
    difficulty: 1
    type: mcq
    stem: 'ข้อใดอธิบายเอนทัลปี (H) ได้ถูกต้อง'
    choices:
      - { id: a, text: 'ปริมาณความร้อนที่ถ่ายเทที่ความดันคงที่ ใช้วัดการเปลี่ยนแปลงเอนทัลปี (ΔH) ได้', correct: true, feedback: 'ถูก ที่ความดันคงที่ $\Delta H = q_p$' }
      - { id: b, text: 'พลังงานจลน์เฉลี่ยของอนุภาคในสาร', feedback: 'นั่นคืออุณหภูมิ ไม่ใช่เอนทัลปี' }
      - { id: c, text: 'ปริมาณความร้อนที่ถ่ายเทที่ปริมาตรคงที่', feedback: 'ที่ปริมาตรคงที่ความร้อนที่วัดได้เป็นอีกปริมาณหนึ่ง ไม่ใช่ ΔH' }
      - { id: d, text: 'จำนวนโมลของสารตั้งต้นในปฏิกิริยา', feedback: 'จำนวนโมลกำหนดขนาดของ ΔH แต่ไม่ใช่นิยามของเอนทัลปี' }
    hints:
      - 'เอนทัลปีเกี่ยวข้องกับความร้อนที่เข้าหรือออกจากระบบเมื่อความดันคงที่'
      - 'ดูว่าตัวเลือกใดพูดถึงความร้อนที่ความดันคงที่'
    solution: 'เอนทัลปี $H$ เป็นฟังก์ชันสถานะ การเปลี่ยนแปลง $\Delta H$ ของปฏิกิริยาที่ความดันคงที่เท่ากับความร้อนที่ถ่ายเท $q_p$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.thermochem.enthalpy-hess.p002
    topics: [chemistry.thermochem.enthalpy-hess]
    difficulty: 1
    type: mcq
    stem: 'น้ำแข็งละลายเป็นน้ำที่ความดันคงที่ (H₂O(s) → H₂O(l)) ค่า ΔH มีเครื่องหมายใด'
    choices:
      - { id: a, text: 'เป็นบวก เพราะระบบดูดความร้อนจากสิ่งแวดล้อม', correct: true, feedback: 'ถูก การละลายเป็นกระบวนการดูดความร้อน' }
      - { id: b, text: 'เป็นลบ เพราะระบบคายความร้อน', feedback: 'ลบคือคายความร้อน แต่น้ำแข็งต้องรับความร้อนจากสิ่งแวดล้อมเพื่อละลาย' }
      - { id: c, text: 'เป็นศูนย์ เพราะอุณหภูมิไม่เปลี่ยน', feedback: 'ศูนย์หมายถึงไม่มีการถ่ายเทความร้อน ซึ่งไม่ตรงกับการละลาย' }
      - { id: d, text: 'ขึ้นกับจำนวนโมลเท่านั้น จึงไม่มีเครื่องหมาย', feedback: 'จำนวนโมลกำหนดขนาด แต่เครื่องหมายบอกทิศการถ่ายเทความร้อน' }
    hints:
      - 'ตอนน้ำแข็งละลาย ต้องใช้พลังงานไปทำลายโครงสร้างผลึกหรือไม่'
      - 'คำถามนี้ถามทิศทางการถ่ายเทความร้อน ไม่ได้ถามขนาด'
    solution: 'การละลายของน้ำแข็งต้องดูดพลังงานเข้ามาเพื่อทำลายพันธะไฮโดรเจนในผลึก จึงมี $\Delta H > 0$'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.thermochem.enthalpy-hess.p003
    topics: [chemistry.thermochem.enthalpy-hess]
    difficulty: 2
    type: numeric
    stem: 'สำหรับปฏิกิริยา $\mathrm{N_2(g) + 3H_2(g) \rightarrow 2NH_3(g)}$ มี $\Delta H = -92.2$ kJ ต่อปฏิกิริยาที่เขียนไว้ จงหา $\Delta H$ ของปฏิกิริยา $\mathrm{2NH_3(g) \rightarrow N_2(g) + 3H_2(g)}$ (ตอบเป็น kJ)'
    answer: { value: 92.2, tolerance: 0.1, unit: kJ }
    hints:
      - 'ปฏิกิริยาย้อนกลับมีทิศทางตรงข้าม ต้องเปลี่ยนเครื่องหมายของ ΔH'
      - 'สมการนี้มีสัมประสิทธิ์เท่ากับปฏิกิริยาเดิม จึงไม่ต้องคูณเพิ่ม'
    misconceptions:
      - { match: -92.2, feedback: 'ลืมเปลี่ยนเครื่องหมาย เมื่อกลับทิศปฏิกิริยา ΔH ต้องกลับเครื่องหมาย' }
      - { match: 46.1, feedback: 'ค่า 46.1 คือ ΔH ต่อ NH₃ 1 โมล แต่สมการนี้มี NH₃ 2 โมล ต้องคงค่าเต็มของสมการ' }
    solution: 'ปฏิกิริยาเดิมมี $\Delta H = -92.2$ kJ เมื่อกลับทิศ $\Delta H = +92.2$ kJ (ดูดความร้อน) สัมประสิทธิ์ของสมการไม่เปลี่ยนจึงไม่ต้องคูณ'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.thermochem.enthalpy-hess.p004
    topics: [chemistry.thermochem.enthalpy-hess]
    difficulty: 2
    type: numeric
    stem: 'ในการผลิตกรดซัลฟิวริก กำมะถันถูกเผาเป็น $\mathrm{SO_3}$ สองขั้นตอน ขั้นที่ 1: $\mathrm{S(s) + O_2(g) \rightarrow SO_2(g)}$ ΔH = −296.8 kJ ขั้นที่ 2: $\mathrm{SO_2(g) + \frac{1}{2}O_2(g) \rightarrow SO_3(g)}$ ΔH = −98.9 kJ จงหา ΔH ของปฏิกิริยา $\mathrm{S(s) + \frac{3}{2}O_2(g) \rightarrow SO_3(g)}$ (ตอบเป็น kJ)'
    answer: { value: -395.7, tolerance: 0.1, unit: kJ }
    hints:
      - 'รวมสองขั้นตอนให้ได้สมการรวม โดยตัดสารที่อยู่ทั้งสองข้าง ($\mathrm{SO_2}$) ออก'
      - 'ขั้นทั้งสองเดินไปทิศทางเดิม จึงรวม ΔH ได้โดยตรง'
    misconceptions:
      - { match: -197.9, feedback: 'กลับเครื่องหมายของขั้นที่สองทั้งที่ไม่ต้องกลับทิศ ขั้นที่ 2 เดินจาก SO₂ ไป SO₃ เหมือนเดิม' }
    solution: 'รวมสมการได้ $\mathrm{S(s) + \frac{3}{2}O_2(g) \rightarrow SO_3(g)}$ จึง $\Delta H = -296.8 + (-98.9) = -395.7$ kJ ซึ่งเท่ากับเอนทัลปีการเกิดมาตรฐานของ $\mathrm{SO_3(g)}$ เพราะเป็นการเกิดจากธาตุโดยตรง'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.thermochem.enthalpy-hess.p005
    topics: [chemistry.thermochem.enthalpy-hess]
    difficulty: 2
    type: mcq
    stem: 'ค่าเอนทัลปีการเกิดมาตรฐาน $\Delta H^\circ_f$ ของธาตุในสถานะมาตรฐาน เช่น $\mathrm{O_2(g)}$ และ $\mathrm{C}$ (แกรไฟต์) มีค่าเท่าใด'
    choices:
      - { id: a, text: '0 kJ/mol', correct: true, feedback: 'ถูก ธาตุในสถานะมาตรฐานไม่มีการเปลี่ยนแปลงเมื่อเกิดจากตัวมันเอง จึงกำหนดให้เป็นศูนย์' }
      - { id: b, text: '1 kJ/mol', feedback: 'ไม่มีการกำหนดค่าเป็น 1 สำหรับธาตุ' }
      - { id: c, text: 'เท่ากับค่าความร้อนของการเผาไหม้', feedback: 'การเผาไหม้ไม่ใช่นิยามของ $\Delta H^\circ_f$' }
      - { id: d, text: 'เท่ากับพลังงานพันธะของโมเลกุลนั้น', feedback: 'พลังงานพันธะไม่ใช่นิยามของ $\Delta H^\circ_f$' }
    hints:
      - 'นึกถึงนิยามของการเกิดว่าเป็นการสร้างสารจากธาตุ'
      - 'ถ้าสารเป็นธาตุอยู่แล้วก็ไม่มีการสร้างจากอะไรเลย'
    solution: 'เอนทัลปีการเกิดมาตรฐานของธาตุในสถานะที่เสถียรที่สุดที่ 298 K และ 1 bar กำหนดให้เป็นศูนย์ เช่น $\mathrm{O_2(g)}$, $\mathrm{H_2(g)}$, $\mathrm{C}$ (แกรไฟต์)'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.thermochem.enthalpy-hess.p006
    topics: [chemistry.thermochem.enthalpy-hess]
    difficulty: 3
    type: numeric
    stem: 'เมเทน (มีในแก๊สชีวภาพ) เผาไหม้ในเตาหุงต้ม ไอน้ำที่เกิดขึ้นออกไปกับแก๊สร้อนโดยไม่ควบแน่น จึงเขียนสมการเป็น $\mathrm{CH_4(g) + 2O_2(g) \rightarrow CO_2(g) + 2H_2O(g)}$ จงคำนวณ $\Delta H^\circ_{rxn}$ จากค่า $\Delta H^\circ_f$: $\mathrm{CO_2(g)}$ = −393.5, $\mathrm{H_2O(g)}$ = −241.8, $\mathrm{H_2O(l)}$ = −285.8, $\mathrm{CH_4(g)}$ = −74.8 kJ/mol (ตอบเป็น kJ/mol)'
    answer: { value: -802.3, tolerance: 0.2, unit: kJ/mol }
    hints:
      - 'ใช้สูตร $\Delta H^\circ_{rxn} = \sum n\,\Delta H^\circ_f(\mathrm{products}) - \sum n\,\Delta H^\circ_f(\mathrm{reactants})$'
      - 'ดูสถานะของน้ำในสมการให้ดี แล้วเลือกค่า $\Delta H^\circ_f$ ให้ตรงสถานะ และคูณด้วยสัมประสิทธิ์ 2'
      - '$\mathrm{O_2}$ เป็นธาตุจึงมี $\Delta H^\circ_f = 0$'
    misconceptions:
      - { match: -890.3, feedback: 'ใช้ $\mathrm{H_2O(l)}$ (−285.8 ต่อโมล) ทั้งที่ในสมการนี้น้ำเป็นไอ $\mathrm{H_2O(g)}$' }
      - { match: 802.3, feedback: 'สลับผลิตภัณฑ์กับสารตั้งต้นในสูตร ผลิตภัณฑ์ต้องถูกลบด้วยสารตั้งต้นเสมอ' }
    solution: '$\Delta H^\circ_{rxn} = [(-393.5) + 2(-241.8)] - [(-74.8) + 2(0)] = -877.1 + 74.8 = -802.3$ kJ/mol คายความร้อน ค่านี้น้อยกว่ากรณีที่น้ำควบแน่นเป็นของเหลว (−890.3 kJ/mol) อยู่ 88.0 kJ เพราะไม่ได้ความร้อนจากการควบแน่นของไอน้ำ 2 โมล'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.thermochem.enthalpy-hess.p007
    topics: [chemistry.thermochem.enthalpy-hess]
    difficulty: 3
    type: numeric
    stem: 'แก๊สหุงต้ม (LPG) ส่วนใหญ่เป็นโพรเพน $\mathrm{C_3H_8}$ เผาไหม้สมบูรณ์ตามสมการ $\mathrm{C_3H_8(g) + 5O_2(g) \rightarrow 3CO_2(g) + 4H_2O(l)}$ จาก $\Delta H^\circ_f$: $\mathrm{C_3H_8(g)}$ = −103.8, $\mathrm{CO_2(g)}$ = −393.5, $\mathrm{H_2O(l)}$ = −285.8 kJ/mol ความร้อนที่คายต่อกิโลกรัมของ $\mathrm{C_3H_8}$ เป็นกี่ MJ/kg กำหนด $M(\mathrm{C_3H_8}) = 44.10$ g/mol (ตอบเป็น MJ/kg)'
    answer: { value: 50.34, tolerance: 0.05, unit: MJ/kg }
    hints:
      - 'คำนวณ $\Delta H^\circ_{rxn}$ ต่อโมลของ $\mathrm{C_3H_8}$ ก่อน (ค่าจะเป็นลบ)'
      - 'ค่าที่ได้เป็น kJ ต่อโมล ถ้าหารด้วยมวลโมลาร์ที่เป็นกรัมต่อโมล จะได้ kJ ต่อกรัม ซึ่งเท่ากับ MJ ต่อกิโลกรัม'
    misconceptions:
      - { match: 50338, feedback: 'หน่วย kJ/kg ใหญ่กว่า MJ/kg 1,000 เท่า ต้องแปลงเป็น MJ/kg' }
    solution: '$\Delta H^\circ_{rxn} = [3(-393.5) + 4(-285.8)] - [-103.8] = -2219.9$ kJ/mol ต่อกรัม $= 2219.9 \div 44.10 = 50.34$ kJ/g $= 50.34$ MJ/kg'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.thermochem.enthalpy-hess.p008
    topics: [chemistry.thermochem.enthalpy-hess]
    difficulty: 3
    type: numeric
    stem: 'การเผาหินปูนเพื่อทำปูนขาว $\mathrm{CaCO_3(s) \rightarrow CaO(s) + CO_2(g)}$ จาก $\Delta H^\circ_f$: $\mathrm{CaCO_3}$ = −1207.6, $\mathrm{CaO}$ = −635.1, $\mathrm{CO_2}$ = −393.5 kJ/mol จงหา $\Delta H^\circ_{rxn}$ (ตอบเป็น kJ/mol)'
    answer: { value: 179.0, tolerance: 0.2, unit: kJ/mol }
    hints:
      - 'ใช้สูตร ผลรวมของผลิตภัณฑ์ลบด้วยสารตั้งต้น'
      - 'ค่าที่ได้เป็นบวกเพราะปฏิกิริยาต้องรับความร้อนเข้าไป'
    misconceptions:
      - { match: -179.0, feedback: 'สลับเครื่องหมาย เมื่อผลิตภัณฑ์มีค่ามากกว่าสารตั้งต้น ΔH จะเป็นบวก' }
    solution: '$\Delta H^\circ_{rxn} = [(-635.1) + (-393.5)] - (-1207.6) = +179.0$ kJ/mol ปฏิกิริยาดูดความร้อน จึงต้องให้ความร้อนแก่เตาเผาอย่างต่อเนื่อง'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.thermochem.enthalpy-hess.p009
    topics: [chemistry.thermochem.enthalpy-hess]
    difficulty: 3
    type: mcq
    stem: 'ข้อความใดถูกต้องเกี่ยวกับกฎของเฮสส์'
    choices:
      - { id: a, text: 'ΔH ของปฏิกิริยารวมเท่ากับผลรวมของ ΔH ของขั้นย่อยที่ต่อกันเป็นปฏิกิริยานั้น', correct: true, feedback: 'ถูก เอนทัลปีเป็นฟังก์ชันสถานะ จึงไม่ขึ้นกับเส้นทาง' }
      - { id: b, text: 'ΔH ขึ้นกับเส้นทางที่ใช้ในการเปลี่ยนสารตั้งต้นเป็นผลิตภัณฑ์', feedback: 'ผิด เพราะ ΔH เป็นฟังก์ชันสถานะ ไม่ขึ้นกับเส้นทาง' }
      - { id: c, text: 'ต้องวัดการเปลี่ยนแปลงทุกขั้นด้วยเครื่องวัดเท่านั้นจึงใช้ได้', feedback: 'ผิด กฎนี้ให้คำนวณค่าของปฏิกิริยาที่วัดตรงไม่ได้จากค่าที่รู้แล้ว' }
      - { id: d, text: 'ทุกขั้นย่อยต้องมีอุณหภูมิต่างกัน', feedback: 'ผิด ไม่มีเงื่อนไขเรื่องอุณหภูมิ แต่ต้องอ้างอิงที่สภาวะเดียวกัน' }
    hints:
      - 'ตัวเลือกที่ถูกพูดถึงการรวมค่าของขั้นย่อย'
      - 'เอนทัลปีเป็นฟังก์ชันสถานะ คิดว่าขึ้นกับจุดเริ่มต้นและจุดสิ้นสุดอย่างเดียว'
    solution: 'กฎของเฮสส์เป็นผลจากการที่เอนทัลปีเป็นฟังก์ชันสถานะ จึงรวม $\Delta H$ ของขั้นย่อยได้โดยตรงแม้ปฏิกิริยาจริงจะเกิดในหลายขั้น'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.thermochem.enthalpy-hess.p010
    topics: [chemistry.thermochem.enthalpy-hess]
    difficulty: 3
    type: order
    stem: 'เรียงขั้นตอนการคำนวณ $\Delta H^\circ_{rxn}$ จากค่า $\Delta H^\circ_f$ จากขั้นแรกไปขั้นสุดท้าย'
    items:
      - 'เขียนสมการที่ดุลแล้ว'
      - 'นำสัมประสิทธิ์คูณค่า $\Delta H^\circ_f$ ของแต่ละสารตั้งต้นแล้วรวมกัน'
      - 'นำสัมประสิทธิ์คูณค่า $\Delta H^\circ_f$ ของแต่ละผลิตภัณฑ์แล้วรวมกัน'
      - 'ลบผลรวมของสารตั้งต้นออกจากผลรวมของผลิตภัณฑ์'
      - 'ตรวจเครื่องหมายและหน่วย แล้วตีความว่าเป็นปฏิกิริยาคายหรือดูดความร้อน'
    hints:
      - 'ต้องรู้สัมประสิทธิ์ของทุกสารก่อนจึงคูณได้'
      - 'สูตรเขียนว่า ผลิตภัณฑ์ ลบ สารตั้งต้น ลำดับการลบสำคัญ'
    solution: 'เริ่มจากดุลสมการ รวมค่าของสารตั้งต้นและผลิตภัณฑ์ตามสัมประสิทธิ์ แล้วลบผลิตภัณฑ์ลบด้วยสารตั้งต้น ตรวจเครื่องหมายว่าเป็นบวกหรือลบ'
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.thermochem.enthalpy-hess.p011
    topics: [chemistry.thermochem.enthalpy-hess]
    difficulty: 4
    type: numeric
