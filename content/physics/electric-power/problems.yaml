    solution: "กำลังความร้อน $= 0.95 \\times 60 = 57\\ \\mathrm{W}$ ใน 1 ชั่วโมง $= 57 \\times 3600 = 205\\,200\\ \\mathrm{J} = 205.2\\ \\mathrm{kJ}$"
