  - id: biology.animals.homeostasis.p014
    topics: [biology.animals.homeostasis]
    difficulty: 4
    type: mcq
    stem: "นักเรียนต้องการหาหลักฐานว่าการป้อนกลับเชิงลบทำให้อัตราชีพจรกลับสู่ระดับปกติหลังออกกำลังกาย แผนการทดลองใดดีที่สุด"
    choices:
