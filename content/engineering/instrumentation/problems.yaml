- id: engineering.electrical.instrumentation.p017
  topics:
  - engineering.electrical.instrumentation
  difficulty: 5
  type: numeric
  stem: จากผลวัดแรงดันขาออกของบริดจ์ในโจทย์แรก $V_{out} = 0.02066\ \mathrm{V}$ เมื่อจ่าย $S = 5\ \mathrm{V}$ และ $R_0 = 120\ \Omega$ ค่าของเซนเซอร์ $R_x$ เป็นกี่โอห์ม (ตอบในหน่วย Ω ทศนิยม 1 ตำแหน่ง)
  answer:
    value: 122.0
    tolerance: 0.1
    unit: Ω
  misconceptions:
  - match: 121.0
    feedback: ใช้ $v$ แทน $2v$ ในสูตร
  - match: 118.0
    feedback: สลับเครื่องหมายในวงเล็บ
  hints:
  - ใช้ผลของโจทย์เชิงพีชคณิต $x = \dfrac{r(2v+s)}{s-2v}$
  - แทน $v = 0.02066$, $s = 5$, $r = 120$
  - ค่าที่ได้ควรใกล้ $R_x = 122\ \Omega$ ที่ใช้สร้างผล
  solution: $R_x = \dfrac{120(2 \times 0.02066 + 5)}{5 - 2 \times 0.02066} = \dfrac{604.96}{4.95868} \approx 122.0\ \Omega$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: engineering.electrical.instrumentation.p018
