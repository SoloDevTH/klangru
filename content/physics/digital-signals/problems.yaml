      - "ข้อใดเป็นจุดเด่นของดิจิทัล ไม่ใช่ข้อจำกัด"
    solution: "ข้อ ก ข ค เป็นข้อจำกัดจริง: ความเป็นส่วนตัว การล้าสมัยของรูปแบบไฟล์ และรายละเอียดที่หายไปจากการสุ่มวัดกับการแปลงเป็นระดับ ส่วนข้อ ง เป็นปัญหาของสำเนาแอนะล็อก"
