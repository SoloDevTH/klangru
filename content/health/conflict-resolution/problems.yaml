  - แอลกอฮอล์ทำให้ควบคุมอารมณ์ได้ยาก
  solution: ให้ถอยออกจากสถานการณ์ ไม่เข้าร่วม และแจ้งผู้ใหญ่หรือตำรวจ 191 ถ้ามีคนเจ็บโทร 1669 เพื่อไม่ให้มีใครบาดเจ็บเพิ่ม
