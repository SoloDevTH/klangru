  - { title: "คำสั่ง สพฐ. ที่ 921/2561 เรื่อง ยกเลิกมาตรฐานการเรียนรู้และตัวชี้วัด สาระที่ 2 การออกแบบและเทคโนโลยี และสาระที่ 3 เทคโนโลยีสารสนเทศและการสื่อสาร ในกลุ่มสาระการเรียนรู้การงานอาชีพและเทคโนโลยี และเปลี่ยนชื่อกลุ่มสาระการเรียนรู้ (3 พฤษภาคม 2561) (เผยแพร่ซ้ำโดย สพป.ชุมพร เขต 1 ในหน้า https://sites.google.com/cpn1.go.th/curriculum)", url: "https://drive.google.com/file/d/1qFMCcb3tmZY58EZywPGqrjQRrqHChF86/view", publisher: "สำนักงานคณะกรรมการการศึกษาขั้นพื้นฐาน", retrieved: "2026-10-24", pages: "1-2" }
