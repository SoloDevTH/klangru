  hints:
  - กระแสเฉลี่ย = (80 × 2 + 0.5 × 58) ÷ 60
  - เวลา (ชั่วโมง) = 2,000 ÷ กระแสเฉลี่ย แล้วหารด้วย 24
  solution: กระแสเฉลี่ย $(80 \times 2 + 0.5 \times 58) \div 60 = 189 \div 60 = 3.15$ mA · เวลา $2000 \div 3.15 \approx 635$ ชั่วโมง $\approx 26.5$ วัน การพักเครื่องช่วยให้แบตเตอรี่อยู่ได้นานขึ้นมาก
