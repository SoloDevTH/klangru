id: english.grammar.present-perfect
subject: english
title: { th: Present perfect (ปัจจุบันกาลสมบูรณ์), en: Present perfect }
summary: ใช้ have หรือ has กับกริยาช่องที่ 3 บอกประสบการณ์ สิ่งที่ทำแล้วหรือยังไม่ได้ทำ และเรื่องที่ต่อเนื่องถึงตอนนี้ด้วย since และ for แยกให้ออกจาก past simple
difficulty: 3
minutes: 35
prerequisites: [english.grammar.past-simple]
encompasses:
  - { id: english.grammar.past-simple, weight: 0.4 }
  - { id: english.grammar.present-simple, weight: 0.1 }
curriculum_tags: []
lessons:
  - type: figure
    src: present-perfect-timeline.svg
    alt: "เส้นเวลา present perfect สามแบบ แต่ละเส้นมีขีดแดงบอกตอนนี้ 1) ประสบการณ์ I have been to Japan twice. มีกากบาท 2 จุดในอดีตโดยไม่ระบุเวลา และวงเล็บช่วงชีวิตจนถึงตอนนี้ 2) I have lived here since 2020 / for 6 years. แถบทึบเริ่มที่จุด since 2020 ยาวมาถึงตอนนี้ และวงเล็บใต้แถบเขียนว่า for 6 years ความยาวช่วงเวลา 3) The bus has just left. กากบาทจุดเดียวอยู่ชิดก่อนตอนนี้ เขียนว่า just"
    caption: "present perfect เชื่อมอดีตกับตอนนี้เสมอ: ประสบการณ์ สิ่งที่ยังต่อเนื่อง และสิ่งที่เพิ่งเกิด"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: เปลี่ยนเป็นปฏิเสธและคำถามด้วย yet
    problem: "ประโยคตั้งต้น *Ton has finished his homework.* เปลี่ยนเป็นประโยคปฏิเสธและคำถามที่มี yet"
    steps:
      - text: "ประธาน Ton = he จึงใช้ has (ไม่ใช่ have)"
      - text: "ปฏิเสธ: ใส่ not หลัง has ได้ hasn't แล้วกริยาช่องที่ 3 คงเดิม และใส่ yet ท้ายประโยค"
        why: "has เป็นกริยาช่วย สร้างปฏิเสธเองได้ ไม่ต้องใช้ doesn't"
      - text: "คำถาม: ย้าย Has ขึ้นหน้าประธาน แล้วใส่ yet ท้ายประโยค"
      - text: "ตอบสั้น: Yes, he has. / No, he hasn't."
    answer: "*Ton **hasn't finished** his homework **yet**.* · ***Has** Ton **finished** his homework **yet**?*"
  - { type: check, problem: eng.perf.p019, prompt: "ลองวาง just ให้ถูกตำแหน่ง" }
  - type: worked-example
    title: เขียนประโยคด้วย since และ for จากข้อมูลจริง
    problem: "คุณยายย้ายมาอยู่นครศรีธรรมราชเมื่อ ค.ศ. 1998 และยังอยู่ที่นั่น ถ้าปีนี้คือ ค.ศ. 2026 จงเขียนประโยค present perfect หนึ่งประโยคด้วย since และอีกหนึ่งประโยคด้วย for"
    steps:
      - text: "คุณยายเริ่มอยู่ในอดีตและยังอยู่ถึงตอนนี้ จึงใช้ present perfect: Grandma + has + lived"
        why: "ถ้าใช้ past simple (Grandma lived...) จะแปลว่าตอนนี้ไม่ได้อยู่แล้ว"
      - text: "since ตามด้วยจุดเริ่มต้น: since 1998"
      - text: "for ตามด้วยความยาวของช่วงเวลา: $2026 - 1998 = 28$ ปี"
      - text: "ตรวจว่าไม่มีคำบอกเวลาที่จบแล้ว เช่น ago หรือ in 1998 อยู่ในประโยค present perfect"
    answer: "*Grandma has lived in Nakhon Si Thammarat since 1998.* · *Grandma has lived in Nakhon Si Thammarat for 28 years.*"
  - { type: check, problem: eng.perf.p016, prompt: "ลองแปลง since เป็น for ด้วยตัวเอง" }
glossary:
  - { term: present perfect, definition: "รูป have/has + กริยาช่องที่ 3 ใช้กับอดีตที่ยังเชื่อมกับปัจจุบัน เช่น ประสบการณ์ หรือเรื่องที่ยังเป็นอยู่ถึงตอนนี้" }
  - { term: กริยาช่องที่ 3 (past participle), definition: "รูปกริยาที่ใช้หลัง have/has กริยาปกติเติม -ed ส่วนกริยาไม่ปกติต้องจำ เช่น eat → eaten, go → gone" }
  - { term: since / for, definition: "since ตามด้วยจุดเริ่มต้นของเวลา (since 2015) ส่วน for ตามด้วยความยาวของช่วงเวลา (for ten years)" }
flashcards:
  - { front: "โครงสร้าง present perfect", back: "have / has + กริยาช่องที่ 3 เช่น She has eaten. / Have you seen it?" }
  - { front: "since กับ for ต่างกันอย่างไร", back: "since + จุดเริ่มต้น (since Monday) · for + ช่วงเวลา (for three days)" }
  - { front: "has been to กับ has gone to ต่างกันอย่างไร", back: "been = เคยไปและกลับมาแล้ว · gone = ไปแล้วและยังอยู่ที่นั่น" }
  - { front: "I ___ (visit) Phuket last year.", back: "visited เพราะ last year เป็นเวลาที่จบแล้ว ต้องใช้ past simple" }
  - { front: "already กับ yet วางตรงไหน", back: "already มักอยู่ระหว่าง have กับ V3 ในประโยคบอกเล่า · yet อยู่ท้ายประโยคปฏิเสธและคำถาม" }
