<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="440" height="320" font-family="sans-serif"><title>ระนาบรูปสี่เหลี่ยมด้านขนาน มีจุด P₀ อยู่บนระนาบ เวกเตอร์แนวฉาก n ชี้ขึ้นจาก P₀ ตั้งฉากกับระนาบ จุด P อีกจุดบนระนาบ เวกเตอร์ P₀P อยู่ในระนาบและตั้งฉากกับ n จึงได้สมการ n · (P − P₀) = 0</title><defs><marker id="arr2a8a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a8a3a"/></marker><marker id="arrc0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="440" height="320" fill="#fff"/><polygon points="185.4,160.9 32.6,249.1 284.6,249.1 437.4,160.9" fill="#1f5fa8" fill-opacity="0.12" stroke="#1f5fa8" stroke-width="1.5"/>
<line x1="193.0" y1="205.0" x2="272.4" y2="227.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrc0392b)"/>
<line x1="193.0" y1="205.0" x2="193.0" y2="70.6" stroke="#2a8a3a" stroke-width="2.8" marker-end="url(#arr2a8a3a)"/>
<circle cx="193.0" cy="205.0" r="4" fill="#222" stroke="none" stroke-width="1.5"/>
<circle cx="272.4" cy="227.0" r="4" fill="#222" stroke="none" stroke-width="1.5"/>
<text x="183.0" y="211.0" font-size="13" fill="#222" text-anchor="end" font-weight="normal">P₀(x₀, y₀, z₀)</text>
<text x="280.4" y="243.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">P(x, y, z)</text>
<text x="203.0" y="76.6" font-size="15" fill="#2a8a3a" text-anchor="start" font-weight="bold">n = ⟨a, b, c⟩</text>
<polyline points="205.5,208.5 205.5,187.5 193.0,184.0" fill="none" fill-opacity="1" stroke="#444" stroke-width="1.2"/>
<text x="20.0" y="295.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal">n · (P − P₀) = 0  →  a(x − x₀) + b(y − y₀) + c(z − z₀) = 0</text></svg>