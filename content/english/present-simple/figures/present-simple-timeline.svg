<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="sans-serif">
<title>เส้นเวลาของ present simple: กิจวัตรและความจริงทั่วไป</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect x="0" y="0" width="720" height="300" fill="#fff"/>
<text x="20.0" y="30.0" font-size="16" text-anchor="start" fill="#111" font-weight="bold" >1) กิจวัตร: I jog every morning.</text>
<line x1="30.0" y1="80.0" x2="690.0" y2="80.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/><line x1="400.0" y1="64.0" x2="400.0" y2="96.0" stroke="#c0392b" stroke-width="2.5" /><text x="400.0" y="114.0" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold" >now (ตอนนี้)</text><text x="34.0" y="114.0" font-size="13" text-anchor="start" fill="#555" font-weight="normal" >past (อดีต)</text><text x="686.0" y="114.0" font-size="13" text-anchor="end" fill="#555" font-weight="normal" >future (อนาคต)</text>
<line x1="62.0" y1="72.0" x2="78.0" y2="88.0" stroke="#1f4e9c" stroke-width="3" /><line x1="62.0" y1="88.0" x2="78.0" y2="72.0" stroke="#1f4e9c" stroke-width="3" />
<line x1="122.0" y1="72.0" x2="138.0" y2="88.0" stroke="#1f4e9c" stroke-width="3" /><line x1="122.0" y1="88.0" x2="138.0" y2="72.0" stroke="#1f4e9c" stroke-width="3" />
<line x1="182.0" y1="72.0" x2="198.0" y2="88.0" stroke="#1f4e9c" stroke-width="3" /><line x1="182.0" y1="88.0" x2="198.0" y2="72.0" stroke="#1f4e9c" stroke-width="3" />
<line x1="242.0" y1="72.0" x2="258.0" y2="88.0" stroke="#1f4e9c" stroke-width="3" /><line x1="242.0" y1="88.0" x2="258.0" y2="72.0" stroke="#1f4e9c" stroke-width="3" />
<line x1="302.0" y1="72.0" x2="318.0" y2="88.0" stroke="#1f4e9c" stroke-width="3" /><line x1="302.0" y1="88.0" x2="318.0" y2="72.0" stroke="#1f4e9c" stroke-width="3" />
<line x1="362.0" y1="72.0" x2="378.0" y2="88.0" stroke="#1f4e9c" stroke-width="3" /><line x1="362.0" y1="88.0" x2="378.0" y2="72.0" stroke="#1f4e9c" stroke-width="3" />
<line x1="422.0" y1="72.0" x2="438.0" y2="88.0" stroke="#1f4e9c" stroke-width="3" /><line x1="422.0" y1="88.0" x2="438.0" y2="72.0" stroke="#1f4e9c" stroke-width="3" />
<line x1="482.0" y1="72.0" x2="498.0" y2="88.0" stroke="#1f4e9c" stroke-width="3" /><line x1="482.0" y1="88.0" x2="498.0" y2="72.0" stroke="#1f4e9c" stroke-width="3" />
<line x1="542.0" y1="72.0" x2="558.0" y2="88.0" stroke="#1f4e9c" stroke-width="3" /><line x1="542.0" y1="88.0" x2="558.0" y2="72.0" stroke="#1f4e9c" stroke-width="3" />
<line x1="602.0" y1="72.0" x2="618.0" y2="88.0" stroke="#1f4e9c" stroke-width="3" /><line x1="602.0" y1="88.0" x2="618.0" y2="72.0" stroke="#1f4e9c" stroke-width="3" />
<text x="400.0" y="54.0" font-size="13" text-anchor="middle" fill="#1f4e9c" font-weight="normal" >ทำซ้ำเป็นประจำ ทั้งก่อนหน้า ตอนนี้ และต่อไป</text>
<text x="20.0" y="175.0" font-size="16" text-anchor="start" fill="#111" font-weight="bold" >2) ความจริงทั่วไป: Water boils at 100 °C.</text>
<rect x="30.0" y="216.0" width="650.0" height="18.0" fill="#cfe3f7" stroke="none" stroke-width="0" />
<line x1="30.0" y1="225.0" x2="690.0" y2="225.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/><line x1="400.0" y1="209.0" x2="400.0" y2="241.0" stroke="#c0392b" stroke-width="2.5" /><text x="400.0" y="259.0" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold" >now (ตอนนี้)</text><text x="34.0" y="259.0" font-size="13" text-anchor="start" fill="#555" font-weight="normal" >past (อดีต)</text><text x="686.0" y="259.0" font-size="13" text-anchor="end" fill="#555" font-weight="normal" >future (อนาคต)</text>
<text x="400.0" y="201.0" font-size="13" text-anchor="middle" fill="#1f4e9c" font-weight="normal" >จริงเสมอ ไม่ขึ้นกับเวลา</text>
</svg>
