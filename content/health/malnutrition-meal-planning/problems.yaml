problems:
- id: health.nutrition.malnutrition-meal-planning.p001
  topics:
  - health.nutrition.malnutrition-meal-planning
  difficulty: 1
  type: mcq
  stem: การขาดวิตามินซีทำให้เกิดอาการใด
  choices:
  - id: a
    text: เลือดออกตามไรฟัน แผลหายช้า
    correct: true
  - id: b
    text: มองไม่เห็นในที่มืด
    feedback: เป็นอาการของการขาดวิตามินเอ
  - id: c
    text: คอพอก
    feedback: เป็นอาการของการขาดไอโอดีน
  hints:
  - วิตามินซีพบมากในฝรั่ง ส้ม มะละกอ
  - อาการเกี่ยวกับเหงือกและแผล
  solution: การขาดวิตามินซีทำให้เลือดออกตามไรฟันและแผลหายช้า ป้องกันได้ด้วยผักสดและผลไม้ เช่น ฝรั่ง ส้ม มะละกอ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.nutrition.malnutrition-meal-planning.p002
  topics:
  - health.nutrition.malnutrition-meal-planning
  difficulty: 1
  type: mcq
  stem: ข้อใดถูกต้องเกี่ยวกับภาวะทุพโภชนาการ
  choices:
  - id: a
    text: มีทั้งแบบขาดและแบบเกิน
    correct: true
  - id: b
    text: หมายถึงคนผอมเท่านั้น
    feedback: โรคอ้วนก็เป็นภาวะทุพโภชนาการแบบเกิน
  - id: c
    text: เกิดเฉพาะในประเทศยากจน
    feedback: WHO รายงานว่าทั้งขาดและเกินพบได้ทั่วโลก บางครั้งในครอบครัวเดียวกัน
  hints:
  - คำว่า "ทุพ" แปลว่าไม่ดี
  - WHO แบ่งเป็นสองด้าน
  solution: ภาวะทุพโภชนาการคือการได้สารอาหารไม่เหมาะสม มีทั้งแบบขาด (ผอม เตี้ย ขาดวิตามินแร่ธาตุ) และแบบเกิน (น้ำหนักเกิน โรคอ้วน)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.nutrition.malnutrition-meal-planning.p003
  topics:
  - health.nutrition.malnutrition-meal-planning
  difficulty: 2
  type: match
  stem: จับคู่สารอาหารที่ขาดกับอาการ
  pairs:
  - left: เหล็ก
    right: โลหิตจาง เหนื่อยง่าย
  - left: ไอโอดีน
    right: คอพอก
  - left: วิตามินเอ
    right: มองไม่เห็นในที่มืด
  - left: วิตามินบี 1
    right: เหน็บชา ชาปลายมือปลายเท้า
  hints:
  - ต่อมไทรอยด์ต้องใช้แร่ธาตุชนิดหนึ่ง
  - แร่ธาตุที่เป็นส่วนประกอบของเม็ดเลือดแดง
  solution: ขาดเหล็กเกิดโลหิตจาง ขาดไอโอดีนเกิดคอพอก ขาดวิตามินเอมองไม่เห็นในที่มืด และขาดวิตามินบี 1 เกิดเหน็บชา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.nutrition.malnutrition-meal-planning.p004
  topics:
  - health.nutrition.malnutrition-meal-planning
  difficulty: 2
  type: numeric
  stem: จากตาราง มื้อกลางวันของภูมิให้พลังงานกี่กิโลแคลอรี (ตอบเป็นกิโลแคลอรี)
  figure: &id001
    src: menu-day.svg
    alt: ตารางรายการอาหาร 1 วันของภูมิ อายุ 13 ปี ค่าสมมติสำหรับฝึกคำนวณ เช้า ข้าวต้มหมูใส่ไข่ คาร์โบไฮเดรต 45 กรัม โปรตีน 18 กรัม ไขมัน 10 กรัม ราคา 35 บาท กลางวัน ข้าวกะเพราไก่ไข่ดาว คาร์โบไฮเดรต 80 โปรตีน 30 ไขมัน 25 ราคา 45 บาท ว่าง นมจืด 1 กล่อง คาร์โบไฮเดรต 12 โปรตีน 8 ไขมัน 8 ราคา 12 บาท เย็น ข้าวสวย แกงจืดเต้าหู้ ผัดผัก ปลาทู คาร์โบไฮเดรต 85 โปรตีน 30 ไขมัน 15 ราคา 40 บาท หมายเหตุ คาร์โบไฮเดรตและโปรตีน 4 kcal/g ไขมัน 9 kcal/g ภูมิเป็นเด็กอายุ 6–13 ปี จึงใช้ธงโภชนาการระดับ 1,600 กิโลแคลอรีต่อวัน
  answer:
    value: 665
    unit: kcal
  misconceptions:
  - match: 540
    feedback: ใช้ 4 กับไขมันด้วย ไขมันให้ 9 กิโลแคลอรีต่อกรัม
  - match: 135
    feedback: 135 คือผลรวมของกรัม ต้องคูณด้วยพลังงานต่อกรัมก่อน
  hints:
  - พลังงาน = 4C + 4P + 9F
  - C = 80, P = 30, F = 25
  solution: $4(80) + 4(30) + 9(25) = 320 + 120 + 225 = 665$ กิโลแคลอรี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.nutrition.malnutrition-meal-planning.p005
  topics:
  - health.nutrition.malnutrition-meal-planning
  difficulty: 2
  type: numeric
  stem: จากตาราง ค่าอาหารทั้งวันของภูมิเป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 132
    unit: บาท
  misconceptions:
  - match: 120
    feedback: ลืมรวมนมจืด 12 บาท
  - match: 92
    feedback: ลืมรวมมื้อเย็น 40 บาท
  hints:
  - รวมราคาทุกมื้อรวมมื้อว่าง
  - 35 + 45 + 12 + 40
  solution: $35 + 45 + 12 + 40 = 132$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.nutrition.malnutrition-meal-planning.p006
  topics:
  - health.nutrition.malnutrition-meal-planning
  difficulty: 2
  type: mcq
  stem: ยายของแก้วอายุ 75 ปี ฟันไม่ดี และหมอบอกว่าความดันโลหิตสูง มื้อเย็นใดเหมาะกับยายที่สุด
  choices:
  - id: a
    text: ข้าวต้มปลาใส่ขิง ไข่ตุ๋น และฟักทองนึ่ง ปรุงรสอ่อน
    correct: true
  - id: b
    text: ข้าวขาหมูและผักดอง
    feedback: ขาหมูมีไขมันสูง ผักดองเค็มมาก ไม่เหมาะกับคนความดันโลหิตสูง
  - id: c
    text: ข้าวเหนียวกับหมูแดดเดียวทอด
    feedback: เหนียว เคี้ยวยาก ทอดน้ำมัน และมักเค็ม
  hints:
  - ผู้สูงอายุควรได้อาหารอ่อน เคี้ยวง่าย
  - คนความดันโลหิตสูงควรลดเค็ม
  solution: อาหารอ่อน เคี้ยวง่าย มีโปรตีนคุณภาพดีจากปลาและไข่ มีผัก และรสไม่เค็ม เหมาะกับผู้สูงอายุที่ฟันไม่ดีและความดันโลหิตสูง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.nutrition.malnutrition-meal-planning.p007
  topics:
  - health.nutrition.malnutrition-meal-planning
  difficulty: 3
  type: numeric
  stem: จากตาราง พลังงานทั้งวันของภูมิเป็นกี่กิโลแคลอรี (ตอบเป็นกิโลแคลอรี)
  figure: *id001
  answer:
    value: 1754
    unit: kcal
  misconceptions:
  - match: 1464
    feedback: ใช้ 4 กับไขมันทุกมื้อ ไขมันให้ 9 กิโลแคลอรีต่อกรัม
  - match: 1600
    feedback: 1,600 คือระดับที่แนะนำ โจทย์ให้คำนวณพลังงานจริงจากตาราง
  hints:
  - คำนวณทีละมื้อด้วย 4C + 4P + 9F แล้วรวม
  - "หรือรวมกรัมแต่ละชนิดก่อน: C = 222, P = 86, F = 58"
  solution: เช้า 342 กลางวัน 665 ว่าง 152 เย็น 595 รวม $1{,}754$ กิโลแคลอรี หรือ $4(222) + 4(86) + 9(58) = 888 + 344 + 522 = 1{,}754$ ซึ่งมากกว่าระดับ 1,600 อยู่ 154 กิโลแคลอรี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.nutrition.malnutrition-meal-planning.p008
  topics:
  - health.nutrition.malnutrition-meal-planning
  difficulty: 3
  type: numeric
  stem: จากตาราง พลังงานจากไขมันคิดเป็นร้อยละเท่าใดของพลังงานมื้อกลางวัน (ตอบเป็นร้อยละ ทศนิยม 1 ตำแหน่ง)
  figure: *id001
  answer:
    value: 33.8
    tolerance: 0.3
    unit: "%"
  misconceptions:
  - match: 18.5
    feedback: ใช้กรัมของไขมันเทียบกับกรัมรวม (25 ÷ 135) ต้องเทียบเป็นพลังงาน
  - match: 25
    feedback: 25 คือกรัมของไขมัน ไม่ใช่ร้อยละ
  hints:
  - พลังงานจากไขมัน = 9 × 25
  - หารด้วยพลังงานทั้งมื้อ 665 แล้วคูณ 100
  solution: พลังงานจากไขมัน $9 \times 25 = 225$ กิโลแคลอรี คิดเป็น $\frac{225}{665} \times 100 \approx 33.8\%$ ของมื้อ ส่วนใหญ่มาจากน้ำมันที่ใช้ผัดและทอดไข่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.nutrition.malnutrition-meal-planning.p009
  topics:
  - health.nutrition.malnutrition-meal-planning
  difficulty: 3
  type: mcq
  stem: น้องของต้นกินแต่ข้าว ขนมกรุบกรอบ และน้ำหวาน ไม่กินผักและผลไม้เลย น้องเสี่ยงขาดสารอาหารกลุ่มใดมากที่สุด
  choices:
  - id: a
    text: วิตามิน แร่ธาตุ และใยอาหาร
    correct: true
  - id: b
    text: คาร์โบไฮเดรต
    feedback: ข้าว ขนม และน้ำหวานมีคาร์โบไฮเดรตมาก น้องได้กลุ่มนี้เกินด้วยซ้ำ
  - id: c
    text: ไม่ขาดอะไร เพราะกินอิ่ม
    feedback: อิ่มไม่ได้แปลว่าครบหมู่ อาจได้พลังงานเกินแต่ขาดวิตามินและแร่ธาตุ
  hints:
  - ผักและผลไม้ให้สารอาหารกลุ่มใด
  - คนที่กินพลังงานเกินก็ขาดสารอาหารบางอย่างได้
  solution: การไม่กินผักและผลไม้ทำให้ขาดวิตามิน แร่ธาตุ และใยอาหาร ขณะที่น้ำหวานและขนมทำให้ได้น้ำตาลและพลังงานเกิน จึงอาจมีทั้งขาดและเกินพร้อมกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.nutrition.malnutrition-meal-planning.p010
  topics:
  - health.nutrition.malnutrition-meal-planning
  difficulty: 3
  type: order
  stem: เรียงขั้นการจัดรายการอาหาร 1 วันให้ผู้สูงอายุในบ้าน
  items:
  - กำหนดระดับพลังงานตามวัยและกิจกรรม
  - แบ่งปริมาณอาหารแต่ละหมู่ตามธงโภชนาการ
  - เลือกเมนูอ่อน เคี้ยวง่าย หลากหลาย ตามฤดูกาลและงบประมาณ
  - คำนวณพลังงานและราคาโดยประมาณ
  - ตรวจและปรับรายการ เช่น ลดเค็ม เพิ่มผัก
  hints:
  - เริ่มจากรู้ว่าต้องการพลังงานเท่าไร
  - ปรับแก้หลังคำนวณ
  solution: กำหนดพลังงาน → แบ่งปริมาณตามธงโภชนาการ → เลือกเมนูที่เหมาะ → คำนวณพลังงานและราคา → ตรวจและปรับ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.nutrition.malnutrition-meal-planning.p011
  topics:
  - health.nutrition.malnutrition-meal-planning
  difficulty: 3
  type: text
  stem: การขาดไอโอดีนทำให้ต่อมไทรอยด์โตจนเห็นเป็นก้อนที่คอ เรียกว่าโรคอะไร (ตอบชื่อโรค)
  accepted:
  - คอพอก
  - โรคคอพอก
  misconceptions:
  - match: เหน็บชา
    feedback: เหน็บชาเกิดจากการขาดวิตามินบี 1
  hints:
  - เป็นอาการที่คอ
  - ป้องกันได้ด้วยเกลือเสริมไอโอดีน
  solution: การขาดไอโอดีนทำให้เกิดโรคคอพอก และในเด็กยังกระทบพัฒนาการของสมอง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.nutrition.malnutrition-meal-planning.p012
  topics:
  - health.nutrition.malnutrition-meal-planning
  difficulty: 4
  type: mcq
  stem: แม่ให้ค่าอาหารกลางวันมิ้นท์วันละ 40 บาท ที่โรงอาหารมีตัวเลือกดังนี้ ข้อใดคุ้มค่าทางโภชนาการที่สุด
  choices:
  - id: a
    text: ข้าวไข่เจียวกับผัดผักรวม 30 บาท และกล้วยน้ำว้า 1 ผล 5 บาท
    correct: true
  - id: b
    text: บะหมี่กึ่งสำเร็จรูป 20 บาท และน้ำอัดลม 15 บาท
    feedback: ได้แป้ง น้ำตาล และโซเดียมมาก แต่โปรตีน ผัก และผลไม้น้อย
  - id: c
    text: ขนมกรุบกรอบ 2 ห่อ และชาเย็น รวม 40 บาท
    feedback: ใช้เงินหมดแต่ได้น้ำตาล ไขมัน และโซเดียมสูง ขาดโปรตีนและผัก
  hints:
  - ดูว่าครบกี่หมู่ ไม่ใช่ดูแค่ว่าอิ่ม
  - ราคาถูกก็มีคุณค่าได้ถ้าเลือกดี
  solution: ข้าวไข่เจียวกับผัดผักและกล้วยได้ข้าว ไข่ (โปรตีน) ผัก และผลไม้ ครบเกือบทุกหมู่ในราคา 35 บาท ไม่เกินงบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.nutrition.malnutrition-meal-planning.p013
  topics:
  - health.nutrition.malnutrition-meal-planning
  difficulty: 4
  type: numeric
  stem: ครอบครัวของภูมิมี 4 คน แต่ละคนกินไข่วันละ 1 ฟองเป็นเวลา 7 วัน ถ้าไข่แผงละ 30 ฟองราคา 120 บาท ค่าไข่ที่ใช้จริงใน 7 วันเป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 112
    unit: บาท
  misconceptions:
  - match: 120
    feedback: 120 คือราคาทั้งแผง แต่ใช้จริงเพียง 28 ฟอง
  - match: 28
    feedback: 28 คือจำนวนฟอง ต้องคูณด้วยราคาต่อฟอง
  hints:
  - "หาจำนวนไข่ที่ใช้: 4 × 7"
  - "หาราคาต่อฟอง: 120 ÷ 30"
  solution: ใช้ไข่ $4 \times 7 = 28$ ฟอง ราคาต่อฟอง $120 \div 30 = 4$ บาท ค่าไข่ $28 \times 4 = 112$ บาท ไข่เป็นแหล่งโปรตีนคุณภาพดีที่ประหยัด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.nutrition.malnutrition-meal-planning.p014
  topics:
  - health.nutrition.malnutrition-meal-planning
  difficulty: 4
  type: mcq
  stem: พี่สาวของแนนอายุ 15 ปี เหนื่อยง่าย หน้าซีด ไม่ค่อยมีสมาธิ ประจำเดือนมามาก และไม่กินเนื้อสัตว์หรือผักใบเขียว ข้อใดวิเคราะห์ได้เหมาะสมที่สุด
  choices:
  - id: a
    text: อาจขาดธาตุเหล็กจนโลหิตจาง ควรไปพบแพทย์เพื่อตรวจเลือด และเพิ่มอาหารที่มีเหล็ก เช่น ตับ เลือด เนื้อสัตว์ หรือผักใบเขียว กินคู่ผลไม้ที่มีวิตามินซี
    correct: true
  - id: b
    text: ขาดวิตามินซี ควรกินวิตามินซีเม็ดขนาดสูงเอง
    feedback: อาการเข้ากับโลหิตจางจากการขาดเหล็กมากกว่า และไม่ควรกินวิตามินขนาดสูงเองโดยไม่ปรึกษาผู้เชี่ยวชาญ
  - id: c
    text: เป็นเพราะกินมากเกินไป ควรอดอาหารมื้อเย็น
    feedback: การอดอาหารทำให้ขาดสารอาหารมากขึ้นและไม่เหมาะกับวัยรุ่นที่กำลังเติบโต
  hints:
  - เหนื่อยง่าย หน้าซีด เป็นอาการของโลหิตจาง
  - วัยรุ่นหญิงที่มีประจำเดือนต้องการเหล็กมากขึ้น
  solution: อาการและพฤติกรรมการกินเข้ากับการขาดธาตุเหล็ก แต่ต้องให้แพทย์ตรวจยืนยัน วิตามินซีช่วยให้ร่างกายดูดซึมเหล็กจากพืชได้ดีขึ้น
