topic: engineering.materials.materials-selection
rows:
  - { framework: th-coe-engineering-basics, indicators: ["MET-2.4"], coverage: full, note: "สอนพื้นฐานการเลือกวัสดุธรรมชาติและวัสดุวิศวกรรมภายใต้ข้อจำกัดของการพัฒนาที่ยั่งยืน ได้แก่ ขั้นตอนการเลือก ดัชนีสมรรถนะ แผนภูมิแอชบี การคัดกรองด้วยข้อจำกัด การจัดอันดับด้วยต้นทุนและสิ่งแวดล้อม วัสดุธรรมชาติ และการเลือกร่วมกับกระบวนการ ตัวเลขวัสดุทุกค่าเป็นค่าตัวอย่าง การประเมินวัฏจักรชีวิตเชิงปริมาณยังไม่ได้สอน" }
  - { framework: abet-eac, indicators: ["Materials 1.b"], coverage: partial, note: "สอนการเลือกวัสดุอย่างเป็นระบบ แต่ยังไม่สอนการออกแบบกระบวนการผลิตและการควบคุมคุณภาพ ซึ่งเป็นส่วนหนึ่งของ \"วัสดุ กระบวนการ หรือทั้งสองอย่าง\"" }
