    feedback: ใช้ความถี่ธรรมชาติ $\omega_n$ แทนความถี่ที่เกนสูงสุด ซึ่งต่างกันเมื่อมีการหน่วง
  solution: $\zeta = 0.3$ จึงได้ $\omega_r = \sqrt{1 - 2(0.3)^2} = \sqrt{0.82} \approx 0.9055$
