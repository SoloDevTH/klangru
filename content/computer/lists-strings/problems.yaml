      alt: "สตริง 25/12/2568 แยกเป็นช่องละหนึ่งอักขระ 10 ช่อง จากซ้ายไปขวาคือ 2, 5, /, 1, 2, /, 2, 5, 6, 8 ใต้ช่องมีดัชนี 0 ถึง 9 ตามลำดับ"
