      - { id: b, text: "การจ้องตรงทำให้ภาพตกที่จุดบอด", feedback: "จุดบอดอยู่ห่างแนวสายตาราว 15 องศา การจ้องตรงทำให้ภาพตกที่โฟเวีย" }
      - { id: c, text: "การมองเยื้องทำให้รูม่านตาขยายกว้างขึ้น", feedback: "ขนาดรูม่านตาขึ้นกับความสว่าง ไม่ขึ้นกับทิศที่มอง" }
      - { id: d, text: "โฟเวียมีเซลล์รูปแท่งมากเกินไปจนสัญญาณล้น", feedback: "โฟเวียแทบไม่มีเซลล์รูปแท่ง" }
