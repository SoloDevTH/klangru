    type: mcq
    stem: "บนบิลค่าไฟฟ้า จำนวน \"หน่วย\" ที่ใช้คิดเงินเป็นหน่วยของปริมาณใด"
    choices:
      - { id: a, text: "พลังงาน ($\\mathrm{kWh}$)", correct: true }
      - { id: b, text: "กำลัง ($\\mathrm{kW}$)", feedback: "กำลังบอกว่าใช้พลังงานเร็วเพียงใด แต่การไฟฟ้าเก็บเงินตามพลังงานที่ใช้ไปทั้งหมด คือกำลังคูณเวลา" }
      - { id: c, text: "ความต่างศักย์ ($\\mathrm{V}$)", feedback: "ไฟบ้านมีความต่างศักย์ $220\\ \\mathrm{V}$ เท่าเดิมทุกบ้าน จึงใช้คิดเงินไม่ได้" }
      - { id: d, text: "กระแส ($\\mathrm{A}$)", feedback: "กระแสบอกปริมาณประจุที่ไหลต่อวินาที ไม่ได้รวมเวลาที่ใช้ทั้งเดือน" }
    hints:
      - "1 หน่วย = 1 กิโลวัตต์ × 1 ชั่วโมง"
      - "กำลังคูณเวลาได้ปริมาณใด"
    solution: "1 หน่วยคือ $1\\ \\mathrm{kWh}$ = กำลัง × เวลา = พลังงาน เท่ากับ $3.6 \\times 10^6\\ \\mathrm{J}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.epow.p016
