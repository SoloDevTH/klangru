id: computer.data.visualization
subject: computer
title: { th: การแสดงข้อมูลด้วยภาพและการสื่อสารผลการวิเคราะห์, en: "Data visualization and communicating analysis results" }
summary: เลือกแผนภาพให้ตรงคำถาม ใช้ธรรมเนียมของกราฟอย่างถูกต้อง จับการออกแบบที่ชวนเข้าใจผิด คำนวณความสูงแท่งด้วยโค้ด และสรุปผลการสืบค้นให้ผู้ฟังต่างกลุ่มเข้าใจพร้อมข้อจำกัด
difficulty: 5.5
minutes: 45
prerequisites: [computer.data.data-processing, math.stats.bivariate-data]
encompasses:
  - { id: computer.data.data-processing, weight: 0.3 }
  - { id: math.stats.bivariate-data, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: axis-truncation.svg
    alt: "สองแผนภูมิแท่งแสดงค่าสามค่าเดียวกันคือ 52, 55 และ 58 แผนภูมิซ้ายแกนเริ่มที่ 50 ทำให้แท่งบริการ C สูงราวสี่เท่าของแท่งบริการ A แผนภูมิขวาแกนเริ่มที่ 0 ทำให้ความต่างดูเล็กลงตามจริง"
    caption: "ข้อมูลเดียวกัน แกนต่างกัน ผลการตีความต่างกันมาก (ค่าสมมติ)"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: ตรวจกราฟแท่งยอดขายที่เผยแพร่
    problem: "กราฟแท่งเผยแพร่ยอดขายสองสาขาคือ 2,400 และ 2,600 บาท (ค่าสมมติ) แกนค่าเริ่มที่ 2,300 บาท แท่งของสาขาที่สองสูงกว่าสาขาแรกกี่เท่าบนกราฟที่เห็น และค่าจริงต่างกันกี่เปอร์เซ็นต์"
    steps:
      - text: "ความยาวที่เห็นของสาขาแรก = 2,400 − 2,300 = 100 บาท"
        why: "แกนเริ่มที่ 2,300 จึงต้องลบค่านี้ออกก่อนวัดความยาวแท่ง"
      - text: "ความยาวที่เห็นของสาขาที่สอง = 2,600 − 2,300 = 300 บาท"
      - text: "แท่งที่สองดูสูงกว่าแท่งแรก 300 ÷ 100 = 3 เท่า"
        why: "อัตราส่วนที่ผู้ดูรับรู้ไม่ตรงกับความต่างจริงเลย"
      - text: "ค่าจริงต่างกัน (2,600 − 2,400) ÷ 2,400 × 100 ≈ 8.3%"
        why: "การเปรียบเทียบที่ถูกต้องคือเทียบกับค่าจริงหรือแกนเริ่มที่ศูนย์"
      - text: "แก้โดยเริ่มแกนที่ศูนย์ ซึ่งจะเห็นความต่างประมาณ 8% ตรงตามจริง"
    answer: "กราฟที่เผยแพร่ทำให้ดูสูงกว่าสามเท่า ทั้งที่ยอดขายต่างกันประมาณ 8.3% ควรแก้แกนให้เริ่มที่ศูนย์หรือระบุการตัดแกนอย่างชัดเจน"
  - { type: check, problem: computer.data.visualization.p002, prompt: "จับคู่คำถามกับแผนภาพก่อนอ่านต่อ" }
  - type: worked-example
    title: เขียนสรุปการสืบค้นที่บอกข้อจำกัดด้วย
    problem: "ทีมต้องการตอบคำถามว่านักเรียนพึงพอใจกับระบบรับลงทะเบียนออนไลน์หรือไม่ มีผู้ตอบแบบสอบถามผ่านแอปของโรงเรียน 1,600 คน และ 72% ให้คะแนนพอใจ ควรเขียนสรุปอย่างไร"
    steps:
      - text: "เขียนคำถามและกลุ่มที่ตอบให้ชัด เช่น นักเรียนที่ใช้แอปโรงเรียนและตอบแบบสอบถาม"
        why: "ผู้อ่านต้องรู้ว่าผลนี้เป็นของกลุ่มใดเพื่อไม่ให้ขยายไปทั้งโรงเรียนโดยอัตโนมัติ"
      - text: "ระบุผลหลักให้ชัดพร้อมตัวเลข คือ 72% ของผู้ตอบ 1,600 คนให้คะแนนพอใจ"
      - text: "ระบุข้อจำกัด เช่น ผู้ที่ไม่ได้ใช้แอปไม่ได้ตอบ และผู้ไม่พอใจอาจตอบน้อยกว่า"
        why: "การเลือกกลุ่มตัวอย่างเอนเอียงได้ จึงต้องบอกว่าผลครอบคลุมใดบ้าง"
      - text: "แนบแหล่งข้อมูลและช่วงเวลาที่เก็บเพื่อให้ผู้อ่านตรวจสอบได้"
    answer: "สรุปที่ดีบอกว่าผู้ตอบ 72% พอใจในกลุ่มผู้ใช้แอป พร้อมระบุว่าไม่ครอบคลุมนักเรียนที่ไม่ได้ใช้แอป และบอกแหล่งข้อมูลกับช่วงเวลาที่เก็บ"
  - { type: check, problem: computer.data.visualization.p012, prompt: "ความสัมพันธ์บนแผนภาพกระจายบอกเหตุและผลได้หรือไม่" }
glossary:
  - { term: แผนภูมิแท่ง (bar chart), definition: "แผนภาพที่ใช้ความยาวของแท่งแทนค่า เหมาะกับการเปรียบเทียบหมวดที่แยกจากกัน" }
  - { term: แผนภาพกระจาย (scatter plot), definition: "แผนภาพที่แต่ละจุดแทนหนึ่งหน่วยด้วยค่าของตัวแปรสองตัว ใช้ดูความสัมพันธ์" }
  - { term: ฮิสโทแกรม (histogram), definition: "แผนภาพที่นับจำนวนค่าในแต่ละช่วงที่กว้างเท่ากัน แสดงการกระจายของข้อมูล" }
  - { term: การเลือกเฉพาะบางส่วน (cherry-picking), definition: "การเลือกข้อมูลที่สนับสนุนข้อสรุปและละข้อมูลที่ขัดแย้ง ทำให้ภาพรวมบิดเบือน" }
  - { term: อัตราการจับได้ (recall), definition: "สัดส่วนของกรณีจริงทั้งหมดที่ระบบจับได้ เท่ากับจำนวนที่จับได้จริงหารด้วยจำนวนกรณีจริงทั้งหมด" }
flashcards:
  - { front: "ควรเลือกกราฟแบบใดเมื่อต้องการดูการเปลี่ยนแปลงตามเวลา", back: "กราฟเส้น เพราะเส้นแสดงทิศทางและลำดับเวลาได้ชัด" }
  - { front: "เหตุใดแผนภูมิแท่งจึงควรเริ่มที่ศูนย์", back: "ความยาวแท่งต้องสื่อสัดส่วนของค่า การตัดแกนทำให้ความต่างดูใหญ่เกินจริง" }
  - { front: "ในแกนที่เริ่มที่ 90 แท่งที่ค่า 96 ยาวเท่าไรเมื่อเทียบกับค่า 92", back: "ความยาวที่เห็นคือ 6 เทียบกับ 2 ดังนั้นยาวกว่า 3 เท่า" }
  - { front: "ทำไมความถูกต้องรวมสูงจึงไม่พอ", back: "ซ่อนความผิดพลาดของกลุ่มเฉพาะและประเภทความผิดพลาดที่แตกต่างกันได้" }
