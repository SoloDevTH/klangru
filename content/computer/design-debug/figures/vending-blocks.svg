<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" font-family="sans-serif" font-size="15">
  <title>โปรแกรมบล็อกตู้กดน้ำ ใช้เหตุการณ์ เงื่อนไขแบบรวม และตัวแปร</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="520" height="320" fill="#ffffff"/>
  <path d="M20,30 q42.5,-22 85,-6 L140,24 v42 H52 l-4,5 h-12 l-4,-5 H20 Z" fill="#f5c242" stroke="#b8860b" stroke-width="1.5"/>
  <text x="32.0" y="48.0" font-size="15" text-anchor="start" fill="#3a2a00" font-weight="bold">เมื่อกดปุ่มซื้อ</text>
  <path d="M20,66 L32,66 l4,5 h12 l4,-5 L329.7,66 v36 H68 l-4,5 h-12 l-4,-5 H36 v108 H48 l4,5 h12 l4,-5 H329.7 v30 H68 l-4,5 h-12 l-4,-5 H36 v36 H48 l4,5 h12 l4,-5 H329.7 v22 H52 l-4,5 h-12 l-4,-5 H20 Z" fill="#f0a030" stroke="#b06d10" stroke-width="1.5"/>
  <text x="32.0" y="90.0" font-size="15" text-anchor="start" fill="#fff" font-weight="bold">ถ้า (เงิน ≥ ราคา) และ (น้ำในตู้ &gt; 0) แล้ว</text>
  <path d="M36,102 L48,102 l4,5 h12 l4,-5 L161.7,102 v36 H68 l-4,5 h-12 l-4,-5 H36 Z" fill="#59b36b" stroke="#357a43" stroke-width="1.5"/>
  <text x="48.0" y="126.0" font-size="15" text-anchor="start" fill="#fff" font-weight="bold">ปล่อยน้ำ 1 ขวด</text>
  <path d="M36,138 L48,138 l4,5 h12 l4,-5 L257.4,138 v36 H68 l-4,5 h-12 l-4,-5 H36 Z" fill="#f07d3c" stroke="#b4521f" stroke-width="1.5"/>
  <text x="48.0" y="162.0" font-size="15" text-anchor="start" fill="#fff" font-weight="bold">เปลี่ยน เงิน ทีละ (0 − ราคา)</text>
  <path d="M36,174 L48,174 l4,5 h12 l4,-5 L213.89999999999998,174 v36 H68 l-4,5 h-12 l-4,-5 H36 Z" fill="#f07d3c" stroke="#b4521f" stroke-width="1.5"/>
  <text x="48.0" y="198.0" font-size="15" text-anchor="start" fill="#fff" font-weight="bold">เปลี่ยน น้ำในตู้ ทีละ −1</text>
  <text x="32.0" y="231.0" font-size="15" text-anchor="start" fill="#fff" font-weight="bold">ไม่เช่นนั้น</text>
  <path d="M36,240 L48,240 l4,5 h12 l4,-5 L213.89999999999998,240 v36 H68 l-4,5 h-12 l-4,-5 H36 Z" fill="#59b36b" stroke="#357a43" stroke-width="1.5"/>
  <text x="48.0" y="264.0" font-size="15" text-anchor="start" fill="#fff" font-weight="bold">พูด เงินไม่พอหรือน้ำหมด</text>
</svg>
