# ข้อเสนอหัวข้อวิชาคอมพิวเตอร์ (subject: computer) เพื่อครอบคลุม
#   th-core-2560-science  ว 4.2 วิทยาการคำนวณ (ตัวชี้วัดแกนกลาง ป.1–ม.6)
#   csta-k12-cs           CSTA K–12 Computer Science Standards (Revised 2017) ระดับ 1A–3A (มาตรฐานสำหรับผู้เรียนทุกคน)
#   acm-cs2023            ACM/IEEE-CS/AAAI CS2023 เฉพาะ knowledge unit แกนที่ผู้เรียนเจอก่อน
#                         (SDF, พื้นฐานของ AL, ระบบ AR/SF/OS, เครือข่าย NC, ความปลอดภัย SEC, ข้อมูล DM และ SEP)
#
# ที่มา
# - 13 หัวข้อย้ายมาจาก docs/phase6/proposals-science-core.yaml (เดิมรหัส technology.computing.*) โดยคงตัวชี้วัด ว 4.2 เดิมไว้
#   technology.computing.algorithms-intro ถูกตัดออก เพราะหัวข้อ computer.algorithms.intro ที่เขียนแล้วสอนครบ
#   (ตัวชี้วัด ว 4.2 ป.1/1, ป.1/2, ป.2/1, ป.3/1 ย้ายไปอยู่ใน curriculum/mappings/th-core-2560-science.yaml)
#   รหัสเดิม → รหัสใหม่:
#     technology.computing.digital-data-basics    → computer.data.digital-data-basics
#     technology.computing.safe-ict-primary       → computer.safety.safe-ict-primary
#     technology.computing.programming-intro      → computer.programming.block-programming
#     technology.computing.internet-search        → computer.data.internet-search
#     technology.computing.logical-reasoning      → computer.algorithms.logical-reasoning
#     technology.computing.programming-logic      → computer.programming.design-debug (ปรับขอบเขต เพราะตัวแปร เงื่อนไข และวงวน
#                                                    สอนแล้วใน computer.programming.basics เหลือการออกแบบ เขียน ทดสอบ และแก้โปรแกรมเอง)
#     technology.computing.computational-thinking → computer.algorithms.computational-thinking
#     technology.computing.programming-functions  → computer.programming.functions
#     technology.computing.data-processing        → computer.data.data-processing
#     technology.computing.computer-systems       → computer.systems.computer-systems (การแทนข้อมูลด้วยเลขฐานสองย้ายไปอยู่ใน computer.data.binary)
#     technology.computing.responsible-ict        → computer.society.responsible-ict
#     technology.computing.app-development        → computer.projects.app-development
#     technology.computing.digital-innovation     → computer.projects.digital-innovation
# - 17 หัวข้อใหม่จาก CSTA ระดับ 1A–3A และ CS2023 ที่ ว 4.2 ไม่ได้แยกสอน (ฮาร์ดแวร์ ตรรกะดิจิทัล เครือข่าย ความปลอดภัย
#   การเข้ารหัส ข้อมูลส่วนบุคคล โครงสร้างข้อมูล อัลกอริทึมค้นหาและเรียงลำดับ ฐานข้อมูล การออกแบบที่ทุกคนเข้าถึงได้ และการทำงานเป็นทีม)
# - หัวข้อที่เขียนแล้วในคลัง: computer.data.binary, computer.algorithms.intro, computer.programming.basics
#   มาตรฐานที่หัวข้อเหล่านี้สอนเพียงบางส่วนถูกแนบกับหัวข้อที่เสนอซึ่งจะสอนส่วนที่ขาด
# - เรียงตาม prerequisite: prereq ทุกตัวเป็นหัวข้อที่มีในคลังแล้วหรือหัวข้อที่อยู่ก่อนหน้าในไฟล์นี้
# - difficulty เทียบกับ computer.algorithms.intro 1.5, computer.data.binary 2.5, computer.programming.basics 3
#   และไม่ต่ำกว่า prereq ทุกตัว scope เป็นคำของเรา ไม่ใช่ข้อความจากหลักสูตร
# - engineering.computing.programming-basics ใน proposals-advanced.yaml รวมเข้ากับ computer.programming.functions แล้ว
#   (ตัวชี้วัดของหัวข้อเดิมผูกด้วย extend: ใน proposals-advanced.yaml)
topics:
  # ---------- ระดับต้น ----------
  - { id: computer.society.computing-impacts, title: "คอมพิวเตอร์เปลี่ยนชีวิตและสังคมอย่างไร", difficulty: 2.5, prereq: [computer.data.internet-search],
      indicators: ["csta-k12-cs:1A-IC-16", "csta-k12-cs:1B-IC-18", "csta-k12-cs:2-IC-20", "csta-k12-cs:3A-IC-24",
                   "acm-cs2023:SEP-Context", "acm-cs2023:SEP-History"],
      scope: "การใช้ชีวิตและการทำงานก่อนและหลังมีเทคโนโลยีคอมพิวเตอร์ เทคโนโลยีที่เปลี่ยนโลกและความสัมพันธ์กับวัฒนธรรม ข้อดีข้อเสียของเทคโนโลยีต่อชีวิตประจำวันและอาชีพ และประวัติศาสตร์คอมพิวเตอร์โดยย่อ" }
  # ---------- ระบบคอมพิวเตอร์ ----------
  - { id: computer.systems.computer-systems, title: "ระบบคอมพิวเตอร์และเทคโนโลยีการสื่อสาร", difficulty: 3, prereq: [computer.data.binary, computer.data.digital-data-basics],
      indicators: ["th-core-2560-science:ว 4.2 ม.2/3",
                   "csta-k12-cs:1A-CS-02", "csta-k12-cs:1B-CS-01", "csta-k12-cs:1B-CS-02",
                   "acm-cs2023:SF-Overview", "acm-cs2023:AR-Assembly", "acm-cs2023:AR-Memory", "acm-cs2023:AR-IO"],
      scope: "ฮาร์ดแวร์ ซอฟต์แวร์ และผู้ใช้ หน่วยรับเข้า หน่วยประมวลผลกลาง หน่วยความจำหลักและหน่วยเก็บถาวร หน่วยส่งออก วงรอบดึง ถอดรหัส และทำคำสั่ง ลำดับชั้นหน่วยความจำ และภาพรวมของการสื่อสารข้อมูลระหว่างอุปกรณ์" }
  - { id: computer.systems.troubleshooting, title: "การแก้ปัญหาฮาร์ดแวร์และซอฟต์แวร์อย่างเป็นระบบ", difficulty: 3, prereq: [computer.systems.computer-systems],
      indicators: ["csta-k12-cs:1A-CS-03", "csta-k12-cs:1B-CS-03", "csta-k12-cs:2-CS-03", "csta-k12-cs:3A-CS-03"],
      scope: "การบรรยายอาการเสียด้วยคำศัพท์ที่ถูกต้อง กลยุทธ์แก้ปัญหาทั่วไป (ตรวจสายและไฟ รีสตาร์ต แยกทีละส่วน เปลี่ยนทีละอย่าง) การไล่หาสาเหตุอย่างเป็นระบบ และการเขียนคู่มือแก้ปัญหาให้ผู้อื่นใช้" }
  - { id: computer.systems.operating-systems, title: "ระบบปฏิบัติการและชั้นของซอฟต์แวร์", difficulty: 4.5, prereq: [computer.systems.computer-systems],
      indicators: ["csta-k12-cs:3A-CS-02", "csta-k12-cs:3B-CS-01", "acm-cs2023:OS-Purpose", "acm-cs2023:OS-Principles", "acm-cs2023:SF-Resource"],
      scope: "ชั้นของฮาร์ดแวร์ ซอฟต์แวร์ระบบ และซอฟต์แวร์ประยุกต์ หน้าที่ของระบบปฏิบัติการ (จัดการกระบวนการ หน่วยความจำ อุปกรณ์ ไฟล์ และผู้ใช้) การเรียกใช้บริการของระบบ และการจัดสรรทรัพยากรแบบง่าย เช่น มาก่อนได้ก่อน" }
  # ---------- เครือข่ายและความปลอดภัย ----------
  - { id: computer.networks.internet-basics, title: "เครือข่ายคอมพิวเตอร์และอินเทอร์เน็ต", difficulty: 3.5, prereq: [computer.systems.computer-systems],
      indicators: ["csta-k12-cs:1B-NI-04", "csta-k12-cs:2-NI-04", "csta-k12-cs:3A-NI-04", "acm-cs2023:NC-Fundamentals", "acm-cs2023:NC-Applications"],
      scope: "การแบ่งข้อมูลเป็นแพ็กเก็ตและประกอบกลับที่ปลายทาง โพรโทคอลและชั้นของเครือข่าย ที่อยู่ IP และ DNS เราเตอร์ สวิตช์ และเซิร์ฟเวอร์ ลักษณะการเชื่อมต่อ (topology) แบบลูกข่าย-แม่ข่าย HTTP และความทนทานเมื่อบางเส้นทางเสีย" }
  - { id: computer.society.responsible-ict, title: "การใช้เทคโนโลยีสารสนเทศอย่างปลอดภัย มีจริยธรรม และถูกกฎหมาย", difficulty: 3, prereq: [computer.safety.safe-ict-primary],
      indicators: ["th-core-2560-science:ว 4.2 ม.1/4", "th-core-2560-science:ว 4.2 ม.2/4", "th-core-2560-science:ว 4.2 ม.3/4", "th-core-2560-science:ว 4.2 ม.6/1",
                   "csta-k12-cs:1B-AP-14", "csta-k12-cs:1B-IC-21", "csta-k12-cs:2-AP-16", "csta-k12-cs:3A-AP-20", "csta-k12-cs:3A-IC-28",
                   "acm-cs2023:SEP-IP", "acm-cs2023:SDF-SEP", "acm-cs2023:SEP-Security", "acm-cs2023:SEP-Professional-Ethics"],
      scope: "การใช้สื่อและแหล่งข้อมูลตามข้อตกลง ลิขสิทธิ์ สาธารณสมบัติ สัญญาอนุญาตครีเอทีฟคอมมอนส์และสัญญาอนุญาตซอฟต์แวร์ การอ้างอิงเมื่อนำโค้ดหรือสื่อของผู้อื่นมาใช้ ผลดีผลเสียของกฎหมายทรัพย์สินทางปัญญา พ.ร.บ.คอมพิวเตอร์และอาชญากรรมคอมพิวเตอร์ และผลของเทคโนโลยีสารสนเทศต่ออาชีพ สังคม และวัฒนธรรม" }
  - { id: computer.security.cybersecurity-basics, title: "ความมั่นคงปลอดภัยไซเบอร์เบื้องต้น", difficulty: 4, prereq: [computer.networks.internet-basics, computer.society.responsible-ict],
      indicators: ["csta-k12-cs:2-NI-05", "csta-k12-cs:3A-NI-05", "csta-k12-cs:3A-NI-06", "csta-k12-cs:3A-NI-07", "csta-k12-cs:3A-NI-08",
                   "acm-cs2023:SEC-Foundations", "acm-cs2023:NC-Security"],
      scope: "การรักษาความลับ ความถูกต้องครบถ้วน และความพร้อมใช้ การยืนยันตัวตนหลายปัจจัยและสิทธิ์การเข้าถึง มัลแวร์ ฟิชชิง และวิศวกรรมสังคม มาตรการป้องกันทางกายภาพและดิจิทัล และการชั่งน้ำหนักระหว่างความปลอดภัยกับความสะดวกในการใช้งาน" }
  - { id: computer.security.encryption, title: "การเข้ารหัสลับ", difficulty: 4.5, prereq: [computer.security.cybersecurity-basics, computer.data.binary],
      indicators: ["csta-k12-cs:2-NI-06", "acm-cs2023:SEC-Crypto"],
      scope: "รหัสลับแบบเลื่อนตัวอักษรและแบบแทนที่ การถอดรหัสด้วยการลองทุกกุญแจและการนับความถี่ การเข้ารหัสแบบกุญแจสมมาตรและกุญแจสาธารณะในภาพรวม และการใช้งานจริง เช่น HTTPS" }
  # ---------- อัลกอริทึมและการเขียนโปรแกรม ----------
  - { id: computer.algorithms.computational-thinking, title: "แนวคิดเชิงนามธรรมและแนวคิดเชิงคำนวณ", difficulty: 3, prereq: [computer.algorithms.logical-reasoning],
      indicators: ["th-core-2560-science:ว 4.2 ม.1/1", "th-core-2560-science:ว 4.2 ม.2/1",
                   "csta-k12-cs:1B-AP-11", "csta-k12-cs:2-AP-10", "csta-k12-cs:2-AP-13", "csta-k12-cs:3A-IC-26"],
      scope: "การแยกปัญหาเป็นส่วนย่อย การหารูปแบบ การคัดเฉพาะสาระสำคัญ (แนวคิดเชิงนามธรรม) การออกแบบอัลกอริทึมสำหรับปัญหาที่ซับซ้อนขึ้นด้วยรหัสลำลองหรือผังงาน และการนำอัลกอริทึมเดียวกันไปใช้กับปัญหาในวิชาอื่น" }
  - { id: computer.programming.design-debug, title: "ออกแบบ ทดสอบ และแก้ข้อผิดพลาดของโปรแกรม", difficulty: 3.5, prereq: [computer.programming.basics, computer.programming.block-programming, computer.algorithms.logical-reasoning],
      indicators: ["th-core-2560-science:ว 4.2 ป.4/2", "th-core-2560-science:ว 4.2 ป.5/2", "th-core-2560-science:ว 4.2 ป.6/2",
                   "csta-k12-cs:1B-AP-09", "csta-k12-cs:1B-AP-10", "csta-k12-cs:1B-AP-15", "csta-k12-cs:1B-AP-17", "csta-k12-cs:2-AP-11", "csta-k12-cs:2-AP-12", "csta-k12-cs:2-AP-17", "csta-k12-cs:2-AP-19",
                   "acm-cs2023:SDF-Practices", "acm-cs2023:SE-Validation"],
      scope: "ออกแบบและเขียนโปรแกรมของตัวเองเพื่อแก้ปัญหาในชีวิตประจำวันด้วยตัวแปร เงื่อนไขแบบรวม วงวนซ้อน และเหตุการณ์ (เช่น คลิกหรือกดปุ่ม) การเลือกกรณีทดสอบ (ค่าปกติ ค่าขอบ ค่าผิดรูป) การไล่และแก้ข้อผิดพลาดอย่างเป็นระบบ และการเขียนคอมเมนต์อธิบายโปรแกรม" }
  - { id: computer.data.data-processing, title: "การรวบรวม ประมวลผล และนำเสนอข้อมูล", difficulty: 3, prereq: [computer.data.digital-data-basics, math.stats.data-display],
      indicators: ["th-core-2560-science:ว 4.2 ม.1/3", "th-core-2560-science:ว 4.2 ม.3/2",
                   "csta-k12-cs:1B-DA-06", "csta-k12-cs:1B-DA-07", "csta-k12-cs:2-DA-08", "csta-k12-cs:2-DA-09", "csta-k12-cs:3A-DA-11", "csta-k12-cs:3A-DA-12",
                   "acm-cs2023:DM-Data"],
      scope: "วงจรชีวิตของข้อมูล การเก็บข้อมูลปฐมภูมิด้วยเครื่องมือดิจิทัล การทำความสะอาดและแปลงข้อมูล การจัดการข้อมูลด้วยตารางคำนวณ การนำเสนอด้วยแผนภาพแบบโต้ตอบเพื่อสนับสนุนข้อสรุป และการสร้างและปรับแบบจำลองเชิงคำนวณจากข้อมูล" }
  - { id: computer.society.privacy, title: "ข้อมูลส่วนบุคคลและความเป็นส่วนตัว", difficulty: 3.5, prereq: [computer.society.responsible-ict, computer.data.data-processing],
      indicators: ["csta-k12-cs:2-IC-23", "csta-k12-cs:3A-IC-29", "csta-k12-cs:3A-IC-30", "acm-cs2023:SEP-Privacy"],
      scope: "ข้อมูลที่ระบุตัวบุคคล การเลือกเปิดเผยหรือเก็บข้อมูลเป็นความลับ การเก็บข้อมูลอัตโนมัติที่ผู้ใช้อาจไม่รู้ตัว (คุกกี้ ตำแหน่ง ประวัติการใช้งาน) หลักการของกฎหมายคุ้มครองข้อมูลส่วนบุคคล และผลทางสังคมและเศรษฐกิจของความเป็นส่วนตัว" }
  - { id: computer.society.inclusive-design, title: "การออกแบบเทคโนโลยีให้ทุกคนใช้ได้", difficulty: 3.5, prereq: [computer.society.computing-impacts],
      indicators: ["csta-k12-cs:1B-IC-19", "csta-k12-cs:1B-IC-20", "csta-k12-cs:2-CS-01", "csta-k12-cs:2-IC-21", "csta-k12-cs:3A-AP-21", "csta-k12-cs:3A-IC-25",
                   "acm-cs2023:HCI-User", "acm-cs2023:HCI-Accessibility", "acm-cs2023:SEP-DEIA"],
      scope: "การออกแบบที่ยึดผู้ใช้เป็นศูนย์กลาง การสังเกตว่าผู้ใช้ใช้อุปกรณ์อย่างไรแล้วเสนอการปรับปรุง การเข้าถึงได้สำหรับผู้พิการและผู้สูงอายุ อคติในเทคโนโลยีและข้อมูล และการทดสอบกับผู้ใช้ที่หลากหลายเพื่อลดอคติ" }
  - { id: computer.programming.functions, title: "เขียนโปรแกรมแก้ปัญหาด้วยตรรกะและฟังก์ชัน", difficulty: 4, prereq: [computer.programming.design-debug, computer.algorithms.computational-thinking, math.algebra.linear-eq],
      indicators: ["th-core-2560-science:ว 4.2 ม.1/2", "th-core-2560-science:ว 4.2 ม.2/2",
                   "csta-k12-cs:2-AP-14", "csta-k12-cs:3A-AP-17", "csta-k12-cs:3A-AP-18",
                   "acm-cs2023:SDF-Fundamentals"],
      scope: "การเขียนโปรแกรมด้วยภาษาข้อความ (เช่น Python) แก้โจทย์คณิตศาสตร์และวิทยาศาสตร์ การสร้างและเรียกใช้ฟังก์ชันที่มีพารามิเตอร์และค่าที่คืน ขอบเขตของตัวแปร การแยกโปรแกรมเป็นฟังก์ชันและโมดูล และการเรียกซ้ำเบื้องต้น" }
