      - { match: 169, feedback: "นั่นคือ $d^2$ ยังต้องถอดรากที่สอง" }
    solution: "ระยะแนวนอน $= 2 - (-3) = 5$ ระยะแนวตั้ง $= 11 - (-1) = 12$ จึงได้ $d = \\sqrt{5^2 + 12^2} = \\sqrt{169} = 13$ หน่วย"
