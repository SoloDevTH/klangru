  - id: engineering.environmental.sanitation-public-health.p013
    topics:
      - engineering.environmental.sanitation-public-health
    difficulty: 4
    type: numeric
    stem: (ข้อมูลสมมติ) ในการระบาดท้องร่วงมีผู้ป่วยทั้งหมด 36 ราย ในจำนวนนี้ 30 รายดื่มน้ำบ่อ และผู้เสียชีวิต 1 รายอยู่ในกลุ่มที่ดื่มน้ำบ่อ อัตราป่วยตาย (CFR) ของกลุ่มที่ดื่มน้ำบ่อเป็นกี่เปอร์เซ็นต์ (ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 3.3
      tolerance: 0.05
      unit: '%'
    hints:
      - CFR = จำนวนผู้เสียชีวิต ÷ จำนวนผู้ป่วยในกลุ่มนั้น × 100
      - ตรวจว่าตัวหารเป็นจำนวนผู้ป่วย ไม่ใช่จำนวนประชากร
    misconceptions:
      - match: 2.5
        feedback: หารด้วยจำนวนประชากรที่ดื่มน้ำ ไม่ใช่จำนวนผู้ป่วย CFR ต้องใช้ผู้ป่วยเป็นตัวหาร
    solution: CFR = 1 ÷ 30 × 100 ≈ 3.3% ตัวเลขนี้บอกความรุนแรงของโรคในกลุ่มผู้ป่วย ไม่เหมือนอัตราป่วยที่บอกความเสี่ยงในประชากร
    license: CC-BY-SA-4.0
    ai_assisted: true
