      - { match: "=SUM(B2,B11)", feedback: "ใช้จุลภาค จะบวกแค่ B2 กับ B11 สองเซลล์ ช่วงเซลล์ต้องใช้เครื่องหมายทวิภาค (:)" }
    hints:
      - "สูตรขึ้นต้นด้วยเครื่องหมาย ="
      - "ช่วงเซลล์เขียนเป็น เซลล์แรก:เซลล์สุดท้าย"
    solution: "=SUM(B2:B11) บวกค่าทุกเซลล์ตั้งแต่ B2 ถึง B11"
