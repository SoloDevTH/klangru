id: physics.waves.wave-basics
subject: physics
title: { th: คลื่นกลเบื้องต้น, en: Introduction to mechanical waves }
summary: แยกคลื่นตามขวางกับคลื่นตามยาว รู้จักแอมพลิจูด ความยาวคลื่น ความถี่ คาบ และใช้ความสัมพันธ์ของอัตราเร็วคลื่นกับความถี่และความยาวคลื่น
difficulty: 4
minutes: 30
prerequisites: [physics.kinematics.speed, math.algebra.rearrange-formula]
encompasses:
  - { id: physics.kinematics.speed, weight: 0.3 }
  - { id: math.algebra.rearrange-formula, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: transverse-wave.svg
    alt: "กราฟการกระจัด y (เมตร) กับตำแหน่ง x (เมตร) ของเชือก ณ ขณะหนึ่ง เป็นคลื่นรูปไซน์ตั้งแต่ x = 0 ถึง 2.0 m แอมพลิจูด A = 0.1 m วัดจากแนวสมดุลถึงสัน ความยาวคลื่น λ = 0.8 m วัดจากสันที่ x = 0.2 m ถึงสันถัดไปที่ x = 1.0 m จุด P และ Q อยู่ที่สันสองสันที่ติดกัน จุด R อยู่ที่ท้องคลื่นที่ x = 0.6 m"
    caption: "P กับ Q ห่างกัน $\\lambda$ จึงมีเฟสตรงกัน ส่วน P กับ R ห่างกัน $\\tfrac{\\lambda}{2}$ จึงมีเฟสตรงข้าม"
  - type: worked-example
    title: อ่านค่าจากภาพคลื่นแล้วหาอัตราเร็ว
    problem: "จากภาพคลื่นในเชือกด้านบน ถ้าปลายเชือกถูกสะบัดด้วยความถี่ $2.5\\ \\mathrm{Hz}$ จงหาแอมพลิจูด ความยาวคลื่น คาบ และอัตราเร็วของคลื่น"
    steps:
      - text: "แอมพลิจูดวัดจากแนวสมดุล ($y = 0$) ถึงสัน: $A = 0.1\\ \\mathrm{m}$"
        why: "ไม่ใช่จากท้องถึงสัน ซึ่งยาว $0.2\\ \\mathrm{m}$ เป็นสองเท่าของแอมพลิจูด"
      - text: "ความยาวคลื่นวัดจากสันถึงสันถัดไป: $\\lambda = 1.0 - 0.2 = 0.8\\ \\mathrm{m}$"
        why: "จะวัดจากท้องถึงท้อง หรือจุดตัดแกนที่กำลังขึ้นถึงจุดถัดไปที่กำลังขึ้นก็ได้ ผลเท่ากัน"
      - text: "คาบ: $T = \\dfrac{1}{f} = \\dfrac{1}{2.5} = 0.4\\ \\mathrm{s}$"
      - text: "อัตราเร็ว: $v = f\\lambda = (2.5)(0.8) = 2.0\\ \\mathrm{m/s}$"
    answer: "$A = 0.1\\ \\mathrm{m}$, $\\lambda = 0.8\\ \\mathrm{m}$, $T = 0.4\\ \\mathrm{s}$, $v = 2.0\\ \\mathrm{m/s}$"
  - { type: check, problem: phy.wave.p014, prompt: "ลองอ่านค่าจากภาพคลื่นอีกภาพหนึ่ง" }
  - type: figure
    src: longitudinal-spring.svg
    alt: "ขดสปริงยาวในแนวนอน มือที่ปลายซ้ายดันเข้าและดึงออกตามแนวสปริง ขดสปริงชิดกันเป็นส่วนอัดและห่างกันเป็นส่วนขยายสลับกันไป ความยาวคลื่น λ วัดจากกลางส่วนอัดหนึ่งถึงกลางส่วนอัดถัดไป ลูกศรด้านล่างแสดงว่าคลื่นเคลื่อนที่ไปทางขวา"
    caption: "ในคลื่นตามยาว ความยาวคลื่นคือระยะจากกลางส่วนอัดถึงกลางส่วนอัดถัดไป (หรือส่วนขยายถึงส่วนขยาย)"
  - type: worked-example
    title: เฟสของสองจุดบนเชือก
    problem: "คลื่นในเชือกมีความยาวคลื่น $0.8\\ \\mathrm{m}$ และอัตราเร็ว $2.0\\ \\mathrm{m/s}$ จุด P และจุด R บนเชือกอยู่ห่างกัน $0.4\\ \\mathrm{m}$ ขณะนี้ P อยู่ที่สันคลื่น R อยู่ที่ใด และอีกนานเท่าใด R จะขึ้นไปอยู่ที่สันคลื่น"
    steps:
      - text: "ระยะห่างเทียบกับความยาวคลื่น: $\\dfrac{0.4}{0.8} = \\dfrac{1}{2}$ ความยาวคลื่น"
      - text: "ห่างกันครึ่งความยาวคลื่น จึงเป็นเฟสตรงข้าม เมื่อ P อยู่ที่สัน R อยู่ที่ท้อง"
        why: "เฟสต่างกัน $\\tfrac{1}{2} \\times 360^\\circ = 180^\\circ$ จุดทั้งสองจึงสั่นสวนทางกันตลอด"
      - text: "คาบ: $T = \\dfrac{\\lambda}{v} = \\dfrac{0.8}{2.0} = 0.4\\ \\mathrm{s}$"
      - text: "จากท้องขึ้นไปถึงสันใช้ครึ่งคาบ: $\\tfrac{T}{2} = 0.2\\ \\mathrm{s}$"
        why: "สั่นครบรอบคือ ท้อง → สัน → ท้อง ครึ่งแรกจึงเป็นครึ่งคาบ"
    answer: "R อยู่ที่ท้องคลื่น และจะขึ้นไปถึงสันในอีก $0.2\\ \\mathrm{s}$ ขณะนั้น P จะลงไปอยู่ที่ท้องพอดี"
  - { type: check, problem: phy.wave.p019 }
  - type: interactive
    title: รูปร่างของคลื่นเมื่อเปลี่ยนแอมพลิจูดและความยาวคลื่น
    caption: แกนนอนคือตำแหน่งตามแนวเชือก (m) แกนตั้งคือการกระจัดของเชือกจากแนวสมดุล (m) แถบ a เปลี่ยนแอมพลิจูด ทำให้สันคลื่นสูงขึ้นหรือต่ำลง ส่วนแถบ L เปลี่ยนความยาวคลื่น ทำให้สันคลื่นห่างกันมากขึ้นหรือน้อยลง ลองนับว่าในช่วง 0 ถึง 12 m มีกี่ความยาวคลื่น
    widget:
      kind: function-plot
      functions: ["a \\sin\\left(\\frac{2\\pi x}{L}\\right)"]
      sliders:
        - { name: a, min: 0.5, max: 3, step: 0.5, value: 1, label: แอมพลิจูด (m) }
        - { name: L, min: 1, max: 6, step: 0.5, value: 4, label: ความยาวคลื่น (m) }
      x: [0, 12]
      y: [-4, 4]
  - type: simulation
    title: คลื่นในเส้นเชือก (PhET Wave on a String)
    url: https://phet.colorado.edu/en/simulations/wave-on-a-string
    provider: phet
    note: เลือกโหมดสั่นต่อเนื่อง (Oscillate) และปลายเชือกแบบไม่สะท้อน (No End) เปลี่ยนความถี่แล้ววัดความยาวคลื่นด้วยไม้บรรทัด จะเห็นว่าความถี่มากขึ้นทำให้ความยาวคลื่นสั้นลง ส่วนการเปลี่ยนความตึงของเชือกจะเปลี่ยนอัตราเร็วคลื่น
glossary:
  - { term: คลื่นตามขวาง, definition: "คลื่นที่อนุภาคของตัวกลางสั่นในทิศตั้งฉากกับทิศการเคลื่อนที่ของคลื่น เช่น คลื่นในเส้นเชือก" }
  - { term: คลื่นตามยาว, definition: "คลื่นที่อนุภาคของตัวกลางสั่นในทิศเดียวกับทิศการเคลื่อนที่ของคลื่น เช่น คลื่นเสียง" }
  - { term: ความยาวคลื่น, definition: "ระยะระหว่างสันคลื่นสองสันที่อยู่ติดกัน ใช้สัญลักษณ์ $\\lambda$ หน่วยเมตร" }
  - { term: ความถี่, definition: "จำนวนรอบของการสั่นในหนึ่งวินาที หน่วยเฮิรตซ์ ($\\mathrm{Hz}$)" }
flashcards:
  - { front: "สมการอัตราเร็วคลื่น", back: "$v = f\\lambda = \\dfrac{\\lambda}{T}$" }
  - { front: "ความสัมพันธ์ของคาบกับความถี่", back: "$T = \\dfrac{1}{f}$ เช่น $f = 4\\ \\mathrm{Hz}$ ได้ $T = 0.25\\ \\mathrm{s}$" }
  - { front: "คลื่นตามขวางต่างจากคลื่นตามยาวอย่างไร", back: "ตามขวาง: อนุภาคสั่นตั้งฉากกับทิศของคลื่น · ตามยาว: อนุภาคสั่นขนานกับทิศของคลื่น" }
  - { front: "สะบัดเชือกเส้นเดิมให้ถี่ขึ้น อะไรเปลี่ยน", back: "อัตราเร็วคลื่นเท่าเดิม (ขึ้นกับตัวกลาง) ความยาวคลื่นสั้นลง" }
