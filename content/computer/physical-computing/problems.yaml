  - id: computer.systems.physical-computing.p013
    topics: [computer.systems.physical-computing]
    difficulty: 4
    type: mcq
    stem: "ระบบรดน้ำรุ่นแรกเปิดปั๊มเมื่อความชื้นต่ำกว่า 30% และปิดเมื่อถึง 30% ขึ้นไป พบว่าปั๊มเปิดปิดถี่มากจนรีเลย์เสีย รุ่นที่สองจึงเปิดเมื่อต่ำกว่า 30% และปิดเมื่อเกิน 60% เหตุผลข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ค่าที่อ่านได้แกว่งขึ้นลงเล็กน้อยรอบ 30% เกณฑ์เดียวทำให้สถานะสลับทุกครั้งที่แกว่ง การมีช่วงกลางทำให้ปั๊มคงสถานะจนดินชื้นจริง", correct: true }
      - { id: b, text: "เกณฑ์สองค่าทำให้เซนเซอร์อ่านค่าได้แม่นยำขึ้น", feedback: "เกณฑ์อยู่ในโปรแกรม ไม่ได้เปลี่ยนความแม่นของเซนเซอร์" }
      - { id: c, text: "เกณฑ์สองค่าทำให้ใช้น้ำน้อยลงเสมอ", feedback: "แต่ละรอบรดน้ำนานขึ้นจนถึง 60% จุดประสงค์หลักคือลดการเปิดปิดถี่ ไม่ใช่ประหยัดน้ำ" }
      - { id: d, text: "ไมโครคอนโทรลเลอร์เปรียบเทียบตัวเลขได้ครั้งละหนึ่งค่า", feedback: "โปรแกรมเปรียบเทียบได้หลายเงื่อนไข ข้อนี้ไม่เกี่ยวกับเหตุผล" }
    hints:
      - "ลองนึกค่าที่อ่านได้ 29, 31, 29, 30, 28 กับเกณฑ์เดียว"
      - "ช่วงระหว่าง 30% ถึง 60% ปั๊มทำอะไร"
    solution: "ค่าจากเซนเซอร์มีสัญญาณรบกวนและแกว่งเล็กน้อย ถ้าเกณฑ์เปิดกับปิดเป็นค่าเดียวกัน ปั๊มจะสลับทุกครั้งที่ค่าแกว่งข้ามเกณฑ์ การแยกเกณฑ์ (ฮิสเทอรีซิส) ทำให้ระหว่าง 30–60% คงสถานะเดิม ปั๊มจึงเปิดนานจนดินชื้นจริงแล้วปิดนาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.physical-computing.p014
    topics: [computer.systems.physical-computing]
    difficulty: 4
    type: mcq
    stem: "สวนทุเรียนอยู่ห่างจากบ้าน 2 กิโลเมตร ไม่มี Wi-Fi ในสวน ต้องการส่งค่าความชื้นดินขนาดไม่กี่สิบไบต์ทุก 15 นาที และใช้แบตเตอรี่ได้นานหลายเดือน ควรเลือกช่องทางสื่อสารใด"
    choices:
      - { id: a, text: "LoRa", correct: true }
      - { id: b, text: "บลูทูธ", feedback: "บลูทูธส่งได้ระยะไม่กี่เมตรถึงไม่กี่สิบเมตร ไม่ถึง 2 กิโลเมตร" }
      - { id: c, text: "Wi-Fi", feedback: "ในสวนไม่มีจุดกระจาย Wi-Fi และ Wi-Fi ใช้พลังงานค่อนข้างมาก" }
      - { id: d, text: "สาย USB จากสวนถึงบ้าน", feedback: "สาย USB ยาวได้ไม่กี่เมตร ใช้ระยะ 2 กิโลเมตรไม่ได้" }
    hints:
      - "ข้อมูลก้อนเล็ก ส่งไม่ถี่ แต่ระยะไกลและต้องประหยัดพลังงาน"
      - "ทบทวนส่วนเก็บและส่งข้อมูลในบทเรียน"
    solution: "LoRa ออกแบบมาสำหรับส่งข้อมูลก้อนเล็กระยะไกลหลายกิโลเมตรด้วยพลังงานต่ำ เหมาะกับเซนเซอร์ในไร่สวน แลกกับการส่งข้อมูลได้ช้าและน้อย ซึ่งไม่เป็นปัญหาเมื่อส่งค่าความชื้นทุก 15 นาที"
