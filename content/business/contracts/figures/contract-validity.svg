<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="sans-serif" font-size="14">
  <title>ผังตรวจว่าสัญญามีผลสมบูรณ์ เป็นโมฆะ หรือเป็นโมฆียะ</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="800" height="520" fill="#ffffff"/>
  <rect x="30.0" y="18.0" width="470.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="265.0" y="48.4" text-anchor="middle" fill="#1f2937" font-size="12.5">1. คำเสนอและคำสนองตรงกันหรือไม่</text>
  <rect x="600.0" y="22.0" width="170.0" height="44.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="685.0" y="48.5" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ยังไม่เกิดสัญญา</text>
  <line x1="500.0" y1="44.0" x2="598.0" y2="44.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="549.0" y="37.0" text-anchor="middle" fill="#1f2937" font-size="12">ไม่ตรง</text>
  <line x1="265.0" y1="70.0" x2="265.0" y2="94.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="273.0" y="86.0" text-anchor="start" fill="#6b7280" font-size="11.5">ผ่าน</text>
  <rect x="30.0" y="96.0" width="470.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="265.0" y="126.4" text-anchor="middle" fill="#1f2937" font-size="12.5">2. วัตถุประสงค์ผิดกฎหมาย พ้นวิสัย หรือขัดศีลธรรมหรือไม่</text>
  <rect x="600.0" y="100.0" width="170.0" height="44.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="685.0" y="126.5" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">โมฆะ</text>
  <line x1="500.0" y1="122.0" x2="598.0" y2="122.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="549.0" y="115.0" text-anchor="middle" fill="#1f2937" font-size="12">ใช่</text>
  <line x1="265.0" y1="148.0" x2="265.0" y2="172.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="273.0" y="164.0" text-anchor="start" fill="#6b7280" font-size="11.5">ผ่าน</text>
  <rect x="30.0" y="174.0" width="470.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="265.0" y="204.4" text-anchor="middle" fill="#1f2937" font-size="12.5">3. กฎหมายบังคับแบบ (เช่น หนังสือและจดทะเบียน) ทำตามแบบหรือไม่</text>
  <rect x="600.0" y="178.0" width="170.0" height="44.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="685.0" y="204.6" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">โมฆะ</text>
  <line x1="500.0" y1="200.0" x2="598.0" y2="200.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="549.0" y="193.0" text-anchor="middle" fill="#1f2937" font-size="12">ไม่ทำ</text>
  <line x1="265.0" y1="226.0" x2="265.0" y2="250.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="273.0" y="242.0" text-anchor="start" fill="#6b7280" font-size="11.5">ผ่าน</text>
  <rect x="30.0" y="252.0" width="470.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="265.0" y="282.4" text-anchor="middle" fill="#1f2937" font-size="12.5">4. สำคัญผิดในสาระสำคัญ เช่น ตัวทรัพย์หรือตัวบุคคลหรือไม่</text>
  <rect x="600.0" y="256.0" width="170.0" height="44.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="685.0" y="282.6" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">โมฆะ</text>
  <line x1="500.0" y1="278.0" x2="598.0" y2="278.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="549.0" y="271.0" text-anchor="middle" fill="#1f2937" font-size="12">ใช่</text>
  <line x1="265.0" y1="304.0" x2="265.0" y2="328.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="273.0" y="320.0" text-anchor="start" fill="#6b7280" font-size="11.5">ผ่าน</text>
  <rect x="30.0" y="330.0" width="470.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="265.0" y="360.4" text-anchor="middle" fill="#1f2937" font-size="12.5">5. ผู้เยาว์ไม่ได้รับความยินยอม หรือถูกฉ้อฉล ข่มขู่ หรือไม่</text>
  <rect x="600.0" y="334.0" width="170.0" height="44.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="685.0" y="360.6" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">โมฆียะ</text>
  <line x1="500.0" y1="356.0" x2="598.0" y2="356.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="549.0" y="349.0" text-anchor="middle" fill="#1f2937" font-size="12">ใช่</text>
  <line x1="265.0" y1="382.0" x2="265.0" y2="406.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="273.0" y="398.0" text-anchor="start" fill="#6b7280" font-size="11.5">ผ่าน</text>
  <rect x="30.0" y="408.0" width="470.0" height="52.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="265.0" y="438.7" text-anchor="middle" fill="#1f2937" font-size="14.5" font-weight="bold">สัญญาสมบูรณ์ บังคับได้ตามกฎหมาย</text>
  <text x="400.0" y="488.0" text-anchor="middle" fill="#6b7280" font-size="12">โมฆะ = เสียเปล่าตั้งแต่ต้น · โมฆียะ = สมบูรณ์จนกว่าผู้มีสิทธิจะบอกล้าง (หรือให้สัตยาบันให้สมบูรณ์ตลอดไป)</text>
  <text x="400.0" y="508.0" text-anchor="middle" fill="#6b7280" font-size="12">สัญญาบางชนิดต้องมีหลักฐานเป็นหนังสือจึงฟ้องร้องบังคับคดีได้ (เช่น กู้ยืมเงินเกิน 2,000 บาท) แม้ไม่ได้เป็นโมฆะ</text>
</svg>
