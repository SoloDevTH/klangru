id: computer.projects.app-development
subject: computer
title: { th: การพัฒนาแอปพลิเคชันและโครงงานเชิงคำนวณ, en: "App development and computational projects" }
summary: พัฒนาแอปที่บูรณาการกับวิชาอื่นตั้งแต่ระบุปัญหา คิดเชิงคำนวณ ออกแบบ สร้างต้นแบบ ทดสอบ และนำเสนอ การเขียนโปรแกรมแบบขับเคลื่อนด้วยเหตุการณ์ เรื่องที่ต้องคิดทุกแพลตฟอร์ม และการประเมินโครงงาน
difficulty: 5
minutes: 50
prerequisites: [computer.programming.functions, computer.data.data-processing, computer.programming.development-process]
encompasses:
  - { id: computer.programming.development-process, weight: 0.3 }
  - { id: computer.programming.functions, weight: 0.2 }
  - { id: computer.data.data-processing, weight: 0.2 }
  - { id: computer.algorithms.computational-thinking, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: app-mockup.svg
    alt: "ภาพร่างหน้าจอโทรศัพท์ของแอปค่าไฟบ้านเรา มีช่องเครื่องใช้ (ตู้เย็น) ช่องกำลังไฟฟ้า W (150) ช่องชั่วโมงต่อวัน (24) ปุ่ม เพิ่ม รายการเครื่องใช้ ตู้เย็น 150 W × 24 ชม. แอร์ 1,000 W × 8 ชม. ทีวี 120 W × 5 ชม. ข้อความรวม 12.2 kWh ต่อวัน ประมาณ 48.8 บาท (ค่าไฟสมมติ 4 บาทต่อหน่วย) และปุ่ม ล้าง กับ คำแนะนำ ป้ายสีส้มด้านขวาบอกเหตุการณ์ ช่องตัวเลข พิมพ์แล้วตรวจว่าเป็นตัวเลขบวก ปุ่มเพิ่ม แตะแล้ว on_add() เพิ่มรายการและคำนวณใหม่ รายการ แตะเพื่อแก้หรือลบ ปุ่มคำแนะนำ แสดงเครื่องที่ใช้ไฟมากสุด ปุ่มล้าง on_clear() ล้างทั้งหมด"
    caption: "ออกแบบหน้าจอพร้อมกำหนดว่าแต่ละส่วนรับเหตุการณ์อะไร"
  - type: worked-example
    title: วางแผนโครงงานแอปค่าไฟด้วยแนวคิดเชิงคำนวณ
    problem: "กลุ่มของมดอยากช่วยครอบครัวลดค่าไฟ มีเวลา 4 สัปดาห์ ให้วางแผนโครงงานแอปด้วยแนวคิดเชิงคำนวณ และบอกความรู้วิชาอื่นที่ใช้"
    steps:
      - text: "ระบุปัญหาและผู้ใช้: ผู้ปกครองไม่รู้ว่าเครื่องใช้ใดกินไฟมาก จึงไม่รู้ว่าควรประหยัดที่ไหน"
      - text: "แยกปัญหาเป็นส่วนย่อย: กรอกเครื่องใช้ คำนวณพลังงานและค่าไฟ แสดงรายการ และแนะนำเครื่องที่ควรลดการใช้"
      - text: "หารูปแบบและนามธรรม: ทุกเครื่องใช้สูตร วัตต์ × ชั่วโมง ÷ 1000 เก็บเฉพาะชื่อ วัตต์ และชั่วโมง ไม่ต้องเก็บยี่ห้อ"
        why: "สูตรเดียวกับทุกเครื่องทำให้เขียนเป็นฟังก์ชันเดียวแล้วใช้ซ้ำ และตัดข้อมูลที่ไม่ใช้ทำให้แอปง่ายขึ้น"
      - text: "ความรู้วิชาอื่น: วิทยาศาสตร์ (กำลังไฟฟ้าและพลังงาน หน่วย kWh) และคณิตศาสตร์ (คูณ หาร ร้อยละที่ประหยัดได้)"
      - text: "กำหนด MVP สัปดาห์ที่ 1–2: กรอก คำนวณ และแสดงเครื่องที่ใช้มากสุด สัปดาห์ที่ 3: ให้ 3 ครอบครัวลองใช้ สัปดาห์ที่ 4: ปรับปรุงและเตรียมนำเสนอ"
        why: "ทำความสามารถหลักให้ใช้ได้จริงก่อน จึงมีเวลาทดสอบกับผู้ใช้และปรับปรุง"
    answer: "แผนมีปัญหาและผู้ใช้ชัด แยกงานสี่ส่วน ใช้สูตรพลังงานไฟฟ้าเดียวกับทุกเครื่อง กำหนด MVP และเวลาทดสอบกับครอบครัวจริงก่อนนำเสนอ"
  - { type: check, problem: computer.projects.app-development.p006, prompt: "ลองคำนวณค่าไฟแบบที่แอปทำ" }
  - type: figure
    src: event-loop.svg
    alt: "ด้านซ้ายเป็นแหล่งเหตุการณ์สี่อย่าง แตะปุ่มเพิ่ม พิมพ์ชั่วโมง ตัวจับเวลาครบ และเซนเซอร์ส่งค่า ลูกศรชี้เข้าคิวเหตุการณ์ที่มี add, add, clear เรียงอยู่ คิวส่งต่อให้วงวนเหตุการณ์ซึ่งหยิบทีละเหตุการณ์ แล้วเรียกตัวจัดการ on_add หรือ on_clear ตัวจัดการทำให้ข้อมูลเปลี่ยนและวาดหน้าจอใหม่ แล้วลูกศรวนกลับไปที่วงวนเหตุการณ์ ป้ายว่ารอเหตุการณ์ถัดไป"
    caption: "วงวนเหตุการณ์รับเหตุการณ์ทีละอย่างแล้วเรียกตัวจัดการที่ผูกไว้"
  - type: worked-example
    title: เขียนตัวจัดการเหตุการณ์ที่รับมือข้อมูลผิดรูป
    problem: |
      ปรับตัวจัดการ on_add ให้รับข้อความจากช่องกรอก (ผู้ใช้อาจพิมพ์ตัวอักษรหรือชั่วโมงเกิน 24) แล้วทดสอบกับเหตุการณ์ ("150", "24"), ("abc", "2"), ("1000", "30"), ("60", "5")

      ```python
      def on_add(state, watts_text, hours_text):
          try:
              watts = float(watts_text)
              hours = float(hours_text)
          except ValueError:
              state["msg"] = "กรุณากรอกตัวเลข"
              return
          if watts <= 0 or not (0 < hours <= 24):
              state["msg"] = "ค่าไม่สมเหตุสมผล"
              return
          state["kwh"] += watts * hours / 1000
          state["msg"] = ""
      ```
    steps:
      - text: "แปลงข้อความเป็นตัวเลขใน try ถ้าแปลงไม่ได้ (เช่น \"abc\") จะเกิด ValueError ให้แสดงข้อความเตือนแล้วจบตัวจัดการ"
        why: "ผู้ใช้พิมพ์อะไรก็ได้ ถ้าไม่ดักไว้แอปจะหยุดทำงานกลางคัน"
      - text: "ตรวจความสมเหตุสมผล: วัตต์ต้องมากกว่า 0 และชั่วโมงต่อวันต้องอยู่ระหว่าง 0 ถึง 24"
        why: "ใช้ความรู้จากชีวิตจริง หนึ่งวันมี 24 ชั่วโมง จึงจับการพิมพ์ผิดอย่าง 30 ได้"
      - text: "(\"150\", \"24\"): ผ่าน kwh = 150 × 24 ÷ 1000 = 3.6"
      - text: "(\"abc\", \"2\"): แปลงไม่ได้ ขึ้นข้อความ กรุณากรอกตัวเลข kwh ยังเป็น 3.6 และ (\"1000\", \"30\"): ชั่วโมงเกิน 24 ขึ้นข้อความ ค่าไม่สมเหตุสมผล kwh ยังเป็น 3.6"
      - text: "(\"60\", \"5\"): ผ่าน kwh = 3.6 + 0.3 = 3.9"
    answer: "หลังสี่เหตุการณ์ kwh = 3.9 สองเหตุการณ์ที่ข้อมูลผิดรูปถูกปฏิเสธพร้อมข้อความบอกผู้ใช้ โดยแอปไม่หยุดทำงาน"
  - { type: check, problem: computer.projects.app-development.p007, prompt: "ไล่ค่าหลังแต่ละเหตุการณ์" }
glossary:
  - { term: แอปพลิเคชัน (application), definition: "โปรแกรมที่ผู้ใช้ใช้ทำงานเฉพาะอย่าง บนโทรศัพท์ เว็บ หรือคอมพิวเตอร์" }
  - { term: โครงงานเชิงคำนวณ (computational project), definition: "โครงงานที่ใช้แนวคิดเชิงคำนวณและเทคโนโลยีแก้ปัญหาจริง" }
  - { term: เหตุการณ์ (event), definition: "สิ่งที่เกิดขึ้นแล้วแอปต้องตอบสนอง เช่น แตะปุ่ม พิมพ์ ตัวจับเวลาครบ" }
  - { term: ตัวจัดการเหตุการณ์ (event handler), definition: "ฟังก์ชันที่ผูกกับเหตุการณ์และถูกเรียกเมื่อเหตุการณ์นั้นเกิด" }
  - { term: วงวนเหตุการณ์ (event loop), definition: "ส่วนของระบบที่คอยรับเหตุการณ์ทีละอย่างแล้วเรียกตัวจัดการที่ผูกไว้" }
  - { term: ผลิตภัณฑ์ขั้นต่ำ (MVP), definition: "รุ่นแรกที่มีเฉพาะความสามารถหลักที่จำเป็นต่อการแก้ปัญหา ใช้ทดสอบกับผู้ใช้ก่อนเพิ่มส่วนอื่น" }
  - { term: แพลตฟอร์ม (platform), definition: "สภาพแวดล้อมที่แอปทำงาน เช่น เว็บเบราว์เซอร์ ระบบปฏิบัติการของโทรศัพท์" }
flashcards:
  - { front: "โปรแกรมแบบขับเคลื่อนด้วยเหตุการณ์ต่างจากโปรแกรมทั่วไปอย่างไร", back: "รอเหตุการณ์แล้วเรียกตัวจัดการ แทนการทำจากบนลงล่างแล้วจบ" }
  - { front: "พลังงานไฟฟ้า (kWh) คำนวณอย่างไร", back: "วัตต์ × ชั่วโมง ÷ 1000" }
  - { front: "MVP คืออะไร ทำไมทำก่อน", back: "รุ่นที่มีเฉพาะความสามารถหลัก ทำให้ได้ทดสอบกับผู้ใช้เร็วและเสร็จทันเวลา" }
  - { front: "เรื่องที่ต้องคิดทุกแพลตฟอร์มมีอะไรบ้าง", back: "ขนาดจอและการรับข้อมูล การเชื่อมต่อ ประสิทธิภาพ ความเป็นส่วนตัว การเข้าถึงได้ ภาษา" }
  - { front: "ตัวจัดการเหตุการณ์ต้องรับมืออะไร", back: "ข้อมูลผิดรูปและเหตุการณ์ในลำดับที่ไม่คาดคิด เช่น กดซ้ำ" }
