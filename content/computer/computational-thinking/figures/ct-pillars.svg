<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="sans-serif" font-size="14">
  <title>สี่องค์ประกอบของแนวคิดเชิงคำนวณ พร้อมตัวอย่างการจัดทัศนศึกษา</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="860" height="300" fill="#ffffff"/>
  <rect x="20.0" y="30.0" width="190.0" height="230.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="115.0" y="70.0" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">แยกส่วนย่อย</text>
  <text x="115.0" y="94.0" font-size="12" text-anchor="middle" fill="#6b7280" font-style="italic">decomposition</text>
  <line x1="40.0" y1="110.0" x2="190.0" y2="110.0" stroke="#2563eb" stroke-width="1"/>
  <text x="115.0" y="145.0" font-size="13" text-anchor="middle" fill="#1f2937">แบ่งงานใหญ่เป็นงานย่อย</text>
  <text x="115.0" y="190.0" font-size="12" text-anchor="middle" fill="#6b7280">ตัวอย่าง</text>
  <text x="115.0" y="215.0" font-size="12" text-anchor="middle" fill="#1f2937">รถ อาหาร เงิน ตารางเวลา</text>
  <line x1="212.0" y1="145.0" x2="228.0" y2="145.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="230.0" y="30.0" width="190.0" height="230.0" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="325.0" y="70.0" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">หารูปแบบ</text>
  <text x="325.0" y="94.0" font-size="12" text-anchor="middle" fill="#6b7280" font-style="italic">pattern recognition</text>
  <line x1="250.0" y1="110.0" x2="400.0" y2="110.0" stroke="#15803d" stroke-width="1"/>
  <text x="325.0" y="145.0" font-size="13" text-anchor="middle" fill="#1f2937">หาสิ่งที่ซ้ำหรือคล้ายกัน</text>
  <text x="325.0" y="190.0" font-size="12" text-anchor="middle" fill="#6b7280">ตัวอย่าง</text>
  <text x="325.0" y="215.0" font-size="12" text-anchor="middle" fill="#1f2937">ทุกห้องคิดจำนวนรถแบบเดียวกัน</text>
  <line x1="422.0" y1="145.0" x2="438.0" y2="145.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="440.0" y="30.0" width="190.0" height="230.0" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="535.0" y="70.0" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">นามธรรม</text>
  <text x="535.0" y="94.0" font-size="12" text-anchor="middle" fill="#6b7280" font-style="italic">abstraction</text>
  <line x1="460.0" y1="110.0" x2="610.0" y2="110.0" stroke="#6d28d9" stroke-width="1"/>
  <text x="535.0" y="145.0" font-size="13" text-anchor="middle" fill="#1f2937">เก็บเฉพาะที่จำเป็น</text>
  <text x="535.0" y="190.0" font-size="12" text-anchor="middle" fill="#6b7280">ตัวอย่าง</text>
  <text x="535.0" y="215.0" font-size="12" text-anchor="middle" fill="#1f2937">ใช้จำนวนคน ไม่สนสีเสื้อ</text>
  <line x1="632.0" y1="145.0" x2="648.0" y2="145.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="650.0" y="30.0" width="190.0" height="230.0" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="745.0" y="70.0" font-size="17" text-anchor="middle" fill="#1f2937" font-weight="bold">อัลกอริทึม</text>
  <text x="745.0" y="94.0" font-size="12" text-anchor="middle" fill="#6b7280" font-style="italic">algorithm</text>
  <line x1="670.0" y1="110.0" x2="820.0" y2="110.0" stroke="#c2410c" stroke-width="1"/>
  <text x="745.0" y="145.0" font-size="13" text-anchor="middle" fill="#1f2937">เขียนขั้นตอนที่ทำตามได้</text>
  <text x="745.0" y="190.0" font-size="12" text-anchor="middle" fill="#6b7280">ตัวอย่าง</text>
  <text x="745.0" y="215.0" font-size="12" text-anchor="middle" fill="#1f2937">รถ = ปัดขึ้น(คน ÷ ที่นั่ง)</text>
  <text x="430.0" y="285.0" font-size="13" text-anchor="middle" fill="#6b7280">ทั้งสี่อย่างใช้ร่วมกันและวนกลับไปแก้ได้ ไม่จำเป็นต้องทำตามลำดับตายตัว</text>
</svg>
