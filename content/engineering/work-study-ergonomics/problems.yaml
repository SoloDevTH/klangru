problems:
  - id: engineering.industrial.work-study-ergonomics.p001
    topics:
      - engineering.industrial.work-study-ergonomics
    difficulty: 1
    type: mcq
    stem: ค่าอัตราการทำงาน (rating) 110% ที่ผู้จับเวลาประเมินหมายความว่าอย่างไร
    choices:
      - id: a
        text: ผู้ปฏิบัติงานทำงานเร็วกว่าอัตราปกติ 10% ดังนั้นเวลาปกติ = เวลาที่จับได้ × 1.10
        correct: true
      - id: b
        text: ผู้ปฏิบัติงานช้ากว่าอัตราปกติ 10% ดังนั้นเวลาปกติ = เวลาที่จับได้ × 1.10
        feedback: 110% แปลว่าเร็วกว่า ถ้าช้ากว่าค่าจะต่ำกว่า 100%
      - id: c
        text: ผู้ปฏิบัติงานได้เวลาพัก 10% ของเวลาทั้งหมด
        feedback: ค่าเผื่อ (allowance) คือเวลาพัก ไม่ใช่ค่า rating
      - id: d
        text: ตัวเลขนี้คือเวลามาตรฐานเป็นเปอร์เซ็นต์ของเวลาปกติ
        feedback: เวลามาตรฐานได้จากการเพิ่มค่าเผื่อหลังจากปรับด้วย rating แล้ว
    hints:
      - ค่า 100% คืออัตราการทำงานปกติที่ผู้จับเวลาถือเป็นมาตรฐาน
      - ถ้าคนทำงานเร็วกว่าปกติ เวลาที่จับได้จะสั้นกว่าเวลาของคนทำงานปกติ
    solution: ค่า 110% หมายความว่าผู้ปฏิบัติงานทำงานเร็วกว่าอัตราปกติ 10% เวลาที่จับได้จึงสั้นกว่าที่คนทำงานปกติจะใช้ ดังนั้นเวลาปกติ = เวลาที่จับได้ × 1.10 ค่าที่ได้จะยาวกว่าเวลาที่จับได้
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.industrial.work-study-ergonomics.p002
    topics:
      - engineering.industrial.work-study-ergonomics
    difficulty: 1
    type: numeric
    stem: (ข้อมูลสมมติ) พนักงานในโรงงานประกอบรถจักรยานยนต์หยิบชิ้นส่วนแต่ละรอบ ผู้จับเวลาจับได้ 5 รอบเป็น 12.0, 11.5, 12.5, 12.0 และ 13.0 วินาที เวลาเฉลี่ยต่อรอบเป็นกี่วินาที (ตอบทศนิยมหนึ่งตำแหน่ง ตัวเลขอย่างเดียว)
    answer:
      value: 12.2
      tolerance: 0.05
      unit: s
    hints:
      - เวลาเฉลี่ยคือผลรวมของทุกรอบหารด้วยจำนวนรอบ
      - รวมทั้งห้าค่าก่อน แล้วหารด้วย 5
    misconceptions:
      - match: 12.0
        feedback: ค่านี้คือมัธยฐาน (ค่ากลางของข้อมูลที่เรียงแล้ว) ไม่ใช่ค่าเฉลี่ย
      - match: 13.0
        feedback: ค่านี้คือค่าสูงสุด ไม่ใช่ค่าเฉลี่ยที่ใช้ในการศึกษาเวลา
    solution: ผลรวม = 12.0 + 11.5 + 12.5 + 12.0 + 13.0 = 61.0 เวลาเฉลี่ย = 61.0 ÷ 5 = 12.2 วินาทีต่อรอบ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.industrial.work-study-ergonomics.p003
    topics:
      - engineering.industrial.work-study-ergonomics
    difficulty: 1
    type: mcq
    stem: ข้อใดเป็นตัวอย่างของการศึกษาวิธีการทำงาน (method study) มากกว่าการศึกษาเวลา
    choices:
      - id: a
        text: เขียนแผนภูมิกระบวนการเพื่อลดการเดินของพนักงานระหว่างโต๊ะกับชั้นวาง
        correct: true
      - id: b
        text: จับเวลาการประกอบด้วยนาฬิกาจับเวลาหลายรอบ
        feedback: นี่คือการศึกษาเวลา ไม่ใช่การศึกษาวิธีการทำงาน
      - id: c
        text: สุ่มดูว่าพนักงานว่างกี่เปอร์เซ็นต์ของเวลาทำงาน
        feedback: นี่คือการสุ่มงาน (work sampling) ซึ่งเป็นการวัดงาน
      - id: d
        text: คำนวณเวลามาตรฐานเพื่อกำหนดค่าจ้างต่อชิ้น
        feedback: นี่คือการคำนวณเวลามาตรฐานซึ่งอยู่ในการวัดงาน
    hints:
      - การศึกษาวิธีการทำงานถามว่า 'ทำงานนี้ด้วยวิธีใดดีที่สุด' ก่อนถามว่า 'ใช้เวลาเท่าไร'
      - มองหาการเปลี่ยนลำดับหรือเส้นทางการเคลื่อนที่
    solution: แผนภูมิกระบวนการและการลดการเดินของพนักงานเป็นการเปลี่ยนวิธีการทำงาน การจับเวลา การสุ่มงาน และการคำนวณเวลามาตรฐานเป็นส่วนของการศึกษาเวลาและการวัดงาน
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.industrial.work-study-ergonomics.p004
    topics:
      - engineering.industrial.work-study-ergonomics
    difficulty: 2
    type: numeric
    stem: จากเวลาที่จับได้เฉลี่ย 12.2 วินาที และค่า rating 110% เวลาปกติ (normal time) ของงานนี้เป็นกี่วินาที (ตอบทศนิยมสองตำแหน่ง)
    answer:
      value: 13.42
      tolerance: 0.01
      unit: s
    hints:
      - เวลาปกติ = เวลาที่จับได้ × ค่า rating (ในรูปทศนิยม)
      - 110% เป็น 1.10 ดังนั้นคูณ 12.2 ด้วย 1.10
    misconceptions:
      - match: 11.09
        feedback: หารด้วย 1.10 แทนที่จะคูณ ทำให้ได้เวลาที่สั้นกว่าเวลาปกติ
    solution: เวลาปกติ = 12.2 × 1.10 = 13.42 วินาที เวลาปกติยาวกว่าเวลาที่จับได้เพราะผู้ปฏิบัติงานทำเร็วกว่าอัตราปกติ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.industrial.work-study-ergonomics.p005
    topics:
      - engineering.industrial.work-study-ergonomics
    difficulty: 2
    type: numeric
    stem: (ข้อมูลสมมติ) เวลาปกติของงานหนึ่งเป็น 13.42 วินาที ค่าเผื่อ (allowance) 15% ของเวลาปกติ เวลามาตรฐานของงานนี้เป็นกี่วินาที (ตอบทศนิยมสองตำแหน่ง)
    answer:
      value: 15.43
      tolerance: 0.01
      unit: s
    hints:
      - เวลามาตรฐาน = เวลาปกติ × (1 + ค่าเผื่อ) โดยค่าเผื่อเป็นทศนิยม
      - 15% เป็น 0.15 ดังนั้นคูณ 13.42 ด้วย 1.15
    misconceptions:
      - match: 28.42
        feedback: เอา 15 วินาทีมาบวกตรง ๆ แทนการคิดเป็นเปอร์เซ็นต์ของเวลาปกติ
      - match: 11.41
        feedback: ลดเวลาลง 15% แทนที่จะเพิ่มค่าเผื่อ
    solution: เวลามาตรฐาน = 13.42 × 1.15 = 15.433 ≈ 15.43 วินาที ค่าเผื่อใช้สำหรับความเหนื่อย ความล่าช้าโดยไม่ตั้งใจ และงานจำเป็นอื่น
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.industrial.work-study-ergonomics.p006
    topics:
      - engineering.industrial.work-study-ergonomics
    difficulty: 2
    type: mcq
    stem: ข้อใดถูกตามหลักการเคลื่อนไหวอย่างประหยัด (เลือกทุกข้อที่ถูก)
    multiple: true
    choices:
      - id: a
        text: ให้มือทั้งสองข้างเริ่มและสิ้นสุดงานพร้อมกันเมื่อทำได้
        correct: true
      - id: b
        text: วางอุปกรณ์ไว้ในรัศมีการเอื้อมที่ถนัด
        correct: true
      - id: c
        text: หยิบชิ้นงานทีละชิ้นแม้จะหยิบพร้อมกันได้
        feedback: การหยิบพร้อมกันลดจำนวนครั้งเคลื่อนไหว จึงควรทำเมื่อทำได้
      - id: d
        text: ให้พักเมื่อรู้สึกเหนื่อยโดยไม่กำหนดเวลา
        feedback: การพักที่ไม่มีกำหนดทำให้วางแผนงานไม่ได้ ควรกำหนดค่าเผื่อที่เหมาะสมแทน
    hints:
      - หลักการนี้มุ่งลดการเคลื่อนไหวที่ไม่จำเป็นและทำให้มือทำงานพร้อมกันได้
      - การหยิบของจากตำแหน่งที่ไกลและไม่แน่นอนมักเพิ่มเวลาและความเมื่อยล้า
    solution: ให้มือทั้งสองข้างเริ่มและสิ้นสุดงานพร้อมกันเมื่อทำได้ และวางอุปกรณ์ไว้ในรัศมีการเอื้อมที่ถนัดลดการเดินและการเอื้อมที่ไม่จำเป็น ส่วนการหยิบทีละชิ้นทั้งที่หยิบพร้อมกันได้ และการหยุดพักโดยไม่กำหนดเวลาทำให้งานขาดประสิทธิภาพ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.industrial.work-study-ergonomics.p007
    topics:
      - engineering.industrial.work-study-ergonomics
    difficulty: 2
    type: match
    stem: จับคู่คำศัพท์กับความหมาย
    pairs:
      - left: การสุ่มงาน (work sampling)
        right: สังเกตหลายครั้งแบบสุ่มเพื่อประมาณสัดส่วนของเวลาที่คนหรือเครื่องอยู่ในแต่ละสถานะ
      - left: ค่าเผื่อ (allowance)
        right: เวลาที่เผื่อไว้สำหรับความเมื่อยล้า ความล่าช้าโดยไม่ตั้งใจ และงานจำเป็นอื่น
      - left: การจัดสมดุลสายการผลิต
        right: แบ่งงานให้แต่ละสถานีมีเวลาใกล้เคียงกัน เพื่อให้รอบเวลาสม่ำเสมอ
      - left: เวลาปกติ (normal time)
        right: เวลาที่คำนวณจากการปรับเวลาที่จับได้ด้วยค่า rating ให้เป็นอัตราทำงานปกติ
    hints:
      - ดูคำสำคัญ เช่น 'สุ่ม' 'เผื่อ' 'สมดุล' 'ปกติ'
      - ลองจับคู่คำที่ชัดเจนที่สุดก่อน
    solution: การสุ่มงานคือการสังเกตหลายครั้งแบบสุ่มเพื่อประมาณสัดส่วนเวลา ค่าเผื่อคือเวลาที่เผื่อไว้สำหรับปัจจัยที่คาดไม่ถึงและความเมื่อยล้า การจัดสมดุลสายคือการแบ่งงานให้สถานีมีเวลาใกล้เคียงกัน และเวลาปกติคือเวลาที่คำนวณจากอัตราทำงานปกติ
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.industrial.work-study-ergonomics.p008
    topics:
      - engineering.industrial.work-study-ergonomics
    difficulty: 3
    type: numeric
    stem: (ข้อมูลสมมติ) โรงงานผลไม้แปรรูปในราชบุรีต้องการประเมินสัดส่วนเวลาที่พนักงานว่างโดยการสุ่มงาน คาดว่าสัดส่วนเวลาว่างอยู่ราว 30% ต้องการความคลาดเคลื่อนไม่เกิน ±5% ที่ความเชื่อมั่น 95% (z = 1.96) ต้องสุ่มสังเกตกี่ครั้ง (ปัดขึ้นเป็นจำนวนเต็ม ตอบตัวเลขอย่างเดียว)
    answer:
      value: 323
      tolerance: 0.5
      unit: ครั้ง
    hints:
      - สูตรขนาดตัวอย่าง n = z² × p × (1 − p) ÷ e²
      - p คือสัดส่วนที่คาดไว้ (0.30) และ e คือความคลาดเคลื่อน (0.05)
    misconceptions:
      - match: 461
        feedback: ลืมคูณด้วย (1 − p) ทำให้ได้ค่าที่มากเกินจำเป็น
    solution: n = 1.96² × 0.30 × 0.70 ÷ 0.05² = 3.8416 × 0.21 ÷ 0.0025 ≈ 322.7 ปัดขึ้นเป็น 323 ครั้งของการสังเกต
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.industrial.work-study-ergonomics.p009
    topics:
      - engineering.industrial.work-study-ergonomics
    difficulty: 3
    type: numeric
    stem: (ข้อมูลสมมติ) สายประกอบพัดลมเพดานมี 3 สถานี เวลางานรวมทั้งหมด 180 วินาทีต่อชิ้น และรอบเวลาของสายคือ 70 วินาที ประสิทธิภาพของสายการผลิตนี้กี่เปอร์เซ็นต์ (ตอบทศนิยมหนึ่งตำแหน่ง ตัวเลขอย่างเดียว)
    figure:
      src: line-balance.svg
      alt: แผนภูมิแท่งสามสถานี สถานีที่ 1 มีงาน A 40 วินาทีกับงาน D 25 วินาที รวม 65 วินาที สถานีที่ 2 มีงาน B 35 กับงาน E 30 รวม 65 วินาที สถานีที่ 3 มีงาน C 50 วินาที เหลือช่องว่าง 20 วินาที เส้นประสีแดงที่ระดับ 70 วินาทีคือรอบเวลา
    answer:
      value: 85.7
      tolerance: 0.1
      unit: '%'
    hints:
      - ประสิทธิภาพ = เวลางานรวม ÷ (จำนวนสถานี × รอบเวลา) × 100
      - จำนวนสถานีคือ 3 และรอบเวลาคือ 70 วินาที
    misconceptions:
      - match: 257.1
        feedback: ลืมคูณจำนวนสถานี ประสิทธิภาพต้องไม่เกิน 100%
    solution: ประสิทธิภาพ = 180 ÷ (3 × 70) × 100 = 180 ÷ 210 × 100 ≈ 85.7% สถานีที่ 3 ว่างอยู่ 20 วินาที จึงเป็นจุดที่ควรพิจารณาย้ายงาน
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.industrial.work-study-ergonomics.p010
    topics:
      - engineering.industrial.work-study-ergonomics
    difficulty: 3
    type: mcq
    stem: สายการผลิตมี 4 สถานี เวลาทำงานในแต่ละสถานีคือ 55, 62, 48 และ 60 วินาที รอบเวลาของสายคือเวลาของสถานีที่ช้าที่สุด ประสิทธิภาพของสายนี้ประมาณเท่าไร
    choices:
      - id: a
        text: 90.7%
        correct: true
      - id: b
        text: 225%
        feedback: ลืมหารด้วยจำนวนสถานีและรอบเวลา ประสิทธิภาพต้องไม่เกิน 100%
      - id: c
        text: 9.3%
        feedback: 9.3% คือสัดส่วนเวลาว่างรวม ไม่ใช่ประสิทธิภาพ
      - id: d
        text: 87.9%
        feedback: ค่านี้มาจากการใช้ 64 วินาทีเป็นรอบเวลา ซึ่งไม่ตรงกับสถานีที่ช้าที่สุด
    hints:
      - รอบเวลาคือเวลาของสถานีที่ช้าที่สุด
      - ประสิทธิภาพ = ผลรวมเวลาทุกสถานี ÷ (จำนวนสถานี × รอบเวลา)
    solution: รอบเวลา = 62 วินาที ผลรวมเวลา = 55 + 62 + 48 + 60 = 225 วินาที ประสิทธิภาพ = 225 ÷ (4 × 62) × 100 ≈ 90.7% เวลาว่างรวม 23 วินาทีคิดเป็น 9.3% ของเวลาทั้งหมดของสาย
    license: CC-BY-SA-4.0
    ai_assisted: true
  - id: engineering.industrial.work-study-ergonomics.p011
    topics:
      - engineering.industrial.work-study-ergonomics
    difficulty: 3
    type: order
    stem: เรียงลำดับขั้นตอนการศึกษาเวลาด้วยการจับเวลา
    items:
      - กำหนดงานและแบ่งงานเป็นองค์ประกอบย่อยที่วัดได้
      - จับเวลาหลายรอบและบันทึกค่าของแต่ละองค์ประกอบ
      - ประเมินอัตราการทำงานของผู้ปฏิบัติงานเทียบกับอัตราปกติ (rating)
      - คำนวณเวลาปกติจากเวลาเฉลี่ยคูณค่า rating
      - เพิ่มค่าเผื่อเพื่อได้เวลามาตรฐาน
    hints:
      - ก่อนจับเวลาต้องรู้ก่อนว่าจะจับอะไร
      - ค่า rating ใช้ปรับเวลาที่จับได้ ก่อนเพิ่มค่าเผื่อ
    solution: ขั้นแรกคือแบ่งงานเป็นองค์ประกอบ แล้วจับเวลาหลายรอบ ประเมิน rating ของแต่ละองค์ประกอบ คำนวณเวลาปกติ แล้วจึงเพิ่มค่าเผื่อเป็นเวลามาตรฐาน
