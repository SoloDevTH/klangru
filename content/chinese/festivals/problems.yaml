problems:
- id: chinese.culture.festivals.p001
  topics:
  - chinese.culture.festivals
  difficulty: 1
  type: mcq
  stem: 春节 (Chūn Jié) คือเทศกาลใด
  choices:
  - id: a
    text: เทศกาลบ๊ะจ่าง
    feedback: เทศกาลบ๊ะจ่างคือ 端午节 Duānwǔ Jié
  - id: b
    text: วันสงกรานต์
    feedback: สงกรานต์เป็นเทศกาลปีใหม่ของไทย
  - id: c
    text: ตรุษจีน (วันขึ้นปีใหม่ตามปฏิทินจีน)
    correct: true
    feedback: ถูก 春节 แปลตรงตัวว่า เทศกาลฤดูใบไม้ผลิ
  - id: d
    text: วันไหว้พระจันทร์
    feedback: วันไหว้พระจันทร์คือ 中秋节 Zhōngqiū Jié
  hints:
  - 春 chūn แปลว่า ฤดูใบไม้ผลิ 节 jié แปลว่า เทศกาล
  - เทศกาลนี้เป็นวันขึ้นปีใหม่ของคนจีน
  solution: 春节 = **ตรุษจีน** วันที่ 1 เดือน 1 ตามปฏิทินจีน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.culture.festivals.p002
  topics:
  - chinese.culture.festivals
  difficulty: 1
  type: match
  stem: จับคู่เทศกาลกับอาหารประจำเทศกาล
  pairs:
  - left: 春节 (ตรุษจีน)
    right: 饺子 เกี๊ยว (ภาคเหนือของจีน)
  - left: 元宵节 (เทศกาลโคมไฟ)
    right: 汤圆 ขนมอี๋ (บัวลอยแบบจีน)
  - left: 端午节 (เทศกาลบ๊ะจ่าง)
    right: 粽子 บ๊ะจ่าง
  - left: 中秋节 (วันไหว้พระจันทร์)
    right: 月饼 ขนมไหว้พระจันทร์
  hints:
  - 月饼 มีคำว่า 月 (ดวงจันทร์) อยู่ในชื่อ
  - 元宵节 อยู่ในคืนเพ็ญแรกของปี กินขนมกลม ๆ
  solution: 春节 饺子 · 元宵节 汤圆 · 端午节 粽子 · 中秋节 月饼
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.culture.festivals.p003
  topics:
  - chinese.culture.festivals
  difficulty: 2
  type: hanzi
  stem: ช่วงตรุษจีนคนจีนติดอักษร 福 (fú โชคดี ความสุข) ที่ประตูบ้าน ลองเขียนอักษร 福 ตามลำดับขีด
  character: 福
  pinyin: fú
  meaning: โชคดี ความสุข
  max_mistakes: 4
  hints:
  - 福 มี 13 ขีด ทางซ้ายคือหมวด 礻 (4 ขีด) ทางขวาคือ 一 口 田
  - 'เขียนซ้ายก่อนขวา ทางขวาเขียนจากบนลงล่าง: 一 → 口 → 田'
  solution: '礻: 点 → 横撇 → 竖 → 点 · ขวา: 横 → 口 (3 ขีด) → 田 (5 ขีด) รวม 13 ขีด'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.culture.festivals.p004
  topics:
  - chinese.culture.festivals
  difficulty: 2
  type: mcq
  stem: ช่วงตรุษจีนที่เยาวราช เราเจอเพื่อนชาวจีน ควรอวยพรว่าอะไร
  choices:
  - id: a
    text: 对不起！
    feedback: 对不起 คือขอโทษ ไม่ใช่คำอวยพร
  - id: b
    text: 新年快乐！ xīnnián kuàilè
    correct: true
    feedback: ถูก แปลว่า สุขสันต์วันปีใหม่ พูดว่า 春节快乐 หรือ 恭喜发财 ก็ได้
  - id: c
    text: 生日快乐！ shēngrì kuàilè
    feedback: เป็นคำอวยพรวันเกิด
  - id: d
    text: 中秋节快乐！
    feedback: เป็นคำอวยพรวันไหว้พระจันทร์
  hints:
  - 快乐 kuàilè แปลว่า มีความสุข
  - 新年 xīnnián แปลว่า ปีใหม่
  solution: '**新年快乐！** (สุขสันต์วันปีใหม่) หรือ 春节快乐！ 恭喜发财！ (ขอให้ร่ำรวย)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.culture.festivals.p005
  topics:
  - chinese.culture.festivals
  difficulty: 2
  type: mcq
  stem: ทำไมบางบ้านติดอักษร 福 กลับหัวในช่วงตรุษจีน
  choices:
  - id: a
    text: เพราะ 福 กลับหัวแปลว่า โชคร้ายจะหายไป
    feedback: ความหมายมาจากเสียงของคำว่า 倒 กับ 到
  - id: b
    text: เพราะเป็นกฎหมายของจีน
    feedback: เป็นธรรมเนียม ไม่ใช่กฎหมาย และบางครอบครัวก็ไม่ติดกลับหัว
  - id: c
    text: เพราะ 倒 dào (กลับหัว) เสียงเหมือน 到 dào (มาถึง) 福倒了 จึงฟังเหมือน 福到了 โชคมาถึงแล้ว
    correct: true
    feedback: ถูก เป็นการเล่นคำพ้องเสียง
  - id: d
    text: เพราะติดผิด ควรแก้ให้ตรง
    feedback: บางบ้านตั้งใจติดกลับหัว ไม่ใช่ความผิดพลาด
  hints:
  - คนจีนชอบเล่นคำที่ออกเสียงเหมือนกัน
  - กลับหัว ภาษาจีนคือ 倒 dào
  solution: '倒 dào (กลับหัว) พ้องเสียงกับ 到 dào (มาถึง): **福倒了 = 福到了** โชคมาถึงแล้ว บางครอบครัวไม่ติดกลับหัวที่ประตูหน้าบ้าน ธรรมเนียมจึงต่างกันได้'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.culture.festivals.p006
  topics:
  - chinese.culture.festivals
  difficulty: 2
  type: mcq
  stem: 中秋节 (วันไหว้พระจันทร์) ตรงกับวันใดตามปฏิทินจีน
  choices:
  - id: a
    text: 农历正月初一 วันที่ 1 เดือน 1
    feedback: เป็นวันตรุษจีน
  - id: b
    text: 农历五月初五 วันที่ 5 เดือน 5
    feedback: เป็นเทศกาลตวนอู่ (บ๊ะจ่าง)
  - id: c
    text: 8 สิงหาคม ทุกปี
    feedback: 中秋节 ใช้ปฏิทินจีน ไม่ใช่ปฏิทินสากล จึงไม่ตรงวันเดิมทุกปี
  - id: d
    text: 农历八月十五 วันที่ 15 เดือน 8
    correct: true
    feedback: ถูก เป็นคืนเพ็ญ ดวงจันทร์เต็มดวง
  hints:
  - 中秋 แปลว่า กลางฤดูใบไม้ร่วง
  - ในปฏิทินจันทรคติ วันที่ 15 ของเดือนคือคืนเพ็ญ
  solution: 中秋节 = **农历八月十五** (วันที่ 15 เดือน 8 ตามปฏิทินจีน) เช่น ปี 2026 ตรงกับ 25 กันยายน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.culture.festivals.p007
  topics:
  - chinese.culture.festivals
  difficulty: 3
  type: mcq
  stem: คนไทยเชื้อสายจีนเรียกซองเงินที่ผู้ใหญ่ให้เด็กตอนตรุษจีนว่า "อั่งเปา" ในภาษาจีนกลางคือคำใด
  choices:
  - id: a
    text: 红包 hóngbāo
    correct: true
    feedback: ถูก 红 = สีแดง 包 = ห่อ ซอง อั่งเปามาจากภาษาจีนถิ่น (เช่น แต้จิ๋ว) ที่ออกเสียงคำเดียวกันนี้
  - id: b
    text: 月饼 yuèbǐng
    feedback: 月饼 คือขนมไหว้พระจันทร์
  - id: c
    text: 春联 chūnlián
    feedback: 春联 คือกลอนคู่ที่ติดประตูช่วงตรุษจีน
  - id: d
    text: 粽子 zòngzi
    feedback: 粽子 คือบ๊ะจ่าง
  hints:
  - อั่ง ในภาษาจีนถิ่นแปลว่า แดง
  - ภาษาจีนกลางของ แดง คือ 红 hóng
  solution: อั่งเปา = **红包 hóngbāo** (ซองแดง) คำไทยมาจากภาษาจีนถิ่นทางใต้ของจีน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.culture.festivals.p008
  topics:
  - chinese.culture.festivals
  difficulty: 3
  type: order
  stem: คนไทยเชื้อสายจีนจำนวนมากเรียกช่วงตรุษจีนเป็น 3 วัน เรียงลำดับให้ถูกต้อง
  items:
  - 'วันจ่าย: ซื้อของไหว้และเตรียมอาหาร'
  - 'วันไหว้: ไหว้เทพเจ้าและบรรพบุรุษ ตรงกับวันสิ้นปี (除夕)'
  - 'วันเที่ยว: วันขึ้นปีใหม่ (正月初一) ไปเยี่ยมญาติ อวยพร และรับอั่งเปา'
  hints:
  - ต้องซื้อของก่อนจึงไหว้ได้
  - วันขึ้นปีใหม่คือวันสุดท้ายของสามวันนี้
  solution: '**วันจ่าย → วันไหว้ → วันเที่ยว** วันไหว้ตรงกับ 除夕 (วันสิ้นปี) และวันเที่ยวคือ 春节 วันที่ 1 เดือน 1'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.culture.festivals.p009
  topics:
  - chinese.culture.festivals
  difficulty: 3
  type: match
  stem: จับคู่คำภาษาจีนกับความหมายภาษาไทย
  pairs:
  - left: 红包
    right: อั่งเปา ซองแดง
  - left: 粽子
    right: บ๊ะจ่าง
  - left: 月饼
    right: ขนมไหว้พระจันทร์
  - left: 舞狮
    right: เชิดสิงโต
  - left: 龙舟
    right: เรือมังกร
  hints:
  - 狮 shī คือสิงโต 龙 lóng คือมังกร
  - 月 คือดวงจันทร์ 红 คือแดง
  solution: 红包 อั่งเปา · 粽子 บ๊ะจ่าง · 月饼 ขนมไหว้พระจันทร์ · 舞狮 เชิดสิงโต · 龙舟 เรือมังกร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.culture.festivals.p010
  topics:
  - chinese.culture.festivals
  difficulty: 3
  type: mcq
  stem: เทศกาล 端午节 (ตวนอู่ หรือเทศกาลบ๊ะจ่าง) มีเรื่องเล่าเกี่ยวกับบุคคลใด และมีประเพณีอะไร
  choices:
  - id: a
    text: 嫦娥 (ฉางเอ๋อ) หญิงบนดวงจันทร์ มีการชมจันทร์
    feedback: เป็นตำนานของวันไหว้พระจันทร์
  - id: b
    text: ซานตาคลอส มีการแจกของขวัญ
    feedback: เป็นเรื่องของคริสต์มาส
  - id: c
    text: ไม่มีเรื่องเล่า มีแต่การจุดประทัด
    feedback: 端午节 มีตำนานชวีหยวนเป็นที่รู้จักมากที่สุด
  - id: d
    text: 屈原 (ชวีหยวน) กวีและขุนนางโบราณ มีการแข่งเรือมังกรและกินบ๊ะจ่าง
    correct: true
    feedback: ถูก ตามตำนาน ชาวบ้านพายเรือออกค้นหาและโยนข้าวลงน้ำเมื่อชวีหยวนกระโดดน้ำ
  hints:
  - เทศกาลนี้มีเรือรูปมังกร
  - บุคคลนี้เป็นกวีที่กระโดดลงแม่น้ำ
  solution: 端午节 (5 ค่ำ เดือน 5) ระลึกถึง **屈原 Qū Yuán** มีการ **赛龙舟** แข่งเรือมังกร และกิน **粽子** บ๊ะจ่าง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.culture.festivals.p011
  topics:
  - chinese.culture.festivals
  difficulty: 4
  type: numeric
  stem: ตรุษจีนปี 2026 ตรงกับ 17 กุมภาพันธ์ 2026 และตรุษจีนปี 2027 ตรงกับ 6 กุมภาพันธ์ 2027 ปีจีนนี้ยาวกี่วัน (ตอบเป็นจำนวนวัน)
  answer:
    value: 354
    unit: วัน
  misconceptions:
  - match: 365
    feedback: ปีจีนไม่ได้ยาวเท่าปีสากลเสมอ ลองนับวันจริงจากวันที่ทั้งสอง
  - match: 355
    feedback: นับเกินไป 1 วัน นับจาก 17 ก.พ. 2026 ถึง 6 ก.พ. 2027 โดยไม่นับวันเริ่มต้นซ้ำ
  hints:
  - 17 ก.พ. 2026 ถึง 17 ก.พ. 2027 คือ 365 วัน (2026 ไม่ใช่ปีอธิกสุรทิน)
  - 6 ก.พ. อยู่ก่อน 17 ก.พ. กี่วัน
  solution: 17 ก.พ. 2026 → 17 ก.พ. 2027 = 365 วัน แต่ 6 ก.พ. อยู่ก่อน 17 ก.พ. 11 วัน จึงได้ $365 - 11 = 354$ วัน ปีจีน 12 เดือนจันทรคติยาวประมาณ 354 วัน ตรุษจีนจึงเลื่อนทุกปี
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.culture.festivals.p012
  topics:
  - chinese.culture.festivals
  difficulty: 4
  type: mcq
  stem: ข้อใดบอก **ความเหมือน** ระหว่างตรุษจีน (春节) กับสงกรานต์ได้ถูกต้องที่สุด
  choices:
  - id: a
    text: จัดในคืนพระจันทร์เต็มดวง
    feedback: ตรุษจีนตรงกับวันขึ้น 1 ค่ำ (เดือนมืด) ไม่ใช่คืนเพ็ญ
  - id: b
    text: เป็นเทศกาลปีใหม่ คนกลับบ้านไปพบครอบครัวและแสดงความเคารพผู้ใหญ่
    correct: true
    feedback: ถูก ตรุษจีนมีการไหว้บรรพบุรุษและอวยพรผู้ใหญ่ สงกรานต์มีการรดน้ำดำหัวผู้ใหญ่
  - id: c
    text: ตรงกับวันเดียวกันในปฏิทินสากลทุกปี
    feedback: สงกรานต์ใช้วันที่ 13–15 เมษายน ส่วนตรุษจีนเลื่อนทุกปีตามปฏิทินจีน
  - id: d
    text: มีประเพณีสาดน้ำเหมือนกัน
    feedback: การสาดน้ำเป็นประเพณีสงกรานต์ ตรุษจีนไม่มี
  hints:
  - ทั้งสองเทศกาลเป็นการเริ่มต้นปีใหม่
  - นึกถึงกิจกรรมที่ทำกับครอบครัวและผู้สูงอายุ
  solution: ทั้งสองเป็น **เทศกาลปีใหม่ที่ครอบครัวมารวมกันและเคารพผู้ใหญ่** แต่ต่างกันที่วันที่ (สงกรานต์ใช้วันคงที่ ตรุษจีนใช้ปฏิทินจีน) และกิจกรรม (สาดน้ำ / อั่งเปา จุดประทัด)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.culture.festivals.p013
  topics:
  - chinese.culture.festivals
  difficulty: 4
  type: mcq
  stem: 中秋节 กับลอยกระทงมีความเหมือนกันในเรื่องใด
  choices:
  - id: a
    text: ทั้งสองมีการกินบ๊ะจ่าง
    feedback: บ๊ะจ่างเป็นอาหารของเทศกาลตวนอู่
  - id: b
    text: ทั้งสองเป็นเทศกาลปีใหม่
    feedback: ไม่ใช่เทศกาลปีใหม่ทั้งคู่
  - id: c
    text: ทั้งสองจัดในคืนพระจันทร์เต็มดวงตามปฏิทินจันทรคติ
    correct: true
    feedback: ถูก 中秋 คือ 15 ค่ำ เดือน 8 จีน ลอยกระทงคือ 15 ค่ำ เดือน 12 ไทย
  - id: d
    text: ทั้งสองตรงกับวันเดียวกันทุกปี
    feedback: อยู่คนละเดือน 中秋 มักอยู่ ก.ย.–ต.ค. ลอยกระทงมักอยู่ พ.ย.
  hints:
  - คิดถึงรูปร่างของดวงจันทร์ในคืนนั้น
  - ทั้งสองเทศกาลนับวันด้วยดวงจันทร์
