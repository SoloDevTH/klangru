  - id: earthscience.atmosphere.global-circulation.p012
    topics: [earthscience.atmosphere.global-circulation]
    difficulty: 4
    type: numeric
    stem: "ลมพัดเป็นวงรอบหย่อมความกดอากาศต่ำด้วยอัตราเร็ว 20 m/s ที่รัศมี 200 km ความเร่งสู่ศูนย์กลางมีค่ากี่ $\\times 10^{-3}\\ \\mathrm{m/s^2}$"
    answer: { value: 2, tolerance: 0.02, unit: "×10⁻³ m/s²" }
    misconceptions:
      - { match: 0.1, feedback: "ใช้ $v/r$ แทน $v^2/r$" }
      - { match: 2000, feedback: "ใช้รัศมี 200 โดยไม่แปลงกิโลเมตรเป็นเมตร" }
    hints:
      - "$a = \\dfrac{v^2}{r}$"
      - "200 km = $2 \\times 10^5$ m"
    solution: "$a = \\dfrac{20^2}{2 \\times 10^5} = 2 \\times 10^{-3}\\ \\mathrm{m/s^2}$ ขนาดใกล้เคียงกับแรงเกรเดียนต์และแรงคอริออลิส จึงต้องนำมาคิดเมื่อลมเคลื่อนเป็นวงโค้ง"
