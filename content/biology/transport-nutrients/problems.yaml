  - id: biology.plants.transport-nutrients.p015
    topics: [biology.plants.transport-nutrients]
    difficulty: 4
    type: mcq
    stem: "นักเรียนทดลองกับกิ่งชบา 2 กิ่งบนต้นเดียวกัน กิ่ง ก ลอกเปลือกออกเป็นวง กิ่ง ข ลอกเปลือกและตัดลึกเข้าไปในเนื้อไม้รอบกิ่ง วันต่อมาใบของกิ่ง ข เหี่ยว แต่ใบของกิ่ง ก ยังสด ผลนี้แสดงอะไร"
    choices:
      - { id: a, text: "ท่อลำเลียงน้ำอยู่ในเนื้อไม้ ไม่ได้อยู่ในเปลือก", correct: true }
      - { id: b, text: "ท่อลำเลียงน้ำอยู่ในเปลือก", feedback: "ถ้าน้ำขึ้นทางเปลือก ใบของกิ่ง ก ที่ลอกเปลือกต้องเหี่ยวด้วย" }
      - { id: c, text: "ใบของกิ่ง ข เหี่ยวเพราะขาดอาหารจากราก", feedback: "อาหารสร้างที่ใบ ใบเหี่ยวเร็วในวันเดียวเพราะขาดน้ำ" }
      - { id: d, text: "โฟลเอ็มลำเลียงน้ำขึ้นไปเลี้ยงใบ", feedback: "กิ่ง ก ไม่มีโฟลเอ็มแล้วแต่ใบยังสด แสดงว่าน้ำไม่ได้ขึ้นทางโฟลเอ็ม" }
    hints:
      - "สองกิ่งต่างกันที่อะไร"
      - "ส่วนที่กิ่ง ข เสียไปแต่กิ่ง ก ยังมีอยู่ คือส่วนใด"
    solution: "ทั้งสองกิ่งไม่มีเปลือก (โฟลเอ็ม) แต่กิ่ง ข เสียเนื้อไม้ไปด้วย และมีเพียงกิ่ง ข ที่ใบเหี่ยว แสดงว่าไซเลมที่ลำเลียงน้ำอยู่ในเนื้อไม้"
