problems:
  - id: chemistry.materials.polymers-ceramics-composites.p001
    topics: [chemistry.materials.polymers-ceramics-composites]
    difficulty: 1
    type: mcq
    stem: "ของใช้ชิ้นใดทำจากพอลิเมอร์"
    choices:
      - { id: a, text: "ถุงพลาสติกใส่ของ", correct: true, feedback: "ถูก พลาสติกเป็นพอลิเมอร์สังเคราะห์ เกิดจากมอนอเมอร์ต่อกันเป็นสายยาว" }
      - { id: b, text: "ชามกระเบื้อง", feedback: "ชามกระเบื้องทำจากดินที่ผ่านการเผา เป็นเซรามิก" }
      - { id: c, text: "ช้อนสเตนเลส", feedback: "สเตนเลสเป็นโลหะผสมของเหล็ก" }
      - { id: d, text: "แก้วน้ำใส", feedback: "แก้วจัดเป็นเซรามิก ผลิตจากทรายที่หลอมที่อุณหภูมิสูง" }
    hints:
      - "พอลิเมอร์ที่พบบ่อยที่สุดในบ้านคืออะไร"
      - "พลาสติก ยาง และเส้นใยเป็นพอลิเมอร์"
    solution: "ถุงพลาสติกทำจาก **พอลิเมอร์** (พอลิเอทิลีน) ชามกระเบื้องและแก้วเป็นเซรามิก ช้อนสเตนเลสเป็นโลหะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.polymers-ceramics-composites.p002
    topics: [chemistry.materials.polymers-ceramics-composites]
    difficulty: 2
    type: match
    stem: "จับคู่ของใช้กับประเภทของวัสดุหลัก"
    pairs:
      - { left: "ยางรถจักรยาน", right: "ยาง (พอลิเมอร์)" }
      - { left: "ขวดน้ำดื่มใส PET", right: "พลาสติก (พอลิเมอร์)" }
      - { left: "ถ้วยชาด่านเกวียน", right: "เซรามิก" }
      - { left: "เสาบ้านคอนกรีตเสริมเหล็ก", right: "วัสดุผสม" }
    hints:
      - "เซรามิกผ่านการเผาที่อุณหภูมิสูง"
      - "วัสดุผสมรวมวัสดุ 2 ชนิดให้ทำงานร่วมกัน"
    solution: "ยางรถเป็นยาง · ขวด PET เป็นพลาสติก · ถ้วยด่านเกวียนเป็นเซรามิก · คอนกรีตเสริมเหล็กเป็นวัสดุผสม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.polymers-ceramics-composites.p003
    topics: [chemistry.materials.polymers-ceramics-composites]
    difficulty: 2
    type: mcq
    stem: "ลูกถ้วยที่ยึดสายไฟบนเสาไฟฟ้าริมถนนทำจากเซรามิก เพราะเหตุใด"
    choices:
      - { id: a, text: "เซรามิกไม่นำไฟฟ้า และทนแดด ฝน และความร้อนได้นานโดยไม่เสื่อม", correct: true, feedback: "ถูก ลูกถ้วยเป็นฉนวนกันไม่ให้ไฟฟ้ารั่วลงเสา และต้องทนสภาพอากาศนานหลายปี" }
      - { id: b, text: "เซรามิกนำไฟฟ้าได้ดี จึงช่วยส่งไฟฟ้า", feedback: "เซรามิกไม่นำไฟฟ้า สายไฟต่างหากที่นำไฟฟ้า" }
      - { id: c, text: "เซรามิกยืดหยุ่น ไม่แตกเมื่อถูกกระแทก", feedback: "เซรามิกแข็งแต่เปราะ ไม่ยืดหยุ่น" }
    hints:
      - "ลูกถ้วยต้องกันไม่ให้ไฟฟ้าไหลลงเสา"
      - "ลูกถ้วยอยู่กลางแจ้งตลอดเวลา"
    solution: "เซรามิก **ไม่นำไฟฟ้า** และ **ทนสภาพอากาศ** จึงเหมาะทำฉนวนยึดสายไฟ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.polymers-ceramics-composites.p004
    topics: [chemistry.materials.polymers-ceramics-composites]
    difficulty: 3
    type: text
    stem: "การเติมกำมะถันลงในยางธรรมชาติแล้วให้ความร้อน เพื่อให้ยางแข็งแรงและคืนรูปได้ดี เรียกว่ากระบวนการอะไร"
    accepted: ["วัลคาไนเซชัน", "วัลคาไนซ์", "การวัลคาไนซ์", "vulcanization", "vulcanisation", "วัลคาไนเซชั่น"]
    misconceptions:
      - { match: "พอลิเมอไรเซชัน", feedback: "พอลิเมอไรเซชันคือการต่อมอนอเมอร์เป็นพอลิเมอร์ แต่ยางเป็นพอลิเมอร์อยู่แล้ว กระบวนการนี้เชื่อมสายที่มีอยู่" }
      - { match: "รีไซเคิล", feedback: "รีไซเคิลคือการนำวัสดุใช้แล้วกลับมาผลิตใหม่ ไม่ใช่การเติมกำมะถัน" }
    hints:
      - "ชื่อกระบวนการนี้มาจากชื่อเทพเจ้าแห่งไฟของโรมัน"
      - "ขึ้นต้นด้วย วัลคา-"
    solution: "เรียกว่า **วัลคาไนเซชัน** กำมะถันเชื่อมสายพอลิเมอร์ของยางเข้าด้วยกันบางจุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.polymers-ceramics-composites.p005
    topics: [chemistry.materials.polymers-ceramics-composites]
    difficulty: 3
    type: mcq
    stem: "จานเมลามีนที่แตกแล้วนำไปหลอมเพื่อขึ้นรูปใหม่ไม่ได้ แต่ขวด PET หลอมขึ้นรูปใหม่ได้ เพราะเหตุใด"
    choices:
      - { id: a, text: "เมลามีนเป็นพลาสติกเทอร์โมเซต สายพอลิเมอร์เชื่อมกันเป็นร่างแห จึงไม่อ่อนตัวเมื่อร้อน", correct: true, feedback: "ถูก ส่วน PET เป็นเทอร์โมพลาสติก สายแยกกัน จึงอ่อนตัวเมื่อร้อน" }
      - { id: b, text: "เมลามีนเป็นเซรามิก จึงทนร้อนมาก", feedback: "เมลามีนเป็นพลาสติก ไม่ใช่เซรามิก แม้จะแข็งคล้ายกระเบื้อง" }
      - { id: c, text: "เมลามีนมีจุดหลอมเหลวสูงกว่าเตาทุกชนิด", feedback: "เมลามีนไม่หลอมเพราะโครงสร้างร่างแห ถ้าร้อนมากจะไหม้และสลายตัว" }
      - { id: d, text: "PET เป็นยางธรรมชาติ", feedback: "PET เป็นพลาสติกสังเคราะห์" }
    hints:
      - "พลาสติกแบ่งเป็น 2 แบบตามการตอบสนองต่อความร้อน"
      - "สายพอลิเมอร์ที่เชื่อมกันเป็นร่างแหเลื่อนผ่านกันได้หรือไม่"
    solution: "เมลามีนเป็น **พลาสติกเทอร์โมเซต** ที่สายเชื่อมกันเป็นร่างแห ไม่อ่อนตัวเมื่อร้อน ส่วน PET เป็นเทอร์โมพลาสติกที่หลอมได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.polymers-ceramics-composites.p006
    topics: [chemistry.materials.polymers-ceramics-composites]
    difficulty: 4
    type: mcq
    stem: "กันสาดคอนกรีตยื่นออกจากผนัง ปลายด้านหนึ่งฝังในผนัง อีกด้านลอยอยู่และรับน้ำหนักที่ปลาย (ดูภาพ) ช่างควรวางเหล็กเส้นหลักไว้ในส่วนใด"
    figure:
      src: p-cantilever.svg
      alt: "แผ่นคอนกรีตแนวนอนยื่นออกจากผนังทางซ้าย ปลายขวาลอยอยู่และมีลูกศรสีแดงกดลงที่ปลาย เส้นประแบ่งความหนาของแผ่นเป็นครึ่งบน (ก) และครึ่งล่าง (ข)"
    choices:
      - { id: a, text: "ครึ่งบน (ก)", correct: true, feedback: "ถูก กันสาดโค้งลงที่ปลาย ด้านบนจึงถูกยืดหรือถูกดึง ต้องมีเหล็กรับแรงดึง" }
      - { id: b, text: "ครึ่งล่าง (ข)", feedback: "จำมาจากคานที่วางบนเสาสองต้นซึ่งด้านล่างถูกดึง แต่กันสาดโค้งในทิศตรงข้าม ด้านล่างถูกกด" }
      - { id: c, text: "ไม่ต้องใช้เหล็ก เพราะคอนกรีตแข็งแรงพอ", feedback: "คอนกรีตทนแรงดึงไม่ดี ส่วนที่ถูกดึงจะแตกร้าว" }
    hints:
      - "นึกภาพไม้บรรทัดที่กดปลายข้างหนึ่งไว้ที่ขอบโต๊ะแล้วกดปลายอีกข้างลง ด้านไหนถูกยืด"
      - "เหล็กเส้นต้องอยู่ฝั่งที่ถูกดึง"
    solution: "เมื่อปลายกันสาดถูกกดลง แผ่นจะโค้งคว่ำ **ด้านบนถูกดึง** ด้านล่างถูกกด คอนกรีตรับแรงดึงไม่ดี จึงต้องวางเหล็กเส้นหลักไว้ใน **ครึ่งบน (ก)**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.polymers-ceramics-composites.p007
    topics: [chemistry.materials.polymers-ceramics-composites]
    difficulty: 4
    type: numeric
    stem: "ถุงพลาสติกหิ้วใบหนึ่งหนัก 5 g ถ้าคนไทย 66 ล้านคน ลดใช้ถุงคนละ 1 ใบทุกวันตลอด 365 วัน จะลดขยะพลาสติกได้กี่ตัน (1 ตัน = 1,000 kg)"
    answer: { value: 120450, tolerance: 50, unit: ตัน }
    misconceptions:
      - { match: 120450000, feedback: "นี่คือมวลในหน่วยกิโลกรัม ต้องหาร 1,000 อีกครั้งเพื่อเป็นตัน" }
      - { match: 330, feedback: "นี่คือขยะที่ลดได้ใน 1 วันเท่านั้น ต้องคูณ 365 วัน" }
    hints:
      - "หาจำนวนถุงทั้งหมด: คน × ใบต่อวัน × วัน"
      - "คูณด้วย 5 g แล้วเปลี่ยนกรัมเป็นตัน (หาร 1,000,000)"
    solution: "ถุง $= 66{,}000{,}000 \\times 365 = 24{,}090{,}000{,}000$ ใบ มวล $= 120{,}450{,}000{,}000$ g $= 120{,}450{,}000$ kg $=$ **120,450 ตัน**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.polymers-ceramics-composites.p008
    topics: [chemistry.materials.polymers-ceramics-composites]
    difficulty: 2
    type: mcq
    stem: "ทำไมจึงไม่ใช้เซรามิกทำหัวค้อน แม้เซรามิกจะแข็งมาก"
    choices:
      - { id: a, text: "เซรามิกเปราะ เมื่อถูกกระแทกแรง ๆ จะแตก", correct: true, feedback: "ถูก แข็งไม่ได้แปลว่าทนการกระแทก" }
      - { id: b, text: "เซรามิกนำความร้อนดีเกินไป", feedback: "เซรามิกนำความร้อนไม่ดี และการนำความร้อนไม่ใช่ปัญหาของหัวค้อน" }
      - { id: c, text: "เซรามิกอ่อนกว่าตะปู", feedback: "เซรามิกแข็งกว่าเหล็กหลายชนิด ปัญหาอยู่ที่ความเปราะ" }
    hints:
      - "นึกถึงจานกระเบื้องที่ตกพื้น"
      - "ความแข็งกับความเปราะเป็นสมบัติคนละอย่าง"
    solution: "เซรามิก **แข็งแต่เปราะ** หัวค้อนต้องรับแรงกระแทกซ้ำ ๆ จึงใช้เหล็กกล้าซึ่งเหนียวกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.polymers-ceramics-composites.p009
    topics: [chemistry.materials.polymers-ceramics-composites]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการทำเครื่องปั้นดินเผาเคลือบแบบด่านเกวียนให้ถูกต้อง"
    items:
      - "นวดดินเหนียวให้เนื้อเนียน ไม่มีฟองอากาศ"
      - "ขึ้นรูปบนแป้นหมุน"
      - "ตากในที่ร่มให้แห้งสนิท"
      - "เผาดิบ"
      - "ชุบน้ำเคลือบ"
      - "เผาเคลือบที่อุณหภูมิสูง"
    hints:
      - "ต้องเตรียมดินก่อนขึ้นรูป และชิ้นงานต้องแห้งก่อนเข้าเตา"
      - "การเผามี 2 ครั้ง ก่อนและหลังเคลือบ"
    solution: "นวดดิน → ขึ้นรูป → ตากให้แห้ง → เผาดิบ → เคลือบ → เผาเคลือบ ถ้าเผาชิ้นงานที่ยังไม่แห้ง น้ำในดินจะกลายเป็นไอและทำให้แตก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.polymers-ceramics-composites.p010
    topics: [chemistry.materials.polymers-ceramics-composites]
    difficulty: 3
    type: mcq
    stem: "ในฤดูร้อนของไทย นักเรียนสวมเสื้อผ้าฝ้ายแล้วรู้สึกสบายกว่าเสื้อพอลิเอสเตอร์ 100% เพราะเหตุใด"
    choices:
      - { id: a, text: "ฝ้ายดูดซับเหงื่อได้ดีกว่า เหงื่อจึงไม่ค้างบนผิว", correct: true, feedback: "ถูก เส้นใยธรรมชาติอย่างฝ้ายดูดซับน้ำได้ดี ส่วนพอลิเอสเตอร์ดูดซับน้ำน้อย" }
      - { id: b, text: "ฝ้ายแข็งแรงกว่าและไม่ยับ", feedback: "ฝ้ายยับง่ายกว่าพอลิเอสเตอร์ และความแข็งแรงไม่เกี่ยวกับความสบาย" }
      - { id: c, text: "พอลิเอสเตอร์ทำจากโลหะ จึงร้อน", feedback: "พอลิเอสเตอร์เป็นพอลิเมอร์สังเคราะห์ ไม่ใช่โลหะ" }
    hints:
      - "เปรียบเทียบการดูดซับน้ำของเส้นใยธรรมชาติกับเส้นใยสังเคราะห์"
      - "อากาศร้อนทำให้เหงื่อออกมาก"
    solution: "ฝ้าย **ดูดซับเหงื่อได้ดี** จึงใส่สบายในอากาศร้อน ส่วนพอลิเอสเตอร์ไม่ยับและแห้งเร็ว เหมาะกับงานที่ต้องการความทนทาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.polymers-ceramics-composites.p011
    topics: [chemistry.materials.polymers-ceramics-composites]
    difficulty: 4
    type: mcq
    stem: "ยางรัดของยืดได้ยาวแล้วกลับคืนรูปเดิมเมื่อปล่อย ข้อใดอธิบายด้วยโครงสร้างระดับโมเลกุลได้ถูกต้อง"
    choices:
      - { id: a, text: "สายพอลิเมอร์ขดงออยู่และเชื่อมกันเป็นบางจุด เมื่อดึงสายจะยืดตรง เมื่อปล่อยจุดเชื่อมดึงสายกลับมาขดเหมือนเดิม", correct: true, feedback: "ถูก จุดเชื่อมห่าง ๆ ทำให้ยืดได้มาก แต่ไม่เลื่อนหลุดจากกัน" }
      - { id: b, text: "สายพอลิเมอร์เชื่อมกันหนาแน่นเป็นร่างแหทุกตำแหน่ง", feedback: "ถ้าเชื่อมกันหนาแน่นจะแข็งเหมือนพลาสติกเทอร์โมเซต ยืดไม่ได้" }
      - { id: c, text: "สายพอลิเมอร์แยกกันโดยไม่มีจุดเชื่อมเลย", feedback: "ถ้าไม่มีจุดเชื่อม สายจะเลื่อนผ่านกันและไม่คืนรูป เหมือนยางดิบที่ยืดแล้วย้วย" }
      - { id: d, text: "ยางมีทะเลอิเล็กตรอนเหมือนโลหะ", feedback: "ยางเป็นพอลิเมอร์ ไม่มีพันธะโลหะ" }
    hints:
      - "ยางที่ผ่านวัลคาไนเซชันมีจุดเชื่อมระหว่างสายมากหรือน้อย"
      - "อะไรดึงสายให้กลับเข้าที่"
    solution: "สายพอลิเมอร์ของยาง **ขดงอและเชื่อมกันเป็นบางจุด** การยืดคือการคลายขด จุดเชื่อมป้องกันไม่ให้สายเลื่อนหลุด ยางจึงคืนรูปได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.materials.polymers-ceramics-composites.p012
