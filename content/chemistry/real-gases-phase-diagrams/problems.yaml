      - { match: 1.248, feedback: 'คำนวณกลับส่วนเป็น $nRT/PV$ แทน $PV/nRT$' }
    solution: '$Z = PV/nRT = 39.98 \times 0.500 / (1.00 \times 0.08314 \times 300) = 19.99 / 24.94 = 0.801$ ค่าน้อยกว่า 1 มากกว่ากรณีภาชนะ 1.00 L (Z ≈ 0.90) แสดงว่าเมื่อแก๊สถูกอัดแน่นขึ้น แรงดึงดูดมีอิทธิพลมากขึ้น'
