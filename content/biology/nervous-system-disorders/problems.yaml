problems:
  - id: biology.animals.nervous-system-disorders.p001
    topics: [biology.animals.nervous-system-disorders]
    difficulty: 1
    type: mcq
    stem: "ขณะคุยกับเพื่อนร่วมงาน คนหนึ่งพูดไม่ชัดและปากเบี้ยวครึ่งซีกกะทันหัน ควรทำอย่างไรเป็นอันดับแรก"
    choices:
      - { id: a, text: "โทร 1669 ทันที และสังเกตเวลาที่อาการเริ่ม", correct: true }
      - { id: b, text: "รอดูต่อไปอีกสักครู่ เผื่ออาการจะหายเอง", feedback: "โรคหลอดเลือดสมองต้องได้รับการรักษาเร็ว การรอดูอาจทำให้เสียโอกาสสำคัญ" }
      - { id: c, text: "ให้ดื่มน้ำมาก ๆ เพื่อให้ร่างกายสดชื่น", feedback: "การดื่มน้ำไม่ได้รักษาโรคหลอดเลือดสมองและทำให้เสียเวลา สิ่งสำคัญคือโทร 1669 ทันทีเพื่อให้ถึงโรงพยาบาลเร็วที่สุด" }
      - { id: d, text: "ให้นอนพักในที่เงียบโดยไม่ต้องเรียกความช่วยเหลือ", feedback: "การพักผ่อนอย่างเดียวไม่พอ ต้องได้รับการประเมินจากแพทย์ทันที" }
    hints:
      - "อาการแบบนี้เกิดกะทันหันและเป็นข้างเดียว"
      - "ดูหมายเลขสายด่วนเหตุฉุกเฉินที่บทเรียนแนะนำ"
    solution: "อาการพูดไม่ชัดและปากเบี้ยวข้างเดียวกะทันหันเป็นอาการเตือนของโรคหลอดเลือดสมอง ต้องโทร 1669 ทันทีและบันทึกเวลาที่เริ่มมีอาการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system-disorders.p002
    topics: [biology.animals.nervous-system-disorders]
    difficulty: 1
    type: text
    stem: "หมายเลขสายด่วนเหตุฉุกเฉินของประเทศไทยที่ใช้เรียกความช่วยเหลือทันที คือหมายเลขใด"
    accepted: ["1669"]
    hints:
      - "หมายเลขนี้มีสี่หลัก"
      - "ตัวเลขนี้ขึ้นต้นด้วยหนึ่ง"
    solution: "1669 คือสายด่วนเหตุฉุกเฉินที่ควรโทรทันทีเมื่อสงสัยว่าเกิดอาการเตือนรุนแรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system-disorders.p003
    topics: [biology.animals.nervous-system-disorders]
    difficulty: 2
    type: mcq
    stem: "คุณตาอายุ 70 ปีมีมือสั่นขณะพัก เคลื่อนไหวช้าลง และการทรงตัวลดลง อาการเหล่านี้สอดคล้องกับโรคใดมากที่สุด"
    choices:
      - { id: a, text: "พาร์กินสัน", correct: true }
      - { id: b, text: "ลมชัก", feedback: "ลมชักเกิดจากการปล่อยกระแสไฟฟ้าผิดปกติเป็นช่วง ๆ ไม่ได้ทำให้มือสั่นขณะพักเป็นลักษณะหลัก" }
      - { id: c, text: "หลอดเลือดสมองแตกเฉียบพลัน", feedback: "โรคหลอดเลือดสมองแตกมักมีอาการเกิดกะทันหันและเป็นข้างเดียว ไม่ใช่อาการค่อย ๆ เป็นแบบนี้" }
      - { id: d, text: "ไมเกรน", feedback: "ไมเกรนมีอาการปวดศีรษะเป็นลักษณะเด่น ไม่ได้มีมือสั่นขณะพักเป็นลักษณะหลัก" }
    hints:
      - "ลักษณะสำคัญคือการสั่นขณะพักและการเคลื่อนไหวช้า"
      - "โรคนี้มีโดปามีนเป็นสารสื่อประสาทที่เกี่ยวข้อง"
    solution: "พาร์กินสันเกิดจากการสูญเสียเซลล์ประสาทที่สร้างโดปามีน ทำให้มีอาการสั่นขณะพักและการเคลื่อนไหวช้า การทรงตัวลดลงเป็นอาการที่พบได้ในระยะต่อมา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system-disorders.p004
    topics: [biology.animals.nervous-system-disorders]
    difficulty: 2
    type: mcq
    stem: "ลักษณะทางพยาธิวิทยาที่สำคัญของโรคอัลไซเมอร์ในสมองได้แก่อะไร"
    choices:
      - { id: a, text: "อะไมลอยด์-เบตาสะสมเป็นแผ่น และโปรตีนทาวพันกันเป็นเส้นใย ร่วมกับการสูญเสียเซลล์ประสาท", correct: true }
      - { id: b, text: "เม็ดเลือดแดงแตกเป็นจำนวนมากในสมอง", feedback: "การแตกของเม็ดเลือดแดงไม่ใช่ลักษณะหลักของโรคอัลไซเมอร์" }
      - { id: c, text: "เส้นเลือดหัวใจอุดตันทำให้เซลล์สมองขาดเลือด", feedback: "การอุดตันของเส้นเลือดหัวใจเป็นโรคหัวใจ ไม่ใช่ลักษณะหลักของอัลไซเมอร์" }
      - { id: d, text: "กระดูกกะโหลกหนาขึ้นจนกดสมอง", feedback: "กระดูกกะโหลกหนาขึ้นไม่ใช่ลักษณะของโรคอัลไซเมอร์" }
    hints:
      - "โรคนี้เกี่ยวข้องกับโปรตีนสองชนิดที่สะสมอยู่ในเนื้อสมอง"
      - "ดูคำว่าแผ่นและเส้นใยในคำตอบ"
    solution: "อัลไซเมอร์มีการสะสมอะไมลอยด์-เบตาเป็นแผ่นและทาวโปรตีนพันกันเป็นเส้นใยในเซลล์ประสาท ร่วมกับการสูญเสียเซลล์ประสาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system-disorders.p005
    topics: [biology.animals.nervous-system-disorders]
    difficulty: 2
    type: mcq
    stem: "โรคหลอดเลือดสมองชนิดขาดเลือดเกิดจากสาเหตุใดเป็นหลัก"
    choices:
      - { id: a, text: "หลอดเลือดที่ไปเลี้ยงสมองถูกอุดตัน ทำให้เนื้อสมองส่วนนั้นขาดเลือด", correct: true }
      - { id: b, text: "หลอดเลือดในสมองแตกและมีเลือดคั่ง", feedback: "นั่นคือโรคหลอดเลือดสมองแบบเลือดออก" }
      - { id: c, text: "สมองได้รับแรงกระแทกจากภายนอกโดยตรงเท่านั้น", feedback: "แรงกระแทกเป็นสาเหตุของการบาดเจ็บของสมอง ไม่ใช่สาเหตุหลักของชนิดขาดเลือด" }
      - { id: d, text: "เซลล์ประสาทส่งสัญญาณผิดปกติซ้ำ ๆ เป็นช่วง", feedback: "การส่งสัญญาณผิดปกติเป็นช่วงเกี่ยวข้องกับลมชัก" }
    hints:
      - "แบบนี้เกิดจากการไปเลี้ยงของเลือดที่หยุดชะงัก"
      - "ลองนึกถึงภาพลิ่มเลือดที่ไปขวางทางหลอดเลือด"
    solution: "หลอดเลือดสมองแบบขาดเลือดเกิดจากการอุดตัน เช่น ลิ่มเลือด ทำให้เนื้อสมองส่วนที่หล่อเลี้ยงด้วยหลอดเลือดนั้นขาดออกซิเจนและเสียหาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system-disorders.p006
    topics: [biology.animals.nervous-system-disorders]
    difficulty: 2
    type: mcq
    stem: "ขณะที่เพื่อนร่วมชั้นเกิดอาการชักกระตุก ควรทำอย่างไรเป็นอันดับแรก"
    choices:
      - { id: a, text: "ย้ายสิ่งของอันตรายออกและปกป้องศีรษะไม่ให้กระแทก โดยไม่กดตัวหรืองัดปาก", correct: true }
      - { id: b, text: "ใส่ช้อนหรือของแข็งเข้าปากเพื่อกันลิ้นกัด", feedback: "การใส่สิ่งของเข้าปากอาจทำให้ฟันหักหรือสำลักได้ จึงไม่ควรทำ" }
      - { id: c, text: "จับตัวให้นิ่งแน่นเพื่อไม่ให้กระตุก", feedback: "การกดหรือฝืนจับตัวอาจทำให้บาดเจ็บ ควรดูแลรอบตัวให้ปลอดภัยและปกป้องศีรษะแทน" }
      - { id: d, text: "ป้อนน้ำหรือยาทันทีเพื่อหยุดการชัก", feedback: "ไม่ควรให้น้ำหรือยาทางปากขณะชัก เพราะอาจสำลัก" }
    hints:
      - "สิ่งสำคัญคือการไม่ให้ศีรษะได้รับบาดเจ็บ และไม่ให้สำลัก"
      - "ห้ามทำสิ่งที่อาจเข้าไปในปากหรือทางเดินหายใจ"
    solution: "อาการชักส่วนใหญ่หยุดได้เอง ขณะชักให้ดูแลรอบตัวให้ปลอดภัย ปกป้องศีรษะ ไม่กดตัว และไม่ใส่สิ่งของเข้าปาก เมื่อหยุดชักจึงจัดให้นอนตะแคง จับเวลาไว้ และโทร 1669 หากชักนานเกิน 5 นาที ชักซ้ำ บาดเจ็บ หรือชักครั้งแรก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system-disorders.p007
    topics: [biology.animals.nervous-system-disorders]
    difficulty: 2
    type: mcq
    stem: "ลมชักเกิดจากกลไกใดในระบบประสาท"
    choices:
      - { id: a, text: "เซลล์ประสาทจำนวนมากปล่อยกระแสไฟฟ้าผิดปกติพร้อมกันเป็นช่วง", correct: true }
      - { id: b, text: "เลือดไปเลี้ยงสมองไม่พอตลอดเวลาจนเซลล์ตาย", feedback: "การขาดเลือดเป็นสาเหตุของโรคหลอดเลือดสมองแบบขาดเลือด ไม่ใช่ลมชักโดยตรง" }
      - { id: c, text: "กระดูกสันหลังเคลื่อนและกดเส้นประสาททั้งหมด", feedback: "การกดทับเส้นประสาทจากกระดูกสันหลังทำให้เกิดอาการอื่น ไม่ใช่ลมชัก" }
      - { id: d, text: "เซลล์ประสาทหยุดส่งสัญญาณทั้งหมดไปตลอดกาล", feedback: "การหยุดส่งสัญญาณทั้งหมดไม่ใช่ลักษณะของลมชัก" }
    hints:
      - "ลมชักเกี่ยวกับกระแสไฟฟ้าในสมองที่ผิดปกติ"
      - "คำว่า 'พร้อมกัน' และ 'เป็นช่วง' เป็นคำสำคัญ"
    solution: "ลมชักเกิดเมื่อเซลล์ประสาทจำนวนมากปล่อยกระแสไฟฟ้าผิดปกติพร้อมกันเป็นช่วงชั่วขณะ ทำให้เกิดอาการชักหรือหมดสติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system-disorders.p008
    topics: [biology.animals.nervous-system-disorders]
    difficulty: 2
    type: match
    stem: "จับคู่โรคหรือภาวะทางระบบประสาทกับลักษณะสำคัญที่พบบ่อย"
    pairs:
      - { left: "พาร์กินสัน", right: "สั่นขณะพักและเคลื่อนไหวช้า" }
      - { left: "อัลไซเมอร์", right: "ความจำระยะสั้นลดลงก่อนอาการอื่น" }
      - { left: "ลมชัก", right: "การปล่อยไฟฟ้าผิดปกติจนเกิดอาการชัก" }
      - { left: "หลอดเลือดสมองขาดเลือด", right: "เนื้อสมองส่วนหนึ่งขาดเลือดจากการอุดตัน" }
    hints:
      - "ดูลักษณะที่เด่นที่สุดของแต่ละโรค"
      - "อัลไซเมอร์เริ่มจากความจำที่ลดลง"
    solution: "พาร์กินสันมีการสั่นขณะพักและเคลื่อนไหวช้า อัลไซเมอร์มีความจำระยะสั้นลดลงก่อน ลมชักมีการปล่อยไฟฟ้าผิดปกติ และหลอดเลือดสมองขาดเลือดเกิดจากการอุดตัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system-disorders.p009
    topics: [biology.animals.nervous-system-disorders]
    difficulty: 2
    type: text
    stem: "หมายเลขสายด่วนสุขภาพจิตของประเทศไทยที่ผู้ที่ต้องการคำปรึกษาเรื่องสุขภาพใจโทรได้ คือหมายเลขใด"
    accepted: ["1323"]
    hints:
      - "บริการนี้ใช้ปรึกษาเรื่องความเครียด ความเศร้า และสุขภาพใจ"
      - "หมายเลขนี้มีสี่หลัก ขึ้นต้นด้วยเลขหนึ่งเหมือนสายด่วนเหตุฉุกเฉิน"
    solution: "1323 คือสายด่วนสุขภาพจิต ใช้ปรึกษาเรื่องความเครียด ความเศร้า และสุขภาพใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system-disorders.p010
    topics: [biology.animals.nervous-system-disorders]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนแรกที่ควรทำเมื่อสงสัยว่าคนใกล้ตัวมีโรคหลอดเลือดสมอง"
    items:
      - "สังเกตอาการเตือนด้วยหลัก BE FAST"
      - "โทร 1669 ทันที"
      - "จดเวลาที่เริ่มมีอาการไว้"
      - "แจ้งเวลาที่เริ่มมีอาการแก่ทีมแพทย์ฉุกเฉินเมื่อมาถึง"
    hints:
      - "สังเกตอาการก่อนแต่อย่าช้าจนเสียเวลา"
      - "เวลาที่เริ่มมีอาการเป็นข้อมูลสำคัญให้แพทย์"
    solution: "สังเกตอาการด้วย BE FAST โทร 1669 ทันที จดเวลาที่เริ่มมีอาการ และแจ้งเวลานั้นแก่ทีมแพทย์ฉุกเฉิน เพราะการรักษาบางอย่างต้องทำภายในไม่กี่ชั่วโมงหลังเริ่มมีอาการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.nervous-system-disorders.p011
    topics: [biology.animals.nervous-system-disorders]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นความเข้าใจที่ถูกต้องเกี่ยวกับออทิซึม"
    choices:
      - { id: a, text: "เป็นความแตกต่างทางพัฒนาการของสมองที่เริ่มตั้งแต่วัยเด็ก ไม่ได้เกิดจากการเลี้ยงดู", correct: true }
      - { id: b, text: "เกิดจากการเลี้ยงดูที่ไม่ดีของพ่อแม่", feedback: "ออทิซึมไม่ได้เกิดจากการเลี้ยงดู ความเข้าใจผิดนี้ทำให้เกิดการตีตราและทำร้ายครอบครัว" }
      - { id: c, text: "หายได้เองเมื่อโตขึ้นโดยไม่ต้องมีการช่วยเหลือ", feedback: "ออทิซึมเป็นลักษณะทางพัฒนาการที่อยู่ตลอดชีวิต แต่ผู้มีลักษณะนี้พัฒนาทักษะได้ด้วยการสนับสนุน" }
      - { id: d, text: "เป็นโรคที่ติดต่อผ่านการสัมผัสกับผู้ที่มีลักษณะนี้", feedback: "ออทิซึมไม่ใช่โรคติดต่อ" }
    hints:
