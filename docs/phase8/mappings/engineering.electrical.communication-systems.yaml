  - { framework: th-coe-engineering-basics, indicators: ["EE-3.2"], coverage: partial, note: "สอนหลักการระบบสื่อสาร ได้แก่ องค์ประกอบของระบบ สเปกตรัมและแบนด์วิดท์ การมอดูเลต AM และดิจิทัลเบื้องต้น ทฤษฎีบทชักตัวอย่างและแอลิแอซ เดซิเบลและ SNR ความจุของแชนนอน และงบประมาณกำลังของลิงก์อย่างง่าย ยังไม่สอนการมอดูเลต FM เชิงคณิตศาสตร์ ระบบดิจิทัลแบบซับซ้อน การเข้ารหัสช่องสัญญาณ การออกแบบเสาอากาศ และระบบเครือข่ายโทรคมนาคม" }
