id: management.operations.inventory
subject: management
title: { th: การจัดการสินค้าคงคลัง, en: Inventory management }
summary: ต้นทุนการสั่งและการเก็บ การวิเคราะห์ ABC ปริมาณการสั่งซื้อที่ประหยัด จุดสั่งซื้อใหม่ สินค้าคงคลังสำรอง ระบบทบทวนเป็นรอบ คลังสินค้า และการขนถ่ายวัสดุ
difficulty: 6.5
minutes: 50
prerequisites: [management.operations.lean, math.number.roots, business.stats.forecasting]
encompasses:
  - { id: math.number.roots, weight: 0.2 }
  - { id: business.stats.forecasting, weight: 0.2 }
  - { id: management.operations.lean, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: eoq-cost.svg
    alt: "กราฟต้นทุนต่อปีของถุงมือยาง D = 12,000 กล่อง S = 450 บาท H = 30 บาท แกนนอนคือปริมาณสั่งต่อครั้ง 0 ถึง 1,500 กล่อง แกนตั้งคือต้นทุนต่อปี 0 ถึง 40,000 บาท เส้นสีฟ้าต้นทุนสั่งซื้อ SD/Q ลดลงเป็นเส้นโค้ง เส้นสีส้มต้นทุนเก็บรักษา HQ/2 เพิ่มขึ้นเป็นเส้นตรง เส้นสีเขียวต้นทุนรวมเป็นรูปตัวยูต่ำสุดที่ Q = 600 กล่อง ต้นทุนรวม 18,000 บาท ตรงกับจุดที่เส้นสีฟ้าและสีส้มตัดกันที่ 9,000 บาท"
    caption: "ต้นทุนรวมต่ำสุดที่ปริมาณสั่งซื้อที่ประหยัด ซึ่งเป็นจุดที่ต้นทุนการสั่งเท่ากับต้นทุนการเก็บ"
  - type: interactive
    title: ลองเปลี่ยนต้นทุนการสั่ง S และต้นทุนการเก็บ H
    caption: "เส้นโค้งคือต้นทุนรวมต่อปีเมื่อ D = 12,000 สังเกตว่าจุดต่ำสุดเลื่อนไปทางขวาเมื่อ S เพิ่ม และเลื่อนไปทางซ้ายเมื่อ H เพิ่ม"
    widget:
      kind: function-plot
      functions: ["\\frac{12000 S}{x} + \\frac{H x}{2}"]
      sliders:
        - { name: S, min: 100, max: 1000, step: 50, value: 450, label: ต้นทุนการสั่งต่อครั้ง (บาท) }
        - { name: H, min: 10, max: 60, step: 5, value: 30, label: ต้นทุนการเก็บต่อกล่องต่อปี (บาท) }
      x: [100, 1500]
      y: [0, 40000]
  - type: worked-example
    title: จุดสั่งซื้อใหม่ของถุงมือยางที่ระดับบริการ 95%
    problem: "ห้องพัสดุใช้ถุงมือยางเฉลี่ยวันละ 40 กล่อง ส่วนเบี่ยงเบนมาตรฐานรายวัน 12 กล่อง ผู้ขายส่งของภายใน 5 วัน ต้องการระดับบริการ 95% จงหาสินค้าคงคลังสำรองและจุดสั่งซื้อใหม่"
    steps:
      - text: "ความต้องการเฉลี่ยช่วงรอของ $dL = 40 \\times 5 = 200$ กล่อง"
      - text: "ระดับบริการ 95% ได้ $z \\approx 1.645$ จากการแจกแจงปกติมาตรฐาน"
      - text: "ส่วนเบี่ยงเบนมาตรฐานช่วงรอของ $\\sigma_d\\sqrt{L} = 12\\sqrt{5} \\approx 26.83$ กล่อง"
        why: "ความแปรปรวนรายวันรวมกัน 5 วันเป็น $5\\sigma_d^2$ จึงได้ส่วนเบี่ยงเบนมาตรฐาน $\\sigma_d\\sqrt{5}$ ไม่ใช่ $5\\sigma_d$"
      - text: "$SS = 1.645 \\times 26.83 \\approx 44.1$ ปัดขึ้นเป็น 45 กล่อง"
      - text: "$\\text{ROP} = 200 + 45 = 245$ กล่อง"
    answer: "เมื่อถุงมือเหลือ 245 กล่องให้สั่ง 600 กล่อง (EOQ) โดยมีของสำรอง 45 กล่องไว้รับวันที่ใช้มากกว่าปกติ"
  - type: figure
    src: sawtooth.svg
    alt: "กราฟระดับคงคลังรูปฟันเลื่อยตลอด 40 วัน เริ่มที่ 645 กล่อง ลดลงวันละ 40 กล่องจนถึง 45 กล่องในวันที่ 15 แล้วกระโดดขึ้นเป็น 645 เมื่อของ 600 กล่องเข้า ซ้ำทุก 15 วัน เส้นประสีแดงแนวนอนที่ 245 คือจุดสั่งซื้อใหม่ ระดับคงคลังแตะเส้นนี้ในวันที่ 10 จึงสั่งของ และของมาถึงในวันที่ 15 หลังรอ 5 วัน แถบสีส้มด้านล่างสูง 45 กล่องคือสินค้าคงคลังสำรอง"
    caption: "สั่งเมื่อถึงจุดสั่งซื้อใหม่ ของมาถึงพอดีตอนที่ใช้ถึงระดับคงคลังสำรอง"
  - { type: check, problem: management.operations.inventory.p007, prompt: "ใช้ $\\sqrt{L}$ ไม่ใช่ $L$" }
  - type: worked-example
    title: สั่งกระดาษถ่ายเอกสารแบบทบทวนเป็นรอบ
    problem: "สำนักงานจังหวัด (สมมติ) นับกระดาษทุก 7 วัน ผู้ขายส่งของใน 3 วัน ใช้วันละ 15 รีม ส่วนเบี่ยงเบนมาตรฐานรายวัน 4 รีม ต้องการระดับบริการ 95% ($z = 1.645$) วันนี้นับได้ 60 รีม ต้องสั่งกี่รีม"
    steps:
      - text: "ช่วงที่ต้องคุ้มครองคือ $R + L = 7 + 3 = 10$ วัน"
        why: "ของที่สั่งวันนี้ต้องพอใช้จนกว่าของจากรอบนับถัดไปจะมาถึง"
      - text: "ความต้องการเฉลี่ย 10 วัน $15 \\times 10 = 150$ รีม"
      - text: "คงคลังสำรอง $1.645 \\times 4 \\times \\sqrt{10} \\approx 20.8$ รีม"
      - text: "ระดับเป้าหมาย $T \\approx 150 + 20.8 = 170.8$ ปัดขึ้นเป็น 171 รีม"
      - text: "ปริมาณสั่ง $171 - 60 = 111$ รีม"
    answer: "สั่ง 111 รีม ระบบนี้เหมาะกับกระดาษซึ่งเป็นของกลุ่ม C ที่สั่งพร้อมวัสดุสำนักงานอื่นจากผู้ขายเดียวกันได้"
  - type: figure
    src: p-abc.svg
    alt: "แผนภูมิพาเรโตของวัสดุสิบรายการ M1 ถึง M10 เรียงจากมากไปน้อย มูลค่าการใช้ต่อปี (พันบาท) M1 420, M2 250, M3 130, M4 70, M5 50, M6 30, M7 20, M8 15, M9 10, M10 5 รวม 1,000 พันบาท เส้นสีม่วงคือร้อยละสะสมตามแกนขวา"
    caption: "มูลค่าการใช้ต่อปีของวัสดุในคลังโรงพยาบาล (สมมติ) ใช้ในโจทย์ข้อ 8"
glossary:
  - { term: ต้นทุนการสั่งซื้อ, definition: "ค่าใช้จ่ายต่อการสั่งหนึ่งครั้ง เช่น ทำใบสั่ง ขนส่งต่อเที่ยว ตรวจรับ ไม่ขึ้นกับจำนวนชิ้น" }
  - { term: ต้นทุนการเก็บรักษา, definition: "ค่าใช้จ่ายในการถือของหนึ่งหน่วยเป็นเวลาหนึ่งปี เช่น ดอกเบี้ยของเงินที่จม พื้นที่ ประกัน และของเสื่อม" }
  - { term: การวิเคราะห์ ABC, definition: "การแบ่งรายการสินค้าตามมูลค่าการใช้ต่อปี เพื่อควบคุมรายการมูลค่าสูงอย่างเข้มงวดกว่า" }
  - { term: EOQ, definition: "ปริมาณการสั่งซื้อที่ประหยัด ทำให้ผลรวมต้นทุนการสั่งและการเก็บต่อปีต่ำสุด เท่ากับรากที่สองของ 2DS/H" }
  - { term: จุดสั่งซื้อใหม่, definition: "ระดับคงคลังที่ต้องสั่งของ เท่ากับความต้องการเฉลี่ยช่วงรอของบวกสินค้าคงคลังสำรอง" }
  - { term: สินค้าคงคลังสำรอง, definition: "ของที่เก็บเพิ่มไว้รับความต้องการที่สูงกว่าเฉลี่ยในช่วงรอของ คิดจาก z คูณส่วนเบี่ยงเบนมาตรฐานช่วงรอของ" }
  - { term: ระดับบริการ, definition: "ความน่าจะเป็นที่ของไม่ขาดในรอบการสั่งหนึ่งรอบ" }
  - { term: หน่วยบรรทุก, definition: "การรวมของหลายชิ้นเป็นหน่วยใหญ่ เช่น พาเลท เพื่อขนถ่ายครั้งเดียว ลดจำนวนครั้งที่ยก" }
flashcards:
  - { front: "สูตร EOQ", back: "Q* = √(2DS/H)" }
  - { front: "ต้นทุนรวมต่อปี", back: "TC = (D/Q)S + (Q/2)H ต่ำสุดเมื่อสองพจน์เท่ากัน" }
  - { front: "จุดสั่งซื้อใหม่", back: "ROP = dL + zσd√L" }
  - { front: "ระดับเป้าหมายของระบบทบทวนเป็นรอบ", back: "T = d(R + L) + zσd√(R + L) แล้วสั่ง T − คงคลังที่มี" }
  - { front: "ABC", back: "A: รายการน้อยแต่มูลค่ามาก ควบคุมเข้ม · C: รายการมากแต่มูลค่าน้อย ใช้ระบบง่าย" }
