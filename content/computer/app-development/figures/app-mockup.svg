<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 530" width="820" height="530" font-family="sans-serif" font-size="14">
  <title>ภาพร่างหน้าจอแอปค่าไฟ มีช่องชื่อเครื่องใช้ ช่องกำลังไฟฟ้า ช่องชั่วโมงต่อวัน ปุ่มเพิ่ม รายการเครื่องใช้ ผลรวมพลังงานและค่าไฟ ปุ่มล้าง และคำแนะนำ พร้อมป้ายเหตุการณ์ที่แต่ละส่วนรับ</title>
  <defs></defs>
  <rect x="0" y="0" width="820" height="530" fill="#ffffff"/>
  <rect x="40.0" y="20.0" width="300.0" height="480.0" rx="24" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
  <text x="190.0" y="58.0" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ค่าไฟบ้านเรา</text>
  <text x="65.0" y="94.0" font-size="13" text-anchor="start" fill="#6b7280" xml:space="preserve">เครื่องใช้</text>
  <rect x="65.0" y="100.0" width="250.0" height="30.0" rx="4" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="75.0" y="120.0" font-size="14" text-anchor="start" fill="#1f2937" xml:space="preserve">ตู้เย็น</text>
  <text x="65.0" y="152.0" font-size="13" text-anchor="start" fill="#6b7280" xml:space="preserve">กำลังไฟฟ้า (W)</text>
  <rect x="65.0" y="158.0" width="250.0" height="30.0" rx="4" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="75.0" y="178.0" font-size="14" text-anchor="start" fill="#1f2937" xml:space="preserve">150</text>
  <text x="65.0" y="210.0" font-size="13" text-anchor="start" fill="#6b7280" xml:space="preserve">ชั่วโมงต่อวัน</text>
  <rect x="65.0" y="216.0" width="250.0" height="30.0" rx="4" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="75.0" y="236.0" font-size="14" text-anchor="start" fill="#1f2937" xml:space="preserve">24</text>
  <rect x="65.0" y="258.0" width="250.0" height="40.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190.0" y="283.6" font-size="16" text-anchor="middle" fill="#1f2937" xml:space="preserve">+ เพิ่ม</text>
  <rect x="65.0" y="312.0" width="250.0" height="86.0" rx="4" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="75.0" y="334.0" font-size="13" text-anchor="start" fill="#1f2937" xml:space="preserve">ตู้เย็น 150 W × 24 ชม.</text>
  <text x="75.0" y="360.0" font-size="13" text-anchor="start" fill="#1f2937" xml:space="preserve">แอร์ 1,000 W × 8 ชม.</text>
  <text x="75.0" y="386.0" font-size="13" text-anchor="start" fill="#1f2937" xml:space="preserve">ทีวี 120 W × 5 ชม.</text>
  <text x="65.0" y="424.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">รวม 12.2 kWh/วัน ≈ 48.8 บาท</text>
  <text x="65.0" y="446.0" font-size="12" text-anchor="start" fill="#6b7280" xml:space="preserve">(ค่าไฟสมมติ 4 บาท/หน่วย)</text>
  <rect x="65.0" y="456.0" width="110.0" height="32.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="120.0" y="476.9" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ล้าง</text>
  <rect x="185.0" y="456.0" width="130.0" height="32.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="250.0" y="476.9" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">คำแนะนำ</text>
  <line x1="315.0" y1="173.0" x2="420.0" y2="173.0" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="428.0" y="178.0" font-size="13" text-anchor="start" fill="#c2410c" xml:space="preserve">พิมพ์ตัวเลข → ตรวจว่าเป็นตัวเลขบวก</text>
  <line x1="315.0" y1="278.0" x2="420.0" y2="278.0" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="428.0" y="283.0" font-size="13" text-anchor="start" fill="#c2410c" xml:space="preserve">แตะ → on_add() เพิ่มรายการ คำนวณใหม่</text>
  <line x1="315.0" y1="355.0" x2="420.0" y2="355.0" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="428.0" y="360.0" font-size="13" text-anchor="start" fill="#c2410c" xml:space="preserve">แตะรายการ → แก้หรือลบ</text>
  <line x1="315.0" y1="472.0" x2="420.0" y2="455.0" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="428.0" y="460.0" font-size="13" text-anchor="start" fill="#c2410c" xml:space="preserve">แตะ → แสดงเครื่องที่ใช้ไฟมากสุด</text>
  <line x1="120.0" y1="488.0" x2="420.0" y2="512.0" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="428.0" y="517.0" font-size="13" text-anchor="start" fill="#c2410c" xml:space="preserve">แตะ → on_clear() ล้างทั้งหมด</text>
</svg>
