id: health.sexuality.sexual-health
subject: health
title:
  th: 'สุขภาพทางเพศ: พฤติกรรมเสี่ยง โรคติดต่อทางเพศสัมพันธ์ และการตั้งครรภ์ไม่พึงประสงค์'
  en: 'Sexual health: risk behaviours, STIs and unintended pregnancy'
summary: พฤติกรรมและสถานการณ์เสี่ยง ผลกระทบของการมีเพศสัมพันธ์ในวัยเรียน โรคติดต่อทางเพศสัมพันธ์และเอชไอวี การป้องกันการตั้งครรภ์ตามข้อเท็จจริงของ WHO และแหล่งบริการ 1663
difficulty: 4.5
minutes: 35
prerequisites:
- health.sexuality.puberty
- health.sexuality.body-safety-consent
encompasses:
- id: health.sexuality.body-safety-consent
  weight: 0.2
- id: health.sexuality.puberty
  weight: 0.1
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: เชื้อสำคัญของโรคติดต่อทางเพศสัมพันธ์
  src: sti-groups.svg
  alt: สองกล่อง กล่องซ้ายรักษาหายด้วยยา ซิฟิลิส หนองใน หนองในเทียม (คลามีเดีย) พยาธิในช่องคลอด (ทริโคโมแนส) กล่องขวาไวรัส ควบคุมได้ ส่วนใหญ่ยังไม่หายขาด ไวรัสตับอักเสบบี มีวัคซีน เริม เอชไอวี เอชพีวี มีวัคซีน ด้านล่างเขียนว่าส่วนใหญ่ไม่มีอาการ ทางเดียวที่รู้แน่คือการตรวจ ถุงยางอนามัยลดความเสี่ยงได้มาก
- type: worked-example
  title: แยกข้อเท็จจริงกับความเชื่อผิด
  problem: ในกลุ่มแชตมีข้อความสามข้อ (1) "แฟนดูสุขภาพดี ไม่มีโรคแน่นอน" (2) "กินยาคุมแล้วปลอดภัยทุกอย่าง" (3) "ยาคุมฉุกเฉินคือยาทำแท้ง" อธิบายว่าแต่ละข้อจริงหรือไม่
  steps:
  - text: (1) ไม่จริง WHO ระบุว่าโรคติดต่อทางเพศสัมพันธ์ส่วนใหญ่ไม่มีอาการ ดูจากภายนอกไม่ได้ ต้องตรวจ
  - text: (2) ไม่จริง ยาคุมป้องกันการตั้งครรภ์แต่ไม่ป้องกันโรค ถุงยางอนามัยเป็นวิธีเดียวที่ป้องกันได้ทั้งสองอย่าง
    why: การแยกเป้าหมายของแต่ละวิธีช่วยให้เลือกใช้ได้ถูก
  - text: (3) ไม่จริง ยาคุมฉุกเฉินยับยั้งหรือเลื่อนการตกไข่ ไม่ได้ยุติการตั้งครรภ์ที่เกิดขึ้นแล้ว
  - text: ตอบกลับในกลุ่มด้วยข้อมูลและแหล่งอ้างอิง เช่น 1663 หรือคลินิกวัยรุ่น โดยไม่ล้อเพื่อนที่ถาม
  answer: ทั้งสามข้อเป็นความเชื่อผิด
- type: check
  problem: health.sexuality.sexual-health.p002
  prompt: ลองตอบก่อนอ่านต่อ
- type: figure
  title: เลือกแหล่งช่วยเหลือ
  src: services.svg
  alt: ผังห้าแถว สงสัยว่าตั้งครรภ์หรือกังวลเรื่องเอชไอวี → 1663 ปรึกษาเอดส์และท้องไม่พร้อม อยากตรวจโรค รับถุงยาง ปรึกษาการคุมกำเนิด → คลินิกวัยรุ่นในโรงพยาบาลรัฐ ถุงยางแตกหรือไม่ได้ป้องกัน → คุมกำเนิดฉุกเฉินภายใน 5 วัน และปรึกษาเรื่อง PEP ถูกบังคับหรือถูกล่วงละเมิดทางเพศ → 1300 ศูนย์พึ่งได้ 191 เลือดออกมาก ปวดท้องรุนแรง หมดสติ → 1669 ทันที
- type: worked-example
  title: ช่วยเพื่อนที่สงสัยว่าตั้งครรภ์
  problem: เพื่อนสนิทบอกว่าประจำเดือนขาดมาสองสัปดาห์หลังมีเพศสัมพันธ์ ร้องไห้และกลัวที่บ้านรู้ เราจะช่วยอย่างไร
  steps:
  - text: รับฟังโดยไม่ตำหนิ และเก็บเรื่องเป็นความลับจากคนที่ไม่เกี่ยวข้อง
  - text: ชวนตรวจการตั้งครรภ์ด้วยชุดตรวจหรือที่คลินิกวัยรุ่น เพราะประจำเดือนขาดเกิดจากสาเหตุอื่นได้ด้วย
  - text: แนะนำโทร 1663 ซึ่งให้คำปรึกษาทุกทางเลือกโดยไม่ตัดสิน
    why: ยิ่งรู้เร็ว ทางเลือกที่ปลอดภัยยิ่งมีมาก
  - text: ชวนคิดว่าจะบอกผู้ใหญ่คนไหนที่ไว้ใจได้ และย้ำว่าห้ามซื้อยาจากอินเทอร์เน็ต
  answer: รับฟัง ชวนตรวจ แนะนำ 1663 และหาผู้ใหญ่ที่ไว้ใจได้
- type: check
  problem: health.sexuality.sexual-health.p007
glossary:
- term: โรคติดต่อทางเพศสัมพันธ์
  definition: โรคที่ติดต่อทางเพศสัมพันธ์เป็นหลัก เกิดจากแบคทีเรีย ไวรัส หรือปรสิต ส่วนใหญ่ไม่มีอาการ
- term: PrEP และ PEP
  definition: ยาต้านไวรัสสำหรับผู้ไม่มีเชื้อเอชไอวี PrEP กินก่อนสัมผัสเชื้อ PEP เริ่มหลังสัมผัสเชื้อโดยเร็ว ต้องปรึกษาบุคลากรทางการแพทย์
- term: การคุมกำเนิดฉุกเฉิน
  definition: วิธีป้องกันการตั้งครรภ์หลังมีเพศสัมพันธ์ที่ไม่ได้ป้องกัน ใช้ภายใน 5 วัน ยิ่งเร็วยิ่งได้ผล ไม่ใช่การทำแท้ง
- term: คลินิกวัยรุ่น
  definition: บริการในโรงพยาบาลที่ให้คำปรึกษาและบริการสุขภาพทางเพศแก่วัยรุ่นอย่างเป็นมิตรและรักษาความลับ
flashcards:
- front: วิธีเดียวที่ป้องกันทั้งการตั้งครรภ์และโรค
  back: ถุงยางอนามัย ใช้ถูกวิธีทุกครั้งป้องกันการตั้งครรภ์ได้ราว 98% (WHO)
- front: การคุมกำเนิดฉุกเฉิน
  back: ภายใน 5 วัน ยิ่งเร็วยิ่งดี ป้องกันได้มากกว่า 95% ไม่ใช่ยาทำแท้ง ไม่ป้องกันโรค
- front: เอชไอวีไม่ติดต่อทาง
  back: กอด จูบ จับมือ ใช้ห้องน้ำ กินอาหารร่วมกัน ผู้กินยาจนตรวจไม่พบเชื้อไม่ส่งต่อทางเพศสัมพันธ์
- front: สายด่วน 1663
  back: ปรึกษาเรื่องเอดส์และท้องไม่พร้อม ไม่ตัดสิน ให้ข้อมูลทุกทางเลือก
