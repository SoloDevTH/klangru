  stem: เรียงประโยคต่อไปนี้ให้เป็นเรื่องเล่าที่ถูกต้อง
  items:
  - 那个周末 (nàge zhōumò)，我和家人去了清迈的老街 (wǒ hé jiārén qù le Qīngmài de lǎojiē)。
  - 我们先在一家小店买了一杯热茶 (wǒmen xiān zài yì jiā xiǎodiàn mǎi le yì bēi rèchá)。
  - 然后 (ránhòu)，我们走到河边 (wǒmen zǒu dào hébiān)，看见很多人在拍照 (kànjiàn hěn duō rén zài pāizhào)。
  - 后来 (hòulái)，天开始下雨 (tiān kāishǐ xiàyǔ)，我们就去一家咖啡店坐了一会儿 (wǒmen jiù qù yì jiā kāfēidiàn zuò le yíhuìr)。
  - 这一天虽然有点儿累 (zhè yì tiān suīrán yǒudiǎnr lèi)，但是我很开心 (dànshì wǒ hěn kāixīn)。
