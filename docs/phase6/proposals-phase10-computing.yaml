  - { id: computer.systems.memory-processes, title: การจัดการกระบวนการและหน่วยความจำ, difficulty: 6, prereq: [computer.systems.operating-systems, computer.systems.processor-organization], indicators: ["acm-cs2023:OS-Process", "acm-cs2023:OS-Memory", "acm-cs2023:OS-Scheduling", "acm-cs2023:OS-Principles"], scope: "บล็อกควบคุมกระบวนการ การสลับบริบท การสร้างกระบวนการ (fork exec) เธรดกับกระบวนการ อินเทอร์รัปต์และการเรียกใช้บริการของระบบ การจัดลำดับแบบมีลำดับความสำคัญ แบบแย่งได้และไม่ได้ และคิวหลายระดับ การอดตาย การแปลงที่อยู่เสมือนเป็นที่อยู่จริงด้วยตารางหน้า TLB ความผิดพลาดของหน้า การแทนที่หน้าแบบ FIFO LRU และเหมาะสมที่สุด การสลับหน้าไม่หยุด (thrashing) โจทย์โค้ดจำลองการแทนที่หน้าแล้วนับความผิดพลาดของหน้า และคำนวณเวลารอของการจัดลำดับแบบมีลำดับความสำคัญ" }
