<text x="400.0" y="357" text-anchor="middle" font-size="14" fill="#374151">A ซื้อของที่ตลาด 30 นาที · B ผสมแป้ง 15 นาที · C จัดโต๊ะและเป่าลูกโป่ง 40 นาที</text>
