    answer:
      value: 30000
      tolerance: 1
      unit: บาท
    hints:
      - ส่วนที่เหลือหลังลด 90% คือ 10% ของฐาน
      - ค่าชดเชย = ปริมาณที่เหลือ × ราคาต่อตัน
    misconceptions:
