# ผลการเรียนรู้รายวิชาเพิ่มเติม สาระโลก ดาราศาสตร์ และอวกาศ (ฉบับปรับปรุง พ.ศ. 2560) ระดับ ม.4–6
#
# การจัดโครงสร้าง (ต้นฉบับไม่มีระดับ สาระ→มาตรฐาน→ตัวชี้วัด แบบหลักสูตรแกนกลาง จึงจับคู่ดังนี้)
#   strand    = สาระโลก ดาราศาสตร์ และอวกาศ ทั้งสาระ (หนึ่งไฟล์ต่อหนึ่งรายวิชาเพิ่มเติม)
#   standard  = ข้อ ๑, ๒, ... ของสาระ (ข้อความ "เข้าใจ..." ที่ขึ้นต้นตารางผลการเรียนรู้แต่ละตาราง) ทำหน้าที่จัดกลุ่มเนื้อหา
#   indicator = ผลการเรียนรู้แต่ละข้อ level = ชั้นที่ต้นฉบับระบุในคอลัมน์ "ชั้น" (ม.4, ม.5, ม.6)
#
# รหัส: ต้นฉบับไม่มีรหัสทางการ ต้นฉบับนับเลขผลการเรียนรู้ใหม่ตั้งแต่ ๑ ในแต่ละชั้นของแต่ละข้อ
#   รหัสในไฟล์นี้ ("โลก <ข้อ> ม.<ชั้น>/<ลำดับ>" เช่น "โลก 1 ม.4/1") เป็นรหัสที่คลังรู้ตั้งเอง ตามเลขข้อ ชั้น และลำดับในต้นฉบับ
#   ข้อความผลการเรียนรู้และข้อความมาตรฐานคัดจากต้นฉบับทุกตัวอักษร (เลขไทยในข้อความคงไว้ตามต้นฉบับ)
#
# วิธีคัด: ข้อความอยู่ในชั้นข้อความของ PDF (ไม่ใช่ภาพสแกน) แยกคอลัมน์ผลการเรียนรู้ด้วย pdftotext ตามพิกัด
#   และกำหนดช่องว่างตามอักขระช่องว่างที่มีจริงใน PDF (อ่านด้วย pypdf) จึงมีช่องว่างบางจุดที่ผู้จัดหน้าใส่ไว้ท้ายบรรทัด
#   ทำให้บางคำดูเหมือนถูกเว้นวรรคกลางวลี และบางจุดที่ขึ้นบรรทัดใหม่โดยไม่มีอักขระช่องว่างจะติดกัน คงไว้ตามต้นฉบับ
#   ข้อความมาตรฐานจัดชิดขอบสองข้าง PDF ไม่มีอักขระช่องว่าง จึงกำหนดช่องว่างจากระยะห่างระหว่างคำ
#   โดยเทียบหัวตารางกับหน้า "สาระวิทยาศาสตร์เพิ่มเติม" (หน้า 129-131) จุดที่ตัดบรรทัดตรงกันทั้งสองแห่งตัดสินจากวลี

id: th-core-2560-earthscience-additional
title: "ผลการเรียนรู้รายวิชาเพิ่มเติม สาระโลก ดาราศาสตร์ และอวกาศ กลุ่มสาระการเรียนรู้วิทยาศาสตร์ (ฉบับปรับปรุง พ.ศ. 2560) ตามหลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พุทธศักราช 2551"
short: "โลกฯ เพิ่มเติม 2560"
kind: national-curriculum
subjects: [earthscience]
language: th
sources:
  - { title: "ตัวชี้วัดและสาระการเรียนรู้แกนกลาง กลุ่มสาระการเรียนรู้วิทยาศาสตร์ (ฉบับปรับปรุง พ.ศ. ๒๕๖๐) ตามหลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พุทธศักราช ๒๕๕๑ ส่วนผลการเรียนรู้และสาระการเรียนรู้เพิ่มเติม", url: "https://www.ipst.ac.th/wp-content/uploads/2022/05/SciCurriculum_2560.pdf", publisher: "สพฐ. กระทรวงศึกษาธิการ และ สสวท.", retrieved: "2026-10-24", pages: "131, 221-237 (เลขหน้าที่พิมพ์ในเล่ม)" }
copyright: "ต้นฉบับเป็นหนังสือที่ สพฐ. กระทรวงศึกษาธิการ จัดพิมพ์และเผยแพร่ (พ.ศ. 2560) ให้สถานศึกษาใช้เป็นกรอบพัฒนาหลักสูตร คำนำระบุว่ากระทรวงศึกษาธิการโดย สสวท. เป็นผู้จัดทำมาตรฐานการเรียนรู้และตัวชี้วัด คลังรู้ตีความว่าเป็นเอกสารของหน่วยงานรัฐที่ไม่เป็นงานอันมีลิขสิทธิ์ตาม พ.ร.บ.ลิขสิทธิ์ พ.ศ. 2537 มาตรา 7 (เป็นการตีความของเรา ไม่ใช่คำวินิจฉัยทางกฎหมาย)"
completeness: full-text
strands:
  - id: "โลก"
    title: "สาระโลก ดาราศาสตร์ และอวกาศ"
    standards:
      - id: "โลก 1"
        text: "เข้าใจกระบวนการเปลี่ยนแปลงภายในโลก ธรณีพิบัติภัยและผลต่อสิ่งมีชีวิตและสิ่งแวดล้อม รวมทั้งการศึกษาลำดับชั้นหิน ทรัพยากรธรณี แผนที่ และการนำไปใช้ประโยชน์"
        indicators:
          - { id: "โลก 1 ม.4/1", level: "ม.4", text: "อธิบายการแบ่งชั้นและสมบัติของโครงสร้างโลก พร้อมยกตัวอย่างข้อมูลที่สนับสนุน" }
          - { id: "โลก 1 ม.4/2", level: "ม.4", text: "อธิบายหลักฐานทางธรณีวิทยาที่สนับสนุน การเคลื่อนที่ของแผ่นธรณี" }
          - { id: "โลก 1 ม.4/3", level: "ม.4", text: "ระบุสาเหตุและอธิบายแนวรอยต่อของแผ่นธรณีที่สัมพันธ์กับการเคลื่อนที่ของแผ่นธรณี พร้อมยกตัวอย่างหลักฐานทางธรณีวิทยาที่พบ" }
          - { id: "โลก 1 ม.4/4", level: "ม.4", text: "วิเคราะห์หลักฐานทางธรณีวิทยาที่พบในปัจจุบันและอธิบายลำดับเหตุการณ์ ทางธรณีวิทยา ในอดีต" }
          - { id: "โลก 1 ม.4/5", level: "ม.4", text: "อธิบายสาเหตุ กระบวนการเกิดภูเขาไฟระเบิดและปัจจัยที่ทำให้ความรุนแรงของการปะทุ และรูปร่างของภูเขาไฟแตกต่างกัน รวมทั้งสืบค้นข้อมูลพื้นที่เสี่ยงภัย ออกแบบและนำเสนอแนวทางการเฝ้าระวังและการปฏิบัติตน ให้ปลอดภัย" }
          - { id: "โลก 1 ม.4/6", level: "ม.4", text: "อธิบายสาเหตุ กระบวนการเกิด ขนาดและความรุนแรง และผลจากแผ่นดินไหว รวมทั้งสืบค้นข้อมูลพื้นที่เสี่ยงภัย ออกแบบและนำเสนอแนวทางการเฝ้าระวังและการปฏิบัติตน ให้ปลอดภัย" }
          - { id: "โลก 1 ม.4/7", level: "ม.4", text: "อธิบายสาเหตุ กระบวนการเกิด และผลจาก สึนามิ รวมทั้งสืบค้นข้อมูลพื้นที่เสี่ยงภัย ออกแบบและนำเสนอแนวทางการเฝ้าระวังและการปฏิบัติตนให้ปลอดภัย" }
          - { id: "โลก 1 ม.4/8", level: "ม.4", text: "ตรวจสอบ และระบุชนิดแร่ รวมทั้งวิเคราะห์สมบัติและนำเสนอการใช้ประโยชน์จากทรัพยากรแร่ที่เหมาะสม" }
          - { id: "โลก 1 ม.4/9", level: "ม.4", text: "ตรวจสอบ จำแนกประเภท และระบุชื่อหิน รวมทั้งวิเคราะห์สมบัติและนำเสนอการใช้ประโยชน์ของทรัพยากรหินที่เหมาะสม" }
          - { id: "โลก 1 ม.4/10", level: "ม.4", text: "อธิบายกระบวนการเกิด และการสำรวจ แหล่งปิโตรเลียมและถ่านหิน โดยใช้ข้อมูล ทางธรณีวิทยา" }
          - { id: "โลก 1 ม.4/11", level: "ม.4", text: "อธิบายสมบัติของผลิตภัณฑ์ที่ได้จากปิโตรเลียมและถ่านหิน พร้อมนำเสนอการใช้ประโยชน์อย่างเหมาะสม" }
          - { id: "โลก 1 ม.4/12", level: "ม.4", text: "อ่านและแปลความหมายจากแผนที่ภูมิประเทศและแผนที่ธรณีวิทยาของพื้นที่ ที่กำหนดพร้อมทั้งอธิบายและยกตัวอย่าง การนำไปใช้ประโยชน์" }
      - id: "โลก 2"
        text: "เข้าใจสมดุลพลังงานของโลก การหมุนเวียนของอากาศบนโลก การหมุนเวียนของน้ำในมหาสมุทร การเกิดเมฆ การเปลี่ยนแปลงภูมิอากาศโลกและผลต่อสิ่งมีชีวิตและสิ่งแวดล้อม รวมทั้งการพยากรณ์อากาศ"
        indicators:
          - { id: "โลก 2 ม.5/1", level: "ม.5", text: "อธิบายปัจจัยสำคัญที่มีผลต่อการรับและ คายพลังงานจากดวงอาทิตย์แตกต่างกัน และผลที่มีต่ออุณหภูมิอากาศในแต่ละบริเวณของโลก" }
          - { id: "โลก 2 ม.5/2", level: "ม.5", text: "อธิบายกระบวนการที่ทำให้เกิดสมดุลพลังงานของโลก" }
          - { id: "โลก 2 ม.5/3", level: "ม.5", text: "อธิบายผลของแรงเนื่องจากความแตกต่างของความกดอากาศ แรงคอริออลิส แรงสู่ศูนย์กลาง และแรงเสียดทานที่มีต่อการหมุนเวียนของอากาศ" }
          - { id: "โลก 2 ม.5/4", level: "ม.5", text: "อธิบายการหมุนเวียนของอากาศตามเขตละติจูด และผลที่มีต่อภูมิอากาศ" }
          - { id: "โลก 2 ม.5/5", level: "ม.5", text: "อธิบายปัจจัยที่ทำให้เกิดการแบ่งชั้นน้ำ ในมหาสมุทร" }
          - { id: "โลก 2 ม.5/6", level: "ม.5", text: "อธิบายปัจจัยที่ทำให้เกิดการหมุนเวียนของน้ำ ในมหาสมุทรและรูปแบบการหมุนเวียนของน้ำในมหาสมุทร" }
          - { id: "โลก 2 ม.5/7", level: "ม.5", text: "อธิบายผลของการหมุนเวียนของน้ำในมหาสมุทรที่มีต่อลักษณะลมฟ้าอากาศ สิ่งมีชีวิต และ สิ่งแวดล้อม" }
          - { id: "โลก 2 ม.5/8", level: "ม.5", text: "อธิบายความสัมพันธ์ระหว่างเสถียรภาพอากาศและการเกิดเมฆ" }
          - { id: "โลก 2 ม.5/9", level: "ม.5", text: "อธิบายการเกิดแนวปะทะอากาศแบบต่าง ๆ และลักษณะลมฟ้าอากาศที่เกี่ยวข้อง" }
          - { id: "โลก 2 ม.5/10", level: "ม.5", text: "อธิบายปัจจัยต่าง ๆ ที่มีผลต่อการเปลี่ยนแปลงภูมิอากาศของโลก พร้อมยกตัวอย่างข้อมูลสนับสนุน" }
          - { id: "โลก 2 ม.5/11", level: "ม.5", text: "วิเคราะห์ และอภิปรายเหตุการณ์ที่เป็นผลจากการเปลี่ยนแปลงภูมิอากาศโลก และนำเสนอ แนวปฏิบัติของมนุษย์ที่มีส่วนช่วยในการชะลอการเปลี่ยนแปลงภูมิอากาศโลก" }
          - { id: "โลก 2 ม.5/12", level: "ม.5", text: "แปลความหมายสัญลักษณ์ลมฟ้าอากาศ บนแผนที่อากาศ" }
          - { id: "โลก 2 ม.5/13", level: "ม.5", text: "วิเคราะห์ และคาดการณ์ลักษณะลมฟ้าอากาศ เบื้องต้นจากแผนที่อากาศและข้อมูลสารสนเทศอื่น ๆ เพื่อวางแผนในการประกอบอาชีพและ การดำเนินชีวิตให้สอดคล้องกับสภาพลมฟ้า อากาศ" }
      - id: "โลก 3"
        text: "เข้าใจองค์ประกอบ ลักษณะ กระบวนการเกิด และวิวัฒนาการของเอกภพ กาแล็กซี ดาวฤกษ์ และระบบสุริยะ ความสัมพันธ์ของดาราศาสตร์กับมนุษย์จากการศึกษาตำแหน่งดาวบนทรงกลมฟ้าและปฏิสัมพันธ์ภายในระบบสุริยะ รวมทั้งการประยุกต์ใช้เทคโนโลยีอวกาศในการดำรงชีวิต"
        indicators:
          - { id: "โลก 3 ม.6/1", level: "ม.6", text: "อธิบายการกำเนิดและการเปลี่ยนแปลงพลังงาน สสาร ขนาดอุณหภูมิของเอกภพหลังเกิดบิกแบงในช่วงเวลาต่าง ๆ ตามวิวัฒนาการของเอกภพ" }
          - { id: "โลก 3 ม.6/2", level: "ม.6", text: "อธิบายหลักฐานที่สนับสนุนทฤษฎีบิกแบง จากความสัมพันธ์ระหว่างความเร็วกับระยะทางของกาแล็กซี รวมทั้งข้อมูลการค้นพบไมโครเวฟพื้นหลังจากอวกาศ" }
          - { id: "โลก 3 ม.6/3", level: "ม.6", text: "อธิบายโครงสร้างและองค์ประกอบของกาแล็กซีทางช้างเผือก และระบุตำแหน่งของระบบสุริยะพร้อมอธิบายเชื่อมโยงกับการสังเกตเห็น ทางช้างเผือกของคนบนโลก" }
          - { id: "โลก 3 ม.6/4", level: "ม.6", text: "อธิบายกระบวนการเกิดดาวฤกษ์ โดยแสดง การเปลี่ยนแปลงความดัน อุณหภูมิ ขนาด จากดาวฤกษ์ก่อนเกิดจนเป็นดาวฤกษ์" }
          - { id: "โลก 3 ม.6/5", level: "ม.6", text: "อธิบายกระบวนการสร้างพลังงานของดาวฤกษ์และผลที่เกิดขึ้น โดยวิเคราะห์ปฏิกิริยาลูกโซ่โปรตอน-โปรตอน และวัฏจักรคาร์บอนไนโตรเจน ออกซิเจน" }
          - { id: "โลก 3 ม.6/6", level: "ม.6", text: "ระบุปัจจัยที่ส่งผลต่อความส่องสว่างของดาวฤกษ์และอธิบายความสัมพันธ์ระหว่างความส่องสว่างกับโชติมาตรของดาวฤกษ์" }
          - { id: "โลก 3 ม.6/7", level: "ม.6", text: "อธิบายความสัมพันธ์ระหว่างสี อุณหภูมิผิว และสเปกตรัมของดาวฤกษ์" }
          - { id: "โลก 3 ม.6/8", level: "ม.6", text: "อธิบายวิธีการหาระยะทางของดาวฤกษ์ ด้วยหลักการแพรัลแลกซ์ พร้อมคำนวณ หาระยะทางของดาวฤกษ์" }
          - { id: "โลก 3 ม.6/9", level: "ม.6", text: "อธิบายลำดับวิวัฒนาการที่สัมพันธ์กับมวลตั้งต้น และวิเคราะห์การเปลี่ยนแปลงสมบัติบางประการของดาวฤกษ์ในลำดับวิวัฒนาการ จากแผนภาพเฮิร์ซปรุง-รัสเซลล์" }
          - { id: "โลก 3 ม.6/10", level: "ม.6", text: "อธิบายกระบวนการเกิดระบบสุริยะ การแบ่งเขตบริวารของดวงอาทิตย์และลักษณะของ ดาวเคราะห์ที่เอื้อต่อการดำรงชีวิต" }
          - { id: "โลก 3 ม.6/11", level: "ม.6", text: "อธิบายการโคจรของดาวเคราะห์รอบดวงอาทิตย์ด้วยกฎเคพเลอร์ และกฎความโน้มถ่วงของ นิวตัน พร้อมคำนวณคาบการโคจรของ ดาวเคราะห์" }
          - { id: "โลก 3 ม.6/12", level: "ม.6", text: "อธิบายโครงสร้างของดวงอาทิตย์ การเกิด ลมสุริยะ พายุสุริยะ และวิเคราะห์ นำเสนอปรากฏการณ์หรือเหตุการณ์ที่เกี่ยวข้องกับ ผลของลมสุริยะ และพายุสุริยะที่มีต่อโลก รวมทั้งประเทศไทย" }
          - { id: "โลก 3 ม.6/13", level: "ม.6", text: "สร้างแบบจำลองทรงกลมฟ้า สังเกต และเชื่อมโยงจุดและเส้นสำคัญของแบบจำลองทรงกลมฟ้ากับท้องฟ้าจริง และอธิบายการระบุพิกัด ของดาวในระบบขอบฟ้า และระบบศูนย์สูตร" }
          - { id: "โลก 3 ม.6/14", level: "ม.6", text: "สังเกตท้องฟ้า และอธิบายเส้นทางการขึ้น การตกของดวงอาทิตย์และดาวฤกษ์" }
          - { id: "โลก 3 ม.6/15", level: "ม.6", text: "อธิบายเวลาสุริยคติปรากฏ โดยรวบรวมข้อมูล และเปรียบเทียบเวลาขณะที่ดวงอาทิตย์ผ่านเมริเดียนของผู้สังเกตในแต่ละวัน" }
          - { id: "โลก 3 ม.6/16", level: "ม.6", text: "อธิบายเวลาสุริยคติปานกลาง และ การเปรียบเทียบเวลาของแต่ละเขตเวลาบนโลก" }
          - { id: "โลก 3 ม.6/17", level: "ม.6", text: "อธิบายมุมห่างที่สัมพันธ์กับตำแหน่ง ในวงโคจร และอธิบายเชื่อมโยงกับตำแหน่งปรากฏของดาวเคราะห์ที่สังเกตได้จากโลก" }
          - { id: "โลก 3 ม.6/18", level: "ม.6", text: "สืบค้นข้อมูล อธิบายการสำรวจอวกาศ โดยใช้กล้องโทรทรรศน์ในช่วงความยาวคลื่นต่าง ๆ ดาวเทียม ยานอวกาศ สถานีอวกาศ และนำเสนอแนวคิดการนำความรู้ทางด้านเทคโนโลยีอวกาศมาประยุกต์ใช้ในชีวิตประจำวันหรือในอนาคต" }
          - { id: "โลก 3 ม.6/19", level: "ม.6", text: "สืบค้นข้อมูล ออกแบบ และนำเสนอกิจกรรมการสังเกตดาวบนท้องฟ้าด้วยตาเปล่า และ/หรือกล้องโทรทรรศน์" }
