<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 246" width="390" height="246" font-family="sans-serif" font-size="16">
  <title>แบบจำลองพื้นที่ของ 3(x + 2) = 3x + 6</title>
  <rect x="70" y="50" width="200" height="120" fill="#e2f0ed" stroke="#15211e" stroke-width="2.5"/>
  <rect x="270" y="50" width="40" height="40" fill="#fbe3d3" stroke="#15211e" stroke-width="1.5"/>
  <rect x="270" y="90" width="40" height="40" fill="#fbe3d3" stroke="#15211e" stroke-width="1.5"/>
  <rect x="270" y="130" width="40" height="40" fill="#fbe3d3" stroke="#15211e" stroke-width="1.5"/>
  <rect x="310" y="50" width="40" height="40" fill="#fbe3d3" stroke="#15211e" stroke-width="1.5"/>
  <rect x="310" y="90" width="40" height="40" fill="#fbe3d3" stroke="#15211e" stroke-width="1.5"/>
  <rect x="310" y="130" width="40" height="40" fill="#fbe3d3" stroke="#15211e" stroke-width="1.5"/>
  <rect x="270" y="50" width="80" height="120" fill="none" stroke="#15211e" stroke-width="2.5"/>
  <text x="170.0" y="118.0" text-anchor="middle" font-size="24" fill="#0a6b60" font-weight="bold">3x</text>
  <text x="310" y="192" text-anchor="middle" font-size="13" fill="#b4521f">6 ช่อง</text>
  <line x1="70" y1="36" x2="270" y2="36" stroke="#0a6b60" stroke-width="1.5"/>
  <line x1="70" y1="30" x2="70" y2="42" stroke="#0a6b60" stroke-width="1.5"/>
  <line x1="270" y1="30" x2="270" y2="42" stroke="#0a6b60" stroke-width="1.5"/>
  <text x="170.0" y="28" text-anchor="middle" fill="#0a6b60" font-style="italic" font-weight="bold">x</text>
  <line x1="270" y1="36" x2="350" y2="36" stroke="#b4521f" stroke-width="1.5"/>
  <line x1="270" y1="30" x2="270" y2="42" stroke="#b4521f" stroke-width="1.5"/>
  <line x1="350" y1="30" x2="350" y2="42" stroke="#b4521f" stroke-width="1.5"/>
  <text x="310.0" y="28" text-anchor="middle" fill="#b4521f" font-style="italic" font-weight="bold">2</text>
  <line x1="54" y1="50" x2="54" y2="170" stroke="#15211e" stroke-width="1.5"/>
  <line x1="48" y1="50" x2="60" y2="50" stroke="#15211e" stroke-width="1.5"/>
  <line x1="48" y1="170" x2="60" y2="170" stroke="#15211e" stroke-width="1.5"/>
  <text x="40" y="116.0" text-anchor="middle" font-weight="bold">3</text>
  <text x="210.0" y="226" text-anchor="middle" font-size="20">3(x + 2) = <tspan fill="#0a6b60" font-weight="bold">3x</tspan> + <tspan fill="#b4521f" font-weight="bold">6</tspan></text>
</svg>
