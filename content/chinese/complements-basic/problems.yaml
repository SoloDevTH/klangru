  ai_assisted: true
- id: chinese.grammar.complements-basic.p012
  topics:
  - chinese.grammar.complements-basic
  difficulty: 4
  type: mcq
  stem: ร้านหนังสือในกรุงเทพฯ ไม่มีหนังสือจีนเล่มนี้ขายเลย "หนังสือเล่มนี้หาซื้อในกรุงเทพฯ ไม่ได้" ประโยคใดถูกต้อง
  choices:
  - id: a
    text: 这本书在曼谷买得不到。
    feedback: ใช้ 得 หรือ 不 อย่างใดอย่างหนึ่ง ไม่ใช้ทั้งคู่
  - id: b
    text: 这本书在曼谷买不到。
    correct: true
    feedback: ถูก กริยา + 不 + ผล = ทำไม่ได้
  - id: c
    text: 这本书在曼谷不买到。
    feedback: 不 ต้องอยู่ระหว่างกริยากับผล
  - id: d
    text: 这本书在曼谷买没到。
    feedback: รูปความเป็นไปได้ใช้ 不 ไม่ใช่ 没
  hints:
  - ซื้อได้ = 买得到 ซื้อไม่ได้ = ?
  - แทน 得 ด้วย 不
  solution: '**这本书在曼谷买不到。** Zhè běn shū zài Màngǔ mǎi bu dào.'
  license: CC-BY-SA-4.0
  ai_assisted: true
