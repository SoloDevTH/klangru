    solution: "รูปร่างที่ยื่นยาวเพิ่มพื้นที่ผิวสัมผัสน้ำในดิน ถ้าไม่มีส่วนนี้ พื้นที่ผิวลดลง รากจะดูดน้ำและธาตุอาหารได้น้อยลง แสดงว่ารูปร่างของเซลล์สัมพันธ์กับหน้าที่"
