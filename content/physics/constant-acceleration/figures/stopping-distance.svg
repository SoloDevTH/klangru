<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" font-family="sans-serif" font-size="15">
  <title>ระยะหยุดรถเมื่อวิ่ง 36, 72 และ 108 km/h แต่ละแถบแบ่งเป็นระยะคิด (เวลาตอบสนอง 0.75 s) และระยะเบรก (ความเร่ง 6 m/s²) วาดตามมาตราส่วน</title>
  <rect x="0" y="0" width="620" height="300" fill="#ffffff"/>
  <text x="100.0" y="72.0" fill="#15211e" font-size="15" text-anchor="end">36 km/h</text>
  <rect x="110.0" y="50.0" width="30.0" height="32.0" rx="0" fill="#cfe7e2" stroke="#0a6b60" stroke-width="1.5"/>
  <rect x="140.0" y="50.0" width="33.3" height="32.0" rx="0" fill="#f6dcc9" stroke="#b4521f" stroke-width="1.5"/>
  <text x="181.3" y="72.0" fill="#15211e" font-size="14" text-anchor="start" font-weight="bold">15.8 m</text>
  <text x="100.0" y="142.0" fill="#15211e" font-size="15" text-anchor="end">72 km/h</text>
  <rect x="110.0" y="120.0" width="60.0" height="32.0" rx="0" fill="#cfe7e2" stroke="#0a6b60" stroke-width="1.5"/>
  <rect x="170.0" y="120.0" width="133.3" height="32.0" rx="0" fill="#f6dcc9" stroke="#b4521f" stroke-width="1.5"/>
  <text x="311.3" y="142.0" fill="#15211e" font-size="14" text-anchor="start" font-weight="bold">48.3 m</text>
  <text x="100.0" y="212.0" fill="#15211e" font-size="15" text-anchor="end">108 km/h</text>
  <rect x="110.0" y="190.0" width="90.0" height="32.0" rx="0" fill="#cfe7e2" stroke="#0a6b60" stroke-width="1.5"/>
  <rect x="200.0" y="190.0" width="300.0" height="32.0" rx="0" fill="#f6dcc9" stroke="#b4521f" stroke-width="1.5"/>
  <text x="508.0" y="212.0" fill="#15211e" font-size="14" text-anchor="start" font-weight="bold">97.5 m</text>
  <line x1="110.0" y1="260.0" x2="110.0" y2="270.0" stroke="#15211e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="110.0" y="287.0" fill="#15211e" font-size="12" text-anchor="middle">0</text>
  <line x1="190.0" y1="260.0" x2="190.0" y2="270.0" stroke="#15211e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="190.0" y="287.0" fill="#15211e" font-size="12" text-anchor="middle">20</text>
  <line x1="270.0" y1="260.0" x2="270.0" y2="270.0" stroke="#15211e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="270.0" y="287.0" fill="#15211e" font-size="12" text-anchor="middle">40</text>
  <line x1="350.0" y1="260.0" x2="350.0" y2="270.0" stroke="#15211e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="350.0" y="287.0" fill="#15211e" font-size="12" text-anchor="middle">60</text>
  <line x1="430.0" y1="260.0" x2="430.0" y2="270.0" stroke="#15211e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="430.0" y="287.0" fill="#15211e" font-size="12" text-anchor="middle">80</text>
  <line x1="510.0" y1="260.0" x2="510.0" y2="270.0" stroke="#15211e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="510.0" y="287.0" fill="#15211e" font-size="12" text-anchor="middle">100</text>
  <line x1="110.0" y1="265.0" x2="510.0" y2="265.0" stroke="#15211e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="520.0" y="270.0" fill="#15211e" font-size="13" text-anchor="start">m</text>
  <rect x="110.0" y="18.0" width="16.0" height="12.0" rx="0" fill="#cfe7e2" stroke="#0a6b60" stroke-width="1.5"/>
  <text x="132.0" y="29.0" fill="#15211e" font-size="13" text-anchor="start">ระยะคิด</text>
  <rect x="220.0" y="18.0" width="16.0" height="12.0" rx="0" fill="#f6dcc9" stroke="#b4521f" stroke-width="1.5"/>
  <text x="242.0" y="29.0" fill="#15211e" font-size="13" text-anchor="start">ระยะเบรก</text>
</svg>
