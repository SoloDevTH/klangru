problems:
  - id: chemistry.matter.particle-model.p001
    topics: [chemistry.matter.particle-model]
    difficulty: 1
    type: mcq
    stem: "สถานะใดมีอนุภาคเรียงชิดกันอย่างเป็นระเบียบและสั่นอยู่กับที่"
    choices:
      - { id: a, text: "ของแข็ง", correct: true, feedback: "ถูก แรงยึดเหนี่ยวมากจนอนุภาคได้แต่สั่นอยู่กับที่" }
      - { id: b, text: "ของเหลว", feedback: "อนุภาคของเหลวชิดกันแต่ไม่เป็นระเบียบ และไถลผ่านกันได้" }
      - { id: c, text: "แก๊ส", feedback: "อนุภาคแก๊สอยู่ห่างกันมากและเคลื่อนที่อิสระ" }
    hints:
      - "สถานะใดมีรูปร่างคงที่"
      - "รูปร่างคงที่เพราะอนุภาคไม่ย้ายที่"
    solution: "**ของแข็ง** อนุภาคเรียงชิดเป็นระเบียบ ยึดกันแน่น จึงได้แต่สั่นอยู่กับที่ ของแข็งจึงมีรูปร่างคงที่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.particle-model.p002
    topics: [chemistry.matter.particle-model]
    difficulty: 1
    type: match
    stem: "จับคู่สถานะกับลักษณะของอนุภาค"
    pairs:
      - { left: "ของแข็ง", right: "ชิดกัน เป็นระเบียบ สั่นอยู่กับที่" }
      - { left: "ของเหลว", right: "ชิดกัน ไม่เป็นระเบียบ ไถลผ่านกันได้" }
      - { left: "แก๊ส", right: "ห่างกันมาก เคลื่อนที่เร็วทุกทิศ" }
    hints:
      - "ของเหลวไหลได้ แต่ปริมาตรคงที่"
      - "แก๊สฟุ้งเต็มภาชนะ"
    solution: "ของแข็ง: ชิดและเป็นระเบียบ สั่นอยู่กับที่ · ของเหลว: ชิดแต่ไม่เป็นระเบียบ ไถลผ่านกัน · แก๊ส: ห่างกันมาก เคลื่อนที่อิสระ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.particle-model.p003
    topics: [chemistry.matter.particle-model]
    difficulty: 2
    type: mcq
    stem: "ปิดปลายกระบอกฉีดยาแล้วกดลูกสูบ กระบอกที่มีอากาศกดลงไปได้มาก แต่กระบอกที่มีน้ำเต็มแทบกดไม่ลง เพราะเหตุใด"
    choices:
      - { id: a, text: "อนุภาคแก๊สอยู่ห่างกันมาก มีที่ว่างให้อัด ส่วนอนุภาคน้ำชิดกันอยู่แล้ว", correct: true, feedback: "ถูก การอัดคือการลดที่ว่างระหว่างอนุภาค" }
      - { id: b, text: "อนุภาคอากาศหดเล็กลงได้ แต่อนุภาคน้ำหดไม่ได้", feedback: "อนุภาคไม่หดหรือขยาย สิ่งที่เปลี่ยนคือระยะห่างระหว่างอนุภาค" }
      - { id: c, text: "อากาศเบากว่าน้ำ", feedback: "มวลไม่ได้บอกว่าอัดได้หรือไม่ ต้องดูที่ว่างระหว่างอนุภาค" }
    hints:
      - "เมื่ออัด สิ่งที่หายไปคือที่ว่างระหว่างอนุภาค"
      - "สถานะใดมีที่ว่างระหว่างอนุภาคมาก"
    solution: "อนุภาคแก๊สอยู่ห่างกันมาก ลูกสูบจึงดันให้อนุภาคเข้ามาใกล้กันได้ ส่วนอนุภาคของเหลวชิดกันอยู่แล้ว จึงแทบอัดไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.particle-model.p004
    topics: [chemistry.matter.particle-model]
    difficulty: 2
    type: text
    stem: "ผ่าทุเรียนในครัว ไม่นานคนที่นั่งอยู่อีกมุมห้องก็ได้กลิ่น ทั้งที่ไม่มีลมพัด อนุภาคของกลิ่นเคลื่อนที่ไปทั่วห้องด้วยกระบวนการที่เรียกว่าอะไร"
    accepted: ["การแพร่", "แพร่", "diffusion"]
    misconceptions:
      - { match: "การระเหย", feedback: "การระเหยทำให้อนุภาคกลิ่นหลุดออกจากเนื้อทุเรียน แต่การที่มันกระจายไปทั่วห้องเรียกอีกชื่อหนึ่ง" }
    hints:
      - "อนุภาคเคลื่อนที่จากบริเวณที่มีมากไปบริเวณที่มีน้อย"
      - "เกิดเองได้แม้ไม่มีลม เพราะอนุภาคแก๊สเคลื่อนที่ตลอดเวลา"
    solution: "อนุภาคกลิ่นเคลื่อนที่แบบสุ่มจากบริเวณที่เข้มข้นใกล้ทุเรียนไปยังบริเวณที่เจือจาง เรียกว่า **การแพร่**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.particle-model.p005
    topics: [chemistry.matter.particle-model]
    difficulty: 2
    type: mcq
    stem: "ละลายน้ำตาลจนมองไม่เห็นแล้ว ข้อใดเป็นหลักฐานที่ดีที่สุดว่าน้ำตาลยังอยู่ในน้ำเป็นอนุภาคเล็ก ๆ"
    choices:
      - { id: a, text: "มวลรวมของน้ำกับน้ำตาลเท่าเดิมก่อนและหลังละลาย", correct: true, feedback: "ถูก ถ้าน้ำตาลหายไปจริง มวลรวมต้องลดลง" }
      - { id: b, text: "น้ำยังใสเหมือนเดิม", feedback: "ความใสไม่ใช่หลักฐานว่ามีน้ำตาลอยู่ น้ำเปล่าก็ใส" }
      - { id: c, text: "น้ำตาลจมลงก้นแก้ว", feedback: "ถ้าละลายหมดแล้วจะไม่มีน้ำตาลจมอยู่ก้นแก้ว" }
    hints:
      - "ถ้าน้ำตาลหายไปจริง สิ่งใดที่วัดได้จะลดลง"
      - "ชั่งก่อนและหลังละลาย"
    solution: "มวลรวมไม่เปลี่ยน แปลว่าน้ำตาลยังอยู่ครบ เพียงแตกเป็นอนุภาคเล็กมากกระจายไปทั่วน้ำจนตามองไม่เห็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.particle-model.p006
    topics: [chemistry.matter.particle-model]
    difficulty: 3
    type: mcq
    stem: "หยดสีลงก้นบีกเกอร์ X และ Y พร้อมกัน บีกเกอร์หนึ่งมีน้ำเย็น อีกบีกเกอร์มีน้ำร้อน ปริมาตรน้ำเท่ากัน จากภาพ บีกเกอร์ใดน่าจะมีน้ำร้อน"
    figure:
      src: p-diffusion-beakers.svg
      alt: "บีกเกอร์ X และ Y มีน้ำระดับเท่ากัน หลังหยดสีที่ก้นแล้วผ่านไป 2 นาทีโดยไม่คน อนุภาคสีในบีกเกอร์ X ยังกองอยู่ใกล้ก้นบีกเกอร์ ส่วนในบีกเกอร์ Y อนุภาคสีกระจายขึ้นไปเกือบทั่วบีกเกอร์"
    choices:
      - { id: a, text: "Y เพราะสีกระจายได้กว้างกว่า อนุภาคในน้ำร้อนเคลื่อนที่เร็วกว่า", correct: true, feedback: "ถูก อุณหภูมิสูงทำให้การแพร่เร็วขึ้น" }
      - { id: b, text: "X เพราะสีกองรวมกัน น้ำร้อนทำให้สีจับตัวกัน", feedback: "ความร้อนทำให้อนุภาคเคลื่อนที่เร็วขึ้น สีจึงควรกระจายเร็วขึ้น ไม่ใช่จับตัวกัน" }
      - { id: c, text: "บอกไม่ได้ เพราะอุณหภูมิไม่มีผลต่อการแพร่", feedback: "อุณหภูมิมีผลชัดเจน อนุภาคที่ร้อนกว่ามีพลังงานมากกว่า" }
    hints:
      - "เปรียบเทียบว่าสีในบีกเกอร์ใดกระจายไปได้ไกลกว่าในเวลาเท่ากัน"
      - "อุณหภูมิสูงขึ้น อนุภาคเคลื่อนที่เร็วขึ้นหรือช้าลง"
    solution: "อนุภาคในน้ำร้อนเคลื่อนที่เร็วกว่า สีจึงแพร่ได้ไกลกว่าในเวลาเท่ากัน บีกเกอร์ **Y** ซึ่งสีกระจายเกือบทั่วจึงน่าจะเป็นน้ำร้อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.particle-model.p007
    topics: [chemistry.matter.particle-model]
    difficulty: 3
    type: order
    stem: "เรียงสิ่งที่เกิดกับอนุภาคเมื่อน้ำแข็งที่ −5 °C ได้รับความร้อนจนละลายเป็นน้ำ"
    items:
      - "อนุภาคได้รับพลังงานและสั่นแรงขึ้น อุณหภูมิสูงขึ้นถึง 0 °C"
      - "ที่ 0 °C พลังงานถูกใช้เอาชนะแรงยึดเหนี่ยวระหว่างอนุภาค อุณหภูมิคงที่"
      - "อนุภาคหลุดจากตำแหน่งเดิม ไถลผ่านกันได้"
      - "น้ำแข็งละลายหมด ได้น้ำซึ่งร้อนขึ้นต่อไปเมื่อยังได้รับความร้อน"
    hints:
      - "อุณหภูมิต้องถึงจุดหลอมเหลวก่อน"
      - "ช่วงอุณหภูมิคงที่เกิดขณะที่ของแข็งกับของเหลวอยู่ร่วมกัน"
    solution: "อนุภาคสั่นแรงขึ้นจนอุณหภูมิถึง 0 °C → พลังงานใช้เอาชนะแรงยึดเหนี่ยว อุณหภูมิคงที่ → อนุภาคไถลผ่านกันได้ → เมื่อละลายหมด อุณหภูมิของน้ำจึงสูงขึ้นต่อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.particle-model.p008
    topics: [chemistry.matter.particle-model]
    difficulty: 3
    type: mcq
    stem: "ต้มน้ำจนเดือดแล้วเปิดไฟแรงขึ้น เทอร์มอมิเตอร์ในน้ำยังอ่านได้ประมาณ 100 °C เท่าเดิม พลังงานที่เพิ่มเข้าไปถูกใช้ทำอะไร"
    choices:
      - { id: a, text: "แยกอนุภาคน้ำออกจากกันจนเป็นไอ น้ำจึงเดือดเป็นไอเร็วขึ้น", correct: true, feedback: "ถูก ไฟแรงขึ้นทำให้น้ำกลายเป็นไอเร็วขึ้น แต่อุณหภูมิคงที่" }
      - { id: b, text: "ทำให้อนุภาคน้ำขยายใหญ่ขึ้น", feedback: "อนุภาคไม่ขยายขนาด" }
      - { id: c, text: "พลังงานสูญหายไป ไม่ได้ทำอะไร", feedback: "พลังงานไม่สูญหาย ไฟแรงขึ้นทำให้น้ำงวดเร็วขึ้น" }
    hints:
      - "ขณะเดือด อนุภาคต้องหลุดจากแรงยึดเหนี่ยวของเพื่อนบ้าน"
      - "สังเกตว่าน้ำในหม้องวดเร็วขึ้นหรือไม่"
    solution: "ขณะเดือด พลังงานถูกใช้แยกอนุภาคน้ำออกจากกันจนเป็นแก๊ส ไฟแรงขึ้นจึงทำให้น้ำกลายเป็นไอเร็วขึ้น แต่อุณหภูมิยังคงที่ที่จุดเดือด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.particle-model.p009
    topics: [chemistry.matter.particle-model]
    difficulty: 3
    type: numeric
    stem: "แม่จะแช่น้ำในขวดพลาสติกขนาด 500 mL ไว้ในช่องแข็งเพื่อทำน้ำแข็งใส่กระติก ไม่ให้ขวดบวมจนปริ ควรเติมน้ำได้มากที่สุดกี่กรัม (ความหนาแน่นน้ำแข็ง $0.917\\ \\mathrm{g/cm^3}$ และ $1\\ \\mathrm{mL} = 1\\ \\mathrm{cm^3}$)"
    answer: { value: 458.5, tolerance: 1, unit: g }
    misconceptions:
      - { match: 545.3, feedback: "หาร 500 ด้วย 0.917 ได้มวลที่มากกว่าเดิม แต่น้ำแข็งเบากว่าน้ำต่อปริมาตร น้ำที่เติมต้องน้อยกว่า 500 g" }
      - { match: 500, feedback: "ถ้าเติมน้ำ 500 g น้ำแข็งที่ได้จะมีปริมาตรมากกว่า 500 cm³ เพราะน้ำขยายตัวเมื่อแข็งตัว" }
    hints:
      - "น้ำแข็งที่ได้ต้องมีปริมาตรไม่เกิน 500 cm³"
      - "มวล = ความหนาแน่น × ปริมาตร และมวลไม่เปลี่ยนเมื่อแข็งตัว"
    solution: "น้ำแข็ง $500\\ \\mathrm{cm^3}$ มีมวล $0.917 \\times 500 = 458.5$ g มวลไม่เปลี่ยนเมื่อแข็งตัว จึงเติมน้ำได้ไม่เกิน 458.5 g"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.particle-model.p010
    topics: [chemistry.matter.particle-model]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "เผาแท่งเหล็กจนร้อน (แต่ไม่หลอมเหลว) ข้อใดถูกต้อง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "อนุภาคเหล็กสั่นแรงขึ้น", correct: true, feedback: "ถูก อนุภาคได้รับพลังงานมากขึ้น" }
      - { id: b, text: "อนุภาคอยู่ห่างกันมากขึ้นเล็กน้อย แท่งเหล็กจึงยาวขึ้น", correct: true, feedback: "ถูก การขยายตัวเกิดจากระยะห่างที่เพิ่มขึ้น" }
      - { id: c, text: "อนุภาคเหล็กแต่ละตัวมีขนาดใหญ่ขึ้น", feedback: "อนุภาคไม่ขยายขนาด แท่งเหล็กยาวขึ้นเพราะอนุภาคห่างกันมากขึ้น" }
      - { id: d, text: "จำนวนอนุภาคเหล็กเพิ่มขึ้น", feedback: "ความร้อนไม่ได้สร้างอนุภาคใหม่ มวลของแท่งเหล็กเท่าเดิม" }
    hints:
      - "ความร้อนเปลี่ยนการเคลื่อนที่ของอนุภาค"
      - "อนุภาคแต่ละตัวไม่ได้เปลี่ยนขนาดหรือจำนวน"
    solution: "อนุภาคสั่นแรงขึ้นจึงดันกันให้ห่างกันมากขึ้นเล็กน้อย แท่งเหล็กจึงขยายตัว ส่วนขนาดและจำนวนอนุภาคไม่เปลี่ยน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.particle-model.p011
    topics: [chemistry.matter.particle-model]
    difficulty: 4
    type: numeric
    stem: "น้ำมีความหนาแน่น $1.00\\ \\mathrm{g/cm^3}$ และน้ำแข็ง $0.917\\ \\mathrm{g/cm^3}$ เมื่อน้ำแข็งตัว ปริมาตรเพิ่มขึ้นร้อยละเท่าใด (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 9.1, tolerance: 0.1, unit: "%" }
    misconceptions:
      - { match: 8.3, feedback: "นำผลต่างของความหนาแน่นมาคิดเป็นร้อยละ แต่โจทย์ถามปริมาตร ลองคิดจากน้ำ 1 g" }
    hints:
      - "คิดจากน้ำ 1 g ปริมาตรก่อนแข็งตัว 1.00 cm³"
      - "ปริมาตรน้ำแข็ง 1 g = 1 ÷ 0.917 แล้วหาส่วนที่เพิ่มเทียบกับปริมาตรเดิม"
    solution: "น้ำ 1 g มีปริมาตร $1.00\\ \\mathrm{cm^3}$ เป็นน้ำแข็งได้ $1/0.917 = 1.0905\\ \\mathrm{cm^3}$ เพิ่มขึ้น $0.0905\\ \\mathrm{cm^3}$ คิดเป็นร้อยละ $\\dfrac{0.0905}{1.00} \\times 100 = 9.1$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.particle-model.p012
    topics: [chemistry.matter.particle-model]
    difficulty: 4
    type: mcq
    stem: "ส่องควันธูปในกล่องใสด้วยกล้องจุลทรรศน์ เห็นจุดควันสว่างกระตุกไปมาแบบสุ่มไม่หยุด คำอธิบายใดถูกต้อง"
    choices:
