id: biology.cells.cell-structure
subject: biology
title: { th: กล้องจุลทรรศน์และโครงสร้างของเซลล์, en: The microscope and cell structure }
summary: การใช้และดูแลกล้องจุลทรรศน์ใช้แสง การเตรียมสไลด์และประมาณขนาดเซลล์ ส่วนที่ห่อหุ้มเซลล์ ออร์แกเนลล์ นิวเคลียส และความต่างของเซลล์พืช สัตว์ และแบคทีเรีย
difficulty: 4
minutes: 40
prerequisites: [biology.foundations.life-and-science, biology.cells.cell-basics]
encompasses:
  - { id: biology.foundations.life-and-science, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ส่วนประกอบของกล้องจุลทรรศน์ใช้แสง
    src: microscope.svg
    alt: "ภาพด้านข้างของกล้องจุลทรรศน์ใช้แสง ป้ายด้านซ้ายจากบนลงล่าง: เลนส์ใกล้ตาที่ปลายบนสุด ลำกล้อง จานหมุน เลนส์ใกล้วัตถุ 3 อันที่ห้อยจากจานหมุน ที่หนีบสไลด์ แท่นวางวัตถุซึ่งมีสไลด์วางอยู่ ไดอะแฟรมใต้แท่น แหล่งกำเนิดแสงบนฐาน และฐาน ป้ายด้านขวา: แขนที่โค้งเชื่อมฐานกับลำกล้อง ปุ่มปรับภาพหยาบเป็นวงนอกและปุ่มปรับภาพละเอียดเป็นวงในบนแขน และเลนส์รวมแสงใต้แท่นวางวัตถุ"
    caption: "ยกกล้องด้วยสองมือ จับที่แขนและรองที่ฐาน (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ประมาณขนาดของเซลล์เยื่อบุข้างแก้ม
    problem: "ที่กำลังขยาย 40 เท่า วงกลมที่มองเห็นกว้าง 4.5 มิลลิเมตร เมื่อเปลี่ยนเป็น 400 เท่า เห็นเซลล์เยื่อบุข้างแก้มเรียงพอดีเส้นผ่านศูนย์กลาง 8 เซลล์ เซลล์หนึ่งกว้างประมาณกี่ไมโครเมตร"
    steps:
      - text: "กำลังขยายเพิ่มจาก 40 เป็น 400 เท่า คือเพิ่ม $\\frac{400}{40} = 10$ เท่า"
      - text: "วงกลมที่มองเห็นจึงแคบลง 10 เท่า: $\\frac{4.5}{10} = 0.45\\ \\mathrm{mm}$"
        why: "ยิ่งขยายมาก ยิ่งเห็นพื้นที่ของตัวอย่างน้อยลง เส้นผ่านศูนย์กลางจึงแปรผกผันกับกำลังขยาย"
      - text: "แปลงหน่วย $0.45\\ \\mathrm{mm} \\times 1000 = 450\\ \\mu\\mathrm{m}$"
      - text: "แบ่งให้ 8 เซลล์: $\\frac{450}{8} = 56.25 \\approx 56\\ \\mu\\mathrm{m}$"
    answer: "ประมาณ $56\\ \\mu\\mathrm{m}$"
  - { type: check, problem: biology.cells.cell-structure.p007, prompt: "ลองคิดเรื่องวงกลมที่มองเห็นก่อนอ่านต่อ" }
  - type: figure
    title: เซลล์สัตว์และเซลล์พืช
    src: cells.svg
    alt: "ซ้ายคือเซลล์สัตว์รูปร่างไม่แน่นอน มีเยื่อหุ้มเซลล์ล้อมรอบ ข้างในมีไซโทพลาซึม นิวเคลียสกลมพร้อมนิวคลีโอลัส ร่างแหเอนโดพลาซึมเป็นแผ่นซ้อนมีจุดไรโบโซม ไมโทคอนเดรียรูปรีมีรอยพับข้างใน กอลจิบอดีเป็นถุงแบนโค้งซ้อนกัน ไลโซโซมกลม และไรโบโซมเป็นจุดเล็ก ๆ ขวาคือเซลล์พืชรูปเหลี่ยม มีผนังเซลล์หนาด้านนอกสุดและเยื่อหุ้มเซลล์อยู่ข้างใน มีแวคิวโอลขนาดใหญ่กินพื้นที่กลางเซลล์ นิวเคลียสถูกดันไปอยู่มุม มีคลอโรพลาสต์สีเขียวหลายอันและไมโทคอนเดรีย"
    caption: "เซลล์พืชมีผนังเซลล์ คลอโรพลาสต์ และแวคิวโอลขนาดใหญ่ ซึ่งเซลล์สัตว์ไม่มี แต่ทั้งสองมีนิวเคลียสและไมโทคอนเดรีย (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: เส้นทางของเอนไซม์ในน้ำลายออกจากเซลล์
    problem: "เซลล์ต่อมน้ำลายสร้างเอนไซม์อะไมเลสแล้วส่งออกไปในน้ำลาย อธิบายเส้นทางของโปรตีนนี้ในเซลล์"
    steps:
      - text: "DNA ในนิวเคลียสมีข้อมูลของอะไมเลส ข้อมูลถูกคัดลอกเป็น RNA ที่ออกทางรูนิวเคลียส"
      - text: "ไรโบโซมบนร่างแหเอนโดพลาซึมผิวขรุขระอ่าน RNA แล้วสร้างสายโปรตีนเข้าไปในร่างแห"
        why: "โปรตีนที่จะส่งออกนอกเซลล์สร้างบนไรโบโซมที่เกาะร่างแห ไม่ใช่ไรโบโซมอิสระในไซโทพลาซึม"
      - text: "โปรตีนถูกบรรจุในเวสิเคิลส่งไปกอลจิบอดี ซึ่งดัดแปลงและคัดแยก"
      - text: "กอลจิบอดีส่งโปรตีนในเวสิเคิลไปที่เยื่อหุ้มเซลล์ เวสิเคิลรวมกับเยื่อหุ้มแล้วปล่อยอะไมเลสออกนอกเซลล์"
      - text: "ไมโทคอนเดรียให้ ATP เป็นพลังงานแก่ขั้นตอนเหล่านี้"
    answer: "นิวเคลียส → ไรโบโซมบนร่างแหเอนโดพลาซึมผิวขรุขระ → เวสิเคิล → กอลจิบอดี → เวสิเคิล → เยื่อหุ้มเซลล์ → นอกเซลล์"
  - { type: check, problem: biology.cells.cell-structure.p003, prompt: "ใช้ภาพเซลล์ด้านบนช่วยตอบ" }
glossary:
  - { term: กำลังขยายรวม, definition: "ผลคูณของกำลังขยายเลนส์ใกล้ตากับเลนส์ใกล้วัตถุ เช่น 10 × 40 = 400 เท่า" }
  - { term: ออร์แกเนลล์, definition: "โครงสร้างในไซโทพลาซึมที่ทำหน้าที่เฉพาะ เช่น ไมโทคอนเดรีย คลอโรพลาสต์ ไรโบโซม" }
  - { term: แบบจำลองฟลูอิดโมเซก, definition: "แบบจำลองเยื่อหุ้มเซลล์ที่มีฟอสโฟลิพิดสองชั้นและโปรตีนแทรกอยู่ โมเลกุลเคลื่อนที่ไปมาได้" }
  - { term: ระบบเยื่อหุ้มภายใน, definition: "ร่างแหเอนโดพลาซึม กอลจิบอดี เวสิเคิล ไลโซโซม และเยื่อหุ้มเซลล์ที่ทำงานต่อเนื่องกันในการสร้างและส่งโปรตีนและลิพิด" }
  - { term: เซลล์โพรคาริโอต, definition: "เซลล์ที่ไม่มีเยื่อหุ้มนิวเคลียสและไม่มีออร์แกเนลล์ที่มีเยื่อหุ้ม เช่น แบคทีเรีย" }
  - { term: นิวคลีโอลัส, definition: "บริเวณในนิวเคลียสที่สร้าง RNA ของไรโบโซม" }
flashcards:
  - { front: "กำลังขยายรวมคำนวณอย่างไร", back: "กำลังขยายเลนส์ใกล้ตา × กำลังขยายเลนส์ใกล้วัตถุ" }
  - { front: "เมื่อกำลังขยายเพิ่ม 10 เท่า วงกลมที่มองเห็นเปลี่ยนอย่างไร", back: "เส้นผ่านศูนย์กลางลดลง 10 เท่า" }
  - { front: "โครงสร้างที่มีในเซลล์พืชแต่ไม่มีในเซลล์สัตว์", back: "ผนังเซลล์ คลอโรพลาสต์ และแวคิวโอลขนาดใหญ่" }
  - { front: "ไมโทคอนเดรีย ไรโบโซม กอลจิบอดี ทำหน้าที่อะไร", back: "ไมโทคอนเดรีย: หายใจระดับเซลล์สร้าง ATP / ไรโบโซม: สร้างโปรตีน / กอลจิบอดี: ดัดแปลงและส่งโปรตีน" }
  - { front: "แบคทีเรียต่างจากเซลล์พืชและสัตว์อย่างไร", back: "ไม่มีเยื่อหุ้มนิวเคลียสและไม่มีออร์แกเนลล์ที่มีเยื่อหุ้ม แต่มีไรโบโซม เยื่อหุ้มเซลล์ และผนังเซลล์" }
