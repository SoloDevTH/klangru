problems:
- id: business.law.transport-insurance.p001
  topics:
  - business.law.transport-insurance
  difficulty: 1
  type: mcq
  stem: ผู้ส่งกับผู้ขนส่งในสัญญารับขนต่างกันอย่างไร
  choices:
  - id: a
    text: ผู้ส่งเป็นผู้มอบสินค้าให้ขนส่ง ส่วนผู้ขนส่งรับจ้างขนส่งและดูแลสินค้าไประหว่างทาง
    correct: true
  - id: b
    text: ผู้ส่งเป็นผู้รับสินค้าที่ปลายทาง ส่วนผู้ขนส่งเป็นผู้ขายสินค้า
    feedback: นั่นคือผู้รับและผู้ขาย ไม่ใช่ผู้ส่งกับผู้ขนส่ง
  - id: c
    text: ผู้ส่งและผู้ขนส่งเป็นคนเดียวกันเสมอ
    feedback: สองบทบาทนี้อาจแยกกันได้ เช่น ผู้ส่งจ้างบริษัทขนส่ง
  - id: d
    text: ผู้ขนส่งเป็นผู้ประกันสินค้าให้ผู้ส่งโดยตรง
    feedback: การประกันเป็นอีกสัญญาหนึ่ง ไม่ได้เป็นหน้าที่ของสัญญารับขนโดยตรง
  hints:
  - ดูว่าใครมอบสินค้าให้ และใครรับจ้างดูแลสินค้า
  - คิดถึงการส่งออกที่บริษัทจ้างบริษัทขนส่งไปส่งที่ท่า
  solution: ผู้ส่งคือผู้มอบสินค้าให้ผู้ขนส่งเพื่อนำไปส่งยังปลายทาง ผู้ขนส่งคือผู้รับจ้างขนส่งและมีหน้าที่ดูแลสินค้าตั้งแต่รับจนส่งมอบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p002
  topics:
  - business.law.transport-insurance
  difficulty: 2
  type: match
  stem: จับคู่เงื่อนไข Incoterms 2020 กับหน้าที่ของผู้ขายหรือผู้ซื้อเรื่องการประกันภัย
  pairs:
  - left: CIF
    right: ผู้ขายต้องทำประกันขั้นต่ำ ICC (C) วงเงิน 110% ของราคาสินค้า
  - left: CIP
    right: ผู้ขายต้องทำประกันขั้นต่ำ ICC (A) วงเงิน 110% ของราคาสินค้า
  - left: FOB
    right: ผู้ซื้อรับความเสี่ยงตั้งแต่สินค้าอยู่บนเรือที่ท่าต้นทาง ผู้ขายไม่มีหน้าที่ทำประกัน
  - left: EXW
    right: ผู้ซื้อรับความเสี่ยงตั้งแต่ที่ตั้งของผู้ขาย จึงควรจัดประกันเอง
  hints:
  - ดูว่าเงื่อนไขใดระบุให้ผู้ขายต้องทำประกันให้
  - เงื่อนไขที่ผู้ซื้อรับความเสี่ยงเร็วที่สุดจะไม่มีหน้าที่ประกันของผู้ขาย
  solution: CIF กำหนดประกันขั้นต่ำ ICC (C) และ CIP กำหนดประกันขั้นต่ำ ICC (A) ทั้งสองวงเงิน 110% ส่วน FOB และ EXW ไม่บังคับให้ฝ่ายใดทำประกัน แต่ผู้ซื้อรับความเสี่ยงช่วงขนส่งหลักจึงมักจัดประกันเอง (ตรวจเงื่อนไขกับ ICC Incoterms 2020 ฉบับเต็มก่อนใช้จริง)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p003
  topics:
  - business.law.transport-insurance
  difficulty: 2
  type: mcq
  stem: ข้อใดไม่ใช่หน้าที่หรือความหมายของใบตราส่ง (Bill of Lading)
  choices:
  - id: a
    text: เป็นใบรับของที่แสดงว่าผู้ขนส่งรับสินค้าไว้แล้ว
    feedback: นี่คือหน้าที่ของใบตราส่ง
  - id: b
    text: เป็นหลักฐานของสัญญาการขนส่ง
    feedback: นี่คือหน้าที่ของใบตราส่ง
  - id: c
    text: เป็นเอกสารสิทธิที่ผู้ถือที่ชอบด้วยกฎหมายใช้รับสินค้าได้
    feedback: นี่คือหน้าที่ของใบตราส่ง
  - id: d
    text: เป็นใบเสร็จรับเงินค่าสินค้าที่ผู้ขายออกให้ผู้ซื้อ
    correct: true
  hints:
  - ใบตราส่งเป็นเอกสารของการขนส่ง ไม่ใช่เอกสารการชำระเงิน
  - ตรวจว่าแต่ละข้อเป็นหน้าที่ของใบตราส่งหรือไม่
  solution: ใบตราส่งทำหน้าที่เป็นใบรับของ หลักฐานสัญญาการขนส่ง และเอกสารสิทธิในสินค้า แต่ไม่ใช่ใบเสร็จรับเงินค่าสินค้า ซึ่งเป็นเอกสารการค้าอีกฉบับหนึ่ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p004
  topics:
  - business.law.transport-insurance
  difficulty: 2
  type: numeric
  stem: ผู้ส่งออกยางพาราทำประกันสินค้าในราคา CIF 650,000 บาท ตามเกณฑ์ทุนประกัน CIF + 10% ทุนประกันเป็นเท่าไร (ตอบเป็นบาท)
  answer:
    value: 715000.0
    tolerance: 0.5
    unit: บาท
  misconceptions:
  - match: 650000
    feedback: ลืมบวก 10% ทุนประกันต้องมากกว่าราคา CIF เพื่อคุ้มค่าของที่ควรได้หากเกิดความเสียหาย
  - match: 650010
    feedback: บวก 10 บาท แทนการบวก 10% ของราคา
  hints:
  - ทุนประกันคือราคา CIF คูณด้วย 110%
  - คำนวณ 650,000 × 1.10
  solution: ทุนประกัน = 650,000 × 1.10 = 715,000 บาท ตามเกณฑ์ CIF + 10%
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p005
  topics:
  - business.law.transport-insurance
  difficulty: 3
  type: numeric
  stem: ส่งกุ้งแช่แข็งทางเรือ ราคา FOB 700,000 บาท และค่าระวางทางเรือ 60,000 บาท ราคา CIF คือ FOB รวมค่าระวาง ทุนประกันตามเกณฑ์ CIF + 10% เป็นเท่าไร (ตอบเป็นบาท)
  answer:
    value: 836000.0
    tolerance: 0.5
    unit: บาท
  misconceptions:
  - match: 770000.0
    feedback: นำ 10% ไปคูณกับ FOB แต่ลืมค่าระวางในราคา CIF
  - match: 830000.0
    feedback: คิด 10% เฉพาะราคา FOB แล้วบวกค่าระวางเข้าไปโดยไม่คูณ 1.10
  hints:
  - หาราคา CIF ก่อนโดยรวม FOB กับค่าระวาง
  - ทุนประกันคือ CIF คูณ 1.10
  solution: CIF = 700,000 + 60,000 = 760,000 บาท ทุนประกัน = 760,000 × 1.10 = 836,000 บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p006
  topics:
  - business.law.transport-insurance
  difficulty: 3
  type: mcq
  stem: ตามความคุ้มครองของ Institute Cargo Clauses ข้อใดถูกต้อง
  choices:
  - id: a
    text: ICC (A) คุ้มครองการลักขโมยและสูญหายระหว่างทางโดยไม่ต้องซื้อเงื่อนไขเพิ่ม
    correct: true
  - id: b
    text: ICC (B) คุ้มครองการลักขโมยด้วยเช่นเดียวกับ ICC (A)
    feedback: ICC (B) เป็นความคุ้มครองแบบระบุภัย ไม่รวมการลักขโมย
  - id: c
    text: ICC (C) คุ้มครองทุกความเสี่ยงที่เกิดระหว่างทางขนส่ง
    feedback: ICC (C) คุ้มครองเฉพาะภัยสำคัญขั้นต่ำเท่านั้น
  - id: d
    text: ICC ทั้งสามระดับคุ้มครองเหมือนกันทุกประการ
    feedback: แต่ละระดับมีขอบเขตต่างกัน ผู้ซื้อประกันต้องเลือกให้เหมาะกับความเสี่ยง
  hints:
  - ระดับ A เป็นความคุ้มครองกว้างที่สุด
  - เทียบว่าการลักขโมยอยู่ในรายการภัยที่ระบุของระดับใด
  solution: ICC (A) คุ้มครองความเสียหายแบบทุกความเสี่ยงยกเว้นที่ระบุในข้อยกเว้น รวมถึงการลักขโมยและสูญหาย ส่วน B และ C เป็นความคุ้มครองแบบระบุภัย ซึ่งแคบกว่า (ตรวจข้อยกเว้นในฉบับจริงเสมอ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p007
  topics:
  - business.law.transport-insurance
  difficulty: 3
  type: numeric
  stem: กุ้งแช่แข็งทำประกันแบบ ICC (A) ทุนประกัน 836,000 บาท ความเสียหายจากน้ำทะเลเข้าตู้ประเมินได้ 132,000 บาท กรมธรรม์มีค่าส่วนแรก (deductible) 20,000 บาทซึ่งผู้เอาประกันต้องรับเอง ผู้เอาประกันได้รับเงินชดเชยกี่บาท (ตอบเป็นบาท)
  answer:
    value: 112000
    tolerance: 0.5
    unit: บาท
  misconceptions:
  - match: 132000
    feedback: ลืมหักค่าส่วนแรก ผู้เอาประกันต้องรับส่วนนั้นเอง
  hints:
  - ค่าส่วนแรกคือส่วนที่ผู้เอาประกันรับเอง ไม่ได้รับชดเชย
  - คำนวณ 132,000 − 20,000
  solution: เงินชดเชย = 132,000 − 20,000 = 112,000 บาท (ทุนประกันยังสูงกว่าความเสียหาย จึงไม่ถูกจำกัดด้วยวงเงิน)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p008
  topics:
  - business.law.transport-insurance
  difficulty: 4
  type: order
  stem: เรียงลำดับขั้นตอนการเรียกร้องค่าเสียหายเมื่อสินค้าส่งออกเสียหายระหว่างขนส่งทางเรือ
  items:
  - ตรวจสภาพสินค้าและหมายเหตุความเสียหายบนเอกสารรับของก่อนลงนามรับ
  - แจ้งบริษัทประกันและผู้ขนส่งทันที
  - เก็บหลักฐาน เช่น ใบตราส่ง ใบกำกับสินค้า รายการบรรจุ และรูปถ่าย
  - ให้ผู้สำรวจอิสระประเมินความเสียหาย
  - ยื่นเรื่องเรียกร้องตามเงื่อนไขและอายุความในกรมธรรม์และกฎหมาย
  hints:
  - ความเสียหายต้องถูกบันทึกตั้งแต่ตอนรับสินค้า แล้วจึงแจ้งทุกฝ่ายทันที
  - หลักฐานต้องถูกเก็บก่อนยื่นเรื่อง และการประเมินมาก่อนการยื่น
  solution: หมายเหตุความเสียหายบนเอกสารรับของ → แจ้งบริษัทประกันและผู้ขนส่งทันที → เก็บหลักฐาน → ให้ผู้สำรวจประเมิน → ยื่นเรื่องตามเงื่อนไขและอายุความ (ระยะเวลาต้องตรวจในกรมธรรม์และกฎหมายที่เกี่ยวข้อง)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p009
  topics:
  - business.law.transport-insurance
  difficulty: 4
  type: mcq
  multiple: true
  stem: ข้อใดควรเก็บไว้เป็นหลักฐานประกอบการเรียกร้องค่าเสียหายสินค้าเสียหาย (เลือกทุกข้อที่ถูก)
  choices:
  - id: a
    text: ใบตราส่ง (Bill of Lading)
    correct: true
  - id: b
    text: ใบกำกับสินค้า (Invoice)
    correct: true
  - id: c
    text: รายการบรรจุสินค้า (Packing list)
    correct: true
  - id: d
    text: ทิ้งบรรจุภัณฑ์ที่เสียหายทันทีเพื่อประหยัดพื้นที่
    feedback: บรรจุภัณฑ์ที่เสียหายควรเก็บไว้เป็นหลักฐาน ไม่ควรทิ้งก่อนให้ผู้สำรวจดู
  - id: e
    text: รูปถ่ายความเสียหายที่ถ่ายตั้งแต่ตรวจพบ
    correct: true
  hints:
  - คิดว่าอะไรแสดงว่าสินค้าอะไรถูกส่งและอยู่ในสภาพใดก่อนและหลังเกิดเหตุ
  - สิ่งที่เปลี่ยนสภาพหรือถูกทิ้งไปจะหาหลักฐานกลับไม่ได้
  solution: ใบตราส่ง ใบกำกับสินค้า รายการบรรจุ และรูปถ่ายความเสียหายเป็นหลักฐานหลักของการเรียกร้อง ส่วนบรรจุภัณฑ์ที่เสียหายควรเก็บให้ผู้สำรวจตรวจก่อนทิ้ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p010
  topics:
  - business.law.transport-insurance
  difficulty: 4
  type: mcq
  stem: ผู้ขนส่งอาจยกเว้นความรับผิดเมื่อความเสียหายเกิดจากเหตุใดที่เป็นข้อยกเว้นทั่วไป
  choices:
  - id: a
    text: คุณสมบัติของสินค้าเองที่เสื่อมอยู่แล้ว เช่น ผลไม้สุกเกินก่อนส่ง
    correct: true
  - id: b
    text: ผู้ขนส่งจัดเก็บสินค้าในที่ชื้นจนเสียหาย
    feedback: เป็นความประมาทของผู้ขนส่งเอง จึงไม่ใช่ข้อยกเว้น
  - id: c
    text: ลูกจ้างของผู้ขนส่งขโมยสินค้าไประหว่างทาง
    feedback: ผู้ขนส่งต้องรับผิดต่อการกระทำของลูกจ้างที่ดูแลสินค้า จึงไม่ใช่ข้อยกเว้น
  - id: d
    text: ผู้ขนส่งไม่แจ้งผู้รับเมื่อสินค้าถึงท่า
    feedback: เป็นหน้าที่ของผู้ขนส่ง ไม่ใช่เหตุยกเว้นความรับผิดต่อความเสียหาย
  hints:
  - ข้อยกเว้นมักเกี่ยวกับตัวสินค้าหรือเหตุที่ผู้ขนส่งควบคุมไม่ได้
  - ตรวจว่าเหตุนั้นเกิดจากความผิดของผู้ขนส่งหรือไม่
  solution: ความบกพร่องหรือการเสื่อมตามธรรมชาติของสินค้าเองเป็นเหตุที่ผู้ขนส่งอาจอ้างยกเว้นได้ ส่วนความประมาท การดูแลที่ไม่เหมาะสม และการไม่ปฏิบัติหน้าที่เป็นความรับผิดของผู้ขนส่ง (ตรวจรายละเอียดตามตัวบทฉบับปัจจุบัน)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p011
  topics:
  - business.law.transport-insurance
  difficulty: 5
  type: numeric
  stem: ทุนประกันสินค้าชุดหนึ่งตามเกณฑ์ CIF + 10% เท่ากับ 1,430,000 บาท ราคา CIF ของสินค้าชุดนี้เป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 1300000.0
    tolerance: 0.5
    unit: บาท
  misconceptions:
  - match: 1287000
    feedback: หัก 10% ออกจากทุนประกัน แต่ทุนประกันคือ CIF บวก 10% ต้องหารด้วย 1.10
  hints:
  - ทุนประกัน = CIF × 1.10
  - ย้อนกลับโดยหาร 1,430,000 ด้วย 1.10
  solution: CIF = 1,430,000 ÷ 1.10 = 1,300,000 บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p012
  topics:
  - business.law.transport-insurance
  difficulty: 5
  type: mcq
  stem: ตามข้อตกลง CIF ของ Incoterms 2020 ความเสี่ยงของสินค้าโอนไปยังผู้ซื้อเมื่อใด
  choices:
  - id: a
    text: เมื่อสินค้าถูกบรรทุกขึ้นเรือที่ท่าต้นทาง
    correct: true
  - id: b
    text: เมื่อสินค้าถึงท่าปลายทางและผ่านพิธีการศุลกากร
    feedback: การโอนความเสี่ยงของ CIF ไม่ได้รอจนถึงท่าปลายทาง
  - id: c
    text: เมื่อผู้ซื้อชำระเงินค่าสินค้าครบแล้ว
    feedback: การชำระเงินเป็นคนละเรื่องกับการโอนความเสี่ยง
  - id: d
    text: เมื่อผู้ขายได้รับใบตราส่งแล้ว
    feedback: การได้รับเอกสารไม่ได้เป็นตัวกำหนดการโอนความเสี่ยง
  hints:
  - ดูว่า CIF ใช้จุดใดเป็นจุดโอนความเสี่ยง ต่างจากจุดที่ผู้ขายรับผิดชอบค่าระวาง
  - เทียบกับภาพเส้นทางขนส่งที่มีจุดโอนความเสี่ยงที่ท่าต้นทาง
  solution: ภายใต้ CIF ความเสี่ยงโอนเมื่อสินค้าอยู่บนเรือที่ท่าต้นทาง แม้ผู้ขายยังต้องจ่ายค่าระวางและทำประกันไปถึงท่าปลายทาง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p013
  topics:
  - business.law.transport-insurance
  difficulty: 3
  type: mcq
  stem: ใบขนสินค้าที่ยื่นต่อศุลกากรมีหน้าที่หลักอย่างไร
  choices:
  - id: a
    text: เป็นเอกสารแสดงรายการสินค้าเพื่อยื่นต่อศุลกากรสำหรับการนำเข้าหรือส่งออก
    correct: true
  - id: b
    text: เป็นใบรับประกันคุณภาพสินค้าจากผู้ผลิต
    feedback: ใบขนสินค้าเป็นเอกสารพิธีการศุลกากร ไม่ใช่ใบรับประกันคุณภาพ
  - id: c
    text: เป็นกรมธรรม์ประกันภัยขนส่งที่ผู้ขนส่งออก
    feedback: กรมธรรม์เป็นเอกสารของบริษัทประกันภัย
  - id: d
    text: เป็นใบเสร็จค่าภาษีที่จ่ายให้กรมศุลกากร
    feedback: การชำระภาษีอาจมีใบเสร็จแยก ไม่ใช่หน้าที่หลักของใบขนสินค้า
  hints:
  - ศุลกากรต้องรู้ว่ามีสินค้าอะไรผ่านด่าน
  - ใบขนสินค้าแสดงรายการสินค้าเพื่อพิธีการ
  solution: ใบขนสินค้าเป็นเอกสารพิธีการที่แสดงรายการสินค้าเพื่อให้ศุลกากรตรวจและอนุมัติการนำเข้าหรือส่งออก (รายละเอียดพิธีการตรวจกับกรมศุลกากร)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p014
  topics:
  - business.law.transport-insurance
  difficulty: 2
  type: text
  stem: เอกสารที่ผู้ขนส่งออกให้เมื่อรับสินค้าไว้ ซึ่งเป็นหลักฐานของสัญญาการขนส่งและอาจเป็นเอกสารสิทธิในสินค้า เรียกว่าอะไร (ตอบเป็นภาษาอังกฤษหรือภาษาไทย)
  accepted:
  - ใบตราส่ง
  - ใบตราส่งสินค้า
  - บิลออฟเลดิง
  - B/L
  - bill of lading
  - Bill of Lading
  hints:
  - เอกสารนี้ระบุว่าผู้ขนส่งรับสินค้าไว้แล้วและมีรายละเอียดของการขนส่ง
  - ชื่อเต็มภาษาอังกฤษคือ Bill of Lading
  solution: ใบตราส่ง (Bill of Lading หรือ B/L) เป็นเอกสารที่ผู้ขนส่งออกให้เมื่อรับสินค้า ทำหน้าที่เป็นใบรับของ หลักฐานสัญญา และเอกสารสิทธิ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p015
  topics:
  - business.law.transport-insurance
  difficulty: 2
  type: numeric
  stem: สินค้าส่งออกราคา CIF 1,000,000 บาท ทำประกันโดยตั้งทุนประกันตามเกณฑ์ CIF + 10% และเบี้ยประกันคิดอัตราสมมติ 0.2% ของทุนประกัน เบี้ยประกันเป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 2200.0
    tolerance: 0.5
    unit: บาท
  misconceptions:
  - match: 2000.0
    feedback: คิดอัตราจากราคา 1,000,000 แทนทุนประกันที่ 1,100,000 บาท
  hints:
  - 'หาทุนประกันก่อน: 1,000,000 × 1.10'
  - 'เบี้ยประกันคิดจากทุนประกัน ไม่ใช่ราคาสินค้า: ทุนประกัน × 0.002'
  solution: ทุนประกัน = 1,000,000 × 1.10 = 1,100,000 บาท เบี้ยประกัน = 1,100,000 × 0.002 = 2,200 บาท (อัตรา 0.2% เป็นตัวเลขสมมติเพื่อการคำนวณ ไม่ใช่อัตราจริงของบริษัทประกัน)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p016
  topics:
  - business.law.transport-insurance
  difficulty: 2
  type: match
  stem: จับคู่ระดับ ICC กับลักษณะความคุ้มครอง
  pairs:
  - left: ICC (A)
    right: คุ้มครองทุกความเสี่ยงยกเว้นที่ระบุในข้อยกเว้น
  - left: ICC (B)
    right: คุ้มครองเฉพาะภัยที่ระบุชื่อ กว้างกว่า ICC (C)
  - left: ICC (C)
    right: คุ้มครองเฉพาะภัยสำคัญขั้นต่ำ เช่น ไฟไหม้ เรือล่ม เรือชน
  hints:
  - ระดับ A คือความคุ้มครองกว้างที่สุด
  - ระดับ C แคบที่สุดและเน้นภัยสำคัญ
  solution: ICC (A) คุ้มครองกว้างที่สุดโดยยกเว้นเฉพาะที่ระบุ ICC (B) เป็นการระบุภัยที่ขยายกว่า C และ ICC (C) เป็นความคุ้มครองขั้นต่ำ (ตรวจฉบับจริงเสมอ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p017
  topics:
  - business.law.transport-insurance
  difficulty: 3
  type: order
  stem: เรียงลำดับการเตรียมประกันสินค้าก่อนส่งออกทางเรือ
  items:
  - ตรวจเงื่อนไขการค้าเพื่อดูว่าใครต้องจัดประกัน
  - เลือกระดับความคุ้มครองและคำนวณทุนประกันตามเกณฑ์ CIF + 10%
  - ขอใบเสนอราคาเบี้ยประกันจากบริษัทประกันแล้วเปรียบเทียบ
  - ซื้อกรมธรรม์ให้มีผลก่อนสินค้าออกเดินทาง
  - เก็บหลักฐานการส่งมอบและการตรวจสภาพสินค้าไว้
  hints:
  - เริ่มจากตรวจว่าใครเป็นผู้มีหน้าที่ประกัน
  - ต้องรู้ระดับความคุ้มครองและทุนประกันก่อน บริษัทประกันจึงเสนอราคาเบี้ยได้
  solution: ตรวจเงื่อนไขการค้า → เลือกระดับความคุ้มครองและคำนวณทุนประกัน → ขอใบเสนอราคาเบี้ย → ซื้อกรมธรรม์ให้มีผลก่อนออกเดินทาง → เก็บหลักฐานการส่งมอบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.law.transport-insurance.p018
  topics:
  - business.law.transport-insurance
  difficulty: 5
  type: mcq
  stem: ผู้ประกอบการขนส่งต่อเนื่องหลายรูปแบบ (ทางบกต่อทางเรือ) ที่รับจ้างขนส่งตลอดเส้นทาง ควรเข้าใจความรับผิดชอบของตนอย่างไรตามกฎหมายไทย
  choices:
  - id: a
    text: รับผิดต่อผู้ว่าจ้างตามสัญญาตลอดเส้นทางที่รับจ้าง แม้จะใช้ผู้ขนส่งช่วงมาดำเนินการบางส่วน
    correct: true
  - id: b
    text: รับผิดเฉพาะช่วงที่ตนขับรถเองเท่านั้น
    feedback: ผู้ประกอบการที่รับจ้างตลอดเส้นทางมีความรับผิดเกินกว่าช่วงที่ตนดำเนินการเองโดยตรง
  - id: c
    text: ไม่ต้องรับผิดใด ๆ เพราะส่งต่อให้ผู้ขนส่งช่วงแล้ว
    feedback: การส่งช่วงไม่ได้ทำให้พ้นความรับผิดต่อผู้ว่าจ้างโดยอัตโนมัติ
  - id: d
    text: รับผิดเฉพาะกรณีที่สินค้าเสียหายจากอุบัติเหตุบนทะเลเท่านั้น
    feedback: ขอบเขตความรับผิดไม่จำกัดเฉพาะเหตุทางทะเล
  hints:
  - คิดว่าผู้รับจ้างตลอดเส้นทางรับผิดต่อใคร
  - การจ้างช่วงไม่ได้ย้ายความรับผิดต่อผู้ว่าจ้างไปที่ผู้รับจ้างช่วงทั้งหมด
  solution: พ.ร.บ.การขนส่งต่อเนื่องหลายรูปแบบ พ.ศ. 2548 กำหนดให้ผู้ประกอบการขนส่งต่อเนื่องรับผิดต่อผู้ว่าจ้างตามเงื่อนไขของกฎหมาย (ตรวจตัวบทฉบับปัจจุบันก่อนนำไปอ้างอิง เอกสารนี้เป็นความรู้ทั่วไป ไม่ใช่คำปรึกษากฎหมาย)
  license: CC-BY-SA-4.0
  ai_assisted: true
