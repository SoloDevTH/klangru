    text: 踢足球 tī zúqiú
    correct: true
    feedback: ถูก ฟุตบอลใช้เท้าเตะ จึงใช้ 踢
  - id: b
    text: 打足球 dǎ zúqiú
    feedback: 打 ใช้กับกีฬาที่ใช้มือ เช่น 打篮球 打羽毛球
  - id: c
    text: 做足球 zuò zúqiú
    feedback: 做 = ทำ ไม่ใช้กับกีฬา
  hints:
  - 足 = เท้า
  - กีฬาที่ใช้เท้าเตะใช้กริยา 踢 tī
