<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif" font-size="14">
<title>การแข่งกลิ้งลงพื้นเอียง</title>
<rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
<polygon points="60.0,80.0 548.6,257.9 60.0,257.9" fill="#eeeeee" stroke="#15211e" stroke-width="2" stroke-linejoin="round"/>
<circle cx="516.5" cy="229.1" r="16.0" fill="#f3c9c4" stroke="#c0392b" stroke-width="2.5"/>
<circle cx="400.0" cy="60.0" r="7.0" fill="none" stroke="#c0392b" stroke-width="3"/>
<text x="414.0" y="65.0" text-anchor="start" fill="#c0392b" font-size="13">ทรงกลมตัน (I = 0.4MR²)</text>
<circle cx="486.5" cy="218.2" r="16.0" fill="#cde8d4" stroke="#1e7a3c" stroke-width="2.5"/>
<circle cx="400.0" cy="86.0" r="7.0" fill="none" stroke="#1e7a3c" stroke-width="3"/>
<text x="414.0" y="91.0" text-anchor="start" fill="#1e7a3c" font-size="13">ทรงกระบอกตัน (I = 0.5MR²)</text>
<circle cx="381.2" cy="179.9" r="16.0" fill="none" stroke="#1f5fa8" stroke-width="4"/>
<circle cx="400.0" cy="112.0" r="7.0" fill="none" stroke="#1f5fa8" stroke-width="3"/>
<text x="414.0" y="117.0" text-anchor="start" fill="#1f5fa8" font-size="13">ห่วงบาง (I = 1MR²)</text>
<text x="320.0" y="300.0" text-anchor="middle" fill="#777" font-size="13">ภาพ ณ ขณะเดียวกัน: ระยะที่กลิ้งได้แปรผกผันกับ 1 + I/(MR²)</text>
</svg>
