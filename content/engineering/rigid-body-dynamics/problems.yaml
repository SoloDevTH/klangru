  - id: engineering.mechanics.rigid-body-dynamics.p018
    topics: [engineering.mechanics.rigid-body-dynamics]
    difficulty: 3
    type: numeric
    stem: "ประตูรั้วเหล็กบานหมุนจำลองเป็นแท่งสม่ำเสมอมวล $6\\ \\mathrm{kg}$ ยาว $1.2\\ \\mathrm{m}$ หมุนรอบบานพับที่ปลายด้วย $2\\ \\mathrm{rad/s}$ โมเมนตัมเชิงมุมรอบบานพับเป็นกี่ $\\mathrm{kg\\cdot m^2/s}$ (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 5.76, tolerance: 0.05, unit: "kg·m²/s" }
    misconceptions:
      - { match: 1.44, feedback: "ใช้ $I_G\\omega$ ซึ่งเป็นโมเมนตัมเชิงมุมรอบ G ต้องบวกโมเมนต์ของโมเมนตัมเชิงเส้น $r_Gmv_G$" }
      - { match: 4.32, feedback: "คิดเฉพาะ $r_Gmv_G$ ลืมส่วนการหมุนรอบตัวเอง $I_G\\omega$" }
    hints:
      - "$H_O = I_G\\omega + r_G(mv_G)$ เมื่อ $v_G = \\omega L/2$"
      - "หรือ $H_O = I_O\\omega$ เพราะ O เป็นแกนคงที่"
    solution: "$I_O\\omega = \\tfrac13(6)(1.44)(2) = 5.76$ ตรวจ: $I_G\\omega + r_Gmv_G = 0.72(2) + 0.6(6)(1.2) = 1.44 + 4.32 = 5.76\\ \\mathrm{kg\\cdot m^2/s}$"
