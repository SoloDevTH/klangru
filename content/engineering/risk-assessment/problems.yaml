      - id: c
        text: การทดสอบความทนทานของวัสดุด้วยแรงดึง
        feedback: นั่นคือการทดสอบวัสดุ ไม่ใช่วิธีวิเคราะห์อันตรายเชิงกระบวนการ
      - id: d
