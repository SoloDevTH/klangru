<text x="400.0" y="410.0" text-anchor="middle" font-size="13" fill="#222">พลังงานแสง → พลังงานเคมีใน ATP และ NADPH ซึ่งส่งต่อไปใช้ในวัฏจักรคัลวินที่สโตรมา</text>
