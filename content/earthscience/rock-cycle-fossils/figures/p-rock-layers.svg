<path d="M295,265 a12,12 0 0 1 24,0 z" fill="#f5f5f4" stroke="#57534e"/>
<text x="320.0" y="322.0" text-anchor="middle" font-size="12" fill="#6b7280">ภาพสมมติ ชั้นหินไม่ถูกพลิกกลับ</text>
