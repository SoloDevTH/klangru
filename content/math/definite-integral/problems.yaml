    stem: "ให้ $G(x) = \\displaystyle\\int_0^{x^2}\\sqrt{1 + t}\\,dt$ จงหา $G'(2)$ (ตอบทศนิยมสองตำแหน่ง)"
    answer: { value: 8.94, tolerance: 0.02 }
    hints:
