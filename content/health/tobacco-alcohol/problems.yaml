problems:
- id: health.substances.tobacco-alcohol.p001
  topics:
  - health.substances.tobacco-alcohol
  difficulty: 1
  type: mcq
  stem: สารใดในบุหรี่และบุหรี่ไฟฟ้าส่วนใหญ่ที่ทำให้ติด
  choices:
  - id: a
    text: นิโคติน
    correct: true
  - id: b
    text: น้ำ
    feedback: น้ำไม่ทำให้ติด และบุหรี่ไฟฟ้าไม่ใช่แค่ไอน้ำ
  - id: c
    text: วิตามินซี
    feedback: บุหรี่ไม่มีประโยชน์ต่อร่างกาย
  hints:
  - สารนี้ทำให้อยากสูบซ้ำ
  - มีทั้งในบุหรี่มวนและน้ำยาบุหรี่ไฟฟ้าส่วนใหญ่
  solution: นิโคตินเป็นสารที่ทำให้ติดสูง มีทั้งในบุหรี่และน้ำยาบุหรี่ไฟฟ้าส่วนใหญ่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.tobacco-alcohol.p002
  topics:
  - health.substances.tobacco-alcohol
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นการปฏิเสธที่ชัดเจนเมื่อเพื่อนยื่นบุหรี่ไฟฟ้าให้ลอง
  choices:
  - id: a
    text: "\"ไม่เอา ขอบใจ ไปเตะบอลกันดีกว่า\""
    correct: true
  - id: b
    text: "\"ไว้ก่อนนะ เดี๋ยวค่อยลอง\""
    feedback: คำตอบกำกวมทำให้อีกฝ่ายชวนซ้ำ
  - id: c
    text: "\"ลองนิดเดียวก็ได้\""
    feedback: เป็นการยอมรับ ไม่ใช่การปฏิเสธ
  hints:
  - การปฏิเสธที่ดีพูดคำว่า "ไม่" ชัด ๆ
  - เสนอสิ่งอื่นทำแทนได้
  solution: การปฏิเสธที่ได้ผลพูดชัดเจนและเสนอทางเลือก ไม่ทิ้งช่องให้ชวนซ้ำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.tobacco-alcohol.p003
  topics:
  - health.substances.tobacco-alcohol
  difficulty: 2
  type: numeric
  stem: ตามกฎหมายไทย ร้านค้าห้ามขายเครื่องดื่มแอลกอฮอล์ให้ผู้ที่มีอายุต่ำกว่ากี่ปีบริบูรณ์ (ตอบเป็นปี)
  answer:
    value: 20
    unit: ปี
  misconceptions:
  - match: 18
    feedback: 18 ปีเป็นอายุที่หลายประเทศใช้ แต่กฎหมายไทยกำหนด 20 ปี
  - match: 15
    feedback: กฎหมายไทยกำหนดสูงกว่านั้น
  hints:
  - พ.ร.บ.ควบคุมเครื่องดื่มแอลกอฮอล์ พ.ศ. 2551 มาตรา 29
  - อายุนี้เท่ากับอายุที่ห้ามขายบุหรี่
  solution: กฎหมายไทยห้ามขายเครื่องดื่มแอลกอฮอล์และผลิตภัณฑ์ยาสูบให้ผู้ที่อายุต่ำกว่า 20 ปีบริบูรณ์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.tobacco-alcohol.p004
  topics:
  - health.substances.tobacco-alcohol
  difficulty: 2
  type: mcq
  stem: ข้อใดถูกต้องเกี่ยวกับบุหรี่ไฟฟ้าในประเทศไทย
  choices:
  - id: a
    text: ห้ามนำเข้าและห้ามขายหรือให้บริการ
    correct: true
  - id: b
    text: ขายได้ถูกกฎหมายถ้าผู้ซื้ออายุ 20 ปีขึ้นไป
    feedback: บุหรี่ไฟฟ้าห้ามขายทุกกรณีตามคำสั่งคณะกรรมการคุ้มครองผู้บริโภคที่ 9/2558
  - id: c
    text: ถูกกฎหมายเพราะเป็นแค่ไอน้ำ
    feedback: บุหรี่ไฟฟ้าไม่ใช่แค่ไอน้ำ และผิดกฎหมายทั้งการนำเข้าและการขาย
  hints:
  - มีกฎหมายสองฉบับที่เกี่ยวข้อง ฉบับหนึ่งเรื่องนำเข้า อีกฉบับเรื่องขาย
  - ไม่มีเกณฑ์อายุที่ทำให้ขายได้
  solution: บุหรี่ไฟฟ้าห้ามนำเข้าตามประกาศกระทรวงพาณิชย์ พ.ศ. 2557 และห้ามขายหรือให้บริการตามคำสั่ง สคบ. ที่ 9/2558
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.tobacco-alcohol.p005
  topics:
  - health.substances.tobacco-alcohol
  difficulty: 2
  type: match
  stem: จับคู่สารในควันบุหรี่กับผลต่อร่างกาย
  pairs:
  - left: นิโคติน
    right: ทำให้ติด
  - left: ทาร์
    right: ก่อมะเร็ง ทำให้ฟันและนิ้วเหลือง
  - left: คาร์บอนมอนอกไซด์
    right: แย่งที่ออกซิเจนในเลือด ทำให้เหนื่อยง่าย
  hints:
  - สารหนึ่งทำให้อยากสูบซ้ำ
  - แก๊สชนิดหนึ่งจับกับเลือดได้ดีกว่าออกซิเจน
  solution: นิโคตินทำให้ติด ทาร์เป็นสารเหนียวที่ก่อมะเร็ง และคาร์บอนมอนอกไซด์แย่งที่ออกซิเจนในเลือด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.tobacco-alcohol.p006
  topics:
  - health.substances.tobacco-alcohol
  difficulty: 2
  type: order
  stem: เรียงขั้นการปฏิเสธเมื่อถูกชวนดื่มเครื่องดื่มแอลกอฮอล์
  items:
  - ปฏิเสธชัดเจน
  - บอกเหตุผลของตัวเอง
  - เสนอทางเลือกอื่น
  - ออกจากที่นั่นถ้ายังถูกตื๊อ
  hints:
  - เริ่มจากพูดคำว่าไม่
  - ขั้นสุดท้ายใช้เมื่อพูดแล้วไม่ได้ผล
  solution: ปฏิเสธชัด → บอกเหตุผล → เสนอทางเลือก → ออกจากสถานการณ์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.tobacco-alcohol.p007
  topics:
  - health.substances.tobacco-alcohol
  difficulty: 3
  type: text
  stem: สายเลิกบุหรี่ของศูนย์บริการเลิกบุหรี่ทางโทรศัพท์แห่งชาติ โทรฟรีทุกเครือข่าย คือหมายเลขใด (ตอบเป็นตัวเลข 4 หลัก)
  accepted:
  - '1600'
  misconceptions:
  - match: '1413'
    feedback: 1413 คือสายด่วนเลิกเหล้า
  - match: '1323'
    feedback: 1323 คือสายด่วนสุขภาพจิต
  hints:
  - ขึ้นต้นด้วย 16
  - ลงท้ายด้วย 00
  solution: โทร 1600 เพื่อรับคำปรึกษาเลิกบุหรี่ ฟรีทุกเครือข่าย ส่วนสายด่วนเลิกเหล้าคือ 1413
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.tobacco-alcohol.p008
  topics:
  - health.substances.tobacco-alcohol
  difficulty: 3
  type: numeric
  stem: ผู้ขับขี่อายุไม่ถึง 20 ปี ถ้ามีแอลกอฮอล์ในเลือดเกินกี่มิลลิกรัมเปอร์เซ็นต์ กฎหมายถือว่าเมาสุรา (ตอบเป็นมิลลิกรัมเปอร์เซ็นต์)
  answer:
    value: 20
    unit: มก.%
  misconceptions:
  - match: 50
    feedback: 50 มก.% คือเกณฑ์ของผู้ขับขี่ทั่วไป ผู้ขับขี่อายุไม่ถึง 20 ปีใช้เกณฑ์เข้มกว่า
  - match: 0
    feedback: กฎหมายกำหนดเกณฑ์ไว้เป็นตัวเลข แม้วิธีที่ปลอดภัยที่สุดคือไม่ดื่มเลย
  hints:
  - เกณฑ์นี้ใช้กับผู้มีใบขับขี่ชั่วคราวด้วย
  - ต่ำกว่าเกณฑ์ผู้ขับขี่ทั่วไป 50 มก.%
  solution: ตามกฎกระทรวงฉบับที่ 21 (พ.ศ. 2560) ผู้ขับขี่อายุไม่ถึง 20 ปีที่มีแอลกอฮอล์ในเลือดเกิน 20 มก.% ถือว่าเมาสุรา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.tobacco-alcohol.p009
  topics:
  - health.substances.tobacco-alcohol
  difficulty: 3
  type: mcq
  stem: เหตุใดแอลกอฮอล์จึงทำให้เกิดอุบัติเหตุทางถนนบ่อย
  choices:
  - id: a
    text: ทำให้ตอบสนองช้า กะระยะผิด และกล้าเสี่ยงมากขึ้น
    correct: true
  - id: b
    text: ทำให้ตื่นตัวและขับเร็วขึ้นอย่างปลอดภัย
    feedback: แอลกอฮอล์กดการทำงานของสมอง ไม่ได้ทำให้ขับได้ดีขึ้น
  - id: c
    text: ไม่เกี่ยวกัน อุบัติเหตุเกิดจากถนนอย่างเดียว
    feedback: การดื่มแล้วขับเป็นสาเหตุสำคัญของอุบัติเหตุจราจร
  hints:
  - แอลกอฮอล์มีผลต่อสมองโดยตรง
  - การขับรถต้องใช้การมอง การตัดสินใจ และการตอบสนอง
  solution: แอลกอฮอล์กดการทำงานของสมอง ทำให้มองเห็นและกะระยะแย่ลง เบรกช้า และตัดสินใจเสี่ยง จึงเพิ่มอุบัติเหตุ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.tobacco-alcohol.p010
  topics:
  - health.substances.tobacco-alcohol
  difficulty: 3
  type: mcq
  stem: พ่อของบีมสูบบุหรี่มานานและบอกว่าอยากเลิกแต่เลิกไม่ได้ บีมควรทำอย่างไร
  choices:
  - id: a
    text: ให้กำลังใจพ่อ บอกเบอร์ 1600 ซึ่งโทรฟรี และชวนทำกิจกรรมด้วยกันแทนช่วงที่อยากสูบ
    correct: true
  - id: b
    text: ต่อว่าพ่อทุกครั้งที่เห็นสูบ
    feedback: การดุหรือประชดทำให้เครียดและไม่ช่วยให้เลิกได้
  - id: c
    text: ซ่อนบุหรี่ของพ่อโดยไม่บอก
    feedback: ไม่ได้ช่วยเรื่องการติดนิโคติน และอาจทำให้ทะเลาะกัน
  hints:
  - การติดนิโคตินไม่ได้แปลว่าเป็นคนไม่ดี
  - มีบริการให้คำปรึกษาเลิกบุหรี่ฟรี
  solution: การให้กำลังใจโดยไม่ตำหนิและแนะนำสายเลิกบุหรี่ 1600 ช่วยให้คนที่อยากเลิกมีโอกาสสำเร็จมากขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.tobacco-alcohol.p011
  topics:
  - health.substances.tobacco-alcohol
  difficulty: 4
  type: numeric
  stem: องค์การอนามัยโลกรายงานว่ายาสูบทำให้คนเสียชีวิตราว 7 ล้านคนต่อปี และราว 1.6 ล้านคนในนั้นเป็นผู้ที่ไม่ได้สูบแต่ได้รับควันบุหรี่มือสอง คนที่สูบเองเสียชีวิตประมาณกี่ล้านคนต่อปี (ตอบเป็นล้านคน)
  answer:
    value: 5.4
    tolerance: 0.05
    unit: ล้านคน
  misconceptions:
  - match: 8.6
    feedback: "ต้องลบ ไม่ใช่บวก: ทั้งหมด 7 ลบผู้ไม่ได้สูบ 1.6"
  - match: 1.6
    feedback: 1.6 คือผู้ไม่ได้สูบ โจทย์ถามจำนวนผู้สูบ
  hints:
  - ทั้งหมด = ผู้สูบ + ผู้ไม่ได้สูบ
  - ผู้สูบ = 7 − 1.6
  solution: 7 − 1.6 = 5.4 ล้านคน ส่วนอีก 1.6 ล้านคนไม่ได้สูบเองแต่เสียชีวิตจากควันบุหรี่มือสอง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.tobacco-alcohol.p012
  topics:
  - health.substances.tobacco-alcohol
  difficulty: 4
  type: numeric
  stem: แก้มอายุ 17 ปี ตามกฎหมายไทยต้องรออีกอย่างน้อยกี่ปีร้านค้าจึงขายเครื่องดื่มแอลกอฮอล์ให้ได้ (ตอบเป็นปี)
  answer:
    value: 3
    unit: ปี
  misconceptions:
  - match: 1
    feedback: คิดจากอายุ 18 ปีไม่ได้ กฎหมายไทยใช้ 20 ปีบริบูรณ์
  - match: 20
    feedback: 20 คืออายุที่กฎหมายกำหนด โจทย์ถามว่าต้องรออีกกี่ปี
  hints:
  - กฎหมายห้ามขายให้ผู้ที่อายุต่ำกว่า 20 ปีบริบูรณ์
  - ลบอายุปัจจุบันออกจาก 20
  solution: 20 − 17 = 3 ปี ร้านค้าที่ขายให้ผู้ที่อายุต่ำกว่า 20 ปีมีความผิดตาม พ.ร.บ.ควบคุมเครื่องดื่มแอลกอฮอล์ พ.ศ. 2551
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.tobacco-alcohol.p013
  topics:
  - health.substances.tobacco-alcohol
  difficulty: 4
  type: mcq
  stem: หลังงานบวช น้าที่ดื่มเหล้ามาทั้งวันจะขี่มอเตอร์ไซค์ไปส่งต้นที่บ้าน ต้นควรทำอย่างไร
  choices:
  - id: a
    text: ปฏิเสธการซ้อน บอกผู้ใหญ่ที่ไม่ได้ดื่มให้ไปส่ง หรือโทรให้ผู้ปกครองมารับ และชวนน้าไม่ให้ขับ
    correct: true
  - id: b
    text: ซ้อนไปเพราะใกล้บ้านแค่นิดเดียว
    feedback: อุบัติเหตุเกิดได้แม้ระยะทางสั้น และผู้ซ้อนก็บาดเจ็บได้
  - id: c
    text: ซ้อนไปแต่บอกน้าให้ขับช้า ๆ
    feedback: แอลกอฮอล์ทำให้ตอบสนองช้าแม้ขับช้า การไม่ซ้อนปลอดภัยที่สุด
  hints:
  - ผู้ขับที่ดื่มแล้วตอบสนองช้าและตัดสินใจผิด
  - ความปลอดภัยของเรามาก่อนความเกรงใจ
  solution: ไม่ซ้อนรถคนที่ดื่ม หาผู้ใหญ่ที่ไม่ได้ดื่มไปส่ง และชวนผู้ที่ดื่มไม่ให้ขับ เป็นทางเลือกที่ปลอดภัยที่สุด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.substances.tobacco-alcohol.p014
  topics:
  - health.substances.tobacco-alcohol
  difficulty: 4
  type: mcq
  stem: ข้อใดเป็นความเข้าใจผิดเรื่องแอลกอฮอล์ (เลือกทุกข้อที่เป็นความเข้าใจผิด)
  multiple: true
  choices:
  - id: a
    text: ดื่มกาแฟแล้วจะสร่างเมาทันที
    correct: true
    feedback: ถูก ข้อนี้เป็นความเข้าใจผิด กาแฟทำให้ตื่น แต่แอลกอฮอล์ยังอยู่ในเลือด
  - id: b
    text: เบียร์ไม่ใช่เครื่องดื่มแอลกอฮอล์
    correct: true
    feedback: ถูก ข้อนี้เป็นความเข้าใจผิด เบียร์มีแอลกอฮอล์
  - id: c
    text: สมองวัยรุ่นได้รับผลจากแอลกอฮอล์มากกว่าเพราะยังพัฒนาอยู่
    feedback: ข้อนี้เป็นข้อเท็จจริง ไม่ใช่ความเข้าใจผิด
  - id: d
    text: การดื่มเกี่ยวข้องกับอุบัติเหตุจราจรและการจมน้ำ
    feedback: ข้อนี้เป็นข้อเท็จจริง
  hints:
