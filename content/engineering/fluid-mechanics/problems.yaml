problems:
  - id: engineering.fluids.fluid-mechanics.p001
    topics: [engineering.fluids.fluid-mechanics]
    difficulty: 1
    type: mcq
    stem: "เกจวัดลมยางรถอ่านได้ $200\\ \\mathrm{kPa}$ ที่ระดับน้ำทะเล ความดันสัมบูรณ์ในยางประมาณเท่าใด"
    choices:
      - { id: a, text: "$301\\ \\mathrm{kPa}$", correct: true }
      - { id: b, text: "$200\\ \\mathrm{kPa}$", feedback: "เกจวัดเทียบบรรยากาศ ความดันสัมบูรณ์ต้องบวกความดันบรรยากาศ" }
      - { id: c, text: "$99\\ \\mathrm{kPa}$", feedback: "ลบความดันบรรยากาศแทนการบวก" }
      - { id: d, text: "$101\\ \\mathrm{kPa}$", feedback: "นั่นคือความดันบรรยากาศ ซึ่งเกจอ่านเป็นศูนย์" }
    hints:
      - "ความดันสัมบูรณ์ = ความดันเกจ + ความดันบรรยากาศ"
      - "ความดันบรรยากาศ ≈ $101.3\\ \\mathrm{kPa}$"
    solution: "$p_{\\text{abs}} = 200 + 101.3 \\approx 301\\ \\mathrm{kPa}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.fluids.fluid-mechanics.p002
    topics: [engineering.fluids.fluid-mechanics]
    difficulty: 1
    type: match
    stem: "จับคู่กลุ่มไร้มิติกับสิ่งที่เปรียบเทียบ"
    pairs:
      - { left: "เลขเรย์โนลด์ส ρVD/μ", right: "แรงเฉื่อยต่อแรงหนืด" }
      - { left: "เลขฟรูด V/√(gL)", right: "แรงเฉื่อยต่อแรงโน้มถ่วง" }
      - { left: "ความขรุขระสัมพัทธ์ ε/D", right: "ขนาดความขรุขระต่อขนาดท่อ" }
      - { left: "ตัวประกอบความเสียดทาน f", right: "การสูญเสียเฮดต่อความยาวท่อในหน่วยของเฮดความเร็ว" }
    hints:
      - "ทุกกลุ่มไม่มีหน่วย"
      - "ฟรูดมี $g$ อยู่ในสูตร"
    solution: "$Re$ เทียบแรงเฉื่อยกับแรงหนืด $Fr$ เทียบแรงเฉื่อยกับแรงโน้มถ่วง $\\varepsilon/D$ คือความขรุขระสัมพัทธ์ และ $f = h_f \\big/ \\left[\\tfrac{L}{D}\\tfrac{V^2}{2g}\\right]$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.fluids.fluid-mechanics.p003
    topics: [engineering.fluids.fluid-mechanics]
    difficulty: 2
    type: numeric
    stem: "ผิวน้ำในหอถังน้ำของ อบต. (ค่าสมมติ) สูงกว่าก๊อกที่บ้านหลังหนึ่ง $18\\ \\mathrm{m}$ ถ้าปิดก๊อกไว้ (น้ำนิ่ง) ความดันเกจที่ก๊อกเป็นกี่กิโลพาสคัล ($\\rho = 1000\\ \\mathrm{kg/m^3}$, $g = 9.81\\ \\mathrm{m/s^2}$ ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 176.6, tolerance: 1, unit: kPa }
    misconceptions:
      - { match: 277.9, feedback: "บวกความดันบรรยากาศ นั่นคือความดันสัมบูรณ์ โจทย์ถามความดันเกจ" }
      - { match: 18, feedback: "นั่นคือเฮดเป็นเมตร ต้องคูณ $\\rho g$" }
    hints:
      - "$p = \\rho gh$"
      - "$1000 \\times 9.81 \\times 18$ Pa"
    solution: "$p = 1000(9.81)(18) = 176\\,580\\ \\mathrm{Pa} = 176.6\\ \\mathrm{kPa}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.fluids.fluid-mechanics.p004
    topics: [engineering.fluids.fluid-mechanics]
    difficulty: 2
    type: numeric
    stem: "มาโนมิเตอร์ปรอทรูปตัว U ต่อระหว่างสองจุดบนท่อน้ำแนวราบ ระดับปรอทสองข้างต่างกัน $0.2\\ \\mathrm{m}$ ($\\rho_{\\text{ปรอท}} = 13\\,600$, $\\rho_{\\text{น้ำ}} = 1000\\ \\mathrm{kg/m^3}$) ผลต่างความดันระหว่างสองจุดเป็นกี่กิโลพาสคัล (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 24.72, tolerance: 0.25, unit: kPa }
    misconceptions:
      - { match: 26.68, feedback: "ใช้ $\\rho_{\\text{ปรอท}}gh$ อย่างเดียว ลืมว่าน้ำในขาอีกข้างก็สูง $0.2\\ \\mathrm{m}$ เช่นกัน" }
      - { match: 1.96, feedback: "ใช้ความหนาแน่นของน้ำ ของเหลวในมาโนมิเตอร์คือปรอท" }
    hints:
      - "เดินจากจุด 1 ลงไปตามขาซ้าย ข้ามปรอท แล้วขึ้นขาขวาถึงจุด 2"
      - "$p_1 - p_2 = (\\rho_{\\text{ปรอท}} - \\rho_{\\text{น้ำ}})g\\,\\Delta h$"
    solution: "$p_1 - p_2 = (13\\,600 - 1000)(9.81)(0.2) = 24\\,721\\ \\mathrm{Pa} = 24.72\\ \\mathrm{kPa}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.fluids.fluid-mechanics.p005
    topics: [engineering.fluids.fluid-mechanics]
    difficulty: 2
    type: numeric
    stem: "ลิฟต์ยกรถในอู่ซ่อมรถมีลูกสูบใหญ่เส้นผ่านศูนย์กลาง $0.3\\ \\mathrm{m}$ ยกรถหนัก $15\\ \\mathrm{kN}$ ลูกสูบเล็กเส้นผ่านศูนย์กลาง $0.03\\ \\mathrm{m}$ ต้องออกแรงที่ลูกสูบเล็กกี่นิวตัน (ไม่คิดความสูงต่างและแรงเสียดทาน)"
    answer: { value: 150, tolerance: 1.5, unit: N }
    misconceptions:
      - { match: 1500, feedback: "ใช้อัตราส่วนเส้นผ่านศูนย์กลาง แรงแปรตามพื้นที่ คืออัตราส่วนกำลังสอง" }
      - { match: 15000, feedback: "ความดันเท่ากันทั้งระบบ ไม่ใช่แรงเท่ากัน" }
    hints:
      - "หลักของปาสกาล: $F_1/A_1 = F_2/A_2$"
      - "$A_1/A_2 = (d_1/d_2)^2$"
    solution: "$F_1 = 15\\,000 \\times (0.03/0.3)^2 = 15\\,000 \\times 0.01 = 150\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.fluids.fluid-mechanics.p006
    topics: [engineering.fluids.fluid-mechanics]
    difficulty: 3
    type: numeric
    stem: "ประตูน้ำสี่เหลี่ยมแนวดิ่งในภาพกว้าง $2\\ \\mathrm{m}$ สูง $1.5\\ \\mathrm{m}$ ขอบบนอยู่ลึก $2\\ \\mathrm{m}$ จากผิวน้ำ แรงลัพธ์จากน้ำเป็นกี่กิโลนิวตัน ($\\rho g = 9810\\ \\mathrm{N/m^3}$ ทศนิยม 1 ตำแหน่ง)"
    figure: { src: p-gate.svg, alt: "ประตูสี่เหลี่ยมแนวดิ่งในผนังกั้นน้ำ ขอบบนของประตูอยู่ลึก 2 เมตรจากผิวน้ำ ประตูสูง 1.5 เมตร กว้าง 2 เมตร น้ำอยู่ด้านซ้ายของผนัง" }
    answer: { value: 80.9, tolerance: 0.8, unit: kN }
    misconceptions:
      - { match: 58.9, feedback: "ใช้ความลึกของขอบบน ($2\\ \\mathrm{m}$) ต้องใช้ความลึกของเซนทรอยด์ $2.75\\ \\mathrm{m}$" }
      - { match: 103, feedback: "ใช้ความลึกของขอบล่าง ($3.5\\ \\mathrm{m}$) ต้องใช้ความลึกของเซนทรอยด์" }
    hints:
      - "$F_R = \\rho gh_cA$"
      - "$h_c = 2 + 1.5/2$"
    solution: "$F_R = 9810(2.75)(2 \\times 1.5) = 80\\,933\\ \\mathrm{N} = 80.9\\ \\mathrm{kN}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.fluids.fluid-mechanics.p007
    topics: [engineering.fluids.fluid-mechanics]
    difficulty: 3
    type: numeric
    stem: "ประตูในภาพเดิม (กว้าง $2\\ \\mathrm{m}$ สูง $1.5\\ \\mathrm{m}$ ขอบบนลึก $2\\ \\mathrm{m}$) แรงลัพธ์กระทำที่ความลึกเท่าใด (เมตร ทศนิยม 3 ตำแหน่ง)"
    figure: { src: p-gate.svg, alt: "ประตูสี่เหลี่ยมแนวดิ่งในผนังกั้นน้ำ ขอบบนของประตูอยู่ลึก 2 เมตรจากผิวน้ำ ประตูสูง 1.5 เมตร กว้าง 2 เมตร น้ำอยู่ด้านซ้ายของผนัง" }
    answer: { value: 2.818, tolerance: 0.005, unit: m }
    misconceptions:
      - { match: 2.75, feedback: "นี่คือเซนทรอยด์ของประตู ความดันข้างล่างมากกว่า แรงลัพธ์จึงอยู่ลึกกว่า" }
      - { match: 2.333, feedback: "ใช้ $2/3$ ของความลึกถึงขอบล่าง ซึ่งถูกเฉพาะเมื่อประตูเริ่มจากผิวน้ำ" }
    hints:
      - "$y_p = y_c + \\bar I_x/(y_cA)$"
      - "$\\bar I_x = bh^3/12 = 2(1.5)^3/12$"
    solution: "$\\bar I_x = 0.5625\\ \\mathrm{m^4}$ ได้ $y_p = 2.75 + \\dfrac{0.5625}{2.75 \\times 3} = 2.75 + 0.068 = 2.818\\ \\mathrm{m}$ (ตรวจด้วย $\\int p\\,y\\,dA/F_R$ ได้ค่าเดียวกัน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.fluids.fluid-mechanics.p008
    topics: [engineering.fluids.fluid-mechanics]
    difficulty: 3
    type: numeric
    stem: "น้ำมันหล่อลื่น ($\\nu = 1.0 \\times 10^{-4}\\ \\mathrm{m^2/s}$) ไหลในท่อเส้นผ่านศูนย์กลาง $50\\ \\mathrm{mm}$ ยาว $20\\ \\mathrm{m}$ ด้วยความเร็วเฉลี่ย $1\\ \\mathrm{m/s}$ การสูญเสียเฮดจากแรงเสียดทานเป็นกี่เมตร (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 2.61, tolerance: 0.03, unit: m }
    misconceptions:
      - { match: 1.36, feedback: "ใช้สูตรของการไหลปั่นป่วน (บลาเซียส) แต่ $Re = 500$ เป็นการไหลราบเรียบ ต้องใช้ $f = 64/Re$" }
      - { match: 0.41, feedback: "สมมติ $f = 0.02$ แบบท่อน้ำทั่วไป ของไหลหนืดมากทำให้ $f$ สูงกว่านั้นมาก" }
    hints:
      - "$Re = VD/\\nu$"
      - "ราบเรียบ: $f = 64/Re$ แล้วใช้ดาร์ซี–ไวส์บัค"
    solution: "$Re = 1(0.05)/10^{-4} = 500$ (ราบเรียบ) $f = 64/500 = 0.128$ ได้ $h_f = 0.128 \\times \\dfrac{20}{0.05} \\times \\dfrac{1^2}{2(9.81)} = 2.61\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.fluids.fluid-mechanics.p009
    topics: [engineering.fluids.fluid-mechanics]
    difficulty: 3
    type: numeric
    stem: "สายดับเพลิงฉีดน้ำ $10\\ \\mathrm{L/s}$ ด้วยความเร็ว $30\\ \\mathrm{m/s}$ ตั้งฉากกับผนัง น้ำกระจายออกขนานกับผนัง ผนังรับแรงกี่นิวตัน"
    answer: { value: 300, tolerance: 3, unit: N }
    misconceptions:
      - { match: 9000, feedback: "ใช้ $\\rho QV^2$ แรงคืออัตราการไหลของโมเมนตัม $\\dot mV = \\rho QV$" }
      - { match: 150, feedback: "คิดเป็นพลังงานจลน์ ($\\tfrac12\\dot mV$) แรงมาจากการเปลี่ยนโมเมนตัม" }
    hints:
      - "$\\dot m = \\rho Q = 10\\ \\mathrm{kg/s}$"
      - "โมเมนตัมแนวตั้งฉากกับผนังหายไปหมด"
    solution: "$F = \\dot m(V_{\\text{เข้า}} - 0) = 10 \\times 30 = 300\\ \\mathrm{N}$ ผู้ถือสายก็ต้องรับแรงต้านเท่านี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.fluids.fluid-mechanics.p010
    topics: [engineering.fluids.fluid-mechanics]
    difficulty: 4
    type: numeric
    stem: "ท่อประปาหมู่บ้านทำจาก PVC ($\\varepsilon = 0.0015\\ \\mathrm{mm}$) เส้นผ่านศูนย์กลาง $150\\ \\mathrm{mm}$ ยาว $500\\ \\mathrm{m}$ ส่งน้ำ $30\\ \\mathrm{L/s}$ ($\\nu = 1.0 \\times 10^{-6}\\ \\mathrm{m^2/s}$) ใช้สูตรสวามี–เชนหา $f$ แล้วหาการสูญเสียเฮดหลักเป็นเมตร (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 7.31, tolerance: 0.08, unit: m }
    misconceptions:
      - { match: 0.12, feedback: "ใช้ $f = 64/Re$ ซึ่งใช้ได้กับการไหลราบเรียบเท่านั้น แต่ $Re = 2.5 \\times 10^5$" }
      - { match: 143.5, feedback: "ลืมหารด้วย $2g$ ใน $V^2/(2g)$" }
    hints:
      - "$V = Q/A = 1.70\\ \\mathrm{m/s}$, $Re = 2.55 \\times 10^5$"
      - "$f = 0.25/[\\log_{10}(\\varepsilon/3.7D + 5.74/Re^{0.9})]^2$"
    solution: "$f = 0.0149$ (คอลบรูกได้ $0.0150$) $h_f = 0.0149 \\times \\dfrac{500}{0.15} \\times \\dfrac{1.70^2}{2(9.81)} = 7.31\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.fluids.fluid-mechanics.p011
    topics: [engineering.fluids.fluid-mechanics]
    difficulty: 4
    type: numeric
    stem: "ชาวนาสูบน้ำจากคลองขึ้นถังพักที่ผิวน้ำสูงกว่าผิวน้ำในคลอง $8\\ \\mathrm{m}$ (ค่าสมมติ) อัตรา $20\\ \\mathrm{L/s}$ ท่อเส้นผ่านศูนย์กลาง $0.1\\ \\mathrm{m}$ ยาว $80\\ \\mathrm{m}$ $f = 0.02$ และ $\\sum K = 3.5$ (รวมทางเข้าและทางออก) ปั๊มมีประสิทธิภาพ 65% ต้องใช้กำลังเพลากี่กิโลวัตต์ (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 4.36, tolerance: 0.05, unit: kW }
    misconceptions:
      - { match: 2.83, feedback: "นี่คือกำลังที่น้ำได้รับ ต้องหารด้วยประสิทธิภาพ 0.65" }
      - { match: 2.41, feedback: "ไม่คิดการสูญเสียในท่อ ซึ่งมากถึง $6.4\\ \\mathrm{m}$ เกือบเท่าความสูงที่ยก" }
    hints:
      - "$V = 2.55\\ \\mathrm{m/s}$ และ $h_L = (fL/D + \\sum K)V^2/2g$"
      - "$h_{\\text{ปั๊ม}} = 8 + h_L$ แล้ว $P = \\rho gQh/\\eta$"
    solution: "$V^2/2g = 0.331\\ \\mathrm{m}$ $h_L = (16 + 3.5)(0.331) = 6.44\\ \\mathrm{m}$ $h_{\\text{ปั๊ม}} = 14.44\\ \\mathrm{m}$ ได้ $P = \\dfrac{1000(9.81)(0.02)(14.44)}{0.65} = 4.36\\ \\mathrm{kW}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.fluids.fluid-mechanics.p012
    topics: [engineering.fluids.fluid-mechanics]
    difficulty: 4
    type: numeric
    stem: "ข้องอ $90^\\circ$ ในแนวราบของท่อเส้นผ่านศูนย์กลาง $0.2\\ \\mathrm{m}$ มีน้ำไหล $0.1\\ \\mathrm{m^3/s}$ ความดันเกจ $150\\ \\mathrm{kPa}$ ทั้งขาเข้าและขาออก (ไม่คิดการสูญเสีย) แท่นยึดต้องรับแรงลัพธ์ขนาดกี่กิโลนิวตัน (ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 7.11, tolerance: 0.07, unit: kN }
    misconceptions:
      - { match: 6.66, feedback: "คิดเฉพาะแรงดัน ลืมการเปลี่ยนทิศของโมเมนตัม $\\rho QV$" }
      - { match: 5.03, feedback: "นี่คือองค์ประกอบเดียว ข้องอได้แรงสองแกนเท่ากัน แรงลัพธ์คูณ $\\sqrt2$" }
    hints:
      - "$V = 3.18\\ \\mathrm{m/s}$, $pA = 4712\\ \\mathrm{N}$, $\\rho QV = 318\\ \\mathrm{N}$"
      - "แต่ละแกน: แรงจากข้อต่อ $= pA + \\rho QV$"
    solution: "แกนขาเข้า: $F_x = -(p_1A + \\rho QV) = -5031\\ \\mathrm{N}$ แกนขาออก: $F_y = p_2A + \\rho QV = 5031\\ \\mathrm{N}$ ขนาดลัพธ์ $\\sqrt2 \\times 5031 = 7.11\\ \\mathrm{kN}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.fluids.fluid-mechanics.p013
    topics: [engineering.fluids.fluid-mechanics]
    difficulty: 4
    type: numeric
    stem: "แบบจำลองทางระบายน้ำล้นของเขื่อนย่อส่วน 1 : 25 ใช้ความคล้ายแบบฟรูด อัตราการไหลในแบบจำลอง $0.02\\ \\mathrm{m^3/s}$ สอดคล้องกับอัตราการไหลของเขื่อนจริงกี่ลูกบาศก์เมตรต่อวินาที"
    answer: { value: 62.5, tolerance: 0.6, unit: "m³/s" }
    misconceptions:
      - { match: 12.5, feedback: "ใช้อัตราส่วนพื้นที่ $L_r^2$ อย่างเดียว ความเร็วก็เพิ่ม $\\sqrt{L_r}$ ด้วย" }
      - { match: 312.5, feedback: "ใช้ $L_r^3$ (อัตราส่วนปริมาตร) อัตราการไหลคือปริมาตรต่อเวลา และเวลาก็ขยาย $\\sqrt{L_r}$" }
    hints:
      - "ฟรูดเท่ากัน: $V_p/V_m = \\sqrt{L_r}$"
      - "$Q = VA$ ได้ $Q_p/Q_m = L_r^{5/2}$"
    solution: "$Q_p = 0.02 \\times 25^{2.5} = 0.02 \\times 3125 = 62.5\\ \\mathrm{m^3/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.fluids.fluid-mechanics.p014
    topics: [engineering.fluids.fluid-mechanics]
    difficulty: 5
    type: numeric
    stem: "ประตูสี่เหลี่ยมในภาพกว้าง $1.2\\ \\mathrm{m}$ สูง $2\\ \\mathrm{m}$ มีบานพับที่ขอบบนซึ่งลึก $1\\ \\mathrm{m}$ จากผิวน้ำ ต้องใช้แรงแนวราบ $F$ ที่ขอบล่างอย่างน้อยกี่กิโลนิวตันเพื่อกันประตูไม่ให้เปิด ($\\rho g = 9810\\ \\mathrm{N/m^3}$ ทศนิยม 2 ตำแหน่ง)"
