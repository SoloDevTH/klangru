  - { framework: th-core-2560-math-additional, indicators: ["ค เพิ่มเติม 2.1 ม.4/1"], coverage: full, note: "ระยะทาง จุดกึ่งกลาง จุดแบ่ง ระยะจากจุดถึงเส้นตรง วงกลม พาราโบลา วงรี ไฮเพอร์โบลา และโจทย์ปัญหา (จานรับสัญญาณ แปลงดอกไม้รูปวงรี ซุ้มประตูพาราโบลา ระยะจากโรงเรียนถึงถนน)" }
  - { framework: uk-nc-mathematics, indicators: ["UKNC-MA-KS4-A-10"], coverage: full, note: "สมการวงกลมจุดศูนย์กลางที่จุดกำเนิด และเส้นสัมผัสที่จุดบนวงกลม (ตั้งฉากกับรัศมี x₀x + y₀y = r²)" }
  - { framework: us-ccss-math, indicators: ["G-GPE.1", "G-GPE.2", "G-GPE.6", "G-GPE.7"], coverage: full, note: "สร้างสมการวงกลมจากพีทาโกรัสและทำกำลังสองสมบูรณ์ สร้างสมการพาราโบลาจากโฟกัสและไดเรกตริกซ์ จุดแบ่งส่วนของเส้นตรงในอัตราส่วน m : n เส้นรอบรูปและพื้นที่สามเหลี่ยมจากพิกัด" }
  - { framework: us-ccss-math, indicators: ["G-GPE.3"], coverage: partial, note: "ให้นิยามวงรี (ผลบวกระยะคงที่) และไฮเพอร์โบลา (ผลต่างระยะคงที่) พร้อมสมการและความสัมพันธ์ b² = a² − c², c² = a² + b² และโจทย์หาสมการวงรีจากโฟกัส แต่ไม่ได้แสดงการจัดรูปพีชคณิตจากนิยามจนได้สมการเต็มขั้นเหมือนพาราโบลา" }
