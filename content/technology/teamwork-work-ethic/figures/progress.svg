<text x="390.0" y="344" text-anchor="middle" font-size="14" fill="#111827">สมาชิก C</text>
<rect x="465" y="228.0" width="70" height="92.0" fill="#bbf7d0" stroke="#334155" stroke-width="1.5"/>
<text x="500.0" y="220.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">40%</text>
<text x="500.0" y="344" text-anchor="middle" font-size="14" fill="#111827">สมาชิก D</text>
<text x="310.0" y="374" text-anchor="middle" font-size="14" fill="#374151">ข้อมูลจากการตรวจความคืบหน้าของกลุ่มในวันเดียวกัน</text>
