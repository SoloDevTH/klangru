  - id: mgt.qc.p022
    topics: [management.quality.qc-tools]
    difficulty: 5
    type: numeric
    stem: "ของเสียกระทะ 250 ใบมีต้นทุนต่อใบไม่เท่ากัน รอยขีดข่วน 110 ใบ (ขัดใหม่ใบละ 20 บาท) บุบ 65 ใบ (ทิ้งใบละ 150 บาท) สีด่าง 35 ใบ (พ่นสีใหม่ใบละ 60 บาท) ฉลากเบี้ยว 25 ใบ (ติดใหม่ใบละ 10 บาท) อื่น ๆ 15 ใบ (ใบละ 40 บาท) ถ้าทำแผนภูมิพาเรโตตาม **ต้นทุน** แทนจำนวนใบ ของเสียประเภท 'บุบ' คิดเป็นร้อยละเท่าใดของต้นทุนของเสียทั้งหมด (ตอบเป็นตัวเลขในหน่วย % ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 65.4, tolerance: 0.1, unit: "%" }
    hints:
      - "หาต้นทุนของแต่ละประเภท = จำนวนใบ × ต้นทุนต่อใบ"
      - "รวมต้นทุนทุกประเภท แล้วหาว่า 'บุบ' เป็นสัดส่วนเท่าใด"
    misconceptions:
      - { match: 26, feedback: "นั่นคือร้อยละตามจำนวนใบ ($65 \\div 250$) โจทย์ให้คิดตามต้นทุน" }
      - { match: 9750, feedback: "นั่นคือต้นทุนของ 'บุบ' เป็นบาท ต้องหารด้วยต้นทุนรวมแล้วคูณ 100" }
    solution: "ต้นทุน: ขีดข่วน $110 \\times 20 = 2{,}200$ บุบ $65 \\times 150 = 9{,}750$ สีด่าง $35 \\times 60 = 2{,}100$ ฉลาก $25 \\times 10 = 250$ อื่น ๆ $15 \\times 40 = 600$ รวม $14{,}900$ บาท สัดส่วนบุบ $\\dfrac{9{,}750}{14{,}900} \\times 100 \\approx 65.4\\%$ ตามต้นทุน 'บุบ' จึงขึ้นมาเป็นอันดับหนึ่ง แม้ตามจำนวนใบจะเป็นอันดับสอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p023
    topics: [management.quality.qc-tools]
    difficulty: 4
    type: mcq
    stem: "ฮิสโทแกรมความหนาของแผ่นไม้อัดจากโรงงานแห่งหนึ่งมีสองยอดชัดเจน ยอดหนึ่งราว 9.8 mm อีกยอดราว 10.3 mm ทั้งที่ควรมียอดเดียวที่ 10.0 mm ขั้นต่อไปที่เหมาะที่สุดคืออะไร"
    choices:
      - { id: a, text: "แบ่งชั้นข้อมูลตามเครื่องจักร กะ หรือล็อตวัตถุดิบ เพื่อดูว่าข้อมูลสองกลุ่มมาจากแหล่งใด", correct: true }
      - { id: b, text: "เฉลี่ยข้อมูลทั้งหมดได้ใกล้ 10.0 mm จึงถือว่าไม่มีปัญหา", feedback: "ค่าเฉลี่ยรวมอาจใกล้ 10.0 mm แต่แผ่นไม้จริงแทบไม่มีแผ่นที่หนา 10.0 mm เลย รูปร่างสองยอดบอกว่ามีสองกลุ่มปนกัน" }
      - { id: c, text: "เพิ่มจำนวนชั้นของฮิสโทแกรมจนยอดหายไป", feedback: "การเปลี่ยนความกว้างชั้นไม่ได้เปลี่ยนความจริงว่าข้อมูลมาจากสองแหล่ง" }
      - { id: d, text: "สรุปว่าเครื่องวัดเสีย แล้วทิ้งข้อมูลชุดนี้", feedback: "ยังไม่มีหลักฐานว่าเครื่องวัดเสีย สาเหตุที่พบบ่อยกว่าคือมีสองเครื่องจักรหรือสองล็อตที่ตั้งค่าต่างกัน" }
    hints:
      - "ฮิสโทแกรมสองยอดมักแปลว่าข้อมูลมาจากกี่กลุ่ม"
      - "เครื่องมือใดช่วยแยกข้อมูลตามแหล่งที่มา"
    solution: "ฮิสโทแกรมสองยอดมักแปลว่ามีข้อมูลสองกลุ่มปนกัน เช่น สองเครื่องจักรที่ตั้งค่าต่างกัน ขั้นต่อไปคือแบ่งชั้นข้อมูลตามแหล่งที่มา แล้วปรับกลุ่มที่เบี้ยวจากเป้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p024
    topics: [management.quality.qc-tools]
    difficulty: 3
    type: expression
    stem: "แผนภูมิ $\\bar{x}$ พลอตค่าเฉลี่ยของตัวอย่างกลุ่มละ $n$ ชิ้น ถ้าค่าเดี่ยวมีค่าเฉลี่ย $m$ และส่วนเบี่ยงเบนมาตรฐาน $s$ เขียนสูตรเส้นควบคุมบน (UCL) ในรูปของ $m$, $s$ และ $n$"
    prefix: "UCL ="
    answer: { latex: "m+\\frac{3s}{\\sqrt{n}}", variables: [m, s, n] }
    misconceptions:
      - { match: "m+3s", feedback: "นั่นคือเส้นควบคุมของค่าเดี่ยว ค่าเฉลี่ยของ $n$ ชิ้นผันแปรน้อยกว่า ต้องหาร $s$ ด้วย $\\sqrt{n}$" }
      - { match: "m+\\frac{3s}{n}", feedback: "ส่วนเบี่ยงเบนมาตรฐานของค่าเฉลี่ยคือ $s/\\sqrt{n}$ ไม่ใช่ $s/n$" }
    hints:
      - "ส่วนเบี่ยงเบนมาตรฐานของค่าเฉลี่ยกลุ่มละ $n$ ชิ้นเป็นเท่าใด"
      - "UCL = เส้นกลาง + 3 × ส่วนเบี่ยงเบนมาตรฐานของสิ่งที่พลอต"
    solution: "สิ่งที่พลอตคือค่าเฉลี่ย ซึ่งมีส่วนเบี่ยงเบนมาตรฐาน $\\dfrac{s}{\\sqrt{n}}$ ดังนั้น $\\text{UCL} = m + \\dfrac{3s}{\\sqrt{n}}$"
    license: CC-BY-SA-4.0
    ai_assisted: true
