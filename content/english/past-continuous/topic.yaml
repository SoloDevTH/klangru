id: english.grammar.past-continuous
subject: english
title: { th: "Past continuous และการเล่าเหตุการณ์", en: "Past continuous and telling stories" }
summary: was/were + V-ing บอกสิ่งที่กำลังทำในอดีต ใช้คู่กับ past simple ด้วย when และ while และเล่าเรื่องในอดีตเป็นลำดับพร้อมความรู้สึกและเหตุผล
difficulty: 3.5
minutes: 40
prerequisites: [english.grammar.past-simple, english.grammar.present-continuous]
encompasses:
  - { id: english.grammar.past-simple, weight: 0.4 }
  - { id: english.grammar.present-continuous, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: timelines.svg
    alt: "เส้นเวลาสองแบบ แบบที่ 1 แถบยาวจาก 6:00 ถึง 7:00 p.m. เขียนว่า I was cooking มีกากบาทสีแดงที่ 6:30 เขียนว่า the phone rang ใต้ภาพเขียน I was cooking when the phone rang. แบบที่ 2 แถบสองแถบยาวเท่ากันซ้อนในช่วงเวลาเดียวกัน Mum was reading และ Dad was washing the dishes ใต้ภาพเขียน Mum was reading while Dad was washing the dishes."
    caption: "การกระทำยาว (แถบ) กับเหตุการณ์สั้น (กากบาท)"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.grammar.past-continuous.p009, prompt: "หลัง while ใช้กริยารูปไหน" }
  - type: figure
    src: last-night-table.svg
    alt: "ตาราง Last night: What were they doing? คอลัมน์ Name, 7:00 – 8:00 p.m., 8:00 – 9:00 p.m. Grandma: watching TV, sleeping. Dad: cooking dinner, washing the dishes. Mum: reading the news, talking on the phone. Mook: doing her homework, playing the guitar. Ben: playing football, taking a shower."
    caption: "เมื่อคืนนี้ แต่ละคนกำลังทำอะไร ใช้ในตัวอย่างและโจทย์"
  - type: worked-example
    title: เล่าเหตุการณ์ไฟดับจากตาราง
    problem: "เมื่อคืนไฟดับตอน 8:30 p.m. ใช้ตารางเขียนสองประโยคว่า Dad และ Mook กำลังทำอะไรตอนไฟดับ แล้วบอกความรู้สึกของ Mook พร้อมเหตุผล"
    steps:
      - text: "หาคอลัมน์ 8:00 – 9:00 p.m.: Dad washing the dishes, Mook playing the guitar"
      - text: "การกระทำยาวใช้ past continuous ไฟดับเป็นเหตุการณ์สั้นใช้ past simple: *Dad was washing the dishes when the lights went out.*"
        why: "Dad = he ใช้ was"
      - text: "ใช้ while ขึ้นต้นประโยคและใส่จุลภาค: *While Mook was playing the guitar, the lights went out.*"
      - text: "บอกความรู้สึกและเหตุผล: *She felt a bit scared because it was very dark.*"
    answer: "*Dad was washing the dishes when the lights went out. While Mook was playing the guitar, the lights went out. She felt a bit scared because it was very dark.*"
  - { type: check, problem: english.grammar.past-continuous.p012, prompt: "Were you ...? ตอบสั้นอย่างไร" }
glossary:
  - { term: past continuous, definition: "was/were + V-ing บอกสิ่งที่กำลังทำอยู่ ณ เวลาหนึ่งในอดีต (บางตำราเรียก past progressive)" }
  - { term: when, definition: "เมื่อ มักตามด้วยเหตุการณ์สั้นใน past simple" }
  - { term: while, definition: "ขณะที่ มักตามด้วยการกระทำที่ยาวใน past continuous" }
  - { term: stative verb, definition: "กริยาบอกสภาวะ เช่น know, like, want ไม่ใช้รูป -ing" }
  - { term: background, definition: "ฉากของเรื่อง บอกว่าตอนนั้นอะไรกำลังเกิดขึ้น" }
flashcards:
  - { front: "โครงสร้าง past continuous", back: "was/were + V-ing" }
  - { front: "I / she / it ใช้ ... · you / we / they ใช้ ...", back: "was · were" }
  - { front: "กำลังทำอาหารตอนโทรศัพท์ดัง", back: "I was cooking when the phone rang." }
  - { front: "Were you sleeping? (ตอบปฏิเสธ)", back: "No, I wasn't." }
  - { front: "when vs while", back: "when + เหตุการณ์สั้น · while + การกระทำที่ยาว" }
