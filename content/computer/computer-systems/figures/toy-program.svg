<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif" font-size="14">
  <title>โปรแกรมในหน่วยความจำของคอมพิวเตอร์จำลอง</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
  <text x="320.0" y="26.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">หน่วยความจำของคอมพิวเตอร์จำลอง</text>
  <text x="90.0" y="56.0" font-size="13" text-anchor="middle" fill="#6b7280">ที่อยู่</text>
  <text x="230.0" y="56.0" font-size="13" text-anchor="middle" fill="#6b7280">สิ่งที่เก็บ</text>
  <rect x="40.0" y="66.0" width="100.0" height="30.0" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="140.0" y="66.0" width="180.0" height="30.0" rx="0" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="90.0" y="87.0" font-size="14" text-anchor="middle" fill="#1f2937">0</text>
  <text x="230.0" y="87.0" font-size="14" text-anchor="middle" fill="#1f2937">LOAD 5</text>
  <rect x="40.0" y="96.0" width="100.0" height="30.0" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="140.0" y="96.0" width="180.0" height="30.0" rx="0" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="90.0" y="117.0" font-size="14" text-anchor="middle" fill="#1f2937">1</text>
  <text x="230.0" y="117.0" font-size="14" text-anchor="middle" fill="#1f2937">ADD 6</text>
  <rect x="40.0" y="126.0" width="100.0" height="30.0" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="140.0" y="126.0" width="180.0" height="30.0" rx="0" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="90.0" y="147.0" font-size="14" text-anchor="middle" fill="#1f2937">2</text>
  <text x="230.0" y="147.0" font-size="14" text-anchor="middle" fill="#1f2937">STORE 7</text>
  <rect x="40.0" y="156.0" width="100.0" height="30.0" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="140.0" y="156.0" width="180.0" height="30.0" rx="0" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="90.0" y="177.0" font-size="14" text-anchor="middle" fill="#1f2937">3</text>
  <text x="230.0" y="177.0" font-size="14" text-anchor="middle" fill="#1f2937">HALT</text>
  <rect x="40.0" y="186.0" width="100.0" height="30.0" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="140.0" y="186.0" width="180.0" height="30.0" rx="0" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="90.0" y="207.0" font-size="14" text-anchor="middle" fill="#1f2937">4</text>
  <text x="230.0" y="207.0" font-size="14" text-anchor="middle" fill="#1f2937">0</text>
  <rect x="40.0" y="216.0" width="100.0" height="30.0" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="140.0" y="216.0" width="180.0" height="30.0" rx="0" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="90.0" y="237.0" font-size="14" text-anchor="middle" fill="#1f2937">5</text>
  <text x="230.0" y="237.0" font-size="14" text-anchor="middle" fill="#1f2937">12</text>
  <rect x="40.0" y="246.0" width="100.0" height="30.0" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="140.0" y="246.0" width="180.0" height="30.0" rx="0" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="90.0" y="267.0" font-size="14" text-anchor="middle" fill="#1f2937">6</text>
  <text x="230.0" y="267.0" font-size="14" text-anchor="middle" fill="#1f2937">30</text>
  <rect x="40.0" y="276.0" width="100.0" height="30.0" rx="0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="140.0" y="276.0" width="180.0" height="30.0" rx="0" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="90.0" y="297.0" font-size="14" text-anchor="middle" fill="#1f2937">7</text>
  <text x="230.0" y="297.0" font-size="14" text-anchor="middle" fill="#1f2937">0</text>
  <rect x="345.0" y="66.0" width="280.0" height="230.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="485.0" y="94.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">คำสั่งของเครื่องนี้</text>
  <text x="360.0" y="126.0" font-size="13" text-anchor="start" fill="#1f2937">LOAD a  : ACC ← ค่าในที่อยู่ a</text>
  <text x="360.0" y="156.0" font-size="13" text-anchor="start" fill="#1f2937">ADD a   : ACC ← ACC + ค่าในที่อยู่ a</text>
  <text x="360.0" y="186.0" font-size="13" text-anchor="start" fill="#1f2937">STORE a : ค่าในที่อยู่ a ← ACC</text>
  <text x="360.0" y="216.0" font-size="13" text-anchor="start" fill="#1f2937">HALT    : หยุดทำงาน</text>
  <text x="360.0" y="260.0" font-size="13" text-anchor="start" fill="#6b7280">เริ่มที่ PC = 0 และ ACC = 0</text>
</svg>
