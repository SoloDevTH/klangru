  - topic: chinese.pinyin.tones
    indicators: ["ต 1.1 ป.1/2", "ต 1.1 ป.2/2", "ต 2.2 ป.1/1", "ต 2.2 ป.2/1"]
    coverage: partial
    note: "สำหรับภาษาจีน พินอินทำหน้าที่ตัวอักษรและเสียง หัวข้อสอนวรรณยุกต์ การวางเครื่องหมาย และเทียบพยัญชนะต้นกับเสียงวรรณยุกต์กับภาษาไทย ยังไม่สอนสระ (韵母) ครบ และไม่ได้ฝึกอ่านออกเสียงประโยค"
  - topic: chinese.hanzi.numbers
    indicators: ["ต 1.3 ป.1/1", "ต 1.3 ป.2/1", "ต 1.3 ป.3/1", "ต 1.3 ป.4/1"]
