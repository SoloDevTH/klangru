  <text x="740.0" y="67.9" font-size="14" text-anchor="middle" fill="#1f2937" font-family="monospace" xml:space="preserve">on_add(...)</text>
  <rect x="650.0" y="110.0" width="180.0" height="46.0" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="740.0" y="137.9" font-size="14" text-anchor="middle" fill="#1f2937" font-family="monospace" xml:space="preserve">on_clear(...)</text>
