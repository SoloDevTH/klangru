problems:
  - id: earthscience.hydrosphere.water-resources.p001
    topics: [earthscience.hydrosphere.water-resources]
    difficulty: 1
    type: match
    stem: "จับคู่แหล่งน้ำกับลักษณะของน้ำในแหล่งนั้น"
    pairs:
      - { left: "ธารน้ำแข็งบนเทือกเขาหิมาลัย", right: "น้ำจืดที่เป็นของแข็ง" }
      - { left: "แม่น้ำเจ้าพระยา", right: "น้ำผิวดินที่เป็นของเหลว" }
      - { left: "น้ำในบ่อบาดาล", right: "น้ำใต้ดินในช่องว่างของชั้นหิน" }
      - { left: "อ่าวไทย", right: "น้ำเค็ม" }
    hints:
      - "ถามตัวเองว่าน้ำอยู่บนผิวดิน ใต้ดิน หรือเป็นน้ำแข็ง"
      - "น้ำทะเลทุกแห่งเป็นน้ำเค็ม"
    solution: "ธารน้ำแข็งเป็นน้ำจืดที่เป็นของแข็ง แม่น้ำเจ้าพระยาเป็นน้ำผิวดินที่เป็นของเหลว น้ำบาดาลอยู่ในช่องว่างของชั้นหินใต้ดิน และอ่าวไทยเป็นน้ำเค็ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-resources.p002
    topics: [earthscience.hydrosphere.water-resources]
    difficulty: 1
    type: mcq
    stem: "ฝนที่ตกลงบนทุ่งหญ้า ส่วนที่จะกลายเป็นน้ำใต้ดินต้องผ่านกระบวนการใดก่อน"
    choices:
      - { id: a, text: "ซึมลงไปในดิน", correct: true }
      - { id: b, text: "ไหลบ่าบนผิวดินลงแม่น้ำ", feedback: "น้ำที่ไหลบ่ากลายเป็นน้ำผิวดิน ไม่ได้ลงไปใต้ดิน" }
      - { id: c, text: "ระเหยกลับขึ้นไปในอากาศ", feedback: "น้ำที่ระเหยกลายเป็นไอน้ำในอากาศ ไม่ได้ลงไปใต้ดิน" }
      - { id: d, text: "ควบแน่นเป็นน้ำค้าง", feedback: "การควบแน่นเปลี่ยนไอน้ำเป็นน้ำ ไม่ได้พาน้ำลงไปใต้ดิน" }
    hints:
      - "น้ำใต้ดินอยู่ใต้ผิวดิน"
      - "น้ำต้องเคลื่อนลงไปตามช่องว่างของดิน"
    solution: "น้ำฝนที่ซึมลงไปตามช่องว่างของดินและหินจะสะสมเป็นน้ำใต้ดิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-resources.p003
    topics: [earthscience.hydrosphere.water-resources]
    difficulty: 2
    type: text
    stem: "ใต้ดิน ด้านบนมีช่องว่างที่มีทั้งอากาศและน้ำ ลึกลงไปช่องว่างเต็มไปด้วยน้ำ รอยต่อระหว่างสองเขตนี้เรียกว่าอะไร"
    accepted: ["ระดับน้ำใต้ดิน", "ระดับน้ำบาดาล", "water table", "watertable"]
    misconceptions:
      - { match: "ชั้นหินกันน้ำ", feedback: "ชั้นหินกันน้ำคือชั้นที่น้ำซึมผ่านยาก เช่น ดินเหนียว ไม่ใช่รอยต่อระหว่างเขตอิ่มอากาศกับเขตอิ่มน้ำ" }
      - { match: "เขตอิ่มน้ำ", feedback: "เขตอิ่มน้ำคือเขตด้านล่างที่ช่องว่างเต็มไปด้วยน้ำ โจทย์ถามชื่อรอยต่อ" }
    hints:
      - "เขตบนคือเขตอิ่มอากาศ เขตล่างคือเขตอิ่มน้ำ"
      - "รอยต่อนี้ขึ้นในฤดูฝนและลดลงในฤดูแล้ง"
    solution: "รอยต่อระหว่างเขตอิ่มอากาศกับเขตอิ่มน้ำคือระดับน้ำใต้ดิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-resources.p004
    topics: [earthscience.hydrosphere.water-resources]
    difficulty: 2
    type: mcq
    stem: "นักเรียนเทน้ำ 200 mL ลงในกรวยที่บรรจุดินสามชนิด ปริมาตรเท่ากัน แล้วรองน้ำที่ไหลออกใน 5 นาที ได้ทราย 150 mL ดินร่วน 90 mL และดินเหนียว 20 mL (ข้อมูลสมมติ) ข้อสรุปใดถูกต้อง"
    choices:
      - { id: a, text: "ทรายให้น้ำซึมผ่านได้ดีที่สุด เหมาะเป็นชั้นหินอุ้มน้ำ ส่วนดินเหนียวน้ำผ่านยาก", correct: true }
      - { id: b, text: "ดินเหนียวมีช่องว่างน้อยที่สุด จึงเก็บน้ำได้น้อยที่สุด", feedback: "ดินเหนียวมีความพรุนสูง แต่ช่องว่างเล็กมาก น้ำจึงไหลผ่านยาก การทดลองนี้วัดความซึมได้ ไม่ได้วัดความพรุน" }
      - { id: c, text: "ทรายเก็บน้ำไว้ได้มากที่สุด เพราะน้ำออกมามาก", feedback: "น้ำไหลออกมามากแปลว่าน้ำผ่านได้ง่าย ทรายเก็บน้ำไว้ในกรวยน้อยกว่าดินชนิดอื่น" }
      - { id: d, text: "ดินทั้งสามชนิดให้น้ำผ่านได้เท่ากัน เพราะเทน้ำเท่ากัน", feedback: "ปริมาณน้ำที่ออกมาต่างกันมาก แสดงว่าดินให้น้ำผ่านได้ต่างกัน" }
    hints:
      - "น้ำที่ไหลออกมามากแปลว่าดินให้น้ำผ่านได้ง่าย"
      - "ชั้นหินอุ้มน้ำต้องให้น้ำไหลผ่านได้ดี"
    solution: "ทรายให้น้ำไหลผ่านได้มากที่สุด (150 mL) จึงมีความซึมได้สูง เหมาะเป็นชั้นหินอุ้มน้ำ ดินเหนียวให้น้ำผ่านเพียง 20 mL จึงเป็นชั้นกันน้ำได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-resources.p005
    topics: [earthscience.hydrosphere.water-resources]
    difficulty: 2
    type: order
    stem: "เรียงลำดับการเกิดน้ำบาดาล"
    items:
      - "ฝนตกลงบนพื้นที่รับน้ำ"
      - "น้ำซึมลงไปในดินชั้นบนผ่านเขตอิ่มอากาศ"
      - "น้ำไหลลงไปเติมช่องว่างในชั้นหินอุ้มน้ำ จนช่องว่างเต็มด้วยน้ำ"
      - "น้ำถูกกั้นไว้ด้วยชั้นหินกันน้ำด้านล่าง แล้วค่อย ๆ ไหลไปตามความลาดของชั้นหิน"
    hints:
      - "เริ่มจากฝน"
      - "น้ำผ่านเขตอิ่มอากาศก่อนถึงเขตอิ่มน้ำ"
    solution: "ฝนตก → ซึมผ่านเขตอิ่มอากาศ → เติมช่องว่างในชั้นหินอุ้มน้ำ (เขตอิ่มน้ำ) → ชั้นหินกันน้ำกั้นไว้ น้ำค่อย ๆ ไหลไปตามชั้นหิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-resources.p006
    topics: [earthscience.hydrosphere.water-resources]
    difficulty: 3
    type: numeric
    stem: "ชั้นทรายอุ้มน้ำแห่งหนึ่งมีพื้นที่ $4\\ \\mathrm{km^2}$ หนา 15 m ความพรุน 0.30 ชั้นนี้เก็บน้ำได้กี่ล้านลูกบาศก์เมตร"
    answer: { value: 18, tolerance: 0.2, unit: "ล้าน m³" }
    misconceptions:
      - { match: 60, feedback: "นี่คือปริมาตรของชั้นทรายทั้งหมด ต้องคูณด้วยความพรุน 0.30 เพราะน้ำอยู่เฉพาะในช่องว่าง" }
      - { match: 1800, feedback: "ความพรุน 0.30 หมายถึง 30% ต้องคูณด้วย 0.30 ไม่ใช่ 30" }
    hints:
      - "$1\\ \\mathrm{km^2} = 10^6\\ \\mathrm{m^2}$"
      - "ปริมาตรน้ำ = พื้นที่ × ความหนา × ความพรุน"
    solution: "ปริมาตรชั้นทราย $= 4 \\times 10^6 \\times 15 = 6 \\times 10^7\\ \\mathrm{m^3}$ น้ำ $= 6 \\times 10^7 \\times 0.30 = 1.8 \\times 10^7\\ \\mathrm{m^3}$ = 18 ล้านลูกบาศก์เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-resources.p007
    topics: [earthscience.hydrosphere.water-resources]
    difficulty: 3
    type: numeric
    stem: "บ้านหลังหนึ่งในจังหวัดขอนแก่นมีหลังคาพื้นที่ $120\\ \\mathrm{m^2}$ ฝนทั้งปีสูง 1,400 mm (ค่าสมมติ) น้ำฝนไหลลงรางได้ 0.8 ของที่ตก บ้านนี้เก็บน้ำฝนได้กี่ลูกบาศก์เมตรต่อปี"
    answer: { value: 134.4, tolerance: 1.3, unit: "m³" }
    misconceptions:
      - { match: 168, feedback: "ลืมคูณสัดส่วน 0.8 น้ำฝนบางส่วนระเหยหรือกระเด็นออกไป ไม่ได้ไหลลงรางทั้งหมด" }
      - { match: 134400, feedback: "ต้องแปลงความสูงของฝนเป็นเมตรก่อน 1,400 mm = 1.4 m" }
    hints:
      - "1,400 mm = 1.4 m"
      - "ปริมาตร = พื้นที่หลังคา × ความสูงของฝน × 0.8"
    solution: "$120 \\times 1.4 \\times 0.8 = 134.4\\ \\mathrm{m^3}$ ต่อปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-resources.p008
    topics: [earthscience.hydrosphere.water-resources]
    difficulty: 3
    type: mcq
    stem: "ภาพตัดแสดงบ่อ A B และ C ในหมู่บ้านเดียวกัน ปลายฤดูแล้งระดับน้ำใต้ดินลดลงต่ำกว่าเส้นในภาพหลายเมตร บ่อใดมีโอกาสมีน้ำใช้ตลอดปีมากที่สุด"
    figure: { src: p-wells.svg, alt: "ภาพตัดพื้นที่ลาดลงจากเนินด้านซ้ายไปหาแม่น้ำด้านขวา ชั้นบนเป็นชั้นทราย มีเส้นประระดับน้ำใต้ดินฤดูฝนอยู่ในชั้นทราย ใต้ชั้นทรายเป็นชั้นดินเหนียว ใต้ดินเหนียวเป็นชั้นทรายและกรวดซึ่งโผล่ถึงผิวดินบนเนินด้านซ้าย ล่างสุดเป็นหินแข็ง บ่อ A ตื้น ก้นบ่ออยู่เหนือเส้นระดับน้ำใต้ดินฤดูฝน บ่อ B ก้นบ่ออยู่ใต้เส้นระดับน้ำใต้ดินเล็กน้อยในชั้นทราย บ่อ C ลึก ทะลุชั้นดินเหนียวลงไปถึงชั้นทรายและกรวดด้านล่าง" }
    choices:
      - { id: a, text: "บ่อ C เพราะเจาะผ่านดินเหนียวลงถึงชั้นหินอุ้มน้ำที่อยู่ลึกและรับน้ำจากเนินที่สูงกว่า", correct: true }
      - { id: b, text: "บ่อ A เพราะอยู่ใกล้พื้นที่รับน้ำที่สุด", feedback: "ก้นบ่อ A อยู่เหนือระดับน้ำใต้ดินแม้ในฤดูฝน จึงแทบไม่มีน้ำ" }
      - { id: c, text: "บ่อ B เพราะก้นบ่ออยู่ใต้ระดับน้ำใต้ดินแล้ว", feedback: "ก้นบ่อ B ต่ำกว่าระดับน้ำฤดูฝนเพียงเล็กน้อย เมื่อระดับน้ำลดลงหลายเมตรในฤดูแล้ง บ่อจะแห้ง" }
      - { id: d, text: "ทุกบ่อมีน้ำเท่ากัน เพราะอยู่ในหมู่บ้านเดียวกัน", feedback: "ปริมาณน้ำในบ่อขึ้นกับว่าก้นบ่ออยู่ในชั้นใดและอยู่ต่ำกว่าระดับน้ำใต้ดินเท่าใด" }
    hints:
      - "บ่อมีน้ำเมื่อก้นบ่ออยู่ต่ำกว่าระดับน้ำใต้ดิน"
      - "ฤดูแล้งระดับน้ำใต้ดินในชั้นทรายบนลดลง ชั้นใต้ดินเหนียวยังได้น้ำจากเนิน"
    solution: "บ่อ A อยู่เหนือระดับน้ำใต้ดิน บ่อ B อยู่ใต้ระดับน้ำเพียงเล็กน้อยจึงแห้งเมื่อระดับน้ำลด บ่อ C เจาะถึงชั้นทรายและกรวดใต้ดินเหนียวซึ่งรับน้ำจากเนินด้านซ้าย จึงมีน้ำตลอดปีมากที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-resources.p009
    topics: [earthscience.hydrosphere.water-resources]
    difficulty: 3
    type: mcq
    stem: "บ่อบาดาลบางบ่อเจาะแล้วน้ำพุ่งขึ้นเหนือพื้นดินเองโดยไม่ต้องสูบ เหตุผลหลักคือข้อใด"
    choices:
      - { id: a, text: "น้ำอยู่ในชั้นหินอุ้มน้ำใต้ชั้นหินกันน้ำ และพื้นที่รับน้ำอยู่สูงกว่าปากบ่อ น้ำจึงมีแรงดัน", correct: true }
      - { id: b, text: "ความร้อนใต้โลกทำให้น้ำเดือดและพุ่งขึ้น", feedback: "บ่อบาดาลพุทั่วไปเป็นน้ำเย็น แรงดันมาจากระดับน้ำในพื้นที่รับน้ำที่สูงกว่า ไม่ใช่ความร้อน" }
      - { id: c, text: "บ่อนั้นเจาะตื้นมากจนถึงระดับน้ำใต้ดินพอดี", feedback: "บ่อตื้นในชั้นที่ไม่มีแรงดัน น้ำจะอยู่ที่ระดับน้ำใต้ดิน ไม่พุ่งขึ้นเหนือพื้น" }
      - { id: d, text: "น้ำในบ่อมาจากแม่น้ำที่อยู่ข้างบ่อ", feedback: "แม่น้ำอยู่ที่ผิวดิน ไม่ทำให้น้ำในชั้นลึกมีแรงดันพุ่งขึ้น" }
    hints:
      - "นึกถึงสายยางที่ต่อจากถังน้ำบนที่สูง"
      - "ชั้นหินกันน้ำด้านบนกักน้ำไว้ไม่ให้ขึ้นมาได้เอง"
    solution: "ชั้นหินอุ้มน้ำที่ถูกปิดด้วยชั้นหินกันน้ำรับน้ำจากพื้นที่สูง น้ำในชั้นนี้จึงมีแรงดัน เมื่อเจาะทะลุชั้นหินกันน้ำ น้ำจึงพุ่งขึ้นได้เอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.hydrosphere.water-resources.p010
    topics: [earthscience.hydrosphere.water-resources]
    difficulty: 3
    type: mcq
    stem: "พื้นที่กรุงเทพฯ และปริมณฑลเคยเกิดแผ่นดินทรุดอย่างรวดเร็ว สาเหตุหลักคือข้อใด"
    choices:
      - { id: a, text: "สูบน้ำบาดาลออกมาจำนวนมาก ชั้นดินเหนียวสูญเสียน้ำและยุบตัว", correct: true }
      - { id: b, text: "น้ำทะเลกัดเซาะพื้นดินจากด้านล่าง", feedback: "การกัดเซาะชายฝั่งทำให้แนวชายฝั่งถอยร่น แต่การทรุดตัวทั่วพื้นที่เกิดจากชั้นดินยุบตัวเมื่อสูญเสียน้ำบาดาล" }
      - { id: c, text: "แผ่นดินไหวบ่อยครั้ง", feedback: "กรุงเทพฯ แทบไม่มีแผ่นดินไหวรุนแรง การทรุดตัวเกิดช้า ๆ ต่อเนื่องหลายปี" }
      - { id: d, text: "ฝนตกมากเกินไปจนดินหนักขึ้น", feedback: "ฝนช่วยเติมน้ำใต้ดิน ไม่ใช่สาเหตุของการทรุดตัว" }
    hints:
      - "เกิดจากกิจกรรมของมนุษย์"
      - "เมื่อน้ำในช่องว่างถูกดึงออก ชั้นดินที่อ่อนจะเกิดอะไรขึ้น"
