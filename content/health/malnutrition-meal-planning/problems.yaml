- id: health.nutrition.malnutrition-meal-planning.p016
  topics:
  - health.nutrition.malnutrition-meal-planning
  difficulty: 5
  type: mcq
  stem: ลูกพี่ลูกน้องอายุ 12 ปีถูกเพื่อนล้อเรื่องรูปร่าง เลยตั้งใจงดมื้อเย็นและขอเงินซื้อยาลดความอ้วนทางออนไลน์ ข้อใดเป็นคำแนะนำที่เหมาะสมที่สุด
  choices:
  - id: a
    text: รับฟังและบอกว่ารูปร่างไม่ได้บอกคุณค่าของคน ไม่ควรอดอาหารหรือใช้ยาลดความอ้วนเอง ชวนบอกผู้ปกครองเพื่อปรึกษาแพทย์หรือนักโภชนาการ ให้ทั้งบ้านลดน้ำหวานและขนม และออกไปเคลื่อนไหวร่างกายด้วยกัน และบอกครูเรื่องการถูกล้อ
    correct: true
  - id: b
    text: ช่วยหาร้านที่ขายยาลดความอ้วนราคาถูก
    feedback: ยาลดความอ้วนที่ขายออนไลน์อาจผิดกฎหมายและมีสารอันตราย และไม่เหมาะกับเด็กที่กำลังเติบโต
  - id: c
    text: แนะนำให้กินมื้อเดียวต่อวันจนกว่าจะผอม
    feedback: การอดอาหารทำให้ขาดสารอาหาร กระทบการเติบโตและอารมณ์ และไม่ใช่วิธีที่ปลอดภัย
  hints:
  - เด็กที่กำลังเติบโตไม่ควรอดอาหารหรือใช้ยาลดน้ำหนักเอง
  - ปัญหานี้มีทั้งเรื่องสุขภาพและเรื่องการถูกล้อ
  solution: คำแนะนำที่ดีดูแลทั้งใจและกาย ไม่ส่งเสริมการอดอาหารหรือใช้ยาเอง ให้บุคลากรสุขภาพประเมินจากกราฟการเจริญเติบโต ปรับพฤติกรรมทั้งครอบครัว และจัดการเรื่องการถูกล้อด้วยการบอกครู
