id: physics.dynamics.newton-second
subject: physics
title: { th: กฎการเคลื่อนที่ข้อที่ 2 ของนิวตัน, en: "Newton's second law" }
summary: แรงลัพธ์ทำให้วัตถุมีความเร่งในทิศเดียวกับแรงลัพธ์ ความเร่งแปรผันตรงกับแรงลัพธ์และแปรผกผันกับมวล ใช้กับวัตถุหลายก้อนที่ผูกติดกันได้
difficulty: 4
minutes: 35
prerequisites: [physics.dynamics.newton-first, physics.kinematics.acceleration, math.algebra.rearrange-formula]
encompasses:
  - { id: physics.dynamics.newton-first, weight: 0.3 }
  - { id: physics.kinematics.acceleration, weight: 0.4 }
  - { id: math.algebra.rearrange-formula, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: ใช้ข้อมูลการทดลองตรวจกฎข้อที่ 2
    problem: "นักเรียนดึงรถทดลองมวล $1\\ \\mathrm{kg}$ และ $2\\ \\mathrm{kg}$ ด้วยแรงลัพธ์ต่าง ๆ แล้ววัดความเร่ง ได้กราฟดังภาพ ข้อมูลนี้สนับสนุน $\\Sigma F = ma$ หรือไม่ และถ้าดึงรถ $2\\ \\mathrm{kg}$ ด้วยแรง $8\\ \\mathrm{N}$ ควรได้ความเร่งเท่าใด"
    figure:
      src: accel-force-two-carts.svg
      alt: "กราฟความเร่ง (m/s²) กับแรงลัพธ์ (N) มีข้อมูลสองชุด รถ 1 kg ได้จุดที่ (1, 0.97), (2, 2.05), (3, 2.96), (4, 4.02), (5, 5.01) รถ 2 kg ได้จุดที่ (1, 0.48), (2, 1.03), (3, 1.47), (4, 2.04), (5, 2.49) แต่ละชุดมีเส้นตรงที่เหมาะสมที่สุดผ่านจุดกำเนิด เส้นของรถ 1 kg ชันเป็นสองเท่าของเส้นรถ 2 kg"
    steps:
      - text: "จุดของแต่ละชุดเรียงเป็นเส้นตรงที่ผ่านจุดกำเนิด แปลว่า $a \\propto \\Sigma F$ เมื่อมวลคงที่"
        why: "ถ้าแรงเป็นศูนย์ ความเร่งต้องเป็นศูนย์ เส้นจึงควรผ่านจุดกำเนิด ถ้าไม่ผ่าน แปลว่ามีแรงอื่นที่ไม่ได้นับ"
      - text: "ความชันของรถ $1\\ \\mathrm{kg}$ ประมาณ $\\dfrac{5.0}{5} = 1.0\\ \\mathrm{(m/s^2)/N}$ ของรถ $2\\ \\mathrm{kg}$ ประมาณ $\\dfrac{2.5}{5} = 0.5$ ตรงกับ $\\dfrac{1}{m}$ ทั้งสองคัน"
      - text: "มวลเพิ่มสองเท่า ความชันลดครึ่ง สอดคล้องกับ $a = \\dfrac{\\Sigma F}{m}$ ข้อมูลจึงสนับสนุนกฎข้อที่ 2"
      - text: "ทำนาย: $a = \\dfrac{8}{2} = 4\\ \\mathrm{m/s^2}$"
    answer: "สนับสนุน และรถ $2\\ \\mathrm{kg}$ ที่ถูกดึงด้วย $8\\ \\mathrm{N}$ ควรมีความเร่งประมาณ $4\\ \\mathrm{m/s^2}$"
  - { type: check, problem: phy.n2.p006, prompt: "มวลเพิ่มสองเท่า ความเร่งเป็นอย่างไร" }
  - type: worked-example
    title: ตาชั่งในลิฟต์ที่กำลังเร่งขึ้น
    problem: "นักเรียนมวล $50\\ \\mathrm{kg}$ ยืนบนตาชั่งในลิฟต์ ขณะลิฟต์เร่งขึ้นด้วยความเร่ง $2\\ \\mathrm{m/s^2}$ ตาชั่งดันเท้าด้วยแรงเท่าใด ($g = 9.8\\ \\mathrm{m/s^2}$)"
    figure:
      src: lift-fbd.svg
      alt: "คนยืนบนตาชั่งในลิฟต์ ลิฟต์มีลูกศรบอกว่าเร่งขึ้น 2 m/s² แผนภาพแรงของคนมีลูกศรสองลูก: แรงจากตาชั่ง N ชี้ขึ้น (ไม่ทราบค่า วาดยาวกว่า) และน้ำหนัก mg = 490 N ชี้ลง"
    steps:
      - text: "แรงที่กระทำต่อคน: น้ำหนัก $mg = 50 \\times 9.8 = 490\\ \\mathrm{N}$ ชี้ลง และแรงจากตาชั่ง $N$ ชี้ขึ้น"
      - text: "ให้ทิศขึ้นเป็นบวก (ทิศของความเร่ง): $\\Sigma F = N - 490 = ma = 50 \\times 2 = 100$"
        why: "คนเร่งขึ้นไปพร้อมลิฟต์ แรงลัพธ์บนตัวคนจึงต้องชี้ขึ้น $N$ ต้องมากกว่าน้ำหนัก"
      - text: "$N = 490 + 100 = 590\\ \\mathrm{N}$ ตาชั่งที่แสดงเป็นกิโลกรัมจะอ่านได้ $\\dfrac{590}{9.8} \\approx 60\\ \\mathrm{kg}$"
    answer: "$590\\ \\mathrm{N}$ มากกว่าน้ำหนัก $490\\ \\mathrm{N}$ จึงรู้สึกตัวหนักขึ้น"
  - { type: check, problem: phy.n2.p005, prompt: "ใช้แรงลัพธ์ ไม่ใช่แรงดึงอย่างเดียว" }
  - type: interactive
    title: ความเร่งเมื่อเปลี่ยนแรงลัพธ์และมวล
    caption: แกนนอนคือแรงลัพธ์ (N) แกนตั้งคือความเร่ง (m/s²) เส้นชันคือวัตถุมวล m และเส้นที่ลาดกว่าคือวัตถุมวล 2m เลื่อนค่า m แล้วสังเกตว่าที่แรงลัพธ์เท่ากัน วัตถุที่มวลมากเป็นสองเท่ามีความเร่งเพียงครึ่งเดียว และกราฟเป็นเส้นตรงผ่านจุดกำเนิดเสมอ
    widget:
      kind: function-plot
      functions: ["\\frac{x}{m}", "\\frac{x}{2m}"]
      sliders:
        - { name: m, min: 1, max: 10, step: 1, value: 2, label: มวล m (kg) }
      x: [0, 20]
      y: [0, 10]
  - type: simulation
    title: ออกแรงผลักแล้วดูความเร่ง (PhET Forces and Motion Basics)
    url: https://phet.colorado.edu/en/simulations/forces-and-motion-basics
    provider: phet
    note: เปิดแท็บ Acceleration ปิดแรงเสียดทาน ออกแรงผลักกล่องค่าเดิมแล้ววางกล่องเพิ่มบนกล่องเดิม ความเร่งจะลดลงเมื่อมวลรวมเพิ่มขึ้น ลองเพิ่มแรงเป็นสองเท่าแล้วดูว่าความเร่งเพิ่มเป็นสองเท่าด้วย
glossary:
  - { term: แรงลัพธ์, definition: "ผลรวมแบบเวกเตอร์ของแรงทั้งหมดที่กระทำต่อวัตถุ เขียนแทนด้วย $\\Sigma F$ หรือ $F_{\\text{net}}$" }
  - { term: มวล, definition: "ปริมาณที่บอกความเฉื่อยของวัตถุ ยิ่งมวลมากยิ่งเปลี่ยนความเร็วยาก หน่วยเป็นกิโลกรัม ($\\mathrm{kg}$)" }
  - { term: นิวตัน (N), definition: "หน่วยของแรง แรง $1\\ \\mathrm{N}$ ทำให้มวล $1\\ \\mathrm{kg}$ มีความเร่ง $1\\ \\mathrm{m/s^2}$ นั่นคือ $1\\ \\mathrm{N} = 1\\ \\mathrm{kg\\cdot m/s^2}$" }
flashcards:
  - { front: "กฎข้อที่ 2 ของนิวตันเขียนเป็นสมการอย่างไร", back: "$\\Sigma F = ma$ แรงลัพธ์เท่ากับมวลคูณความเร่ง และความเร่งมีทิศเดียวกับแรงลัพธ์" }
  - { front: "$1\\ \\mathrm{N}$ เท่ากับหน่วยพื้นฐานใด", back: "$1\\ \\mathrm{kg\\cdot m/s^2}$" }
  - { front: "แรงลัพธ์เท่าเดิม แต่มวลเพิ่มเป็น 2 เท่า ความเร่งเป็นอย่างไร", back: "ลดลงเหลือครึ่งหนึ่ง เพราะ $a = \\dfrac{\\Sigma F}{m}$" }
  - { front: "ดึงวัตถุสองก้อนที่ผูกเชือกกันบนพื้นลื่นด้วยแรง $F$ ความเร่งเป็นเท่าใด", back: "$a = \\dfrac{F}{m_1 + m_2}$ คิดทั้งสองก้อนเป็นวัตถุก้อนเดียว" }
