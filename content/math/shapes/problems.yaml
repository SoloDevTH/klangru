    answer: { value: 360, unit: cm }
    hints:
      - "ไม้ไผ่แต่ละท่อนเป็นสันหนึ่งเส้น ลูกบาศก์มีสันกี่เส้น"
      - "นำจำนวนสันคูณกับความยาวของแต่ละท่อน"
