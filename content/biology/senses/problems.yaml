  - id: biology.animals.senses.p017
    topics: [biology.animals.senses]
    difficulty: 5
    type: numeric
    stem: "จากการทดสอบ จุดบอดอยู่ห่างจากแนวสายตา 15 องศา ถ้าระยะจากจุดศูนย์กลางเชิงแสงของตาถึงเรตินาเท่ากับ 17 mm บนเรตินา จุดบอดอยู่ห่างจากโฟเวียประมาณกี่มิลลิเมตร (ใช้ tan ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 4.56, unit: mm, tolerance: 0.05 }
    misconceptions:
      - { match: 63.44, feedback: "หาร 17 ด้วย tan 15° ผิด ระยะบนเรตินา = 17 × tan 15°" }
      - { match: 4.4, feedback: "ใช้ sin แทน tan ด้านประชิดมุมคือระยะ 17 mm จึงต้องใช้ tan" }
    hints:
      - "แสงจากวัตถุผ่านจุดศูนย์กลางเชิงแสงเป็นเส้นตรง มุมในตาเท่ากับมุมนอกตา"
      - "ระยะบนเรตินา = 17 mm × tan 15°"
    solution: "$17 \\times \\tan 15^\\circ = 17 \\times 0.268 \\approx 4.56$ mm จุดบอดจึงอยู่ห่างโฟเวียราว 4.6 mm ไปทางด้านจมูกของเรตินา"
