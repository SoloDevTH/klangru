  color: "#2a7f62"
- id: chemistry
  title: { th: เคมี, en: Chemistry }
  description: อะตอม ตารางธาตุ พันธะเคมี ปฏิกิริยา และปริมาณสารสัมพันธ์
  color: "#b0367c"
- id: chinese
  title: { th: ภาษาจีน, en: Chinese }
