  - { id: computer.society.digital-economy, title: เศรษฐศาสตร์ของการคำนวณและงานในยุคอัตโนมัติ, difficulty: 4.5, prereq: [computer.society.computing-impacts, computer.society.responsible-ict], indicators: ["acm-cs2023:SEP-Economies", "acm-cs2023:OS-SEP", "csta-k12-cs-2026:MS-SOC-CE-45"], scope: "ต้นทุนการผลิตซ้ำของซอฟต์แวร์ที่เกือบเป็นศูนย์ ผลของเครือข่ายและแพลตฟอร์มสองฝั่ง การผูกขาด การผูกติดผู้ขาย และผู้ชนะกินรวบ โมเดลธุรกิจ (ขายครั้งเดียว สมาชิก โฆษณา ฟรีเมียม) เศรษฐศาสตร์ของโอเพนซอร์สและระบบปฏิบัติการเปิดกับปิด การจ้างภายนอกและงานบนแพลตฟอร์ม ระบบอัตโนมัติสร้างและแทนที่งานและเปลี่ยนวิธีทำงาน ทักษะที่ตลาดต้องการ และนโยบายรองรับแรงงาน" }
