id: chemistry.kinetics.rate-laws
subject: chemistry
title: { th: กฎอัตรา อันดับปฏิกิริยา และกฎอัตราแบบอินทิเกรต, en: Rate laws, reaction orders and integrated rate laws }
summary: หาอันดับปฏิกิริยาและค่าคงที่อัตราจากข้อมูลการทดลอง ใช้กฎอัตราแบบอินทิเกรตของอันดับศูนย์ หนึ่ง และสอง และคำนวณครึ่งชีวิต
difficulty: 7
minutes: 45
prerequisites: [chemistry.kinetics.reaction-rates, math.functions.logarithms]
encompasses:
  - { id: chemistry.kinetics.reaction-rates, weight: 0.4 }
  - { id: math.functions.logarithms, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: หาอันดับและค่าคงที่อัตราจากการทดลองอัตราเริ่มต้น
    problem: "ปฏิกิริยา A + B → ผลิตภัณฑ์ วัดอัตราเริ่มต้นได้ดังนี้ การทดลอง 1: [A] = 0.10 M, [B] = 0.10 M, อัตรา = 2.0 × 10⁻³ M/s การทดลอง 2: [A] = 0.20 M, [B] = 0.10 M, อัตรา = 8.0 × 10⁻³ M/s การทดลอง 3: [A] = 0.10 M, [B] = 0.20 M, อัตรา = 4.0 × 10⁻³ M/s จงหากฎอัตราและค่าคงที่อัตรา"
    steps:
      - text: "เปรียบเทียบการทดลอง 1 กับ 2 เมื่อ [A] เพิ่มเป็นสองเท่า อัตราเพิ่มเป็น 8.0/2.0 = 4 เท่า"
        why: "ใช้อัตราส่วนของอัตราเริ่มต้นเพื่อหาเลขยกกำลังโดยไม่ต้องรู้ค่า k"
      - text: "4 = 2^m จึงได้ m = 2 (อันดับต่อ A คือ 2)"
      - text: "เปรียบเทียบการทดลอง 1 กับ 3 เมื่อ [B] เพิ่มเป็นสองเท่า อัตราเพิ่มเป็น 4.0/2.0 = 2 เท่า จึงได้ 2 = 2^n และ n = 1"
      - text: "กฎอัตราคือ rate = k[A]²[B] ค่า k = rate / ([A]²[B]) = 2.0 × 10⁻³ / (0.10² × 0.10) = 2.0 M⁻²·s⁻¹"
        why: "หน่วยของ k ต้องทำให้หน่วยของอัตราเป็น M/s เมื่อคูณกับความเข้มข้น M²·M"
    answer: "rate = k[A]²[B] โดย k = 2.0 M⁻²·s⁻¹ อันดับรวมเป็น 3"
  - { type: check, problem: chemistry.kinetics.rate-laws.p009, prompt: "อันดับรวมคือผลบวกของเลขยกกำลังทุกสาร" }
  - type: figure
    src: concentration-vs-time.svg
    alt: "กราฟ [A] เทียบกับเวลา t จากศูนย์ถึง 10 วินาที เริ่มที่ 1.0 M เส้นสีน้ำตาลเป็นเส้นตรงลดลงถึงศูนย์ที่ 10 วินาที เส้นสีน้ำเงินทึบโค้งลงเร็วตอนแรกแล้วลดช้าลง เส้นสีม่วงเป็นเส้นประโค้งที่อยู่สูงกว่าเส้นสีน้ำเงินตลอดช่วง"
    caption: "รูปร่างของกราฟ [A] เทียบกับเวลาบอกอันดับได้ แต่กราฟเส้นตรงที่ปรับรูปแล้วให้การระบุอันดับแม่นกว่า"
  - type: figure
    src: linear-plots.svg
    alt: "สามกราฟเส้นตรงเรียงกัน กราฟซ้ายคือ [A] เทียบกับ t เป็นเส้นตรงลาดลง กราฟกลางคือ ln[A] เทียบกับ t เป็นเส้นตรงลาดลง กราฟขวาคือ 1/[A] เทียบกับ t เป็นเส้นตรงลาดขึ้น"
    caption: "เส้นตรงที่เกิดขึ้นบอกอันดับของปฏิกิริยา และความชันให้ค่า k"
  - type: worked-example
    title: ครึ่งชีวิตและเวลาที่เหลือของไฮโดรเจนเปอร์ออกไซด์
    problem: "ไฮโดรเจนเปอร์ออกไซด์ที่เก็บไว้นานจะสลายตัวตามปฏิกิริยาอันดับหนึ่ง มีครึ่งชีวิต 6.00 ชั่วโมง ต้องใช้เวลากี่ชั่วโมงให้เหลือ H₂O₂ ร้อยละ 25 ของปริมาณเดิม"
    steps:
      - text: "อันดับหนึ่งมี t½ = ln 2 / k จึงได้ k = 0.693 / 6.00 = 0.1155 h⁻¹"
        why: "ครึ่งชีวิตของอันดับหนึ่งไม่ขึ้นกับความเข้มข้นเริ่มต้น จึงใช้ค่านี้กับทุกช่วงเวลาได้"
      - text: "เหลือ 25% หมายถึง [A]/[A]₀ = 0.25 ใช้ ln([A]₀/[A]) = kt"
      - text: "ln(4) = 1.386 = 0.1155 × t จึงได้ t = 12.0 ชั่วโมง"
      - text: "ตรวจด้วยครึ่งชีวิต: 25% ต้องผ่านการลดครึ่งสองครั้ง คือ 2 × 6.00 = 12.0 ชั่วโมง"
    answer: "ใช้เวลาประมาณ 12.0 ชั่วโมงจึงเหลือ H₂O₂ ร้อยละ 25"
  - { type: check, problem: chemistry.kinetics.rate-laws.p004, prompt: "ครึ่งชีวิตของอันดับหนึ่งหาจาก ln 2 หารด้วย k" }
  - type: interactive
    title: อันดับหนึ่งลดลงแบบเอ็กซ์โพเนนเชียล
    caption: "ลดค่า k แล้วสังเกตว่าเส้นลดลงช้าลง ค่า k สูงทำให้ [A] หมดเร็วขึ้น ครึ่งชีวิตเป็นส่วนกลับของ k"
    widget:
      kind: function-plot
      functions: ["a\\cdot e^{-k\\cdot x}"]
      sliders:
        - { name: a, min: 0.5, max: 2, step: 0.1, value: 1, label: "[A]₀" }
        - { name: k, min: 0.05, max: 1, step: 0.05, value: 0.2, label: ค่าคงที่อัตรา k }
      x: [0, 15]
      y: [0, 2]
glossary:
  - { term: กฎอัตรา, definition: "สมการที่แสดงอัตราของปฏิกิริยาเป็นฟังก์ชันของความเข้มข้นของสารตั้งต้น เช่น rate = k[A]^m[B]^n" }
  - { term: อันดับของปฏิกิริยา, definition: "เลขยกกำลังของความเข้มข้นของสารแต่ละชนิดในกฎอัตรา ซึ่งหาจากการทดลอง ไม่ได้มาจากสัมประสิทธิ์ในสมการดุล" }
  - { term: ค่าคงที่อัตรา (k), definition: "ค่าคงที่ที่ขึ้นกับอุณหภูมิและชนิดของปฏิกิริยา หน่วยขึ้นกับอันดับรวมของปฏิกิริยา" }
  - { term: อัตราเริ่มต้น, definition: "อัตราการเกิดปฏิกิริยาในช่วงแรกสุดเมื่อยังไม่มีผลิตภัณฑ์สะสม ใช้หาอันดับจากการเปรียบเทียบชุดการทดลอง" }
  - { term: ครึ่งชีวิต (t½), definition: "เวลาที่สารตั้งต้นลดลงเหลือครึ่งหนึ่งของปริมาณเริ่มต้น" }
  - { term: ปฏิกิริยาอันดับหนึ่ง, definition: "ปฏิกิริยาที่อัตราขึ้นกับความเข้มข้นของสารตั้งต้นเพียงครั้งเดียว ครึ่งชีวิตของมันไม่ขึ้นกับความเข้มข้นเริ่มต้น" }
flashcards:
  - { front: "อันดับของปฏิกิริยาหาจากอะไร", back: "จากการทดลองวัดอัตราเมื่อเปลี่ยนความเข้มข้น ไม่ใช่จากสัมประสิทธิ์ในสมการดุล" }
  - { front: "อินทิเกรตของอันดับศูนย์ อันดับหนึ่ง และอันดับสอง", back: "[A] = [A]₀ − kt, ln[A] = ln[A]₀ − kt, 1/[A] = 1/[A]₀ + kt" }
  - { front: "ครึ่งชีวิตของอันดับหนึ่งคำนวณอย่างไร", back: "t½ = ln 2 / k = 0.693 / k และไม่ขึ้นกับ [A]₀" }
  - { front: "หน่วยของ k สำหรับปฏิกิริยาอันดับสอง", back: "M⁻¹·s⁻¹" }
  - { front: "กราฟใดให้เส้นตรงสำหรับอันดับสอง", back: "1/[A] เทียบกับ t ความชันเท่ากับ +k" }
