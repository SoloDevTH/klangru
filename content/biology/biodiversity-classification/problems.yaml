  - id: biology.diversity.biodiversity-classification.p016
    topics: [biology.diversity.biodiversity-classification]
    difficulty: 5
    type: mcq
    stem: "ตารางลักษณะของสัตว์ 4 ชนิด (มี = ✓) ฟองน้ำ: ไม่มีเนื้อเยื่อแท้ แมงกะพรุน: เนื้อเยื่อแท้ ✓ ไส้เดือนดิน: เนื้อเยื่อแท้ ✓ เนื้อเยื่อ 3 ชั้น ✓ ช่องตัวแท้ ✓ ดาวทะเล: เนื้อเยื่อแท้ ✓ เนื้อเยื่อ 3 ชั้น ✓ ช่องตัวแท้ ✓ ถ้าสร้างแคลโดแกรมจากลักษณะเหล่านี้ ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ไส้เดือนดินกับดาวทะเลมีบรรพบุรุษร่วมกันใกล้ที่สุด และฟองน้ำแยกออกเป็นกลุ่มแรก", correct: true }
      - { id: b, text: "แมงกะพรุนกับดาวทะเลใกล้ชิดกันที่สุด เพราะอยู่ในทะเลและมีสมมาตรรัศมีเหมือนกัน", feedback: "ที่อยู่และรูปร่างภายนอกที่คล้ายกันอาจเกิดจากการปรับตัวคนละทาง แคลโดแกรมต้องใช้ลักษณะที่เกิดขึ้นใหม่ร่วมกัน ซึ่งดาวทะเลมีร่วมกับไส้เดือนดิน" }
      - { id: c, text: "ฟองน้ำใกล้ชิดกับแมงกะพรุนมากที่สุด เพราะมีลักษณะในตารางน้อยเหมือนกัน", feedback: "การ 'ไม่มี' ลักษณะร่วมกันไม่ใช่หลักฐานของการเป็นกลุ่มเดียวกัน ต้องใช้ลักษณะที่มีร่วมกัน" }
      - { id: d, text: "ดาวทะเลวิวัฒนาการสูงกว่าสัตว์อื่นทั้งหมด", feedback: "แคลโดแกรมไม่ได้บอกว่าชนิดใดสูงกว่า ทุกชนิดในปัจจุบันวิวัฒนาการมานานเท่ากัน" }
    hints:
      - "ลักษณะที่มีในหลายชนิดเกิดขึ้นก่อน ลักษณะที่มีในไม่กี่ชนิดเกิดขึ้นทีหลัง"
      - "จัดกลุ่มจากลักษณะที่มีร่วมกัน ไม่ใช่จากลักษณะที่ขาดร่วมกัน"
    solution: "เนื้อเยื่อแท้มีในสามชนิด ฟองน้ำไม่มี จึงแยกออกก่อน เนื้อเยื่อ 3 ชั้นและช่องตัวแท้มีเฉพาะไส้เดือนดินกับดาวทะเล จึงเป็นกลุ่มที่มีบรรพบุรุษร่วมใหม่ที่สุด แมงกะพรุนแยกออกก่อนกลุ่มนี้"
