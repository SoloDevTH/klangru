<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="sans-serif">
<title>วงจรกระบวนการทำงาน 4 ขั้น</title>
<rect width="760" height="430" fill="#ffffff"/>
<rect x="90" y="70" width="250" height="110" rx="12" fill="#e8f1fb" stroke="#334155" stroke-width="2"/>
<text x="215.0" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">1. วิเคราะห์งาน</text>
<text x="215.0" y="144" text-anchor="middle" font-size="15" fill="#374151">ดูเป้าหมาย ขั้นตอน และวัสดุ</text>
<rect x="420" y="70" width="250" height="110" rx="12" fill="#e9f7ef" stroke="#334155" stroke-width="2"/>
<text x="545.0" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">2. วางแผน</text>
<text x="545.0" y="144" text-anchor="middle" font-size="15" fill="#374151">จัดลำดับ แบ่งคน เวลา และวัสดุ</text>
<rect x="420" y="250" width="250" height="110" rx="12" fill="#fff4e5" stroke="#334155" stroke-width="2"/>
<text x="545.0" y="294" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">3. ลงมือทำ</text>
<text x="545.0" y="324" text-anchor="middle" font-size="15" fill="#374151">ทำตามแผนและจดปัญหาที่พบ</text>
<rect x="90" y="250" width="250" height="110" rx="12" fill="#f3e8ff" stroke="#334155" stroke-width="2"/>
<text x="215.0" y="294" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">4. ประเมินผลและปรับปรุง</text>
<text x="215.0" y="324" text-anchor="middle" font-size="15" fill="#374151">เทียบกับเป้าหมาย แล้วแก้ไข</text>
<line x1="340" y1="125" x2="420" y2="125" stroke="#334155" stroke-width="3"/>
<polygon points="420,125 406.0,117.0 406.0,133.0" fill="#334155"/>
<line x1="545.0" y1="180" x2="545.0" y2="250" stroke="#334155" stroke-width="3"/>
<polygon points="545.0,250 553.0,236.0 537.0,236.0" fill="#334155"/>
<line x1="420" y1="305" x2="340" y2="305" stroke="#334155" stroke-width="3"/>
<polygon points="340,305 354.0,313.0 354.0,297.0" fill="#334155"/>
<line x1="215.0" y1="250" x2="215.0" y2="180" stroke="#334155" stroke-width="3"/>
<polygon points="215.0,180 207.0,194.0 223.0,194.0" fill="#334155"/>
<text x="380.0" y="209.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">กระบวนการทำงาน</text>
<text x="380.0" y="231.0" text-anchor="middle" font-size="14" fill="#374151">วนกลับไปขั้นก่อนหน้าได้เสมอ</text>
<text x="380.0" y="414" text-anchor="middle" font-size="14" fill="#374151">ถ้าผลประเมินไม่ถึงเป้าหมาย ให้กลับไปวิเคราะห์หรือวางแผนใหม่</text>
</svg>
