<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250" font-family="sans-serif"><title>ลำดับของอุปกรณ์ควบคุมมลพิษจากแหล่งกำเนิดถึงปล่อง</title><rect x="0" y="0" width="700" height="250" fill="#ffffff"/><rect x="30" y="110" width="150" height="70" rx="8" fill="#eef4fb" stroke="#1f3a5f" stroke-width="2"/><text x="105.0" y="139.0" text-anchor="middle" font-size="17" fill="#111">แหล่งกำเนิด</text><text x="105.0" y="161.0" text-anchor="middle" font-size="13" fill="#333">หม้อไอน้ำหรือเตาเผา</text><line x1="180" y1="145" x2="214.0" y2="145.0" stroke="#1f3a5f" stroke-width="2.5"/><polygon points="220,145 210.0,139.0 210.0,151.0" fill="#1f3a5f"/><rect x="220" y="110" width="150" height="70" rx="8" fill="#eef4fb" stroke="#1f3a5f" stroke-width="2"/><text x="295.0" y="139.0" text-anchor="middle" font-size="17" fill="#111">ดักอนุภาค</text><text x="295.0" y="161.0" text-anchor="middle" font-size="13" fill="#333">ไซโคลนหรือถุงกรอง</text><line x1="370" y1="145" x2="404.0" y2="145.0" stroke="#1f3a5f" stroke-width="2.5"/><polygon points="410,145 400.0,139.0 400.0,151.0" fill="#1f3a5f"/><rect x="410" y="110" width="150" height="70" rx="8" fill="#eef4fb" stroke="#1f3a5f" stroke-width="2"/><text x="485.0" y="139.0" text-anchor="middle" font-size="17" fill="#111">ดักแก๊ส</text><text x="485.0" y="161.0" text-anchor="middle" font-size="13" fill="#333">สครับเบอร์หรือปูนขาว</text><line x1="560" y1="145" x2="594.0" y2="145.0" stroke="#1f3a5f" stroke-width="2.5"/><polygon points="600,145 590.0,139.0 590.0,151.0" fill="#1f3a5f"/><rect x="600" y="110" width="80" height="70" rx="8" fill="#eef4fb" stroke="#1f3a5f" stroke-width="2"/><text x="640.0" y="145.0" text-anchor="middle" font-size="17" fill="#111">ปล่อง</text><text x="30" y="200" font-size="14" fill="#333">ลำดับทั่วไปคือดักอนุภาคก่อน แล้วดักแก๊ส</text><text x="30" y="222" font-size="14" fill="#333">ปล่องเป็นจุดสุดท้ายที่กระจายสิ่งที่เหลือออกสู่บรรยากาศ</text></svg>
