  - id: chemistry.equilibrium.chemical-equilibrium.p015
    topics: [chemistry.equilibrium.chemical-equilibrium]
    difficulty: 5
    type: mcq
    stem: "บีบกระบอกฉีดยาที่บรรจุแก๊ส $\\mathrm{H_2}$, $\\mathrm{I_2}$ (สีม่วง) และ HI ที่สมดุล ให้ปริมาตรลดลงครึ่งหนึ่ง (อุณหภูมิคงที่) ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "สีม่วงเข้มขึ้นเพราะ I₂ เข้มข้นขึ้น แต่สมดุลไม่เลื่อน เพราะจำนวนโมลแก๊สสองข้างเท่ากัน", correct: true, feedback: "ถูก Q ยังเท่ากับ K หลังบีบ เพราะเศษและส่วนเพิ่มด้วยตัวคูณเท่ากัน" }
      - { id: b, text: "สมดุลเลื่อนไปทางขวาเพราะความดันสูงขึ้น สีจึงจางลง", feedback: "ความดันมีผลเมื่อโมลแก๊สสองข้างไม่เท่ากัน ที่นี่ 2 mol เท่ากับ 2 mol" }
      - { id: c, text: "สีไม่เปลี่ยนเลย เพราะสมดุลไม่เลื่อน", feedback: "สมดุลไม่เลื่อนจริง แต่ปริมาตรลดลง ความเข้มข้นของ I₂ จึงสูงขึ้น สีเข้มขึ้น" }
    hints:
      - "นับโมลแก๊สทั้งสองข้างของสมการ"
      - "ความเข้มข้นเปลี่ยนเมื่อปริมาตรเปลี่ยน แม้จำนวนโมลไม่เปลี่ยน"
    solution: "โมลแก๊สซ้าย 2 ขวา 2 เท่ากัน การบีบทำให้ทุกความเข้มข้นเพิ่มเป็นสองเท่า $Q = (2[\\mathrm{HI}])^2 / (2[\\mathrm{H_2}])(2[\\mathrm{I_2}]) = K$ **สมดุลไม่เลื่อน** แต่ I₂ เข้มข้นขึ้น สีม่วงจึงเข้มขึ้น"
