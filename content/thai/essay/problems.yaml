problems:
- id: thai.composition.essay.p001
  topics:
  - thai.composition.essay
  difficulty: 1
  type: mcq
  stem: เรียงความมีส่วนประกอบสำคัญ 3 ส่วน (ไม่นับชื่อเรื่อง) คือข้อใด
  choices:
  - id: a
    text: ต้นเรื่อง ปมปัญหา จุดสูงสุด
    feedback: เป็นโครงเรื่องของเรื่องเล่า
  - id: b
    text: คำขึ้นต้น เนื้อความ คำลงท้าย
    feedback: เป็นส่วนของจดหมาย
  - id: c
    text: คำนำ เนื้อเรื่อง สรุป
    correct: true
    feedback: ถูก
  - id: d
    text: คำนำย่อความ เนื้อความ ความว่า
    feedback: เป็นรูปแบบย่อความ
  hints:
  - ส่วนแรกเปิดเรื่อง ส่วนสุดท้ายปิดเรื่อง
  - ส่วนกลางยาวที่สุด
  solution: เรียงความมี **คำนำ เนื้อเรื่อง และสรุป**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.essay.p002
  topics:
  - thai.composition.essay
  difficulty: 1
  type: match
  stem: จับคู่ส่วนของเรียงความกับหน้าที่
  pairs:
  - left: คำนำ
    right: เปิดเรื่องให้น่าสนใจและบอกประเด็นหลัก
  - left: เนื้อเรื่อง
    right: เสนอประเด็นย่อยพร้อมตัวอย่างและเหตุผล
  - left: สรุป
    right: ปิดเรื่อง ฝากข้อคิดหรือเชิญชวน
  - left: ชื่อเรื่อง
    right: บอกหัวข้อสั้น ๆ ให้รู้ว่าเรียงความพูดถึงอะไร
  hints:
  - ส่วนใดยาวที่สุดและมีตัวอย่าง
  - ส่วนใดอยู่ท้ายสุด
  solution: คำนำ = เปิดเรื่อง · เนื้อเรื่อง = ประเด็นย่อยพร้อมตัวอย่าง · สรุป = ปิดเรื่อง · ชื่อเรื่อง = บอกหัวข้อ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.essay.p003
  topics:
  - thai.composition.essay
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนการเขียนเรียงความ
  items:
  - กำหนดจุดประสงค์และประเด็นหลัก
  - ระดมความคิดด้วยแผนภาพความคิด
  - วางแผนภาพโครงเรื่อง
  - เขียนฉบับร่าง
  - อ่านทบทวนตามเกณฑ์แล้วแก้ไข
  hints:
  - ต้องรู้ก่อนว่าจะเขียนเรื่องอะไร
  - แก้ไขทำหลังเขียนร่างเสร็จ
  solution: จุดประสงค์ → แผนภาพความคิด → แผนภาพโครงเรื่อง → ร่าง → ทบทวนแก้ไข
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.essay.p004
  topics:
  - thai.composition.essay
  difficulty: 2
  type: mcq
  stem: อ่านย่อหน้าร่างในภาพ ประโยคใดเป็น **ประโยคใจความ**
  figure:
    src: draft-paragraph.svg
    alt: ย่อหน้าร่างสมมติจากเรียงความเรื่อง ประโยชน์ของการปลูกผักสวนครัว 5 ประโยค (1) การปลูกผักสวนครัวไว้กินเองช่วยประหยัดค่าใช้จ่ายของครอบครัว (2) ผักที่ใช้บ่อย เช่น ตะไคร้ ใบกะเพรา และพริก ปลูกในกระถางหลังบ้านได้ (3) เมื่อไม่ต้องซื้อผักเหล่านี้ทุกวัน เงินที่เคยจ่ายก็เหลือเก็บไว้ใช้อย่างอื่น (4) ตลาดนัดใกล้บ้านของฉันเปิดทุกวันพุธและวันเสาร์ (5) ครอบครัวของฉันเริ่มปลูกเมื่อปีที่แล้ว ค่าผักแต่ละเดือนก็ลดลงจริง
  choices:
  - id: a
    text: (2)
    feedback: เป็นตัวอย่างผักที่ปลูกได้
  - id: b
    text: (3)
    feedback: อธิบายว่าประหยัดอย่างไร เป็นประโยคขยาย
  - id: c
    text: (5)
    feedback: เป็นประสบการณ์ที่สนับสนุน
  - id: d
    text: (1)
    correct: true
    feedback: ถูก บอกประเด็นว่าปลูกผักช่วยประหยัด
  hints:
  - ประโยคใจความบอกประเด็นของย่อหน้า
  - ประโยคอื่นสนับสนุนประโยคใด
  solution: ประโยค **(1)** เป็นประโยคใจความ ประโยคอื่นขยายความ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.essay.p005
  topics:
  - thai.composition.essay
  difficulty: 2
  type: mcq
  stem: อ่านย่อหน้าร่างในภาพ ประโยคใดทำให้ย่อหน้า **เสียเอกภาพ** ควรตัดออก
  figure:
    src: draft-paragraph.svg
    alt: ย่อหน้าร่างสมมติจากเรียงความเรื่อง ประโยชน์ของการปลูกผักสวนครัว 5 ประโยค (1) การปลูกผักสวนครัวไว้กินเองช่วยประหยัดค่าใช้จ่ายของครอบครัว (2) ผักที่ใช้บ่อย เช่น ตะไคร้ ใบกะเพรา และพริก ปลูกในกระถางหลังบ้านได้ (3) เมื่อไม่ต้องซื้อผักเหล่านี้ทุกวัน เงินที่เคยจ่ายก็เหลือเก็บไว้ใช้อย่างอื่น (4) ตลาดนัดใกล้บ้านของฉันเปิดทุกวันพุธและวันเสาร์ (5) ครอบครัวของฉันเริ่มปลูกเมื่อปีที่แล้ว ค่าผักแต่ละเดือนก็ลดลงจริง
  choices:
  - id: a
    text: (2)
    feedback: บอกว่าปลูกผักอะไรได้ เกี่ยวกับใจความ
  - id: b
    text: (3)
    feedback: อธิบายการประหยัด
  - id: c
    text: (4)
    correct: true
    feedback: ถูก วันเปิดตลาดนัดไม่เกี่ยวกับการประหยัดจากการปลูกผัก
  - id: d
    text: (5)
    feedback: เป็นหลักฐานว่าประหยัดได้จริง
  hints:
  - เอกภาพคือทุกประโยคเกี่ยวกับใจความเดียว
  - ประโยคใดพูดเรื่องอื่น
  solution: ประโยค **(4)** พูดเรื่องตลาดนัด ไม่เกี่ยวกับใจความ จึงเสียเอกภาพ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.essay.p006
  topics:
  - thai.composition.essay
  difficulty: 3
  type: mcq
  stem: คำนำเรียงความขึ้นต้นว่า "เคยสังเกตไหมว่าเดือนหนึ่งครอบครัวของเราจ่ายค่าผักไปเท่าไร" ใช้วิธีเปิดเรื่องแบบใด
  choices:
  - id: a
    text: ยกสุภาษิต
    feedback: ไม่มีสุภาษิต
  - id: b
    text: ตั้งคำถาม
    correct: true
    feedback: ถูก
  - id: c
    text: เล่าเหตุการณ์
    feedback: ไม่ได้เล่าว่าเกิดอะไรขึ้น
  - id: d
    text: บอกความหมายของคำ
    feedback: ไม่ได้นิยามคำใด
  hints:
  - สังเกตเครื่องหมายหรือคำแสดงคำถาม
  - คำว่า ไหม
  solution: เปิดด้วย **คำถาม** เพื่อชวนผู้อ่านคิดตาม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.essay.p007
  topics:
  - thai.composition.essay
  difficulty: 3
  type: mcq
  stem: ดูแผนภาพโครงเรื่องในภาพ หัวข้อใดเติมในช่อง **2.2** ได้เหมาะที่สุด
  figure:
    src: reading-outline.svg
    alt: แผนภาพโครงเรื่องฉบับร่าง เรื่อง การอ่านหนังสือทุกวัน 1 คำนำ ชวนสังเกตว่าวันหนึ่งเราใช้เวลากับหน้าจอนานเท่าไร 2 เนื้อเรื่อง 2.1 การอ่านเพิ่มความรู้และคำศัพท์ 2.2 เป็นช่องว่างมีเครื่องหมายคำถาม 2.3 วิธีสร้างนิสัย อ่านวันละ 15 นาทีก่อนนอน 3 สรุป ทบทวนประโยชน์ และชวนเริ่มอ่านคืนนี้
  choices:
  - id: a
    text: การอ่านช่วยฝึกสมาธิและผ่อนคลาย
    correct: true
    feedback: ถูก เป็นประโยชน์อีกข้อ เข้ากับ 2.1 และนำไปสู่ 2.3
  - id: b
    text: ราคาหนังสือในร้านค้า
    feedback: ไม่เกี่ยวกับประเด็นหลัก
  - id: c
    text: ชวนผู้อ่านเริ่มอ่านคืนนี้
    feedback: เป็นส่วนสรุป ซ้ำกับข้อ 3
  - id: d
    text: การอ่านเพิ่มคำศัพท์
    feedback: ซ้ำกับ 2.1
  hints:
  - 2.1 เป็นประโยชน์ของการอ่าน
  - หัวข้อใหม่ต้องไม่ซ้ำและไม่ใช่สรุป
  solution: เติม **ประโยชน์อีกข้อ** เช่น ฝึกสมาธิและผ่อนคลาย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.essay.p008
  topics:
  - thai.composition.essay
  difficulty: 3
  type: mcq
  stem: '"การปลูกผักช่วยให้ครอบครัวประหยัดเงิน ___ ยังได้ผักที่ปลอดภัยจากสารเคมี" ควรเติมคำเชื่อมใด'
  choices:
  - id: a
    text: แต่
    feedback: ใช้กับความที่ขัดแย้งกัน
  - id: b
    text: เพราะฉะนั้น
    feedback: ใช้บอกผล แต่ประโยคหลังไม่ใช่ผลของประโยคแรก
  - id: c
    text: หรือ
    feedback: ใช้บอกทางเลือก
  - id: d
    text: นอกจากนี้
    correct: true
    feedback: ถูก เพิ่มประเด็นที่ไปทางเดียวกัน
  hints:
  - สองประโยคเป็นข้อดีทั้งคู่
  - คำใดใช้เพิ่มข้อมูล
  solution: ใช้ **นอกจากนี้** เพื่อเพิ่มประโยชน์อีกข้อ ทำให้ย่อหน้ามีสัมพันธภาพ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.essay.p009
  topics:
  - thai.composition.essay
  difficulty: 3
  type: text
  stem: ลักษณะของย่อหน้าที่ดีที่ว่า "ย่อหน้าหนึ่งมีใจความสำคัญเรื่องเดียว ทุกประโยคเกี่ยวกับใจความนั้น" เรียกว่าอะไร
  accepted:
  - เอกภาพ
  - ความเป็นเอกภาพ
  misconceptions:
  - match: สัมพันธภาพ
    feedback: สัมพันธภาพคือประโยคต่อเนื่องกัน
  - match: สารัตถภาพ
    feedback: สารัตถภาพคือการเน้นใจความให้เด่น
  hints:
  - เอก แปลว่าหนึ่ง
  - ลักษณะ 3 ข้อคือ เอกภาพ สัมพันธภาพ สารัตถภาพ
  solution: '**เอกภาพ** คือความเป็นอันหนึ่งอันเดียว ย่อหน้าหนึ่งมีใจความเดียว'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.essay.p010
  topics:
  - thai.composition.essay
  difficulty: 4
  type: mcq
  stem: ข้อใดเป็น **ย่อหน้าสรุป** ที่ดีที่สุดของเรียงความเรื่อง ประโยชน์ของการปลูกผักสวนครัว (เนื้อเรื่องพูดเรื่องประหยัดเงิน ผักปลอดภัย และกิจกรรมในครอบครัว)
  choices:
  - id: a
    text: การเลี้ยงไก่ไข่ที่บ้านก็มีประโยชน์มากเช่นกัน
    feedback: เปิดประเด็นใหม่ที่เนื้อเรื่องไม่ได้พูดถึง
  - id: b
    text: ผักสวนครัวเพียงไม่กี่กระถางช่วยให้ครอบครัวประหยัด ได้อาหารที่ปลอดภัย และได้ใช้เวลาร่วมกัน ลองเริ่มจากกะเพราสักกระถางตั้งแต่วันนี้
    correct: true
    feedback: ถูก สรุปครบสามประเด็นด้วยคำใหม่ และเชิญชวน
  - id: c
    text: เคยสังเกตไหมว่าเดือนหนึ่งครอบครัวของเราจ่ายค่าผักไปเท่าไร
    feedback: คัดคำนำมาซ้ำ ไม่ได้สรุป
  - id: d
    text: จบแล้ว ขอบคุณที่อ่าน
    feedback: ไม่ได้สรุปเนื้อหา
  hints:
  - สรุปต้องครอบคลุมประเด็นในเนื้อเรื่อง
  - ไม่เปิดประเด็นใหม่
  solution: สรุปที่ดี **ทวนประเด็นด้วยคำใหม่** และ **เชิญชวน** โดยไม่เปิดเรื่องใหม่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.essay.p011
  topics:
  - thai.composition.essay
  difficulty: 4
  type: numeric
  stem: ครูประเมินเรียงความของเพื่อนด้วยเกณฑ์ 4 ด้าน ด้านละ 5 คะแนน ได้ เนื้อหา 4 โครงสร้าง 3 การใช้ภาษา 4 การสะกดคำ 2 คะแนนรวมเป็นกี่คะแนน (เต็ม 20)
  answer:
    value: 13
    unit: คะแนน
  misconceptions:
  - match: 20
    feedback: ตอบคะแนนเต็ม ต้องรวมคะแนนที่ได้
  - match: 65
    feedback: เป็นร้อยละ ไม่ใช่คะแนนรวม
  hints:
  - บวกคะแนนทั้ง 4 ด้าน
  - 4 + 3 + 4 + 2
  solution: $4 + 3 + 4 + 2 = 13$ คะแนน (คิดเป็นร้อยละ 65)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.essay.p012
  topics:
  - thai.composition.essay
  difficulty: 4
  type: mcq
  stem: เรียงความของเพื่อนได้คะแนน เนื้อหา 4 โครงสร้าง 3 การใช้ภาษา 4 การสะกดคำ 2 (เต็มด้านละ 5) ข้อเสนอแนะใดมีประโยชน์ต่อเพื่อนที่สุด
  choices:
  - id: a
    text: เขียนได้ดีแล้ว
    feedback: ไม่บอกว่าดีตรงไหนหรือควรแก้อะไร
  - id: b
    text: ภาษายังไม่ดี ต้องปรับ
    feedback: กว้างเกินไป และไม่ใช่ด้านที่ต่ำที่สุด
  - id: c
    text: ฉันไม่ชอบเรื่องปลูกผัก
    feedback: เป็นความชอบส่วนตัว ไม่ได้ประเมินตามเกณฑ์
  - id: d
    text: ย่อหน้าที่ 2 สะกด กะเพรา เป็น กระเพรา และ ไอศกรีม เป็น ไอศครีม ลองตรวจคำกับพจนานุกรมก่อนส่ง
    correct: true
    feedback: ถูก ชี้จุดที่ชัด ตรงกับด้านที่คะแนนต่ำสุด และบอกวิธีแก้
  hints:
  - ด้านใดได้คะแนนต่ำที่สุด
  - ข้อเสนอแนะที่ดีชี้ตำแหน่งและบอกวิธีแก้
