  - id: business.finance.financial-ratios.p018
    topics: [business.finance.financial-ratios]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการวิเคราะห์งบการเงินด้วยอัตราส่วน"
    items:
      - "กำหนดวัตถุประสงค์ เช่น ธนาคารพิจารณาเงินกู้"
      - "รวบรวมงบการเงินหลายปีและค่าเฉลี่ยอุตสาหกรรม"
      - "คำนวณอัตราส่วนแต่ละกลุ่ม"
      - "เทียบกับปีก่อนและค่าเฉลี่ยอุตสาหกรรม"
      - "หาสาเหตุจากข้อมูลอื่นแล้วสรุปข้อเสนอแนะ"
    hints:
      - "ต้องรู้ก่อนว่าวิเคราะห์เพื่อใคร เพราะผู้ใช้แต่ละกลุ่มสนใจอัตราส่วนต่างกัน"
      - "ตัวเลขเดี่ยว ๆ ต้องนำไปเทียบก่อนสรุป"
    solution: "กำหนดวัตถุประสงค์และผู้ใช้ → รวบรวมงบการเงินหลายปีและข้อมูลอุตสาหกรรม → คำนวณอัตราส่วน → เทียบแนวโน้มและค่าเฉลี่ยอุตสาหกรรม → หาสาเหตุจากข้อมูลอื่นแล้วสรุปข้อเสนอ"
    license: CC-BY-SA-4.0
    ai_assisted: true
