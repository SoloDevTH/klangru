      - { match: 20, feedback: "แรงเสียดทานไม่ได้ลดลงเมื่อหนักขึ้น มันแปรผันตรงกับแรงปฏิกิริยาตั้งฉาก" }
    solution: "น้ำหนักรวมเป็นสองเท่า $N$ จึงเป็นสองเท่า ได้ $f_k = 2 \\times 40 = 80\\ \\mathrm{N}$"
