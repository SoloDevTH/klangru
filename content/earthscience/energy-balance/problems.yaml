problems:
  - id: earthscience.atmosphere.energy-balance.p001
    topics: [earthscience.atmosphere.energy-balance]
    difficulty: 1
    type: mcq
    stem: "พื้นผิวใดมีอัลบีโดสูงที่สุด"
    choices:
      - { id: a, text: "หิมะที่เพิ่งตก", correct: true }
      - { id: b, text: "มหาสมุทรตอนแดดสูง", feedback: "น้ำทะเลสีเข้มดูดกลืนแสงเกือบหมด อัลบีโดต่ำกว่า 0.1" }
      - { id: c, text: "ป่าไม้", feedback: "ใบไม้สีเขียวเข้มดูดกลืนแสงมาก อัลบีโดราว 0.1" }
      - { id: d, text: "ถนนแอสฟัลต์", feedback: "แอสฟัลต์สีดำ อัลบีโดต่ำมาก จึงร้อนจัดกลางแดด" }
    hints:
      - "อัลบีโดคือสัดส่วนของแสงที่สะท้อนกลับ"
      - "พื้นผิวสีขาวสว่างสะท้อนแสงมากที่สุด"
    solution: "หิมะใหม่สีขาวสะท้อนแสงได้ราวร้อยละ 80–90 จึงมีอัลบีโดสูงที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.energy-balance.p002
    topics: [earthscience.atmosphere.energy-balance]
    difficulty: 1
    type: match
    stem: "จับคู่ปัจจัยกับผลต่อพลังงานที่บริเวณหนึ่งได้รับหรือคาย"
    pairs:
      - { left: "ละติจูดสูง", right: "แสงตกเฉียง พลังงานกระจายบนพื้นที่ใหญ่" }
      - { left: "อัลบีโดสูง", right: "สะท้อนแสงกลับมาก ดูดกลืนพลังงานน้อย" }
      - { left: "อยู่ติดทะเล", right: "อุณหภูมิกลางวันกลางคืนต่างกันน้อย" }
      - { left: "อยู่บนยอดเขาสูง", right: "อากาศเย็นกว่าพื้นราบ" }
    hints:
      - "น้ำมีความจุความร้อนจำเพาะสูง"
      - "มุมของแสงยิ่งเฉียง พลังงานต่อพื้นที่ยิ่งน้อย"
    solution: "ละติจูดสูงได้แสงเฉียง อัลบีโดสูงสะท้อนมาก ทะเลทำให้อุณหภูมิเปลี่ยนช้า และยอดเขาสูงมีอากาศเย็นกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.energy-balance.p003
    topics: [earthscience.atmosphere.energy-balance]
    difficulty: 2
    type: numeric
    stem: "ค่าคงตัวสุริยะเท่ากับ $1{,}361\\ \\mathrm{W/m^2}$ พลังงานจากดวงอาทิตย์ที่ยอดบรรยากาศ เฉลี่ยทั่วผิวโลกตลอดวัน เท่ากับกี่ $\\mathrm{W/m^2}$"
    answer: { value: 340, tolerance: 1, unit: W/m² }
    misconceptions:
      - { match: 680.5, feedback: "หารด้วย 2 คิดเพียงกลางวันกลางคืน แต่ต้องคิดว่าทรงกลมรับแสงด้วยพื้นที่หน้าตัด $\\pi R^2$ และกระจายบน $4\\pi R^2$" }
      - { match: 1361, feedback: "1,361 คือค่าที่ตกตั้งฉาก เป็นค่าสูงสุด ไม่ใช่ค่าเฉลี่ยทั่วผิวโลก" }
    hints:
      - "พื้นที่รับแสงคือพื้นที่หน้าตัด $\\pi R^2$"
      - "พื้นผิวทั้งหมดคือ $4\\pi R^2$ ค่าเฉลี่ย $= S/4$"
    solution: "$\\dfrac{S\\pi R^2}{4\\pi R^2} = \\dfrac{1{,}361}{4} \\approx 340\\ \\mathrm{W/m^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.energy-balance.p004
    topics: [earthscience.atmosphere.energy-balance]
    difficulty: 2
    type: mcq
    stem: "ทำไมเดือนเมษายนจึงเป็นเดือนที่ร้อนที่สุดของกรุงเทพฯ"
    choices:
      - { id: a, text: "ดวงอาทิตย์ตอนเที่ยงเกือบตั้งฉากกับกรุงเทพฯ แสงจึงเข้มมาก กลางวันยาวขึ้น และยังไม่เข้าฤดูฝนที่มีเมฆมาก", correct: true }
      - { id: b, text: "เดือนเมษายนโลกอยู่ใกล้ดวงอาทิตย์ที่สุด", feedback: "โลกอยู่ใกล้ดวงอาทิตย์ที่สุดราวต้นเดือนมกราคม ระยะทางไม่ใช่สาเหตุหลักของฤดู" }
      - { id: c, text: "ดวงอาทิตย์ร้อนขึ้นในเดือนเมษายน", feedback: "พลังงานจากดวงอาทิตย์แทบคงที่ตลอดปี สิ่งที่เปลี่ยนคือมุมแสงที่ตกกระทบ" }
      - { id: d, text: "เพราะมีแก๊สเรือนกระจกเฉพาะในเดือนเมษายน", feedback: "แก๊สเรือนกระจกมีตลอดปี ไม่ได้เพิ่มขึ้นเฉพาะเดือนเมษายน" }
    hints:
      - "ดวงอาทิตย์ผ่านเหนือศีรษะกรุงเทพฯ ราวปลายเดือนเมษายน"
      - "ฤดูฝนที่มีเมฆมากเริ่มราวเดือนพฤษภาคม"
    solution: "ปลายเดือนเมษายนดวงอาทิตย์ผ่านเหนือศีรษะกรุงเทพฯ แสงตกเกือบตั้งฉาก ($I = S\\cos z$ มีค่ามาก) และท้องฟ้ายังโปร่ง ส่วนเดือนสิงหาคมแม้ดวงอาทิตย์ผ่านเหนือศีรษะอีกครั้ง แต่เป็นฤดูฝนที่มีเมฆสะท้อนแสงมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.energy-balance.p005
    topics: [earthscience.atmosphere.energy-balance]
    difficulty: 2
    type: numeric
    stem: "แสงอาทิตย์ตกบนนาข้าว $800\\ \\mathrm{W/m^2}$ และนาข้าวสะท้อนกลับ $200\\ \\mathrm{W/m^2}$ อัลบีโดของนาข้าวเท่ากับเท่าใด"
    answer: { value: 0.25, tolerance: 0.005 }
    misconceptions:
      - { match: 0.75, feedback: "0.75 คือสัดส่วนที่ดูดกลืน อัลบีโดคือสัดส่วนที่สะท้อน" }
      - { match: 4, feedback: "นำพลังงานที่ตกกระทบหารด้วยที่สะท้อน ต้องกลับกัน" }
    hints:
      - "อัลบีโด = พลังงานที่สะท้อน ÷ พลังงานที่ตกกระทบ"
      - "$200 \\div 800$"
    solution: "$\\alpha = 200/800 = 0.25$ นาข้าวดูดกลืนพลังงานไว้ร้อยละ 75"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.energy-balance.p006
    topics: [earthscience.atmosphere.energy-balance]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นเหตุที่กลางเมืองกรุงเทพฯ มักร้อนกว่าพื้นที่สวนและนาในชนบทรอบนอก (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ถนนแอสฟัลต์และหลังคาสีเข้มมีอัลบีโดต่ำ ดูดกลืนพลังงานมาก", correct: true }
      - { id: b, text: "มีต้นไม้และผิวน้ำน้อย พลังงานถูกใช้ระเหยน้ำน้อย", correct: true }
      - { id: c, text: "อาคารคอนกรีตเก็บความร้อนตอนกลางวันแล้วคายออกตอนกลางคืน", correct: true }
      - { id: d, text: "กรุงเทพฯ อยู่ใกล้ดวงอาทิตย์มากกว่าชนบท", feedback: "ระยะทางถึงดวงอาทิตย์แทบไม่ต่างกัน ความต่างมาจากพื้นผิวในเมือง" }
    hints:
      - "คิดถึงอัลบีโดของพื้นผิวในเมือง"
      - "พลังงานที่ใช้ระเหยน้ำไม่ได้ทำให้อุณหภูมิสูงขึ้น"
    solution: "พื้นผิวสีเข้มดูดกลืนมาก มีพื้นที่ระเหยน้ำน้อย และวัสดุเก็บความร้อนแล้วคายช้า ทำให้เมืองร้อนกว่าชนบท ส่วนระยะห่างจากดวงอาทิตย์ไม่ต่างกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.energy-balance.p007
    topics: [earthscience.atmosphere.energy-balance]
    difficulty: 3
    type: numeric
    stem: "วันที่ 21 ธันวาคม ดวงอาทิตย์มีเดคลิเนชัน $-23.44°$ กรุงเทพฯ อยู่ละติจูด $13.75°$ เหนือ ความเข้มของแสงอาทิตย์บนพื้นราบตอนเที่ยงที่ยอดบรรยากาศเหนือกรุงเทพฯ เท่ากับกี่ $\\mathrm{W/m^2}$ (ใช้ $S = 1{,}361\\ \\mathrm{W/m^2}$)"
    answer: { value: 1084, tolerance: 10, unit: W/m² }
    misconceptions:
      - { match: 1322, feedback: "ใช้มุมเซนิทเท่ากับละติจูด 13.75° ลืมนำเดคลิเนชันมาคิด $z = |13.75 - (-23.44)|$" }
      - { match: 823, feedback: "ใช้ $\\sin z$ แทน $\\cos z$ ความเข้มบนพื้นราบใช้ $\\cos$ ของมุมจากแนวดิ่ง" }
    hints:
      - "มุมเซนิทตอนเที่ยง $z = |\\varphi - \\delta|$"
      - "$I = S\\cos z$"
    solution: "$z = |13.75 - (-23.44)| = 37.19°$, $I = 1{,}361 \\cos 37.19° \\approx 1{,}084\\ \\mathrm{W/m^2}$ น้อยกว่าเดือนเมษายนที่ดวงอาทิตย์เกือบตั้งฉาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.energy-balance.p008
    topics: [earthscience.atmosphere.energy-balance]
    difficulty: 3
    type: numeric
    stem: "โลกได้รับแสงอาทิตย์เฉลี่ย $340\\ \\mathrm{W/m^2}$ และมีอัลบีโด 0.30 โลก (บรรยากาศรวมผิวโลก) ดูดกลืนพลังงานเฉลี่ยกี่ $\\mathrm{W/m^2}$"
    answer: { value: 238, tolerance: 2, unit: W/m² }
    misconceptions:
      - { match: 102, feedback: "102 คือพลังงานที่สะท้อนกลับ โจทย์ถามพลังงานที่ดูดกลืน" }
      - { match: 340, feedback: "ยังไม่ได้หักส่วนที่สะท้อนออก" }
    hints:
      - "สัดส่วนที่ดูดกลืน $= 1 - \\alpha$"
      - "$340 \\times (1 - 0.30)$"
    solution: "$340 \\times 0.70 = 238\\ \\mathrm{W/m^2}$ ใกล้กับอินฟราเรดที่ออกสู่อวกาศราว 240 ซึ่งแสดงว่าโลกเกือบอยู่ในสมดุล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.energy-balance.p009
    topics: [earthscience.atmosphere.energy-balance]
    difficulty: 3
    type: mcq
    stem: "ตอนบ่ายที่ชายหาดหัวหิน ทรายร้อนจนเดินเท้าเปล่าแทบไม่ได้ แต่น้ำทะเลยังเย็นสบาย ทั้งที่ได้แสงอาทิตย์เท่ากัน ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "น้ำมีความจุความร้อนจำเพาะสูงกว่าทรายมาก แสงส่องลึก น้ำผสมกัน และน้ำระเหยดึงความร้อนออก อุณหภูมิผิวน้ำจึงเพิ่มช้า", correct: true }
      - { id: b, text: "น้ำทะเลสะท้อนแสงเกือบทั้งหมด", feedback: "ตอนแดดสูง น้ำทะเลมีอัลบีโดต่ำกว่า 0.1 ดูดกลืนแสงได้ดีกว่าทรายด้วยซ้ำ" }
      - { id: c, text: "ทรายได้รับแสงมากกว่าน้ำเพราะอยู่สูงกว่า", feedback: "ความสูงต่างกันไม่กี่เมตรไม่ทำให้ได้แสงต่างกัน" }
      - { id: d, text: "น้ำทะเลมีเกลือ เกลือดูดความร้อนออกไป", feedback: "เกลือไม่ได้ดูดความร้อนออก ปัจจัยหลักคือความจุความร้อนจำเพาะ การผสม และการระเหย" }
    hints:
      - "ใช้ $Q = mc\\Delta T$ ได้ $Q$ เท่ากัน $c$ ใหญ่ $\\Delta T$ เล็ก"
      - "พลังงานในน้ำกระจายลงไปลึกและไปกับการระเหย"
    solution: "น้ำมี $c \\approx 4{,}186\\ \\mathrm{J/(kg\\cdot K)}$ มากกว่าทรายราว 5 เท่า พลังงานยังกระจายลงไปในน้ำลึกเพราะแสงส่องลึกและน้ำผสมกัน และบางส่วนใช้ระเหยน้ำ ผิวน้ำจึงร้อนช้ากว่าทรายมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.energy-balance.p010
    topics: [earthscience.atmosphere.energy-balance]
    difficulty: 3
    type: numeric
    stem: "ทรายแห้ง 1 kg ($c = 830\\ \\mathrm{J/(kg\\cdot K)}$) และน้ำ 1 kg ($c = 4{,}186\\ \\mathrm{J/(kg\\cdot K)}$) ได้รับพลังงานเท่ากัน ทรายมีอุณหภูมิเพิ่มขึ้นเป็นกี่เท่าของน้ำ (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 5.0, tolerance: 0.1, unit: เท่า }
    misconceptions:
      - { match: 0.2, feedback: "นี่คืออัตราส่วนของน้ำต่อทราย โจทย์ถามว่าทรายร้อนขึ้นเป็นกี่เท่าของน้ำ" }
    hints:
      - "$\\Delta T = Q/(mc)$ เมื่อ $Q$ และ $m$ เท่ากัน $\\Delta T$ แปรผกผันกับ $c$"
      - "$\\Delta T_{\\text{ทราย}} / \\Delta T_{\\text{น้ำ}} = c_{\\text{น้ำ}} / c_{\\text{ทราย}}$"
    solution: "$\\dfrac{\\Delta T_{\\text{ทราย}}}{\\Delta T_{\\text{น้ำ}}} = \\dfrac{4{,}186}{830} \\approx 5.0$ เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.energy-balance.p011
    topics: [earthscience.atmosphere.energy-balance]
    difficulty: 3
    type: order
    stem: "เรียงขั้นของการป้อนกลับระหว่างน้ำแข็งกับอัลบีโดในอาร์กติก"
    items:
      - "อุณหภูมิอากาศในอาร์กติกสูงขึ้น"
      - "น้ำแข็งทะเลละลายมากขึ้นในฤดูร้อน"
      - "ผิวน้ำทะเลสีเข้มโผล่ขึ้นมาแทนน้ำแข็งสีขาว อัลบีโดลดลง"
      - "ทะเลดูดกลืนพลังงานจากดวงอาทิตย์มากขึ้น"
      - "อุณหภูมิสูงขึ้นอีก"
    hints:
      - "เริ่มจากการเปลี่ยนแปลงเดิม"
      - "ผลสุดท้ายย้อนกลับไปเสริมการเปลี่ยนแปลงเดิม"
    solution: "ร้อนขึ้น → น้ำแข็งละลาย → อัลบีโดลดลง → ดูดกลืนพลังงานมากขึ้น → ร้อนขึ้นอีก เป็นการป้อนกลับแบบเสริม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.energy-balance.p012
    topics: [earthscience.atmosphere.energy-balance]
    difficulty: 4
    type: numeric
    stem: "ถ้าโลกไม่มีปรากฏการณ์เรือนกระจก อุณหภูมิสมดุลหาได้จาก $\\sigma T^4 = S(1-\\alpha)/4$ ใช้ $S = 1{,}361\\ \\mathrm{W/m^2}$, $\\alpha = 0.30$ และ $\\sigma = 5.67 \\times 10^{-8}\\ \\mathrm{W/(m^2\\cdot K^4)}$ หา $T$ เป็นเคลวิน"
    answer: { value: 255, tolerance: 1.5, unit: K }
    misconceptions:
      - { match: 278, feedback: "ลืมหักส่วนที่สะท้อน ต้องคูณ $(1 - \\alpha)$" }
      - { match: 360, feedback: "ลืมหารด้วย 4 ค่าเฉลี่ยทั่วผิวโลกคือ $S/4$" }
    hints:
      - "คำนวณ $S(1-\\alpha)/4$ ก่อน ได้ราว $238\\ \\mathrm{W/m^2}$"
      - "หารด้วย $\\sigma$ แล้วถอดรากที่สี่"
    solution: "$T^4 = \\dfrac{1{,}361 \\times 0.70}{4 \\times 5.67 \\times 10^{-8}} = 4.20 \\times 10^9$, $T \\approx 255\\ \\mathrm{K}$ ($-18\\ °\\mathrm{C}$) ผิวโลกจริงราว 288 K ส่วนต่างราว 33 K มาจากปรากฏการณ์เรือนกระจก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.energy-balance.p013
    topics: [earthscience.atmosphere.energy-balance]
    difficulty: 4
    type: numeric
    stem: "เชียงใหม่อยู่ละติจูด $18.79°$ เหนือ วันที่ 21 ธันวาคม (เดคลิเนชัน $-23.44°$) ความเข้มแสงอาทิตย์บนพื้นราบตอนเที่ยงที่ยอดบรรยากาศเหนือเชียงใหม่เท่ากับกี่ $\\mathrm{W/m^2}$ ($S = 1{,}361\\ \\mathrm{W/m^2}$)"
