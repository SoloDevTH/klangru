      - { id: c, text: "ไม่มีงาน เพราะเท้าแตะลูกบอลเพียงชั่วขณะ", feedback: "แม้ช่วงสัมผัสจะสั้น ลูกบอลก็เคลื่อนที่ไปได้ระยะหนึ่งตามแนวแรงขณะถูกดัน จึงมีงาน และลูกบอลได้พลังงาน" }
    hints:
      - "แรงกับการกระจัดมีทิศเดียวกันหรือสวนกัน"
      - "งานคือการถ่ายโอนพลังงานจากผู้ออกแรงไปยังวัตถุ"
    solution: "แรงจากเท้ามีทิศเดียวกับการกระจัดของลูกบอล งานจึงเป็นบวก พลังงานถูกถ่ายโอนจากเท้าไปเป็นพลังงานจลน์ของลูกบอล"
