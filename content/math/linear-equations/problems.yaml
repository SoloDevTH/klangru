    answer: { value: 2, unit: ชั่วโมง }
    hints:
      - "ตอนที่ตามทัน ทั้งสองคันอยู่ห่างจากกรุงเทพฯ เท่ากัน"
      - "ให้ $t$ เป็นเวลาที่รถเก๋งขับ รถตู้ขับนานกว่า 30 นาที คือ $t + 0.5$ ชั่วโมง"
