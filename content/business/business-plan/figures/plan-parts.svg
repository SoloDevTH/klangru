<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="sans-serif" font-size="14">
  <title>องค์ประกอบของแผนธุรกิจแปดส่วน</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
  <text x="380.0" y="28.0" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="bold">แผนธุรกิจตอบคำถามแปดข้อ</text>
  <rect x="13.0" y="50.0" width="176.0" height="90.0" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1"/>
  <text x="101.0" y="86.0" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="bold">1 บทสรุป</text>
  <text x="101.0" y="112.0" text-anchor="middle" fill="#1f2937" font-size="12">ธุรกิจอะไร ใช้เงินเท่าไร</text>
  <rect x="199.0" y="50.0" width="176.0" height="90.0" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/>
  <text x="287.0" y="86.0" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="bold">2 สินค้าหรือบริการ</text>
  <text x="287.0" y="112.0" text-anchor="middle" fill="#1f2937" font-size="12">แก้ปัญหาอะไรให้ลูกค้า</text>
  <rect x="385.0" y="50.0" width="176.0" height="90.0" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/>
  <text x="473.0" y="86.0" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="bold">3 ลูกค้าและตลาด</text>
  <text x="473.0" y="112.0" text-anchor="middle" fill="#1f2937" font-size="12">ใคร กี่คน ซื้อบ่อยแค่ไหน</text>
  <rect x="571.0" y="50.0" width="176.0" height="90.0" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/>
  <text x="659.0" y="86.0" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="bold">4 คู่แข่งและความได้เปรียบ</text>
  <text x="659.0" y="112.0" text-anchor="middle" fill="#1f2937" font-size="12">ทำไมลูกค้าเลือกเรา</text>
  <rect x="13.0" y="164.0" width="176.0" height="90.0" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/>
  <text x="101.0" y="200.0" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="bold">5 แผนการตลาด</text>
  <text x="101.0" y="226.0" text-anchor="middle" fill="#1f2937" font-size="12">ราคา ช่องทาง การส่งเสริม</text>
  <rect x="199.0" y="164.0" width="176.0" height="90.0" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/>
  <text x="287.0" y="200.0" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="bold">6 แผนการดำเนินงาน</text>
  <text x="287.0" y="226.0" text-anchor="middle" fill="#1f2937" font-size="12">วัตถุดิบ คน เวลา สถานที่</text>
  <rect x="385.0" y="164.0" width="176.0" height="90.0" rx="8" fill="#ffedd5" stroke="#1f2937" stroke-width="1"/>
  <text x="473.0" y="200.0" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="bold">7 แผนการเงิน</text>
  <text x="473.0" y="226.0" text-anchor="middle" fill="#1f2937" font-size="12">ลงทุน ยอดขาย ต้นทุน คุ้มทุน</text>
  <rect x="571.0" y="164.0" width="176.0" height="90.0" rx="8" fill="#ffedd5" stroke="#1f2937" stroke-width="1"/>
  <text x="659.0" y="200.0" text-anchor="middle" fill="#1f2937" font-size="13.5" font-weight="bold">8 ความเสี่ยง</text>
  <text x="659.0" y="226.0" text-anchor="middle" fill="#1f2937" font-size="12">ถ้าไม่เป็นตามแผน ทำอย่างไร</text>
  <rect x="13.0" y="290.0" width="734.0" height="50.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="380.0" y="320.0" text-anchor="middle" fill="#1f2937" font-size="14">ทดลองขายจริง → เก็บข้อมูล → ปรับแผน (แผนธุรกิจไม่ได้เขียนครั้งเดียวจบ)</text>
</svg>
