id: business.econ.cooperatives
subject: business
title:
  th: สหกรณ์และการรวมกลุ่มทางเศรษฐกิจในชุมชน
  en: Cooperatives and local economic groups
summary: หลักการและประโยชน์ของสหกรณ์ สหกรณ์เจ็ดประเภทในไทย ปันผลและเฉลี่ยคืน กลุ่มออมทรัพย์ วิสาหกิจชุมชน และความสัมพันธ์ระหว่างเศรษฐกิจพอเพียงกับสหกรณ์
