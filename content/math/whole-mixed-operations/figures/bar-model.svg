<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" font-family="sans-serif" font-size="16">
  <title>แบบจำลองบาร์ ซื้อสมุด 3 เล่ม เล่มละ 15 บาท จ่าย 100 บาท</title>
  <rect x="0" y="0" width="600" height="230" fill="#ffffff"/>
  <text x="300.0" y="40.0" font-size="16" text-anchor="middle" fill="#15211e" font-weight="bold">จ่าย 100 บาท</text>
  <line x1="40.0" y1="52.0" x2="560.0" y2="52.0" stroke="#6b7a76" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40.0" y1="46.0" x2="40.0" y2="58.0" stroke="#6b7a76" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="560.0" y1="46.0" x2="560.0" y2="58.0" stroke="#6b7a76" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="40.0" y="70.0" width="78.0" height="44.0" rx="0" fill="#e2f0ed" stroke="#15211e" stroke-width="1.5"/>
  <text x="79.0" y="98.0" font-size="16" text-anchor="middle" fill="#15211e">15</text>
  <rect x="118.0" y="70.0" width="78.0" height="44.0" rx="0" fill="#e2f0ed" stroke="#15211e" stroke-width="1.5"/>
  <text x="157.0" y="98.0" font-size="16" text-anchor="middle" fill="#15211e">15</text>
  <rect x="196.0" y="70.0" width="78.0" height="44.0" rx="0" fill="#e2f0ed" stroke="#15211e" stroke-width="1.5"/>
  <text x="235.0" y="98.0" font-size="16" text-anchor="middle" fill="#15211e">15</text>
  <rect x="274.0" y="70.0" width="286.0" height="44.0" rx="0" fill="#fde7c8" stroke="#15211e" stroke-width="1.5"/>
  <text x="417.0" y="98.0" font-size="16" text-anchor="middle" fill="#15211e" font-weight="bold">เงินทอน ?</text>
  <line x1="40.0" y1="130.0" x2="274.0" y2="130.0" stroke="#0a6b60" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40.0" y1="124.0" x2="40.0" y2="136.0" stroke="#0a6b60" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="274.0" y1="124.0" x2="274.0" y2="136.0" stroke="#0a6b60" stroke-width="1.5" stroke-linecap="round"/>
  <text x="157.0" y="154.0" font-size="15" text-anchor="middle" fill="#0a6b60">ขั้นที่ 1: 3 × 15 = 45</text>
  <text x="417.0" y="154.0" font-size="15" text-anchor="middle" fill="#c2410c">ขั้นที่ 2: 100 − 45 = 55</text>
  <text x="300.0" y="194.0" font-size="16" text-anchor="middle" fill="#15211e" font-weight="bold">ประโยคสัญลักษณ์: 100 − 3 × 15 = □</text>
</svg>
