  - ถ้าผลเกิดซ้ำหลายครั้ง เราจะมั่นใจขึ้นหรือไม่
  solution: การทำซ้ำช่วยลดผลของความบังเอิญและความแตกต่างของสิ่งมีชีวิตแต่ละตัว ทำให้ผลน่าเชื่อถือมากขึ้น
