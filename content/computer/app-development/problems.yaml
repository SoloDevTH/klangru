problems:
  - id: computer.projects.app-development.p001
    topics: [computer.projects.app-development]
    difficulty: 1
    type: mcq
    stem: "ในแอปพลิเคชัน ข้อใดเป็น **เหตุการณ์ (event)** ที่ทำให้ตัวจัดการเหตุการณ์ทำงาน"
    choices:
      - { id: a, text: "ผู้ใช้แตะปุ่ม \"คำนวณ\"", correct: true }
      - { id: b, text: "ตัวแปร total", feedback: "ตัวแปรเก็บข้อมูล ไม่ใช่สิ่งที่เกิดขึ้น" }
      - { id: c, text: "สูตรคำนวณพลังงานไฟฟ้า", feedback: "สูตรเป็นสิ่งที่ตัวจัดการอาจใช้ แต่ไม่ใช่เหตุการณ์" }
      - { id: d, text: "สีพื้นหลังของหน้าจอ", feedback: "สีเป็นลักษณะของหน้าจอ ไม่ได้เกิดขึ้นเป็นครั้ง ๆ" }
    hints:
      - "เหตุการณ์คือสิ่งที่เกิดขึ้น ณ เวลาหนึ่ง"
      - "ผู้ใช้ทำอะไรกับแอปได้บ้าง"
    solution: "การแตะปุ่มเป็นเหตุการณ์ แอปจะเรียกตัวจัดการที่ผูกกับปุ่มนั้น เหตุการณ์อื่นเช่น พิมพ์ข้อความ ตัวจับเวลาครบ หรือเซนเซอร์ส่งค่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.app-development.p002
    topics: [computer.projects.app-development]
    difficulty: 1
    type: match
    stem: "จับคู่แอปที่นักเรียนอยากทำกับวิชาที่ต้องใช้ความรู้มากที่สุด"
    pairs:
      - { left: "แอปคำนวณค่าไฟจากกำลังไฟฟ้าและชั่วโมงใช้งาน", right: "วิทยาศาสตร์ (พลังงานไฟฟ้า)" }
      - { left: "แอปฝึกใช้คำราชาศัพท์", right: "ภาษาไทย" }
      - { left: "แอปแผนที่แหล่งเรียนรู้ในชุมชน", right: "สังคมศึกษา" }
      - { left: "แอปบันทึกการวิ่งและอัตราการเต้นของหัวใจ", right: "สุขศึกษาและพลศึกษา" }
    hints:
      - "แอปแต่ละแบบต้องรู้เนื้อหาเรื่องใดจึงจะคำนวณหรือให้ข้อมูลได้ถูก"
      - "ราชาศัพท์เป็นเรื่องของภาษา"
    solution: "แอปที่บูรณาการกับวิชาอื่นต้องใช้ความรู้ของวิชานั้นให้ถูกต้อง เช่น สูตรพลังงานไฟฟ้า หลักการใช้ราชาศัพท์ ข้อมูลชุมชน และหลักการออกกำลังกาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.app-development.p003
    topics: [computer.projects.app-development]
    difficulty: 2
    type: numeric
    stem: "แอปค่าไฟคำนวณพลังงานของเครื่องปรับอากาศ 1,000 W ที่เปิด 8 ชั่วโมง ได้กี่ kWh"
    answer: { value: 8, unit: "kWh" }
    hints:
      - "พลังงาน (kWh) = กำลังไฟฟ้า (W) × เวลา (h) ÷ 1000"
      - "1,000 × 8 แล้วหาร 1000"
    misconceptions:
      - { match: 8000, feedback: "ได้หน่วยวัตต์-ชั่วโมง ต้องหาร 1000 เพื่อแปลงเป็นกิโลวัตต์-ชั่วโมง" }
      - { match: 125, feedback: "หารกำลังด้วยเวลา แต่พลังงานคือกำลังคูณเวลา" }
    solution: "1,000 × 8 ÷ 1000 = 8 kWh (8 หน่วย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.app-development.p004
    topics: [computer.projects.app-development]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการทำโครงงานแอปบันทึกขยะชายหาดของชุมชน"
    items:
      - "สัมภาษณ์อาสาสมัครเก็บขยะว่าต้องการรู้ข้อมูลอะไร"
      - "แยกปัญหาเป็นส่วนย่อยและเขียนอัลกอริทึม"
      - "ออกแบบหน้าจอ ข้อมูลที่เก็บ และเหตุการณ์"
      - "สร้างต้นแบบที่บันทึกชนิดและจำนวนขยะได้"
      - "ให้อาสาสมัครลองใช้แล้วปรับปรุง"
      - "นำเสนอผล ข้อจำกัด และแผนต่อไป"
    hints:
      - "เริ่มจากผู้ใช้และปัญหา"
      - "ต้องมีต้นแบบก่อนจึงทดสอบกับผู้ใช้ได้"
    solution: "ระบุปัญหาและผู้ใช้ → คิดเชิงคำนวณ → ออกแบบ → สร้างต้นแบบ → ทดสอบและปรับปรุง → นำเสนอ ขั้นทดสอบและปรับปรุงอาจวนหลายรอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.app-development.p005
    topics: [computer.projects.app-development]
    difficulty: 2
    type: text
    stem: "ฟังก์ชันที่ผูกไว้กับเหตุการณ์ และถูกเรียกเมื่อเหตุการณ์นั้นเกิด เช่น ฟังก์ชันที่ทำงานเมื่อกดปุ่ม เรียกว่าอะไร (ไทยหรืออังกฤษ)"
    accepted: ["ตัวจัดการเหตุการณ์", "event handler", "handler", "อีเวนต์แฮนด์เลอร์", "ตัวจัดการ"]
    misconceptions:
      - { match: "วงวนเหตุการณ์", feedback: "วงวนเหตุการณ์คอยรับเหตุการณ์แล้วส่งต่อ ส่วนฟังก์ชันที่ทำงานกับเหตุการณ์มีชื่ออื่น" }
      - { match: "event loop", feedback: "event loop คือส่วนที่คอยรับเหตุการณ์ ไม่ใช่ฟังก์ชันที่ผูกกับเหตุการณ์" }
    hints:
      - "ฟังก์ชันนี้จัดการกับเหตุการณ์"
      - "ภาษาอังกฤษลงท้ายด้วย handler"
    solution: "ตัวจัดการเหตุการณ์ (event handler) เช่น on_add ในบทเรียน ถูกเรียกทุกครั้งที่เกิดเหตุการณ์ add"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.app-development.p006
    topics: [computer.projects.app-development]
    difficulty: 3
    type: numeric
    stem: "บ้านหนึ่งเปิดโทรทัศน์ 120 W วันละ 5 ชั่วโมง 30 วัน แอปคิดค่าไฟสมมติหน่วยละ 4 บาท ค่าไฟของโทรทัศน์เดือนนี้กี่บาท"
    answer: { value: 72, unit: "บาท" }
    hints:
      - "หาพลังงานทั้งเดือนก่อน: 120 × 5 × 30 ÷ 1000"
      - "คูณจำนวนหน่วยด้วย 4 บาท"
    misconceptions:
      - { match: 18, feedback: "18 คือจำนวนหน่วย (kWh) ยังไม่ได้คูณราคา" }
      - { match: 72000, feedback: "ลืมหาร 1000 เพื่อแปลงวัตต์-ชั่วโมงเป็นหน่วย" }
      - { match: 2.4, feedback: "คิดแค่วันเดียว ต้องคูณ 30 วัน" }
    solution: "120 × 5 × 30 ÷ 1000 = 18 kWh × 4 บาท = 72 บาท (อัตราสมมติ อัตราจริงเป็นขั้นบันไดและมีค่าไฟฟ้าผันแปร)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.app-development.p007
    topics: [computer.projects.app-development]
    difficulty: 3
    type: numeric
    stem: |
      จำลองแอปค่าไฟแบบขับเคลื่อนด้วยเหตุการณ์ โปรแกรมนี้แสดงตัวเลขใด

      ```python
      def on_add(state, watts, hours):
          state["kwh"] += watts * hours / 1000

      def on_clear(state):
          state["kwh"] = 0

      handlers = {"add": on_add, "clear": on_clear}
      events = [("add", 2000, 1), ("clear",), ("add", 500, 4), ("add", 100, 10)]

      state = {"kwh": 0}
      for name, *args in events:
          handlers[name](state, *args)
      print(state["kwh"])
      ```
    answer: { value: 3, unit: "kWh" }
    hints:
      - "ไล่เหตุการณ์ทีละตัวตามลำดับ และดูค่า state[\"kwh\"] หลังแต่ละเหตุการณ์"
      - "เหตุการณ์ clear ตั้งค่ากลับเป็น 0"
    misconceptions:
      - { match: 5, feedback: "ลืมว่าเหตุการณ์ clear ล้างค่า 2 kWh ของเหตุการณ์แรกไปแล้ว" }
      - { match: 3000, feedback: "ลืมหาร 1000" }
    solution: "add 2000 W × 1 h = 2 → clear เป็น 0 → add 500 × 4 = 2 → add 100 × 10 = 1 รวม 3.0 kWh"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.app-development.p008
    topics: [computer.projects.app-development]
    difficulty: 3
    type: match
    stem: "จับคู่ขั้นของแนวคิดเชิงคำนวณกับสิ่งที่กลุ่มทำในโครงงานแอปค่าไฟ"
    pairs:
      - { left: "แยกปัญหาเป็นส่วนย่อย", right: "แบ่งเป็น กรอกข้อมูล คำนวณ แสดงผล แนะนำ" }
      - { left: "หารูปแบบ", right: "ทุกเครื่องใช้สูตร วัตต์ × ชั่วโมง ÷ 1000 เหมือนกัน" }
      - { left: "แนวคิดเชิงนามธรรม", right: "เก็บแค่วัตต์และชั่วโมง ไม่ต้องเก็บยี่ห้อหรือสี" }
      - { left: "ออกแบบอัลกอริทึม", right: "เขียนขั้นตอน รวมพลังงานทุกเครื่องแล้วหาเครื่องที่ใช้มากที่สุด" }
    hints:
      - "นามธรรม = เลือกเฉพาะสาระสำคัญ"
      - "รูปแบบ = สิ่งที่ซ้ำกัน"
    solution: "แยกส่วนย่อยคือแบ่งงาน หารูปแบบคือเห็นว่าทุกเครื่องคำนวณเหมือนกัน นามธรรมคือตัดรายละเอียดที่ไม่ใช้ และอัลกอริทึมคือขั้นตอนที่ชัดเจน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.app-development.p009
    topics: [computer.projects.app-development]
    difficulty: 3
    type: mcq
    stem: "แอปบันทึกการตรวจคุณภาพน้ำของโรงเรียนจะใช้ที่ลำห้วยในป่า ซึ่งไม่มีสัญญาณโทรศัพท์ ควรออกแบบอย่างไร"
    choices:
      - { id: a, text: "บันทึกข้อมูลในเครื่องได้แม้ไม่มีสัญญาณ แล้วส่งขึ้นเซิร์ฟเวอร์เมื่อกลับมาถึงที่มีอินเทอร์เน็ต", correct: true }
      - { id: b, text: "ให้แอปบันทึกได้เฉพาะตอนต่ออินเทอร์เน็ต", feedback: "ที่ลำห้วยไม่มีสัญญาณ จะบันทึกไม่ได้เลย" }
      - { id: c, text: "ให้จดในกระดาษแล้วไม่ต้องใช้แอป", feedback: "ไม่ได้ใช้ประโยชน์ของแอป และพิมพ์ซ้ำทีหลังผิดได้" }
      - { id: d, text: "ส่งข้อมูลทุกวินาทีไปเซิร์ฟเวอร์", feedback: "ไม่มีสัญญาณจึงส่งไม่ได้ และเปลืองแบตเตอรี่" }
    hints:
      - "การเชื่อมต่อเป็นหนึ่งในเรื่องที่ต้องคิดทุกแพลตฟอร์ม"
      - "แอปควรทำงานได้แม้ไม่มีอินเทอร์เน็ตหรือไม่"
    solution: "แอปต้องทำงานแบบออฟไลน์ได้ เก็บข้อมูลในเครื่องก่อน แล้วซิงก์เมื่อมีสัญญาณ เป็นการออกแบบตามสภาพการใช้งานจริงของผู้ใช้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.app-development.p010
    topics: [computer.projects.app-development]
    difficulty: 4
    type: numeric
    stem: |
      แอปทายคำศัพท์ให้ 10 คะแนนเมื่อตอบถูก และโบนัส 20 คะแนนเมื่อตอบถูกติดกันตั้งแต่ 3 ข้อขึ้นไปตอนที่ตัวจับเวลาส่งเหตุการณ์ bonus โปรแกรมจำลองนี้แสดงคะแนนเท่าใด

      ```python
      def on_correct(s):
          s["score"] += 10
          s["streak"] += 1

      def on_wrong(s):
          s["streak"] = 0

      def on_bonus(s):
          if s["streak"] >= 3:
              s["score"] += 20

      h = {"correct": on_correct, "wrong": on_wrong, "bonus": on_bonus}
      s = {"score": 0, "streak": 0}
      for e in ["correct", "correct", "bonus", "correct", "bonus", "wrong", "bonus"]:
          h[e](s)
      print(s["score"])
      ```
    answer: { value: 50, unit: "คะแนน" }
    hints:
      - "จดค่า score และ streak หลังแต่ละเหตุการณ์"
      - "bonus ครั้งแรกเกิดตอน streak = 2 และครั้งสุดท้ายเกิดหลัง wrong"
    misconceptions:
      - { match: 30, feedback: "ลืมโบนัสครั้งที่สอง ซึ่งเกิดตอน streak = 3" }
      - { match: 90, feedback: "ให้โบนัสทุกครั้งที่มีเหตุการณ์ bonus แต่ต้องมี streak ตั้งแต่ 3" }
    solution: "correct (10, 1) → correct (20, 2) → bonus streak 2 ไม่ได้ → correct (30, 3) → bonus +20 = 50 → wrong streak 0 → bonus ไม่ได้ ได้ 50 คะแนน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.app-development.p011
    topics: [computer.projects.app-development]
    difficulty: 4
    type: mcq
    stem: "กลุ่มมีเวลา 4 สัปดาห์ทำแอปค่าไฟ มีรายการความสามารถที่อยากได้มาก ควรเลือกทำอะไรเป็นผลิตภัณฑ์ขั้นต่ำ (MVP) ก่อน"
    choices:
      - { id: a, text: "กรอกเครื่องใช้ไฟฟ้า คำนวณพลังงานและค่าไฟรวม แล้วแสดงเครื่องที่ใช้มากที่สุด", correct: true }
      - { id: b, text: "ระบบสมาชิก ล็อกอิน และรูปโปรไฟล์", feedback: "ไม่ได้ช่วยแก้ปัญหาหลักเรื่องค่าไฟ ทำทีหลังได้" }
      - { id: c, text: "ธีมสีให้เลือก 10 แบบและแอนิเมชันหน้าแรก", feedback: "สวยงามแต่ไม่ใช่ความสามารถหลัก" }
      - { id: d, text: "ทำทุกอย่างพร้อมกันให้ครบในครั้งเดียว", feedback: "เสี่ยงที่จะเสร็จไม่ทันและไม่มีอะไรใช้ได้จริงเลย" }
    hints:
      - "MVP คือความสามารถหลักที่เล็กที่สุดที่ใช้แก้ปัญหาได้จริง"
      - "ปัญหาของผู้ใช้คืออะไร"
    solution: "MVP ต้องแก้ปัญหาหลักได้ คืออยากรู้ว่าเครื่องใดกินไฟ เมื่อใช้ได้และทดสอบแล้วจึงค่อยเพิ่มส่วนอื่นในรอบถัดไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.projects.app-development.p012
    topics: [computer.projects.app-development]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "กลุ่มจะนำแอปแบบทดสอบคำศัพท์ไปให้นักเรียนทั้งโรงเรียนใช้บนโทรศัพท์หลายรุ่น ข้อใดเป็นเรื่องที่ต้องคิดเพื่อให้ใช้ได้ทุกแพลตฟอร์ม (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ปุ่มใหญ่พอให้แตะบนจอเล็ก และหน้าจอปรับตามขนาดเครื่อง", correct: true, feedback: "ขนาดจอและวิธีรับข้อมูลต่างกันในแต่ละเครื่อง" }
      - { id: b, text: "ขอสิทธิ์เข้าถึงเฉพาะที่ใช้ ไม่ขอรายชื่อผู้ติดต่อหรือตำแหน่ง", correct: true, feedback: "ความเป็นส่วนตัวและสิทธิ์เป็นเรื่องร่วมของทุกแพลตฟอร์ม" }
      - { id: c, text: "ทดสอบบนโทรศัพท์รุ่นเก่าที่หน่วยความจำน้อยด้วย", correct: true, feedback: "ผู้ใช้บางคนใช้เครื่องรุ่นเก่า แอปต้องไม่ช้าหรือค้าง" }
      - { id: d, text: "ออกแบบให้ใช้ได้เฉพาะเครื่องรุ่นล่าสุดที่ทีมใช้", feedback: "ผู้ใช้จำนวนมากจะใช้ไม่ได้" }
      - { id: e, text: "ใช้ตัวอักษรเล็กที่สุดเพื่อให้ใส่ข้อความได้มาก", feedback: "อ่านยากและขัดกับการเข้าถึงได้" }
    hints:
      - "ทบทวนรายการเรื่องที่ต้องคิดทุกแพลตฟอร์มในบทเรียน"
      - "ผู้ใช้มีเครื่องและความสามารถหลากหลาย"
    solution: "ข้อ a, b และ c ถูก ครอบคลุมขนาดจอและการรับข้อมูล ความเป็นส่วนตัว และประสิทธิภาพบนเครื่องรุ่นเก่า ข้อ d และ e ทำให้ผู้ใช้จำนวนมากใช้ไม่ได้หรือใช้ลำบาก"
