<text x="112.4" y="136.2" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">1</text>
<circle cx="105.8" cy="263.2" r="12.0" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
<text x="105.8" y="268.2" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">1</text>
<circle cx="174.0" cy="289.6" r="12.0" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
<text x="174.0" y="294.6" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">2</text>
<circle cx="306.0" cy="245.6" r="12.0" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
<text x="306.0" y="250.6" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">3</text>
<circle cx="180.6" cy="371.0" r="12.0" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
<text x="180.6" y="376.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">4</text>
<circle cx="99.2" cy="558.0" r="12.0" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
<text x="99.2" y="563.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">5</text>
<circle cx="171.8" cy="571.2" r="12.0" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
<text x="171.8" y="576.2" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">6</text>
<circle cx="182.8" cy="344.6" r="3.5" fill="#111" stroke="none" stroke-width="1.5"/>
<text x="188.8" y="338.6" text-anchor="start" font-size="11" fill="#222">กรุงเทพฯ</text>
<text x="328.0" y="421.6" text-anchor="middle" font-size="12" fill="#1e3a8a">อ่าวไทย</text>
<text x="59.6" y="456.8" text-anchor="middle" font-size="12" fill="#1e3a8a">ทะเลอันดามัน</text>
<text x="505.0" y="38.0" text-anchor="start" font-size="15" fill="#111" font-weight="bold">ภัยที่พบบ่อยในแต่ละพื้นที่</text>
<rect x="505.0" y="46.0" width="22.0" height="22.0" rx="0" fill="#a16207" stroke="none" stroke-width="1.5" opacity="0.55"/>
<text x="516.0" y="63.0" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">1</text>
<text x="537.0" y="62.0" text-anchor="start" font-size="13" fill="#111" font-weight="bold">ภาคเหนือและภาคตะวันตก (ภูเขาสูงชัน)</text>
<text x="537.0" y="81.0" text-anchor="start" font-size="12" fill="#333">• น้ำป่าไหลหลาก ดินถล่ม</text>
<text x="537.0" y="98.0" text-anchor="start" font-size="12" fill="#333">• แผ่นดินไหวจากรอยเลื่อนมีพลัง</text>
<rect x="505.0" y="124.0" width="22.0" height="22.0" rx="0" fill="#2563eb" stroke="none" stroke-width="1.5" opacity="0.55"/>
<text x="516.0" y="141.0" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">2</text>
<text x="537.0" y="140.0" text-anchor="start" font-size="13" fill="#111" font-weight="bold">ที่ราบภาคกลาง (ลุ่มแม่น้ำเจ้าพระยา)</text>
<text x="537.0" y="159.0" text-anchor="start" font-size="12" fill="#333">• น้ำล้นตลิ่ง น้ำท่วมขังนาน</text>
<rect x="505.0" y="185.0" width="22.0" height="22.0" rx="0" fill="#ea580c" stroke="none" stroke-width="1.5" opacity="0.55"/>
<text x="516.0" y="202.0" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">3</text>
<text x="537.0" y="201.0" text-anchor="start" font-size="13" fill="#111" font-weight="bold">ภาคตะวันออกเฉียงเหนือ</text>
<text x="537.0" y="220.0" text-anchor="start" font-size="12" fill="#333">• ภัยแล้ง ฝนทิ้งช่วง</text>
<text x="537.0" y="237.0" text-anchor="start" font-size="12" fill="#333">• น้ำท่วมลุ่มแม่น้ำชีและมูล</text>
<rect x="505.0" y="263.0" width="22.0" height="22.0" rx="0" fill="#dc2626" stroke="none" stroke-width="1.5" opacity="0.55"/>
<text x="516.0" y="280.0" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">4</text>
<text x="537.0" y="279.0" text-anchor="start" font-size="13" fill="#111" font-weight="bold">ชายฝั่งอ่าวไทยตอนบน และกรุงเทพฯ</text>
<text x="537.0" y="298.0" text-anchor="start" font-size="12" fill="#333">• การกัดเซาะชายฝั่ง แผ่นดินทรุด</text>
<rect x="505.0" y="324.0" width="22.0" height="22.0" rx="0" fill="#7c3aed" stroke="none" stroke-width="1.5" opacity="0.55"/>
<text x="516.0" y="341.0" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">5</text>
<text x="537.0" y="340.0" text-anchor="start" font-size="13" fill="#111" font-weight="bold">ชายฝั่งทะเลอันดามัน</text>
<text x="537.0" y="359.0" text-anchor="start" font-size="12" fill="#333">• สึนามิ (นาน ๆ ครั้ง แต่รุนแรง)</text>
<text x="537.0" y="376.0" text-anchor="start" font-size="12" fill="#333">• คลื่นลมแรงช่วงมรสุมตะวันตกเฉียงใต้</text>
<rect x="505.0" y="402.0" width="22.0" height="22.0" rx="0" fill="#0d9488" stroke="none" stroke-width="1.5" opacity="0.55"/>
<text x="516.0" y="419.0" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">6</text>
<text x="537.0" y="418.0" text-anchor="start" font-size="13" fill="#111" font-weight="bold">ภาคใต้ฝั่งอ่าวไทย</text>
<text x="537.0" y="437.0" text-anchor="start" font-size="12" fill="#333">• น้ำท่วมใหญ่และดินถล่มช่วงปลายปี</text>
<text x="537.0" y="454.0" text-anchor="start" font-size="12" fill="#333">• พายุ การกัดเซาะชายฝั่ง</text>
<text x="505.0" y="504.0" text-anchor="start" font-size="12" fill="#333">หลุมยุบพบได้ในพื้นที่หินปูนหลายภาค</text>
<text x="505.0" y="522.0" text-anchor="start" font-size="12" fill="#333">ภัยแล้ง ฟ้าผ่า และพายุฤดูร้อนเกิดได้ทั่วประเทศ</text>
<text x="505.0" y="550.0" text-anchor="start" font-size="11" fill="#666">แผนที่ร่างเพื่อการเรียนเท่านั้น</text>
<text x="505.0" y="566.0" text-anchor="start" font-size="11" fill="#666">ขอบเขตพื้นที่โดยประมาณ ไม่ใช่แผนที่เสี่ยงภัยจริง</text>
</svg>