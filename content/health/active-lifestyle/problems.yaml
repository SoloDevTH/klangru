problems:
- id: health.fitness.active-lifestyle.p001
  topics:
  - health.fitness.active-lifestyle
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นกิจกรรมระดับปานกลางถึงหนัก (ทำให้หายใจเร็วขึ้นและเหงื่อออก)
  choices:
  - id: a
    text: นั่งอ่านหนังสือในห้องสมุด
    feedback: เป็นกิจกรรมเนือยนิ่ง ใช้พลังงานต่ำ
  - id: b
    text: ปั่นจักรยานเร็วไปโรงเรียนจนหายใจแรงขึ้นมาก
    correct: true
  - id: c
    text: ยืนรอรถเมล์เฉย ๆ
    feedback: การยืนเฉย ๆ ใช้พลังงานต่ำ ยังไม่ถึงระดับปานกลาง
  - id: d
    text: นอนดูทีวีที่บ้าน
    feedback: เป็นพฤติกรรมเนือยนิ่ง
  hints:
  - ลองนึกถึงกิจกรรมที่ทำให้หายใจแรงขึ้นมากกว่าการนั่งหรือนอน
  - การนั่งดูทีวีหรือยืนเฉย ๆ ไม่ทำให้หายใจแรงขึ้น
  solution: การปั่นจักรยานเร็วทำให้หายใจแรงและเหงื่อออก จึงเป็นกิจกรรมระดับปานกลางถึงหนัก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.active-lifestyle.p002
  topics:
  - health.fitness.active-lifestyle
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นพฤติกรรมเนือยนิ่ง
  choices:
  - id: a
    text: นั่งดูการ์ตูนบนโซฟานานหลายชั่วโมง
    correct: true
  - id: b
    text: เดินเล่นกับน้องในสวน
    feedback: เป็นการเคลื่อนไหว ไม่ใช่พฤติกรรมเนือยนิ่ง
  - id: c
    text: ว่ายน้ำกับเพื่อน
    feedback: เป็นการออกแรงทั้งตัว ไม่ใช่พฤติกรรมเนือยนิ่ง
  - id: d
    text: ปั่นจักรยานไปตลาด
    feedback: เป็นการเคลื่อนไหว ไม่ใช่พฤติกรรมเนือยนิ่ง
  hints:
  - พฤติกรรมเนือยนิ่งคือการนั่ง เอน หรือนอนโดยใช้พลังงานต่ำ
  - ลองดูว่าข้อไหนไม่มีการเคลื่อนไหวเลย
  solution: การนั่งดูการ์ตูนบนโซฟานาน ๆ คือพฤติกรรมเนือยนิ่ง ส่วนการเดินเล่น ว่ายน้ำ และปั่นจักรยาน เป็นการเคลื่อนไหว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.active-lifestyle.p003
  topics:
  - health.fitness.active-lifestyle
  difficulty: 1
  type: match
  stem: จับคู่กิจกรรมกับระดับความหนัก
  pairs:
  - left: นอนดูหนังที่บ้าน
    right: เนือยนิ่ง
  - left: เดินเล่นกับน้องช้า ๆ
    right: เบา
  - left: ปั่นจักรยานไปโรงเรียนจนหายใจแรงขึ้น แต่ยังคุยกับเพื่อนเป็นประโยคได้
    right: ปานกลาง
  - left: วิ่งแข่งระยะสั้นจนพูดได้แค่เป็นคำ ๆ
    right: หนัก
  hints:
  - นอนดูหนังไม่ได้ทำให้หายใจแรงขึ้น
  - ลองดูว่ากิจกรรมไหนทำให้หายใจแรงขึ้นมากที่สุด
  solution: นอนดูหนัง = เนือยนิ่ง, เดินเล่นกับน้องช้า ๆ = เบา, ปั่นจักรยานจนหายใจแรงแต่ยังพูดเป็นประโยคได้ = ปานกลาง, วิ่งแข่งจนพูดได้แค่เป็นคำ ๆ = หนัก (ใช้การทดสอบการพูด)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.active-lifestyle.p004
  topics:
  - health.fitness.active-lifestyle
  difficulty: 2
  type: numeric
  stem: เด็กทำกิจกรรมปานกลางถึงหนัก 30 นาทีต่อวันตลอด 7 วัน รวม 210 นาทีต่อสัปดาห์ ถ้า WHO แนะนำเฉลี่ยวันละ 60 นาทีตลอดทั้งสัปดาห์ (รวม 420 นาทีต่อสัปดาห์) เด็กคนนี้ยังขาดกี่นาทีต่อสัปดาห์ (ตอบเป็นนาที)
  answer:
    value: 210
    tolerance: 0
    unit: นาที
  misconceptions:
  - match: 60
    feedback: นั่นคือเป้าต่อวัน ยังไม่ได้เทียบเป็นทั้งสัปดาห์
  - match: 30
    feedback: นั่นคือเวลาที่ทำได้ต่อวัน ไม่ใช่จำนวนที่ขาด
  hints:
  - เป้าวันละ 60 นาทีต้องคูณ 7 วันก่อนเทียบเป็นทั้งสัปดาห์
  - ลบเวลาที่ทำได้ออกจากเป้าทั้งสัปดาห์
  solution: เป้าทั้งสัปดาห์ = 60 × 7 = 420 นาที ทำได้ 30 × 7 = 210 นาที ขาดอยู่ 420 − 210 = 210 นาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.active-lifestyle.p005
  topics:
  - health.fitness.active-lifestyle
  difficulty: 2
  type: mcq
  stem: WHO แนะนำให้เด็กและวัยรุ่นอายุ 5–17 ปี ทำกิจกรรมที่หนักและเสริมความแข็งแรงของกล้ามเนื้อและกระดูกอย่างน้อยกี่วันต่อสัปดาห์
  choices:
  - id: a
    text: 1 วัน
    feedback: น้อยเกินไปตามข้อแนะนำ ควรทำอย่างน้อย 3 วันต่อสัปดาห์
  - id: b
    text: 2 วัน
    feedback: ยังน้อยกว่าที่แนะนำ ควรทำอย่างน้อย 3 วันต่อสัปดาห์
  - id: c
    text: 3 วัน
    correct: true
  - id: d
    text: 5 วัน
    feedback: ข้อแนะนำนี้ระบุอย่างน้อย 3 วัน ไม่ได้กำหนดว่าต้องทำ 5 วันเสมอไป
  - id: e
    text: 7 วัน
    feedback: ข้อแนะนำนี้ระบุอย่างน้อย 3 วัน ทำทุกวันไม่ได้เป็นข้อกำหนด
  hints:
  - ลองนึกถึงข้อแนะนำที่ระบุจำนวนวันขั้นต่ำ ไม่ได้บังคับให้ทำทุกวัน
  - ตัวเลขที่ถูกต้องน้อยกว่า 7 วัน
  solution: WHO แนะนำอย่างน้อย 3 วันต่อสัปดาห์ สำหรับกิจกรรมหนักและเสริมกล้ามเนื้อกระดูก ควบคู่กับกิจกรรมปานกลางถึงหนักเฉลี่ยวันละ 60 นาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.active-lifestyle.p006
  topics:
  - health.fitness.active-lifestyle
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็นเรื่องที่ควรทำเพื่อความปลอดภัยเมื่อออกกำลังกายกลางแจ้งในวันที่อากาศร้อนจัด (เลือกได้หลายข้อ)
  multiple: true
  choices:
  - id: a
    text: ดื่มน้ำก่อนและระหว่างออกกำลัง
    correct: true
  - id: b
    text: หลีกเลี่ยงช่วงแดดจัดที่สุด
    correct: true
  - id: c
    text: หยุดทันทีเมื่อเจ็บหน้าอกหรือหน้ามืด
    correct: true
  - id: d
    text: อดน้ำเพื่อให้เหงื่อออกมากขึ้น
    feedback: การอดน้ำทำให้ร่างกายขาดน้ำและอันตรายได้
  hints:
  - นึกถึงการดื่มน้ำและการหลบแดดจัด
  - การฝืนไม่กินน้ำหรือไม่พักไม่ปลอดภัย
  solution: ดื่มน้ำก่อนและระหว่างออกกำลัง หลีกเลี่ยงช่วงแดดจัด และหยุดทันทีเมื่อมีอาการผิดปกติ เช่น หน้ามืดหรือเจ็บหน้าอก เป็นสิ่งที่ควรทำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.active-lifestyle.p007
  topics:
  - health.fitness.active-lifestyle
  difficulty: 2
  type: text
  stem: กิจกรรมที่ทำโดยนั่ง เอน หรือนอน และใช้พลังงานต่ำ เรียกว่าอะไร (ตอบเป็นคำ)
  accepted:
  - พฤติกรรมเนือยนิ่ง
  - เนือยนิ่ง
  - sedentary
  hints:
  - คำนี้ฟังดูคล้ายคำว่า "เนื่อง" และ "นิ่ง"
  - นึกถึงการนั่งดูจอนาน ๆ ก็ได้
  solution: เรียกว่าพฤติกรรมเนือยนิ่ง (sedentary behaviour) ซึ่ง WHO แนะนำให้จำกัดเวลาเช่นนี้ โดยเฉพาะเวลาหน้าจอเพื่อความบันเทิง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.active-lifestyle.p008
  topics:
  - health.fitness.active-lifestyle
  difficulty: 3
  type: numeric
  stem: จากกราฟ ถ้าเด็กคนนี้เพิ่มเวลาเฉพาะวันที่ต่ำกว่าเป้าให้เป็น 60 นาทีพอดี (วันที่ถึงเป้าแล้วคงเดิม) ค่าเฉลี่ยต่อวันใหม่ของทั้งสัปดาห์เป็นกี่นาที (ตอบทศนิยม 1 ตำแหน่ง)
  answer:
    value: 66.429
    tolerance: 0.05
    unit: นาที
  misconceptions:
  - match: 60
    feedback: วันที่เกินเป้าอยู่แล้ว (จันทร์ 65 พุธ 70 เสาร์ 90) ยังคงเดิม ไม่ได้ลดลงเหลือ 60 ค่าเฉลี่ยจึงมากกว่า 60
  - match: 52.1
    feedback: นั่นคือค่าเฉลี่ยเดิมก่อนเพิ่มเวลา
  - match: 465
    feedback: นั่นคือผลรวมใหม่ทั้งสัปดาห์ ยังไม่ได้หารด้วย 7 วัน
  hints:
  - หาวันที่ต่ำกว่าเส้นประ 60 นาที แล้วเปลี่ยนค่าของวันเหล่านั้นเป็น 60
  - รวมเวลาใหม่ทั้ง 7 วัน แล้วหารด้วย 7
  solution: วันที่ต่ำกว่าเป้าคือ อังคาร 30 พฤหัสบดี 50 ศุกร์ 40 และอาทิตย์ 20 เปลี่ยนเป็น 60 ทั้งหมด ผลรวมใหม่ = 65 + 60 + 70 + 60 + 60 + 90 + 60 = 465 นาที เฉลี่ยวันละ 465 ÷ 7 ≈ 66.4 นาที
  figure:
    src: weekly-minutes.svg
    alt: กราฟแท่งแสดงเวลากิจกรรมปานกลางถึงหนักของเด็กตัวอย่างในแต่ละวันจันทร์ถึงอาทิตย์ มีเส้นประแนวนอนที่ระดับ 60 นาที แท่งวันจันทร์ 65 วันอังคาร 30 วันพุธ 70 วันพฤหัสบดี 50 วันศุกร์ 40 วันเสาร์ 90 และวันอาทิตย์ 20 นาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.active-lifestyle.p009
  topics:
  - health.fitness.active-lifestyle
  difficulty: 3
  type: mcq
  stem: จากกราฟ วันใดมีเวลากิจกรรมปานกลางถึงหนักน้อยที่สุด
  choices:
  - id: a
    text: วันจันทร์
    feedback: วันจันทร์มี 65 นาที ซึ่งไม่ใช่วันที่น้อยที่สุด
  - id: b
    text: วันพุธ
    feedback: วันพุธมี 70 นาที ซึ่งไม่ใช่วันที่น้อยที่สุด
  - id: c
    text: วันเสาร์
    feedback: วันเสาร์มี 90 นาที ซึ่งมากที่สุดในสัปดาห์นี้
  - id: d
    text: วันอาทิตย์
    correct: true
  hints:
  - ดูความสูงของแท่งแต่ละวันแล้วเปรียบเทียบ
  - แท่งที่สั้นที่สุดคือแท่งที่มีเวลาน้อยที่สุด
  solution: วันอาทิตย์มีเวลา 20 นาที น้อยที่สุดในสัปดาห์นี้
  figure:
    src: weekly-minutes.svg
    alt: กราฟแท่งแสดงเวลากิจกรรมปานกลางถึงหนักของเด็กตัวอย่างในแต่ละวัน มีเส้นประระดับ 60 นาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.active-lifestyle.p010
  topics:
  - health.fitness.active-lifestyle
  difficulty: 3
  type: order
  stem: เรียงระดับความหนักของกิจกรรมจากเบาไปหนัก
  items:
  - นั่งอ่านหนังสือ
  - เดินช้าไปตลาด
  - เดินเร็วไปโรงเรียนจนหายใจแรงขึ้น
  - วิ่งเร็วสลับเดิน
  hints:
  - เริ่มจากกิจกรรมที่นั่งอยู่กับที่
  - กิจกรรมที่ทำให้หายใจแรงที่สุดอยู่ท้ายสุด
  solution: นั่งอ่านหนังสือ (เนือยนิ่ง) < เดินช้าไปตลาด (เบา) < เดินเร็วไปโรงเรียนจนหายใจแรงขึ้น (ปานกลาง) < วิ่งเร็วสลับเดิน (หนัก)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.active-lifestyle.p011
  topics:
  - health.fitness.active-lifestyle
  difficulty: 3
  type: mcq
  stem: 'ทดสอบการพูดระหว่างทำกิจกรรม: ถ้าพูดได้เป็นประโยคแต่ร้องเพลงไม่ได้ ความหนักของกิจกรรมอยู่ระดับใด'
  choices:
  - id: a
    text: เบา
    feedback: ถ้าร้องเพลงได้สบาย จะอยู่ระดับเบา
  - id: b
    text: ปานกลาง
    correct: true
  - id: c
    text: หนัก
    feedback: ระดับหนักคือพูดได้เป็นคำ ๆ ไม่ใช่เป็นประโยค
  - id: d
    text: เนือยนิ่ง
    feedback: กิจกรรมเนือยนิ่งคือการนั่งหรือนอนใช้พลังงานต่ำ
  hints:
  - ลองนึกว่าเวลาวิ่งเร็ว ๆ เราพูดได้มากน้อยแค่ไหน
  - การทดสอบนี้เป็นการประเมินคร่าว ๆ ไม่ใช่การวัดที่แม่นยำ
  solution: การพูดได้เป็นประโยคแต่ร้องเพลงไม่ได้ เป็นระดับปานกลาง หากพูดได้เป็นคำ ๆ ถือว่าหนัก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.active-lifestyle.p012
  topics:
  - health.fitness.active-lifestyle
  difficulty: 3
  type: mcq
  stem: ข้อใดช่วยให้คนเข้าร่วมกิจกรรมกลางแจ้งได้มากขึ้น (เลือกได้หลายข้อ)
  multiple: true
  choices:
  - id: a
    text: เลือกช่วงเช้าหรือเย็นที่อากาศดีกว่า
    correct: true
  - id: b
    text: ดูดัชนีคุณภาพอากาศก่อนออกไป
    correct: true
  - id: c
    text: ชวนเพื่อนหรือครอบครัวไปด้วย
    correct: true
  - id: d
    text: เล่นตอนแดดจัดที่สุดโดยไม่พัก
    feedback: อาจเกิดอันตรายจากความร้อนและทำให้ไม่อยากเล่นต่อ
  hints:
  - ลองนึกว่าอะไรทำให้ไปเล่นข้างนอกได้ง่ายขึ้น เช่น เวลาที่เหมาะ และคุณภาพอากาศ
  - การเล่นหนักในช่วงแดดจัดโดยไม่พักไม่ช่วยให้อยากเข้าร่วม
  solution: เลือกเวลาที่อากาศดี ดูคุณภาพอากาศก่อนออกไป และชวนเพื่อนหรือครอบครัวไปด้วย ช่วยให้เข้าร่วมได้มากขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.fitness.active-lifestyle.p013
  topics:
  - health.fitness.active-lifestyle
  difficulty: 3
  type: match
  stem: จับคู่สถานที่ในชุมชนกับกิจกรรมที่ทำได้
  pairs:
  - left: สวนสาธารณะ
