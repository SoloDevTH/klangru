topic: computer.algorithms.searching-sorting
rows:
  - { framework: csta-k12-cs, indicators: ["3A-AP-15"], coverage: full, note: "ชั่งความอ่านง่ายกับประสิทธิภาพในการเลือกอัลกอริทึมและโครงสร้างควบคุม (for ที่ return ทันทีเมื่อเจอ while สำหรับทวิภาค เรียงครั้งเดียวแล้วค้นทวิภาคเมื่อค้นบ่อย ใช้ sorted ในงานจริง) พร้อมบอกข้อดีข้อเสียของทางที่เลือก" }
  - { framework: uk-nc-computing, indicators: ["UKNC-CO-KS3-02"], coverage: full, note: "ค้นหาแบบลำดับและทวิภาค เรียงแบบเลือก แทรก และผสาน และใช้เหตุผลเชิงตรรกะ (นับขั้น บิ๊กโอ การทดลองขยายข้อมูล) เปรียบเทียบอัลกอริทึมสำหรับปัญหาเดียวกัน" }
  - { framework: acm-cs2023, indicators: ["SDF-Algorithms"], coverage: partial, note: "แนวคิดของประสิทธิภาพ การค้นหาและการเรียงลำดับ และผลต่อเวลา ยังไม่มีการท่องต้นไม้และกราฟ ซึ่งอยู่ใน computer.algorithms.data-structures" }
  - { framework: acm-cs2023, indicators: ["AL-Foundational"], coverage: partial, note: "อัลกอริทึมค้นหาและเรียงลำดับบนลิสต์ ส่วนสแตก คิว ตารางแฮช ต้นไม้ กราฟ และอัลกอริทึมกราฟอยู่ใน computer.algorithms.data-structures" }
  - { framework: acm-cs2023, indicators: ["AL-Strategies"], coverage: partial, note: "ลองทุกทาง (ค้นหาแบบลำดับ ตรวจเลขซ้ำทุกคู่ ลองรหัสล็อก) แบ่งแยกและเอาชนะ (ทวิภาค เรียงแบบผสาน) และการโตแบบเลขชี้กำลังของการลองทุกทาง ยังไม่มีอัลกอริทึมละโมบและกำหนดการพลวัต" }
  - { framework: acm-cs2023, indicators: ["AL-Complexity"], coverage: partial, note: "นับขั้นในกรณีแย่ที่สุด สัญกรณ์บิ๊กโอ O(1) ถึง O(n²) และการคาดเวลาจากการทดลองเมื่อขยายข้อมูล ยังไม่มีนิยามเชิงรูปนัยของบิ๊กโอ หน่วยความจำ และปัญหาที่แก้ได้ยาก (P และ NP)" }
