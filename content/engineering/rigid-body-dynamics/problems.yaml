    type: mcq
    multiple: true
    stem: "ในการเคลื่อนที่ในระนาบ สมการ $\\sum M_P = I_P\\alpha$ ใช้ได้โดยตรงเมื่อ P เป็นจุดใด เลือกทุกข้อที่ถูก"
    choices:
      - { id: a, text: "จุดศูนย์กลางมวล G", correct: true }
      - { id: b, text: "แกนหมุนคงที่ของวัตถุที่หมุนรอบแกนนั้น", correct: true }
      - { id: c, text: "จุดสัมผัสของล้อกลมที่กลิ้งโดยไม่ไถลบนพื้นเรียบ", correct: true }
      - { id: d, text: "จุดใดก็ได้บนวัตถุ", feedback: "รอบจุดทั่วไปต้องบวกโมเมนต์ของ $m\\vec a_G$ ด้วย" }
    hints:
      - "สมการทั่วไป $\\sum M_P = I_G\\alpha + \\vec r_{G/P} \\times m\\vec a_G$"
      - "พจน์หลังรวมกับ $I_G\\alpha$ เป็น $I_P\\alpha$ ได้เมื่อใด"
    solution: "ที่ G พจน์หลังเป็นศูนย์ ที่แกนคงที่ $a_G$ มีส่วนสู่ศูนย์กลางที่ผ่าน P (ไม่มีโมเมนต์) และส่วนสัมผัส $\\alpha d$ ซึ่งให้ $md^2\\alpha$ รวมกับ $I_G\\alpha$ เป็น $I_P\\alpha$ ล้อกลมที่กลิ้งบนพื้นเรียบมี $a_G = \\alpha R$ ขนานพื้นและตั้งฉากกับ GP จึงได้ผลเดียวกัน ส่วนจุดทั่วไปใช้ไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: engineering.mechanics.rigid-body-dynamics.p017
    topics: [engineering.mechanics.rigid-body-dynamics]
    difficulty: 5
    type: numeric
    stem: "แท่งสม่ำเสมอมวล $6\\ \\mathrm{kg}$ ยาว $1.2\\ \\mathrm{m}$ หมุนรอบหมุดที่ปลาย ปล่อยจากแนวราบ เมื่อแกว่งลงถึงแนวดิ่ง แรงที่หมุดกระทำต่อแท่งมีขนาดกี่นิวตัน (ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 147.2, tolerance: 1.5, unit: N }
    misconceptions:
      - { match: 58.9, feedback: "ใช้แรงเท่าน้ำหนักเหมือนแท่งนิ่ง ที่จุดต่ำสุด G มีความเร่งสู่ศูนย์กลางชี้ขึ้น" }
      - { match: 88.3, feedback: "ได้เฉพาะส่วน $m\\omega^2L/2$ ลืมบวกน้ำหนัก $mg$" }
    hints:
      - "พลังงาน: $mg\\dfrac{L}{2} = \\tfrac12\\left(\\tfrac13mL^2\\right)\\omega^2$ ได้ $\\omega^2 = 3g/L$"
