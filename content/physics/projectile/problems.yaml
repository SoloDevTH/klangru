  - id: phy.proj.p023
    topics: [physics.kinematics.projectile]
    difficulty: 5
    type: numeric
    stem: "เตะลูกบอลจากพื้นด้วยความเร็ว $25\\ \\mathrm{m/s}$ ทำมุม $\\theta$ กับพื้น โดย $\\sin\\theta = 0.6$ และ $\\cos\\theta = 0.8$ ไม่คิดแรงต้านอากาศ ลูกบอลอยู่สูงกว่า $10\\ \\mathrm{m}$ จากพื้นเป็นเวลานานเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย s)"
    answer: { value: 1.10, tolerance: 0.01, unit: s }
    hints:
      - "ลูกบอลผ่านความสูง $10\\ \\mathrm{m}$ สองครั้ง คือขาขึ้นและขาลง"
      - "แก้สมการ $10 = 15t - 4.9t^2$ ได้คำตอบสองค่า แล้วหาผลต่าง"
    misconceptions:
      - { match: 0.98, feedback: "นี่คือเวลาที่ลูกบอลขึ้นไปถึง $10\\ \\mathrm{m}$ ครั้งแรก ลูกบอลยังอยู่สูงกว่า $10\\ \\mathrm{m}$ ต่อไปจนผ่านระดับนี้อีกครั้งขาลง" }
      - { match: 2.08, feedback: "นี่คือเวลาที่ลูกบอลผ่าน $10\\ \\mathrm{m}$ ขาลง ช่วงเวลาที่อยู่สูงกว่า $10\\ \\mathrm{m}$ คือผลต่างระหว่างสองเวลา" }
    solution: "$u_y = 25(0.6) = 15\\ \\mathrm{m/s}$ แก้ $4.9t^2 - 15t + 10 = 0$ ได้ $t = \\dfrac{15 \\pm \\sqrt{225 - 196}}{9.8} = \\dfrac{15 \\pm 5.385}{9.8}$ คือ $0.981\\ \\mathrm{s}$ และ $2.080\\ \\mathrm{s}$ ลูกบอลอยู่สูงกว่า $10\\ \\mathrm{m}$ นาน $2.080 - 0.981 \\approx 1.10\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true
