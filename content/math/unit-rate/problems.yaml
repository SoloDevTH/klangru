    ai_assisted: true

  - id: math.number.unit-rate.p018
    topics: [math.number.unit-rate]
    difficulty: 5
    type: numeric
    stem: "ขับรถจากกรุงเทพฯ ไปบางแสน 80 กิโลเมตร ใช้เวลา 1 ชั่วโมง 15 นาที อัตราเร็วเฉลี่ยกี่กิโลเมตรต่อชั่วโมง"
    answer: { value: 64, unit: กม./ชม. }
    hints:
      - "เปลี่ยนเวลาเป็นชั่วโมงก่อน 15 นาทีเป็นกี่ชั่วโมง"
      - "15 นาที = 15/60 ชั่วโมง แล้วหารระยะทางด้วยเวลาทั้งหมด"
    misconceptions:
      - { match: 69.57, feedback: "เขียน 1 ชั่วโมง 15 นาทีเป็น 1.15 ชั่วโมง แต่ 15 นาที = 0.25 ชั่วโมง" }
      - { match: 1.067, feedback: "ได้กิโลเมตรต่อนาที (80 ÷ 75) โจทย์ถามกิโลเมตรต่อชั่วโมง" }
    solution: "เวลา $= 1 + \\tfrac{15}{60} = 1.25$ ชั่วโมง อัตราเร็ว $= 80 \\div 1.25 = 64$ กิโลเมตรต่อชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p019
    topics: [math.number.unit-rate]
    difficulty: 5
    type: numeric
    stem: "รถยนต์คันหนึ่งใช้น้ำมัน 6 ลิตรต่อระยะทาง 90 กิโลเมตร น้ำมันราคาลิตรละ 32.50 บาท ถ้าขับ 300 กิโลเมตร ค่าน้ำมันกี่บาท"
    answer: { value: 650, unit: บาท }
    hints:
      - "หาว่าน้ำมัน 1 ลิตรวิ่งได้กี่กิโลเมตร"
      - "หาว่า 300 กิโลเมตรใช้น้ำมันกี่ลิตร แล้วคูณด้วยราคาต่อลิตร"
    misconceptions:
      - { match: 20, feedback: "นี่คือจำนวนลิตรที่ใช้ ยังต้องคูณด้วยราคาลิตรละ 32.50 บาท" }
      - { match: 195, feedback: "นี่คือค่าน้ำมัน 6 ลิตรสำหรับ 90 กม. แรกเท่านั้น ต้องหาจำนวนลิตรสำหรับ 300 กม." }
    solution: "1 ลิตรวิ่งได้ $90 \\div 6 = 15$ กม. 300 กม. ใช้ $300 \\div 15 = 20$ ลิตร ค่าน้ำมัน $20 \\times 32.50 = 650$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.number.unit-rate.p020
    topics: [math.number.unit-rate]
    difficulty: 5
    type: numeric
    stem: "ก้อนโลหะปริมาตร 50 ลูกบาศก์เซนติเมตร มีมวล 448 กรัม ความหนาแน่น (มวลต่อปริมาตร) ของโลหะนี้กี่กรัมต่อลูกบาศก์เซนติเมตร"
    answer: { value: 8.96, tolerance: 0.01, unit: g/cm³ }
    hints:
      - "ความหนาแน่นคืออัตราต่อหน่วยแบบหนึ่ง: มวลของ 1 ลูกบาศก์เซนติเมตร"
      - "หารมวลด้วยปริมาตร"
    misconceptions:
      - { match: 0.1116, feedback: "หารปริมาตรด้วยมวลกลับด้าน ได้ลูกบาศก์เซนติเมตรต่อกรัม" }
      - { match: 22400, feedback: "คูณมวลกับปริมาตร ความหนาแน่น = มวล ÷ ปริมาตร" }
    solution: "ความหนาแน่น $= 448 \\div 50 = 8.96$ กรัมต่อลูกบาศก์เซนติเมตร (ใกล้กับทองแดง)"
    license: CC-BY-SA-4.0
    ai_assisted: true
