      - { id: c, text: "คนที่ตาบอดสีแดงเขียวทุกคนมีแอลลีลด้อยบนโครโมโซม X", feedback: "ตาบอดสีชนิดนี้ถ่ายทอดด้วยยีนบน X ไม่ได้แสดงผลของยีนหลายยีนร่วมกับสิ่งแวดล้อม" }
