id: physics.light.ray-diagrams
subject: physics
title: { th: การเขียนรังสีหาภาพและความลึกปรากฏ, en: Ray diagrams and apparent depth }
summary: เขียนแผนภาพรังสีตามมาตราส่วนหาตำแหน่ง ขนาด และชนิดของภาพจากกระจกเงาและเลนส์บาง เทียบกับสูตร ความลึกจริงกับความลึกปรากฏ และการใช้งานจริง
difficulty: 5
minutes: 40
prerequisites: [physics.light.reflection, physics.light.refraction]
encompasses:
  - { id: physics.light.reflection, weight: 0.4 }
  - { id: physics.light.refraction, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: เลนส์นูน วัตถุอยู่ระหว่าง F กับ 2F
    src: lens-converging.svg
    alt: "แผนภาพรังสีตามมาตราส่วน เลนส์นูน f = 10 cm อยู่ตรงกลาง มีจุด 2F, F ทางซ้ายและ F′, 2F′ ทางขวา ห่างกันจุดละ 10 cm วัตถุสูง 4 cm อยู่ห่างเลนส์ 15 cm ทางซ้าย ระหว่าง 2F กับ F รังสีที่ 1 สีแดงขนานแกนแล้วหักเหผ่าน F′ รังสีที่ 2 สีเขียวผ่านกึ่งกลางเลนส์เป็นเส้นตรง รังสีที่ 3 สีม่วงผ่าน F แล้วออกขนานแกน ทั้งสามเส้นตัดกันที่ 30 cm ทางขวาของเลนส์ ใต้แกน 8 cm ภาพเป็นลูกศรสีน้ำเงินชี้ลง เป็นภาพจริง หัวกลับ ใหญ่ 2 เท่า"
    caption: "รังสีหลักทั้งสามเส้นตัดกันที่จุดเดียว s′ = 30 cm ตรงกับสูตร"
  - type: worked-example
    title: วาดแล้วตรวจด้วยสูตร (กระจกเว้า)
    problem: "วัตถุสูง 4 cm อยู่ห่างกระจกเว้า f = 10 cm เป็นระยะ 30 cm วาดแผนภาพด้วยมาตราส่วน 1 ช่องต่อ 5 cm แล้วตรวจด้วยสูตร"
    steps:
      - text: "มาร์ก F ที่ 2 ช่อง และ C ที่ 4 ช่องหน้ากระจก วัตถุอยู่ที่ 6 ช่อง สูงไม่ถึง 1 ช่อง (4 cm)"
      - text: "ลากรังสีขนานแกนจากปลายวัตถุ สะท้อนผ่าน F และรังสีผ่าน C ซึ่งสะท้อนกลับทางเดิม"
      - text: "สองเส้นตัดกันหน้ากระจก ห่าง 3 ช่อง (15 cm) ใต้แกน 2 cm จึงเป็นภาพจริง หัวกลับ"
        why: "รังสีสะท้อนตัดกันจริง จึงเป็นภาพจริง และอยู่ใต้แกนจึงกลับหัว"
      - text: "ลากรังสีที่สามผ่าน F สะท้อนขนานแกน ผ่านจุดเดียวกัน ยืนยันว่าวาดแม่น"
      - text: "ตรวจด้วยสูตร $\\tfrac{1}{s'} = \\tfrac{1}{10} - \\tfrac{1}{30} = \\tfrac{2}{30}$ ได้ $s' = 15\\ \\mathrm{cm}$ และ $m = \\tfrac{15}{30} = 0.5$ ภาพสูง $2\\ \\mathrm{cm}$"
    answer: "ภาพจริง หัวกลับ ห่างกระจก 15 cm สูง 2 cm ทั้งการวาดและสูตรให้ผลตรงกัน"
  - type: figure
    title: กระจกเว้า วัตถุอยู่ไกลกว่า C
    src: mirror-concave.svg
    alt: "แผนภาพรังสีกระจกเว้า f = 10 cm กระจกอยู่ทางขวา จุด C อยู่ห่างกระจก 20 cm และ F ห่าง 10 cm วัตถุสูง 4 cm อยู่ห่างกระจก 30 cm รังสีที่ 1 สีแดงขนานแกนสะท้อนผ่าน F รังสีที่ 2 สีเขียวผ่าน F ไปสะท้อนขนานแกน รังสีที่ 3 สีม่วงผ่าน C ไปสะท้อนกลับทางเดิม รังสีสะท้อนตัดกันที่ห่างกระจก 15 cm ใต้แกน 2 cm ระหว่าง C กับ F ภาพเป็นลูกศรสีน้ำเงินชี้ลง ภาพจริง หัวกลับ เล็กเป็นครึ่งหนึ่ง"
    caption: "ในแผนภาพนิยมให้รังสีสะท้อนที่เส้นตรงผ่านขั้วกระจก ซึ่งให้ผลตรงกับสูตร"
  - { type: check, problem: physics.light.ray-diagrams.p006, prompt: "หาเส้นที่วาดผิดจากกฎรังสีหลัก" }
  - type: figure
    title: กระจกนูนและเลนส์เว้าให้ภาพเสมือนเสมอ
    src: virtual-images.svg
    alt: "สองแผนภาพ ก. กระจกนูน f = −10 cm จุด F และ C อยู่หลังกระจก วัตถุสูง 4 cm ห่างกระจก 20 cm รังสีขนานแกนสะท้อนออกเหมือนมาจาก F รังสีที่เล็งไป F สะท้อนขนานแกน รังสีที่เล็งไป C สะท้อนกลับทางเดิม แนวต่อเส้นประของรังสีสะท้อนตัดกันหลังกระจกที่ 6.7 cm ได้ภาพเสมือนหัวตั้งสูงหนึ่งในสามของวัตถุ ข. เลนส์เว้า f = −10 cm วัตถุสูง 4 cm ห่าง 15 cm รังสีขนานแกนหักเหออกเหมือนมาจาก F ฝั่งวัตถุ รังสีผ่านกึ่งกลางไม่เบน รังสีที่เล็งไป F′ ออกขนานแกน แนวต่อเส้นประตัดกันที่ 6 cm ฝั่งเดียวกับวัตถุ ได้ภาพเสมือนหัวตั้ง 0.4 เท่า"
    caption: "รังสีกระจายออก ต้องลากแนวต่อ (เส้นประ) ย้อนกลับจึงเห็นภาพเสมือน"
  - type: figure
    title: กระจกเงาราบยาวครึ่งหนึ่งของความสูงก็พอ
    src: plane-mirror.svg
    alt: "คนสูง 170 cm ระดับตา 160 cm ยืนห่างผนัง 100 cm กระจกบนผนังมีขอบล่างสูง 80 cm ขอบบนสูง 165 cm ยาว 85 cm รังสีจากศีรษะสะท้อนที่ขอบบนเข้าตา รังสีจากเท้าสะท้อนที่ขอบล่างเข้าตา แนวต่อเส้นประไปถึงภาพเสมือนของคนที่อยู่หลังผนัง 100 cm"
    caption: "จุดสะท้อนอยู่กึ่งกลางระหว่างระดับตากับระดับศีรษะ และระหว่างระดับตากับพื้น"
  - type: figure
    title: ความลึกปรากฏ
    src: apparent-depth.svg
    alt: "เหรียญอยู่ที่ก้นสระลึก 2.0 m รังสีสองเส้นออกจากเหรียญเอียง 12 และ 18 องศาจากแนวดิ่ง ถึงผิวน้ำแล้วหักเหออกจากเส้นปกติเป็น 16 และ 24 องศา เข้าตาที่อยู่เหนือน้ำ แนวต่อเส้นประของรังสีในอากาศย้อนลงไปตัดกันที่ความลึกประมาณ 1.38 m ซึ่งเป็นภาพของเหรียญ ความลึกปรากฏจึงน้อยกว่าความลึกจริง"
    caption: "ภาพนี้มองเฉียงราว 20° ภาพจึงตื้นกว่าค่า 2.0 ÷ 1.33 ≈ 1.50 m ที่ได้จากสูตรสำหรับการมองเกือบตั้งฉาก"
  - type: worked-example
    title: เหรียญใต้แผ่นแก้วในน้ำ
    problem: "อ่างน้ำลึก 20 cm (n = 1.33) ก้นอ่างเป็นแผ่นแก้วหนา 3.0 cm (n = 1.50) มีสติกเกอร์ติดใต้แผ่นแก้ว มองลงจากด้านบนเกือบตั้งฉาก สติกเกอร์ดูอยู่ลึกจากผิวน้ำเท่าใด"
    steps:
      - text: "ชั้นน้ำ: ความลึกปรากฏ $= \\tfrac{20}{1.33} \\approx 15.0\\ \\mathrm{cm}$"
        why: "มองจากอากาศ แต่ละชั้นดูบางลงตามดรรชนีหักเหของชั้นนั้น"
      - text: "ชั้นแก้ว: ความหนาปรากฏ $= \\tfrac{3.0}{1.50} = 2.0\\ \\mathrm{cm}$"
      - text: "รวมกัน $15.0 + 2.0 = 17.0\\ \\mathrm{cm}$"
    answer: "ประมาณ 17 cm ขณะที่ความลึกจริงคือ 23 cm"
  - { type: check, problem: physics.light.ray-diagrams.p009, prompt: "มองจากอากาศลงน้ำ สระดูลึกขึ้นหรือตื้นลง" }
  - type: simulation
    title: เลนส์และกระจก (PhET Geometric Optics)
    url: https://phet.colorado.edu/en/simulations/geometric-optics
    provider: phet
    note: "หน้า Lens เปิด Principal Rays แล้วลากวัตถุให้อยู่ไกลกว่า 2F ระหว่าง F กับ 2F และใกล้กว่า F ดูว่ารังสีหลักตัดกันที่ใดและภาพเปลี่ยนจากภาพจริงเป็นภาพเสมือนเมื่อใด หน้า Mirror ลองกระจกเว้าและกระจกนูน แล้วเทียบตำแหน่งภาพกับค่าที่คำนวณจากสูตร"
glossary:
  - { term: แผนภาพรังสี, definition: "ภาพที่ลากรังสีหลักจากปลายวัตถุผ่านกระจกหรือเลนส์ เพื่อหาตำแหน่ง ขนาด และชนิดของภาพ" }
  - { term: รังสีหลัก, definition: "รังสีที่รู้ทางเดินแน่นอน เช่น รังสีขนานแกน รังสีผ่านจุดโฟกัส รังสีผ่านกึ่งกลางเลนส์หรือผ่านจุด C ของกระจก" }
  - { term: ภาพจริง, definition: "ภาพที่เกิดจากรังสีตัดกันจริง ฉายบนฉากได้ เป็นภาพหัวกลับ" }
  - { term: ภาพเสมือน, definition: "ภาพที่เกิดจากแนวต่อของรังสี ฉายบนฉากไม่ได้ เป็นภาพหัวตั้ง" }
  - { term: กำลังขยาย, definition: "อัตราส่วนความสูงภาพต่อความสูงวัตถุ เท่ากับ |s′|/s" }
  - { term: ความลึกปรากฏ, definition: "ความลึกที่ตาเห็นเมื่อมองวัตถุในตัวกลางอื่น เกิดจากการหักเหของแสงที่ผิวรอยต่อ" }
flashcards:
  - { front: "รังสีหลักของเลนส์นูนมีอะไรบ้าง", back: "ขนานแกน → ผ่าน F′, ผ่านกึ่งกลางเลนส์ → ไม่เบน, ผ่าน F → ออกขนานแกน" }
  - { front: "ภาพเสมือนวาดด้วยเส้นแบบใด", back: "เส้นประ เป็นแนวต่อของรังสีย้อนกลับ แสงไม่ได้ผ่านจุดนั้นจริง" }
  - { front: "กระจกนูนและเลนส์เว้าให้ภาพแบบใด", back: "ภาพเสมือน หัวตั้ง ย่อ เสมอ ไม่ว่าวัตถุอยู่ที่ใด" }
  - { front: "กระจกเงาราบต้องยาวเท่าไรจึงเห็นทั้งตัว", back: "ครึ่งหนึ่งของความสูง ไม่ขึ้นกับระยะที่ยืน" }
  - { front: "ความลึกปรากฏเมื่อมองจากอากาศลงน้ำ", back: "ความลึกจริง ÷ 1.33 (มองเกือบตั้งฉาก) ยิ่งมองเฉียงยิ่งดูตื้น" }
