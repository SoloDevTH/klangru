  - id: chemistry.matter.elements-compounds.p015
    topics: [chemistry.matter.elements-compounds]
    difficulty: 5
    type: numeric
    stem: "เทคนีเชียม-99m ใช้ตรวจโรคในโรงพยาบาล มีครึ่งชีวิต 6 ชั่วโมง ต้องรอกี่ชั่วโมง ปริมาณในร่างกายผู้ป่วยจึงเหลือ $\\tfrac{1}{16}$ ของตอนที่ฉีด (ไม่คิดการขับออกทางปัสสาวะ)"
    answer: { value: 24, unit: ชั่วโมง }
    misconceptions:
      - { match: 96, feedback: "คูณ 6 ด้วย 16 ไม่ได้ $\\tfrac{1}{16}$ เกิดจากการแบ่งครึ่ง 4 ครั้ง ไม่ใช่ 16 ครั้ง" }
      - { match: 48, feedback: "ลองแบ่งครึ่งทีละครั้ง: $\\tfrac12, \\tfrac14, \\tfrac18, \\tfrac{1}{16}$ นับได้กี่ครั้ง" }
    hints:
      - "เขียนลำดับ 1, $\\tfrac12$, $\\tfrac14$, ... จนถึง $\\tfrac{1}{16}$"
      - "นับจำนวนครั้งที่แบ่งครึ่ง แล้วคูณด้วย 6 ชั่วโมง"
    solution: "$1 \\to \\tfrac12 \\to \\tfrac14 \\to \\tfrac18 \\to \\tfrac{1}{16}$ คือ 4 ครึ่งชีวิต ใช้เวลา $4 \\times 6 =$ **24 ชั่วโมง**"
