<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="600" height="270">
  <title>หน้าตัดหลุมฝังกลบอย่างง่ายที่มีชั้นกันซึมและท่อรวบรวมน้ำชะ</title>
  <rect width="600" height="270" fill="#ffffff"/>
  <rect x="50" y="40" width="350" height="90" fill="#d6d3d1" stroke="#444" stroke-width="0.8"/>
  <text x="410" y="85" font-size="13" font-family="sans-serif">ขยะที่ฝังกลบ</text>
  <line x1="400" y1="81" x2="408" y2="81" stroke="#444"/>
  <rect x="50" y="130" width="350" height="20" fill="#a8a29e" stroke="#444" stroke-width="0.8"/>
  <text x="410" y="140" font-size="13" font-family="sans-serif">ชั้นทรายและท่อน้ำชะ</text>
  <line x1="400" y1="136" x2="408" y2="136" stroke="#444"/>
  <rect x="50" y="150" width="350" height="10" fill="#1f2937" stroke="#444" stroke-width="0.8"/>
  <text x="410" y="158" font-size="13" font-family="sans-serif">ชั้นกันซึม (liner)</text>
  <line x1="400" y1="154" x2="408" y2="154" stroke="#444"/>
  <rect x="50" y="160" width="350" height="70" fill="#e7e5e4" stroke="#444" stroke-width="0.8"/>
  <text x="410" y="198" font-size="13" font-family="sans-serif">ดินรองรับ</text>
  <line x1="400" y1="194" x2="408" y2="194" stroke="#444"/>
  <line x1="80" y1="140" x2="370" y2="140" stroke="#0ea5e9" stroke-width="4"/>
  <text x="225.0" y="260" font-size="12" text-anchor="middle" font-family="sans-serif">ภาพประกอบแนวคิด ไม่ใช่แบบออกแบบหลุมจริง</text>
</svg>
