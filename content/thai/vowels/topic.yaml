id: thai.writing.vowels
subject: thai
title: { th: สระและรูปสระในภาษาไทย, en: Thai vowels and vowel forms }
summary: รู้จักรูปสระ 21 รูปและสระ 32 ตัว สระเสียงสั้นและเสียงยาว ตำแหน่งของสระรอบพยัญชนะ สระเปลี่ยนรูปและลดรูป แล้วอ่านเขียนพยางค์ได้
difficulty: 1
minutes: 30
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - type: figure
    src: vowel-positions.svg
    alt: "แผนภาพตำแหน่งของรูปสระรอบพยัญชนะ ก ตรงกลาง ข้างบน: ◌ิ ◌ี ◌ึ ◌ื ◌ั ◌็ ข้างหน้า: เ แ โ ใ ไ (เขียนก่อนพยัญชนะ แต่ออกเสียงหลัง) ข้างหลัง: ะ า อ (อ ใน ออ ก็นับเป็นรูปสระ) ข้างล่าง: ◌ุ ◌ู หลายตำแหน่ง (สระประกอบ): เ◌ีย เสีย, เ◌ือ เรือ, ◌ัว ตัว, เ◌าะ เกาะ, เ◌อ เธอ, ◌ำ ทำ"
    caption: "รูปสระอยู่ได้ทั้งหน้า หลัง บน ล่าง และหลายตำแหน่งพร้อมกัน"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: อ่านคำว่า ไก่ ทีละส่วน
    problem: "คำว่า ไก่ มีพยัญชนะต้น สระ และรูปวรรณยุกต์อะไร"
    steps:
      - text: "หาพยัญชนะ: ก"
      - text: "ไ อยู่หน้า ก เป็นสระไอ (ไม้มลาย)"
        why: "สระข้างหน้าเขียนก่อนพยัญชนะ แต่อ่านหลังพยัญชนะ"
      - text: "เครื่องหมาย ่ บน ก คือไม้เอก เป็นรูปวรรณยุกต์ ไม่ใช่สระ"
      - text: "อ่าน ก + ไอ + ไม้เอก = ไก่"
    answer: "พยัญชนะต้น ก · สระไอ (ไ) · ไม้เอก"
  - { type: check, problem: thai.writing.vowels.p007, prompt: "สระบางตัวมีหลายชิ้น ลองนับดู" }
  - type: worked-example
    title: เขียนคำจากพยัญชนะ สระ และตัวสะกด
    problem: "เขียนคำ: พยัญชนะต้น ด + สระเอะ + ตัวสะกด ก"
    steps:
      - text: "สระเอะเมื่อไม่มีตัวสะกดเขียนเป็น เ◌ะ เช่น เตะ"
      - text: "แต่คำนี้มีตัวสะกด ก สระเอะจึงเปลี่ยนรูป ตัด ะ ออกแล้วใส่ไม้ไต่คู้ ◌็ แทน"
        why: "ถ้าไม่ใส่ไม้ไต่คู้ จะอ่านเป็นสระเอเสียงยาว (เดก)"
      - text: "เขียน เ ก่อน ตามด้วย ด ใส่ ◌็ บน ด แล้วตามด้วย ก"
    answer: "เด็ก"
  - { type: check, problem: thai.writing.vowels.p010, prompt: "เปลี่ยนรูปกับลดรูปต่างกันอย่างไร" }
glossary:
  - { term: รูปสระ, definition: "เครื่องหมายที่ใช้เขียนแทนเสียงสระ มี 21 รูป เช่น ะ า ◌ิ เ" }
  - { term: สระเสียงสั้น, definition: "สระที่ออกเสียงสั้นแล้วหยุด เช่น อะ อิ อุ" }
  - { term: สระเสียงยาว, definition: "สระที่ลากเสียงได้นาน เช่น อา อี อู" }
  - { term: สระประสม, definition: "สระที่เกิดจากสระเดี่ยวสองเสียงรวมกัน เช่น เอีย (อี + อา) เอือ อัว" }
  - { term: สระเกิน, definition: "อำ ใอ ไอ เอา ฤ ฤๅ ฦ ฦๅ มีเสียงพยัญชนะปนอยู่ เช่น อำ = อะ + ม" }
  - { term: สระเปลี่ยนรูป, definition: "สระที่เปลี่ยนไปใช้รูปอื่นเมื่อมีตัวสะกด เช่น อะ → ไม้หันอากาศ ใน กัน" }
  - { term: สระลดรูป, definition: "สระที่รูปหายไปบางส่วนหรือทั้งหมดเมื่อมีตัวสะกด เช่น โอะ ใน นก" }
flashcards:
  - { front: "รูปสระมีกี่รูป สระตามแบบเรียนประถมมีกี่ตัว", back: "รูปสระ 21 รูป · สระ 32 ตัว (หลักภาษามัธยมนับเสียงสระแท้ 21 เสียง)" }
  - { front: "สระที่เขียนไว้ข้างหน้าพยัญชนะมีอะไรบ้าง", back: "เ แ โ ใ ไ (เขียนก่อน แต่อ่านหลังพยัญชนะ)" }
  - { front: "สระโอะลดรูปในคำใด", back: "คำที่มีตัวสะกด เช่น นก คน มด (ไม่เห็นรูปสระเลย)" }
  - { front: "ใ ไม้ม้วน มีกี่คำ", back: "20 คำ เช่น ใหญ่ ใหม่ ให้ ใจ ใส่ ใช้ ใน ใต้ ใกล้" }
