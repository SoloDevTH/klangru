  difficulty: 4
  type: numeric
  stem: ที่ตลาดผลไม้จันทบุรี แม่ค้าพูดว่า 这个榴莲三百泰铢，那个比这个贵五十泰铢。 (泰铢 Tàizhū = บาท) ทุเรียนลูกนั้นราคากี่บาท
  answer:
    value: 350
    unit: บาท
  misconceptions:
  - match: 250
    feedback: 贵 = แพงกว่า ต้องบวก 50 ไม่ใช่ลบ
  - match: 50
    feedback: 50 คือผลต่าง ต้องบวกกับราคาลูกนี้
  hints:
  - 三百 = 300 五十 = 50
  - 那个比这个贵五十 = ลูกนั้นแพงกว่าลูกนี้ 50
  solution: $300 + 50 = 350$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
