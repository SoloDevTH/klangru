      - "เปลี่ยนมวลของสารตั้งต้นเป็นจำนวนโมล"
      - "คูณด้วยอัตราส่วนสัมประสิทธิ์เพื่อหาโมลของผลิตภัณฑ์"
      - "คูณจำนวนโมลของผลิตภัณฑ์ด้วยมวลต่อโมล"
    hints:
      - "สัมประสิทธิ์ใช้ได้เมื่อสมการดุลแล้วเท่านั้น"
      - "อัตราส่วนสัมประสิทธิ์ใช้กับโมล ไม่ใช่มวล"
    solution: "ดุลสมการ → มวลเป็นโมล → อัตราส่วนโมล → โมลเป็นมวล"
