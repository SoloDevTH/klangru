    stem: "แรงที่ดันกล่องไปตามพื้นเปลี่ยนตามตำแหน่งดังกราฟ แรงนี้ทำงานเท่าใดตั้งแต่ $x = 0$ ถึง $x = 6\\ \\mathrm{m}$ (ตอบเป็นตัวเลขในหน่วย J)"
    figure:
      src: fx-problem.svg
      alt: "กราฟแรง F (นิวตัน) กับตำแหน่ง x (เมตร) แรงเพิ่มเป็นเส้นตรงจาก 0 ที่ x = 0 ถึง 30 N ที่ x = 2 m คงที่ 30 N จนถึง x = 5 m แล้วลดเป็นเส้นตรงถึง 0 ที่ x = 6 m"
    answer: { value: 135, tolerance: 0.5, unit: J }
    hints:
      - "งานคือพื้นที่ใต้กราฟแรงกับตำแหน่ง"
      - "แบ่งเป็นสามเหลี่ยม (0–2 m) สี่เหลี่ยม (2–5 m) และสามเหลี่ยม (5–6 m) แล้วรวมพื้นที่"
    misconceptions:
      - { match: 180, feedback: "ดูเหมือนใช้แรงสูงสุด $30\\ \\mathrm{N}$ คูณระยะทั้งหมด $6\\ \\mathrm{m}$ แต่แรงไม่ได้เป็น $30\\ \\mathrm{N}$ ตลอด ต้องหาพื้นที่ใต้กราฟ" }
      - { match: 90, feedback: "นี่คือพื้นที่ของส่วนสี่เหลี่ยมอย่างเดียว ยังต้องรวมพื้นที่สามเหลี่ยมสองข้าง" }
    solution: "สามเหลี่ยมแรก $\\tfrac{1}{2}(2)(30) = 30\\ \\mathrm{J}$ สี่เหลี่ยม $3 \\times 30 = 90\\ \\mathrm{J}$ สามเหลี่ยมหลัง $\\tfrac{1}{2}(1)(30) = 15\\ \\mathrm{J}$ รวม $135\\ \\mathrm{J}$"
