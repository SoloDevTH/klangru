    ai_assisted: true

  - id: phy.n1.p021
    topics: [physics.dynamics.newton-first]
    difficulty: 5
    type: numeric
    stem: "ลากเลื่อนมวล $20\\ \\mathrm{kg}$ บนพื้นราบด้วยเชือกที่ทำมุม $30^\\circ$ เหนือแนวราบ แรงตึงเชือก $60\\ \\mathrm{N}$ เลื่อนเคลื่อนที่ด้วยความเร็วคงตัว สัมประสิทธิ์ความเสียดทานจลน์ระหว่างเลื่อนกับพื้นเป็นเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขทศนิยม 2 ตำแหน่ง ไม่มีหน่วย)"
    answer: { value: 0.313, tolerance: 0.004 }
    hints:
      - "แนวราบ: แรงเสียดทาน $= 60\\cos 30^\\circ$ เพราะความเร็วคงตัว"
      - "แนวดิ่ง: $N + 60\\sin 30^\\circ = mg$ เชือกช่วยยกเลื่อนขึ้นบางส่วน"
      - "$\\mu_k = \\dfrac{f}{N}$"
    misconceptions:
      - { match: 0.265, feedback: "ดูเหมือนใช้ $N = mg = 196\\ \\mathrm{N}$ เชือกที่เอียงขึ้นยกเลื่อนไว้ $60\\sin 30^\\circ = 30\\ \\mathrm{N}$ แรงตั้งฉากจึงเหลือ $166\\ \\mathrm{N}$" }
      - { match: 0.208, feedback: "ดูเหมือนสลับ sin กับ cos องค์ประกอบแนวราบของเชือกคือ $60\\cos 30^\\circ$" }
    solution: "$f = 60\\cos 30^\\circ \\approx 51.96\\ \\mathrm{N}$ และ $N = (20)(9.8) - 60\\sin 30^\\circ = 196 - 30 = 166\\ \\mathrm{N}$ จึงได้ $\\mu_k = \\dfrac{51.96}{166} \\approx 0.31$"
    license: CC-BY-SA-4.0
    ai_assisted: true
