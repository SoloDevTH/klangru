problems:
- type: mcq
  difficulty: 1
  stem: 'เติมคำเชื่อมให้ความหมายว่า ‘เขาไม่เพียงพูดภาษาจีนได้ แต่ยังพูดภาษาอังกฤษได้ด้วย’


    他 (tā)___会说汉语 (huì shuō Hànyǔ)，___会说英语 (huì shuō Yīngyǔ)。'
  choices:
  - id: a
    text: 不仅 (bùjǐn)…还 (hái)
    correct: true
    feedback: ถูก 不仅 (bùjǐn)…还 (hái) บอกว่าไม่เพียง…แต่ยัง
  - id: b
    text: 即使 (jíshǐ)…也 (yě)
    feedback: 即使 (jíshǐ) ใช้กับสมมติหรือกรณีสุดโต่ง ประโยคนี้ไม่ได้สมมติ
  - id: c
    text: 只要 (zhǐyào)…就 (jiù)
    feedback: 只要 (zhǐyào) บอกเงื่อนไขที่พอ ไม่ได้บอกการเพิ่มเติม
  - id: d
    text: 虽然 (suīrán)…但是 (dànshì)
    feedback: 虽然 (suīrán)…但是 (dànshì) บอกความขัดแย้ง ประโยคนี้ไม่มีความขัดแย้ง
  hints:
  - ประโยคนี้บอกว่าเขาทำได้สองอย่าง ไม่ได้บอกว่าขัดแย้งกัน
  - ดูว่าคู่ไหนหมายถึง ‘ไม่เพียง…แต่ยัง…’
  - คู่ที่ใช้เพิ่มข้อมูลต้องมีคำว่า 不仅 อยู่หน้า และ 还 หรือ 而且 อยู่หลัง
  solution: '**a. 不仅 (bùjǐn)…还 (hái)** เขียนว่า 他不仅会说汉语 (tā bùjǐn huì shuō Hànyǔ)，还会说英语 (hái huì shuō Yīngyǔ)。 (ไม่เพียงพูดภาษาจีนได้ แต่ยังพูดภาษาอังกฤษได้ด้วย)'
  id: chinese.grammar.complex-connectives.p001
  topics:
  - chinese.grammar.complex-connectives
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: match
  difficulty: 1
  stem: จับคู่คำเชื่อมคู่กับความหมายในภาษาไทย
  pairs:
  - left: 即使 (jíshǐ)…也 (yě)
    right: แม้…ก็ (สมมติ)
  - left: 只要 (zhǐyào)…就 (jiù)
    right: ขอแค่…ก็
  - left: 只有 (zhǐyǒu)…才 (cái)
    right: ต้อง…จึงจะ
  - left: 既然 (jìrán)…就 (jiù)
    right: ในเมื่อ…ก็
  - left: 一 (yī)…就 (jiù)
    right: พอ…ก็
  hints:
  - 只要 กับ 只有 มีความหมายตรงข้ามกันในเรื่องเงื่อนไข
  - 既然 ใช้กับเหตุที่รู้แล้ว ส่วน 一 บอกการเกิดต่อเนื่องทันที
  - 即使 เป็นสมมติ จึงแปลว่า ‘แม้…ก็’
  solution: 即使 (jíshǐ)…也 (yě) แม้…ก็ (สมมติ) · 只要 (zhǐyào)…就 (jiù) ขอแค่…ก็ · 只有 (zhǐyǒu)…才 (cái) ต้อง…จึงจะ · 既然 (jìrán)…就 (jiù) ในเมื่อ…ก็ · 一 (yī)…就 (jiù) พอ…ก็
  id: chinese.grammar.complex-connectives.p002
  topics:
  - chinese.grammar.complex-connectives
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: mcq
  difficulty: 2
  stem: เมื่อเช้าฝนตกหนักจริง ๆ แต่พวกเรายังไปโรงเรียน ประโยคใดบอกเรื่องนี้ได้ถูกต้อง
  choices:
  - id: a
    text: 即使下雨了 (jíshǐ xiàyǔ le)，我们也去学校了 (wǒmen yě qù xuéxiào le)。
    feedback: 即使 (jíshǐ) ใช้กับสมมติหรือยังไม่เกิด เรื่องที่เกิดแล้วใช้ 虽然 (suīrán)
  - id: b
    text: 虽然下雨了 (suīrán xiàyǔ le)，我们还是去学校了 (wǒmen háishi qù xuéxiào le)。
    correct: true
    feedback: ถูก 虽然 (suīrán)…还是 (háishi) ใช้กับเรื่องที่เกิดแล้วและบอกว่ายังทำต่อ
  - id: c
    text: 只要下雨了 (zhǐyào xiàyǔ le)，我们就去学校了 (wǒmen jiù qù xuéxiào le)。
    feedback: 只要 (zhǐyào)…就 (jiù) บอกเงื่อนไขที่พอ ไม่ได้บอกการยอมรับสิ่งที่ขัดขวาง
  - id: d
    text: 只有下雨了 (zhǐyǒu xiàyǔ le)，我们才去学校了 (wǒmen cái qù xuéxiào le)。
    feedback: 只有 (zhǐyǒu)…才 (cái) บอกว่าเงื่อนไขนั้นจำเป็น ประโยคนี้จึงไม่ตรงกับความหมาย
  hints:
  - ดูว่าเรื่องนี้เกิดขึ้นจริงหรือเป็นสมมติ
  - ประโยคต้องบอกว่า ‘แม้มีอุปสรรค ก็ยังทำ’
  - คู่ที่ใช้กับเรื่องจริงและบอกการยอมรับคือคู่ใด
  solution: '**b. 虽然下雨了 (suīrán xiàyǔ le)，我们还是去学校了 (wǒmen háishi qù xuéxiào le)。** ฝนตกเป็นข้อเท็จจริงที่เกิดแล้ว จึงใช้ 虽然 (suīrán) และ 还是 (háishi)'
  id: chinese.grammar.complex-connectives.p003
  topics:
  - chinese.grammar.complex-connectives
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: text
  difficulty: 2
  stem: 'เติมคำที่คู่กับ 即使 (jíshǐ) ในประโยคหลังโดยตรง (ตอบอักษรจีนหนึ่งตัว)


    即使明天下雨 (jíshǐ míngtiān xiàyǔ)，我们 (wǒmen)___去学校 (qù xuéxiào)。'
  accepted:
  - 也
  misconceptions:
  - match: 就
    feedback: 就 (jiù) เป็นคำคู่ของ 只要 (zhǐyào) (ขอแค่…ก็) ไม่ใช่คู่ของ 即使 (jíshǐ)
  - match: 虽然
    feedback: 虽然 (suīrán) เป็นคำคู่ของเรื่องที่เกิดแล้ว ไม่ใช่สมมติ 明天下雨 (míngtiān xiàyǔ) ซึ่งยังไม่เกิด
  hints:
  - ประโยคแรกเป็นสมมติ (พรุ่งนี้ฝนอาจตก)
  - 即使 ต้องมีคำที่แปลว่า ‘ก็’ ในประโยคหลัง
  - คำนี้คือ 也 ซึ่งบอกว่า ‘ก็ยัง’
  solution: '**也 (yě)** เขียนว่า 即使明天下雨 (jíshǐ míngtiān xiàyǔ)，我们也去学校 (wǒmen yě qù xuéxiào)。 (แม้พรุ่งนี้ฝนตก เราก็ยังไปโรงเรียน)'
  id: chinese.grammar.complex-connectives.p004
  topics:
  - chinese.grammar.complex-connectives
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: order
  difficulty: 2
  stem: 'เพื่อนของเราที่กรุงเทพฯ อยากพูดภาษาจีนให้คล่อง เรียงคำต่อไปนี้เป็นประโยคที่ถูกต้อง (ความหมาย: ต้องฝึกทุกวัน จึงจะพูดคล่อง)'
  items:
  - 只有 (zhǐyǒu)
  - 每天练习 (měitiān liànxí)，
  - 才能 (cái néng)
  - 说得流利 (shuō de liúlì)。
  hints:
  - ประโยคนี้ขึ้นต้นด้วยคู่คำเชื่อมที่บอกเงื่อนไขจำเป็น
  - คำที่ต้องวางหลัง 才 คือกริยา 能说
  - รูปประโยคคือ ‘只有 + เงื่อนไข + 才 + ผล’
  solution: 只有每天练习 (zhǐyǒu měitiān liànxí)，才能说得流利 (cái néng shuō de liúlì)。 คำตอบเรียงเป็น 只有 (zhǐyǒu) → 每天练习 (měitiān liànxí) → 才能 (cái néng) → 说得流利 (shuō de liúlì)
  id: chinese.grammar.complex-connectives.p005
  topics:
  - chinese.grammar.complex-connectives
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: mcq
  difficulty: 2
  stem: ที่โรงเรียนในเชียงใหม่ ครูประกาศว่า ‘ไม่ว่าฝนจะตกหรือไม่ เราจะไปโรงเรียนตอนเช้า’ ประโยคจีนที่ถูกต้องคือข้อใด
  choices:
  - id: a
    text: 无论下不下雨 (wúlùn xià bu xià yǔ)，我们都去学校 (wǒmen dōu qù xuéxiào)。
    correct: true
    feedback: ถูก 无论 (wúlùn) + A不A (下不下雨 (xià bu xià yǔ)) คู่กับ 都 (dōu) ผลไม่เปลี่ยนไม่ว่าฝนจะตกหรือไม่
  - id: b
    text: 只要下雨 (zhǐyào xiàyǔ)，我们都去学校 (wǒmen dōu qù xuéxiào)。
    feedback: 只要 (zhǐyào) บอกเงื่อนไขที่พอ ไม่ได้บอกว่าไม่ว่าจะเป็นอย่างไร
  - id: c
    text: 既然下雨 (jìrán xiàyǔ)，我们就去学校 (wǒmen jiù qù xuéxiào)。
    feedback: 既然 (jìrán) ใช้กับเหตุที่รู้แล้ว แต่ในโจทย์ยังไม่รู้ว่าฝนจะตกหรือไม่
  - id: d
    text: 无论下雨 (wúlùn xiàyǔ)，我们就去学校 (wǒmen jiù qù xuéxiào)。
    feedback: 无论 (wúlùn) ต้องคู่กับ 都 (dōu) ไม่ใช้กับ 就 (jiù)
  hints:
  - โจทย์บอกว่าผลไม่เปลี่ยนไม่ว่าอะไรจะเกิด
  - ดูว่าคู่ไหนมีความหมาย ‘ไม่ว่า…ก็’
  - ประโยคจีนที่ใช้ A不A ได้ถูกต้องคือ 下不下雨
  solution: '**a. 无论下不下雨 (wúlùn xià bu xià yǔ)，我们都去学校 (wǒmen dōu qù xuéxiào)。** 无论 (wúlùn) คู่กับ 都 (dōu) และใช้ 下不下雨 (xià bu xià yǔ) (ฝนตกหรือไม่) เป็นเงื่อนไข'
  id: chinese.grammar.complex-connectives.p006
  topics:
