- id: chinese.grammar.location-you-zai.p012
  topics:
  - chinese.grammar.location-you-zai
  difficulty: 4
  type: mcq
  stem: ประโยคใด **ผิด** (เลือกทุกข้อที่ผิด)
  multiple: true
  choices:
  - id: a
    text: 他在学校。
    feedback: ข้อนี้ถูก 学校 เป็นสถานที่อยู่แล้ว
  - id: b
    text: 我在泰国里。
    correct: true
    feedback: 'ผิด ชื่อประเทศและเมืองไม่ต้องมี 里: 我在泰国。'
  - id: c
    text: 书在书包。
    correct: true
    feedback: 'ผิด 书包 เป็นสิ่งของ ไม่ใช่สถานที่ ต้องมี 里: 书在书包里。'
  - id: d
    text: 我在家。
    feedback: ข้อนี้ถูก 家 เป็นสถานที่อยู่แล้ว
  hints:
  - คำนามที่เป็นสถานที่อยู่แล้ว (家 学校 ชื่อเมือง ชื่อประเทศ) ไม่ต้องเติมคำบอกทิศ
  - สิ่งของ เช่น กระเป๋า โต๊ะ ต้องเติมคำบอกทิศเมื่อใช้บอกตำแหน่ง
  solution: 'ผิด: **我在泰国里** (ชื่อประเทศไม่ใช้ 里) และ **书在书包** (สิ่งของต้องมี 里 → 书包里)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.location-you-zai.p013
  topics:
  - chinese.grammar.location-you-zai
  difficulty: 4
  type: mcq
  stem: 'เติมคำในช่องว่าง: 学校旁边＿＿一家医院。 我的手机＿＿桌子上。 (旁边 pángbiān = ข้าง ๆ, 医院 yīyuàn = โรงพยาบาล)'
  choices:
  - id: a
    text: 有 · 有
    feedback: ประโยคที่สองขึ้นต้นด้วยสิ่งของ (โทรศัพท์ของฉัน) ต้องใช้ 在
  - id: b
    text: 在 · 在
    feedback: ประโยคแรกบอกว่ามีโรงพยาบาลอยู่ ต้องใช้ 有
  - id: c
    text: 有 · 在
    correct: true
    feedback: ถูก ประโยคแรกขึ้นต้นด้วยสถานที่จึงใช้ 有 ประโยคที่สองขึ้นต้นด้วยสิ่งของที่รู้กันจึงใช้ 在
  - id: d
    text: 在 · 有
    feedback: สลับกัน ประโยคที่ขึ้นต้นด้วยสถานที่ใช้ 有
  hints:
  - 'ดูคำแรกของประโยค: สถานที่ หรือ สิ่งของ'
  - สถานที่ + 有 + สิ่งของ · สิ่งของ + 在 + สถานที่
  solution: 学校旁边**有**一家医院 (ข้างโรงเรียนมีโรงพยาบาล) · 我的手机**在**桌子上 (โทรศัพท์ของฉันอยู่บนโต๊ะ)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.location-you-zai.p014
  topics:
  - chinese.grammar.location-you-zai
  difficulty: 4
  type: order
  stem: เรียงคำเป็นประโยค "ข้างหน้าโรงเรียนมีร้านกาแฟหนึ่งร้าน" (咖啡馆 kāfēiguǎn = ร้านกาแฟ)
  items:
  - 学校
  - 前边
