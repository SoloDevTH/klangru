<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260" font-family="sans-serif" font-size="14">
<title>แท่งวัสดุยาว L0 พื้นที่หน้าตัด A ถูกแรง F ดึงจนยืดออก ΔL</title>
<rect x="0" y="0" width="700" height="260" fill="#ffffff"/>
<rect x="150.0" y="72.0" width="360.0" height="36.0" rx="0" fill="#d6dde6" stroke="#15211e" stroke-width="1.5"/>
<ellipse cx="150" cy="90" rx="10" ry="18" fill="#b8c4d2" stroke="#15211e" stroke-width="1.5"/>
<text x="148.0" y="138.0" text-anchor="middle" fill="#15211e" font-size="13">พื้นที่หน้าตัด A</text>
<line x1="140.0" y1="90.0" x2="49.4" y2="90.0" stroke="#c0392b" stroke-width="3"/>
<polygon points="40.0,90.0 51.0,95.0 51.0,85.0" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<text x="38.0" y="78.0" text-anchor="start" fill="#c0392b" font-size="14" font-weight="bold">F</text>
<line x1="510.0" y1="90.0" x2="610.6" y2="90.0" stroke="#c0392b" stroke-width="3"/>
<polygon points="620.0,90.0 609.0,85.0 609.0,95.0" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<text x="616.0" y="78.0" text-anchor="end" fill="#c0392b" font-size="14" font-weight="bold">F</text>
<text x="350.0" y="30.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">แรงดึง F ที่ปลายทั้งสองทำให้แท่งยาวขึ้นจาก L₀ เป็น L₀ + ΔL</text>
<rect x="150.0" y="174.0" width="400.0" height="32.0" rx="0" fill="#d6dde6" stroke="#15211e" stroke-width="1.5"/>
<line x1="150.0" y1="160.0" x2="150.0" y2="220.0" stroke="#777" stroke-width="1"/>
<line x1="510.0" y1="160.0" x2="510.0" y2="220.0" stroke="#777" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="550.0" y1="160.0" x2="550.0" y2="220.0" stroke="#777" stroke-width="1"/>
<line x1="310.0" y1="230.0" x2="156.8" y2="230.0" stroke="#15211e" stroke-width="1.5"/>
<polygon points="150.0,230.0 158.0,233.6 158.0,226.4" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<line x1="350.0" y1="230.0" x2="503.2" y2="230.0" stroke="#15211e" stroke-width="1.5"/>
<polygon points="510.0,230.0 502.0,226.4 502.0,233.6" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="330.0" y="235.0" text-anchor="middle" fill="#15211e" font-size="14">L₀</text>
<line x1="526.0" y1="162.0" x2="544.0" y2="162.0" stroke="#15211e" stroke-width="1.5"/>
<polygon points="550.0,162.0 543.0,158.8 543.0,165.2" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<line x1="534.0" y1="162.0" x2="516.0" y2="162.0" stroke="#15211e" stroke-width="1.5"/>
<polygon points="510.0,162.0 517.0,165.2 517.0,158.8" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="530.0" y="154.0" text-anchor="middle" fill="#15211e" font-size="14">ΔL</text>
<text x="560.0" y="195.0" text-anchor="start" fill="#1f5fa8" font-size="13">σ = F/A,  ε = ΔL/L₀</text>
</svg>
