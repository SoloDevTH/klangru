<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" font-family="sans-serif"><title>ภาพจำลองควันจากปล่องที่ถูกลมพัดไป ความสูงที่ยกตัวและการกระจายตามระยะทาง</title><rect x="0" y="0" width="700" height="290" fill="#ffffff"/><line x1="60" y1="230" x2="640" y2="230" stroke="#333" stroke-width="2"/><rect x="142" y="90" width="16" height="140" fill="#8a9bad" stroke="#1f3a5f"/><polygon points="150,90 640,130 640,225 150,90" fill="#dfe8f2" stroke="#7a9cc0" stroke-dasharray="5,4"/><path d="M150,90 Q 420,120 640,190" fill="none" stroke="#1f3a5f" stroke-width="2.5"/><line x1="150" y1="90" x2="150" y2="230" stroke="#b5452b" stroke-width="1.5" stroke-dasharray="4,4"/><text x="165" y="170" font-size="14" fill="#b5452b">H (ความสูงปล่องรวมการยกตัว)</text><text x="450" y="260" font-size="14" fill="#333">ระยะตามลม x</text><text x="130" y="80" font-size="13" text-anchor="end" fill="#333">ปล่อง</text><text x="350" y="60" font-size="14" fill="#333">ควันถูกลมพัดไปและกระจายทั้งแนวตั้งและแนวนอน</text></svg>
