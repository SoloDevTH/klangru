- id: business.marketing.digital-marketing.p015
  topics:
  - business.marketing.digital-marketing
  difficulty: 5
  type: numeric
  stem: ร้านเทียบสองช่องทาง (สมมติ) ช่องทาง X ใช้งบ $20{,}000$ บาท ได้ลูกค้าใหม่ $250$ ราย มูลค่าลูกค้าตลอดอายุเฉลี่ย $600$ บาท ช่องทาง Y ใช้งบ $12{,}000$ บาท ได้ลูกค้าใหม่ $100$ ราย มูลค่าลูกค้าตลอดอายุเฉลี่ย $1{,}500$ บาท อัตราส่วน CLV ต่อ CAC ของช่องทาง **Y** เท่ากับเท่าไร
  answer:
    value: 12.5
    tolerance: 0.1
    unit: เท่า
  misconceptions:
  - match: 7.5
    feedback: นั่นคือของช่องทาง X
  - match: 0.08
    feedback: หารกลับด้าน
  hints:
  - 'หา CAC ของ Y ก่อน: งบ $\div$ ลูกค้าใหม่'
  - อัตราส่วน $=$ CLV $\div$ CAC
  solution: 'CAC ของ Y $= 12{,}000 \div 100 = 120$ บาท อัตราส่วน $= 1{,}500 \div 120 = 12.5$ เท่า ส่วน X: CAC $= 80$ บาท อัตราส่วน $600 \div 80 = 7.5$ เท่า แม้ Y ได้ลูกค้าแต่ละรายแพงกว่า แต่ลูกค้ามีค่ามากกว่า จึงคุ้มกว่า'
