id: computer.society.responsible-ict
subject: computer
title: { th: การใช้เทคโนโลยีสารสนเทศอย่างปลอดภัย มีจริยธรรม และถูกกฎหมาย, en: "Using information technology safely, ethically and legally" }
summary: ลิขสิทธิ์ การใช้โดยชอบธรรม ครีเอทีฟคอมมอนส์ สัญญาอนุญาตซอฟต์แวร์ การให้เครดิต พ.ร.บ.คอมพิวเตอร์ ข้อมูลส่วนบุคคล และความรับผิดชอบต่อสังคม
difficulty: 3
minutes: 40
prerequisites: [computer.safety.safe-ict-primary]
encompasses:
  - { id: computer.safety.safe-ict-primary, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: cc-licenses.svg
    alt: "ตารางเปรียบเทียบสัญญาอนุญาต มีคอลัมน์ ต้องให้เครดิต ใช้เพื่อการค้าได้ ดัดแปลงได้ และงานดัดแปลงต้องใช้สัญญาเดิม CC0 ยกให้เป็นสาธารณะ ไม่บังคับให้เครดิต ใช้เพื่อการค้าได้ ดัดแปลงได้ CC BY ต้องให้เครดิต การค้าได้ ดัดแปลงได้ CC BY-SA ต้องให้เครดิต การค้าได้ ดัดแปลงได้ งานดัดแปลงต้องใช้สัญญาเดิม CC BY-ND ต้องให้เครดิต การค้าได้ ดัดแปลงไม่ได้ CC BY-NC ต้องให้เครดิต การค้าไม่ได้ ดัดแปลงได้ CC BY-NC-SA ต้องให้เครดิต การค้าไม่ได้ ดัดแปลงได้ งานดัดแปลงต้องใช้สัญญาเดิม CC BY-NC-ND ต้องให้เครดิต การค้าไม่ได้ ดัดแปลงไม่ได้ ใต้ตารางอธิบายว่า BY แสดงที่มา SA อนุญาตแบบเดียวกัน NC ไม่ใช้เพื่อการค้า ND ห้ามดัดแปลง"
    caption: "อ่านชื่อสัญญาทีละส่วน แล้วจะรู้ว่าทำอะไรได้บ้าง"
  - type: figure
    src: can-i-use.svg
    alt: "ผังงานตัดสินใจว่านำภาพ เพลง หรือโค้ดของผู้อื่นมาใช้ได้หรือไม่ คำถามแรก เป็นสาธารณสมบัติหรือ CC0 หรือไม่ ถ้าใช่ ใช้ได้ ให้เครดิตเป็นมารยาทที่ดี ถ้าไม่ ถามต่อว่ามีสัญญาอนุญาต CC หรือสัญญาซอฟต์แวร์ที่อนุญาตสิ่งที่เราจะทำหรือไม่ ถ้าใช่ ใช้ได้ตามเงื่อนไขและให้เครดิตครบ ถ้าไม่ ถามต่อว่าเข้าข่ายใช้โดยชอบธรรมหรือไม่ คือศึกษา ไม่หากำไร ใช้บางส่วน รับรู้ความเป็นเจ้าของ ถ้าใช่ ใช้ได้เท่าที่จำเป็นและอ้างอิงที่มา ถ้าไม่ ต้องขออนุญาตเจ้าของงานหรือหาสื่อที่อนุญาตแทน ใต้ผังเขียนว่าถ้าเป็นงานของเราเองทั้งหมดใช้ได้เลย และผังนี้เป็นแนวทางเบื้องต้น ไม่ใช่คำแนะนำทางกฎหมาย"
    caption: "ถามทีละข้อก่อนนำงานของผู้อื่นมาใช้"
  - type: worked-example
    title: เลือกสื่อสำหรับคลิปรายงาน
    problem: "แพรทำคลิปรายงานส่งครูและจะโพสต์ลงช่องของโรงเรียนซึ่งไม่ได้หารายได้ แพรมีสื่อ 3 อย่าง (1) ภาพตลาดน้ำ สัญญา CC BY-NC-SA 4.0 (2) เพลงฮิตที่ได้จากเว็บแชร์ไฟล์ (3) เสียงประกอบสัญญา CC0 แพรควรใช้อย่างไร"
    steps:
      - text: "เสียงประกอบ CC0: เป็นการยกให้สาธารณะ ใช้ได้ ใส่เครดิตไว้ด้วยก็ดี"
      - text: "ภาพ CC BY-NC-SA: คลิปไม่ได้ใช้หารายได้ จึงไม่ขัด NC ต้องให้เครดิตครบ (BY) และถ้าดัดแปลงภาพ ภาพที่ดัดแปลงต้องใช้ CC BY-NC-SA เหมือนเดิม (SA)"
        why: "ทุกส่วนของชื่อสัญญาเป็นเงื่อนไขที่ต้องทำตามพร้อมกัน"
      - text: "เพลงฮิต: เป็นงานมีลิขสิทธิ์ ไม่มีสัญญาอนุญาต การใส่ทั้งเพลงในคลิปที่โพสต์สาธารณะไม่ใช่การใช้โดยชอบธรรม ควรเปลี่ยนเป็นเพลงที่ใช้สัญญา CC หรือ CC0"
        why: "การใช้โดยชอบธรรมต้องใช้เท่าที่จำเป็นและไม่กระทบประโยชน์ของเจ้าของ การเผยแพร่ทั้งเพลงให้คนทั่วไปฟังกระทบเจ้าของโดยตรง"
      - text: "เขียนเครดิตท้ายคลิป: ชื่องาน ผู้สร้าง แหล่งที่มา สัญญาอนุญาต ของภาพและเสียงประกอบ"
    answer: "ใช้เสียงประกอบ CC0 และภาพ CC BY-NC-SA พร้อมเครดิตครบ เปลี่ยนเพลงฮิตเป็นเพลงที่มีสัญญาอนุญาตให้ใช้"
  - { type: check, problem: computer.society.responsible-ict.p003, prompt: "ลองเขียนเครดิตให้ครบสี่ส่วน" }
  - type: worked-example
    title: วิเคราะห์การแชร์ตาม พ.ร.บ.คอมพิวเตอร์
    problem: "ในกลุ่มแชตห้อง มีคนโพสต์ภาพครูที่ตัดต่อให้ดูน่าขบขันพร้อมคำบรรยายเท็จ แล้วชวนกันส่งต่อไปกลุ่มอื่น นักเรียนควรวิเคราะห์และทำอย่างไร"
    steps:
      - text: "ระบุการกระทำ: มีการตัดต่อภาพของผู้อื่นและเผยแพร่ในที่ที่คนอื่นเข้าถึงได้ และมีการชวนส่งต่อ"
      - text: "เทียบกับกฎหมาย: มาตรา 16 ห้ามนำภาพของผู้อื่นที่ตัดต่อหรือดัดแปลงจนน่าจะทำให้เขาเสียชื่อเสียง ถูกดูหมิ่น หรืออับอาย เข้าสู่ระบบที่ประชาชนทั่วไปเข้าถึงได้"
        why: "ภาพที่ส่งต่อไปหลายกลุ่มย่อมกระจายไปถึงคนจำนวนมาก การตัดต่อให้ขบขันอาจทำให้ครูอับอายได้"
      - text: "ด้านจริยธรรม: ครูเดือดร้อน และภาพจะอยู่ในอินเทอร์เน็ตเป็นร่องรอยดิจิทัลนาน"
      - text: "สิ่งที่ควรทำ: ไม่ส่งต่อ บอกเพื่อนให้ลบ แจ้งผู้ดูแลกลุ่ม และเล่าให้ครูหรือผู้ใหญ่ที่ไว้ใจฟัง"
    answer: "การตัดต่อภาพและเผยแพร่แบบนี้อาจเข้าข่ายมาตรา 16 และไม่มีจริยธรรม ไม่ควรส่งต่อ และควรช่วยหยุดการแพร่กระจาย"
  - { type: check, problem: computer.society.responsible-ict.p006, prompt: "จับคู่การกระทำกับมาตราที่เกี่ยวข้อง" }
glossary:
  - { term: ลิขสิทธิ์ (copyright), definition: "สิทธิของผู้สร้างสรรค์ในการทำซ้ำ ดัดแปลง และเผยแพร่งาน เกิดขึ้นทันทีที่สร้างงาน" }
  - { term: การใช้งานโดยชอบธรรม (fair use), definition: "การใช้งานที่มีลิขสิทธิ์โดยไม่ต้องขออนุญาต เช่น ศึกษาวิจัยหรือสอนโดยไม่หากำไร เมื่อไม่ขัดต่อการหาประโยชน์ตามปกติของเจ้าของ" }
  - { term: สาธารณสมบัติ (public domain), definition: "งานที่ไม่มีลิขสิทธิ์แล้ว เช่น หมดอายุการคุ้มครอง หรือเจ้าของยกให้ด้วย CC0 ใช้ได้อย่างอิสระ" }
  - { term: ครีเอทีฟคอมมอนส์ (Creative Commons), definition: "ชุดสัญญาอนุญาตที่เจ้าของงานใช้บอกล่วงหน้าว่าผู้อื่นทำอะไรกับงานได้บ้าง เช่น CC BY, CC BY-SA" }
  - { term: โอเพนซอร์ส (open source), definition: "ซอฟต์แวร์ที่เปิดซอร์สโค้ดให้ดู แก้ไข และแจกต่อได้ตามเงื่อนไขของสัญญา เช่น MIT หรือ GPL" }
  - { term: ข้อมูลส่วนบุคคล, definition: "ข้อมูลที่ระบุตัวบุคคลได้ไม่ว่าทางตรงหรือทางอ้อม ตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562" }
  - { term: ร่องรอยดิจิทัล (digital footprint), definition: "ข้อมูลที่เราทิ้งไว้เมื่อใช้งานออนไลน์ เช่น โพสต์ ความเห็น ภาพ ที่ผู้อื่นค้นเจอได้ภายหลัง" }
flashcards:
  - { front: "การให้เครดิตที่ครบมีอะไรบ้าง", back: "ชื่องาน ผู้สร้าง แหล่งที่มา สัญญาอนุญาต (และบอกว่าดัดแปลงอะไร ถ้ามี)" }
  - { front: "NC และ ND ในสัญญา CC หมายถึงอะไร", back: "NC = ห้ามใช้เพื่อการค้า ND = ห้ามดัดแปลง" }
  - { front: "ลิขสิทธิ์งานของบุคคลคุ้มครองนานเท่าไร", back: "ตลอดชีวิตผู้สร้างสรรค์และอีก 50 ปีหลังเสียชีวิต (พ.ร.บ.ลิขสิทธิ์ มาตรา 19)" }
  - { front: "ส่งต่อข่าวที่รู้ว่าเป็นเท็จผิดกฎหมายหรือไม่", back: "อาจผิด พ.ร.บ.คอมพิวเตอร์ มาตรา 14 (5) ซึ่งรวมการเผยแพร่หรือส่งต่อโดยรู้อยู่แล้ว" }
  - { front: "เก็บข้อมูลส่วนบุคคลของเด็กอายุไม่เกิน 10 ปี ต้องขอความยินยอมจากใคร", back: "ผู้ใช้อำนาจปกครอง (พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล มาตรา 20)" }
