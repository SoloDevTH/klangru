<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="sans-serif" font-size="13">
<title>เส้นเวลาจากปี 1830 ถึง 1990 มีจุดเหตุการณ์สำคัญในประวัติศาสตร์คอมพิวเตอร์และโทรศัพท์มือถือ และมีรายการคำอธิบายด้านล่าง</title>
<rect x="0" y="0" width="520" height="300" fill="#ffffff"/>
<line x1="24.0" y1="112" x2="488.0" y2="112" stroke="#374151" stroke-width="2"/>
