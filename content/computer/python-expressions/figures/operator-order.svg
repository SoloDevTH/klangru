<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 410" width="460" height="410" font-family="sans-serif" font-size="14">
<title>ลำดับการดำเนินการใน Python จากบนลงล่าง วงเล็บก่อน แล้วยกกำลัง คูณหาร บวกลบ เปรียบเทียบ not and และ or</title>
<rect x="0" y="0" width="460" height="410" fill="#ffffff"/>
<text x="230" y="24" text-anchor="middle" font-weight="bold" fill="#1f2937">ลำดับการดำเนินการ: บนทำก่อน ล่างทำทีหลัง</text>
<rect x="40" y="40" width="380" height="36" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/>
<text x="58" y="63" fill="#1f2937">1. วงเล็บ ( )</text>
<rect x="40" y="82" width="380" height="36" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
<text x="58" y="105" fill="#1f2937">2. ยกกำลัง **</text>
<rect x="40" y="124" width="380" height="36" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="58" y="147" fill="#1f2937">3. คูณ * หาร / หารปัดลง // หารเอาเศษ %</text>
<rect x="40" y="166" width="380" height="36" rx="8" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/>
<text x="58" y="189" fill="#1f2937">4. บวก + และ ลบ -</text>
<rect x="40" y="208" width="380" height="36" rx="8" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/>
<text x="58" y="231" fill="#1f2937">5. เปรียบเทียบ == < ></text>
<rect x="40" y="250" width="380" height="36" rx="8" fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
<text x="58" y="273" fill="#1f2937">6. not</text>
<rect x="40" y="292" width="380" height="36" rx="8" fill="#fbcfe8" stroke="#9d174d" stroke-width="2"/>
<text x="58" y="315" fill="#1f2937">7. and</text>
<rect x="40" y="334" width="380" height="36" rx="8" fill="#e9d5ff" stroke="#6b21a8" stroke-width="2"/>
<text x="58" y="357" fill="#1f2937">8. or</text>
<text x="230" y="394" text-anchor="middle" fill="#6b7280" font-size="12">ใช้วงเล็บเพื่อบังคับลำดับเมื่อไม่แน่ใจ</text>
</svg>