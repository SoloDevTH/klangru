  - id: computer.society.computing-ethics.p013
    topics: [computer.society.computing-ethics]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน ethics_checklist(answers) โดย answers เป็นดิกชันนารีจากคำถามเป็นค่า True หรือ False ให้คืนลิสต์ของคำถามที่ยังไม่ได้ตอบ True เรียงตามลำดับของ QUESTIONS ซึ่งกำหนดไว้แล้วในโค้ด"
    starter: |
      QUESTIONS = [
          "ระบุผู้มีส่วนได้เสียแล้ว",
          "ทดสอบแยกตามกลุ่มผู้ใช้แล้ว",
          "มีทางเลือกที่ปลอดภัยกว่า",
          "บอกผู้ใช้เรื่องข้อจำกัดแล้ว",
          "มีผู้รับผิดชอบเมื่อเกิดปัญหา",
      ]

      def ethics_checklist(answers):
          # ตอนนี้คืนคำถามทั้งหมดเสมอ ยังไม่ได้ตรวจคำตอบ
          return list(QUESTIONS)
    tests: |
      all_yes = {q: True for q in QUESTIONS}
      assert ethics_checklist(all_yes) == [], "ตอบ True ทุกข้อต้องได้ลิสต์ว่าง"
      one_missing = dict(all_yes)
      one_missing["มีทางเลือกที่ปลอดภัยกว่า"] = False
      assert ethics_checklist(one_missing) == ["มีทางเลือกที่ปลอดภัยกว่า"], "ข้อที่ตอบ False ต้องถูกส่งกลับ"
      assert ethics_checklist({}) == QUESTIONS, "ไม่ตอบเลยต้องได้ทุกข้อตามลำดับเดิม"
    reference: |
      QUESTIONS = [
          "ระบุผู้มีส่วนได้เสียแล้ว",
          "ทดสอบแยกตามกลุ่มผู้ใช้แล้ว",
          "มีทางเลือกที่ปลอดภัยกว่า",
          "บอกผู้ใช้เรื่องข้อจำกัดแล้ว",
          "มีผู้รับผิดชอบเมื่อเกิดปัญหา",
      ]

      def ethics_checklist(answers):
          return [q for q in QUESTIONS if not answers.get(q, False)]
    hints:
      - "วนดูคำถามทีละข้อตามลำดับใน QUESTIONS"
      - "ใช้ answers.get(q, False) เพื่อรองรับกรณีที่ยังไม่ได้ตอบ"
    solution: "คืนรายการคำถามที่ answers.get(q, False) ไม่เป็น True ตามลำดับของ QUESTIONS"
    license: CC-BY-SA-4.0
    ai_assisted: true

