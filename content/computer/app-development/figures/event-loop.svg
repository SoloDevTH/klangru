<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="sans-serif" font-size="14">
  <title>แหล่งเหตุการณ์ เช่น แตะปุ่ม พิมพ์ ตัวจับเวลา เซนเซอร์ ส่งเหตุการณ์เข้าคิว วงวนเหตุการณ์หยิบทีละเหตุการณ์ เรียกตัวจัดการที่ผูกไว้ ตัวจัดการเปลี่ยนข้อมูลแล้วแอปวาดหน้าจอใหม่ จากนั้นรอเหตุการณ์ถัดไป</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect x="0" y="0" width="860" height="330" fill="#ffffff"/>
  <rect x="20.0" y="30.0" width="170.0" height="46.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
