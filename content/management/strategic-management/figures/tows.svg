<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="sans-serif" font-size="13">
<title>ตาราง TOWS ของวิสาหกิจชุมชนกาแฟดอย (สมมติ) จับคู่จุดแข็ง จุดอ่อน โอกาส และอุปสรรค เป็นกลยุทธ์สี่แบบ</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
<text x="450.0" y="26.0" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">ตาราง TOWS: วิสาหกิจชุมชนกาแฟดอย เชียงราย (สมมติ)</text>
<rect x="20.0" y="44.0" width="230.0" height="88.0" rx="0" fill="#f0f0f0" stroke="#222" stroke-width="1.5"/>
<text x="135.0" y="84.0" text-anchor="middle" font-size="13" fill="#222">ภายใน →</text>
<text x="135.0" y="104.0" text-anchor="middle" font-size="13" fill="#222">ภายนอก ↓</text>
<rect x="250.0" y="44.0" width="315.0" height="88.0" rx="0" fill="#fafafa" stroke="#222" stroke-width="1.5"/>
<text x="407.5" y="68.0" text-anchor="middle" font-size="15" fill="#2e7d32" font-weight="bold">จุดแข็ง (S)</text>
<text x="266.0" y="94.0" text-anchor="start" font-size="13" fill="#222">S1 เมล็ดอาราบิกาคุณภาพสูง</text>
<text x="266.0" y="114.0" text-anchor="start" font-size="13" fill="#222">S2 ทีมแปรรูปผ่านการอบรม</text>
<rect x="565.0" y="44.0" width="315.0" height="88.0" rx="0" fill="#fafafa" stroke="#222" stroke-width="1.5"/>
<text x="722.5" y="68.0" text-anchor="middle" font-size="15" fill="#b26a00" font-weight="bold">จุดอ่อน (W)</text>
<text x="581.0" y="94.0" text-anchor="start" font-size="13" fill="#222">W1 ทุนน้อย เครื่องคั่วเก่า</text>
<text x="581.0" y="114.0" text-anchor="start" font-size="13" fill="#222">W2 การตลาดออนไลน์อ่อน</text>
<rect x="20.0" y="132.0" width="230.0" height="150.0" rx="0" fill="#fafafa" stroke="#222" stroke-width="1.5"/>
<text x="135.0" y="162.0" text-anchor="middle" font-size="15" fill="#1f5fa8" font-weight="bold">โอกาส (O)</text>
<text x="32.0" y="192.0" text-anchor="start" font-size="13" fill="#222">O1 นักท่องเที่ยวเชิงเกษตรเพิ่ม</text>
<text x="32.0" y="214.0" text-anchor="start" font-size="13" fill="#222">O2 ตลาดกาแฟพิเศษโต</text>
<rect x="250.0" y="132.0" width="315.0" height="150.0" rx="0" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="407.5" y="166.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">SO ใช้จุดแข็งคว้าโอกาส</text>
<text x="407.5" y="198.0" text-anchor="middle" font-size="13" fill="#222">ทัวร์ไร่กาแฟพร้อมชิมกาแฟพิเศษ</text>
<text x="407.5" y="220.0" text-anchor="middle" font-size="13" fill="#222">(S1 S2 + O1 O2)</text>
<rect x="565.0" y="132.0" width="315.0" height="150.0" rx="0" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="722.5" y="166.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">WO แก้จุดอ่อนด้วยโอกาส</text>
<text x="722.5" y="198.0" text-anchor="middle" font-size="13" fill="#222">ขายตรงผ่านแพลตฟอร์มออนไลน์</text>
<text x="722.5" y="220.0" text-anchor="middle" font-size="13" fill="#222">ให้คอกาแฟพิเศษ (W2 + O2)</text>
<rect x="20.0" y="282.0" width="230.0" height="150.0" rx="0" fill="#fafafa" stroke="#222" stroke-width="1.5"/>
<text x="135.0" y="312.0" text-anchor="middle" font-size="15" fill="#c62828" font-weight="bold">อุปสรรค (T)</text>
<text x="32.0" y="342.0" text-anchor="start" font-size="13" fill="#222">T1 ฝนแล้ง สภาพอากาศแปรปรวน</text>
<text x="32.0" y="364.0" text-anchor="start" font-size="13" fill="#222">T2 กาแฟนำเข้าราคาต่ำ</text>
<rect x="250.0" y="282.0" width="315.0" height="150.0" rx="0" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="407.5" y="316.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">ST ใช้จุดแข็งรับอุปสรรค</text>
<text x="407.5" y="348.0" text-anchor="middle" font-size="13" fill="#222">สร้างตราสินค้าแหล่งกำเนิด</text>
<text x="407.5" y="370.0" text-anchor="middle" font-size="13" fill="#222">หนีการแข่งขันด้านราคา (S1 + T2)</text>
<rect x="565.0" y="282.0" width="315.0" height="150.0" rx="0" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="722.5" y="316.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">WT ลดจุดอ่อนและเลี่ยงอุปสรรค</text>
<text x="722.5" y="348.0" text-anchor="middle" font-size="13" fill="#222">ร่วมลงทุนระบบน้ำหยดกับสมาชิก</text>
<text x="722.5" y="370.0" text-anchor="middle" font-size="13" fill="#222">ลดความเสียหายจากแล้ง (W1 + T1)</text>
<text x="450.0" y="462.0" text-anchor="middle" font-size="13" fill="#444">SWOT บอกสถานการณ์ ส่วน TOWS จับคู่ปัจจัยเป็นทางเลือกกลยุทธ์</text>
</svg>
