problems:
- id: business.international.trade.p001
  topics:
  - business.international.trade
  difficulty: 1
  type: mcq
  stem: เหตุผลสำคัญที่สุดที่ประเทศต่าง ๆ ค้าขายกันคือข้อใด
  choices:
  - id: a
    text: แต่ละประเทศมีทรัพยากร ภูมิอากาศ และทักษะต่างกัน จึงผลิตบางอย่างได้ดีกว่าและแลกเปลี่ยนกัน
    correct: true
  - id: b
    text: ทุกประเทศผลิตทุกอย่างได้ดีเท่ากัน
    feedback: ถ้าเป็นเช่นนั้นก็แทบไม่มีเหตุผลให้ค้าขาย
  - id: c
    text: เพื่อให้ประเทศอื่นจ่ายภาษีให้
    feedback: การค้าเกิดเพราะทั้งสองฝ่ายได้ประโยชน์ ไม่ใช่เพื่อเก็บภาษีจากอีกฝ่าย
  - id: d
    text: เพราะกฎหมายบังคับให้ทุกประเทศต้องนำเข้า
    feedback: ไม่มีกฎแบบนั้น ประเทศค้าขายเพราะได้ประโยชน์
  hints:
  - ทำไมไทยปลูกทุเรียนได้ แต่บางประเทศปลูกไม่ได้
  - ทรัพยากรในโลกกระจายไม่เท่ากัน
  solution: ทรัพยากรธรรมชาติ ภูมิอากาศ แรงงาน ทุน และเทคโนโลยีกระจายไม่เท่ากัน แต่ละประเทศจึงผลิตบางอย่างได้ถูกกว่าหรือดีกว่า การค้าระหว่างประเทศทำให้ทุกฝ่ายได้สินค้ามากกว่าการผลิตเองทั้งหมด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.trade.p002
  topics:
  - business.international.trade
  difficulty: 2
  type: match
  stem: จับคู่ลักษณะทรัพยากรของประเทศ (สมมติ) กับรูปแบบการค้าที่น่าจะเกิด
  pairs:
  - left: มีแหล่งน้ำมันขนาดใหญ่แต่พื้นที่เพาะปลูกน้อย
    right: ส่งออกน้ำมัน นำเข้าอาหาร
  - left: มีพื้นที่เกษตรกว้างและภูมิอากาศร้อนชื้น
    right: ส่งออกข้าว ยางพารา ผลไม้เมืองร้อน
  - left: มีทุนและแรงงานทักษะสูงมาก
    right: ส่งออกเครื่องจักรและเทคโนโลยี
  - left: มีแรงงานจำนวนมากค่าแรงต่ำ
    right: รับจ้างผลิตและประกอบสินค้าที่ใช้แรงงานมาก
  hints:
  - ประเทศมักส่งออกสิ่งที่ใช้ทรัพยากรที่ตนมีมาก
  - และนำเข้าสิ่งที่ใช้ทรัพยากรที่ตนขาด
  solution: น้ำมันมาก → ส่งออกน้ำมัน นำเข้าอาหาร · พื้นที่เกษตรร้อนชื้น → ส่งออกสินค้าเกษตรเมืองร้อน · ทุนและทักษะสูง → ส่งออกเครื่องจักร · แรงงานมากค่าแรงต่ำ → ผลิตสินค้าใช้แรงงานมาก การกระจายทรัพยากรที่ต่างกันจึงกำหนดความสัมพันธ์ทางเศรษฐกิจระหว่างประเทศ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.trade.p003
  topics:
  - business.international.trade
  difficulty: 2
  type: numeric
  stem: จากตาราง ประเทศไทยใช้แรงงาน 1 วันผลิตข้าวได้ $6$ กระสอบ หรือชิ้นส่วนอิเล็กทรอนิกส์ $2$ ชิ้น **ค่าเสียโอกาส** ของการผลิตข้าว $1$ กระสอบในไทยเท่ากับชิ้นส่วนกี่ชิ้น (ตอบทศนิยม 2 ตำแหน่ง)
  answer:
    value: 0.333333
    tolerance: 0.01
    unit: ชิ้น
  misconceptions:
  - match: 3
    feedback: หารกลับด้าน นั่นคือค่าเสียโอกาสของชิ้นส่วน 1 ชิ้น (เป็นข้าว)
  - match: 2
    feedback: ยังไม่ได้หารด้วยจำนวนกระสอบ
  figure: &id001
    src: p-production.svg
    alt: ตารางผลผลิตต่อแรงงาน 1 วัน (สมมติ) ประเทศไทย ผลิตข้าวได้ 6 กระสอบ หรือชิ้นส่วนอิเล็กทรอนิกส์ 2 ชิ้น ประเทศ B ผลิตข้าวได้ 8 กระสอบ หรือชิ้นส่วนอิเล็กทรอนิกส์ 8 ชิ้น แต่ละประเทศมีแรงงาน 100 วัน
  hints:
  - ผลิตข้าวเพิ่ม 6 กระสอบ ต้องสละชิ้นส่วน 2 ชิ้น
  - ค่าเสียโอกาสต่อข้าว 1 กระสอบ $= 2 \div 6$
  solution: ค่าเสียโอกาส $= \dfrac{2}{6} \approx 0.33$ ชิ้นต่อข้าว 1 กระสอบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.trade.p004
  topics:
  - business.international.trade
  difficulty: 3
  type: mcq
  stem: จากตาราง ประเทศ B ผลิตได้มากกว่าไทยทั้งข้าวและชิ้นส่วน ข้อใดถูกต้อง
  choices:
  - id: a
    text: ไทยมีความได้เปรียบโดยเปรียบเทียบในข้าว ส่วน B ในชิ้นส่วน
    correct: true
  - id: b
    text: B ควรผลิตทั้งสองอย่างเอง ไม่ต้องค้ากับไทย
    feedback: แม้ B ได้เปรียบโดยสมบูรณ์ทั้งสองอย่าง ทั้งสองประเทศยังได้ประโยชน์จากการผลิตตามความได้เปรียบโดยเปรียบเทียบ
  - id: c
    text: ไทยมีความได้เปรียบโดยเปรียบเทียบในชิ้นส่วน
    feedback: ค่าเสียโอกาสชิ้นส่วนในไทย 3 กระสอบ สูงกว่าใน B ที่ 1 กระสอบ
  - id: d
    text: ไม่มีประเทศใดได้เปรียบ
    feedback: ค่าเสียโอกาสของสองประเทศต่างกัน จึงมีความได้เปรียบโดยเปรียบเทียบ
  figure: *id001
  hints:
  - เทียบค่าเสียโอกาส ไม่ใช่ปริมาณที่ผลิตได้
  - 'ข้าว 1 กระสอบ: ไทยเสียชิ้นส่วน $\tfrac13$ ชิ้น B เสีย 1 ชิ้น'
  solution: 'ค่าเสียโอกาสของข้าว 1 กระสอบ: ไทย $\tfrac{2}{6} \approx 0.33$ ชิ้น B $\tfrac{8}{8} = 1$ ชิ้น ไทยต่ำกว่า จึงได้เปรียบโดยเปรียบเทียบในข้าว ค่าเสียโอกาสของชิ้นส่วน 1 ชิ้น: ไทย $3$ กระสอบ B $1$ กระสอบ B จึงได้เปรียบในชิ้นส่วน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.trade.p005
  topics:
  - business.international.trade
  difficulty: 3
  type: match
  stem: จับคู่วิธีกีดกันทางการค้ากับตัวอย่าง (สมมติ)
  pairs:
  - left: ภาษีศุลกากร (อากรขาเข้า)
    right: เก็บ 20% ของราคาสินค้านำเข้า
  - left: โควตานำเข้า
    right: อนุญาตให้นำเข้าได้ไม่เกิน 40,000 เครื่องต่อปี
  - left: มาตรฐานสินค้าและสุขอนามัย
    right: ผลไม้นำเข้าต้องผ่านการตรวจสารตกค้างตามเกณฑ์ที่กำหนด
  - left: การอุดหนุนการส่งออก
    right: รัฐจ่ายเงินช่วยผู้ส่งออกต่อหน่วยที่ส่งออก
  hints:
  - บางวิธีจำกัดด้วยราคา บางวิธีจำกัดด้วยปริมาณ
  - มาตรการที่ไม่ใช่ภาษีอาจมาในรูปมาตรฐานหรือใบอนุญาต
  solution: อากรขาเข้า → เก็บภาษีเป็นร้อยละของราคา · โควตา → จำกัดปริมาณ · มาตรฐานสินค้า → มาตรการที่มิใช่ภาษี · อุดหนุนส่งออก → ช่วยผู้ส่งออกให้แข่งได้ในต่างประเทศ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.trade.p006
  topics:
  - business.international.trade
  difficulty: 2
  type: numeric
  stem: สินค้านำเข้าชิ้นหนึ่งราคา $1{,}000$ บาท ถูกเก็บอากรขาเข้าแบบตามราคา $20\%$ (อัตราสมมติ) ราคารวมอากรเป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 1200
    unit: บาท
  misconceptions:
  - match: 200
    feedback: นั่นคือเฉพาะอากร
  - match: 1020
    feedback: คิด 2% ไม่ใช่ 20%
  hints:
  - อากร $= 1{,}000 \times 20\%$
  - ราคารวม $=$ ราคาสินค้า $+$ อากร
  solution: อากร $= 1{,}000 \times 0.20 = 200$ บาท ราคารวมอากร $= 1{,}200$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.trade.p007
  topics:
  - business.international.trade
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็น **เหตุผลที่ประเทศใช้มาตรการกีดกันทางการค้า** เลือกทุกข้อที่ถูก
  multiple: true
  choices:
  - id: a
    text: ปกป้องอุตสาหกรรมที่เพิ่งเริ่มต้นให้มีเวลาเติบโต
    correct: true
  - id: b
    text: รักษาการจ้างงานในอุตสาหกรรมภายในประเทศ
    correct: true
  - id: c
    text: คุ้มครองสุขภาพผู้บริโภคและสิ่งแวดล้อม
    correct: true
  - id: d
    text: หารายได้ภาษีให้รัฐ
    correct: true
  - id: e
    text: ทำให้ผู้บริโภคในประเทศซื้อสินค้าได้ถูกลง
    feedback: การกีดกันมักทำให้ราคาในประเทศสูงขึ้น ผู้บริโภคเสียประโยชน์
  hints:
  - คิดว่าใครในประเทศอยากให้กีดกันสินค้านำเข้า
  - 'การกีดกันมีต้นทุน: ผู้บริโภคจ่ายแพงขึ้น'
  solution: เหตุผลที่พบบ่อยคือ ปกป้องอุตสาหกรรมเริ่มต้น รักษางาน ความมั่นคง สุขภาพและสิ่งแวดล้อม และรายได้ภาษี แต่การกีดกันทำให้ราคาในประเทศสูงขึ้นและผู้บริโภคเสียประโยชน์ จึงต้องชั่งผลได้ผลเสีย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.trade.p008
  topics:
  - business.international.trade
  difficulty: 3
  type: numeric
  stem: ตลาดเครื่องปั่นน้ำผลไม้ในประเทศไทย (สมมติ) มีอุปสงค์ในประเทศ $Q_d = 200 - 2P$ และอุปทานจากผู้ผลิตในประเทศ $Q_s = -40 + 2P$ ($P$ เป็นร้อยบาทต่อเครื่อง $Q$ เป็นพันเครื่อง) ราคาตลาดโลกเท่ากับ $40$ และไทยนำเข้าได้ไม่จำกัดที่ราคานี้ ไทยจะนำเข้าเครื่องปั่นกี่พันเครื่อง (ตอบเป็นพันเครื่อง)
  answer:
    value: 80
    unit: พันเครื่อง
  misconceptions:
  - match: 120
    feedback: นั่นคือความต้องการซื้อทั้งหมด ต้องหักส่วนที่ผลิตในประเทศ
  - match: 0
    feedback: ราคาโลกต่ำกว่าราคาดุลยภาพในประเทศ (60) จึงมีการนำเข้า
  hints:
  - หา $Q_d$ และ $Q_s$ ที่ราคาโลก $P = 40$
  - นำเข้า $= Q_d - Q_s$
  solution: 'ที่ $P = 40$: $Q_d = 200 - 80 = 120$ $Q_s = -40 + 80 = 40$ นำเข้า $= 120 - 40 = 80$ พันเครื่อง'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.trade.p009
  topics:
  - business.international.trade
  difficulty: 4
  type: numeric
  stem: ตลาดเครื่องปั่นน้ำผลไม้ในประเทศไทย (สมมติ) มีอุปสงค์ในประเทศ $Q_d = 200 - 2P$ และอุปทานจากผู้ผลิตในประเทศ $Q_s = -40 + 2P$ ($P$ เป็นร้อยบาทต่อเครื่อง $Q$ เป็นพันเครื่อง) ราคาตลาดโลกเท่ากับ $40$ และไทยนำเข้าได้ไม่จำกัดที่ราคานี้ ถ้ารัฐเก็บอากรขาเข้าเครื่องละ $10$ (ร้อยบาท) ราคาในประเทศกลายเป็น $50$ ไทยจะนำเข้ากี่พันเครื่อง (ตอบเป็นพันเครื่อง)
  answer:
    value: 40
    unit: พันเครื่อง
  misconceptions:
  - match: 80
    feedback: นั่นคือการนำเข้าก่อนเก็บอากร
  - match: 100
    feedback: นั่นคือความต้องการซื้อทั้งหมดที่ราคา 50
  hints:
  - หา $Q_d$ และ $Q_s$ ที่ $P = 50$
  - นำเข้า $= Q_d - Q_s$
  solution: 'ที่ $P = 50$: $Q_d = 100$ $Q_s = 60$ นำเข้า $= 40$ พันเครื่อง ลดลงจาก $80$ เพราะผู้บริโภคซื้อน้อยลงและผู้ผลิตในประเทศผลิตมากขึ้น'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.trade.p010
  topics:
  - business.international.trade
  difficulty: 4
  type: numeric
  stem: ตลาดเครื่องปั่นน้ำผลไม้ในประเทศไทย (สมมติ) มีอุปสงค์ในประเทศ $Q_d = 200 - 2P$ และอุปทานจากผู้ผลิตในประเทศ $Q_s = -40 + 2P$ ($P$ เป็นร้อยบาทต่อเครื่อง $Q$ เป็นพันเครื่อง) ราคาตลาดโลกเท่ากับ $40$ และไทยนำเข้าได้ไม่จำกัดที่ราคานี้ หลังเก็บอากรเครื่องละ $10$ (ร้อยบาท) ราคาในประเทศเป็น $50$ รัฐเก็บอากรได้กี่ล้านบาท (ตอบเป็นล้านบาท)
  answer:
    value: 40.0
    unit: ล้านบาท
  misconceptions:
  - match: 80
    feedback: ใช้ปริมาณนำเข้าก่อนเก็บอากร
  - match: 400
    feedback: ลืมแปลงหน่วยร้อยบาทและพันเครื่อง
  hints:
  - อากรรวม $=$ อากรต่อเครื่อง $\times$ จำนวนนำเข้าหลังเก็บอากร
  - อากร $10$ ร้อยบาท $= 1{,}000$ บาท และนำเข้า $40$ พันเครื่อง $= 40{,}000$ เครื่อง
  solution: นำเข้า $40{,}000$ เครื่อง × $1{,}000$ บาท $= 40{,}000{,}000$ บาท $= 40$ ล้านบาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.international.trade.p011
  topics:
  - business.international.trade
  difficulty: 5
  type: numeric
  stem: ตลาดเครื่องปั่นน้ำผลไม้ในประเทศไทย (สมมติ) มีอุปสงค์ในประเทศ $Q_d = 200 - 2P$ และอุปทานจากผู้ผลิตในประเทศ $Q_s = -40 + 2P$ ($P$ เป็นร้อยบาทต่อเครื่อง $Q$ เป็นพันเครื่อง) ราคาตลาดโลกเท่ากับ $40$ และไทยนำเข้าได้ไม่จำกัดที่ราคานี้ เมื่อเก็บอากรเครื่องละ $10$ ราคาในประเทศขึ้นจาก $40$ เป็น $50$ ผู้บริโภคเสียประโยชน์ (ส่วนเกินผู้บริโภคลดลง) เท่าไร ในหน่วย ร้อยบาท $\times$ พันเครื่อง (ตอบเป็นตัวเลข)
  answer:
    value: 1100
  misconceptions:
  - match: 400
    feedback: นั่นคือรายได้อากรของรัฐ ผู้บริโภคเสียมากกว่านั้น
  - match: 1000
    feedback: ใช้ $Q_d = 100$ ตลอดช่วง ต้องใช้รูปสี่เหลี่ยมคางหมู
  hints:
  - ส่วนเกินผู้บริโภคที่ลดลงเป็นพื้นที่สี่เหลี่ยมคางหมูระหว่างราคา $40$ ถึง $50$ ทางซ้ายของเส้นอุปสงค์
  - ด้านขนานยาว $Q_d$ ที่ราคา $40$ และ $50$ คือ $120$ และ $100$ สูง $10$
  solution: พื้นที่ $= \dfrac{120 + 100}{2} \times 10 = 1{,}100$ (ร้อยบาท × พันเครื่อง $= 110$ ล้านบาท) แบ่งเป็นผู้ผลิตในประเทศได้ $\dfrac{40 + 60}{2} \times 10 = 500$ รัฐได้อากร $400$ และสูญเปล่า $200$ อากรจึงทำให้สังคมโดยรวมเสียประโยชน์
