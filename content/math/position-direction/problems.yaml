  - id: math.geometry.position-direction.p016
    topics: [math.geometry.position-direction]
    difficulty: 4
    type: mcq
    stem: "จุด A, B, C ในภาพเป็นจุดมุมสามจุดของรูปสี่เหลี่ยมจัตุรัส ABCD จุด D ต้องอยู่ที่ใด (ตัวเลขแรกบอกระยะไปทางขวา ตัวเลขที่สองบอกระยะขึ้นไปข้างบน)"
    figure: { src: square-grid.svg, alt: "ตารางมีเลข 0 ถึง 6 ตามแนวนอน (ไปทางขวา) และแนวตั้ง (ขึ้นบน) จุด A อยู่ที่ (1, 2) จุด B อยู่ที่ (4, 2) จุด C อยู่ที่ (4, 5) มีเส้นต่อจาก A ไป B และจาก B ไป C" }
    choices:
      - { id: a, text: "(1, 5)", correct: true }
      - { id: b, text: "(5, 1)", feedback: "สลับตัวเลขสองตัว ตัวเลขแรกคือระยะไปทางขวา จุด D ต้องอยู่ตรงขึ้นไปจาก A" }
      - { id: c, text: "(1, 4)", feedback: "ด้าน AD ยาวแค่ 2 ช่อง แต่ AB ยาว 3 ช่อง ด้านของจัตุรัสต้องยาวเท่ากัน" }
      - { id: d, text: "(5, 5)", feedback: "จุดนี้อยู่ขวาของ C แต่ D ต้องอยู่ตรงขึ้นไปจาก A และอยู่ระดับเดียวกับ C" }
    hints:
      - "AB ยาวกี่ช่อง ด้านของจัตุรัสต้องยาวเท่ากันทุกด้าน"
      - "D ต้องอยู่ตรงขึ้นไปจาก A และอยู่ระดับเดียวกับ C"
    solution: "AB ยาว $4 - 1 = 3$ ช่อง BC ยาว $5 - 2 = 3$ ช่อง จุด D อยู่ตรงขึ้นไปจาก A อีก 3 ช่อง คือไปทางขวา 1 ขึ้น $2 + 3 = 5$ ได้ $(1, 5)$ ซึ่งอยู่ระดับเดียวกับ C พอดี"
