    ai_assisted: true

  - id: health.family.family-and-self.p015
    topics: [health.family.family-and-self]
    difficulty: 4
    type: mcq
    stem: "เด็กคนหนึ่งเล่าให้ครูฟังว่าถูกผู้ใหญ่ในบ้านตีจนเป็นรอยช้ำบ่อย ๆ และกลัวไม่อยากกลับบ้าน ข้อใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "ไม่ใช่ความผิดของเด็ก การบอกครูถูกต้องแล้ว ครูและหน่วยงาน เช่น สายด่วน 1300 ช่วยได้", correct: true }
      - { id: b, text: "เด็กควรเก็บเป็นความลับ เพราะเป็นเรื่องในบ้าน", feedback: "การถูกทำร้ายไม่ใช่เรื่องที่ต้องเก็บเป็นความลับ ต้องบอกผู้ใหญ่ที่ไว้ใจ" }
      - { id: c, text: "เด็กคงทำผิดมาก จึงสมควรถูกตี", feedback: "ไม่มีเด็กคนใดสมควรถูกทำร้ายจนบาดเจ็บ" }
      - { id: d, text: "เด็กควรหนีออกจากบ้านไปอยู่คนเดียว", feedback: "การหนีไปคนเดียวเสี่ยงอันตรายมาก ควรขอความช่วยเหลือจากผู้ใหญ่ที่ไว้ใจหรือสายด่วน" }
    hints:
      - "เด็กทุกคนมีสิทธิ์ปลอดภัยในบ้าน"
      - "ทบทวนส่วน \"ถ้าไม่ปลอดภัยที่บ้าน\" ในบทเรียน"
    solution: "การถูกทำร้ายไม่ใช่ความผิดของเด็ก ควรบอกผู้ใหญ่ที่ไว้ใจ เช่น ครู ซึ่งจะประสานความช่วยเหลือ หรือโทร 1300 ศูนย์ช่วยเหลือสังคม ถ้าบาดเจ็บรุนแรงโทร 1669"
