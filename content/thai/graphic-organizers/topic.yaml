id: thai.reading.graphic-organizers
subject: thai
title: { th: "ผังความคิด กรอบแนวคิด และบันทึกจากการอ่าน", en: "Mind maps, concept frameworks and reading notes" }
summary: อ่านแล้วจัดความรู้เป็นผังความคิด ผังลำดับ แผนภาพเวนน์ ผังก้างปลา และกรอบแนวคิด จดบันทึกแบบแบ่งช่องพร้อมแหล่งที่มา และนำไปเขียนย่อความและรายงานการอ่าน
difficulty: 4.5
minutes: 30
prerequisites: [thai.reading.comprehension, thai.composition.summary-writing]
encompasses:
  - { id: thai.reading.comprehension, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: plastic-mindmap.svg
    alt: "ผังความคิดเรื่องขยะพลาสติก กลางหน้าเขียนว่า ขยะพลาสติก มีกิ่งใหญ่ 3 กิ่ง กิ่ง แหล่งที่มา มีกิ่งย่อย ถุงหิ้ว ขวดน้ำ หลอด กิ่ง ผลกระทบ มีกิ่งย่อย สัตว์ทะเลกินเข้าไป ท่อระบายน้ำอุดตัน ไมโครพลาสติก กิ่ง วิธีลด มีกิ่งย่อย พกถุงผ้า ใช้กระบอกน้ำ แยกขยะรีไซเคิล"
    caption: "ผังความคิด หัวเรื่องกลางหน้า กิ่งใหญ่คือใจความ กิ่งย่อยคือรายละเอียด"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: organizer-types.svg
    alt: "แผนภาพ 4 แบบ ผังลำดับ กล่องขั้นที่ 1 2 3 เรียงด้วยลูกศร ใช้กับขั้นตอน แผนภาพเวนน์ วงกลมสองวงซ้อนกัน ส่วนซ้อนเขียนว่า เหมือน ส่วนไม่ซ้อนเขียนว่า ต่าง ใช้เปรียบเทียบ ผังก้างปลา หัวปลาคือปัญหา ก้างคือสาเหตุ ผังวงจร วงกลม 1 2 3 4 มีลูกศรวนกลับ ใช้กับวัฏจักร"
    caption: "เลือกแผนภาพให้ตรงกับโครงสร้างของเรื่อง"
  - type: worked-example
    title: ทำผังความคิดจากบทความสามย่อหน้า
    problem: "ทำผังความคิดจากบทความสมมติ ผึ้งตัวเล็ก งานใหญ่ (ดูภาพในโจทย์ข้อ 6)"
    steps:
      - text: "หาใจความทีละย่อหน้า (1) ผึ้งช่วยถ่ายเรณู (2) ผึ้งลดลงและสาเหตุ (3) วิธีช่วยผึ้ง"
      - text: "เขียน ผึ้ง กลางหน้า แล้วแตกกิ่งใหญ่ 3 กิ่ง: หน้าที่ · สาเหตุที่ลดลง · วิธีช่วยผึ้ง"
        why: "กิ่งใหญ่หนึ่งกิ่งต่อใจความหนึ่งย่อหน้า"
      - text: "เติมกิ่งย่อย หน้าที่ → ถ่ายเรณู ทำน้ำผึ้ง · สาเหตุ → สารเคมี แหล่งอาหารลดลง โรคและปรสิต · วิธีช่วย → ปลูกไม้ดอก ใช้สารเคมีเท่าที่จำเป็น สนับสนุนผู้เลี้ยงผึ้ง"
      - text: "ตรวจระดับ: ลำไย แตงโม ฟักทอง เป็นตัวอย่างของพืชที่ต้องพึ่งการถ่ายเรณู ถ้าจะใส่ ให้อยู่ใต้ ถ่ายเรณู อีกชั้นหนึ่ง"
    answer: "ผึ้ง → หน้าที่ (ถ่ายเรณู ทำน้ำผึ้ง) · สาเหตุที่ลดลง (สารเคมี แหล่งอาหารลดลง โรคและปรสิต) · วิธีช่วยผึ้ง (ปลูกไม้ดอก ใช้สารเคมีเท่าที่จำเป็น สนับสนุนผู้เลี้ยงผึ้ง)"
  - { type: check, problem: thai.reading.graphic-organizers.p005, prompt: "ส่วนซ้อนคือสิ่งที่เป็นจริงทั้งสองฝ่าย" }
  - type: worked-example
    title: จากบันทึกการอ่านสู่กรอบแนวคิด
    problem: "บทความสมมติบอกว่า มุมหนังสือในห้องเรียน เวลาอ่านทุกเช้า และหนังสือที่ตรงความสนใจ ทำให้นักเรียนรักการอ่าน เขียนกรอบแนวคิดและบันทึกที่ใช้อ้างอิงได้"
    steps:
      - text: "แยกปัจจัยกับผล: ปัจจัย 3 ข้อ ผล 1 ข้อ คือ นิสัยรักการอ่าน"
        why: "กรอบแนวคิดตอบว่าอะไรส่งผลต่ออะไร"
      - text: "วาดกล่องปัจจัยทางซ้าย 3 กล่อง กล่องผลทางขวา 1 กล่อง"
      - text: "ลากลูกศรจากปัจจัยแต่ละกล่องไปหาผล ไม่ลากกลับทิศ"
      - text: "จดชื่อบทความ ผู้เขียน แหล่ง วันที่ และเลขหน้าไว้หัวกระดาษ เพื่อใช้อ้างอิงในรายงาน"
    answer: "มุมหนังสือ · เวลาอ่านทุกเช้า · หนังสือตรงความสนใจ → นิสัยรักการอ่าน พร้อมข้อมูลแหล่งที่มาครบ"
  - { type: check, problem: thai.reading.graphic-organizers.p007, prompt: "กิ่งใหญ่ทุกกิ่งต้องเป็นใจความหลัก" }
glossary:
  - { term: ผังความคิด, definition: "แผนภาพที่แตกกิ่งจากหัวเรื่องกลางหน้า กิ่งใหญ่เป็นใจความ กิ่งย่อยเป็นรายละเอียด" }
  - { term: กรอบแนวคิด, definition: "แผนภาพกล่องและลูกศรที่แสดงว่าปัจจัยใดส่งผลต่ออะไร" }
  - { term: แผนภาพเวนน์, definition: "วงกลมซ้อนกันสำหรับเปรียบเทียบ ส่วนซ้อนคือสิ่งที่เหมือนกัน" }
  - { term: ผังก้างปลา, definition: "แผนภาพหาสาเหตุ หัวปลาคือปัญหา ก้างคือสาเหตุ" }
  - { term: บันทึกแบบแบ่งช่อง, definition: "บันทึกที่แบ่งเป็นช่องคำสำคัญ ช่องรายละเอียด และแถบสรุป (แบบคอร์เนลล์)" }
flashcards:
  - { front: "กลางผังความคิดเขียนอะไร", back: "หัวเรื่อง" }
  - { front: "เปรียบเทียบสองสิ่ง ใช้แผนภาพใด", back: "แผนภาพเวนน์หรือตารางเปรียบเทียบ" }
  - { front: "ลูกศรในกรอบแนวคิดชี้อย่างไร", back: "จากปัจจัย (เหตุ) ไปหาผล" }
  - { front: "บันทึกการอ่านต้องจดอะไรเพื่ออ้างอิง", back: "ชื่อเรื่อง ผู้เขียน แหล่ง วันที่ และเลขหน้า" }
