- id: health.family.maternal-child-family-planning.p016
  topics:
  - health.family.maternal-child-family-planning
  difficulty: 5
  type: numeric
  stem: (ข้อมูลสมมติ) โรงพยาบาลหนึ่งพบว่าทารก 250 คนที่แม่สูบบุหรี่ระหว่างตั้งครรภ์ มีน้ำหนักแรกเกิดน้อยกว่า 2,500 กรัม 30 คน ส่วนทารก 1,500 คนที่แม่ไม่สูบ มีน้ำหนักน้อย 75 คน ทารกกลุ่มแม่สูบบุหรี่มีความเสี่ยงน้ำหนักแรกเกิดน้อยเป็นกี่เท่าของอีกกลุ่ม
  answer:
    value: 2.4
    tolerance: 0.05
    unit: เท่า
  misconceptions:
  - match: 0.4
    feedback: นำจำนวนคน 30 ÷ 75 มาเทียบกันตรง ๆ แต่สองกลุ่มมีทารกไม่เท่ากัน
  - match: 7
    feedback: นี่คือผลต่างของร้อยละ (12 − 5) ไม่ใช่จำนวนเท่า
  hints:
  - คำนวณสัดส่วนของแต่ละกลุ่มก่อน เพราะจำนวนทารกไม่เท่ากัน
  - นำสัดส่วนของกลุ่มแม่สูบบุหรี่หารด้วยสัดส่วนของกลุ่มแม่ไม่สูบ
  solution: กลุ่มแม่สูบ $\frac{30}{250} = 0.12$ (12%) กลุ่มแม่ไม่สูบ $\frac{75}{1{,}500} = 0.05$ (5%) อัตราส่วน $0.12 \div 0.05 = 2.4$ เท่า
