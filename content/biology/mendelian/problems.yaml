problems:
  - id: biology.genetics.mendelian.p001
    topics: [biology.genetics.mendelian]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นฟีโนไทป์"
    choices:
      - { id: a, text: "ต้นถั่วลันเตาสูง", correct: true }
      - { id: b, text: "จีโนไทป์ Tt", feedback: "Tt เป็นจีโนไทป์ คือคู่ของแอลลีล" }
      - { id: c, text: "แอลลีล t", feedback: "แอลลีลเป็นรูปแบบหนึ่งของยีน ไม่ใช่ลักษณะที่ปรากฏ" }
      - { id: d, text: "ฮอมอไซกัสเด่น TT", feedback: "TT เป็นจีโนไทป์แบบฮอมอไซกัส" }
    hints:
      - "ฟีโนไทป์คือสิ่งที่สังเกตเห็นได้"
      - "จีโนไทป์เขียนเป็นตัวอักษรแทนแอลลีล"
    solution: "ฟีโนไทป์คือลักษณะที่ปรากฏ เช่น ต้นสูง ส่วน TT Tt เป็นจีโนไทป์ และ t เป็นแอลลีล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mendelian.p002
    topics: [biology.genetics.mendelian]
    difficulty: 1
    type: match
    stem: "จับคู่คำศัพท์ทางพันธุศาสตร์กับความหมาย"
    pairs:
      - { left: "แอลลีล", right: "รูปแบบต่าง ๆ ของยีนเดียวกัน" }
      - { left: "ฮอมอไซกัส", right: "จีโนไทป์ที่แอลลีลทั้งคู่เหมือนกัน เช่น tt" }
      - { left: "เฮเทอโรไซกัส", right: "จีโนไทป์ที่แอลลีลทั้งคู่ต่างกัน เช่น Tt" }
      - { left: "ฟีโนไทป์", right: "ลักษณะที่ปรากฏให้เห็น" }
    hints:
      - "ฮอมอ แปลว่าเหมือน เฮเทอโร แปลว่าต่าง"
      - "แอลลีล T และ t เป็นรูปแบบของยีนความสูงเดียวกัน"
    solution: "แอลลีลคือรูปแบบของยีน ฮอมอไซกัสมีแอลลีลเหมือนกัน เฮเทอโรไซกัสมีแอลลีลต่างกัน และฟีโนไทป์คือลักษณะที่ปรากฏ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mendelian.p003
    topics: [biology.genetics.mendelian]
    difficulty: 1
    type: text
    stem: "กฎของเมนเดลที่กล่าวว่า แอลลีลคู่หนึ่งแยกออกจากกันไปสู่เซลล์สืบพันธุ์คนละเซลล์ เรียกว่ากฎอะไร"
    accepted: ["กฎแห่งการแยก", "กฎการแยก", "law of segregation", "กฎข้อที่ 1 ของเมนเดล"]
    hints:
      - "กฎของเมนเดลมีสองข้อ"
      - "คำสำคัญของกฎข้อนี้คือ แยก"
    misconceptions:
      - { match: "กฎแห่งการรวมกลุ่มอย่างอิสระ", feedback: "กฎข้อนี้พูดถึงยีนต่างคู่ที่เข้าเซลล์สืบพันธุ์อย่างอิสระ ส่วนแอลลีลคู่เดียวกันแยกจากกันเป็นอีกกฎหนึ่ง" }
    solution: "กฎแห่งการแยก แอลลีลคู่หนึ่งแยกออกจากกันไปสู่เซลล์สืบพันธุ์คนละเซลล์ เซลล์สืบพันธุ์จึงมีแอลลีลของแต่ละยีนเพียงหนึ่งแอลลีล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mendelian.p004
    topics: [biology.genetics.mendelian]
    difficulty: 1
    type: numeric
    stem: "ต้นถั่วลันเตาที่มีจีโนไทป์ RrYy สร้างเซลล์สืบพันธุ์ที่มีจีโนไทป์ต่างกันได้กี่แบบ"
    answer: { value: 4, unit: แบบ }
    hints:
      - "เซลล์สืบพันธุ์ได้แอลลีลของแต่ละยีนเพียงหนึ่งแอลลีล"
      - "จำนวนแบบ = 2 ยกกำลังจำนวนคู่ยีนที่เป็นเฮเทอโรไซกัส"
    misconceptions:
      - { match: 2, feedback: "คิดเพียงยีนเดียว ต้นนี้เป็นเฮเทอโรไซกัส 2 คู่" }
      - { match: 16, feedback: "16 คือจำนวนช่องในตารางพันเนตต์ของ RrYy × RrYy ไม่ใช่จำนวนแบบของเซลล์สืบพันธุ์" }
    solution: "เซลล์สืบพันธุ์ได้ RY Ry rY ry รวม $2^2 = 4$ แบบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mendelian.p005
    topics: [biology.genetics.mendelian]
    difficulty: 2
    type: numeric
    stem: "ผสมถั่วลันเตาต้นสูง Tt กับต้นสูง Tt โอกาสที่ลูกแต่ละต้นจะเป็นต้นเตี้ยเท่ากับเท่าใด ตอบเป็นทศนิยม"
    answer: { value: 0.25, tolerance: 0.01 }
    hints:
      - "ต้นเตี้ยต้องมีจีโนไทป์ tt"
      - "ต้องได้ t จากทั้งสองต้น ใช้กฎการคูณ"
    misconceptions:
      - { match: 0.5, feedback: "นี่คือโอกาสได้ t จากต้นเดียว ต้องได้ t จากทั้งสองต้น" }
      - { match: 0.75, feedback: "นี่คือโอกาสเป็นต้นสูง" }
    solution: "$P(\\text{tt}) = \\frac12 \\times \\frac12 = \\frac14 = 0.25$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mendelian.p006
    topics: [biology.genetics.mendelian]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการทดลองของเมนเดลเรื่องความสูงของต้นถั่วลันเตา"
    items:
      - "คัดต้นสูงพันธุ์แท้และต้นเตี้ยพันธุ์แท้ (รุ่น P)"
      - "ผสมต้นสูงกับต้นเตี้ย ได้รุ่น F1 สูงทุกต้น"
      - "ให้ต้น F1 ผสมกันเอง"
      - "นับรุ่น F2 ได้สูง 787 ต้น เตี้ย 277 ต้น"
      - "สรุปว่าอัตราส่วนใกล้ 3 : 1 และเสนอกฎแห่งการแยก"
    hints:
      - "เริ่มจากพ่อแม่พันธุ์แท้"
      - "รุ่น F2 ได้จากการผสม F1 ด้วยกัน"
    solution: "รุ่น P พันธุ์แท้ → ผสมได้ F1 สูงทุกต้น → F1 ผสมกันเอง → นับ F2 → สรุปอัตราส่วน 3 : 1 และกฎแห่งการแยก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mendelian.p007
    topics: [biology.genetics.mendelian]
    difficulty: 2
    type: numeric
    stem: "เมนเดลนับเมล็ดถั่วรุ่น F2 ได้เมล็ดกลม 5,474 เมล็ด และเมล็ดขรุขระ 1,850 เมล็ด อัตราส่วนกลมต่อขรุขระเป็นเท่าใดต่อ 1 ตอบทศนิยม 2 ตำแหน่ง"
    answer: { value: 2.96, tolerance: 0.02 }
    hints:
      - "อัตราส่วนต่อ 1 = จำนวนกลม ÷ จำนวนขรุขระ"
      - "เทียบผลกับอัตราส่วนที่คาดไว้ 3 : 1"
    misconceptions:
      - { match: 0.34, feedback: "หารกลับด้าน ต้องเอาจำนวนเมล็ดกลมเป็นตัวตั้ง" }
      - { match: 3, feedback: "3 คืออัตราส่วนที่คาดไว้ แต่ข้อมูลจริงได้ใกล้เคียง ไม่ได้ 3 พอดี ลองคำนวณจริง" }
    solution: "$5{,}474 \\div 1{,}850 \\approx 2.96$ จึงได้ประมาณ $2.96 : 1$ ใกล้เคียง 3 : 1 เพราะจำนวนเมล็ดมาก ผลจริงจึงใกล้ค่าทางทฤษฎี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mendelian.p008
    topics: [biology.genetics.mendelian]
    difficulty: 2
    type: numeric
    stem: "ครอบครัวหนึ่งมีลูกสาว 2 คนแล้ว และกำลังจะมีลูกคนที่ 3 โอกาสที่ลูกคนที่ 3 จะเป็นชายเท่ากับเท่าใด ตอบเป็นทศนิยม"
    answer: { value: 0.5, tolerance: 0.01 }
    hints:
      - "เพศของลูกขึ้นกับอสุจิที่มี X หรือ Y"
      - "การตั้งครรภ์แต่ละครั้งเป็นอิสระจากครั้งก่อน"
    misconceptions:
      - { match: 0.125, feedback: "นี่คือโอกาสที่ลูก 3 คนจะเป็น หญิง หญิง ชาย ตามลำดับ แต่ลูก 2 คนแรกเกิดแล้ว ไม่ต้องคูณ" }
      - { match: 1, feedback: "ลูกคนก่อนไม่ได้ทำให้คนถัดไปต้องเป็นชาย แต่ละครั้งเป็นอิสระต่อกัน" }
    solution: "แม่ให้ X เสมอ พ่อให้ X หรือ Y อย่างละครึ่ง ลูกแต่ละคนมีโอกาสเป็นชาย $\\frac12 = 0.5$ ไม่ขึ้นกับลูกคนก่อน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mendelian.p009
    topics: [biology.genetics.mendelian]
    difficulty: 3
    type: numeric
    stem: "สามีและภรรยาตรวจเลือดก่อนมีบุตรแล้วพบว่าเป็นพาหะของเบตาธาลัสซีเมียทั้งคู่ (Aa) และมีสุขภาพปกติ โอกาสที่ลูกแต่ละคนจะเป็นพาหะเหมือนพ่อแม่เท่ากับเท่าใด ตอบเป็นทศนิยม"
    answer: { value: 0.5, tolerance: 0.01 }
    hints:
      - "วาดตารางพันเนตต์ Aa × Aa"
      - "พาหะคือจีโนไทป์ Aa ซึ่งเกิดได้ 2 ช่องจาก 4 ช่อง"
    misconceptions:
      - { match: 0.25, feedback: "นับเพียงช่องเดียว Aa เกิดได้สองทาง คือ A จากพ่อกับ a จากแม่ และ a จากพ่อกับ A จากแม่" }
      - { match: 0.75, feedback: "นี่คือโอกาสที่ลูกจะไม่เป็นโรค (AA หรือ Aa) โจทย์ถามเฉพาะการเป็นพาหะ" }
    solution: "Aa × Aa ได้ AA : Aa : aa = 1 : 2 : 1 โอกาสเป็นพาหะ (Aa) $= \\frac24 = 0.5$ พาหะมีสุขภาพปกติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mendelian.p010
    topics: [biology.genetics.mendelian]
    difficulty: 3
    type: mcq
    stem: "นำต้นถั่วดอกสีม่วงที่ไม่ทราบจีโนไทป์ (ม่วงเด่นต่อขาว) ไปผสมกับต้นดอกสีขาว ได้ลูกดอกสีม่วง 52 ต้น ดอกสีขาว 49 ต้น ต้นดอกสีม่วงนั้นมีจีโนไทป์ใด"
    choices:
      - { id: a, text: "เฮเทอโรไซกัส (Pp)", correct: true }
      - { id: b, text: "ฮอมอไซกัสเด่น (PP)", feedback: "ถ้าเป็น PP ลูกจะได้ P ทุกต้นและเป็นสีม่วงทั้งหมด" }
      - { id: c, text: "ฮอมอไซกัสด้อย (pp)", feedback: "pp เป็นดอกสีขาว แต่ต้นนี้ดอกสีม่วง" }
      - { id: d, text: "บอกไม่ได้", feedback: "การผสมทดสอบกับต้นด้อย pp บอกจีโนไทป์ได้จากอัตราส่วนของลูก" }
    hints:
      - "ต้นดอกสีขาวเป็น pp ให้เซลล์สืบพันธุ์ p เสมอ"
      - "ลูกสีม่วง : ขาว ≈ 1 : 1 แปลว่าต้นสีม่วงให้เซลล์สืบพันธุ์กี่แบบ"
    solution: "นี่คือการผสมทดสอบ ต้นขาว pp ให้ p เสมอ ลูกสีขาว (pp) เกิดได้เมื่อต้นสีม่วงให้ p ด้วย ลูกม่วง : ขาว ≈ 1 : 1 ต้นสีม่วงจึงเป็น Pp"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mendelian.p011
    topics: [biology.genetics.mendelian]
    difficulty: 3
    type: numeric
    stem: "ผสมถั่วเมล็ดกลมสีเหลือง RrYy กับ RrYy ได้เมล็ด 320 เมล็ด คาดว่าจะมีเมล็ดกลมสีเขียวประมาณกี่เมล็ด"
    answer: { value: 60, unit: เมล็ด }
    hints:
      - "เมล็ดกลมสีเขียวมีจีโนไทป์ R_yy"
      - "P(กลม) × P(เขียว) = 3/4 × 1/4"
    misconceptions:
      - { match: 180, feedback: "180 คือเมล็ดกลมสีเหลือง (9/16)" }
      - { match: 20, feedback: "20 คือเมล็ดขรุขระสีเขียว (1/16)" }
    solution: "$P(\\text{กลม เขียว}) = \\frac34 \\times \\frac14 = \\frac{3}{16}$ จำนวนที่คาด $= 320 \\times \\frac{3}{16} = 60$ เมล็ด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mendelian.p012
    topics: [biology.genetics.mendelian]
    difficulty: 3
    type: mcq
    stem: "ดอกบานเย็นสีชมพู (การข่มไม่สมบูรณ์ระหว่างสีแดงกับสีขาว) ผสมกับดอกบานเย็นสีชมพู ลูกจะมีสีอย่างไร"
    choices:
      - { id: a, text: "แดง : ชมพู : ขาว = 1 : 2 : 1", correct: true }
      - { id: b, text: "ชมพูทั้งหมด", feedback: "พ่อแม่เป็นเฮเทอโรไซกัส ลูกจึงได้จีโนไทป์ฮอมอไซกัสได้ด้วย ไม่ได้ชมพูทั้งหมด" }
      - { id: c, text: "แดง : ขาว = 3 : 1", feedback: "3 : 1 เป็นผลเมื่อมีการข่มสมบูรณ์ ในการข่มไม่สมบูรณ์เฮเทอโรไซกัสมีสีของตัวเอง" }
      - { id: d, text: "ชมพู : ขาว = 3 : 1", feedback: "ลองเขียนตารางพันเนตต์ จะมีลูกสีแดงด้วย" }
    hints:
      - "ดอกสีชมพูเป็นเฮเทอโรไซกัส"
      - "ในการข่มไม่สมบูรณ์ แต่ละจีโนไทป์มีฟีโนไทป์ของตัวเอง"
    solution: "ชมพูเป็นเฮเทอโรไซกัส ผสมกันได้จีโนไทป์ 1 : 2 : 1 และเพราะข่มไม่สมบูรณ์ ฟีโนไทป์จึงเป็น แดง : ชมพู : ขาว = 1 : 2 : 1 เช่นกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mendelian.p013
    topics: [biology.genetics.mendelian]
    difficulty: 3
    type: match
    stem: "จับคู่จีโนไทป์กับหมู่เลือดระบบ ABO"
    pairs:
      - { left: "IᴬIᴮ", right: "หมู่ AB" }
      - { left: "Iᴬi", right: "หมู่ A" }
      - { left: "IᴮIᴮ", right: "หมู่ B" }
      - { left: "ii", right: "หมู่ O" }
    hints:
      - "Iᴬ และ Iᴮ เด่นต่อ i"
      - "Iᴬ กับ Iᴮ ข่มร่วมกัน แสดงออกทั้งคู่"
    solution: "IᴬIᴮ เป็นหมู่ AB (ข่มร่วมกัน) Iᴬi เป็นหมู่ A IᴮIᴮ เป็นหมู่ B และ ii เป็นหมู่ O"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mendelian.p014
    topics: [biology.genetics.mendelian]
    difficulty: 4
    type: numeric
    stem: "พ่อมีหมู่เลือด A จีโนไทป์ Iᴬi แม่มีหมู่เลือด B จีโนไทป์ Iᴮi โอกาสที่ลูกจะมีหมู่เลือด O เท่ากับเท่าใด ตอบเป็นทศนิยม"
    answer: { value: 0.25, tolerance: 0.01 }
    hints:
      - "หมู่ O ต้องเป็น ii"
      - "ลูกต้องได้ i จากทั้งพ่อและแม่"
    misconceptions:
      - { match: 0, feedback: "พ่อหมู่ A และแม่หมู่ B มีลูกหมู่ O ได้ ถ้าทั้งคู่มีแอลลีล i" }
      - { match: 0.5, feedback: "นี่คือโอกาสได้ i จากคนเดียว ต้องได้จากทั้งสองคน" }
    solution: "$P(\\text{ii}) = \\frac12 \\times \\frac12 = \\frac14 = 0.25$ ลูกคู่นี้มีหมู่เลือดได้ทั้ง A B AB และ O อย่างละ $\\frac14$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.genetics.mendelian.p015
    topics: [biology.genetics.mendelian]
    difficulty: 4
    type: numeric
