id: engineering.environmental.eia
subject: engineering
title: { th: การประเมินผลกระทบสิ่งแวดล้อมและเครื่องมือการจัดการสิ่งแวดล้อม, en: Environmental impact assessment and management tools }
summary: ขั้นตอนการจัดทำรายงาน EIA ในไทย เมทริกซ์ Leopold การมีส่วนร่วมของประชาชน ระบบจัดการสิ่งแวดล้อม LCA และการคิดผลกระทบภายใต้ความไม่แน่นอน
difficulty: 6
minutes: 40
prerequisites: [chemistry.industry.life-cycle-assessment, management.quality.iso-management-systems]
encompasses:
  - { id: chemistry.industry.life-cycle-assessment, weight: 0.3 }
  - { id: management.quality.iso-management-systems, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - { type: check, problem: engineering.environmental.eia.p001, prompt: "ลองคิดก่อนอ่านต่อ: ทำไมต้องแยกรายงานเต็มรูปแบบกับรายงานเบื้องต้น" }
  - type: figure
    title: ขั้นตอนการจัดทำรายงาน EIA
    src: eia-process.svg
    alt: "ผังขั้นตอนแนวตั้งแปดกล่องเชื่อมด้วยลูกศร เริ่มจากเจ้าของโครงการเสนอโครงการ กำหนดขอบเขต ศึกษาสภาพแวดล้อมพื้นฐาน ทำนายผลกระทบและเสนอมาตรการ เสนอแผนติดตาม รับฟังความคิดเห็นประชาชน จัดทำรายงานฉบับสมบูรณ์ และหน่วยงานผู้ชำนาญการพิจารณา"
    caption: "ขั้นที่ 6 ต้องเกิดก่อนการสรุปผล เพื่อให้ความเห็นของประชาชนมีผลต่อการออกแบบ"
  - type: figure
    title: เมทริกซ์ผลกระทบแบบ Leopold
    src: leopold-matrix.svg
    alt: "ตารางสามคูณสามมีกิจกรรมสามแถวคือ ขุดหน้าดิน ขนส่งแร่ และปลูกป่าฟื้นฟู และปัจจัยสามคอลัมน์คือ คุณภาพอากาศ คุณภาพน้ำผิวดิน และการจ้างงานท้องถิ่น แต่ละช่องแสดงค่าขนาด m และค่าความสำคัญ i"
    caption: "คะแนนของแต่ละช่องคือ m คูณ i ค่า m มีเครื่องหมายบอกทิศทางของผลกระทบ"
  - type: worked-example
    title: คำนวณคะแนนรวมของกิจกรรมในเมทริกซ์ Leopold
    problem: "กิจกรรมขนส่งแร่ (A2) มีผลต่อคุณภาพอากาศ (ขนาด −4 ความสำคัญ 5) คุณภาพน้ำผิวดิน (ขนาด −2 ความสำคัญ 4) และการจ้างงานท้องถิ่น (ขนาด +2 ความสำคัญ 3) คะแนนรวมของกิจกรรมนี้เท่าไร"
    steps:
      - text: "คุณภาพอากาศ $= (-4) \\times 5 = -20$"
        why: "คะแนนของแต่ละช่องคือขนาดคูณความสำคัญ เครื่องหมายลบยังคงอยู่เพราะเป็นผลเสีย"
      - text: "คุณภาพน้ำผิวดิน $= (-2) \\times 4 = -8$ และการจ้างงานท้องถิ่น $= (+2) \\times 3 = +6$"
      - text: "คะแนนรวม $= -20 + (-8) + 6 = -22$"
        why: "ไม่ควรรวมขนาดหรือความสำคัญก่อนคูณ เพราะจะได้ค่าที่ไม่มีความหมายทางการประเมิน"
    answer: "คะแนนรวมประมาณ −22 บ่งว่าผลเสียเหนือกว่าผลดีโดยรวม แต่ต้องพิจารณาความสำคัญที่ชุมชนให้ด้วย"
  - type: worked-example
    title: คำนวณคะแนนคาดหมายเมื่อมีหลายสถานการณ์
    problem: "(ข้อมูลสมมติ) กิจกรรมหนึ่งมีสองสถานการณ์ สถานการณ์แรกความน่าจะเป็น 0.6 คะแนน −30 สถานการณ์ที่สองความน่าจะเป็น 0.4 คะแนน −10 คะแนนคาดหมายเท่าไร"
    steps:
      - text: "ตรวจว่าความน่าจะเป็นรวมเท่ากับ 1: $0.6 + 0.4 = 1$"
        why: "การถ่วงน้ำหนักจะถูกต้องต่อเมื่อความน่าจะเป็นครอบคลุมทุกสถานการณ์"
      - text: "คะแนนคาดหมาย $= 0.6 \\times (-30) + 0.4 \\times (-10) = -18 - 4 = -22$"
        why: "สถานการณ์ที่มีโอกาสสูงกว่ามีน้ำหนักมากกว่าในผลลัพธ์"
    answer: "คะแนนคาดหมายเท่ากับ −22 แต่ควรรายงานสถานการณ์ที่รุนแรงที่สุดควบคู่ไปด้วยเสมอ"
  - { type: check, problem: engineering.environmental.eia.p010, prompt: "การมีส่วนร่วมที่ได้ผลต้องเปลี่ยนการตัดสินใจได้จริง" }
glossary:
  - { term: การประเมินผลกระทบสิ่งแวดล้อม (EIA), definition: "กระบวนการศึกษาและทำนายผลกระทบของโครงการต่อสิ่งแวดล้อมก่อนการตัดสินใจ พร้อมเสนอมาตรการป้องกัน (environmental impact assessment)" }
  - { term: IEE, definition: "การประเมินผลกระทบสิ่งแวดล้อมเบื้องต้นสำหรับโครงการที่ผลกระทบน้อยกว่าโครงการที่ต้องทำ EIA เต็มรูปแบบ (initial environmental examination)" }
  - { term: เมทริกซ์ Leopold, definition: "ตารางที่ให้คะแนนขนาดและความสำคัญของผลกระทบของกิจกรรมต่อปัจจัยสิ่งแวดล้อม (Leopold matrix)" }
  - { term: ระบบจัดการสิ่งแวดล้อม, definition: "กรอบการบริหารขององค์กรที่วางแผน ปฏิบัติ ตรวจสอบ และปรับปรุงผลกระทบอย่างต่อเนื่อง เช่น ISO 14001" }
  - { term: การประเมินวัฏจักรชีวิต (LCA), definition: "การวิเคราะห์ผลกระทบสิ่งแวดล้อมของผลิตภัณฑ์ตลอดอายุตั้งแต่วัตถุดิบจนถึงการกำจัด (life-cycle assessment)" }
  - { term: ผลกระทบสะสม, definition: "ผลรวมของผลกระทบจากหลายกิจกรรมในพื้นที่เดียวกันที่อาจเกินขีดรับได้ แม้โครงการเดี่ยวจะอยู่ในเกณฑ์ (cumulative impact)" }
  - { term: การติดตามที่ปรับได้, definition: "แผนติดตามที่กำหนดเกณฑ์และการดำเนินการเพิ่มเติมไว้ล่วงหน้า เพื่อรับมือความไม่แน่นอน (adaptive monitoring)" }
flashcards:
  - { front: "EIA กับ IEE ต่างกันอย่างไร", back: "EIA วิเคราะห์ละเอียดสำหรับโครงการผลกระทบรุนแรง IEE เป็นการประเมินเบื้องต้นสำหรับโครงการที่ผลกระทบน้อยกว่า" }
  - { front: "คะแนนในเมทริกซ์ Leopold คำนวณอย่างไร", back: "ขนาด (m) × ความสำคัญ (i) โดยขนาดมีเครื่องหมายบอกผลดีหรือผลเสีย" }
  - { front: "ขั้นแรกของการศึกษา EIA คืออะไร", back: "กำหนดขอบเขตการศึกษาว่าจะประเมินประเด็นใด พื้นที่ใด และช่วงเวลาใด" }
  - { front: "วงจร PDCA ใน ISO 14001 มีอะไรบ้าง", back: "วางแผน (Plan) ปฏิบัติ (Do) ตรวจสอบ (Check) และปรับปรุง (Act)" }
  - { front: "ทำไมต้องถ่วงน้ำหนักคะแนนผลกระทบด้วยความน่าจะเป็น", back: "เพื่อให้คะแนนสะท้อนโอกาสของแต่ละสถานการณ์ ไม่ใช่ค่าเฉลี่ยธรรมดาที่ไม่สนใจโอกาส" }
