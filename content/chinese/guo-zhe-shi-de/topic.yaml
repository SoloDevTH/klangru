id: chinese.grammar.guo-zhe-shi-de
subject: chinese
title: { th: "ประสบการณ์ด้วย 过 สภาพต่อเนื่องด้วย 着 และ 是…的", en: "Experience with 过, continuous state with 着, and 是…的" }
summary: 过 หลังกริยาบอกว่าเคยทำ 着 บอกสภาพที่ค้างอยู่และท่าทางระหว่างทำอย่างอื่น และ 是…的 เน้นเวลา สถานที่ หรือวิธีการของเรื่องที่เกิดแล้ว พร้อมรูปปฏิเสธ
difficulty: 4
minutes: 40
prerequisites: [chinese.grammar.negation-le, chinese.grammar.word-order]
encompasses:
  - { id: chinese.grammar.negation-le, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: aspect-timeline.svg
    alt: "เส้นเวลา 4 แถว มีเส้นประสีแดงแทนตอนนี้ แถว 了: 他去了北京 ไปแล้ว อาจยังอยู่ที่นั่น มีจุดในอดีตและเส้นประต่อถึงตอนนี้พร้อมเครื่องหมายคำถาม แถว 过: 他去过北京 เคยไป เป็นประสบการณ์ จบแล้ว มีเส้นโค้งไปแล้วกลับในอดีต แถว 着: 门开着 ประตูเปิดอยู่ มีแถบสภาพต่อเนื่องคร่อมเส้นตอนนี้ แถว 是…的: 他是坐飞机去的 เรื่องเกิดแล้ว เน้นเมื่อไร ที่ไหน อย่างไร มีจุดในอดีตและกรวยไฟส่องลงบนจุดนั้น"
    caption: "了 บอกว่าเกิดแล้ว 过 บอกประสบการณ์ 着 บอกสภาพ 是…的 ส่องรายละเอียด"
  - { type: check, problem: chinese.grammar.guo-zhe-shi-de.p006, prompt: "ไม่เคย พูดอย่างไร" }
  - type: worked-example
    title: เลือก 了 หรือ 过
    problem: "แปล: (ก) \"ฉันเคยกินทุเรียน\" (ข) \"เมื่อวานฉันกินทุเรียนไป 2 ลูก\" (ค) \"ฉันไม่เคยกินทุเรียน\""
    steps:
      - text: "(ก) ประสบการณ์ ใช้ กริยา + 过: 我吃过榴莲。"
      - text: "(ข) เหตุการณ์ที่เสร็จพร้อมจำนวน ใช้ 了: 我昨天吃了两个榴莲。"
        why: "了 บอกการกระทำที่เสร็จ ไม่ได้บอกประสบการณ์"
      - text: "(ค) ปฏิเสธประสบการณ์ด้วย 没 และคง 过 ไว้: 我没吃过榴莲。"
    answer: "我吃过榴莲。 · 我昨天吃了两个榴莲。 · 我没吃过榴莲。"
  - type: worked-example
    title: ถามและตอบด้วย 是…的
    problem: "เพื่อนชาวจีนใส่เสื้อใหม่ เราอยากรู้ว่าซื้อที่ไหน เพื่อนซื้อที่ตลาดในกรุงเทพฯ ไม่ได้ซื้อทางออนไลน์ (网上 wǎngshàng)"
    steps:
      - text: "การซื้อเกิดแล้ว และเราสนใจสถานที่ ใช้ 是…的 กับ 在哪儿: 你是在哪儿买的？"
      - text: "ตอบตามรูปเดียวกัน แทน 哪儿 ด้วยสถานที่: 我是在曼谷买的。"
      - text: "ปฏิเสธต้องมี 是: 我不是在网上买的。"
        why: "ประโยคบอกเล่าละ 是 ได้ แต่ปฏิเสธละไม่ได้"
    answer: "你是在哪儿买的？ — 我是在曼谷买的，不是在网上买的。"
  - { type: check, problem: chinese.grammar.guo-zhe-shi-de.p010, prompt: "去了 กับ 去过" }
glossary:
  - { term: "过 guo", definition: "หลังกริยา บอกประสบการณ์ เคย… ปฏิเสธเป็น 没…过" }
  - { term: "着 zhe", definition: "หลังกริยา บอกสภาพที่ค้างอยู่ หรือท่าทางระหว่างทำอย่างอื่น เช่น 门开着 笑着说" }
  - { term: "是…的 shì…de", definition: "เน้นเวลา สถานที่ วิธีการ หรือผู้ทำ ของเรื่องที่เกิดแล้ว ปฏิเสธเป็น 不是…的" }
  - { term: "次 cì", definition: "ครั้ง ใช้นับจำนวนครั้ง เช่น 去过两次" }
flashcards:
  - { front: "ฉันเคยไป / ไม่เคยไปเชียงใหม่", back: "我去过清迈。 / 我没去过清迈。" }
  - { front: "去了 กับ 去过", back: "ไปแล้ว (อาจยังอยู่) · เคยไป (กลับมาแล้ว)" }
  - { front: "ประตูเปิดอยู่", back: "门开着。" }
  - { front: "ฉันมาโดยเครื่องบิน (เน้นวิธีการ)", back: "我是坐飞机来的。 ปฏิเสธ: 我不是坐飞机来的。" }
