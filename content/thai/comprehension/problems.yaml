problems:
- id: thai.reading.comprehension.p001
  topics:
  - thai.reading.comprehension
  difficulty: 1
  type: mcq
  stem: อ่านบทความในภาพ ธนาคารขยะเปิด **เมื่อไร**
  figure: &id001
    src: trash-bank.svg
    alt: 'บทความเรื่องสมมุติ ธนาคารขยะของโรงเรียน 6 ประโยค: (1) โรงเรียนบ้านหนองบัวเปิดธนาคารขยะทุกวันศุกร์ตอนพักกลางวัน (2) นักเรียนนำขวดพลาสติก กระป๋อง และกระดาษที่แยกแล้วมาชั่งน้ำหนัก (3) ครูจดน้ำหนักลงสมุดบัญชีของนักเรียนแต่ละคน (4) เมื่อครบภาคเรียน โรงเรียนขายขยะให้ร้านรับซื้อของเก่า แล้วคืนเงินให้นักเรียนตามน้ำหนักที่ฝาก (5) ปีนี้ขยะในถังหน้าอาคารลดลงจนเห็นได้ชัด (6) ธนาคารขยะจึงช่วยให้โรงเรียนสะอาด และสอนให้นักเรียนรู้คุณค่าของสิ่งของ'
  choices:
  - id: a
    text: ทุกวันศุกร์ตอนพักกลางวัน
    correct: true
    feedback: ถูก อยู่ในประโยคที่ (1)
  - id: b
    text: ทุกวันจันทร์ตอนเช้า
    feedback: เรื่องไม่ได้พูดถึงวันจันทร์
  - id: c
    text: เมื่อครบภาคเรียน
    feedback: เป็นเวลาที่ขายขยะและคืนเงิน ไม่ใช่เวลาเปิดรับฝาก
  - id: d
    text: ทุกวันหลังเลิกเรียน
    feedback: เรื่องไม่ได้บอก
  hints:
  - คำถาม เมื่อไร ถามหาเวลา
  - หาคำบอกเวลาในประโยคแรก
  solution: 'ประโยคที่ (1): **ทุกวันศุกร์ตอนพักกลางวัน**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.comprehension.p002
  topics:
  - thai.reading.comprehension
  difficulty: 1
  type: match
  stem: จับคู่คำถามกับสิ่งที่ถามหา
  pairs:
  - left: ใคร
    right: บุคคลหรือตัวละคร
  - left: ที่ไหน
    right: สถานที่
  - left: เมื่อไร
    right: เวลา
  - left: ทำไม
    right: สาเหตุหรือเหตุผล
  hints:
  - คำถามแต่ละคำถามหาข้อมูลคนละชนิด
  - ทำไม ตอบด้วย เพราะ...
  solution: ใคร = บุคคล · ที่ไหน = สถานที่ · เมื่อไร = เวลา · ทำไม = เหตุผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.comprehension.p003
  topics:
  - thai.reading.comprehension
  difficulty: 2
  type: mcq
  stem: อ่านบทความในภาพ นักเรียนนำ **อะไร** มาฝาก
  figure: *id001
  choices:
  - id: a
    text: ขวดพลาสติก กระป๋อง และกระดาษที่แยกแล้ว
    correct: true
    feedback: ถูก ประโยคที่ (2)
  - id: b
    text: เงินค่าขนม
    feedback: ธนาคารขยะรับขยะ ไม่ได้รับเงิน
  - id: c
    text: เศษอาหาร
    feedback: เรื่องไม่ได้พูดถึงเศษอาหาร
  - id: d
    text: สมุดบัญชี
    feedback: สมุดบัญชีเป็นที่ครูจดน้ำหนัก
  hints:
  - หาประโยคที่บอกว่านักเรียนนำอะไรมา
  - ประโยคที่ (2)
  solution: '**ขวดพลาสติก กระป๋อง และกระดาษที่แยกแล้ว**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.comprehension.p004
  topics:
  - thai.reading.comprehension
  difficulty: 2
  type: mcq
  stem: อ่านบทความในภาพ **ใจความสำคัญ** ของเรื่องอยู่ประโยคใด
  figure: *id001
  choices:
  - id: a
    text: ประโยคที่ (6)
    correct: true
    feedback: ถูก คลุมรายละเอียดทุกข้อ และมีคำว่า จึง สรุป
  - id: b
    text: ประโยคที่ (1)
    feedback: บอกเพียงวันเวลาที่เปิด เป็นรายละเอียด
  - id: c
    text: ประโยคที่ (4)
    feedback: บอกวิธีคืนเงิน เป็นรายละเอียด
  - id: d
    text: ประโยคที่ (5)
    feedback: เป็นผลอย่างหนึ่ง แต่ไม่คลุมเรื่องการสอนคุณค่าของสิ่งของ
  hints:
  - ใจความสำคัญคลุมประโยคอื่นทั้งหมด
  - สังเกตคำว่า จึง ในประโยคท้าย
  solution: ประโยคที่ **(6)** เป็นใจความสำคัญที่ **ท้ายย่อหน้า** ประโยคอื่นเป็นรายละเอียดสนับสนุน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.comprehension.p005
  topics:
  - thai.reading.comprehension
  difficulty: 2
  type: numeric
  stem: อ่านบทความ 450 คำ ใช้เวลา 3 นาที อ่านได้กี่คำต่อนาที
  answer:
    value: 150
    unit: คำต่อนาที
  misconceptions:
  - match: 1350
    feedback: คูณแทนหาร ความเร็วคือจำนวนคำหารด้วยเวลา
  - match: 453
    feedback: บวกจำนวนคำกับเวลา ต้องหาร
  hints:
  - ความเร็วในการอ่าน = จำนวนคำ ÷ เวลา (นาที)
  - 450 ÷ 3
  solution: $450 \div 3 = 150$ คำต่อนาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.comprehension.p006
  topics:
  - thai.reading.comprehension
  difficulty: 3
  type: mcq
  stem: อ่านบทความในภาพ **ทำไม** ขยะในถังหน้าอาคารจึงลดลง (ตอบจากเรื่อง)
  figure: *id001
  choices:
  - id: a
    text: เพราะนักเรียนแยกขยะที่ขายได้มาฝากธนาคารขยะแทนการทิ้ง
    correct: true
    feedback: ถูก เชื่อมประโยค (2) กับ (5)
  - id: b
    text: เพราะโรงเรียนเอาถังขยะออก
    feedback: เรื่องไม่ได้บอก เป็นการเดา
  - id: c
    text: เพราะนักเรียนอยากได้เงินมาก ๆ
    feedback: เรื่องไม่ได้บอกว่านักเรียนอยากได้เงิน
  - id: d
    text: เพราะร้านรับซื้อของเก่ามาเก็บทุกวัน
    feedback: เรื่องบอกว่าขายเมื่อครบภาคเรียน
  hints:
  - คำถาม ทำไม ต้องเชื่อมเหตุกับผล
  - ขยะที่เคยทิ้งลงถังไปอยู่ที่ไหนแทน
  solution: '**เพราะนักเรียนนำขยะที่แยกแล้วมาฝากแทนการทิ้ง** (ประโยค 2 เป็นเหตุ ประโยค 5 เป็นผล)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.comprehension.p007
  topics:
  - thai.reading.comprehension
  difficulty: 3
  type: mcq
  stem: อ่านบทความในภาพ คำถามใด **ตอบไม่ได้** จากเรื่อง
  figure: *id001
  choices:
  - id: a
    text: ปีที่แล้วนักเรียนได้เงินคืนคนละกี่บาท
    correct: true
    feedback: ถูก เรื่องไม่ได้บอกจำนวนเงิน ต้องตอบว่าเรื่องไม่ได้บอก
  - id: b
    text: ใครเป็นผู้จดน้ำหนัก
    feedback: 'ตอบได้: ครู'
  - id: c
    text: โรงเรียนขายขยะให้ใคร
    feedback: 'ตอบได้: ร้านรับซื้อของเก่า'
  - id: d
    text: เปิดธนาคารขยะวันใด
    feedback: 'ตอบได้: วันศุกร์'
  hints:
  - ไล่หาคำตอบของแต่ละคำถามในเรื่อง
  - ข้อใดหาไม่เจอเลย
  solution: เรื่องไม่ได้บอก **จำนวนเงินที่ได้คืน** จึงตอบไม่ได้ ไม่ควรเดา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.comprehension.p008
  topics:
  - thai.reading.comprehension
  difficulty: 3
  type: mcq
  stem: อ่านบทความในภาพ ข้อใดเป็น **ข้อคิด** ที่ได้จากเรื่องและนำไปใช้ได้ดีที่สุด
  figure: *id001
  choices:
  - id: a
    text: ขยะบางอย่างยังมีค่า ถ้าแยกก่อนทิ้งจะนำไปใช้ประโยชน์ได้
    correct: true
    feedback: ถูก มาจากเรื่องและนำไปทำที่บ้านได้
  - id: b
    text: ควรเป็นคนดี
    feedback: กว้างเกินไป ไม่เชื่อมกับเรื่อง
  - id: c
    text: ร้านรับซื้อของเก่ารับซื้อขวด
    feedback: เป็นความรู้จากเรื่อง ไม่ใช่ข้อคิด
  - id: d
    text: ควรเก็บเงินไว้ในธนาคารจริง
    feedback: เรื่องไม่ได้พูดถึงธนาคารที่ฝากเงิน
  hints:
  - ข้อคิดต้องมาจากเรื่อง
  - ข้อคิดต่างจากความรู้อย่างไร
  solution: '**ขยะบางอย่างยังมีค่า ถ้าแยกก่อนทิ้งจะนำไปใช้ประโยชน์ได้**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.comprehension.p009
  topics:
  - thai.reading.comprehension
  difficulty: 3
  type: numeric
  stem: อ่านเรื่องสั้น 300 คำ ใช้เวลา 90 วินาที อ่านได้กี่คำต่อนาที
  answer:
    value: 200
    unit: คำต่อนาที
  misconceptions:
  - match: 3.33
    feedback: หารด้วย 90 วินาทีโดยไม่แปลงเป็นนาที ได้คำต่อวินาที
  - match: 150
    feedback: ใช้ 2 นาทีแทน 1.5 นาที
  hints:
  - แปลงวินาทีเป็นนาทีก่อน 90 วินาที = 1.5 นาที
  - 300 ÷ 1.5
  solution: 90 วินาที = 1.5 นาที $300 \div 1.5 = 200$ คำต่อนาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.comprehension.p010
  topics:
  - thai.reading.comprehension
  difficulty: 4
  type: order
  stem: 'อ่านนิทาน: "สุนัขตัวหนึ่งคาบกระดูกเดินข้ามสะพาน มันก้มมองน้ำ เห็นเงาของตัวเองคาบกระดูกอยู่ ก็คิดว่าเป็นสุนัขอีกตัวที่มีกระดูกชิ้นใหญ่กว่า จึงอ้าปากเห่าจะแย่ง กระดูกที่คาบอยู่ก็หล่นลงน้ำจมหายไป สุนัขจึงไม่เหลืออะไรเลย" แล้วเรียงเหตุการณ์สำหรับเล่าเรื่องย่อ'
  items:
  - สุนัขคาบกระดูกเดินข้ามสะพาน
  - มันเห็นเงาของตัวเองในน้ำ
  - คิดว่าเป็นสุนัขอีกตัวที่มีกระดูกใหญ่กว่า
  - อ้าปากเห่าจะแย่ง
  - กระดูกหล่นลงน้ำ สุนัขไม่เหลืออะไร
  hints:
  - เรื่องย่อเรียงตามเวลา
  - ตัวละครอยู่ที่ไหน → เห็นอะไร → คิดอย่างไร → ทำอะไร → จบอย่างไร
  solution: คาบกระดูกข้ามสะพาน → เห็นเงา → คิดว่าเป็นอีกตัว → เห่าจะแย่ง → กระดูกหล่นน้ำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.comprehension.p011
  topics:
  - thai.reading.comprehension
  difficulty: 4
  type: mcq
  stem: 'อ่านนิทาน: "สุนัขตัวหนึ่งคาบกระดูกเดินข้ามสะพาน มันก้มมองน้ำ เห็นเงาของตัวเองคาบกระดูกอยู่ ก็คิดว่าเป็นสุนัขอีกตัวที่มีกระดูกชิ้นใหญ่กว่า จึงอ้าปากเห่าจะแย่ง กระดูกที่คาบอยู่ก็หล่นลงน้ำจมหายไป สุนัขจึงไม่เหลืออะไรเลย" ข้อใดเป็น **เรื่องย่อ** ที่ดีที่สุด'
  choices:
  - id: a
    text: สุนัขคาบกระดูกข้ามสะพาน เห็นเงาตัวเองในน้ำแล้วโลภจะแย่ง เมื่ออ้าปากเห่า กระดูกก็หล่นน้ำหายไป
    correct: true
    feedback: ถูก สั้น ครบตัวละคร เหตุการณ์ และตอนจบ
  - id: b
    text: สุนัขเห่าเงาตัวเอง
    feedback: สั้นเกินไป ขาดสาเหตุและตอนจบ
  - id: c
    text: สุนัขตัวหนึ่งคาบกระดูกเดินข้ามสะพาน มันก้มมองน้ำ เห็นเงาของตัวเองคาบกระดูกอยู่ ก็คิดว่าเป็นสุนัขอีกตัว...
    feedback: ลอกเรื่องเดิมเกือบทั้งหมด ไม่ใช่การย่อ
  - id: d
    text: ไม่ควรโลภ
    feedback: เป็นข้อคิด ไม่ใช่เรื่องย่อ
  hints:
  - เรื่องย่อต้องมีใคร เกิดอะไร ทำอย่างไร จบอย่างไร
  - ใช้คำของเราเองและสั้นกว่าเดิม
  solution: ข้อแรกครบ **ตัวละคร เหตุการณ์ การกระทำ และตอนจบ** ด้วยคำของเราเอง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.comprehension.p012
  topics:
  - thai.reading.comprehension
  difficulty: 4
  type: mcq
  stem: 'ย่อหน้า: "ผักบุ้งปลูกง่าย ขึ้นได้ทั้งในดินและในน้ำ ใช้เวลาไม่นานก็เก็บกินได้ ราคาเมล็ดพันธุ์ก็ถูก" ย่อหน้านี้ **ไม่มีประโยคใจความ** เขียนไว้ตรง ๆ ข้อใดสรุปใจความได้ดีที่สุด'
  choices:
  - id: a
    text: ผักบุ้งเป็นผักที่ปลูกได้ง่ายและประหยัด
    correct: true
    feedback: ถูก คลุมรายละเอียดทุกข้อ
  - id: b
    text: ผักบุ้งขึ้นได้ในน้ำ
    feedback: แคบเกินไป เป็นรายละเอียดข้อเดียว
  - id: c
    text: ผักทุกชนิดปลูกง่าย
    feedback: กว้างเกินไป ย่อหน้าพูดถึงผักบุ้งเท่านั้น
  - id: d
    text: ผักบุ้งอร่อย
    feedback: ย่อหน้าไม่ได้พูดถึงรสชาติ
  hints:
  - ใจความต้องคลุมรายละเอียดทุกข้อ
  - ไม่แคบเป็นข้อเดียว ไม่กว้างเกินเรื่อง
  solution: '**ผักบุ้งเป็นผักที่ปลูกได้ง่ายและประหยัด** คลุมเรื่องปลูกง่าย โตเร็ว และเมล็ดราคาถูก'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.reading.comprehension.p013
  topics:
  - thai.reading.comprehension
  difficulty: 4
  type: numeric
  stem: มุกอ่านได้ประมาณ 160 คำต่อนาที บทความยาว 480 คำ จะใช้เวลาอ่านรอบแรกประมาณกี่นาที
  answer:
    value: 3
    unit: นาที
  misconceptions:
  - match: 0.33
    feedback: นำความเร็วหารด้วยจำนวนคำ กลับด้าน
  - match: 76800
    feedback: คูณแทนหาร
  hints:
  - เวลา = จำนวนคำ ÷ ความเร็ว
  - 480 ÷ 160
  solution: $480 \div 160 = 3$ นาที
