<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="sans-serif" font-size="14">
  <title>ภาพแนวคิดความเสี่ยงกับผลตอบแทนที่คาดหวังของทางเลือกการออมและการลงทุน</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>
  <line x1="90.0" y1="380.0" x2="690.0" y2="380.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="90.0" y1="380.0" x2="90.0" y2="30.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="385.0" y="420.0" text-anchor="middle" fill="#1f2937" font-size="13">ความเสี่ยง (ผลตอบแทนผันผวนมาก อาจขาดทุน) →</text>
  <text x="34" y="210" text-anchor="middle" fill="#1f2937" font-size="13" transform="rotate(-90 34 210)">ผลตอบแทนที่คาดหวัง →</text>
  <text x="84.0" y="398.0" text-anchor="middle" fill="#1f2937" font-size="12">ต่ำ</text>
  <text x="680.0" y="398.0" text-anchor="middle" fill="#1f2937" font-size="12">สูง</text>
  <text x="76.0" y="376.0" text-anchor="end" fill="#1f2937" font-size="12">ต่ำ</text>
  <text x="76.0" y="50.0" text-anchor="end" fill="#1f2937" font-size="12">สูง</text>
  <circle cx="119.5" cy="359.6" r="7" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="131.5" y="364.6" text-anchor="start" fill="#1f2937" font-size="12.5">เงินฝากออมทรัพย์</text>
  <circle cx="160.8" cy="339.2" r="7" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="172.8" y="344.2" text-anchor="start" fill="#1f2937" font-size="12.5">เงินฝากประจำ สลากออมทรัพย์</text>
  <circle cx="219.8" cy="312.0" r="7" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="231.8" y="317.0" text-anchor="start" fill="#1f2937" font-size="12.5">พันธบัตรรัฐบาล</text>
  <circle cx="314.2" cy="264.4" r="7" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="326.2" y="269.4" text-anchor="start" fill="#1f2937" font-size="12.5">หุ้นกู้บริษัทเอกชน</text>
  <circle cx="385.0" cy="210.0" r="7" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="373.0" y="215.0" text-anchor="end" fill="#1f2937" font-size="12.5">กองทุนรวมผสม</text>
  <circle cx="455.8" cy="244.0" r="7" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="467.8" y="249.0" text-anchor="start" fill="#1f2937" font-size="12.5">ทองคำ</text>
  <circle cx="503.0" cy="148.8" r="7" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="491.0" y="153.8" text-anchor="end" fill="#1f2937" font-size="12.5">หุ้นหลายบริษัท (กองทุนหุ้น)</text>
  <circle cx="609.2" cy="108.0" r="7" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="597.2" y="113.0" text-anchor="end" fill="#1f2937" font-size="12.5">หุ้นบริษัทเดียว</text>
  <path d="M120,355 Q390,270 640,60" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="660.0" y="350.0" text-anchor="end" fill="#6b7280" font-size="12">ตำแหน่งเป็นแนวคิดเปรียบเทียบ</text>
  <text x="660.0" y="368.0" text-anchor="end" fill="#6b7280" font-size="12">ไม่ใช่ข้อมูลผลตอบแทนจริง</text>
</svg>
