problems:
- id: business.econ.circular-flow.p001
  topics:
  - business.econ.circular-flow
  difficulty: 1
  type: mcq
  stem: ทำไมเราจึงควรทำงานด้วยความ **สุจริต**
  choices:
  - id: a
    text: ได้รายได้อย่างภาคภูมิใจ ได้รับความไว้วางใจ และไม่ทำให้ผู้อื่นเดือดร้อน
    correct: true
  - id: b
    text: เพราะงานสุจริตได้เงินมากกว่างานทุจริตเสมอ
    feedback: บางครั้งการทุจริตได้เงินเร็ว แต่ผิดกฎหมาย เสียความไว้วางใจ และทำร้ายผู้อื่น
  - id: c
    text: เพราะคนสุจริตไม่ต้องเสียภาษี
    feedback: ทุกคนที่มีรายได้ถึงเกณฑ์ต้องเสียภาษี
  - id: d
    text: เพราะทำงานสุจริตแล้วไม่ต้องออมเงิน
    feedback: การออมยังจำเป็นสำหรับทุกคน
  hints:
  - คิดถึงผลต่อตัวเองและคนรอบข้าง
  - ถ้าแม่ค้าโกงตาชั่ง ลูกค้าจะกลับมาซื้ออีกหรือไม่
  solution: การทำงานสุจริตทำให้ได้รายได้อย่างถูกต้อง ภาคภูมิใจ ได้รับความไว้วางใจจากลูกค้าและนายจ้าง ไม่ผิดกฎหมาย และสังคมอยู่ร่วมกันได้อย่างสงบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.circular-flow.p002
  topics:
  - business.econ.circular-flow
  difficulty: 1
  type: match
  stem: จับคู่ปัจจัยการผลิตกับผลตอบแทนที่เจ้าของได้รับ
  pairs:
  - left: แรงงาน
    right: ค่าจ้าง เงินเดือน
  - left: ที่ดินให้เช่า
    right: ค่าเช่า
  - left: เงินทุนที่ให้กู้หรือฝาก
    right: ดอกเบี้ย
  - left: ผู้ประกอบการ
    right: กำไร
  hints:
  - คิดว่าแต่ละคนได้เงินจากการให้อะไรแก่การผลิต
  - ผู้ประกอบการรับความเสี่ยงของธุรกิจ
  solution: แรงงาน → ค่าจ้าง · ที่ดิน → ค่าเช่า · ทุน → ดอกเบี้ย · ผู้ประกอบการ → กำไร (ทบทวนใน [ปัจจัยการผลิต](/topic/business.econ.production-factors/))
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.circular-flow.p003
  topics:
  - business.econ.circular-flow
  difficulty: 2
  type: match
  stem: จับคู่คนทำงานกับลักษณะงาน
  pairs:
  - left: พี่เอทำงานโรงงานได้ค่าจ้างรายวัน
    right: ลูกจ้าง
  - left: ป้าแดงเปิดร้านข้าวแกงของตัวเอง
    right: ประกอบธุรกิจส่วนตัว
  - left: พี่บีรับออกแบบโลโก้ให้ลูกค้าเป็นงาน ๆ ผ่านออนไลน์
    right: รับจ้างอิสระ
  - left: ยายดูแลหลานและทำงานบ้านโดยไม่ได้ค่าจ้าง
    right: งานที่ไม่ได้รับค่าตอบแทนเป็นเงิน
  hints:
  - ใครมีนายจ้าง ใครเป็นเจ้าของกิจการ
  - งานบ้านเป็นงานที่มีคุณค่าแม้ไม่ได้เงิน
  solution: พี่เอ → ลูกจ้าง · ป้าแดง → ธุรกิจส่วนตัว · พี่บี → รับจ้างอิสระ · ยาย → งานที่ไม่ได้รับค่าตอบแทนเป็นเงิน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.circular-flow.p004
  topics:
  - business.econ.circular-flow
  difficulty: 2
  type: mcq
  stem: น้องฟ้าซื้อส้มตำจากป้าสมใจ $40$ บาท ข้อใดอธิบาย **ความสัมพันธ์ระหว่างผู้ซื้อกับผู้ขาย** ได้ดีที่สุด
  choices:
  - id: a
    text: ทั้งสองได้ประโยชน์ น้องฟ้าได้อาหาร ป้าสมใจได้รายได้ และต่างต้องซื่อสัตย์ต่อกัน
    correct: true
  - id: b
    text: ป้าสมใจได้ประโยชน์ฝ่ายเดียว เพราะได้เงิน
    feedback: น้องฟ้าก็ได้อาหารที่ต้องการ การแลกเปลี่ยนที่สมัครใจทำให้ทั้งสองฝ่ายพอใจ
  - id: c
    text: น้องฟ้าได้ประโยชน์ฝ่ายเดียว เพราะได้ของกิน
    feedback: ป้าสมใจได้เงินไปซื้อวัตถุดิบและใช้จ่ายในครอบครัว
  - id: d
    text: ผู้ซื้อกับผู้ขายเป็นคู่แข่งกัน
    feedback: ทั้งสองต้องพึ่งพากัน ถ้าไม่มีผู้ซื้อ ผู้ขายก็ขายไม่ได้
  hints:
  - ถ้าไม่มีผู้ซื้อ ผู้ขายจะเป็นอย่างไร
  - การซื้อขายเกิดขึ้นเมื่อทั้งสองฝ่ายพอใจ
  solution: ผู้ซื้อและผู้ขายพึ่งพากัน ผู้ซื้อได้สินค้าที่ต้องการ ผู้ขายได้รายได้ ความสัมพันธ์ที่ดีต้องอาศัยความซื่อสัตย์ เช่น ให้ของตามราคาและคุณภาพที่ตกลงกัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.circular-flow.p005
  topics:
  - business.econ.circular-flow
  difficulty: 2
  type: numeric
  stem: ครอบครัวของต้นมีรายได้ต่อเดือนดังนี้ เงินเดือนพ่อ $18{,}000$ บาท ค่าเช่าห้องที่ปล่อยเช่า $4{,}000$ บาท และดอกเบี้ยเงินฝาก $150$ บาท (สมมติ) ครอบครัวมีรายได้รวมเดือนละกี่บาท (ตอบเป็นบาท)
  answer:
    value: 22150
    unit: บาท
  misconceptions:
  - match: 18000
    feedback: นับเฉพาะเงินเดือน ค่าเช่าและดอกเบี้ยก็เป็นรายได้ของครัวเรือน
  - match: 22000
    feedback: ลืมดอกเบี้ยเงินฝาก
  hints:
  - รายได้มาจากปัจจัยการผลิตหลายแบบ
  - บวกทุกแหล่งรายได้
  solution: รายได้รวม $= 18{,}000 + 4{,}000 + 150 = 22{,}150$ บาท (ค่าจ้างจากแรงงาน ค่าเช่าจากทรัพย์สิน ดอกเบี้ยจากเงินทุน)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.circular-flow.p006
  topics:
  - business.econ.circular-flow
  difficulty: 2
  type: match
  stem: จากภาพ จับคู่ลูกศรกับสิ่งที่ไหลไปตามลูกศรนั้น
  figure:
    src: p-flow-blank.svg
    alt: แผนภาพการหมุนเวียน ครัวเรือนอยู่ซ้าย ธุรกิจอยู่ขวา ตลาดสินค้าและบริการอยู่บน ตลาดปัจจัยการผลิตอยู่ล่าง ธนาคารและรัฐบาลอยู่กลาง ลูกศร A เป็นเส้นทึบ (เงิน) จากครัวเรือนขึ้นไปตลาดสินค้า ลูกศร B เป็นเส้นประจากตลาดสินค้าลงมาที่ครัวเรือน ลูกศร C เป็นเส้นทึบจากตลาดปัจจัยการผลิตไปที่ครัวเรือน ลูกศร D เป็นเส้นทึบจากครัวเรือนไปธนาคาร ลูกศรอื่นไม่มีป้าย เส้นทึบคือเงิน เส้นประคือสินค้า บริการ หรือปัจจัยการผลิต
  pairs:
  - left: ลูกศร A
    right: เงินที่ครัวเรือนจ่ายซื้อสินค้าและบริการ
  - left: ลูกศร B
    right: สินค้าและบริการที่ครัวเรือนได้รับ
  - left: ลูกศร C
    right: ค่าจ้าง ค่าเช่า ดอกเบี้ย กำไร ที่ครัวเรือนได้รับ
  - left: ลูกศร D
    right: เงินออมที่ครัวเรือนฝากธนาคาร
  hints:
  - เส้นทึบคือเงิน เส้นประคือของจริง
  - ดูทิศของลูกศรว่าออกจากใครไปหาใคร
  solution: A คือรายจ่ายซื้อสินค้า (เงินออกจากครัวเรือน) · B คือสินค้าและบริการที่ไหลเข้าครัวเรือน · C คือรายได้จากปัจจัยการผลิต · D คือเงินออมที่ฝากธนาคาร
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.circular-flow.p007
  topics:
  - business.econ.circular-flow
  difficulty: 2
  type: mcq
  stem: ในแผนภาพการหมุนเวียน **รัฐบาล** ทำหน้าที่ใด
  choices:
  - id: a
    text: เก็บภาษีจากครัวเรือนและธุรกิจ แล้วนำไปจัดบริการสาธารณะ สวัสดิการ และซื้อสินค้าจากธุรกิจ
    correct: true
  - id: b
    text: รับฝากเงินจากครัวเรือนแล้วให้ธุรกิจกู้
    feedback: นั่นคือหน้าที่ของธนาคาร
  - id: c
    text: ผลิตสินค้าทุกชนิดขายให้ครัวเรือน
    feedback: ในระบบเศรษฐกิจแบบผสมของไทย ธุรกิจเอกชนผลิตสินค้าส่วนใหญ่
  - id: d
    text: ไม่มีบทบาท เพราะเงินไหลระหว่างครัวเรือนกับธุรกิจเท่านั้น
    feedback: รัฐบาลรับภาษีและใช้จ่ายเงินจำนวนมากในระบบเศรษฐกิจ
  hints:
  - รัฐได้เงินจากที่ไหน
  - รัฐใช้เงินภาษีทำอะไรให้ประชาชน
  solution: รัฐบาลรับเงินภาษี แล้วจ่ายกลับเข้าระบบในรูปถนน โรงเรียน โรงพยาบาล เบี้ยยังชีพ และการซื้อสินค้าและบริการจากธุรกิจ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.circular-flow.p008
  topics:
  - business.econ.circular-flow
  difficulty: 3
  type: numeric
  stem: ครัวเรือนหนึ่งมีรายได้เดือนละ $30{,}000$ บาท เสียภาษีและเงินสมทบประกันสังคมรวม $1{,}200$ บาท แล้วออม $15\%$ ของรายได้ที่เหลือหลังหักภาษี (สมมติ) ที่เหลือใช้ซื้อสินค้าและบริการทั้งหมด ครัวเรือนนี้จ่ายเงินเข้าตลาดสินค้าและบริการเดือนละกี่บาท (ตอบเป็นบาท)
  answer:
    value: 24480
    unit: บาท
  misconceptions:
  - match: 24300
    feedback: คิดเงินออมจากรายได้ก่อนหักภาษี โจทย์ให้คิดจากรายได้หลังหักภาษี
  - match: 25500
    feedback: ลืมหักภาษี
  hints:
  - หักภาษีออกจากรายได้ก่อน
  - ออม $15\%$ ของยอดหลังหักภาษี ส่วนที่เหลือคือรายจ่ายซื้อสินค้า
  solution: รายได้หลังภาษี $= 30{,}000 - 1{,}200 = 28{,}800$ บาท เงินออม $= 28{,}800 \times 0.15 = 4{,}320$ บาท รายจ่ายซื้อสินค้า $= 28{,}800 - 4{,}320 = 24{,}480$ บาท
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.circular-flow.p009
  topics:
  - business.econ.circular-flow
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นตัวอย่างของ **การพึ่งพาอาศัยกันทางเศรษฐกิจในประเทศ** (เลือกได้มากกว่าหนึ่งข้อ)
  multiple: true
  choices:
  - id: a
    text: ชาวไร่อ้อยในภาคอีสานขายอ้อยให้โรงงานน้ำตาล โรงงานส่งน้ำตาลไปขายทั่วประเทศ
    correct: true
  - id: b
    text: โรงแรมในภูเก็ตจ้างแรงงานจากหลายจังหวัด และซื้ออาหารทะเลจากชาวประมงท้องถิ่น
    correct: true
  - id: c
    text: ธนาคารรับเงินฝากจากคนกรุงเทพฯ แล้วให้ธุรกิจในต่างจังหวัดกู้
    correct: true
  - id: d
    text: ร้านสะดวกซื้อสองร้านในซอยเดียวกันลดราคาแย่งลูกค้า
    feedback: นี่คือการแข่งขัน ไม่ใช่การพึ่งพาอาศัยกัน
  - id: e
    text: ครอบครัวปลูกผักกินเองทั้งหมด ไม่ซื้อขายกับใคร
    feedback: ไม่มีการแลกเปลี่ยนกับผู้อื่น จึงไม่ใช่ตัวอย่างการพึ่งพากัน
  hints:
  - การพึ่งพาคือต่างฝ่ายต่างได้ประโยชน์จากกัน
  - การแย่งลูกค้าคือการแข่งขัน
  solution: ข้อ ก ข ค เป็นการพึ่งพาอาศัยกัน ผู้ผลิต แรงงาน และสถาบันการเงินต่างภาคต่างอาศัยกัน ข้อ ง เป็นการแข่งขัน ข้อ จ ไม่มีการแลกเปลี่ยน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.circular-flow.p010
  topics:
  - business.econ.circular-flow
  difficulty: 3
  type: mcq
  stem: ในตลาดนัดแห่งหนึ่ง เดิมมีร้านชานมไข่มุกร้านเดียว ขายแก้วละ $45$ บาท ต่อมามีร้านใหม่เปิดอีก $3$ ร้าน ข้อใดน่าจะเกิดขึ้นมากที่สุด
  choices:
  - id: a
    text: ร้านต่าง ๆ แข่งกันลดราคาหรือเพิ่มคุณภาพ ผู้บริโภคมีทางเลือกมากขึ้น
    correct: true
  - id: b
    text: ราคาชานมสูงขึ้น เพราะมีร้านมากขึ้น
    feedback: เมื่อผู้ขายมากขึ้น การแข่งขันมักกดราคาลง ไม่ใช่ดันขึ้น
  - id: c
    text: ทุกร้านขายได้มากเท่าเดิม
    feedback: ลูกค้ากระจายไปหลายร้าน ร้านเดิมอาจขายได้น้อยลง
  - id: d
    text: ผู้บริโภคเสียประโยชน์เพราะเลือกยาก
    feedback: การมีทางเลือกมากขึ้นเป็นประโยชน์ต่อผู้บริโภค
  hints:
  - คิดว่าร้านเดิมจะทำอย่างไรเพื่อไม่ให้เสียลูกค้า
  - การแข่งขันทางการค้าส่งผลต่อราคาอย่างไร
  solution: เมื่อมีผู้ขายมากขึ้น ผู้ขายแข่งกันด้วยราคา คุณภาพ และบริการ ราคามักลดลงและผู้บริโภคได้ประโยชน์ ส่วนร้านที่ปรับตัวไม่ได้อาจขายได้น้อยลง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.circular-flow.p011
  topics:
  - business.econ.circular-flow
  difficulty: 3
  type: order
  stem: เริ่มจากโรงงานจ่ายค่าจ้างให้พนักงาน เรียงการหมุนเวียนของเงินต่อไปตามลำดับ
  items:
  - โรงงานจ่ายค่าจ้างให้พนักงาน
  - พนักงานนำค่าจ้างไปซื้ออาหารและของใช้ที่ร้านค้า
  - ร้านค้านำรายรับไปซื้อสินค้าจากโรงงานมาขายต่อ
  - โรงงานมีรายรับจากการขาย จึงจ่ายค่าจ้างเดือนถัดไปได้
  hints:
  - เงินออกจากธุรกิจไปครัวเรือนในรูปค่าจ้าง
  - รายจ่ายของคนหนึ่งคือรายรับของอีกคน
  solution: ค่าจ้าง → ครัวเรือนใช้จ่าย → ร้านค้ามีรายรับไปซื้อสินค้าจากโรงงาน → โรงงานมีรายรับจ่ายค่าจ้างต่อ เงินจึงหมุนเป็นวงกลม
