problems:
  - id: computer.ai.supervised-learning.p001
    topics: [computer.ai.supervised-learning]
    difficulty: 1
    type: mcq
    stem: "การเรียนรู้แบบมีผู้สอนต่างจากการเรียนรู้แบบไม่มีผู้สอนอย่างไร"
    choices:
      - { id: a, text: "แบบมีผู้สอนไม่ต้องใช้ข้อมูลเลย ส่วนแบบไม่มีผู้สอนใช้ข้อมูลจำนวนมาก", feedback: "ทั้งสองแบบใช้ข้อมูล ต่างกันที่มีป้ายคำตอบหรือไม่" }
      - { id: b, text: "แบบมีผู้สอนเรียนจากตัวอย่างที่มีอินพุตและคำตอบ ส่วนแบบไม่มีผู้สอนไม่มีป้ายคำตอบให้เรียน", correct: true }
      - { id: c, text: "แบบมีผู้สอนต้องให้คนเขียนกฎทุกข้อด้วยมือ", feedback: "ไม่จริง เพราะแบบจำลองเรียนค่าพารามิเตอร์จากข้อมูลเอง" }
      - { id: d, text: "แบบไม่มีผู้สอนทำนายค่าตัวเลขได้เท่านั้น", feedback: "การจัดกลุ่มเป็นงานหลักของแบบไม่มีผู้สอน ไม่ใช่การทำนายค่าตัวเลข" }
    hints:
      - "ดูว่าตัวอย่างในการเรียนมีอะไรบ้าง"
      - "ลองนึกถึงป้ายกำกับหรือคำตอบที่มาพร้อมอินพุต"
      - "เลือกข้อที่บอกว่าแบบมีผู้สอนมีอะไรที่แบบไม่มีผู้สอนไม่มี"
    solution: "แบบมีผู้สอนเรียนจากตัวอย่างที่มีทั้งอินพุตและคำตอบ ส่วนแบบไม่มีผู้สอนต้องหารูปแบบจากข้อมูลที่ไม่มีป้ายคำตอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.supervised-learning.p002
    topics: [computer.ai.supervised-learning]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนการสร้างแบบจำลองแบบมีผู้สอนเพื่อทำนายยอดขาย จากขั้นแรกไปขั้นสุดท้าย"
    items:
      - "รวบรวมตัวอย่างที่มีทั้งอินพุตและคำตอบ"
      - "แบ่งข้อมูลส่วนหนึ่งไว้ทดสอบ โดยไม่ใช้ตอนฝึก"
      - "เลือกแบบจำลองและฝึกด้วยข้อมูลฝึก"
      - "ประเมินผลด้วยข้อมูลทดสอบ"
      - "ใช้แบบจำลองทำนายข้อมูลใหม่และติดตามผลต่อไป"
    hints:
      - "ต้องมีข้อมูลที่มีคำตอบก่อนจะฝึกอะไรได้"
      - "ข้อมูลทดสอบต้องแยกไว้ก่อนฝึก มิฉะนั้นการทดสอบจะไม่น่าเชื่อถือ"
      - "ขั้นสุดท้ายคือนำไปใช้กับข้อมูลที่ยังไม่เคยเห็น"
    solution: "เริ่มจากรวบรวมตัวอย่างที่มีคำตอบ แบ่งข้อมูลทดสอบไว้ก่อน แล้วจึงฝึกแบบจำลอง ประเมินผลด้วยข้อมูลทดสอบ และนำไปใช้กับข้อมูลใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.supervised-learning.p003
    topics: [computer.ai.supervised-learning]
    difficulty: 1
    type: numeric
    stem: "ร้านน้ำสมมติใช้สูตร y = 15x + 40 ทำนายจำนวนแก้วที่ขายได้ เมื่อ x คือจำนวนชั่วโมงที่มีแดดจัด ถ้าวันนั้นมีแดดจัด 6 ชั่วโมง จะทำนายได้กี่แก้ว"
    answer: { value: 130, tolerance: 0, unit: "แก้ว" }
    misconceptions:
      - { match: 90, feedback: "ลืมบวกค่าคงที่ 40 ที่เป็นจุดตัดแกน y" }
    hints:
      - "แทนค่า x ลงในสูตรตามลำดับ"
      - "คูณ 15 ด้วย 6 ก่อน"
      - "นำผลที่ได้ไปบวกด้วย 40"
    solution: "15 × 6 + 40 = 90 + 40 = 130 แก้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.supervised-learning.p004
    topics: [computer.ai.supervised-learning]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นงานจำแนก (classification)"
    choices:
      - { id: a, text: "กรองอีเมลว่าเป็นสแปมหรือไม่", correct: true }
      - { id: b, text: "ทำนายอุณหภูมิของวันพรุ่งนี้เป็นองศาเซลเซียส", feedback: "เป็นการถดถอย เพราะผลลัพธ์เป็นค่าตัวเลขต่อเนื่อง" }
      - { id: c, text: "ทำนายยอดขายรายเดือนเป็นบาท", feedback: "เป็นการถดถอย เพราะผลลัพธ์เป็นค่าตัวเลข" }
      - { id: d, text: "จัดกลุ่มลูกค้าที่ไม่มีป้ายกำกับ", feedback: "เป็นการเรียนรู้แบบไม่มีผู้สอน" }
    hints:
      - "จำแนกคือการเลือกหมวดหมู่ ไม่ใช่การทำนายตัวเลข"
      - "ลองดูว่าผลลัพธ์ของแต่ละข้อเป็นหมวดหมู่หรือไม่"
      - "ข้อที่ผลลัพธ์เป็นหมวดหมู่เช่น ใช่หรือไม่ใช่ คือคำตอบ"
    solution: "การกรองอีเมลให้ผลเป็นหมวดหมู่ คือสแปมหรือไม่ใช่สแปม จึงเป็นการจำแนก ข้ออื่นให้ค่าตัวเลขหรือไม่มีป้ายคำตอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.supervised-learning.p005
    topics: [computer.ai.supervised-learning]
    difficulty: 2
    type: numeric
    stem: "จุดข้อมูลห้าจุด (x, y) คือ (1, 2), (2, 4), (3, 5), (4, 8) และ (5, 9) ความชันของเส้นถดถอยเชิงเส้นด้วยกำลังสองน้อยที่สุดเท่ากับเท่าใด (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 1.8, tolerance: 0.01 }
    misconceptions:
      - { match: 1.75, feedback: "คิดจากจุดแรกกับจุดสุดท้ายเท่านั้น ไม่ได้ใช้ทุกจุดด้วยวิธีกำลังสองน้อยที่สุด" }
    hints:
      - "หาค่าเฉลี่ยของ x และของ y ก่อน"
      - "หา Σ(x − x̄)(y − ȳ) และ Σ(x − x̄)²"
      - "ความชันคือผลรวมแรกหารด้วยผลรวมที่สอง"
    solution: "x̄ = 3 และ ȳ = 5.6 ได้ Σ(x − x̄)(y − ȳ) = 18 และ Σ(x − x̄)² = 10 จึงได้ความชัน 1.8"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.supervised-learning.p006
    topics: [computer.ai.supervised-learning]
    difficulty: 2
    type: text
    stem: "ในการถดถอย ค่าที่ใช้วัดว่าเส้นทำนายคลาดเคลื่อนจากค่าจริงมากน้อยเพียงใด เรียกว่าอะไร (ตอบเป็นภาษาไทยหรืออังกฤษก็ได้)"
    accepted: ["ฟังก์ชันสูญเสีย", "ค่าสูญเสีย", "loss", "loss function", "ฟังก์ชันสูญเสีย (loss)"]
    hints:
      - "เป็นค่าที่ต้องทำให้น้อยที่สุดเมื่อฝึกแบบจำลอง"
      - "คำนี้มักเกี่ยวข้องกับการเรียนแบบเกรเดียนต์ลงเขา"
      - "ภาษาอังกฤษใช้คำว่า loss"
    solution: "ฟังก์ชันสูญเสีย (loss function) วัดความคลาดเคลื่อนระหว่างค่าทำนายกับค่าจริง เช่น ผลรวมของกำลังสองของระยะคลาดเคลื่อน การฝึกคือการหาค่าพารามิเตอร์ที่ทำให้ค่านี้น้อยที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.supervised-learning.p007
    topics: [computer.ai.supervised-learning]
    difficulty: 2
    type: match
    stem: "จับคู่ชื่อวิธีกับลักษณะการทำงาน"
    pairs:
      - { left: "การถดถอย (regression)", right: "ทำนายค่าตัวเลขต่อเนื่อง เช่น จำนวนแก้วที่ขายได้" }
      - { left: "การจำแนก (classification)", right: "ทำนายหมวดหมู่ เช่น ขายดีหรือขายไม่ดี" }
      - { left: "ต้นไม้ตัดสินใจ", right: "แบ่งข้อมูลด้วยเงื่อนไขทีละขั้นจนได้คำตอบที่ปลายกิ่ง" }
      - { left: "k-NN", right: "ทำนายจากคลาสที่พบมากที่สุดของตัวอย่างใกล้ที่สุด k ตัว" }
    hints:
      - "ดูว่าผลลัพธ์ของแต่ละวิธีเป็นตัวเลขหรือหมวดหมู่"
      - "ต้นไม้ทำงานด้วยการถามเงื่อนไขเป็นขั้น ๆ"
      - "k-NN ไม่ได้สร้างสมการ แต่ดูเพื่อนบ้านใกล้ที่สุด"
    solution: "การถดถอยทำนายค่าตัวเลข การจำแนกทำนายหมวดหมู่ ต้นไม้ตัดสินใจถามเงื่อนไขเป็นขั้น และ k-NN ใช้เพื่อนบ้านใกล้ที่สุดในการลงคะแนนคลาส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.supervised-learning.p008
    topics: [computer.ai.supervised-learning]
    difficulty: 2
    type: mcq
    stem: "ทำไมต้นไม้ตัดสินใจจึงอธิบายได้ง่ายกว่าแบบจำลองที่ซับซ้อนบางชนิด"
    choices:
      - { id: a, text: "เพราะต้นไม้ใช้ข้อมูลน้อยกว่าเสมอ", feedback: "ต้นไม้ไม่ได้ใช้ข้อมูลน้อยกว่าแบบจำลองอื่นเสมอไป" }
      - { id: b, text: "เพราะต้นไม้ไม่ต้องใช้ข้อมูลฝึกเลย", feedback: "ต้นไม้ต้องเรียนจากข้อมูลฝึกเหมือนแบบจำลองอื่น" }
      - { id: c, text: "เพราะต้นไม้แม่นกว่าแบบจำลองทุกชนิด", feedback: "ความแม่นขึ้นกับข้อมูลและปัญหา ไม่ได้เป็นจริงเสมอ" }
      - { id: d, text: "เพราะแต่ละขั้นเป็นเงื่อนไขที่อ่านได้ เช่น ถ้าอุณหภูมิต่ำกว่า 30 องศา ให้ไปทางซ้าย", correct: true }
    hints:
      - "ลองนึกว่าเราอ่านต้นไม้ทีละอย่างไร"
      - "การตัดสินใจของต้นไม้เป็นเส้นทางจากรากถึงปลายกิ่ง"
      - "เลือกข้อที่บอกว่าแต่ละขั้นอธิบายได้เป็นภาษาธรรมดา"
    solution: "ต้นไม้ตัดสินใจประกอบด้วยเงื่อนไขทีละขั้น ทำให้อ่านเส้นทางการตัดสินใจและอธิบายผู้ใช้ได้ ตัวเลือกอื่นไม่ถูกต้องหรือไม่จริงเสมอไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.supervised-learning.p009
    topics: [computer.ai.supervised-learning]
    difficulty: 3
    type: numeric
    stem: "กลุ่มหนึ่งมี 6 ตัวอย่าง เป็นคลาส ใช่ 4 ตัวอย่าง และ ไม่ใช่ 2 ตัวอย่าง ค่าความไม่บริสุทธิ์แบบจินี 1 − Σ(สัดส่วน)² ของกลุ่มนี้เท่ากับเท่าใด (ตอบทศนิยม 3 ตำแหน่ง)"
    answer: { value: 0.444, tolerance: 0.005 }
    misconceptions:
      - { match: 0.333, feedback: "ลบเพียงสัดส่วนของคลาสใช่ (4/6) ออกจาก 1 ต้องลบผลรวมของกำลังสองของสัดส่วนทุกคลาส" }
    hints:
      - "หาสัดส่วนของคลาสใช่และคลาสไม่ใช่ก่อน"
      - "ยกกำลังสองแต่ละสัดส่วนแล้วรวมกัน"
      - "นำผลรวมที่ได้ไปลบออกจาก 1"
    solution: "สัดส่วนคือ 4/6 และ 2/6 จึงได้ 1 − ((4/6)² + (2/6)²) = 1 − (16/36 + 4/36) = 20/36 ≈ 0.444"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.supervised-learning.p010
    topics: [computer.ai.supervised-learning]
    difficulty: 3
    type: numeric
    stem: "แบ่งกลุ่ม 6 ตัวอย่างเป็นกลุ่มซ้าย 4 ตัวอย่าง (ใช่ 3 ไม่ใช่ 1) และกลุ่มขวา 2 ตัวอย่าง (ใช่ 1 ไม่ใช่ 1) ค่าจินีถ่วงน้ำหนักของการแบ่งนี้เท่ากับเท่าใด (ตอบทศนิยม 3 ตำแหน่ง)"
    answer: { value: 0.417, tolerance: 0.001 }
    misconceptions:
      - { match: 0.375, feedback: "ใช้จินีของกลุ่มซ้ายเพียงกลุ่มเดียว ไม่ได้ถ่วงน้ำหนักทั้งสองกลุ่ม" }
    hints:
      - "คำนวณจินีของแต่ละกลุ่มย่อยก่อน"
      - "ถ่วงน้ำหนักด้วยสัดส่วนจำนวนตัวอย่างของแต่ละกลุ่มย่อยเมื่อเทียบกับทั้งหมด"
      - "กลุ่มซ้ายมีน้ำหนัก 4/6 และกลุ่มขวามีน้ำหนัก 2/6"
    solution: "จินีกลุ่มซ้ายคือ 1 − (3/4)² − (1/4)² = 0.375 และกลุ่มขวาคือ 0.5 จึงได้ (4/6)(0.375) + (2/6)(0.5) ≈ 0.417"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.supervised-learning.p011
    topics: [computer.ai.supervised-learning]
    difficulty: 3
    type: numeric
    stem: "แบบจำลองถดถอย y = 0.5x + 12 ทำนายยอดขายของร้านหนึ่งเมื่อ x = 26 ถ้ายอดขายจริงคือ 27 ค่าคลาดเคลื่อนสัมบูรณ์ |จริง − ทำนาย| เท่ากับเท่าใด"
    answer: { value: 2, tolerance: 0, unit: "หน่วย" }
    misconceptions:
      - { match: 25, feedback: "นั่นคือค่าที่ทำนาย ไม่ใช่ค่าคลาดเคลื่อน ต้องนำค่าจริงลบค่าทำนาย" }
    hints:
      - "คำนวณค่าทำนายก่อนโดยแทน x = 26"
      - "หาผลต่างระหว่างค่าจริงกับค่าทำนาย"
      - "ค่าสัมบูรณ์ของผลต่างคือค่าคลาดเคลื่อน"
    solution: "ค่าทำนาย 0.5 × 26 + 12 = 25 ค่าจริง 27 ผลต่างคือ 2 หน่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.supervised-learning.p012
    topics: [computer.ai.supervised-learning]
    difficulty: 3
    type: mcq
    stem: "แบบจำลองที่จำข้อมูลฝึกได้เกือบสมบูรณ์ ทำนายข้อมูลใหม่ได้แย่ลง เพราะเหตุใด"
    choices:
      - { id: a, text: "เพราะข้อมูลใหม่มีจำนวนน้อยกว่าเสมอ", feedback: "จำนวนข้อมูลไม่ใช่สาเหตุหลักของปัญหานี้" }
      - { id: b, text: "เพราะจับเสียงรบกวนและลักษณะเฉพาะของข้อมูลฝึกมากเกินไป จนไม่จับรูปแบบที่ใช้ได้กับข้อมูลใหม่", correct: true }
      - { id: c, text: "เพราะคอมพิวเตอร์ลืมแบบจำลองหลังฝึกเสร็จ", feedback: "แบบจำลองที่บันทึกไว้ไม่ได้หายไปเอง" }
      - { id: d, text: "เพราะแบบจำลองทำนายได้เฉพาะตัวเลขจำนวนเต็ม", feedback: "แบบจำลองทำนายค่าทศนิยมได้" }
    hints:
      - "คิดว่าแบบจำลองเรียนอะไรจากข้อมูลฝึก"
      - "ถ้าเรียนรายละเอียดเฉพาะของข้อมูลฝึกมากเกินไป จะเกิดอะไรกับข้อมูลใหม่"
      - "เลือกข้อที่พูดถึงการจำมากเกินไปและรูปแบบทั่วไป"
