id: earthscience.astronomy.solar-system
subject: earthscience
title: { th: ระบบสุริยะและดวงอาทิตย์, en: "The solar system and the Sun" }
summary: การเกิดระบบสุริยะจากเนบิวลา เขตบริวารของดวงอาทิตย์ เขตเอื้อต่อชีวิต กฎของเคพเลอร์กับความโน้มถ่วงและการคำนวณคาบ โครงสร้างดวงอาทิตย์ ลมสุริยะ พายุสุริยะ และผลต่อโลกและประเทศไทย
difficulty: 6
minutes: 45
prerequisites: [physics.dynamics.satellite-motion]
encompasses:
  - { id: physics.dynamics.satellite-motion, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: เขตบริวารของดวงอาทิตย์
    src: zones.svg
    alt: "แกนระยะห่างจากดวงอาทิตย์แบบลอการิทึม 0.2 ถึง 100,000 AU ดาวเคราะห์หินชั้นใน พุธ 0.39 ศุกร์ 0.72 โลก 1 อังคาร 1.52 AU แถบสีเขียวเขตเอื้อต่อชีวิตราว 0.95–1.4 AU ครอบโลก แถบสีเทาแถบดาวเคราะห์น้อย 2.2–3.3 AU เส้นประสีฟ้าแนวน้ำแข็งราว 3–5 AU ขณะระบบสุริยะเกิด ดาวเคราะห์ชั้นนอก พฤหัสบดี 5.2 เสาร์ 9.6 ยูเรนัส 19.2 เนปจูน 30 AU แถบสีฟ้าแถบไคเปอร์ 30–50 AU และแถบสีม่วงอ่อนเมฆออร์ตราว 2,000–100,000 AU ซึ่งขอบเขตไม่แน่นอน"
    caption: "หินและโลหะควบแน่นได้ใกล้ดวงอาทิตย์ น้ำแข็งควบแน่นได้เลยแนวน้ำแข็งออกไป (วาดโดยทีมคลังรู้ ระยะของดาวเคราะห์ตามกึ่งแกนเอก)"
  - type: figure
    title: กฎข้อที่หนึ่งและสองของเคพเลอร์
    src: kepler.svg
    alt: "วงรีความรี 0.55 ดวงอาทิตย์อยู่ที่โฟกัสด้านขวา โฟกัสอีกจุดอยู่ด้านซ้ายของศูนย์กลาง ปลายขวาคือจุดใกล้ดวงอาทิตย์ที่สุด ปลายซ้ายคือจุดไกลดวงอาทิตย์ที่สุด พื้นที่สีแดงรูปพัดกว้างใกล้จุดใกล้สุด เขียนว่าเคลื่อนที่เร็ว และพื้นที่สีน้ำเงินรูปพัดแคบยาวใกล้จุดไกลสุด เขียนว่าเคลื่อนที่ช้า สองพื้นที่นี้เท่ากันและใช้เวลาเท่ากัน ด้านล่างบอกว่า a คือกึ่งแกนเอก ระยะจากศูนย์กลางถึงโฟกัสเท่ากับ ae"
    caption: "เวลาเท่ากัน กวาดพื้นที่เท่ากัน พื้นที่ทั้งสองคำนวณจากสมการของเคพเลอร์ (วาดโดยทีมคลังรู้ ความรีมากกว่าดาวเคราะห์จริงเพื่อให้เห็นชัด)"
  - type: worked-example
    title: ชั่งมวลดวงอาทิตย์จากวงโคจรของโลก
    problem: "โลกโคจรรอบดวงอาทิตย์รัศมีเฉลี่ย $1.496 \\times 10^{11}$ m คาบ 1 ปี ($3.156 \\times 10^7$ s) หามวลของดวงอาทิตย์ และอัตราเร็วเฉลี่ยของโลก"
    steps:
      - text: "จาก $T^2 = \\dfrac{4\\pi^2}{GM}a^3$ จัดใหม่ได้ $M = \\dfrac{4\\pi^2 a^3}{G T^2}$"
        why: "แรงโน้มถ่วงของดวงอาทิตย์ทำหน้าที่เป็นแรงสู่ศูนย์กลาง"
      - text: "$a^3 = (1.496 \\times 10^{11})^3 = 3.348 \\times 10^{33}\\ \\mathrm{m^3}$ และ $T^2 = 9.960 \\times 10^{14}\\ \\mathrm{s^2}$"
      - text: "$M = \\dfrac{39.48 \\times 3.348 \\times 10^{33}}{(6.674 \\times 10^{-11})(9.960 \\times 10^{14})} \\approx 1.99 \\times 10^{30}$ kg"
      - text: "อัตราเร็วเฉลี่ย $v = \\dfrac{2\\pi a}{T} = \\dfrac{2\\pi (1.496 \\times 10^{11})}{3.156 \\times 10^7} \\approx 2.98 \\times 10^4$ m/s"
    answer: "มวลดวงอาทิตย์ราว $1.99 \\times 10^{30}$ kg และโลกเคลื่อนที่ราว 29.8 km/s"
  - { type: check, problem: earthscience.astronomy.solar-system.p004, prompt: "ใช้ T = a^1.5" }
  - type: figure
    title: โครงสร้างของดวงอาทิตย์
    src: sun.svg
    alt: "ภาพตัดดวงอาทิตย์ ใจกลางสีขาวคือแกน หลอมนิวเคลียส ราว 15 ล้าน K ถัดออกมาคือเขตการแผ่รังสี มีเส้นซิกแซกแสดงพลังงานเดินทางออกโดยการแผ่รังสี ชั้นนอกคือเขตการพาความร้อน มีวงแสดงแก๊สร้อนลอยขึ้น เย็นแล้วจมลง ผิวคือโฟโตสเฟียร์ราว 5,800 K มีจุดมืดสองจุด ขอบนอกสีส้มคือโครโมสเฟียร์ และรัศมีเรืองรอบนอกคือคอโรนาร้อนกว่าหนึ่งล้าน K ด้านบนมีพวยแก๊สเป็นวงโค้งสีแดง ด้านซ้ายมีลูกศรลมสุริยะ อนุภาคมีประจุ 250–750 km/s หมายเหตุบอกขอบเขตตามรัศมี แกน 0–0.25 R เขตการแผ่รังสี 0.25–0.7 R เขตการพาความร้อน 0.7–1 R"
    caption: "พลังงานเกิดที่แกน แล้วเดินทางออกด้วยการแผ่รังสีและการพาความร้อน (วาดโดยทีมคลังรู้ คอโรนา จุดมืด และพวยแก๊สไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: พายุสุริยะมาถึงโลกเมื่อใด
    problem: "สังเกตเห็นการลุกจ้าบนดวงอาทิตย์ พร้อมมวลคอโรนาพุ่งเข้าหาโลกด้วยอัตราเร็ว 1,500 km/s แสงจากการลุกจ้าและก้อนมวลคอโรนาจะมาถึงโลกเมื่อใด"
    steps:
      - text: "ระยะทาง 1 AU $= 1.496 \\times 10^8$ km"
      - text: "แสง: $t = \\dfrac{1.496 \\times 10^8}{3 \\times 10^5} \\approx 499$ s หรือราว 8.3 นาที"
        why: "เราเห็นการลุกจ้าเมื่อแสงมาถึงแล้ว จึงไม่มีเวลาเตือนสำหรับรังสีเอกซ์"
      - text: "มวลคอโรนา: $t = \\dfrac{1.496 \\times 10^8}{1{,}500} \\approx 9.97 \\times 10^4$ s หรือราว 27.7 ชั่วโมง"
      - text: "จึงมีเวลาราวหนึ่งวันเตือนผู้ดูแลดาวเทียม ระบบไฟฟ้า และการบิน"
    answer: "แสงถึงในราว 8.3 นาที มวลคอโรนาถึงในราว 28 ชั่วโมง"
  - { type: check, problem: earthscience.astronomy.solar-system.p003 }
glossary:
  - { term: เนบิวลาสุริยะ, definition: "เมฆแก๊สและฝุ่นที่ยุบตัวเป็นดวงอาทิตย์และจานที่ให้กำเนิดดาวเคราะห์ เมื่อราว 4,600 ล้านปีก่อน" }
  - { term: แนวน้ำแข็ง, definition: "ระยะจากดวงอาทิตย์ที่เย็นพอให้น้ำและสารระเหยง่ายแข็งตัว แบ่งดาวเคราะห์หินกับดาวเคราะห์ยักษ์" }
  - { term: หน่วยดาราศาสตร์ (AU), definition: "ระยะเฉลี่ยระหว่างโลกกับดวงอาทิตย์ 1.496 × 10⁸ km" }
  - { term: เขตเอื้อต่อชีวิต, definition: "ช่วงระยะจากดาวฤกษ์ที่ดาวเคราะห์มีอุณหภูมิพอให้น้ำเป็นของเหลวบนผิวได้" }
  - { term: กึ่งแกนเอก, definition: "ครึ่งหนึ่งของแกนยาวของวงรี ใช้เป็นระยะเฉลี่ยของวงโคจร" }
  - { term: ความรี, definition: "ตัวเลขบอกว่าวงรีแบนเพียงใด 0 คือวงกลม ยิ่งเข้าใกล้ 1 ยิ่งแบน" }
  - { term: ลมสุริยะ, definition: "อนุภาคมีประจุที่ไหลออกจากคอโรนาตลอดเวลา อัตราเร็วราว 250–750 km/s" }
  - { term: พายุสุริยะ, definition: "การลุกจ้าและการพ่นมวลคอโรนาที่ปลดปล่อยรังสีและอนุภาคพลังงานสูงออกมาอย่างฉับพลัน" }
  - { term: จุดมืดดวงอาทิตย์, definition: "บริเวณบนโฟโตสเฟียร์ที่เย็นกว่ารอบข้างเพราะสนามแม่เหล็กแรง จำนวนขึ้นลงตามวัฏจักรราว 11 ปี" }
flashcards:
  - { front: "กฎสามข้อของเคพเลอร์", back: "1 วงโคจรเป็นวงรี ดวงอาทิตย์อยู่ที่โฟกัส 2 เวลาเท่ากันกวาดพื้นที่เท่ากัน 3 T² ∝ a³" }
  - { front: "T² = a³ ใช้เมื่อใด", back: "วัตถุโคจรรอบดวงอาทิตย์ T เป็นปี a เป็น AU ระบบอื่นใช้ T² = 4π²a³/(GM)" }
  - { front: "เขตบริวารของดวงอาทิตย์", back: "ดาวเคราะห์ชั้นใน แถบดาวเคราะห์น้อย ดาวเคราะห์ชั้นนอก แถบไคเปอร์และเมฆออร์ต" }
  - { front: "ชั้นของดวงอาทิตย์จากในออกนอก", back: "แกน เขตการแผ่รังสี เขตการพาความร้อน โฟโตสเฟียร์ โครโมสเฟียร์ คอโรนา" }
  - { front: "พายุสุริยะส่งผลต่อไทยอย่างไร", back: "GPS คลาดเคลื่อน วิทยุคลื่นสั้นขัดข้อง ดาวเทียมเสียหาย แต่แทบไม่เห็นแสงเหนือ" }
