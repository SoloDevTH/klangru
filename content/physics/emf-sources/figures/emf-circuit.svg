<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" font-family="sans-serif" font-size="14">
<title>แหล่งกำเนิดไฟฟ้าที่มีอีเอ็มเอฟ E และความต้านทานภายใน r ต่อกับตัวต้านทาน R และกราฟความต่างศักย์ขั้วกับกระแส</title>
<rect x="0" y="0" width="780" height="380" fill="#ffffff"/>
<text x="185.0" y="26.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">ก. วงจร</text>
<rect x="110.0" y="90.0" width="170.0" height="80.0" rx="0" fill="none" stroke="#777" stroke-width="1.2"/>
<rect x="110" y="90" width="170" height="80" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="195.0" y="186.0" text-anchor="middle" fill="#777" font-size="12">แบตเตอรี่ (ในกรอบเส้นประ)</text>
<line x1="50.0" y1="130.0" x2="145.0" y2="130.0" stroke="#15211e" stroke-width="2"/>
<line x1="145.0" y1="112.0" x2="145.0" y2="148.0" stroke="#15211e" stroke-width="2.5"/>
<line x1="155.0" y1="120.0" x2="155.0" y2="140.0" stroke="#15211e" stroke-width="5"/>
<text x="138.0" y="110.0" text-anchor="middle" fill="#c0392b" font-size="14" font-weight="bold">+</text>
<text x="164.0" y="116.0" text-anchor="middle" fill="#1f5fa8" font-size="16" font-weight="bold">−</text>
<line x1="160.0" y1="130.0" x2="200.0" y2="130.0" stroke="#15211e" stroke-width="2"/>
<rect x="200.0" y="121.0" width="50.0" height="18.0" rx="0" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="225.0" y="114.0" text-anchor="middle" fill="#15211e" font-size="13">r</text>
<line x1="250.0" y1="130.0" x2="330.0" y2="130.0" stroke="#15211e" stroke-width="2"/>
<text x="150.0" y="160.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">E</text>
<line x1="330.0" y1="130.0" x2="330.0" y2="280.0" stroke="#15211e" stroke-width="2"/>
<line x1="50.0" y1="280.0" x2="330.0" y2="280.0" stroke="#15211e" stroke-width="2"/>
<rect x="321.0" y="180.0" width="18.0" height="60.0" rx="0" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="346.0" y="215.0" text-anchor="start" fill="#15211e" font-size="13">R</text>
<line x1="50.0" y1="130.0" x2="50.0" y2="280.0" stroke="#15211e" stroke-width="2"/>
<circle cx="50.0" cy="205.0" r="15.0" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="50.0" y="210.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">A</text>
<line x1="100.0" y1="130.0" x2="100.0" y2="75.0" stroke="#777" stroke-width="1.5"/>
<line x1="290.0" y1="130.0" x2="290.0" y2="75.0" stroke="#777" stroke-width="1.5"/>
<line x1="100.0" y1="75.0" x2="180.0" y2="75.0" stroke="#777" stroke-width="1.5"/>
<line x1="210.0" y1="75.0" x2="290.0" y2="75.0" stroke="#777" stroke-width="1.5"/>
<circle cx="195.0" cy="75.0" r="15.0" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="195.0" y="80.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">V</text>
<line x1="220.0" y1="280.0" x2="272.4" y2="280.0" stroke="#c0392b" stroke-width="2"/>
<polygon points="280.0,280.0 271.0,275.9 271.0,284.1" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<text x="250.0" y="300.0" text-anchor="middle" fill="#c0392b" font-size="14" font-weight="bold">I</text>
<text x="190.0" y="335.0" text-anchor="middle" fill="#15211e" font-size="14">V (ขั้วแบตเตอรี่) = E − Ir</text>
<text x="190.0" y="357.0" text-anchor="middle" fill="#15211e" font-size="14">I = E / (R + r)</text>
<line x1="400.0" y1="10.0" x2="400.0" y2="370.0" stroke="#cccccc" stroke-width="1"/>
<text x="590.0" y="26.0" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">ข. ความต่างศักย์ขั้วกับกระแส</text>
<line x1="460.0" y1="310.0" x2="740.6" y2="310.0" stroke="#15211e" stroke-width="2"/>
<polygon points="750.0,310.0 739.0,305.1 739.0,314.9" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<line x1="460.0" y1="310.0" x2="460.0" y2="74.3" stroke="#15211e" stroke-width="2"/>
<polygon points="460.0,65.0 455.1,76.0 464.9,76.0" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="746.0" y="334.0" text-anchor="end" fill="#15211e" font-size="14" font-weight="bold">I</text>
<text x="452.0" y="68.0" text-anchor="end" fill="#15211e" font-size="14" font-weight="bold">V</text>
<line x1="460.0" y1="114.5" x2="726.0" y2="245.6" stroke="#1f5fa8" stroke-width="3"/>
<circle cx="460.0" cy="114.5" r="4.5" fill="#1f5fa8" stroke="#1f5fa8" stroke-width="2"/>
<text x="452.0" y="119.5" text-anchor="end" fill="#1f5fa8" font-size="14" font-weight="bold">E</text>
<line x1="544.0" y1="155.9" x2="656.0" y2="155.9" stroke="#777" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="656.0" y1="155.9" x2="656.0" y2="211.1" stroke="#777" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="664.0" y="187.5" text-anchor="start" fill="#777" font-size="13">ความชัน = −r</text>
<text x="600.0" y="350.0" text-anchor="middle" fill="#15211e" font-size="13">จุดตัดแกน V คือ E (เมื่อ I = 0)</text>
</svg>
