      - "ความถี่เท่าเดิม $\\lambda = v/f$ ยาวขึ้นกี่เท่า แล้วเชือกบรรจุลูปที่ยาว $\\lambda/2$ ได้กี่ลูป"
    solution: "$v \\propto \\sqrt{T}$ แรงตึง 4 เท่า อัตราเร็ว 2 เท่า ความถี่เท่าเดิม ความยาวคลื่นจึงยาว 2 เท่า ลูปแต่ละลูปยาว 2 เท่า เชือกยาวเท่าเดิมจึงมีลูป $\\tfrac{4}{2} = 2$ ลูป"
