    ai_assisted: true

  - id: physics.fields.field-forces.p015
    topics: [physics.fields.field-forces]
    difficulty: 5
    type: numeric
    stem: "นักบินอวกาศหนัก $600\\ \\mathrm{N}$ บนโลก เดินทางไปดาวเคราะห์สมมติที่มีมวล 2 เท่าของโลก และรัศมี 2 เท่าของรัศมีโลก บนผิวดาวดวงนี้เขาจะหนักเท่าใด (ตอบในหน่วย N)"
    answer: { value: 300, tolerance: 1, unit: N }
    misconceptions:
      - { match: 1200, feedback: "คิดเฉพาะมวลที่เพิ่ม 2 เท่า แต่ผิวดาวอยู่ไกลจากศูนย์กลางดาวเป็น 2 เท่าด้วย แรงจึงลดลงตามระยะ" }
      - { match: 600, feedback: "คิดว่ามวล 2 เท่ากับรัศมี 2 เท่าหักล้างกัน แต่ระยะ 2 เท่าทำให้แรงเหลือ 1/4 ไม่ใช่ 1/2" }
      - { match: 150, feedback: "คิดผลของระยะถูกแล้ว แต่ลืมว่าดาวมีมวล 2 เท่า ต้องดึงแรงขึ้น 2 เท่า" }
    hints:
      - "แยกคิดสองผล คือผลของมวลดาวและผลของระยะจากศูนย์กลางดาว"
      - "มวล 2 เท่า แรง × 2 ระยะ 2 เท่า แรง × 1/4"
    solution: "มวลดาว 2 เท่า แรงเพิ่ม 2 เท่า ส่วนระยะจากศูนย์กลางถึงผิว 2 เท่า แรงเหลือ $\\tfrac{1}{4}$ รวมกันแรงเป็น $2 \\times \\tfrac{1}{4} = \\tfrac{1}{2}$ เท่า จึงหนัก $600 \\times \\tfrac{1}{2} = 300\\ \\mathrm{N}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.fields.field-forces.p016
    topics: [physics.fields.field-forces]
    difficulty: 5
    type: mcq
    stem: "ลูกบอลโฟมเคลือบโลหะแขวนด้วยด้าย เมื่อนำแท่งแก้วที่มีประจุบวกเข้าใกล้ ลูกบอลเอียงเข้าหาแท่งแก้ว นักเรียนสรุปว่า \"ลูกบอลต้องมีประจุลบ\" ข้อสรุปนี้เชื่อถือได้หรือไม่ และควรทดสอบอย่างไร"
    choices:
      - { id: a, text: "ยังสรุปไม่ได้ เพราะลูกบอลที่เป็นกลางก็ถูกดูดได้จากการเหนี่ยวนำ ควรทดสอบว่าลูกบอลถูกวัตถุที่มีประจุลบผลักหรือไม่", correct: true }
      - { id: b, text: "เชื่อถือได้ เพราะประจุต่างชนิดเท่านั้นที่ดูดกัน", feedback: "วัตถุที่เป็นกลางก็ถูกดูดได้ เพราะประจุในลูกบอลเลื่อนไปอยู่ด้านใกล้แท่งแก้ว (การเหนี่ยวนำ) การดูดจึงไม่ได้พิสูจน์ชนิดของประจุ" }
      - { id: c, text: "ยังสรุปไม่ได้ ควรนำแม่เหล็กมาทดสอบแทน", feedback: "แม่เหล็กไม่ได้บอกชนิดของประจุไฟฟ้า ต้องทดสอบด้วยวัตถุที่มีประจุซึ่งรู้ชนิดแล้ว" }
    hints:
      - "ลองนึกถึงหวีที่ดูดเศษกระดาษซึ่งไม่มีประจุ"
      - "แรงแบบใดเกิดได้เฉพาะเมื่อวัตถุทั้งสองมีประจุชนิดเดียวกัน"
    solution: "การดูดเกิดได้ทั้งกับวัตถุที่มีประจุตรงข้ามและวัตถุที่เป็นกลาง (ประจุในวัตถุจัดตัวใหม่โดยการเหนี่ยวนำ) แต่การผลักเกิดเฉพาะเมื่อมีประจุชนิดเดียวกัน จึงควรนำวัตถุที่รู้ว่ามีประจุลบเข้าใกล้ ถ้าลูกบอลถูกผลัก จึงสรุปได้ว่าลูกบอลมีประจุลบ"
