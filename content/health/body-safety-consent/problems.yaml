      - { id: b, text: "ตอบตกลงเพราะถูกขู่ว่าถ้าไม่ยอมจะไม่มีใครเป็นเพื่อนด้วย", feedback: "การตกลงเพราะถูกขู่ไม่ใช่ความยินยอม เพราะไม่ได้เต็มใจ" }
      - { id: c, text: "ตอบตกลงเพราะถูกหลอกว่าจะได้ของรางวัล", feedback: "การตกลงเพราะถูกหลอกไม่ใช่ความยินยอม เพราะไม่รู้ความจริง" }
