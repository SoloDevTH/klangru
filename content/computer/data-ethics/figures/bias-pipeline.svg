<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="sans-serif" font-size="15">
  <title>ความเอนเอียงที่อาจแทรกในห้าขั้นตอนของงานข้อมูล</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#15211e">ความเอนเอียงแทรกได้ทุกขั้นของงานข้อมูล</text>
  <rect x="11" y="70" width="130" height="56" rx="8" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="76.0" y="103.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#15211e">1 เก็บข้อมูล</text>
  <line x1="144" y1="98.0" x2="160" y2="98.0" stroke="#15211e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="76.0" y1="126" x2="76.0" y2="144" stroke="#b5562b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="76.0" y="164" text-anchor="middle" font-size="13" font-weight="normal" fill="#b5562b">เก็บจากผู้ใช้แอป</text>
  <text x="76.0" y="182" text-anchor="middle" font-size="13" font-weight="normal" fill="#b5562b">ขาดกลุ่มที่เข้าถึงยาก</text>
  <rect x="163" y="70" width="130" height="56" rx="8" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="228.0" y="103.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#15211e">2 ติดป้ายข้อมูล</text>
  <line x1="296" y1="98.0" x2="312" y2="98.0" stroke="#15211e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="228.0" y1="126" x2="228.0" y2="144" stroke="#b5562b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="228.0" y="164" text-anchor="middle" font-size="13" font-weight="normal" fill="#b5562b">ผู้ติดป้ายมี</text>
  <text x="228.0" y="182" text-anchor="middle" font-size="13" font-weight="normal" fill="#b5562b">ความเข้าใจต่างกัน</text>
  <rect x="315" y="70" width="130" height="56" rx="8" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="380.0" y="103.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#15211e">3 เลือกตัวแปร</text>
  <line x1="448" y1="98.0" x2="464" y2="98.0" stroke="#15211e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="380.0" y1="126" x2="380.0" y2="144" stroke="#b5562b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="380.0" y="164" text-anchor="middle" font-size="13" font-weight="normal" fill="#b5562b">ตัวแปรแทน (proxy)</text>
  <text x="380.0" y="182" text-anchor="middle" font-size="13" font-weight="normal" fill="#b5562b">พาความเหลื่อมล้ำมา</text>
  <rect x="467" y="70" width="130" height="56" rx="8" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="532.0" y="103.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#15211e">4 ฝึกและทดสอบ</text>
  <line x1="600" y1="98.0" x2="616" y2="98.0" stroke="#15211e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="532.0" y1="126" x2="532.0" y2="144" stroke="#b5562b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="532.0" y="164" text-anchor="middle" font-size="13" font-weight="normal" fill="#b5562b">ดูแค่ค่าเฉลี่ยรวม</text>
  <text x="532.0" y="182" text-anchor="middle" font-size="13" font-weight="normal" fill="#b5562b">กลุ่มเล็กถูกกลบ</text>
  <rect x="619" y="70" width="130" height="56" rx="8" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="684.0" y="103.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#15211e">5 นำไปใช้</text>
  <line x1="684.0" y1="126" x2="684.0" y2="144" stroke="#b5562b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="684.0" y="164" text-anchor="middle" font-size="13" font-weight="normal" fill="#b5562b">ใช้กับกลุ่มที่ข้อมูล</text>
  <text x="684.0" y="182" text-anchor="middle" font-size="13" font-weight="normal" fill="#b5562b">ไม่เคยครอบคลุม</text>
  <text x="380" y="220" text-anchor="middle" font-size="13" font-weight="normal" fill="#4a5a55">ค่าเฉลี่ยรวมที่ดีอาจซ่อนกลุ่มที่ถูกมองข้ามไว้ จึงควรตรวจทีละขั้นและทีละกลุ่ม</text>
  <text x="380" y="244" text-anchor="middle" font-size="13" font-weight="normal" fill="#4a5a55">ภาพแสดงตัวอย่างเพื่อการเรียน ไม่ได้มาจากข้อมูลของกลุ่มหรือบุคคลจริง</text>
</svg>
