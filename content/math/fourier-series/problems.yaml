  difficulty: 3
  type: mcq
  stem: 'ที่จุดกระโดดของคลื่นสี่เหลี่ยม ผลบวกย่อยของอนุกรมฟูเรียร์เมื่อมีพจน์มากขึ้นลู่เข้าไปยังค่าใด'
  choices:
  - id: a
    text: ค่าทางด้านซ้ายของจุดกระโดดเท่านั้น
    correct: false
    feedback: ผลบวกย่อยไม่เข้าหาค่าด้านซ้ายเพียงด้านเดียว มันเข้าหาค่ากลางของสองด้าน
  - id: b
    text: ค่าเฉลี่ยของค่าทางซ้ายและทางขวาของจุดกระโดด
    correct: true
  - id: c
    text: ไม่มีลิมิต เพราะผลบวกย่อยลู่ออก
    correct: false
    feedback: ที่จุดกระโดดผลบวกย่อยยังมีลิมิตจำกัด แม้ฟังก์ชันจะไม่ต่อเนื่อง
  - id: d
    text: ค่าทางขวาของจุดกระโดดเท่านั้น
    correct: false
    feedback: ผลบวกย่อยไม่เข้าหาค่าด้านขวาเพียงด้านเดียวเช่นกัน
  hints:
  - ที่จุดกระโดด ค่าฟังก์ชันสองด้านไม่เท่ากัน
  - ทฤษฎีบทของดีรีคลเลต์ให้ค่าลิมิตเป็นค่าเฉลี่ยของสองด้าน
  solution: ที่จุดกระโดด ผลบวกย่อยลู่เข้าไปยังค่าเฉลี่ยของค่าทางซ้ายและทางขวาของฟังก์ชัน ซึ่งเป็นผลจากทฤษฎีบทของดีรีคลเลต์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: math.de.fourier-series.p011
  topics:
  - math.de.fourier-series
  difficulty: 3
  type: match
  stem: 'จับคู่สมบัติของฟังก์ชันคาบหรือการแปลงกับผลที่เกิดกับอนุกรมฟูเรียร์'
  pairs:
  - left: 'ฟังก์ชันคู่ $f(-t)=f(t)$'
    right: 'มีเฉพาะพจน์ $\cos nt$ และค่าคงที่'
  - left: 'ฟังก์ชันคี่ $f(-t)=-f(t)$'
    right: 'มีเฉพาะพจน์ $\sin nt$'
  - left: 'คาบ $2L$'
    right: 'ความถี่พื้นฐาน $\dfrac{\pi}{L}$'
  - left: 'เลื่อนเวลาเป็น $f(t-c)$'
    right: 'ขนาดของแต่ละฮาร์มอนิกไม่เปลี่ยน มีเพียงเฟสที่เปลี่ยน'
  hints:
