          - { id: "ต 4.1 ม.3/1", level: ม.3, text: "ใช้ภาษาสื่อสารในสถานการณ์จริง/สถานการณ์จำลองที่เกิดขึ้นในห้องเรียน สถานศึกษา ชุมชน และสังคม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “สถานการณ์จริง/|สถานการณ์จำลอง” ไม่เว้นวรรค; “ชุมชน|และสังคม” เว้นวรรค" }
          - { id: "ต 4.1 ม.4-6/1", level: ม.4-6, text: "ใช้ภาษาสื่อสารในสถานการณ์จริง/สถานการณ์จำลอง ที่เกิดขึ้นในห้องเรียน สถานศึกษา ชุมชน และสังคม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…อสารในสถานการณ์จริง/|สถานการณ์จำลอง” ไม่เว้นวรรค; “ชุมชน|และสังคม” เว้นวรรค" }
      - id: ต 4.2
        text: "ใช้ภาษาต่างประเทศเป็นเครื่องมือพื้นฐานในการศึกษาต่อ การประกอบอาชีพ และการแลกเปลี่ยนเรียนรู้กับสังคมโลก"
        indicators:
          - { id: "ต 4.2 ป.1/1", level: ป.1, text: "ใช้ภาษาต่างประเทศเพื่อรวบรวมคำศัพท์ที่เกี่ยวข้องใกล้ตัว", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “เพื่อรวบรวม|คำศัพท์ที่” ไม่เว้นวรรค" }
