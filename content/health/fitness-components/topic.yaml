id: health.fitness.fitness-components
subject: health
title: { th: สมรรถภาพทางกายเพื่อสุขภาพ การทดสอบ และการแปลผล, en: "Health-related fitness: components, testing and interpreting results" }
summary: องค์ประกอบของสมรรถภาพทางกายเพื่อสุขภาพ แบบทดสอบของกรมพลศึกษา การอ่านผลเทียบเกณฑ์ตามอายุและเพศ การเลือกกิจกรรมตามจุดเด่นจุดด้อย และคำแนะนำกิจกรรมทางกายของ WHO
difficulty: 2.5
minutes: 35
prerequisites: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: เกณฑ์ลุก-นั่ง 60 วินาที อายุ 12 ปี
    src: situp-norms.svg
    alt: "แถบสีสองแถบแสดงเกณฑ์ลุก-นั่ง 60 วินาทีของเด็กอายุ 12 ปี บนแกนจำนวนครั้ง 0 ถึง 55 แถบชาย: ต่ำมาก 0–13 ต่ำ 14–23 ปานกลาง 24–33 ดี 34–43 ดีมาก 44 ขึ้นไป แถบหญิง: ต่ำมาก 0–12 ต่ำ 13–22 ปานกลาง 23–32 ดี 33–42 ดีมาก 43 ขึ้นไป"
    caption: "เกณฑ์แยกตามอายุและเพศ ที่มา: เกณฑ์มาตรฐานสมรรถภาพทางกายสำหรับเด็กไทยอายุ 7–18 ปี กรมพลศึกษา 2555 (แผนภาพวาดใหม่โดยทีมคลังรู้)"
  - type: worked-example
    title: แปลผลการทดสอบสามรายการ
    problem: "เด็กหญิงอายุ 12 ปีทดสอบได้: ลุก-นั่ง 60 วินาที 25 ครั้ง ดันพื้น 30 วินาที 12 ครั้ง นั่งงอตัวไปข้างหน้า 16 เซนติเมตร แต่ละรายการอยู่ระดับใด และควรพัฒนาด้านใดก่อน"
    figure:
      src: norms-age12.svg
      alt: "ตารางเกณฑ์สมรรถภาพทางกายเด็กอายุ 12 ปี กรมพลศึกษา 2555 ห้าระดับ ต่ำมาก ต่ำ ปานกลาง ดี ดีมาก ลุก-นั่ง 60 วินาที ชาย: 13 ลงมา, 14–23, 24–33, 34–43, 44 ขึ้นไป หญิง: 12 ลงมา, 13–22, 23–32, 33–42, 43 ขึ้นไป ดันพื้น 30 วินาที ชาย: 11 ลงมา, 12–19, 20–27, 28–35, 36 ขึ้นไป หญิง: 9 ลงมา, 10–17, 18–25, 26–33, 34 ขึ้นไป นั่งงอตัวไปข้างหน้า (เซนติเมตร) ชาย: 3 ลงมา, 4–7, 8–11, 12–15, 16 ขึ้นไป หญิง: 4 ลงมา, 5–9, 10–14, 15–19, 20 ขึ้นไป"
    steps:
      - text: "ใช้แถวของเพศหญิงทุกรายการ"
        why: "เกณฑ์ของชายและหญิงต่างกัน ถ้าใช้ผิดแถว ระดับจะผิด"
      - text: "ลุก-นั่ง 25 ครั้ง อยู่ช่วง 23–32 = ปานกลาง"
      - text: "ดันพื้น 12 ครั้ง อยู่ช่วง 10–17 = ต่ำ"
      - text: "นั่งงอตัว 16 เซนติเมตร อยู่ช่วง 15–19 = ดี"
      - text: "ด้านที่ต่ำที่สุดคือดันพื้น จึงควรเพิ่มกิจกรรมที่ฝึกแขนและไหล่ เช่น ดันพื้นกับผนัง ห้อยโหนราว ค่อย ๆ เพิ่มจำนวน แล้วทดสอบซ้ำในภาคเรียนถัดไป"
    answer: "ลุก-นั่ง ปานกลาง ดันพื้น ต่ำ นั่งงอตัว ดี ควรพัฒนากล้ามเนื้อแขนและไหล่ก่อน"
  - { type: check, problem: health.fitness.fitness-components.p005 }
  - type: worked-example
    title: ตรวจว่ากิจกรรมทางกายถึงคำแนะนำหรือยัง
    problem: "สัปดาห์นี้ข้าวโพดเดินไปโรงเรียนวันละ 20 นาที 5 วัน เล่นฟุตบอลหลังเลิกเรียนวันละ 40 นาที 3 วัน และวันเสาร์ว่ายน้ำ 60 นาที ข้าวโพดมีกิจกรรมทางกายเฉลี่ยวันละกี่นาที ถึงคำแนะนำของ WHO หรือไม่"
    steps:
      - text: "เดิน: $20 \\times 5 = 100$ นาที"
      - text: "ฟุตบอล: $40 \\times 3 = 120$ นาที"
      - text: "ว่ายน้ำ: 60 นาที รวมทั้งสัปดาห์ $100 + 120 + 60 = 280$ นาที"
      - text: "เฉลี่ยต่อวัน $280 \\div 7 = 40$ นาที"
        why: "คำแนะนำของ WHO คิดเป็นค่าเฉลี่ยตลอดสัปดาห์ จึงต้องหารด้วย 7 วัน ไม่ใช่เฉพาะวันที่ออกกำลังกาย"
      - text: "เทียบคำแนะนำ 60 นาทีต่อวัน: ยังขาดเฉลี่ยวันละ 20 นาที เช่น เพิ่มการปั่นจักรยานหรือเล่นกลางแจ้งในวันอื่น"
    answer: "เฉลี่ยวันละ 40 นาที ยังไม่ถึง 60 นาทีตามคำแนะนำ"
  - { type: check, problem: health.fitness.fitness-components.p004 }
glossary:
  - { term: สมรรถภาพทางกาย, definition: "ความสามารถของระบบต่าง ๆ ในร่างกายที่ทำงานได้อย่างมีประสิทธิภาพ ทำกิจกรรมได้โดยไม่เหนื่อยล้าเกินไป" }
  - { term: สมรรถภาพทางกายเพื่อสุขภาพ, definition: "องค์ประกอบที่เกี่ยวกับสุขภาพ ได้แก่ ความอดทนของระบบหัวใจและหายใจ ความแข็งแรงและความอดทนของกล้ามเนื้อ ความอ่อนตัว และองค์ประกอบของร่างกาย" }
  - { term: ความอ่อนตัว, definition: "ความสามารถของข้อต่อที่เคลื่อนไหวได้กว้างเต็มที่" }
  - { term: เกณฑ์มาตรฐาน, definition: "ค่าที่กำหนดไว้ใช้แปลผลการทดสอบเป็นระดับ เช่น ต่ำมาก ต่ำ ปานกลาง ดี ดีมาก แยกตามอายุและเพศ" }
  - { term: กิจกรรมทางกายระดับปานกลางถึงหนัก, definition: "กิจกรรมที่ทำให้หายใจเร็วขึ้นและหัวใจเต้นแรงขึ้น เช่น เดินเร็ว ปั่นจักรยาน เล่นฟุตบอล" }
flashcards:
  - { front: "สมรรถภาพทางกายเพื่อสุขภาพมีกี่องค์ประกอบ อะไรบ้าง", back: "5 องค์ประกอบ: ความอดทนของระบบหัวใจและหายใจ ความแข็งแรงของกล้ามเนื้อ ความอดทนของกล้ามเนื้อ ความอ่อนตัว องค์ประกอบของร่างกาย" }
  - { front: "แบบทดสอบของกรมพลศึกษาสำหรับเด็ก 7–18 ปีมีรายการใดบ้าง", back: "ดัชนีมวลกาย นั่งงอตัวไปข้างหน้า ดันพื้นประยุกต์ 30 วินาที ลุก-นั่ง 60 วินาที ยืนยกเข่าขึ้นลง 3 นาที" }
  - { front: "อ่านผลทดสอบสมรรถภาพต้องระวังอะไร", back: "ใช้เกณฑ์ของอายุและเพศตัวเอง และเทียบกับผลครั้งก่อนของตัวเอง" }
  - { front: "WHO แนะนำกิจกรรมทางกายสำหรับเด็ก 5–17 ปีอย่างไร", back: "ระดับปานกลางถึงหนักเฉลี่ยวันละอย่างน้อย 60 นาที กิจกรรมหนักและเสริมกล้ามเนื้อกระดูกอย่างน้อย 3 วันต่อสัปดาห์ ลดเวลานั่งดูจอ" }
