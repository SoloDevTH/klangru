id: biology.genetics.genes-heredity
subject: biology
title: { th: ยีน โครโมโซม การแบ่งเซลล์ และการถ่ายทอดลักษณะ, en: "Genes, chromosomes, cell division and inheritance" }
summary: ความสัมพันธ์ของยีน ดีเอ็นเอ และโครโมโซม การถ่ายทอดลักษณะเดียวที่แอลลีลเด่นข่มแอลลีลด้อยสมบูรณ์ การคำนวณอัตราส่วนจีโนไทป์และฟีโนไทป์ และความต่างของไมโทซิสกับไมโอซิส
difficulty: 3.5
minutes: 45
prerequisites: [biology.genetics.inherited-traits, biology.cells.cell-basics, math.number.ratio-percent]
encompasses:
  - { id: biology.genetics.inherited-traits, weight: 0.3 }
  - { id: math.number.ratio-percent, weight: 0.2 }
  - { id: biology.cells.cell-basics, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: จากเซลล์ถึงยีน
    src: cell-to-gene.svg
    alt: "แบบจำลอง 4 ขั้นจากซ้ายไปขวา เซลล์ที่มีนิวเคลียสอยู่ภายใน ลูกศรไปยังนิวเคลียสที่ขยายแล้ว มีโครโมโซมเป็นคู่ สีน้ำเงินมาจากพ่อ สีแดงมาจากแม่ ลูกศรไปยังโครโมโซมหนึ่งแท่งรูปตัว H มีแถบสีเหลืองตำแหน่งหนึ่ง เส้นประขยายแถบนั้นออกเป็นดีเอ็นเอเกลียวคู่ที่มีขั้นบันไดเป็นคู่เบส A คู่กับ T และ C คู่กับ G กรอบสีเหลืองบนดีเอ็นเอระบุว่ายีนคือช่วงหนึ่งของดีเอ็นเอ"
    caption: "โครโมโซมคือดีเอ็นเอที่พันรอบโปรตีน ยีนคือช่วงหนึ่งของดีเอ็นเอ (วาดโดยทีมคลังรู้)"
  - type: figure
    title: ตารางพันเนตต์ของสีดอกถั่วลันเตา
    src: punnett-flower.svg
    alt: "ตารางพันเนตต์ 2 × 2 ของการผสมดอกสีม่วง Pp กับดอกสีม่วง Pp เซลล์สืบพันธุ์จากต้นที่ 1 คือ P และ p เซลล์สืบพันธุ์จากต้นที่ 2 คือ P และ p ช่องในตารางได้ PP ม่วง Pp ม่วง Pp ม่วง และ pp ขาว กล่องสรุป P ดอกสีม่วง เด่น p ดอกสีขาว ด้อย จีโนไทป์ PP : Pp : pp = 1 : 2 : 1 ฟีโนไทป์ ม่วง : ขาว = 3 : 1 แต่ละช่องมีโอกาส 1/4"
    caption: "แต่ละช่องคือการรวมกันของเซลล์สืบพันธุ์หนึ่งคู่ที่มีโอกาสเท่ากัน (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: หาจำนวนลูกที่คาดว่าจะได้
    problem: "ผสมถั่วลันเตาดอกสีม่วง Pp กับดอกสีม่วง Pp ได้เมล็ด 80 เมล็ด คาดว่าจะได้ต้นดอกสีม่วงและดอกสีขาวอย่างละกี่ต้น"
    steps:
      - text: "เซลล์สืบพันธุ์ของแต่ละต้นคือ P และ p เติมตารางพันเนตต์ได้ PP Pp Pp pp"
      - text: "ดอกสีม่วง (PP หรือ Pp) 3 ช่อง ดอกสีขาว (pp) 1 ช่อง อัตราส่วนฟีโนไทป์ 3 : 1"
        why: "PP และ Pp มีแอลลีลเด่นอยู่ จึงมีฟีโนไทป์เดียวกัน"
      - text: "ดอกสีม่วง $80 \\times \\frac34 = 60$ ต้น ดอกสีขาว $80 \\times \\frac14 = 20$ ต้น"
    answer: "ดอกสีม่วงประมาณ 60 ต้น ดอกสีขาวประมาณ 20 ต้น (ผลจริงอาจคลาดเคลื่อนเล็กน้อย)"
  - { type: check, problem: biology.genetics.genes-heredity.p009, prompt: "ต้น pp สร้างเซลล์สืบพันธุ์ได้กี่แบบ" }
  - type: worked-example
    title: หาจีโนไทป์ของพ่อแม่จากลูก
    problem: "ผสมถั่วลันเตาดอกสีม่วงสองต้น ได้ลูกดอกสีม่วง 62 ต้น และดอกสีขาว 19 ต้น ต้นพ่อแม่มีจีโนไทป์อะไร"
    steps:
      - text: "มีลูกดอกสีขาว (pp) แปลว่าพ่อและแม่ต้องให้แอลลีล p ได้ทั้งคู่"
        why: "ลูก pp ได้ p จากพ่อหนึ่งแอลลีลและจากแม่หนึ่งแอลลีล"
      - text: "พ่อแม่ดอกสีม่วงที่มี p ต้องเป็น Pp ทั้งคู่"
      - text: "ตรวจด้วยอัตราส่วน $62 : 19 \\approx 3.3 : 1$ ใกล้ 3 : 1 ของ Pp × Pp"
    answer: "Pp × Pp"
  - type: figure
    title: ผลของไมโทซิสและไมโอซิส
    src: mitosis-meiosis.svg
    alt: "เซลล์ตั้งต้นมีโครโมโซม 2 คู่ (2n = 4) คือแท่งยาวและแท่งสั้น สีน้ำเงินจากพ่อ สีแดงจากแม่ ลูกศรบนไปที่ไมโทซิส ได้ 2 เซลล์ที่มีโครโมโซม 4 แท่งเหมือนเซลล์ตั้งต้นทุกประการ ลูกศรล่างไปที่ไมโอซิส ได้ 4 เซลล์ แต่ละเซลล์มีโครโมโซม 2 แท่ง (n = 2) คือแท่งยาวหนึ่งแท่งและแท่งสั้นหนึ่งแท่ง ตัวอย่างไมโอซิสหนึ่งครั้งได้น้ำเงินยาวกับน้ำเงินสั้น 2 เซลล์ และแดงยาวกับแดงสั้น 2 เซลล์ ส่วนเซลล์ตั้งต้นอื่นอาจได้น้ำเงินยาวกับแดงสั้น และแดงยาวกับน้ำเงินสั้น รวมเป็นไปได้ 4 แบบ"
    caption: "ไมโทซิสได้เซลล์เหมือนเดิม ไมโอซิสลดจำนวนโครโมโซมลงครึ่งหนึ่งและได้ชุดผสมใหม่ (วาดโดยทีมคลังรู้)"
  - { type: check, problem: biology.genetics.genes-heredity.p011, prompt: "นึกถึงตารางเปรียบเทียบในบทเรียน" }
glossary:
  - { term: โครโมโซม, definition: "ดีเอ็นเอสายยาวที่พันรอบโปรตีน อยู่ในนิวเคลียส เซลล์ร่างกายของคนมี 46 แท่ง" }
  - { term: ดีเอ็นเอ, definition: "สารพันธุกรรม เป็นสายคู่บิดเป็นเกลียว มีเบส A T C G โดย A คู่กับ T และ C คู่กับ G" }
  - { term: ยีน, definition: "ช่วงหนึ่งของดีเอ็นเอที่ควบคุมลักษณะหนึ่ง" }
  - { term: แอลลีล, definition: "รูปแบบต่าง ๆ ของยีนเดียวกัน เช่น P และ p" }
  - { term: ฮอมอไซกัส, definition: "จีโนไทป์ที่แอลลีลทั้งคู่เหมือนกัน เช่น PP หรือ pp" }
  - { term: เฮเทอโรไซกัส, definition: "จีโนไทป์ที่แอลลีลทั้งคู่ต่างกัน เช่น Pp" }
  - { term: ตารางพันเนตต์, definition: "ตารางที่ใช้หาจีโนไทป์ของลูกจากการรวมกันของเซลล์สืบพันธุ์ของพ่อแม่" }
  - { term: ความแปรผันทางพันธุกรรม, definition: "ความแตกต่างของยีนระหว่างสิ่งมีชีวิตชนิดเดียวกัน เกิดจากการสืบพันธุ์แบบอาศัยเพศ" }
flashcards:
  - { front: "ความสัมพันธ์ของยีน ดีเอ็นเอ โครโมโซม", back: "ยีนเป็นช่วงหนึ่งของดีเอ็นเอ ดีเอ็นเอพันรอบโปรตีนเป็นโครโมโซม" }
  - { front: "Pp × Pp ได้อัตราส่วนเท่าใด", back: "จีโนไทป์ 1 : 2 : 1 ฟีโนไทป์ 3 : 1" }
  - { front: "Pp × pp ได้อัตราส่วนเท่าใด", back: "จีโนไทป์ Pp : pp = 1 : 1 ฟีโนไทป์ 1 : 1" }
  - { front: "ไมโทซิสกับไมโอซิส", back: "ไมโทซิส 2 เซลล์ โครโมโซมเท่าเดิม ไมโอซิส 4 เซลล์ โครโมโซมครึ่งหนึ่ง" }
  - { front: "ใครถ่ายภาพรังสีเอกซ์ที่ช่วยไขโครงสร้างดีเอ็นเอ", back: "โรซาลินด์ แฟรงคลิน (ห้องปฏิบัติการเดียวกับมอริซ วิลคินส์)" }
