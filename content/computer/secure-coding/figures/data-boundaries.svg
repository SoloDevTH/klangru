<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" font-family="sans-serif">
  <title>ข้อมูลจากผู้ใช้ผ่านการตรวจที่ขอบระบบ ก่อนถูกส่งเข้าฐานข้อมูลด้วยพารามิเตอร์ และก่อนแสดงผลในหน้าเว็บด้วยการหลีกอักขระ</title>
  <rect x="0" y="0" width="680" height="250" fill="#ffffff"/>
  <line x1="250" y1="20" x2="250" y2="230" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="250" y="16" font-size="13" text-anchor="middle" fill="#b91c1c">ขอบระบบ (จุดรับข้อมูลเข้า)</text>
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
  <rect x="20" y="90" width="150" height="60" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="95.0" y="114" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">ผู้ใช้</text>
  <text x="95.0" y="132" font-size="12" text-anchor="middle" fill="#374151">กรอกข้อความ</text>
  <rect x="270" y="40" width="170" height="60" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="355.0" y="64" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">ตรวจข้อมูลเข้า</text>
  <text x="355.0" y="82" font-size="12" text-anchor="middle" fill="#374151">รายการที่อนุญาต</text>
  <rect x="270" y="150" width="170" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="355.0" y="174" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">ตรรกะธุรกิจ</text>
  <text x="355.0" y="192" font-size="12" text-anchor="middle" fill="#374151">ทำงานกับข้อมูลที่ผ่านแล้ว</text>
  <rect x="490" y="40" width="170" height="60" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="575.0" y="64" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">ฐานข้อมูล</text>
  <text x="575.0" y="82" font-size="12" text-anchor="middle" fill="#374151">ส่งเป็นพารามิเตอร์</text>
  <rect x="490" y="150" width="170" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="575.0" y="174" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">หน้าเว็บ</text>
  <text x="575.0" y="192" font-size="12" text-anchor="middle" fill="#374151">หลีกอักขระก่อนแสดง</text>
  <line x1="170" y1="120" x2="270" y2="80" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="355" y1="100" x2="355" y2="150" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="440" y1="165" x2="490" y2="90" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="440" y1="190" x2="490" y2="190" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
