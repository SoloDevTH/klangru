  topics:
  - english.reading.research-skills
  difficulty: 3
  type: mcq
  stem: ค้นด้วยคำว่า **"coral bleaching"** (มีอัญประกาศ) ต่างจากไม่มีอัญประกาศอย่างไร
  choices:
