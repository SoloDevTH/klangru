      - { id: b, text: "เปิดฝาดูข้าวทุก 5 นาทีระหว่างหุง", feedback: "คู่มือเขียนว่า Do not open the lid while the rice is cooking." }
      - { id: c, text: "กด Cook ก่อนแล้วจึงเสียบปลั๊ก", feedback: "ขั้นแรกคือ Plug in (เสียบปลั๊ก)" }
      - { id: d, text: "เปิดฝาตอนไฟเป็นสีแดง", feedback: "คู่มือบอกว่าข้าวพร้อมเมื่อไฟเปลี่ยนเป็นสีเขียว" }
    hints:
