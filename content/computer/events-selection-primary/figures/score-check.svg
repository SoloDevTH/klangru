<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330" font-family="sans-serif" font-size="14">
<title>ผังงานการตัดสินใจ: ถ้าคะแนนมากกว่าหรือเท่ากับ 10 ให้แสดงข้อความชนะและหยุดเกม ถ้าไม่ใช่ให้เล่นต่อ</title>
<rect x="0" y="0" width="460" height="330" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="170" y="20" width="120" height="40" rx="20" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/><text x="230" y="45" text-anchor="middle" fill="#1f2937">เริ่มรอบใหม่</text>
<line x1="230" y1="60" x2="230" y2="88" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<polygon points="230,110 340,150 230,190 120,150" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/>
<text x="230" y="146" text-anchor="middle" fill="#1f2937">คะแนน ≥ 10 ?</text>
<text x="230" y="164" text-anchor="middle" fill="#1f2937" font-size="12">(มากกว่าหรือเท่ากับ)</text>
<line x1="340" y1="150" x2="390" y2="150" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<text x="360" y="142" text-anchor="middle" fill="#166534" font-weight="bold">ใช่</text>
<rect x="392" y="120" width="60" height="60" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="422" y="146" text-anchor="middle" fill="#1f2937" font-size="12">แสดง</text><text x="422" y="164" text-anchor="middle" fill="#1f2937" font-size="12">ชนะ</text>
<line x1="230" y1="190" x2="230" y2="238" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<text x="246" y="216" fill="#991b1b" font-weight="bold">ไม่ใช่</text>
<rect x="170" y="240" width="120" height="40" rx="6" fill="#e0f2fe" stroke="#075985" stroke-width="2"/><text x="230" y="265" text-anchor="middle" fill="#1f2937">เล่นต่อ</text>
</svg>