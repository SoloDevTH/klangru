<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="sans-serif">
<title>ตารางระดับภาษาในอีเมลสามระดับ</title>
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<text x="380" y="36" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">ระดับภาษาในอีเมล</text>
<rect x="150.0" y="56" width="196.66666666666666" height="44" rx="0" fill="#1d3f75" stroke="#ffffff" stroke-width="1"/>
<text x="248.33333333333331" y="84" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">ทางการ (formal)</text>
<rect x="346.66666666666663" y="56" width="196.66666666666666" height="44" rx="0" fill="#2e6b4f" stroke="#ffffff" stroke-width="1"/>
<text x="444.99999999999994" y="84" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">กึ่งทางการ (semi-formal)</text>
<rect x="543.3333333333333" y="56" width="196.66666666666666" height="44" rx="0" fill="#9a4d00" stroke="#ffffff" stroke-width="1"/>
<text x="641.6666666666666" y="84" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">ไม่เป็นทางการ (informal)</text>
<rect x="20" y="100" width="130" height="96" rx="0" fill="#eef2f7" stroke="#9aa5b5" stroke-width="1"/>
<text x="85.0" y="154.0" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">คำขึ้นต้น</text>
<rect x="150.0" y="100" width="196.66666666666666" height="96" rx="0" fill="#ffffff" stroke="#9aa5b5" stroke-width="1"/>
<text x="248.33333333333331" y="153.0" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">Dear Professor Chen,</text>
<rect x="346.66666666666663" y="100" width="196.66666666666666" height="96" rx="0" fill="#ffffff" stroke="#9aa5b5" stroke-width="1"/>
<text x="444.99999999999994" y="153.0" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">Hello Mr Lee,</text>
<rect x="543.3333333333333" y="100" width="196.66666666666666" height="96" rx="0" fill="#ffffff" stroke="#9aa5b5" stroke-width="1"/>
<text x="641.6666666666666" y="153.0" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">Hi Anna,</text>
<rect x="20" y="196" width="130" height="96" rx="0" fill="#eef2f7" stroke="#9aa5b5" stroke-width="1"/>
<text x="85.0" y="250.0" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">คำขอ</text>
<rect x="150.0" y="196" width="196.66666666666666" height="96" rx="0" fill="#ffffff" stroke="#9aa5b5" stroke-width="1"/>
<text x="248.33333333333331" y="239.0" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">Would it be possible</text>
<text x="248.33333333333331" y="259.0" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">to send me the form?</text>
<rect x="346.66666666666663" y="196" width="196.66666666666666" height="96" rx="0" fill="#ffffff" stroke="#9aa5b5" stroke-width="1"/>
<text x="444.99999999999994" y="239.0" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">Could you send me</text>
<text x="444.99999999999994" y="259.0" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">the form, please?</text>
<rect x="543.3333333333333" y="196" width="196.66666666666666" height="96" rx="0" fill="#ffffff" stroke="#9aa5b5" stroke-width="1"/>
<text x="641.6666666666666" y="239.0" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">Can you send me</text>
<text x="641.6666666666666" y="259.0" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">the form? Thanks!</text>
<rect x="20" y="292" width="130" height="96" rx="0" fill="#eef2f7" stroke="#9aa5b5" stroke-width="1"/>
<text x="85.0" y="346.0" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">คำลงท้าย</text>
<rect x="150.0" y="292" width="196.66666666666666" height="96" rx="0" fill="#ffffff" stroke="#9aa5b5" stroke-width="1"/>
<text x="248.33333333333331" y="345.0" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">Yours sincerely,</text>
<rect x="346.66666666666663" y="292" width="196.66666666666666" height="96" rx="0" fill="#ffffff" stroke="#9aa5b5" stroke-width="1"/>
<text x="444.99999999999994" y="345.0" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">Best regards,</text>
<rect x="543.3333333333333" y="292" width="196.66666666666666" height="96" rx="0" fill="#ffffff" stroke="#9aa5b5" stroke-width="1"/>
<text x="641.6666666666666" y="345.0" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">Cheers,</text>
<text x="20" y="418" font-size="13" fill="#444" text-anchor="start" font-weight="normal">ตัวอย่างเดียวกันของคำขอ แต่เลือกคำตามผู้รับ</text>
</svg>
