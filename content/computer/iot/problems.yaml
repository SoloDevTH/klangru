  - id: computer.systems.iot.p016
    topics: [computer.systems.iot]
    difficulty: 4
    type: code
    stem: |
      เขียนฟังก์ชัน `subscribers_for(subs, topic)` จำลองการจับคู่หัวข้อของตัวกลาง MQTT อย่างง่าย

      `subs` เป็นดิกชันนารีที่แมปรูปแบบหัวข้อ เช่น `"home/+/temp"` กับลิสต์ชื่อผู้รับ และ `topic` คือหัวข้อของข้อความที่เข้ามา ให้คืนลิสต์ชื่อผู้รับทั้งหมดที่ตรง โดย `+` แทนหนึ่งชั้นของหัวข้อ เรียงตามลำดับตัวอักษรและไม่ซ้ำกัน
    starter: |
      def subscribers_for(subs, topic):
          return []
    tests: |
      subs = {"home/+/temp": ["แอปมือถือ"], "home/room1/temp": ["จอแสดงผล"], "home/room2/light": ["ระบบไฟ"]}
      assert subscribers_for(subs, "home/room1/temp") == ["จอแสดงผล", "แอปมือถือ"], f"home/room1/temp ควรได้ 2 ผู้รับ แต่ได้ {subscribers_for(subs, 'home/room1/temp')}"
      assert subscribers_for(subs, "home/room2/light") == ["ระบบไฟ"], f"home/room2/light ควรได้ ระบบไฟ แต่ได้ {subscribers_for(subs, 'home/room2/light')}"
      assert subscribers_for(subs, "home/room3/temp") == ["แอปมือถือ"], f"+ ต้องแทนชั้นใดก็ได้ แต่ได้ {subscribers_for(subs, 'home/room3/temp')}"
      assert subscribers_for(subs, "home/room1/humidity") == [], f"ไม่มีรูปแบบที่ตรง ต้องได้ลิสต์ว่าง แต่ได้ {subscribers_for(subs, 'home/room1/humidity')}"
      assert subscribers_for(subs, "home/room1") == [], f"จำนวนชั้นต้องเท่ากัน ต้องได้ลิสต์ว่าง แต่ได้ {subscribers_for(subs, 'home/room1')}"
      assert subscribers_for({"a/+": ["X"], "a/b": ["X"]}, "a/b") == ["X"], "ผู้รับซ้ำต้องแสดงครั้งเดียว"
    reference: |
      def subscribers_for(subs, topic):
          levels = topic.split("/")
          found = set()
          for pattern, names in subs.items():
              p = pattern.split("/")
              if len(p) != len(levels):
                  continue
              if all(pl == "+" or pl == tl for pl, tl in zip(p, levels)):
                  found.update(names)
          return sorted(found)
    hints:
      - "แยกทั้งรูปแบบและหัวข้อด้วย split('/') แล้วเทียบทีละชั้น"
      - "ชั้นที่เป็น + ตรงกับชั้นใดก็ได้ ส่วนชั้นอื่นต้องเท่ากันทุกตัวอักษร และจำนวนชั้นต้องเท่ากัน"
      - "ใช้ set เก็บชื่อผู้รับที่ตรง แล้วคืนค่า sorted ของ set"
    solution: "แยกรูปแบบและหัวข้อเป็นชั้นด้วย split เทียบจำนวนชั้นก่อน แล้วเทียบแต่ละชั้นโดยให้ + ตรงกับทุกค่า รวบรวมชื่อผู้รับในเซตเพื่อตัดซ้ำ แล้วคืนลิสต์ที่เรียงแล้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

