<text x="590.0" y="182.0" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="normal">不想 (ไม่อยาก) / 不用 (ไม่ต้อง)</text>
<line x1="234.0" y1="175.0" x2="286.0" y2="175.0" stroke="#1f4e9c" stroke-width="2" stroke-linecap="round" marker-end="url(#a1f4e9c)"/>
<line x1="434.0" y1="175.0" x2="466.0" y2="175.0" stroke="#1f4e9c" stroke-width="2" stroke-linecap="round" marker-end="url(#a1f4e9c)"/>
<rect x="30.0" y="214.0" width="200.0" height="54.0" rx="8" fill="#dcefd6" stroke="#2a6a2a" stroke-width="2"/>
<text x="130.0" y="247.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">…เป็น (ทักษะที่ฝึกมา)</text>
<rect x="290.0" y="214.0" width="140.0" height="54.0" rx="8" fill="#dcefd6" stroke="#2a6a2a" stroke-width="2"/>
