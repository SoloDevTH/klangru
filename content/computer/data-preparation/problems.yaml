problems:
  - id: computer.data.data-preparation.p001
    topics: [computer.data.data-preparation]
    difficulty: 1
    type: mcq
    stem: "ประโยคใดเป็น **เมทาดาทา** ของคอลัมน์ `temp_c` ที่มีค่า 27.5"
    choices:
      - { id: a, text: "27.5", feedback: "นี่คือค่าที่เก็บ ไม่ใช่ข้อมูลเกี่ยวกับค่านั้น" }
      - { id: b, text: "หน่วยคือองศาเซลเซียส และเก็บเป็นตัวเลขทศนิยม 1 ตำแหน่ง", correct: true }
      - { id: c, text: "วันนี้อากาศร้อนที่สุดในปีนี้", feedback: "เป็นข้อสรุปจากข้อมูล ไม่ใช่คำอธิบายโครงสร้างของข้อมูล" }
      - { id: d, text: "แถวที่ 12 ของไฟล์มีค่าสูงกว่าแถวอื่น", feedback: "เป็นเรื่องค่าผิดปกติที่ต้องตรวจ ไม่ใช่เมทาดาทา" }
    hints:
      - "เมทาดาทาคือข้อมูลที่บอกว่าข้อมูลนั้นคืออะไร"
      - "ลองหาตัวเลือกที่บอกหน่วยหรือชนิดของคอลัมน์"
      - "ตัวเลือกที่บอกทั้งหน่วยและจำนวนตำแหน่งทศนิยมคือคำตอบ"
    solution: "เมทาดาทาคือข้อมูลเกี่ยวกับข้อมูล เช่น หน่วยและชนิดของค่า ตัวเลข 27.5 เป็นค่าที่เก็บ ส่วนข้อความว่าหน่วยคือองศาเซลเซียสเป็นเมทาดาทา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-preparation.p002
    topics: [computer.data.data-preparation]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนการทำความสะอาดแบบฟอร์มสำรวจของชมรม จากขั้นแรกไปขั้นสุดท้าย"
    items:
      - "ตรวจเมทาดาทาและพจนานุกรมข้อมูลก่อนแตะไฟล์"
      - "ตรวจชนิดและช่วงค่าของแต่ละคอลัมน์"
      - "แก้ค่าที่ผิดรูปแบบ เช่น ช่องว่างเกิน หรือปี พ.ศ. ที่ปนกับปี ค.ศ."
      - "ตัดแถวซ้ำและจัดการค่าที่หายไป"
      - "บันทึกขั้นตอนทั้งหมดไว้ให้ทำซ้ำได้"
    hints:
      - "ต้องรู้ก่อนว่าแต่ละคอลัมน์ควรมีค่าแบบไหน"
      - "ค่าที่ปนรูปแบบต้องแก้ก่อนจะเปรียบเทียบเพื่อหาแถวซ้ำ"
      - "ขั้นสุดท้ายคือการบันทึกเพื่อให้คนอื่นตรวจได้"
    solution: "เริ่มจากอ่านเมทาดาทาเพื่อรู้ว่าควรเป็นอะไร แล้วตรวจชนิดและช่วง แก้ค่าที่รูปแบบผิดก่อน จึงตัดแถวซ้ำและจัดการค่าที่หายไป สุดท้ายบันทึกทุกขั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-preparation.p003
    topics: [computer.data.data-preparation]
    difficulty: 1
    type: numeric
    stem: "ร้านขนมสมมติชั่งแป้งได้ 2.35 กิโลกรัม สาขาทั้งหมดต้องบันทึกเป็นกรัมให้หน่วยเดียวกัน จะได้กี่กรัม"
    answer: { value: 2350, tolerance: 0, unit: "กรัม" }
    misconceptions:
      - { match: 235, feedback: "1 กิโลกรัมเท่ากับ 1,000 กรัม ไม่ใช่ 100 กรัม" }
    hints:
      - "1 กิโลกรัมมีกี่กรัม"
      - "ถ้าจะเปลี่ยนหน่วยจากกิโลกรัมเป็นกรัม ต้องคูณหรือหารด้วยอะไร"
      - "คูณจำนวนกิโลกรัมด้วย 1,000"
    solution: "1 กิโลกรัม = 1,000 กรัม จึงได้ 2.35 × 1,000 = 2,350 กรัม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-preparation.p004
    topics: [computer.data.data-preparation]
    difficulty: 2
    type: mcq
    stem: "สหกรณ์โรงเรียนบันทึกชื่อร้านที่ขายหนังสือเป็น 'Book Bee', 'book bee ' (มีช่องว่างท้าย) และ 'BOOK BEE' ก่อนนับจำนวนร้าน ควรทำอย่างไร"
    choices:
      - { id: a, text: "นับเป็นสามร้านเพราะตัวอักษรต่างกัน", feedback: "ตัวพิมพ์และช่องว่างเป็นเรื่องรูปแบบ ไม่ใช่ความต่างของร้าน" }
      - { id: b, text: "ตัดช่องว่างและแปลงตัวพิมพ์ให้เหมือนกันก่อน แล้วจึงนับ", correct: true }
      - { id: c, text: "ลบแถวที่มีคำว่า book ทิ้งทั้งหมด", feedback: "ทำให้ข้อมูลจริงหายไป และอาจลบร้านอื่นที่ชื่อคล้ายกันด้วย" }
      - { id: d, text: "นับเฉพาะชื่อที่พิมพ์ครั้งแรกโดยไม่ดูว่าเป็นร้านเดียวกันหรือไม่", feedback: "วิธีนี้ยังไม่ได้แก้รูปแบบที่ไม่ตรงกัน" }
    hints:
      - "ดูว่าความต่างระหว่างสามชื่อนี้คืออะไร"
      - "การนับร้านควรดูว่าเป็นร้านเดียวกันหรือไม่ ไม่ใช่รูปแบบการพิมพ์"
      - "ทำให้รูปแบบเหมือนกันก่อน แล้วจึงนับ"
    solution: "ทั้งสามชื่อคือร้านเดียวกัน ต่างกันแค่ตัวพิมพ์และช่องว่าง จึงต้องตัดช่องว่างและแปลงตัวพิมพ์ให้เหมือนกันก่อนนับ การลบข้อมูลทิ้งจะทำให้ข้อมูลจริงหาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-preparation.p005
    topics: [computer.data.data-preparation]
    difficulty: 2
    type: numeric
    stem: "นักเรียน 8 คนกรอกอายุในแบบฟอร์มของโรงเรียนสมมติ มี 2 คนเว้นช่องว่างไว้ อายุที่กรอกคือ 15, 16, 14, 15, 16 และ 15 ปี หาค่าเฉลี่ยอายุของคนที่กรอก ตอบเป็นทศนิยม 2 ตำแหน่ง"
    answer: { value: 15.17, tolerance: 0.01, unit: "ปี" }
    misconceptions:
      - { match: 11.375, feedback: "นับคนที่เว้นว่างเป็นศูนย์แล้วหารด้วย 8 ทำให้ค่าต่ำไป ควรหารด้วยจำนวนคนที่กรอกจริง" }
    hints:
      - "ค่าว่างไม่ควรนับเป็นศูนย์"
      - "หาผลรวมของอายุที่กรอกจริง และนับจำนวนคนที่กรอกจริง"
      - "หารผลรวมด้วยจำนวนคนที่กรอกจริง"
    solution: "อายุที่กรอกมี 6 คน ผลรวม 15 + 16 + 14 + 15 + 16 + 15 = 91 ค่าเฉลี่ย 91 ÷ 6 ≈ 15.17 ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-preparation.p006
    topics: [computer.data.data-preparation]
    difficulty: 2
    type: text
    stem: "ตารางนักเรียนกับตารางคะแนนมีคอลัมน์ `student_id` ที่ใช้จับคู่แถวของสองตารางเข้าด้วยกันได้ คอลัมน์แบบนี้ในวิทยาการข้อมูลเรียกว่าอะไร (ตอบเป็นภาษาไทยหรืออังกฤษก็ได้)"
    accepted: ["คีย์ร่วม", "คอลัมน์ร่วม", "รหัสร่วม", "join key", "คีย์ร่วม (join key)"]
    hints:
      - "ดูว่าคอลัมน์นี้ทำหน้าที่อะไรระหว่างตารางสองตาราง"
      - "คอลัมน์นี้มีค่าเดียวกันทั้งในตารางนักเรียนและตารางคะแนน"
      - "ภาษาอังกฤษของคำตอบมักปรากฏในคำว่า inner join"
    solution: "คอลัมน์ที่มีค่าเดียวกันในสองตารางและใช้จับคู่แถวเรียกว่าคีย์ร่วม (join key)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-preparation.p007
    topics: [computer.data.data-preparation]
    difficulty: 2
    type: match
    stem: "จับคู่ปัญหาที่พบในข้อมูลกับวิธีแก้ที่เหมาะสม"
    pairs:
      - { left: "วันที่บางแถวเป็น 25/12/2567 บางแถวเป็น 2024-12-25", right: "เลือกรูปแบบวันที่เดียวแล้วแปลงทุกแถวให้เป็นแบบนั้น" }
      - { left: "ชื่อ 'สมชาย ' มีช่องว่างท้าย ทำให้นับเป็นคนละคนกับ 'สมชาย'", right: "ตัดช่องว่างหน้าและหลังก่อนเปรียบเทียบ" }
      - { left: "คะแนนว่างเพราะนักเรียนลาไม่ได้เข้าสอบ", right: "บันทึกเป็นกลุ่มไม่ได้สอบ แทนการใส่ศูนย์" }
      - { left: "รหัส 101 ปรากฏสองแถวเพราะกดส่งแบบฟอร์มสองครั้ง", right: "ตัดแถวซ้ำโดยดูจากรหัสและเวลาส่ง" }
    hints:
      - "ดูว่าแต่ละปัญหาเกิดจากรูปแบบ ค่าหายไป หรือการส่งซ้ำ"
      - "การใส่ศูนย์ให้ค่าที่ไม่มีอยู่คือการสร้างข้อมูลเท็จ"
      - "จับคู่ทีละข้อ แล้วตรวจว่าวิธีแก้ตรงกับสาเหตุหรือเพียงซ่อนอาการ"
    solution: "วันที่ปนรูปแบบต้องเลือกรูปเดียวแล้วแปลง ช่องว่างเกินต้องตัดก่อนเทียบ คะแนนที่ไม่ได้สอบไม่ใช่ศูนย์จึงแยกกลุ่ม และแถวที่ซ้ำเพราะส่งสองครั้งต้องตัดตามรหัสและเวลาส่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-preparation.p008
    topics: [computer.data.data-preparation]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ก่อนนำคะแนนเฉลี่ยของชั้นไปแสดงในรายงาน ข้อใดควรตรวจ (เลือกทุกข้อที่ควรตรวจ)"
    choices:
      - { id: a, text: "ค่าทุกค่าเป็นตัวเลขและอยู่ในช่วงที่เป็นไปได้", correct: true }
      - { id: b, text: "มีรหัสนักเรียนซ้ำที่ทำให้คนหนึ่งถูกนับสองครั้งหรือไม่", correct: true }
      - { id: c, text: "สีของตัวอักษรในแบบฟอร์มเป็นสีอะไร", feedback: "ไม่เกี่ยวกับความถูกต้องของค่าที่นำมาคำนวณ" }
      - { id: d, text: "ค่าว่างถูกนับเป็นศูนย์โดยไม่ได้ตั้งใจหรือไม่", correct: true }
      - { id: e, text: "ชื่อไฟล์เป็นภาษาไทยหรือไม่", feedback: "ชื่อไฟล์ไม่กระทบค่าเฉลี่ย" }
    hints:
      - "ค่าเฉลี่ยจะผิดได้เมื่อค่าที่รวมเข้าไปผิด"
      - "ลองนึกถึงค่าที่ผิดช่วง คนที่ถูกนับซ้ำ และค่าว่างที่กลายเป็นศูนย์"
      - "เลือกข้อที่เกี่ยวกับค่าที่นำมารวม ไม่ใช่รูปลักษณ์ของแบบฟอร์มหรือชื่อไฟล์"
    solution: "ค่าที่ไม่ใช่ตัวเลข ค่าที่เกินช่วง คนที่ซ้ำ และค่าว่างที่ถูกนับเป็นศูนย์ ล้วนทำให้ค่าเฉลี่ยคลาดเคลื่อน ส่วนสีตัวอักษรและชื่อไฟล์ไม่เกี่ยวกับค่าที่คำนวณ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-preparation.p009
    topics: [computer.data.data-preparation]
    difficulty: 3
    type: numeric
    stem: "ทะเบียนของโรงเรียนสมมติบันทึกวันที่สมัครเป็น พ.ศ. 2567 แต่ระบบรายงานอีกระบบใช้ ค.ศ. ปีที่สมัครจะตรงกับปี ค.ศ. ใด ตอบเป็นเลขปี 4 หลัก"
    answer: { value: 2024, tolerance: 0 }
    misconceptions:
      - { match: 3110, feedback: "ปี ค.ศ. = ปี พ.ศ. ลบ 543 ไม่ใช่บวก" }
    hints:
      - "ปี พ.ศ. มากกว่าปี ค.ศ. อยู่เท่าไร"
      - "ค.ศ. = พ.ศ. − 543"
      - "นำ 2567 ลบด้วย 543"
    solution: "ค.ศ. = พ.ศ. − 543 จึงได้ 2567 − 543 = 2024"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-preparation.p010
    topics: [computer.data.data-preparation]
    difficulty: 3
    type: numeric
    stem: "ชุดข้อมูลมี 32 แถว พบว่า 4 แถวมีค่าว่างในคอลัมน์คะแนน คิดเป็นร้อยละเท่าใดของทั้งหมด"
    answer: { value: 12.5, tolerance: 0.05, unit: "%" }
    misconceptions:
      - { match: 14.29, feedback: "หารด้วยจำนวนแถวที่มีค่าอยู่แล้ว (28) แทนจำนวนแถวทั้งหมด (32)" }
    hints:
      - "ร้อยละคือส่วนที่ต้องการเทียบกับทั้งหมด แล้วคูณด้วย 100"
      - "ตัวหารควรเป็นจำนวนแถวทั้งหมด ไม่ใช่จำนวนแถวที่มีค่า"
      - "นำ 4 หารด้วย 32 แล้วคูณด้วย 100"
    solution: "4 ÷ 32 × 100 = 12.5 เปอร์เซ็นต์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-preparation.p011
    topics: [computer.data.data-preparation]
    difficulty: 3
    type: mcq
    stem: "ชมรมตัดแถวที่มีค่าว่างทิ้งทั้งหมดก่อนวิเคราะห์ ข้อใดเป็นผลเสียที่มีโอกาสเกิดมากที่สุด"
    choices:
      - { id: a, text: "ทำให้จำนวนแถวมากขึ้นกว่าเดิม", feedback: "การตัดแถวทำให้จำนวนแถวลดลง ไม่ได้เพิ่ม" }
      - { id: b, text: "ค่าเฉลี่ยของทุกคอลัมน์จะเป็นศูนย์เสมอ", feedback: "ไม่จริง ค่าเฉลี่ยขึ้นกับค่าที่เหลืออยู่" }
      - { id: c, text: "ผลสรุปอาจเอนไปทางคนที่กรอกครบ เพราะคนที่ไม่กรอกอาจมีลักษณะต่างออกไป", correct: true }
      - { id: d, text: "ไฟล์ต้นฉบับจะถูกแก้ไขโดยอัตโนมัติ", feedback: "การตัดแถวในการวิเคราะห์ไม่ได้แก้ไฟล์ต้นฉบับ แต่ควรเก็บสำเนาไว้" }
    hints:
      - "ถามตัวเองว่าคนที่ไม่กรอกต่างจากคนที่กรอกหรือไม่"
      - "ผลเสียที่สำคัญของการตัดข้อมูลคือความเอนของกลุ่มตัวอย่าง"
      - "เลือกข้อที่บอกว่าใครถูกตัดออกไปและผลกระทบต่อข้อสรุป"
    solution: "ถ้าคนที่ไม่กรอกมีลักษณะต่างจากคนที่กรอก เช่น อ่านหนังสือน้อยกว่า การตัดแถวจะทำให้ผลสรุปเอนไป ตัวเลือกอื่นไม่ถูกต้อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-preparation.p012
    topics: [computer.data.data-preparation]
    difficulty: 3
    type: numeric
    stem: "ชมรมสมมติเก็บเวลาอ่านนอกเวลาเรียนต่อสัปดาห์ของสี่คนเป็นชั่วโมงได้ 2.5, 1.75, 3 และ 0.5 ชั่วโมง เมื่อรวมทั้งสี่คนและแปลงเป็นนาทีจะได้กี่นาที"
    answer: { value: 465, tolerance: 0, unit: "นาที" }
    misconceptions:
      - { match: 7.75, feedback: "รวมเป็น 7.75 ชั่วโมงได้ถูก แต่ยังไม่ได้แปลงเป็นนาที (1 ชั่วโมง = 60 นาที)" }
