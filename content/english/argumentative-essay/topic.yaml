id: english.writing.argumentative-essay
subject: english
title: { th: "การเขียนเรียงความแสดงเหตุผลจากหลายแหล่ง (ระดับ B2)", en: "Writing argumentative essays from multiple sources (B2)" }
summary: เรียนโครงสร้างเรียงความแสดงเหตุผล ได้แก่ thesis ย่อหน้าแบบ PEEL การตอบข้อโต้แย้ง การถอดความและอ้างแหล่ง การประเมินหลักฐาน และการปรับน้ำเสียงให้เหมาะกับผู้อ่าน
difficulty: 6.5
minutes: 50
prerequisites: [english.reading.argumentative-texts, english.speaking.feelings-opinions]
encompasses:
  - { id: english.reading.argumentative-texts, weight: 0.3 }
  - { id: english.speaking.feelings-opinions, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: essay-skeleton.svg
    alt: "แผนภาพโครงสร้างเรียงความแสดงเหตุผลห้ากล่องเรียงจากบนลงล่าง กล่องแรกคือบทนำ มีลำดับประโยคเปิด ภูมิหลัง และ thesis statement กล่องที่สองและสามคือย่อหน้าเนื้อเรื่อง แต่ละกล่องมีลำดับ Point Evidence Explain Link กล่องที่สี่คือข้อโต้แย้งฝ่ายตรงข้ามที่ยอมรับแล้วตอบโต้ กล่องสุดท้ายคือบทสรุปที่ย้ำ thesis มีลูกศรชี้ลงระหว่างแต่ละกล่อง"
    caption: "โครงสร้างเรียงความแสดงเหตุผลห้าส่วน"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.writing.argumentative-essay.p001, prompt: "thesis statement ที่ดีต้องมีอะไร" }
  - type: worked-example
    title: สร้างย่อหน้า PEEL จากประเด็นเดียว
    problem: "เขียนย่อหน้าหนึ่งเพื่อสนับสนุนว่าโรงอาหารของโรงเรียนควรเลิกขายเครื่องดื่มรสหวาน โดยใช้โครงสร้าง PEEL (ตัวเลขในตัวอย่างเป็นข้อมูลสมมุติ)"
    steps:
      - text: "Point: *School canteens should stop selling sugary drinks.*"
        why: "ประโยคใจความบอกประเด็นของย่อหน้า และมักอยู่ต้นย่อหน้า"
      - text: "Evidence: *In a survey of 400 students at one school, those who bought a sweet drink every day had twice as many fillings as those who rarely did.*"
        why: "หลักฐานควรเป็นตัวเลขหรือข้อมูลที่ตรวจสอบได้ และบอกขนาดกลุ่มตัวอย่าง ตัวเลขนี้เป็นข้อมูลสมมุติสำหรับฝึก"
      - text: "Explain: *This suggests that easy access to sugary drinks at school can harm students' teeth.*"
        why: "ขั้น Explain บอกว่าหลักฐานนั้นสนับสนุนจุดยืนอย่างไร ขาดขั้นนี้ผู้อ่านจะไม่เห็นความสำคัญของหลักฐาน"
      - text: "Link: *Removing these drinks from canteens would therefore support the healthy habits that students learn in class.*"
        why: "Link เชื่อมกลับไปยัง thesis หรือบอกว่าย่อหน้าถัดไปจะพูดอะไรต่อ"
    answer: "School canteens should stop selling sugary drinks. In a survey of 400 students at one school, those who bought a sweet drink every day had twice as many fillings as those who rarely did. This suggests that easy access to sugary drinks at school can harm students' teeth. Removing these drinks from canteens would therefore support the healthy habits that students learn in class."
  - type: worked-example
    title: ถอดความและสังเคราะห์จากหลายแหล่ง
    problem: "ถอดความประโยค Sugary drinks damage children's teeth. จากแหล่ง A แล้วเชื่อมกับแหล่ง B และ C ให้เห็นภาพรวม (แหล่ง A, B, C เป็นแหล่งสมมุติ)"
    steps:
      - text: "ถอดความแหล่ง A โดยเปลี่ยนคำและโครงสร้าง: *Source A states that drinks high in sugar can harm young people's teeth.*"
        why: "คงความหมายเดิมไว้ แต่ใช้คำและรูปประโยคใหม่ พร้อมระบุแหล่งที่มา"
      - text: "เพิ่มแหล่ง B ที่เห็นตรงกัน: *Source B reaches a similar conclusion, linking daily sweet drinks to weight gain in teenagers.*"
        why: "การเชื่อมแหล่งที่เห็นตรงกันทำให้ข้อโต้แย้งแข็งแรงขึ้น โดยไม่ต้องคัดลอกประโยคของแหล่งนั้น"
      - text: "เพิ่มแหล่ง C ที่ต่างกัน: *In contrast, Source C reports that a canteen ban in one district simply moved sales to shops outside the school gate.*"
        why: "In contrast บอกว่าข้อมูลนี้ต่างจากแหล่งก่อนหน้า"
      - text: "สรุปรวมเป็นภาพใหญ่: *Taken together, the sources suggest that a canteen ban may help, but only if it comes with lessons on healthy choices.*"
        why: "การสังเคราะห์ต้องบอกภาพรวมที่เกิดจากการรวมแหล่ง ไม่ใช่แค่เรียงแหล่ง"
    answer: "Source A states that drinks high in sugar can harm young people's teeth. Source B reaches a similar conclusion, linking daily sweet drinks to weight gain in teenagers. In contrast, Source C reports that a canteen ban in one district simply moved sales to shops outside the school gate. Taken together, the sources suggest that a canteen ban may help, but only if it comes with lessons on healthy choices."
  - { type: check, problem: english.writing.argumentative-essay.p007, prompt: "การถอดความที่ถูกต้องต้องทำอย่างไร" }
glossary:
  - { term: thesis statement, definition: "ประโยคที่บอกจุดยืนของเรียงความอย่างชัดเจนพร้อมเหตุผลสำคัญ มักอยู่ท้ายบทนำ" }
  - { term: topic sentence, definition: "ประโยคใจความ ประโยคที่บอกประเด็นของย่อหน้า มักอยู่ต้นย่อหน้า" }
  - { term: PEEL, definition: "โครงสร้างย่อหน้า ได้แก่ Point, Evidence, Explain และ Link" }
  - { term: paraphrase, definition: "การถอดความ เปลี่ยนคำและโครงสร้างโดยคงความหมายเดิมและอ้างแหล่งที่มา" }
  - { term: synthesis, definition: "การสังเคราะห์ เชื่อมข้อมูลจากหลายแหล่งให้เห็นภาพรวมที่ไม่ได้อยู่ในแหล่งใดแหล่งหนึ่ง" }
  - { term: plagiarism, definition: "การลอกผลงานของผู้อื่นโดยไม่ถอดความและไม่อ้างแหล่งที่มา" }
flashcards:
  - { front: "thesis statement ที่ดีต้องมีอะไร", back: "จุดยืนที่ชัดเจนและเหตุผลสำคัญ เช่น School canteens should stop selling ..., because ..." }
  - { front: "PEEL ย่อมาจากอะไร", back: "Point, Evidence, Explain, Link" }
  - { front: "คำเชื่อมที่ใช้แย้งข้อโต้แย้งฝ่ายตรงข้าม", back: "However, On the other hand, Yet" }
  - { front: "ใช้รูปเต็มแทนคำย่อในเรียงความ", back: "do not แทน don't, many แทน a lot of" }
  - { front: "การถอดความที่ดีต้องทำอย่างไร", back: "เปลี่ยนคำและโครงสร้าง คงความหมายเดิม และอ้างแหล่งที่มา" }
