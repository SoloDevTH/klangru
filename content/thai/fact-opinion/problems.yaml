- id: thai.reading.fact-opinion.p013
  topics:
  - thai.reading.fact-opinion
  difficulty: 4
  type: text
  stem: '"**เนื่องจาก**สะพานไม้ผุพัง ชาวบ้าน**จึง**ต้องพายเรือข้ามคลอง" พิมพ์ส่วนที่เป็น **เหตุ**'
  accepted:
