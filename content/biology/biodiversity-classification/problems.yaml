      - { match: 17, feedback: "นับตำแหน่งที่เหมือนได้ 17 ตำแหน่งถูกแล้ว แต่ต้องคิดเป็นร้อยละของ 20 ตำแหน่ง" }
    hints:
      - "หาจำนวนตำแหน่งที่เหมือนกันก่อน"
      - "ร้อยละ = ตำแหน่งที่เหมือน ÷ ตำแหน่งทั้งหมด × 100"
