  - id: earthscience.atmosphere.clouds-fronts-forecasting.p016
    topics: [earthscience.atmosphere.clouds-fronts-forecasting]
    difficulty: 5
    type: numeric
    stem: "อากาศรอบข้างมีอุณหภูมิ 32 °C ที่ผิวพื้น และลดลง 8 °C ต่อ 1 km อย่างสม่ำเสมอ ก้อนอากาศที่ผิวพื้นมีอุณหภูมิ 32 °C จุดน้ำค้าง 24 °C ถูกดันขึ้น (ฐานเมฆที่ $125 \\times (T - T_d)$ เมตร อัตราแอเดียแบติกแห้ง 9.8 °C/km ชื้น 6 °C/km) ก้อนอากาศต้องถูกดันขึ้นถึงความสูงกี่กิโลเมตรจึงอุ่นเท่ากับอากาศรอบข้าง และลอยต่อขึ้นไปได้เอง"
    answer: { value: 1.9, tolerance: 0.05, unit: "km" }
    misconceptions:
      - { match: 1.0, feedback: "1 km คือฐานเมฆ ตรงนั้นก้อนอากาศ (22.2 °C) ยังเย็นกว่ารอบข้าง (24 °C) จึงยังไม่ลอยเอง" }
      - { match: 0.9, feedback: "0.9 km คือระยะที่ต้องยกต่อจากฐานเมฆ ต้องบวกความสูงของฐานเมฆ 1 km ด้วย" }
    hints:
      - "ฐานเมฆ $= 125 \\times 8 = 1{,}000$ m ที่ 1 km ก้อนอากาศ 22.2 °C รอบข้าง 24 °C"
      - "เหนือฐานเมฆ ก้อนอากาศเย็นลง 6 °C/km รอบข้าง 8 °C/km ช่องว่าง 1.8 °C จะแคบลงกิโลเมตรละเท่าใด"
    solution: "ที่ฐานเมฆ 1 km ก้อนอากาศ $32 - 9.8 = 22.2$ °C รอบข้าง $32 - 8 = 24$ °C ต่างกัน 1.8 °C เหนือฐานเมฆช่องว่างแคบลง $8 - 6 = 2$ °C/km จึงต้องยกเพิ่ม $1.8/2 = 0.9$ km รวมเป็น 1.9 km จากนั้นก้อนอากาศอุ่นกว่ารอบข้างและลอยต่อเอง เกิดเมฆก้อนสูง"
