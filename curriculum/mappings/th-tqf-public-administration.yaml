# หัวข้อในคลังที่สอนกลุ่มองค์ความรู้ของ มคอ.1 สาขาวิชารัฐประศาสนศาสตร์ 2558 บางส่วน
framework: th-tqf-public-administration
mappings:
  - topic: management.quality.concepts
    indicators: ["8.1"]
    coverage: partial
    note: "กลุ่มองค์การและการจัดการระบุ 'การบริหารจัดการคุณภาพ' หัวข้อนี้สอนแนวคิดคุณภาพ PDCA TQM และ ISO 9001 พร้อมตัวอย่างหน่วยราชการ ส่วนอื่นของกลุ่ม (โครงสร้างองค์การ พฤติกรรมองค์การ งานพัสดุ ความเสี่ยง) ยังไม่มี"
  - topic: management.principles.functions
    indicators: ["8.1"]
    coverage: partial
    note: "หน้าที่การจัดการสี่ด้าน (วางแผน จัดองค์การ ชี้นำ ควบคุม) แผนผังองค์การ และรูปแบบองค์การธุรกิจ ยังไม่มีการออกแบบองค์การภาครัฐ สายการบังคับบัญชา และพฤติกรรมมนุษย์ในองค์การ"
  - topic: management.org.leadership-motivation
    indicators: [5.4(1)]
    coverage: partial
    note: ให้ความรู้เรื่องภาวะผู้นำและการเป็นสมาชิกทีมที่ดี แต่การพัฒนาตนเองและการแสดงภาวะผู้นำจริงต้องฝึกนอกแอป
  - topic: management.principles.organizing
    indicators: ["8.1"]
    coverage: partial
    note: สอนรูปแบบ โครงสร้าง สายการบังคับบัญชา และการออกแบบองค์การทั้งภาคเอกชนและส่วนราชการ ส่วนพฤติกรรมองค์การ ภาวะผู้นำ คุณภาพ ความรู้ ความเสี่ยง และพัสดุอยู่ในหัวข้ออื่น
  - topic: management.principles.planning-decision
    indicators: [5.3(2)]
    coverage: partial
    note: ฝึกวิเคราะห์สถานการณ์ด้วยตารางผลตอบแทน ต้นไม้การตัดสินใจ และคะแนนถ่วงน้ำหนัก (เช่น p013 p017) แต่ยังไม่ได้ใช้ทฤษฎีรัฐประศาสนศาสตร์วิเคราะห์ปัญหาซับซ้อน
  - topic: management.hr.human-resource-management
    indicators: ["8.3"]
    coverage: partial
    note: วางแผนอัตรากำลัง สรรหา พัฒนา ค่าตอบแทน ประเมินผลงาน สวัสดิการ กฎหมายภาครัฐ (ก.พ.) กล่าวโดยสรุปเท่านั้น และการจัดการความขัดแย้งอยู่ใน organizational-behavior
  - topic: management.org.organizational-behavior
    indicators: ["8.1"]
    coverage: partial
    note: ส่วนพฤติกรรมมนุษย์ในองค์การและการพัฒนาองค์การ กลุ่มความรู้นี้กว้างกว่าหัวข้อมาก
  - topic: management.public.public-administration
    indicators: [5.2(1)]
    coverage: full
    note: แนวคิดระบบราชการของเวเบอร์ NPM การบริการสาธารณะแนวใหม่ ธรรมาภิบาล และหลักการรวม แบ่ง กระจายอำนาจ
  - topic: management.public.public-administration
    indicators: [5.2(2), "8.4"]
    coverage: partial
    note: บอกพัฒนาการของแนวคิดตามช่วงเวลา (p018) และให้ติดตามกฎระเบียบฉบับล่าสุด แต่ไม่ได้สอนกฎหมายหรือระเบียบรายฉบับ
