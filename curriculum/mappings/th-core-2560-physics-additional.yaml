# หัวข้อในคลังที่สอนผลการเรียนรู้รายวิชาเพิ่มเติม สาระฟิสิกส์ (ฉบับปรับปรุง พ.ศ. 2560)
#
# เกณฑ์ที่ใช้
# - จับคู่เมื่อบทเรียนหรือโจทย์ของหัวข้อสอนเนื้อหาของผลการเรียนรู้นั้นจริง (อ่าน lesson.md และ problems.yaml แล้ว)
# - full = เนื้อหาและการคำนวณครบทุกส่วนของผลการเรียนรู้ ส่วนที่ให้ "ทดลอง" ในห้องปฏิบัติการแอปทำแทนไม่ได้
#   จึงไม่นำมาตัดสิน แต่ระบุไว้ใน note ส่วนผลการเรียนรู้ที่หลายหัวข้อช่วยกันสอนแต่ไม่มีหัวข้อใดครบ ให้เป็น partial ทุกแถว
# - coverage เป็นค่าเดียวต่อแถว ถ้าหัวข้อสอนบางข้อครบและบางข้อไม่ครบ และข้อที่ไม่ครบมีหัวข้ออื่นจับคู่อยู่แล้ว
#   จะใส่เฉพาะข้อที่ครบแล้วเขียนส่วนที่เหลือไว้ใน note มิฉะนั้นทั้งแถวเป็น partial และ note บอกว่าข้อใดสอนครบ
#   ตัวเลข "สอนครบ" ของรายงานจึงนับต่ำกว่าความจริงเล็กน้อย
framework: th-core-2560-physics-additional
mappings:
  # ---------- ข้อ 1 (ม.4) ----------
  - topic: physics.units.si
    indicators: ["ฟิสิกส์ 1 ม.4/2"]
    coverage: partial
    note: "หน่วยฐาน หน่วยอนุพันธ์ คำนำหน้าหน่วย และการแปลงหน่วย เป็นพื้นฐานของการรายงานผลการวัด"
  - topic: physics.units.measurement
    indicators: ["ฟิสิกส์ 1 ม.4/2"]
    coverage: partial
    note: "การอ่านเครื่องมือ เลขนัยสำคัญ ความคลาดเคลื่อนและการรายงานผล ยังไม่มีการเขียนกราฟผลการทดลอง และการวิเคราะห์ความชันกับจุดตัดแกนของกราฟเส้นตรง"
  - topic: physics.kinematics.velocity
    indicators: ["ฟิสิกส์ 1 ม.4/3"]
    coverage: partial
    note: "ตำแหน่ง การกระจัด และความเร็วเฉลี่ยในหนึ่งมิติ"
  - topic: physics.kinematics.acceleration
    indicators: ["ฟิสิกส์ 1 ม.4/3"]
    coverage: partial
    note: "นิยามความเร่งและความเร่งจากความชันของกราฟความเร็ว–เวลา"
  - topic: physics.kinematics.constant-acceleration
    indicators: ["ฟิสิกส์ 1 ม.4/3"]
    coverage: partial
    note: "สมการการเคลื่อนที่แนวตรงด้วยความเร่งคงตัวและการคำนวณ ส่วนกราฟอยู่ใน motion-graphs ไม่มีการทดลองหาค่าความเร่งโน้มถ่วง"
  - topic: physics.kinematics.motion-graphs
    indicators: ["ฟิสิกส์ 1 ม.4/3"]
    coverage: partial
    note: "ความสัมพันธ์ของตำแหน่ง ความเร็ว และความเร่งจากความชันและพื้นที่ใต้กราฟ"
  - topic: physics.kinematics.free-fall
    indicators: ["ฟิสิกส์ 1 ม.4/3"]
    coverage: partial
    note: "การตกแบบเสรีด้วยความเร่งโน้มถ่วงคงตัว ไม่มีการทดลองหาค่า g"
  - topic: physics.units.vectors
    indicators: ["ฟิสิกส์ 1 ม.4/4"]
    coverage: partial
    note: "รวมเวกเตอร์สองเวกเตอร์ที่ทำมุมกันด้วยหางต่อหัวและองค์ประกอบครบ แต่ตัวอย่างและโจทย์เป็นการกระจัดและความเร็ว ยังไม่ได้ใช้กับแรง"
  - topic: physics.dynamics.forces
    indicators: ["ฟิสิกส์ 1 ม.4/4", "ฟิสิกส์ 1 ม.4/5"]
    coverage: partial
    note: "ชนิดของแรง แผนภาพแรง และแรงลัพธ์ของแรงในแนวเดียวกันเท่านั้น"
  - topic: physics.dynamics.newton-first
    indicators: ["ฟิสิกส์ 1 ม.4/5", "ฟิสิกส์ 1 ม.4/8"]
    coverage: partial
    note: "กฎข้อที่ 1 ความเฉื่อย และสมดุลของแรง (สมดุลต่อการเลื่อนที่) ไม่มีสมดุลต่อการหมุนและแรงสามแรง"
  - topic: physics.dynamics.newton-second
    indicators: ["ฟิสิกส์ 1 ม.4/5"]
    coverage: partial
    note: "กฎข้อที่ 2 แผนภาพแรง และการคำนวณ รวมวัตถุหลายก้อน"
  - topic: physics.dynamics.newton-third
    indicators: ["ฟิสิกส์ 1 ม.4/5"]
    coverage: partial
    note: "แรงกิริยาและแรงปฏิกิริยา"
  - topic: physics.dynamics.weight-normal
    indicators: ["ฟิสิกส์ 1 ม.4/5", "ฟิสิกส์ 1 ม.4/6"]
    coverage: partial
    note: "มวลกับน้ำหนัก แรงปฏิกิริยาตั้งฉาก และลิฟต์ที่มีความเร่ง"
  - topic: physics.dynamics.inclined-plane
    indicators: ["ฟิสิกส์ 1 ม.4/5"]
    coverage: partial
    note: "ใช้กฎของนิวตันและแผนภาพแรงกับวัตถุบนพื้นเอียง"
  - topic: physics.dynamics.gravitation
    indicators: ["ฟิสิกส์ 1 ม.4/6"]
    coverage: full
    note: "กฎความโน้มถ่วงสากล g จากมวลและรัศมีดาว น้ำหนัก และ g ที่ความสูงต่าง ๆ ส่วนการโคจรของดาวเทียมใน ม.4/17 อธิบายเชิงคุณภาพในหัวข้อนี้ (ไม่มีการคำนวณอัตราเร็วโคจร)"
  - topic: physics.dynamics.friction
    indicators: ["ฟิสิกส์ 1 ม.4/7"]
    coverage: full
    note: "แรงเสียดทานสถิตและจลน์ สัมประสิทธิ์ความเสียดทาน และประโยชน์ในชีวิตประจำวัน ไม่มีส่วนทดลองหาค่าสัมประสิทธิ์"
  - topic: physics.rotation.torque
    indicators: ["ฟิสิกส์ 1 ม.4/8", "ฟิสิกส์ 1 ม.4/13"]
    coverage: partial
    note: "โมเมนต์ สมดุลการหมุน และคาน ยังไม่มีแรงคู่ควบ สมดุลของแรงสามแรง และการได้เปรียบเชิงกล"
  - topic: physics.energy.work
    indicators: ["ฟิสิกส์ 1 ม.4/10"]
    coverage: partial
    note: "งานของแรงคงตัวจากสมการ ยังไม่มีงานจากพื้นที่ใต้กราฟแรงกับตำแหน่ง"
  - topic: physics.energy.power
    indicators: ["ฟิสิกส์ 1 ม.4/10", "ฟิสิกส์ 1 ม.4/13"]
    coverage: partial
    note: "กำลังเฉลี่ยและประสิทธิภาพของเครื่องจักร ยังไม่มีเครื่องกลอย่างง่ายและการได้เปรียบเชิงกล"
  - topic: physics.energy.kinetic-potential
    indicators: ["ฟิสิกส์ 1 ม.4/11"]
    coverage: partial
    note: "พลังงานจลน์ พลังงานศักย์โน้มถ่วง พลังงานศักย์ยืดหยุ่น และทฤษฎีบทงาน–พลังงาน ยังไม่มีความสัมพันธ์ระหว่างแรงดึงสปริงกับระยะยืดและงานที่ทำให้สปริงยืด"
  - topic: physics.energy.conservation
    indicators: ["ฟิสิกส์ 1 ม.4/12"]
    coverage: full
  - topic: physics.momentum.momentum-impulse
    indicators: ["ฟิสิกส์ 1 ม.4/14"]
    coverage: full
    note: "โมเมนตัม การดล การดลจากพื้นที่ใต้กราฟแรงกับเวลา และแรงดล"
  - topic: physics.momentum.collisions
    indicators: ["ฟิสิกส์ 1 ม.4/15"]
    coverage: full
    note: "การชนแบบยืดหยุ่นและไม่ยืดหยุ่นในหนึ่งมิติ และการดีดตัวแยกจากกัน ไม่มีส่วนทดลอง"
  - topic: physics.kinematics.projectile
    indicators: ["ฟิสิกส์ 1 ม.4/16"]
    coverage: full
    note: "ไม่มีส่วนทดลอง"
  - topic: physics.kinematics.circular
    indicators: ["ฟิสิกส์ 1 ม.4/17"]
    coverage: partial
    note: "แรงสู่ศูนย์กลาง รัศมี อัตราเร็วเชิงเส้น อัตราเร็วเชิงมุม และมวลในระนาบระดับ ยังไม่ได้ใช้อธิบายการโคจรของดาวเทียม (มีเชิงคุณภาพใน gravitation)"
  # ---------- ข้อ 2 (ม.5) ----------
  - topic: physics.waves.shm
    indicators: ["ฟิสิกส์ 2 ม.5/1"]
    coverage: full
    note: "มวลติดสปริงและลูกตุ้มอย่างง่าย ไม่มีส่วนทดลอง"
  - topic: physics.waves.wave-basics
    indicators: ["ฟิสิกส์ 2 ม.5/3"]
    coverage: partial
    note: "ชนิดของคลื่น ส่วนประกอบของคลื่น และ v = fλ ส่วนหลักของฮอยเกนส์และการซ้อนทับอยู่ใน wave-behaviour"
  - topic: physics.waves.wave-behaviour
    indicators: ["ฟิสิกส์ 2 ม.5/4"]
    coverage: full
    note: "การสะท้อน การหักเห การแทรกสอด และการเลี้ยวเบนของคลื่นผิวน้ำพร้อมการคำนวณ หัวข้อนี้ยังสอนหลักของฮอยเกนส์และหลักการซ้อนทับซึ่งเป็นส่วนหนึ่งของ ม.5/3"
  - topic: physics.waves.sound
    indicators: ["ฟิสิกส์ 2 ม.5/5", "ฟิสิกส์ 2 ม.5/6"]
    coverage: partial
    note: "การเกิดเสียง คลื่นตามยาว อัตราเร็วเสียงกับอุณหภูมิ เสียงสะท้อน ระดับเสียง และเดซิเบล ยังไม่มีคลื่นการกระจัดกับคลื่นความดัน การหักเห แทรกสอด เลี้ยวเบนของเสียง คุณภาพเสียง และมลพิษทางเสียง"
  - topic: physics.light.reflection
    indicators: ["ฟิสิกส์ 2 ม.5/9"]
    coverage: partial
    note: "กฎการสะท้อน กระจกเงาราบ กระจกเว้า กระจกนูน สูตรกระจก และการใช้งาน ยังไม่ได้ฝึกเขียนแผนภาพรังสีเพื่อหาภาพ"
  - topic: physics.light.refraction
    indicators: ["ฟิสิกส์ 2 ม.5/10", "ฟิสิกส์ 2 ม.5/11"]
    coverage: partial
    note: "ดรรชนีหักเห กฎของสเนลล์ มุมวิกฤต การสะท้อนกลับหมด และสูตรเลนส์บาง ยังไม่มีความลึกจริงกับความลึกปรากฏ และการเขียนรังสีหาภาพจากเลนส์"
  # ---------- ข้อ 3 (ม.5–6) ----------
  - topic: physics.electricity.charge
    indicators: ["ฟิสิกส์ 3 ม.5/1", "ฟิสิกส์ 3 ม.5/2", "ฟิสิกส์ 3 ม.5/3", "ฟิสิกส์ 3 ม.5/6"]
    coverage: partial
    note: "ม.5/1 (การทำให้มีประจุด้วยการขัดสีและการเหนี่ยวนำ) และ ม.5/2 (กฎของคูลอมบ์) สอนครบ ม.5/3 มีสนามไฟฟ้าของจุดประจุและแรงบนประจุ แต่สนามลัพธ์คิดเฉพาะประจุในแนวเส้นตรง ไม่รวมแบบเวกเตอร์สองมิติ ม.5/6 มีเพียงปรากฏการณ์ในชีวิตประจำวัน ไม่มีหลักการทำงานของเครื่องใช้ไฟฟ้า"
  - topic: physics.electricity.current-voltage
    indicators: ["ฟิสิกส์ 3 ม.5/4", "ฟิสิกส์ 3 ม.5/7", "ฟิสิกส์ 3 ม.5/8"]
    coverage: partial
    note: "ความต่างศักย์เป็นพลังงานต่อประจุ กระแสเป็นประจุต่อเวลา และกฎของโอห์ม ยังไม่มีพลังงานศักย์ไฟฟ้าและศักย์ไฟฟ้าของจุดประจุ ความเร็วลอยเลื่อน และสภาพต้านทาน"
  - topic: physics.electricity.circuits
    indicators: ["ฟิสิกส์ 3 ม.5/8", "ฟิสิกส์ 3 ม.5/10"]
    coverage: partial
    note: "ความต้านทานสมมูลแบบอนุกรม ขนาน และผสม และวงจรที่มีแบตเตอรี่หนึ่งก้อน ยังไม่มีอีเอ็มเอฟ ความต้านทานภายใน และการต่อแบตเตอรี่หลายก้อน"
  - topic: physics.electricity.electric-power
    indicators: ["ฟิสิกส์ 3 ม.5/9"]
    coverage: partial
    note: "พลังงานไฟฟ้าและกำลังไฟฟ้า ยังไม่มีอีเอ็มเอฟของแหล่งกำเนิด"
  - topic: physics.magnetism.magnetic-field
    indicators: ["ฟิสิกส์ 3 ม.6/1", "ฟิสิกส์ 3 ม.6/2", "ฟิสิกส์ 3 ม.6/3"]
    coverage: partial
    note: "เส้นสนามแม่เหล็ก สนามรอบลวดตรง แรงบนลวดและบนประจุที่เคลื่อนที่ และมอเตอร์กระแสตรง ยังไม่มีฟลักซ์แม่เหล็ก โซเลนอยด์ รัศมีการเคลื่อนที่ของประจุ แรงระหว่างลวดคู่ขนาน และแกลแวนอมิเตอร์"
  # ---------- ข้อ 4 (ม.6) ----------
  - topic: physics.thermal.temperature-heat
    indicators: ["ฟิสิกส์ 4 ม.6/1"]
    coverage: partial
    note: "ความร้อนที่ทำให้อุณหภูมิเปลี่ยนและการผสมสารตามกฎการอนุรักษ์พลังงาน ส่วนการเปลี่ยนสถานะอยู่ใน phase-change"
  - topic: physics.thermal.phase-change
    indicators: ["ฟิสิกส์ 4 ม.6/1"]
    coverage: partial
    note: "ความร้อนแฝงและการเปลี่ยนสถานะ"
  - topic: physics.matter.pressure-fluids
    indicators: ["ฟิสิกส์ 4 ม.6/3", "ฟิสิกส์ 4 ม.6/4"]
    coverage: partial
    note: "ม.6/4 (แรงพยุงและหลักของอาร์คิมีดีส) สอนครบ ม.6/3 มีความดันเกจ ความดันสัมบูรณ์ ความดันบรรยากาศ และเครื่องอัดไฮดรอลิก (หลักของพาสคัล) ยังไม่มีแมนอมิเตอร์และบารอมิเตอร์"
