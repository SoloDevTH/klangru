  ai_assisted: true
- id: chinese.grammar.measure-words.p013
  topics:
  - chinese.grammar.measure-words
  difficulty: 4
  type: mcq
  stem: ลักษณนาม 条 tiáo ใช้กับคำนามกลุ่มใด
  choices:
  - id: a
    text: 茶 (ชา) 咖啡 (กาแฟ)
    feedback: เครื่องดื่มในแก้วใช้ 杯
  - id: b
    text: 老师 (ครู) 医生 (หมอ)
    feedback: คนใช้ 个 หรือ 位
  - id: c
    text: 鱼 (ปลา) 裤子 (กางเกง) 路 (ถนน) 河 (แม่น้ำ)
    correct: true
    feedback: ถูก 条 ใช้กับสิ่งที่ยาวและแคบ
  - id: d
    text: 书 (หนังสือ) 本子 (สมุด)
    feedback: หนังสือและสมุดใช้ 本
  hints:
  - 条 ใช้กับของที่มีรูปร่างยาว
  - ภาษาไทยเรียกปลาว่า ตัว ถนนว่า สาย แม่น้ำว่า สาย แต่ภาษาจีนใช้ 条 คำเดียว
  solution: '条 ใช้กับของ **ยาวและแคบ**: 一条鱼 一条裤子 一条路 一条河'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.measure-words.p014
  topics:
  - chinese.grammar.measure-words
  difficulty: 4
  type: text
  stem: ครูภาษาจีนบอกนักเรียนให้เปิดหนังสือ "หน้าที่ 25" เขียนเป็นภาษาจีน (第 dì = ที่, 页 yè = หน้า; พิมพ์อักษรจีน)
  accepted:
