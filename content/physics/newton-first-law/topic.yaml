id: physics.dynamics.newton-first
subject: physics
title: { th: กฎการเคลื่อนที่ข้อที่ 1 ของนิวตัน, en: "Newton's first law of motion" }
summary: วัตถุรักษาสภาพนิ่งหรือเคลื่อนที่ด้วยความเร็วคงตัวเมื่อแรงลัพธ์เป็นศูนย์ เข้าใจความเฉื่อย สมดุลสถิตและสมดุลจลน์ จากตัวอย่างในชีวิตประจำวัน
difficulty: 3
minutes: 30
prerequisites: [physics.dynamics.forces]
encompasses:
  - { id: physics.dynamics.forces, weight: 0.5 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: แผนภาพแรงของรถที่แล่นด้วยความเร็วคงตัว
    problem: "รถยนต์หนัก $12000\\ \\mathrm{N}$ แล่นบนถนนราบตรงด้วยความเร็วคงตัว แรงขับที่ถนนดันล้อไปข้างหน้าเป็น $2000\\ \\mathrm{N}$ จงวาดแผนภาพแรง แล้วหาแรงตั้งฉากจากถนนและแรงต้านรวม"
    figure:
      src: car-constant-velocity-fbd.svg
      alt: "รถยนต์บนถนนราบ มีลูกศรแรงสี่ลูกจากจุดกลางรถ: น้ำหนักชี้ลง แรงตั้งฉากจากถนนชี้ขึ้นยาวเท่ากัน แรงขับชี้ไปข้างหน้า (ขวา) และแรงต้านรวมชี้ไปข้างหลัง (ซ้าย) ยาวเท่ากัน มีลูกศรบอกว่ารถเคลื่อนที่ด้วยความเร็วคงตัวไปทางขวา (ลูกศรไม่ได้วาดตามมาตราส่วนระหว่างแนวดิ่งกับแนวราบ)"
    steps:
      - text: "แรงที่กระทำต่อรถมีสี่แรง: น้ำหนัก (ลง) แรงตั้งฉากจากถนน (ขึ้น) แรงขับ (ไปข้างหน้า) และแรงต้านรวมจากอากาศและถนน (ไปข้างหลัง)"
        why: "แผนภาพแรงวาดเฉพาะแรงที่สิ่งอื่นกระทำต่อรถ ไม่วาด \"แรงเฉื่อย\" หรือ \"แรงของการเคลื่อนที่\" เพราะไม่มีแรงเหล่านั้น"
      - text: "ความเร็วคงตัว จึงสมดุลจลน์ แนวดิ่ง: $N - 12000 = 0$ ได้ $N = 12000\\ \\mathrm{N}$"
      - text: "แนวราบ: $2000 - R = 0$ ได้แรงต้านรวม $R = 2000\\ \\mathrm{N}$"
        why: "รถไม่ได้ต้องการแรงไปข้างหน้ามากกว่าแรงต้านเพื่อจะวิ่งต่อไป ถ้าแรงขับมากกว่า รถจะเร็วขึ้น"
    answer: "แรงตั้งฉาก $12000\\ \\mathrm{N}$ และแรงต้านรวม $2000\\ \\mathrm{N}$"
  - { type: check, problem: phy.n1.p002, prompt: "ตรวจความเข้าใจเรื่องแรงลัพธ์เป็นศูนย์" }
  - type: worked-example
    title: ป้ายแขวนด้วยเชือกสองเส้น
    problem: "ป้ายหนัก $100\\ \\mathrm{N}$ แขวนนิ่งด้วยเชือกสองเส้น เส้นซ้ายทำมุม $30^\\circ$ และเส้นขวาทำมุม $60^\\circ$ กับเพดาน จงหาแรงตึงในเชือกแต่ละเส้น"
    figure:
      src: sign-two-ropes.svg
      alt: "ป้ายหนัก 100 N ห้อยจากปมเชือก ปมเชือกต่อกับเพดานด้วยเชือกสองเส้น เส้นซ้าย T₁ ทำมุม 30° กับเพดาน เส้นขวา T₂ ทำมุม 60° กับเพดาน ด้านขวามีสามเหลี่ยมแรงที่ต่อลูกศร W (ลง) T₁ (ขึ้นไปทางซ้าย) และ T₂ (ขึ้นไปทางขวา) หัวต่อหางกันเป็นสามเหลี่ยมปิด"
    steps:
      - text: "แนวราบ: $T_1\\cos 30^\\circ = T_2\\cos 60^\\circ$ จึงได้ $T_2 = T_1 \\dfrac{0.866}{0.5} = 1.732\\,T_1$"
        why: "องค์ประกอบแนวราบของเชือกสองเส้นดึงไปคนละข้าง ต้องหักล้างกันพอดีเพราะปมไม่เลื่อนซ้ายขวา"
      - text: "แนวดิ่ง: $T_1\\sin 30^\\circ + T_2\\sin 60^\\circ = 100$ แทน $T_2$: $T_1(0.5 + 1.732 \\times 0.866) = 2T_1 = 100$"
      - text: "ได้ $T_1 = 50\\ \\mathrm{N}$ และ $T_2 = 1.732 \\times 50 \\approx 86.6\\ \\mathrm{N}$"
      - text: "ตรวจด้วยสามเหลี่ยมแรง: เส้นซ้ายตั้งฉากกับเส้นขวาพอดี ($30^\\circ + 60^\\circ$ ทำให้มุมระหว่างเชือกเป็น $90^\\circ$) จึงได้ $T_1 = 100\\sin 30^\\circ$ และ $T_2 = 100\\cos 30^\\circ$ ตรงกัน"
    answer: "$T_1 = 50\\ \\mathrm{N}$ (เส้นที่เอียงมาก) และ $T_2 \\approx 86.6\\ \\mathrm{N}$ (เส้นที่ชันกว่ารับแรงมากกว่า)"
  - { type: check, problem: phy.n1.p007, prompt: "ความเฉื่อยขึ้นกับอะไร" }
  - type: simulation
    title: แรงและการเคลื่อนที่ (PhET Forces and Motion Basics)
    url: https://phet.colorado.edu/en/simulations/forces-and-motion-basics
    provider: phet
    note: เปิดหน้าจอ Friction ตั้งแรงเสียดทานเป็นศูนย์ (None) ออกแรงผลักกล่องสักครู่แล้วปล่อยแรงเป็นศูนย์ กล่องจะเลื่อนต่อไปด้วยความเร็วคงตัว จากนั้นเพิ่มแรงเสียดทานแล้วลองใหม่ สังเกตว่ากล่องช้าลงเพราะมีแรงลัพธ์ต้านการเคลื่อนที่ และถ้าดันด้วยแรงเท่ากับแรงเสียดทานพอดี ความเร็วจะคงตัว
glossary:
  - { term: กฎข้อที่ 1 ของนิวตัน, definition: "วัตถุจะรักษาสภาพหยุดนิ่งหรือเคลื่อนที่ด้วยความเร็วคงตัวในแนวเส้นตรง ตราบที่แรงลัพธ์ที่กระทำต่อวัตถุเป็นศูนย์" }
  - { term: ความเฉื่อย, definition: "สมบัติของวัตถุที่ต้านการเปลี่ยนสภาพการเคลื่อนที่ ขึ้นกับมวลเท่านั้น มวลมากยิ่งเฉื่อยมาก ความเฉื่อยไม่ใช่แรง" }
  - { term: สมดุลสถิต, definition: "สภาพที่วัตถุหยุดนิ่งและแรงลัพธ์เป็นศูนย์" }
  - { term: สมดุลจลน์, definition: "สภาพที่วัตถุเคลื่อนที่ด้วยความเร็วคงตัว (ขนาดและทิศคงเดิม) และแรงลัพธ์เป็นศูนย์" }
flashcards:
  - { front: "กฎข้อที่ 1 ของนิวตันกล่าวว่าอย่างไร", back: "ถ้าแรงลัพธ์เป็นศูนย์ วัตถุที่นิ่งจะนิ่งต่อไป วัตถุที่เคลื่อนที่จะเคลื่อนที่ด้วยความเร็วคงตัวในแนวเส้นตรงต่อไป" }
  - { front: "รถแล่นด้วยความเร็วคงตัวบนถนนตรง แรงขับเทียบกับแรงต้านเป็นอย่างไร", back: "เท่ากันพอดี เพราะแรงลัพธ์ต้องเป็นศูนย์ ไม่ใช่แรงขับมากกว่า" }
  - { front: "ความเฉื่อยขึ้นกับอะไร", back: "ขึ้นกับมวลอย่างเดียว ไม่ขึ้นกับความเร็ว และความเฉื่อยไม่ใช่แรง" }
  - { front: "ลูกบอลที่จุดสูงสุดของการโยนขึ้นอยู่ในสมดุลหรือไม่", back: "ไม่ ความเร็วเป็นศูนย์ชั่วขณะ แต่ยังมีน้ำหนักกระทำอยู่ แรงลัพธ์ไม่เป็นศูนย์" }
