  - { id: computer.security.secure-coding, title: เขียนโค้ดอย่างปลอดภัย, difficulty: 6, prereq: [computer.data.databases, computer.programming.files-exceptions, computer.web.html-css], indicators: ["acm-cs2023:SEC-Coding", "acm-cs2023:SEC-Engineering", "csta-k12-cs-2026:HS-SYS-SE-33"], scope: "ช่องโหว่ที่พบบ่อยตาม OWASP (แทรกคำสั่ง SQL และคำสั่งระบบ XSS การตรวจสิทธิ์ที่ขาด ความลับฝังในโค้ด) บัฟเฟอร์ล้นในภาษาที่จัดการหน่วยความจำเองในระดับแนวคิด ตรวจข้อมูลเข้าแบบรายการที่อนุญาต การหลีกอักขระและคำสั่งแบบพารามิเตอร์ หลักการออกแบบที่ปลอดภัย (สิทธิ์น้อยที่สุด ค่าเริ่มต้นที่ปลอดภัย ล้มเหลวอย่างปลอดภัย ป้องกันหลายชั้น ลดพื้นผิวการโจมตี) วงจรพัฒนาซอฟต์แวร์ที่ปลอดภัยและแบบจำลองภัยคุกคาม การทดสอบความปลอดภัยและเครื่องมือวิเคราะห์โค้ด เสนอวิธีแก้ช่องโหว่ในระบบที่กำหนด โจทย์โค้ดเขียนฟังก์ชันตรวจข้อมูลเข้าและหลีกอักขระ HTML ให้ผ่านชุดทดสอบที่มีข้อมูลโจมตี" }
