<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="sans-serif" font-size="14">
<title>กฎของเลนซ์: แม่เหล็กเข้าใกล้และออกห่างขดลวด</title>
<rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
<text x="180.0" y="30.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">ขั้วเหนือเคลื่อนเข้าหาวง</text>
<rect x="20.0" y="140.0" width="60.0" height="40.0" rx="0" fill="#5b8fd6" stroke="#15211e" stroke-width="2"/>
<rect x="80.0" y="140.0" width="60.0" height="40.0" rx="0" fill="#d9534f" stroke="#15211e" stroke-width="2"/>
<text x="50.0" y="166.0" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">S</text>
<text x="110.0" y="166.0" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">N</text>
<line x1="80.0" y1="205.0" x2="116.5" y2="205.0" stroke="#15211e" stroke-width="2.5"/>
<polygon points="125.0,205.0 115.0,200.5 115.0,209.5" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="80.0" y="230.0" text-anchor="middle" fill="#777" font-size="12">การเคลื่อนที่ของแม่เหล็ก</text>
<ellipse cx="270" cy="160" rx="22" ry="75" fill="none" stroke="#c26a00" stroke-width="5"/>
