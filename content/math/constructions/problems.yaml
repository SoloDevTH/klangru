problems:
  - id: math.geometry.constructions.p001
    topics: [math.geometry.constructions]
    difficulty: 1
    type: match
    stem: "จับคู่เครื่องมือกับงานที่ใช้เครื่องมือนั้น"
    pairs:
      - { left: "วงเวียน", right: "เขียนวงกลมหรือส่วนโค้ง และถ่ายความยาว" }
      - { left: "โพรแทรกเตอร์", right: "วัดและสร้างมุมตามขนาดที่กำหนด" }
      - { left: "ไม้ฉาก", right: "สร้างมุมฉากและเส้นขนาน" }
      - { left: "สันตรง", right: "ลากเส้นตรงผ่านสองจุดโดยไม่วัดความยาว" }
    hints:
      - "เครื่องมือใดมีขาสองข้างและหมุนได้"
      - "สันตรงไม่มีขีดวัด"
    solution: "วงเวียนเขียนส่วนโค้งและถ่ายความยาว โพรแทรกเตอร์ใช้กับมุม ไม้ฉากให้มุมฉากและใช้เลื่อนสร้างเส้นขนาน สันตรงใช้ลากเส้นตรงอย่างเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.constructions.p002
    topics: [math.geometry.constructions]
    difficulty: 1
    type: match
    stem: "จับคู่สัญลักษณ์บนรูปกับความหมาย"
    pairs:
      - { left: "ขีดเล็กขีดเดียวบนสองด้าน", right: "สองด้านนั้นยาวเท่ากัน" }
      - { left: "ลูกศรบนสองเส้น", right: "สองเส้นนั้นขนานกัน" }
      - { left: "สี่เหลี่ยมเล็กที่มุม", right: "มุมนั้นเป็นมุมฉาก" }
    hints:
      - "สัญลักษณ์ทั้งสามใช้บอกสมบัติโดยไม่ต้องเขียนตัวเลข"
      - "สี่เหลี่ยมเล็กมีมุมฉากอยู่ในตัว"
    solution: "ขีดเล็กบอกความยาวเท่ากัน ลูกศรบอกการขนาน สี่เหลี่ยมเล็กบอกมุมฉาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.constructions.p003
    topics: [math.geometry.constructions]
    difficulty: 2
    type: mcq
    stem: "เส้นตรงสองเส้นที่อยู่บนระนาบเดียวกันและไม่ตัดกันเลย เรียกว่าอะไร"
    choices:
      - { id: a, text: "เส้นขนาน", correct: true }
      - { id: b, text: "เส้นตั้งฉาก", feedback: "เส้นตั้งฉากตัดกันเป็นมุมฉาก ไม่ใช่ไม่ตัดกัน" }
      - { id: c, text: "ส่วนของเส้นตรง", feedback: "ส่วนของเส้นตรงคือเส้นตรงที่มีจุดปลายสองจุด ไม่ได้บอกความสัมพันธ์ของสองเส้น" }
      - { id: d, text: "เส้นแบ่งครึ่งตั้งฉาก", feedback: "เส้นแบ่งครึ่งตั้งฉากตัดส่วนของเส้นตรงที่จุดกึ่งกลาง" }
    hints:
      - "นึกถึงรางรถไฟ"
      - "เส้นที่ไม่มีวันพบกัน"
    solution: "เส้นตรงบนระนาบเดียวกันที่ไม่ตัดกันเลยคือเส้นขนาน เช่น รางรถไฟสองราง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.constructions.p004
    topics: [math.geometry.constructions]
    difficulty: 2
    type: order
    stem: "ครูจะตัดป้ายผ้ารูปสี่เหลี่ยมมุมฉากยาว 6 ซม. กว้าง 4 ซม. (ย่อส่วน) เรียงขั้นตอนการสร้างด้วยไม้บรรทัดและไม้ฉาก"
    items: ["ลาก AB ยาว 6 ซม.", "สร้างมุมฉากที่จุด A และจุด B", "วัดบนเส้นตั้งฉากให้ AD และ BC ยาว 4 ซม.", "ลากเส้นเชื่อม D กับ C", "ตรวจว่า DC ยาว 6 ซม. และทุกมุมเป็นมุมฉาก"]
    hints:
      - "เริ่มจากด้านใดด้านหนึ่งก่อน"
      - "ต้องมีจุด D และ C ก่อนจึงลากเชื่อมได้"
    solution: "ลากฐาน AB → สร้างมุมฉากที่ปลายทั้งสอง → วัดความกว้าง 4 ซม. ได้ D และ C → ลาก DC → ตรวจความยาวและมุม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.constructions.p005
    topics: [math.geometry.constructions]
    difficulty: 2
    type: mcq
    stem: "ในการสร้างเส้นแบ่งครึ่งตั้งฉากของ AB ทำไมต้องกางวงเวียนให้ยาวเกินครึ่งหนึ่งของ AB"
    choices:
      - { id: a, text: "ถ้าสั้นกว่าครึ่ง ส่วนโค้งจาก A และจาก B จะไม่ตัดกัน", correct: true }
      - { id: b, text: "เพื่อให้เส้นที่ได้ยาวกว่า AB", feedback: "ความยาวของเส้นที่ลากไม่สำคัญ ส่วนสำคัญคือต้องมีจุดตัดสองจุด" }
      - { id: c, text: "เพื่อให้เส้นที่ได้ขนานกับ AB", feedback: "เส้นแบ่งครึ่งตั้งฉากตั้งฉากกับ AB ไม่ได้ขนาน" }
    hints:
      - "ลองนึกว่ากางวงเวียนสั้นมาก ส่วนโค้งจาก A กับ B จะอยู่ใกล้ปลายแต่ละข้าง"
      - "ส่วนโค้งสองวงจะตัดกันได้ต้องเอื้อมถึงกัน"
    solution: "ถ้ารัศมีน้อยกว่าครึ่งของ AB วงจาก A และวงจาก B ไม่ถึงกลาง จึงไม่มีจุดตัด P และ Q ให้ลากเส้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.constructions.p006
    topics: [math.geometry.constructions]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการสร้างเส้นแบ่งครึ่งตั้งฉากของส่วนของเส้นตรง AB ด้วยวงเวียนและสันตรง"
    items: ["กางวงเวียนให้ยาวเกินครึ่งของ AB", "ใช้ A เป็นจุดศูนย์กลาง เขียนส่วนโค้งด้านบนและด้านล่างของ AB", "ใช้ B เป็นจุดศูนย์กลาง รัศมีเดิม เขียนส่วนโค้งตัดส่วนโค้งแรกที่ P และ Q", "ลากเส้นตรงผ่าน P และ Q"]
    hints:
      - "ต้องกำหนดรัศมีก่อนเขียนส่วนโค้ง"
      - "ต้องมีจุดตัดสองจุดก่อนลากเส้น"
    solution: "กางวงเวียนเกินครึ่ง → ส่วนโค้งจาก A → ส่วนโค้งจาก B รัศมีเดิมได้ P, Q → ลาก PQ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.constructions.p007
    topics: [math.geometry.constructions]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการสร้างเส้นแบ่งครึ่งมุม AOB (จุดยอด O)"
    items: ["ใช้ O เป็นจุดศูนย์กลาง เขียนส่วนโค้งตัดแขนทั้งสองที่ X และ Y", "ใช้ X เป็นจุดศูนย์กลาง เขียนส่วนโค้งภายในมุม", "ใช้ Y เป็นจุดศูนย์กลาง รัศมีเดิม เขียนส่วนโค้งตัดส่วนโค้งก่อนหน้าที่ C", "ลากรังสี OC"]
    hints:
      - "ต้องหาจุดบนแขนทั้งสองที่ห่างจาก O เท่ากันก่อน"
      - "จุด C ต้องห่างจาก X และ Y เท่ากัน"
    solution: "ส่วนโค้งจาก O ได้ X, Y → ส่วนโค้งจาก X → ส่วนโค้งจาก Y รัศมีเดิมได้ C → ลาก OC"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.constructions.p008
    topics: [math.geometry.constructions]
    difficulty: 3
    type: numeric
    stem: "สร้างเส้นแบ่งครึ่งมุมของมุมขนาด 76° มุมที่เกิดขึ้นแต่ละมุมมีขนาดกี่องศา (ตอบในหน่วยองศา)"
    answer: { value: 38, unit: องศา }
    hints:
      - "แบ่งครึ่งคือแบ่งเป็นสองส่วนเท่ากัน"
      - "$76 \\div 2$"
    misconceptions:
      - { match: 152, feedback: "คูณ 2 แต่การแบ่งครึ่งทำให้มุมเล็กลง" }
      - { match: 104, feedback: "หามุมที่รวมกับ 76° ได้ 180° แต่โจทย์ถามครึ่งหนึ่งของมุม" }
    solution: "$76° \\div 2 = 38°$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.constructions.p009
    topics: [math.geometry.constructions]
    difficulty: 3
    type: mcq
    stem: "นักเรียนจะสร้างรูปสามเหลี่ยมที่มีด้านยาว 3 ซม. 4 ซม. และ 8 ซม. โดยลากด้าน 8 ซม. แล้วเขียนส่วนโค้งรัศมี 3 ซม. และ 4 ซม. จากปลายทั้งสอง ผลเป็นอย่างไร"
    choices:
      - { id: a, text: "สร้างไม่ได้ เพราะส่วนโค้งไม่ตัดกัน ($3 + 4 < 8$)", correct: true }
      - { id: b, text: "สร้างได้ เป็นรูปสามเหลี่ยมมุมฉาก", feedback: "สามเหลี่ยมมุมฉากด้าน 3 และ 4 มีด้านยาวที่สุด 5 ซม. ไม่ใช่ 8 ซม." }
      - { id: c, text: "สร้างได้ เพราะกำหนดด้านมาครบสามด้าน", feedback: "รู้สามด้านยังต้องตรวจว่าผลบวกของสองด้านที่สั้นกว่ามากกว่าด้านที่ยาวที่สุด" }
    hints:
      - "ส่วนโค้งสองวงเอื้อมได้ไกลรวมกันเท่าไร"
      - "เทียบ $3 + 4$ กับ 8"
    solution: "ส่วนโค้งรัศมี 3 กับ 4 ซม. เอื้อมรวมกันได้แค่ 7 ซม. ซึ่งไม่ถึง 8 ซม. จึงไม่ตัดกัน สร้างรูปสามเหลี่ยมไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.constructions.p010
    topics: [math.geometry.constructions]
    difficulty: 3
    type: numeric
    stem: "สร้างรูปหกเหลี่ยมด้านเท่ามุมเท่าแนบในวงกลมรัศมี 5 ซม. โดยกางวงเวียนเท่ารัศมีแล้วขีดรอบวงกลม รูปหกเหลี่ยมนี้มีความยาวรอบรูปกี่เซนติเมตร (ตอบในหน่วยเซนติเมตร)"
    answer: { value: 30, unit: cm }
    hints:
      - "ด้านของหกเหลี่ยมแต่ละด้านยาวเท่ากับที่กางวงเวียน"
      - "หกเหลี่ยมมี 6 ด้าน ด้านละ 5 ซม."
    misconceptions:
      - { match: 31.4, feedback: "นี่คือความยาวรอบวงกลม ($2\\pi r$) แต่ด้านของหกเหลี่ยมเป็นเส้นตรงซึ่งสั้นกว่าส่วนโค้ง" }
      - { match: 25, feedback: "นับแค่ 5 ด้าน หกเหลี่ยมมี 6 ด้าน" }
    solution: "ด้านละเท่ารัศมี 5 ซม. ความยาวรอบรูป $6 \\times 5 = 30$ ซม."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.constructions.p011
    topics: [math.geometry.constructions]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "มุมใดสร้างได้ด้วยวงเวียนและสันตรงอย่างเดียว โดยไม่ใช้โพรแทรกเตอร์ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "60°", correct: true }
      - { id: b, text: "30°", correct: true }
      - { id: c, text: "90°", correct: true }
      - { id: d, text: "45°", correct: true }
      - { id: e, text: "40°", feedback: "40° ไม่ได้เกิดจากการแบ่งครึ่งหรือรวมมุม 60° และ 90° ต้องใช้โพรแทรกเตอร์" }
    hints:
      - "สามเหลี่ยมด้านเท่าให้มุมอะไร เส้นตั้งฉากให้มุมอะไร"
      - "แบ่งครึ่งมุมที่สร้างได้ จะได้มุมที่สร้างได้อีก"
    solution: "สามเหลี่ยมด้านเท่าให้ 60° แบ่งครึ่งได้ 30° เส้นตั้งฉากให้ 90° แบ่งครึ่งได้ 45° ส่วน 40° สร้างจากวิธีเหล่านี้ไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.constructions.p012
    topics: [math.geometry.constructions]
    difficulty: 4
    type: numeric
    stem: "แผนผังสนามหญ้าของโรงเรียนใช้มาตราส่วน 1 : 200 ด้านหนึ่งของสนามในแผนผังยาว 4.5 ซม. ของจริงยาวกี่เมตร (ตอบในหน่วยเมตร)"
    answer: { value: 9, tolerance: 0.01, unit: m }
    hints:
      - "1 ซม. ในแผนผังแทน 200 ซม. ของจริง"
      - "$4.5 \\times 200$ ซม. แล้วเปลี่ยนเป็นเมตร"
    misconceptions:
      - { match: 900, feedback: "900 คือคำตอบเป็นเซนติเมตร ต้องหารด้วย 100 เป็นเมตร" }
      - { match: 0.0225, feedback: "หารด้วย 200 แต่ของจริงใหญ่กว่าแผนผัง ต้องคูณ" }
    solution: "$4.5 \\times 200 = 900$ ซม. $= 9$ ม."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.constructions.p013
    topics: [math.geometry.constructions]
    difficulty: 3
    type: mcq
    stem: "ชาวบ้านจะขุดบ่อน้ำให้ห่างจากบ้าน A บ้าน B และบ้าน C เท่ากัน ควรหาตำแหน่งบ่อด้วยการสร้างใด"
    figure: { src: three-houses.svg, alt: "บ้านสามหลัง บ้าน A อยู่ซ้ายล่าง บ้าน B อยู่ขวาล่าง บ้าน C อยู่ด้านบนตรงกลาง ไม่มีเส้นใดเชื่อมระหว่างบ้าน" }
    choices:
      - { id: a, text: "หาจุดตัดของเส้นแบ่งครึ่งตั้งฉากของ AB, BC และ CA", correct: true }
      - { id: b, text: "หาจุดตัดของเส้นแบ่งครึ่งมุมของสามเหลี่ยม ABC", feedback: "จุดนี้ห่างจากด้านทั้งสามเท่ากัน ไม่ใช่ห่างจากบ้าน (จุดยอด) เท่ากัน" }
      - { id: c, text: "หาจุดกึ่งกลางของ AB", feedback: "จุดกึ่งกลางของ AB ห่างจาก A และ B เท่ากัน แต่อาจห่างจาก C ไม่เท่า" }
    hints:
      - "จุดที่ห่างจาก A และ B เท่ากันอยู่บนเส้นอะไร"
      - "ต้องห่างจากบ้านทั้งสามหลังพร้อมกัน"
    solution: "จุดบนเส้นแบ่งครึ่งตั้งฉากของ AB ห่างจาก A และ B เท่ากัน จุดตัดของเส้นแบ่งครึ่งตั้งฉากทั้งสามห่างจาก A, B, C เท่ากัน (จุดศูนย์กลางวงกลมล้อมรอบ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.constructions.p014
    topics: [math.geometry.constructions]
    difficulty: 4
    type: mcq
    stem: "แปลงผักรูปสามเหลี่ยม ลุงต้องการวางสปริงเกลอร์ที่รดน้ำเป็นวงกลมให้ใหญ่ที่สุดโดยไม่เกินขอบแปลง จุดวางสปริงเกลอร์ควรเป็นจุดใด"
    choices:
      - { id: a, text: "จุดตัดของเส้นแบ่งครึ่งมุมทั้งสาม", correct: true }
      - { id: b, text: "จุดตัดของเส้นแบ่งครึ่งตั้งฉากของด้านทั้งสาม", feedback: "จุดนี้ห่างจากมุมแปลงเท่ากัน วงกลมจะผ่านมุมแปลงและล้นออกนอกขอบ" }
      - { id: c, text: "จุดยอดที่มีมุมใหญ่ที่สุด", feedback: "ที่มุมแปลง วงกลมจะล้นออกนอกแปลงเกือบทั้งวง" }
    hints:
      - "วงกลมใหญ่ที่สุดที่อยู่ในสามเหลี่ยมจะสัมผัสด้านทั้งสาม"
      - "จุดที่ห่างจากด้านทั้งสามเท่ากัน"
    solution: "วงกลมใหญ่ที่สุดในสามเหลี่ยมคือวงกลมแนบใน จุดศูนย์กลางห่างจากด้านทั้งสามเท่ากัน คือจุดตัดของเส้นแบ่งครึ่งมุม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.constructions.p015
