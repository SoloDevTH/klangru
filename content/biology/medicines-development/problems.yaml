  - id: biology.health.medicines-development.p015
    topics: [biology.health.medicines-development]
    difficulty: 4
    type: numeric
    stem: "การทดลองวัคซีนแบบสุ่มปกปิดสองทาง (ข้อมูลสมมติ) มีกลุ่มละ 15,000 คน กลุ่มยาหลอกป่วย 150 คน กลุ่มวัคซีนป่วย 8 คน ประสิทธิผลของวัคซีนเป็นกี่เปอร์เซ็นต์ (ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 94.7, tolerance: 0.2, unit: "%" }
    misconceptions:
      - { match: 5.3, feedback: "5.3% คือ RR (8/150) ประสิทธิผลคือ 1 − RR" }
      - { match: 142, feedback: "142 คือผลต่างของจำนวนคน ต้องคิดเป็นสัดส่วน" }
    hints:
      - "สองกลุ่มมีจำนวนคนเท่ากัน RR = 8/150 ได้เลย"
      - "ประสิทธิผล = 1 − RR"
    solution: "$RR = (8/15{,}000)/(150/15{,}000) = 8/150 \\approx 0.0533$ ประสิทธิผล $1 - 0.0533 \\approx 0.947$ หรือราว 94.7% หมายความว่าความเสี่ยงที่จะป่วยลดลงราว 95% เมื่อเทียบกับไม่ได้วัคซีน ไม่ได้แปลว่า 5.3% ของผู้ได้วัคซีนจะป่วย"
