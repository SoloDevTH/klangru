id: biology.plants.transport-nutrients
subject: biology
title: { th: การลำเลียงในพืชและธาตุอาหารพืช, en: "Transport in plants and plant nutrients" }
summary: ไซเลมลำเลียงน้ำและธาตุอาหารขึ้นทางเดียว โฟลเอ็มลำเลียงอาหารได้ทั้งขึ้นและลง การคายน้ำ การควั่นกิ่ง ธาตุอาหารหลักและธาตุอาหารรอง การอ่านสูตรปุ๋ยและเลือกปุ๋ยให้เหมาะกับพืช
difficulty: 3
minutes: 40
prerequisites: [biology.cells.diffusion-osmosis, biology.plants.photosynthesis-intro]
encompasses:
  - { id: biology.plants.photosynthesis-intro, weight: 0.2 }
  - { id: biology.cells.diffusion-osmosis, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ทิศทางการลำเลียงในไซเลมและโฟลเอ็ม
    src: transport-directions.svg
    alt: "ต้นพืชหนึ่งต้นมีรากอยู่ในดิน ลำต้นตั้งตรง มีใบ 2 ใบ ยอดอ่อน และผล 1 ผล ลูกศรสีน้ำเงิน (ไซเลม น้ำและธาตุอาหาร) ชี้ขึ้นตลอดลำต้นจากรากไปถึงยอดและแยกเข้าใบด้านบน ที่ราก ลูกศรสีน้ำเงินชี้จากดินเข้าราก ข้อความ ขนรากดูดน้ำและธาตุอาหารจากดิน เหนือใบมีเส้นหยักแทนไอน้ำ ข้อความ ไอน้ำออกทางปากใบ (การคายน้ำ) ลูกศรสีส้ม (โฟลเอ็ม อาหาร) ชี้จากใบเข้าลำต้น แล้วชี้ลงไปที่ราก ชี้ไปที่ผล และชี้ขึ้นไปที่ยอดอ่อน กล่องคำอธิบาย ไซเลม น้ำและธาตุอาหาร ขึ้นจากรากทางเดียว โฟลเอ็ม อาหาร (น้ำตาล) จากใบไปทุกส่วน ขึ้นและลง"
    caption: "ไซเลมลำเลียงขึ้นทางเดียว ส่วนโฟลเอ็มส่งอาหารไปยังส่วนที่ต้องใช้ทั้งด้านบนและด้านล่าง (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: ทดลองดูการลำเลียงน้ำ
    problem: "ออกแบบการทดลองสั้น ๆ เพื่อดูว่าน้ำขึ้นไปตามส่วนใดของก้านผักบุ้ง และอุณหภูมิหรือลมมีผลต่อความเร็วหรือไม่"
    steps:
      - text: "ตัดผักบุ้ง 2 ยอดที่ขนาดใกล้กัน แช่ในแก้วน้ำผสมสีผสมอาหารสีแดงปริมาณเท่ากัน"
      - text: "วางแก้วหนึ่งในห้อง อีกแก้วหน้าพัดลม ปัจจัยอื่นเหมือนกัน"
        why: "เปลี่ยนเพียงสิ่งเดียว (ลม) จึงบอกได้ว่าความต่างเกิดจากลม"
      - text: "ทุก 30 นาที สังเกตสีที่ใบ และวัดระดับน้ำที่ลดลง"
      - text: "เมื่อครบเวลา หั่นก้านตามขวาง จะเห็นจุดสีแดงคือไซเลม แก้วหน้าพัดลมน้ำลดมากกว่าและสีขึ้นถึงใบเร็วกว่า"
    answer: "น้ำขึ้นตามไซเลมซึ่งเห็นเป็นจุดสีแดง ลมทำให้คายน้ำมากขึ้น น้ำจึงขึ้นเร็วกว่า"
  - { type: check, problem: biology.plants.transport-nutrients.p005, prompt: "ผลการทดลองนี้บอกอะไรเกี่ยวกับเนื้อเยื่อที่ลำเลียงน้ำ" }
  - type: figure
    title: การควั่นกิ่ง
    src: girdling.svg
    alt: "ภาพ 2 ช่อง ช่อง ก. วันแรก กิ่งไม้วางแนวนอน ซ้ายสุดคือด้านลำต้น ขวาสุดคือปลายกิ่งที่มีใบ ตรงกลางกิ่งลอกเปลือกออกเป็นวง เห็นเนื้อไม้สีอ่อน ข้อความ ลอกเปลือกออกเป็นวง และ เนื้อไม้ (ไซเลม) ยังอยู่ ช่อง ข. หลายสัปดาห์ต่อมา เปลือกด้านที่อยู่ทางปลายกิ่งถัดจากรอยควั่นบวมพองออก ลูกศรสีส้มชี้ที่ส่วนบวม ข้อความ อาหารจากใบมาค้างเหนือรอยควั่น และ ใบยังสด เพราะไซเลมยังส่งน้ำได้"
    caption: "เปลือกมีโฟลเอ็ม เนื้อไม้มีไซเลม การลอกเปลือกจึงตัดเฉพาะทางเดินของอาหาร (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: อ่านสูตรปุ๋ยแล้วเลือกให้เหมาะ
    problem: "ปุ๋ยสูตร 13-13-21 หนึ่งกระสอบหนัก 50 กิโลกรัม มีไนโตรเจนและโพแทสเซียมกี่กิโลกรัม และควรใช้กับพืชแบบใด"
    steps:
      - text: "สูตรเรียงเป็น N-P-K เป็นร้อยละโดยมวล ไนโตรเจนร้อยละ 13 โพแทสเซียมร้อยละ 21"
      - text: "ไนโตรเจน $= 50 \\times \\frac{13}{100} = 6.5$ กิโลกรัม"
      - text: "โพแทสเซียม $= 50 \\times \\frac{21}{100} = 10.5$ กิโลกรัม"
        why: "ตัวเลขในสูตรเป็นร้อยละ ไม่ใช่กิโลกรัม จึงต้องคูณกับน้ำหนักกระสอบ"
      - text: "โพแทสเซียมสูงที่สุด เหมาะกับไม้ผลช่วงผลโต เพราะช่วยให้ผลหวาน"
    answer: "ไนโตรเจน 6.5 กิโลกรัม โพแทสเซียม 10.5 กิโลกรัม เหมาะกับไม้ผลช่วงผลกำลังโต"
  - { type: check, problem: biology.plants.transport-nutrients.p006, prompt: "คิดแบบเดียวกันกับปุ๋ยยูเรีย" }
glossary:
  - { term: ไซเลม, definition: "เนื้อเยื่อลำเลียงน้ำและธาตุอาหารจากรากขึ้นไปยังส่วนต่าง ๆ ในทิศทางเดียว บางตำราเขียน ไซเล็ม" }
  - { term: โฟลเอ็ม, definition: "เนื้อเยื่อลำเลียงอาหารที่ใบสร้างไปยังส่วนต่าง ๆ ได้ทั้งขึ้นและลง" }
  - { term: การคายน้ำ, definition: "การที่น้ำในใบระเหยเป็นไอออกทางปากใบ ช่วยดึงน้ำในไซเลมขึ้นมา" }
  - { term: ธาตุอาหารหลัก, definition: "ธาตุที่พืชต้องการมากและดินมักมีไม่พอ ได้แก่ ไนโตรเจน ฟอสฟอรัส โพแทสเซียม" }
  - { term: ธาตุอาหารรอง, definition: "ธาตุที่พืชต้องการน้อยกว่าธาตุอาหารหลัก ได้แก่ แคลเซียม แมกนีเซียม กำมะถัน" }
  - { term: สูตรปุ๋ย, definition: "ตัวเลขสามตัวบนกระสอบปุ๋ย บอกร้อยละโดยมวลของ N, P₂O₅ และ K₂O ตามลำดับ" }
flashcards:
  - { front: "ไซเลมกับโฟลเอ็มลำเลียงอะไร", back: "ไซเลม: น้ำและธาตุอาหาร ขึ้นทางเดียว โฟลเอ็ม: อาหาร ขึ้นและลง" }
  - { front: "ควั่นกิ่งแล้วเปลือกบวมด้านใด", back: "ด้านเหนือรอยควั่น เพราะอาหารจากใบลงไปต่อไม่ได้" }
  - { front: "สูตรปุ๋ย 15-15-15 หมายถึง", back: "มี N, P₂O₅, K₂O อย่างละร้อยละ 15 โดยมวล" }
  - { front: "อาการขาดไนโตรเจน", back: "ใบแก่เหลืองซีด ต้นแคระแกร็น" }
  - { front: "ปุ๋ยที่ช่วยให้ผลหวาน", back: "ปุ๋ยโพแทสเซียมสูง เช่น 13-13-21" }
