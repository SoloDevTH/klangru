problems:
  - id: management.public.public-finance.p001
    topics: [management.public.public-finance]
    difficulty: 1
    type: mcq
    stem: "ปีงบประมาณ พ.ศ. 2570 ของรัฐบาลไทยเริ่มต้นวันใด"
    choices:
      - { id: a, text: "1 ตุลาคม 2569", correct: true }
      - { id: b, text: "1 มกราคม 2570", feedback: "นั่นคือต้นปีปฏิทิน ปีงบประมาณของไทยเริ่มเดือนตุลาคม" }
      - { id: c, text: "1 ตุลาคม 2570", feedback: "ปีงบประมาณเรียกตามปีที่สิ้นสุด ปีงบประมาณ 2570 จึงสิ้นสุด 30 กันยายน 2570 และเริ่มในปี 2569" }
      - { id: d, text: "1 เมษายน 2570", feedback: "บางประเทศเริ่มปีงบประมาณเดือนเมษายน แต่ของไทยเริ่มเดือนตุลาคม" }
    hints:
      - "ปีงบประมาณของไทยยาวตั้งแต่ตุลาคมถึงกันยายน"
      - "ชื่อปีงบประมาณตามปีที่สิ้นสุด"
    solution: "ปีงบประมาณของไทยคือ 1 ตุลาคมถึง 30 กันยายน และเรียกตามปีที่สิ้นสุด ปีงบประมาณ 2570 จึงเริ่ม 1 ตุลาคม 2569 และสิ้นสุด 30 กันยายน 2570"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-finance.p002
    topics: [management.public.public-finance]
    difficulty: 1
    type: match
    stem: "จับคู่รายจ่ายของโรงเรียนรัฐแห่งหนึ่ง (สมมติ) กับงบรายจ่ายที่ควรอยู่"
    pairs:
      - { left: "เงินเดือนครูและค่าจ้างลูกจ้างประจำ", right: "งบบุคลากร" }
      - { left: "ค่าไฟฟ้า ค่าน้ำประปา และค่ากระดาษ", right: "งบดำเนินงาน" }
      - { left: "ก่อสร้างหอประชุมหลังใหม่", right: "งบลงทุน" }
      - { left: "เงินที่ส่งให้หน่วยงานอื่นนำไปจัดอาหารกลางวันนักเรียน", right: "งบเงินอุดหนุน" }
    hints:
      - "เงินที่จ่ายให้คนทำงานเป็นงบบุคลากร"
      - "สิ่งที่ใช้ได้หลายปีเป็นงบลงทุน ค่าใช้จ่ายที่หมดไปในการทำงานแต่ละวันเป็นงบดำเนินงาน"
    solution: "เงินเดือนและค่าจ้างคืองบบุคลากร ค่าสาธารณูปโภคและวัสดุคืองบดำเนินงาน สิ่งก่อสร้างคืองบลงทุน และเงินที่ให้หน่วยงานอื่นนำไปใช้คืองบเงินอุดหนุน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-finance.p003
    topics: [management.public.public-finance]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นภาษีทางอ้อม"
    choices:
      - { id: a, text: "ภาษีมูลค่าเพิ่มที่บวกในราคาสินค้าที่ร้านสะดวกซื้อ", correct: true }
      - { id: b, text: "ภาษีเงินได้บุคคลธรรมดาที่หักจากเงินเดือน", feedback: "ผู้มีเงินได้รับภาระเองโดยตรง จึงเป็นภาษีทางตรง" }
      - { id: c, text: "ภาษีเงินได้นิติบุคคลจากกำไรของบริษัท", feedback: "บริษัทเสียจากกำไรของตนเอง จึงเป็นภาษีทางตรง" }
      - { id: d, text: "เงินกู้ที่รัฐบาลออกพันธบัตรขาย", feedback: "เงินกู้ไม่ใช่ภาษีและไม่ใช่รายได้ เป็นแหล่งเงินที่ต้องชำระคืน" }
    hints:
      - "ภาษีทางอ้อมผลักภาระไปให้คนอื่นได้"
      - "ผู้ขายเก็บภาษีนี้จากใครแล้วนำส่งรัฐ"
    solution: "ภาษีมูลค่าเพิ่มผู้ขายเป็นผู้นำส่ง แต่ภาระตกอยู่กับผู้ซื้อที่จ่ายในราคาสินค้า จึงเป็นภาษีทางอ้อม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-finance.p004
    topics: [management.public.public-finance]
    difficulty: 2
    type: numeric
    stem: "ประเทศสมมติมีรายจ่าย 3,600,000 ล้านบาท และรายได้ 2,900,000 ล้านบาท ขาดดุลการคลังกี่ล้านบาท"
    answer: { value: 700000, unit: ล้านบาท }
    hints:
      - "ดุลการคลัง = รายได้ − รายจ่าย"
      - "ถ้าติดลบ ขนาดของการขาดดุลคือค่าบวกของผลต่าง"
    misconceptions:
      - { match: 6500000, feedback: "บวกรายได้กับรายจ่าย ต้องหาผลต่าง" }
    solution: "$2{,}900{,}000 - 3{,}600{,}000 = -700{,}000$ ขาดดุล 700,000 ล้านบาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-finance.p005
    topics: [management.public.public-finance]
    difficulty: 2
    type: numeric
    stem: "ต่อจากข้อก่อน ประเทศสมมติขาดดุล 700,000 ล้านบาท และมี GDP 20,000,000 ล้านบาท การขาดดุลคิดเป็นกี่เปอร์เซ็นต์ของ GDP"
    answer: { value: 3.5, unit: "%", tolerance: 0.03 }
    hints:
      - "ร้อยละของ GDP = ขาดดุล ÷ GDP × 100"
      - "ตัวหารคือ GDP ไม่ใช่รายได้หรือรายจ่ายของรัฐ"
    misconceptions:
      - { match: 24.14, feedback: "หารด้วยรายได้ของรัฐ (2,900,000) โจทย์ถามเทียบกับ GDP" }
      - { match: 19.44, feedback: "หารด้วยรายจ่ายของรัฐ (3,600,000) โจทย์ถามเทียบกับ GDP" }
    solution: "$700{,}000 \\div 20{,}000{,}000 \\times 100 = 3.5\\%$ ของ GDP"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-finance.p006
    topics: [management.public.public-finance]
    difficulty: 2
    type: numeric
    stem: "จากภาพงบประมาณของกรมแห่งหนึ่ง (สมมติ) งบลงทุนคิดเป็นกี่เปอร์เซ็นต์ของงบรวม"
    figure:
      src: budget-mix.svg
      alt: "แผนภูมิแท่งแนวนอน งบรวม 1,250 ล้านบาท งบบุคลากร 520 งบดำเนินงาน 310 งบลงทุน 245 งบเงินอุดหนุน 130 งบรายจ่ายอื่น 45 ล้านบาท"
    answer: { value: 19.6, unit: "%", tolerance: 0.05 }
    hints:
      - "ส่วนแบ่ง = งบลงทุน ÷ งบรวม × 100"
      - "งบรวมคือ 1,250 ล้านบาท"
    misconceptions:
      - { match: 47.12, feedback: "หารด้วยงบบุคลากร (520) ต้องหารด้วยงบรวมทั้งหมด" }
    solution: "$245 \\div 1{,}250 \\times 100 = 19.6\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-finance.p007
    topics: [management.public.public-finance]
    difficulty: 2
    type: numeric
    stem: "จากภาพรายได้ของเทศบาลเมืองแห่งหนึ่ง (สมมติ) สัดส่วนพึ่งตนเองทางการคลัง (รายได้ที่จัดเก็บเอง ÷ รายได้ทั้งหมด) เป็นกี่เปอร์เซ็นต์"
    figure:
      src: p-local-revenue.svg
      alt: "แผนภูมิแท่งแนวนอน รายได้ของเทศบาล หน่วยล้านบาท ภาษีที่เทศบาลจัดเก็บเอง 38 ค่าธรรมเนียม ค่าปรับ ใบอนุญาต 7 รายได้จากทรัพย์สิน 5 ภาษีที่รัฐจัดเก็บแล้วจัดสรรให้ 120 เงินอุดหนุนจากรัฐบาล 150"
    answer: { value: 15.63, unit: "%", tolerance: 0.1 }
    hints:
      - "รายได้ที่จัดเก็บเองมีสามรายการแรก"
      - "รายได้ทั้งหมดคือผลรวมทั้งห้ารายการ"
    misconceptions:
      - { match: 11.88, feedback: "นับเฉพาะภาษีที่จัดเก็บเอง (38) ค่าธรรมเนียมและรายได้จากทรัพย์สินก็เป็นรายได้ที่หาเองด้วย" }
      - { match: 84.38, feedback: "นั่นคือสัดส่วนที่มาจากรัฐบาลกลาง ไม่ใช่สัดส่วนที่หาเอง" }
    solution: "จัดเก็บเอง $38 + 7 + 5 = 50$ ล้านบาท รวมทั้งหมด $50 + 120 + 150 = 320$ ล้านบาท สัดส่วน $50 \\div 320 \\times 100 = 15.625\\% \\approx 15.6\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-finance.p008
    topics: [management.public.public-finance]
    difficulty: 3
    type: numeric
    stem: "เทศบาลในภาพปรับปรุงทะเบียนที่ดินจนรายได้ที่จัดเก็บเองทั้งหมดเพิ่มขึ้น 20% ขณะที่ภาษีจัดสรรและเงินอุดหนุนเท่าเดิม สัดส่วนพึ่งตนเองใหม่เป็นกี่เปอร์เซ็นต์"
    figure:
      src: p-local-revenue.svg
      alt: "แผนภูมิแท่งแนวนอน รายได้ของเทศบาล หน่วยล้านบาท ภาษีที่เทศบาลจัดเก็บเอง 38 ค่าธรรมเนียม ค่าปรับ ใบอนุญาต 7 รายได้จากทรัพย์สิน 5 ภาษีที่รัฐจัดเก็บแล้วจัดสรรให้ 120 เงินอุดหนุนจากรัฐบาล 150"
    answer: { value: 18.18, unit: "%", tolerance: 0.1 }
    hints:
      - "รายได้ที่จัดเก็บเองใหม่ = 50 × 1.2"
      - "รายได้ทั้งหมดก็เพิ่มขึ้นด้วย ไม่ใช่ 320 เท่าเดิม"
    misconceptions:
      - { match: 18.75, feedback: "หารด้วยรายได้ทั้งหมดเดิม (320) แต่รายได้ทั้งหมดเพิ่มเป็น 330 ด้วย" }
      - { match: 35.63, feedback: "บวก 20 จุดเปอร์เซ็นต์เข้ากับสัดส่วนเดิม รายได้ที่เพิ่ม 20% ไม่ได้ทำให้สัดส่วนเพิ่ม 20 จุด" }
    solution: "จัดเก็บเองใหม่ $50 \\times 1.2 = 60$ ล้านบาท รวมทั้งหมด $60 + 120 + 150 = 330$ ล้านบาท สัดส่วน $60 \\div 330 \\times 100 \\approx 18.18\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-finance.p009
    topics: [management.public.public-finance]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนของงบประมาณรายจ่ายประจำปีของรัฐบาลไทยจากก่อนไปหลัง"
    items:
      - "ส่วนราชการเสนอคำของบประมาณ"
      - "สำนักงบประมาณวิเคราะห์และจัดทำร่างเสนอคณะรัฐมนตรี"
      - "สภาผู้แทนราษฎรพิจารณาร่างพระราชบัญญัติงบประมาณ"
      - "วุฒิสภาพิจารณาร่างพระราชบัญญัติงบประมาณ"
      - "ประกาศใช้เป็นพระราชบัญญัติงบประมาณรายจ่ายประจำปี"
      - "ส่วนราชการใช้จ่ายและเบิกจ่ายตั้งแต่ 1 ตุลาคม"
      - "รายงานผลตามตัวชี้วัดและตรวจสอบการใช้เงิน"
    hints:
      - "วงจรมีสี่ขั้น จัดทำ อนุมัติ บริหาร ติดตามและตรวจสอบ"
      - "ในรัฐสภา สภาผู้แทนราษฎรพิจารณาก่อนวุฒิสภา"
    solution: "จัดทำ (คำขอ → สำนักงบประมาณ → ครม.) → อนุมัติ (สภาผู้แทนราษฎร → วุฒิสภา → ประกาศใช้) → บริหารงบประมาณตั้งแต่ต้นปีงบประมาณ → ติดตาม ประเมินผล และตรวจสอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-finance.p010
    topics: [management.public.public-finance]
    difficulty: 3
    type: mcq
    stem: "โครงการป้องกันโรคไข้เลือดออกของอำเภอแห่งหนึ่ง (สมมติ) ข้อใดเป็นตัวชี้วัด **ผลลัพธ์** ไม่ใช่ผลผลิต"
    choices:
      - { id: a, text: "อัตราผู้ป่วยไข้เลือดออกต่อประชากรแสนคนลดลงจากปีก่อน", correct: true }
      - { id: b, text: "จำนวนครัวเรือนที่อาสาสมัครเข้าไปสำรวจลูกน้ำยุงลาย", feedback: "นี่คือสิ่งที่โครงการทำเสร็จ จึงเป็นผลผลิต" }
      - { id: c, text: "จำนวนทรายกำจัดลูกน้ำที่แจกไป", feedback: "นี่คือสิ่งที่โครงการทำเสร็จ จึงเป็นผลผลิต" }
      - { id: d, text: "เบิกจ่ายงบประมาณได้ 100% ภายในกำหนด", feedback: "เป็นตัวชี้วัดการบริหารงบ ไม่ได้บอกว่าประชาชนป่วยน้อยลงหรือไม่" }
    hints:
      - "ผลผลิตคือสิ่งที่หน่วยงานทำ ผลลัพธ์คือสิ่งที่เปลี่ยนไปในชีวิตประชาชน"
      - "ข้อใดบอกว่าปัญหาที่ตั้งใจแก้ดีขึ้นจริง"
    solution: "เป้าหมายของโครงการคือคนป่วยน้อยลง อัตราผู้ป่วยที่ลดลงจึงเป็นผลลัพธ์ ส่วนจำนวนบ้านที่สำรวจหรือทรายที่แจกเป็นผลผลิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-finance.p011
    topics: [management.public.public-finance]
    difficulty: 3
    type: numeric
    stem: "โครงการฝึกอาชีพของจังหวัดแห่งหนึ่ง (สมมติ) ใช้งบ 2,400,000 บาท ฝึกคนได้ 300 คน และมีผู้ได้งานภายใน 6 เดือน 180 คน ต้นทุนต่อผู้ได้งานหนึ่งคนเป็นกี่บาท"
    answer: { value: 13333.33, unit: บาท, tolerance: 1 }
    hints:
      - "ต้นทุนต่อหน่วยผลลัพธ์ = งบ ÷ จำนวนผลลัพธ์"
      - "ผลลัพธ์ในข้อนี้คือคนที่ได้งาน"
    misconceptions:
      - { match: 8000, feedback: "นั่นคือต้นทุนต่อคนที่ฝึก (ผลผลิต) โจทย์ถามต่อคนที่ได้งาน (ผลลัพธ์)" }
    solution: "$2{,}400{,}000 \\div 180 \\approx 13{,}333.33$ บาทต่อผู้ได้งานหนึ่งคน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-finance.p012
    topics: [management.public.public-finance]
    difficulty: 4
    type: numeric
    stem: "งบด้านสาธารณสุขขององค์การบริหารส่วนจังหวัดแห่งหนึ่ง (สมมติ) เพิ่มจาก 84 ล้านบาทเป็น 90 ล้านบาท ในปีที่เงินเฟ้อ 2.5% งบเพิ่มขึ้นจริง (หักเงินเฟ้อแล้ว) กี่เปอร์เซ็นต์"
    answer: { value: 4.53, unit: "%", tolerance: 0.05 }
    hints:
      - "อัตราเพิ่มแท้จริง = งบปีนี้ ÷ (1.025 × งบปีก่อน) − 1"
      - "อย่าลบ 2.5 จากอัตราเพิ่มตามตัวเงินตรง ๆ"
    misconceptions:
      - { match: 7.14, feedback: "นั่นคืออัตราเพิ่มตามตัวเงิน ยังไม่ได้หักเงินเฟ้อ" }
      - { match: 4.64, feedback: "ลบ 2.5 ตรง ๆ จาก 7.14 ได้ค่าประมาณ ต้องหารด้วย 1.025" }
    solution: "$\\dfrac{90}{1.025 \\times 84} - 1 = \\dfrac{90}{86.1} - 1 \\approx 0.0453$ เพิ่มจริงประมาณ $4.53\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.public.public-finance.p013
    topics: [management.public.public-finance]
    difficulty: 4
    type: numeric
    stem: "ประเทศสมมติแห่งที่สองมีหนี้สาธารณะ 9,000,000 ล้านบาท GDP 15,000,000 ล้านบาท ปีนี้ขาดดุล 600,000 ล้านบาทและกู้มาชดเชยทั้งหมด ส่วน GDP โต 4% (ตามตัวเงิน) หนี้ต่อ GDP ณ สิ้นปีเป็นกี่เปอร์เซ็นต์"
