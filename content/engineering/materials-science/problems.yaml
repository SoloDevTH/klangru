    stem: "โลหะชนิดหนึ่งมีมวลอะตอม $92.91\\ \\mathrm{g/mol}$ รัศมีอะตอม $0.143\\ \\mathrm{nm}$ วัดความหนาแน่นได้ $8.57\\ \\mathrm{g/cm^3}$ และมีโครงสร้างลูกบาศก์แบบใดแบบหนึ่ง โครงสร้างผลึกน่าจะเป็นแบบใด"
    choices:
