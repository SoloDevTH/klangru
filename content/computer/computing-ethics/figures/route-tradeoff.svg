<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300"><title>เส้นทางสั้นผ่านซอยชุมชนที่ระบบเลือก เทียบกับเส้นทางถนนใหญ่ที่ยาวกว่า</title><rect width="720" height="300" fill="#ffffff"/><text x="360" y="28" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="normal">ความเร็วกับความปลอดภัยของชุมชนอาจขัดกัน</text><path d="M 110 190 C 230 70 490 70 610 190" fill="none" stroke="#2563eb" stroke-width="3"/><text x="360" y="88" font-family="sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">ถนนใหญ่ (ยาวกว่า)</text><rect x="250" y="160" width="220" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="360" y="186" font-family="sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="bold">ซอยชุมชนแคบ</text><text x="360" y="206" font-family="sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="normal">มีเด็กและคนเดินเท้า</text><path d="M 110 190 L 250 190" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8,5"/><path d="M 470 190 L 610 190" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8,5"/><circle cx="110" cy="190" r="8" fill="#1f2937" stroke="none"/><circle cx="610" cy="190" r="8" fill="#1f2937" stroke="none"/><text x="110" y="222" font-family="sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal">จุดเริ่ม</text><text x="610" y="222" font-family="sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal">จุดหมาย</text><text x="360" y="262" font-family="sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="normal">เส้นประสีแดงคือเส้นทางสั้นที่ระบบแนะนำ ผ่านซอยชุมชน</text></svg>
