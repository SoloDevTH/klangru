  - id: biology.cells.diffusion-osmosis.p016
    topics: [biology.cells.diffusion-osmosis]
    difficulty: 5
    type: numeric
    stem: "แช่แท่งมันฝรั่งในน้ำเกลือเข้มข้นต่าง ๆ ได้ผลดังนี้ (ข้อมูลสมมติ) 0% มวลเพิ่ม 10%, 1% มวลเพิ่ม 2%, 2% มวลลด 6%, 3% มวลลด 12% ถ้าการเปลี่ยนแปลงระหว่างสองความเข้มข้นที่ติดกันเป็นเส้นตรง น้ำเกลือเข้มข้นร้อยละเท่าไรที่มวลมันฝรั่งไม่เปลี่ยน"
    answer: { value: 1.25, tolerance: 0.03, unit: "%" }
    hints:
      - "มวลเปลี่ยนจากเพิ่มเป็นลดระหว่างความเข้มข้นใดกับความเข้มข้นใด"
      - "จาก 1% ถึง 2% การเปลี่ยนแปลงลดลงจาก +2 ถึง −6 รวม 8 หน่วย ต้องลดเพียง 2 หน่วยจึงถึงศูนย์"
    misconceptions:
      - { match: 1.5, feedback: "เลือกกึ่งกลางระหว่าง 1% กับ 2% แต่ +2 อยู่ใกล้ศูนย์กว่า −6 จุดที่ไม่เปลี่ยนจึงใกล้ 1% มากกว่า" }
      - { match: 2, feedback: "ที่ 2% มวลลดลงแล้ว จุดที่มวลไม่เปลี่ยนอยู่ก่อนหน้านั้น" }
    solution: "มวลเปลี่ยนจาก +2% เป็น −6% ระหว่าง 1% กับ 2% ลดลงรวม 8 หน่วย ต้องลด 2 หน่วยจึงถึงศูนย์ คือ $\\frac{2}{8} = 0.25$ ของช่วง ความเข้มข้น $= 1 + 0.25 \\times 1 = 1.25\\%$ ที่ความเข้มข้นนี้น้ำเข้าและออกจากเซลล์มันฝรั่งเท่ากัน"
