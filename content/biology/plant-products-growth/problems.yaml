      - { id: b, text: "ปลูกผักกาดในเดือนธันวาคมและเดือนเมษายน แล้วเทียบความสูง", feedback: "สองเดือนนี้ต่างกันทั้งอุณหภูมิ แสง ความชื้น และปริมาณฝน จึงสรุปไม่ได้ว่าผลเกิดจากอุณหภูมิ" }
