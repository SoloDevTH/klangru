id: english.grammar.adjectives-comparison
subject: english
title: { th: "คำคุณศัพท์ ขั้นกว่า และขั้นสุด", en: "Adjectives, comparatives and superlatives" }
summary: วางคำคุณศัพท์ให้ถูกที่ ทำขั้นกว่า -er/more กับ than ขั้นสุด the -est/the most รูปไม่ตามกฎ good bad และ as...as เพื่อเปรียบเทียบสิ่งของ คน และสถานที่
difficulty: 3
minutes: 35
prerequisites: [english.grammar.be-have-there]
encompasses:
  - { id: english.grammar.be-have-there, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: heights.svg
    alt: "เด็กสามคนยืนเรียงกันข้างไม้วัดความสูงหน่วยเซนติเมตร Ploy สูง 140 cm ใต้ชื่อเขียนว่า tall Mali สูง 147 cm เขียนว่า taller Ken สูง 152 cm เขียนว่า the tallest"
    caption: "tall → taller → the tallest"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.grammar.adjectives-comparison.p004, prompt: "h-o-t ต้องซ้ำตัวท้ายก่อนเติม -er หรือไม่" }
  - type: figure
    src: fruit-prices.svg
    alt: "กราฟแท่งราคาผลไม้ต่อกิโลกรัม (ราคาสมมุติ) durian 160 บาท mango 50 บาท watermelon 25 บาท rambutan 40 บาท"
    caption: "ราคาผลไม้ต่อกิโลกรัมที่แผงหนึ่ง (ราคาสมมุติ) ใช้ในตัวอย่างและโจทย์"
  - type: worked-example
    title: เลือก -er หรือ more
    problem: "เติมขั้นกว่า: *A motorbike is ___ (cheap) than a car, but a car is ___ (comfortable).*"
    steps:
      - text: "cheap มีพยางค์เดียว เติม -er: ***cheaper** than*"
      - text: "นับพยางค์ comfortable: com-fort-a-ble มี 4 พยางค์"
      - text: "คำยาวใช้ more: ***more comfortable***"
        why: "เติม -er กับคำยาวจะอ่านยาก ภาษาอังกฤษจึงใช้ more แทน"
      - text: "ประโยคที่สองไม่ต้องมี than เพราะรู้แล้วว่าเทียบกับ motorbike"
    answer: "*A motorbike is **cheaper** than a car, but a car is **more comfortable**.*"
  - { type: check, problem: english.grammar.adjectives-comparison.p012, prompt: "โครงสร้าง as ... as" }
  - type: worked-example
    title: เขียนย่อหน้าเปรียบเทียบพร้อมความเห็น
    problem: "ใช้กราฟราคาผลไม้ เขียน 3 ประโยค เปรียบเทียบ และบอกว่าชอบผลไม้อะไรเพราะอะไร"
    steps:
      - text: "ขั้นสุดเทียบทั้งสี่อย่าง: *Durian is the most expensive fruit of the four.*"
      - text: "ขั้นกว่าเทียบสองอย่าง: *Rambutan is cheaper than mango.* (40 < 50 บาท)"
      - text: "เท่ากันหรือไม่เท่ากัน: *Watermelon is not as expensive as rambutan.* (25 < 40 บาท)"
      - text: "บอกความเห็นพร้อมเหตุผลด้วย because: *I like mango the best because it is sweet and not very expensive.*"
        why: "ตัวชี้วัดให้เปรียบเทียบและแสดงความคิดเห็น การให้เหตุผลทำให้ความเห็นมีน้ำหนัก"
    answer: "*Durian is the most expensive fruit of the four. Rambutan is cheaper than mango, and watermelon is not as expensive as rambutan. I like mango the best because it is sweet and not very expensive.*"
glossary:
  - { term: adjective (คำคุณศัพท์), definition: "คำที่บอกลักษณะของคำนาม วางหน้าคำนามหรือหลัง be" }
  - { term: comparative (ขั้นกว่า), definition: "รูปที่ใช้เทียบสองสิ่ง เติม -er หรือใช้ more และตามด้วย than" }
  - { term: superlative (ขั้นสุด), definition: "รูปที่ใช้เทียบตั้งแต่สามสิ่ง the + -est หรือ the most" }
  - { term: as ... as, definition: "เท่ากับ ใช้คำคุณศัพท์รูปเดิม not as ... as แปลว่า ไม่เท่า" }
  - { term: irregular (ไม่ตามกฎ), definition: "รูปที่ต้องจำ เช่น good better best, bad worse worst" }
flashcards:
  - { front: "big / happy / expensive ขั้นกว่า", back: "bigger / happier / more expensive" }
  - { front: "good และ bad ขั้นสุด", back: "the best / the worst" }
  - { front: "\"สูงที่สุดในห้อง\"", back: "the tallest in the class (ต้องมี the)" }
  - { front: "taller ___ (than / then)", back: "than (กว่า) · then แปลว่า แล้วก็" }
  - { front: "Ploy is not as tall as Ken. ใครสูงกว่า", back: "Ken สูงกว่า" }
