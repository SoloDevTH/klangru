id: business.finance.capital-budgeting
subject: business
title:
  th: 'การประเมินโครงการลงทุน: ระยะคืนทุน NPV และ IRR'
  en: 'Capital budgeting: payback, NPV and IRR'
summary: กระแสเงินสดส่วนเพิ่มของโครงการ ระยะคืนทุนและแบบคิดลด NPV IRR และ PI ความขัดแย้งของเกณฑ์ เงินลงทุนจำกัด WACC เป็นอัตราคิดลด ความไว การประเมินมูลค่ากิจการ และต้นทุน-ผลประโยชน์
difficulty: 7
minutes: 50
prerequisites:
- business.finance.sources-of-funds
- business.finance.financial-ratios
