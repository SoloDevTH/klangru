problems:
  - id: math.linalg.matrix-inverse.p001
    topics: [math.linalg.matrix-inverse]
    difficulty: 1
    type: mcq
    stem: "การหาเมทริกซ์ผกผันของ $A$ ขนาด $3 \\times 3$ ด้วยวิธีเกาส์–จอร์แดน เริ่มและจบด้วยเมทริกซ์แต่งเติมแบบใด"
    choices:
      - { id: a, text: "เริ่มจาก $[A \\mid I]$ จบที่ $[I \\mid A^{-1}]$", correct: true }
      - { id: b, text: "เริ่มจาก $[I \\mid A]$ จบที่ $[A^{-1} \\mid I]$", feedback: "ต้องทำการดำเนินการตามแถวให้ $A$ กลายเป็น $I$ ดังนั้น $A$ ต้องอยู่ด้านที่เราลดรูป และสิ่งที่เกิดกับ $I$ อีกด้านคือ $A^{-1}$" }
      - { id: c, text: "เริ่มจาก $[A \\mid \\mathbf{b}]$ จบที่ $[I \\mid A^{-1}]$", feedback: "$[A \\mid \\mathbf{b}]$ ให้คำตอบของระบบหนึ่งระบบ ไม่ได้ให้ตัวผกผันทั้งเมทริกซ์" }
      - { id: d, text: "กลับเศษเป็นส่วนของสมาชิกทุกตัวของ $A$", feedback: "ตัวผกผันของเมทริกซ์ไม่ได้หาจากส่วนกลับของแต่ละสมาชิก ต้องให้ $AA^{-1} = I$" }
    hints:
      - "เป้าหมายคือให้ด้านที่เป็น $A$ กลายเป็น $I$"
      - "การดำเนินการชุดเดียวกันที่เปลี่ยน $A$ เป็น $I$ จะเปลี่ยน $I$ เป็นอะไร"
    solution: "เขียน $[A \\mid I]$ แล้วใช้การดำเนินการตามแถวจนด้านซ้ายเป็น $I$ การดำเนินการทั้งหมดเท่ากับคูณด้วย $A^{-1}$ ทางซ้าย ด้านขวาจึงกลายเป็น $A^{-1}I = A^{-1}$ ได้ $[I \\mid A^{-1}]$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p002
    topics: [math.linalg.matrix-inverse]
    difficulty: 1
    type: numeric
    stem: "ให้ $A^{-1} = \\begin{pmatrix} 1 & 0 & 2 \\\\ 0 & 1 & -1 \\\\ 1 & 1 & 0 \\end{pmatrix}$ และ $A\\mathbf{x} = \\mathbf{b}$ เมื่อ $\\mathbf{b} = \\begin{pmatrix} 1 \\\\ 2 \\\\ 3 \\end{pmatrix}$ จงหาค่า $x_1$ (สมาชิกตัวแรกของ $\\mathbf{x}$)"
    answer: { value: 7 }
    misconceptions:
      - { match: 4, feedback: "นี่คือสมาชิกแรกของ $\\mathbf{b}^TA^{-1}$ (นำ $\\mathbf{b}$ ไปคูณทางซ้าย) คำตอบคือ $\\mathbf{x} = A^{-1}\\mathbf{b}$ ใช้แถวของ $A^{-1}$ คูณกับ $\\mathbf{b}$" }
    hints:
      - "คูณ $A^{-1}$ ทางซ้ายทั้งสองข้าง: $\\mathbf{x} = A^{-1}\\mathbf{b}$"
      - "$x_1$ = แถวแรกของ $A^{-1}$ คูณจุดกับ $\\mathbf{b}$"
    solution: "$\\mathbf{x} = A^{-1}\\mathbf{b}$ แถวแรก: $1(1) + 0(2) + 2(3) = 7$ (ทั้งเวกเตอร์คือ $\\mathbf{x} = (7, -1, 3)$) จึง $x_1 = 7$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p003
    topics: [math.linalg.matrix-inverse]
    difficulty: 2
    type: numeric
    stem: "ให้ $U = \\begin{pmatrix} 1 & 2 & 0 \\\\ 0 & 1 & 3 \\\\ 0 & 0 & 1 \\end{pmatrix}$ จงหาสมาชิกแถวที่ 1 หลักที่ 3 ของ $U^{-1}$"
    answer: { value: 6 }
    misconceptions:
      - { match: 0, feedback: "การเปลี่ยนเครื่องหมายสมาชิกเหนือเส้นทแยงมุมใช้ได้เฉพาะบางกรณี ต้องทำเกาส์–จอร์แดนจริง เพราะการกำจัด $R_1 - 2R_2$ ทำให้ช่องนี้ไม่เป็นศูนย์" }
      - { match: -6, feedback: "ตรวจเครื่องหมายอีกครั้ง: หลังทำ $R_2 - 3R_3$ ช่องแถว 2 หลัก 3 เป็น $-3$ แล้ว $R_1 - 2R_2$ ได้ $0 - 2(-3) = 6$" }
    hints:
      - "เขียน $[U \\mid I]$ เมทริกซ์เป็นสามเหลี่ยมบนอยู่แล้ว เหลือกำจัดเหนือเส้นทแยงมุมจากหลักขวาสุด"
      - "ทำ $R_2 - 3R_3$ ก่อน แล้วจึงทำ $R_1 - 2R_2$"
    solution: "$[U \\mid I]$: $R_2 - 3R_3$ ได้แถวสอง $(0, 1, 0 \\mid 0, 1, -3)$ จากนั้น $R_1 - 2R_2$ ได้แถวแรก $(1, 0, 0 \\mid 1, -2, 6)$ จึง $U^{-1} = \\begin{pmatrix} 1 & -2 & 6 \\\\ 0 & 1 & -3 \\\\ 0 & 0 & 1 \\end{pmatrix}$ สมาชิกแถว 1 หลัก 3 คือ **6** ตรวจ: แถวแรกของ $U$ คูณหลักที่สามของ $U^{-1}$ ได้ $1(6) + 2(-3) + 0 = 0$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p004
    topics: [math.linalg.matrix-inverse]
    difficulty: 2
    type: mcq
    stem: "นักเรียนทำเกาส์–จอร์แดนกับ $[A \\mid I]$ เมื่อ $A = \\begin{pmatrix} 1 & 2 & 3 \\\\ 2 & 4 & 7 \\\\ 3 & 6 & 10 \\end{pmatrix}$ หลังทำ $R_2 - 2R_1$, $R_3 - 3R_1$ แล้ว $R_3 - R_2$ ด้านซ้ายได้แถว $(1, 2, 3)$, $(0, 0, 1)$, $(0, 0, 0)$ ข้อสรุปใดถูกต้อง"
    choices:
      - { id: a, text: "$A$ ไม่มีตัวผกผัน เพราะด้านซ้ายมีแถวศูนย์ ($\\det A = 0$)", correct: true }
      - { id: b, text: "สลับแถวสองกับแถวสามแล้วทำต่อ จะได้ $A^{-1}$", feedback: "การสลับแถวไม่ทำให้แถวศูนย์หายไป ด้านซ้ายจะไม่มีวันกลายเป็น $I$" }
      - { id: c, text: "$A^{-1}$ คือเมทริกซ์ศูนย์", feedback: "$A \\cdot 0 = 0 \\ne I$ เมทริกซ์ศูนย์ไม่ใช่ตัวผกผันของเมทริกซ์ใดเลย" }
      - { id: d, text: "$A$ มีตัวผกผัน เพราะสมาชิกทุกตัวของ $A$ ไม่เป็นศูนย์", feedback: "การมีตัวผกผันขึ้นกับดีเทอร์มิแนนต์ ไม่ใช่สมาชิกแต่ละตัว ที่นี่หลักที่สองเป็น 2 เท่าของหลักแรก" }
    hints:
      - "เป้าหมายคือทำด้านซ้ายให้เป็น $I$ แถวที่เป็นศูนย์ทั้งแถวจะกลายเป็นแถวของ $I$ ได้หรือไม่"
      - "สังเกตว่าหลักที่สองของ $A$ เป็นสองเท่าของหลักแรก"
    solution: "แถวศูนย์ด้านซ้ายแปลว่าการดำเนินการตามแถวทำให้เป็น $I$ ไม่ได้ $A$ จึงเป็นเมทริกซ์เอกฐาน ตรวจได้จาก $\\det A = 1(40 - 42) - 2(20 - 21) + 3(12 - 12) = -2 + 2 + 0 = 0$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p005
    topics: [math.linalg.matrix-inverse]
    difficulty: 2
    type: numeric
    stem: "ให้ $A^{-1} = \\begin{pmatrix} 1 & 2 \\\\ 0 & 1 \\end{pmatrix}$ และ $B^{-1} = \\begin{pmatrix} 3 & 0 \\\\ 1 & 1 \\end{pmatrix}$ จงหาสมาชิกแถวที่ 1 หลักที่ 2 ของ $(AB)^{-1}$"
    answer: { value: 6 }
    misconceptions:
      - { match: 2, feedback: "นี่คือสมาชิกของ $A^{-1}B^{-1}$ แต่ $(AB)^{-1} = B^{-1}A^{-1}$ ลำดับกลับกัน" }
    hints:
      - "$(AB)^{-1} = B^{-1}A^{-1}$ ไม่ใช่ $A^{-1}B^{-1}$"
      - "สมาชิกแถว 1 หลัก 2 = แถวแรกของ $B^{-1}$ คูณจุดกับหลักที่สองของ $A^{-1}$"
    solution: "$(AB)^{-1} = B^{-1}A^{-1} = \\begin{pmatrix} 3 & 0 \\\\ 1 & 1 \\end{pmatrix}\\begin{pmatrix} 1 & 2 \\\\ 0 & 1 \\end{pmatrix} = \\begin{pmatrix} 3 & 6 \\\\ 1 & 3 \\end{pmatrix}$ สมาชิกแถว 1 หลัก 2 คือ $3(2) + 0(1) = 6$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p006
    topics: [math.linalg.matrix-inverse]
    difficulty: 3
    type: numeric
    stem: "จงหาเมทริกซ์ผกผันของ $C = \\begin{pmatrix} 2 & 1 & 0 \\\\ 1 & 1 & 1 \\\\ 0 & 1 & 3 \\end{pmatrix}$ ด้วยวิธีเกาส์–จอร์แดน แล้วตอบสมาชิกแถวที่ 2 หลักที่ 2 ของ $C^{-1}$"
    answer: { value: 6 }
    misconceptions:
      - { match: 1, feedback: "ตัวผกผันไม่ใช่ส่วนกลับของสมาชิกในตำแหน่งเดียวกัน ($\\tfrac11 = 1$) ต้องทำการดำเนินการตามแถวกับ $[C \\mid I]$" }
    hints:
      - "สลับ $R_1$ กับ $R_2$ ให้ตัวนำเป็น 1 ก่อน หรือเริ่มจาก $R_2 - \\tfrac12R_1$ ก็ได้"
      - "$\\det C = 1$ ตัวผกผันจึงมีสมาชิกเป็นจำนวนเต็มทั้งหมด ใช้ตรวจได้ว่าคำนวณผิดหรือไม่"
    solution: "สลับ $R_1 \\leftrightarrow R_2$ แล้วกำจัดทีละหลัก จนได้ $C^{-1} = \\begin{pmatrix} 2 & -3 & 1 \\\\ -3 & 6 & -2 \\\\ 1 & -2 & 1 \\end{pmatrix}$ ตรวจแถวที่สองของ $C$ คูณหลักที่สองของ $C^{-1}$: $1(-3) + 1(6) + 1(-2) = 1$ และแถวแรกของ $C$ คูณหลักที่สอง: $2(-3) + 1(6) + 0 = 0$ ถูกต้อง สมาชิกแถว 2 หลัก 2 คือ **6**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p007
    topics: [math.linalg.matrix-inverse]
    difficulty: 3
    type: numeric
    stem: "จงหาค่า $k$ ที่ทำให้ $\\begin{pmatrix} 1 & 1 & 1 \\\\ 1 & 2 & 3 \\\\ 1 & 3 & k \\end{pmatrix}$ ไม่มีเมทริกซ์ผกผัน"
    answer: { value: 5 }
    misconceptions:
      - { match: 3.667, feedback: "ลืมเครื่องหมายลบของพจน์กลางเมื่อกระจายตามแถวแรก ได้ $3k - 11 = 0$ ที่ถูกคือ $(2k - 9) - (k - 3) + 1 = k - 5$" }
    hints:
      - "ไม่มีตัวผกผันเมื่อ $\\det = 0$ หรือเมื่อการกำจัดได้แถวศูนย์"
      - "$R_2 - R_1 = (0, 1, 2)$ และ $R_3 - R_1 = (0, 2, k - 1)$ แล้วกำจัดต่อ"
    solution: "$R_2 - R_1 = (0, 1, 2)$, $R_3 - R_1 = (0, 2, k - 1)$ แล้ว $R_3 - 2R_2 = (0, 0, k - 5)$ แถวนี้เป็นศูนย์เมื่อ $k = 5$ (ตรงกับ $\\det = 1(2k - 9) - 1(k - 3) + 1(3 - 2) = k - 5$) จึง $k = 5$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p008
    topics: [math.linalg.matrix-inverse]
    difficulty: 3
    type: numeric
    stem: "ใช้กฎของคราเมอร์หาค่า $y$ จากระบบ $x + y + z = 6$, $2x - y + z = 3$, $x + 2y - z = 2$"
    answer: { value: 2 }
    misconceptions:
      - { match: 14, feedback: "นี่คือ $\\det A_y$ อย่างเดียว ต้องหารด้วย $\\det A = 7$" }
      - { match: 0.5, feedback: "กลับเศษเป็นส่วน สูตรคือ $y = \\det A_y / \\det A$" }
    hints:
      - "$\\det A = \\begin{vmatrix} 1 & 1 & 1 \\\\ 2 & -1 & 1 \\\\ 1 & 2 & -1 \\end{vmatrix}$"
      - "$A_y$ คือ $A$ ที่แทนหลักที่สองด้วย $(6, 3, 2)$"
    solution: "$\\det A = 1(1 - 2) - 1(-2 - 1) + 1(4 + 1) = -1 + 3 + 5 = 7$ และ $\\det A_y = \\begin{vmatrix} 1 & 6 & 1 \\\\ 2 & 3 & 1 \\\\ 1 & 2 & -1 \\end{vmatrix} = 1(-3 - 2) - 6(-2 - 1) + 1(4 - 3) = -5 + 18 + 1 = 14$ จึง $y = \\tfrac{14}{7} = 2$ (คำตอบทั้งหมด $(1, 2, 3)$ ตรวจ: $1 + 2 + 3 = 6$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p009
    topics: [math.linalg.matrix-inverse]
    difficulty: 3
    type: numeric
    stem: "ให้ $D = \\begin{pmatrix} 2 & 1 & 1 \\\\ 1 & 3 & 2 \\\\ 1 & 0 & 1 \\end{pmatrix}$ ซึ่งมี $\\det D = 4$ จงใช้สูตร $D^{-1} = \\dfrac{1}{\\det D}\\operatorname{adj} D$ หาสมาชิกแถวที่ 2 หลักที่ 3 ของ $D^{-1}$ (ตอบเป็นทศนิยม)"
    answer: { value: -0.75, tolerance: 0.001 }
    misconceptions:
      - { match: 0.25, feedback: "นี่คือ $C_{23}/\\det D$ ลืมสลับเปลี่ยน สมาชิกแถว 2 หลัก 3 ของ $\\operatorname{adj} D$ คือ $C_{32}$" }
      - { match: -3, feedback: "ได้ $C_{32} = -3$ ถูกแล้ว แต่ยังไม่ได้หารด้วย $\\det D = 4$" }
    hints:
      - "$\\operatorname{adj} D = C^T$ สมาชิก $(2, 3)$ ของ $\\operatorname{adj} D$ คือตัวประกอบร่วมเกี่ยว $C_{32}$"
      - "$C_{32} = (-1)^{3+2}M_{32}$ โดย $M_{32}$ ตัดแถว 3 หลัก 2 ออก"
    solution: "$M_{32} = \\begin{vmatrix} 2 & 1 \\\\ 1 & 2 \\end{vmatrix} = 3$ จึง $C_{32} = (-1)^5(3) = -3$ สมาชิก $(2, 3)$ ของ $D^{-1}$ คือ $\\tfrac{C_{32}}{\\det D} = -\\tfrac34 = -0.75$ ตรวจ: แถวที่สองของ $D^{-1}$ คือ $(\\tfrac14, \\tfrac14, -\\tfrac34)$ คูณหลักที่สามของ $D$ $(1, 2, 1)$ ได้ $\\tfrac14 + \\tfrac12 - \\tfrac34 = 0$ ถูกต้อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p010
    topics: [math.linalg.matrix-inverse]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการหา $A^{-1}$ ของเมทริกซ์ $3 \\times 3$ ด้วยวิธีเกาส์–จอร์แดน"
    items:
      - "เขียนเมทริกซ์แต่งเติม $[A \\mid I]$"
      - "กำจัดสมาชิกใต้เส้นทแยงมุมทีละหลักจากซ้ายไปขวา"
      - "หารแต่ละแถวให้ตัวบนเส้นทแยงมุมเป็น 1"
      - "กำจัดสมาชิกเหนือเส้นทแยงมุมจากหลักขวาสุดย้อนขึ้น"
      - "อ่าน $A^{-1}$ จากด้านขวา แล้วตรวจ $AA^{-1} = I$"
    hints:
      - "ทำให้เป็นรูปขั้นบันไดก่อน แล้วจึงทำให้ด้านซ้ายเป็น $I$"
      - "การตรวจทำหลังได้ผลลัพธ์แล้ว"
    solution: "$[A \\mid I]$ → กำจัดใต้เส้นทแยงมุม → ทำตัวนำให้เป็น 1 → กำจัดเหนือเส้นทแยงมุม → อ่าน $A^{-1}$ และตรวจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p011
    topics: [math.linalg.matrix-inverse]
    difficulty: 4
    type: numeric
    stem: "ร้านเบเกอรี่แห่งหนึ่งในเชียงใหม่ทำขนมสามเมนู ใช้วัตถุดิบต่อหนึ่งรอบการอบตามตารางในภาพ (ค่าสมมติ) สัปดาห์หนึ่งใช้แป้ง 16 kg เนย 14 kg และน้ำตาล 18 kg พอดี เจ้าของทราบว่า $\\begin{pmatrix} 2 & 1 & 1 \\\\ 1 & 2 & 1 \\\\ 1 & 1 & 2 \\end{pmatrix}^{-1} = \\dfrac14\\begin{pmatrix} 3 & -1 & -1 \\\\ -1 & 3 & -1 \\\\ -1 & -1 & 3 \\end{pmatrix}$ สัปดาห์นี้อบเค้กกล้วยหอมกี่รอบ"
    figure:
      src: p-bakery-recipe.svg
      alt: "ตารางสูตรขนม แถวคือวัตถุดิบ หลักคือเมนู ขนมปังเนยสดใช้แป้ง 2 kg เนย 1 kg น้ำตาล 1 kg ครัวซองต์ใช้แป้ง 1 kg เนย 2 kg น้ำตาล 1 kg เค้กกล้วยหอมใช้แป้ง 1 kg เนย 1 kg น้ำตาล 2 kg ต่อหนึ่งรอบการอบ (ค่าสมมติ)"
    answer: { value: 6, unit: รอบ }
    misconceptions:
      - { match: 24, feedback: "ลืมคูณ $\\tfrac14$ ที่อยู่หน้าเมทริกซ์" }
      - { match: 4, feedback: "นี่คือจำนวนรอบของขนมปังเนยสด (แถวแรกของ $A^{-1}$) เค้กกล้วยหอมใช้แถวที่สาม" }
    hints:
      - "ให้ $\\mathbf{x} = (x_1, x_2, x_3)$ เป็นจำนวนรอบของสามเมนู ระบบคือ $A\\mathbf{x} = (16, 14, 18)$"
      - "จำนวนรอบเค้ก $x_3$ = แถวที่สามของ $A^{-1}$ คูณจุดกับ $\\mathbf{b}$"
    solution: "$x_3 = \\tfrac14(-16 - 14 + 3 \\cdot 18) = \\tfrac14(24) = 6$ รอบ (ทั้งหมด $\\mathbf{x} = (4, 2, 6)$ ตรวจแป้ง: $2(4) + 2 + 6 = 16$ เนย: $4 + 4 + 6 = 14$ น้ำตาล: $4 + 2 + 12 = 18$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p012
    topics: [math.linalg.matrix-inverse]
    difficulty: 4
    type: numeric
    stem: "ร้านเบเกอรี่เดียวกับข้อก่อน (สูตรในภาพ ค่าสมมติ) สัปดาห์ถัดมาใช้แป้ง 13 kg เนย 13 kg และน้ำตาล 14 kg พอดี จงใช้เมทริกซ์ผกผันเดิมหาจำนวนรอบที่อบเค้กกล้วยหอม"
    figure:
      src: p-bakery-recipe.svg
      alt: "ตารางสูตรขนม แถวคือวัตถุดิบ หลักคือเมนู ขนมปังเนยสดใช้แป้ง 2 kg เนย 1 kg น้ำตาล 1 kg ครัวซองต์ใช้แป้ง 1 kg เนย 2 kg น้ำตาล 1 kg เค้กกล้วยหอมใช้แป้ง 1 kg เนย 1 kg น้ำตาล 2 kg ต่อหนึ่งรอบการอบ (ค่าสมมติ)"
    answer: { value: 4, unit: รอบ }
    misconceptions:
      - { match: 16, feedback: "ลืมคูณ $\\tfrac14$ หน้าเมทริกซ์ผกผัน" }
      - { match: 3, feedback: "นี่คือจำนวนรอบของขนมปังเนยสดหรือครัวซองต์ เค้กกล้วยหอมใช้แถวที่สามของ $A^{-1}$" }
    hints:
      - "สูตรขนมไม่เปลี่ยน $A^{-1}$ จึงเหมือนเดิม เปลี่ยนเฉพาะ $\\mathbf{b} = (13, 13, 14)$"
      - "$x_3 = \\tfrac14(-b_1 - b_2 + 3b_3)$"
    solution: "$x_3 = \\tfrac14(-13 - 13 + 42) = \\tfrac{16}{4} = 4$ รอบ (ทั้งหมด $\\mathbf{x} = (3, 3, 4)$ ตรวจแป้ง: $6 + 3 + 4 = 13$) เมื่อ $A$ คงเดิม ตัวผกผันตัวเดียวใช้ได้กับทุกสัปดาห์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p013
    topics: [math.linalg.matrix-inverse]
    difficulty: 4
    type: match
    stem: "ให้ $A$ และ $B$ เป็นเมทริกซ์ $n \\times n$ ที่มีตัวผกผัน และ $k \\ne 0$ จับคู่นิพจน์กับค่าที่เท่ากัน"
    pairs:
      - { left: "$(AB)^{-1}$", right: "$B^{-1}A^{-1}$" }
      - { left: "$(A^T)^{-1}$", right: "$(A^{-1})^T$" }
      - { left: "$(kA)^{-1}$", right: "$\\tfrac1k A^{-1}$" }
      - { left: "$\\det(A^{-1})$", right: "$\\dfrac{1}{\\det A}$" }
    hints:
      - "ตรวจแต่ละข้อด้วยการคูณกับเมทริกซ์เดิมแล้วดูว่าได้ $I$ หรือไม่"
      - "$\\det(AA^{-1}) = \\det I = 1$"
    solution: "$(AB)(B^{-1}A^{-1}) = I$ · $A^T(A^{-1})^T = (A^{-1}A)^T = I$ · $(kA)(\\tfrac1kA^{-1}) = I$ · $\\det A \\cdot \\det(A^{-1}) = 1$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p014
    topics: [math.linalg.matrix-inverse]
    difficulty: 3
    type: numeric
    stem: "ให้ $A = \\begin{pmatrix} 1 & 2 & 0 \\\\ 0 & 1 & 3 \\\\ 2 & 0 & 1 \\end{pmatrix}$ และหลักที่สองของ $B$ คือ $(1, -1, 2)$ จงหาสมาชิกแถวที่ 3 หลักที่ 2 ของ $AB$ โดยมองผลคูณแบบหลัก"
    answer: { value: 4 }
    misconceptions:
      - { match: 1, feedback: "ใช้หลักที่สองของ $A$ คูณจุดกับ $(1, -1, 2)$ ที่ถูกคือใช้แถวที่สามของ $A$" }
    hints:
      - "หลักที่ 2 ของ $AB$ = $A$ คูณหลักที่ 2 ของ $B$"
      - "สมาชิกแถว 3 ของผลนั้น = แถวที่ 3 ของ $A$ คูณจุดกับ $(1, -1, 2)$"
    solution: "หลักที่สองของ $AB$ คือ $A\\begin{pmatrix} 1 \\\\ -1 \\\\ 2 \\end{pmatrix} = \\begin{pmatrix} 1 - 2 + 0 \\\\ 0 - 1 + 6 \\\\ 2 + 0 + 2 \\end{pmatrix} = \\begin{pmatrix} -1 \\\\ 5 \\\\ 4 \\end{pmatrix}$ สมาชิกแถว 3 คือ **4** ไม่ต้องรู้หลักอื่นของ $B$ เลย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p015
    topics: [math.linalg.matrix-inverse]
    difficulty: 5
    type: numeric
    stem: "ร้านของฝากในเพชรบุรีขายกล่องของขวัญ 4 แบบ (A, B, C, D) แต่ละกล่องบรรจุขนมสี่ชนิดดังนี้ (ค่าสมมติ): ขนมหม้อแกง $(2, 1, 0, 1)$ ชิ้น ทองม้วน $(1, 2, 1, 0)$ ห่อ ขนมตาล $(0, 1, 2, 1)$ กล่อง และน้ำตาลโตนด $(1, 1, 0, 2)$ ขวด เรียงตามกล่อง A, B, C, D วันหนึ่งใช้ขนมหม้อแกง 40 ชิ้น ทองม้วน 60 ห่อ ขนมตาล 60 กล่อง และน้ำตาลโตนด 35 ขวดพอดี จงใช้สเปรดชีตหรือเครื่องคิดเลข (เช่น `MINVERSE` และ `MMULT`) หาว่าขายกล่องแบบ C ไปกี่กล่อง"
    answer: { value: 20, unit: กล่อง }
    misconceptions:
      - { match: 24.375, feedback: "คูณในลำดับกลับกัน (นำ $\\mathbf{b}$ เป็นเวกเตอร์แถวคูณ $A^{-1}$ ทางขวา) ใน `MMULT` ต้องใส่ $A^{-1}$ ก่อนแล้วตามด้วย $\\mathbf{b}$ ที่เป็นหลัก" }
    hints:
      - "สร้าง $A$ ขนาด $4 \\times 4$ ให้แถวคือชนิดขนม หลักคือแบบกล่อง และ $\\mathbf{b} = (40, 60, 60, 35)$"
      - "$\\mathbf{x} = A^{-1}\\mathbf{b}$ ในสเปรดชีตใช้ `MMULT(MINVERSE(A), b)` โดย $\\mathbf{b}$ เป็นหลักแนวตั้ง"
    solution: "$A = \\begin{pmatrix} 2 & 1 & 0 & 1 \\\\ 1 & 2 & 1 & 0 \\\\ 0 & 1 & 2 & 1 \\\\ 1 & 1 & 0 & 2 \\end{pmatrix}$ มี $\\det A = 8$ ได้ $\\mathbf{x} = A^{-1}\\mathbf{b} = (10, 15, 20, 5)$ ขายกล่อง C ไป **20** กล่อง ตรวจ: ขนมหม้อแกง $2(10) + 15 + 0 + 5 = 40$ ทองม้วน $10 + 30 + 20 = 60$ ขนมตาล $15 + 40 + 5 = 60$ น้ำตาลโตนด $10 + 15 + 10 = 35$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p016
    topics: [math.linalg.matrix-inverse]
    difficulty: 4
    type: numeric
    stem: "ให้ $M = \\begin{pmatrix} 1 & 2 & 0 & 0 \\\\ 1 & 3 & 0 & 0 \\\\ 0 & 0 & 2 & 1 \\\\ 0 & 0 & 5 & 3 \\end{pmatrix}$ จงมอง $M$ เป็นเมทริกซ์ทแยงมุมแบบบล็อก แล้วหาสมาชิกแถวที่ 4 หลักที่ 3 ของ $M^{-1}$"
    answer: { value: -5 }
    misconceptions:
      - { match: 5, feedback: "สูตรตัวผกผัน $2 \\times 2$ ต้องเปลี่ยนเครื่องหมายสมาชิกนอกเส้นทแยงมุม" }
      - { match: -1, feedback: "นี่คือสมาชิกแถว 3 หลัก 4 (สลับตำแหน่ง) สูตร $2 \\times 2$ สลับเฉพาะสมาชิกบนเส้นทแยงมุมหลัก" }
    hints:
      - "$M = \\begin{pmatrix} P & 0 \\\\ 0 & Q \\end{pmatrix}$ จึง $M^{-1} = \\begin{pmatrix} P^{-1} & 0 \\\\ 0 & Q^{-1} \\end{pmatrix}$"
      - "สมาชิกแถว 4 หลัก 3 ของ $M^{-1}$ คือสมาชิกแถว 2 หลัก 1 ของ $Q^{-1}$ เมื่อ $Q = \\begin{pmatrix} 2 & 1 \\\\ 5 & 3 \\end{pmatrix}$"
    solution: "$\\det Q = 6 - 5 = 1$ จึง $Q^{-1} = \\begin{pmatrix} 3 & -1 \\\\ -5 & 2 \\end{pmatrix}$ สมาชิกแถว 2 หลัก 1 คือ $-5$ ซึ่งเป็นสมาชิกแถว 4 หลัก 3 ของ $M^{-1}$ (บล็อกบนคือ $P^{-1} = \\begin{pmatrix} 3 & -2 \\\\ -1 & 1 \\end{pmatrix}$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p017
    topics: [math.linalg.matrix-inverse]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ให้ $A$, $B$ เป็นเมทริกซ์ $3 \\times 3$ ที่มีตัวผกผัน ข้อความใด **จริงเสมอ** (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "$(A^{-1}B)^{-1} = B^{-1}A$", correct: true }
      - { id: b, text: "$(A + B)^{-1} = A^{-1} + B^{-1}$", feedback: "ไม่จริง เช่น $A = B = I$ ได้ $(2I)^{-1} = \\tfrac12I$ แต่ $I + I = 2I$" }
      - { id: c, text: "$\\det(2A^{-1}) = \\dfrac{8}{\\det A}$", correct: true }
      - { id: d, text: "$(AB)^{-1} = A^{-1}B^{-1}$", feedback: "ลำดับต้องกลับกัน $(AB)^{-1} = B^{-1}A^{-1}$ ซึ่งไม่เท่ากับ $A^{-1}B^{-1}$ เมื่อการคูณไม่สลับที่" }
      - { id: e, text: "$\\det(2A^{-1}) = \\dfrac{2}{\\det A}$", feedback: "เมทริกซ์ $3 \\times 3$ คูณ 2 ทุกแถว ดีเทอร์มิแนนต์จึงคูณ $2^3 = 8$" }
    hints:
      - "ใช้ $(XY)^{-1} = Y^{-1}X^{-1}$ กับ $X = A^{-1}$, $Y = B$"
      - "$\\det(kM) = k^n\\det M$ สำหรับ $M$ ขนาด $n \\times n$"
    solution: "(ก) $(A^{-1}B)^{-1} = B^{-1}(A^{-1})^{-1} = B^{-1}A$ จริง (ค) $\\det(2A^{-1}) = 2^3\\det(A^{-1}) = \\tfrac{8}{\\det A}$ จริง ส่วน (ข) (ง) (จ) ไม่จริงโดยทั่วไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.linalg.matrix-inverse.p018
    topics: [math.linalg.matrix-inverse]
    difficulty: 3
    type: numeric
    stem: "เกษตรกรในสุพรรณบุรีต้องการใส่ธาตุอาหารในนาให้ได้ไนโตรเจน (N) 38 kg ฟอสเฟต ($\\mathrm{P_2O_5}$) 15 kg และโพแทช ($\\mathrm{K_2O}$) 21 kg (ค่าสมมติ) โดยผสมปุ๋ยสามสูตร: 15-15-15 (มี N, $\\mathrm{P_2O_5}$, $\\mathrm{K_2O}$ อย่างละ 15%) ยูเรีย 46-0-0 (N 46%) และ 0-0-60 ($\\mathrm{K_2O}$ 60%) ให้ $x_1, x_2, x_3$ เป็นกิโลกรัมของปุ๋ยแต่ละสูตร จงตั้งระบบ $A\\mathbf{x} = \\mathbf{b}$ แล้วหาว่าต้องใช้ยูเรียกี่กิโลกรัม"
    answer: { value: 50, unit: kg }
    misconceptions:
      - { match: 82.61, feedback: "คิด N ทั้งหมดจากยูเรีย ($38 / 0.46$) ลืมว่าปุ๋ย 15-15-15 ก็ให้ N ด้วย" }
    hints:
      - "สมการของ $\\mathrm{P_2O_5}$: $0.15x_1 = 15$ หา $x_1$ ได้ก่อน"
      - "สมการ N: $0.15x_1 + 0.46x_2 = 38$"
    solution: "$A = \\begin{pmatrix} 0.15 & 0.46 & 0 \\\\ 0.15 & 0 & 0 \\\\ 0.15 & 0 & 0.6 \\end{pmatrix}$, $\\mathbf{b} = (38, 15, 21)$ จากแถว $\\mathrm{P_2O_5}$: $x_1 = 100$ kg แถว N: $15 + 0.46x_2 = 38$ ได้ $x_2 = 50$ kg แถว $\\mathrm{K_2O}$: $15 + 0.6x_3 = 21$ ได้ $x_3 = 10$ kg ใช้ยูเรีย **50 kg**"
    license: CC-BY-SA-4.0
    ai_assisted: true
