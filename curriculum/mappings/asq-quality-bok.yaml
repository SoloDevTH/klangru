    indicators: [CSSGB I.C, CSSGB II.F, CSSGB III.A, CSSGB III.B, CQE VI.B, CSSGB III.C, CQE VI.C, CSSGB III.D, CQE VI.A, CSSGB IV.B, CQE VI.D, CSSGB V.A, CQE VI.H]
