problems:
  - id: management.operations.linear-programming.p001
    topics: [management.operations.linear-programming]
    difficulty: 1
    type: match
    stem: "จับคู่ส่วนของแบบจำลองกำหนดการเชิงเส้นของร้านเบเกอรี่ (สมมติ) กับตัวอย่าง"
    pairs:
      - { left: "ตัวแปรตัดสินใจ", right: "x = จำนวนเค้ก y = จำนวนขนมปังที่อบต่อวัน" }
      - { left: "ฟังก์ชันเป้าหมาย", right: "กำไร P = 50x + 40y ให้มากที่สุด" }
      - { left: "ข้อจำกัดด้านทรัพยากร", right: "เวลาเตาอบรวมไม่เกิน 40 ชั่วโมง" }
      - { left: "ข้อจำกัดไม่ติดลบ", right: "x ≥ 0 และ y ≥ 0" }
    hints:
      - "ตัวแปรตัดสินใจคือสิ่งที่ร้านเลือกได้"
      - "ฟังก์ชันเป้าหมายคือสิ่งที่ต้องการให้มากสุดหรือน้อยสุด"
    solution: "จำนวนเค้กและขนมปังคือตัวแปรตัดสินใจ กำไรคือฟังก์ชันเป้าหมาย เวลาเตาอบเป็นข้อจำกัดด้านทรัพยากร และจำนวนที่อบติดลบไม่ได้เป็นข้อจำกัดไม่ติดลบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.linear-programming.p002
    topics: [management.operations.linear-programming]
    difficulty: 1
    type: mcq
    stem: "ตามทฤษฎีบทจุดมุม ถ้าปัญหากำหนดการเชิงเส้นมีคำตอบที่ดีที่สุด คำตอบนั้นจะพบที่ใด"
    choices:
      - { id: a, text: "ที่จุดมุมอย่างน้อยหนึ่งจุดของบริเวณที่เป็นไปได้", correct: true }
      - { id: b, text: "ที่จุดกึ่งกลางของบริเวณที่เป็นไปได้", feedback: "จุดกลางยังเลื่อนเส้นเป้าหมายออกไปได้อีก จึงไม่ใช่จุดที่ดีที่สุด" }
      - { id: c, text: "ที่จุดกำเนิด (0, 0) เสมอ", feedback: "จุดกำเนิดมักให้กำไรเป็น 0 ซึ่งเป็นค่าน้อยที่สุดของปัญหาหาค่ามากสุด" }
      - { id: d, text: "ที่จุดตัดใดก็ได้ของสองเส้น แม้อยู่นอกบริเวณ", feedback: "จุดนอกบริเวณละเมิดข้อจำกัด จึงเป็นคำตอบไม่ได้" }
    hints:
      - "นึกถึงเส้นกำไรคงที่ที่เลื่อนขนานออกไปเรื่อย ๆ"
      - "เส้นนั้นแตะบริเวณครั้งสุดท้ายที่ใด"
    solution: "เส้นเป้าหมายที่เลื่อนออกไปจะแตะบริเวณที่เป็นไปได้ครั้งสุดท้ายที่จุดมุม (หรือขอบที่มีจุดมุมสองจุด) จึงแทนค่าเฉพาะจุดมุมก็พอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.linear-programming.p003
    topics: [management.operations.linear-programming]
    difficulty: 2
    type: numeric
    stem: "ฟังก์ชันกำไร $P = 40x + 30y$ บาท ที่จุดมุม (12, 8) กำไรเป็นกี่บาท"
    answer: { value: 720, unit: บาท }
    hints:
      - "แทน x = 12 และ y = 8"
      - "40 × 12 + 30 × 8"
    misconceptions:
      - { match: 680, feedback: "สลับค่า x กับ y จุด (12, 8) หมายถึง x = 12 และ y = 8" }
      - { match: 1400, feedback: "ดูเหมือนคูณ (40 + 30) × 20 ต้องคูณแต่ละพจน์แยกกันแล้วบวก" }
    solution: "$P = 40(12) + 30(8) = 480 + 240 = 720$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.linear-programming.p004
    topics: [management.operations.linear-programming]
    difficulty: 2
    type: expression
    stem: "โรงงานเสื้อผ้า (สมมติ) เย็บเสื้อ $x$ ตัว ใช้เวลาตัวละ 15 นาที และกางเกง $y$ ตัว ใช้เวลาตัวละ 25 นาที เขียนเวลาเย็บรวม (นาที) ในรูป $x$ และ $y$"
    prefix: "เวลาเย็บรวม ="
    answer: { latex: "15x+25y", variables: [x, y] }
    misconceptions:
      - { match: "25x+15y", feedback: "สลับสัมประสิทธิ์ เสื้อ (x) ใช้ 15 นาที กางเกง (y) ใช้ 25 นาที" }
      - { match: "40xy", feedback: "เวลารวมคือผลบวกของเวลาเสื้อทุกตัวกับเวลากางเกงทุกตัว ไม่ใช่ผลคูณ" }
    hints:
      - "เวลาของเสื้อทั้งหมด = 15 × จำนวนเสื้อ"
      - "บวกเวลาของเสื้อกับเวลาของกางเกง"
    solution: "เวลาเย็บรวม $= 15x + 25y$ นาที ถ้ามีเวลา 2,400 นาที ข้อจำกัดคือ $15x + 25y \\le 2{,}400$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.linear-programming.p005
    topics: [management.operations.linear-programming]
    difficulty: 2
    type: expression
    stem: "ร้านขายน้ำผลไม้ได้กำไรน้ำส้มแก้วละ 18 บาท และน้ำมะพร้าวแก้วละ 22 บาท ให้ $x$ = จำนวนแก้วน้ำส้ม $y$ = จำนวนแก้วน้ำมะพร้าว เขียนฟังก์ชันกำไร"
    prefix: "P ="
    answer: { latex: "18x+22y", variables: [x, y] }
    misconceptions:
      - { match: "22x+18y", feedback: "สลับกำไรของสองชนิด น้ำส้ม (x) ได้แก้วละ 18 บาท" }
      - { match: "40(x+y)", feedback: "รวมกำไรต่อแก้วของสองชนิดแล้วคูณจำนวนรวม ซึ่งถูกเฉพาะเมื่อขายสองชนิดเท่ากัน ต้องคิดแยกตามชนิด" }
    hints:
      - "กำไรจากน้ำส้มทั้งหมด = 18x"
      - "บวกกำไรของทั้งสองชนิด"
    solution: "$P = 18x + 22y$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.linear-programming.p006
    topics: [management.operations.linear-programming]
    difficulty: 3
    type: numeric
    stem: "จุดมุมหนึ่งของบริเวณที่เป็นไปได้เกิดจากเส้น $x + 2y = 40$ ตัดกับเส้น $3x + 2y = 60$ พิกัด $y$ ของจุดนี้เป็นเท่าใด"
    answer: { value: 15 }
    hints:
      - "ลบสมการแรกออกจากสมการที่สองเพื่อกำจัด y"
      - "ได้ 2x = 20 แล้วแทน x กลับในสมการแรก"
    misconceptions:
      - { match: 10, feedback: "นั่นคือพิกัด x โจทย์ถามพิกัด y" }
      - { match: 20, feedback: "นั่นคือจุดตัดแกน y ของเส้น x + 2y = 40 ไม่ใช่จุดที่สองเส้นตัดกัน" }
    solution: "$(3x + 2y) - (x + 2y) = 60 - 40$ ได้ $2x = 20$ จึง $x = 10$ แทนใน $10 + 2y = 40$ ได้ $y = 15$ จุดมุมคือ (10, 15)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.linear-programming.p007
    topics: [management.operations.linear-programming]
    difficulty: 3
    type: numeric
    stem: "จากบริเวณที่เป็นไปได้ในภาพ ถ้ากำไร $P = 50x + 40y$ บาท กำไรสูงสุดเป็นกี่บาท"
    figure:
      src: p-feasible.svg
      alt: "บริเวณที่เป็นไปได้ของ x + y ≤ 10, 2x + y ≤ 16, y ≤ 7, x ≥ 0, y ≥ 0 มีจุดมุม (0, 0) (8, 0) (6, 4) (3, 7) (0, 7)"
    answer: { value: 460, unit: บาท }
    hints:
      - "แทนค่า P ที่ทุกจุดมุม"
      - "เปรียบเทียบ P ที่ (8, 0) (6, 4) (3, 7) และ (0, 7)"
    misconceptions:
      - { match: 430, feedback: "นั่นคือ P ที่ (3, 7) ยังมีจุดมุมอื่นที่ได้มากกว่า" }
      - { match: 400, feedback: "นั่นคือ P ที่ (8, 0) ลองแทนค่าจุดมุมที่เกิดจากสองเส้นตัดกันด้วย" }
    solution: "P(0, 0) = 0, P(8, 0) = 400, P(6, 4) = 300 + 160 = 460, P(3, 7) = 150 + 280 = 430, P(0, 7) = 280 กำไรสูงสุด 460 บาทที่ (6, 4)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.linear-programming.p008
    topics: [management.operations.linear-programming]
    difficulty: 3
    type: mcq
    stem: "จากภาพเดิม คำตอบที่ดีที่สุดคือ (6, 4) ข้อจำกัดใดมีส่วนเหลือ (ไม่ตึง) ที่จุดนี้"
    figure:
      src: p-feasible.svg
      alt: "บริเวณที่เป็นไปได้ของ x + y ≤ 10, 2x + y ≤ 16, y ≤ 7, x ≥ 0, y ≥ 0 มีจุดมุม (0, 0) (8, 0) (6, 4) (3, 7) (0, 7)"
    choices:
      - { id: a, text: "y ≤ 7 เหลืออยู่ 3 หน่วย", correct: true }
      - { id: b, text: "x + y ≤ 10", feedback: "6 + 4 = 10 ใช้หมดพอดี จึงตึง" }
      - { id: c, text: "2x + y ≤ 16", feedback: "2(6) + 4 = 16 ใช้หมดพอดี จึงตึง" }
      - { id: d, text: "ไม่มีข้อจำกัดใดเหลือ", feedback: "แทนค่า y = 4 ใน y ≤ 7 จะเห็นว่ายังเหลือ" }
    hints:
      - "แทน (6, 4) ในด้านซ้ายของแต่ละข้อจำกัด"
      - "ข้อจำกัดที่ด้านซ้ายน้อยกว่าด้านขวามีส่วนเหลือ"
    solution: "x + y = 10 และ 2x + y = 16 ใช้หมดพอดี ส่วน y = 4 ยังน้อยกว่า 7 อยู่ 3 หน่วย ข้อจำกัดนี้จึงมีส่วนเหลือและราคาเงาเป็น 0"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.linear-programming.p009
    topics: [management.operations.linear-programming]
    difficulty: 3
    type: numeric
    stem: "โรงงานน้ำตาล A มีสินค้า 70 ตัน B มี 50 ตัน ส่งให้ร้าน 1, 2, 3 ที่ต้องการ 40, 50, 30 ตัน ต้นทุน (บาทต่อตัน) จาก A: 700, 600, 1,200 จาก B: 1,000, 400, 500 (สมมติ) ถ้าส่ง A→1 10 ตัน A→2 30 ตัน A→3 30 ตัน B→1 30 ตัน B→2 20 ตัน ต้นทุนรวมเป็นกี่บาท"
    answer: { value: 99000, unit: บาท }
    hints:
      - "คูณปริมาณแต่ละเส้นทางกับต้นทุนต่อตันของเส้นทางนั้น"
      - "รวมทั้งห้าเส้นทาง"
    misconceptions:
      - { match: 3900, feedback: "รวมต้นทุนต่อตันของห้าเส้นทางโดยไม่ได้คูณปริมาณ" }
      - { match: 84000, feedback: "นั่นคือต้นทุนของแผนอื่น ตรวจว่าใช้ปริมาณตามที่โจทย์กำหนด" }
    solution: "$10(700) + 30(600) + 30(1{,}200) + 30(1{,}000) + 20(400) = 7{,}000 + 18{,}000 + 36{,}000 + 30{,}000 + 8{,}000 = 99{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.linear-programming.p010
    topics: [management.operations.linear-programming]
    difficulty: 4
    type: numeric
    stem: "ร้านเบเกอรี่ (สมมติ) อบเค้ก $x$ ปอนด์ กำไรปอนด์ละ 50 บาท และขนมปัง $y$ แถว กำไรแถวละ 40 บาท เค้กใช้เตาอบ 0.5 ชั่วโมง แป้ง 0.4 กิโลกรัม ขนมปังใช้เตาอบ 0.25 ชั่วโมง แป้ง 0.5 กิโลกรัม สัปดาห์หนึ่งมีเวลาเตาอบ 40 ชั่วโมง แป้ง 50 กิโลกรัม กำไรสูงสุดต่อสัปดาห์เป็นกี่บาท"
    answer: { value: 4900, unit: บาท }
    hints:
      - "ข้อจำกัด: 0.5x + 0.25y ≤ 40 และ 0.4x + 0.5y ≤ 50 และ x, y ≥ 0"
      - "จุดมุม (0, 0) (80, 0) (0, 100) และจุดตัดของสองเส้น แก้ระบบสมการหาจุดตัดแล้วเทียบกำไร"
    misconceptions:
      - { match: 4000, feedback: "นั่นคือกำไรที่ (80, 0) หรือ (0, 100) ยังไม่ได้ตรวจจุดตัดของสองข้อจำกัด" }
      - { match: 7200, feedback: "ดูเหมือนใช้ x = 80 และ y = 80 พร้อมกัน ซึ่งละเมิดข้อจำกัด ต้องใช้จุดมุมที่อยู่ในบริเวณที่เป็นไปได้" }
    solution: "จุดตัด: จาก $0.5x + 0.25y = 40$ ได้ $y = 160 - 2x$ แทนใน $0.4x + 0.5y = 50$ ได้ $0.4x + 80 - x = 50$ จึง $x = 50$, $y = 60$ กำไร: (80, 0) = 4,000 (0, 100) = 4,000 (50, 60) = 2,500 + 2,400 = 4,900 บาท สูงสุดที่ (50, 60)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.linear-programming.p011
    topics: [management.operations.linear-programming]
    difficulty: 4
    type: numeric
    stem: "จากร้านเบเกอรี่ในข้อก่อน (คำตอบที่ดีที่สุด x = 50, y = 60 กำไร 4,900 บาท) ถ้าเวลาเตาอบเพิ่มเป็น 41 ชั่วโมง โดยแป้งยังเป็น 50 กิโลกรัม ราคาเงาของเวลาเตาอบเป็นกี่บาทต่อชั่วโมง"
    answer: { value: 60, unit: บาทต่อชั่วโมง }
    hints:
      - "แก้ $0.5x + 0.25y = 41$ กับ $0.4x + 0.5y = 50$ หาจุดมุมใหม่"
      - "ราคาเงา = กำไรใหม่ − 4,900"
    misconceptions:
      - { match: 4960, feedback: "นั่นคือกำไรใหม่ ราคาเงาคือกำไรที่เพิ่มขึ้น" }
      - { match: 50, feedback: "นั่นคือราคาเงาของแป้งต่อกิโลกรัม โจทย์ถามของเวลาเตาอบ" }
    solution: "จาก $y = 164 - 2x$ แทนใน $0.4x + 0.5y = 50$ ได้ $0.4x + 82 - x = 50$ จึง $x = 53.33$, $y = 57.33$ กำไร $50(53.33) + 40(57.33) = 4{,}960$ บาท ราคาเงา $4{,}960 - 4{,}900 = 60$ บาทต่อชั่วโมง ถ้าเช่าเตาเพิ่มได้ถูกกว่าชั่วโมงละ 60 บาทจึงคุ้ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.linear-programming.p012
    topics: [management.operations.linear-programming]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนการแก้ปัญหากำหนดการเชิงเส้นสองตัวแปรด้วยกราฟ"
    items:
      - "กำหนดตัวแปรตัดสินใจ ฟังก์ชันเป้าหมาย และข้อจำกัด"
      - "วาดเส้นขอบของข้อจำกัดแต่ละข้อและแรเงาฝั่งที่เป็นไปตามอสมการ"
      - "หาบริเวณที่เป็นไปได้ซึ่งเป็นไปตามทุกข้อจำกัด"
      - "หาพิกัดของจุดมุมโดยแก้ระบบสมการ"
      - "แทนค่าฟังก์ชันเป้าหมายที่ทุกจุดมุมแล้วเลือกค่าที่ดีที่สุด"
    hints:
      - "ต้องมีแบบจำลองก่อนจึงวาดกราฟได้"
      - "จุดมุมหาได้หลังจากรู้บริเวณที่เป็นไปได้แล้ว"
    solution: "สร้างแบบจำลอง → วาดข้อจำกัด → หาบริเวณที่เป็นไปได้ → หาจุดมุม → แทนค่าและเลือกคำตอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.linear-programming.p013
    topics: [management.operations.linear-programming]
    difficulty: 4
    type: numeric
    stem: "ปัญหาการขนส่งน้ำตาล A มี 70 ตัน B มี 50 ตัน ร้าน 1, 2, 3 ต้องการ 40, 50, 30 ตัน ต้นทุน (บาทต่อตัน) จาก A: 700, 600, 1,200 จาก B: 1,000, 400, 500 ใช้วิธีต้นทุนต่ำสุดหาแผนเริ่มต้น ต้นทุนรวมของแผนนี้เป็นกี่บาท"
    answer: { value: 84000, unit: บาท }
    hints:
      - "ช่องถูกที่สุดคือ B→2 (400) ส่งให้มากที่สุดเท่าที่ทำได้"
      - "เมื่อ B หมด ข้ามช่องของ B ไปเลือกช่องถูกที่สุดที่ยังเหลือของ A"
    misconceptions:
      - { match: 69000, feedback: "นั่นคือต้นทุนของแผนที่ดีที่สุด แต่วิธีต้นทุนต่ำสุดในโจทย์นี้ยังไม่ได้แผนนั้น" }
      - { match: 99000, feedback: "นั่นคือต้นทุนของแผนในข้อ 9 ไม่ใช่แผนจากวิธีต้นทุนต่ำสุด" }
