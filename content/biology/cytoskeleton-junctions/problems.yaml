problems:
  - id: biology.cells.cytoskeleton-junctions.p001
    topics: [biology.cells.cytoskeleton-junctions]
    difficulty: 1
    type: mcq
    stem: "ข้อใด **ไม่** อยู่ในทฤษฎีเซลล์"
    choices:
      - { id: a, text: "สิ่งมีชีวิตทุกชนิดประกอบด้วยเซลล์", feedback: "ข้อนี้เป็นหนึ่งในสามข้อของทฤษฎีเซลล์" }
      - { id: b, text: "เซลล์เป็นหน่วยพื้นฐานของโครงสร้างและการทำงาน", feedback: "ข้อนี้เป็นหนึ่งในสามข้อของทฤษฎีเซลล์" }
      - { id: c, text: "เซลล์ทุกเซลล์มีผนังเซลล์เซลลูโลสหุ้มอยู่", correct: true }
      - { id: d, text: "เซลล์เกิดจากการแบ่งเซลล์เดิม", feedback: "ข้อนี้เป็นหนึ่งในสามข้อของทฤษฎีเซลล์" }
    hints:
      - "นึกถึงสามข้อหลักของทฤษฎีเซลล์ ได้แก่ สิ่งมีชีวิต หน่วยพื้นฐาน และการกำเนิดเซลล์"
      - "ผนังเซลล์เซลลูโลสพบในพืชและสาหร่ายบางชนิด เซลล์สัตว์ไม่มี"
    solution: "ทฤษฎีเซลล์มีสามข้อ คือ สิ่งมีชีวิตทุกชนิดประกอบด้วยเซลล์ เซลล์เป็นหน่วยพื้นฐาน และเซลล์เกิดจากการแบ่งเซลล์เดิม ผนังเซลล์เซลลูโลสพบในพืชและสาหร่ายบางชนิด เซลล์สัตว์ไม่มีผนังเซลล์ จึงไม่ใช่ข้อความในทฤษฎี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cytoskeleton-junctions.p002
    topics: [biology.cells.cytoskeleton-junctions]
    difficulty: 2
    type: numeric
    stem: "นักเรียนในโรงเรียนไทยถ่ายภาพเซลล์จากกล้องจุลทรรศน์ แล้ววัดเซลล์ในภาพกว้าง 6 cm เซลล์จริงกว้าง 20 μm กำลังขยายของภาพนี้เป็นกี่เท่า (ตอบเป็นจำนวนเท่า)"
    answer: { value: 3000, tolerance: 0, unit: "เท่า" }
    misconceptions:
      - { match: 3, feedback: "ใช้หน่วย mm กับ μm ปนกัน 60 mm ÷ 20 μm = 3 ต้องแปลง 60 mm เป็น 60,000 μm ก่อนหาร" }
      - { match: 0.3, feedback: "ไม่แปลงหน่วยเลย 6 cm ÷ 20 μm = 0.3 ต้องทำให้หน่วยตรงกันก่อนหาร" }
    hints:
      - "กำลังขยายคืออัตราส่วนระหว่างขนาดในภาพกับขนาดจริง"
      - "ทำให้ทั้งสองค่าอยู่ในหน่วยเดียวกันก่อน เช่น 1 cm = 10 mm และ 1 mm = 1,000 μm"
      - "หารขนาดในภาพ (μm) ด้วยขนาดจริง (μm)"
    solution: "6 cm = 60 mm = 60,000 μm เซลล์จริงกว้าง 20 μm กำลังขยาย = 60,000 ÷ 20 = 3,000 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cytoskeleton-junctions.p003
    topics: [biology.cells.cytoskeleton-junctions]
    difficulty: 3
    type: numeric
    stem: "กล้องจุลทรรศน์แสงตั้งกำลังขยาย 400 เท่า ไมโทคอนเดรียจริงยาว 2 μm จะยาวในภาพกี่ mm (ตอบเป็นมิลลิเมตร)"
    answer: { value: 0.8, tolerance: 0.01, unit: "mm" }
    misconceptions:
      - { match: 0.005, feedback: "หารด้วยกำลังขยายแทนการคูณ ภาพต้องใหญ่กว่าของจริง จึงต้องคูณ" }
      - { match: 2, feedback: "ลืมคูณกำลังขยาย จึงได้ขนาดจริงเท่าเดิม" }
    hints:
      - "ภาพใหญ่กว่าของจริงกี่เท่า ก็คือกำลังขยาย"
      - "ขนาดในภาพ = ขนาดจริง × กำลังขยาย ได้หน่วยเป็น μm ก่อน"
      - "แปลง μm เป็น mm โดยหารด้วย 1,000"
    solution: "ขนาดในภาพ = 2 μm × 400 = 800 μm และ 800 μm = 0.8 mm ไมโทคอนเดรียจะยาว 0.8 mm ในภาพ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cytoskeleton-junctions.p004
    topics: [biology.cells.cytoskeleton-junctions]
    difficulty: 3
    type: numeric
    stem: "กล้องแสงแยกจุดสองจุดที่ห่างกันอย่างน้อยประมาณ 0.2 μm ได้ ส่วนกล้องอิเล็กตรอนแยกจุดที่ห่างกันประมาณ 0.2 nm ได้ กล้องอิเล็กตรอนมีกำลังแยกดีกว่ากล้องแสงกี่เท่า (ตอบเป็นจำนวนเท่า)"
    answer: { value: 1000, tolerance: 0, unit: "เท่า" }
    misconceptions:
      - { match: 1, feedback: "อ่าน 0.2 nm เป็น 0.2 μm ทำให้สองค่าเท่ากัน ต้องแปลงหน่วยก่อน (1 μm = 1,000 nm)" }
      - { match: 0.001, feedback: "กลับด้านอัตราส่วน ค่าที่ดีกว่าเป็นค่าที่น้อยกว่า จึงต้องเอาค่าของกล้องแสงตั้ง" }
    hints:
      - "กำลังแยกที่ดีกว่าคือระยะที่สั้นกว่า"
      - "ทำให้หน่วยของสองค่าเหมือนกันก่อน จะได้เป็น 0.2 μm กับ 0.0002 μm"
    solution: "กล้องแสง 0.2 μm กล้องอิเล็กตรอน 0.2 nm = 0.0002 μm อัตราส่วน = 0.2 ÷ 0.0002 = 1,000 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cytoskeleton-junctions.p005
    topics: [biology.cells.cytoskeleton-junctions]
    difficulty: 2
    type: numeric
    stem: "นักศึกษาพยาบาลในกรุงเทพฯ ดูภาพเม็ดเลือดแดงคนที่ถ่ายด้วยกำลังขยาย 1,000 เท่า เม็ดเลือดแดงจริงกว้างราว 7.5 μm ในภาพจะกว้างกี่ mm (ตอบเป็นมิลลิเมตร)"
    answer: { value: 7.5, tolerance: 0.05, unit: "mm" }
    misconceptions:
      - { match: 0.0075, feedback: "หารแทนคูณ ภาพต้องใหญ่กว่าของจริง จึงต้องคูณด้วยกำลังขยาย" }
      - { match: 75, feedback: "แปลง μm เป็น mm ผิด ต้องหารด้วย 1,000 ไม่ใช่ 100 ผลจึงเกินจริง 10 เท่า" }
    hints:
      - "ขนาดในภาพเท่ากับขนาดจริงคูณกำลังขยาย"
      - "ได้ค่าในหน่วย μm ก่อน แล้วค่อยแปลงเป็น mm"
    solution: "ขนาดในภาพ = 7.5 μm × 1,000 = 7,500 μm และ 7,500 μm = 7.5 mm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cytoskeleton-junctions.p006
    topics: [biology.cells.cytoskeleton-junctions]
    difficulty: 4
    type: numeric
    stem: "ไมโครทิวบูลกว้างประมาณ 25 nm และไมโครฟิลาเมนต์กว้างประมาณ 7 nm ไมโครทิวบูลกว้างกว่าไมโครฟิลาเมนต์กี่เท่า (ตอบเป็นทศนิยมสองตำแหน่ง)"
    answer: { value: 3.57, tolerance: 0.02, unit: "เท่า" }
    misconceptions:
      - { match: 18, feedback: "เอาผลต่าง 25 − 7 แทนอัตราส่วน ต้องหารกันไม่ใช่ลบกัน" }
      - { match: 0.28, feedback: "หารกลับด้าน 7 ÷ 25 ได้ค่าน้อยกว่า 1 ตัวตั้งต้องเป็นค่าที่ใหญ่กว่า" }
    hints:
      - "ถามว่าใหญ่กว่ากี่เท่า จึงต้องใช้การหาร"
      - "ตัวตั้งคือขนาดของไมโครทิวบูล ตัวหารคือขนาดของไมโครฟิลาเมนต์"
    solution: "25 ÷ 7 = 3.5714... ≈ 3.57 ไมโครทิวบูลกว้างกว่าไมโครฟิลาเมนต์ราว 3.6 เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cytoskeleton-junctions.p007
    topics: [biology.cells.cytoskeleton-junctions]
    difficulty: 4
    type: numeric
    stem: "ภาพจากกล้องตั้งกำลังขยาย 4,000 เท่า ระยะ 1 mm บนภาพจะตรงกับระยะกี่ μm ของเซลล์จริง (ตอบเป็น μm)"
    answer: { value: 0.25, tolerance: 0.0025, unit: "μm" }
    misconceptions:
      - { match: 4000, feedback: "ไม่แปลง mm เป็น μm และคูณแทนที่จะหาร ภาพใหญ่กว่าของจริง ของจริงจึงเล็กกว่าภาพ 4,000 เท่า" }
      - { match: 0.025, feedback: "แปลง 1 mm เป็น 100 μm ผิด ต้องเป็น 1,000 μm ผลจึงน้อยกว่าที่ควรเป็น 10 เท่า" }
    hints:
      - "ระยะในภาพ ÷ กำลังขยาย = ระยะจริง"
      - "1 mm เท่ากับกี่ μm"
    solution: "1 mm = 1,000 μm ระยะจริง = 1,000 ÷ 4,000 = 0.25 μm"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cytoskeleton-junctions.p008
    topics: [biology.cells.cytoskeleton-junctions]
    difficulty: 2
    type: mcq
    stem: "เหตุใดกล้องอิเล็กตรอนจึงแยกรายละเอียดได้ดีกว่ากล้องแสงมาก"
    choices:
      - { id: a, text: "เพราะกำลังขยายของกล้องอิเล็กตรอนสูงกว่าเสมอ", feedback: "กำลังขยายเพิ่มได้ง่าย แต่ถ้ากำลังแยกไม่ดี ภาพใหญ่ขึ้นก็ไม่ชัดขึ้น" }
      - { id: b, text: "เพราะลำอิเล็กตรอนมีความยาวคลื่นสั้นกว่าแสงขาวมาก", correct: true }
      - { id: c, text: "เพราะตัวอย่างต้องมีชีวิตอยู่ระหว่างส่องดู", feedback: "กล้องอิเล็กตรอนทำงานในสุญญากาศ และตัวอย่างมักถูกตรึงไว้แล้ว" }
      - { id: d, text: "เพราะใช้เลนส์แก้วหลายชั้นกว่ากล้องแสง", feedback: "กล้องอิเล็กตรอนใช้เลนส์แม่เหล็กไฟฟ้า ความละเอียดมาจากความยาวคลื่นที่สั้น" }
    hints:
      - "กำลังแยกขึ้นกับความยาวคลื่นของสิ่งที่ใช้ส่องดู"
      - "แสงขาวมีความยาวคลื่นราว 400 ถึง 700 nm"
    solution: "กำลังแยกของกล้องถูกจำกัดโดยความยาวคลื่น แสงขาวยาวราว 400–700 nm ทำให้แยกได้ราว 200 nm ส่วนลำอิเล็กตรอนมีความยาวคลื่นสั้นกว่ามาก จึงแยกรายละเอียดได้ละเอียดกว่าหลายร้อยเท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cytoskeleton-junctions.p009
    topics: [biology.cells.cytoskeleton-junctions]
    difficulty: 2
    type: mcq
    stem: "กล้องอิเล็กตรอนส่องกราด (SEM) เหมาะจะใช้ดูอะไรมากที่สุด"
    choices:
      - { id: a, text: "โครงสร้างภายในไมโทคอนเดรียในภาพตัดขวางที่บางมาก", feedback: "ภาพภายในตัวอย่างบางมากแบบนี้เป็นงานของกล้องอิเล็กตรอนส่องผ่าน (TEM)" }
      - { id: b, text: "รูปร่างผิวสามมิติ เช่น ขนเล็ก ๆ บนพื้นผิวของอวัยวะ", correct: true }
      - { id: c, text: "สีของสารในเซลล์ที่ยังมีชีวิต", feedback: "กล้องอิเล็กตรอนไม่ได้ใช้แสงขาวสร้างภาพ จึงไม่เห็นสีจริงของเซลล์" }
      - { id: d, text: "การเคลื่อนที่ของเซลล์ในเวลาจริง", feedback: "ตัวอย่างต้องอยู่ในสุญญากาศและมักถูกตรึงแล้ว จึงดูการเคลื่อนไหวแบบเรียลไทม์ไม่ได้" }
    hints:
      - "SEM กราดลำอิเล็กตรอนไปบนอะไร"
      - "ดูว่าภาพที่ SEM ให้เป็นภาพผิวหรือภาพภายใน"
    solution: "SEM กราดลำอิเล็กตรอนบนผิวตัวอย่างและรับสัญญาณที่กระเจิงกลับมา ได้ภาพผิวสามมิติ เช่น ซิเลียบนเยื่อบุหลอดลม ส่วนภาพภายในเซลล์เป็นงานของ TEM"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cytoskeleton-junctions.p010
    topics: [biology.cells.cytoskeleton-junctions]
    difficulty: 3
    type: mcq
    stem: "อะมีบาเคลื่อนที่โดยยื่นเท้าเทียมออกไป โครงสร้างใดมีบทบาทหลักในการยื่นเท้าเทียม"
    choices:
      - { id: a, text: "ไมโครฟิลาเมนต์ที่ประกอบจากโปรตีนแอกทิน", correct: true }
      - { id: b, text: "อินเตอร์มีเดียตฟิลาเมนต์ที่ให้ความแข็งแรงเชิงกล", feedback: "อินเตอร์มีเดียตฟิลาเมนต์ให้ความทนแรงดึง แต่ไม่ใช่เส้นใยหลักในการยื่นเท้าเทียม" }
      - { id: c, text: "ไมโครทิวบูลที่เป็นแกนของซิเลีย", feedback: "ไมโครทิวบูลช่วยลำเลียงถุงสาร แต่การยื่นเท้าเทียมอาศัยแอกทินเป็นหลัก" }
      - { id: d, text: "ไรโบโซมที่สร้างโปรตีนใหม่", feedback: "ไรโบโซมสร้างโปรตีนแต่ไม่ได้ทำให้เซลล์เปลี่ยนรูปร่าง" }
    hints:
      - "ไมโครฟิลาเมนต์อยู่ใกล้เยื่อหุ้มเซลล์และประกอบจากแอกทิน"
      - "มองหาเส้นใยที่เกี่ยวกับการเปลี่ยนรูปร่างและการเคลื่อนที่"
    solution: "อะมีบายื่นเท้าเทียมโดยที่แอกทินของไมโครฟิลาเมนต์ประกอบตัวเพิ่มที่ปลายด้านหนึ่ง ดันเยื่อหุ้มเซลล์ให้ยื่นออกไป เซลล์จึงเคลื่อนที่ไปทางนั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cytoskeleton-junctions.p011
    topics: [biology.cells.cytoskeleton-junctions]
    difficulty: 4
    type: mcq
    stem: "ข้อใดอธิบายโครงสร้างของซิเลียและแฟลเจลลัมได้ถูกต้อง"
    choices:
      - { id: a, text: "ไมโครฟิลาเมนต์ 9 คู่เรียงรอบไมโครฟิลาเมนต์คู่กลาง", feedback: "ซิเลียประกอบจากไมโครทิวบูล ไม่ใช่ไมโครฟิลาเมนต์" }
      - { id: b, text: "ไมโครทิวบูลคู่ 9 คู่เรียงรอบคู่กลาง 2 เส้น", correct: true }
      - { id: c, text: "อินเตอร์มีเดียตฟิลาเมนต์ 9 มัด มัดละ 3 เส้น", feedback: "การจัดเรียง 9 มัด มัดละ 3 เส้นเป็นของไมโครทิวบูลในเซนทริโอล ไม่ใช่อินเตอร์มีเดียตฟิลาเมนต์" }
      - { id: d, text: "แอกทินรูปวงแหวนรอบนิวเคลียส", feedback: "แอกทินเป็นไมโครฟิลาเมนต์ และไม่มีโครงสร้าง 9 + 2 ในซิเลีย" }
    hints:
      - "ซิเลียประกอบจากเส้นใยขนาดใหญ่ที่สุดในสามชนิด"
      - "นับจำนวนคู่ของไมโครทิวบูลรอบนอก และจำนวนเส้นที่อยู่ตรงกลาง"
    solution: "ซิเลียและแฟลเจลลัมมีโครงสร้าง 9 + 2 คือไมโครทิวบูลคู่ 9 คู่เรียงเป็นวงรอบ และมีไมโครทิวบูลเดี่ยว 2 เส้นอยู่ตรงกลาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cytoskeleton-junctions.p012
    topics: [biology.cells.cytoskeleton-junctions]
    difficulty: 1
    type: text
    stem: "เส้นใยโครงร่างเซลล์ที่เล็กที่สุดและประกอบจากโปรตีนแอกทินมีชื่อว่าอะไร"
