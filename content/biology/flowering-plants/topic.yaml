id: biology.plants.flowering-plants
subject: biology
title: { th: "พืชดอก: ส่วนประกอบ ปัจจัยในการเจริญเติบโต และวัฏจักรชีวิต", en: "Flowering plants: parts, needs for growth and life cycle" }
summary: หน้าที่ของราก ลำต้น ใบ และดอก ส่วนของดอก สิ่งที่พืชต้องการในการเจริญเติบโต การดูแลพืช และวัฏจักรชีวิตของพืชดอกตั้งแต่เมล็ดถึงการกระจายเมล็ด
difficulty: 1.5
minutes: 30
prerequisites: [biology.humans.body-parts]
encompasses:
  - { id: biology.humans.body-parts, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ส่วนประกอบของพืชดอก
    src: plant-parts.svg
    alt: "ภาพต้นพืชดอกที่มีรากอยู่ใต้ดิน ป้ายบอก ดอก สืบพันธุ์ กลายเป็นผล; ผล ห่อหุ้มเมล็ด (ผลผ่าให้เห็นเมล็ดข้างใน); เมล็ด งอกเป็นต้นใหม่; ใบ สร้างอาหารจากแสง น้ำ อากาศ; ลำต้น ชูใบ ลำเลียงน้ำและอาหาร; ราก ดูดน้ำและธาตุอาหาร ยึดต้น"
    caption: "ส่วนต่าง ๆ ของพืชทำหน้าที่ต่างกันแต่ทำงานร่วมกัน (วาดโดยทีมคลังรู้)"
  - type: figure
    title: ส่วนของดอก
    src: flower-parts.svg
    alt: "ภาพดอกผ่าครึ่ง ตรงกลางคือเกสรเพศเมีย ประกอบด้วยยอดเกสรเพศเมียด้านบนที่รับละอองเรณู ก้านเกสรเพศเมีย และรังไข่ที่โคนซึ่งกลายเป็นผล ข้างในรังไข่มีออวุลหลายเม็ดซึ่งกลายเป็นเมล็ด รอบ ๆ มีเกสรเพศผู้ 4 อัน แต่ละอันมีก้านชูอับเรณูและอับเรณูที่สร้างละอองเรณู ด้านนอกเป็นกลีบดอกสีชมพูที่ล่อแมลง และด้านล่างสุดเป็นกลีบเลี้ยงสีเขียวที่หุ้มดอกตอนยังตูม"
    caption: "เกสรเพศผู้ = อับเรณู + ก้านชูอับเรณู เกสรเพศเมีย = ยอดเกสร + ก้านเกสร + รังไข่ (วาดโดยทีมคลังรู้)"
  - { type: check, problem: biology.plants.flowering-plants.p004, prompt: "ลองจับคู่ก่อนอ่านต่อ" }
  - type: worked-example
    title: อ่านผลการทดลองปลูกถั่วเขียว
    problem: "นักเรียนปลูกถั่วเขียว 3 กระถางเหมือนกันทุกอย่าง กระถาง ก กลางแจ้ง รดน้ำ กระถาง ข ในกล่องทึบ รดน้ำ กระถาง ค กลางแจ้ง ไม่รดน้ำ ผลคือ ก เขียวแข็งแรง ข สูงชะลูด ซีดเหลือง ค เหี่ยวแห้ง สรุปได้ว่าอย่างไร"
    figure: { src: light-water.svg, alt: "ต้นถั่วเขียว 3 กระถางเมื่อครบ 7 วัน กระถาง ก วางกลางแจ้ง รดน้ำทุกวัน ต้นตรง ใบเขียว กระถาง ข อยู่ในกล่องทึบไม่มีแสง รดน้ำทุกวัน ต้นสูงชะลูด ผอม ใบเล็กสีเหลืองซีด กระถาง ค วางกลางแจ้ง ไม่รดน้ำ ต้นเหี่ยวโค้งงอ" }
    steps:
      - text: "หาว่าแต่ละคู่ต่างกันอย่างไร: ก กับ ข ต่างกันเฉพาะแสง ก กับ ค ต่างกันเฉพาะน้ำ"
        why: "เทียบเฉพาะคู่ที่ต่างกันเพียงอย่างเดียว จึงบอกได้ว่าผลเกิดจากสิ่งนั้น"
      - text: "ก กับ ข: ต้นที่ไม่ได้แสงซีดและอ่อนแอ แสดงว่าพืชต้องการแสง"
      - text: "ก กับ ค: ต้นที่ไม่ได้น้ำเหี่ยวแห้ง แสดงว่าพืชต้องการน้ำ"
      - text: "ไม่เทียบ ข กับ ค เพราะต่างกันทั้งแสงและน้ำ จะบอกไม่ได้ว่าผลมาจากอะไร"
    answer: "พืชต้องการทั้งแสงและน้ำในการเจริญเติบโต"
  - type: figure
    title: วัฏจักรชีวิตของพืชดอก
    src: life-cycle.svg
    alt: "แผนภาพวงกลมมีลูกศรวนตามเข็มนาฬิกา 8 ขั้น: เมล็ด → เมล็ดงอก (มีรากและยอดเล็ก ๆ) → ต้นอ่อน → ต้นโตเต็มที่ → ออกดอก → ถ่ายละอองเรณู (มีผึ้งบินมาที่ดอก) → เกิดผลและเมล็ด → เมล็ดกระจายไป แล้ววนกลับไปที่เมล็ด"
    caption: "ดอกต้องได้รับละอองเรณูก่อน จึงเกิดผลและเมล็ดที่งอกเป็นต้นใหม่ (วาดโดยทีมคลังรู้)"
  - { type: check, problem: biology.plants.flowering-plants.p007, prompt: "ใช้แผนภาพวัฏจักรช่วยคิด" }
glossary:
  - { term: พืชดอก, definition: "พืชที่ออกดอกและสร้างเมล็ดอยู่ในผล เช่น มะม่วง ข้าว ชบา" }
  - { term: การถ่ายละอองเรณู, definition: "การที่ละอองเรณูจากอับเรณูไปตกบนยอดเกสรเพศเมีย โดยแมลง นก ลม หรือน้ำช่วยพาไป" }
  - { term: เกสรเพศผู้, definition: "ส่วนของดอกที่มีอับเรณูสร้างละอองเรณู และก้านชูอับเรณู" }
  - { term: เกสรเพศเมีย, definition: "ส่วนของดอกที่มียอดเกสร ก้านเกสร และรังไข่ซึ่งมีออวุลอยู่ข้างใน" }
  - { term: ไม้ผลัดใบ, definition: "ต้นไม้ที่ทิ้งใบเกือบทั้งหมดในบางฤดู เช่น ต้นสักในหน้าแล้ง" }
  - { term: การงอก, definition: "การที่เมล็ดเริ่มเติบโต มีรากงอกลงดินและยอดงอกขึ้นมาเป็นต้นอ่อน" }
flashcards:
  - { front: "ราก ลำต้น ใบ ดอก ทำหน้าที่อะไร", back: "ราก: ดูดน้ำ ยึดต้น / ลำต้น: ชูใบ ลำเลียงน้ำและอาหาร / ใบ: สร้างอาหาร / ดอก: สืบพันธุ์" }
  - { front: "พืชต้องการอะไรในการเจริญเติบโต", back: "แสง น้ำ อากาศ ธาตุอาหารในดิน อุณหภูมิที่เหมาะสม และที่ว่างให้เติบโต" }
  - { front: "เรียงวัฏจักรชีวิตของพืชดอก", back: "เมล็ด → งอก → ต้นอ่อน → ต้นโตเต็มที่ → ออกดอก → ถ่ายละอองเรณู → ผลและเมล็ด → เมล็ดกระจาย" }
  - { front: "รังไข่และออวุลเจริญเป็นอะไร", back: "รังไข่เป็นผล ออวุลเป็นเมล็ด" }
  - { front: "เมล็ดกระจายได้ด้วยวิธีใดบ้าง", back: "ลม (ยางนา นุ่น) สัตว์ (ไทร หญ้าเจ้าชู้) น้ำ (มะพร้าว) และแตกเอง (ต้อยติ่ง)" }
