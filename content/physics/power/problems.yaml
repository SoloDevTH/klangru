      - { match: 125, feedback: 'ดูเหมือนกลับเศษส่วน ประสิทธิภาพเกิน $100\%$ เป็นไปไม่ได้' }
    solution: '$W_{\text{ออก}} = 400 \times 1.5 = 600\ \mathrm{J}$ และ $W_{\text{เข้า}} = 250 \times 3 = 750\ \mathrm{J}$ ประสิทธิภาพ $= \dfrac{600}{750} \times 100\% = 80\%$'
