<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 470" width="420" height="470" font-family="sans-serif">
<title>แชตกลุ่มสมมติ</title>
<rect x="0" y="0" width="420" height="470" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="10.0" y="10.0" width="400.0" height="450.0" rx="18" fill="#f4f6f7" stroke="#555" stroke-width="1.5"/>
<rect x="10.0" y="10.0" width="400.0" height="50.0" rx="18" fill="#5d6d7e" stroke="#555" stroke-width="1.5"/>
<text x="210.0" y="42.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">กลุ่ม ม.3/4 (แชตสมมติ)</text>
<rect x="25.0" y="75.0" width="370.0" height="52.0" rx="10" fill="#ffffff" stroke="#aab7b8" stroke-width="1"/>
<text x="40.0" y="95.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1a5276">ต้น</text>
<text x="40.0" y="116.0" font-size="14" text-anchor="start" fill="#111">ดูรูปน้ำใสที่เราแต่งดิ 555</text>
<rect x="25.0" y="140.0" width="370.0" height="52.0" rx="10" fill="#eaeded" stroke="#aab7b8" stroke-width="1"/>
<text x="40.0" y="160.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1a5276">[ภาพตัดต่อ]</text>
<text x="40.0" y="181.0" font-size="14" text-anchor="start" fill="#111">ภาพหน้าน้ำใสถูกแต่งให้ตลก</text>
<rect x="25.0" y="205.0" width="370.0" height="52.0" rx="10" fill="#ffffff" stroke="#aab7b8" stroke-width="1"/>
<text x="40.0" y="225.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1a5276">เมย์</text>
<text x="40.0" y="246.0" font-size="14" text-anchor="start" fill="#111">555 ส่งต่อให้ห้องอื่นด้วย</text>
<rect x="25.0" y="270.0" width="370.0" height="52.0" rx="10" fill="#ffffff" stroke="#aab7b8" stroke-width="1"/>
<text x="40.0" y="290.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1a5276">ต้น</text>
<text x="40.0" y="311.0" font-size="14" text-anchor="start" fill="#111">พรุ่งนี้มีอีก ทำทุกวันเลย</text>
<rect x="25.0" y="335.0" width="370.0" height="52.0" rx="10" fill="#d6eaf8" stroke="#aab7b8" stroke-width="1"/>
<text x="40.0" y="355.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1a5276">น้ำใส</text>
<text x="40.0" y="376.0" font-size="14" text-anchor="start" fill="#111">ลบได้ไหม เราไม่ตลกด้วย</text>
<rect x="25.0" y="400.0" width="370.0" height="52.0" rx="10" fill="#ffffff" stroke="#aab7b8" stroke-width="1"/>
<text x="40.0" y="420.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1a5276">ต้น</text>
<text x="40.0" y="441.0" font-size="14" text-anchor="start" fill="#111">แค่ล้อเล่น คิดมากไปได้</text>
