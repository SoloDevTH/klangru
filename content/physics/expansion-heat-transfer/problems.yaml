problems:
  - id: physics.thermal.expansion-heat-transfer.p001
    topics: [physics.thermal.expansion-heat-transfer]
    difficulty: 1
    type: mcq
    stem: "วิธีใดเป็นการใช้เทอร์มอมิเตอร์วัดอุณหภูมิของน้ำในบีกเกอร์ที่ถูกต้อง"
    choices:
      - { id: a, text: "จับปลายด้านบน จุ่มกระเปาะในน้ำโดยไม่แตะก้นบีกเกอร์ รอจนของเหลวหยุดแล้วอ่านค่าในระดับสายตา", correct: true }
      - { id: b, text: "กำกระเปาะไว้ในมือแล้วจุ่มลงในน้ำ", feedback: "ความร้อนจากมือจะทำให้ค่าที่อ่านผิด ต้องจับที่ปลายด้านบน" }
      - { id: c, text: "ให้กระเปาะแตะก้นบีกเกอร์ที่ตั้งบนตะเกียง", feedback: "ก้นภาชนะร้อนกว่าน้ำ ค่าที่อ่านจะเป็นอุณหภูมิของก้นภาชนะ ไม่ใช่ของน้ำ" }
      - { id: d, text: "อ่านค่าทันทีที่จุ่มลงไป", feedback: "ต้องรอให้ของเหลวในหลอดหยุดเคลื่อนที่ก่อน เทอร์มอมิเตอร์ต้องใช้เวลาให้ร้อนเท่าน้ำ" }
    hints:
      - "คิดว่าอะไรทำให้ค่าที่อ่านผิดได้บ้าง"
      - "กระเปาะต้องรับความร้อนจากน้ำเท่านั้น"
    solution: "จับปลายด้านบน จุ่มกระเปาะในน้ำโดยไม่แตะภาชนะ รอให้ของเหลวหยุด แล้วอ่านค่าให้สายตาอยู่ระดับเดียวกับปลายของเหลว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.thermal.expansion-heat-transfer.p002
    topics: [physics.thermal.expansion-heat-transfer]
    difficulty: 1
    type: mcq
    stem: "เมื่อแท่งเหล็กร้อนขึ้น อนุภาคของเหล็กเปลี่ยนไปอย่างไร"
    choices:
      - { id: a, text: "สั่นแรงขึ้นและอยู่ห่างกันมากขึ้น", correct: true }
      - { id: b, text: "อนุภาคแต่ละตัวขยายใหญ่ขึ้น", feedback: "อนุภาคมีขนาดเท่าเดิม สิ่งที่เปลี่ยนคือระยะห่างระหว่างอนุภาค" }
      - { id: c, text: "มีอนุภาคเพิ่มขึ้น", feedback: "จำนวนอนุภาคเท่าเดิม ความร้อนไม่ได้สร้างอนุภาคใหม่" }
      - { id: d, text: "สั่นเบาลงและอยู่ชิดกันมากขึ้น", feedback: "นี่คือสิ่งที่เกิดเมื่อเย็นลง" }
    hints:
      - "นึกถึงแบบจำลองอนุภาค"
      - "ความร้อนทำให้อนุภาคมีพลังงานมากขึ้น"
    solution: "อนุภาคได้พลังงานจึงสั่นแรงขึ้น ดันกันให้ห่างกันมากขึ้น เหล็กจึงขยายตัว ขนาดของอนุภาคไม่เปลี่ยน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.thermal.expansion-heat-transfer.p003
    topics: [physics.thermal.expansion-heat-transfer]
    difficulty: 1
    type: match
    stem: "จับคู่เหตุการณ์กับวิธีถ่ายโอนความร้อน"
    pairs:
      - { left: "ด้ามช้อนโลหะในแก้วกาแฟร้อนขึ้น", right: "การนำความร้อน" }
      - { left: "น้ำในหม้อหมุนวนขณะต้ม", right: "การพาความร้อน" }
      - { left: "นั่งข้างกองไฟแล้วรู้สึกร้อนที่หน้า", right: "การแผ่รังสีความร้อน" }
    hints:
      - "การนำเกิดในเนื้อวัตถุ การพาต้องมีของไหลเคลื่อนที่"
      - "การแผ่รังสีไม่ต้องมีตัวกลาง"
    solution: "ช้อนเป็นการนำ น้ำในหม้อเป็นการพา ความร้อนจากกองไฟถึงหน้าเป็นการแผ่รังสี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.thermal.expansion-heat-transfer.p004
    topics: [physics.thermal.expansion-heat-transfer]
    difficulty: 2
    type: numeric
    stem: "เทอร์มอมิเตอร์ในภาพอ่านค่าได้กี่องศาเซลเซียส"
    figure: { src: p-thermometer.svg, alt: "เทอร์มอมิเตอร์แนวตั้ง สเกลจาก 10 ถึง 50 องศาเซลเซียส มีขีดเล็กทุก 1 องศา ขีดยาวทุก 5 องศา และตัวเลขทุก 10 องศา แถบของเหลวสีแดงขึ้นไปถึงขีดที่สามเหนือขีดยาวที่ 25 องศา" }
    answer: { value: 28, tolerance: 0.4, unit: "°C" }
    misconceptions:
      - { match: 23, feedback: "นับขีดเล็กจากขีดยาวผิดตัว เริ่มจากเลข 20 ขีดยาวถัดไปคือ 25 แล้วนับต่ออีก 3 ขีด" }
      - { match: 38, feedback: "อ่านตัวเลขผิดช่วง ปลายของเหลวอยู่ระหว่าง 20 กับ 30" }
    hints:
      - "หาว่าขีดเล็กหนึ่งช่องเท่ากับกี่องศา (ระหว่าง 10 กับ 20 มีกี่ช่อง)"
      - "เริ่มจากตัวเลขที่อยู่ต่ำกว่าปลายของเหลว แล้วนับขีดขึ้นไป"
    solution: "ขีดเล็กหนึ่งช่องคือ $1\\ ^\\circ\\mathrm{C}$ ปลายของเหลวอยู่เหนือขีดยาว 25 ไปอีก 3 ช่อง จึงอ่านได้ $28\\ ^\\circ\\mathrm{C}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.thermal.expansion-heat-transfer.p005
    topics: [physics.thermal.expansion-heat-transfer]
    difficulty: 2
    type: mcq
    stem: "ทำไมพื้นสะพานข้ามแม่น้ำจึงมีรอยต่อเหล็กแบบฟันหวีเป็นระยะ"
    choices:
      - { id: a, text: "ให้พื้นสะพานขยายตัวเมื่อร้อนและหดตัวเมื่อเย็นได้ โดยไม่ดันกันจนเสียหาย", correct: true }
      - { id: b, text: "ให้น้ำฝนไหลลงแม่น้ำ", feedback: "รอยต่อไม่ได้ทำไว้ระบายน้ำ สะพานมีท่อระบายน้ำแยกต่างหาก" }
      - { id: c, text: "ให้รถชะลอความเร็ว", feedback: "เสียงกึก ๆ เป็นผลข้างเคียง จุดประสงค์คือรองรับการขยายและหดตัว" }
      - { id: d, text: "เพราะสร้างสะพานยาวต่อกันไม่ได้", feedback: "สร้างต่อกันได้ แต่ถ้าไม่เว้นช่อง พื้นจะดันกันเมื่อร้อน" }
    hints:
      - "พื้นสะพานยาวมาก และอุณหภูมิกลางวันกับกลางคืนต่างกัน"
      - "ของแข็งยาวขึ้นเมื่อร้อน"
    solution: "พื้นสะพานยาวขึ้นเมื่อร้อนและสั้นลงเมื่อเย็น รอยต่อเปิดช่องให้ยืดหดได้ ถ้าไม่มี พื้นจะดันกันจนโก่งหรือแตก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.thermal.expansion-heat-transfer.p006
    topics: [physics.thermal.expansion-heat-transfer]
    difficulty: 2
    type: numeric
    stem: "เหล็กยาว 1 เมตร ยืด $0.012$ มิลลิเมตร ทุก ๆ $1\\ ^\\circ\\mathrm{C}$ ที่ร้อนขึ้น รางเหล็กยาว $10$ เมตร ร้อนขึ้น $30\\ ^\\circ\\mathrm{C}$ จะยืดกี่มิลลิเมตร"
    answer: { value: 3.6, tolerance: 0.05, unit: mm }
    misconceptions:
      - { match: 0.36, feedback: "คูณแค่ $0.012 \\times 30$ ลืมคูณความยาว $10$ เมตร" }
      - { match: 0.12, feedback: "คูณแค่ $0.012 \\times 10$ ลืมคูณอุณหภูมิที่เพิ่ม $30$" }
    hints:
      - "ระยะที่ยืดเป็นสัดส่วนกับทั้งความยาวและอุณหภูมิที่เพิ่ม"
      - "$0.012 \\times \\text{ความยาว (m)} \\times \\text{อุณหภูมิที่เพิ่ม}$"
    solution: "$0.012 \\times 10 \\times 30 = 3.6\\ \\mathrm{mm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.thermal.expansion-heat-transfer.p007
    topics: [physics.thermal.expansion-heat-transfer]
    difficulty: 3
    type: numeric
    stem: "สะพานเหล็กช่วงหนึ่งยาว $50$ เมตร อุณหภูมิของพื้นสะพานต่ำสุด $20\\ ^\\circ\\mathrm{C}$ และสูงสุด $50\\ ^\\circ\\mathrm{C}$ (ค่าสมมติ) เหล็กยืด $0.012$ มิลลิเมตรต่อเมตรต่อองศา รอยต่อต้องรับการยืดได้อย่างน้อยกี่มิลลิเมตร"
    answer: { value: 18, tolerance: 0.1, unit: mm }
    misconceptions:
      - { match: 30, feedback: "ใช้อุณหภูมิสูงสุด $50$ แทนอุณหภูมิที่เปลี่ยน ต้องใช้ $50 - 20 = 30\\ ^\\circ\\mathrm{C}$" }
      - { match: 12, feedback: "ใช้อุณหภูมิต่ำสุด $20$ แทนอุณหภูมิที่เปลี่ยน" }
    hints:
      - "อุณหภูมิเปลี่ยนไปเท่าใด"
      - "$0.012 \\times 50 \\times (50 - 20)$"
    solution: "อุณหภูมิเปลี่ยน $30\\ ^\\circ\\mathrm{C}$ ยืด $0.012 \\times 50 \\times 30 = 18\\ \\mathrm{mm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.thermal.expansion-heat-transfer.p008
    topics: [physics.thermal.expansion-heat-transfer]
    difficulty: 2
    type: mcq
    stem: "ฝาขวดแยมที่เป็นโลหะหมุนไม่ออก แม่จุ่มฝาในน้ำร้อนสักครู่แล้วเปิดได้ เพราะเหตุใด"
    choices:
      - { id: a, text: "ฝาโลหะขยายตัวมากกว่าปากขวดแก้ว ฝาจึงหลวมขึ้น", correct: true }
      - { id: b, text: "น้ำร้อนทำให้แก้วหดตัว", feedback: "แก้วที่ร้อนขึ้นก็ขยายตัวเช่นกัน แต่ขยายน้อยกว่าโลหะ" }
      - { id: c, text: "น้ำร้อนละลายแยมที่ติดฝา", feedback: "อาจช่วยบ้าง แต่เหตุผลหลักคือฝาโลหะขยายตัว" }
      - { id: d, text: "ความเย็นออกจากฝา", feedback: "ไม่มีความเย็นไหล ความร้อนไหลจากน้ำร้อนเข้าสู่ฝา ฝาจึงร้อนขึ้นและขยายตัว" }
    hints:
      - "ส่วนที่โดนน้ำร้อนมากที่สุดคือฝา"
      - "โลหะขยายตัวมากกว่าแก้ว"
    solution: "ฝาโลหะรับความร้อนแล้วขยายตัวมากกว่าปากขวดแก้ว ช่องระหว่างฝากับเกลียวจึงหลวมขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.thermal.expansion-heat-transfer.p009
    topics: [physics.thermal.expansion-heat-transfer]
    difficulty: 3
    type: mcq
    stem: "แถบโลหะคู่ทำจากทองเหลือง (ขยายตัวมาก) ประกบกับเหล็ก (ขยายตัวน้อย) เมื่อแถบร้อนขึ้นจะโค้งอย่างไร"
    choices:
      - { id: a, text: "โค้งไปทางด้านเหล็ก เพราะทองเหลืองยาวกว่าจึงอยู่ด้านนอกของส่วนโค้ง", correct: true }
      - { id: b, text: "โค้งไปทางด้านทองเหลือง", feedback: "ด้านที่ยาวกว่าต้องอยู่ด้านนอกของส่วนโค้ง ทองเหลืองยาวกว่า จึงอยู่ด้านนอก แถบโค้งไปทางเหล็ก" }
      - { id: c, text: "ไม่โค้ง แค่ยาวขึ้นทั้งแถบ", feedback: "โลหะสองชนิดยืดไม่เท่ากันแต่ติดกันแน่น แถบจึงต้องโค้ง" }
      - { id: d, text: "หดสั้นลง", feedback: "โลหะทั้งสองยืดเมื่อร้อน ไม่ได้หด" }
    hints:
      - "นึกถึงลู่วิ่งโค้ง ลู่ด้านนอกยาวกว่าด้านใน"
      - "โลหะชนิดใดยาวกว่าเมื่อร้อน"
    solution: "ทองเหลืองยืดมากกว่า จึงต้องอยู่ด้านนอกของส่วนโค้ง แถบจึงโค้งไปทางเหล็ก ใช้ตัดวงจรในเตารีดเมื่อร้อนเกิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.thermal.expansion-heat-transfer.p010
    topics: [physics.thermal.expansion-heat-transfer]
    difficulty: 3
    type: mcq
    stem: "ตอนเที่ยงที่หาดบางแสน ทรายร้อนจนเดินเท้าเปล่าไม่ได้ แต่น้ำทะเลยังเย็น ทั้งที่ได้รับแสงแดดเท่ากัน ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "ทรายกับน้ำเป็นสสารต่างชนิดกัน เมื่อได้รับพลังงานเท่ากัน อุณหภูมิจึงเพิ่มไม่เท่ากัน", correct: true }
      - { id: b, text: "แสงแดดตกบนทรายมากกว่าบนน้ำ", feedback: "โจทย์บอกว่าได้รับแสงแดดเท่ากัน สิ่งที่ต่างคือชนิดของสสาร" }
      - { id: c, text: "น้ำทะเลมีความเย็นสะสมอยู่", feedback: "ไม่มีสิ่งที่เรียกว่าความเย็นสะสม น้ำร้อนขึ้นช้ากว่าเพราะเป็นสสารต่างชนิดกับทราย" }
      - { id: d, text: "ทรายสีเข้มกว่าน้ำเสมอ", feedback: "สีมีผลบ้าง แต่ถึงสีใกล้กัน น้ำก็ร้อนขึ้นช้ากว่าทรายมาก เพราะเป็นสสารต่างชนิดกัน" }
    hints:
      - "พลังงานเท่ากัน ทำให้สสารแต่ละชนิดร้อนขึ้นไม่เท่ากัน"
      - "น้ำต้องใช้พลังงานมากกว่าทรายจึงจะร้อนขึ้นเท่ากัน"
    solution: "สสารต่างชนิดกันได้รับพลังงานเท่ากันแล้วอุณหภูมิเพิ่มไม่เท่ากัน น้ำต้องใช้พลังงานมากจึงร้อนช้า ทรายร้อนเร็ว (น้ำยังพาความร้อนลงไปผสมกับน้ำด้านล่างด้วย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.thermal.expansion-heat-transfer.p011
    topics: [physics.thermal.expansion-heat-transfer]
    difficulty: 3
    type: numeric
    stem: "ใช้เครื่องทำความร้อนเครื่องเดียวกันให้พลังงานเท่ากันแก่น้ำสองหม้อ หม้อที่มีน้ำ $1\\ \\mathrm{kg}$ ร้อนขึ้น $10\\ ^\\circ\\mathrm{C}$ หม้อที่มีน้ำ $2\\ \\mathrm{kg}$ จะร้อนขึ้นกี่องศาเซลเซียส (ไม่มีความร้อนสูญเสีย)"
    answer: { value: 5, tolerance: 0.05, unit: "°C" }
    misconceptions:
      - { match: 20, feedback: "คิดว่ามวลมากร้อนขึ้นมาก แต่พลังงานเท่ากันต้องแบ่งให้อนุภาคมากขึ้น อุณหภูมิจึงเพิ่มน้อยลง" }
      - { match: 10, feedback: "คิดว่ามวลไม่มีผล แต่น้ำ 2 kg ต้องใช้พลังงานสองเท่าจึงจะร้อนขึ้นเท่ากัน" }
    hints:
      - "พลังงานเท่ากัน แต่มวลเป็นสองเท่า"
      - "อุณหภูมิที่เพิ่มแปรผกผันกับมวล"
    solution: "น้ำมวลสองเท่าได้รับพลังงานเท่าเดิม อุณหภูมิจึงเพิ่มครึ่งหนึ่ง คือ $10/2 = 5\\ ^\\circ\\mathrm{C}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.thermal.expansion-heat-transfer.p012
    topics: [physics.thermal.expansion-heat-transfer]
    difficulty: 3
    type: order
    stem: "เรียงลำดับเหตุการณ์ของการพาความร้อนในหม้อน้ำที่ตั้งบนเตา"
    items:
      - "เตาให้ความร้อนแก่ก้นหม้อ"
      - "น้ำที่ก้นหม้อร้อนขึ้นและขยายตัว"
