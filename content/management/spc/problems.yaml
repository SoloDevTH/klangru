  - id: management.quality.spc.p019
    topics: [management.quality.spc]
    difficulty: 4
    type: numeric
    stem: "โรงงานยาวัดน้ำหนักเม็ดยากลุ่มย่อยละ 10 เม็ด ใช้แผนภูมิ x̄–s ได้ $\\bar{\\bar{x}} = 12.00$ mg และ $\\bar{s} = 0.30$ mg ($A_3 = 0.975$ เมื่อ $n = 10$) เส้นควบคุมบนของแผนภูมิ x̄ เป็นเท่าใด (ตอบในหน่วย mg ทศนิยม 3 ตำแหน่ง)"
    answer: { value: 12.293, unit: mg, tolerance: 0.003 }
    hints:
      - "$\\text{UCL} = \\bar{\\bar{x}} + A_3\\bar{s}$"
      - "$12.00 + 0.975 \\times 0.30$"
    misconceptions:
      - { match: 12.9, feedback: "ดูเหมือนใช้ $3\\bar{s}$ ซึ่งเป็นเส้นของค่าเดี่ยว ค่าเฉลี่ยของ 10 เม็ดผันแปรน้อยกว่า" }
      - { match: 11.708, feedback: "นั่นคือเส้นควบคุมล่าง ($\\bar{\\bar{x}} - A_3\\bar{s}$)" }
    solution: "$\\text{UCL} = 12.00 + 0.975(0.30) = 12.2925 \\approx 12.293$ mg"
    license: CC-BY-SA-4.0
    ai_assisted: true
