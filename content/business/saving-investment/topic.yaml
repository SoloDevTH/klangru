id: business.econ.saving-investment
subject: business
title:
  th: การออม การลงทุน ความเสี่ยง และผลตอบแทน
  en: Saving, investing, risk and return
summary: ความหมายและความสำคัญของการออมและการลงทุน ปัจจัยที่มีผล ดอกเบี้ยทบต้นและเงินเฟ้อ ทางเลือกการออมในไทย ความเสี่ยงกับผลตอบแทน และการกระจายความเสี่ยง
difficulty: 3.5
minutes: 40
