id: biology.animals.needs-life-cycles
subject: biology
title: { th: ปัจจัยในการดำรงชีวิตและวัฏจักรชีวิตของสัตว์, en: "What animals need to live and animal life cycles" }
summary: อาหาร น้ำ และอากาศที่คนและสัตว์ต้องการ การดูแลตนเองและสัตว์ วัฏจักรชีวิตของผีเสื้อ กบ ไก่ และคน การเปรียบเทียบ และการไม่รบกวนวัฏจักรชีวิตของสัตว์
difficulty: 1.5
minutes: 30
prerequisites: [biology.humans.body-parts]
encompasses:
  - { id: biology.humans.body-parts, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - { type: check, problem: biology.animals.needs-life-cycles.p001, prompt: "ลองตอบก่อนดูภาพวัฏจักรชีวิต" }
  - type: figure
    title: วัฏจักรชีวิตของสัตว์ 4 ชนิด
    src: life-cycles.svg
    alt: "แผนภาพ 4 ช่อง แต่ละช่องมีลูกศรวนตามเข็มนาฬิกา ช่องผีเสื้อ (แมลง): ไข่บนใบไม้ → หนอน → ดักแด้ห้อยจากกิ่ง → ผีเสื้อ ช่องกบ (สัตว์สะเทินน้ำสะเทินบก): ไข่ในวุ้น → ลูกอ๊อด → ลูกอ๊อดมีขา → ลูกกบหางสั้น → กบ ช่องไก่ (สัตว์ปีก): ไข่ → ลูกไก่ → ไก่รุ่น → ไก่โต ช่องคน (สัตว์เลี้ยงลูกด้วยน้ำนม): ทารก → วัยเด็ก → วัยรุ่น → ผู้ใหญ่ ทุกวงวนกลับไปที่จุดเริ่มต้น"
    caption: "ทุกวัฏจักรมีการเกิด เติบโต และสืบพันธุ์ แต่ผีเสื้อและกบเปลี่ยนรูปร่างมาก ส่วนลูกไก่และทารกคล้ายพ่อแม่ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: เปรียบเทียบวัฏจักรชีวิตของกบกับไก่
    problem: "บอกว่าวัฏจักรชีวิตของกบกับไก่เหมือนกันและต่างกันอย่างไร"
    steps:
      - text: "เขียนระยะของกบ: ไข่ในวุ้น → ลูกอ๊อด → ลูกอ๊อดมีขา → ลูกกบ → กบ (5 ระยะ)"
      - text: "เขียนระยะของไก่: ไข่ → ลูกไก่ → ไก่รุ่น → ไก่โต (4 ระยะ)"
      - text: "หาสิ่งที่เหมือน: ทั้งคู่เริ่มจากไข่ เติบโต และเมื่อโตแล้ววางไข่ต่อ"
      - text: "หาสิ่งที่ต่าง: ลูกอ๊อดอยู่ในน้ำ มีหาง ไม่เหมือนกบ ส่วนลูกไก่คล้ายพ่อแม่ตั้งแต่ฟักออกจากไข่"
        why: "การเปรียบเทียบที่ดีบอกทั้งส่วนที่เหมือนและส่วนที่ต่าง"
    answer: "เหมือน: เริ่มจากไข่และเติบโตจนวางไข่ต่อ ต่าง: กบเปลี่ยนรูปร่างมากจากลูกอ๊อดในน้ำ ไก่ไม่เปลี่ยนรูปร่าง"
  - type: figure
    title: มวลของลูกไก่ตามอายุ
    src: chick-growth.svg
    alt: "กราฟแท่งมวลของลูกไก่ตัวหนึ่ง (ข้อมูลสมมติ) อายุ 0 ถึง 6 สัปดาห์ มวล 35, 70, 120, 190, 280, 380 และ 480 กรัมตามลำดับ แท่งสูงขึ้นทุกสัปดาห์"
    caption: "ชั่งมวลซ้ำทุกสัปดาห์แล้วเขียนกราฟ แท่งที่สูงขึ้นแสดงว่าลูกไก่เจริญเติบโต (ข้อมูลสมมติ วาดโดยทีมคลังรู้)"
  - { type: check, problem: biology.animals.needs-life-cycles.p008, prompt: "ใช้ภาพวัฏจักรชีวิตของกบช่วยเรียง" }
glossary:
  - { term: วัฏจักรชีวิต, definition: "ลำดับการเปลี่ยนแปลงของสิ่งมีชีวิตตั้งแต่เกิด เติบโต จนมีลูก แล้ววนซ้ำในรุ่นต่อไป" }
  - { term: การเจริญเติบโต, definition: "การที่ร่างกายมีขนาด ความสูง หรือมวลเพิ่มขึ้น" }
  - { term: ดักแด้, definition: "ระยะที่แมลง เช่น ผีเสื้อ ห่อตัวนิ่งและไม่กินอาหาร ขณะเปลี่ยนร่างเป็นตัวเต็มวัย" }
  - { term: ลูกอ๊อด, definition: "ตัวอ่อนของกบและคางคก อยู่ในน้ำ มีหาง และหายใจด้วยเหงือก" }
  - { term: ตัวโม่ง, definition: "ระยะดักแด้ของยุง อยู่ในน้ำราว 2 วันก่อนเป็นยุง" }
flashcards:
  - { front: "คนและสัตว์ต้องการอะไรในการดำรงชีวิต", back: "อาหาร น้ำ และอากาศ (และที่อยู่ที่ปลอดภัย)" }
  - { front: "วัฏจักรชีวิตของผีเสื้อ", back: "ไข่ → หนอน → ดักแด้ → ผีเสื้อ" }
  - { front: "วัฏจักรชีวิตของกบ", back: "ไข่ในวุ้น → ลูกอ๊อด → ลูกอ๊อดมีขา → ลูกกบหางสั้น → กบ" }
  - { front: "ทำไมต้องเปลี่ยนน้ำในภาชนะทุก 7 วัน", back: "ยุงลายใช้ราว 9 วันจากไข่ถึงยุง การเปลี่ยนน้ำทุก 7 วันตัดวัฏจักรก่อนเป็นยุง" }
  - { front: "สิ่งที่วัฏจักรชีวิตของสัตว์ทุกชนิดมีเหมือนกัน", back: "เกิด เจริญเติบโต สืบพันธุ์ และตาย" }
