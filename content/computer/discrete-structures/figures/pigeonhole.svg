<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240"><title>นกห้าตัวใส่ในรังสี่รัง อย่างน้อยหนึ่งรังมีนกตั้งแต่สองตัวขึ้นไป</title><rect width="720" height="240" fill="#ffffff"/><rect x="60" y="110" width="120" height="90" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text x="120" y="100" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">รัง 1</text><rect x="220" y="110" width="120" height="90" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text x="280" y="100" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">รัง 2</text><rect x="380" y="110" width="120" height="90" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text x="440" y="100" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">รัง 3</text><rect x="540" y="110" width="120" height="90" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text x="600" y="100" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">รัง 4</text><circle cx="110" cy="140" r="11" fill="#1d4ed8" stroke="none"/><circle cx="138" cy="170" r="11" fill="#1d4ed8" stroke="none"/><circle cx="270" cy="140" r="11" fill="#1d4ed8" stroke="none"/><circle cx="430" cy="140" r="11" fill="#1d4ed8" stroke="none"/><circle cx="590" cy="140" r="11" fill="#1d4ed8" stroke="none"/><text x="360" y="40" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="normal">นกห้าตัวอยู่ในรังสี่รัง จึงมีรังหนึ่งที่มีนกอย่างน้อยสองตัว</text><text x="360" y="226" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal">หลักรังนกพิราบ: ถ้าใส่ n + 1 ชิ้นในรัง n รัง จะมีรังที่ใส่เกินหนึ่งชิ้น</text></svg>
