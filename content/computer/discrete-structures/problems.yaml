  - id: computer.theory.discrete-structures.p015
    topics: [computer.theory.discrete-structures]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน is_equivalence(universe, pairs) โดย universe เป็นเซตของสมาชิก และ pairs เป็นเซตของคู่อันดับ ให้คืน True เมื่อความสัมพันธ์นั้นสะท้อน สมมาตร และถ่ายทอดบน universe"
    starter: |
      def is_equivalence(universe, pairs):
          # ตอนนี้ตอบ True เสมอ ยังไม่ได้ตรวจสมบัติ
          return True
    tests: |
      U = {1, 2, 3}
      good = {(1, 1), (2, 2), (3, 3), (1, 2), (2, 1), (1, 3), (3, 1), (2, 3), (3, 2)}
      assert is_equivalence(U, good) == True, "ความสัมพันธ์ทั้งหมดบนเซตนี้เป็นความสัมพันธ์สมมูล"
      no_reflexive = good - {(2, 2)}
      assert is_equivalence(U, no_reflexive) == False, "ขาด (2, 2) จึงไม่สะท้อน"
      not_transitive = {(1, 1), (2, 2), (3, 3), (1, 2), (2, 1), (2, 3), (3, 2)}
      assert is_equivalence(U, not_transitive) == False, "มี (1, 2) และ (2, 3) แต่ไม่มี (1, 3) จึงไม่ถ่ายทอด"
    reference: |
      def is_equivalence(universe, pairs):
          R = set(pairs)
          refl = all((a, a) in R for a in universe)
          symm = all((b, a) in R for (a, b) in R)
          trans = all((a, d) in R for (a, b) in R for (c, d) in R if b == c)
          return refl and symm and trans
    hints:
      - "ตรวจแยกทีละสมบัติ: สะท้อนดูว่า (a, a) อยู่ในเซตหรือไม่"
      - "ถ่ายทอดต้องดูทุกคู่ที่ต่อกันได้ เช่น (a, b) กับ (b, c) แล้วตรวจว่า (a, c) อยู่ด้วยหรือไม่"
    solution: "ตรวจสะท้อนกับทุกสมาชิก สมมาตรกับทุกคู่ และถ่ายทอดกับทุกคู่ที่ต่อกันได้ แล้วรวมด้วย and"
    license: CC-BY-SA-4.0
    ai_assisted: true

