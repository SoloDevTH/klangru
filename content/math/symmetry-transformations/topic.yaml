id: math.geometry.symmetry-transformations
subject: math
title: { th: สมมาตรและการแปลงทางเรขาคณิต, en: Symmetry and geometric transformations }
summary: หาแกนสมมาตรและสมมาตรแบบหมุน เลื่อนขนาน สะท้อน หมุนรอบจุดใด ๆ และขยายด้วยตัวประกอบสเกลที่เป็นเศษส่วนหรือลบ แล้วใช้การแปลงต่อเนื่องสร้างลวดลายและเทสเซลเลชัน
difficulty: 3.5
minutes: 40
prerequisites: [math.geometry.shapes, math.functions.coordinate-plane, math.geometry.angles]
encompasses:
  - { id: math.functions.coordinate-plane, weight: 0.3 }
  - { id: math.geometry.angles, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: symmetry-axes.svg
    alt: "รูปหกรูปพร้อมแกนสมมาตรเป็นเส้นประสีแดง สามเหลี่ยมด้านเท่า 3 แกน สี่เหลี่ยมจัตุรัส 4 แกน สี่เหลี่ยมผืนผ้า 2 แกน คางหมูหน้าจั่ว 1 แกน สี่เหลี่ยมด้านขนานไม่มีแกนสมมาตร และหกเหลี่ยมด้านเท่า 6 แกน"
    caption: "เส้นทแยงมุมของสี่เหลี่ยมผืนผ้าไม่ใช่แกนสมมาตร"
  - { type: check, problem: math.geometry.symmetry-transformations.p003, prompt: "ลองพับธงในใจทั้งแนวตั้งและแนวนอน" }
  - type: figure
    src: transformations-grid.svg
    alt: "ระนาบพิกัด สามเหลี่ยมต้นแบบสีเขียวมีจุดยอด (1, 1), (4, 1), (1, 3) ภาพสะท้อนในแกน y สีส้มมีจุดยอด (−1, 1), (−4, 1), (−1, 3) ภาพจากการหมุน 180 องศารอบจุดกำเนิดสีน้ำเงินมีจุดยอด (−1, −1), (−4, −1), (−1, −3) ภาพจากการเลื่อนขนานด้วย (1, −5) สีม่วงมีจุดยอด (2, −4), (5, −4), (2, −2)"
    caption: "ภาพทั้งสามเท่ากันทุกประการกับต้นแบบ แต่ภาพสะท้อนพลิกด้าน"
  - type: worked-example
    title: หมุนรอบจุดที่ไม่ใช่จุดกำเนิด
    problem: "หมุนจุด $A(6, 2)$ รอบจุด $C(3, 1)$ เป็นมุม $90^\\circ$ ทวนเข็มนาฬิกา หาพิกัดของ $A'$"
    steps:
      - text: "หาตำแหน่งของ $A$ เทียบกับ $C$: ขวา $6 - 3 = 3$ ขึ้น $2 - 1 = 1$ คือ $(3, 1)$"
        why: "การหมุนรอบ $C$ ทำงานกับระยะจาก $C$ ไม่ใช่ระยะจากจุดกำเนิด"
      - text: "หมุน $(3, 1)$ ทวนเข็ม $90^\\circ$ ด้วย $(x, y) \\to (-y, x)$ ได้ $(-1, 3)$"
      - text: "ย้ายกลับไปเทียบกับ $C$: $A' = (3 + (-1),\\ 1 + 3) = (2, 4)$"
      - text: "ตรวจ: $CA = \\sqrt{3^2 + 1^2} = \\sqrt{10}$ และ $CA' = \\sqrt{1^2 + 3^2} = \\sqrt{10}$ เท่ากัน"
    answer: "$A'(2, 4)$"
  - { type: check, problem: math.geometry.symmetry-transformations.p007, prompt: "จุดอยู่ห่างจากเส้นกระจกกี่หน่วย" }
  - type: figure
    src: thai-pattern.svg
    alt: "ลวดลายแถบสามแถว แต่ละแถวใช้ลวดลายต้นแบบรูปเปลวไฟเดียวกันหกตัว แถวที่ 1 เลื่อนขนานไปทางขวาทีละเท่า ๆ กันทุกตัวหันทางเดียวกัน แถวที่ 2 สลับลายเดิมกับภาพสะท้อนในเส้นแนวตั้ง แถวที่ 3 สลับลายเดิมกับลายที่หมุนครึ่งรอบ"
    caption: "ลายผ้าและลายกระเบื้องไทยจำนวนมากสร้างจากการแปลงสามแบบนี้ประกอบกัน"
  - type: worked-example
    title: ลำดับการแปลงที่ส่งรูปหนึ่งไปทับอีกรูป
    problem: "สามเหลี่ยม $T$ มีจุดยอด $(1, 1), (3, 1), (1, 2)$ สามเหลี่ยม $U$ มีจุดยอด $(-1, -4), (-3, -4), (-1, -5)$ บอกลำดับการแปลงที่ส่ง $T$ ไปเป็น $U$"
    steps:
      - text: "เทียบจุดที่สมนัยกัน: $(1, 1) \\to (-1, -4)$, $(3, 1) \\to (-3, -4)$, $(1, 2) \\to (-1, -5)$"
      - text: "ลองหมุน $T$ $180^\\circ$ รอบจุดกำเนิด $(x, y) \\to (-x, -y)$ ได้ $(-1, -1), (-3, -1), (-1, -2)$"
      - text: "เทียบกับ $U$: ทุกจุดต้องลงอีก 3 หน่วย จึงเลื่อนขนานด้วย $(0, -3)$"
        why: "เมื่อรูปร่างและทิศตรงกันแล้ว เหลือแค่ตำแหน่ง ซึ่งแก้ได้ด้วยการเลื่อนขนาน"
      - text: "รูปสองรูปจึงเท่ากันทุกประการ เพราะมีลำดับการแปลงที่รักษาระยะส่งรูปหนึ่งไปทับอีกรูป"
    answer: "หมุน $180^\\circ$ รอบจุดกำเนิด แล้วเลื่อนขนานด้วย $(0, -3)$"
  - type: interactive
    title: ขยายด้วยตัวประกอบสเกล k
    caption: "เส้นตรง y = 0.5x + 1 กับภาพเมื่อขยายจากจุดกำเนิดด้วยตัวประกอบสเกล k ลองให้ k เป็นลบหรือเศษส่วน แล้วสังเกตว่าภาพยังขนานกับเส้นเดิม"
    widget:
      kind: function-plot
      functions: ["0.5 x + 1", "0.5 x + k"]
      sliders:
        - { name: k, min: -3, max: 3, step: 0.5, value: 2, label: ตัวประกอบสเกล }
      x: [-6, 6]
      y: [-6, 6]
glossary:
  - { term: แกนสมมาตร, definition: "เส้นที่พับรูปแล้วสองข้างทับกันสนิท" }
  - { term: สมมาตรแบบหมุน, definition: "สมบัติที่หมุนรูปรอบจุดศูนย์กลางน้อยกว่าหนึ่งรอบแล้วทับรูปเดิมพอดี จำนวนครั้งในหนึ่งรอบคืออันดับ" }
  - { term: การเลื่อนขนาน, definition: "การแปลงที่ทุกจุดเคลื่อนไปทางเดียวกันเป็นระยะเท่ากัน" }
  - { term: การสะท้อน, definition: "การแปลงที่เส้นสะท้อนเป็นเส้นแบ่งครึ่งและตั้งฉากกับส่วนของเส้นตรงที่เชื่อมจุดกับภาพ" }
  - { term: การหมุน, definition: "การแปลงที่ทุกจุดหมุนรอบจุดหมุนเป็นมุมเท่ากัน และอยู่ห่างจากจุดหมุนเท่าเดิม" }
  - { term: ตัวประกอบสเกล, definition: "จำนวนที่คูณระยะจากจุดศูนย์กลางในการขยาย ถ้าเป็นลบภาพจะอยู่อีกฝั่งของจุดศูนย์กลาง" }
  - { term: เทสเซลเลชัน, definition: "การปูรูปเต็มระนาบโดยไม่เว้นช่องและไม่ซ้อนกัน" }
flashcards:
  - { front: "สะท้อนในเส้น $x = k$", back: "$(x, y) \\to (2k - x, y)$" }
  - { front: "หมุน $90^\\circ$ ทวนเข็มนาฬิการอบจุดกำเนิด", back: "$(x, y) \\to (-y, x)$" }
  - { front: "สะท้อนในเส้นขนานสองเส้นที่ห่างกัน $d$", back: "เท่ากับเลื่อนขนาน $2d$" }
  - { front: "ขยายด้วยตัวประกอบสเกล $k$ ความยาวและพื้นที่เปลี่ยนอย่างไร", back: "ความยาวคูณ $|k|$ พื้นที่คูณ $k^2$" }
  - { front: "รูปหลายเหลี่ยมด้านเท่าที่ปูเต็มระนาบได้", back: "สามเหลี่ยมด้านเท่า สี่เหลี่ยมจัตุรัส หกเหลี่ยมด้านเท่า" }
