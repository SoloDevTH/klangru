<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" font-family="sans-serif" font-size="15">
  <title>สี่เหลี่ยมจัตุรัสด้าน a + b แบ่งเป็น a², ab, ab และ b²</title>
  <rect x="0" y="0" width="360" height="330" fill="#ffffff"/>
  <rect x="70.0" y="55.0" width="170.0" height="170.0" rx="0" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="155.0" y="148.0" font-size="22" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="italic">a²</text>
  <rect x="240.0" y="55.0" width="85.0" height="170.0" rx="0" fill="#fbe7da" stroke="#15211e" stroke-width="2"/>
  <text x="282.5" y="148.0" font-size="22" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="italic">ab</text>
  <rect x="70.0" y="225.0" width="170.0" height="85.0" rx="0" fill="#fbe7da" stroke="#15211e" stroke-width="2"/>
  <text x="155.0" y="275.5" font-size="22" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="italic">ab</text>
  <rect x="240.0" y="225.0" width="85.0" height="85.0" rx="0" fill="#e3e7f6" stroke="#15211e" stroke-width="2"/>
  <text x="282.5" y="275.5" font-size="22" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="italic">b²</text>
  <text x="155.0" y="43.0" font-size="18" text-anchor="middle" fill="#0a6b60" font-weight="normal" font-style="italic">a</text>
  <text x="282.5" y="43.0" font-size="18" text-anchor="middle" fill="#b4521f" font-weight="normal" font-style="italic">b</text>
  <text x="56.0" y="146.0" font-size="18" text-anchor="middle" fill="#0a6b60" font-weight="normal" font-style="italic">a</text>
  <text x="56.0" y="273.5" font-size="18" text-anchor="middle" fill="#b4521f" font-weight="normal" font-style="italic">b</text>
  <line x1="70.0" y1="23.0" x2="325.0" y2="23.0" stroke="#15211e" stroke-width="1.4" stroke-linecap="round"/>
  <text x="197.5" y="17.0" font-size="15" text-anchor="middle" fill="#15211e" font-weight="normal" font-style="normal">a + b</text>
</svg>
