  - กำไรส่วนเกินรวม $=$ กำไรส่วนเกินต่อชิ้น $\times$ จำนวนชิ้น
  solution: 'ปกติ: $(100 - 60) \times 300 = 12{,}000$ บาท · แบบ ก: $(80 - 60) \times 450 = 9{,}000$ บาท · แบบ ข: รายได้ $200$ บาทต่อ $3$ ชิ้น $\approx 66.67$ บาทต่อชิ้น กำไรส่วนเกิน $\approx 6.67 \times 600 = 4{,}000$ บาท โปรช่วยเพิ่มยอดขายแต่ลดกำไร เว้นแต่มีเป้าหมายอื่น เช่น ระบายสินค้าใกล้หมดอายุหรือหาลูกค้าใหม่'
