<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 350" width="460" height="350" font-family="sans-serif" font-size="14">
<title>สคริปต์แบบบล็อกของเกมเก็บผลไม้ เริ่มจากเมื่อกดธงเขียว แล้วตั้งคะแนนเป็น 0 และทำซ้ำตลอดไปโดยให้ผลไม้เลื่อนลง ถ้าชนตะกร้าจะเพิ่มคะแนนทีละ 1</title>
<rect x="0" y="0" width="460" height="350" fill="#ffffff"/>
<rect x="30" y="30" width="330" height="38" rx="10" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
<text x="44" y="54" fill="#1f2937">เมื่อกดธงเขียว</text>
<rect x="30" y="80" width="330" height="38" rx="10" fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
<text x="44" y="104" fill="#1f2937">ตั้ง คะแนน เป็น 0</text>
<rect x="30" y="130" width="330" height="38" rx="10" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/>
<text x="44" y="154" fill="#1f2937">ทำซ้ำตลอดไป</text>
<line x1="42" y1="168" x2="42" y2="300" stroke="#9a3412" stroke-width="3"/>
<rect x="54" y="180" width="306" height="38" rx="10" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/>
<text x="68" y="204" fill="#1f2937">ให้ผลไม้เลื่อนลง 3 ก้าว</text>
<rect x="54" y="230" width="306" height="38" rx="10" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
<text x="68" y="254" fill="#1f2937">ถ้า ชนตะกร้า แล้ว</text>
<line x1="66" y1="268" x2="66" y2="300" stroke="#166534" stroke-width="3"/>
<rect x="78" y="280" width="282" height="38" rx="10" fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
<text x="92" y="304" fill="#1f2937">เปลี่ยน คะแนน ทีละ 1</text>
<text x="230.0" y="338" text-anchor="middle" fill="#6b7280" font-size="12">อ่านจากบนลงล่าง บล็อกที่ย่อหน้าเข้าไปอยู่ในวงวนหรือเงื่อนไข</text>
</svg>