id: health.sport.modified-games-inclusion
subject: health
title: { th: ปรับกติกา อุปกรณ์ และการนับคะแนนเพื่อความยุติธรรมและให้ทุกคนได้เล่น, en: "Modifying rules, equipment and scoring so that everyone can play fairly" }
summary: ปรับกติกา พื้นที่ อุปกรณ์ และการนับคะแนนให้ทุกคนได้เล่นอย่างยุติธรรม ด้วยกรอบ STEP และการประเมินเกมที่ปรับแล้ว
difficulty: 3
minutes: 30
prerequisites: [health.sport.rules-fair-play]
encompasses:
  - { id: health.sport.rules-fair-play, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: กรอบ STEP สี่ด้านสำหรับปรับเกม
    src: step-framework.svg
    alt: "กรอบสี่ช่องเรียงจากซ้ายไปขวา: พื้นที่ (Space) ลดขนาดสนามและทำเขตปลอดภัย, งาน (Task) เปลี่ยนเป้าหมายให้เล่นได้หลายแบบ, อุปกรณ์ (Equipment) ใช้ลูกบอลนิ่มหรือเบาลง, ผู้เล่น (People) แบ่งทีมให้ทักษะสมดุลกัน"
    caption: "ปรับทีละด้าน แล้วทดลองซ้ำก่อนตัดสินว่าได้ผลหรือไม่"
  - { type: check, problem: health.sport.modified-games-inclusion.p002, prompt: "ลองคิดก่อนอ่านต่อ: จับคู่ด้านของ STEP กับการปรับที่ทำได้" }
  - { type: check, problem: health.sport.modified-games-inclusion.p004, prompt: "ลองคิดก่อนอ่านต่อ: ทีม A ได้คะแนนรวมเท่าไรเมื่อมีโบนัส" }
  - type: figure
    title: ตัวอย่างการนับคะแนนแบบมีโบนัสการส่งบอล
    src: scoring-example.svg
    alt: "แผนภูมิแท่งเปรียบเทียบสองทีม ทีม A มีแท่งสีน้ำเงินยิง 4 และแท่งสีส้มโบนัส 3 รวม 7 คะแนน ทีม B มีแท่งสีน้ำเงินยิง 5 รวม 5 คะแนน"
    caption: "โบนัสการส่งบอลช่วยให้ทีมที่ส่งบอลกันทั่วถึงได้คะแนนเพิ่ม โดยไม่ต้องเป็นผู้ยิงเก่งที่สุด"
  - type: worked-example
    title: คิดคะแนนเมื่อมีโบนัสการส่งบอล
    problem: "ทีม A ยิงเข้า 4 ลูก ลูกละ 1 คะแนน และได้โบนัสการส่งบอล 3 ครั้ง ครั้งละ 1 คะแนน ทีม B ยิงเข้า 5 ลูกและไม่มีโบนัส ทีมไหนได้คะแนนมากกว่า และต่างกันกี่คะแนน"
    steps:
      - text: "คำนวณคะแนนทีม A: จากการยิง 4 + โบนัส 3 = 7 คะแนน"
        why: "คะแนนสองส่วนนับแยกกันก่อนแล้วจึงรวม ไม่ได้คูณกัน"
      - text: "คำนวณคะแนนทีม B: จากการยิง 5 + โบนัส 0 = 5 คะแนน"
      - text: "เปรียบเทียบ: 7 − 5 = 2 คะแนน ทีม A ได้มากกว่า"
        why: "ผลนี้ขึ้นกับกติกาที่ตกลงกันไว้ ถ้ากติกาเปลี่ยนผลก็เปลี่ยนได้"
    answer: "ทีม A ได้มากกว่า 2 คะแนน"
  - type: worked-example
    title: แบ่งพื้นที่ให้ผู้เล่นแต่ละคนเท่ากัน
    problem: "สนามกว้าง 20 เมตร ยาว 12 เมตร มีผู้เล่น 12 คน ถ้าแบ่งพื้นที่ให้ทุกคนเท่ากัน แต่ละคนได้กี่ตารางเมตร"
    steps:
      - text: "หาพื้นที่ทั้งสนาม: 20 × 12 = 240 ตารางเมตร"
      - text: "แบ่งให้ผู้เล่น 12 คน: 240 ÷ 12 = 20 ตารางเมตรต่อคน"
        why: "การแบ่งเท่ากันทำให้ทุกคนมีที่เคลื่อนไหวเท่ากัน ไม่มีใครถูกเบียดหรือถูกกันออก"
      - text: "ถ้าผู้เล่นมากขึ้นหรือพื้นที่เล็กลง พื้นที่ต่อคนจะลดลง จึงควรปรับจำนวนคนหรือขนาดสนามตาม"
    answer: "คนละ 20 ตารางเมตร"
glossary:
  - { term: กติกาดัดแปลง (modified game), definition: "เกมที่ปรับกติกา พื้นที่ อุปกรณ์ หรือการนับคะแนนให้เหมาะกับผู้เล่น โดยยังคงลักษณะของกีฬานั้น" }
  - { term: กรอบ STEP, definition: "กรอบสี่ด้านสำหรับปรับเกม ได้แก่ พื้นที่ (Space) งาน (Task) อุปกรณ์ (Equipment) และผู้เล่น (People)" }
  - { term: การเล่นแง่ (gamesmanship), definition: "การใช้วิธีที่ไม่ผิดกติกาโดยตรงแต่ไม่ยุติธรรม เพื่อให้ตนได้เปรียบ" }
  - { term: น้ำใจนักกีฬา, definition: "การเคารพกติกา คู่แข่ง ผู้ตัดสิน และผลของเกม รวมถึงการรู้แพ้ รู้ชนะ และรู้อภัย" }
flashcards:
  - { front: "กรอบ STEP ย่อมาจากอะไร", back: "Space พื้นที่, Task งาน, Equipment อุปกรณ์, People ผู้เล่น" }
  - { front: "ทำไมควรให้ทุกคนช่วยตั้งกติกา", back: "เพราะทุกคนเข้าใจและรู้สึกเป็นเจ้าของกติกา จึงปฏิบัติตามได้ดีขึ้น" }
  - { front: "โบนัสการส่งบอลให้เพื่อนที่ยังไม่ได้แตะบอลช่วยอะไร", back: "ช่วยให้ทุกคนมีส่วนร่วมและไม่ให้คะแนนไปอยู่กับคนเก่งเพียงคนเดียว" }
  - { front: "น้ำใจนักกีฬาคืออะไร", back: "การเคารพกติกา คู่แข่ง และผลของเกม รวมถึงการรู้แพ้ รู้ชนะ และรู้อภัย" }
