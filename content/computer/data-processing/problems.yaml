    solution: "แถวที่เหลือมีจำนวนแก้ว 3, 5, 4, 6, 2, 7, 1 รวม 28 หารด้วย 7 ได้ 4 แก้วต่อสัปดาห์ เทียบกับข้อมูลดิบที่ได้ 10.3 จะเห็นว่าการทำความสะอาดเปลี่ยนข้อสรุปมาก"
