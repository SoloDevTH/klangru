topic: computer.algorithms.data-structures
rows:
  - { framework: acm-cs2023, indicators: ["AL-Foundational"], coverage: partial, note: "สแตก คิว ตารางแฮช (การชนกัน) ต้นไม้ค้นหาแบบทวิภาค (ค้นหา ใส่ ต้นไม้เอียง) กราฟแบบลิสต์ประชิดและเมทริกซ์ประชิด และอัลกอริทึมกราฟ BFS กับ DFS ส่วนอาร์เรย์ ลิสต์ เซต การค้นหา และการเรียงลำดับอยู่ในหัวข้อก่อนหน้า ยังไม่มีอัลกอริทึมกราฟแบบมีน้ำหนัก (เช่น ทางสั้นที่สุดแบบดิกสตรา ต้นไม้แผ่ทั่วที่น้อยที่สุด)" }
  - { framework: acm-cs2023, indicators: ["SDF-Data-Structures"], coverage: full, note: "สแตก (ลิสต์ append/pop) คิว (deque) ดิกชันนารีและเซตในฐานะตารางแฮช การเลือกใช้ตามงาน และผลต่อสมรรถนะ (list.pop(0) กับ deque, ต้นไม้เอียง, ลิสต์กับเมทริกซ์ประชิด) โดยลิสต์และการประมวลผลสตริงสอนแล้วใน computer.programming.lists-strings ซึ่งเป็น prerequisite ทางอ้อม" }
  - { framework: csta-k12-cs, indicators: ["3B-AP-12"], coverage: full, note: "เปรียบเทียบสแตก คิว ตารางแฮช ต้นไม้ค้นหาแบบทวิภาค และกราฟ ด้านการทำงาน เวลา หน่วยความจำ และงานที่เหมาะ (ตารางเลือกโครงสร้าง โจทย์จับคู่งาน ระบบคะแนนที่ใช้สองโครงสร้างคู่กัน)" }
