id: health.body.organ-system-maintenance
subject: health
title:
  th: การดำรงประสิทธิภาพของระบบอวัยวะและการวางแผนดูแลสุขภาพตนเองและครอบครัว
  en: Maintaining organ-system function and planning health care for yourself and your family
summary: ระบบอวัยวะทำงานร่วมกันเพื่อรักษาดุลยภาพ หลักการสร้างเสริมและดำรงการทำงาน ผลของอาหาร การออกกำลังกาย และสารเสพติด การตรวจสุขภาพตามวัย และการวางแผนดูแลสุขภาพครอบครัว
difficulty: 5
minutes: 40
prerequisites:
- health.body.nervous-endocrine-care
- health.body.digestive-excretory-care
- health.body.musculoskeletal-care
encompasses:
- id: health.body.nervous-endocrine-care
  weight: 0.2
- id: health.body.digestive-excretory-care
  weight: 0.2
- id: health.body.musculoskeletal-care
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: ระบบอวัยวะทำงานร่วมกันขณะวิ่ง
  src: systems-teamwork.svg
  alt: กล่องกลางคือระบบประสาทและต่อมไร้ท่อ รับรู้และสั่งการ มีลูกศรชี้ไปห้ากล่อง กล้ามเนื้อ ต้องการออกซิเจนและพลังงานมากขึ้น ระบบหายใจ หายใจเร็วและลึกขึ้น รับออกซิเจนมากขึ้น ผิวหนัง ขับเหงื่อ ระบายความร้อน ระบบหมุนเวียนเลือด หัวใจเต้นเร็วขึ้น ส่งเลือดไปกล้ามเนื้อ ระบบขับถ่าย (ไต) ลดการขับน้ำ ไม่ให้ขาดน้ำ ด้านบนเขียนว่าอุณหภูมิ น้ำ และออกซิเจนในร่างกายจึงคงที่
- type: worked-example
  title: อธิบายว่าการออกกำลังกายสร้างเสริมหลายระบบอย่างไร
  problem: ภูมิกระโดดเชือกวันละ 20 นาที สัปดาห์ละ 4 วัน มา 3 เดือน อธิบายว่ากิจกรรมนี้สร้างเสริมระบบอวัยวะใดบ้าง
  steps:
  - text: 'ระบบหมุนเวียนเลือดและหายใจ: หัวใจและปอดทำงานหนักขึ้นสม่ำเสมอ จึงสูบฉีดเลือดและรับออกซิเจนได้ดีขึ้น'
  - text: 'กล้ามเนื้อและกระดูก: แรงกระแทกจากการกระโดดกระตุ้นให้กระดูกแข็งแรง กล้ามเนื้อขาทนขึ้น'
    why: กระดูกปรับตัวตามแรงที่ได้รับ เป็นหลักการใช้งานอย่างเหมาะสม
  - text: 'ประสาทและต่อมไร้ท่อ: ฝึกการประสานงานของมือและเท้า นอนหลับดีขึ้น คลายเครียด'
  - text: 'เงื่อนไข: ต้องกินอาหารครบหมู่ ดื่มน้ำ และนอนพอ เพื่อให้ร่างกายมีวัตถุดิบและเวลาซ่อมแซม'
  answer: การออกกำลังกายสม่ำเสมอเสริมหลายระบบพร้อมกัน เมื่อมีอาหาร น้ำ และการพักที่เพียงพอ
- type: check
  problem: health.body.organ-system-maintenance.p004
  prompt: ลองตอบก่อนอ่านต่อ
- type: figure
  title: วงจรวางแผนดูแลสุขภาพ
  src: plan-cycle.svg
  alt: วงจรห้ากล่องเรียงตามเข็มนาฬิกา 1 ประเมิน ข้อมูลสุขภาพของแต่ละคน → 2 ตั้งเป้าหมาย ชัด วัดได้ มีกำหนดเวลา → 3 วางกิจกรรม เหมาะกับวัยและข้อจำกัด → 4 ลงมือและบันทึก ตารางหรือแอปบันทึก → 5 ประเมินและปรับ ทุก 2 ถึง 4 สัปดาห์ แล้วกลับไปที่ 1 กลางวงเขียนว่าวนซ้ำต่อเนื่อง
- type: worked-example
  title: วางแผนดูแลสุขภาพของตนเอง
  problem: แบม อายุ 16 ปี ผลทดสอบความอดทนของหัวใจและปอดต่ำ นั่งดูจอวันละ 6 ชั่วโมง ไม่ค่อยกินผัก และนอน 7 ชั่วโมง วางแผน 4 สัปดาห์
  steps:
  - text: 'ประเมิน: จุดที่ต้องพัฒนาคือความอดทนของหัวใจและปอด การนั่งนาน การกินผัก และการนอน'
  - text: 'ตั้งเป้าหมาย: ปั่นจักรยาน 30 นาที 4 วันต่อสัปดาห์ กินผักอย่างน้อยมื้อละ 1 ทัพพี 2 มื้อต่อวัน เข้านอนเร็วขึ้นให้ได้ 8 ชั่วโมง 5 คืนต่อสัปดาห์'
    why: เป้าหมายที่วัดได้ช่วยให้รู้ว่าทำสำเร็จหรือไม่
  - text: 'วางกิจกรรม: ปั่นไปบ้านเพื่อนแทนนั่งรถ ขอแม่ทำเมนูผักที่ชอบ ตั้งเวลาปิดจอ 21:30 น.'
  - text: ลงมือและบันทึกทุกวัน ประเมินผลทุก 2 สัปดาห์ และทดสอบสมรรถภาพซ้ำเมื่อครบ 4 สัปดาห์
  answer: แผนมีเป้าหมายวัดได้ กิจกรรมที่ทำได้จริง และการประเมินผล
- type: check
  problem: health.body.organ-system-maintenance.p008
glossary:
- term: การรักษาดุลยภาพ (homeostasis)
  definition: การที่ร่างกายรักษาสภาพภายใน เช่น อุณหภูมิ น้ำ และน้ำตาลในเลือด ให้คงที่ แม้สิ่งแวดล้อมเปลี่ยน
- term: การตรวจคัดกรอง
  definition: การตรวจหาโรคหรือความเสี่ยงในคนที่ยังไม่มีอาการ เพื่อพบและรักษาได้เร็ว
- term: เป้าหมายที่ดี
  definition: เป้าหมายที่ชัดเจน วัดได้ ทำได้จริง เกี่ยวข้องกับปัญหา และมีกำหนดเวลา
- term: รอบเอวเหมาะสม
  definition: ตามคำแนะนำของกรมอนามัย รอบเอวไม่ควรเกินส่วนสูงหารสอง
flashcards:
- front: หลักการดำรงการทำงานของระบบอวัยวะ
  back: ใช้งานเหมาะสม ให้วัตถุดิบครบ พักฟื้น หลีกเลี่ยงสิ่งทำลาย ป้องกันและตรวจคัดกรอง
- front: ตรวจคัดกรองผู้ใหญ่ (ตรวจสิทธิล่าสุดกับ สปสช. 1330)
  back: 35 ปีขึ้นไป เบาหวานและความดันปีละครั้ง หญิง 30–60 ปี ตรวจเอชพีวีทุก 5 ปี 50–70 ปี ตรวจเลือดแฝงในอุจจาระทุก 2 ปี
- front: วงจรวางแผนดูแลสุขภาพ
  back: ประเมิน → ตั้งเป้าหมาย → วางกิจกรรม → ลงมือและบันทึก → ประเมินและปรับ
- front: ดัชนีมวลกาย (ผู้ใหญ่)
  back: น้ำหนัก (กก.) ÷ ส่วนสูง (ม.) ยกกำลังสอง เด็กและวัยรุ่นต้องเทียบเกณฑ์ตามอายุและเพศ
