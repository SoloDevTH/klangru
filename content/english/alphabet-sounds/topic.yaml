id: english.phonics.alphabet-sounds
subject: english
title: { th: ตัวอักษรและเสียงภาษาอังกฤษ (phonics), en: Letters and sounds (phonics) }
summary: รู้จักตัวอักษร 26 ตัวทั้งชื่อและเสียง สระเสียงสั้นและยาว เสียงต้นคำและท้ายคำ สะกดคำง่าย ๆ และเทียบตัวอักษรกับเสียงในภาษาไทย
difficulty: 1
minutes: 25
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - type: figure
    src: alphabet-chart.svg
    alt: "ตารางตัวอักษรภาษาอังกฤษ 26 ตัว แต่ละช่องมีตัวพิมพ์ใหญ่คู่กับตัวพิมพ์เล็ก เรียงจาก A a ถึง Z z แถวละ 7 ตัว สระ 5 ตัวคือ A a, E e, I i, O o, U u อยู่ในกรอบสีแดง ส่วนพยัญชนะ 21 ตัวอยู่ในกรอบสีน้ำเงิน"
    caption: "ตัวอักษร 26 ตัว มีสระ 5 ตัว (สีแดง) และพยัญชนะ 21 ตัว (สีน้ำเงิน)"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.phonics.alphabet-sounds.p004, prompt: "ลองฟังเสียงแรกของคำในใจ แล้วเลือกตัวอักษร" }
  - type: figure
    src: magic-e.svg
    alt: "แผนภาพสี่แถว แต่ละแถวมีคำสั้นทางซ้าย ลูกศรเขียนว่า + e และคำใหม่ทางขวา: kit (ชุดอุปกรณ์ สระสั้น อิ) เป็น kite (ว่าว สระยาว ไอ), cap (หมวกแก๊ป สระสั้น แอ) เป็น cape (เสื้อคลุม สระยาว เอ), hop (กระโดด สระสั้น เอาะ) เป็น hope (หวัง สระยาว โอ), cut (ตัด สระสั้น อะ) เป็น cute (น่ารัก สระยาว ยู) ข้อความล่างบอกว่า e ท้ายคำไม่ออกเสียง แต่ทำให้สระตัวก่อนหน้าออกเสียงตามชื่อตัวเอง"
    caption: "magic e: เติม e ท้ายคำ แล้วสระข้างหน้าเปลี่ยนเป็นเสียงยาว"
  - type: worked-example
    title: สะกดคำจากเสียง
    problem: "เพื่อนพูดคำว่า *bed* (เตียง) ให้ฟัง จงสะกดคำนี้"
    steps:
      - text: "แยกคำเป็นเสียงทีละเสียง: บ - เอะ - ด ได้ 3 เสียง"
        why: "สะกดง่ายขึ้นเมื่อแยกเสียงก่อน แล้วค่อยหาตัวอักษรของแต่ละเสียง"
      - text: "เสียง บ เขียนด้วย b"
      - text: "เสียง เอะ เป็นสระเสียงสั้นของ e"
        why: "เสียง แอ ต้องใช้ a (bad) ส่วนเสียง เอะ ใช้ e"
      - text: "เสียง ด เขียนด้วย d แล้วเรียงตามลำดับเสียง"
    answer: "**bed** (b-e-d)"
  - { type: check, problem: english.phonics.alphabet-sounds.p011, prompt: "ดูว่าคำไหนมี e ท้ายคำ" }
  - type: worked-example
    title: magic e เปลี่ยนเสียงสระ
    problem: "เด็ก ๆ เล่นว่าวที่สนามหลวงในหน้าร้อน คำว่า ว่าว เขียนว่า *kite* ทำไม i ในคำนี้จึงอ่านว่า ไอ แต่ i ในคำว่า *kit* อ่านว่า อิ"
    steps:
      - text: "คำว่า kit มีรูป พยัญชนะ-สระ-พยัญชนะ (k-i-t) สระจึงออกเสียงสั้น อิ"
      - text: "คำว่า kite มี e ต่อท้าย t"
      - text: "e ท้ายคำไม่ออกเสียง แต่ทำให้ i ออกเสียงยาวเหมือนชื่อตัวอักษร I (ไอ)"
        why: "นี่คือกฎ magic e ใช้ได้กับ a, i, o, u เช่น cape, hope, cute"
      - text: "จึงอ่าน kite ว่า \"ไคท์\" และนับเสียงได้ 3 เสียง: k - ไอ - t"
    answer: "kite อ่านว่า ไคท์ เพราะ e ท้ายคำทำให้ i ออกเสียงยาว ส่วน kit ไม่มี e จึงออกเสียงสั้น"
glossary:
  - { term: phonics, definition: "วิธีเรียนอ่านโดยจับคู่ตัวอักษรกับเสียง แล้วนำเสียงมารวมกันเป็นคำ" }
  - { term: สระ (vowel), definition: "ตัวอักษร a e i o u ในภาษาอังกฤษ ทุกคำต้องมีเสียงสระอย่างน้อยหนึ่งเสียง" }
  - { term: พยัญชนะ (consonant), definition: "ตัวอักษรอีก 21 ตัวที่ไม่ใช่สระ เช่น b c d f g" }
  - { term: magic e, definition: "ตัว e ท้ายคำที่ไม่ออกเสียง แต่ทำให้สระตัวก่อนหน้าออกเสียงยาว เช่น kit → kite" }
  - { term: digraph, definition: "ตัวอักษรสองตัวที่รวมกันเป็นเสียงเดียว เช่น sh, ch, th" }
flashcards:
  - { front: "ภาษาอังกฤษมีตัวอักษรกี่ตัว เป็นสระกี่ตัว", back: "26 ตัว เป็นสระ 5 ตัว (a e i o u) และพยัญชนะ 21 ตัว" }
  - { front: "อ่านคำว่า cat ใช้ชื่อตัวอักษรหรือเสียงของตัวอักษร", back: "ใช้เสียง: ค-แอ-ท รวมเป็น แคท (ไม่ใช่ ซี-เอ-ที)" }
  - { front: "เติม e ท้าย hop ได้คำอะไร อ่านอย่างไร", back: "hope (หวัง) o ออกเสียงยาว โอ ส่วน e ไม่ออกเสียง" }
  - { front: "คำว่า ship มีกี่ตัวอักษร กี่เสียง", back: "4 ตัวอักษร แต่ 3 เสียง (sh-i-p) เพราะ sh เป็นเสียงเดียว" }
  - { front: "ภาษาอังกฤษต่างจากภาษาไทยอย่างไรเรื่องสระและวรรณยุกต์", back: "สระอยู่ในบรรทัดเดียวกับพยัญชนะ และไม่มีรูปวรรณยุกต์" }
