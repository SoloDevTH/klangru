problems:
  - id: management.quality.excellence-self-assessment.p001
    topics: [management.quality.excellence-self-assessment]
    difficulty: 1
    type: match
    stem: "จับคู่มิติของ ADLI กับคำถามที่ผู้ประเมินถาม"
    pairs:
      - { left: "A แนวทาง", right: "มีวิธีการที่เป็นระบบ ทำซ้ำได้ และเหมาะกับองค์กรหรือไม่" }
      - { left: "D การนำไปใช้", right: "ใช้ครบทุกหน่วยงานที่เกี่ยวข้องหรือยัง" }
      - { left: "L การเรียนรู้", right: "ทบทวน ปรับปรุง และแบ่งปันบทเรียนหรือไม่" }
      - { left: "I การบูรณาการ", right: "สอดคล้องกับกลยุทธ์ ตัววัด และกระบวนการอื่นหรือไม่" }
    hints:
      - "D คือ deployment การกระจายไปใช้"
      - "I คือ integration การเชื่อมโยงทั้งองค์กร"
    solution: "แนวทาง = วิธีที่เป็นระบบ การนำไปใช้ = ความทั่วถึง การเรียนรู้ = การทบทวนปรับปรุง การบูรณาการ = ความสอดคล้องกับทั้งองค์กร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p002
    topics: [management.quality.excellence-self-assessment]
    difficulty: 1
    type: match
    stem: "จับคู่มิติของ LeTCI กับสิ่งที่ผู้ประเมินดูในกราฟผลลัพธ์"
    pairs:
      - { left: "Le ระดับ", right: "ค่าล่าสุดอยู่ที่เท่าไรเมื่อเทียบกับเป้า" }
      - { left: "T แนวโน้ม", right: "ทิศทางของข้อมูลหลายปี" }
      - { left: "C การเปรียบเทียบ", right: "ผลของเราเทียบกับองค์กรที่คล้ายกันหรือองค์กรชั้นนำ" }
      - { left: "I การบูรณาการ", right: "วัดเรื่องที่สำคัญตามโครงร่างองค์กรและแยกตามกลุ่มสำคัญหรือไม่" }
    hints:
      - "T คือ trends"
      - "C คือ comparisons"
    solution: "ระดับคือค่าปัจจุบัน แนวโน้มคือทิศทางหลายปี การเปรียบเทียบคือเทียบกับผู้อื่น และการบูรณาการคือความสำคัญและการแยกกลุ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p003
    topics: [management.quality.excellence-self-assessment]
    difficulty: 1
    type: match
    stem: "จับคู่เกณฑ์กับหน่วยงานที่ดูแล"
    pairs:
      - { left: "รางวัลคุณภาพแห่งชาติ (TQA)", right: "สถาบันเพิ่มผลผลิตแห่งชาติ" }
      - { left: "เกณฑ์คุณภาพการบริหารจัดการภาครัฐ (PMQA 4.0)", right: "สำนักงาน ก.พ.ร." }
      - { left: "Baldrige Award", right: "โครงการ Baldrige ของสหรัฐอเมริกา" }
    hints:
      - "PMQA ใช้กับส่วนราชการ"
      - "TQA เป็นรางวัลของประเทศไทยที่อิงเกณฑ์ Baldrige"
    solution: "TQA ดูแลโดยสถาบันเพิ่มผลผลิตแห่งชาติ PMQA ดูแลโดยสำนักงาน ก.พ.ร. และ Baldrige เป็นโครงการของสหรัฐอเมริกา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p004
    topics: [management.quality.excellence-self-assessment]
    difficulty: 2
    type: numeric
    stem: "หัวข้อผลลัพธ์ด้านผลิตภัณฑ์และกระบวนการของ TQA 2567–2568 มีคะแนนเต็ม 110 คะแนน ถ้าผู้ประเมินให้ 45% หัวข้อนี้ได้กี่คะแนน"
    answer: { value: 49.5, unit: คะแนน, tolerance: 0.05 }
    hints:
      - "คะแนนหัวข้อ = คะแนนเต็ม × ร้อยละที่ได้"
      - "110 × 0.45"
    misconceptions:
      - { match: 45, feedback: "ใช้ร้อยละเป็นคะแนนตรง ๆ ต้องคูณกับคะแนนเต็มของหัวข้อ" }
      - { match: 4950, feedback: "คูณ 110 กับ 45 โดยไม่แปลง 45% เป็น 0.45" }
    solution: "$110 \\times 0.45 = 49.5$ คะแนน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p005
    topics: [management.quality.excellence-self-assessment]
    difficulty: 2
    type: numeric
    stem: "TQA 2567–2568 มีคะแนนรวม 1,000 คะแนน หมวด 7 ผลลัพธ์มี 400 คะแนน หมวดผลลัพธ์คิดเป็นกี่เปอร์เซ็นต์ของคะแนนรวม"
    answer: { value: 40, unit: "%" }
    hints:
      - "ร้อยละ = 400 ÷ 1,000 × 100"
      - "อีกหกหมวดเป็นหมวดกระบวนการ"
    misconceptions:
      - { match: 14.29, feedback: "คิดว่าทุกหมวดมีน้ำหนักเท่ากัน (1 ใน 7) แต่หมวดผลลัพธ์มีคะแนนมากที่สุด" }
      - { match: 60, feedback: "นั่นคือส่วนของหมวดกระบวนการ (หมวด 1–6)" }
    solution: "$400 \\div 1{,}000 \\times 100 = 40\\%$ แสดงว่าเกณฑ์ให้ความสำคัญกับผลลัพธ์มาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p006
    topics: [management.quality.excellence-self-assessment]
    difficulty: 2
    type: mcq
    stem: "ทำไมต้องเขียนโครงร่างองค์กรก่อนตอบหมวดอื่น ทั้งที่โครงร่างองค์กรไม่ได้คะแนน"
    choices:
      - { id: a, text: "เพราะผู้ประเมินใช้ข้อมูลลักษณะองค์กร ความท้าทาย และความได้เปรียบ ตัดสินว่าเรื่องใดสำคัญสำหรับองค์กรนี้", correct: true }
      - { id: b, text: "เพราะเป็นเอกสารประชาสัมพันธ์องค์กร", feedback: "โครงร่างองค์กรเป็นข้อมูลบริบทสำหรับการประเมิน ไม่ใช่เอกสารประชาสัมพันธ์" }
      - { id: c, text: "เพราะเกณฑ์บังคับให้เขียนแต่ไม่ได้นำไปใช้", feedback: "โครงร่างถูกใช้ตีความทุกหมวด เช่น ผลลัพธ์ใดสำคัญและกลุ่มลูกค้าใดต้องแยก" }
      - { id: d, text: "เพราะใช้แทนการตอบหมวดกลยุทธ์", feedback: "โครงร่างบอกสภาวการณ์ หมวดกลยุทธ์ยังต้องอธิบายกระบวนการวางแผนแยกต่างหาก" }
    hints:
      - "องค์กรต่างประเภทมีเรื่องที่สำคัญต่างกัน"
      - "ผู้ประเมินใช้อะไรตัดสินว่าข้อใดเป็นจุดแข็งหรือโอกาสพัฒนาที่สำคัญ"
    solution: "โครงร่างองค์กรให้บริบท ผู้ประเมินใช้ตีความทุกหมวดว่ากระบวนการและผลลัพธ์ใดสำคัญ และใช้จัดลำดับโอกาสพัฒนา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p007
    topics: [management.quality.excellence-self-assessment]
    difficulty: 3
    type: numeric
    stem: "จากกราฟความพึงพอใจของผู้ป่วยในในภาพ โรงพยาบาลของเราเพิ่มขึ้นเฉลี่ยปีละกี่จุดเปอร์เซ็นต์ระหว่างปี 2564 ถึง 2567"
    figure:
      src: p-results.svg
      alt: "กราฟเส้น โรงพยาบาลของเรา 2564 78 2565 81 2566 83 2567 86 ควอร์ไทล์บนของกลุ่มเดียวกัน 88 89 89 90"
    answer: { value: 2.67, unit: จุดเปอร์เซ็นต์ต่อปี, tolerance: 0.02 }
    hints:
      - "ผลต่างทั้งหมด = 86 − 78"
      - "สี่ปีมีกี่ช่วงห่าง"
    misconceptions:
      - { match: 2, feedback: "หารด้วย 4 (จำนวนปี) แต่สี่ปีมีเพียง 3 ช่วงห่าง" }
      - { match: 8, feedback: "นั่นคือการเพิ่มรวมทั้งช่วง ยังไม่ได้เฉลี่ยต่อปี" }
    solution: "$(86 - 78) \\div 3 \\approx 2.67$ จุดต่อปี แนวโน้มดีขึ้นต่อเนื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p008
    topics: [management.quality.excellence-self-assessment]
    difficulty: 3
    type: mcq
    stem: "ศูนย์บริการประชาชนของจังหวัด (สมมติ) เขียนว่า \"เรามีระบบรับเรื่องร้องเรียนออนไลน์ที่ตอบกลับภายใน 3 วัน ใช้ที่สำนักงานจังหวัดเท่านั้น ส่วนอำเภอยังใช้สมุดบันทึก\" ข้อคิดเห็นใดตรงที่สุด"
    choices:
      - { id: a, text: "โอกาสพัฒนาด้านการนำไปใช้ (D) เพราะแนวทางยังไม่ครอบคลุมจุดบริการระดับอำเภอ", correct: true }
      - { id: b, text: "โอกาสพัฒนาด้านแนวทาง (A) เพราะไม่มีระบบ", feedback: "มีระบบที่ชัดเจนแล้ว ปัญหาคือใช้ไม่ทั่วถึง" }
      - { id: c, text: "โอกาสพัฒนาด้านการเรียนรู้ (L)", feedback: "ข้อความไม่ได้พูดถึงการทบทวนหรือปรับปรุง จึงตัดสิน L จากข้อความนี้ไม่ได้ ช่องว่างที่เห็นชัดคือการนำไปใช้" }
      - { id: d, text: "จุดแข็งด้านการบูรณาการ (I)", feedback: "ระบบที่ใช้แค่บางหน่วยยังไม่แสดงการเชื่อมโยงทั้งองค์กร" }
    hints:
      - "มีแนวทางแล้วหรือยัง"
      - "ใช้ครบทุกจุดบริการหรือไม่"
    solution: "แนวทางมีแล้ว (A) แต่ใช้เฉพาะสำนักงานจังหวัด อำเภอยังไม่ได้ใช้ จึงเป็นโอกาสพัฒนาด้านการนำไปใช้ (D)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p009
    topics: [management.quality.excellence-self-assessment]
    difficulty: 3
    type: mcq
    stem: "องค์กรหนึ่ง (สมมติ) แสดงผลอัตราการลาออกของบุคลากรปี 2567 ปีเดียวเป็น 6% และบอกว่าต่ำกว่าค่าเฉลี่ยอุตสาหกรรม 9% มิติใดของ LeTCI ที่ขาดชัดเจนที่สุด"
    choices:
      - { id: a, text: "แนวโน้ม (T) เพราะมีข้อมูลเพียงปีเดียว", correct: true }
      - { id: b, text: "การเปรียบเทียบ (C)", feedback: "มีค่าเฉลี่ยอุตสาหกรรมให้เทียบแล้ว" }
      - { id: c, text: "ระดับ (Le)", feedback: "มีค่าปัจจุบัน 6% แล้ว" }
      - { id: d, text: "ไม่ขาดมิติใด", feedback: "ผลปีเดียวบอกไม่ได้ว่าดีขึ้นหรือแย่ลง" }
    hints:
      - "แนวโน้มต้องมีข้อมูลหลายจุด"
      - "ข้อมูลปีเดียวบอกทิศทางได้หรือไม่"
    solution: "ข้อมูลปีเดียวไม่บอกทิศทาง จึงขาดแนวโน้ม ควรแสดงอย่างน้อยสามปีและแยกตามกลุ่มบุคลากรด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p010
    topics: [management.quality.excellence-self-assessment]
    difficulty: 3
    type: match
    stem: "จับคู่ลักษณะกับเกณฑ์"
    pairs:
      - { left: "ผลลัพธ์รวมอยู่ในหมวด 7 คิดเป็น 400 จาก 1,000 คะแนน", right: "TQA 2567–2568" }
      - { left: "ประเมินแต่ละประเด็นเป็นระดับพื้นฐาน ก้าวหน้า และพัฒนาจนเกิดผล ใช้กับส่วนราชการ", right: "PMQA 4.0" }
      - { left: "เหลือหกหมวด และคำถามผลลัพธ์อยู่ในแต่ละหมวด", right: "Baldrige 2026" }
    hints:
      - "เกณฑ์ใดใช้กับส่วนราชการไทย"
      - "เกณฑ์ใดเปลี่ยนโครงล่าสุด"
    solution: "TQA ยังใช้เจ็ดหมวดและหมวด 7 เป็นผลลัพธ์ PMQA 4.0 ใช้ระดับพื้นฐาน ก้าวหน้า พัฒนาจนเกิดผล และ Baldrige 2026 รวมผลลัพธ์เข้าไปในแต่ละหมวด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p011
    topics: [management.quality.excellence-self-assessment]
    difficulty: 3
    type: numeric
    stem: "จากกราฟในภาพ ปี 2567 ความพึงพอใจของโรงพยาบาลของเรายังต่ำกว่าควอร์ไทล์บนของกลุ่มเดียวกันกี่จุดเปอร์เซ็นต์"
    figure:
      src: p-results.svg
      alt: "กราฟเส้น โรงพยาบาลของเรา 2564 78 2565 81 2566 83 2567 86 ควอร์ไทล์บนของกลุ่มเดียวกัน 88 89 89 90"
    answer: { value: 4, unit: จุดเปอร์เซ็นต์ }
    hints:
      - "ดูค่าปี 2567 ของทั้งสองเส้น"
      - "ลบกัน"
    misconceptions:
      - { match: 10, feedback: "ใช้ค่าของเราปี 2564 (78) ต้องใช้ปีเดียวกัน" }
      - { match: 2, feedback: "ใช้ควอร์ไทล์บนปี 2564 (88) ต้องใช้ปี 2567" }
    solution: "$90 - 86 = 4$ จุด ช่องว่างแคบลงจาก 10 จุดในปี 2564 แสดงว่าการเปรียบเทียบดีขึ้นแม้ยังไม่ถึงระดับชั้นนำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p012
    topics: [management.quality.excellence-self-assessment]
    difficulty: 4
    type: numeric
    stem: "ผลประเมินตนเองตาม TQA 2567–2568 ของบริษัทแห่งหนึ่ง (สมมติ) หมวด 1 ถึง 7 มีคะแนนเต็ม 110, 95, 95, 100, 100, 100, 400 และได้ร้อยละ 40, 35, 45, 30, 40, 45, 30 ตามลำดับ (คิดทั้งหมวดด้วยร้อยละเดียว) คะแนนรวมเป็นเท่าไร"
    answer: { value: 355, unit: คะแนน, tolerance: 0.5 }
    hints:
      - "คะแนนหมวด = คะแนนเต็ม × ร้อยละ"
      - "รวมทั้งเจ็ดหมวด"
    misconceptions:
      - { match: 378.57, feedback: "เฉลี่ยร้อยละแล้วคูณ 1,000 แต่หมวดมีคะแนนเต็มไม่เท่ากัน ต้องถ่วงน้ำหนัก" }
      - { match: 265, feedback: "บวกร้อยละของทุกหมวดตรง ๆ ไม่ได้คูณคะแนนเต็ม" }
    solution: "$44 + 33.25 + 42.75 + 30 + 40 + 45 + 120 = 355$ คะแนน หมวด 7 มีน้ำหนักมาก ร้อยละที่ต่ำ (30%) จึงดึงคะแนนรวมลงมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p013
    topics: [management.quality.excellence-self-assessment]
    difficulty: 4
    type: mcq
    stem: "หลังประเมินตนเอง โรงพยาบาล (สมมติ) มีโอกาสพัฒนา 25 ข้อ แต่ทรัพยากรทำได้ปีละ 4–5 เรื่อง ควรจัดลำดับอย่างไร"
    choices:
      - { id: a, text: "ให้น้ำหนักกับข้อที่กระทบความท้าทายเชิงกลยุทธ์และผลลัพธ์สำคัญในโครงร่างองค์กรมากที่สุด แล้วพิจารณาความพร้อมในการทำ", correct: true }
      - { id: b, text: "ทำข้อที่ง่ายที่สุดก่อนเพื่อให้เสร็จเยอะ", feedback: "ทำได้มากข้อแต่อาจไม่กระทบเรื่องที่สำคัญต่อองค์กร" }
      - { id: c, text: "ทำตามลำดับหมวด 1 ถึง 7", feedback: "ลำดับหมวดไม่ได้บอกความสำคัญต่อองค์กร" }
      - { id: d, text: "ทำทุกข้อพร้อมกันอย่างละนิด", feedback: "ทรัพยากรกระจายจนไม่มีเรื่องใดสำเร็จ" }
    hints:
      - "การใช้ผลทบทวนกำหนดลำดับการปรับปรุงต้องเชื่อมกับกลยุทธ์"
      - "ดูทั้งผลกระทบและความพร้อม"
    solution: "จัดลำดับโอกาสพัฒนาตามผลกระทบต่อความท้าทายเชิงกลยุทธ์และผลลัพธ์สำคัญ ประกอบกับความพร้อม แล้วทำแผนปฏิบัติการสำหรับข้อที่เลือก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p014
    topics: [management.quality.excellence-self-assessment]
    difficulty: 4
    type: mcq
    stem: "กรมแห่งหนึ่ง (สมมติ) มีผู้เชี่ยวชาญด้านการประเมินราคาที่ดินสามคนที่จะเกษียณในสองปี ข้อใดเป็นการจัดการความรู้ที่ดีที่สุด"
    choices:
      - { id: a, text: "ให้ผู้เชี่ยวชาญเป็นพี่เลี้ยงคนรุ่นใหม่ในงานจริง ถอดบทเรียนกรณียากเป็นคู่มือที่ค้นได้ และทบทวนคู่มือปีละครั้ง", correct: true }
      - { id: b, text: "ขอให้ผู้เชี่ยวชาญเขียนรายงานสรุปหนึ่งฉบับก่อนเกษียณ", feedback: "ความรู้จากประสบการณ์ถ่ายทอดผ่านเอกสารฉบับเดียวได้น้อย และไม่มีการทบทวน" }
      - { id: c, text: "จ้างผู้เชี่ยวชาญกลับมาเป็นที่ปรึกษาหลังเกษียณทุกครั้งที่มีปัญหา", feedback: "ยังพึ่งคนคนเดียว ความรู้ไม่ได้เป็นขององค์กร" }
      - { id: d, text: "ซื้อระบบคลังเอกสารใหม่โดยไม่เปลี่ยนวิธีทำงาน", feedback: "เครื่องมือช่วยได้ แต่ถ้าไม่มีการแบ่งปันและใช้ความรู้จริง ระบบก็ว่างเปล่า" }
    hints:
      - "ความรู้บางอย่างอยู่ในตัวคนและถ่ายทอดด้วยการทำงานร่วมกัน"
      - "ความรู้ต้องถูกเก็บ แบ่งปัน และต่อยอด"
    solution: "การเป็นพี่เลี้ยงถ่ายทอดความรู้ฝังลึก การถอดบทเรียนทำให้ความรู้เป็นขององค์กร และการทบทวนทำให้ความรู้ทันสมัย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p015
    topics: [management.quality.excellence-self-assessment]
    difficulty: 5
    type: mcq
    stem: "ข้อใดเป็นข้อคิดเห็นแบบโอกาสพัฒนาที่เขียนได้ดีที่สุด สำหรับบริษัทขนส่ง (สมมติ) ที่โครงร่างองค์กรระบุว่าความท้าทายสำคัญคือการส่งตรงเวลา"
    choices:
      - { id: a, text: "ผลการส่งตรงเวลาแสดงเฉพาะภาพรวม ยังไม่แยกตามเส้นทางและกลุ่มลูกค้าสำคัญ และไม่มีข้อมูลเปรียบเทียบ ทำให้ยากจะรู้ว่าบริษัทบรรลุความท้าทายเรื่องการส่งตรงเวลาในกลุ่มที่สำคัญหรือไม่", correct: true }
      - { id: b, text: "บริษัทควรซื้อระบบติดตามรถด้วยดาวเทียมรุ่นใหม่", feedback: "สั่งวิธีแก้แทนการชี้ช่องว่าง และไม่บอกว่าช่องว่างคืออะไร" }
      - { id: c, text: "ผลลัพธ์ไม่ดี", feedback: "กว้างเกินไป ไม่บอกว่าไม่ดีตรงไหนและสำคัญอย่างไร" }
      - { id: d, text: "บริษัทมีระบบติดตามรถที่ทันสมัยมาก", feedback: "เป็นคำชมที่ไม่ใช่โอกาสพัฒนา และไม่อ้างหลักฐาน" }
    hints:
      - "ข้อคิดเห็นที่ดีระบุช่องว่าง มิติ และความสำคัญ"
      - "ไม่สั่งวิธีแก้"
    solution: "ข้อ ก ระบุช่องว่างชัด (ไม่แยกกลุ่ม ไม่มีการเปรียบเทียบ ตรงกับ I และ C) และเชื่อมกับความท้าทายในโครงร่างองค์กร โดยไม่สั่งวิธีแก้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p016
    topics: [management.quality.excellence-self-assessment]
    difficulty: 4
    type: numeric
    stem: "ใน TQA 2567–2568 หัวข้อผลลัพธ์ด้านผลิตภัณฑ์และกระบวนการมีคะแนนเต็ม 110 และผลลัพธ์ด้านลูกค้ามี 75 ถ้าปีหน้าทั้งสองหัวข้อได้ร้อยละเพิ่มขึ้นหัวข้อละ 10 จุดเปอร์เซ็นต์ คะแนนรวมจะเพิ่มขึ้นกี่คะแนน"
    answer: { value: 18.5, unit: คะแนน, tolerance: 0.05 }
    hints:
      - "คะแนนที่เพิ่ม = คะแนนเต็ม × 0.10 ของแต่ละหัวข้อ"
      - "รวมสองหัวข้อ"
    misconceptions:
      - { match: 20, feedback: "บวก 10 คะแนนต่อหัวข้อ แต่ 10 จุดเปอร์เซ็นต์ต้องคูณคะแนนเต็มของหัวข้อ" }
      - { match: 1850, feedback: "คูณด้วย 10 แทน 0.10" }
    solution: "$110 \\times 0.10 + 75 \\times 0.10 = 11 + 7.5 = 18.5$ คะแนน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p017
    topics: [management.quality.excellence-self-assessment]
    difficulty: 4
    type: match
    stem: "จับคู่หลักฐานของมหาวิทยาลัยแห่งหนึ่ง (สมมติ) กับประเด็นด้านการนำองค์กร"
    pairs:
      - { left: "อธิการบดีจัดเวทีพบบุคลากรทุกคณะทุกไตรมาส และตอบคำถามที่ส่งล่วงหน้าทางออนไลน์ทุกข้อ", right: "การสื่อสารสองทางกับบุคลากร" }
      - { left: "มีรายชื่อผู้ที่อาจขึ้นดำรงตำแหน่งคณบดีและแผนพัฒนารายคน", right: "การวางแผนสืบทอดตำแหน่ง" }
      - { left: "สภามหาวิทยาลัยแต่งตั้งผู้ตรวจสอบบัญชีภายนอกและเปิดเผยรายงานการเงิน", right: "การกำกับดูแลที่รับผิดชอบและโปร่งใส" }
      - { left: "เลือกสนับสนุนโรงเรียนในอำเภอรอบมหาวิทยาลัยด้านคณิตศาสตร์ตามความเชี่ยวชาญของคณะ", right: "การสนับสนุนชุมชนที่สำคัญ" }
    hints:
      - "การสื่อสารสองทางมีทั้งพูดและฟัง"
      - "การกำกับดูแลเกี่ยวกับความรับผิดชอบทางการเงินและความโปร่งใส"
    solution: "เวทีถามตอบคือการสื่อสารสองทาง รายชื่อผู้สืบทอดคือแผนสืบทอดตำแหน่ง ผู้ตรวจสอบภายนอกและเปิดเผยงบคือการกำกับดูแล และการช่วยโรงเรียนรอบมหาวิทยาลัยคือการสนับสนุนชุมชน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p018
    topics: [management.quality.excellence-self-assessment]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "หน่วยงานรัฐ (สมมติ) ต้องการแสดงว่ามีแนวทางที่เป็นระบบด้านข้อมูล ความมั่นคงไซเบอร์ และความปลอดภัยในที่ทำงาน หลักฐานใดใช้ได้ (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "ทะเบียนสินทรัพย์ข้อมูลพร้อมระดับความลับ และผลซ้อมกู้คืนระบบจากข้อมูลสำรองทุกหกเดือน", correct: true }
      - { id: b, text: "สถิติอุบัติเหตุจากการทำงานรายไตรมาสพร้อมการสอบสวนสาเหตุและมาตรการป้องกัน", correct: true }
      - { id: c, text: "ผลทดสอบการหลอกลวงทางอีเมลกับบุคลากร และการอบรมซ้ำสำหรับผู้ที่หลงกด", correct: true }
      - { id: d, text: "คำกล่าวของผู้บริหารว่าองค์กรให้ความสำคัญกับความปลอดภัยสูงสุด", feedback: "คำกล่าวไม่ใช่หลักฐานของแนวทางที่เป็นระบบหรือการนำไปใช้" }
    hints:
      - "หลักฐานที่ดีแสดงวิธีการ การนำไปใช้ และการวัดผล"
      - "คำประกาศเจตนาไม่ใช่หลักฐาน"
    solution: "ทะเบียนข้อมูลกับการซ้อมกู้คืน สถิติอุบัติเหตุกับการสอบสวน และการทดสอบอีเมลหลอกลวงกับการอบรม แสดงทั้งแนวทาง การนำไปใช้ และการวัดผล ส่วนคำกล่าวไม่ใช่หลักฐาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.excellence-self-assessment.p019
