    solution: "ที่ a = 0, b = 0 ได้ Σ x(y − ŷ) = 1×3 + 2×5 = 13 และ เกรเดียนต์ = −(2/2) × 13 = −13 จึงได้ a ใหม่ = 0 − 0.1 × (−13) = 1.3"
