  - id: biology.genetics.linkage-mapping.p019
    topics: [biology.genetics.linkage-mapping]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน `recombination_frequency(classes)` ที่รับลิสต์ของคู่ (จำนวนลูก, เป็นรีคอมบิแนนท์หรือไม่) แล้วคืนค่าความถี่รีคอมบิแนนท์เป็นเปอร์เซ็นต์ เช่น [(460, False), (460, False), (40, True), (40, True)] ให้ 8.0"
    starter: |
      def recombination_frequency(classes):
          pass
    tests: |
      r = recombination_frequency([(460, False), (460, False), (40, True), (40, True)])
      assert r is not None, "ไม่ได้คืนค่า (ได้ None) ต้องใช้ return ไม่ใช่ print"
      assert abs(r - 8.0) < 1e-6, f"ข้อมูลชุดแรกควรได้ 8.0 แต่ได้ {r}"
      r2 = recombination_frequency([(430, False), (430, False), (70, True), (70, True)])
      assert abs(r2 - 14.0) < 1e-6, f"ข้อมูลชุดที่สองควรได้ 14.0 แต่ได้ {r2} อย่าลืมนับรีคอมบิแนนท์ทั้งสองกลุ่ม"
      assert abs(recombination_frequency([(50, True), (50, False)]) - 50.0) < 1e-6, "ถ้าครึ่งหนึ่งเป็นรีคอมบิแนนท์ ต้องได้ 50.0"
    reference: |
      def recombination_frequency(classes):
          total = sum(c for c, _ in classes)
          rec = sum(c for c, r in classes if r)
          return 100 * rec / total
    hints:
      - "รวมจำนวนลูกทั้งหมดก่อนจากทุกคู่"
      - "รวมเฉพาะจำนวนของคู่ที่ค่าที่สองเป็นจริง แล้วหารด้วยทั้งหมด คูณ 100"
    solution: "return 100 * rec / total โดย rec เป็นผลรวมของคลาสที่เป็นรีคอมบิแนนท์และ total เป็นผลรวมทั้งหมด"
