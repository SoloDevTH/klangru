    choices:
      - { id: a, text: "ประชากรเสือโคร่งในพื้นที่นี้มีแนวโน้มเพิ่มขึ้น ซึ่งสอดคล้องกับการลาดตระเวนป้องกันการล่าและเหยื่อที่เพิ่มขึ้น แต่ต้องดูข้อมูลอื่นประกอบ เช่น จำนวนกล้องและพื้นที่สำรวจที่อาจต่างกัน", correct: true }
      - { id: b, text: "เสือโคร่งทั่วโลกเพิ่มขึ้นสองเท่า", feedback: "ข้อมูลมาจากพื้นที่เดียว สรุปไปถึงทั้งโลกไม่ได้" }
      - { id: c, text: "ป่านี้ถึงความสามารถในการรองรับเสือโคร่งแล้ว", feedback: "ข้อมูลสองจุดเวลาบอกเพียงว่าเพิ่มขึ้น ไม่ได้บอกว่าประชากรคงที่แล้ว" }
      - { id: d, text: "ข้อมูลกล้องดักถ่ายใช้นับเสือไม่ได้เลย", feedback: "ลายของเสือแต่ละตัวไม่ซ้ำกัน กล้องดักถ่ายจึงเป็นวิธีมาตรฐานในการประมาณประชากรเสือ" }
    hints:
      - "ข้อสรุปต้องไม่เกินกว่าที่ข้อมูลบอก"
      - "การเปรียบเทียบข้อมูลสองช่วงเวลาต้องใช้วิธีสำรวจที่เทียบกันได้"
    solution: "ข้อมูลแสดงแนวโน้มเพิ่มขึ้นในพื้นที่นี้ และสอดคล้องกับการคุ้มครองที่เข้มข้นขึ้น แต่ต้องตรวจว่าวิธีสำรวจทั้งสองครั้งเทียบกันได้ และไม่สรุปเกินพื้นที่หรือเกินข้อมูล เช่น ยังไม่รู้ว่าถึง K แล้วหรือไม่"
