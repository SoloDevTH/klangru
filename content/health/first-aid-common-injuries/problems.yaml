problems:
- id: health.safety.first-aid-common-injuries.p001
  topics:
  - health.safety.first-aid-common-injuries
  difficulty: 1
  type: mcq
  stem: เข่าถลอกจากการล้มบนสนามดิน ควรทำอะไรเป็นอย่างแรกหลังล้างมือ
  choices:
  - id: a
    text: ล้างแผลด้วยน้ำสะอาดที่ไหลผ่าน เอาเศษดินออก
    correct: true
  - id: b
    text: ทายาสีฟันบนแผล
    feedback: ยาสีฟันไม่ใช่ยาใส่แผล และอาจทำให้ระคายเคือง
  - id: c
    text: ปล่อยไว้ไม่ต้องทำอะไร
    feedback: แผลที่มีดินค้างอยู่เสี่ยงติดเชื้อ
  hints:
  - แผลจากพื้นดินมักมีสิ่งสกปรก
  - สิ่งแรกคือทำให้แผลสะอาด
  solution: ล้างแผลด้วยน้ำสะอาดที่ไหลผ่านเพื่อเอาสิ่งสกปรกออก แล้วกดห้ามเลือดถ้ามี ซับให้แห้ง และปิดแผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.first-aid-common-injuries.p002
  topics:
  - health.safety.first-aid-common-injuries
  difficulty: 1
  type: text
  stem: ศูนย์พิษวิทยารามาธิบดีให้คำปรึกษาเมื่อได้รับสารพิษหรือยาเกินขนาด โทรหมายเลขใด (ตอบเป็นตัวเลข 4 หลัก)
  accepted:
  - '1367'
  misconceptions:
  - match: '1669'
    feedback: 1669 คือการแพทย์ฉุกเฉิน โทรได้เช่นกันเมื่ออาการรุนแรง แต่ศูนย์พิษวิทยาคือ 1367
  - match: '1323'
    feedback: 1323 คือสายด่วนสุขภาพจิต
  hints:
  - ขึ้นต้นด้วย 13
  - ให้คำปรึกษาตลอด 24 ชั่วโมง
  solution: ศูนย์พิษวิทยารามาธิบดีโทร 1367 ถ้าผู้ป่วยอาการรุนแรง เช่น หมดสติหรือหายใจลำบาก ให้โทร 1669
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.first-aid-common-injuries.p003
  topics:
  - health.safety.first-aid-common-injuries
  difficulty: 2
  type: order
  stem: เรียงตัวอักษรของหลัก PRICE ตามลำดับ
  items:
  - ป้องกัน (Protection)
  - พัก (Rest)
  - ประคบเย็น (Ice)
  - พันกระชับ (Compression)
  - ยกสูง (Elevation)
  hints:
  - ชื่อหลักสะกดว่า P-R-I-C-E
  - เริ่มจากหยุดเล่นไม่ให้เจ็บซ้ำ
  solution: P ป้องกัน → R พัก → I ประคบเย็น → C พันกระชับ → E ยกสูง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.first-aid-common-injuries.p004
  topics:
  - health.safety.first-aid-common-injuries
  difficulty: 2
  type: mcq
  stem: น้องถูกผึ้งต่อยที่แขนและเหล็กในยังค้างอยู่ ควรเอาเหล็กในออกอย่างไร
  choices:
  - id: a
    text: ใช้ขอบบัตรแข็งหรือเล็บขูดออกทางด้านข้าง
    correct: true
  - id: b
    text: ใช้นิ้วบีบดึงออก
    feedback: การบีบดันพิษที่เหลือในถุงพิษเข้าสู่ผิวหนังเพิ่ม
  - id: c
    text: ปล่อยไว้ให้หลุดเอง
    feedback: เหล็กในที่ค้างยังปล่อยพิษได้ ควรเอาออกโดยเร็ว
  hints:
  - เหล็กในผึ้งมีถุงพิษติดอยู่
  - ไม่บีบถุงพิษ
  solution: ขูดเหล็กในออกทางด้านข้างด้วยขอบบัตรหรือเล็บ ไม่บีบ แล้วล้างด้วยสบู่และน้ำ และประคบเย็น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.first-aid-common-injuries.p005
  topics:
  - health.safety.first-aid-common-injuries
  difficulty: 2
  type: numeric
  stem: ตามหลัก PRICE ประคบเย็นข้อเท้าที่พลิกได้ครั้งละไม่เกินกี่นาที (ตอบเป็นนาที)
  answer:
    value: 20
    unit: นาที
  misconceptions:
  - match: 60
    feedback: ประคบนานเกินไปทำให้ผิวบาดเจ็บจากความเย็น ครั้งละไม่เกิน 20 นาที
  - match: 5
    feedback: 5 นาทีสั้นเกินไป ค่าที่แนะนำคือไม่เกิน 20 นาทีต่อครั้ง
  hints:
  - ประคบทุก 2–3 ชั่วโมง
  - เวลาต่อครั้งน้อยกว่าครึ่งชั่วโมง
  solution: ประคบเย็นครั้งละไม่เกิน 20 นาที ทุก 2–3 ชั่วโมงใน 2–3 วันแรก และห่อน้ำแข็งด้วยผ้าเสมอ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.first-aid-common-injuries.p006
  topics:
  - health.safety.first-aid-common-injuries
  difficulty: 2
  type: mcq
  stem: ข้อใดช่วยป้องกันการบาดเจ็บจากการเล่นฟุตบอลได้ (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: อบอุ่นร่างกายก่อนลงสนาม
    correct: true
  - id: b
    text: สวมสนับแข้ง
    correct: true
  - id: c
    text: เล่นตามกติกา ไม่เข้าสกัดอย่างรุนแรง
    correct: true
  - id: d
    text: ฝืนเล่นต่อแม้ข้อเท้ายังบวมจากนัดที่แล้ว
    feedback: เล่นขณะยังบาดเจ็บทำให้บาดเจ็บซ้ำและรุนแรงขึ้น
  - id: e
    text: เล่นบนสนามที่มีเศษแก้ว
    feedback: ต้องตรวจสนามให้ปลอดภัยก่อนเล่น
  hints:
  - คิดทั้งเรื่องร่างกาย อุปกรณ์ กติกา และสนาม
  - การบาดเจ็บซ้ำเป็นสาเหตุสำคัญของการบาดเจ็บรุนแรง
  solution: การอบอุ่นร่างกาย อุปกรณ์ป้องกัน และการเล่นตามกติกาช่วยป้องกันการบาดเจ็บ ส่วนการเล่นขณะบาดเจ็บและสนามอันตรายเพิ่มความเสี่ยง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.first-aid-common-injuries.p007
  topics:
  - health.safety.first-aid-common-injuries
  difficulty: 3
  type: mcq
  stem: น้องวัย 3 ขวบดื่มน้ำยาล้างห้องน้ำไปหนึ่งอึก ยังรู้สึกตัวดี ผู้ใหญ่ควรทำอย่างไร
  choices:
  - id: a
    text: ไม่ทำให้อาเจียน เก็บขวดไว้ แล้วโทร 1669 หรือ 1367 และทำตามคำแนะนำ
    correct: true
  - id: b
    text: ล้วงคอให้อาเจียนออกมาให้หมด
    feedback: การทำให้อาเจียนอาจทำให้สำลักและสารกัดกร่อนทำร้ายหลอดอาหารซ้ำ
  - id: c
    text: ให้ดื่มนมหลายแก้วแล้วรอดูอาการที่บ้าน
    feedback: ไม่ควรให้ดื่มอะไรเองถ้าเจ้าหน้าที่ไม่ได้แนะนำ และต้องขอคำปรึกษาทันที
  hints:
  - สารล้างห้องน้ำกัดกร่อนได้
  - ข้อมูลบนขวดช่วยให้แพทย์รักษาได้ถูก
  solution: ห้ามทำให้อาเจียน เก็บภาชนะไว้ โทร 1669 หรือศูนย์พิษวิทยา 1367 แล้วทำตามคำแนะนำ และพาไปโรงพยาบาล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.first-aid-common-injuries.p008
  topics:
  - health.safety.first-aid-common-injuries
  difficulty: 3
  type: numeric
  stem: ปลายฝนเผลอเอามือที่เปื้อนน้ำยาขัดพื้นขยี้ตา ควรล้างตาด้วยน้ำสะอาดที่ไหลผ่านอย่างน้อยกี่นาที (ตอบเป็นนาที)
  answer:
    value: 20
    unit: นาที
  misconceptions:
  - match: 1
    feedback: ล้างแค่ 1 นาทีน้อยเกินไป สารเคมียังค้างในตาได้
  - match: 5
    feedback: 5 นาทียังน้อยกว่าที่แนะนำ ควรอย่างน้อย 20 นาที
  hints:
  - ยิ่งล้างนาน สารเคมียิ่งเจือจางและออกไป
  - ค่าเดียวกับเวลาประคบเย็นสูงสุดต่อครั้ง
  solution: ล้างตาด้วยน้ำสะอาดไหลเบา ๆ อย่างน้อย 20 นาที อย่าขยี้ แล้วไปโรงพยาบาลพร้อมขวดน้ำยา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.first-aid-common-injuries.p009
  topics:
  - health.safety.first-aid-common-injuries
  difficulty: 3
  type: match
  stem: จับคู่การบาดเจ็บกับการปฐมพยาบาลขั้นแรก
  pairs:
  - left: ข้อเท้าพลิก บวม
    right: หยุดเล่นแล้วประคบเย็นที่ห่อผ้า
  - left: สุนัขกัดที่น่อง
    right: ล้างแผลด้วยน้ำและสบู่อย่างน้อย 15 นาที
  - left: สารเคมีกระเด็นเข้าตา
    right: ล้างตาด้วยน้ำสะอาดไหลผ่านอย่างน้อย 20 นาที
  - left: ผึ้งต่อยมีเหล็กในค้าง
    right: ขูดเหล็กในออกด้านข้าง
  hints:
  - แต่ละการบาดเจ็บมีวิธีเฉพาะ
  - แผลสัตว์กัดและสารเคมีใช้น้ำล้างทั้งคู่ แต่เวลาต่างกัน
  solution: "ข้อเท้าพลิก: PRICE สุนัขกัด: ล้างน้ำและสบู่ 15 นาทีแล้วพบแพทย์ สารเคมีเข้าตา: ล้าง 20 นาที ผึ้งต่อย: ขูดเหล็กในออก"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.first-aid-common-injuries.p010
  topics:
  - health.safety.first-aid-common-injuries
  difficulty: 3
  type: mcq
  stem: ลุงที่ไร่อ้อยถูกงูกัดที่ข้อเท้า ข้อใดถูกต้องตามคำแนะนำปัจจุบัน
  choices:
  - id: a
    text: ให้ลุงนั่งนิ่ง ๆ ดามขาด้วยไม้ ถอดกำไลข้อเท้า และรีบพาไปโรงพยาบาลหรือโทร 1669
    correct: true
  - id: b
    text: ใช้เชือกขันชะเนาะเหนือแผลให้แน่น
    feedback: การขันชะเนาะไม่ช่วยกันพิษ และทำให้ขาขาดเลือดจนเนื้อตายได้
  - id: c
    text: ใช้มีดกรีดแผลแล้วดูดพิษออก
    feedback: การกรีดและดูดทำให้แผลติดเชื้อและเลือดออกมากขึ้น ไม่ได้เอาพิษออก
  hints:
  - ยิ่งขยับ พิษยิ่งกระจายเร็ว
  - กระทรวงสาธารณสุขเตือนเรื่องความเชื่อเก่าหลายข้อ
  solution: ให้ผู้ถูกกัดอยู่นิ่ง ดามส่วนที่ถูกกัด ถอดเครื่องประดับ และรีบไปโรงพยาบาล ห้ามขันชะเนาะ กรีด ดูด หรือพอกยา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.first-aid-common-injuries.p011
  topics:
  - health.safety.first-aid-common-injuries
  difficulty: 4
  type: mcq
  stem: เพื่อนตกจากราวปีนป่ายสูง บ่นปวดคอและขาชา ขณะรอผู้ใหญ่ ข้อใดถูกต้อง
  choices:
  - id: a
    text: ไม่ขยับตัวเพื่อน บอกให้นอนนิ่ง ๆ และให้คนไปเรียกครูพร้อมโทร 1669
    correct: true
  - id: b
    text: พยุงเพื่อนลุกขึ้นเดินไปห้องพยาบาล
    feedback: ถ้ากระดูกคอบาดเจ็บ การขยับอาจทำร้ายไขสันหลังจนเป็นอัมพาต
  - id: c
    text: ช่วยกันหิ้วเพื่อนไปที่ร่ม โดยจับแขนขาคนละข้าง
    feedback: การยกแบบนี้ทำให้คอและหลังบิด ต้องรอเจ้าหน้าที่
  hints:
  - ปวดคอและชาเป็นสัญญาณว่าอาจบาดเจ็บที่กระดูกสันหลัง
  - เคลื่อนย้ายเฉพาะเมื่อมีอันตรายใกล้ตัว
  solution: สงสัยบาดเจ็บที่คอหรือหลังต้องไม่เคลื่อนย้าย ให้อยู่นิ่ง เรียกผู้ใหญ่และโทร 1669 เจ้าหน้าที่มีอุปกรณ์ยึดคอและกระดานรองหลัง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.first-aid-common-injuries.p012
  topics:
  - health.safety.first-aid-common-injuries
  difficulty: 4
  type: mcq
  stem: ข้อใดเป็นสัญญาณของการแพ้รุนแรงหลังถูกต่อต่อย ซึ่งต้องโทร 1669 ทันที
  choices:
  - id: a
    text: ริมฝีปากและคอบวม หายใจลำบาก
    correct: true
  - id: b
    text: มีตุ่มแดงคันขนาดเหรียญตรงที่ถูกต่อย
    feedback: อาการเฉพาะที่เป็นปฏิกิริยาปกติ ดูแลด้วยการล้างและประคบเย็น
  - id: c
    text: ปวดแสบตรงที่ถูกต่อยไม่กี่นาที
    feedback: อาการปวดเฉพาะที่ไม่ใช่สัญญาณแพ้รุนแรง
  hints:
  - การแพ้รุนแรงส่งผลต่อทั้งร่างกาย
  - อาการที่ทางเดินหายใจอันตรายที่สุด
  solution: ปาก ลิ้น หรือคอบวม และหายใจลำบาก เป็นการแพ้รุนแรงที่อาจทำให้หายใจไม่ได้ ต้องโทร 1669 ทันที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.first-aid-common-injuries.p013
  topics:
  - health.safety.first-aid-common-injuries
  difficulty: 4
  type: mcq
  stem: เพราะเหตุใดในช่วง 2–3 วันแรกหลังข้อเคล็ด จึงไม่ควรนวดหรือประคบร้อน
  choices:
  - id: a
    text: ความร้อนและการนวดทำให้เลือดมาเลี้ยงมากขึ้น บริเวณที่บาดเจ็บจึงบวมและอักเสบมากขึ้น
    correct: true
  - id: b
    text: เพราะความร้อนทำให้กระดูกหัก
    feedback: ความร้อนไม่ทำให้กระดูกหัก แต่ทำให้บวมมากขึ้น
  - id: c
    text: เพราะการนวดทำให้ติดเชื้อ
    feedback: ปัญหาหลักคือการบวมและอักเสบ ไม่ใช่การติดเชื้อ
  hints:
  - ช่วงแรกเป้าหมายคือลดบวม
  - ความเย็นทำให้หลอดเลือดหดตัว ความร้อนทำให้ขยายตัว
  solution: ช่วงแรกต้องลดบวมด้วยการพัก ประคบเย็น พันกระชับ และยกสูง ความร้อนและการนวดทำให้เลือดไหลมามากขึ้นและบวมมากขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.safety.first-aid-common-injuries.p014
  topics:
  - health.safety.first-aid-common-injuries
  difficulty: 4
  type: numeric
