  ai_assisted: true
- id: chinese.reading.short-texts.p011
  topics:
  - chinese.reading.short-texts
  difficulty: 3
  type: numeric
  stem: กรอบ HSK ระดับ 3 ตั้งเป้าว่าผู้เรียนอ่านได้อย่างน้อย 120 ตัวอักษรต่อนาที ถ้าข้อความยาว 240 ตัวอักษร ควรอ่านจบภายในกี่นาที
  answer:
    value: 2
    unit: นาที
  misconceptions:
  - match: 0.5
    feedback: หารกลับด้าน ต้องเป็นจำนวนตัวอักษร ÷ ความเร็ว
  - match: 360
    feedback: ไม่ต้องบวกกัน ใช้การหาร
  hints:
  - เวลา = จำนวนตัวอักษร ÷ ความเร็วในการอ่าน
  - 240 ÷ 120
  solution: $240 \div 120 = 2$ นาที
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.reading.short-texts.p012
  topics:
  - chinese.reading.short-texts
  difficulty: 3
  type: mcq
  stem: เพื่อนชาวจีนส่งข้อความมาว่า 明天下午三点我们在地铁站门口见，好吗？如果下雨，我们就在商场里看电影。 ถ้าพรุ่งนี้ฝนตก จะทำอะไร
  choices:
  - id: a
    text: เลื่อนเป็นบ่าย 3 โมงวันถัดไป
    feedback: บ่าย 3 โมงคือเวลานัดพรุ่งนี้
  - id: b
    text: ดูหนังในห้าง
    correct: true
    feedback: ถูก 如果下雨，我们就在商场里看电影
  - id: c
    text: ยกเลิกนัด
    feedback: ข้อความไม่ได้บอกว่าจะยกเลิก
  - id: d
    text: รอที่หน้าสถานีรถไฟใต้ดิน
    feedback: นั่นคือจุดนัดพบ ไม่ใช่สิ่งที่จะทำเมื่อฝนตก
  hints:
  - หาประโยคที่ขึ้นต้นด้วย 如果
  - 如果 A，就 B = ถ้า A ก็ B
  solution: '**ดูหนังในห้าง** (商场里 = ในห้าง 看电影 = ดูหนัง)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.reading.short-texts.p013
  topics:
  - chinese.reading.short-texts
  difficulty: 4
  type: mcq
  stem: อ่านเรื่องสั้น ใจความสำคัญของเรื่องคือข้อใด
  figure: &id002
    src: story-card.svg
    alt: 'เรื่องสั้นสมมติ 去清迈 พร้อมภาพรถไฟ ภูเขา และช้าง ข้อความ: 上个月，我和爸爸妈妈坐火车去清迈。火车很慢，我们坐了十二个小时，但是我一点儿也不累，因为窗外的风景很美。在清迈，我们先去看了大象，然后去夜市买东西。清迈比曼谷凉快，晚上我们都穿外套。我很喜欢清迈，如果有机会，我明年还想去。 คำอธิบายศัพท์: 风景 = ทิวทัศน์ 窗外 = นอกหน้าต่าง 外套 = เสื้อแจ็กเก็ต 小时 = ชั่วโมง'
    caption: เรื่องสั้น 去清迈 (สมมติ)
  choices:
  - id: a
    text: ตลาดกลางคืนในเชียงใหม่มีของขายมาก
    feedback: เรื่องไม่ได้เล่าเรื่องของในตลาด และเป็นเพียงรายละเอียด
  - id: b
    text: เชียงใหม่อากาศเย็นกว่ากรุงเทพฯ
    feedback: เป็นรายละเอียด ไม่ใช่ใจความทั้งเรื่อง
  - id: c
    text: ผู้เขียนไปเที่ยวเชียงใหม่กับพ่อแม่และชอบมาก
    correct: true
    feedback: ถูก บอก ใคร ไปไหน และความรู้สึกหลักของเรื่อง
  - id: d
    text: รถไฟไปเชียงใหม่ช้ามาก
    feedback: เป็นรายละเอียดหนึ่งของการเดินทาง ไม่ใช่เรื่องหลัก
  hints:
  - ใจความ = ใคร ทำอะไร ที่ไหน
  - ข้อที่ครอบคลุมทั้งเรื่อง ไม่ใช่เพียงประโยคเดียว
  solution: '**ผู้เขียนไปเที่ยวเชียงใหม่กับพ่อแม่และชอบมาก** ส่วนข้ออื่นเป็นรายละเอียด'
  license: CC-BY-SA-4.0
  ai_assisted: true
