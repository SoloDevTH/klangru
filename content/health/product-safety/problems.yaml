problems:
  - id: health.consumer.product-safety.p001
    topics: [health.consumer.product-safety]
    difficulty: 1
    type: mcq
    stem: "ของเล่นชิ้นใดไม่ควรให้น้องอายุ 2 ขวบเล่นมากที่สุด"
    choices:
      - { id: a, text: "รถของเล่นที่ใส่ถ่านกระดุมและฝาปิดถ่านหลวม", correct: true }
      - { id: b, text: "ตุ๊กตาผ้านุ่มที่เย็บตาด้วยด้าย", feedback: "ตุ๊กตาที่เย็บตาด้วยด้ายไม่มีชิ้นเล็กหลุด จึงปลอดภัยกว่า" }
      - { id: c, text: "ก้อนบล็อกไม้ขนาดใหญ่ ขอบมน", feedback: "บล็อกขนาดใหญ่ใส่ปากไม่ได้และขอบมน ปลอดภัยสำหรับเด็กเล็ก" }
      - { id: d, text: "หนังสือภาพผ้า", feedback: "หนังสือผ้าไม่มีชิ้นส่วนเล็กหรือขอบคม" }
    hints:
      - "เด็กเล็กชอบเอาของเข้าปาก"
      - "อะไรที่หลุดออกมาเป็นชิ้นเล็กและกลืนได้"
    solution: "ถ่านกระดุมที่หลุดออกมาได้เป็นอันตรายมาก ถ้าเด็กกลืนจะทำให้ทางเดินอาหารเป็นแผลรุนแรง ต้องรีบพาไปพบแพทย์ทันที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.consumer.product-safety.p002
    topics: [health.consumer.product-safety]
    difficulty: 1
    type: mcq
    stem: "ก่อนซื้อขนมถุง ควรดูข้อมูลใดบนฉลากเพื่อให้แน่ใจว่ายังไม่เลยวันที่กำหนด"
    choices:
      - { id: a, text: "วันที่ควรบริโภคก่อนหรือวันหมดอายุ", correct: true }
      - { id: b, text: "สีของถุง", feedback: "สีของถุงไม่ได้บอกว่าขนมยังดีอยู่หรือไม่" }
      - { id: c, text: "รูปการ์ตูนบนถุง", feedback: "รูปบนถุงเป็นการตกแต่ง ไม่ได้บอกวันที่" }
      - { id: d, text: "ราคา", feedback: "ราคาไม่ได้บอกว่าขนมเลยวันที่หรือไม่" }
    hints:
      - "ข้อมูลนี้เป็นตัวเลขวัน เดือน ปี"
      - "มักเขียนว่า ควรบริโภคก่อน หรือ EXP"
    solution: "ดูวันที่ควรบริโภคก่อนหรือวันหมดอายุ ถ้าเลยวันแล้วไม่ควรซื้อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.consumer.product-safety.p003
    topics: [health.consumer.product-safety]
    difficulty: 1
    type: numeric
    stem: "เลขสารบบอาหารที่อยู่ในกรอบเครื่องหมาย อย. มีตัวเลขทั้งหมดกี่หลัก (ตอบเป็นตัวเลขในหน่วยหลัก)"
    answer: { value: 13, unit: หลัก }
    misconceptions:
      - { match: 5, feedback: "5 คือจำนวนกลุ่มของตัวเลข แต่ละกลุ่มมีหลายหลัก รวมกันได้ 13 หลัก" }
    hints:
      - "เลขเขียนแบบ XX-X-XXXXX-X-XXXX"
      - "นับตัว X ทั้งหมด"
    solution: "เลขสารบบอาหารมี 13 หลัก แบ่งเป็น 5 กลุ่ม คือ 2 + 1 + 5 + 1 + 4 = 13"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.consumer.product-safety.p004
    topics: [health.consumer.product-safety]
    difficulty: 2
    type: mcq
    stem: "จากฉลากข้าวเกรียบสมมติ เพื่อนที่แพ้กุ้งควรดูข้อมูลส่วนใดก่อนตัดสินใจกิน"
    figure:
      src: food-label.svg
      alt: "ฉลากสมมติของข้าวเกรียบรสต้มยำ ตราใบเตย มีกรอบ อย. เลข 10-1-12345-6-0001 น้ำหนักสุทธิ 30 กรัม ผลิต 15/01/69 ควรบริโภคก่อน 15/07/69 ส่วนประกอบ แป้งมันสำปะหลัง 60% กุ้ง 20% น้ำมันปาล์ม เครื่องปรุงรสต้มยำ เกลือ น้ำตาล กรอบสีแดงเขียนว่า ข้อมูลสำหรับผู้แพ้อาหาร: มีกุ้ง อาจมีถั่วลิสง ใช้วัตถุกันเสีย ผลิตโดยบริษัท ขนมสมมติ จำกัด เขตบางกะปิ กรุงเทพมหานคร เก็บในที่แห้งและเย็น"
    choices:
      - { id: a, text: "ข้อมูลสำหรับผู้แพ้อาหาร", correct: true }
      - { id: b, text: "น้ำหนักสุทธิ", feedback: "น้ำหนักบอกปริมาณขนม ไม่ได้บอกว่ามีสิ่งที่แพ้หรือไม่" }
      - { id: c, text: "ชื่อผู้ผลิต", feedback: "ชื่อผู้ผลิตช่วยติดต่อได้ แต่ไม่ได้บอกว่ามีกุ้งหรือไม่" }
      - { id: d, text: "วิธีเก็บรักษา", feedback: "วิธีเก็บไม่เกี่ยวกับการแพ้อาหาร" }
    hints:
      - "ฉลากมีกรอบสีแดงที่เขียนเรื่องการแพ้"
      - "ส่วนประกอบก็บอกได้เช่นกัน"
    solution: "ข้อมูลสำหรับผู้แพ้อาหารเขียนว่ามีกุ้ง (และส่วนประกอบมีกุ้ง 20%) เพื่อนที่แพ้กุ้งจึงไม่ควรกิน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.consumer.product-safety.p005
    topics: [health.consumer.product-safety]
    difficulty: 2
    type: match
    stem: "จับคู่ชนิดผลิตภัณฑ์กับเลขหรือเครื่องหมายที่ควรตรวจบนฉลาก"
    pairs:
      - { left: "อาหารบรรจุถุงหรือกล่อง", right: "เลขสารบบอาหาร 13 หลักในกรอบ อย." }
      - { left: "ยาเม็ดแก้ปวด", right: "เลขทะเบียนตำรับยา (Reg. No.)" }
      - { left: "แป้งเด็กและแชมพู", right: "เลขที่ใบรับจดแจ้ง" }
      - { left: "ของเล่นเด็ก", right: "เครื่องหมาย มอก." }
    hints:
      - "เครื่องสำอางไม่ใช้กรอบ อย."
      - "ของเล่นดูแลโดยสำนักงานมาตรฐานผลิตภัณฑ์อุตสาหกรรม"
    solution: "อาหาร → เลขสารบบอาหารในกรอบ อย., ยา → เลขทะเบียนตำรับยา, เครื่องสำอาง → เลขที่ใบรับจดแจ้ง, ของเล่น → เครื่องหมาย มอก."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.consumer.product-safety.p006
    topics: [health.consumer.product-safety]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ของใช้และของเล่นข้อใดมีผลเสียต่อสุขภาพ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ปากกาเลเซอร์ที่เพื่อนชอบส่องตากัน", correct: true }
      - { id: b, text: "แม่เหล็กเม็ดเล็กที่หลุดจากของเล่น", correct: true }
      - { id: c, text: "ของเล่นที่สีลอกเป็นแผ่น ไม่มีฉลากและเครื่องหมาย", correct: true }
      - { id: d, text: "ลูกบอลผ้าขนาดใหญ่ที่มีเครื่องหมาย มอก.", feedback: "ลูกบอลผ้าขนาดใหญ่ที่ผ่านมาตรฐานไม่มีชิ้นเล็กหรือสารอันตราย" }
      - { id: e, text: "ดินสอสีที่มีฉลากภาษาไทยและเครื่องหมาย มอก.", feedback: "เครื่องเขียนที่มีฉลากและเครื่องหมายมาตรฐานมีความเสี่ยงต่ำ" }
    hints:
      - "ดูทั้งอันตรายต่อตา การกลืน และสารเคมี"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "แสงเลเซอร์ทำร้ายจอตา แม่เหล็กเม็ดเล็กถ้ากลืนหลายเม็ดจะดูดกันจนลำไส้ทะลุได้ และสีที่ลอกอาจมีตะกั่ว ส่วนของที่มีมาตรฐานและไม่มีชิ้นเล็กปลอดภัยกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.consumer.product-safety.p007
    topics: [health.consumer.product-safety]
    difficulty: 2
    type: text
    stem: "บนฉลากยาเขียนว่า EXP 08/2570 คำว่า EXP หมายถึงวันอะไร (ตอบภาษาไทย)"
    accepted: ["หมดอายุ", "วันหมดอายุ"]
    misconceptions:
      - { match: "ผลิต", feedback: "วันผลิตมักใช้ MFG หรือ MFD ส่วน EXP คือวันหมดอายุ" }
      - { match: "วันผลิต", feedback: "วันผลิตมักใช้ MFG หรือ MFD ส่วน EXP คือวันหมดอายุ" }
    hints:
      - "EXP ย่อมาจาก expiry"
      - "หลังวันนี้ไม่ควรใช้ยานี้"
    solution: "EXP คือวันหมดอายุ ยานี้หมดอายุเดือนสิงหาคม 2570 หลังจากนั้นไม่ควรใช้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.consumer.product-safety.p008
    topics: [health.consumer.product-safety]
    difficulty: 3
    type: numeric
    stem: "จากฉลากข้าวเกรียบสมมติ จากวันผลิตถึงวันควรบริโภคก่อนห่างกันกี่เดือน (ตอบเป็นตัวเลขในหน่วยเดือน)"
    figure:
      src: food-label.svg
      alt: "ฉลากสมมติของข้าวเกรียบรสต้มยำ ตราใบเตย มีกรอบ อย. เลข 10-1-12345-6-0001 น้ำหนักสุทธิ 30 กรัม ผลิต 15/01/69 ควรบริโภคก่อน 15/07/69 ส่วนประกอบ แป้งมันสำปะหลัง 60% กุ้ง 20% น้ำมันปาล์ม เครื่องปรุงรสต้มยำ เกลือ น้ำตาล กรอบสีแดงเขียนว่า ข้อมูลสำหรับผู้แพ้อาหาร: มีกุ้ง อาจมีถั่วลิสง ใช้วัตถุกันเสีย ผลิตโดยบริษัท ขนมสมมติ จำกัด เขตบางกะปิ กรุงเทพมหานคร เก็บในที่แห้งและเย็น"
    answer: { value: 6, unit: เดือน }
    misconceptions:
      - { match: 7, feedback: "นับเดือนกรกฎาคมรวมเข้าไปด้วย จาก 15 ม.ค. ถึง 15 ก.ค. คือ 6 เดือนพอดี" }
    hints:
      - "ผลิต 15/01/69 คือ 15 มกราคม 2569"
      - "นับจากเดือน 1 ไปเดือน 7 วันที่เท่ากัน"
    solution: "15 มกราคม ถึง 15 กรกฎาคม 2569 ห่างกัน $7 - 1 = 6$ เดือน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.consumer.product-safety.p009
    topics: [health.consumer.product-safety]
    difficulty: 3
    type: numeric
    stem: "วันนี้วันที่ 8 กรกฎาคม 2569 อีกกี่วันจะถึงวันควรบริโภคก่อนของข้าวเกรียบสมมติ (15/07/69) (ตอบเป็นตัวเลขในหน่วยวัน)"
    answer: { value: 7, unit: วัน }
    misconceptions:
      - { match: 8, feedback: "นับวันนี้รวมด้วย 15 − 8 = 7 วัน" }
      - { match: 23, feedback: "ดูเหมือนบวก 15 กับ 8 ต้องใช้การลบ" }
    hints:
      - "ทั้งสองวันอยู่ในเดือนกรกฎาคม 2569"
      - "ลบวันที่กัน"
    solution: "$15 - 8 = 7$ วัน ถ้าซื้อตอนนี้ควรกินภายใน 7 วัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.consumer.product-safety.p010
    topics: [health.consumer.product-safety]
    difficulty: 3
    type: mcq
    stem: "ตัวเลขกลุ่มแรก 2 หลักของเลขสารบบอาหาร เช่น 10 ใน 10-1-12345-6-0001 บอกข้อมูลอะไร"
    figure:
      src: fda-number.svg
      alt: "แผนภาพกรอบ อย. ที่มีเลขสมมติ 10-1-12345-6-0001 แยกเป็นห้ากลุ่มด้วยวงเล็บสีแดง กลุ่ม 1 สองหลัก กลุ่ม 2 หนึ่งหลัก กลุ่ม 3 ห้าหลัก กลุ่ม 4 หนึ่งหลัก กลุ่ม 5 สี่หลัก พร้อมคำอธิบายแต่ละกลุ่ม"
    choices:
      - { id: a, text: "จังหวัดที่ตั้งของสถานที่ผลิตหรือนำเข้าอาหาร", correct: true }
      - { id: b, text: "ลำดับที่ของผลิตภัณฑ์", feedback: "ลำดับของผลิตภัณฑ์คือกลุ่มสุดท้าย 4 หลัก" }
      - { id: c, text: "ราคาขาย", feedback: "เลขสารบบไม่ได้บอกราคา" }
      - { id: d, text: "วันหมดอายุ", feedback: "วันหมดอายุหรือวันควรบริโภคก่อนแสดงแยกต่างหาก ไม่อยู่ในเลขสารบบ" }
    hints:
      - "อ่านคำอธิบายใต้กลุ่ม 1 ในแผนภาพ"
      - "กลุ่มแรกเกี่ยวกับสถานที่"
    solution: "กลุ่มแรก 2 หลักบอกจังหวัดที่ตั้งของสถานที่ผลิตหรือนำเข้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.consumer.product-safety.p011
    topics: [health.consumer.product-safety]
    difficulty: 3
    type: mcq
    stem: "ในร้านสะดวกซื้อ มีนม UHT กล่องหนึ่งที่กล่องบวมพองผิดปกติ แต่ยังไม่เลยวันควรบริโภคก่อน ควรทำอย่างไร"
    choices:
      - { id: a, text: "ไม่ซื้อ และบอกพนักงานให้นำออกจากชั้น", correct: true }
      - { id: b, text: "ซื้อได้ เพราะยังไม่เลยวันที่", feedback: "กล่องบวมเป็นสัญญาณว่านมอาจเสียจากเชื้อจุลินทรีย์ที่สร้างแก๊ส แม้ยังไม่เลยวันที่" }
      - { id: c, text: "ซื้อมาแล้วต้มให้เดือดก่อนดื่ม", feedback: "นมที่เสียอาจมีสารพิษที่ความร้อนทำลายไม่หมด ไม่ควรเสี่ยง" }
      - { id: d, text: "เขย่ากล่องให้ยุบแล้ววางคืน", feedback: "ไม่ได้แก้ปัญหา และคนอื่นอาจซื้อไปดื่ม" }
    hints:
      - "วันที่บนฉลากใช้ได้เมื่อบรรจุภัณฑ์อยู่ในสภาพดี"
      - "กล่องบวมเกิดจากอะไร"
    solution: "กล่องบวม บุบ หรือรั่ว แสดงว่าอาหารอาจเสีย ไม่ควรซื้อแม้ยังไม่เลยวันที่ และควรแจ้งร้านให้นำออก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.consumer.product-safety.p012
    topics: [health.consumer.product-safety]
    difficulty: 4
    type: numeric
    stem: "มาตรฐานของเล่น มอก. 685 เล่ม 1-2562 กำหนดว่าตะกั่วที่ละลายออกมาจากสีเคลือบของเล่นต้องไม่เกิน 90 มิลลิกรัมต่อกิโลกรัม ถ้าตรวจของเล่นจากตลาดนัดชิ้นหนึ่งพบ 150 มิลลิกรัมต่อกิโลกรัม เกินเกณฑ์อยู่เท่าใด (ตอบเป็นตัวเลขในหน่วยมิลลิกรัมต่อกิโลกรัม)"
    answer: { value: 60, unit: "mg/kg" }
    misconceptions:
      - { match: 240, feedback: "ต้องลบเกณฑ์ออกจากค่าที่ตรวจพบ ไม่ใช่บวกกัน" }
      - { match: 1.67, feedback: "1.67 คือจำนวนเท่าของเกณฑ์ คำถามถามว่าเกินอยู่กี่มิลลิกรัมต่อกิโลกรัม" }
    hints:
      - "เกินเกณฑ์ = ค่าที่ตรวจพบ − ค่าสูงสุดที่ยอมรับ"
      - "หน่วยเดียวกันทั้งคู่ ลบกันได้เลย"
    solution: "$150 - 90 = 60$ มิลลิกรัมต่อกิโลกรัม ของเล่นชิ้นนี้ไม่ผ่านมาตรฐานและไม่ควรให้เด็กเล่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.consumer.product-safety.p013
