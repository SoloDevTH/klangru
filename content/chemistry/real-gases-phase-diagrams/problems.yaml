  - id: chemistry.states.real-gases-phase-diagrams.p016
    topics: [chemistry.states.real-gases-phase-diagrams]
    difficulty: 5
    type: numeric
    stem: 'ความดันไอของน้ำที่ 25 °C เท่ากับ 3.17 kPa และที่ 50 °C เท่ากับ 12.3 kPa จงคำนวณ $\Delta H_{vap}$ ของน้ำโดยใช้สมการเคลาซิอุส–คลาเปรองสองจุด กำหนด $R = 8.314$ J/(mol·K) (ตอบเป็น kJ/mol)'
    answer: { value: 43.4, tolerance: 0.3, unit: kJ/mol }
    hints:
      - 'จัดสมการเป็น $\Delta H = -R \ln(P_2/P_1) / (1/T_2 - 1/T_1)$ และเปลี่ยนอุณหภูมิเป็นเคลวินก่อน'
      - 'ค่า $\ln(P_2/P_1)$ เป็นบวก และ $(1/T_2 - 1/T_1)$ เป็นลบ ผลลัพธ์ต้องเป็นบวก'
    misconceptions:
      - { match: -43.4, feedback: 'เครื่องหมายผิด ค่าเอนทัลปีการระเหยเป็นบวกเสมอเพราะการระเหยต้องดูดความร้อน' }
    solution: '$\ln(12.3/3.17) = 1.356$ $1/323.15 - 1/298.15 = -2.595 \times 10^{-4}$ $\Delta H = -8.314 \times 1.356 / (-2.595 \times 10^{-4}) = 4.34 \times 10^{4}$ J/mol $= 43.4$ kJ/mol'
