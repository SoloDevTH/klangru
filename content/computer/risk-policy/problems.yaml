problems:
  - id: computer.security.risk-policy.p001
    topics: [computer.security.risk-policy]
    difficulty: 1
    type: mcq
    stem: "ความเสี่ยงด้านความมั่นคงปลอดภัยตามที่ใช้ในบทเรียนคือข้อใด"
    choices:
      - { id: a, text: "เหตุการณ์ที่แน่นอนว่าจะเกิดขึ้นในอนาคต", feedback: "ความเสี่ยงคือโอกาสที่อาจเกิดขึ้น ไม่ใช่สิ่งที่แน่นอน" }
      - { id: b, text: "โอกาสที่ภัยจะใช้ช่องโหว่ทำให้สินทรัพย์เสียหาย วัดจากโอกาสคูณผลกระทบ", correct: true }
      - { id: c, text: "จำนวนอุปกรณ์ที่เชื่อมต่อเครือข่ายทั้งหมด", feedback: "จำนวนอุปกรณ์อาจเป็นปัจจัยหนึ่ง แต่ไม่ใช่นิยามของความเสี่ยง" }
      - { id: d, text: "ระดับการเข้ารหัสของไฟล์", feedback: "การเข้ารหัสเป็นมาตรการควบคุม ไม่ใช่ความเสี่ยงเอง" }
    hints:
      - "ความเสี่ยงประกอบด้วยสองส่วนที่ต้องพิจารณาพร้อมกัน"
      - "ดูว่าตัวเลือกใดมีทั้งโอกาสและผลกระทบ"
    solution: "ความเสี่ยง = โอกาสที่ภัยจะใช้ช่องโหว่ทำให้สินทรัพย์เสียหาย และวัดด้วยโอกาสคูณผลกระทบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.risk-policy.p002
    topics: [computer.security.risk-policy]
    difficulty: 1
    type: match
    stem: "จับคู่แต่ละด้านของ CIA กับความหมาย"
    pairs:
      - { left: "Confidentiality", right: "เฉพาะผู้มีสิทธิ์เท่านั้นที่อ่านข้อมูลได้" }
      - { left: "Integrity", right: "ข้อมูลไม่ถูกแก้ไขโดยไม่ได้รับอนุญาต" }
      - { left: "Availability", right: "ผู้มีสิทธิ์เข้าถึงระบบได้เมื่อต้องการ" }
    hints:
      - "คำแรกของแต่ละด้านบอกความหมายได้ เช่น Confidential แปลว่าลับ"
      - "Integrity เกี่ยวกับความครบถ้วนและไม่ถูกแก้ ส่วน Availability เกี่ยวกับการใช้งานได้"
    solution: "Confidentiality คือความลับ Integrity คือความถูกต้องครบถ้วน Availability คือความพร้อมใช้งาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.risk-policy.p003
    topics: [computer.security.risk-policy]
    difficulty: 1
    type: mcq
    stem: "ไฟล์คะแนนกำลังถูกส่งผ่านเครือข่ายจากเครื่องครูไปยังเครื่องแม่ข่าย ข้อมูลนั้นอยู่ในสถานะใด"
    choices:
      - { id: a, text: "กำลังส่งผ่านเครือข่าย (in transit)", correct: true }
      - { id: b, text: "ถูกจัดเก็บ (at rest)", feedback: "ข้อมูลที่เก็บอยู่ในดิสก์หรือฐานข้อมูลเฉย ๆ จะเรียกว่าถูกจัดเก็บ ไฟล์นี้กำลังเดินทาง" }
      - { id: c, text: "ถูกทำลายไปแล้ว", feedback: "ข้อมูลยังไม่ได้ถูกทำลาย แค่กำลังถูกส่ง" }
      - { id: d, text: "สำรองไว้ในคลาวด์", feedback: "การสำรองเป็นกิจกรรม ไม่ใช่สถานะของข้อมูลที่กำลังเดินทาง" }
    hints:
      - "ลองนึกว่าข้อมูลกำลังวิ่งผ่านสายหรือคลื่นระหว่างจุดสองจุด"
      - "สามสถานะคือเก็บอยู่ เดินทาง และกำลังถูกใช้งาน"
    solution: "ข้อมูลที่กำลังส่งระหว่างอุปกรณ์เรียกว่าอยู่ในสถานะ in transit ต้องป้องกันด้วยการเชื่อมต่อที่เข้ารหัส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.risk-policy.p004
    topics: [computer.security.risk-policy]
    difficulty: 2
    type: numeric
    stem: "ระบบลงทะเบียนของโรงเรียนมีโอกาสล่มในช่วงเปิดเทอมระดับ 4 และผลกระทบระดับ 3 (ระดับ 1 ถึง 5) คะแนนความเสี่ยงเท่าไร (ตอบเป็นจำนวนเต็ม)"
    answer: { value: 12 }
    hints:
      - "คะแนนความเสี่ยงคำนวณจากโอกาสคูณผลกระทบ"
      - "อย่าบวกสองค่าเข้าด้วยกัน"
    misconceptions:
      - { match: 7, feedback: "7 เกิดจากการบวก 4 กับ 3 แต่สูตรความเสี่ยงใช้การคูณ เพื่อให้เห็นว่าโอกาสและผลกระทบส่งผลพร้อมกัน" }
      - { match: 3, feedback: "3 คือผลกระทบอย่างเดียว ต้องนำโอกาสมาคูณด้วย" }
    solution: "คะแนน = $4 \\times 3 = 12$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.risk-policy.p005
    topics: [computer.security.risk-policy]
    difficulty: 2
    type: mcq
    stem: "บริษัทขนมของโรงเรียนซื้อประกันภัยไซเบอร์ เพื่อให้บริษัทประกันช่วยรับผลกระทบทางการเงินบางส่วนเมื่อเกิดเหตุ ทางจัดการความเสี่ยงนี้คืออะไร"
    choices:
      - { id: a, text: "ลด (reduce)", feedback: "การลดคือการติดตั้งมาตรการให้โอกาสหรือผลกระทบน้อยลงเอง ประกันไม่ได้ลดโอกาส" }
      - { id: b, text: "ยอมรับ (accept)", feedback: "การยอมรับคือรับความเสี่ยงไว้เองและติดตาม ไม่ได้ให้ผู้อื่นรับผลกระทบ" }
      - { id: c, text: "โอน (transfer)", correct: true }
      - { id: d, text: "หลีกเลี่ยง (avoid)", feedback: "การหลีกเลี่ยงคือเลิกทำสิ่งที่สร้างความเสี่ยง ซึ่งไม่ตรงกับการซื้อประกัน" }
    hints:
      - "ถามว่าใครเป็นคนรับผลกระทบทางการเงินเมื่อเกิดเหตุ"
      - "การส่งภาระให้บุคคลที่สามเรียกว่าอย่างไร"
    solution: "การซื้อประกันคือการโอนผลกระทบทางการเงินให้บริษัทประกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.risk-policy.p006
    topics: [computer.security.risk-policy]
    difficulty: 2
    type: match
    stem: "จับคู่ตัวอย่างมาตรการกับชนิดของมาตรการ"
    pairs:
      - { left: "ไฟร์วอลล์และการเข้ารหัสไฟล์", right: "เทคนิค" }
      - { left: "นโยบายรหัสผ่านและการอบรมพนักงาน", right: "บริหาร" }
      - { left: "ประตูที่ต้องสแกนบัตรและกล้องวงจรปิด", right: "กายภาพ" }
    hints:
      - "ถ้าใช้เครื่องมือหรือซอฟต์แวร์ มักเป็นมาตรการเทคนิค"
      - "ถ้าเป็นกฎ ขั้นตอน หรือการอบรม มักเป็นมาตรการบริหาร"
    solution: "ไฟร์วอลล์และการเข้ารหัสเป็นเทคนิค นโยบายและการอบรมเป็นบริหาร ประตูและกล้องเป็นกายภาพ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.risk-policy.p007
    topics: [computer.security.risk-policy]
    difficulty: 2
    type: mcq
    stem: "ครูผู้สอนวิชาคอมพิวเตอร์ต้องกรอกคะแนนของห้อง ม.4/1 ข้อใดคือสิทธิ์ที่เหมาะสมตามหลักสิทธิ์น้อยที่สุด"
    choices:
      - { id: a, text: "สิทธิ์เต็มทุกห้องและทุกวิชาของโรงเรียน", feedback: "สิทธิ์เกินความจำเป็นและเพิ่มความเสียหายได้มาก ขัดกับหลักสิทธิ์น้อยที่สุด" }
      - { id: b, text: "ใช้บัญชีของผู้อำนวยการร่วมกันเพื่อความสะดวก", feedback: "การใช้บัญชีร่วมทำให้ตรวจสอบไม่ได้ว่าใครทำอะไร และให้สิทธิ์สูงเกินจำเป็น" }
      - { id: c, text: "ไม่มีสิทธิ์เลยแล้วให้ฝ่ายทะเบียนกรอกแทนทุกครั้ง", feedback: "ไม่ให้สิทธิ์เลยทำให้งานไม่เดิน และไม่ใช่การออกแบบสิทธิ์ที่เหมาะสม" }
      - { id: d, text: "สิทธิ์ดูและกรอกคะแนนเฉพาะห้อง ม.4/1 ของวิชาที่สอน", correct: true }
    hints:
      - "สิทธิ์ควรเท่ากับงานที่ต้องทำ ไม่เกินและไม่ขาด"
      - "ตรวจว่าตัวเลือกใดจำกัดทั้งห้องและวิชา"
    solution: "ให้สิทธิ์เฉพาะที่งานต้องการ คือดูและกรอกคะแนนของห้องและวิชาที่รับผิดชอบเท่านั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.risk-policy.p008
    topics: [computer.security.risk-policy]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการจัดการความเสี่ยงให้ถูกลำดับ"
    items:
      - "ระบุสินทรัพย์ที่มีคุณค่าขององค์กร"
      - "ระบุภัยคุกคามและช่องโหว่ที่เกี่ยวข้อง"
      - "ประเมินโอกาสและผลกระทบของแต่ละความเสี่ยง"
      - "เลือกทางจัดการ เช่น ลด โอน ยอมรับ หรือหลีกเลี่ยง"
      - "ติดตามผลและทบทวนมาตรการเป็นระยะ"
    hints:
      - "ต้องรู้ก่อนว่าอะไรมีค่า แล้วจึงดูว่าอะไรอาจทำให้เสียหาย"
      - "การติดตามเป็นขั้นสุดท้ายแต่วนกลับไปประเมินใหม่ได้"
    solution: "ระบุสินทรัพย์ ระบุภัยและช่องโหว่ ประเมินโอกาสกับผลกระทบ เลือกทางจัดการ แล้วติดตามและทบทวน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.risk-policy.p009
    topics: [computer.security.risk-policy]
    difficulty: 3
    type: numeric
    stem: "ความเสี่ยง A มีโอกาส 2 และผลกระทบ 5 ความเสี่ยง B มีโอกาส 4 และผลกระทบ 4 คะแนนของความเสี่ยงที่สูงกว่าคือเท่าไร (ตอบเป็นจำนวนเต็ม)"
    answer: { value: 16 }
    hints:
      - "คำนวณคะแนนแต่ละความเสี่ยงด้วยโอกาสคูณผลกระทบก่อน"
      - "A ได้ 10 และ B ได้ 16 เปรียบเทียบดูว่าค่าใดสูงกว่า"
    misconceptions:
      - { match: 10, feedback: "10 เป็นคะแนนของความเสี่ยง A ซึ่งต่ำกว่า B จึงไม่ใช่ความเสี่ยงที่สูงกว่า" }
      - { match: 8, feedback: "8 เกิดจากการบวกโอกาสกับผลกระทบของ B ซึ่งไม่ใช่วิธีคำนวณคะแนน" }
    solution: "A = 2 × 5 = 10, B = 4 × 4 = 16 ความเสี่ยง B สูงกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.risk-policy.p010
    topics: [computer.security.risk-policy]
    difficulty: 3
    type: mcq
    stem: "ได้รับอีเมลอ้างว่าเป็นผู้อำนวยการ ให้โอนเงินค่าอุปกรณ์ภายใน 10 นาที และห้ามบอกใครก่อน สัญญาณใดควรทำให้สงสัยมากที่สุด"
    choices:
      - { id: a, text: "มีการเร่งรีบและให้ปิดเรื่อง ซึ่งเป็นเทคนิคของวิศวกรรมสังคม", correct: true }
      - { id: b, text: "มีคำว่าผู้อำนวยการในอีเมล", feedback: "การอ้างตำแหน่งเป็นส่วนหนึ่งของเทคนิค แต่สัญญาณที่สำคัญกว่าคือการเร่งรีบและสั่งให้ปิดเรื่อง" }
      - { id: c, text: "อีเมลเขียนด้วยภาษาไทย", feedback: "ภาษาไม่ได้บอกว่าเป็นการหลอกลวง เพราะผู้ส่งจริงก็เขียนภาษาไทยได้" }
    hints:
      - "ดูคำที่บีบให้ทำเร็วและคำที่ให้ไม่บอกใคร"
      - "ทางป้องกันคือตรวจผ่านช่องทางอื่นที่รู้จักอยู่แล้ว"
    solution: "ความเร่งรีบ การอ้างอำนาจ และการให้ปิดเรื่องเป็นสัญญาณของวิศวกรรมสังคม ควรยืนยันผ่านช่องทางที่สองก่อนดำเนินการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.risk-policy.p011
    topics: [computer.security.risk-policy]
    difficulty: 3
    type: text
    stem: "ระบบการจัดการความมั่นคงสารสนเทศตามมาตรฐาน ISO/IEC 27001 มีชื่อย่อภาษาอังกฤษว่าอะไร (ตอบเป็นตัวอักษรย่อ)"
    accepted: ["ISMS"]
    misconceptions:
      - { match: "CIA", feedback: "CIA คือกรอบสามด้านของความมั่นคงข้อมูล ไม่ใช่ชื่อระบบการจัดการ" }
      - { match: "SOC", feedback: "SOC คือศูนย์ปฏิบัติการความมั่นคง ซึ่งเป็นหน่วยงานตรวจจับเหตุ ไม่ใช่ชื่อระบบการจัดการตามมาตรฐาน" }
    hints:
      - "คำเต็มขึ้นต้นด้วย Information Security และ Management"
      - "ชื่อย่อมี 4 ตัวอักษร"
    solution: "ISMS ย่อมาจาก Information Security Management System"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.risk-policy.p012
    topics: [computer.security.risk-policy]
    difficulty: 3
    type: numeric
    stem: "กฎหมายคุ้มครองข้อมูลส่วนบุคคลของไทยมีผลบังคับใช้เต็มรูปแบบเมื่อปี พ.ศ. ใด (ตอบเป็นปี พ.ศ. ตัวเลข 4 หลัก)"
    answer: { value: 2565 }
    hints:
      - "ชื่อกฎหมายคือพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 แต่บังคับใช้เต็มรูปแบบทีหลังประกาศ"
      - "การบังคับใช้เต็มรูปแบบเกิดหลังวันประกาศกฎหมายหลายปี ดูวันที่ในสรุปของวิกิพีเดียไทยหรือเอกสารทางการ"
    misconceptions:
      - { match: 2562, feedback: "2562 คือปีที่ประกาศพระราชบัญญัติ แต่การบังคับใช้เต็มรูปแบบเริ่มทีหลัง" }
      - { match: 2563, feedback: "2563 ไม่ใช่ปีที่บังคับใช้เต็มรูปแบบ ตามวิกิพีเดียไทยคือ พ.ศ. 2565 ต้องตรวจกับราชกิจจานุเบกษาก่อนเผยแพร่" }
    solution: "ตามวิกิพีเดียไทย การบังคับใช้เต็มรูปแบบของ พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 เริ่มวันที่ 1 มิถุนายน พ.ศ. 2565 (ต้องตรวจกับราชกิจจานุเบกษาก่อนเผยแพร่)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.risk-policy.p013
    topics: [computer.security.risk-policy]
    difficulty: 3
    type: mcq
    stem: "ในการควบคุมการเข้าถึงตามบทบาท (RBAC) สิทธิ์ถูกกำหนดให้ใคร"
    choices:
