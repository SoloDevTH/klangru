<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="740" height="330" font-family="sans-serif">
<title>ห่วงโซ่ภาษีมูลค่าเพิ่ม</title>
<defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#222"/></marker></defs>
<rect width="740" height="330" fill="#ffffff"/>
<rect x="20.0" y="40.0" width="200.0" height="170.0" fill="#eef3f9" stroke="#335" stroke-width="1.5" rx="10"/>
<text x="120.0" y="66.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">ผู้ผลิต</text>
<text x="34.0" y="96.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">ขาย 100,000 บาท</text>
<text x="34.0" y="120.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">ภาษีขาย 7,000</text>
<text x="34.0" y="144.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">หักภาษีซื้อ 0</text>
<rect x="30.0" y="160.0" width="180.0" height="36.0" fill="#fde9c8" stroke="#c56a00" stroke-width="1.5" rx="6"/>
<text x="120.0" y="184.0" font-size="14" text-anchor="middle" fill="#7a3e00" font-weight="bold">นำส่ง 7,000 บาท</text>
<line x1="222.0" y1="120.0" x2="266.0" y2="120.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<rect x="270.0" y="40.0" width="200.0" height="170.0" fill="#eef3f9" stroke="#335" stroke-width="1.5" rx="10"/>
<text x="370.0" y="66.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">ร้านค้าส่ง</text>
<text x="284.0" y="96.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">ขาย 150,000 บาท</text>
<text x="284.0" y="120.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">ภาษีขาย 10,500</text>
<text x="284.0" y="144.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">หักภาษีซื้อ 7,000</text>
<rect x="280.0" y="160.0" width="180.0" height="36.0" fill="#fde9c8" stroke="#c56a00" stroke-width="1.5" rx="6"/>
<text x="370.0" y="184.0" font-size="14" text-anchor="middle" fill="#7a3e00" font-weight="bold">นำส่ง 3,500 บาท</text>
<line x1="472.0" y1="120.0" x2="516.0" y2="120.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<rect x="520.0" y="40.0" width="200.0" height="170.0" fill="#eef3f9" stroke="#335" stroke-width="1.5" rx="10"/>
<text x="620.0" y="66.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">ร้านค้าปลีก</text>
<text x="534.0" y="96.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">ขาย 200,000 บาท</text>
<text x="534.0" y="120.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">ภาษีขาย 14,000</text>
<text x="534.0" y="144.0" font-size="13" text-anchor="start" fill="#222" font-weight="normal">หักภาษีซื้อ 10,500</text>
<rect x="530.0" y="160.0" width="180.0" height="36.0" fill="#fde9c8" stroke="#c56a00" stroke-width="1.5" rx="6"/>
<text x="620.0" y="184.0" font-size="14" text-anchor="middle" fill="#7a3e00" font-weight="bold">นำส่ง 3,500 บาท</text>
<text x="370.0" y="240.0" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">ผู้บริโภคจ่าย 200,000 + 14,000 = 214,000 บาท</text>
<text x="370.0" y="268.0" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">รัฐได้รวม 7,000 + 3,500 + 3,500 = 14,000 บาท = 7% ของราคาขายสุดท้าย</text>
<text x="370.0" y="300.0" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">ราคาในกล่องเป็นราคาก่อนภาษีมูลค่าเพิ่ม (ตัวเลขสมมติ)</text>
</svg>