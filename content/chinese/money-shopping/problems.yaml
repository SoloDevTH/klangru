  - match: 120
    feedback: 八折 ไม่ได้แปลว่าลด 80 หยวน แต่จ่าย 8 ใน 10 ส่วน
  hints:
  - ตัวเลขหน้า 折 บอกว่าจ่ายกี่ส่วนในสิบส่วน
  - 八折 = จ่าย 8/10 ของราคาเดิม
  solution: '八折 = จ่าย 80% ของราคาเดิม: $200 \times 0.8 = 160$ หยวน (ลดไป 40 หยวน)'
