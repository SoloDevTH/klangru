problems:
  - id: earthscience.astronomy.sky-day-night.p001
    topics: [earthscience.astronomy.sky-day-night]
    difficulty: 1
    type: mcq
    stem: "ตอนกลางวันที่ฟ้าใส เราเห็นอะไรบนท้องฟ้าได้ชัดที่สุด"
    choices:
      - { id: a, text: "ดวงอาทิตย์", correct: true }
      - { id: b, text: "ดาวจำนวนมาก", feedback: "ดาวยังอยู่บนท้องฟ้า แต่แสงอาทิตย์สว่างจนกลบแสงดาว ตอนกลางวันเราจึงไม่เห็นดาว" }
      - { id: c, text: "ทางช้างเผือก", feedback: "ทางช้างเผือกเป็นแสงจาง ๆ ของดาวจำนวนมาก เห็นได้เฉพาะคืนที่มืดสนิท" }
      - { id: d, text: "ไม่เห็นอะไรเลย", feedback: "ตอนกลางวันเราเห็นดวงอาทิตย์ และบางวันเห็นดวงจันทร์ด้วย" }
    hints:
      - "อะไรทำให้กลางวันสว่าง"
      - "สิ่งนั้นเป็นดาวที่อยู่ใกล้โลกที่สุด"
    solution: "ตอนกลางวันเราเห็นดวงอาทิตย์ชัดที่สุด ดวงอาทิตย์เป็นดาวที่อยู่ใกล้โลกที่สุดจึงสว่างมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.sky-day-night.p002
    topics: [earthscience.astronomy.sky-day-night]
    difficulty: 1
    type: match
    stem: "จับคู่สิ่งที่เห็นบนท้องฟ้ากับคำอธิบาย"
    pairs:
      - { left: "ดวงอาทิตย์", right: "ดาวที่อยู่ใกล้โลกที่สุด ให้แสงและความร้อน" }
      - { left: "ดวงจันทร์", right: "ไม่มีแสงในตัวเอง เห็นได้เพราะแสงอาทิตย์ส่องกระทบ" }
      - { left: "ดาวดวงอื่น", right: "มีแสงในตัวเองแต่อยู่ไกลมาก เห็นเป็นจุดเล็ก ๆ" }
    hints:
      - "ดวงไหนอยู่ใกล้เราที่สุดและสว่างที่สุด"
      - "ดวงจันทร์ยืมแสงจากใคร"
    solution: "ดวงอาทิตย์คือดาวที่ใกล้โลกที่สุด ดวงจันทร์สะท้อนแสงอาทิตย์ ส่วนดาวดวงอื่นมีแสงในตัวเองแต่อยู่ไกลมากจึงเห็นเป็นจุดเล็ก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.sky-day-night.p003
    topics: [earthscience.astronomy.sky-day-night]
    difficulty: 1
    type: text
    stem: "ทุกเช้าดวงอาทิตย์ขึ้นทางทิศใด"
    accepted: ["ตะวันออก", "ทิศตะวันออก", "ทางทิศตะวันออก", "east"]
    misconceptions:
      - { match: "ตะวันตก", feedback: "ทิศตะวันตกเป็นทางที่ดวงอาทิตย์ตกตอนเย็น ไม่ใช่ทางที่ขึ้น" }
      - { match: "ทิศตะวันตก", feedback: "ทิศตะวันตกเป็นทางที่ดวงอาทิตย์ตกตอนเย็น ไม่ใช่ทางที่ขึ้น" }
      - { match: "เหนือ", feedback: "ดวงอาทิตย์ไม่ได้ขึ้นทางทิศเหนือ ลองนึกถึงคำว่า ตะวัน...ออก" }
    hints:
      - "ชื่อทิศนี้มีคำว่า ตะวัน อยู่ด้วย"
      - "ตะวันออกมาตอนเช้า"
    solution: "ดวงอาทิตย์ขึ้นทางทิศตะวันออกทุกเช้า และตกทางทิศตะวันตกทุกเย็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.sky-day-night.p004
    topics: [earthscience.astronomy.sky-day-night]
    difficulty: 2
    type: mcq
    stem: "ทำไมตอนกลางวันเราจึงมองไม่เห็นดาวส่วนใหญ่"
    choices:
      - { id: a, text: "แสงอาทิตย์สว่างมาก ทำให้ท้องฟ้าสว่างจนกลบแสงดาว", correct: true }
      - { id: b, text: "ตอนกลางวันดาวหายไปจากท้องฟ้า", feedback: "ดาวไม่ได้หายไปไหน ตอนสุริยุปราคาเต็มดวงฟ้ามืดลง คนก็เห็นดาวได้ทั้งที่เป็นกลางวัน" }
      - { id: c, text: "ดาวไปหลบอยู่หลังดวงจันทร์", feedback: "ดวงจันทร์เล็กกว่าท้องฟ้ามาก บังดาวได้ทีละไม่กี่ดวงเท่านั้น" }
      - { id: d, text: "ดาวดับไฟตอนกลางวัน", feedback: "ดาวส่องแสงตลอดเวลา เราแค่มองไม่เห็นเพราะท้องฟ้าสว่างกว่า" }
    hints:
      - "ลองเปิดไฟฉายกลางแดดจ้า เห็นแสงชัดไหม"
      - "แสงดาวจางกว่าแสงท้องฟ้าตอนกลางวันมาก"
    solution: "ดาวยังอยู่บนท้องฟ้า แต่แสงอาทิตย์กระจายในอากาศทำให้ท้องฟ้าสว่าง แสงดาวที่จางกว่ามากจึงถูกกลบ เหมือนไฟฉายที่เปิดกลางแดดแล้วมองแทบไม่เห็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.sky-day-night.p005
    topics: [earthscience.astronomy.sky-day-night]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นหลักฐานว่าดาวยังอยู่บนท้องฟ้าแม้เรามองไม่เห็น (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ตอนพลบค่ำ พอฟ้ามืดลงก็เห็นดาวเพิ่มขึ้นทีละดวง", correct: true }
      - { id: b, text: "ตอนสุริยุปราคาเต็มดวง ฟ้ามืดลงและเห็นดาวได้ตอนกลางวัน", correct: true }
      - { id: c, text: "บนดอยที่มืดเห็นดาวมากกว่าในเมืองที่มีไฟสว่าง", correct: true }
      - { id: d, text: "ตอนกลางวันมีเมฆ", feedback: "เมฆบังท้องฟ้าได้ แต่ไม่ได้บอกว่าดาวยังอยู่หรือไม่ ข้อนี้ไม่ใช่หลักฐาน" }
    hints:
      - "หาเหตุการณ์ที่ท้องฟ้ามืดลงแล้วเราเห็นดาว"
      - "ถ้าที่ไหนมืดกว่า เราเห็นดาวมากกว่าไหม"
    solution: "ข้อ ก ข ค แสดงว่าเมื่อไม่มีแสงสว่างมากลบ เราก็เห็นดาว ดาวจึงอยู่บนท้องฟ้าตลอด ข้อ ง เรื่องเมฆไม่ได้บอกอะไรเกี่ยวกับดาว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.sky-day-night.p006
    topics: [earthscience.astronomy.sky-day-night]
    difficulty: 2
    type: mcq
    stem: "ภาพแสดงเงาของเสาธงหน้าโรงเรียนสามเวลา คือ ก ข และ ค เงาใดเกิดตอนเช้า"
    figure: { src: p-shadows.svg, alt: "เสาธงตั้งอยู่กลางภาพ ด้านซ้ายของภาพเป็นทิศตะวันออก ด้านขวาเป็นทิศตะวันตก มีเงาสามเส้น เงา ก ยาวและชี้ไปทางขวา (ทิศตะวันตก) เงา ข สั้นมาก เงา ค ยาวและชี้ไปทางซ้าย (ทิศตะวันออก)" }
    choices:
      - { id: a, text: "เงา ก", correct: true }
      - { id: b, text: "เงา ข", feedback: "เงาสั้นที่สุดเกิดตอนเที่ยง เพราะดวงอาทิตย์อยู่สูง" }
      - { id: c, text: "เงา ค", feedback: "เงา ค ชี้ไปทางตะวันออก แปลว่าดวงอาทิตย์อยู่ทางตะวันตก นั่นคือตอนเย็น" }
    hints:
      - "ตอนเช้าดวงอาทิตย์อยู่ทางทิศใด"
      - "เงาอยู่ด้านตรงข้ามกับดวงอาทิตย์เสมอ"
    solution: "ตอนเช้าดวงอาทิตย์อยู่ต่ำทางทิศตะวันออก เงาจึงยาวและชี้ไปทางทิศตะวันตก คือเงา ก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.sky-day-night.p007
    topics: [earthscience.astronomy.sky-day-night]
    difficulty: 2
    type: order
    stem: "เรียงสิ่งที่เราเห็นดวงอาทิตย์ในหนึ่งวัน จากเช้าไปจนถึงกลางคืน"
    items:
      - "ดวงอาทิตย์ขึ้นทางทิศตะวันออก อยู่ต่ำใกล้ขอบฟ้า"
      - "ดวงอาทิตย์อยู่สูงเกือบเหนือศีรษะ เงาสั้นที่สุด"
      - "ดวงอาทิตย์ตกทางทิศตะวันตก"
      - "ไม่เห็นดวงอาทิตย์ เห็นดาวบนท้องฟ้า"
    hints:
      - "เริ่มจากตอนเช้า ดวงอาทิตย์ขึ้นทางไหน"
      - "ตอนเที่ยงดวงอาทิตย์อยู่สูง ตอนเย็นตก แล้วจึงเป็นกลางคืน"
    solution: "เช้า ดวงอาทิตย์ขึ้นทางตะวันออก → เที่ยง อยู่สูงเงาสั้น → เย็น ตกทางตะวันตก → กลางคืน ไม่เห็นดวงอาทิตย์แต่เห็นดาว แบบรูปนี้ซ้ำทุกวัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.sky-day-night.p008
    topics: [earthscience.astronomy.sky-day-night]
    difficulty: 2
    type: mcq
    stem: "ชาวประมงที่จังหวัดสมุทรสาครนำปลาไปตากแดดหลายวันจนเป็นปลาเค็มแห้ง ชาวประมงใช้ประโยชน์อะไรจากดวงอาทิตย์"
    choices:
      - { id: a, text: "ความร้อนจากดวงอาทิตย์ทำให้น้ำในปลาระเหยไป ปลาจึงแห้ง", correct: true }
      - { id: b, text: "แสงอาทิตย์ช่วยให้ปลาสร้างอาหารเอง", feedback: "พืชเป็นผู้ใช้แสงสร้างอาหาร ปลาที่ตากแห้งแล้วไม่ได้สร้างอาหาร" }
      - { id: c, text: "ดวงอาทิตย์ทำให้ปลามีรสเค็ม", feedback: "ความเค็มมาจากเกลือที่ชาวประมงใส่ ดวงอาทิตย์ช่วยทำให้ปลาแห้ง" }
      - { id: d, text: "ดวงอาทิตย์ช่วยบอกทิศให้เรือกลับฝั่ง", feedback: "ดวงอาทิตย์ช่วยบอกทิศได้จริง แต่การตากปลาใช้ความร้อนของดวงอาทิตย์" }
    hints:
      - "ผ้าเปียกที่ตากแดดเปลี่ยนไปอย่างไร"
      - "ดวงอาทิตย์ให้แสงสว่างและความร้อน"
    solution: "ดวงอาทิตย์ให้ความร้อน ทำให้น้ำในตัวปลาระเหยออกไป ปลาจึงแห้งและเก็บไว้ได้นาน เหมือนการตากผ้าและการตากข้าวเปลือก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.sky-day-night.p009
    topics: [earthscience.astronomy.sky-day-night]
    difficulty: 3
    type: text
    stem: "ตอนเช้า มะลิยืนหันหน้าไปทางที่ดวงอาทิตย์ขึ้น แล้วกางแขนออก มือขวาของมะลิชี้ไปทิศใด"
    accepted: ["ใต้", "ทิศใต้", "ทางทิศใต้", "south"]
    misconceptions:
      - { match: "เหนือ", feedback: "มือซ้ายชี้ทิศเหนือ มือขวาชี้ทิศใต้ ลองหันหน้าไปทางตะวันออกจริง ๆ แล้วดู" }
      - { match: "ทิศเหนือ", feedback: "มือซ้ายชี้ทิศเหนือ มือขวาชี้ทิศใต้ ลองหันหน้าไปทางตะวันออกจริง ๆ แล้วดู" }
      - { match: "ตะวันออก", feedback: "ทิศตะวันออกอยู่ข้างหน้า โจทย์ถามทางมือขวา" }
    hints:
      - "ทางที่ดวงอาทิตย์ขึ้นคือทิศอะไร มะลิหันหน้าไปทางนั้น"
      - "หันหน้าไปทางตะวันออก มือซ้ายชี้ทิศเหนือ แล้วมือขวาล่ะ"
    solution: "มะลิหันหน้าไปทางทิศตะวันออก ข้างหลังคือทิศตะวันตก มือซ้ายคือทิศเหนือ มือขวาจึงชี้ไปทิศใต้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.sky-day-night.p010
    topics: [earthscience.astronomy.sky-day-night]
    difficulty: 3
    type: mcq
    stem: "ตอนเย็น ต้นหันหน้าไปทางที่ดวงอาทิตย์กำลังตก ข้างหลังของต้นคือทิศใด"
    choices:
      - { id: a, text: "ทิศตะวันออก", correct: true }
      - { id: b, text: "ทิศตะวันตก", feedback: "ดวงอาทิตย์ตกทางทิศตะวันตก ต้นหันหน้าไปทางนั้น ทิศตะวันตกจึงอยู่ข้างหน้า ไม่ใช่ข้างหลัง" }
      - { id: c, text: "ทิศเหนือ", feedback: "ทิศเหนืออยู่ทางมือขวาเมื่อหันหน้าไปทางตะวันตก" }
      - { id: d, text: "ทิศใต้", feedback: "ทิศใต้อยู่ทางมือซ้ายเมื่อหันหน้าไปทางตะวันตก" }
    hints:
      - "ดวงอาทิตย์ตกทางทิศใด"
      - "ทิศที่อยู่ตรงข้ามกับทิศตะวันตกคือทิศอะไร"
    solution: "ดวงอาทิตย์ตกทางทิศตะวันตก ต้นจึงหันหน้าไปทางทิศตะวันตก ข้างหลังคือทิศตรงข้าม คือทิศตะวันออก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.sky-day-night.p011
    topics: [earthscience.astronomy.sky-day-night]
    difficulty: 3
    type: mcq
    stem: "โรงเรียนพานักเรียนไปค้างคืนที่อุทยานแห่งชาติดอยอินทนนท์ นักเรียนเห็นดาวมากกว่าตอนอยู่บ้านในกรุงเทพฯ มาก ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "บนดอยท้องฟ้ามืดกว่า ไม่มีแสงไฟจากเมืองมากลบแสงดาว", correct: true }
      - { id: b, text: "ดอยอยู่ใกล้ดาวมากกว่ากรุงเทพฯ ดาวจึงสว่างขึ้น", feedback: "ดอยสูงกว่าพื้นราบเพียงไม่กี่กิโลเมตร แต่ดาวอยู่ไกลมาก ความสูงของดอยไม่ได้ทำให้ดาวใกล้ขึ้นอย่างมีความหมาย" }
      - { id: c, text: "ดาวมีเฉพาะบนท้องฟ้าทางภาคเหนือ", feedback: "ดาวมีอยู่ทั่วท้องฟ้า คนในกรุงเทพฯ มองไม่เห็นเพราะแสงไฟเมืองกลบ" }
      - { id: d, text: "ที่กรุงเทพฯ ดาวดับตอนกลางคืน", feedback: "ดาวส่องแสงตลอดเวลา ไม่ได้ดับ" }
    hints:
      - "เหตุที่กลางวันไม่เห็นดาวคืออะไร"
      - "ในเมืองใหญ่มีแสงอะไรสว่างตอนกลางคืน"
    solution: "แสงไฟถนนและอาคารในเมืองทำให้ท้องฟ้ากลางคืนสว่าง กลบแสงดาวที่จาง ส่วนบนดอยอินทนนท์ท้องฟ้ามืดกว่ามาก จึงเห็นดาวได้มากกว่า เหตุผลเดียวกับที่กลางวันไม่เห็นดาว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.astronomy.sky-day-night.p012
    topics: [earthscience.astronomy.sky-day-night]
    difficulty: 3
    type: numeric
