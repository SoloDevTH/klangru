id: thai.grammar.loanwords
subject: thai
title: { th: "คำภาษาต่างประเทศ คำทับศัพท์ และศัพท์บัญญัติ", en: "Loanwords, transliterated words and coined terms" }
summary: สังเกตลักษณะคำบาลี สันสกฤต เขมร จีน และอังกฤษในภาษาไทย เขียนคำทับศัพท์ตามหลักเกณฑ์ ใช้ศัพท์บัญญัติและศัพท์วิชาการ และวิเคราะห์อิทธิพลของภาษาต่างประเทศและภาษาถิ่น
difficulty: 5
minutes: 35
prerequisites: [thai.writing.special-spellings]
encompasses:
  - { id: thai.writing.special-spellings, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: origin-clues.svg
    alt: "ตาราง 5 คอลัมน์ ลักษณะที่ช่วยเดาที่มาของคำยืม บาลี ตัวสะกดตัวตามคู่กัน ใช้ ฬ ไม่มี ศ ษ ฤ ตัวอย่าง อัคคี มัจฉา กีฬา สันสกฤต มี ศ ษ ฤ รร มีคำควบกล้ำมาก ตัวอย่าง ศึกษา พฤฒิ ธรรม เขมร อักษรนำ คำควบกล้ำ ขึ้นต้น บัง บำ บรร ดำ ใช้เป็นราชาศัพท์ ตัวอย่าง ถนน บำเพ็ญ เสวย จีน อักษรกลางกับไม้ตรีหรือจัตวา อาหาร การค้า มาจากจีนถิ่น ตัวอย่าง ก๋วยเตี๋ยว ห้าง ตั๋ว อังกฤษ ทับศัพท์ตามเสียง ทัณฑฆาตตัวไม่ออกเสียง หรือใช้ศัพท์บัญญัติ ตัวอย่าง คลินิก กอล์ฟ วัคซีน"
    caption: "ลักษณะเหล่านี้ใช้เดา ที่มาจริงต้องตรวจในพจนานุกรม"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: บอกที่มาของคำในประโยค
    problem: "บอกที่มาของคำที่พิมพ์ตัวหนาในประโยค \"นักเรียนนั่งกิน **ก๋วยเตี๋ยว** ริม **ถนน** หลังเลิก **ศึกษา** **คอมพิวเตอร์**\""
    steps:
      - text: "ก๋วยเตี๋ยว: อักษรกลางผันด้วยไม้จัตวา เป็นชื่ออาหาร → เดาว่าจีน"
      - text: "ถนน: มีอักษรนำ ถ น → เดาว่าเขมร"
      - text: "ศึกษา: มี ศ ษ → เดาว่าสันสกฤต (บาลีเขียน สิกขา)"
      - text: "คอมพิวเตอร์: เขียนตามเสียงคำ computer มีทัณฑฆาตบน ร → ทับศัพท์อังกฤษ"
      - text: "ตรวจในพจนานุกรม: ก๋วยเตี๋ยว (จ.) ถนน (ข.) ศึกษา (ส.) คอมพิวเตอร์ (อ.) ตรงกับที่เดา"
        why: "ลักษณะคำใช้เดาได้ แต่มีข้อยกเว้น พจนานุกรมเป็นหลักฐานที่แน่นอน"
    answer: "ก๋วยเตี๋ยว จีน · ถนน เขมร · ศึกษา สันสกฤต · คอมพิวเตอร์ อังกฤษ"
  - { type: check, problem: thai.grammar.loanwords.p003, prompt: "สันสกฤตมักมีคำควบกล้ำ" }
  - type: worked-example
    title: ตรวจคำทับศัพท์ในประกาศ
    problem: "ตรวจประโยค \"ฝึกถ่ายภาพดิจิตอลแล้วแข่งเกมส์ทางอินเตอร์เน็ต\" ให้ถูกตามหลักเกณฑ์"
    steps:
      - text: "ดิจิตอล: digital พยางค์ -tal ขึ้นต้นด้วย t ใช้ ท และสระเป็น อะ → ดิจิทัล"
      - text: "เกมส์: ไม่เติม ส์ ที่แปลว่าหลายอัน และพจนานุกรมเขียน เกม"
      - text: "อินเตอร์เน็ต: พยางค์ -ter ขึ้นต้นด้วย t ใช้ ท → อินเทอร์เน็ต"
        why: "t ต้นพยางค์ใช้ ท ท้ายพยางค์ใช้ ต ตามตารางเทียบพยัญชนะ"
      - text: "ถ้างานเขียนเป็นทางการ พิจารณาศัพท์บัญญัติด้วย เช่น digital ใช้ได้ทั้ง เชิงเลข และ ดิจิทัล แต่ใช้แบบเดียวตลอด"
    answer: "ฝึกถ่ายภาพดิจิทัลแล้วแข่งเกมทางอินเทอร์เน็ต"
  - { type: check, problem: thai.grammar.loanwords.p009, prompt: "ตรวจทีละคำ อินเทอร์เน็ต ดิจิทัล เกม ไอศกรีม" }
glossary:
  - { term: คำยืม, definition: "คำที่ภาษาไทยรับมาจากภาษาอื่น" }
  - { term: คำทับศัพท์, definition: "คำภาษาต่างประเทศที่เขียนด้วยอักษรไทยตามเสียง เช่น คลินิก" }
  - { term: ศัพท์บัญญัติ, definition: "คำที่ราชบัณฑิตยสถานหรือสำนักงานราชบัณฑิตยสภากำหนดขึ้นแทนศัพท์ต่างประเทศ เช่น สารสนเทศ" }
  - { term: คำแผลง, definition: "คำที่แตกจากคำเดิมด้วยการเปลี่ยนหรือเติมเสียง เช่น ขจัด เป็น กำจัด" }
  - { term: ทัณฑฆาต, definition: "เครื่องหมาย ์ กำกับตัวที่ไม่ออกเสียง ตัวที่มีเครื่องหมายนี้เรียกว่าตัวการันต์" }
flashcards:
  - { front: "ศ ษ ฤ รร บอกที่มาใด", back: "มักเป็นคำสันสกฤต" }
  - { front: "ฬ และตัวสะกดตัวตามคู่กัน", back: "มักเป็นคำบาลี" }
  - { front: "บัง บำ บรร ดำ นำหน้า", back: "มักเป็นคำเขมร" }
  - { front: "t ในคำทับศัพท์อังกฤษ", back: "ต้นพยางค์ใช้ ท ท้ายพยางค์ใช้ ต" }
  - { front: "information ศัพท์บัญญัติ", back: "สารสนเทศ" }
