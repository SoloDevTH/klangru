  - id: math.roc.p016
    topics: [math.calculus.rate-of-change]
    difficulty: 3
    type: numeric
    stem: "กราฟแสดงอุณหภูมิของน้ำในกาขณะต้ม จากกราฟ หาอัตราการเปลี่ยนแปลงเฉลี่ยของอุณหภูมิระหว่างนาทีที่ 2 ถึงนาทีที่ 6 (ตอบในหน่วยองศาเซลเซียสต่อนาที)"
    figure: { src: heating-curve.svg, alt: "กราฟอุณหภูมิ (°C) กับเวลา (นาที) เป็นเส้นโค้งที่เริ่มที่ 20 °C เมื่อเวลา 0 แล้วเพิ่มขึ้นช้าลงเรื่อย ๆ มีจุดเน้นที่เวลา 2 นาที อุณหภูมิ 50 °C และเวลา 6 นาที อุณหภูมิ 80 °C พร้อมเส้นประลากไปที่แกนทั้งสอง" }
    answer: { value: 7.5, tolerance: 0.1, unit: °C ต่อนาที }
    hints:
      - "อ่านอุณหภูมิที่นาทีที่ 2 และนาทีที่ 6 จากจุดบนกราฟ"
      - "หาความชันของเส้นตัดที่เชื่อมสองจุดนั้น"
    misconceptions:
      - { match: 30, feedback: "นั่นคืออุณหภูมิที่เพิ่มขึ้นทั้งหมด ยังต้องหารด้วยเวลา $6 - 2 = 4$ นาที" }
      - { match: 13.33, feedback: "ดูเหมือนใช้ $\\tfrac{80}{6}$ ซึ่งไม่ได้ลบค่าเริ่มต้นของช่วง ต้องใช้ผลต่าง $\\tfrac{80 - 50}{6 - 2}$" }
    solution: "จากกราฟ ที่ $t = 2$ อุณหภูมิ $50$ °C และที่ $t = 6$ อุณหภูมิ $80$ °C อัตราเฉลี่ย $= \\dfrac{80 - 50}{6 - 2} = \\dfrac{30}{4} = 7.5$ °C ต่อนาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.roc.p017
    topics: [math.calculus.rate-of-change]
    difficulty: 3
    type: mcq
    stem: "รถ A วิ่งตามสูตร $s = 15t$ เมตร ($t$ เป็นวินาที) ส่วนรถ B มีระยะทางดังนี้ $t = 0$: $0\\ \\mathrm{m}$ · $t = 1$: $18\\ \\mathrm{m}$ · $t = 2$: $36\\ \\mathrm{m}$ · $t = 3$: $54\\ \\mathrm{m}$ รถคันใดเร็วกว่า"
    choices:
      - { id: a, text: "รถ B เร็วกว่า (18 เทียบกับ 15 เมตรต่อวินาที)", correct: true }
      - { id: b, text: "รถ A เร็วกว่า", feedback: "อัตราของรถ A คือสัมประสิทธิ์ $15\\ \\mathrm{m/s}$ ส่วนรถ B เพิ่มวินาทีละ $18\\ \\mathrm{m}$ ซึ่งมากกว่า" }
      - { id: c, text: "เร็วเท่ากัน", feedback: "ลองหาอัตราของรถ B จากตาราง: $\\tfrac{54 - 0}{3 - 0} = 18\\ \\mathrm{m/s}$ ไม่เท่ากับ $15$" }
      - { id: d, text: "เทียบไม่ได้ เพราะให้ข้อมูลคนละแบบ", feedback: "แปลงทั้งสองเป็นอัตราในหน่วยเดียวกัน ($\\mathrm{m/s}$) แล้วเทียบได้" }
    hints:
      - "อัตราของรถ A อ่านได้จากสัมประสิทธิ์ของ $t$"
      - "อัตราของรถ B หาจากตาราง: ระยะที่เพิ่มหารด้วยเวลาที่เพิ่ม"
    solution: "รถ A: $15\\ \\mathrm{m/s}$ รถ B: $\\tfrac{54 - 0}{3 - 0} = 18\\ \\mathrm{m/s}$ (เพิ่มวินาทีละ 18 m เท่ากันทุกช่วง) รถ B จึงเร็วกว่า"
