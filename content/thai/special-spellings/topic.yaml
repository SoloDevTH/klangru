id: thai.writing.special-spellings
subject: thai
title: { th: คำควบกล้ำ อักษรนำ ตัวการันต์ และคำที่มักเขียนผิด, en: "Clusters, leading consonants, silent letters and commonly misspelled words" }
summary: อ่านและเขียนคำควบกล้ำแท้และไม่แท้ อักษรนำ ตัวการันต์ คำที่มี รร ฤ ฤๅ บัน บรร คำประวิสรรชนีย์ คำพ้องรูปพ้องเสียง และคำที่มักเขียนผิดตามพจนานุกรม
difficulty: 3.5
minutes: 35
prerequisites: [thai.writing.spelling-basics, thai.writing.tone-rules]
encompasses:
  - { id: thai.writing.spelling-basics, weight: 0.3 }
  - { id: thai.writing.tone-rules, weight: 0.1 }
curriculum_tags: []
lessons:
  - type: figure
    src: silent-letters.svg
    alt: "ตัวการันต์ไม่ออกเสียง ส่วนที่ไม่ออกเสียงเป็นสีแดง 6 คำ: สัตว์ (ว์) อ่านว่า สัด · จันทร์ (ทร์) อ่านว่า จัน · ศุกร์ (ร์) อ่านว่า สุก · ศักดิ์ (ดิ์) อ่านว่า สัก · พันธุ์ (ธุ์) อ่านว่า พัน · กษัตริย์ (ริย์) อ่านว่า กะ-สัด"
    caption: "ตัวการันต์อาจเป็นพยัญชนะตัวเดียว สองตัว หรือมีสระติดอยู่"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: อ่านคำที่มีรูปพิเศษ
    problem: "อ่านและบอกเหตุผล: กรรไกร ทราย ฉลาด"
    steps:
      - text: "กรรไกร: รร ไม่มีตัวสะกดตาม ออกเสียง อัน ส่วน กร ท้ายคำเป็นควบกล้ำแท้ อ่าน กัน-ไกร"
      - text: "ทราย: ทร เป็นควบกล้ำไม่แท้ ออกเสียง ซ อ่าน ซาย"
      - text: "ฉลาด: ฉ อักษรสูงนำ ล อักษรต่ำเดี่ยว อ่าน ฉะ-หลาด"
        why: "พยางค์หลังของอักษรนำออกเสียงวรรณยุกต์ตามตัวนำ จึงเป็น หลาด (เสียงเอก) ไม่ใช่ ลาด"
    answer: "กัน-ไกร · ซาย · ฉะ-หลาด"
  - { type: check, problem: thai.writing.special-spellings.p003, prompt: "ตัวหน้าเป็นอักษรสูงหรืออักษรต่ำ" }
  - type: worked-example
    title: เลือกรูปเขียนจากความหมาย
    problem: "เติมคำ: \"นักกีฬา___ความสำเร็จ ได้เหรียญทอง\" เลือก ประสบ หรือ ประสพ"
    steps:
      - text: "สองคำอ่าน /ปฺระสบ/ เหมือนกัน เป็นคำพ้องเสียง"
      - text: "ดูความหมาย: ประสบ = พบ ส่วน ประสพ = การเกิดผล (เป็นคำนาม)"
      - text: "ในประโยค นักกีฬา พบ ความสำเร็จ และต้องใช้คำกริยา"
        why: "คำพ้องเสียงเลือกจากความหมายและหน้าที่ในประโยค ไม่ใช่จากเสียง"
    answer: "นักกีฬาประสบความสำเร็จ ได้เหรียญทอง"
  - { type: check, problem: thai.writing.special-spellings.p008, prompt: "รร มีตัวสะกดตามหรือไม่" }
glossary:
  - { term: ควบกล้ำแท้, definition: "พยัญชนะต้นสองตัวที่ออกเสียงพร้อมกัน ตัวหลังเป็น ร ล ว เช่น ปลา ครู ขวาน" }
  - { term: ควบกล้ำไม่แท้, definition: "เขียนสองตัวแต่ไม่ออกเสียงทั้งสอง เช่น จริง (จิง) ทราย (ซาย)" }
  - { term: อักษรนำ, definition: "พยัญชนะสองตัวที่ตัวหน้านำเสียงวรรณยุกต์ของตัวหลัง เช่น หมา ขนม อย่า" }
  - { term: ตัวการันต์, definition: "พยัญชนะที่มีไม้ทัณฑฆาตกำกับและไม่ออกเสียง เช่น ว์ ใน สัตว์" }
  - { term: ประวิสรรชนีย์, definition: "การเขียนสระอะ (ะ) กำกับ เช่น กะทิ ตะกร้า" }
  - { term: คำพ้องเสียง, definition: "คำที่อ่านเหมือนกันแต่เขียนและมีความหมายต่างกัน เช่น พัก พรรค พักตร์" }
flashcards:
  - { front: "อ นำ ย มีคำใดบ้าง", back: "อย่า อยู่ อย่าง อยาก" }
  - { front: "รร ออกเสียงอย่างไร", back: "ไม่มีตัวสะกด = อัน (บรรจุ) · มีตัวสะกด = อะ + ตัวสะกด (ธรรม = ทำ)" }
  - { front: "ฤ อ่านได้กี่แบบ", back: "3 แบบ: รึ (ฤดู) ริ (ฤทธิ์) เรอ (ฤกษ์) ส่วน ฤๅ อ่าน รือ" }
  - { front: "บัน หรือ บรร: บันได บรรทุก บันทึก บรรจุ", back: "บันได บันทึก ใช้ บัน · บรรทุก บรรจุ ใช้ บรร" }
  - { front: "กะเพรา หรือ กระเพรา", back: "กะเพรา (ตามพจนานุกรมฉบับราชบัณฑิตยสถาน)" }
