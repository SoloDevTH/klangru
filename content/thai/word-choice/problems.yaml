problems:
- id: thai.composition.word-choice.p001
  topics:
  - thai.composition.word-choice
  difficulty: 1
  type: mcq
  stem: 'เติมคำให้ถูกความหมาย: "พ่อ ___ กลับถึงบ้านเมื่อสักครู่นี้เอง"'
  choices:
  - id: a
    text: เพิ่ง
    correct: true
    feedback: ถูก เพิ่ง ใช้กับสิ่งที่เกิดเมื่อสักครู่
  - id: b
    text: เพียง
    feedback: เพียง แปลว่า แค่ เช่น เพียงสองคน
  - id: c
    text: พึง
    feedback: พึง แปลว่า ควร เช่น พึงปฏิบัติ
  - id: d
    text: เพิ่ม
    feedback: เพิ่ม แปลว่า ทำให้มากขึ้น
  hints:
  - ประโยคบอกเวลาว่าเกิดเมื่อสักครู่
  - คำใดแปลว่าเพิ่งเกิดขึ้น
  solution: ใช้ **เพิ่ง** เพราะพ่อกลับถึงบ้านเมื่อสักครู่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.word-choice.p002
  topics:
  - thai.composition.word-choice
  difficulty: 1
  type: mcq
  stem: จะเขียนบอกเพื่อนว่า "ฉันมีดินสอ 3 แท่ง" ข้อใดเขียนได้ **ถูกต้อง**
  choices:
  - id: a
    text: ฉันมีดินสอ 3 แท่ง
    correct: true
    feedback: ถูก ลักษณนามของดินสอคือ แท่ง
  - id: b
    text: ฉันมีดินสอ 3 ตัว
    feedback: ตัว ใช้กับสัตว์หรือเสื้อ ไม่ใช่ดินสอ
  - id: c
    text: ฉันมีดินสอ 3 อัน
    feedback: อัน ใช้แทนได้ในภาษาพูด แต่ไม่ถูกตามหลักภาษา
  - id: d
    text: ฉันมีดิสอ 3 แท่ง
    feedback: สะกดผิด ต้องเป็น ดินสอ
  hints:
  - ดูทั้งลักษณนามและการสะกด
  - ดินสอใช้ลักษณนามว่าอะไร
  solution: '**ฉันมีดินสอ 3 แท่ง** สะกดถูกและใช้ลักษณนามถูก'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.word-choice.p003
  topics:
  - thai.composition.word-choice
  difficulty: 2
  type: match
  stem: จับคู่คำกับประโยคที่ใช้คำนั้นได้ถูกความหมาย
  pairs:
  - left: ร่วม
    right: นักเรียนทุกห้อง___กันปลูกต้นไม้
  - left: รวม
    right: ครู___คะแนนสองวิชาเข้าด้วยกัน
  - left: เลื่อน
    right: ฝนตกหนัก จึง___การแข่งขันไปสัปดาห์หน้า
  - left: ยกเลิก
    right: สนามเสียหายมาก จึง___การแข่งขันปีนี้
  hints:
  - ร่วม = ทำด้วยกัน · รวม = เอามาบวกหรือไว้ด้วยกัน
  - เลื่อน = ยังจัดแต่ย้ายวัน · ยกเลิก = ไม่จัดแล้ว
  solution: ร่วมกันปลูก · รวมคะแนน · เลื่อนไปสัปดาห์หน้า · ยกเลิกการแข่งขันปีนี้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.word-choice.p004
  topics:
  - thai.composition.word-choice
  difficulty: 2
  type: mcq
  stem: ข้อความถึงครูข้อใด **เหมาะสม** ที่สุด
  choices:
  - id: a
    text: เรียน คุณครูวิภา หนูขออนุญาตลาป่วยวันนี้ 1 วันค่ะ
    correct: true
    feedback: ถูก มีคำขึ้นต้น ใช้คำสุภาพ บอกข้อมูลครบ
  - id: b
    text: ครู วันนี้ไม่ไปนะ ป่วย
    feedback: ห้วน ไม่มีคำสุภาพ เหมาะกับเพื่อนสนิทมากกว่า
  - id: c
    text: ครูขา หนูไม่สบายมากกกก ขอลาน้า
    feedback: ใช้ภาษาแชต ลากเสียงและสะกดผิดแบบไม่เป็นทางการ
  - id: d
    text: วันนี้หนูขอยกเลิกการมาโรงเรียนค่ะ
    feedback: ยกเลิก ใช้ผิดความหมาย ต้องใช้ ลา
  hints:
  - เขียนถึงครู ควรใช้ระดับภาษาแบบใด
  - ดูคำขึ้นต้นและคำที่ใช้บอกว่าไม่มาโรงเรียน
  solution: '**เรียน คุณครูวิภา หนูขออนุญาตลาป่วยวันนี้ 1 วันค่ะ** สุภาพ ชัดเจน และใช้คำว่า ลา ถูกความหมาย'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.word-choice.p005
  topics:
  - thai.composition.word-choice
  difficulty: 2
  type: text
  stem: 'ตัดคำฟุ่มเฟือยออก 1 คำ แล้วพิมพ์ประโยคใหม่: "นักเรียนทำการทำความสะอาดห้องเรียน"'
  accepted:
  - นักเรียนทำความสะอาดห้องเรียน
  misconceptions:
  - match: นักเรียนทำการความสะอาดห้องเรียน
    feedback: ตัดคำผิด ต้องตัด ทำการ ซึ่งไม่เพิ่มความหมาย และเก็บ ทำความสะอาด ไว้
  - match: นักเรียนทำการทำความสะอาด
    feedback: ตัดคำที่จำเป็น ห้องเรียน ออกไป
  hints:
  - คำใดซ้ำหรือไม่เพิ่มความหมาย
  - ทำการ + ทำความสะอาด มีคำว่า ทำ ซ้ำ
  solution: ตัด **ทำการ** ออก ได้ "**นักเรียนทำความสะอาดห้องเรียน**"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.word-choice.p006
  topics:
  - thai.composition.word-choice
  difficulty: 3
  type: mcq
  stem: ข้อความใด **กำกวม** อ่านได้สองความหมาย
  choices:
  - id: a
    text: ฉันชอบแมวมากกว่าน้อง
    correct: true
    feedback: ถูก อาจหมายถึงชอบแมวมากกว่าชอบน้อง หรือชอบแมวมากกว่าที่น้องชอบ
  - id: b
    text: ฉันชอบแมวมากกว่าที่น้องชอบ
    feedback: เติม ที่ ...ชอบ แล้ว ความหมายเดียว
  - id: c
    text: ฉันชอบแมวมากกว่าสุนัข
    feedback: เทียบแมวกับสุนัข ความหมายเดียว
  - id: d
    text: น้องชอบแมวสีขาว
    feedback: ไม่มีการเปรียบเทียบที่กำกวม
  hints:
  - ลองอ่านแต่ละข้อแล้วถามว่าแปลได้กี่แบบ
  - ข้อที่ไม่บอกว่าเปรียบเทียบกับอะไรแน่มักกำกวม
  solution: '**ฉันชอบแมวมากกว่าน้อง** กำกวม แก้เป็น "...มากกว่าที่น้องชอบ" หรือ "...มากกว่าชอบน้อง"'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.word-choice.p007
  topics:
  - thai.composition.word-choice
  difficulty: 3
  type: mcq
  stem: อ่านประกาศในภาพ ประกาศนี้ **ขาดข้อมูลสำคัญ** ข้อใด
  figure:
    src: club-notice.svg
    alt: 'ประกาศ ชมรมหุ่นยนต์: ขอเชิญสมาชิกทุกคนมาประชุมเลือกประธานชมรม ที่ห้องคอมพิวเตอร์ อาคาร 3 วันอังคารที่ 10 พฤศจิกายน สมาชิกที่ไม่มาจะเสียสิทธิ์ออกเสียง ลงชื่อ ประธานชมรม'
  choices:
  - id: a
    text: เวลาที่ประชุม
    correct: true
    feedback: ถูก มีวันและสถานที่ แต่ไม่บอกว่ากี่โมง
  - id: b
    text: สถานที่ประชุม
    feedback: ประกาศบอกแล้วว่าห้องคอมพิวเตอร์ อาคาร 3
  - id: c
    text: วันที่ประชุม
    feedback: ประกาศบอกแล้วว่าวันอังคารที่ 10 พฤศจิกายน
  - id: d
    text: เรื่องที่ประชุม
    feedback: ประกาศบอกแล้วว่าเลือกประธานชมรม
  hints:
  - ไล่ตรวจ ใคร ทำอะไร ที่ไหน เมื่อไร
  - '"เมื่อไร" ต้องมีทั้งวันและเวลา'
  solution: ประกาศบอกใคร ทำอะไร ที่ไหน และวันที่ แต่ **ไม่บอกเวลา** สมาชิกจึงไม่รู้ว่าต้องมากี่โมง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.word-choice.p008
  topics:
  - thai.composition.word-choice
  difficulty: 3
  type: mcq
  stem: แก้ประโยค "มันเป็นการยากที่จะตื่นตีห้าทุกวัน" ให้เป็นสำนวนไทยที่สละสลวย
  choices:
  - id: a
    text: การตื่นตีห้าทุกวันเป็นเรื่องยาก
    correct: true
    feedback: ถูก กระชับและเป็นแบบไทย
  - id: b
    text: มันยากที่จะตื่นตีห้าทุกวัน
    feedback: ยังใช้ มัน...ที่จะ แบบภาษาอังกฤษ
  - id: c
    text: มันเป็นการยากมากที่จะได้ทำการตื่นตีห้าทุกวัน
    feedback: ยิ่งฟุ่มเฟือยขึ้น
  - id: d
    text: ตีห้าทุกวันยาก
    feedback: ตัดจนความหมายไม่ครบ ไม่ได้บอกว่าตื่น
  hints:
  - มันเป็นการ...ที่จะ แปลมาจาก It is ... to ...
  - เริ่มประโยคด้วยสิ่งที่ยาก แล้วตามด้วย เป็นเรื่องยาก
  solution: เขียนใหม่ว่า **การตื่นตีห้าทุกวันเป็นเรื่องยาก** (หรือ ตื่นตีห้าทุกวันได้ยาก)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.word-choice.p009
  topics:
  - thai.composition.word-choice
  difficulty: 3
  type: match
  stem: จับคู่คำภาษาพูดกับคำที่ใช้ในงานเขียนสุภาพ
  pairs:
  - left: กิน
    right: รับประทาน
  - left: เยอะ
    right: มาก
  - left: โอเค
    right: ตกลง
  - left: ได้มั้ย
    right: ได้หรือไม่
  hints:
  - งานเขียนสุภาพไม่ใช้คำแสลงหรือคำทับศัพท์ที่ไม่จำเป็น
  - มั้ย เป็นรูปเขียนตามเสียงพูด
  solution: กิน → รับประทาน · เยอะ → มาก · โอเค → ตกลง · ได้มั้ย → ได้หรือไม่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.word-choice.p010
  topics:
  - thai.composition.word-choice
  difficulty: 4
  type: mcq
  stem: ประโยคใดใช้คำว่า **ถูก** ได้เหมาะสมที่สุด
  choices:
  - id: a
    text: เขาถูกครูตำหนิเพราะส่งงานช้า
    correct: true
    feedback: ถูก ใช้ ถูก กับเรื่องที่ไม่ดีต่อผู้รับ
  - id: b
    text: เขาถูกชมว่าเป็นเด็กดี
    feedback: เรื่องดี ควรใช้ ได้รับคำชม
  - id: c
    text: โครงงานของเราถูกคัดเลือกให้ได้รางวัล
    feedback: เรื่องดี ควรใช้ ได้รับการคัดเลือก
  - id: d
    text: คุณยายถูกเชิญเป็นประธานในงาน
    feedback: เรื่องที่เป็นเกียรติ ควรใช้ ได้รับเชิญ
  hints:
  - ในภาษาไทยแบบดั้งเดิม ถูก ใช้กับเรื่องดีหรือไม่ดี
  - เรื่องดีใช้คำว่าอะไรแทน
  solution: '**เขาถูกครูตำหนิเพราะส่งงานช้า** เป็นเรื่องไม่ดี ใช้ ถูก ได้ ส่วนเรื่องดีควรใช้ ได้รับ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.word-choice.p011
  topics:
  - thai.composition.word-choice
  difficulty: 4
  type: mcq
  stem: ข้อความใด **ไม่มี** คำฟุ่มเฟือยหรือคำซ้ำความ
  choices:
  - id: a
    text: มีผู้เข้าร่วมงานประมาณ 50 คน
    correct: true
    feedback: ถูก กระชับ ไม่ซ้ำความ
  - id: b
    text: มีผู้เข้าร่วมงานประมาณ 50 กว่าคน
    feedback: ประมาณ กับ กว่า บอกความไม่แน่นอนซ้ำกัน
  - id: c
    text: ผู้ป่วยกลับคืนสู่บ้านอีกครั้งหนึ่ง
    feedback: กลับ คืน สู่ อีกครั้ง ซ้ำความ
  - id: d
    text: คณะกรรมการได้ทำการพิจารณาแล้ว
    feedback: ได้ทำการ ไม่เพิ่มความหมาย
  hints:
  - หาคำที่ตัดออกแล้วความหมายเหมือนเดิม
  - ประมาณ กับ กว่า ใช้คู่กันจำเป็นไหม
  solution: '**มีผู้เข้าร่วมงานประมาณ 50 คน** ไม่มีคำเกิน ข้ออื่นมี ประมาณ...กว่า · กลับคืนสู่...อีกครั้ง · ได้ทำการ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.word-choice.p012
  topics:
  - thai.composition.word-choice
  difficulty: 4
  type: mcq
  stem: '"รถชนคนตายที่หน้าโรงเรียน" แก้ข้อความอย่างไรให้ **ชัดเจน** ว่าคนเสียชีวิตเพราะถูกรถชน'
  choices:
  - id: a
    text: รถชนคนจนเสียชีวิตที่หน้าโรงเรียน
    correct: true
    feedback: ถูก จน บอกผลว่าเสียชีวิตเพราะถูกชน
  - id: b
    text: รถชนศพที่หน้าโรงเรียน
    feedback: เปลี่ยนความหมายเป็นชนศพ
  - id: c
    text: รถชนคนตายมากที่หน้าโรงเรียน
    feedback: ยังกำกวมเหมือนเดิม
  - id: d
    text: ที่หน้าโรงเรียนมีรถชนคนตาย
    feedback: ย้ายตำแหน่งคำ แต่ คนตาย ยังอ่านได้สองแบบ
  hints:
  - คนตาย อ่านเป็นคำนาม (ศพ) หรือเป็นผลของการชนก็ได้
  - เติมคำที่บอกผลของการกระทำ
  solution: เติม **จน** เป็น "รถชนคนจนเสียชีวิต..." บอกชัดว่าการชนทำให้เสียชีวิต
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.word-choice.p013
  topics:
  - thai.composition.word-choice
  difficulty: 4
  type: order
  stem: เรียงประโยคเป็นข้อความขออนุญาตใช้ห้องประชุมที่ชัดเจนและสุภาพ
  items:
  - เรียน ผู้อำนวยการโรงเรียน
  - ชุมนุมรักษ์ภาษาไทยขออนุญาตใช้ห้องประชุมเล็ก
  - เพื่อซ้อมการแข่งขันอ่านทำนองเสนาะ
  - ในวันศุกร์ที่ 6 พฤศจิกายน เวลา 15.30–17.00 น.
  - จึงเรียนมาเพื่อโปรดพิจารณาอนุญาต
  hints:
  - เริ่มด้วยคำขึ้นต้นถึงผู้รับ
  - บอกเรื่องที่ขอ → เพื่ออะไร → เมื่อไร → คำลงท้าย
  solution: เรียน ผู้อำนวยการ → ขออนุญาตใช้ห้อง → เพื่อซ้อม → วันเวลา → จึงเรียนมาเพื่อโปรดพิจารณาอนุญาต
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.word-choice.p014
  topics:
  - thai.composition.word-choice
  difficulty: 5
  type: mcq
  stem: ข้อความแจ้งผู้ปกครองข้อใดดีที่สุด (ถูกต้อง ชัดเจน เหมาะสม ครบถ้วน)
  choices:
  - id: a
    text: โรงเรียนเลื่อนการประชุมผู้ปกครองจากวันเสาร์ที่ 7 เป็นวันเสาร์ที่ 14 พฤศจิกายน เวลา 9.00 น. ที่หอประชุม
    correct: true
    feedback: ถูก บอกเรื่อง วันเดิม วันใหม่ เวลา สถานที่ ครบ
  - id: b
    text: โรงเรียนยกเลิกการประชุมผู้ปกครองไปเป็นวันเสาร์ที่ 14 พฤศจิกายน
    feedback: ยกเลิก ใช้ผิด เพราะยังจัดอยู่ ต้องใช้ เลื่อน และไม่บอกเวลา สถานที่
  - id: c
    text: ประชุมผู้ปกครองเลื่อนนะคะ เดี๋ยวแจ้งอีกที
    feedback: คลุมเครือ ไม่บอกวันใหม่ และเป็นภาษาพูด
  - id: d
    text: โรงเรียนได้ทำการเลื่อนการประชุมผู้ปกครองออกไปก่อนในเร็ว ๆ นี้
    feedback: ฟุ่มเฟือย (ได้ทำการ) และไม่บอกวัน
  hints:
  - ใช้ เลื่อน หรือ ยกเลิก ให้ถูก
  - ผู้ปกครองต้องรู้วัน เวลา และสถานที่ใหม่
  solution: ข้อแรกใช้ **เลื่อน** ถูกความหมาย บอกวันเดิม วันใหม่ เวลา และสถานที่ครบ ใช้ภาษาสุภาพ ไม่มีคำฟุ่มเฟือย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.word-choice.p015
  topics:
  - thai.composition.word-choice
  difficulty: 5
  type: mcq
  stem: ข้อความ "ใครที่มีความประสงค์จะทำการสมัครเข้าร่วมกิจกรรมเยอะ ๆ ให้มาที่ห้องนั้นนะ" ควรแก้ตรงใดบ้าง (เลือกได้มากกว่า 1 ข้อ)
  multiple: true
  choices:
  - id: a
    text: ตัด ทำการ ออก
    correct: true
    feedback: ถูก ทำการ ไม่เพิ่มความหมาย
  - id: b
    text: บอกว่า ห้องนั้น คือห้องใด และวันเวลาที่รับสมัคร
    correct: true
    feedback: ถูก ห้องนั้น คลุมเครือ
  - id: c
    text: เปลี่ยน เยอะ ๆ และ นะ เป็นภาษาเขียนสุภาพ
    correct: true
    feedback: ถูก ประกาศควรใช้ภาษาสุภาพ
  - id: d
    text: เปลี่ยน ร่วม เป็น รวม
    feedback: ร่วม ถูกแล้ว เข้าร่วมกิจกรรมคือมีส่วนทำด้วยกัน
  hints:
  - ใช้รายการตรวจงานเขียน 5 ข้อ
  - ร่วม กับ รวม ความหมายต่างกันอย่างไร
  solution: 'แก้ 3 จุด: ตัด **ทำการ** · ระบุ **ห้องและวันเวลา** · เปลี่ยน **เยอะ ๆ / นะ** เป็นภาษาสุภาพ ส่วน ร่วม ใช้ถูกแล้ว'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.word-choice.p016
  topics:
  - thai.composition.word-choice
  difficulty: 5
  type: mcq
  stem: ประโยคใดใช้ถ้อยคำ **สละสลวย** และให้ภาพชัดที่สุด
  choices:
  - id: a
    text: สายฝนโปรยปรายลงบนใบบัว หยดน้ำกลิ้งไปมาเป็นประกายเหมือนเม็ดแก้ว
    correct: true
    feedback: ถูก เลือกคำให้เห็นภาพและใช้การเปรียบเทียบ
  - id: b
    text: ฝนตกโดนใบบัว
    feedback: ถูกต้องแต่ไม่ให้ภาพ
  - id: c
    text: ฝนตกลงมาโดนใบบัวแล้วน้ำก็ไหลลงมาแล้วก็ไหลไปมาแล้วก็สวยมาก
    feedback: ใช้ แล้ว ซ้ำ ยืดยาว และใช้ สวยมาก กว้าง ๆ
  - id: d
    text: มันเป็นการสวยงามที่ฝนได้ทำการตกลงบนใบบัว
    feedback: สำนวนต่างประเทศและคำฟุ่มเฟือย
  hints:
  - สละสลวย = กระชับ ไพเราะ เรียบเรียงดี
  - ข้อใดทำให้เห็นภาพโดยไม่ยืดยาว
  solution: ข้อแรกเลือกคำ **โปรยปราย กลิ้ง เป็นประกาย** และเปรียบหยดน้ำกับ **เม็ดแก้ว** จึงสละสลวยและให้ภาพชัด
  license: CC-BY-SA-4.0
  ai_assisted: true
