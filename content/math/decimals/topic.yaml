id: math.number.decimals
subject: math
title: { th: ทศนิยม, en: Decimals }
summary: เปรียบเทียบทศนิยม บวก ลบ คูณ หารทศนิยมได้ถูกตำแหน่งจุด แปลงเศษส่วนเป็นทศนิยม และรู้จักทศนิยมซ้ำ
difficulty: 2
minutes: 35
prerequisites: [math.number.place-value, math.number.fractions]
encompasses:
  - { id: math.number.place-value, weight: 0.4 }
  - { id: math.number.fractions, weight: 0.2 }
  - { id: math.number.integers, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: hundredths-grid.svg
    alt: "ตารางสี่เหลี่ยมจัตุรัส 10 คูณ 10 ช่อง ระบายสีเต็ม 3 แถบตั้งและอีก 7 ช่องในแถบที่สี่ รวม 37 ช่อง ข้างตารางเขียนว่า 3 แถบตั้งคือ 3 ส่วนสิบ บวก 7 ช่องเล็กคือ 7 ส่วนร้อย เท่ากับ 37/100 = 0.37"
    caption: "ทั้งตารางคือ 1 หน่วย แถบตั้งหนึ่งแถบคือ $0.1$ ช่องเล็กหนึ่งช่องคือ $0.01$"
  - { type: check, problem: math.dec.p013, prompt: "ลองอ่านตารางร้อยช่องอีกรูป" }
  - type: figure
    src: area-model-decimal.svg
    alt: "สี่เหลี่ยมจัตุรัสด้านละ 1 หน่วยแบ่งเป็น 100 ช่อง ระบายสามคอลัมน์ซ้ายแทน 0.3 และสองแถวล่างแทน 0.2 ส่วนที่ซ้อนกันเป็นสีม่วง 6 ช่อง แทน 6/100 = 0.06 จึงได้ 0.3 × 0.2 = 0.06"
    caption: "ผลคูณคือพื้นที่ส่วนที่ซ้อนกัน มีเพียง 6 ช่องจาก 100 ช่อง จึงเล็กกว่าตัวคูณทั้งสอง"
  - type: worked-example
    title: แปลงเศษส่วนเป็นทศนิยมด้วยการหาร
    problem: "เขียน $\\tfrac{3}{8}$ เป็นทศนิยม"
    steps:
      - text: "$\\tfrac{3}{8}$ หมายถึง $3 \\div 8$ เขียน 3 เป็น $3.000$ เพื่อให้หารต่อได้"
        why: "เติม 0 หลังจุดทศนิยมไม่ทำให้ค่าเปลี่ยน แต่ทำให้มีหลักให้หารต่อ"
      - text: "$30 \\div 8 = 3$ เศษ 6 → หลักส่วนสิบคือ 3"
      - text: "$60 \\div 8 = 7$ เศษ 4 → หลักส่วนร้อยคือ 7"
      - text: "$40 \\div 8 = 5$ เศษ 0 → หลักส่วนพันคือ 5 เศษเป็น 0 การหารจึงจบ"
      - text: "ตรวจกลับ: $0.375 = \\tfrac{375}{1000} = \\tfrac{3}{8}$ ✓"
        why: "$8 = 2^3$ มีแต่ตัวประกอบ 2 จึงเป็นทศนิยมรู้จบ"
    answer: "$\\tfrac{3}{8} = 0.375$"
  - type: worked-example
    title: ทศนิยมซ้ำที่เริ่มซ้ำไม่ตรงจุด
    problem: "เขียน $0.1\\dot{6} = 0.1666\\ldots$ เป็นเศษส่วนอย่างต่ำ"
    steps:
      - text: "ให้ $x = 0.1666\\ldots$"
      - text: "คูณ 10 ให้ส่วนที่ซ้ำเริ่มหลังจุดพอดี: $10x = 1.666\\ldots$"
        why: "เลข 1 ไม่ซ้ำ ต้องเลื่อนออกไปก่อน ส่วนที่อยู่หลังจุดจึงจะเหมือนกันทุกหลัก"
      - text: "คูณอีก 10: $100x = 16.666\\ldots$"
      - text: "ลบกัน: $100x - 10x = 16.666\\ldots - 1.666\\ldots = 15$ จึงได้ $90x = 15$"
        why: "ส่วนหลังจุดของสองจำนวนเหมือนกันทุกหลัก ลบกันแล้วหายหมด"
      - text: "$x = \\tfrac{15}{90} = \\tfrac{1}{6}$ ตรวจ: $1 \\div 6 = 0.1666\\ldots$ ✓"
    answer: "$0.1\\dot{6} = \\tfrac{1}{6}$"
  - { type: check, problem: math.dec.p016, prompt: "ลองใช้วิธีเดียวกันกับทศนิยมซ้ำที่ง่ายกว่า" }
  - type: interactive
    title: 0.45 กับ 0.5 อยู่ตรงไหนบนเส้นจำนวน
    caption: เส้นจำนวนนี้แบ่งช่วง 0.4 ถึง 0.6 สังเกตว่า 0.45 อยู่กึ่งกลางระหว่าง 0.4 กับ 0.5 ส่วน 0.405 อยู่ใกล้ 0.4 มาก ทศนิยมที่มีหลักมากกว่าจึงไม่จำเป็นต้องมีค่ามากกว่า
    widget:
      kind: number-line
      min: 0.4
      max: 0.6
      points:
        - { value: 0.405, label: "0.405" }
        - { value: 0.45, label: "0.45" }
        - { value: 0.5, label: "0.5" }
  - type: simulation
    title: คูณทศนิยมด้วยพื้นที่สี่เหลี่ยม (PhET Area Model Decimals)
    url: https://phet.colorado.edu/en/simulations/area-model-decimals
    provider: phet
    note: ลองตั้งด้านเป็น 0.3 กับ 0.2 แล้วดูว่าพื้นที่เป็นเพียงไม่กี่ช่องเล็กของตาราง 1 × 1 ผลคูณของทศนิยมที่น้อยกว่า 1 จึงเล็กกว่าตัวคูณทั้งสองตัว
glossary:
  - { term: ทศนิยม, definition: "จำนวนที่เขียนส่วนที่น้อยกว่า 1 ไว้หลังจุดทศนิยม เช่น 2.35 คือ 2 กับ 35 ส่วนร้อย" }
  - { term: ตำแหน่งทศนิยม, definition: "จำนวนหลักหลังจุดทศนิยม เช่น 4.075 มีทศนิยม 3 ตำแหน่ง" }
  - { term: ทศนิยมซ้ำ, definition: "ทศนิยมไม่รู้จบที่มีกลุ่มตัวเลขซ้ำกันไปเรื่อย ๆ เช่น $0.333\\ldots = 0.\\dot{3}$" }
flashcards:
  - { front: "บวกหรือลบทศนิยมต้องระวังอะไร", back: "ตั้งจุดทศนิยมให้ตรงกัน เติม 0 ให้หลักเท่ากัน แล้วบวกลบทีละหลัก" }
  - { front: "$0.3 \\times 0.2$ เท่ากับเท่าใด", back: "$3 \\times 2 = 6$ และมีทศนิยมรวม 2 ตำแหน่ง ได้ $0.06$" }
  - { front: "หารด้วยทศนิยม เช่น $7.2 \\div 0.3$ ทำอย่างไร", back: "คูณทั้งตัวตั้งและตัวหารด้วย 10 ให้ตัวหารเป็นจำนวนเต็ม ได้ $72 \\div 3 = 24$" }
  - { front: "เขียน $\\tfrac{1}{3}$ เป็นทศนิยม", back: "$0.333\\ldots$ เขียนเป็นทศนิยมซ้ำว่า $0.\\dot{3}$" }
