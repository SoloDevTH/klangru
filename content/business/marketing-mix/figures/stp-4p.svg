  <line x1="714.0" y1="160.0" x2="714.0" y2="188.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="629.0" y="190.0" width="170.0" height="96.0" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="714.0" y="224.2" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">การส่งเสริมการตลาด</text>
  <text x="714.0" y="242.2" text-anchor="middle" fill="#1f2937" font-size="12">Promotion</text>
  <text x="714.0" y="260.2" text-anchor="middle" fill="#1f2937" font-size="12">โฆษณา ลดราคา โซเชียล</text>
  <text x="400.0" y="320.0" text-anchor="middle" fill="#1f2937" font-size="13">ตัวอย่าง: น้ำพริกแม่ศรี (สมมติ) · เป้าหมาย คนทำงานในเมืองที่ไม่มีเวลาทำกับข้าว</text>
  <text x="400.0" y="342.0" text-anchor="middle" fill="#6b7280" font-size="12.5">ตำแหน่ง "น้ำพริกสูตรบ้าน สะอาด พกง่าย" → กระปุกเล็ก · 59 บาท · ร้านสะดวกซื้อและออนไลน์ · รีวิวในโซเชียล</text>
</svg>
