  - id: biology.genetics.chromosomes-dna.p013
    topics: [biology.genetics.chromosomes-dna]
    difficulty: 4
    type: numeric
    stem: "จีโนมของคนหนึ่งชุดยาวประมาณ 3.1 × 10⁹ คู่เบส ระยะระหว่างคู่เบสประมาณ 0.34 นาโนเมตร ถ้าดึง DNA ชุดนี้ให้ยืดเป็นเส้นตรงต่อกัน จะยาวประมาณกี่เมตร ตอบทศนิยม 2 ตำแหน่ง"
    answer: { value: 1.05, unit: m, tolerance: 0.02 }
    hints:
      - "ความยาว = จำนวนคู่เบส × ระยะต่อคู่เบส"
      - "1 นาโนเมตร = 10⁻⁹ เมตร"
    misconceptions:
      - { match: 2.11, feedback: "นี่คือความยาวของ DNA สองชุดในเซลล์ร่างกาย (2n) ข้อนี้ถามจีโนมหนึ่งชุด" }
      - { match: 0.53, feedback: "หารด้วย 2 เพราะคิดว่าคู่เบสหนึ่งคู่นับเป็นสองเบส แต่ระยะ 0.34 nm เป็นระยะต่อคู่เบสอยู่แล้ว" }
    solution: "$3.1 \\times 10^9 \\times 0.34 \\times 10^{-9}\\,\\mathrm{m} \\approx 1.05$ m เซลล์ร่างกายมีสองชุดจึงยาวราว 2 m แต่ขดอยู่ในนิวเคลียสที่กว้างเพียงไม่กี่ไมโครเมตร เพราะ DNA พันรอบฮิสโตนและขดซ้อนหลายชั้น"
