<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="sans-serif" font-size="14">
  <title>การเรียกฟังก์ชัน rect_area(3, 4) อาร์กิวเมนต์ 3 และ 4 ส่งเข้าพารามิเตอร์ width และ height ตัวฟังก์ชันคำนวณแล้ว return 12 กลับไปที่จุดเรียก</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="860" height="330" fill="#ffffff"/>
  <text x="20.0" y="30.0" font-size="14" text-anchor="start" fill="#6b7280" font-weight="bold" xml:space="preserve">จุดเรียก</text>
  <rect x="20.0" y="40.0" width="250.0" height="58.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="32.0" y="62.0" font-size="14" text-anchor="start" fill="#1f2937" font-family="monospace" xml:space="preserve">x = rect_area(3, 4)</text>
  <text x="32.0" y="83.0" font-size="14" text-anchor="start" fill="#1f2937" font-family="monospace" xml:space="preserve">print(x)   # 12</text>
  <rect x="330.0" y="20.0" width="510.0" height="240.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="345.0" y="46.0" font-size="14" text-anchor="start" fill="#6b7280" font-weight="bold" xml:space="preserve">ฟังก์ชัน</text>
  <rect x="345.0" y="56.0" width="480.0" height="79.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="357.0" y="78.0" font-size="14" text-anchor="start" fill="#1f2937" font-family="monospace" xml:space="preserve">def rect_area(width, height):</text>
  <text x="357.0" y="99.0" font-size="14" text-anchor="start" fill="#1f2937" font-family="monospace" xml:space="preserve">    area = width * height</text>
  <text x="357.0" y="120.0" font-size="14" text-anchor="start" fill="#1f2937" font-family="monospace" xml:space="preserve">    return area</text>
  <rect x="360.0" y="160.0" width="130.0" height="56.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="425.0" y="183.8" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">width = 3</text>
  <text x="425.0" y="207.2" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">พารามิเตอร์</text>
  <rect x="510.0" y="160.0" width="130.0" height="56.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="575.0" y="183.8" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">height = 4</text>
  <text x="575.0" y="207.2" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">พารามิเตอร์</text>
  <rect x="660.0" y="160.0" width="160.0" height="56.0" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="740.0" y="183.8" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">area = 12</text>
  <text x="740.0" y="207.2" font-size="12" text-anchor="middle" fill="#1f2937" xml:space="preserve">ตัวแปรเฉพาะที่</text>
  <path d="M150,100 C150,190 250,190 356,188" stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <text x="190.0" y="232.0" font-size="13" text-anchor="start" fill="#1f2937" xml:space="preserve">อาร์กิวเมนต์ 3, 4</text>
  <text x="190.0" y="250.0" font-size="12" text-anchor="start" fill="#6b7280" xml:space="preserve">จับคู่ตามลำดับ</text>
  <path d="M740,218 L740,276 L110,276 L110,104" stroke="#c2410c" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <text x="430.0" y="310.0" font-size="13" text-anchor="middle" fill="#c2410c" font-weight="bold" xml:space="preserve">return ส่งค่า 12 กลับไปแทนที่ rect_area(3, 4) ที่จุดเรียก</text>
</svg>
