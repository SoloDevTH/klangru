    misconceptions:
      - { match: 400, feedback: "เชือกไม่ได้อยู่ในแนวคลองทั้งหมด ต้องใช้เฉพาะองค์ประกอบตามคลอง $200\\cos 30^\\circ$ ของแต่ละเส้น" }
      - { match: 200, feedback: "ดูเหมือนใช้ $\\sin 30^\\circ$ ซึ่งเป็นองค์ประกอบขวางคลอง (ส่วนที่หักล้างกัน) มุมวัดจากแนวคลอง องค์ประกอบตามคลองจึงใช้ $\\cos$" }
    solution: "ตามคลอง: $2 \\times 200\\cos 30^\\circ = 400 \\times 0.866 \\approx 346.4\\ \\mathrm{N}$ ขวางคลอง: $200\\sin 30^\\circ - 200\\sin 30^\\circ = 0$ เรือจึงเคลื่อนไปตามกลางคลอง"
