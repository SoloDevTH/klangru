# หัวข้อที่เสนอให้เขียนใหม่ เพื่อครอบคลุมผลการเรียนรู้รายวิชาเพิ่มเติม ม.4–6 (ฉบับปรับปรุง พ.ศ. 2560)
# ฟิสิกส์ เคมี ชีววิทยา และโลก ดาราศาสตร์ และอวกาศ
#
# - indicators อ้างรหัสในรูป "<framework-id>:<รหัสผลการเรียนรู้>" ตาม curriculum/frameworks/th-core-2560-*-additional.yaml
#   รหัสผลการเรียนรู้เป็นรหัสที่คลังรู้ตั้งเอง (ดูหมายเหตุในไฟล์ framework) ข้อความผลการเรียนรู้คัดจากต้นฉบับ
# - รวมผลการเรียนรู้ที่ยังไม่มีหัวข้อสอน และผลการเรียนรู้ที่หัวข้อเดิมสอนได้เพียงบางส่วนเมื่อหัวข้อใหม่เติมส่วนที่ขาด
