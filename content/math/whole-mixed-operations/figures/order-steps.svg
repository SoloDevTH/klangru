<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="sans-serif" font-size="16">
  <title>ลำดับการคำนวณ 48 − (6 + 2) × 5</title>
  <rect x="0" y="0" width="600" height="300" fill="#ffffff"/>
  <rect x="30.0" y="20.0" width="200.0" height="44.0" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="130.0" y="50.0" font-size="19" text-anchor="middle" fill="#15211e" font-weight="bold">48 − (6 + 2) × 5</text>
  <text x="250.0" y="50.0" font-size="15" text-anchor="start" fill="#1d4ed8">1. ในวงเล็บก่อน: 6 + 2 = 8</text>
  <line x1="130.0" y1="66.0" x2="130.0" y2="84.0" stroke="#6b7a76" stroke-width="2" stroke-linecap="round"/>
  <polygon points="130.0,84.0 126.9,76.6 133.1,76.6" fill="#6b7a76" stroke="#6b7a76" stroke-width="1" stroke-linejoin="round"/>
  <rect x="30.0" y="86.0" width="200.0" height="44.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="130.0" y="116.0" font-size="19" text-anchor="middle" fill="#15211e" font-weight="bold">48 − 8 × 5</text>
  <text x="250.0" y="116.0" font-size="15" text-anchor="start" fill="#7c3aed">2. คูณหารจากซ้ายไปขวา: 8 × 5 = 40</text>
  <line x1="130.0" y1="132.0" x2="130.0" y2="150.0" stroke="#6b7a76" stroke-width="2" stroke-linecap="round"/>
  <polygon points="130.0,150.0 126.9,142.6 133.1,142.6" fill="#6b7a76" stroke="#6b7a76" stroke-width="1" stroke-linejoin="round"/>
  <rect x="30.0" y="152.0" width="200.0" height="44.0" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="130.0" y="182.0" font-size="19" text-anchor="middle" fill="#15211e" font-weight="bold">48 − 40</text>
  <text x="250.0" y="182.0" font-size="15" text-anchor="start" fill="#c2410c">3. บวกลบจากซ้ายไปขวา: 48 − 40 = 8</text>
  <line x1="130.0" y1="198.0" x2="130.0" y2="216.0" stroke="#6b7a76" stroke-width="2" stroke-linecap="round"/>
  <polygon points="130.0,216.0 126.9,208.6 133.1,208.6" fill="#6b7a76" stroke="#6b7a76" stroke-width="1" stroke-linejoin="round"/>
  <rect x="30.0" y="218.0" width="200.0" height="44.0" rx="8" fill="#ffffff" stroke="#0a6b60" stroke-width="2"/>
  <text x="130.0" y="248.0" font-size="19" text-anchor="middle" fill="#15211e" font-weight="bold">8</text>
  <text x="250.0" y="248.0" font-size="15" text-anchor="start" fill="#0a6b60">คำตอบ</text>
</svg>
