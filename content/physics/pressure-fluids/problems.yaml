      - { match: 20, feedback: "ลูกสูบใหญ่ไม่ได้เลื่อนเท่าลูกสูบเล็ก น้ำมันปริมาตรเท่ากันกระจายบนพื้นที่ที่ใหญ่กว่า 50 เท่า จึงยกได้สูงน้อยกว่า" }
    solution: "ปริมาตรน้ำมันที่ย้ายเท่ากัน: $A_1 d_1 = A_2 d_2$ จึงได้ $d_2 = d_1 \\dfrac{A_1}{A_2} = \\dfrac{20\\ \\mathrm{cm}}{50} = 0.4\\ \\mathrm{cm}$ ตรวจด้วยงาน: แรงเพิ่ม 50 เท่า ระยะลดลง 50 เท่า งานที่ช่างทำ ($F_1 d_1$) เท่ากับงานที่ลูกสูบใหญ่ทำ ($F_2 d_2$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.press.p021
    topics: [physics.matter.pressure-fluids]
    difficulty: 4
    type: numeric
    stem: "ภูเขาน้ำแข็ง (ความหนาแน่น $917\\ \\mathrm{kg/m^3}$) ลอยอยู่ในน้ำทะเล (ความหนาแน่น $1{,}025\\ \\mathrm{kg/m^3}$) ปริมาตรส่วนที่ **โผล่พ้นน้ำ** คิดเป็นร้อยละเท่าใดของปริมาตรทั้งหมด (ตอบเป็นตัวเลขในหน่วย % ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 10.5, tolerance: 0.1, unit: "%" }
    hints:
      - "วัตถุที่ลอยนิ่งมีแรงลอยตัวเท่ากับน้ำหนัก"
      - "สัดส่วนที่จม $= \\dfrac{\\rho_{\\text{วัตถุ}}}{\\rho_{\\text{ของเหลว}}}$ ส่วนที่โผล่คือ $1$ ลบสัดส่วนที่จม"
    misconceptions:
      - { match: 89.5, feedback: "นี่คือสัดส่วนที่ **จม** อยู่ใต้น้ำ โจทย์ถามส่วนที่โผล่พ้นน้ำ" }
      - { match: 8.3, feedback: "ดูเหมือนใช้ความหนาแน่นของน้ำจืด ($1{,}000$) แต่ภูเขาน้ำแข็งลอยในน้ำทะเลซึ่งหนาแน่นกว่า จึงโผล่พ้นน้ำมากกว่าเล็กน้อย" }
    solution: "ลอยนิ่ง: $\\rho_{\\text{น้ำทะเล}} V_{\\text{จม}} g = \\rho_{\\text{น้ำแข็ง}} V g$ จึงได้ $\\dfrac{V_{\\text{จม}}}{V} = \\dfrac{917}{1{,}025} \\approx 0.895$ ส่วนที่โผล่ $= 1 - 0.895 = 0.105$ หรือประมาณ $10.5\\%$ \"ยอดภูเขาน้ำแข็ง\" ที่เห็นจึงเป็นแค่ส่วนน้อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.press.p022
    topics: [physics.matter.pressure-fluids]
    difficulty: 4
    type: numeric
    stem: "แพไม้ไผ่สำหรับล่องแม่น้ำแควมีปริมาตรรวม $0.8\\ \\mathrm{m^3}$ ไม้ไผ่ทั้งแพมีความหนาแน่นเฉลี่ย $400\\ \\mathrm{kg/m^3}$ แพจะบรรทุกคนและสัมภาระได้มวลรวมมากที่สุดเท่าใด ก่อนที่ผิวบนของแพจะจมเสมอน้ำ ใช้ $\\rho$ ของน้ำ $= 1{,}000\\ \\mathrm{kg/m^3}$ (ตอบเป็นตัวเลขในหน่วย kg)"
    answer: { value: 480, tolerance: 1, unit: kg }
    hints:
      - "เมื่อแพจมเสมอน้ำพอดี แรงลอยตัวเท่ากับน้ำหนักของน้ำปริมาตร $0.8\\ \\mathrm{m^3}$ และต้องรับทั้งน้ำหนักแพและน้ำหนักของที่บรรทุก"
      - "มวลน้ำที่ถูกแทนที่ $= \\rho_{\\text{น้ำ}} V$ ลบด้วยมวลของแพเอง $= \\rho_{\\text{แพ}} V$ ($g$ ตัดกันได้)"
    misconceptions:
      - { match: 800, feedback: "นี่คือมวลของน้ำที่ถูกแทนที่ทั้งหมด แรงลอยตัวนี้ต้องพยุงตัวแพเองด้วย จึงต้องหักมวลของแพ $320\\ \\mathrm{kg}$ ออก" }
      - { match: 320, feedback: "นี่คือมวลของแพเอง ไม่ใช่มวลที่บรรทุกเพิ่มได้" }
    solution: "จมเสมอน้ำ: แรงลอยตัว $= \\rho_{\\text{น้ำ}} V g$ ต้องเท่ากับ $(m_{\\text{แพ}} + m_{\\text{บรรทุก}})g$ ได้ $m_{\\text{บรรทุก}} = \\rho_{\\text{น้ำ}} V - \\rho_{\\text{แพ}} V = (1{,}000 - 400)(0.8) = 480\\ \\mathrm{kg}$ ในการใช้งานจริงต้องบรรทุกน้อยกว่านี้มากเพื่อให้แพยังโผล่พ้นน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.press.p023
    topics: [physics.matter.pressure-fluids]
    difficulty: 5
    type: expression
    stem: "กล่องทรงสี่เหลี่ยมมุมฉากมีพื้นที่ผิวบนและผิวล่างเท่ากับ $A$ สูง $H$ จมอยู่ในของเหลวความหนาแน่น $\\rho$ โดยผิวบนอยู่ลึก $h$ จากผิวของเหลว ใช้ความดันเนื่องจากของเหลวที่ผิวบนและผิวล่าง หาแรงสุทธิที่ของเหลวดันกล่องขึ้น"
    prefix: "F_B ="
    answer: { latex: "\\rho g A H", variables: [rho, g, A, H, h] }
    hints:
      - "ผิวบนอยู่ลึก $h$ ผิวล่างอยู่ลึก $h + H$ แรงจากของเหลวบนแต่ละผิว $=$ ความดัน $\\times$ พื้นที่"
      - "แรงที่ผิวล่างดันขึ้น $\\rho g (h+H) A$ ลบด้วยแรงที่ผิวบนกดลง $\\rho g h A$ ส่วนแรงด้านข้างหักล้างกัน"
    misconceptions:
      - { match: "\\rho g A\\cdot(h+H)", feedback: "นี่คือแรงที่ผิวล่างอย่างเดียว ของเหลวยังกดผิวบนลงด้วยแรง $\\rho g h A$ ต้องหักออก" }
      - { match: "\\rho g h A", feedback: "นี่คือแรงที่ของเหลวกดผิวบน แรงลอยตัวคือผลต่างระหว่างแรงที่ผิวล่างกับผิวบน" }
    solution: "$F_B = \\rho g (h + H) A - \\rho g h A = \\rho g H A$ เนื่องจาก $HA$ คือปริมาตรของกล่อง $V$ จึงได้ $F_B = \\rho V g$ ตรงกับหลักของอาร์คิมีดีส และไม่ขึ้นกับความลึก $h$ เลย"
    license: CC-BY-SA-4.0
    ai_assisted: true
