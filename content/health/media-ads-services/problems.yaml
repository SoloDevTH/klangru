problems:
- id: health.consumer.media-ads-services.p001
  topics:
  - health.consumer.media-ads-services
  difficulty: 1
  type: mcq
  stem: แหล่งข้อมูลใดน่าเชื่อถือที่สุดเมื่อต้องการรู้วิธีป้องกันไข้เลือดออก
  choices:
  - id: a
    text: เว็บไซต์ของกรมควบคุมโรค
    correct: true
  - id: b
    text: ข้อความที่ส่งต่อในกลุ่มไลน์โดยไม่รู้ที่มา
    feedback: ข้อความที่ไม่รู้ว่าใครเขียนตรวจสอบไม่ได้
  - id: c
    text: คลิปขายยาจุดกันยุงของร้านค้าออนไลน์
    feedback: แหล่งที่มีเป้าหมายขายของอาจให้ข้อมูลที่เอียงเข้าหาสินค้า
  hints:
  - ดูว่าใครเป็นผู้ให้ข้อมูล
  - หน่วยงานสาธารณสุขมีหน้าที่ควบคุมโรค
  solution: กรมควบคุมโรคเป็นหน่วยงานสาธารณสุขที่รับผิดชอบเรื่องนี้โดยตรง ข้อมูลอ้างอิงหลักฐานและตรวจสอบได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.media-ads-services.p002
  topics:
  - health.consumer.media-ads-services
  difficulty: 1
  type: text
  stem: สายด่วนของสำนักงานคณะกรรมการอาหารและยา (อย.) สำหรับสอบถามหรือร้องเรียนผลิตภัณฑ์สุขภาพ คือหมายเลขใด (ตอบเป็นตัวเลข 4 หลัก)
  accepted:
  - '1556'
  misconceptions:
  - match: '1330'
    feedback: 1330 คือสายด่วน สปสช. เรื่องสิทธิการรักษา
  - match: '1669'
    feedback: 1669 คือการแพทย์ฉุกเฉิน
  hints:
  - ขึ้นต้นด้วย 15
  - ลงท้ายด้วย 56
  solution: สายด่วน อย. คือ 1556 ใช้ร้องเรียนโฆษณาเกินจริงและผลิตภัณฑ์ที่น่าสงสัย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.media-ads-services.p003
  topics:
  - health.consumer.media-ads-services
  difficulty: 2
  type: order
  stem: เรียงขั้นตอนตรวจข้อมูลสุขภาพที่ได้รับมาในโซเชียลมีเดีย ก่อนตัดสินใจเชื่อหรือส่งต่อ
  items:
  - ดูว่าใครเป็นผู้เขียนหรือเผยแพร่
  - ดูหลักฐานที่อ้างและวันที่เผยแพร่
  - ดูว่ามีเป้าหมายขายของหรือไม่
  - เทียบกับแหล่งที่น่าเชื่อถืออย่างน้อย 2 แหล่ง
  - ตัดสินใจ และไม่ส่งต่อถ้ายังไม่แน่ใจ
  hints:
  - เริ่มจากที่มาของข้อมูล
  - ขั้นสุดท้ายคือการตัดสินใจ
  solution: ที่มา → หลักฐานและวันที่ → เป้าหมาย → เทียบแหล่งอื่น → ตัดสินใจและไม่ส่งต่อถ้าไม่แน่ใจ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.media-ads-services.p004
  topics:
  - health.consumer.media-ads-services
  difficulty: 2
  type: mcq
  stem: ข้อความโฆษณาใดน่าสงสัยว่าเกินจริงมากที่สุด
  choices:
  - id: a
    text: "\"ลด 10 กิโลใน 7 วัน ไม่ต้องคุมอาหาร\""
    correct: true
  - id: b
    text: "\"มีวิตามินซี 30 มิลลิกรัมต่อขวด\""
    feedback: เป็นข้อมูลปริมาณสารอาหารที่ตรวจสอบได้
  - id: c
    text: "\"ควรรับประทานอาหารหลากหลายและออกกำลังกายสม่ำเสมอ\""
    feedback: เป็นคำแนะนำทั่วไปที่ตรงตามหลักสุขภาพ
  hints:
  - สัญญาผลเร็วและไม่ต้องพยายามเป็นสัญญาณเตือน
  - การลดน้ำหนักที่ปลอดภัยต้องใช้เวลา
  solution: การสัญญาว่าลดน้ำหนักมากในเวลาสั้นโดยไม่ต้องทำอะไรเป็นสัญญาณของโฆษณาเกินจริง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.media-ads-services.p005
  topics:
  - health.consumer.media-ads-services
  difficulty: 2
  type: match
  stem: จับคู่สถานการณ์กับบริการสุขภาพที่เหมาะสม
  pairs:
  - left: เจ็บคอเล็กน้อย อยากได้คำแนะนำเรื่องยา
    right: เภสัชกรที่ร้านยาที่มีใบอนุญาต
  - left: คุณตาล้มหมดสติไม่ตอบสนอง
    right: โทร 1669
  - left: อยากรู้ว่าตัวเองมีสิทธิบัตรทองที่โรงพยาบาลใด
    right: สายด่วน สปสช. 1330
  - left: ไข้สูง 3 วันไม่ลด
    right: โรงพยาบาลตามสิทธิ
  hints:
  - ดูความรุนแรงของอาการ
  - สิทธิการรักษาสอบถามได้ทางโทรศัพท์
  solution: อาการเล็กน้อยปรึกษาเภสัชกร เหตุฉุกเฉินโทร 1669 สอบถามสิทธิโทร 1330 และไข้สูงหลายวันต้องให้แพทย์ตรวจที่โรงพยาบาลตามสิทธิ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.media-ads-services.p006
  topics:
  - health.consumer.media-ads-services
  difficulty: 2
  type: numeric
  stem: นมแพ็ก 6 กล่องราคา 60 บาท ส่วนนมแบบเดียวกันซื้อทีละกล่องราคากล่องละ 12 บาท ซื้อแบบแพ็กประหยัดกว่ากล่องละกี่บาท (ตอบเป็นบาท)
  answer:
    value: 2
    unit: บาท
  misconceptions:
  - match: 10
    feedback: 10 บาทคือราคาต่อกล่องของแบบแพ็ก ต้องเทียบกับ 12 บาท
  - match: 12
    feedback: 12 บาทคือส่วนต่างทั้งแพ็ก (6 กล่อง) โจทย์ถามต่อกล่อง
  hints:
  - "หาราคาต่อกล่องของแบบแพ็ก: 60 ÷ 6"
  - นำราคาต่อกล่องสองแบบมาลบกัน
  solution: แบบแพ็กกล่องละ 60 ÷ 6 = 10 บาท ประหยัดกว่า 12 − 10 = 2 บาทต่อกล่อง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.media-ads-services.p007
  topics:
  - health.consumer.media-ads-services
  difficulty: 3
  type: mcq
  stem: จากโฆษณาสมมติ ข้อความใดเป็นการโฆษณาเกินจริง (เลือกทุกข้อที่ถูก)
  figure: &id001
    src: ad-quiz.svg
    alt: โฆษณาสมมติ นมซูเปอร์คิดส์ นมรสช็อกโกแลต ชื่อสมมติ มีข้อความ 6 ข้อ ก. ดื่มวันละกล่อง สูงขึ้น 10 ซม. ในเดือนเดียว ข. มีแคลเซียม 25% ของปริมาณที่แนะนำต่อวัน ค. ดื่มแล้วเรียนเก่งกว่าเพื่อนทั้งห้อง ง. ปริมาณ 180 มิลลิลิตร จ. แพทย์ทุกคนแนะนำ ฉ. น้ำตาล 12 กรัมต่อกล่อง
  multiple: true
  choices:
  - id: a
    text: ก. ดื่มวันละกล่อง สูงขึ้น 10 ซม. ในเดือนเดียว
    correct: true
  - id: b
    text: ค. ดื่มแล้วเรียนเก่งกว่าเพื่อนทั้งห้อง
    correct: true
  - id: c
    text: จ. แพทย์ทุกคนแนะนำ
    correct: true
  - id: d
    text: ข. มีแคลเซียม 25% ของปริมาณที่แนะนำต่อวัน
    feedback: เป็นข้อมูลโภชนาการที่ตรวจสอบกับฉลากได้
  - id: e
    text: ฉ. น้ำตาล 12 กรัมต่อกล่อง
    feedback: เป็นข้อมูลบนฉลากที่ช่วยให้ตัดสินใจ ไม่ใช่คำอวดอ้าง
  hints:
  - ข้อความเกินจริงสัญญาผลที่ไม่มีหลักฐานหรือเหมารวม
  - ข้อมูลปริมาณบนฉลากตรวจสอบได้
  solution: การสัญญาว่าสูงขึ้นมากในเวลาสั้น ทำให้เรียนเก่ง และอ้างว่าแพทย์ทุกคนแนะนำ เป็นข้อความเกินจริง ส่วนปริมาณแคลเซียม ปริมาตร และน้ำตาลเป็นข้อมูลที่ตรวจสอบได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.media-ads-services.p008
  topics:
  - health.consumer.media-ads-services
  difficulty: 3
  type: numeric
  stem: จากโฆษณาสมมติ ถ้าดื่มนมนี้วันละ 2 กล่อง 5 วัน จะได้น้ำตาลจากนมนี้รวมกี่กรัม (ตอบเป็นกรัม)
  figure: *id001
  answer:
    value: 120
    unit: กรัม
  misconceptions:
  - match: 24
    feedback: 24 กรัมคือ 1 วัน ต้องคูณ 5 วัน
  - match: 60
    feedback: 60 กรัมคือดื่มวันละกล่องเดียว โจทย์บอกวันละ 2 กล่อง
  hints:
  - "หาน้ำตาลต่อวันก่อน: 12 × 2"
  - แล้วคูณจำนวนวัน
  solution: วันละ 12 × 2 = 24 กรัม 5 วัน = 24 × 5 = 120 กรัม การอ่านฉลากช่วยให้รู้ว่าได้น้ำตาลจากเครื่องดื่มมากเพียงใด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.media-ads-services.p009
  topics:
  - health.consumer.media-ads-services
  difficulty: 3
  type: mcq
  stem: เพราะเหตุใดโฆษณาว่า "ผลิตภัณฑ์เสริมอาหารนี้รักษาเบาหวานได้" จึงไม่ควรเชื่อ
  choices:
  - id: a
    text: อย. ห้ามโฆษณาอาหารว่าบำบัด บรรเทา รักษา หรือป้องกันโรค ผลิตภัณฑ์เสริมอาหารไม่ใช่ยา
    correct: true
  - id: b
    text: เพราะเบาหวานรักษาไม่ได้ทุกกรณี
    feedback: ประเด็นสำคัญคือผลิตภัณฑ์เสริมอาหารไม่ใช่ยาและห้ามโฆษณาว่ารักษาโรค
  - id: c
    text: เพราะราคาแพง
    feedback: ราคาไม่ใช่เหตุผลหลัก แม้ราคาถูกก็ไม่ควรเชื่อคำอ้างนี้
  hints:
  - ผลิตภัณฑ์เสริมอาหารจัดเป็นอาหารตามกฎหมาย
  - กฎหมายห้ามอาหารอวดอ้างสรรพคุณทางยา
  solution: ผลิตภัณฑ์เสริมอาหารเป็นอาหาร อย. ห้ามโฆษณาว่ารักษาหรือป้องกันโรค คนที่เป็นเบาหวานต้องรักษากับแพทย์ ถ้าพบโฆษณาแบบนี้ร้องเรียนได้ที่ 1556
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.media-ads-services.p010
  topics:
  - health.consumer.media-ads-services
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นอิทธิพลของสื่อต่อพฤติกรรมสุขภาพที่พบได้จริง
  choices:
  - id: a
    text: เด็กที่ดูโฆษณาขนมบ่อยอยากกินขนมที่เห็นในโฆษณามากขึ้น
    correct: true
  - id: b
    text: สื่อไม่มีผลต่อการตัดสินใจของคน
    feedback: บริษัทลงทุนโฆษณาเพราะสื่อมีผลต่อการตัดสินใจซื้อ
  - id: c
    text: ทุกคลิปในโซเชียลมีเดียผ่านการตรวจความถูกต้องแล้ว
    feedback: คลิปส่วนใหญ่ไม่ได้ผ่านการตรวจ ใครก็โพสต์ได้
  hints:
  - ทำไมบริษัทจึงจ่ายเงินโฆษณา
  - ตัวการ์ตูนและของแถมดึงดูดเด็ก
  solution: โฆษณาออกแบบมาให้คนอยากซื้อ โฆษณาอาหารที่ใช้ตัวการ์ตูนและของแถมทำให้เด็กอยากกินขนมและน้ำหวานมากขึ้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.media-ads-services.p011
  topics:
  - health.consumer.media-ads-services
  difficulty: 4
  type: mcq
  stem: นักเรียนเห็นคลิปต่อสู้กันระหว่างนักเรียนต่างโรงเรียนถูกแชร์จำนวนมากพร้อมคำยั่วยุ ข้อใดวิเคราะห์อิทธิพลของสื่อต่อความรุนแรงได้เหมาะสมที่สุด
  choices:
  - id: a
    text: การแชร์และคำยั่วยุทำให้ความรุนแรงดูเป็นเรื่องปกติหรือน่ายกย่อง และอาจทำให้เกิดการแก้แค้นต่อ จึงควรหยุดแชร์ รายงานคลิป และแจ้งครู
    correct: true
  - id: b
    text: การแชร์คลิปช่วยลดความรุนแรงเพราะทุกคนจะเห็น
    feedback: การแชร์พร้อมคำยั่วยุทำให้เรื่องลุกลาม ควรรายงานต่อแพลตฟอร์มและแจ้งผู้ใหญ่แทน
  - id: c
    text: คลิปในโซเชียลมีเดียไม่มีผลต่อพฤติกรรมจริง
    feedback: การยั่วยุออนไลน์มักนำไปสู่การนัดทะเลาะวิวาทจริง
  hints:
  - คิดว่าคนที่ดูคลิปจะรู้สึกและทำอะไรต่อ
  - การหยุดแชร์ช่วยตัดวงจร
  solution: สื่อที่นำเสนอความรุนแรงพร้อมคำยั่วยุทำให้ความรุนแรงดูปกติ กระตุ้นการเลียนแบบและแก้แค้น วิธีช่วยคือไม่แชร์ รายงาน และแจ้งผู้ใหญ่
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.media-ads-services.p012
  topics:
  - health.consumer.media-ads-services
  difficulty: 4
  type: mcq
  stem: แม่ได้รับข้อความในไลน์ว่า "ดื่มน้ำมะนาวผสมโซดาทุกเช้า รักษามะเร็งได้" ข้อใดเป็นการตอบสนองที่มีเหตุผลที่สุด
  choices:
  - id: a
    text: ไม่ส่งต่อ ตรวจกับศูนย์ต่อต้านข่าวปลอมหรือเว็บไซต์ของหน่วยงานสาธารณสุข และถ้ามีคนป่วยให้รักษาตามแพทย์
    correct: true
  - id: b
    text: ส่งต่อทันทีเพราะเผื่อช่วยคนอื่นได้
    feedback: ข้อมูลผิดอาจทำให้ผู้ป่วยหยุดการรักษาที่ได้ผล ควรตรวจก่อน
  - id: c
    text: ให้ญาติที่ป่วยหยุดยาแล้วดื่มน้ำมะนาวแทน
    feedback: อันตรายมาก การรักษามะเร็งต้องเป็นไปตามแพทย์
  hints:
  - คำว่า "รักษามะเร็งได้" จากเครื่องดื่มเป็นสัญญาณเตือน
  - ข้อมูลผิดทางสุขภาพทำร้ายคนได้จริง
  solution: คำอ้างว่าเครื่องดื่มรักษามะเร็งเป็นสัญญาณของข่าวปลอม ควรตรวจกับแหล่งที่เชื่อถือได้และไม่ส่งต่อ ผู้ป่วยต้องรักษาตามแพทย์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.consumer.media-ads-services.p013
