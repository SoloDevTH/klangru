- id: chinese.grammar.ba-sentences.p011
  topics:
  - chinese.grammar.ba-sentences
  difficulty: 4
  type: mcq
  stem: ประโยค 把 ข้อใด **ถูกต้อง**
  choices:
  - id: a
    text: 我把这个字写错了。
    correct: true
    feedback: ถูก 写错 เป็นการกระทำที่มีผลต่อตัวอักษร
  - id: b
    text: 我把他看见了。
    feedback: 看见 เป็นการรับรู้ ไม่ได้จัดการกรรม ใช้ 我看见他了
  - id: c
    text: 我把这件事知道了。
    feedback: 知道 เป็นการรู้ ไม่ใช่การจัดการ ใช้ 我知道这件事了
  - id: d
    text: 我把北京去了。
    feedback: 去 + สถานที่ ไม่ใช้ 把 ใช้ 我去北京了
  hints:
  - กริยาในประโยค 把 ต้องทำให้กรรมเปลี่ยนไป
  - 看见 知道 去 ไม่ได้ทำอะไรกับกรรม
  solution: '**我把这个字写错了。** ข้ออื่นใช้กริยาที่ไม่ได้จัดการกรรม'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.ba-sentences.p012
  topics:
  - chinese.grammar.ba-sentences
  difficulty: 4
  type: mcq
  stem: '"ฉันอ่านหนังสือเล่มนั้นจบแล้ว" เขียนเป็นประโยค 把 ข้อใดถูกต้อง'
  choices:
  - id: a
    text: 我把那本书看得完。
    feedback: ประโยค 把 ใช้กับส่วนเติมเต็มความเป็นไปได้ไม่ได้
  - id: b
    text: 我把那本书看完了。
    correct: true
    feedback: ถูก กรรมเป็นสิ่งที่รู้กัน (那本书) และมีผล 看完
  - id: c
    text: 我把一本书看完了。
    feedback: 把 มักใช้กับกรรมที่รู้กันแล้ว 一本书 (หนังสือเล่มหนึ่ง) ฟังแปลก
  - id: d
    text: 我把那本书看。
    feedback: กริยาเปล่า ต้องมี 完了
  hints:
  - กรรมของ 把 ต้องระบุชัด เช่น 这/那 + ลักษณนาม
  - ต้องมีผลหลังกริยา
  solution: '**我把那本书看完了。** Wǒ bǎ nà běn shū kànwán le.'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: chinese.grammar.ba-sentences.p013
  topics:
  - chinese.grammar.ba-sentences
