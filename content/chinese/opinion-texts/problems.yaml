  - 总之 อยู่ท้ายสุดเพราะเป็นข้อสรุป
  solution: ความคิดหลัก → ปัญหาที่พบบ่อย → ทางเลือกที่ดีกว่า → ยอมรับความสำคัญของคำศัพท์ → ข้อสรุป
