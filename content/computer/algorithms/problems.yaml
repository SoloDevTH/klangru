    misconceptions:
      - { match: 10, feedback: "10 คือค่า a หลังบรรทัดที่สาม ยังมีบรรทัด `a = a - b` ที่เปลี่ยน a อีกครั้ง" }
      - { match: 3, feedback: "ดูเหมือนใช้ค่าเดิมของ b (7) ในบรรทัดสุดท้าย แต่ b เปลี่ยนเป็น 3 ไปแล้วในบรรทัดที่สี่" }
    solution: "a = 3, b = 7 → a = 10 → b = 10 − 7 = 3 → a = 10 − 3 = 7 แสดง 7 (อัลกอริทึมนี้สลับค่า a กับ b)"
