    stem: "ห้องปฏิบัติการเพาะเลี้ยงเนื้อเยื่อกล้วยไม้เริ่มด้วยต้นอ่อน 8 ต้น จำนวนต้นเพิ่มเป็น 4 เท่าทุกเดือน หลังจาก $n$ เดือนจะมี $8 \\cdot 4^n$ ต้น ถ้าต้องการต้นอ่อน $2^{15}$ ต้น ต้องเพาะเลี้ยงกี่เดือน"
    answer: { value: 6, unit: เดือน }
    hints:
      - "เขียน 8 และ 4 เป็นเลขยกกำลังฐาน 2: $8 = 2^3$ และ $4 = 2^2$"
      - "$8 \\cdot 4^n = 2^3 \\cdot 2^{2n} = 2^{3 + 2n}$ แล้วให้เลขชี้กำลังเท่ากับ 15"
    misconceptions:
      - { match: 12, feedback: "ดูเหมือนเขียน $4^n$ เป็น $2^{n}$ (ได้ $3 + n = 15$) ลืมว่า $4^n = (2^2)^n = 2^{2n}$ ต้องคูณเลขชี้กำลัง" }
      - { match: 7.5, feedback: "ลืมต้นอ่อน 8 ต้นตอนเริ่ม ($2^3$) ที่ถูกคือ $3 + 2n = 15$" }
    solution: "$8 \\cdot 4^n = 2^3 \\cdot 2^{2n} = 2^{3 + 2n}$ ให้ $3 + 2n = 15$ ได้ $n = 6$ เดือน ตรวจ: $8 \\times 4^6 = 8 \\times 4096 = 32{,}768 = 2^{15}$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

