  <text x="100" y="76" text-anchor="middle" fill="#2b5f9e" font-size="18" font-weight="bold">2<tspan dy="-9" font-size="13">4</tspan></text>
  <text x="230" y="76" text-anchor="middle" fill="#15211e" font-size="18" font-weight="bold">16</text>
  <path d="M 310 71.0 C 350 73.0 350 103.0 310 105.0" fill="none" stroke="#b4521f" stroke-width="2"/>
