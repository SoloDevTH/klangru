  - { framework: th-tqf-accounting, indicators: ["8.1.3"], coverage: partial, note: "การวิเคราะห์ฐานะการเงินด้วยอัตราส่วนสี่กลุ่ม ดูปองท์ การวิเคราะห์แนวโน้มตามแนวนอนและแนวดิ่ง การเทียบค่าเฉลี่ยอุตสาหกรรม กระแสเงินสดจากการดำเนินงานแบบทางอ้อม เงินทุนหมุนเวียน และวงจรเงินสด ยังไม่มีแหล่งเงินทุนและตลาดการเงิน ต้นทุนเงินทุน งบประมาณการลงทุน การประเมินมูลค่ากิจการ และการวางแผนการเงินระยะยาว (อยู่ใน business.finance.sources-of-funds และ business.finance.capital-budgeting ตามแผน)" }
