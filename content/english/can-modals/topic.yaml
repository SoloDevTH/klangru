id: english.grammar.can-modals
subject: english
title: { th: "can, must, should และการขออนุญาต", en: "Can, must, should and asking for permission" }
summary: ใช้ can บอกความสามารถและขออนุญาต ใช้ Could you และ May I อย่างสุภาพ ให้คำแนะนำด้วย should บอกกฎด้วย must และ mustn't และแยก mustn't กับ don't have to
difficulty: 2.5
minutes: 35
prerequisites: [english.grammar.present-simple]
encompasses:
  - { id: english.grammar.present-simple, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: modal-strength.svg
    alt: "แถบสีจากจางทางซ้าย (เบา) ไปแดงทางขวา (หนัก) ด้านล่างมีกล่องสามกล่อง: can ทำได้/อนุญาต (You can use my pen.), should ควร คำแนะนำ (You should drink water.), must ต้อง กฎ จำเป็น (You must wear a helmet.) แถวปฏิเสธ: don't have to ไม่จำเป็นต้อง เลือกได้ (You don't have to come.), shouldn't ไม่ควร (You shouldn't eat too much.), mustn't / can't ห้าม (You mustn't smoke here.)"
    caption: "can → should → must หนักแน่นขึ้นเรื่อย ๆ และระวัง mustn't (ห้าม) ไม่เท่ากับ don't have to (ไม่จำเป็น)"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.grammar.can-modals.p001, prompt: "หลัง can ใช้กริยารูปไหน" }
  - type: worked-example
    title: ขออนุญาตและขอร้องให้เหมาะกับคน
    problem: "นักเรียนมาสายและต้องเข้าห้องเรียน ขออนุญาตครูอย่างสุภาพ แล้วขอร้องเพื่อนข้าง ๆ ให้บอกหน้าหนังสือ"
    steps:
      - text: "พูดกับครู ใช้ May I ...? ซึ่งสุภาพที่สุด: *Sorry I'm late. May I come in?*"
        why: "May I ใช้ขออนุญาตผู้ใหญ่หรือในสถานการณ์ทางการ"
      - text: "หลัง May I ใช้กริยารูปเดิม come"
      - text: "พูดกับเพื่อน ใช้ Can you ...? ได้ เพราะเป็นกันเอง และเติม please"
      - text: "สิ่งที่ขอคือ บอกหน้าหนังสือ = tell me the page: *Can you tell me the page, please?*"
    answer: "ครู: *Sorry I'm late. May I come in?* · เพื่อน: *Can you tell me the page, please?*"
  - { type: check, problem: english.grammar.can-modals.p011, prompt: "ห้าม หรือ ไม่จำเป็น" }
  - type: worked-example
    title: อธิบายกฎการแต่งกายเข้าวัด
    problem: "นักท่องเที่ยวถามว่าเข้าวัดพระแก้วต้องแต่งตัวอย่างไร อธิบายจากข้อมูล: ต้องแต่งกายสุภาพปิดไหล่และเข่า ห้ามใส่กางเกงขาสั้น ควรถอดรองเท้าก่อนเข้าพระอุโบสถ"
    steps:
      - text: "ข้อบังคับใช้ must: *You must wear clothes that cover your shoulders and knees.*"
      - text: "ข้อห้ามใช้ mustn't: *You mustn't wear shorts.*"
      - text: "ถอดรองเท้าเป็นมารยาทที่ทุกคนต้องทำในพระอุโบสถ ใช้ must ได้ แต่ถ้าพูดเป็นคำแนะนำทั่วไปใช้ should: *You should take off your shoes before you go into the chapel.*"
        why: "should นุ่มนวลกว่า must ใช้เมื่อให้คำแนะนำ"
      - text: "ปิดท้ายด้วยเหตุผล: *because it is a holy place.*"
    answer: "*You must wear clothes that cover your shoulders and knees. You mustn't wear shorts. You should take off your shoes before you go into the chapel because it is a holy place.*"
glossary:
  - { term: modal verb, definition: "กริยาช่วยอย่าง can, could, may, should, must วางหน้ากริยารูปเดิม ไม่เติม s และไม่ใช้ do" }
  - { term: can / can't, definition: "บอกความสามารถ ขออนุญาต หรือขอร้องแบบเป็นกันเอง" }
  - { term: should / shouldn't, definition: "ควร / ไม่ควร ใช้ให้คำแนะนำ" }
  - { term: must / mustn't, definition: "ต้อง / ห้าม ใช้กับกฎและสิ่งจำเป็น" }
  - { term: don't have to, definition: "ไม่จำเป็นต้อง (ทำก็ได้ไม่ทำก็ได้) ต่างจาก mustn't ที่แปลว่าห้าม" }
flashcards:
  - { front: "She can ___ (swim).", back: "She can swim. (หลัง can ใช้กริยารูปเดิม ไม่มี to ไม่เติม s)" }
  - { front: "ขออนุญาตครูเข้าห้องอย่างสุภาพ", back: "May I come in?" }
  - { front: "mustn't กับ don't have to ต่างกันอย่างไร", back: "mustn't = ห้าม · don't have to = ไม่จำเป็น ทำหรือไม่ทำก็ได้" }
  - { front: "เพื่อนเป็นไข้ ให้คำแนะนำ", back: "You should see a doctor. / You shouldn't go to school today." }
  - { front: "Do you can swim? แก้ให้ถูก", back: "Can you swim? (modal สร้างคำถามเอง ไม่ใช้ do)" }
