<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
<title>แผนผังความสัมพันธ์ของโมลกับมวล จำนวนอนุภาค และปริมาตรแก๊สที่ STP</title>
<rect x="0" y="0" width="820" height="470" fill="#ffffff"/>
<rect x="335.0" y="207.0" width="150.0" height="76.0" rx="14" fill="#fff3c4" stroke="#1d3557" stroke-width="2.5" />
<text x="410.0" y="241.0" font-size="21" text-anchor="middle" fill="#222" font-weight="bold" font-family="sans-serif" >โมล</text>
<text x="410.0" y="267.0" font-size="15" text-anchor="middle" fill="#333" font-weight="normal" font-family="sans-serif" >mol</text>
<rect x="35.0" y="207.0" width="190.0" height="76.0" rx="14" fill="#d7ecff" stroke="#1d3557" stroke-width="2.5" />
<text x="130.0" y="241.0" font-size="21" text-anchor="middle" fill="#222" font-weight="bold" font-family="sans-serif" >มวล</text>
<text x="130.0" y="267.0" font-size="15" text-anchor="middle" fill="#333" font-weight="normal" font-family="sans-serif" >g</text>
<rect x="590.0" y="207.0" width="200.0" height="76.0" rx="14" fill="#dff5d8" stroke="#1d3557" stroke-width="2.5" />
<text x="690.0" y="241.0" font-size="21" text-anchor="middle" fill="#222" font-weight="bold" font-family="sans-serif" >จำนวนอนุภาค</text>
<text x="690.0" y="267.0" font-size="15" text-anchor="middle" fill="#333" font-weight="normal" font-family="sans-serif" >อะตอม โมเลกุล ไอออน</text>
<rect x="285.0" y="380.0" width="250.0" height="70.0" rx="14" fill="#f3dcf5" stroke="#1d3557" stroke-width="2.5" />
<text x="410.0" y="411.0" font-size="21" text-anchor="middle" fill="#222" font-weight="bold" font-family="sans-serif" >ปริมาตรแก๊สที่ STP</text>
<text x="410.0" y="437.0" font-size="15" text-anchor="middle" fill="#333" font-weight="normal" font-family="sans-serif" >dm³ (0 °C, 1 atm)</text>
<line x1="228.0" y1="231.0" x2="323.4" y2="231.0" stroke="#c0392b" stroke-width="2.5" />
<polygon points="333.0,231.0 321.9,235.7 321.9,226.3" fill="#c0392b" stroke="#c0392b" stroke-width="1" />
<line x1="333.0" y1="259.0" x2="237.6" y2="259.0" stroke="#2b6a9a" stroke-width="2.5" />
<polygon points="228.0,259.0 239.1,254.3 239.1,263.7" fill="#2b6a9a" stroke="#2b6a9a" stroke-width="1" />
<text x="280.5" y="221.0" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold" font-family="sans-serif" >÷ มวลต่อโมล</text>
<text x="280.5" y="283.0" font-size="15" text-anchor="middle" fill="#2b6a9a" font-weight="bold" font-family="sans-serif" >× มวลต่อโมล</text>
<line x1="487.0" y1="231.0" x2="578.4" y2="231.0" stroke="#c0392b" stroke-width="2.5" />
<polygon points="588.0,231.0 576.9,235.7 576.9,226.3" fill="#c0392b" stroke="#c0392b" stroke-width="1" />
<line x1="588.0" y1="259.0" x2="496.6" y2="259.0" stroke="#2b6a9a" stroke-width="2.5" />
<polygon points="487.0,259.0 498.1,254.3 498.1,263.7" fill="#2b6a9a" stroke="#2b6a9a" stroke-width="1" />
<text x="537.5" y="221.0" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold" font-family="sans-serif" >× 6.02×10²³</text>
<text x="537.5" y="283.0" font-size="15" text-anchor="middle" fill="#2b6a9a" font-weight="bold" font-family="sans-serif" >÷ 6.02×10²³</text>
<line x1="392.0" y1="285.0" x2="392.0" y2="368.4" stroke="#c0392b" stroke-width="2.5" />
<polygon points="392.0,378.0 387.3,366.9 396.7,366.9" fill="#c0392b" stroke="#c0392b" stroke-width="1" />
<line x1="428.0" y1="378.0" x2="428.0" y2="294.6" stroke="#2b6a9a" stroke-width="2.5" />
<polygon points="428.0,285.0 432.7,296.1 423.3,296.1" fill="#2b6a9a" stroke="#2b6a9a" stroke-width="1" />
<text x="380.0" y="336.0" font-size="15" text-anchor="end" fill="#c0392b" font-weight="bold" font-family="sans-serif" >× 22.4</text>
<text x="440.0" y="336.0" font-size="15" text-anchor="start" fill="#2b6a9a" font-weight="bold" font-family="sans-serif" >÷ 22.4</text>
<text x="410.0" y="40.0" font-size="20" text-anchor="middle" fill="#222" font-weight="bold" font-family="sans-serif" >ทุกทางต้องผ่าน "โมล" ตรงกลาง</text>
<text x="410.0" y="70.0" font-size="16" text-anchor="middle" fill="#333" font-weight="normal" font-family="sans-serif" >มวลต่อโมล (g/mol) = ผลรวมมวลอะตอมในสูตร เช่น H₂O = 18.02 g/mol</text>
<text x="130.0" y="330.0" font-size="14" text-anchor="middle" fill="#555" font-weight="normal" font-family="sans-serif" >ตัวอย่าง: น้ำ 36.04 g</text>
<text x="410.0" y="192.0" font-size="14" text-anchor="middle" fill="#555" font-weight="normal" font-family="sans-serif" >= 2.000 mol</text>
<text x="690.0" y="330.0" font-size="14" text-anchor="middle" fill="#555" font-weight="normal" font-family="sans-serif" >= 1.204 × 10²⁴ โมเลกุล</text>
</svg>
