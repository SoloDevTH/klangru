<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="sans-serif" font-size="14">
  <title>ร่องรอยดิจิทัลมาจากสามทาง ข้อมูลที่เราให้เอง ข้อมูลที่ระบบเก็บอัตโนมัติ และข้อมูลที่ระบบอนุมาน</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <rect x="30.0" y="20.0" width="260.0" height="300.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="160.0" y="52.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ข้อมูลที่เราให้เอง</text>
  <text x="160.0" y="76.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">รู้ตัวว่ากำลังให้</text>
  <rect x="46.0" y="96.0" width="228.0" height="40.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="160.0" y="121.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">โพสต์ รูป ความคิดเห็น</text>
  <rect x="46.0" y="150.0" width="228.0" height="40.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="160.0" y="175.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ชื่อ เบอร์โทรในฟอร์ม</text>
  <rect x="46.0" y="204.0" width="228.0" height="40.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="160.0" y="229.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ข้อความแชต</text>
  <rect x="46.0" y="258.0" width="228.0" height="40.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="160.0" y="283.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">รีวิวร้านอาหาร</text>
  <rect x="310.0" y="20.0" width="260.0" height="300.0" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="440.0" y="52.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ข้อมูลที่ระบบเก็บอัตโนมัติ</text>
  <text x="440.0" y="76.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">มักไม่รู้ตัว</text>
  <rect x="326.0" y="96.0" width="228.0" height="40.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="440.0" y="121.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">คุกกี้และตัวติดตาม</text>
  <rect x="326.0" y="150.0" width="228.0" height="40.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="440.0" y="175.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ตำแหน่ง GPS และ Wi-Fi</text>
  <rect x="326.0" y="204.0" width="228.0" height="40.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="440.0" y="229.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ประวัติการค้นหาและการคลิก</text>
  <rect x="326.0" y="258.0" width="228.0" height="40.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="440.0" y="283.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">เวลาและอุปกรณ์ที่ใช้</text>
  <rect x="590.0" y="20.0" width="260.0" height="300.0" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="720.0" y="52.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">ข้อมูลที่ระบบอนุมาน</text>
  <text x="720.0" y="76.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">ไม่เคยบอกเลย</text>
  <rect x="606.0" y="96.0" width="228.0" height="40.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="720.0" y="121.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ความชอบและงานอดิเรก</text>
  <rect x="606.0" y="150.0" width="228.0" height="40.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="720.0" y="175.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ช่วงอายุ รายได้โดยประมาณ</text>
  <rect x="606.0" y="204.0" width="228.0" height="40.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="720.0" y="229.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ที่อยู่บ้านและที่เรียน</text>
  <rect x="606.0" y="258.0" width="228.0" height="40.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="720.0" y="283.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">แนวโน้มจะซื้อสินค้า</text>
  <line x1="292.0" y1="170.0" x2="308.0" y2="170.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="572.0" y1="170.0" x2="588.0" y2="170.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="140.0" y="340.0" width="600.0" height="44.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440.0" y="368.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">รวมกันเป็นร่องรอยดิจิทัลที่ถูกคัดลอก เก็บ และส่งต่อได้ ลบให้หมดยาก</text>
  <line x1="160.0" y1="320.0" x2="244.0" y2="340.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="440.0" y1="320.0" x2="440.0" y2="340.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="720.0" y1="320.0" x2="636.0" y2="340.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
</svg>
