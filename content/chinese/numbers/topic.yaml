id: chinese.hanzi.numbers
subject: chinese
title: { th: ตัวเลขภาษาจีน 一 ถึง 百, en: Chinese numbers from one to one hundred }
summary: อ่านและเขียนตัวเลขจีน 一 ถึง 十 และ 百 แล้วนำมาประกอบเป็นเลขสองหลักแบบเดียวกับภาษาไทย เช่น 二十五 คือ ยี่สิบห้า
difficulty: 2
minutes: 30
prerequisites: [chinese.hanzi.basic-strokes, chinese.pinyin.tones]
encompasses:
  - { id: chinese.hanzi.basic-strokes, weight: 0.3 }
  - { id: chinese.pinyin.tones, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: number-structure.svg
    alt: "แผนภาพเลข 四十七 อักษรสามตัวในกล่องสี: 四 sì คือ 4, 十 shí คือคูณ 10, 七 qī คือบวก 7 รวมเป็น 4 × 10 + 7 = 47 และหมายเหตุว่า 二十 = 20 แต่ 十二 = 12"
    caption: "เลขหน้า 十 คูณ เลขหลัง 十 บวก"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: stroke-order-si.svg
    alt: "ลำดับขีดของ 四 ห้าช่อง ขีดที่ 1 竖 ขีดตั้งด้านซ้ายลากลง ขีดที่ 2 横折 ด้านบนลากไปขวาแล้วหักลงเป็นด้านขวา ขีดที่ 3 撇 ขีดข้างในด้านซ้ายตวัดลงซ้าย ขีดที่ 4 竖弯 ขีดข้างในด้านขวาลากลงแล้วโค้งไปทางขวา ขีดที่ 5 横 ขีดนอนล่างปิดกรอบ ขีดที่เขียนแล้วเป็นสีเทา"
    caption: "四 เขียนแบบเข้าบ้านก่อนปิดประตู"
  - type: worked-example
    title: อ่านราคา 六十三
    problem: "ป้ายเขียนว่า 六十三块 สินค้าราคากี่บาท และอ่านพินอินอย่างไร"
    steps:
      - text: "六 อยู่หน้า 十 จึงเป็นหลักสิบ: 6 × 10 = 60"
        why: "เลขหน้า 十 บอกว่ามีกี่สิบ"
      - text: "三 อยู่หลัง 十 จึงบวกเพิ่ม: 60 + 3 = 63"
      - text: "块 คือหน่วยเงินในภาษาพูด จึงเป็น 63 บาท"
      - text: "พินอิน: liù shí sān kuài"
    answer: "63 บาท อ่านว่า liùshísān kuài"
  - { type: check, problem: zh.num.p016, prompt: "ลองอ่านเลขสามหลักที่มี 零" }
  - type: worked-example
    title: เขียนราคา 208 บาท และสั่งของสองชิ้น
    problem: "เขียนราคา 208 บาท เป็นภาษาจีน แล้วบอกว่าถ้าลูกค้าจะพูดว่า เอาสองชิ้น (个 ge) ต้องใช้เลข 2 แบบใด"
    steps:
      - text: "หลักร้อยคือ 2: 二百 (ภาษาพูดใช้ 两百 ก็ได้)"
      - text: "หลักสิบว่าง จึงใส่ 零"
        why: "ถ้าไม่ใส่ 零 แล้วเขียน 二百八 คนจะเข้าใจว่า 280"
      - text: "หลักหน่วยคือ 8: 八 แล้วต่อด้วยหน่วยเงิน 块 ได้ 二百零八块"
      - text: "สองชิ้นเป็นจำนวนสิ่งของหน้าลักษณนาม 个 จึงใช้ 两 ได้ 两个"
    answer: "二百零八块 (èrbǎi líng bā kuài) และ 两个 (liǎng ge)"
  - { type: check, problem: zh.num.p017, prompt: "เลือกระหว่าง 二 กับ 两" }
glossary:
  - { term: 十 shí, definition: สิบ ใช้เป็นหลักสิบในการสร้างเลขสองหลัก เช่น 三十 (30) และ 十三 (13) }
  - { term: 百 bǎi, definition: ร้อย เลข 100 อ่านว่า 一百 yìbǎi }
  - { term: 两 liǎng, definition: สอง ใช้เมื่อบอกจำนวนสิ่งของ เช่น 两个 (สองอัน) ส่วนการนับเลขใช้ 二 èr }
flashcards:
  - { front: "一 二 三 四 五", back: "yī èr sān sì wǔ (1 2 3 4 5)" }
  - { front: "六 七 八 九 十", back: "liù qī bā jiǔ shí (6 7 8 9 10)" }
  - { front: "十二 กับ 二十 ต่างกันอย่างไร", back: "十二 shí'èr = 12 (สิบ + สอง) · 二十 èrshí = 20 (สอง × สิบ)" }
  - { front: "一百 อ่านว่าอย่างไร", back: "yìbǎi (一 ก่อนเสียง 3 เปลี่ยนเป็นเสียง 4) แปลว่า หนึ่งร้อย" }
