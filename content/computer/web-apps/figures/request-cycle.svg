<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380"><title>แผนภาพลำดับ เบราว์เซอร์ส่ง GET แล้วได้ 200 พร้อม JSON จากนั้นส่ง POST แล้วได้ 201</title><rect width="720" height="380" fill="#ffffff"/><rect x="60" y="20" width="180" height="50" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="150" y="50" font-family="sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">เบราว์เซอร์ (JavaScript)</text><rect x="480" y="20" width="180" height="50" rx="8" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/><text x="570" y="50" font-family="sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">เซิร์ฟเวอร์ (API)</text><line x1="150" y1="70" x2="150" y2="350" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5,4"/><line x1="570" y1="70" x2="570" y2="350" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5,4"/><line x1="150" y1="120" x2="570" y2="120" stroke="#1f2937" stroke-width="2"/><polygon points="570,120 560,115 560,125" fill="#1f2937"/><text x="360.0" y="110" font-family="sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal">1  GET /api/items</text><line x1="570" y1="170" x2="150" y2="170" stroke="#15803d" stroke-width="2"/><polygon points="150,170 160,165 160,175" fill="#15803d"/><text x="360.0" y="160" font-family="sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="normal">2  200 OK  [JSON รายการขนม]</text><line x1="150" y1="230" x2="570" y2="230" stroke="#1d4ed8" stroke-width="2"/><polygon points="570,230 560,225 560,235" fill="#1d4ed8"/><text x="360.0" y="220" font-family="sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="normal">3  POST /api/items  {"name": "ขนมปัง"}</text><line x1="570" y1="280" x2="150" y2="280" stroke="#15803d" stroke-width="2"/><polygon points="150,280 160,275 160,285" fill="#15803d"/><text x="360.0" y="270" font-family="sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="normal">4  201 Created  {"id": 4}</text><text x="360" y="340" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="normal">JavaScript อัปเดต DOM หลังได้คำตอบ โดยไม่ต้องโหลดหน้าใหม่ทั้งหน้า</text></svg>
