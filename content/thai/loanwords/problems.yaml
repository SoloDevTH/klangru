  ai_assisted: true
- id: thai.grammar.loanwords.p012
  topics:
  - thai.grammar.loanwords
  difficulty: 4
  type: mcq
  stem: 'ข่าวเศรษฐกิจ (สมมติ): "ช่วงเทศกาลกินเจ **อุปสงค์** ผักในตลาดไทเพิ่มขึ้นมาก ราคาผักจึงสูงขึ้น" คำว่า อุปสงค์ หมายถึงอะไร'
  choices:
  - id: a
    text: ปริมาณที่ผู้ขายนำออกขาย
    feedback: เป็นความหมายของ อุปทาน (supply)
  - id: b
    text: ราคาของสินค้า
    feedback: ราคาเป็นผล ไม่ใช่อุปสงค์
  - id: c
    text: ภาษีที่ต้องจ่าย
    feedback: ไม่เกี่ยว
  - id: d
    text: ความต้องการซื้อของผู้บริโภค
    correct: true
    feedback: ถูก demand
  hints:
  - อุปสงค์คู่กับอุปทาน
  - ช่วงกินเจ คนอยากซื้อผักมากขึ้นหรือน้อยลง
  solution: '**อุปสงค์** = ความต้องการซื้อ (demand) คู่กับ อุปทาน = ปริมาณที่นำออกขาย (supply)'
  license: CC-BY-SA-4.0
  ai_assisted: true
