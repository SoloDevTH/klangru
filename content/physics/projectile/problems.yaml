    stem: "นั่งท้ายรถกระบะที่วิ่งบนถนนตรงด้วยความเร็วคงตัว แล้วโยนลูกบอลขึ้นไปตรง ๆ (เทียบกับตัวเอง) ไม่คิดแรงต้านอากาศ ลูกบอลจะตกลงที่ใด"
