<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="sans-serif">
<title>กระบวนการออกแบบเชิงวิศวกรรม 6 ขั้น</title>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="360.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111">กระบวนการออกแบบเชิงวิศวกรรม</text>
<rect x="25.0" y="74.0" width="190.0" height="72.0" rx="8" fill="#ede9fe" stroke="#333" stroke-width="1.5"/>
<text x="120.0" y="100.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#111">1 ระบุปัญหา</text>
<text x="120.0" y="122.0" font-size="12" text-anchor="middle" fill="#111">5W1H เกณฑ์ความสำเร็จ</text>
<text x="120.0" y="138.0" font-size="12" text-anchor="middle" fill="#111">ข้อจำกัด</text>
<rect x="265.0" y="74.0" width="190.0" height="72.0" rx="8" fill="#ede9fe" stroke="#333" stroke-width="1.5"/>
<text x="360.0" y="100.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#111">2 รวบรวมข้อมูล</text>
<text x="360.0" y="122.0" font-size="12" text-anchor="middle" fill="#111">ผู้ใช้ วิธีที่มีอยู่</text>
<text x="360.0" y="138.0" font-size="12" text-anchor="middle" fill="#111">ความรู้วิทยาศาสตร์</text>
<rect x="505.0" y="74.0" width="190.0" height="72.0" rx="8" fill="#ede9fe" stroke="#333" stroke-width="1.5"/>
<text x="600.0" y="100.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#111">3 ออกแบบวิธีแก้</text>
<text x="600.0" y="122.0" font-size="12" text-anchor="middle" fill="#111">หลายแบบ ภาพร่าง</text>
<text x="600.0" y="138.0" font-size="12" text-anchor="middle" fill="#111">เมทริกซ์ตัดสินใจ</text>
<rect x="505.0" y="254.0" width="190.0" height="72.0" rx="8" fill="#ede9fe" stroke="#333" stroke-width="1.5"/>
<text x="600.0" y="280.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#111">4 วางแผนและสร้าง</text>
<text x="600.0" y="302.0" font-size="12" text-anchor="middle" fill="#111">ขั้นตอน วัสดุ งบ</text>
<text x="600.0" y="318.0" font-size="12" text-anchor="middle" fill="#111">สร้างต้นแบบ</text>
<rect x="265.0" y="254.0" width="190.0" height="72.0" rx="8" fill="#ede9fe" stroke="#333" stroke-width="1.5"/>
<text x="360.0" y="280.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#111">5 ทดสอบ ปรับปรุง</text>
<text x="360.0" y="302.0" font-size="12" text-anchor="middle" fill="#111">ทดสอบยุติธรรม</text>
<text x="360.0" y="318.0" font-size="12" text-anchor="middle" fill="#111">หาข้อบกพร่อง</text>
<rect x="25.0" y="254.0" width="190.0" height="72.0" rx="8" fill="#ede9fe" stroke="#333" stroke-width="1.5"/>
<text x="120.0" y="280.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#111">6 นำเสนอ</text>
<text x="120.0" y="302.0" font-size="12" text-anchor="middle" fill="#111">ผลการแก้ปัญหา</text>
<text x="120.0" y="318.0" font-size="12" text-anchor="middle" fill="#111">และชิ้นงาน</text>
<line x1="215.0" y1="110.0" x2="263.0" y2="110.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="455.0" y1="110.0" x2="503.0" y2="110.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="600.0" y1="146.0" x2="600.0" y2="252.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="505.0" y1="290.0" x2="457.0" y2="290.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="265.0" y1="290.0" x2="217.0" y2="290.0" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 400 254 C 400 205, 540 200, 540 150" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="385.0" y="205.0" font-size="12.5" text-anchor="end" font-weight="bold" fill="#b45309">ไม่ผ่านเกณฑ์</text>
<text x="385.0" y="223.0" font-size="12.5" text-anchor="end" font-weight="bold" fill="#b45309">กลับไปปรับแบบ</text>
<text x="360.0" y="370.0" font-size="12.5" text-anchor="middle" fill="#555">ทุกขั้นวนกลับไปขั้นก่อนหน้าได้เมื่อพบข้อมูลใหม่หรือข้อบกพร่อง</text>
</svg>
