<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" font-family="'Sarabun','Noto Sans Thai','Noto Sans Thai UI','Leelawadee UI','Tahoma','Loma',sans-serif">
<title>บรรณานุกรมฉบับร่าง 4 รายการ</title>
<defs></defs>
<rect x="0" y="0" width="860" height="310" fill="#fff"/>
<rect x="10.0" y="10.0" width="840.0" height="290.0" rx="10" fill="#fff" stroke="#607d8b" stroke-width="2"/>
<text x="430.0" y="46.0" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">บรรณานุกรม (ฉบับร่าง แหล่งข้อมูลสมมติ)</text>
<text x="30.0" y="100.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">1.</text>
<text x="60" y="100" font-size="17" fill="#111">กมล ป่าใหญ่. (2566). <tspan font-style="italic">การกัดเซาะชายฝั่ง</tspan>. สำนักพิมพ์สมมติ.</text>
<text x="30.0" y="150.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">2.</text>
<text x="60" y="150" font-size="17" fill="#111">ชนิดา รักษ์น้ำ. <tspan font-style="italic">นกในป่าชายเลน</tspan>. สำนักพิมพ์สมมติ.</text>
<text x="30.0" y="200.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">3.</text>
<text x="60" y="200" font-size="17" fill="#111">เด่นชัย ชายหาด. (2563). <tspan font-style="italic">ปูแสมกับระบบนิเวศ</tspan>. สำนักพิมพ์สมมติ.</text>
<text x="30.0" y="250.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">4.</text>
<text x="60" y="250" font-size="17" fill="#111">Lee, A. (2021). <tspan font-style="italic">Mangrove forests</tspan>. Example Press.</text>
</svg>
