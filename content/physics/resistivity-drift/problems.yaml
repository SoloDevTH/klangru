  - id: physics.electricity.resistivity-drift.p017
    topics: [physics.electricity.resistivity-drift]
    difficulty: 5
    type: expression
    stem: "ลวดสภาพต้านทาน $\\rho$ ยาว $L$ มีเส้นผ่านศูนย์กลาง $d$ เขียนความต้านทานของลวดในรูปของ $\\rho$, $L$ และ $d$"
    prefix: "R ="
    answer: { latex: "\\frac{4\\rho L}{\\pi d^2}", variables: [rho, L, d] }
    misconceptions:
      - { match: "\\frac{\\rho L}{\\pi d^2}", feedback: "ใช้ $d$ เป็นรัศมี พื้นที่หน้าตัดคือ $\\pi (d/2)^2 = \\tfrac{\\pi d^2}{4}$" }
      - { match: "\\frac{\\rho L}{d^2}", feedback: "พื้นที่หน้าตัดวงกลมต้องมี $\\pi$ และต้องใช้รัศมี $d/2$" }
    hints:
      - "พื้นที่หน้าตัด $A = \\pi r^2$ และ $r = d/2$"
      - "แทน $A$ ใน $R = \\rho L/A$"
    solution: "$A = \\pi\\left(\\tfrac{d}{2}\\right)^2 = \\tfrac{\\pi d^2}{4}$ จึงได้ $R = \\dfrac{\\rho L}{\\pi d^2/4} = \\dfrac{4\\rho L}{\\pi d^2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

