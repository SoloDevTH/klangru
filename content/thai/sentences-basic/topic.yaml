id: thai.grammar.sentences-basic
subject: thai
title: { th: การเรียบเรียงคำเป็นประโยคและชนิดของประโยคตามเจตนา, en: Building sentences and sentence types by intent }
summary: เรียงคำเป็นประโยคแบบประธาน กริยา กรรม ส่วนขยาย แยกประโยคบอกเล่า ปฏิเสธ คำถาม ขอร้อง ชักชวน และคำสั่ง ตามเจตนา แล้วต่อเป็นข้อความสั้น
difficulty: 2.5
minutes: 30
prerequisites: [thai.grammar.word-types]
encompasses:
  - { id: thai.grammar.word-types, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: word-cards.svg
    alt: "บัตรคำ 4 ใบเรียงกัน: น้อง (ประธาน ตอบคำถาม ใคร) กิน (กริยา ทำอะไร) ข้าวเหนียว (กรรม อะไร) ทุกเช้า (ส่วนขยาย เมื่อไร) ลูกศรชี้ลงไปที่ประโยค น้องกินข้าวเหนียวทุกเช้า"
    caption: "เรียงบัตรคำเป็นประธาน กริยา กรรม และส่วนขยาย"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: เรียงคำที่มีคำขยาย
    problem: "เรียงคำเป็นประโยค: ตัวใหญ่ / จับ / หนู / แมว / สีดำ"
    steps:
      - text: "หากริยา: จับ"
      - text: "ใครจับ: แมว และคำขยาย สีดำ วางหลัง แมว ได้ แมวสีดำ"
        why: "คำขยายในภาษาไทยอยู่หลังคำที่ถูกขยาย"
      - text: "จับอะไร: หนู และคำขยาย ตัวใหญ่ วางหลัง หนู ได้ หนูตัวใหญ่"
      - text: "รวมเป็น ประธาน + กริยา + กรรม"
    answer: "แมวสีดำจับหนูตัวใหญ่"
  - { type: check, problem: thai.grammar.sentences-basic.p008, prompt: "คำขยายอยู่ตรงไหนของคำที่ถูกขยาย" }
  - type: worked-example
    title: เปลี่ยนชนิดของประโยคให้ตรงเจตนา
    problem: "จากประโยค \"น้องดูโทรทัศน์\" แม่อยากให้น้องเลิกดูโทรทัศน์แล้วไปทำการบ้าน แม่ควรพูดประโยคชนิดใด"
    steps:
      - text: "เจตนาของแม่คือให้น้องหยุดทำบางอย่าง จึงเป็นประโยคคำสั่ง หรือขอร้องถ้าอยากพูดนุ่มนวล"
      - text: "คำสั่งใช้ อย่า หรือ ห้าม: \"อย่าดูโทรทัศน์นานนัก ไปทำการบ้านได้แล้ว\""
      - text: "ขอร้องใช้ ช่วย...หน่อย: \"ช่วยปิดโทรทัศน์แล้วไปทำการบ้านหน่อยนะ\""
        why: "ประโยคบอกเล่า \"น้องดูโทรทัศน์\" เพียงบอกเรื่องที่เกิดขึ้น ไม่ได้ทำให้น้องรู้ว่าแม่ต้องการอะไร"
    answer: "ประโยคคำสั่งหรือประโยคขอร้อง เช่น \"ช่วยปิดโทรทัศน์แล้วไปทำการบ้านหน่อยนะ\""
  - { type: check, problem: thai.grammar.sentences-basic.p006, prompt: "หาคำที่บอกเจตนาในป้าย" }
  - type: figure
    src: signs.svg
    alt: "ป้าย 4 ป้าย ป้าย ก: ห้ามเดินลัดสนาม ป้าย ข: กรุณาถอดรองเท้าก่อนเข้าห้องสมุด ป้าย ค: ร้านนี้ไม่รับบัตรเครดิต ป้าย ง: ตลาดนัดเปิดทุกวันเสาร์ ตั้งแต่ ๗ โมงเช้า"
    caption: "ป้ายรอบตัวใช้ประโยคหลายชนิด"
glossary:
  - { term: ประโยค, definition: "กลุ่มคำที่มีใจความครบ มีภาคประธานและภาคแสดง" }
  - { term: ประโยคบอกเล่า, definition: "ประโยคที่บอกเรื่องราว เช่น พ่อไปตลาด" }
  - { term: ประโยคปฏิเสธ, definition: "ประโยคที่บอกว่าไม่ใช่หรือไม่ได้ทำ มีคำว่า ไม่ ไม่ได้ มิได้" }
  - { term: ประโยคคำถาม, definition: "ประโยคที่ต้องการคำตอบ มีคำว่า ไหม หรือ ใคร อะไร ที่ไหน ทำไม" }
  - { term: ประโยคขอร้อง, definition: "ประโยคที่ขอให้ผู้อื่นช่วยอย่างสุภาพ มีคำว่า โปรด กรุณา ช่วย...หน่อย" }
  - { term: ประโยคคำสั่ง, definition: "ประโยคที่ให้ทำหรือห้ามทำ มีคำว่า จง ห้าม อย่า" }
flashcards:
  - { front: "ลำดับคำในประโยคไทยพื้นฐาน", back: "ประธาน + กริยา + กรรม + ส่วนขยาย" }
  - { front: "คำว่า ไม่ วางตรงไหน", back: "หน้ากริยา เช่น แมวไม่กินปลา" }
  - { front: "ฉันไม่รู้ว่าเขาไปไหน เป็นประโยคชนิดใด", back: "ประโยคปฏิเสธ (ไหน ไม่ได้ใช้ถาม)" }
  - { front: "ช่วยปิดไฟให้หน่อยได้ไหม มีเจตนาอะไร", back: "ขอร้อง (รูปเป็นคำถาม แต่ต้องการให้ช่วยทำ)" }
