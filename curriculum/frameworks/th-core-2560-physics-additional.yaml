strands:
  - id: "ฟิสิกส์"
    title: "สาระฟิสิกส์"
    standards:
      - id: "ฟิสิกส์ 1"
        text: "เข้าใจธรรมชาติทางฟิสิกส์ ปริมาณและกระบวนการวัด การเคลื่อนที่แนวตรง แรงและกฎการเคลื่อนที่ของนิวตัน กฎความโน้มถ่วงสากล แรงเสียดทานสมดุลกลของวัตถุ งานและกฎการอนุรักษ์พลังงานกล โมเมนตัมและกฎการอนุรักษ์โมเมนตัม การเคลื่อนที่แนวโค้ง รวมทั้งนำความรู้ไปใช้ประโยชน์"
        indicators:
          - { id: "ฟิสิกส์ 1 ม.4/1", level: "ม.4", text: "สืบค้น และอธิบายการค้นหาความรู้ทางฟิสิกส์ ประวัติความเป็นมา รวมทั้งพัฒนาการของ หลักการและแนวคิดทางฟิสิกส์ที่มีผลต่อ การแสวงหาความรู้ใหม่และการพัฒนาเทคโนโลยี" }
          - { id: "ฟิสิกส์ 1 ม.4/2", level: "ม.4", text: "วัด และรายงานผลการวัดปริมาณทางฟิสิกส์ ได้ถูกต้องเหมาะสม โดยนำความคลาดเคลื่อน ในการวัดมาพิจารณาในการนำเสนอผล รวมทั้งแสดงผลการทดลองในรูปของกราฟ วิเคราะห์และแปลความหมายจากกราฟเส้นตรง" }
          - { id: "ฟิสิกส์ 1 ม.4/3", level: "ม.4", text: "ทดลอง และอธิบายความสัมพันธ์ระหว่างตำแหน่ง การกระจัด ความเร็ว และความเร่งของการเคลื่อนที่ของวัตถุในแนวตรงที่มีความเร่งคงตัวจากกราฟและสมการ รวมทั้งทดลองหาค่าความเร่งโน้มถ่วงของโลก และคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง" }
          - { id: "ฟิสิกส์ 1 ม.4/4", level: "ม.4", text: "ทดลอง และอธิบายการหาแรงลัพธ์ของแรง สองแรงที่ทำมุมต่อกัน", note: "ไฟล์ PhysicsLO_Group_1.docx ของ สสวท. (2562) ใช้ถ้อยคำว่า \"อธิบายแรง รวมทั้ง ทดลองและอธิบายการหาแรงลัพธ์ของแรงสองแรงที่ทำมุมต่อกัน\"" }
          - { id: "ฟิสิกส์ 1 ม.4/5", level: "ม.4", text: "เขียนแผนภาพของแรงที่กระทำต่อวัตถุอิสระ ทดลอง และอธิบายกฎการเคลื่อนที่ของนิวตันและการใช้กฎการเคลื่อนที่ของนิวตันกับสภาพการเคลื่อนที่ของวัตถุ รวมทั้งคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง", note: "ไฟล์ PhysicsLO_Group_1.docx ของ สสวท. (2562) ใช้ถ้อยคำว่า \"เขียนแผนภาพวัตถุอิสระ ทดลองและอธิบายกฎการเคลื่อนที่ของนิวตันและการใช้กฎการเคลื่อนที่ของนิวตันกับสภาพการเคลื่อนที่ของวัตถุ รวมทั้ง คำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง\"" }
          - { id: "ฟิสิกส์ 1 ม.4/6", level: "ม.4", text: "อธิบายกฎความโน้มถ่วงสากลและผลของ สนามโน้มถ่วงที่ทำให้วัตถุมีน้ำหนัก รวมทั้งคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง" }
          - { id: "ฟิสิกส์ 1 ม.4/7", level: "ม.4", text: "วิเคราะห์ อธิบาย และคำนวณแรงเสียดทานระหว่างผิวสัมผัสของวัตถุคู่หนึ่ง ๆ ในกรณีที่วัตถุหยุดนิ่งและวัตถุเคลื่อนที่ รวมทั้งทดลองหาสัมประสิทธิ์ความเสียดทานระหว่างผิวสัมผัส ของวัตถุคู่หนึ่ง ๆ และนำความรู้เรื่องแรงเสียดทานไปใช้ในชีวิตประจำวัน" }
          - { id: "ฟิสิกส์ 1 ม.4/8", level: "ม.4", text: "อธิบายสมดุลกลของวัตถุ โมเมนต์ และผลรวมของโมเมนต์ที่มีต่อการหมุน แรงคู่ควบและผลของแรงคู่ควบที่มีต่อสมดุลของวัตถุ เขียนแผนภาพของแรงที่กระทำต่อวัตถุอิสระเมื่อวัตถุอยู่ในสมดุลกล และคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง รวมทั้งทดลองและอธิบายสมดุล ของแรงสามแรง", note: "ไฟล์ PhysicsLO_Group_1.docx ของ สสวท. (2562) ใช้ถ้อยคำว่า \"อธิบายสมดุลกลของวัตถุ โมเมนต์และผลรวมของโมเมนต์ที่มีต่อการหมุน แรงคู่ควบและผลของแรงคู่ควบที่มีต่อสมดุลของวัตถุ เขียนแผนภาพวัตถุอิสระเมื่อวัตถุอยู่ในสมดุลกล และคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง รวมทั้งทดลองและอธิบายสมดุลของแรงสามแรง\"" }
          - { id: "ฟิสิกส์ 1 ม.4/9", level: "ม.4", text: "สังเกต และอธิบายสภาพการเคลื่อนที่ของวัตถุ เมื่อแรงที่กระทำต่อวัตถุผ่านศูนย์กลางมวลของวัตถุ และผลของศูนย์ถ่วงที่มีต่อเสถียรภาพของวัตถุ" }
          - { id: "ฟิสิกส์ 1 ม.4/10", level: "ม.4", text: "วิเคราะห์ และคำนวณงานของแรงคงตัว จากสมการและพื้นที่ใต้กราฟความสัมพันธ์ระหว่างแรงกับตำแหน่ง รวมทั้งอธิบาย และคำนวณกำลังเฉลี่ย" }
          - { id: "ฟิสิกส์ 1 ม.4/11", level: "ม.4", text: "อธิบาย และคำนวณพลังงานจลน์ พลังงานศักย์พลังงานกล ทดลองหาความสัมพันธ์ ระหว่างงานกับพลังงานจลน์ ความสัมพันธ์ระหว่างงานกับพลังงานศักย์โน้มถ่วง ความสัมพันธ์ระหว่างขนาดของแรงที่ใช้ดึงสปริงกับระยะที่สปริงยืดออกและความสัมพันธ์ระหว่างงานกับพลังงานศักย์ยืดหยุ่น รวมทั้งอธิบายความสัมพันธ์ระหว่างงานของแรงลัพธ์และพลังงานจลน์ และคำนวณงานที่เกิดขึ้นจากแรงลัพธ์" }
          - { id: "ฟิสิกส์ 1 ม.4/12", level: "ม.4", text: "อธิบายกฎการอนุรักษ์พลังงานกล รวมทั้งวิเคราะห์ และคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้องกับการเคลื่อนที่ของวัตถุในสถานการณ์ต่าง ๆ โดยใช้กฎการอนุรักษ์พลังงานกล" }
          - { id: "ฟิสิกส์ 1 ม.4/13", level: "ม.4", text: "อธิบายการทำงาน ประสิทธิภาพและการได้เปรียบเชิงกลของเครื่องกลอย่างง่ายบางชนิด โดยใช้ความรู้เรื่องงานและสมดุลกล รวมทั้งคำนวณประสิทธิภาพและการได้เปรียบเชิงกล" }
          - { id: "ฟิสิกส์ 1 ม.4/14", level: "ม.4", text: "อธิบาย และคำนวณโมเมนตัมของวัตถุ และการดลจากสมการและพื้นที่ใต้กราฟ ความสัมพันธ์ระหว่างแรงลัพธ์กับเวลา รวมทั้งอธิบายความสัมพันธ์ระหว่างแรงดลกับโมเมนตัม" }
          - { id: "ฟิสิกส์ 1 ม.4/15", level: "ม.4", text: "ทดลอง อธิบาย และคำนวณปริมาณต่าง ๆ ที่เกี่ยวกับการชนของวัตถุในหนึ่งมิติ ทั้งแบบยืดหยุ่น ไม่ยืดหยุ่น และการดีดตัวแยกจากกันในหนึ่งมิติซึ่งเป็นไปตามกฎการอนุรักษ์โมเมนตัม" }
          - { id: "ฟิสิกส์ 1 ม.4/16", level: "ม.4", text: "อธิบาย วิเคราะห์ และคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้องกับการเคลื่อนที่แบบโพรเจกไทล์ และทดลองการเคลื่อนที่แบบโพรเจกไทล์" }
          - { id: "ฟิสิกส์ 1 ม.4/17", level: "ม.4", text: "ทดลอง และอธิบายความสัมพันธ์ระหว่างแรงสู่ศูนย์กลาง รัศมีของการเคลื่อนที่ อัตราเร็วเชิงเส้น อัตราเร็วเชิงมุม และมวล ของวัตถุ ในการเคลื่อนที่แบบวงกลมในระนาบระดับ รวมทั้งคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้องและประยุกต์ใช้ความรู้การเคลื่อนที่แบบวงกลม ในการอธิบายการโคจรของดาวเทียม" }
      - id: "ฟิสิกส์ 2"
        text: "เข้าใจการเคลื่อนที่แบบฮาร์มอนิกอย่างง่าย ธรรมชาติของคลื่น เสียงและการได้ยิน ปรากฏการณ์ที่เกี่ยวข้องกับเสียง แสงและการเห็น ปรากฏการณ์ที่เกี่ยวข้องกับแสง รวมทั้งนำความรู้ไปใช้ประโยชน์"
        indicators:
          - { id: "ฟิสิกส์ 2 ม.5/1", level: "ม.5", text: "ทดลอง และอธิบายการเคลื่อนที่แบบฮาร์มอนิก อย่างง่ายของวัตถุติดปลายสปริงและลูกตุ้ม อย่างง่าย รวมทั้งคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง" }
          - { id: "ฟิสิกส์ 2 ม.5/2", level: "ม.5", text: "อธิบายความถี่ธรรมชาติของวัตถุและการเกิดการสั่นพ้อง" }
          - { id: "ฟิสิกส์ 2 ม.5/3", level: "ม.5", text: "อธิบายปรากฏการณ์คลื่น ชนิดของคลื่น ส่วนประกอบของคลื่น การแผ่ของหน้าคลื่น ด้วยหลักการของฮอยเกนส์ และการรวมกัน ของคลื่นตามหลักการซ้อนทับ พร้อมทั้งคำนวณอัตราเร็ว ความถี่ และความยาวคลื่น" }
          - { id: "ฟิสิกส์ 2 ม.5/4", level: "ม.5", text: "สังเกต และอธิบายการสะท้อน การหักเห การแทรกสอด และการเลี้ยวเบนของคลื่นผิวน้ำ รวมทั้งคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง" }
          - { id: "ฟิสิกส์ 2 ม.5/5", level: "ม.5", text: "อธิบายการเกิดเสียง การเคลื่อนที่ของเสียง ความสัมพันธ์ระหว่างคลื่น การกระจัดของอนุภาคกับคลื่นความดัน ความสัมพันธ์ระหว่างอัตราเร็วของเสียงในอากาศที่ขึ้นกับอุณหภูมิ ในหน่วยองศาเซลเซียส สมบัติของคลื่นเสียง ได้แก่การสะท้อน การหักเห การแทรกสอด การเลี้ยวเบน รวมทั้งคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง", note: "ไฟล์ PhysicsLO_Group_2.docx ของ สสวท. (2562) ใช้ถ้อยคำว่า \"อธิบายการเกิดเสียง การเคลื่อนที่ของเสียง ความสัมพันธ์ระหว่างคลื่นการกระจัดของอนุภาคกับคลื่นความดัน ความสัมพันธ์ระหว่างอัตราเร็วของเสียงในอากาศที่ขึ้นกับอุณหภูมิในหน่วยองศาเซลเซียส การสะท้อน การหักเห การแทรกสอด การเลี้ยวเบน ของคลื่นเสียง รวมทั้งคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง\"" }
          - { id: "ฟิสิกส์ 2 ม.5/6", level: "ม.5", text: "อธิบายความเข้มเสียง ระดับเสียง องค์ประกอบของการได้ยิน คุณภาพเสียง และมลพิษทางเสียง รวมทั้งคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง" }
          - { id: "ฟิสิกส์ 2 ม.5/7", level: "ม.5", text: "ทดลอง และอธิบายการเกิดการสั่นพ้องของอากาศในท่อปลายเปิดหนึ่งด้าน รวมทั้งสังเกตและอธิบายการเกิดบีต คลื่นนิ่ง ปรากฏการณ์ ดอปเพลอร์ คลื่นกระแทกของเสียง คำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง และนำความรู้ เรื่องเสียงไปใช้ในชีวิตประจำวัน" }
          - { id: "ฟิสิกส์ 2 ม.5/8", level: "ม.5", text: "ทดลอง และอธิบายการแทรกสอดของแสงผ่านสลิตคู่และเกรตติง การเลี้ยวเบน และการแทรกสอดของแสงผ่านสลิตเดี่ยว รวมทั้งคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง" }
          - { id: "ฟิสิกส์ 2 ม.5/9", level: "ม.5", text: "ทดลอง และอธิบายการสะท้อนของแสงที่ผิววัตถุตามกฎการสะท้อน เขียนรังสีของแสงและคำนวณตำแหน่งและขนาดภาพของวัตถุ เมื่อแสงตกกระทบกระจกเงาราบและกระจกเงาทรงกลมรวมทั้งอธิบายการนำความรู้เรื่องการสะท้อนของแสงจากกระจกเงาราบ และกระจกเงา ทรงกลมไปใช้ประโยชน์ในชีวิตประจำวัน" }
          - { id: "ฟิสิกส์ 2 ม.5/10", level: "ม.5", text: "ทดลอง และอธิบายความสัมพันธ์ระหว่างดรรชนีหักเห มุมตกกระทบ และมุมหักเห รวมทั้งอธิบายความสัมพันธ์ระหว่างความลึกจริงและความลึกปรากฏ มุมวิกฤตและการ สะท้อนกลับหมดของแสง และคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง" }
          - { id: "ฟิสิกส์ 2 ม.5/11", level: "ม.5", text: "ทดลอง และเขียนรังสีของแสงเพื่อแสดงภาพ ที่เกิดจากเลนส์บาง หาตำแหน่ง ขนาด ชนิดของภาพ และความสัมพันธ์ระหว่างระยะวัตถุ ระยะภาพและความยาวโฟกัส รวมทั้งคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง และอธิบายการนำความรู้เรื่องการหักเหของแสงผ่านเลนส์บาง ไปใช้ประโยชน์ในชีวิตประจำวัน" }
          - { id: "ฟิสิกส์ 2 ม.5/12", level: "ม.5", text: "อธิบายปรากฏการณ์ธรรมชาติที่เกี่ยวกับแสง เช่น รุ้ง การทรงกลด มิราจ และการเห็นท้องฟ้าเป็นสีต่าง ๆ ในช่วงเวลาต่างกัน" }
          - { id: "ฟิสิกส์ 2 ม.5/13", level: "ม.5", text: "สังเกต และอธิบายการมองเห็นแสงสี สีของวัตถุ การผสมสารสี และการผสมแสงสี รวมทั้งอธิบายสาเหตุของการบอดสี", note: "ไฟล์ PhysicsLO_Group_2.docx ของ สสวท. (2562) ใช้ถ้อยคำว่า \"สังเกต และอธิบายการมองเห็นแสงสี สีของวัตถุ การผสมสารสี และการผสมแสงสี รวมทั้งอธิบายสาเหตุของตาบอดสี\"" }
      - id: "ฟิสิกส์ 3"
        text: "เข้าใจแรงไฟฟ้าและกฎของคูลอมบ์ สนามไฟฟ้า ศักย์ไฟฟ้า ความจุไฟฟ้า กระแสไฟฟ้าและกฎของโอห์ม วงจรไฟฟ้ากระแสตรง พลังงานไฟฟ้าและกำลังไฟฟ้า การเปลี่ยนพลังงานทดแทนเป็นพลังงานไฟฟ้า สนามแม่เหล็ก แรงแม่เหล็กที่กระทำกับประจุไฟฟ้าและกระแสไฟฟ้า การเหนี่ยวนำแม่เหล็กไฟฟ้าและกฎของฟาราเดย์ ไฟฟ้ากระแสสลับ คลื่นแม่เหล็กไฟฟ้าและการสื่อสาร รวมทั้งนำความรู้ไปใช้ประโยชน์"
        indicators:
          - { id: "ฟิสิกส์ 3 ม.5/1", level: "ม.5", text: "ทดลอง และอธิบายการทำวัตถุที่เป็นกลางทางไฟฟ้าให้มีประจุไฟฟ้าโดยการขัดสีกันและการเหนี่ยวนำไฟฟ้าสถิต" }
          - { id: "ฟิสิกส์ 3 ม.5/2", level: "ม.5", text: "อธิบาย และคำนวณแรงไฟฟ้าตามกฎของ คูลอมบ์" }
          - { id: "ฟิสิกส์ 3 ม.5/3", level: "ม.5", text: "อธิบาย และคำนวณสนามไฟฟ้าและแรงไฟฟ้า ที่กระทำกับอนุภาคที่มีประจุไฟฟ้าที่อยู่ในสนามไฟฟ้า รวมทั้งหาสนามไฟฟ้าลัพธ์เนื่องจากระบบจุดประจุโดยรวมกันแบบเวกเตอร์" }
          - { id: "ฟิสิกส์ 3 ม.5/4", level: "ม.5", text: "อธิบาย และคำนวณพลังงานศักย์ไฟฟ้า ศักย์ไฟฟ้า และความต่างศักย์ระหว่างสองตำแหน่งใด ๆ" }
          - { id: "ฟิสิกส์ 3 ม.5/5", level: "ม.5", text: "อธิบายส่วนประกอบของตัวเก็บประจุ ความสัมพันธ์ระหว่างประจุไฟฟ้า ความต่างศักย์ และความจุของตัวเก็บประจุ และอธิบายพลังงานสะสมในตัวเก็บประจุ และความจุสมมูล รวมทั้งคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง" }
          - { id: "ฟิสิกส์ 3 ม.5/6", level: "ม.5", text: "นำความรู้เรื่องไฟฟ้าสถิตไปอธิบายหลักการทำงานของเครื่องใช้ไฟฟ้าบางชนิด และปรากฏการณ์ในชีวิตประจำวัน" }
          - { id: "ฟิสิกส์ 3 ม.5/7", level: "ม.5", text: "อธิบายการเคลื่อนที่ของอิเล็กตรอนอิสระและกระแสไฟฟ้าในลวดตัวนำ ความสัมพันธ์ระหว่างกระแสไฟฟ้าในลวดตัวนำกับความเร็วลอยเลื่อนของอิเล็กตรอนอิสระ ความหนาแน่นของอิเล็กตรอนในลวดตัวนำและพื้นที่หน้าตัด ของลวดตัวนำ และคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง" }
          - { id: "ฟิสิกส์ 3 ม.5/8", level: "ม.5", text: "ทดลอง และอธิบายกฎของโอห์ม อธิบาย ความสัมพันธ์ระหว่างความต้านทานกับความยาวพื้นที่หน้าตัด และสภาพต้านทานของตัวนำโลหะที่อุณหภูมิคงตัว และคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง รวมทั้งอธิบายและคำนวณ ความต้านทานสมมูล เมื่อนำตัวต้านทาน มาต่อกันแบบอนุกรมและแบบขนาน" }
          - { id: "ฟิสิกส์ 3 ม.5/9", level: "ม.5", text: "ทดลอง อธิบาย และคำนวณอีเอ็มเอฟของ แหล่งกำเนิดไฟฟ้ากระแสตรง รวมทั้งอธิบายและคำนวณพลังงานไฟฟ้า และกำลังไฟฟ้า" }
          - { id: "ฟิสิกส์ 3 ม.5/10", level: "ม.5", text: "ทดลอง และคำนวณอีเอ็มเอฟสมมูลจากการต่อแบตเตอรี่แบบอนุกรมและแบบขนาน รวมทั้งคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง ในวงจรไฟฟ้ากระแสตรงซึ่งประกอบด้วยแบตเตอรี่และตัวต้านทาน" }
          - { id: "ฟิสิกส์ 3 ม.5/11", level: "ม.5", text: "อธิบายการเปลี่ยนพลังงานทดแทนเป็นพลังงานไฟฟ้า รวมทั้งสืบค้นและอภิปรายเกี่ยวกับเทคโนโลยี ที่นำมาแก้ปัญหาหรือ ตอบสนองความต้องการทางด้านพลังงานไฟฟ้า โดยเน้นด้านประสิทธิภาพและ ความคุ้มค่าด้านค่าใช้จ่าย", note: "ไฟล์ PhysicsLO_Group_3.docx ของ สสวท. (2562) ใช้ถ้อยคำว่า \"อธิบายการเปลี่ยนพลังงานทดแทนเป็นพลังงานไฟฟ้า รวมทั้งสืบค้นและอภิปรายเกี่ยวกับเทคโนโลยีที่นำมาแก้ปัญหาหรือตอบสนองความต้องการทางด้านพลังงาน\"" }
          - { id: "ฟิสิกส์ 3 ม.6/1", level: "ม.6", text: "สังเกต และอธิบายเส้นสนามแม่เหล็ก อธิบายและคำนวณฟลักซ์แม่เหล็กในบริเวณที่กำหนด รวมทั้งสังเกต และอธิบายสนามแม่เหล็ก ที่เกิดจากกระแสไฟฟ้าในลวดตัวนำเส้นตรง และโซเลนอยด์" }
          - { id: "ฟิสิกส์ 3 ม.6/2", level: "ม.6", text: "อธิบาย และคำนวณแรงแม่เหล็กที่กระทำต่ออนุภาคที่มีประจุไฟฟ้าเคลื่อนที่ในสนามแม่เหล็ก แรงแม่เหล็กที่กระทำต่อเส้นลวดที่มีกระแสไฟฟ้าผ่านและวางในสนามแม่เหล็ก รัศมีความโค้งของการเคลื่อนที่เมื่อประจุเคลื่อนที่ตั้งฉากกับ สนามแม่เหล็ก รวมทั้งอธิบายแรงระหว่างเส้นลวดตัวนำคู่ขนานที่มีกระแสไฟฟ้าผ่าน" }
          - { id: "ฟิสิกส์ 3 ม.6/3", level: "ม.6", text: "อธิบายหลักการทำงานของแกลแวนอมิเตอร์และมอเตอร์ไฟฟ้ากระแสตรง รวมทั้งคำนวณปริมาณต่างๆ ที่เกี่ยวข้อง" }
          - { id: "ฟิสิกส์ 3 ม.6/4", level: "ม.6", text: "สังเกต และอธิบายการเกิดอีเอ็มเอฟเหนี่ยวนำ กฎการเหนี่ยวนำของฟาราเดย์ และคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง รวมทั้งนำความรู้ เรื่องอีเอ็มเอฟเหนี่ยวนำไปอธิบายการทำงานของเครื่องใช้ไฟฟ้า" }
          - { id: "ฟิสิกส์ 3 ม.6/5", level: "ม.6", text: "อธิบาย และคำนวณความต่างศักย์อาร์เอ็มเอส และกระแสไฟฟ้าอาร์เอ็มเอส" }
          - { id: "ฟิสิกส์ 3 ม.6/6", level: "ม.6", text: "อธิบายหลักการทำงานและประโยชน์ของ เครื่องกำเนิดไฟฟ้ากระแสสลับ ๓ เฟส การแปลงอีเอ็มเอฟของหม้อแปลง และคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง" }
          - { id: "ฟิสิกส์ 3 ม.6/7", level: "ม.6", text: "อธิบายการเกิดและลักษณะเฉพาะของ คลื่นแม่เหล็กไฟฟ้า แสงไม่โพลาไรส์ แสงโพลาไรส์เชิงเส้น และแผ่นโพลารอยด์ รวมทั้งอธิบายการนำคลื่นแม่เหล็กไฟฟ้า ในช่วงความถี่ต่าง ๆ ไปประยุกต์ใช้และหลัก การทำงานของอุปกรณ์ที่เกี่ยวข้อง" }
          - { id: "ฟิสิกส์ 3 ม.6/8", level: "ม.6", text: "สืบค้น และอธิบายการสื่อสารโดยอาศัยคลื่นแม่เหล็กไฟฟ้าในการส่งผ่านสารสนเทศ และเปรียบเทียบการสื่อสารด้วยสัญญาณ แอนะล็อกกับสัญญาณดิจิทัล" }
      - id: "ฟิสิกส์ 4"
        text: "เข้าใจความสัมพันธ์ของความร้อนกับการเปลี่ยนอุณหภูมิและสถานะของสสาร สภาพยืดหยุ่นของวัสดุและมอดุลัสของยัง ความดันในของไหล แรงพยุง และหลักของอาร์คิมีดิส ความตึงผิวและแรงหนืดของของเหลว ของไหลอุดมคติ และสมการแบร์นูลลี กฎของแก๊ส ทฤษฎีจลน์ของแก๊สอุดมคติและพลังงานในระบบ ทฤษฎีอะตอมของโบร์ ปรากฏการณ์โฟโตอิเล็กทริก ทวิภาวะของคลื่นและอนุภาค กัมมันตภาพรังสี แรงนิวเคลียร์ ปฏิกิริยานิวเคลียร์ พลังงานนิวเคลียร์ ฟิสิกส์อนุภาค รวมทั้งนำความรู้ไปใช้ประโยชน์"
        indicators:
          - { id: "ฟิสิกส์ 4 ม.6/1", level: "ม.6", text: "อธิบาย และคำนวณความร้อนที่ทำให้สสารเปลี่ยนอุณหภูมิ ความร้อนที่ทำให้สสารเปลี่ยนสถานะ และความร้อนที่เกิดจากการถ่ายโอนตามกฎการอนุรักษ์พลังงาน" }
          - { id: "ฟิสิกส์ 4 ม.6/2", level: "ม.6", text: "อธิบายสภาพยืดหยุ่นและลักษณะการยืด และหดตัวของวัสดุที่เป็นแท่ง เมื่อถูกกระทำ ด้วยแรงค่าต่าง ๆ รวมทั้งทดลอง อธิบายและคำนวณความเค้นตามยาว ความเครียดตามยาว และมอดุลัสของยัง และนำความรู้เรื่อง สภาพยืดหยุ่นไปใช้ในชีวิตประจำวัน" }
          - { id: "ฟิสิกส์ 4 ม.6/3", level: "ม.6", text: "อธิบาย และคำนวณความดันเกจ ความดันสัมบูรณ์ และความดันบรรยากาศ รวมทั้งอธิบายหลักการทำงานของแมนอมิเตอร์ บารอมิเตอร์ และเครื่องอัดไฮดรอลิก" }
          - { id: "ฟิสิกส์ 4 ม.6/4", level: "ม.6", text: "ทดลอง อธิบาย และคำนวณขนาดแรงพยุง จากของไหล" }
          - { id: "ฟิสิกส์ 4 ม.6/5", level: "ม.6", text: "ทดลอง อธิบาย และคำนวณความตึงผิวของของเหลว รวมทั้งสังเกตและอธิบายแรงหนืด ของของเหลว" }
          - { id: "ฟิสิกส์ 4 ม.6/6", level: "ม.6", text: "อธิบายสมบัติของของไหลอุดมคติ สมการ ความต่อเนื่อง และสมการแบร์นูลลี รวมทั้งคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง และนำความรู้เกี่ยวกับสมการความต่อเนื่องและสมการแบร์นูลลีไปอธิบายหลักการทำงานของอุปกรณ์ต่าง ๆ" }
          - { id: "ฟิสิกส์ 4 ม.6/7", level: "ม.6", text: "อธิบายกฎของแก๊สอุดมคติและคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง" }
          - { id: "ฟิสิกส์ 4 ม.6/8", level: "ม.6", text: "อธิบายแบบจำลองของแก๊สอุดมคติ ทฤษฎีจลน์ของแก๊ส และอัตราเร็วอาร์เอ็มเอสของโมเลกุลของแก๊ส รวมทั้งคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง" }
          - { id: "ฟิสิกส์ 4 ม.6/9", level: "ม.6", text: "อธิบาย และคำนวณงานที่ทำโดยแก๊สในภาชนะปิดโดยความดันคงตัว และอธิบายความสัมพันธ์ระหว่างความร้อน พลังงานภายในระบบ และงานรวมทั้งคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง และนำความรู้เรื่องพลังงานภายในระบบ ไปอธิบายหลักการทำงานของเครื่องใช้ในชีวิตประจำวัน" }
          - { id: "ฟิสิกส์ 4 ม.6/10", level: "ม.6", text: "อธิบายสมมติฐานของพลังค์ ทฤษฎีอะตอมของโบร์ และการเกิดเส้นสเปกตรัมของอะตอมไฮโดรเจน รวมทั้งคำนวณปริมาณ ต่าง ๆ ที่เกี่ยวข้อง" }
          - { id: "ฟิสิกส์ 4 ม.6/11", level: "ม.6", text: "อธิบายปรากฏการณ์โฟโตอิเล็กทริกและคำนวณพลังงานโฟตอน พลังงานจลน์ของ โฟโตอิเล็กตรอนและฟังก์ชันงานของโลหะ" }
          - { id: "ฟิสิกส์ 4 ม.6/12", level: "ม.6", text: "อธิบายทวิภาวะของคลื่นและอนุภาค รวมทั้งอธิบาย และคำนวณความยาวคลื่นเดอบรอยล์" }
          - { id: "ฟิสิกส์ 4 ม.6/13", level: "ม.6", text: "อธิบายกัมมันตภาพรังสีและความแตกต่าง ของรังสีแอลฟา บีตา และแกมมา" }
          - { id: "ฟิสิกส์ 4 ม.6/14", level: "ม.6", text: "อธิบาย และคำนวณกัมมันตภาพของนิวเคลียสกัมมันตรังสี รวมทั้งทดลอง อธิบาย และคำนวณจำนวนนิวเคลียสกัมมันตภาพรังสี ที่เหลือจากการสลาย และครึ่งชีวิต" }
          - { id: "ฟิสิกส์ 4 ม.6/15", level: "ม.6", text: "อธิบายแรงนิวเคลียร์ เสถียรภาพของนิวเคลียสและพลังงานยึดเหนี่ยว รวมทั้งคำนวณปริมาณต่าง ๆ ที่เกี่ยวข้อง" }
          - { id: "ฟิสิกส์ 4 ม.6/16", level: "ม.6", text: "อธิบายปฏิกิริยานิวเคลียร์ ฟิชชันและฟิวชัน รวมทั้งคำนวณพลังงานนิวเคลียร์" }
          - { id: "ฟิสิกส์ 4 ม.6/17", level: "ม.6", text: "อธิบายประโยชน์ของพลังงานนิวเคลียร์ และรังสี รวมทั้งอันตรายและการป้องกันรังสี ในด้านต่าง ๆ" }
          - { id: "ฟิสิกส์ 4 ม.6/18", level: "ม.6", text: "อธิบายการค้นคว้าวิจัยด้านฟิสิกส์อนุภาค แบบจำลองมาตรฐาน และการใช้ประโยชน์จากการค้นคว้าวิจัยด้านฟิสิกส์อนุภาค ในด้านต่าง ๆ" }
