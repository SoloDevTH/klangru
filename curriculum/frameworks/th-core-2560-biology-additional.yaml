# ผลการเรียนรู้รายวิชาเพิ่มเติม สาระชีววิทยา (ฉบับปรับปรุง พ.ศ. 2560) ระดับ ม.4–6
#
# การจัดโครงสร้าง (ต้นฉบับไม่มีระดับ สาระ→มาตรฐาน→ตัวชี้วัด แบบหลักสูตรแกนกลาง จึงจับคู่ดังนี้)
#   strand    = สาระชีววิทยา ทั้งสาระ (หนึ่งไฟล์ต่อหนึ่งรายวิชาเพิ่มเติม)
#   standard  = ข้อ ๑, ๒, ... ของสาระ (ข้อความ "เข้าใจ..." ที่ขึ้นต้นตารางผลการเรียนรู้แต่ละตาราง) ทำหน้าที่จัดกลุ่มเนื้อหา
#   indicator = ผลการเรียนรู้แต่ละข้อ level = ชั้นที่ต้นฉบับระบุในคอลัมน์ "ชั้น" (ม.4, ม.5, ม.6)
#
# รหัส: ต้นฉบับไม่มีรหัสทางการ ต้นฉบับนับเลขผลการเรียนรู้ใหม่ตั้งแต่ ๑ ในแต่ละชั้นของแต่ละข้อ
#   รหัสในไฟล์นี้ ("ชีววิทยา <ข้อ> ม.<ชั้น>/<ลำดับ>" เช่น "ชีววิทยา 1 ม.4/1") เป็นรหัสที่คลังรู้ตั้งเอง ตามเลขข้อ ชั้น และลำดับในต้นฉบับ
#   ข้อความผลการเรียนรู้และข้อความมาตรฐานคัดจากต้นฉบับทุกตัวอักษร (เลขไทยในข้อความคงไว้ตามต้นฉบับ)
#
# วิธีคัด: ข้อความอยู่ในชั้นข้อความของ PDF (ไม่ใช่ภาพสแกน) แยกคอลัมน์ผลการเรียนรู้ด้วย pdftotext ตามพิกัด
#   และกำหนดช่องว่างตามอักขระช่องว่างที่มีจริงใน PDF (อ่านด้วย pypdf) จึงมีช่องว่างบางจุดที่ผู้จัดหน้าใส่ไว้ท้ายบรรทัด
#   ทำให้บางคำดูเหมือนถูกเว้นวรรคกลางวลี และบางจุดที่ขึ้นบรรทัดใหม่โดยไม่มีอักขระช่องว่างจะติดกัน คงไว้ตามต้นฉบับ
#   ข้อความมาตรฐานจัดชิดขอบสองข้าง PDF ไม่มีอักขระช่องว่าง จึงกำหนดช่องว่างจากระยะห่างระหว่างคำ
#   โดยเทียบหัวตารางกับหน้า "สาระวิทยาศาสตร์เพิ่มเติม" (หน้า 129-131) จุดที่ตัดบรรทัดตรงกันทั้งสองแห่งตัดสินจากวลี

id: th-core-2560-biology-additional
title: "ผลการเรียนรู้รายวิชาเพิ่มเติม สาระชีววิทยา กลุ่มสาระการเรียนรู้วิทยาศาสตร์ (ฉบับปรับปรุง พ.ศ. 2560) ตามหลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พุทธศักราช 2551"
short: "ชีววิทยาเพิ่มเติม 2560"
kind: national-curriculum
subjects: [biology]
language: th
sources:
  - { title: "ตัวชี้วัดและสาระการเรียนรู้แกนกลาง กลุ่มสาระการเรียนรู้วิทยาศาสตร์ (ฉบับปรับปรุง พ.ศ. ๒๕๖๐) ตามหลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พุทธศักราช ๒๕๕๑ ส่วนผลการเรียนรู้และสาระการเรียนรู้เพิ่มเติม", url: "https://www.ipst.ac.th/wp-content/uploads/2022/05/SciCurriculum_2560.pdf", publisher: "สพฐ. กระทรวงศึกษาธิการ และ สสวท.", retrieved: "2026-10-24", pages: "129, 135-168 (เลขหน้าที่พิมพ์ในเล่ม)" }
copyright: "ต้นฉบับเป็นหนังสือที่ สพฐ. กระทรวงศึกษาธิการ จัดพิมพ์และเผยแพร่ (พ.ศ. 2560) ให้สถานศึกษาใช้เป็นกรอบพัฒนาหลักสูตร คำนำระบุว่ากระทรวงศึกษาธิการโดย สสวท. เป็นผู้จัดทำมาตรฐานการเรียนรู้และตัวชี้วัด คลังรู้ตีความว่าเป็นเอกสารของหน่วยงานรัฐที่ไม่เป็นงานอันมีลิขสิทธิ์ตาม พ.ร.บ.ลิขสิทธิ์ พ.ศ. 2537 มาตรา 7 (เป็นการตีความของเรา ไม่ใช่คำวินิจฉัยทางกฎหมาย)"
completeness: full-text
strands:
  - id: "ชีววิทยา"
    title: "สาระชีววิทยา"
    standards:
      - id: "ชีววิทยา 1"
        text: "เข้าใจธรรมชาติของสิ่งมีชีวิต การศึกษาชีววิทยาและวิธีการทางวิทยาศาสตร์ สารที่เป็นองค์ประกอบของสิ่งมีชีวิต ปฏิกิริยาเคมีในเซลล์ของสิ่งมีชีวิต กล้องจุลทรรศน์ โครงสร้างและหน้าที่ของเซลล์ การลำเลียงสารเข้าและออกจากเซลล์ การแบ่งเซลล์ และการหายใจระดับเซลล์"
        indicators:
          - { id: "ชีววิทยา 1 ม.4/1", level: "ม.4", text: "อธิบาย และสรุปสมบัติที่สำคัญของสิ่งมีชีวิต และความสัมพันธ์ของการจัดระบบในสิ่งมีชีวิต ที่ทำให้สิ่งมีชีวิตดำรงชีวิตอยู่ได้" }
          - { id: "ชีววิทยา 1 ม.4/2", level: "ม.4", text: "อภิปราย และบอกความสำคัญของการระบุปัญหา ความสัมพันธ์ระหว่างปัญหา สมมติฐาน และวิธีการตรวจสอบสมมติฐาน รวมทั้งออกแบบการทดลองเพื่อตรวจสอบสมมติฐาน" }
          - { id: "ชีววิทยา 1 ม.4/3", level: "ม.4", text: "สืบค้นข้อมูล อธิบายเกี่ยวกับสมบัติของน้ำ และบอกความสำคัญของน้ำที่มีต่อสิ่งมีชีวิต และยกตัวอย่างธาตุชนิดต่าง ๆ ที่มีความสำคัญต่อร่างกายสิ่งมีชีวิต" }
          - { id: "ชีววิทยา 1 ม.4/4", level: "ม.4", text: "สืบค้นข้อมูล อธิบายโครงสร้างของคาร์โบไฮเดรตระบุกลุ่มของคาร์โบไฮเดรต รวมทั้งความสำคัญของคาร์โบไฮเดรตที่มีต่อสิ่งมีชีวิต" }
          - { id: "ชีววิทยา 1 ม.4/5", level: "ม.4", text: "สืบค้นข้อมูล อธิบายโครงสร้างของโปรตีน และความสำคัญของโปรตีนที่มีต่อสิ่งมีชีวิต" }
          - { id: "ชีววิทยา 1 ม.4/6", level: "ม.4", text: "สืบค้นข้อมูล อธิบายโครงสร้างของลิพิด และความสำคัญของลิพิดที่มีต่อสิ่งมีชีวิต" }
          - { id: "ชีววิทยา 1 ม.4/7", level: "ม.4", text: "อธิบายโครงสร้างของกรดนิวคลิอิก และระบุชนิดของกรดนิวคลิอิก และความสำคัญของ กรดนิวคลิอิกที่มีต่อสิ่งมีชีวิต" }
          - { id: "ชีววิทยา 1 ม.4/8", level: "ม.4", text: "สืบค้นข้อมูล และอธิบายปฏิกิริยาเคมีที่เกิดขึ้นในสิ่งมีชีวิต" }
          - { id: "ชีววิทยา 1 ม.4/9", level: "ม.4", text: "อธิบายการทำงานของเอนไซม์ในการเร่งปฏิกิริยาเคมีในสิ่งมีชีวิต และระบุปัจจัยที่มีผลต่อการทำงานของเอนไซม์" }
          - { id: "ชีววิทยา 1 ม.4/10", level: "ม.4", text: "บอกวิธีการ และเตรียมตัวอย่างสิ่งมีชีวิต เพื่อศึกษาภายใต้กล้องจุลทรรศน์ใช้แสง วัดขนาดโดยประมาณ และวาดภาพที่ปรากฏภายใต้กล้อง บอกวิธีการใช้ และการดูแลรักษากล้องจุลทรรศน์ใช้แสงที่ถูกต้อง" }
          - { id: "ชีววิทยา 1 ม.4/11", level: "ม.4", text: "อธิบายโครงสร้างและหน้าที่ของส่วนที่ห่อหุ้มเซลล์ของเซลล์พืชและเซลล์สัตว์" }
          - { id: "ชีววิทยา 1 ม.4/12", level: "ม.4", text: "สืบค้นข้อมูล อธิบาย และระบุชนิดและหน้าที่ของออร์แกเนลล์" }
          - { id: "ชีววิทยา 1 ม.4/13", level: "ม.4", text: "อธิบายโครงสร้างและหน้าที่ของนิวเคลียส" }
          - { id: "ชีววิทยา 1 ม.4/14", level: "ม.4", text: "อธิบาย และเปรียบเทียบการแพร่ ออสโมซิส การแพร่แบบฟาซิลิเทต และแอกทีฟทรานสปอร์ต" }
          - { id: "ชีววิทยา 1 ม.4/15", level: "ม.4", text: "สืบค้นข้อมูล อธิบาย และเขียนแผนภาพ การลำเลียงสารโมเลกุลใหญ่ออกจากเซลล์ ด้วยกระบวนการเอกโซไซโทซิสและการลำเลียงสารโมเลกุลใหญ่เข้าสู่เซลล์ด้วยกระบวนการ เอนโดไซโทซิส" }
          - { id: "ชีววิทยา 1 ม.4/16", level: "ม.4", text: "สังเกตการแบ่งนิวเคลียสแบบไมโทซิสและแบบไมโอซิสจากตัวอย่างภายใต้กล้องจุลทรรศน์พร้อมทั้งอธิบายและเปรียบเทียบการแบ่งนิวเคลียสแบบไมโทซิส และแบบไมโอซิส" }
          - { id: "ชีววิทยา 1 ม.4/17", level: "ม.4", text: "อธิบาย เปรียบเทียบ และสรุปขั้นตอน การหายใจระดับเซลล์ในภาวะที่มีออกซิเจนเพียงพอ และภาวะที่มีออกซิเจนไม่เพียงพอ" }
      - id: "ชีววิทยา 2"
        text: "เข้าใจการถ่ายทอดลักษณะทางพันธุกรรม การถ่ายทอดยีนบนโครโมโซม สมบัติและหน้าที่ของสารพันธุกรรม การเกิดมิวเทชัน เทคโนโลยีทางดีเอ็นเอ หลักฐานข้อมูลและแนวคิดเกี่ยวกับวิวัฒนาการของสิ่งมีชีวิต ภาวะสมดุลของฮาร์ดี-ไวน์เบิร์ก การเกิดสปีชีส์ใหม่ ความหลากหลายทางชีวภาพ กำเนิดของสิ่งมีชีวิต ความหลากหลายของสิ่งมีชีวิต และอนุกรมวิธาน รวมทั้งนำความรู้ไปใช้ประโยชน์"
        indicators:
          - { id: "ชีววิทยา 2 ม.4/1", level: "ม.4", text: "สืบค้นข้อมูล อธิบาย และสรุปผลการทดลอง ของเมนเดล" }
          - { id: "ชีววิทยา 2 ม.4/2", level: "ม.4", text: "อธิบาย และสรุปกฎแห่งการแยก และ กฎแห่งการรวมกลุ่มอย่างอิสระ และนำกฎของ เมนเดลนี้ ไปอธิบายการถ่ายทอดลักษณะทางพันธุกรรมและใช้ในการคำนวณโอกาสในการเกิดฟีโนไทป์และจีโนไทป์แบบต่าง ๆ ของรุ่น F1 และ F2" }
          - { id: "ชีววิทยา 2 ม.4/3", level: "ม.4", text: "สืบค้นข้อมูล วิเคราะห์ อธิบาย และสรุปเกี่ยวกับการถ่ายทอดลักษณะทางพันธุกรรม ที่เป็น ส่วนขยายของพันธุศาสตร์เมนเดล" }
          - { id: "ชีววิทยา 2 ม.4/4", level: "ม.4", text: "สืบค้นข้อมูล วิเคราะห์ และเปรียบเทียบลักษณะทางพันธุกรรมที่มีการแปรผันไม่ต่อเนื่อง และลักษณะทางพันธุกรรมที่มีการแปรผัน ต่อเนื่อง" }
          - { id: "ชีววิทยา 2 ม.4/5", level: "ม.4", text: "อธิบายการถ่ายทอดยีนบนโครโมโซม และ ยกตัวอย่างลักษณะทางพันธุกรรมที่ถูกควบคุม ด้วยยีนบนออโตโซมและยีนบนโครโมโซมเพศ" }
          - { id: "ชีววิทยา 2 ม.4/6", level: "ม.4", text: "สืบค้นข้อมูล อธิบายสมบัติและหน้าที่ของ สารพันธุกรรม โครงสร้างและองค์ประกอบ ทางเคมีของ DNA และสรุปการจำลอง DNA" }
          - { id: "ชีววิทยา 2 ม.4/7", level: "ม.4", text: "อธิบาย และระบุขั้นตอนในกระบวนการสังเคราะห์โปรตีนและหน้าที่ของ DNA และ RNA แต่ละชนิดในกระบวนการสังเคราะห์ โปรตีน" }
          - { id: "ชีววิทยา 2 ม.4/8", level: "ม.4", text: "สรุปความสัมพันธ์ระหว่างสารพันธุกรรม แอลลีลโปรตีน ลักษณะทางพันธุกรรม และเชื่อมโยงกับความรู้เรื่องพันธุศาสตร์เมนเดล" }
          - { id: "ชีววิทยา 2 ม.4/9", level: "ม.4", text: "สืบค้นข้อมูล และอธิบายการเกิดมิวเทชัน ระดับยีนและระดับโครโมโซม สาเหตุการเกิด มิวเทชัน รวมทั้งยกตัวอย่างโรคและกลุ่มอาการที่เป็นผลของการเกิดมิวเทชัน" }
          - { id: "ชีววิทยา 2 ม.4/10", level: "ม.4", text: "อธิบายหลักการสร้างสิ่งมีชีวิตดัดแปรพันธุกรรมโดยใช้ดีเอ็นเอรีคอมบิแนนท์" }
          - { id: "ชีววิทยา 2 ม.4/11", level: "ม.4", text: "สืบค้นข้อมูล ยกตัวอย่าง และอภิปรายการนำเทคโนโลยีทางดีเอ็นเอไปประยุกต์ใช้ทั้งในด้านสิ่งแวดล้อม นิติวิทยาศาสตร์ การแพทย์ การเกษตรและอุตสาหกรรม และข้อควรคำนึงถึงด้านชีวจริยธรรม" }
          - { id: "ชีววิทยา 2 ม.4/12", level: "ม.4", text: "สืบค้นข้อมูล และอธิบายเกี่ยวกับหลักฐาน ที่สนับสนุนและข้อมูลที่ใช้อธิบายการเกิดวิวัฒนาการของสิ่งมีชีวิต" }
          - { id: "ชีววิทยา 2 ม.4/13", level: "ม.4", text: "อธิบาย และเปรียบเทียบแนวคิดเกี่ยวกับวิวัฒนาการของสิ่งมีชีวิตของฌอง ลามาร์ก และทฤษฎีเกี่ยวกับวิวัฒนาการของสิ่งมีชีวิตของชาลส์ ดาร์วิน" }
          - { id: "ชีววิทยา 2 ม.4/14", level: "ม.4", text: "ระบุสาระสำคัญ และอธิบายเงื่อนไขของภาวะสมดุลของฮาร์ดี-ไวน์เบิร์ก ปัจจัยที่ทำให้เกิดการเปลี่ยนแปลงความถี่ของแอลลีล ในประชากร พร้อมทั้งคำนวณหาความถี่ ของแอลลีลและจีโนไทป์ของประชากร โดยใช้หลักของฮาร์ดี-ไวน์เบิร์ก" }
          - { id: "ชีววิทยา 2 ม.4/15", level: "ม.4", text: "สืบค้นข้อมูล อภิปราย และอธิบายกระบวนการเกิดสปีชีส์ใหม่ของสิ่งมีชีวิต" }
          - { id: "ชีววิทยา 2 ม.6/1", level: "ม.6", text: "อภิปรายความสำคัญของความหลากหลายทางชีวภาพ และความเชื่อมโยงระหว่าง ความหลากหลายทางพันธุกรรม ความหลากหลายของสปีชีส์ และความหลากหลายของระบบนิเวศ" }
          - { id: "ชีววิทยา 2 ม.6/2", level: "ม.6", text: "อธิบายการเกิดเซลล์เริ่มแรกของสิ่งมีชีวิต และวิวัฒนาการของสิ่งมีชีวิตเซลล์เดียว" }
          - { id: "ชีววิทยา 2 ม.6/3", level: "ม.6", text: "อธิบายลักษณะสำคัญ และยกตัวอย่างสิ่งมีชีวิตกลุ่มแบคทีเรีย สิ่งมีชีวิตกลุ่มโพรทิสต์ สิ่งมีชีวิตกลุ่มพืช สิ่งมีชีวิตกลุ่มฟังไจ และสิ่งมีชีวิต กลุ่มสัตว์" }
          - { id: "ชีววิทยา 2 ม.6/4", level: "ม.6", text: "อธิบาย และยกตัวอย่างการจำแนกสิ่งมีชีวิต จากหมวดหมู่ใหญ่จนถึงหมวดหมู่ย่อย และวิธีการเขียนชื่อวิทยาศาสตร์ในลำดับขั้นสปีชีส์" }
          - { id: "ชีววิทยา 2 ม.6/5", level: "ม.6", text: "สร้างไดโคโทมัสคีย์ในการระบุสิ่งมีชีวิตหรือตัวอย่างที่กำหนดออกเป็นหมวดหมู่" }
      - id: "ชีววิทยา 3"
        text: "เข้าใจส่วนประกอบของพืช การแลกเปลี่ยนแก๊สและคายน้ำของพืช การลำเลียงของพืช การสังเคราะห์ด้วยแสง การสืบพันธุ์ของพืชดอกและการเจริญเติบโต และการตอบสนองของพืช รวมทั้งนำความรู้ไปใช้ประโยชน์"
        indicators:
          - { id: "ชีววิทยา 3 ม.5/1", level: "ม.5", text: "อธิบายเกี่ยวกับชนิดและลักษณะของเนื้อเยื่อพืช และเขียนแผนผังเพื่อสรุปชนิดของเนื้อเยื่อพืช" }
          - { id: "ชีววิทยา 3 ม.5/2", level: "ม.5", text: "สังเกต อธิบาย และเปรียบเทียบโครงสร้างภายในของรากพืชใบเลี้ยงเดี่ยวและรากพืช ใบเลี้ยงคู่จากการตัดตามขวาง" }
          - { id: "ชีววิทยา 3 ม.5/3", level: "ม.5", text: "สังเกต อธิบาย และเปรียบเทียบโครงสร้างภายในของลำต้นพืชใบเลี้ยงเดี่ยวและลำต้นพืชใบเลี้ยงคู่จากการตัดตามขวาง" }
          - { id: "ชีววิทยา 3 ม.5/4", level: "ม.5", text: "สังเกต และอธิบายโครงสร้างภายในของใบพืชจากการตัดตามขวาง" }
          - { id: "ชีววิทยา 3 ม.5/5", level: "ม.5", text: "สืบค้นข้อมูล สังเกต และอธิบายการแลกเปลี่ยนแก๊สและการคายน้ำของพืช" }
          - { id: "ชีววิทยา 3 ม.5/6", level: "ม.5", text: "สืบค้นข้อมูล และอธิบายกลไกการลำเลียงน้ำและธาตุอาหารของพืช" }
          - { id: "ชีววิทยา 3 ม.5/7", level: "ม.5", text: "สืบค้นข้อมูล อธิบายความสำคัญของธาตุอาหาร และยกตัวอย่างธาตุอาหารที่สำคัญที่มีผลต่อ การเจริญเติบโตของพืช" }
          - { id: "ชีววิทยา 3 ม.5/8", level: "ม.5", text: "อธิบายกลไกการลำเลียงอาหารในพืช" }
          - { id: "ชีววิทยา 3 ม.5/9", level: "ม.5", text: "สืบค้นข้อมูล และสรุปการศึกษาที่ได้จากการทดลองของนักวิทยาศาสตร์ในอดีตเกี่ยวกับกระบวนการสังเคราะห์ด้วยแสง" }
          - { id: "ชีววิทยา 3 ม.5/10", level: "ม.5", text: "อธิบายขั้นตอนที่เกิดขึ้นในกระบวนการสังเคราะห์ด้วยแสงของพืช C3" }
          - { id: "ชีววิทยา 3 ม.5/11", level: "ม.5", text: "เปรียบเทียบกลไกการตรึงคาร์บอนไดออกไซด์ในพืช C3 พืช C4 และ พืช CAM" }
          - { id: "ชีววิทยา 3 ม.5/12", level: "ม.5", text: "สืบค้นข้อมูล อภิปราย และสรุปปัจจัยความเข้มของแสง ความเข้มข้นของคาร์บอนไดออกไซด์ และอุณหภูมิ ที่มีผลต่อการสังเคราะห์ด้วยแสงของพืช" }
          - { id: "ชีววิทยา 3 ม.5/13", level: "ม.5", text: "อธิบายวัฏจักรชีวิตแบบสลับของพืชดอก" }
          - { id: "ชีววิทยา 3 ม.5/14", level: "ม.5", text: "อธิบาย และเปรียบเทียบกระบวนการสร้างเซลล์สืบพันธุ์เพศผู้และเพศเมียของพืชดอก และอธิบายการปฏิสนธิของพืชดอก" }
          - { id: "ชีววิทยา 3 ม.5/15", level: "ม.5", text: "อธิบายการเกิดเมล็ดและการเกิดผลของพืชดอกโครงสร้างของเมล็ดและผล และยกตัวอย่างการใช้ประโยชน์จากโครงสร้างต่าง ๆ ของเมล็ดและผล" }
          - { id: "ชีววิทยา 3 ม.5/16", level: "ม.5", text: "ทดลอง และอธิบายเกี่ยวกับปัจจัยต่าง ๆ ที่มีผลต่อการงอกของเมล็ด สภาพพักตัวของเมล็ดและบอกแนวทางในการแก้สภาพพักตัว ของเมล็ด" }
          - { id: "ชีววิทยา 3 ม.5/17", level: "ม.5", text: "สืบค้นข้อมูล อธิบายบทบาทและหน้าที่ของออกซิน ไซโทไคนิน จิบเบอเรลลิน เอทิลีน และกรดแอบไซซิก และอภิปรายเกี่ยวกับการนำไปใช้ประโยชน์ทางการเกษตร" }
          - { id: "ชีววิทยา 3 ม.5/18", level: "ม.5", text: "สืบค้นข้อมูล ทดลอง และอภิปรายเกี่ยวกับ สิ่งเร้าภายนอกที่มีผลต่อการเจริญเติบโต ของพืช" }
      - id: "ชีววิทยา 4"
        text: "เข้าใจการย่อยอาหารของสัตว์และมนุษย์ การหายใจและการแลกเปลี่ยนแก๊ส การลำเลียงสารและการหมุนเวียนเลือด ภูมิคุ้มกันของร่างกาย การขับถ่าย การรับรู้และการตอบสนอง การเคลื่อนที่ การสืบพันธุ์และการเจริญเติบโต ฮอร์โมนกับการรักษาดุลยภาพ และพฤติกรรมของสัตว์ รวมทั้งนำความรู้ไปใช้ประโยชน์"
        indicators:
          - { id: "ชีววิทยา 4 ม.5/1", level: "ม.5", text: "สืบค้นข้อมูล อธิบาย และเปรียบเทียบโครงสร้างและกระบวนการย่อยอาหารของสัตว์ที่ไม่มี ทางเดินอาหาร สัตว์ที่มีทางเดินอาหาร แบบไม่สมบูรณ์ และสัตว์ที่มีทางเดินอาหาร แบบสมบูรณ์" }
          - { id: "ชีววิทยา 4 ม.5/2", level: "ม.5", text: "สังเกต อธิบาย การกินอาหารของไฮดรา และพลานาเรีย" }
          - { id: "ชีววิทยา 4 ม.5/3", level: "ม.5", text: "อธิบายเกี่ยวกับโครงสร้าง หน้าที่ และกระบวนการย่อยอาหาร และการดูดซึม สารอาหารภายในระบบย่อยอาหารของมนุษย์" }
          - { id: "ชีววิทยา 4 ม.5/4", level: "ม.5", text: "สืบค้นข้อมูล อธิบาย และเปรียบเทียบโครงสร้างที่ทำหน้าที่แลกเปลี่ยนแก๊สของฟองน้ำ ไฮดรา พลานาเรีย ไส้เดือนดิน แมลง ปลา กบ และนก" }
          - { id: "ชีววิทยา 4 ม.5/5", level: "ม.5", text: "สังเกต และอธิบายโครงสร้างของปอดในสัตว์เลี้ยงลูกด้วยน้ำนม" }
          - { id: "ชีววิทยา 4 ม.5/6", level: "ม.5", text: "สืบค้นข้อมูล อธิบายโครงสร้างที่ใช้ในการ แลกเปลี่ยนแก๊ส และกระบวนการแลกเปลี่ยนแก๊สของมนุษย์" }
          - { id: "ชีววิทยา 4 ม.5/7", level: "ม.5", text: "อธิบายการทำงานของปอด และทดลองวัดปริมาตรของอากาศในการหายใจออกของมนุษย์" }
          - { id: "ชีววิทยา 4 ม.5/8", level: "ม.5", text: "สืบค้นข้อมูล อธิบาย และเปรียบเทียบระบบหมุนเวียนเลือดแบบเปิดและระบบหมุนเวียนเลือดแบบปิด" }
          - { id: "ชีววิทยา 4 ม.5/9", level: "ม.5", text: "สังเกต และอธิบายทิศทางการไหลของเลือดและการเคลื่อนที่ของเซลล์เม็ดเลือดในหางปลา และสรุปความสัมพันธ์ระหว่างขนาดของหลอดเลือดกับความเร็วในการไหลของเลือด" }
          - { id: "ชีววิทยา 4 ม.5/10", level: "ม.5", text: "อธิบายโครงสร้างและการทำงานของหัวใจ และหลอดเลือดในมนุษย์" }
          - { id: "ชีววิทยา 4 ม.5/11", level: "ม.5", text: "สังเกต และอธิบายโครงสร้างหัวใจของสัตว์เลี้ยงลูกด้วยน้ำนม ทิศทางการไหลของเลือดผ่านหัวใจของมนุษย์ และเขียนแผนผังสรุป การหมุนเวียนเลือดของมนุษย์" }
          - { id: "ชีววิทยา 4 ม.5/12", level: "ม.5", text: "สืบค้นข้อมูล ระบุความแตกต่างของ เซลล์เม็ดเลือดแดง เซลล์เม็ดเลือดขาว เพลตเลต และพลาสมา" }
          - { id: "ชีววิทยา 4 ม.5/13", level: "ม.5", text: "อธิบายหมู่เลือดและหลักการให้และรับเลือดในระบบ ABO และระบบ Rh" }
          - { id: "ชีววิทยา 4 ม.5/14", level: "ม.5", text: "อธิบาย และสรุปเกี่ยวกับส่วนประกอบและหน้าที่ของน้ำเหลือง รวมทั้งโครงสร้างและหน้าที่ของหลอดน้ำเหลือง และต่อมน้ำเหลือง" }
          - { id: "ชีววิทยา 4 ม.5/15", level: "ม.5", text: "สืบค้นข้อมูล อธิบาย และเปรียบเทียบกลไกการต่อต้านหรือทำลายสิ่งแปลกปลอม แบบไม่จำเพาะและแบบจำเพาะ" }
          - { id: "ชีววิทยา 4 ม.5/16", level: "ม.5", text: "สืบค้นข้อมูล อธิบาย และเปรียบเทียบ การสร้างภูมิคุ้มกันก่อเองและภูมิคุ้มกันรับมา" }
          - { id: "ชีววิทยา 4 ม.5/17", level: "ม.5", text: "สืบค้นข้อมูล และอธิบายเกี่ยวกับความผิดปกติของระบบภูมิคุ้มกันที่ทำให้เกิดเอดส์ ภูมิแพ้ การสร้างภูมิต้านทานต่อเนื้อเยื่อตนเอง" }
          - { id: "ชีววิทยา 4 ม.5/18", level: "ม.5", text: "สืบค้นข้อมูล อธิบาย และเปรียบเทียบโครงสร้างและหน้าที่ในการกำจัดของเสีย ออกจากร่างกายของฟองน้ำ ไฮดรา พลานาเรียไส้เดือนดิน แมลง และสัตว์มีกระดูกสันหลัง" }
          - { id: "ชีววิทยา 4 ม.5/19", level: "ม.5", text: "อธิบายโครงสร้างและหน้าที่ของไต และโครงสร้างที่ใช้ลำเลียงปัสสาวะออกจากร่างกาย" }
          - { id: "ชีววิทยา 4 ม.5/20", level: "ม.5", text: "อธิบายกลไกการทำงานของหน่วยไต ในการกำจัดของเสียออกจากร่างกาย และเขียนแผนผังสรุปขั้นตอนการกำจัดของเสีย ออกจากร่างกายโดยหน่วยไต" }
          - { id: "ชีววิทยา 4 ม.5/21", level: "ม.5", text: "สืบค้นข้อมูล อธิบาย และยกตัวอย่างเกี่ยวกับความผิดปกติของไตอันเนื่องมาจากโรคต่าง ๆ" }
          - { id: "ชีววิทยา 4 ม.6/1", level: "ม.6", text: "สืบค้นข้อมูล อธิบาย และเปรียบเทียบโครงสร้างและหน้าที่ของระบบประสาทของไฮดรา พลานาเรีย ไส้เดือนดิน กุ้ง หอย แมลง และสัตว์มีกระดูกสันหลัง" }
          - { id: "ชีววิทยา 4 ม.6/2", level: "ม.6", text: "อธิบายเกี่ยวกับโครงสร้างและหน้าที่ของ เซลล์ประสาท" }
          - { id: "ชีววิทยา 4 ม.6/3", level: "ม.6", text: "อธิบายเกี่ยวกับการเปลี่ยนแปลงของศักย์ไฟฟ้าที่เยื่อหุ้มเซลล์ของเซลล์ประสาท และกลไก การถ่ายทอดกระแสประสาท" }
          - { id: "ชีววิทยา 4 ม.6/4", level: "ม.6", text: "อธิบาย และสรุปเกี่ยวกับโครงสร้างของระบบประสาทส่วนกลางและระบบประสาทรอบนอก" }
          - { id: "ชีววิทยา 4 ม.6/5", level: "ม.6", text: "สืบค้นข้อมูล อธิบายโครงสร้างและหน้าที่ของส่วนต่าง ๆ ในสมองส่วนหน้า สมองส่วนกลาง สมองส่วนหลัง และไขสันหลัง" }
          - { id: "ชีววิทยา 4 ม.6/6", level: "ม.6", text: "สืบค้นข้อมูล อธิบาย เปรียบเทียบ และ ยกตัวอย่างการทำงานของระบบประสาท โซมาติก และระบบประสาทอัตโนวัติ" }
          - { id: "ชีววิทยา 4 ม.6/7", level: "ม.6", text: "สืบค้นข้อมูล อธิบายโครงสร้างและหน้าที่ของ ตา หู จมูก ลิ้น และผิวหนังของมนุษย์ ยกตัวอย่างโรคต่าง ๆ ที่เกี่ยวข้อง และบอกแนวทางในการดูแลป้องกัน และรักษา" }
          - { id: "ชีววิทยา 4 ม.6/8", level: "ม.6", text: "สังเกต และอธิบายการหาตำแหน่งของจุดบอด โฟเวีย และความไวในการรับสัมผัสของผิวหนัง" }
          - { id: "ชีววิทยา 4 ม.6/9", level: "ม.6", text: "สืบค้นข้อมูล อธิบาย และเปรียบเทียบโครงสร้างและหน้าที่ของอวัยวะที่เกี่ยวข้องกับการเคลื่อนที่ของแมงกะพรุน หมึก ดาวทะเล ไส้เดือนดิน แมลง ปลา และนก" }
          - { id: "ชีววิทยา 4 ม.6/10", level: "ม.6", text: "สืบค้นข้อมูล และอธิบายโครงสร้างและหน้าที่ของกระดูกและกล้ามเนื้อที่เกี่ยวข้องกับการเคลื่อนไหวและการเคลื่อนที่ของมนุษย์" }
          - { id: "ชีววิทยา 4 ม.6/11", level: "ม.6", text: "สังเกต และอธิบายการทำงานของข้อต่อชนิดต่าง ๆ และการทำงานของกล้ามเนื้อโครงร่างที่เกี่ยวข้องกับการเคลื่อนไหวและการเคลื่อนที่ของมนุษย์" }
          - { id: "ชีววิทยา 4 ม.6/12", level: "ม.6", text: "สืบค้นข้อมูล อธิบาย และยกตัวอย่าง การสืบพันธุ์แบบไม่อาศัยเพศและการสืบพันธุ์แบบอาศัยเพศในสัตว์" }
          - { id: "ชีววิทยา 4 ม.6/13", level: "ม.6", text: "สืบค้นข้อมูล อธิบายโครงสร้างและหน้าที่ของอวัยวะในระบบสืบพันธุ์เพศชายและระบบสืบพันธุ์เพศหญิง" }
          - { id: "ชีววิทยา 4 ม.6/14", level: "ม.6", text: "อธิบายกระบวนการสร้างสเปิร์ม กระบวนการสร้างเซลล์ไข่ และการปฏิสนธิในมนุษย์" }
          - { id: "ชีววิทยา 4 ม.6/15", level: "ม.6", text: "อธิบายการเจริญเติบโตระยะเอ็มบริโอ และระยะหลังเอ็มบริโอของกบ ไก่ และมนุษย์" }
          - { id: "ชีววิทยา 4 ม.6/16", level: "ม.6", text: "สืบค้นข้อมูล อธิบาย และเขียนแผนผังสรุปหน้าที่ของฮอร์โมนจากต่อมไร้ท่อและเนื้อเยื่อ ที่สร้างฮอร์โมน" }
          - { id: "ชีววิทยา 4 ม.6/17", level: "ม.6", text: "สืบค้นข้อมูล อธิบาย เปรียบเทียบ และ ยกตัวอย่างพฤติกรรมที่เป็นมาแต่กำเนิด และพฤติกรรมที่เกิดจากการเรียนรู้ของสัตว์" }
          - { id: "ชีววิทยา 4 ม.6/18", level: "ม.6", text: "สืบค้นข้อมูล อธิบาย และยกตัวอย่าง ความสัมพันธ์ระหว่างพฤติกรรมกับวิวัฒนาการของระบบประสาท" }
          - { id: "ชีววิทยา 4 ม.6/19", level: "ม.6", text: "สืบค้นข้อมูล อธิบาย และยกตัวอย่างการสื่อสารระหว่างสัตว์ที่ทำให้สัตว์แสดงพฤติกรรม" }
      - id: "ชีววิทยา 5"
        text: "เข้าใจแนวคิดเกี่ยวกับระบบนิเวศ กระบวนการถ่ายทอดพลังงานและการหมุนเวียนสารในระบบนิเวศ ความหลากหลายของไบโอม การเปลี่ยนแปลงแทนที่ของสิ่งมีชีวิตในระบบนิเวศ ประชากรและรูปแบบการเพิ่มของประชากร ทรัพยากรธรรมชาติและสิ่งแวดล้อม ปัญหาและผลกระทบที่เกิดจากการใช้ประโยชน์ และแนวทางการแก้ไขปัญหา"
        indicators:
          - { id: "ชีววิทยา 5 ม.6/1", level: "ม.6", text: "วิเคราะห์ อธิบาย และยกตัวอย่างกระบวนการถ่ายทอดพลังงานในระบบนิเวศ" }
          - { id: "ชีววิทยา 5 ม.6/2", level: "ม.6", text: "อธิบาย ยกตัวอย่างการเกิดไบโอแมกนิฟิเคชัน และบอกแนวทางในการลดการเกิด ไบโอแมกนิฟิเคชัน" }
          - { id: "ชีววิทยา 5 ม.6/3", level: "ม.6", text: "สืบค้นข้อมูล และเขียนแผนภาพ เพื่ออธิบายวัฏจักรไนโตรเจน วัฏจักรกำมะถัน และวัฏจักรฟอสฟอรัส" }
          - { id: "ชีววิทยา 5 ม.6/4", level: "ม.6", text: "สืบค้นข้อมูล ยกตัวอย่าง และอธิบายลักษณะของไบโอมที่กระจายอยู่ตามเขตภูมิศาสตร์ต่าง ๆบนโลก" }
          - { id: "ชีววิทยา 5 ม.6/5", level: "ม.6", text: "สืบค้นข้อมูล ยกตัวอย่าง อธิบาย และเปรียบเทียบการเปลี่ยนแปลงแทนที่แบบปฐมภูมิ และ การเปลี่ยนแปลงแทนที่แบบทุติยภูมิ" }
          - { id: "ชีววิทยา 5 ม.6/6", level: "ม.6", text: "สืบค้นข้อมูล อธิบาย ยกตัวอย่าง และสรุป เกี่ยวกับลักษณะเฉพาะของประชากรของ สิ่งมีชีวิตบางชนิด" }
          - { id: "ชีววิทยา 5 ม.6/7", level: "ม.6", text: "สืบค้นข้อมูล อธิบาย เปรียบเทียบ และยกตัวอย่างการเพิ่มของประชากรแบบเอ็กโพเนนเชียล และการเพิ่มของประชากรแบบลอจิสติก" }
          - { id: "ชีววิทยา 5 ม.6/8", level: "ม.6", text: "อธิบาย และยกตัวอย่างปัจจัยที่ควบคุมการเติบโตของประชากร" }
          - { id: "ชีววิทยา 5 ม.6/9", level: "ม.6", text: "วิเคราะห์ อภิปราย และสรุปปัญหา การขาดแคลนน้ำ การเกิดมลพิษทางน้ำ และ ผลกระทบที่มีต่อมนุษย์และสิ่งแวดล้อม รวมทั้งเสนอแนวทางการวางแผนการจัดการน้ำ และการแก้ไขปัญหา" }
          - { id: "ชีววิทยา 5 ม.6/10", level: "ม.6", text: "วิเคราะห์ อภิปราย และสรุปปัญหามลพิษทางอากาศ และผลกระทบที่มีต่อมนุษย์และ สิ่งแวดล้อม รวมทั้งเสนอแนวทางการแก้ไขปัญหา" }
          - { id: "ชีววิทยา 5 ม.6/11", level: "ม.6", text: "วิเคราะห์ อภิปราย และสรุปปัญหาที่เกิดกับทรัพยากรดิน และผลกระทบที่มีต่อมนุษย์และสิ่งแวดล้อม รวมทั้งเสนอแนวทางการแก้ไขปัญหา" }
          - { id: "ชีววิทยา 5 ม.6/12", level: "ม.6", text: "วิเคราะห์ อภิปราย และสรุปปัญหา ผลกระทบที่เกิดจากการทำลายป่าไม้ รวมทั้งเสนอแนวทางในการป้องกันการทำลายป่าไม้และการอนุรักษ์ป่าไม้" }
          - { id: "ชีววิทยา 5 ม.6/13", level: "ม.6", text: "วิเคราะห์ อภิปราย และสรุปปัญหา ผลกระทบที่ทำให้สัตว์ป่ามีจำนวนลดลง และแนวทาง ในการอนุรักษ์สัตว์ป่า" }
