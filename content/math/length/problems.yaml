problems:
  - id: math.measure.length.p001
    topics: [math.measure.length]
    difficulty: 1
    type: mcq
    stem: "ไม้บรรทัดยาวกว่ายางลบ และยางลบยาวกว่าคลิปหนีบกระดาษ สิ่งใดสั้นที่สุด"
    choices:
      - { id: a, text: "คลิปหนีบกระดาษ", correct: true }
      - { id: b, text: "ยางลบ", feedback: "ยางลบยาวกว่าคลิป จึงไม่ใช่สิ่งที่สั้นที่สุด" }
      - { id: c, text: "ไม้บรรทัด", feedback: "ไม้บรรทัดยาวกว่ายางลบ และยางลบยาวกว่าคลิป ไม้บรรทัดจึงยาวที่สุด" }
    hints:
      - "เรียงจากยาวไปสั้น เริ่มจากไม้บรรทัด"
      - "ไม้บรรทัด > ยางลบ > คลิป"
    solution: "ไม้บรรทัดยาวกว่ายางลบ ยางลบยาวกว่าคลิป จึงเรียงจากยาวไปสั้นได้ ไม้บรรทัด ยางลบ คลิป คลิปสั้นที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.length.p002
    topics: [math.measure.length]
    difficulty: 1
    type: numeric
    stem: "ดูภาพ ริบบิ้นยาวกี่คลิป (ตอบเป็นจำนวนคลิป)"
    figure: { src: clips-ribbon.svg, alt: "ริบบิ้นสีชมพูหนึ่งเส้น ใต้ริบบิ้นมีคลิปหนีบกระดาษขนาดเท่ากันวางต่อกันพอดีกับความยาวริบบิ้น ไม่เว้นช่องและไม่ซ้อน นับได้ 6 อัน ด้านล่างมีดินสอสี 1 แท่ง เขียนว่าดินสอสี 1 แท่ง ยาวเท่าคลิป 2 อัน" }
    answer: { value: 6, unit: คลิป }
    hints:
      - "คลิปวางต่อกันพอดีกับริบบิ้น"
      - "นับคลิปทีละอันจากซ้ายไปขวา"
    misconceptions:
      - { match: 1, feedback: "ต้องนับว่ามีคลิปวางต่อกันกี่อัน ไม่ใช่บอกว่ามีริบบิ้นกี่เส้น" }
    solution: "มีคลิปวางต่อกันพอดี 6 อัน ริบบิ้นยาว 6 คลิป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.length.p003
    topics: [math.measure.length]
    difficulty: 2
    type: numeric
    stem: "ริบบิ้นในภาพยาว 6 คลิป ถ้าวัดริบบิ้นเส้นเดิมด้วยดินสอสีซึ่งยาวเท่าคลิป 2 อัน จะยาวกี่แท่ง (ตอบเป็นจำนวนแท่ง)"
    figure: { src: clips-ribbon.svg, alt: "ริบบิ้นสีชมพูหนึ่งเส้น ใต้ริบบิ้นมีคลิปหนีบกระดาษขนาดเท่ากัน 6 อันวางต่อกันพอดีกับความยาวริบบิ้น ด้านล่างมีดินสอสี 1 แท่ง เขียนว่าดินสอสี 1 แท่ง ยาวเท่าคลิป 2 อัน" }
    answer: { value: 3, unit: แท่ง }
    hints:
      - "ดินสอสี 1 แท่งแทนคลิปได้ 2 อัน"
      - "คลิป 6 อัน แบ่งเป็นกลุ่มละ 2 อันได้กี่กลุ่ม"
    misconceptions:
      - { match: 12, feedback: "ดินสอสียาวกว่าคลิป จึงนับได้น้อยกว่า ไม่ใช่มากกว่า" }
    solution: "คลิป 6 อัน = 2 + 2 + 2 คือดินสอสี 3 แท่ง หน่วยยาวขึ้น จำนวนที่นับได้จึงน้อยลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.length.p004
    topics: [math.measure.length]
    difficulty: 1
    type: match
    stem: "จับคู่สิ่งที่วัดกับหน่วยที่เหมาะที่สุด"
    pairs:
      - { left: "ความยาวของมด", right: "มิลลิเมตร" }
      - { left: "ความยาวของดินสอ", right: "เซนติเมตร" }
      - { left: "ความสูงของเสาธง", right: "เมตร" }
      - { left: "ระยะทางจากกรุงเทพฯ ถึงเชียงใหม่", right: "กิโลเมตร" }
    hints:
      - "ของยิ่งเล็กใช้หน่วยยิ่งเล็ก"
      - "มิลลิเมตร < เซนติเมตร < เมตร < กิโลเมตร"
    solution: "มดเล็กมากใช้มิลลิเมตร ดินสอใช้เซนติเมตร เสาธงใช้เมตร ระยะทางระหว่างจังหวัดใช้กิโลเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.length.p005
    topics: [math.measure.length]
    difficulty: 2
    type: match
    stem: "จับคู่สิ่งที่ต้องการวัดกับเครื่องวัดที่เหมาะสม"
    pairs:
      - { left: "รอบเอว", right: "สายวัดตัว" }
      - { left: "ความยาวของดินสอ", right: "ไม้บรรทัด" }
      - { left: "ความกว้างของห้องเรียน", right: "ตลับเมตร" }
      - { left: "ระยะทางที่รถวิ่งจากบ้านไปต่างจังหวัด", right: "มาตรวัดระยะทางของรถ" }
    hints:
      - "ของที่โค้งต้องใช้เครื่องวัดที่งอได้"
      - "ของยาวมากต้องใช้เครื่องวัดที่ยาวมาก"
    solution: "รอบเอวโค้งใช้สายวัดตัว ดินสอสั้นใช้ไม้บรรทัด ห้องเรียนยาวหลายเมตรใช้ตลับเมตร ระยะทางหลายกิโลเมตรใช้มาตรวัดระยะทางของรถ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.length.p006
    topics: [math.measure.length]
    difficulty: 2
    type: numeric
    stem: "ดินสอวางบนไม้บรรทัดดังภาพ ดินสอยาวกี่เซนติเมตร (ตอบในหน่วยเซนติเมตร)"
    figure: { src: ruler-pencil.svg, alt: "ไม้บรรทัด 0 ถึง 13 เซนติเมตร ดินสอวางอยู่เหนือไม้บรรทัด ปลายซ้ายตรงขีด 3 ปลายแหลมทางขวาตรงขีด 11" }
    answer: { value: 8, unit: cm }
    hints:
      - "ดินสอไม่ได้เริ่มที่ขีด 0"
      - "เอาเลขที่ปลายขวาลบเลขที่ปลายซ้าย"
    misconceptions:
      - { match: 11, feedback: "อ่านแค่ปลายขวา แต่ดินสอเริ่มที่ขีด 3 ไม่ใช่ 0" }
      - { match: 14, feedback: "นำ 3 กับ 11 มาบวกกัน ต้องลบ" }
    solution: "ดินสอเริ่มที่ 3 สิ้นสุดที่ 11 ยาว $11 - 3 = 8$ เซนติเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.length.p007
    topics: [math.measure.length]
    difficulty: 2
    type: numeric
    stem: "3 เมตร เท่ากับกี่เซนติเมตร"
    answer: { value: 300, unit: cm }
    hints:
      - "1 เมตร = 100 เซนติเมตร"
      - "3 เมตร คือ 100 สามครั้ง"
    misconceptions:
      - { match: 30, feedback: "ใช้ 1 เมตร = 10 เซนติเมตร ที่ถูกคือ 100 เซนติเมตร" }
      - { match: 3000, feedback: "ใช้ 1 เมตร = 1,000 แต่ 1,000 คือจำนวนเมตรใน 1 กิโลเมตร หรือจำนวนมิลลิเมตรใน 1 เมตร" }
    solution: "$3$ เมตร $= 100 + 100 + 100 = 300$ เซนติเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.length.p008
    topics: [math.measure.length]
    difficulty: 2
    type: mcq
    stem: "ความสูงของประตูห้องเรียนน่าจะประมาณเท่าใด"
    choices:
      - { id: a, text: "2 เมตร", correct: true }
      - { id: b, text: "20 เซนติเมตร", feedback: "20 เซนติเมตรสั้นกว่าไม้บรรทัดยาวเล็กน้อย ประตูสูงกว่านั้นมาก" }
      - { id: c, text: "20 เมตร", feedback: "20 เมตรสูงเท่าตึกประมาณ 6 ชั้น ประตูไม่สูงขนาดนั้น" }
      - { id: d, text: "2 กิโลเมตร", feedback: "กิโลเมตรใช้กับระยะทางไกล 2 กิโลเมตรเดินนานเกือบครึ่งชั่วโมง" }
    hints:
      - "ผู้ใหญ่สูงประมาณเท่าไร ประตูสูงกว่าผู้ใหญ่เล็กน้อย"
      - "ผู้ใหญ่สูงไม่ถึง 2 เมตร"
    solution: "ประตูสูงกว่าผู้ใหญ่เล็กน้อย ประมาณ 2 เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.length.p009
    topics: [math.measure.length]
    difficulty: 3
    type: numeric
    stem: "ร้านผ้าไหมมีผ้ายาว 4 เมตร 50 เซนติเมตร ตัดขายไป 1 เมตร 80 เซนติเมตร เหลือผ้ายาวกี่เซนติเมตร (ตอบในหน่วยเซนติเมตร)"
    answer: { value: 270, unit: cm }
    hints:
      - "เปลี่ยนเป็นเซนติเมตรทั้งสองจำนวนก่อน"
      - "4 เมตร 50 เซนติเมตร = 450 เซนติเมตร และ 1 เมตร 80 เซนติเมตร = 180 เซนติเมตร"
    misconceptions:
      - { match: 330, feedback: "ลบ 50 ออกจาก 80 แทน ($80 - 50 = 30$) ต้องกระจาย 1 เมตรมาเป็น 100 เซนติเมตรก่อน" }
      - { match: 630, feedback: "นำความยาวมาบวกกัน แต่ผ้าที่ตัดขายไปต้องลบออก" }
    solution: "$450 - 180 = 270$ เซนติเมตร (2 เมตร 70 เซนติเมตร)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.length.p010
    topics: [math.measure.length]
    difficulty: 3
    type: numeric
    stem: "ยางลบวางบนไม้บรรทัดดังภาพ ยางลบยาวกี่มิลลิเมตร (ตอบในหน่วยมิลลิเมตร)"
    figure: { src: ruler-eraser.svg, alt: "ไม้บรรทัด 0 ถึง 6 เซนติเมตร มีขีดมิลลิเมตร ยางลบวางอยู่เหนือไม้บรรทัด ปลายซ้ายตรงขีด 1 เซนติเมตร ปลายขวาตรงขีดมิลลิเมตรที่ 3 หลังเลข 5" }
    answer: { value: 43, unit: mm }
    hints:
      - "ปลายขวาอยู่ที่ 5 เซนติเมตร 3 มิลลิเมตร คิดเป็นมิลลิเมตรได้เท่าไร"
      - "ปลายซ้ายอยู่ที่ 1 เซนติเมตร = 10 มิลลิเมตร แล้วลบกัน"
    misconceptions:
      - { match: 53, feedback: "อ่านแค่ปลายขวา แต่ยางลบเริ่มที่ขีด 1 ไม่ใช่ 0" }
      - { match: 4.3, feedback: "4.3 คือความยาวเป็นเซนติเมตร โจทย์ให้ตอบเป็นมิลลิเมตร" }
    solution: "ปลายขวา $= 53$ มิลลิเมตร ปลายซ้าย $= 10$ มิลลิเมตร ยางลบยาว $53 - 10 = 43$ มิลลิเมตร (4 เซนติเมตร 3 มิลลิเมตร)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.length.p011
    topics: [math.measure.length]
    difficulty: 3
    type: order
    stem: "เรียงความยาวจากสั้นที่สุดไปยาวที่สุด"
    items: ["90 มิลลิเมตร", "95 เซนติเมตร", "1 เมตร 5 เซนติเมตร", "1 เมตร 50 เซนติเมตร", "1 กิโลเมตร"]
    hints:
      - "เปลี่ยนทุกจำนวนเป็นเซนติเมตร"
      - "90 มิลลิเมตร = 9 เซนติเมตร, 1 เมตร 5 เซนติเมตร = 105 เซนติเมตร"
    solution: "9 ซม. < 95 ซม. < 105 ซม. < 150 ซม. < 100,000 ซม. (1 กิโลเมตร)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.length.p012
    topics: [math.measure.length]
    difficulty: 3
    type: mcq
    stem: "เติมเครื่องหมายในช่องว่าง: 2 กิโลเมตร 300 เมตร ___ 2,030 เมตร"
    choices:
      - { id: a, text: "$>$", correct: true }
      - { id: b, text: "$<$", feedback: "อ่าน 300 เมตรเป็น 30 เมตร 2 กิโลเมตร 300 เมตร = 2,300 เมตร" }
      - { id: c, text: "$=$", feedback: "2 กิโลเมตร 300 เมตร = 2,000 + 300 = 2,300 เมตร ไม่ใช่ 2,030 เมตร" }
    hints:
      - "เปลี่ยน 2 กิโลเมตร 300 เมตร เป็นเมตร"
      - "1 กิโลเมตร = 1,000 เมตร"
    solution: "2 กิโลเมตร 300 เมตร $= 2{,}300$ เมตร และ $2{,}300 > 2{,}030$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.length.p013
    topics: [math.measure.length]
    difficulty: 4
    type: numeric
    stem: "จากบ้านถึงโรงเรียนระยะทาง 1 กิโลเมตร 250 เมตร จากโรงเรียนถึงตลาดอีก 850 เมตร จากบ้านผ่านโรงเรียนไปตลาดเป็นระยะทางกี่เมตร (ตอบในหน่วยเมตร)"
    answer: { value: 2100, unit: m }
    hints:
      - "เปลี่ยน 1 กิโลเมตร 250 เมตร เป็นเมตร"
      - "1 กิโลเมตร = 1,000 เมตร แล้วบวกกับ 850"
    misconceptions:
      - { match: 1200, feedback: "ใช้ 1 กิโลเมตร = 100 เมตร ที่ถูกคือ 1,000 เมตร" }
      - { match: 1100, feedback: "บวกแค่ 250 กับ 850 ลืม 1 กิโลเมตร" }
    solution: "$1{,}250 + 850 = 2{,}100$ เมตร (2 กิโลเมตร 100 เมตร)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.length.p014
    topics: [math.measure.length]
    difficulty: 3
    type: numeric
    stem: "เชือกยาว 72 เซนติเมตร ตัดออกไปส่วนหนึ่ง เหลือ 45 เซนติเมตร ตัดออกไปกี่เซนติเมตร (ตอบในหน่วยเซนติเมตร)"
    answer: { value: 27, unit: cm }
    hints:
      - "เขียนประโยคสัญลักษณ์ $72 - \\square = 45$"
      - "72 คือทั้งหมด 45 คือส่วนที่เหลือ หาส่วนที่ตัดด้วยการลบ"
    misconceptions:
      - { match: 117, feedback: "บวก 72 กับ 45 แต่ส่วนที่ตัดออกต้องสั้นกว่าเชือกเดิม" }
    solution: "$\\square = 72 - 45 = 27$ เซนติเมตร ตรวจ: $72 - 27 = 45$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.length.p015
    topics: [math.measure.length]
    difficulty: 4
    type: numeric
    stem: "ลู่วิ่งรอบสนามยาวรอบละ 400 เมตร พี่วิ่งไปแล้ว 3 รอบ ต้องวิ่งอีกกี่เมตรจึงจะครบ 2 กิโลเมตร (ตอบในหน่วยเมตร)"
    answer: { value: 800, unit: m }
    hints:
      - "วิ่ง 3 รอบ ได้ $400 + 400 + 400$ เมตร"
      - "2 กิโลเมตร = 2,000 เมตร แล้วหาส่วนที่ยังขาด"
    misconceptions:
      - { match: 1600, feedback: "ลบแค่ 400 เมตร (1 รอบ) แต่พี่วิ่งไปแล้ว 3 รอบ" }
      - { match: 1200, feedback: "1,200 เมตรคือระยะที่วิ่งไปแล้ว โจทย์ถามระยะที่ยังขาด" }
    solution: "วิ่งไปแล้ว $400 + 400 + 400 = 1{,}200$ เมตร ต้องวิ่งอีก $2{,}000 - 1{,}200 = 800$ เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.length.p016
    topics: [math.measure.length]
    difficulty: 5
    type: numeric
    stem: "ป้ายในอุทยานแห่งชาติบอกว่าทางเดินถึงน้ำตกยาว 3 กิโลเมตร 400 เมตร ครอบครัวหนึ่งเดินไป 1 กิโลเมตร 750 เมตร พักแล้วเดินต่ออีก 980 เมตร ยังเหลือระยะทางถึงน้ำตกอีกกี่เมตร (ตอบในหน่วยเมตร)"
    answer: { value: 670, unit: m }
    hints:
      - "เปลี่ยนทุกระยะเป็นเมตร"
      - "เดินไปแล้วทั้งหมด $1{,}750 + 980$ เมตร แล้วนำไปลบจาก 3,400 เมตร"
    misconceptions:
      - { match: 1650, feedback: "ลบแค่ช่วงแรก 1,750 เมตร ลืมช่วงที่เดินต่ออีก 980 เมตร" }
      - { match: 6130, feedback: "บวกทุกระยะเข้าด้วยกัน แต่ต้องหาระยะที่เหลือ" }
    solution: "เดินไปแล้ว $1{,}750 + 980 = 2{,}730$ เมตร เหลือ $3{,}400 - 2{,}730 = 670$ เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.measure.length.p017
    topics: [math.measure.length]
    difficulty: 5
    type: numeric
    stem: "ช่องว่างระหว่างผนังสองด้านกว้าง 2 เมตร 4 เซนติเมตร นำตู้ยาว 1 เมตร 85 เซนติเมตร ไปวาง จะเหลือช่องว่างกี่มิลลิเมตร (ตอบในหน่วยมิลลิเมตร)"
    answer: { value: 190, unit: mm }
