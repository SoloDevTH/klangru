      - { id: b, text: "โรงพยาบาลตัดสินใจเปิดศูนย์รักษาโรคหัวใจแห่งแรกของจังหวัด", feedback: "เป็นเรื่องใหม่ ไม่มีกฎสำเร็จรูป จึงเป็นการตัดสินใจนอกแบบแผน" }
      - { id: c, text: "บริษัทเลือกว่าจะรับมืออย่างไรเมื่อคู่แข่งรายใหม่จากต่างประเทศเข้าตลาด", feedback: "สถานการณ์ใหม่ที่ต้องใช้วิจารณญาณ เป็นการตัดสินใจนอกแบบแผน" }
      - { id: d, text: "เทศบาลตัดสินใจว่าจะฟื้นฟูเมืองอย่างไรหลังน้ำท่วมครั้งใหญ่ที่ไม่เคยเกิด", feedback: "เหตุการณ์ไม่เคยเกิด ต้องคิดทางเลือกใหม่ จึงเป็นนอกแบบแผน" }
    hints:
