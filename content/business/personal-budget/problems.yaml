  - id: business.econ.personal-budget.p017
    topics: [business.econ.personal-budget]
    difficulty: 5
    type: numeric
    stem: "พี่น้องสองคนได้เงินคนละ $3{,}000$ บาทต่อเดือนเท่ากัน 4 เดือน พี่ใช้วิธีออมก่อนใช้ กันเงินออมเดือนละ $600$ บาททุกเดือน น้องใช้ก่อนแล้วออมส่วนที่เหลือ ซึ่งเหลือเดือนที่ 1 ถึง 4 เป็น $300,\\ 0,\\ 150,\\ 250$ บาท เมื่อครบ 4 เดือน พี่มีเงินออมมากกว่าน้องกี่บาท (ตอบเป็นบาท)"
    answer: { value: 1700, unit: บาท }
    hints:
      - "หาเงินออมรวม 4 เดือนของแต่ละคน"
      - "นำเงินออมของพี่ลบเงินออมของน้อง"
    misconceptions:
      - { match: 2400, feedback: "นั่นคือเงินออมของพี่อย่างเดียว ต้องลบเงินออมของน้องด้วย" }
      - { match: 700, feedback: "นั่นคือเงินออมของน้อง ต้องหาผลต่างกับของพี่" }
    solution: "พี่ออม $600 \\times 4 = 2{,}400$ บาท น้องออม $300 + 0 + 150 + 250 = 700$ บาท พี่มากกว่า $2{,}400 - 700 = 1{,}700$ บาท การออมก่อนใช้ทำให้ออมได้สม่ำเสมอกว่า"
