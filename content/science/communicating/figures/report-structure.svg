<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="sans-serif" font-size="14">
<title>โครงสร้างรายงานการทดลอง</title>
<rect x="0" y="0" width="820" height="560" fill="#ffffff"/>
<rect x="40.0" y="30.0" width="190.0" height="48.0" rx="8" fill="#e0e7ff" stroke="#334155" stroke-width="1.5"/>
<text x="135.0" y="59.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">ชื่อเรื่อง</text>
<text x="250.0" y="59.0" text-anchor="start" font-size="13" fill="#1f2937">บอกตัวแปรต้นและตัวแปรตาม</text>
<line x1="135.0" y1="78.0" x2="135.0" y2="93.0" stroke="#64748b" stroke-width="1.5"/>
<polygon points="135.0,93.0 132.3,86.6 137.7,86.6" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<rect x="40.0" y="94.0" width="190.0" height="48.0" rx="8" fill="#e0e7ff" stroke="#334155" stroke-width="1.5"/>
<text x="135.0" y="123.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">บทคัดย่อ</text>
<text x="250.0" y="123.0" text-anchor="start" font-size="13" fill="#1f2937">สรุปทั้งเรื่องสั้น ๆ: ทำอะไร อย่างไร พบอะไร</text>
<line x1="135.0" y1="142.0" x2="135.0" y2="157.0" stroke="#64748b" stroke-width="1.5"/>
<polygon points="135.0,157.0 132.3,150.6 137.7,150.6" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<rect x="40.0" y="158.0" width="190.0" height="48.0" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="1.5"/>
<text x="135.0" y="187.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">บทนำ</text>
<text x="250.0" y="187.0" text-anchor="start" font-size="13" fill="#1f2937">ที่มา คำถาม สมมติฐาน ความรู้เดิมพร้อมอ้างอิง</text>
<line x1="135.0" y1="206.0" x2="135.0" y2="221.0" stroke="#64748b" stroke-width="1.5"/>
<polygon points="135.0,221.0 132.3,214.6 137.7,214.6" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<rect x="40.0" y="222.0" width="190.0" height="48.0" rx="8" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="135.0" y="251.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">วิธีการ</text>
<text x="250.0" y="251.0" text-anchor="start" font-size="13" fill="#1f2937">วัสดุ ตัวแปร ขั้นตอนละเอียดพอให้คนอื่นทำซ้ำได้</text>
<line x1="135.0" y1="270.0" x2="135.0" y2="285.0" stroke="#64748b" stroke-width="1.5"/>
<polygon points="135.0,285.0 132.3,278.6 137.7,278.6" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<rect x="40.0" y="286.0" width="190.0" height="48.0" rx="8" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/>
<text x="135.0" y="315.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">ผลการทดลอง</text>
<text x="250.0" y="315.0" text-anchor="start" font-size="13" fill="#1f2937">ตาราง กราฟ มีชื่อและหน่วย บอกข้อมูลตามจริง</text>
<line x1="135.0" y1="334.0" x2="135.0" y2="349.0" stroke="#64748b" stroke-width="1.5"/>
<polygon points="135.0,349.0 132.3,342.6 137.7,342.6" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<rect x="40.0" y="350.0" width="190.0" height="48.0" rx="8" fill="#ffedd5" stroke="#334155" stroke-width="1.5"/>
<text x="135.0" y="379.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">อภิปรายผล</text>
<text x="250.0" y="379.0" text-anchor="start" font-size="13" fill="#1f2937">อธิบายผล เทียบสมมติฐาน ความคลาดเคลื่อน ความน่าเชื่อถือ</text>
<line x1="135.0" y1="398.0" x2="135.0" y2="413.0" stroke="#64748b" stroke-width="1.5"/>
<polygon points="135.0,413.0 132.3,406.6 137.7,406.6" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<rect x="40.0" y="414.0" width="190.0" height="48.0" rx="8" fill="#fee2e2" stroke="#334155" stroke-width="1.5"/>
<text x="135.0" y="443.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">สรุปผล</text>
<text x="250.0" y="443.0" text-anchor="start" font-size="13" fill="#1f2937">ตอบคำถามที่ตั้งไว้ ข้อเสนอแนะ</text>
<line x1="135.0" y1="462.0" x2="135.0" y2="477.0" stroke="#64748b" stroke-width="1.5"/>
<polygon points="135.0,477.0 132.3,470.6 137.7,470.6" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<rect x="40.0" y="478.0" width="190.0" height="48.0" rx="8" fill="#f3e8ff" stroke="#334155" stroke-width="1.5"/>
<text x="135.0" y="507.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">เอกสารอ้างอิง</text>
<text x="250.0" y="507.0" text-anchor="start" font-size="13" fill="#1f2937">แหล่งข้อมูลทุกแหล่งที่ใช้</text>
<path d="M 680 158 L 690 158 L 690 206 L 680 206" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
<text x="698.0" y="186.0" text-anchor="start" font-size="12" fill="#6d28d9" font-weight="bold">ทำไม</text>
<path d="M 680 222 L 690 222 L 690 270 L 680 270" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
<text x="698.0" y="250.0" text-anchor="start" font-size="12" fill="#6d28d9" font-weight="bold">ทำอย่างไร</text>
<path d="M 680 286 L 690 286 L 690 334 L 680 334" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
<text x="698.0" y="314.0" text-anchor="start" font-size="12" fill="#6d28d9" font-weight="bold">พบอะไร</text>
<path d="M 680 350 L 690 350 L 690 462 L 680 462" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
<text x="698.0" y="410.0" text-anchor="start" font-size="12" fill="#6d28d9" font-weight="bold">หมายความว่าอะไร</text>
</svg>