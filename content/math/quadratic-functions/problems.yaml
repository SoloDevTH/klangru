problems:
  - id: math.qf.p001
    topics: [math.functions.quadratic]
    difficulty: 1
    type: mcq
    stem: "กราฟของ $y = -2x^2 + 3$ เป็นพาราโบลาแบบใด"
    choices:
      - { id: a, text: "คว่ำ และมีค่าสูงสุด", correct: true }
      - { id: b, text: "หงาย และมีค่าต่ำสุด", feedback: "ดูเหมือนดูจาก $+3$ แต่ทิศของพาราโบลาดูจากสัมประสิทธิ์ของ $x^2$ ซึ่งคือ $-2$ เป็นลบ" }
      - { id: c, text: "คว่ำ และมีค่าต่ำสุด", feedback: "พาราโบลาคว่ำมีจุดยอดอยู่บนสุด จึงมีค่าสูงสุด ส่วนด้านล่างลงไปได้เรื่อย ๆ ไม่มีค่าต่ำสุด" }
      - { id: d, text: "หงาย และมีค่าสูงสุด", feedback: "พาราโบลาหงายขึ้นไปได้เรื่อย ๆ จึงไม่มีค่าสูงสุด และ $a = -2$ ทำให้กราฟคว่ำ" }
    hints:
      - "ดูเครื่องหมายของสัมประสิทธิ์ของ $x^2$"
      - "$a < 0$ พาราโบลาคว่ำ จุดยอดอยู่บนสุดหรือล่างสุด"
    solution: "$a = -2 < 0$ พาราโบลาจึงคว่ำ จุดยอด $(0, 3)$ อยู่บนสุด ค่าสูงสุดของ $y$ คือ 3"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p002
    topics: [math.functions.quadratic]
    difficulty: 1
    type: numeric
    stem: "พาราโบลา $y = (x - 3)^2 + 5$ มีจุดยอดที่ $x$ เท่าใด"
    answer: { value: 3 }
    hints:
      - "ฟังก์ชันอยู่ในรูป $y = a(x - h)^2 + k$ ซึ่งมีจุดยอดที่ $(h, k)$"
      - "$(x - 3)^2$ มีค่าน้อยที่สุดเป็น 0 ให้หาว่า $x$ เท่าใดทำให้วงเล็บเป็น 0"
    misconceptions:
      - { match: -3, feedback: "ระวังเครื่องหมาย $(x - 3)^2 = 0$ เมื่อ $x = 3$ ไม่ใช่ $-3$" }
      - { match: 5, feedback: "5 คือพิกัด $y$ ของจุดยอด โจทย์ถามพิกัด $x$" }
    solution: "รูป $y = (x - h)^2 + k$ มี $h = 3$, $k = 5$ จุดยอดคือ $(3, 5)$ จึงอยู่ที่ $x = 3$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p003
    topics: [math.functions.quadratic]
    difficulty: 2
    type: numeric
    stem: "แกนสมมาตรของพาราโบลา $y = x^2 - 8x + 7$ คือเส้นตรง $x = \\,?$"
    answer: { value: 4 }
    hints:
      - "แกนสมมาตรของ $y = ax^2 + bx + c$ คือ $x = -\\dfrac{b}{2a}$"
      - "ระบุ $a = 1$ และ $b = -8$ แล้วแทนลงในสูตร ระวังเครื่องหมายลบสองชั้น"
    misconceptions:
      - { match: -4, feedback: "ลืมเครื่องหมายลบหน้าสูตร $x = -\\tfrac{b}{2a} = -\\tfrac{-8}{2} = 4$" }
      - { match: 8, feedback: "ลืมหาร 2 สูตรคือ $-\\tfrac{b}{2a}$ ไม่ใช่ $-\\tfrac{b}{a}$" }
    solution: "$a = 1$, $b = -8$: $x = -\\dfrac{-8}{2(1)} = 4$ ตรวจ: จุดตัดแกน $x$ คือ $x = 1$ และ $x = 7$ ซึ่งมีจุดกึ่งกลางที่ 4 ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p004
    topics: [math.functions.quadratic]
    difficulty: 2
    type: match
    stem: "จับคู่พาราโบลากับจุดยอด"
    pairs:
      - { left: "$y = (x - 1)^2 + 2$", right: "$(1, 2)$" }
      - { left: "$y = (x + 1)^2 - 2$", right: "$(-1, -2)$" }
      - { left: "$y = -(x - 2)^2$", right: "$(2, 0)$" }
      - { left: "$y = x^2 - 4$", right: "$(0, -4)$" }
    hints:
      - "รูป $y = a(x - h)^2 + k$ มีจุดยอด $(h, k)$"
      - "$(x + 1)^2$ เขียนได้เป็น $(x - (-1))^2$"
      - "ถ้าไม่มีวงเล็บ เช่น $x^2 - 4$ แปลว่า $h = 0$"
    solution: "$(x - 1)^2 + 2$ → $(1, 2)$ | $(x + 1)^2 - 2$ → $(-1, -2)$ | $-(x - 2)^2$ → $(2, 0)$ | $x^2 - 4$ → $(0, -4)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p005
    topics: [math.functions.quadratic]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดถูกต้องเกี่ยวกับพาราโบลา $y = -x^2 + 4x$ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "พาราโบลาคว่ำ", correct: true }
      - { id: b, text: "จุดยอดคือ $(2, 4)$", correct: true }
      - { id: c, text: "กราฟผ่านจุด $(0, 0)$", correct: true }
      - { id: d, text: "มีค่าต่ำสุดเท่ากับ 4", feedback: "พาราโบลาคว่ำมีค่าสูงสุด ไม่ใช่ค่าต่ำสุด 4 คือค่าสูงสุด" }
      - { id: e, text: "แกนสมมาตรคือ $x = -2$", feedback: "ลืมเครื่องหมายลบในสูตร $x = -\\tfrac{4}{2(-1)} = 2$" }
    hints:
      - "เริ่มจากดูเครื่องหมายของ $a$ แล้วหาแกนสมมาตรด้วย $x = -\\tfrac{b}{2a}$"
      - "แทน $x$ ของแกนสมมาตรและ $x = 0$ ลงในฟังก์ชันเพื่อตรวจแต่ละข้อ"
    solution: "$a = -1 < 0$ พาราโบลาคว่ำ แกนสมมาตร $x = -\\tfrac{4}{2(-1)} = 2$ และ $y(2) = -4 + 8 = 4$ จุดยอดคือ $(2, 4)$ เป็นค่าสูงสุด เมื่อ $x = 0$ ได้ $y = 0$ กราฟจึงผ่านจุดกำเนิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p006
    topics: [math.functions.quadratic]
    difficulty: 3
    type: numeric
    stem: "จงหาค่าต่ำสุดของ $y = x^2 - 6x + 11$"
    answer: { value: 2 }
    hints:
      - "ค่าต่ำสุดอยู่ที่จุดยอด หาแกนสมมาตรก่อน"
      - "$x = -\\tfrac{b}{2a}$ แล้วแทน $x$ ที่ได้กลับลงในฟังก์ชัน"
    misconceptions:
      - { match: 3, feedback: "3 คือค่า $x$ ของจุดยอด ค่าต่ำสุดคือค่า $y$ ต้องแทน $x = 3$ กลับลงในฟังก์ชัน" }
      - { match: 11, feedback: "11 คือค่า $y$ เมื่อ $x = 0$ (จุดตัดแกน $y$) ไม่ใช่จุดยอด" }
    solution: "$x = -\\tfrac{-6}{2} = 3$ แล้ว $y = 9 - 18 + 11 = 2$ หรือเขียนเป็น $y = (x - 3)^2 + 2$ ค่าต่ำสุดคือ 2"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p007
    topics: [math.functions.quadratic]
    difficulty: 3
    type: numeric
    stem: "พาราโบลา $y = x^2 - 2x - 8$ ตัดแกน $x$ สองจุด จุดที่มีพิกัด $x$ เป็นบวกอยู่ที่ $x$ เท่าใด"
    answer: { value: 4 }
    hints:
      - "จุดตัดแกน $x$ มีค่า $y = 0$"
      - "แยกตัวประกอบ $x^2 - 2x - 8$ หาสองจำนวนที่คูณกันได้ $-8$ และบวกกันได้ $-2$"
    misconceptions:
      - { match: 2, feedback: "ดูเหมือนแยกตัวประกอบเป็น $(x + 4)(x - 2)$ ลองกระจายดูจะได้ $x^2 + 2x - 8$ เครื่องหมายของพจน์กลางกลับกัน" }
      - { match: 8, feedback: "8 มาจากค่าคงที่ แต่จุดตัดแกน $x$ ต้องมาจากการแก้สมการ $x^2 - 2x - 8 = 0$" }
    solution: "$x^2 - 2x - 8 = (x - 4)(x + 2) = 0$ ได้ $x = 4$ หรือ $x = -2$ จุดที่เป็นบวกคือ $x = 4$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p008
    topics: [math.functions.quadratic]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการหาจุดยอดของ $y = 2x^2 - 8x + 3$ ให้ถูกต้อง"
    items:
      - "ระบุ $a = 2$, $b = -8$, $c = 3$"
      - "หาแกนสมมาตร $x = -\\tfrac{-8}{2(2)} = 2$"
      - "แทน $x = 2$ ลงในฟังก์ชัน ได้ $y = 8 - 16 + 3 = -5$"
      - "สรุปว่าจุดยอดคือ $(2, -5)$ และเป็นจุดต่ำสุดเพราะ $a > 0$"
    hints:
      - "ต้องรู้ค่า $a$ และ $b$ ก่อนจึงจะใช้สูตรแกนสมมาตรได้"
      - "พิกัด $y$ ของจุดยอดหาได้หลังจากรู้พิกัด $x$ แล้ว"
    solution: "ระบุสัมประสิทธิ์ → หาแกนสมมาตร → แทนค่าหาพิกัด $y$ → สรุปจุดยอดและชนิดของจุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p009
    topics: [math.functions.quadratic]
    difficulty: 4
    type: expression
    stem: "พาราโบลารูปหนึ่งมีจุดยอดที่ $(2, -3)$ และผ่านจุด $(0, 5)$ จงเขียนสมการของพาราโบลานี้"
    prefix: "y ="
    answer: { latex: "2(x-2)^2-3", variables: [x] }
    hints:
      - "เริ่มจากรูปจุดยอด $y = a(x - h)^2 + k$ แล้วใส่ $h$ และ $k$"
      - "ยังไม่รู้ $a$ ให้แทนจุด $(0, 5)$ ลงในสมการ"
      - "แก้สมการหา $a$ แล้วเขียนสมการเต็ม"
    misconceptions:
      - { match: "(x-2)^2-3", feedback: "สมการนี้มีจุดยอดถูก แต่ถ้าแทน $x = 0$ จะได้ $y = 1$ ไม่ใช่ 5 ต้องหาค่า $a$ จากจุด $(0, 5)$ ด้วย" }
      - { match: "2(x+2)^2-3", feedback: "ระวังเครื่องหมาย จุดยอดที่ $x = 2$ ต้องเขียนเป็น $(x - 2)^2$" }
    solution: "$y = a(x - 2)^2 - 3$ แทน $(0, 5)$: $5 = a(4) - 3$ → $4a = 8$ → $a = 2$ จึงได้ $y = 2(x - 2)^2 - 3$ (หรือ $y = 2x^2 - 8x + 5$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p010
    topics: [math.functions.quadratic]
    difficulty: 4
    type: numeric
    stem: "แม่ค้าลูกชิ้นปิ้งพบว่า ถ้าตั้งราคาไม้ละ $x$ บาท จะได้กำไรต่อวัน $P(x) = -50x^2 + 1000x - 2000$ บาท กำไรต่อวันสูงสุดเป็นกี่บาท"
    answer: { value: 3000, unit: บาท }
    hints:
      - "พาราโบลาคว่ำ ($a < 0$) กำไรสูงสุดอยู่ที่จุดยอด"
      - "หาราคาที่ดีที่สุดจาก $x = -\\tfrac{b}{2a}$ ก่อน"
      - "แทนราคาที่ได้ลงใน $P(x)$ เพื่อหากำไร"
    misconceptions:
      - { match: 10, feedback: "10 บาทคือราคาที่ทำให้กำไรสูงสุด โจทย์ถามกำไร ต้องแทน $x = 10$ ลงใน $P(x)$" }
      - { match: -2000, feedback: "ดูเหมือนใช้ $x = -\\tfrac{b}{a} = 20$ ลืมหาร 2 ในสูตรแกนสมมาตร" }
    solution: "$x = -\\dfrac{1000}{2(-50)} = 10$ บาท แล้ว $P(10) = -50(100) + 1000(10) - 2000 = -5000 + 10000 - 2000 = 3000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p011
    topics: [math.functions.quadratic]
    difficulty: 4
    type: numeric
    stem: "นักกีฬาเซปักตะกร้อเตะลูกขึ้นไป ความสูงของลูกเมื่อเวลาผ่านไป $t$ วินาทีคือ $h(t) = -5t^2 + 10t + 1.5$ เมตร ลูกตะกร้อขึ้นไปได้สูงสุดกี่เมตร"
    answer: { value: 6.5, tolerance: 0.05, unit: m }
    hints:
      - "ความสูงสูงสุดอยู่ที่จุดยอดของพาราโบลาคว่ำ"
      - "หาเวลาที่จุดยอดจาก $t = -\\tfrac{b}{2a}$"
      - "แทนเวลาที่ได้ลงใน $h(t)$"
    misconceptions:
      - { match: 1, feedback: "1 วินาทีคือเวลาที่ลูกถึงจุดสูงสุด ต้องแทน $t = 1$ ลงใน $h(t)$ เพื่อหาความสูง" }
      - { match: 1.5, feedback: "ดูเหมือนใช้ $t = -\\tfrac{b}{a} = 2$ ซึ่งเป็นเวลาที่ลูกกลับมาสูงเท่าจุดเริ่ม ต้องใช้ $-\\tfrac{b}{2a}$" }
    solution: "$t = -\\dfrac{10}{2(-5)} = 1$ วินาที แล้ว $h(1) = -5 + 10 + 1.5 = 6.5$ เมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p012
    topics: [math.functions.quadratic]
    difficulty: 5
    type: numeric
    stem: "ชาวสวนมีลวดหนาม 60 เมตร ต้องการล้อมแปลงผักรูปสี่เหลี่ยมผืนผ้าที่ติดคลอง โดยไม่ต้องล้อมด้านที่ติดคลอง (ล้อมแค่ 3 ด้าน) พื้นที่แปลงผักมากที่สุดเป็นกี่ตารางเมตร"
    answer: { value: 450, unit: m² }
    hints:
      - "ให้ด้านที่ตั้งฉากกับคลองยาว $x$ เมตร (มี 2 ด้าน) ด้านที่ขนานคลองจะยาว $60 - 2x$ เมตร"
      - "พื้นที่ $A(x) = x(60 - 2x) = -2x^2 + 60x$ เป็นฟังก์ชันกำลังสอง"
      - "หาจุดยอดของ $A(x)$ แล้วคำนวณพื้นที่ที่จุดนั้น"
    misconceptions:
      - { match: 225, feedback: "ดูเหมือนแบ่งลวด 60 เมตรเป็น 4 ด้านเท่ากัน แต่ด้านที่ติดคลองไม่ต้องล้อม ลวดใช้แค่ 3 ด้าน" }
      - { match: 400, feedback: "ดูเหมือนให้ทั้ง 3 ด้านยาวเท่ากันด้านละ 20 เมตร ซึ่งไม่ใช่พื้นที่มากที่สุด ลองเขียนพื้นที่เป็นฟังก์ชันของ $x$ แล้วหาจุดยอด" }
    solution: "$A(x) = x(60 - 2x) = -2x^2 + 60x$ จุดยอดที่ $x = -\\dfrac{60}{2(-2)} = 15$ เมตร ด้านขนานคลองยาว $60 - 30 = 30$ เมตร พื้นที่ $= 15 \\times 30 = 450$ ตารางเมตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p013
    topics: [math.functions.quadratic]
    difficulty: 5
    type: mcq
    stem: "ค่า $k$ ในข้อใดทำให้กราฟ $y = x^2 - 4x + k$ ไม่ตัดแกน $x$ เลย"
    choices:
      - { id: a, text: "$k > 4$", correct: true }
      - { id: b, text: "$k < 4$", feedback: "เมื่อ $k < 4$ ดิสคริมิแนนต์ $16 - 4k > 0$ กราฟตัดแกน $x$ สองจุด เช่น $k = 0$ ได้ $x = 0$ และ $x = 4$" }
      - { id: c, text: "$k = 4$", feedback: "เมื่อ $k = 4$ ได้ $y = (x - 2)^2$ กราฟแตะแกน $x$ หนึ่งจุดที่ $(2, 0)$" }
      - { id: d, text: "$k > -4$", feedback: "ดูเหมือนเครื่องหมายผิดตอนแก้อสมการ $16 - 4k < 0$ → $4k > 16$ → $k > 4$" }
    hints:
      - "กราฟไม่ตัดแกน $x$ เมื่อสมการ $x^2 - 4x + k = 0$ ไม่มีคำตอบเป็นจำนวนจริง"
      - "ใช้ดิสคริมิแนนต์ $b^2 - 4ac < 0$ แล้วแก้อสมการหา $k$"
    solution: "$b^2 - 4ac = 16 - 4k < 0$ → $k > 4$ หรือมองจากจุดยอด: $y = (x - 2)^2 + (k - 4)$ มีค่าต่ำสุด $k - 4$ ถ้า $k - 4 > 0$ กราฟอยู่เหนือแกน $x$ ทั้งหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p014
    topics: [math.functions.quadratic]
    difficulty: 2
    type: numeric
    stem: "เรนจ์ของฟังก์ชัน $y = -(x - 1)^2 + 4$ คือ $y \\le$ จำนวนใด"
    answer: { value: 4 }
    hints:
      - "สัมประสิทธิ์หน้าวงเล็บเป็นลบ พาราโบลาคว่ำ จึงมีค่าสูงสุด"
      - "ค่าสูงสุดคือพิกัด $y$ ของจุดยอด $(h, k)$"
    misconceptions:
      - { match: 1, feedback: "$1$ คือค่า $h$ ซึ่งบอกตำแหน่งแกนสมมาตร เรนจ์ขึ้นกับพิกัด $y$ ของจุดยอด" }
      - { match: -4, feedback: "จุดยอดคือ $(1, 4)$ ค่า $+4$ ที่อยู่นอกวงเล็บไม่ต้องกลับเครื่องหมาย (กลับเครื่องหมายเฉพาะ $h$ ในวงเล็บ)" }
    solution: "จุดยอดคือ $(1, 4)$ และพาราโบลาคว่ำ ค่า $y$ สูงสุดคือ $4$ เรนจ์จึงเป็น $y \\le 4$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p015
    topics: [math.functions.quadratic]
    difficulty: 2
    type: mcq
    stem: "ฟังก์ชัน $y = (x - 2)^2 + 1$ มีค่าเพิ่มขึ้นเมื่อ $x$ เพิ่มขึ้น ในช่วงใด"
    choices:
      - { id: a, text: "$x > 2$", correct: true }
      - { id: b, text: "$x < 2$", feedback: "ทางซ้ายของจุดยอด พาราโบลาหงายกำลังลงไปหาจุดต่ำสุด ค่า $y$ จึงลดลง" }
      - { id: c, text: "$x > 1$", feedback: "$1$ คือค่าต่ำสุดของ $y$ (พิกัด $y$ ของจุดยอด) ช่วงเพิ่มแบ่งที่พิกัด $x$ ของจุดยอดคือ $2$" }
      - { id: d, text: "ทุกจำนวนจริง $x$", feedback: "พาราโบลามีทั้งช่วงลดและช่วงเพิ่ม เปลี่ยนทิศที่จุดยอด" }
    hints:
      - "หาจุดยอดก่อน แล้วนึกภาพพาราโบลาหงาย"
      - "พาราโบลาหงายลดลงทางซ้ายของจุดยอด และเพิ่มขึ้นทางขวา"
    solution: "จุดยอดคือ $(2, 1)$ และพาราโบลาหงาย ($a = 1 > 0$) ฟังก์ชันลดลงเมื่อ $x < 2$ และเพิ่มขึ้นเมื่อ $x > 2$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p016
    topics: [math.functions.quadratic]
    difficulty: 3
    type: numeric
    stem: "เขียน $y = x^2 - 10x + 21$ ให้อยู่ในรูป $y = (x - h)^2 + k$ ค่า $k$ เท่ากับเท่าใด"
    answer: { value: -4 }
    hints:
      - "ครึ่งหนึ่งของสัมประสิทธิ์ของ $x$ คือ $-5$ จึงได้ $h = 5$"
      - "$(x - 5)^2 = x^2 - 10x + 25$ เทียบค่าคงที่กับ $21$"
    misconceptions:
      - { match: 46, feedback: "ดูเหมือนบวก $25$ เพิ่ม แต่ $(x - 5)^2$ มี $25$ อยู่แล้ว ต้องลบออกจึงจะเหลือ $21$" }
      - { match: 16, feedback: "ดูเหมือนลบ $5$ ไม่ใช่ $5^2$ ค่าคงที่ใน $(x - 5)^2$ คือ $25$" }
    solution: "$x^2 - 10x + 21 = (x^2 - 10x + 25) - 25 + 21 = (x - 5)^2 - 4$ ได้ $k = -4$ จุดยอดคือ $(5, -4)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p017
    topics: [math.functions.quadratic]
    difficulty: 3
    type: expression
    stem: "จากกราฟ เขียนสมการของพาราโบลานี้"
    figure: { src: graph-read.svg, alt: "กราฟพาราโบลาคว่ำบนตาราง ผ่านจุด (0, 0) และ (4, 0) บนแกน x จุดยอดอยู่ที่ (2, 4) และผ่านจุด (1, 3) กับ (3, 3)" }
    prefix: "y ="
    answer: { latex: "-(x-2)^2+4", variables: [x] }
    hints:
      - "อ่านจุดยอดจากกราฟ แล้วเขียน $y = a(x - h)^2 + k$"
      - "หา $a$ จากจุดอื่นที่กราฟผ่าน เช่น $(0, 0)$ หรือ $(1, 3)$"
      - "ตรวจทิศ: พาราโบลาคว่ำ $a$ ต้องติดลบ"
    misconceptions:
      - { match: "(x-2)^2+4", feedback: "พาราโบลานี้คว่ำ $a$ ต้องติดลบ ลองแทน $x = 0$ ในคำตอบ ต้องได้ $y = 0$" }
      - { match: "-(x+2)^2+4", feedback: "จุดยอดอยู่ที่ $x = 2$ จึงเขียน $(x - 2)^2$ ไม่ใช่ $(x + 2)^2$" }
    solution: "จุดยอด $(2, 4)$: $y = a(x - 2)^2 + 4$ แทนจุด $(0, 0)$: $0 = 4a + 4$ ได้ $a = -1$ จึงได้ $y = -(x - 2)^2 + 4$ หรือ $y = -x^2 + 4x = -x(x - 4)$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p018
    topics: [math.functions.quadratic]
    difficulty: 4
    type: mcq
    stem: "ฟังก์ชัน $f(x) = -x^2 + 6x - 5$ และฟังก์ชันกำลังสอง $g$ ที่มีค่า $g(0) = 2$, $g(1) = 5$, $g(2) = 6$, $g(3) = 5$, $g(4) = 2$ ฟังก์ชันใดมีค่าสูงสุดมากกว่า"
    choices:
      - { id: a, text: "$g$ มีค่าสูงสุดมากกว่า ($6$ เทียบกับ $4$)", correct: true }
      - { id: b, text: "$f$ มีค่าสูงสุดมากกว่า", feedback: "จุดยอดของ $f$ อยู่ที่ $x = 3$ ได้ $f(3) = -9 + 18 - 5 = 4$ น้อยกว่า $6$" }
      - { id: c, text: "เท่ากัน", feedback: "ค่าที่ $x = 3$ ของสองฟังก์ชันไม่ได้บอกค่าสูงสุด ต้องหาจุดยอดของแต่ละฟังก์ชัน" }
      - { id: d, text: "บอกไม่ได้ เพราะ $g$ ไม่มีสมการ", feedback: "ค่าในตารางสมมาตรรอบ $x = 2$ จุดยอดของ $g$ จึงอยู่ที่ $x = 2$ อ่านค่าสูงสุดได้จากตาราง" }
    hints:
      - "หาจุดยอดของ $f$ ด้วย $x = -\\tfrac{b}{2a}$"
      - "สำหรับ $g$ ดูว่าค่าในตารางสมมาตรรอบ $x$ ใด"
    solution: "$f$: $x = -\\tfrac{6}{2(-1)} = 3$ ค่าสูงสุด $f(3) = 4$ ส่วน $g$ สมมาตรรอบ $x = 2$ ($g(1) = g(3)$ และ $g(0) = g(4)$) ค่าสูงสุดคือ $g(2) = 6$ ดังนั้น $g$ มีค่าสูงสุดมากกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p019
    topics: [math.functions.quadratic]
    difficulty: 4
    type: numeric
    stem: "ซุ้มประตูหน้างานวัดเป็นโค้งรูปพาราโบลา กว้างที่ฐาน $8\\ \\mathrm{m}$ และสูงที่กึ่งกลาง $6\\ \\mathrm{m}$ ที่ตำแหน่งห่างจากขาซุ้มด้านหนึ่ง $1\\ \\mathrm{m}$ ซุ้มสูงจากพื้นกี่เมตร (ตอบทศนิยม 3 ตำแหน่ง ในหน่วย m)"
    figure: { src: parabolic-arch.svg, alt: "ซุ้มโค้งรูปพาราโบลาคว่ำ ฐานกว้าง 8 m เส้นประจากยอดลงกลางฐานยาว 6 m มีเส้นตั้งที่ห่างจากขาซุ้มด้านซ้าย 1 m ขึ้นไปแตะโค้ง ระบุความสูงเป็นเครื่องหมายคำถาม" }
    answer: { value: 2.625, tolerance: 0.01, unit: m }
    hints:
      - "ตั้งแกนให้กึ่งกลางฐานเป็นจุดกำเนิด จุดยอดคือ $(0, 6)$ ขาซุ้มอยู่ที่ $x = \\pm 4$"
      - "เขียน $y = a x^2 + 6$ แล้วแทนจุด $(4, 0)$ เพื่อหา $a$"
      - "ห่างจากขาซุ้ม $1\\ \\mathrm{m}$ คือห่างจากกึ่งกลาง $3\\ \\mathrm{m}$"
    misconceptions:
      - { match: 5.625, feedback: "ดูเหมือนแทน $x = 1$ ซึ่งคือห่างจากกึ่งกลาง $1\\ \\mathrm{m}$ โจทย์วัดจากขาซุ้ม จึงต้องใช้ $x = 3$" }
      - { match: 1.5, feedback: "ดูเหมือนลืมยกกำลังสองทั้งตอนหา $a$ ($0 = 4a + 6$) และตอนแทน $x = 3$ จึงคิดเหมือนเส้นตรง ต้องใช้ $0 = a(4)^2 + 6$ และ $y = a(3)^2 + 6$" }
    solution: "$y = ax^2 + 6$ ผ่าน $(4, 0)$: $16a + 6 = 0$ ได้ $a = -\\tfrac{3}{8}$ ที่ $x = 3$: $y = -\\tfrac{3}{8}(9) + 6 = -3.375 + 6 = 2.625\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p020
    topics: [math.functions.quadratic]
    difficulty: 4
    type: numeric
    stem: "ร้านชานมไข่มุกขายแก้วละ $40$ บาท ขายได้วันละ $200$ แก้ว เจ้าของพบว่าทุกครั้งที่ขึ้นราคา $1$ บาท จะขายได้น้อยลงวันละ $4$ แก้ว ควรตั้งราคาแก้วละกี่บาทจึงได้รายรับต่อวันมากที่สุด (ตอบในหน่วยบาท)"
    answer: { value: 45, unit: บาท }
    hints:
      - "ให้ขึ้นราคา $n$ บาท ราคาเป็น $40 + n$ และขายได้ $200 - 4n$ แก้ว"
      - "รายรับ $R = (40 + n)(200 - 4n)$ กระจายแล้วเป็นฟังก์ชันกำลังสองของ $n$ ที่มี $a < 0$"
      - "หา $n$ ที่จุดยอด แล้วอย่าลืมบวกกลับเป็นราคา"
    misconceptions:
      - { match: 5, feedback: "นั่นคือจำนวนบาทที่ควรขึ้นราคา โจทย์ถามราคาขาย ต้องบวก $40$" }
      - { match: 8100, feedback: "นั่นคือรายรับสูงสุดต่อวัน โจทย์ถามราคาต่อแก้ว" }
    solution: "$R = (40 + n)(200 - 4n) = -4n^2 + 40n + 8{,}000$ จุดยอดที่ $n = -\\tfrac{40}{2(-4)} = 5$ ราคาจึงเป็น $45$ บาท ขายได้ $180$ แก้ว รายรับ $45 \\times 180 = 8{,}100$ บาท (มากกว่า $8{,}000$ บาทที่ราคาเดิม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.qf.p021
    topics: [math.functions.quadratic]
    difficulty: 5
    type: numeric
    stem: "นักเรียนในจังหวัดยโสธรทำบั้งไฟจำลอง ความสูงของบั้งไฟเมื่อเวลาผ่านไป $t$ วินาทีคือ $h = 40t - 5t^2$ เมตร บั้งไฟอยู่สูงกว่า $60\\ \\mathrm{m}$ เป็นเวลานานกี่วินาที (ตอบในหน่วยวินาที)"
    answer: { value: 4, unit: s }
    hints:
      - "หาช่วงเวลาที่ $40t - 5t^2 > 60$"
      - "ย้ายข้างและหารด้วย $5$: $t^2 - 8t + 12 < 0$ แล้วแยกตัวประกอบ"
      - "พาราโบลาหงาย $t^2 - 8t + 12$ ติดลบระหว่างรากทั้งสอง ความยาวช่วงคือคำตอบ"
    misconceptions:
      - { match: 6, feedback: "$t = 6$ คือเวลาที่บั้งไฟลงมาถึงระดับ $60\\ \\mathrm{m}$ แต่บั้งไฟขึ้นไปถึงระดับนี้ตั้งแต่ $t = 2$ ช่วงเวลาที่อยู่สูงกว่าจึงยาว $6 - 2$" }
      - { match: 80, feedback: "นั่นคือความสูงสูงสุด (ที่ $t = 4$) โจทย์ถามระยะเวลาที่อยู่สูงกว่า $60\\ \\mathrm{m}$" }
    solution: "$40t - 5t^2 > 60$ → $5t^2 - 40t + 60 < 0$ → $t^2 - 8t + 12 < 0$ → $(t - 2)(t - 6) < 0$ ได้ $2 < t < 6$ บั้งไฟอยู่สูงกว่า $60\\ \\mathrm{m}$ นาน $6 - 2 = 4$ วินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true
