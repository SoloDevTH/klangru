<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" font-family="sans-serif">
<title>อีเมลถึงครูหกบรรทัดมีหมายเลขกำกับ</title>
<rect x="0" y="0" width="600" height="340" fill="#fff"/>
<rect x="15.0" y="15.0" width="570.0" height="310.0" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="15.0" y="15.0" width="570.0" height="40.0" rx="8" fill="#eef2f8" stroke="#555" stroke-width="2"/>
<text x="35.0" y="41.0" font-size="15" text-anchor="start" fill="#111" font-weight="bold">To: Ms Taylor</text>
<text x="190" y="41.0" font-size="15" text-anchor="start" fill="#111" font-weight="bold">Subject: Question about the homework</text>
<circle cx="45.0" cy="90.0" r="13.0" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="45.0" y="95.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">1</text>
<text x="70.0" y="95.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">Dear Ms Taylor,</text>
<circle cx="45.0" cy="130.0" r="13.0" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="45.0" y="135.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">2</text>
<text x="70.0" y="135.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">I hope you are well.</text>
<circle cx="45.0" cy="170.0" r="13.0" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="45.0" y="175.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">3</text>
<text x="70.0" y="175.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">Could you explain question 5 of the homework, please?</text>
<circle cx="45.0" cy="210.0" r="13.0" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="45.0" y="215.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">4</text>
<text x="70.0" y="215.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">Gimme the answer by tomorrow, OK?</text>
<circle cx="45.0" cy="250.0" r="13.0" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="45.0" y="255.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">5</text>
<text x="70.0" y="255.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">Thank you very much.</text>
<circle cx="45.0" cy="290.0" r="13.0" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="45.0" y="295.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">6</text>
<text x="70.0" y="295.0" font-size="16" text-anchor="start" fill="#111" font-weight="normal">Best regards, Ploy</text>
</svg>
