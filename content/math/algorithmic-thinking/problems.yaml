problems:
  - id: math.algorithms.algorithmic-thinking.p001
    topics: [math.algorithms.algorithmic-thinking]
    difficulty: 1
    type: numeric
    stem: "ทำตามอัลกอริทึม: เริ่มที่ 2 แล้วบวก 3 ทำซ้ำ 4 ครั้ง ได้จำนวนสุดท้ายเท่าไร"
    answer: { value: 14 }
    hints:
      - "จดผลทุกครั้ง: เริ่ม 2 ครั้งที่ 1 ได้ 5"
      - "บวก 3 ให้ครบ 4 ครั้ง"
    misconceptions:
      - { match: 11, feedback: "บวกไป 3 ครั้ง (นับจำนวนเริ่มต้นเป็นครั้งที่ 1) ต้องบวก 3 ให้ครบ 4 ครั้ง" }
      - { match: 17, feedback: "บวกไป 5 ครั้ง เกินมาหนึ่งครั้ง" }
    solution: "2 → 5 → 8 → 11 → 14 (บวก 3 สี่ครั้ง) หรือ $2 + 4 \\times 3 = 14$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algorithms.algorithmic-thinking.p002
    topics: [math.algorithms.algorithmic-thinking]
    difficulty: 2
    type: mcq
    stem: "ข้อใด **ไม่** เป็นอัลกอริทึมที่ดี"
    choices:
      - { id: a, text: "ใส่น้ำตาลพอประมาณแล้วคนจนอร่อย", correct: true }
      - { id: b, text: "เริ่มที่ 1 คูณ 2 ทำซ้ำ 5 ครั้ง แล้วบอกผล", feedback: "ทุกขั้นชัดเจนและมีจุดจบ (ทำ 5 ครั้ง) จึงเป็นอัลกอริทึม" }
      - { id: c, text: "ถ้าจำนวนหารด้วย 2 ลงตัว ให้เขียนว่า คู่ ไม่เช่นนั้นเขียนว่า คี่", feedback: "มีการตัดสินใจที่ตอบได้แน่นอน จึงเป็นอัลกอริทึม" }
    hints:
      - "อัลกอริทึมต้องชัดเจนจนทุกคนทำแล้วได้ผลเหมือนกัน"
      - "คำว่า พอประมาณ และ อร่อย ทุกคนตีความเหมือนกันไหม"
    solution: "\"พอประมาณ\" และ \"จนอร่อย\" กำกวม แต่ละคนทำได้ต่างกัน และไม่รู้แน่ว่าจะหยุดเมื่อใด จึงไม่เป็นอัลกอริทึมที่ดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algorithms.algorithmic-thinking.p003
    topics: [math.algorithms.algorithmic-thinking]
    difficulty: 2
    type: numeric
    stem: "ทำตามผังงานในภาพเมื่อรับ n = 13 จะแสดงจำนวนใด"
    figure: { src: flowchart-problem.svg, alt: "ผังงาน เริ่ม รับจำนวน n แล้วถามว่า n หาร 3 ลงตัวไหม ถ้าใช่ให้ n = n ÷ 3 ถ้าไม่ใช่ให้ n = n + 4 จากนั้นถามว่า n < 10 ไหม ถ้าไม่ใช่วนกลับไปถามว่า n หาร 3 ลงตัวไหมอีกครั้ง ถ้าใช่แสดง n" }
    answer: { value: 7 }
    hints:
      - "13 หาร 3 ไม่ลงตัว จึงบวก 4 ได้ 17 แล้วตรวจว่า 17 < 10 ไหม"
      - "ทำซ้ำต่อ: ตรวจหาร 3 ลงตัว ปรับค่า แล้วตรวจ n < 10 ทุกรอบ"
    misconceptions:
      - { match: 17, feedback: "หยุดหลังรอบแรก แต่ 17 ไม่น้อยกว่า 10 ต้องวนกลับไปทำต่อ" }
      - { match: 21, feedback: "21 ยังไม่น้อยกว่า 10 ต้องวนต่ออีกรอบ (21 หาร 3 ลงตัว)" }
    solution: "13 → 13 + 4 = 17 (ไม่ < 10) → 17 + 4 = 21 (ไม่ < 10) → 21 ÷ 3 = 7 (< 10) แสดง 7"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algorithms.algorithmic-thinking.p004
    topics: [math.algorithms.algorithmic-thinking]
    difficulty: 2
    type: numeric
    stem: "ใช้กฎ \"ถ้าเป็นจำนวนคู่ให้หารด้วย 2 ถ้าเป็นจำนวนคี่ให้คูณ 3 แล้วบวก 1\" เริ่มที่ 6 ต้องใช้กฎกี่ครั้งจึงได้ 1"
    answer: { value: 8, unit: ครั้ง }
    hints:
      - "จดทุกจำนวนที่ได้: 6, 3, 10, ..."
      - "นับจำนวนครั้งที่ใช้กฎ ไม่นับจำนวนเริ่มต้น"
    misconceptions:
      - { match: 9, feedback: "9 คือจำนวนตัวในลำดับรวม 6 ด้วย แต่จำนวนครั้งที่ใช้กฎน้อยกว่าจำนวนตัว 1" }
    solution: "6 → 3 → 10 → 5 → 16 → 8 → 4 → 2 → 1 ใช้กฎ 8 ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algorithms.algorithmic-thinking.p005
    topics: [math.algorithms.algorithmic-thinking]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนของอัลกอริทึมของยุคลิดเพื่อหา ห.ร.ม. ของ 48 กับ 18"
    items:
      - "$48 = 2 \\times 18 + 12$"
      - "$18 = 1 \\times 12 + 6$"
      - "$12 = 2 \\times 6 + 0$"
      - "เศษเป็น 0 ตัวหารสุดท้ายคือ ห.ร.ม. = 6"
    hints:
      - "เริ่มจากหารจำนวนใหญ่ด้วยจำนวนเล็ก"
      - "ทุกขั้นนำตัวหารเดิมมาหารด้วยเศษ"
    solution: "หาร 48 ด้วย 18 เศษ 12 → หาร 18 ด้วย 12 เศษ 6 → หาร 12 ด้วย 6 เศษ 0 → ห.ร.ม. คือ 6"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algorithms.algorithmic-thinking.p006
    topics: [math.algorithms.algorithmic-thinking]
    difficulty: 3
    type: numeric
    stem: "ใช้อัลกอริทึมของยุคลิดหา ห.ร.ม. ของ 84 กับ 36"
    answer: { value: 12 }
    hints:
      - "$84 = 2 \\times 36 + 12$"
      - "ต่อด้วยการหาร 36 ด้วยเศษ 12"
    misconceptions:
      - { match: 2, feedback: "2 คือผลหารครั้งแรก ห.ร.ม. คือตัวหารสุดท้ายเมื่อเศษเป็น 0" }
      - { match: 4, feedback: "4 เป็นตัวหารร่วมแต่ไม่ใช่ตัวที่มากที่สุด ทำอัลกอริทึมให้จบจนเศษเป็น 0" }
    solution: "$84 = 2 \\times 36 + 12$ แล้ว $36 = 3 \\times 12 + 0$ เศษเป็น 0 ห.ร.ม. คือ 12"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algorithms.algorithmic-thinking.p007
    topics: [math.algorithms.algorithmic-thinking]
    difficulty: 3
    type: numeric
    stem: "เขียนจำนวน 2 ถึง 30 วงกลม 2 แล้วขีดพหุคูณอื่นของ 2 ทั้งหมด จากนั้นวงกลม 3 แล้วขีดพหุคูณอื่นของ 3 ทั้งหมด จะเหลือจำนวนที่ยังไม่ถูกขีด (รวม 2 กับ 3) กี่จำนวน"
    answer: { value: 11, unit: จำนวน }
    hints:
      - "จำนวนที่เหลือคือ 2, 3 และจำนวนที่ไม่ใช่พหุคูณของ 2 และของ 3"
      - "ลองเขียน 5, 7, 11, ... ไปจนถึง 29"
    misconceptions:
      - { match: 10, feedback: "จำนวนเฉพาะถึง 30 มี 10 ตัว แต่ยังไม่ได้ขีดพหุคูณของ 5 จึงยังเหลือ 25 อยู่" }
      - { match: 9, feedback: "อย่าลืมนับ 2 และ 3 ที่ถูกวงกลมไว้ ไม่ได้ถูกขีด" }
    solution: "เหลือ 2, 3, 5, 7, 11, 13, 17, 19, 23, 25, 29 รวม 11 จำนวน (25 ยังไม่ถูกขีดเพราะยังไม่ได้ทำขั้นของ 5)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algorithms.algorithmic-thinking.p008
    topics: [math.algorithms.algorithmic-thinking]
    difficulty: 3
    type: numeric
    stem: "อัลกอริทึม: เขียน 1 เป็นจำนวนแรก แล้วคูณจำนวนล่าสุดด้วย 2 เพื่อได้จำนวนถัดไป จำนวนที่ 6 คืออะไร"
    answer: { value: 32 }
    hints:
      - "จำนวนที่ 1 คือ 1 จำนวนที่ 2 คือ 2"
      - "1, 2, 4, 8, ..."
    misconceptions:
      - { match: 64, feedback: "นับ 1 เป็นจำนวนที่ 0 จำนวนที่ 6 คือ 32 เพราะ 1 เป็นจำนวนที่ 1" }
      - { match: 12, feedback: "บวก 2 แทนการคูณ 2 หรือคูณ 6 กับ 2 อัลกอริทึมให้คูณด้วย 2 ซ้ำ" }
    solution: "1, 2, 4, 8, 16, 32 จำนวนที่ 6 คือ 32"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algorithms.algorithmic-thinking.p009
    topics: [math.algorithms.algorithmic-thinking]
    difficulty: 3
    type: match
    stem: "ใช้แผนภาพต้นไม้จำแนกรูปสี่เหลี่ยม จับคู่คำตอบของคำถามกับชื่อรูป"
    pairs:
      - { left: "ด้านขนาน 2 คู่ มีมุมฉาก ด้านยาวเท่ากันทุกด้าน", right: "สี่เหลี่ยมจัตุรัส" }
      - { left: "ด้านขนาน 2 คู่ มีมุมฉาก ด้านยาวไม่เท่ากันทุกด้าน", right: "สี่เหลี่ยมผืนผ้า" }
      - { left: "ด้านขนาน 2 คู่ ไม่มีมุมฉาก ด้านยาวเท่ากันทุกด้าน", right: "สี่เหลี่ยมขนมเปียกปูน" }
      - { left: "ด้านขนาน 1 คู่", right: "สี่เหลี่ยมคางหมู" }
    hints:
      - "เริ่มจากคำถามแรก: ด้านขนานกี่คู่"
      - "รูปที่มีด้านขนาน 2 คู่ แยกด้วยมุมฉากและความยาวด้าน"
    solution: "ตามแผนภาพต้นไม้: 2 คู่ + มุมฉาก + ด้านเท่า = จัตุรัส, 2 คู่ + มุมฉาก + ด้านไม่เท่า = ผืนผ้า, 2 คู่ + ไม่มีมุมฉาก + ด้านเท่า = ขนมเปียกปูน, 1 คู่ = คางหมู"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algorithms.algorithmic-thinking.p010
    topics: [math.algorithms.algorithmic-thinking]
    difficulty: 4
    type: mcq
    stem: "เก่งเขียนอัลกอริทึม \"ลองหาร n ด้วยทุกจำนวนตั้งแต่ 2 ถึง n − 1 ถ้าไม่มีจำนวนใดหารลงตัว ให้ตอบว่า n เป็นจำนวนเฉพาะ\" อัลกอริทึมนี้ผิดเมื่อใด และควรปรับอย่างไร"
    choices:
      - { id: a, text: "ผิดเมื่อ n = 1 เพราะไม่มีจำนวนให้ลอง จึงตอบว่าเป็นจำนวนเฉพาะ ควรเพิ่มขั้นแรกว่า ถ้า n < 2 ตอบว่าไม่ใช่", correct: true }
      - { id: b, text: "ผิดเมื่อ n = 2 เพราะ 2 เป็นจำนวนคู่ ควรตอบว่าจำนวนคู่ทุกตัวไม่ใช่จำนวนเฉพาะ", feedback: "2 เป็นจำนวนเฉพาะ (ตัวประกอบมีแค่ 1 กับ 2) อัลกอริทึมเดิมตอบถูกแล้ว" }
      - { id: c, text: "ผิดเมื่อ n = 9 เพราะ 9 เป็นจำนวนคี่", feedback: "ลองหาร 9 ด้วย 3 ลงตัว อัลกอริทึมจึงตอบถูกว่าไม่ใช่จำนวนเฉพาะ" }
      - { id: d, text: "ไม่ผิดเลย ใช้ได้ทุกจำนวนนับ", feedback: "ลองกรณีขอบ n = 1 ดู ไม่มีจำนวนระหว่าง 2 ถึง 0 ให้ลองเลย" }
    hints:
      - "ลองกรณีขอบ เช่น n = 1 และ n = 2"
      - "1 เป็นจำนวนเฉพาะไหม"
    solution: "เมื่อ n = 1 ช่วง 2 ถึง 0 ไม่มีจำนวนให้ลอง อัลกอริทึมจึงตอบว่า 1 เป็นจำนวนเฉพาะ ซึ่งผิด ต้องเพิ่มขั้นแรก: ถ้า n < 2 ตอบว่าไม่ใช่จำนวนเฉพาะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algorithms.algorithmic-thinking.p011
    topics: [math.algorithms.algorithmic-thinking]
    difficulty: 4
    type: numeric
    stem: "อัลกอริทึมวาดรูปหกเหลี่ยมด้านเท่ามุมเท่าด้วยเต่า: ทำซ้ำ 6 ครั้ง เดินหน้า 100 แล้วหมุนซ้าย x องศา x ต้องเป็นกี่องศา เต่าจึงกลับมาที่จุดเริ่มพอดี"
    answer: { value: 60, unit: องศา }
    hints:
      - "เดินครบหนึ่งรอบ เต่าหมุนรวมกี่องศา"
      - "หมุนรวม 360 องศา แบ่งเป็น 6 ครั้งเท่ากัน"
    misconceptions:
      - { match: 120, feedback: "120 องศาคือมุมภายในของหกเหลี่ยมด้านเท่า แต่เต่าหมุนเท่ากับมุมภายนอก" }
      - { match: 720, feedback: "720 องศาคือผลรวมมุมภายใน เต่าหมุนทีละครั้ง ครั้งละ $360 \\div 6$" }
    solution: "เดินครบรอบเต่าหมุนรวม $360^\\circ$ หมุน 6 ครั้งเท่ากัน ครั้งละ $360 \\div 6 = 60^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algorithms.algorithmic-thinking.p012
    topics: [math.algorithms.algorithmic-thinking]
    difficulty: 4
    type: numeric
    stem: "ครูจะจัดนักเรียน 36 คนเข้าแถวให้ทุกแถวมีจำนวนเท่ากัน จึงใช้อัลกอริทึมหาตัวประกอบของ 36 โดยลองหารด้วย 1, 2, 3, ... และหยุดเมื่อจำนวนที่ลองคูณตัวเองเกิน 36 ได้ตัวประกอบทั้งหมดกี่จำนวน"
    answer: { value: 9, unit: จำนวน }
    hints:
      - "ตัวประกอบมาเป็นคู่ เช่น $2 \\times 18$"
      - "ลอง 1 ถึง 6 แล้วเขียนคู่ของแต่ละตัว ระวัง $6 \\times 6$ ได้ตัวประกอบตัวเดียว"
    misconceptions:
      - { match: 10, feedback: "นับ 6 สองครั้งจากคู่ $6 \\times 6$ ตัวประกอบ 6 นับครั้งเดียว" }
      - { match: 5, feedback: "5 คือจำนวนคู่ที่หาได้ แต่ละคู่มีตัวประกอบสองตัว (ยกเว้นคู่ $6 \\times 6$)" }
    solution: "คู่ตัวประกอบ: $1 \\times 36$, $2 \\times 18$, $3 \\times 12$, $4 \\times 9$, $6 \\times 6$ (5 ไม่ลงตัว และ $7 \\times 7 > 36$ จึงหยุด) ตัวประกอบคือ 1, 2, 3, 4, 6, 9, 12, 18, 36 รวม 9 จำนวน ครูจึงจัดแถวได้ 9 แบบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algorithms.algorithmic-thinking.p013
    topics: [math.algorithms.algorithmic-thinking]
    difficulty: 4
    type: mcq
    stem: "อัลกอริทึม: เริ่มที่ 1 แล้วบวกจำนวนคี่ถัดไปทีละตัว (บวก 3, บวก 5, บวก 7, ...) จำนวนที่ได้มีแบบรูปอย่างไร"
    choices:
      - { id: a, text: "เป็นจำนวนกำลังสอง 1, 4, 9, 16, ...", correct: true }
      - { id: b, text: "เป็นจำนวนคี่ทั้งหมด", feedback: "1 + 3 = 4 เป็นจำนวนคู่ ลองเขียนผลจริงสักห้าตัว" }
      - { id: c, text: "เพิ่มขึ้นทีละ 2 เท่ากันทุกครั้ง", feedback: "จำนวนที่บวกเพิ่มขึ้นทีละ 2 แต่ผลลัพธ์เพิ่มขึ้นไม่เท่ากัน (3, 5, 7, ...)" }
      - { id: d, text: "เป็นพหุคูณของ 3", feedback: "4 และ 16 ไม่ใช่พหุคูณของ 3" }
    hints:
      - "เขียนผล: 1, 1 + 3, 1 + 3 + 5, ..."
      - "ได้ 1, 4, 9, 16 จำนวนเหล่านี้เป็นอะไร"
    solution: "1, 4, 9, 16, 25, ... เป็นจำนวนกำลังสอง เพราะจำนวนคี่ตัวถัดไปเติมรูปตัวแอลรอบจัตุรัสเดิมให้เป็นจัตุรัสที่ใหญ่ขึ้นด้านละ 1"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.algorithms.algorithmic-thinking.p014
    topics: [math.algorithms.algorithmic-thinking]
    difficulty: 5
    type: numeric
    stem: "ใช้กฎ \"ถ้าเป็นจำนวนคู่ให้หารด้วย 2 ถ้าเป็นจำนวนคี่ให้คูณ 3 แล้วบวก 1\" เริ่มที่ 7 ต้องใช้กฎกี่ครั้งจึงได้ 1"
    answer: { value: 16, unit: ครั้ง }
    hints:
      - "เริ่ม 7 → 22 → 11 → ... จดทุกจำนวน"
      - "ค่าจะขึ้นไปถึง 52 ก่อนจะลดลง อย่าหยุดกลางทาง"
