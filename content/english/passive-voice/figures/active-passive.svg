<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="sans-serif">
<title>เปลี่ยนประโยค active เป็น passive</title>
<rect x="0" y="0" width="700" height="300" fill="#fff"/>
<text x="22.0" y="68.0" font-size="16" text-anchor="start" fill="#444" font-weight="bold">active</text>
<rect x="120.0" y="40.0" width="102.7" height="44.0" rx="6" fill="#eee" stroke="#777" stroke-width="2"/>
<text x="171.3" y="69.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">Workers</text>
<rect x="234.7" y="40.0" width="72.6" height="44.0" rx="6" fill="#dbe8fb" stroke="#2f5fa8" stroke-width="2"/>
<text x="271.0" y="69.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">clean</text>
<rect x="319.3" y="40.0" width="152.7" height="44.0" rx="6" fill="#fde7cf" stroke="#c46a12" stroke-width="2"/>
<text x="395.7" y="69.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">the classroom</text>
<rect x="484.1" y="40.0" width="117.6" height="44.0" rx="6" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="542.9" y="69.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">every day.</text>
<text x="22.0" y="218.0" font-size="16" text-anchor="start" fill="#444" font-weight="bold">passive</text>
<rect x="120.0" y="190.0" width="155.1" height="44.0" rx="6" fill="#fde7cf" stroke="#c46a12" stroke-width="2"/>
<text x="197.5" y="219.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">The classroom</text>
<rect x="287.1" y="190.0" width="112.8" height="44.0" rx="6" fill="#dbe8fb" stroke="#2f5fa8" stroke-width="2"/>
<text x="343.5" y="219.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">is cleaned</text>
<rect x="411.9" y="190.0" width="112.6" height="44.0" rx="6" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="468.2" y="219.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">every day</text>
<rect x="536.5" y="190.0" width="152.7" height="44.0" rx="6" fill="#eee" stroke="#777" stroke-width="2"/>
<text x="612.8" y="219.0" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">(by workers).</text>
<line x1="395.7" y1="86.0" x2="197.5" y2="186.0" stroke="#c46a12" stroke-width="3" stroke-linecap="round"/>
<polygon points="197.5,186.0 204.8,176.5 209.5,185.8" fill="#c46a12" stroke="#c46a12" stroke-width="1" stroke-linejoin="round"/>
<line x1="271.0" y1="86.0" x2="343.5" y2="186.0" stroke="#2f5fa8" stroke-width="3" stroke-linecap="round"/>
<polygon points="343.5,186.0 332.9,180.3 341.4,174.2" fill="#2f5fa8" stroke="#2f5fa8" stroke-width="1" stroke-linejoin="round"/>
<line x1="171.3" y1="86.0" x2="592.8" y2="186.0" stroke="#777" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="592.8,186.0 581.1,188.6 583.5,178.4" fill="#777" stroke="#777" stroke-width="1" stroke-linejoin="round"/>
<text x="140.0" y="142.0" font-size="15" text-anchor="start" fill="#c46a12" font-weight="bold">กรรม → ประธาน</text>
<text x="350.0" y="174.0" font-size="15" text-anchor="start" fill="#2f5fa8" font-weight="bold">be + V3</text>
<text x="610.0" y="112.0" font-size="15" text-anchor="middle" fill="#555" font-weight="bold">ผู้กระทำ → by ...</text>
<text x="610.0" y="130.0" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">(ตัดได้)</text>
<text x="350.0" y="272.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">is / are + V3 (ปัจจุบัน)   ·   was / were + V3 (อดีต)   ·   must / should + be + V3</text>
</svg>
