problems:
- id: thai.composition.narrative-descriptive.p001
  topics:
  - thai.composition.narrative-descriptive
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นประโยค **พรรณนา** ที่ทำให้เห็นภาพมากที่สุด
  choices:
  - id: a
    text: ดอกกุหลาบสีแดงก่ำ กลีบนุ่มเหมือนกำมะหยี่ ส่งกลิ่นหอมอ่อน ๆ
    correct: true
    feedback: ถูก ใช้คำขยาย การเปรียบเทียบ และประสาทสัมผัส
  - id: b
    text: ดอกกุหลาบสวยมาก
    feedback: กว้างเกินไป ไม่เห็นภาพ
  - id: c
    text: แม่ซื้อดอกกุหลาบมาสามดอก
    feedback: บอกเหตุการณ์ เป็นการบรรยาย
  - id: d
    text: กุหลาบเป็นไม้ดอก
    feedback: เป็นข้อมูลทั่วไป
  hints:
  - พรรณนาใช้ประสาทสัมผัสและการเปรียบเทียบ
  - ข้อใดบอกสี สัมผัส และกลิ่น
  solution: ข้อแรกใช้ **สี (แดงก่ำ) สัมผัส (นุ่มเหมือนกำมะหยี่) กลิ่น (หอมอ่อน ๆ)** จึงเห็นภาพ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.narrative-descriptive.p002
  topics:
  - thai.composition.narrative-descriptive
  difficulty: 1
  type: match
  stem: จับคู่ประสาทสัมผัสกับคำพรรณนา
  pairs:
  - left: ตา เห็น
    right: ท้องฟ้าสีส้มอมชมพูยามเย็น
  - left: หู ได้ยิน
    right: เสียงฝนกระทบหลังคาเปาะแปะ
  - left: จมูก ได้กลิ่น
    right: กลิ่นข้าวหอมมะลิเพิ่งหุงเสร็จ
  - left: ผิว สัมผัส
    right: ลมหนาวเย็นเฉียบจนขนลุก
  hints:
  - ถามว่ารับรู้ด้วยอวัยวะใด
  - เสียงเปาะแปะรับรู้ด้วยหู
  solution: เห็น = ท้องฟ้าสีส้ม · ได้ยิน = เสียงฝนเปาะแปะ · ได้กลิ่น = ข้าวหอมมะลิ · สัมผัส = ลมหนาวเย็นเฉียบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.narrative-descriptive.p003
  topics:
  - thai.composition.narrative-descriptive
  difficulty: 2
  type: mcq
  stem: อ่านบันทึกในภาพ บรรทัดใดบอก **สิ่งที่ได้เรียนรู้**
  figure: &id001
    src: diary-entry.svg
    alt: บันทึกประจำวันสมมุติ 6 บรรทัด (ก) วันเสาร์ที่ 7 พฤศจิกายน 2569 ฟ้าครึ้ม ฝนตกบ่าย (ข) วันนี้ฉันช่วยยายทำกระทงใบตองสามใบไว้ลอยในงานที่จะถึงนี้ (ค) ตอนแรกพับกลีบไม่สวย ใบตองฉีกขาดหลายครั้ง (ง) ยายสอนให้เช็ดใบตองให้แห้งก่อน แล้วพับช้า ๆ (จ) ใบที่สามสวยที่สุด ฉันภูมิใจมาก (ฉ) ฉันได้เรียนรู้ว่างานฝีมือต้องใจเย็น พรุ่งนี้จะทำอีกใบให้น้อง
  choices:
  - id: a
    text: (ฉ)
    correct: true
    feedback: ถูก ฉันได้เรียนรู้ว่างานฝีมือต้องใจเย็น
  - id: b
    text: (ก)
    feedback: บอกวันที่และอากาศ
  - id: c
    text: (ข)
    feedback: บอกเหตุการณ์สำคัญของวัน
  - id: d
    text: (จ)
    feedback: บอกผลและความรู้สึก
  hints:
  - หาคำว่า ได้เรียนรู้
  - มักอยู่ท้ายบันทึก
  solution: บรรทัด **(ฉ)** บอกสิ่งที่ได้เรียนรู้และแผนวันพรุ่งนี้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.narrative-descriptive.p004
  topics:
  - thai.composition.narrative-descriptive
  difficulty: 2
  type: mcq
  stem: อ่านบันทึกในภาพ บรรทัดใดบอก **ความรู้สึก** ของผู้เขียนชัดที่สุด
  figure: *id001
  choices:
  - id: a
    text: (จ)
    correct: true
    feedback: ถูก มีคำว่า ภูมิใจมาก
  - id: b
    text: (ค)
    feedback: บอกปัญหาที่เกิดขึ้น ไม่ได้บอกความรู้สึกตรง ๆ
  - id: c
    text: (ง)
    feedback: บอกสิ่งที่ยายสอน
  - id: d
    text: (ก)
    feedback: บอกวันที่และอากาศ
  hints:
  - ความรู้สึกมีคำเช่น ดีใจ เสียใจ ภูมิใจ
  - หาคำบอกอารมณ์
  solution: บรรทัด **(จ)** "ฉันภูมิใจมาก"
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.narrative-descriptive.p005
  topics:
  - thai.composition.narrative-descriptive
  difficulty: 2
  type: order
  stem: เรียงช่วงของ **โครงเรื่องแบบภูเขา** ให้ถูก
  items:
  - เปิดเรื่อง
  - ปมปัญหา
  - จุดสูงสุด
  - คลี่คลาย
  - จบเรื่อง
  hints:
  - เรื่องเริ่มจากแนะนำตัวละคร
  - จุดสูงสุดอยู่ตรงกลาง แล้วปัญหาค่อย ๆ หมดไป
  solution: เปิดเรื่อง → ปมปัญหา → จุดสูงสุด → คลี่คลาย → จบเรื่อง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.narrative-descriptive.p006
  topics:
  - thai.composition.narrative-descriptive
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นการ **บรรยายสิ่งของได้ชัดเจน** สำหรับผู้อ่านที่ไม่เคยเห็น
  choices:
  - id: a
    text: กระติกน้ำทรงกระบอกสูงประมาณหนึ่งคืบ สีเขียว ฝาเกลียวมีหูหิ้ว เก็บน้ำเย็นได้ทั้งวัน
    correct: true
    feedback: ถูก บอกชื่อ รูปร่าง ขนาด สี ส่วนประกอบ และการใช้
  - id: b
    text: กระติกน้ำของฉันน่ารักที่สุดในห้อง
    feedback: เป็นความเห็น ไม่บอกลักษณะ
  - id: c
    text: ฉันได้กระติกน้ำเป็นของขวัญวันเกิด
    feedback: เล่าเหตุการณ์ ไม่บอกลักษณะ
  - id: d
    text: กระติกน้ำใบนี้ใช้ใส่น้ำ
    feedback: บอกเพียงการใช้
  hints:
  - บรรยายสิ่งของเรียงจากภาพรวมไปส่วนย่อย
  - ข้อใดบอกรูปร่าง ขนาด สี และส่วนประกอบ
  solution: ข้อแรกครบ **รูปร่าง ขนาด สี ส่วนประกอบ และการใช้**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.narrative-descriptive.p007
  topics:
  - thai.composition.narrative-descriptive
  difficulty: 3
  type: mcq
  stem: ข้อความ "ปู่ของผมเกิดที่จังหวัดน่าน ท่านเป็นครูมาสามสิบปี ท่านเชื่อว่าการอ่านทำให้คนไม่แก่" เป็นงานเขียนประเภทใด
  choices:
  - id: a
    text: ชีวประวัติ
    correct: true
    feedback: ถูก เล่าชีวิตของผู้อื่น (ปู่) ใช้สรรพนาม ท่าน
  - id: b
    text: อัตชีวประวัติ
    feedback: อัตชีวประวัติเล่าชีวิตของตนเอง
  - id: c
    text: บันทึกประจำวัน
    feedback: ไม่มีวันที่และไม่ใช่เหตุการณ์ของวันนั้น
  - id: d
    text: เรื่องจากจินตนาการ
    feedback: เป็นข้อมูลชีวิตจริง
  hints:
  - ข้อความเล่าชีวิตของใคร
  - สังเกตสรรพนาม ท่าน
  solution: เล่าชีวิตของ **ปู่** (ผู้อื่น) จึงเป็น **ชีวประวัติ**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.narrative-descriptive.p008
  topics:
  - thai.composition.narrative-descriptive
  difficulty: 3
  type: mcq
  stem: นักเรียนเขียนอัตชีวประวัติว่า "ฉันเกิดที่ลำปาง ตอนเด็กเขาชอบวาดรูป ฉันจึงเข้าชุมนุมศิลปะ" ควรแก้ที่ใด
  choices:
  - id: a
    text: เปลี่ยน เขา เป็น ฉัน ให้สรรพนามเหมือนกันตลอด
    correct: true
    feedback: ถูก อัตชีวประวัติเล่าเรื่องตนเอง ต้องใช้สรรพนามบุรุษที่หนึ่งตลอด
  - id: b
    text: เปลี่ยน ฉัน เป็น เขา ทั้งหมด
    feedback: จะกลายเป็นชีวประวัติ
  - id: c
    text: ตัดเรื่องการวาดรูปออก
    feedback: เป็นรายละเอียดที่ดี ไม่ต้องตัด
  - id: d
    text: ไม่ต้องแก้
    feedback: ใช้สรรพนามสลับ ผู้อ่านจะงง
  hints:
  - อัตชีวประวัติเล่าชีวิตของใคร
  - สรรพนามต้องคงที่
  solution: อัตชีวประวัติใช้ **ฉัน** ตลอด จึงแก้ เขา เป็น ฉัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.narrative-descriptive.p009
  topics:
  - thai.composition.narrative-descriptive
  difficulty: 3
  type: text
  stem: 'เติมคำบอกลำดับ 1 คำ ให้เรื่องต่อเนื่อง: "ฉันรอรถเมล์อยู่นาน ____ ฝนก็เทลงมา ฉันจึงวิ่งหลบใต้ศาลา" (เลือกจาก: ทันใดนั้น / ในที่สุด / ก่อนอื่น)'
  accepted:
  - ทันใดนั้น
  misconceptions:
  - match: ในที่สุด
    feedback: ใช้กับตอนจบหลังรอหรือพยายามมานาน แต่ฝนตกอย่างกะทันหัน
  - match: ก่อนอื่น
    feedback: ใช้กับขั้นแรก ไม่ใช่เหตุการณ์ที่เกิดขึ้นกะทันหัน
  hints:
  - ฝนตกแบบค่อย ๆ หรือกะทันหัน
  - คำใดบอกว่าเกิดขึ้นทันที
  solution: ฝนตกกะทันหัน ใช้ **ทันใดนั้น**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.narrative-descriptive.p010
  topics:
  - thai.composition.narrative-descriptive
  difficulty: 4
  type: mcq
  stem: นักเรียน ม.1 เขียนบรรยายประสบการณ์ว่า "การไปค่ายลูกเสือทำให้ฉันกล้าเป็นผู้นำมากขึ้น" ประโยคใดเป็น **รายละเอียดสนับสนุน** ที่ดีที่สุด
  choices:
  - id: a
    text: คืนที่สอง ฉันต้องนำหมู่เดินฐานกลางคืน ทั้งที่กลัว แต่ก็พาเพื่อนกลับมาครบทุกคน
    correct: true
    feedback: ถูก เป็นเหตุการณ์จริงที่แสดงความกล้าเป็นผู้นำ
  - id: b
    text: ค่ายจัดที่จังหวัดกาญจนบุรี
    feedback: เป็นข้อมูลจริง แต่ไม่สนับสนุนเรื่องความเป็นผู้นำ
  - id: c
    text: อาหารในค่ายอร่อยมาก
    feedback: ไม่เกี่ยวกับสาระสำคัญ
  - id: d
    text: ค่ายลูกเสือมีมานานแล้ว
    feedback: เป็นข้อมูลทั่วไป ไม่สนับสนุนสาระ
  hints:
  - รายละเอียดสนับสนุนต้องช่วยพิสูจน์สาระสำคัญ
  - สาระสำคัญพูดถึงความกล้าเป็นผู้นำ
  solution: เหตุการณ์ **นำหมู่เดินฐานกลางคืน** แสดงความกล้าเป็นผู้นำโดยตรง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.narrative-descriptive.p011
  topics:
  - thai.composition.narrative-descriptive
  difficulty: 4
  type: mcq
  stem: 'เรื่องจินตนาการ: "ดินสอวิเศษวาดอะไรก็กลายเป็นจริง เด็กชายวาดสะพานข้ามแม่น้ำให้หมู่บ้าน แต่ลืมวาดราวกั้น ..." ตอนจบใดสมเหตุสมผลและคลี่คลายด้วยการกระทำของตัวละครมากที่สุด'
  choices:
  - id: a
    text: เด็กชายรีบวาดราวกั้นเพิ่ม แล้วชวนชาวบ้านช่วยกันตรวจทุกช่วงก่อนเปิดใช้
    correct: true
    feedback: ถูก ตัวละครแก้ปัญหาเองและสอดคล้องกับเรื่อง
  - id: b
    text: แล้วเด็กชายก็ตื่นขึ้นมา ทั้งหมดเป็นความฝัน
    feedback: ไม่ได้คลี่คลายปัญหา ทำให้เรื่องที่เล่ามาไม่มีความหมาย
  - id: c
    text: ดินสอหายไปเฉย ๆ เรื่องจบ
    feedback: ไม่มีเหตุผลในเรื่อง
  - id: d
    text: ทุกคนลืมเรื่องสะพาน
    feedback: ปัญหาไม่ได้รับการแก้
  hints:
  - ปมปัญหาคือสะพานไม่มีราวกั้น
  - ตอนจบที่ดีให้ตัวละครแก้ปัญหาเอง
  solution: ตอนจบที่ดี **ตัวละครแก้ปัญหาเอง** และสมเหตุสมผลกับพลังของดินสอ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.narrative-descriptive.p012
  topics:
  - thai.composition.narrative-descriptive
  difficulty: 4
  type: mcq
  stem: เปลี่ยนประโยคบรรยาย "ตลาดน้ำมีคนมาก" ให้เป็น **พรรณนา** ข้อใดดีที่สุด
  choices:
  - id: a
    text: เรือพายลำเล็กเบียดกันเต็มคลอง แม่ค้าส่งเสียงเรียกลูกค้า กลิ่นก๋วยเตี๋ยวเรือลอยมาตามลม
    correct: true
    feedback: ถูก ใช้การเห็น ได้ยิน และได้กลิ่น
  - id: b
    text: ตลาดน้ำมีคนมากมากมาก
    feedback: ซ้ำคำ แต่ยังไม่เห็นภาพ
  - id: c
    text: ตลาดน้ำมีคนประมาณห้าร้อยคน
    feedback: เพิ่มตัวเลข แต่ยังเป็นการบรรยาย
  - id: d
    text: ตลาดน้ำเปิดทุกวันเสาร์อาทิตย์
    feedback: เป็นข้อมูล ไม่ใช่การพรรณนา
  hints:
  - พรรณนาให้ผู้อ่านเห็นภาพและรู้สึกตาม
  - ใช้ประสาทสัมผัสหลายอย่าง
  solution: ข้อแรกใช้ **ภาพ เสียง และกลิ่น** ผู้อ่านจึงรู้สึกเหมือนอยู่ที่ตลาดน้ำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.composition.narrative-descriptive.p013
  topics:
  - thai.composition.narrative-descriptive
  difficulty: 4
  type: order
  stem: เรียงขั้นตอนการ **ผลิตงานเขียน** ของตนเอง
  items:
  - วางแผนว่าจะเขียนอะไร ให้ใครอ่าน
  - เขียนร่าง
  - อ่านทบทวนร่าง
  - แก้ไขให้ชัดเจนและถูกต้อง
  - เผยแพร่ให้ผู้อ่าน
  hints:
  - เริ่มจากคิดก่อนเขียน
  - เผยแพร่เป็นขั้นสุดท้าย
  solution: วางแผน → ร่าง → ทบทวน → แก้ไข → เผยแพร่
