<text x="320" y="330" text-anchor="middle" font-size="12" fill="#444">สมดุลเมื่อแรงไฟฟ้าเท่ากับแรงแม่เหล็ก: eE<tspan baseline-shift="sub" font-size="75%">H</tspan> = ev<tspan baseline-shift="sub" font-size="75%">d</tspan>B</text>
<text x="320" y="356" text-anchor="middle" font-size="12" fill="#666">ภาพไม่ได้วาดตามมาตราส่วน</text>
