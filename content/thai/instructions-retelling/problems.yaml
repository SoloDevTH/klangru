- id: thai.listening.instructions-retelling.p013
  topics:
  - thai.listening.instructions-retelling
  difficulty: 4
  type: mcq
  stem: 'สารคดีที่ดู: *ผึ้งงานเป็นผึ้งเพศเมีย มีหน้าที่หาน้ำหวานจากดอกไม้ เมื่อพบแหล่งอาหาร มันจะบินกลับรังแล้วเต้นเป็นรูปเลขแปดเพื่อบอกทางให้ผึ้งตัวอื่น ระหว่างที่บินจากดอกหนึ่งไปอีกดอกหนึ่ง ผึ้งช่วยพาเรณูไปด้วย ดอกไม้จึงติดผลได้*


    ข้อใด **เล่ารายละเอียด** ได้ถูกต้องครบที่สุด'
  choices:
  - id: a
    text: ผึ้งงานหาน้ำหวาน เต้นเลขแปดบอกทางเพื่อน และช่วยพาเรณูให้ดอกไม้ติดผล
    correct: true
    feedback: ถูก มีข้อเท็จจริงสำคัญครบทั้งสามเรื่อง
  - id: b
    text: ผึ้งงานเป็นเพศผู้ มีหน้าที่หาน้ำหวาน
    feedback: สารคดีบอกว่าผึ้งงานเป็นเพศเมีย และยังขาดเรื่องการเต้นกับการพาเรณู
  - id: c
    text: ผึ้งเต้นรำเพราะดีใจที่ได้กินน้ำหวาน
    feedback: ผึ้งเต้นเพื่อบอกทาง ไม่ได้เต้นเพราะดีใจ อย่าเติมเหตุผลเอง
  - id: d
    text: ผึ้งน่ารักมาก ฉันอยากเลี้ยงผึ้ง
    feedback: นี่คือความรู้สึกของเรา ไม่ใช่การเล่าเรื่องที่ดู
  hints:
  - เรื่องให้ความรู้ต้องเล่าข้อเท็จจริงให้ถูก
  - 'ตรวจทีละข้อ: เพศ หน้าที่ การเต้น เรณู'
  solution: เล่าได้ครบและถูกที่สุดคือ **หาน้ำหวาน เต้นเลขแปดบอกทาง และช่วยพาเรณู**
