<defs></defs>
<rect x="0" y="0" width="860" height="400" fill="#fff"/>
<rect x="10.0" y="10.0" width="840.0" height="380.0" rx="12" fill="#fafafa" stroke="#90a4ae" stroke-width="2"/>
