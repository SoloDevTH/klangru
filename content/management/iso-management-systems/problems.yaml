problems:
  - id: management.quality.iso-management-systems.p001
    topics: [management.quality.iso-management-systems]
    difficulty: 1
    type: match
    stem: "จับคู่ข้อของ ISO 9001 (ฉบับ 2015) กับสาระโดยสรุป"
    pairs:
      - { left: "ข้อ 4 บริบทขององค์กร", right: "เข้าใจปัจจัยภายในภายนอก ผู้มีส่วนได้ส่วนเสีย และกำหนดขอบเขตของระบบ" }
      - { left: "ข้อ 5 ภาวะผู้นำ", right: "ผู้บริหารสูงสุดออกนโยบายคุณภาพและมอบหมายบทบาทหน้าที่" }
      - { left: "ข้อ 6 การวางแผน", right: "รับมือความเสี่ยงและโอกาส และตั้งวัตถุประสงค์คุณภาพ" }
      - { left: "ข้อ 7 การสนับสนุน", right: "จัดทรัพยากร ความสามารถของบุคลากร และควบคุมเอกสาร" }
      - { left: "ข้อ 8 การดำเนินงาน", right: "ควบคุมการผลิต การให้บริการ และผู้ให้บริการภายนอก" }
      - { left: "ข้อ 9 การประเมินผล", right: "วัดผล ตรวจติดตามภายใน และทบทวนโดยฝ่ายบริหาร" }
      - { left: "ข้อ 10 การปรับปรุง", right: "จัดการสิ่งที่ไม่เป็นไปตามข้อกำหนดและแก้ไขที่สาเหตุ" }
    hints:
      - "ข้อ 4–10 เรียงตามวงจร PDCA"
      - "การตรวจติดตามอยู่ในขั้น C (ตรวจสอบ) ส่วนการแก้ไขที่สาเหตุอยู่ในขั้น A"
    solution: "ข้อ 4 บริบท ข้อ 5 ผู้นำ ข้อ 6 วางแผนความเสี่ยงและวัตถุประสงค์ ข้อ 7 ทรัพยากรและเอกสาร ข้อ 8 การดำเนินงาน ข้อ 9 วัดผลและตรวจติดตาม ข้อ 10 ปรับปรุง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p002
    topics: [management.quality.iso-management-systems]
    difficulty: 1
    type: match
    stem: "จับคู่การตรวจกับประเภทของการตรวจ"
    pairs:
      - { left: "ทีมผู้ตรวจภายในของโรงงานตรวจฝ่ายจัดซื้อของโรงงานเอง", right: "การตรวจฝ่ายที่หนึ่ง" }
      - { left: "บริษัทผลิตรถยนต์ส่งทีมไปตรวจโรงงานที่ผลิตเบาะให้", right: "การตรวจฝ่ายที่สอง" }
      - { left: "หน่วยรับรองอิสระตรวจเพื่อต่ออายุใบรับรอง ISO 9001", right: "การตรวจฝ่ายที่สาม" }
    hints:
      - "ใครเป็นผู้ตรวจ: องค์กรเอง ลูกค้า หรือหน่วยงานอิสระ"
      - "ใบรับรองออกโดยหน่วยงานที่ไม่ใช่ทั้งผู้ซื้อและผู้ขาย"
    solution: "ตรวจตัวเองคือฝ่ายที่หนึ่ง ลูกค้าตรวจผู้ขายคือฝ่ายที่สอง หน่วยรับรองอิสระคือฝ่ายที่สาม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p003
    topics: [management.quality.iso-management-systems]
    difficulty: 1
    type: mcq
    stem: "ห้องยาพบว่าจ่ายยาผิดความแรงให้ผู้ป่วย 2 ราย จึงโทรตามผู้ป่วยมาเปลี่ยนยาทันที การกระทำนี้เรียกว่าอะไร"
    choices:
      - { id: a, text: "การแก้ไข", correct: true }
      - { id: b, text: "การปฏิบัติการแก้ไข", feedback: "การปฏิบัติการแก้ไขต้องกำจัดสาเหตุ เช่น แยกที่เก็บยาความแรงต่างกัน แต่การโทรตามเปลี่ยนยาจัดการเฉพาะผลที่เกิดแล้ว" }
      - { id: c, text: "การป้องกัน", feedback: "การป้องกันทำกับปัญหาที่ยังไม่เกิด แต่กรณีนี้เกิดแล้ว" }
      - { id: d, text: "การทบทวนโดยฝ่ายบริหาร", feedback: "การทบทวนโดยฝ่ายบริหารเป็นการประชุมตามรอบของผู้บริหารสูงสุด" }
    hints:
      - "การกระทำนี้จัดการกับผลหรือกับสาเหตุ"
      - "ถ้าไม่ทำอะไรเพิ่ม ปัญหาเดิมเกิดซ้ำได้ไหม"
    solution: "การตามเปลี่ยนยาเป็นการแก้ไขผลที่เกิดแล้ว ยังต้องหาสาเหตุและทำปฏิบัติการแก้ไข เช่น แยกตำแหน่งยาที่ชื่อหรือความแรงคล้ายกัน เพื่อไม่ให้เกิดซ้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p004
    topics: [management.quality.iso-management-systems]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "โรงงานอาหารแห่งหนึ่งมีเอกสารต่อไปนี้ ข้อใดเป็นบันทึกที่ต้องเก็บรักษาไว้เป็นหลักฐานว่าทำแล้ว (ไม่ใช่เอกสารที่บอกวิธีทำ) เลือกทุกข้อที่ถูก"
    choices:
      - { id: a, text: "ใบรายงานผลการสอบเทียบเครื่องชั่งเดือนมีนาคม", correct: true }
      - { id: b, text: "ใบลงชื่อผู้เข้าอบรมความปลอดภัยอาหาร", correct: true }
      - { id: c, text: "วิธีปฏิบัติงานการล้างเครื่องบรรจุ", feedback: "เป็นเอกสารที่บอกวิธีทำ ต้องคงไว้และปรับปรุงเป็นฉบับใหม่เมื่อวิธีเปลี่ยน" }
      - { id: d, text: "นโยบายคุณภาพที่ผู้บริหารลงนาม", feedback: "นโยบายเป็นเอกสารที่ต้องคงไว้และปรับปรุง ไม่ใช่บันทึกผลการทำงาน" }
    hints:
      - "บันทึกคือหลักฐานของสิ่งที่เกิดขึ้นแล้ว และห้ามแก้ไขย้อนหลัง"
      - "เอกสารที่บอกวิธีทำแก้ไขเป็นฉบับใหม่ได้"
    solution: "ผลการสอบเทียบและใบลงชื่อผู้อบรมเป็นหลักฐานว่าทำแล้ว ต้องเก็บรักษาตามระยะเวลาที่กำหนด ส่วนวิธีปฏิบัติงานและนโยบายบอกวิธีทำ ต้องคงไว้และปรับปรุงเมื่อเปลี่ยน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p005
    topics: [management.quality.iso-management-systems]
    difficulty: 2
    type: numeric
    stem: "เทศบาลแห่งหนึ่ง (สมมติ) ประเมินความเสี่ยง \"ระบบคิวออนไลน์ล่มในวันจ่ายเบี้ยยังชีพ\" ได้โอกาสเกิด 4 และผลกระทบ 3 ตามเมทริกซ์ในภาพ คะแนนความเสี่ยงเป็นเท่าใด"
    figure:
      src: risk-matrix.svg
      alt: "เมทริกซ์ความเสี่ยง 5 × 5 แกนตั้งคือโอกาสเกิด 1 ถึง 5 แกนนอนคือผลกระทบ 1 ถึง 5 คะแนนเท่ากับโอกาสเกิดคูณผลกระทบ ช่องระบายสีตามระดับ ต่ำ 1–4 ปานกลาง 5–9 สูง 10–14 สูงมาก 15–25"
    answer: { value: 12 }
    hints:
      - "คะแนนความเสี่ยง = โอกาสเกิด × ผลกระทบ"
      - "$4 \\times 3$"
    misconceptions:
      - { match: 7, feedback: "ต้องคูณ ไม่ใช่บวก" }
    solution: "คะแนน $= 4 \\times 3 = 12$ อยู่ในช่วง 10–14 ระดับสูง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p006
    topics: [management.quality.iso-management-systems]
    difficulty: 2
    type: mcq
    stem: "ตามเมทริกซ์ในภาพ ความเสี่ยงที่มีโอกาสเกิด 2 และผลกระทบ 5 (เช่น ไฟไหม้คลังเอกสารราชการ) อยู่ในระดับใด"
    figure:
      src: risk-matrix.svg
      alt: "เมทริกซ์ความเสี่ยง 5 × 5 แกนตั้งคือโอกาสเกิด 1 ถึง 5 แกนนอนคือผลกระทบ 1 ถึง 5 คะแนนเท่ากับโอกาสเกิดคูณผลกระทบ ช่องระบายสีตามระดับ ต่ำ 1–4 ปานกลาง 5–9 สูง 10–14 สูงมาก 15–25"
    choices:
      - { id: a, text: "สูง", correct: true }
      - { id: b, text: "ต่ำ", feedback: "โอกาสเกิดต่ำก็จริง แต่ผลกระทบรุนแรงที่สุด คะแนนคือ 10 ไม่ใช่ต่ำ" }
      - { id: c, text: "ปานกลาง", feedback: "คะแนน $2 \\times 5 = 10$ เกินช่วงปานกลาง (5–9)" }
      - { id: d, text: "สูงมาก", feedback: "สูงมากเริ่มที่ 15 คะแนนนี้คือ 10" }
    hints:
      - "คำนวณคะแนนก่อน แล้วเทียบช่วงในคำอธิบายภาพ"
      - "$2 \\times 5$"
    solution: "$2 \\times 5 = 10$ อยู่ในช่วง 10–14 ระดับสูง ความเสี่ยงที่เกิดยากแต่ผลรุนแรงยังต้องมีมาตรการ เช่น สำเนาเอกสารสำคัญเป็นดิจิทัล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p007
    topics: [management.quality.iso-management-systems]
    difficulty: 3
    type: numeric
    stem: "ความเสี่ยงเรื่องหนึ่งมีโอกาสเกิด 4 ผลกระทบ 3 หลังติดตั้งระบบสำรองข้อมูลอัตโนมัติ โอกาสเกิดลดเหลือ 1 ผลกระทบเท่าเดิม คะแนนความเสี่ยงลดลงกี่คะแนน"
    answer: { value: 9 }
    hints:
      - "คำนวณคะแนนก่อนและหลังมีมาตรการ"
      - "ก่อน $4 \\times 3$ หลัง $1 \\times 3$"
    misconceptions:
      - { match: 3, feedback: "นั่นคือคะแนนหลังมีมาตรการ โจทย์ถามว่าลดลงกี่คะแนน" }
      - { match: 12, feedback: "นั่นคือคะแนนก่อนมีมาตรการ ต้องลบคะแนนหลังมีมาตรการออก" }
    solution: "ก่อน $4 \\times 3 = 12$ หลัง $1 \\times 3 = 3$ ลดลง $12 - 3 = 9$ คะแนน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p008
    topics: [management.quality.iso-management-systems]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการตรวจติดตามภายในหนึ่งครั้งให้ถูกต้อง"
    items:
      - "กำหนดขอบเขต เกณฑ์ และผู้ตรวจ"
      - "ทบทวนเอกสารและเตรียมรายการตรวจ"
      - "ประชุมเปิดการตรวจกับหน่วยงานที่รับตรวจ"
      - "สัมภาษณ์ สังเกต และสุ่มดูบันทึก"
      - "เทียบหลักฐานกับข้อกำหนดเพื่อสรุปข้อพบ"
      - "ประชุมปิดและออกรายงาน"
      - "ติดตามว่าการแก้ไขได้ผล"
    hints:
      - "ต้องวางแผนและเตรียมก่อนพบหน่วยงาน"
      - "สรุปข้อพบได้หลังเก็บหลักฐานแล้วเท่านั้น"
    solution: "วางแผน → เตรียม → ประชุมเปิด → เก็บหลักฐาน → สรุปข้อพบ → ประชุมปิดและรายงาน → ติดตามผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p009
    topics: [management.quality.iso-management-systems]
    difficulty: 3
    type: mcq
    stem: "โรงงานจะตรวจติดตามภายในฝ่ายจัดซื้อ ควรมอบหมายให้ใครเป็นผู้ตรวจ"
    choices:
      - { id: a, text: "หัวหน้าฝ่ายบัญชีที่ผ่านการอบรมผู้ตรวจภายใน", correct: true }
      - { id: b, text: "ผู้จัดการฝ่ายจัดซื้อ เพราะรู้งานดีที่สุด", feedback: "ผู้ตรวจไม่ควรตรวจงานของตัวเอง เพราะขาดความเป็นกลาง" }
      - { id: c, text: "พนักงานจัดซื้อที่ทำใบสั่งซื้อเอง", feedback: "เป็นผู้ปฏิบัติงานในกระบวนการที่ถูกตรวจ จึงไม่เป็นกลาง" }
      - { id: d, text: "ใครก็ได้ที่ว่าง ไม่จำเป็นต้องผ่านการอบรม", feedback: "ผู้ตรวจต้องมีความสามารถในการตรวจ ไม่เช่นนั้นจะเก็บหลักฐานและสรุปข้อพบไม่ถูก" }
    hints:
      - "ผู้ตรวจต้องเป็นกลางและมีความสามารถ"
      - "ข้อใดเป็นคนนอกกระบวนการจัดซื้อที่ผ่านการอบรม"
    solution: "ผู้ตรวจต้องเป็นกลาง (ไม่ตรวจงานตัวเอง) และมีความสามารถ หัวหน้าฝ่ายบัญชีที่อบรมแล้วอยู่นอกกระบวนการจัดซื้อจึงเหมาะที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p010
    topics: [management.quality.iso-management-systems]
    difficulty: 3
    type: mcq
    stem: "ข้อใดเป็นข้อพบที่ไม่เป็นไปตามข้อกำหนดที่เขียนได้ดีที่สุด"
    choices:
      - { id: a, text: "ขั้นตอนจัดซื้อกำหนดให้ประเมินผู้ขายรายใหม่ก่อนสั่งซื้อ จากการสุ่มใบสั่งซื้อ 12 ใบของเดือนพฤษภาคม พบ 2 ใบสั่งจากผู้ขายรายใหม่ที่ไม่มีผลประเมิน จึงไม่เป็นไปตามขั้นตอนที่กำหนด", correct: true }
      - { id: b, text: "ฝ่ายจัดซื้อทำงานไม่รอบคอบ", feedback: "ไม่มีข้อกำหนดและหลักฐาน และเป็นการตัดสินคน ไม่ใช่การรายงานข้อเท็จจริง" }
      - { id: c, text: "คุณสมศรีลืมประเมินผู้ขาย", feedback: "ข้อพบไม่ควรกล่าวโทษบุคคล และขาดข้อกำหนดกับจำนวนที่สุ่ม" }
      - { id: d, text: "ควรซื้อโปรแกรมประเมินผู้ขายอัตโนมัติ", feedback: "นี่คือข้อเสนอแนะทางแก้ ไม่ใช่ข้อพบ และไม่ได้บอกว่าพบอะไร" }
    hints:
      - "ข้อพบที่ดีมีสามส่วน: ข้อกำหนด หลักฐาน ข้อความสรุป"
      - "หลักฐานต้องตรวจซ้ำได้ เช่น จำนวนที่สุ่มและจำนวนที่พบ"
    solution: "ข้อ ก ระบุข้อกำหนด (ขั้นตอนจัดซื้อ) หลักฐานที่ตรวจซ้ำได้ (2 จาก 12 ใบ เดือนพฤษภาคม) และสรุปว่าไม่เป็นไปตามข้อกำหนดอย่างไร โดยไม่กล่าวโทษบุคคล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p011
    topics: [management.quality.iso-management-systems]
    difficulty: 3
    type: match
    stem: "ผู้ตรวจต้องการหลักฐานในแต่ละเรื่องต่อไปนี้ จับคู่หลักฐานกับข้อของ ISO 9001 ที่เกี่ยวข้องมากที่สุด"
    pairs:
      - { left: "ใบรับรองผลการสอบเทียบเครื่องชั่ง", right: "ข้อ 7 การสนับสนุน (ทรัพยากรสำหรับการวัด)" }
      - { left: "ผลการประเมินผู้ขายวัตถุดิบประจำปี", right: "ข้อ 8 การดำเนินงาน (ผู้ให้บริการภายนอก)" }
      - { left: "บันทึกการประชุมของผู้บริหารที่ทบทวนผลงานของระบบ", right: "ข้อ 9 การประเมินผล" }
      - { left: "ใบขอให้แก้ไขพร้อมผลวิเคราะห์สาเหตุ", right: "ข้อ 10 การปรับปรุง" }
    hints:
      - "เครื่องมือวัดเป็นทรัพยากรชนิดหนึ่ง"
      - "การกำจัดสาเหตุของปัญหาอยู่ในข้อสุดท้าย"
    solution: "การสอบเทียบเป็นเรื่องทรัพยากรในข้อ 7 การควบคุมผู้ขายอยู่ในข้อ 8 การทบทวนโดยฝ่ายบริหารอยู่ในข้อ 9 และใบขอให้แก้ไขอยู่ในข้อ 10"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p012
    topics: [management.quality.iso-management-systems]
    difficulty: 4
    type: mcq
    stem: "ผู้ตรวจพบว่าโรงงานแปรรูปอาหาร (สมมติ) ไม่ได้ตรวจติดตามภายในเลยตลอดปีที่ผ่านมา ทั้งที่มีขั้นตอนเขียนไว้ และไม่มีการทบทวนโดยฝ่ายบริหารด้วย ข้อพบนี้ควรจัดเป็นอะไร"
    choices:
      - { id: a, text: "ข้อบกพร่องหลัก", correct: true }
      - { id: b, text: "ข้อบกพร่องย่อย", feedback: "ข้อบกพร่องย่อยคือพลาดเป็นครั้งคราวโดยระบบยังทำงาน แต่กรณีนี้ส่วนประเมินผลของระบบไม่ทำงานเลยทั้งปี" }
      - { id: c, text: "ข้อสังเกตหรือโอกาสพัฒนา", feedback: "เป็นการไม่เป็นไปตามข้อกำหนดที่ชัดเจน ไม่ใช่แค่ข้อสังเกต" }
      - { id: d, text: "ไม่เป็นข้อพบ เพราะสินค้ายังไม่มีปัญหา", feedback: "ระบบต้องทำงานตามข้อกำหนดแม้สินค้ายังไม่มีปัญหา การไม่ตรวจและไม่ทบทวนทำให้ระบบตรวจไม่พบปัญหาเอง" }
    hints:
      - "ข้อบกพร่องหลักคือส่วนหนึ่งของระบบไม่มีหรือใช้ไม่ได้ทั้งหมด"
      - "การไม่ตรวจเลยทั้งปีเป็นการพลาดครั้งคราวหรือระบบไม่ทำงาน"
    solution: "ส่วนการประเมินผลของระบบ (ตรวจติดตามและทบทวนโดยฝ่ายบริหาร) ไม่ทำงานเลยทั้งปี ถือเป็นข้อบกพร่องหลัก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p013
    topics: [management.quality.iso-management-systems]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นข้อมูลนำเข้าที่ควรเสนอในการประชุมทบทวนโดยฝ่ายบริหาร เลือกทุกข้อที่ถูก"
    choices:
      - { id: a, text: "ผลการสำรวจความพึงพอใจและข้อร้องเรียนของลูกค้า", correct: true }
      - { id: b, text: "ผลการตรวจติดตามภายในและสถานะการแก้ไข", correct: true }
      - { id: c, text: "ผลงานของผู้ขายและผู้รับจ้างภายนอก", correct: true }
      - { id: d, text: "ความคืบหน้าของเรื่องที่สั่งการไว้ในการทบทวนครั้งก่อน", correct: true }
      - { id: e, text: "รายชื่อพนักงานที่ทำผิดพลาดเพื่อลงโทษ", feedback: "การทบทวนมุ่งที่ประสิทธิผลของระบบ ไม่ใช่การหาคนผิด" }
    hints:
      - "การทบทวนต้องดูภาพรวมว่าระบบได้ผลหรือไม่ ทั้งจากลูกค้า การตรวจ และผู้ขาย"
      - "ต้องตามเรื่องที่ค้างจากครั้งก่อนด้วย"
    solution: "ก ข ค ง เป็นข้อมูลนำเข้าตามแนวของข้อ 9.3 (ความพึงพอใจ ผลการตรวจ ผลงานของผู้ขาย และสถานะเรื่องเดิม) ส่วนรายชื่อเพื่อลงโทษไม่เกี่ยวกับการประเมินระบบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p014
    topics: [management.quality.iso-management-systems]
    difficulty: 4
    type: numeric
    stem: "โรงพยาบาลแห่งหนึ่ง (สมมติ) มี 12 กระบวนการในขอบเขตของระบบ แผนการตรวจกำหนดให้กระบวนการความเสี่ยงสูง 4 กระบวนการตรวจปีละ 2 ครั้ง ส่วนที่เหลือตรวจปีละ 1 ครั้ง ต้องตรวจทั้งหมดกี่ครั้งต่อปี"
    answer: { value: 16, unit: ครั้ง }
    hints:
      - "แยกนับกลุ่มความเสี่ยงสูงกับกลุ่มที่เหลือ"
      - "$4 \\times 2 + (12 - 4) \\times 1$"
    misconceptions:
      - { match: 20, feedback: "ดูเหมือนคิดกลุ่มที่เหลือเป็น 12 กระบวนการ ต้องหักกระบวนการความเสี่ยงสูง 4 กระบวนการออกก่อน" }
      - { match: 24, feedback: "นั่นคือตรวจทุกกระบวนการปีละ 2 ครั้ง แต่มีเพียง 4 กระบวนการที่ตรวจ 2 ครั้ง" }
    solution: "$4 \\times 2 + 8 \\times 1 = 8 + 8 = 16$ ครั้งต่อปี การกำหนดความถี่ตามความเสี่ยงทำให้ใช้เวลาผู้ตรวจกับกระบวนการที่สำคัญมากกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p015
    topics: [management.quality.iso-management-systems]
    difficulty: 4
    type: mcq
    stem: "บริษัทที่ได้รับรอง ISO 9001 แล้ว ต้องการขอ ISO 14001 และ ISO 45001 เพิ่ม ข้อใดถูกต้องที่สุด"
    choices:
      - { id: a, text: "สามมาตรฐานใช้โครงข้อ 4–10 เหมือนกัน จึงใช้นโยบาย การตรวจติดตาม และการทบทวนโดยฝ่ายบริหารร่วมกันได้ แต่ต้องเพิ่มเรื่องเฉพาะ เช่น ลักษณะปัญหาสิ่งแวดล้อม และการชี้บ่งอันตราย", correct: true }
      - { id: b, text: "ต้องสร้างระบบเอกสารแยกกันทั้งสามระบบ เพราะโครงสร้างไม่เหมือนกันเลย", feedback: "มาตรฐานระบบการจัดการรุ่นใหม่ใช้โครงสร้างร่วม จึงบูรณาการกันได้" }
      - { id: c, text: "ใบรับรอง ISO 9001 ครอบคลุมสิ่งแวดล้อมและความปลอดภัยอยู่แล้ว", feedback: "ISO 9001 มุ่งที่คุณภาพของสินค้าและบริการ ไม่ได้ครอบคลุมสิ่งแวดล้อมและความปลอดภัยของคนทำงาน" }
      - { id: d, text: "ISO 45001 ใช้แทน ISO 9001 ได้ จึงยกเลิก ISO 9001", feedback: "ISO 45001 ดูแลอาชีวอนามัยและความปลอดภัย ไม่ได้แทนระบบคุณภาพ" }
    hints:
      - "นึกถึงโครงสร้างร่วม (harmonized structure)"
      - "ส่วนที่เหมือนกันคือโครง ส่วนที่ต่างคือเรื่องที่แต่ละมาตรฐานดูแล"
    solution: "สามมาตรฐานมีโครงข้อเดียวกัน จึงทำเป็นระบบบูรณาการได้ ใช้กระบวนการบริหาร (นโยบาย ความเสี่ยง เอกสาร ตรวจติดตาม ทบทวน) ร่วมกัน แล้วเพิ่มข้อกำหนดเฉพาะของสิ่งแวดล้อมและความปลอดภัย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p016
    topics: [management.quality.iso-management-systems]
    difficulty: 5
    type: mcq
    stem: "โรงงานพบขวดน้ำดื่มฝาไม่แน่น จึงออกใบขอให้แก้ไข วิเคราะห์พบว่าหัวขันฝาสึก จึงเปลี่ยนหัวขันและปิดใบขอให้แก้ไขในวันเดียวกัน สองเดือนต่อมาปัญหาเดิมเกิดอีก ข้อใดอธิบายจุดอ่อนของการแก้ไขครั้งแรกได้ดีที่สุด"
    choices:
      - { id: a, text: "ไม่ได้หาว่าทำไมหัวขันสึกโดยไม่มีใครรู้ (เช่น ไม่มีแผนตรวจสภาพ) และปิดเรื่องโดยไม่ทวนสอบประสิทธิผลในช่วงเวลาที่เพียงพอ", correct: true }
      - { id: b, text: "ไม่ควรเปลี่ยนหัวขันฝาเลย", feedback: "การเปลี่ยนหัวขันที่สึกเป็นการแก้ไขที่จำเป็น ปัญหาคือหยุดแค่นั้น" }
      - { id: c, text: "ควรลงโทษพนักงานควบคุมเครื่อง", feedback: "สาเหตุอยู่ที่ระบบการดูแลเครื่อง ไม่ใช่ตัวบุคคล การลงโทษไม่ได้กำจัดสาเหตุ" }
      - { id: d, text: "ควรรอให้หน่วยรับรองมาตรวจก่อนจึงแก้ไข", feedback: "องค์กรต้องแก้ไขโดยไม่ล่าช้า ไม่ต้องรอผู้ตรวจภายนอก" }
    hints:
      - "หัวขันสึกเป็นสาเหตุโดยตรง หรือเป็นอาการของสาเหตุที่ลึกกว่า"
      - "ปิดเรื่องในวันเดียวรู้ได้อย่างไรว่าแก้ได้ผล"
    solution: "หัวขันสึกเป็นสาเหตุใกล้ตัว สาเหตุรากอาจเป็นการไม่มีแผนบำรุงรักษาหรือการตรวจแรงบิดฝา ปฏิบัติการแก้ไขที่ดีต้องกำจัดสาเหตุราก แล้วติดตามผลระยะหนึ่งก่อนปิดเรื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p017
    topics: [management.quality.iso-management-systems]
    difficulty: 5
    type: mcq
    stem: "โรงพยาบาลชุมชนแห่งหนึ่ง (สมมติ) ส่งตัวอย่างเลือดบางรายการไปตรวจที่ห้องแล็บเอกชนภายนอก ผู้ตรวจพบว่าโรงพยาบาลไม่เคยกำหนดเกณฑ์เลือกและไม่เคยติดตามผลงานของห้องแล็บนั้น โรงพยาบาลควรทำอะไรเป็นหลัก"
    choices:
      - { id: a, text: "กำหนดเกณฑ์เลือกและประเมินห้องแล็บภายนอก ระบุข้อกำหนดที่ส่งให้ (เช่น เวลารายงานผล) และติดตามผลงานเป็นระยะ ตามแนวการควบคุมผู้ให้บริการภายนอก", correct: true }
      - { id: b, text: "ไม่ต้องทำอะไร เพราะห้องแล็บภายนอกรับผิดชอบคุณภาพของตัวเอง", feedback: "งานที่จ้างภายนอกส่งผลต่อบริการของโรงพยาบาล องค์กรยังต้องควบคุมให้เป็นไปตามข้อกำหนด" }
      - { id: c, text: "ให้ห้องแล็บภายนอกไปขอ ISO 9001 ภายในสัปดาห์นี้", feedback: "ใบรับรองของผู้ขายอาจเป็นเกณฑ์หนึ่งได้ แต่ไม่ได้แทนการกำหนดข้อกำหนดและติดตามผลงานของโรงพยาบาลเอง" }
      - { id: d, text: "เลิกส่งตรวจภายนอกทั้งหมดทันที", feedback: "อาจทำให้ผู้ป่วยขาดบริการ ปัญหาคือการควบคุม ไม่ใช่การใช้ผู้ให้บริการภายนอก" }
    hints:
      - "การจ้างภายนอกไม่ได้โอนความรับผิดชอบต่อผู้รับบริการไปด้วย"
      - "ข้อกำหนดเรื่องผู้ให้บริการภายนอกให้เลือก ประเมิน และติดตามผลงาน"
    solution: "ตามแนวข้อ 8.4 องค์กรต้องกำหนดเกณฑ์เลือก ประเมิน และติดตามผลงานของผู้ให้บริการภายนอก และสื่อสารข้อกำหนด เช่น เวลารายงานผลและการรายงานค่าวิกฤต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.quality.iso-management-systems.p018
    topics: [management.quality.iso-management-systems]
    difficulty: 5
    type: match
    stem: "จับคู่ความเสี่ยงของบริษัทขนส่งพัสดุแห่งหนึ่ง (สมมติ) กับวิธีรับมือที่ตรงที่สุด"
    pairs:
      - { left: "รถขนส่งเกิดอุบัติเหตุทำให้พัสดุเสียหาย จึงซื้อประกันภัยสินค้า", right: "ถ่ายโอนความเสี่ยง" }
      - { left: "เลิกรับขนส่งสารเคมีอันตรายที่บริษัทไม่มีรถและคนที่ได้รับอนุญาต", right: "หลีกเลี่ยงความเสี่ยง" }
      - { left: "ติดตั้งระบบติดตามรถและอบรมขับขี่ปลอดภัยเพื่อลดอุบัติเหตุ", right: "ลดความเสี่ยง" }
      - { left: "ยอมให้พัสดุล่าช้าเล็กน้อยในวันฝนตกหนักโดยแจ้งลูกค้าล่วงหน้า", right: "ยอมรับความเสี่ยง" }
    hints:
      - "ถ่ายโอน = ให้ผู้อื่นรับผลทางการเงินแทน"
      - "หลีกเลี่ยง = ไม่ทำกิจกรรมที่ก่อความเสี่ยงนั้นเลย"
    solution: "ประกันภัยเป็นการถ่ายโอน เลิกรับงานอันตรายเป็นการหลีกเลี่ยง ระบบติดตามและอบรมเป็นการลด และยอมให้ล่าช้าเล็กน้อยพร้อมแจ้งลูกค้าเป็นการยอมรับ"
    license: CC-BY-SA-4.0
    ai_assisted: true
