problems:
- type: match
  difficulty: 1
  stem: จับคู่คำศัพท์จากข้อความกับความหมายภาษาไทย
  pairs:
  - left: 书店 shūdiàn
    right: ร้านหนังสือ
  - left: 安静 ānjìng
    right: เงียบ
  - left: 居民 jūmín
    right: ผู้อยู่อาศัยในชุมชน
  - left: 角落 jiǎoluò
    right: มุมหนึ่ง
  - left: 退休 tuìxiū
    right: เกษียณจากงาน
  hints:
  - 书 คือหนังสือ และ 店 คือร้าน
  - 安 และ 静 เป็นคำที่บอกความสงบ
  - 退 แปลว่าถอย ส่วน 休 แปลว่าพัก
  solution: 书店 (shūdiàn) ร้านหนังสือ · 安静 (ānjìng) เงียบ · 居民 (jūmín) ผู้อยู่อาศัยในชุมชน · 角落 (jiǎoluò) มุมหนึ่ง · 退休 (tuìxiū) เกษียณจากงาน
  id: chinese.reading.longer-passages.p001
  topics:
  - chinese.reading.longer-passages
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: mcq
  difficulty: 1
  stem: 'อ่านข้อความต่อไปนี้แล้วตอบ


    我住的小区在曼谷，小区门口新开了一家书店。书店不大，但是很安静。每个周末，很多居民都会来这里看书。书店的老板是一位退休 (tuìxiū)的老师，他希望大家多读书，少玩手机。书店里还有一个小角落，孩子们可以在那里画画。


    ข้อความนี้เกี่ยวกับเรื่องใด'
  choices:
  - id: a
    text: ร้านหนังสือใหม่ที่เปิดในชุมชน
    correct: true
    feedback: ถูก เรื่องหลักคือร้านหนังสือเปิดใหม่ที่หน้าชุมชน
  - id: b
    text: โรงเรียนที่เพิ่งเปิดใหม่ในชุมชน
    feedback: ข้อความไม่ได้พูดถึงโรงเรียน
  - id: c
    text: ห้างสรรพสินค้าที่ใหญ่ที่สุดในกรุงเทพฯ
    feedback: ร้านในข้อความ ‘不大 (bú dà)’ จึงไม่ใช่ห้างใหญ่
  - id: d
    text: การแข่งขันวิ่งในสวนสาธารณะ
    feedback: การวิ่งอยู่ในข้อความอื่น ไม่ใช่เรื่องหลักของข้อความนี้
  hints:
  - ดูประโยคแรกว่าเกิดอะไรขึ้นในชุมชน
  - ประโยคแรก (第一句) บอกการเปิดร้านใหม่
  - เลือกตัวเลือกที่ครอบคลุมเรื่องหลัก ไม่ใช่รายละเอียด
  solution: '**a.** เรื่องหลักคือมีร้านหนังสือใหม่เปิดหน้าชุมชน ส่วนความเงียบและมุมเด็กเป็นรายละเอียด'
  id: chinese.reading.longer-passages.p002
  topics:
  - chinese.reading.longer-passages
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: mcq
  difficulty: 2
  stem: 'อ่านข้อความต่อไปนี้แล้วตอบ


    我住在曼谷，每天早上都去公园跑步。刚开始的时候，我跑十分钟就很累。后来，我每天多跑一点点，现在已经能跑三十分钟了。医生说，运动可以让身体更健康，还能让人心情变好。所以，我决定坚持下去。


    ทำไมผู้เขียนจึงตัดสินใจวิ่งต่อไป'
  choices:
  - id: a
    text: เพราะหมอบอกว่าการออกกำลังกายดีต่อร่างกายและอารมณ์
    correct: true
    feedback: ถูก 医生说 (yīshēng shuō) บอกเหตุผลที่ตามด้วย 所以 (suǒyǐ) และ 决定坚持下去 (juédìng jiānchí xiàqu)
  - id: b
    text: เพราะเพื่อนชวนไปวิ่งด้วยกัน
    feedback: ข้อความไม่ได้พูดถึงเพื่อนที่ชวนไปวิ่ง
  - id: c
    text: เพราะวิ่งสิบนาทีแล้วไม่เหนื่อยเลย
    feedback: ตรงข้ามกับข้อความ ตอนแรกวิ่งสิบนาทีก็เหนื่อยแล้ว
  - id: d
    text: เพราะอยากเอาชนะเพื่อนในสนามกีฬา
    feedback: ข้อความไม่ได้กล่าวถึงการแข่งขันกับเพื่อน
  hints:
  - หาประโยคที่มี 医生说 ซึ่งบอกคำแนะนำ
  - ดูคำว่า 所以 ที่อยู่ก่อนประโยคสุดท้าย
  - เหตุผลอยู่ในประโยคที่มีคำว่า 运动可以让身体更健康
  solution: '**a.** หมอบอกว่าการออกกำลังกายทำให้ร่างกายแข็งแรงและอารมณ์ดี จึงตัดสินใจทำต่อ'
  id: chinese.reading.longer-passages.p003
  topics:
  - chinese.reading.longer-passages
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: numeric
  difficulty: 2
  stem: 'อ่านข้อความต่อไปนี้แล้วตอบ


    我住在曼谷，每天早上都去公园跑步。刚开始的时候，我跑十分钟就很累。后来，我每天多跑一点点，现在已经能跑三十分钟了。医生说，运动可以让身体更健康，还能让人心情变好。所以，我决定坚持下去。


    ตอนนี้ผู้เขียนวิ่งได้กี่นาที (ตอบเป็นตัวเลข)'
  answer:
    value: 30
    tolerance: 0
    unit: นาที
  misconceptions:
  - match: 10
    feedback: 10 นาทีคือเวลาที่วิ่งได้ตอนเริ่มต้น แต่ข้อความบอกว่าตอนนี้วิ่งได้มากกว่านั้น
  hints:
  - ดูประโยคที่มีคำว่า 现在
  - ตัวเลขอยู่หน้าคำว่า 分钟 หรือ 分 ซึ่งในข้อความบอกไว้แล้ว
  - 三十 เป็นตัวเลข 30
  solution: '**30 นาที** (现在已经能跑三十分钟了 (xiànzài yǐjīng néng pǎo sānshí fēnzhōng le))'
  id: chinese.reading.longer-passages.p004
  topics:
  - chinese.reading.longer-passages
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: order
  difficulty: 2
  stem: เรียงประโยคต่อไปนี้ให้เป็นเรื่องเล่าที่ต่อเนื่องกันเรื่องการทำความสะอาดห้องเรียน
  items:
  - 我们学校在清迈 (wǒmen xuéxiào zài Qīngmài)，每个星期五都要打扫教室 (měi gè xīngqīwǔ dōu yào dǎsǎo jiàoshì)。
  - 小明负责擦黑板 (Xiǎo Míng fùzé cā hēibǎn)，小红负责整理书架 (Xiǎo Hóng fùzé zhěnglǐ shūjià)，我负责扫地 (wǒ fùzé sǎodì)。
  - 打扫完以后 (dǎsǎo wán yǐhòu)，大家一起去食堂吃午饭 (dàjiā yìqǐ qù shítáng chī wǔfàn)。
  - 今天我们打扫得特别干净 (jīntiān wǒmen dǎsǎo de tèbié gānjìng)，老师表扬了我们 (lǎoshī biǎoyáng le wǒmen)。
  hints:
  - ประโยคแรกบอกสถานที่และกิจวัตรของโรงเรียน
  - ประโยคที่มี 负责 บอกงานที่แต่ละคนทำ ตามหลังประโยคแรก
  - 打扫完以后 บอกสิ่งที่เกิดหลังทำความสะอาด และประโยคสุดท้ายบอกผล
  solution: 'เรียงได้: ประโยคที่บอกสถานที่ → ใครรับผิดชอบงานอะไร → ทำความสะอาดเสร็จแล้วไปกินข้าว → ผลที่ครูชม'
  id: chinese.reading.longer-passages.p005
  topics:
  - chinese.reading.longer-passages
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: numeric
  difficulty: 2
  stem: 'อ่านข้อความต่อไปนี้แล้วตอบ


    我们学校在清迈，每个星期五都要打扫教室。小明负责擦黑板，小红负责整理书架，我负责扫地。打扫完以后，大家一起去食堂吃午饭。今天我们打扫得特别干净 (gānjìng)，老师表扬了我们。


    ข้อความระบุงานทำความสะอาดที่ทำกันทั้งหมดกี่อย่าง (ตอบเป็นตัวเลข)'
  answer:
    value: 3
    tolerance: 0
    unit: อย่าง
  misconceptions:
  - match: 2
    feedback: 2 คือจำนวนชื่อคนที่ถูกเอ่ย แต่โจทย์ถามจำนวนงานซึ่งมี 3 อย่าง
  hints:
  - ดูประโยคที่มี 负责 ซึ่งบอกงานของแต่ละคน
  - ให้นับงานไม่ใช่นับคน
  - งานคือ เช็ดกระดาน จัดชั้นหนังสือ และกวาดพื้น
  solution: '**3 อย่าง** คือ 擦黑板 (cā hēibǎn) (เช็ดกระดาน) 整理书架 (zhěnglǐ shūjià) (จัดชั้นหนังสือ) และ 扫地 (sǎodì) (กวาดพื้น)'
  id: chinese.reading.longer-passages.p006
  topics:
  - chinese.reading.longer-passages
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: mcq
  difficulty: 2
  stem: 'อ่านข้อความต่อไปนี้แล้วตอบ


    大熊猫主要吃竹子 (dàxióngmāo zhǔyào chī zhúzi)。它们一天中有很长时间都在吃东西 (tāmen yì tiān zhōng yǒu hěn cháng shíjiān dōu zài chī dōngxi)。人们努力保护它们生活的竹林 (rénmen nǔlì bǎohù tāmen shēnghuó de zhúlín)。


    ใจความของข้อความนี้คืออะไร'
  choices:
  - id: a
    text: หมีแพนด้ากินไม้ไผ่เป็นหลัก และมนุษย์ช่วยกันรักษาป่าไผ่
    correct: true
    feedback: ถูก ประโยคแรกบอกอาหาร ประโยคสุดท้ายบอกการอนุรักษ์
  - id: b
    text: วิธีปลูกไผ่ในบ้านให้โตเร็ว
    feedback: ข้อความไม่ได้สอนการปลูกไผ่
  - id: c
    text: หมีแพนด้านอนหลับได้นานที่สุดในโลก
    feedback: ข้อความพูดถึงการกินนาน ไม่ได้พูดถึงการนอน
  - id: d
    text: การท่องเที่ยวในประเทศจีนช่วงฤดูร้อน
    feedback: ข้อความนี้ไม่ได้พูดถึงการท่องเที่ยว
  hints:
  - ดูประโยคแรกว่าสัตว์ตัวนี้กินอะไร
  - ประโยคสุดท้ายบอกว่ามนุษย์ทำอะไร
  - เลือกตัวเลือกที่ครอบคลุมทั้งอาหารและการช่วยเหลือ
  solution: '**a.** ใจความครอบคลุมทั้งเรื่องอาหารของหมีแพนด้าและการอนุรักษ์ป่าไผ่'
  id: chinese.reading.longer-passages.p007
  topics:
  - chinese.reading.longer-passages
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: mcq
  difficulty: 3
  stem: 'อ่านข้อความต่อไปนี้แล้วตอบ


    我住的小区在曼谷，小区门口新开了一家书店。书店不大，但是很安静。每个周末，很多居民都会来这里看书。书店的老板是一位退休 (tuìxiū)的老师，他希望大家多读书，少玩手机。书店里还有一个小角落，孩子们可以在那里画画。


    ร้านหนังสือนี้น่าอยู่เพราะเหตุใด ตามข้อความ'
  choices:
  - id: a
    text: มีของกินอร่อยมากให้เลือกหลายอย่าง
    feedback: ข้อความไม่ได้กล่าวถึงอาหารในร้าน
  - id: b
    text: เงียบ และมีมุมให้เด็กวาดรูป
    correct: true
    feedback: ถูก ประโยค 很安静 (hěn ānjìng) และ 孩子们可以在那里画画 (háizimen kěyǐ zài nàli huàhuà) ให้รายละเอียดนี้
  - id: c
    text: ร้านใหญ่และมีที่นั่งเยอะ
    feedback: ข้อความบอกว่าร้าน ‘不大 (bú dà)’
  - id: d
    text: เปิดทุกวันจนดึกดื่น
    feedback: ข้อความไม่ได้พูดถึงเวลาเปิดปิด
  hints:
  - ดูประโยคที่บอกลักษณะของร้าน
  - มีประโยคหนึ่งบอกว่าร้านมีความเงียบ และอีกประโยคบอกมุมสำหรับเด็ก
  - เลือกเหตุผลที่ตรงกับทั้งสองประโยค
  solution: '**b.** ร้านเงียบ (很安静 (hěn ānjìng)) และมีมุมให้เด็กวาดรูป (小角落 (xiǎo jiǎoluò) ... 画画 (huàhuà))'
  id: chinese.reading.longer-passages.p008
  topics:
  - chinese.reading.longer-passages
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: text
  difficulty: 3
  stem: 'เติมคำเชื่อมที่หายไป (ตอบเป็นคำเดียว)


    今天我们打扫得特别干净 (jīntiān wǒmen dǎsǎo de tèbié gānjìng)，___老师表扬了我们 (lǎoshī biǎoyáng le wǒmen)。'
  accepted:
  - 所以
  - 因此
  misconceptions:
  - match: 但是
    feedback: 但是 (dànshì) บอกการขัดแย้ง แต่ประโยคนี้บอกผลที่ตามมาจากการทำความสะอาด
  hints:
  - ประโยคหลังเป็นผลของการทำความสะอาดได้ดี
  - ต้องเป็นคำที่บอกผลที่ตามมา
  - คำนี้มีความหมายว่า ‘ดังนั้น’
  solution: '**所以 (suǒyǐ)** (หรือ 因此 (yīncǐ)) เขียนว่า 今天我们打扫得特别干净 (jīntiān wǒmen dǎsǎo de tèbié gānjìng)，所以老师表扬了我们 (suǒyǐ lǎoshī biǎoyáng le wǒmen)。'
  id: chinese.reading.longer-passages.p009
  topics:
  - chinese.reading.longer-passages
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: order
  difficulty: 3
  stem: เรียงประโยคต่อไปนี้ให้เป็นเรื่องเล่าเรื่องการวิ่งตามลำดับเวลา
  items:
  - 我住在曼谷 (wǒ zhù zài Màngǔ)，每天早上都去公园跑步 (měitiān zǎoshang dōu qù gōngyuán pǎobù)。
  - 刚开始的时候 (gāng kāishǐ de shíhou)，我跑十分钟就很累 (wǒ pǎo shí fēnzhōng jiù hěn lèi)。
  - 后来 (hòulái)，我每天多跑一点点 (wǒ měitiān duō pǎo yìdiǎndiǎn)，
  - 现在已经能跑三十分钟了 (xiànzài yǐjīng néng pǎo sānshí fēnzhōng le)。
  hints:
  - ประโยคแรกบอกว่าทำกิจวัตรอะไรทุกวัน
  - 刚开始的时候 บอกจุดเริ่มต้น
  - 后来 บอกเหตุการณ์ต่อมา และประโยคสุดท้ายบอกผลในตอนนี้
  solution: 'เรียง: ทุกวันไปวิ่ง → ตอนแรกวิ่งสิบนาทีก็เหนื่อย → ต่อมาวิ่งเพิ่มทีละนิด → ตอนนี้วิ่งได้สามสิบนาที'
  id: chinese.reading.longer-passages.p010
  topics:
  - chinese.reading.longer-passages
  license: CC-BY-SA-4.0
  ai_assisted: true
- type: mcq
  difficulty: 3
  stem: ในข้อความ คำว่า 竹子 (zhúzi) หมายถึงอะไร (เดาจากประโยคที่ว่า ‘它们主要吃竹子 (tāmen zhǔyào chī zhúzi)’)
  choices:
  - id: a
    text: ไม้ไผ่
    correct: true
    feedback: ถูก 竹 (zhú) คือไม้ไผ่ และ 子 (zi) เป็นคำต่อท้ายที่ทำให้เป็นคำนาม
  - id: b
    text: ข้าวโพด
    feedback: ข้าวโพดคือ 玉米 (yùmǐ) ไม่ใช่ 竹子 (zhúzi)
  - id: c
    text: หน่อไม้
    feedback: หน่อไม้คือ 竹笋 (zhúsǔn) ซึ่งต่างจาก 竹子 (zhúzi) ที่เป็นทั้งต้น
  - id: d
    text: ต้นไม้ใหญ่ทั่วไป
    feedback: คำว่า 竹 (zhú) บอกชนิดของพืช ไม่ได้หมายถึงต้นไม้ทั่วไป
  hints:
