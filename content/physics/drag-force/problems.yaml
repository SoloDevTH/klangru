  - id: physics.dynamics.drag-force.p019
    topics: [physics.dynamics.drag-force]
    difficulty: 4
    type: code
    stem: 'วัตถุมวล $m$ ตกจากหยุดนิ่งในของไหลที่มีแรงต้านเชิงเส้น $F = bv$ (ทิศลงเป็นบวก) เขียนฟังก์ชัน `fall_speed(t_end, m, b)` ที่คืนค่าความเร็วหลังตกไป `t_end` วินาที ให้ใช้ $g = 9.8$ และคำนวณโดยแบ่งเวลาเป็นช่วงสั้น ๆ ช่วงละ 0.001 วินาที'
    starter: |
      def fall_speed(t_end, m, b):
          pass
    tests: |
      import math
      v = fall_speed(1.0, 2.0, 4.0)
      assert v is not None, "ฟังก์ชันต้องคืนค่าความเร็วด้วย return"
      vt = 2.0 * 9.8 / 4.0
      exact = vt * (1 - math.exp(-1.0 / (2.0 / 4.0)))
      assert abs(v - exact) < 0.05, f"fall_speed(1.0, 2.0, 4.0) ควรได้ประมาณ {exact:.2f} m/s แต่ได้ {v:.2f} m/s"
      w = fall_speed(0.0, 2.0, 4.0)
      assert abs(w) < 1e-9, f"ที่ t = 0 วัตถุยังไม่มีความเร็ว แต่ได้ {w}"
    reference: |
      def fall_speed(t_end, m, b):
          g = 9.8
          dt = 0.001
          v = 0.0
          steps = round(t_end / dt)
          for _ in range(steps):
              a = g - (b / m) * v
              v = v + a * dt
          return v
    hints:
      - ความเร็วหลังช่วงเวลาหนึ่งเท่ากับความเร็วเดิมบวกความเร่งคูณขนาดช่วงเวลานั้น
      - ความเร่งในทุกช่วงเวลาสั้น ๆ เท่ากับ $g - (b/m) v$
    solution: 'ทำซ้ำการคำนวณทีละช่วงเวลา $\Delta t = 0.001\,\mathrm{s}$ โดยให้ $v \leftarrow v + (g - (b/m)v)\Delta t$ ผลลัพธ์ใกล้กับคำตอบเชิงวิเคราะห์ $v_t(1 - e^{-t/\tau})$'
    license: CC-BY-SA-4.0
    ai_assisted: true

