<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="sans-serif">
<title>ป้ายคำขวัญห้องเรียน</title>
<rect x="0" y="0" width="640" height="300" fill="#fff"/>
<rect x="20.0" y="20.0" width="600.0" height="260.0" rx="16" fill="#fff8e1" stroke="#b9770e" stroke-width="4"/>
<text x="320.0" y="70.0" font-size="24" text-anchor="middle" fill="#8a5a0b" font-weight="bold">คำขวัญห้อง ป.3/2</text>
<text x="320.0" y="140.0" font-size="40" text-anchor="middle" fill="#1e8449" font-weight="bold">ห้องเรียนสะอาด</text>
<text x="320.0" y="205.0" font-size="40" text-anchor="middle" fill="#1f5fbf" font-weight="bold">ไม่ขาดน้ำใจ</text>
<text x="320.0" y="255.0" font-size="18" text-anchor="middle" fill="#555" font-weight="normal">ช่วยกันเก็บขยะ แบ่งปันเพื่อนเสมอ</text>
</svg>
