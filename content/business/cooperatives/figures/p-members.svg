<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" font-family="sans-serif" font-size="14">
  <title>ข้อมูลหุ้นและยอดซื้อของสมาชิกสหกรณ์ร้านค้าโรงเรียน (สมมติ)</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="560" height="230" fill="#ffffff"/>
  <text x="280.0" y="26.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">สหกรณ์ร้านค้าโรงเรียนบ้านหนองบัว ปีการศึกษานี้ (สมมติ)</text>
  <rect x="30" y="44" width="500" height="38" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/>
  <text x="38.0" y="67.5" text-anchor="start" fill="#1f2937" font-size="13" font-weight="bold">สมาชิก</text>
  <line x1="190" y1="44" x2="190" y2="82" stroke="#1f2937" stroke-width="1"/>
  <text x="342.0" y="67.5" text-anchor="end" fill="#1f2937" font-size="13" font-weight="bold">จำนวนหุ้น (หุ้นละ 10 บาท)</text>
  <line x1="350" y1="44" x2="350" y2="82" stroke="#1f2937" stroke-width="1"/>
  <text x="522.0" y="67.5" text-anchor="end" fill="#1f2937" font-size="13" font-weight="bold">ยอดซื้อสินค้าทั้งปี (บาท)</text>
  <rect x="30" y="82" width="500" height="38" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="38.0" y="105.5" text-anchor="start" fill="#1f2937" font-size="13">ดาว</text>
  <line x1="190" y1="82" x2="190" y2="120" stroke="#1f2937" stroke-width="1"/>
  <text x="342.0" y="105.5" text-anchor="end" fill="#1f2937" font-size="13">150</text>
  <line x1="350" y1="82" x2="350" y2="120" stroke="#1f2937" stroke-width="1"/>
  <text x="522.0" y="105.5" text-anchor="end" fill="#1f2937" font-size="13">4,200</text>
  <rect x="30" y="120" width="500" height="38" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="38.0" y="143.6" text-anchor="start" fill="#1f2937" font-size="13">ต้น</text>
  <line x1="190" y1="120" x2="190" y2="158" stroke="#1f2937" stroke-width="1"/>
  <text x="342.0" y="143.6" text-anchor="end" fill="#1f2937" font-size="13">80</text>
  <line x1="350" y1="120" x2="350" y2="158" stroke="#1f2937" stroke-width="1"/>
  <text x="522.0" y="143.6" text-anchor="end" fill="#1f2937" font-size="13">6,500</text>
  <rect x="30" y="158" width="500" height="38" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="38.0" y="181.6" text-anchor="start" fill="#1f2937" font-size="13">ฝน</text>
  <line x1="190" y1="158" x2="190" y2="196" stroke="#1f2937" stroke-width="1"/>
  <text x="342.0" y="181.6" text-anchor="end" fill="#1f2937" font-size="13">200</text>
  <line x1="350" y1="158" x2="350" y2="196" stroke="#1f2937" stroke-width="1"/>
  <text x="522.0" y="181.6" text-anchor="end" fill="#1f2937" font-size="13">2,800</text>
  <text x="280.0" y="214.0" text-anchor="middle" fill="#1f2937" font-size="13">ที่ประชุมใหญ่อนุมัติ ปันผล 5% ของค่าหุ้น · เฉลี่ยคืน 4% ของยอดซื้อ</text>
</svg>
