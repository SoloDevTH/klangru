problems:
  - id: computer.society.green-computing.p001
    topics: [computer.society.green-computing]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นขั้นแรกของวงจรชีวิตของอุปกรณ์คอมพิวเตอร์"
    choices:
      - { id: a, text: "ขุดและแปรรูปแร่ที่ใช้ทำชิ้นส่วน", correct: true }
      - { id: b, text: "ทิ้งเครื่องเมื่อเสียแล้ว", feedback: "เป็นขั้นสุดท้ายของวงจร ไม่ใช่ขั้นแรก" }
      - { id: c, text: "นำชิ้นส่วนเก่าไปรีไซเคิล", feedback: "การรีไซเคิลเกิดขึ้นหลังจากใช้งานแล้ว" }
      - { id: d, text: "ใช้งานเครื่องกับผู้ใช้", feedback: "ก่อนใช้งานได้ ต้องผลิตเครื่องก่อน และก่อนผลิตต้องมีวัตถุดิบจากการขุดแร่" }
    hints:
      - "ลองนึกว่าเครื่องต้องเริ่มจากวัตถุดิบอะไรก่อน"
      - "ดูว่าข้อใดเกิดก่อนการผลิตและการใช้งาน"
    solution: "วงจรชีวิตเริ่มจากการขุดและแปรรูปวัตถุดิบ แล้วจึงผลิต ใช้งาน และทิ้งหรือรีไซเคิลตามลำดับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p002
    topics: [computer.society.green-computing]
    difficulty: 1
    type: match
    stem: "จับคู่ขั้นของวงจรชีวิตกับตัวอย่างการกระทำ"
    pairs:
      - { left: "ขุดแร่", right: "นำโลหะจากพื้นดินมาใช้ทำชิ้นส่วน" }
      - { left: "ผลิต", right: "ประกอบชิ้นส่วนในโรงงาน" }
      - { left: "ใช้งาน", right: "เปิดเครื่องทำงานทุกวัน" }
      - { left: "ทิ้ง", right: "โยนเครื่องเก่าปนกับขยะทั่วไปโดยไม่แยก" }
    hints:
      - "แต่ละขั้นมีลักษณะการกระทำที่แตกต่างกัน"
      - "ดูว่าการกระทำนั้นเกิดก่อนหรือหลังการใช้งาน"
    solution: "ขุดแร่คือการนำวัตถุดิบจากพื้นดิน ผลิตคือการประกอบ ใช้งานคือการเปิดเครื่องทำงาน และทิ้งคือการนำเครื่องเก่าไปทิ้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p003
    topics: [computer.society.green-computing]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนของวงจรชีวิตอุปกรณ์คอมพิวเตอร์ตามลำดับ"
    items:
      - "ขุดแร่และแปรรูปวัตถุดิบ"
      - "ผลิตชิ้นส่วนและประกอบ"
      - "ใช้งานจนเครื่องเสื่อมหรือเสีย"
      - "ส่งเข้ากระบวนการรีไซเคิลหรือทิ้งอย่างถูกวิธี"
    hints:
      - "ต้องมีวัตถุดิบก่อนจึงจะผลิตได้"
      - "การรีไซเคิลหรือทิ้งเกิดหลังการใช้งานจบ"
    solution: "ขุดแร่ → ผลิตและประกอบ → ใช้งาน → รีไซเคิลหรือทิ้งอย่างถูกวิธี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p004
    topics: [computer.society.green-computing]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นวิธีลดขยะอิเล็กทรอนิกส์ที่ช่วยได้มากที่สุด"
    choices:
      - { id: a, text: "ใช้เครื่องเดิมให้นานขึ้นและซ่อมเมื่อเสีย", correct: true }
      - { id: b, text: "ซื้อเครื่องรุ่นใหม่ทุกปีเพื่อให้ทันสมัย", feedback: "การเปลี่ยนเครื่องบ่อยทำให้มีขยะและต้องผลิตเครื่องใหม่มากขึ้น" }
      - { id: c, text: "ทิ้งเครื่องเก่าลงถังขยะทั่วไป", feedback: "ขยะอิเล็กทรอนิกส์ที่ปนกับขยะทั่วไปอาจปนเปื้อนดินและน้ำ" }
      - { id: d, text: "เปิดเครื่องทิ้งไว้ตลอดเวลาให้ไม่เสียง่าย", feedback: "การเปิดเครื่องตลอดเวลาทำให้ใช้ไฟมากขึ้น และไม่ได้ลดขยะ" }
    hints:
      - "การลดขยะเริ่มจากการใช้ของเดิมให้คุ้มค่าก่อนการทิ้ง"
      - "ดูว่าข้อใดช่วยลดการผลิตเครื่องใหม่"
    solution: "การใช้เครื่องเดิมให้นานขึ้นและซ่อมเมื่อเสียช่วยลดการผลิตเครื่องใหม่ ซึ่งเป็นวิธีลดขยะที่ดีที่สุดก่อนการรีไซเคิล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p005
    topics: [computer.society.green-computing]
    difficulty: 2
    type: numeric
    stem: "หลอดไฟในห้องเรียนของโรงเรียนกำลัง 10 วัตต์ เปิดวันละ 5 ชั่วโมง ใน 30 วันใช้พลังงานกี่กิโลวัตต์-ชั่วโมง (kWh)"
    answer: { value: 1.5, tolerance: 0.001, unit: "kWh" }
    hints:
      - "คูณกำลังไฟ เวลาต่อวัน และจำนวนวันเข้าด้วยกันก่อน"
      - "ผลที่ได้เป็นวัตต์-ชั่วโมง ต้องหารด้วย 1000 จึงได้ kWh"
    solution: "10 × 5 × 30 = 1,500 วัตต์-ชั่วโมง ÷ 1000 = 1.5 kWh"
    misconceptions:
      - { match: 1500, feedback: "1500 คือหน่วยวัตต์-ชั่วโมง ยังไม่ได้หารด้วย 1000 เพื่อเปลี่ยนเป็น kWh" }
      - { match: 50, feedback: "50 คือ 10 × 5 ยังไม่ได้คูณจำนวนวัน 30" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p006
    topics: [computer.society.green-computing]
    difficulty: 2
    type: numeric
    stem: "แล็ปท็อปกำลัง 45 วัตต์ ใช้วันละ 6 ชั่วโมง 5 วันต่อสัปดาห์ ใน 1 สัปดาห์ใช้พลังงานกี่ kWh (ตอบเป็นทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.35, tolerance: 0.01, unit: "kWh" }
    hints:
      - "หาจำนวนชั่วโมงทั้งหมดในหนึ่งสัปดาห์ก่อน"
      - "แล้วคูณด้วยกำลังไฟ และหารด้วย 1000"
    solution: "45 × 6 × 5 = 1,350 วัตต์-ชั่วโมง ÷ 1000 = 1.35 kWh"
    misconceptions:
      - { match: 1350, feedback: "1350 คือหน่วยวัตต์-ชั่วโมง ยังไม่ได้หารด้วย 1000" }
      - { match: 1.62, feedback: "1.62 เกิดจากนับ 6 วันต่อสัปดาห์ ทั้งที่โจทย์ใช้ 5 วัน" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p007
    topics: [computer.society.green-computing]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างการออกแบบซอฟต์แวร์ที่ประหยัดพลังงาน"
    choices:
      - { id: a, text: "ลดการทำงานที่ไม่จำเป็นเมื่อผู้ใช้ไม่ได้ใช้แอปนั้นอยู่", correct: true }
      - { id: b, text: "แสดงภาพความละเอียดสูงทุกครั้งแม้ผู้ใช้ไม่ต้องการ", feedback: "ภาพที่ละเอียดเกินจำเป็นใช้ทรัพยากรและพลังงานมากขึ้น" }
      - { id: c, text: "ดึงข้อมูลจากเครือข่ายทุกวินาทีแม้ไม่มีอะไรเปลี่ยน", feedback: "การดึงข้อมูลที่ไม่จำเป็นทำให้ใช้พลังงานเพิ่มโดยไม่ได้ประโยชน์" }
      - { id: d, text: "เล่นวิดีโอโฆษณาอัตโนมัติทุกครั้งที่เปิดแอป", feedback: "การเล่นวิดีโอที่ไม่จำเป็นเพิ่มการใช้พลังงานและทรัพยากร" }
    hints:
      - "ซอฟต์แวร์ที่ประหยัดจะทำงานเฉพาะเมื่อจำเป็น"
      - "ดูว่าข้อใดลดการทำงานที่ไม่มีประโยชน์"
    solution: "การหยุดงานที่ไม่จำเป็นเมื่อผู้ใช้ไม่ได้ใช้แอป เป็นแนวทางออกแบบซอฟต์แวร์ที่ประหยัดพลังงาน ส่วนข้ออื่นทำให้ใช้พลังงานมากขึ้นโดยไม่จำเป็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p008
    topics: [computer.society.green-computing]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นแนวทางที่ช่วยให้ใช้อุปกรณ์ได้นานขึ้น (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ซ่อมได้ง่ายและมีอะไหล่หาได้", correct: true }
      - { id: b, text: "มีการอัปเดตซอฟต์แวร์ที่ทำให้เครื่องรุ่นเดิมยังใช้งานได้", correct: true }
      - { id: c, text: "เก็บเครื่องให้ปลอดฝุ่นและระบายอากาศได้ดี", correct: true }
      - { id: d, text: "เปลี่ยนเครื่องทุกปีเพื่อตามเทรนด์", feedback: "การเปลี่ยนบ่อยทำให้เกิดขยะและใช้ทรัพยากรเพิ่ม ไม่ช่วยให้อุปกรณ์ใช้ได้นาน" }
    hints:
      - "คิดว่าอะไรทำให้เครื่องเสียก่อนเวลาอันควร"
      - "ลองนึกว่าการซ่อมและการอัปเดตช่วยให้เครื่องอยู่ได้นานขึ้นอย่างไร"
    solution: "การซ่อมได้ การอัปเดตที่รองรับเครื่องรุ่นเดิม และการดูแลความสะอาดและการระบายอากาศ ช่วยให้เครื่องใช้ได้นาน ส่วนการเปลี่ยนเครื่องทุกปีไม่ช่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p009
    topics: [computer.society.green-computing]
    difficulty: 3
    type: numeric
    stem: "ศูนย์ข้อมูลใช้กำลังไฟฟ้ารวม 2.6 เมกะวัตต์ และเครื่องคอมพิวเตอร์ใช้ 2.0 เมกะวัตต์ ค่า PUE ของศูนย์ข้อมูลนี้เท่ากับเท่าใด"
    answer: { value: 1.3, tolerance: 0.01 }
    hints:
      - "PUE คือพลังงานรวมหารด้วยพลังงานของเครื่องคอมพิวเตอร์"
      - "หารค่าทั้งสองโดยไม่ต้องแปลงหน่วย เพราะหน่วยเดียวกัน"
    solution: "PUE = 2.6 ÷ 2.0 = 1.3"
    misconceptions:
      - { match: 0.6, feedback: "0.6 คือส่วนเกินที่ไม่ได้ใช้กับเครื่องคอมพิวเตอร์ (2.6 − 2.0) ไม่ใช่ค่า PUE ที่ต้องหาร" }
      - { match: 4.6, feedback: "4.6 เกิดจากการนำสองค่ามาบวกกัน แทนที่จะหาร" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p010
    topics: [computer.society.green-computing]
    difficulty: 3
    type: mcq
    stem: "ค่า PUE ที่เข้าใกล้ 1 มากขึ้นหมายถึงอะไร"
    choices:
      - { id: a, text: "ศูนย์ข้อมูลใช้พลังงานส่วนเกินน้อยลง ประสิทธิภาพสูงขึ้น", correct: true }
      - { id: b, text: "ศูนย์ข้อมูลใช้ไฟฟ้ามากเกินจริงเพิ่มขึ้น", feedback: "ค่าที่เข้าใกล้ 1 หมายถึงพลังงานส่วนเกินลดลง ไม่ใช่เพิ่มขึ้น" }
      - { id: c, text: "ศูนย์ข้อมูลไม่ใช้ไฟฟ้าเลย", feedback: "ค่า PUE จะเท่ากับ 1 เมื่อพลังงานส่วนเกินเป็นศูนย์ แต่ไม่ได้หมายความว่าไม่ใช้ไฟ" }
      - { id: d, text: "ศูนย์ข้อมูลใช้น้ำมากขึ้นเท่านั้น", feedback: "PUE วัดประสิทธิภาพด้านพลังงาน ไม่ได้วัดปริมาณน้ำโดยตรง" }
    hints:
      - "คิดถึงสัดส่วนพลังงานรวมเทียบกับพลังงานที่ใช้กับเครื่องจริง"
      - "ค่า PUE ที่เท่ากับ 1 หมายถึงพลังงานทั้งหมดถูกใช้กับเครื่องพอดี"
    solution: "PUE ใกล้ 1 แปลว่าส่วนที่ไม่ได้ใช้กับเครื่องคอมพิวเตอร์โดยตรงน้อยลง จึงมีประสิทธิภาพสูงขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p011
    topics: [computer.society.green-computing]
    difficulty: 3
    type: numeric
    stem: "เซิร์ฟเวอร์ของร้านค้าออนไลน์ในประเทศไทยกำลังไฟ 350 วัตต์ ทำงาน 24 ชั่วโมงต่อวัน 30 วัน ใช้พลังงานกี่ kWh"
    answer: { value: 252, tolerance: 0.01, unit: "kWh" }
    hints:
      - "หาพลังงานเป็นวัตต์-ชั่วโมงจากกำลังไฟ เวลาต่อวัน และจำนวนวัน"
      - "อย่าลืมหารด้วย 1000 เพื่อเปลี่ยนเป็นกิโลวัตต์-ชั่วโมง"
    solution: "350 × 24 × 30 = 252,000 วัตต์-ชั่วโมง ÷ 1000 = 252 kWh"
    misconceptions:
      - { match: 252000, feedback: "252000 คือหน่วยวัตต์-ชั่วโมง ยังไม่ได้หารด้วย 1000" }
      - { match: 8.4, feedback: "8.4 คือพลังงานของหนึ่งวัน ยังไม่ได้คูณจำนวน 30 วัน" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p012
    topics: [computer.society.green-computing]
    difficulty: 3
    type: match
    stem: "จับคู่ผลกระทบกับกลุ่มคนที่ได้รับผลกระทบมากที่สุด"
    pairs:
      - { left: "สารพิษจากบ่อรีไซเคิลที่ไม่ปลอดภัย", right: "ชุมชนใกล้จุดรับทิ้งขยะอิเล็กทรอนิกส์" }
      - { left: "ค่าซ่อมที่แพงจนซ่อมไม่ไหว", right: "ผู้ใช้ที่มีงบประมาณน้อย" }
      - { left: "การขุดแร่ทำให้ป่าและแหล่งน้ำเสียหาย", right: "ชุมชนใกล้เหมืองแร่" }
    hints:
      - "คิดว่าใครอยู่ใกล้แหล่งที่ได้รับผลโดยตรง"
      - "ดูว่าใครเผชิญกับค่าใช้จ่ายหรืออันตรายนั้นโดยตรง"
    solution: "สารพิษจากการรีไซเคิลกระทบชุมชนใกล้จุดทิ้ง ค่าซ่อมแพงกระทบผู้ใช้ที่มีงบน้อย และการขุดแร่กระทบชุมชนใกล้เหมือง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p013
    topics: [computer.society.green-computing]
    difficulty: 3
    type: mcq
    stem: "ข้อใดอธิบายได้ดีที่สุดว่าทำไมควรดูความต้องการของผู้ใช้ก่อนเลือกเครื่อง"
    choices:
      - { id: a, text: "เครื่องที่มีสเปกเกินความจำเป็นใช้ไฟและทรัพยากรมากเกินจำเป็นโดยไม่ได้ประโยชน์เพิ่ม", correct: true }
      - { id: b, text: "เครื่องใหญ่จะทำงานได้เร็วขึ้นในทุกงาน", feedback: "งานบางประเภท เช่น การพิมพ์เอกสาร ไม่ได้ต้องการความเร็วสูงมาก" }
      - { id: c, text: "เครื่องเล็กดีกว่าเครื่องใหญ่เสมอ", feedback: "ขนาดเครื่องไม่ได้บอกว่าเหมาะกับงานหรือไม่ ต้องดูความต้องการเป็นหลัก" }
      - { id: d, text: "ไม่ต้องดูอะไรเพราะเครื่องทุกรุ่นเหมือนกัน", feedback: "เครื่องแต่ละรุ่นมีสเปกต่างกัน จึงต้องเลือกให้เหมาะกับงาน" }
    hints:
      - "ลองคิดว่าสเปกที่เกินงานจริงมีผลอะไรบ้าง"
      - "ความต้องการจริงคือจุดเริ่มต้นของการเลือก"
    solution: "การเลือกเครื่องควรเริ่มจากความต้องการจริงของผู้ใช้ เพราะเครื่องที่สเปกเกินจำเป็นใช้พลังงานและทรัพยากรมากเกินไปโดยไม่ได้ประโยชน์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p014
    topics: [computer.society.green-computing]
    difficulty: 4
    type: numeric
    stem: "โรงเรียนมีแท็บเล็ต 40 เครื่อง แต่ละเครื่องกำลังไฟ 12 วัตต์ เปิดวันละ 4 ชั่วโมง 20 วันต่อเดือน รวมทั้งหมดใช้พลังงานกี่ kWh ต่อเดือน (ตอบเป็นทศนิยม 1 ตำแหน่ง)"
    answer: { value: 38.4, tolerance: 0.05, unit: "kWh" }
    hints:
      - "คำนวณพลังงานของเครื่องเดียวก่อน แล้วคูณด้วยจำนวนเครื่อง"
      - "หน่วยเริ่มต้นเป็นวัตต์-ชั่วโมง ต้องหารด้วย 1000 เมื่อสุดท้าย"
    solution: "เครื่องเดียว 12 × 4 × 20 = 960 วัตต์-ชั่วโมง ทั้ง 40 เครื่อง 960 × 40 = 38,400 วัตต์-ชั่วโมง ÷ 1000 = 38.4 kWh"
    misconceptions:
      - { match: 0.96, feedback: "0.96 คือพลังงานของแท็บเล็ตเพียงเครื่องเดียว ยังไม่ได้คูณจำนวนเครื่อง 40" }
      - { match: 960, feedback: "960 คือพลังงานของเครื่องเดียวในหน่วยวัตต์-ชั่วโมง ยังไม่ได้คูณและหารให้ถูก" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p015
    topics: [computer.society.green-computing]
    difficulty: 4
    type: mcq
    stem: "การออกแบบให้ซ่อมได้ตามแนวสิทธิในการซ่อม ช่วยสิ่งแวดล้อมอย่างไร"
    choices:
      - { id: a, text: "ยืดอายุการใช้งานและลดการผลิตเครื่องใหม่บ่อยครั้ง", correct: true }
      - { id: b, text: "เพิ่มขยะเพราะต้องเก็บอะไหล่ไว้จำนวนมาก", feedback: "อะไหล่ที่ใช้ซ่อมมีจำนวนน้อยกว่าการผลิตเครื่องใหม่ทั้งเครื่อง" }
      - { id: c, text: "ลดความปลอดภัยเพราะผู้ใช้ซ่อมเองได้", feedback: "การออกแบบให้ซ่อมได้ไม่ได้หมายความว่าจะไม่ปลอดภัย และเป็นสิทธิที่ช่วยผู้ใช้" }
      - { id: d, text: "ไม่มีผลต่อสิ่งแวดล้อมเลยเพราะการซ่อมก็ใช้ไฟเท่ากับการผลิตใหม่", feedback: "การซ่อมมักใช้ทรัพยากรน้อยกว่าการผลิตเครื่องใหม่ทั้งเครื่อง" }
    hints:
      - "ลองคิดว่าการซ่อมช่วยลดการผลิตอะไรบ้าง"
      - "ดูว่าข้อใดสอดคล้องกับการใช้เครื่องให้นานขึ้น"
    solution: "เมื่อซ่อมได้ เครื่องใช้ได้นานขึ้น และไม่ต้องผลิตเครื่องใหม่บ่อยครั้ง ซึ่งช่วยลดการใช้ทรัพยากรและขยะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p016
    topics: [computer.society.green-computing]
    difficulty: 4
    type: numeric
    stem: "โรงเรียนแห่งหนึ่งใช้ไฟฟ้า 100 kWh ในหนึ่งเดือน ถ้าค่าการปล่อยคาร์บอนสมมติเป็น 0.5 กิโลกรัมต่อ kWh จะปล่อยคาร์บอนประมาณกี่กิโลกรัม"
    answer: { value: 50, tolerance: 0, unit: "kg" }
    hints:
      - "ใช้ค่าการปล่อยต่อหน่วยคูณกับจำนวนพลังงานทั้งหมด"
      - "ระวังว่าต้องคูณ ไม่ใช่หาร"
    solution: "100 × 0.5 = 50 กิโลกรัม"
    misconceptions:
      - { match: 100, feedback: "100 คือจำนวน kWh ยังไม่ได้คูณด้วยค่าการปล่อยคาร์บอนต่อหน่วย" }
      - { match: 200, feedback: "200 เกิดจากการหาร 100 ด้วย 0.5 แทนการคูณ" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p017
    topics: [computer.society.green-computing]
    difficulty: 4
    type: code
    stem: |
      เขียนฟังก์ชัน `energy_kwh(watts, hours, days)` ที่รับกำลังไฟเป็นวัตต์ จำนวนชั่วโมงต่อวัน และจำนวนวัน แล้ว **คืนค่า** พลังงานเป็นกิโลวัตต์-ชั่วโมง (kWh)
    starter: |
      def energy_kwh(watts, hours, days):
          pass
    tests: |
      assert abs(energy_kwh(10, 5, 30) - 1.5) < 1e-9, f"energy_kwh(10, 5, 30) ควรได้ 1.5 แต่ได้ {energy_kwh(10, 5, 30)}"
      assert abs(energy_kwh(400, 24, 30) - 288) < 1e-9, f"energy_kwh(400, 24, 30) ควรได้ 288 แต่ได้ {energy_kwh(400, 24, 30)}"
      r = energy_kwh(45, 6, 5)
      assert r is not None, "ยังไม่ได้คืนค่า (ได้ None) ต้องใช้ return"
      assert abs(r - 1.35) < 1e-9, f"energy_kwh(45, 6, 5) ควรได้ 1.35 แต่ได้ {r}"
    reference: |
      def energy_kwh(watts, hours, days):
          return watts * hours * days / 1000
    hints:
      - "คูณกำลังไฟ ชั่วโมงต่อวัน และจำนวนวันเข้าด้วยกันก่อน"
      - "ผลที่ได้เป็นวัตต์-ชั่วโมง ต้องหารด้วย 1000 ก่อนคืนค่า"
    solution: "return watts * hours * days / 1000 เช่น 10 × 5 × 30 ÷ 1000 = 1.5"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.society.green-computing.p018
    topics: [computer.society.green-computing]
    difficulty: 5
    type: code
    stem: |
      เขียนฟังก์ชัน `pue(total_kw, it_kw)` ที่รับพลังงานรวมของศูนย์ข้อมูลและพลังงานของเครื่องคอมพิวเตอร์ (หน่วยเดียวกัน) แล้ว **คืนค่า** PUE ที่ปัดเป็นทศนิยม 2 ตำแหน่ง
    starter: |
      def pue(total_kw, it_kw):
          return 0
    tests: |
      assert pue(1200, 800) == 1.5, f"pue(1200, 800) ควรได้ 1.5 แต่ได้ {pue(1200, 800)}"
      assert pue(1000, 1000) == 1.0, f"pue(1000, 1000) ควรได้ 1.0 แต่ได้ {pue(1000, 1000)}"
      assert pue(750, 500) == 1.5, f"pue(750, 500) ควรได้ 1.5 แต่ได้ {pue(750, 500)}"
    reference: |
      def pue(total_kw, it_kw):
          return round(total_kw / it_kw, 2)
    hints:
      - "PUE คือพลังงานรวมหารด้วยพลังงานของเครื่องคอมพิวเตอร์"
      - "ใช้ round กับจำนวนตำแหน่งที่โจทย์กำหนดเมื่อคืนค่า"
    solution: "return round(total_kw / it_kw, 2) เช่น round(1200 / 800, 2) = 1.5"
    license: CC-BY-SA-4.0
    ai_assisted: true

