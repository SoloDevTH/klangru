    difficulty: 4
    type: "expression"
    stem: "ใช้ $C$ แทนปริมาณคาร์บอน (wt%) ของเหล็กที่ต่ำกว่ายูเทกทอยด์ เขียนนิพจน์สัดส่วนเพิร์ลไลต์ในรูปเศษส่วนที่มี $C$ ตัวเดียว (ไม่ต้องคูณ 100)"
    hints: ["ตัวเศษคือปริมาณคาร์บอนที่เกินจากเฟอร์ไรต์", "ตัวส่วนคือช่วง $0.76 - 0.02 = 0.74$"]
