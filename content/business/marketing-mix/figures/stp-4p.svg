<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="sans-serif" font-size="14">
  <title>จากความต้องการของลูกค้า สู่การแบ่งส่วนตลาด เลือกตลาดเป้าหมาย วางตำแหน่ง และส่วนประสมทางการตลาด 4P</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
  <rect x="20.0" y="30.0" width="170.0" height="96.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="105.0" y="64.2" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="bold">ความต้องการ</text>
