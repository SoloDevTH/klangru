id: science.society.science-and-society
subject: science
title:
  th: วิทยาศาสตร์ เทคโนโลยี และสังคม
  en: Science, technology and society
summary: การใช้ความรู้วิทยาศาสตร์แก้ปัญหาในชีวิตและชุมชน ผลกระทบด้านสังคม เศรษฐกิจ สิ่งแวดล้อม และจริยธรรม การสื่อสารวิทยาศาสตร์กับนโยบาย และค่านิยมของสังคมที่กำหนดทิศทางการวิจัย
difficulty: 3.5
minutes: 35
prerequisites:
- science.nature.nature-of-science
encompasses:
- id: science.nature.nature-of-science
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: การตัดสินใจเรื่องที่เกี่ยวกับวิทยาศาสตร์ในชุมชน
  src: decision.svg
  alt: "วงจรหกขั้นเรียงตามเข็มนาฬิกา 1 ระบุปัญหา เกิดอะไร กับใคร ที่ไหน 2 รวบรวมหลักฐาน ข้อมูลจากการวัด งานวิจัย 3 ผู้มีส่วนได้เสีย ใครได้รับผล มีค่านิยมอย่างไร 4 ทางเลือก ประโยชน์ ความเสี่ยง ต้นทุน 5 ตัดสินใจ ชั่งน้ำหนักหลักฐานกับค่านิยม 6 ติดตามผล วัดผล ปรับเมื่อมีหลักฐานใหม่ แล้ววนกลับไปขั้นที่ 1 ตรงกลางเขียนว่า วิทยาศาสตร์บอกว่าอะไรเป็นไปได้และมีผลอย่างไร สังคมตัดสินว่าควรทำอะไรจากค่านิยมและความจำเป็น"
  caption: "หลักฐานทางวิทยาศาสตร์และค่านิยมของสังคมต่างมีบทบาทในการตัดสินใจ (วาดโดยทีมคลังรู้)"
- type: worked-example
  title: วิเคราะห์ทางเลือกของชุมชนอย่างรอบด้าน
  problem: "ชุมชนริมแม่น้ำแห่งหนึ่งพบว่าน้ำในคลองมีกลิ่นเหม็นช่วงหน้าแล้ง และสงสัยว่ามาจากน้ำทิ้งของบ้านเรือน วิเคราะห์ทางเลือก \"สร้างบ่อบำบัดน้ำเสียรวม\" ด้วยวงจรการตัดสินใจ"
  steps:
  - text: "ระบุปัญหาและหาหลักฐาน: วัดออกซิเจนละลายน้ำและสำรวจจุดปล่อยน้ำทิ้งหลายจุดหลายวัน เพื่อยืนยันว่าน้ำทิ้งเป็นสาเหตุหลักจริง"
    why: "ถ้าสาเหตุจริงเป็นอย่างอื่น การลงทุนอาจไม่แก้ปัญหา"
  - text: "ผู้มีส่วนได้เสีย: ครัวเรือนที่ต้องต่อท่อ ร้านอาหาร ชาวประมงในคลอง และผู้ที่ใช้น้ำปลายน้ำ"
  - text: "ชั่งผลหลายด้าน: สิ่งแวดล้อมดีขึ้น สุขภาพดีขึ้น แต่มีค่าก่อสร้างและค่าดูแล และต้องตกลงว่าใครจ่ายเท่าใดให้ยุติธรรม"
  - text: "ตัดสินใจและติดตามผล: เริ่มจากบ่อขนาดเล็กหรือถังดักไขมันในร้านอาหาร วัดคุณภาพน้ำก่อนและหลัง แล้วขยายผลถ้าได้ผล"
  answer: "ทางเลือกที่ดีอาศัยหลักฐานยืนยันสาเหตุ รับฟังทุกฝ่าย ชั่งผลหลายด้าน และติดตามผลด้วยการวัดจริง"
- type: check
  problem: science.society.science-and-society.p001
- type: worked-example
  title: แยกคำถามเชิงข้อเท็จจริงกับคำถามเชิงคุณค่า
  problem: "ในการอภิปรายเรื่องการใช้ AI ตรวจคัดกรองโรคในโรงพยาบาลชุมชน มีคำถามว่า (1) AI ตรวจพบโรคได้ถูกต้องกี่เปอร์เซ็นต์ (2) ควรใช้ AI แทนการรอพบแพทย์เฉพาะทางหรือไม่ (3) ข้อมูลภาพของผู้ป่วยถูกเก็บอย่างปลอดภัยหรือไม่ จัดประเภทคำถามเหล่านี้"
  steps:
  - text: "คำถาม 1 เป็นคำถามเชิงข้อเท็จจริง ตอบได้ด้วยการทดสอบเทียบกับผลจากแพทย์ในผู้ป่วยจำนวนมาก"
  - text: "คำถาม 3 เป็นข้อเท็จจริงที่ตรวจสอบได้ (ระบบมีการป้องกันอย่างไร) แต่เกี่ยวกับสิทธิความเป็นส่วนตัวซึ่งเป็นค่านิยม"
  - text: "คำถาม 2 เป็นคำถามเชิงคุณค่า ต้องชั่งน้ำหนักระหว่างการเข้าถึงที่เร็วขึ้นกับความเสี่ยงจากความผิดพลาด ใช้ผลของคำถาม 1 และ 3 ประกอบ"
    why: "วิทยาศาสตร์ตอบคำถามเชิงข้อเท็จจริงได้ แต่คำถามว่าควรทำอะไรต้องใช้ค่านิยมร่วมด้วย"
  answer: "คำถามข้อเท็จจริงตอบด้วยหลักฐาน คำถามเชิงคุณค่าตัดสินร่วมกันโดยใช้หลักฐานนั้นประกอบ"
- type: check
  problem: science.society.science-and-society.p009
glossary:
- term: ผู้มีส่วนได้เสีย
  definition: บุคคลหรือกลุ่มที่ได้รับผลหรือมีส่วนร่วมในเรื่องหนึ่ง
- term: ความเห็นร่วมทางวิทยาศาสตร์
  definition: ข้อสรุปที่นักวิทยาศาสตร์ส่วนใหญ่ในสาขานั้นยอมรับ จากหลักฐานจำนวนมากที่ผ่านการตรวจสอบ
- term: จริยธรรมการวิจัย
  definition: หลักที่คุ้มครองผู้เข้าร่วมและสิ่งแวดล้อม เช่น ความยินยอม ความปลอดภัย ความเป็นส่วนตัว และความซื่อสัตย์
- term: ความยินยอมโดยได้รับข้อมูล
  definition: การที่ผู้เข้าร่วมวิจัยรับรู้ข้อมูลครบก่อนแล้วตกลงเข้าร่วมด้วยความสมัครใจ ถอนตัวได้ทุกเมื่อ
- term: นโยบายสาธารณะ
  definition: แนวทางหรือกฎที่หน่วยงานกำหนดเพื่อแก้ปัญหาของส่วนรวม โดยใช้หลักฐานร่วมกับค่านิยมของสังคม
flashcards:
- front: ผลกระทบของเทคโนโลยีมีกี่ด้าน
  back: สังคม เศรษฐกิจ สิ่งแวดล้อม และจริยธรรม ต้องดูทั้งประโยชน์และความเสี่ยง
- front: วิทยาศาสตร์ตอบอะไรได้ และตอบอะไรไม่ได้
  back: ตอบได้ว่าอะไรเป็นไปได้และมีผลอย่างไร การตัดสินว่าควรทำอะไรต้องใช้ค่านิยมร่วมด้วย
- front: อะไรช่วยให้สังคมยอมรับความรู้ใหม่
  back: หลักฐานแข็งแรง ใช้ได้จริงในราคาที่จ่ายได้ สื่อสารเข้าใจง่าย และมาจากแหล่งที่ไว้ใจ
- front: ค่านิยมของสังคมมีผลต่องานวิจัยอย่างไร
  back: กำหนดว่าจะให้ทุนเรื่องใด และกำหนดขอบเขตทางจริยธรรมว่าวิจัยแบบใดทำได้
