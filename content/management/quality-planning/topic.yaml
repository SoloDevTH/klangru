id: management.quality.quality-planning
subject: management
title: { th: การวางแผนคุณภาพและเสียงของลูกค้า, en: Quality planning and the voice of the customer }
summary: รับฟังและจำแนกลูกค้า แบบจำลองคาโน CTQ บ้านแห่งคุณภาพ ข้อกำหนดและพิกัดความเผื่อ การทบทวน ทวนสอบ และยืนยันการออกแบบ และการจัดการข้อร้องเรียน
difficulty: 6
minutes: 45
prerequisites: [management.quality.concepts, management.quality.qc-tools]
encompasses:
  - { id: management.quality.concepts, weight: 0.3 }
  - { id: management.quality.qc-tools, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: kano.svg
    alt: "กราฟแบบจำลองคาโน แกนนอนคือระดับที่ทำได้จากไม่มีเลยถึงครบถ้วน แกนตั้งคือความพอใจจากไม่พอใจมากถึงพอใจมาก เส้นตรงผ่านจุดกำเนิดคือมิติเดียว ยิ่งมากยิ่งพอใจ เส้นสีเขียวอยู่เหนือแกนเล็กน้อยทางซ้ายแล้วพุ่งขึ้นทางขวาคือสร้างความประทับใจ ไม่มีก็ไม่บ่น เส้นสีแดงต่ำมากทางซ้ายแล้วค่อย ๆ ขึ้นมาใกล้แกนนอนทางขวาคือพื้นฐานที่ต้องมี มีครบก็แค่ไม่บ่น"
    caption: "ความต้องการสามแบบหลักในแบบจำลองคาโน"
  - { type: check, problem: management.quality.quality-planning.p001, prompt: "ถามตัวเองว่าถ้าไม่มีสิ่งนี้ ลูกค้าจะบ่นหรือไม่" }
  - type: figure
    src: hoq.svg
    alt: "ตารางบ้านแห่งคุณภาพของกระติกน้ำเก็บความเย็น แถวคือความต้องการของลูกค้าพร้อมความสำคัญ: เก็บความเย็นได้นาน 5, ฝาไม่รั่วซึม 4, ถือสบาย น้ำหนักเบา 3, ราคาไม่แพง 2 คอลัมน์คือข้อกำหนดทางเทคนิค: ความหนาฉนวน ความแน่นของซีลฝา น้ำหนักรวม ต้นทุนวัสดุ คะแนนความสัมพันธ์ แถวเก็บความเย็น: 9, 3, ว่าง, 1 แถวฝาไม่รั่ว: ว่าง, 9, ว่าง, 1 แถวถือสบาย: 3, ว่าง, 9, ว่าง แถวราคาไม่แพง: 3, 1, 1, 9"
    caption: "บ้านแห่งคุณภาพอย่างย่อ (ไม่มีหลังคาและส่วนเทียบคู่แข่ง)"
  - type: worked-example
    title: คำนวณความสำคัญทางเทคนิคจากบ้านแห่งคุณภาพ
    problem: "จากบ้านแห่งคุณภาพของกระติกน้ำในภาพ ความหนาฉนวนและต้นทุนวัสดุมีความสำคัญทางเทคนิคเท่าใด ข้อใดควรได้รับความสนใจก่อน"
    steps:
      - text: "อ่านคอลัมน์ความหนาฉนวน: เก็บความเย็น 9 ฝาไม่รั่ว ว่าง (0) ถือสบาย 3 ราคา 3"
      - text: "คูณแต่ละช่องกับความสำคัญของแถว: $5(9) + 4(0) + 3(3) + 2(3) = 45 + 0 + 9 + 6 = 60$"
        why: "ความต้องการที่ลูกค้าให้ความสำคัญมากต้องมีน้ำหนักมากกว่า จึงต้องคูณก่อนบวก"
      - text: "คอลัมน์ต้นทุนวัสดุ: $5(1) + 4(1) + 3(0) + 2(9) = 5 + 4 + 0 + 18 = 27$"
        why: "แม้ช่อง 9 ของต้นทุนจะดูเด่น แต่อยู่ในแถวที่ลูกค้าให้ความสำคัญน้อยที่สุด (2)"
      - text: "เทียบ: 60 มากกว่า 27 มาก"
    answer: "ความหนาฉนวนได้ 60 ต้นทุนวัสดุได้ 27 ทีมควรให้ความสำคัญกับฉนวนก่อน แต่ต้องระวังว่าฉนวนหนาขึ้นทำให้น้ำหนักเพิ่ม"
  - type: worked-example
    title: พิกัดความเผื่อสะสมของชิ้นส่วนสามชิ้น
    problem: "ชิ้นส่วนสามชิ้นต่อกันเป็นแนวเดียว ยาว $20.0 \\pm 0.10$, $35.0 \\pm 0.15$ และ $15.0 \\pm 0.05$ mm หาความยาวรวมพร้อมพิกัดแบบกรณีแย่ที่สุดและแบบ RSS"
    steps:
      - text: "ความยาวรวมตามแบบ: $20.0 + 35.0 + 15.0 = 70.0$ mm"
      - text: "กรณีแย่ที่สุด: $0.10 + 0.15 + 0.05 = 0.30$ mm จึงยาวได้ 69.70–70.30 mm"
      - text: "RSS: $\\sqrt{0.10^2 + 0.15^2 + 0.05^2} = \\sqrt{0.035} \\approx 0.187$ mm"
        why: "ชิ้นส่วนผันแปรอิสระกัน ความแปรปรวนรวมกันได้ จึงรวมกำลังสองแล้วถอดราก ไม่ใช่บวกพิกัดตรง ๆ"
    answer: "$70.0 \\pm 0.30$ mm แบบกรณีแย่ที่สุด และประมาณ $70.0 \\pm 0.19$ mm แบบ RSS"
  - { type: check, problem: management.quality.quality-planning.p004 }
glossary:
  - { term: เสียงของลูกค้า (VOC), definition: "ความต้องการ ความคาดหวัง และความรู้สึกของลูกค้าที่เก็บจากทั้งข้อมูลเชิงรับและเชิงรุก" }
  - { term: แบบจำลองคาโน, definition: "การจัดความต้องการเป็นพื้นฐานที่ต้องมี มิติเดียว สร้างความประทับใจ และไม่มีผล ตามผลต่อความพึงพอใจ" }
  - { term: CTQ, definition: "คุณลักษณะที่สำคัญต่อคุณภาพ เป็นค่าที่วัดได้พร้อมเกณฑ์ที่แปลงมาจากความต้องการของลูกค้า" }
  - { term: บ้านแห่งคุณภาพ, definition: "ตารางของ QFD ที่เชื่อมความต้องการของลูกค้ากับข้อกำหนดทางเทคนิคด้วยคะแนนความสัมพันธ์" }
  - { term: การทวนสอบ, definition: "การตรวจว่าแบบหรือผลิตภัณฑ์เป็นไปตามข้อกำหนดที่เขียนไว้" }
  - { term: การยืนยันความใช้ได้, definition: "การตรวจว่าผลิตภัณฑ์ตอบความต้องการของผู้ใช้ในสภาพใช้งานจริง" }
flashcards:
  - { front: "NPS", back: "ร้อยละผู้ให้ 9–10 ลบร้อยละผู้ให้ 0–6 (ผู้ให้ 7–8 ไม่นำมาคิด)" }
  - { front: "คาโน: พื้นฐาน vs ประทับใจ", back: "พื้นฐาน: มีก็ไม่บ่น ขาดแล้วโกรธ · ประทับใจ: ไม่มีก็ไม่บ่น มีแล้วชอบ" }
  - { front: "ความสำคัญทางเทคนิคใน QFD", back: "ผลรวมของ (ความสำคัญของลูกค้า × คะแนนความสัมพันธ์ 9/3/1) ในคอลัมน์นั้น" }
  - { front: "พิกัดสะสม: กรณีแย่ที่สุด vs RSS", back: "แย่ที่สุด: t₁ + t₂ + … · RSS: √(t₁² + t₂² + …)" }
  - { front: "ทวนสอบ vs ยืนยันความใช้ได้", back: "ทวนสอบ: ทำตามสเปกถูกไหม · ยืนยัน: ทำของที่ผู้ใช้ต้องการจริงไหม" }
