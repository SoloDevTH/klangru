    solution: "ขณะหมุน ของเหลวในหลอดกึ่งวงกลมไหลตาม เมื่อหยุดกะทันหัน ของเหลวยังไหลต่อเพราะความเฉื่อย เซลล์ขนจึงส่งสัญญาณว่ายังหมุน ขัดกับข้อมูลจากตา จึงรู้สึกเวียนและเดินเซ"
