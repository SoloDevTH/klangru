<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
<title>แผนผังการเปลี่ยน N2 เป็น NH3 ต่อเป็น NO NO2 และ HNO3 พร้อมสารที่ใช้ในแต่ละขั้น</title>
<rect x="0" y="0" width="800" height="200" fill="#ffffff"/>
<defs><marker id="na" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d3557"/></marker></defs>
<rect x="20" y="60" width="96" height="50" rx="8" fill="#eaf4fb" stroke="#1d3557" stroke-width="2"/>
<text x="68.0" y="93" font-size="22" font-weight="bold" text-anchor="middle" fill="#1d3557" font-family="sans-serif">N₂</text>
<text x="68.0" y="154" font-size="12" text-anchor="middle" fill="#222" font-family="Loma, sans-serif">ไนโตรเจนจากอากาศ</text>
<rect x="186" y="60" width="96" height="50" rx="8" fill="#eaf4fb" stroke="#1d3557" stroke-width="2"/>
<text x="234.0" y="93" font-size="22" font-weight="bold" text-anchor="middle" fill="#1d3557" font-family="sans-serif">NH₃</text>
<text x="234.0" y="154" font-size="12" text-anchor="middle" fill="#222" font-family="Loma, sans-serif">แอมโมเนีย ใช้ทำปุ๋ย</text>
<rect x="352" y="60" width="96" height="50" rx="8" fill="#eaf4fb" stroke="#1d3557" stroke-width="2"/>
<text x="400.0" y="93" font-size="22" font-weight="bold" text-anchor="middle" fill="#1d3557" font-family="sans-serif">NO</text>
<text x="400.0" y="154" font-size="12" text-anchor="middle" fill="#222" font-family="Loma, sans-serif">พบในไอเสียเครื่องยนต์</text>
<rect x="518" y="60" width="96" height="50" rx="8" fill="#eaf4fb" stroke="#1d3557" stroke-width="2"/>
<text x="566.0" y="93" font-size="22" font-weight="bold" text-anchor="middle" fill="#1d3557" font-family="sans-serif">NO₂</text>
<text x="566.0" y="154" font-size="12" text-anchor="middle" fill="#222" font-family="Loma, sans-serif">ระคายเคืองทางเดินหายใจ</text>
<rect x="684" y="60" width="96" height="50" rx="8" fill="#eaf4fb" stroke="#1d3557" stroke-width="2"/>
<text x="732.0" y="93" font-size="22" font-weight="bold" text-anchor="middle" fill="#1d3557" font-family="sans-serif">HNO₃</text>
<text x="732.0" y="154" font-size="12" text-anchor="middle" fill="#222" font-family="Loma, sans-serif">กรดไนตริก ทำปุ๋ย</text>
<line x1="122" y1="85.0" x2="180" y2="85.0" stroke="#e76f51" stroke-width="2.4" marker-end="url(#na)"/>
<text x="151.0" y="71.0" font-size="10" text-anchor="middle" fill="#e76f51" font-family="Loma, sans-serif" font-weight="bold">ฮาเบอร์</text>
<text x="151.0" y="115.0" font-size="10" text-anchor="middle" fill="#333" font-family="Loma, sans-serif">+ H₂</text>
<text x="151.0" y="128.0" font-size="10" text-anchor="middle" fill="#333" font-family="Loma, sans-serif">ความดันสูง</text>
<line x1="288" y1="85.0" x2="346" y2="85.0" stroke="#e76f51" stroke-width="2.4" marker-end="url(#na)"/>
<text x="317.0" y="71.0" font-size="10" text-anchor="middle" fill="#e76f51" font-family="Loma, sans-serif" font-weight="bold">ออสต์วัลด์</text>
<text x="317.0" y="115.0" font-size="10" text-anchor="middle" fill="#333" font-family="Loma, sans-serif">+ O₂ / Pt</text>
<text x="317.0" y="128.0" font-size="10" text-anchor="middle" fill="#333" font-family="Loma, sans-serif">~800 °C</text>
<line x1="454" y1="85.0" x2="512" y2="85.0" stroke="#e76f51" stroke-width="2.4" marker-end="url(#na)"/>
<text x="483.0" y="71.0" font-size="10" text-anchor="middle" fill="#e76f51" font-family="Loma, sans-serif" font-weight="bold">ออกซิไดซ์</text>
<text x="483.0" y="115.0" font-size="10" text-anchor="middle" fill="#333" font-family="Loma, sans-serif">+ O₂</text>
<line x1="620" y1="85.0" x2="678" y2="85.0" stroke="#e76f51" stroke-width="2.4" marker-end="url(#na)"/>
<text x="649.0" y="71.0" font-size="10" text-anchor="middle" fill="#e76f51" font-family="Loma, sans-serif" font-weight="bold">ละลายในน้ำ</text>
<text x="649.0" y="115.0" font-size="10" text-anchor="middle" fill="#333" font-family="Loma, sans-serif">+ H₂O</text>
<text x="400.0" y="188" font-size="12" text-anchor="middle" fill="#666" font-family="Loma, sans-serif">ตัวอย่างการเปลี่ยนไนโตรเจนจากอากาศเป็นกรดไนตริก ใช้ในการผลิตปุ๋ยไนเทรต (ไม่ใช่ขั้นตอนการทดลอง)</text>
</svg>
