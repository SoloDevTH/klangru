problems:
  - id: chemistry.solutions.solubility-percent.p001
    topics: [chemistry.solutions.solubility-percent]
    difficulty: 1
    type: mcq
    stem: "ละลายน้ำตาลทรายในน้ำได้น้ำเชื่อม ข้อใดเป็นตัวละลาย"
    choices:
      - { id: a, text: "น้ำตาลทราย", correct: true, feedback: "ถูก น้ำตาลเป็นของแข็ง ส่วนน้ำเชื่อมเป็นของเหลว น้ำตาลจึงเป็นตัวละลาย" }
      - { id: b, text: "น้ำ", feedback: "น้ำมีสถานะเดียวกับน้ำเชื่อม (ของเหลว) จึงเป็นตัวทำละลาย" }
      - { id: c, text: "น้ำเชื่อม", feedback: "น้ำเชื่อมคือสารละลายทั้งหมด ไม่ใช่ตัวละลาย" }
    hints:
      - "สารละลายเป็นของเหลว สารใดมีสถานะเดียวกับสารละลาย"
      - "สารที่มีสถานะต่างจากสารละลายคือตัวละลาย"
    solution: "น้ำเชื่อมเป็นของเหลว น้ำซึ่งเป็นของเหลวเหมือนกันเป็นตัวทำละลาย ส่วน **น้ำตาลทราย** เป็นตัวละลาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solubility-percent.p002
    topics: [chemistry.solutions.solubility-percent]
    difficulty: 1
    type: mcq
    stem: "ต้องการเอาเกลือกลับคืนจากน้ำเกลือ ควรทำอย่างไร"
    choices:
      - { id: a, text: "ให้ความร้อนหรือตากแดดจนน้ำระเหยไป", correct: true, feedback: "ถูก น้ำระเหยไป เกลือซึ่งไม่ระเหยเหลืออยู่" }
      - { id: b, text: "กรองด้วยกระดาษกรอง", feedback: "เกลือที่ละลายแล้วผ่านกระดาษกรองไปกับน้ำ" }
      - { id: c, text: "ใช้แม่เหล็กดูด", feedback: "เกลือไม่ถูกแม่เหล็กดูด" }
    hints:
      - "เกลือละลายอยู่ในน้ำ ต้องเอาน้ำออก"
      - "น้ำกลายเป็นไอได้ แต่เกลือไม่ระเหย"
    solution: "ระเหยน้ำออก (ให้ความร้อนหรือตากแดด) เกลือที่ไม่ระเหยจะเหลือเป็นของแข็ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solubility-percent.p003
    topics: [chemistry.solutions.solubility-percent]
    difficulty: 2
    type: numeric
    stem: "ละลายน้ำตาล 25 g ในน้ำ 100 g สารละลายนี้เข้มข้นร้อยละเท่าใดโดยมวล"
    answer: { value: 20, tolerance: 0.1, unit: "% w/w" }
    misconceptions:
      - { match: 25, feedback: "หารด้วยมวลน้ำ (ตัวทำละลาย) ต้องหารด้วยมวลสารละลาย $25 + 100 = 125$ g" }
    hints:
      - "มวลสารละลาย = มวลตัวละลาย + มวลตัวทำละลาย"
      - "% w/w = มวลตัวละลาย ÷ มวลสารละลาย × 100"
    solution: "มวลสารละลาย $= 25 + 100 = 125$ g · ความเข้มข้น $= \\dfrac{25}{125} \\times 100 = 20\\%$ w/w"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solubility-percent.p004
    topics: [chemistry.solutions.solubility-percent]
    difficulty: 2
    type: mcq
    stem: "เปิดฝาขวดน้ำอัดลม มีฟองแก๊สผุดขึ้นมาทันที เพราะเหตุใด"
    choices:
      - { id: a, text: "ความดันในขวดลดลง แก๊สคาร์บอนไดออกไซด์จึงละลายได้น้อยลงและแยกออกมา", correct: true, feedback: "ถูก แก๊สละลายได้มากเมื่อความดันสูง" }
      - { id: b, text: "อากาศจากภายนอกเข้าไปผสมเป็นฟอง", feedback: "ฟองเป็นแก๊สคาร์บอนไดออกไซด์ที่ละลายอยู่ในน้ำอัดลม ไม่ใช่อากาศจากภายนอก" }
      - { id: c, text: "อุณหภูมิของน้ำอัดลมสูงขึ้นทันทีที่เปิดฝา", feedback: "อุณหภูมิไม่ได้เปลี่ยนทันที สิ่งที่เปลี่ยนทันทีคือความดัน" }
    hints:
      - "ก่อนเปิดฝา แก๊สในขวดถูกอัดไว้ที่ความดันสูง"
      - "ความดันมีผลต่อสภาพละลายได้ของแก๊สอย่างไร"
    solution: "โรงงานอัดแก๊สคาร์บอนไดออกไซด์ลงในน้ำที่ความดันสูง เมื่อเปิดฝา ความดันลดลง แก๊สละลายได้น้อยลง ส่วนที่เกินจึงแยกออกมาเป็นฟอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solubility-percent.p005
    topics: [chemistry.solutions.solubility-percent]
    difficulty: 2
    type: numeric
    stem: "น้ำเกลือล้างแผลขวดหนึ่งมีปริมาตร 500 mL ความเข้มข้น 0.9% w/v มีโซเดียมคลอไรด์ละลายอยู่กี่กรัม"
    answer: { value: 4.5, tolerance: 0.05, unit: g }
    misconceptions:
      - { match: 450, feedback: "ลืมหารด้วย 100 ร้อยละ 0.9 w/v คือ 0.9 g ในทุก 100 mL" }
    hints:
      - "0.9% w/v หมายถึงเกลือ 0.9 g ในสารละลาย 100 mL"
      - "500 mL เท่ากับกี่เท่าของ 100 mL"
    solution: "$\\dfrac{0.9}{100} \\times 500 = 4.5$ g"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solubility-percent.p006
    topics: [chemistry.solutions.solubility-percent]
    difficulty: 3
    type: numeric
    stem: "จากกราฟ โพแทสเซียมไนเตรตละลายในน้ำ 100 g ที่ 60 °C ได้ 110 g ถ้ามีน้ำเพียง 50 g ที่ 60 °C จะละลายโพแทสเซียมไนเตรตได้มากที่สุดกี่กรัม"
    figure:
      src: solubility-curve.svg
      alt: "กราฟสภาพละลายได้ (กรัมต่อน้ำ 100 กรัม) กับอุณหภูมิ 0 ถึง 100 °C เส้นโพแทสเซียมไนเตรตเพิ่มขึ้นเร็ว ผ่าน 31.6 g ที่ 20 °C, 63.9 g ที่ 40 °C, 110 g ที่ 60 °C และ 169 g ที่ 80 °C ส่วนเส้นเกลือแกงเกือบราบอยู่ระหว่าง 35.7 ถึง 39.2 g"
    answer: { value: 55, tolerance: 0.5, unit: g }
    misconceptions:
      - { match: 110, feedback: "110 g เป็นค่าสำหรับน้ำ 100 g น้ำ 50 g ละลายได้ครึ่งหนึ่ง" }
      - { match: 220, feedback: "น้ำน้อยลงจะละลายได้น้อยลง ไม่ใช่มากขึ้น" }
    hints:
      - "สภาพละลายได้บนกราฟคิดต่อน้ำ 100 g"
      - "ปริมาณที่ละลายได้แปรผันตรงกับมวลน้ำ"
    solution: "น้ำ 50 g เป็นครึ่งหนึ่งของ 100 g จึงละลายได้ $110 \\times \\dfrac{50}{100} = 55$ g"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solubility-percent.p007
    topics: [chemistry.solutions.solubility-percent]
    difficulty: 3
    type: mcq
    stem: "นักเรียนใส่เกล็ดไอโอดีนเท่ากันลงในหลอดที่มีน้ำ 5 mL และหลอดที่มีเอทานอล 5 mL ที่อุณหภูมิห้อง พบว่าหลอดเอทานอลเป็นสีน้ำตาลเข้มและเกล็ดหายหมด ส่วนหลอดน้ำมีสีจาง ๆ และเกล็ดเหลือเกือบหมด การทดลองนี้ศึกษาปัจจัยใด"
    choices:
      - { id: a, text: "ชนิดของตัวทำละลาย", correct: true, feedback: "ถูก ตัวแปรที่เปลี่ยนคือน้ำกับเอทานอล ส่วนตัวละลาย ปริมาตร และอุณหภูมิเท่ากัน" }
      - { id: b, text: "ชนิดของตัวละลาย", feedback: "ทั้งสองหลอดใช้ไอโอดีนเหมือนกัน ตัวละลายจึงไม่ได้เปลี่ยน" }
      - { id: c, text: "อุณหภูมิ", feedback: "ทั้งสองหลอดอยู่ที่อุณหภูมิห้องเท่ากัน" }
      - { id: d, text: "ความดัน", feedback: "ความดันมีผลกับแก๊ส และในการทดลองนี้ความดันไม่ได้เปลี่ยน" }
    hints:
      - "หาว่าอะไรต่างกันระหว่างสองหลอด"
      - "สิ่งที่ต่างกันเพียงอย่างเดียวคือตัวแปรที่ศึกษา"
    solution: "สองหลอดต่างกันเฉพาะของเหลวที่ใช้ละลาย จึงศึกษาผลของ **ชนิดของตัวทำละลาย** ไอโอดีนละลายในเอทานอลได้ดีกว่าในน้ำมาก ยาทิงเจอร์ไอโอดีนจึงใช้แอลกอฮอล์เป็นตัวทำละลาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solubility-percent.p008
    topics: [chemistry.solutions.solubility-percent]
    difficulty: 3
    type: match
    stem: "จับคู่ฉลากกับหน่วยความเข้มข้นที่ใช้"
    pairs:
      - { left: "แอลกอฮอล์ล้างแผล 70%", right: "ร้อยละโดยปริมาตรต่อปริมาตร (% v/v)" }
      - { left: "น้ำเกลือล้างแผล 0.9%", right: "ร้อยละโดยมวลต่อปริมาตร (% w/v)" }
      - { left: "ทองรูปพรรณ 96.5%", right: "ร้อยละโดยมวลต่อมวล (% w/w)" }
    hints:
      - "ตัวละลายและสารละลายแต่ละคู่เป็นของแข็งหรือของเหลว"
      - "ของเหลวในของเหลววัดเป็นปริมาตร ของแข็งในของแข็งวัดเป็นมวล"
    solution: "แอลกอฮอล์กับน้ำเป็นของเหลวทั้งคู่ ใช้ % v/v · เกลือ (ของแข็ง) ในน้ำเกลือ (ของเหลว) ใช้ % w/v · ทองในโลหะผสม (ของแข็ง) ใช้ % w/w"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solubility-percent.p009
    topics: [chemistry.solutions.solubility-percent]
    difficulty: 3
    type: numeric
    stem: "ตวงเอทานอลบริสุทธิ์ 35 mL ใส่ขวดวัดปริมาตร แล้วเติมน้ำจนปริมาตรรวม 50 mL สารละลายนี้มีความเข้มข้นร้อยละเท่าใดโดยปริมาตร"
    answer: { value: 70, tolerance: 0.5, unit: "% v/v" }
    misconceptions:
      - { match: 41.2, feedback: "คิดว่าเติมน้ำ 50 mL ทำให้ปริมาตรรวม 85 mL แต่โจทย์เติมน้ำจน **ปริมาตรรวม** เป็น 50 mL" }
    hints:
      - "ปริมาตรสารละลายคือ 50 mL"
      - "% v/v = ปริมาตรตัวละลาย ÷ ปริมาตรสารละลาย × 100"
    solution: "$\\dfrac{35}{50} \\times 100 = 70\\%$ v/v"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solubility-percent.p010
    topics: [chemistry.solutions.solubility-percent]
    difficulty: 4
    type: numeric
    stem: "หลังน้ำลด ต้องการเช็ดพื้นบ้านด้วยน้ำยาฆ่าเชื้อที่มีโซเดียมไฮโปคลอไรต์ 0.1% w/v ปริมาตร 2,000 mL น้ำยาฟอกขาวที่มีโซเดียมไฮโปคลอไรต์ 6% w/v ต้องตวงน้ำยาฟอกขาวกี่ mL แล้วเติมน้ำจนครบ 2,000 mL (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 33.3, tolerance: 0.4, unit: mL }
    misconceptions:
      - { match: 2, feedback: "นั่นคือมวลโซเดียมไฮโปคลอไรต์ (2 g) ที่ต้องการ แต่น้ำยาฟอกขาวไม่ใช่สารบริสุทธิ์ ทุก 100 mL มีเพียง 6 g" }
    hints:
      - "หามวลโซเดียมไฮโปคลอไรต์ในสารละลายที่ต้องการก่อน"
      - "น้ำยาฟอกขาว 100 mL มีโซเดียมไฮโปคลอไรต์ 6 g แล้วต้องใช้กี่ mL จึงได้มวลเท่าที่ต้องการ"
    solution: "ต้องการโซเดียมไฮโปคลอไรต์ $\\dfrac{0.1}{100} \\times 2000 = 2$ g · น้ำยาฟอกขาวที่มี 2 g $= 2 \\times \\dfrac{100}{6} = 33.3$ mL แล้วเติมน้ำจนครบ 2,000 mL ทำในที่อากาศถ่ายเท สวมถุงมือ และห้ามผสมกับน้ำยาล้างห้องน้ำชนิดกรด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solubility-percent.p011
    topics: [chemistry.solutions.solubility-percent]
    difficulty: 4
    type: numeric
    stem: "สารละลายโพแทสเซียมไนเตรตอิ่มตัวในน้ำ 100 g ที่ 60 °C (ละลายได้ 110 g) ถูกทำให้เย็นลงถึง 20 °C (ละลายได้ 31.6 g) จะมีผลึกโพแทสเซียมไนเตรตแยกออกมากี่กรัม"
    answer: { value: 78.4, tolerance: 0.5, unit: g }
    misconceptions:
      - { match: 110, feedback: "ผลึกไม่ได้แยกออกมาทั้งหมด ที่ 20 °C น้ำยังละลายไว้ได้ 31.6 g" }
      - { match: 141.6, feedback: "บวกกันแทนการลบ ผลึกที่แยกออกมาคือส่วนที่เกินจากที่น้ำเย็นละลายไว้ได้" }
    hints:
      - "ที่ 20 °C น้ำ 100 g ยังละลายได้ 31.6 g"
      - "ส่วนที่เกินจากนั้นจะตกผลึก"
    solution: "ผลึกที่แยกออกมา $= 110 - 31.6 = 78.4$ g"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solubility-percent.p012
    topics: [chemistry.solutions.solubility-percent]
    difficulty: 4
    type: mcq
    stem: "เกษตรกรเลี้ยงปลานิลในบ่อดิน พบว่าในวันที่ร้อนจัด ปลาลอยหัวขึ้นมาฮุบอากาศที่ผิวน้ำ ข้อมูล: น้ำอิ่มตัวด้วยอากาศละลายออกซิเจนได้ประมาณ 9.1 mg/L ที่ 20 °C และ 7.6 mg/L ที่ 30 °C ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "น้ำที่ร้อนขึ้นละลายออกซิเจนได้น้อยลง ปลาจึงได้ออกซิเจนไม่พอ", correct: true, feedback: "ถูก แก๊สละลายได้น้อยลงเมื่ออุณหภูมิสูงขึ้น" }
      - { id: b, text: "น้ำที่ร้อนขึ้นละลายออกซิเจนได้มากเกินไป ปลาจึงขึ้นมาหลบ", feedback: "ข้อมูลแสดงว่าที่ 30 °C ละลายได้น้อยกว่าที่ 20 °C" }
      - { id: c, text: "อุณหภูมิไม่มีผลต่อแก๊สที่ละลายในน้ำ", feedback: "ข้อมูลแสดงว่าออกซิเจนละลายได้ลดลงจาก 9.1 เป็น 7.6 mg/L" }
    hints:
      - "เปรียบเทียบตัวเลข 9.1 กับ 7.6 mg/L"
      - "แก๊สกับของแข็งตอบสนองต่ออุณหภูมิไม่เหมือนกัน"
    solution: "ข้อมูลแสดงว่าออกซิเจนละลายในน้ำได้น้อยลงเมื่อน้ำร้อนขึ้น วันร้อนจัดน้ำในบ่อจึงมีออกซิเจนน้อยลง ปลาต้องขึ้นมาฮุบอากาศ เกษตรกรจึงเปิดเครื่องตีน้ำเพื่อเพิ่มออกซิเจน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.solutions.solubility-percent.p013
    topics: [chemistry.solutions.solubility-percent]
    difficulty: 4
    type: order
    stem: "ออกแบบการทดลองหาผลของอุณหภูมิต่อสภาพละลายได้ของน้ำตาลทราย เรียงขั้นตอนให้ถูกต้อง"
    items:
      - "ตวงน้ำ 50 g ใส่บีกเกอร์ 3 ใบ และทำให้มีอุณหภูมิ 20, 40 และ 60 °C"
      - "ชั่งน้ำตาลทรายไว้ปริมาณมากพอ บันทึกมวลเริ่มต้น"
      - "เติมน้ำตาลทีละน้อยลงในแต่ละบีกเกอร์ คนจนละลาย จนมีน้ำตาลเหลือไม่ละลาย"
      - "ชั่งน้ำตาลที่เหลือ หามวลที่ละลายไปในแต่ละอุณหภูมิ"
      - "เปรียบเทียบมวลที่ละลายได้กับอุณหภูมิ แล้วสรุปผล"
    hints:
      - "ตัวแปรต้นคืออุณหภูมิ ตัวแปรควบคุมคือมวลน้ำและชนิดน้ำตาล"
      - "ต้องรู้มวลเริ่มต้นก่อนเติม จึงหามวลที่ละลายได้"
    solution: "เตรียมน้ำเท่ากันที่อุณหภูมิต่างกัน → ชั่งน้ำตาลเริ่มต้น → เติมจนอิ่มตัว → ชั่งส่วนที่เหลือเพื่อหามวลที่ละลาย → เปรียบเทียบและสรุป เปลี่ยนเพียงอุณหภูมิ ตัวแปรอื่นคงที่"
