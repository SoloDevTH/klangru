<text x="500.0" y="140.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">ควอตซ์</text>
<circle cx="573.3" cy="170" r="11" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="573.3" y="175.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">8</text>
<text x="573.3" y="118.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">โทแพซ</text>
<circle cx="646.7" cy="170" r="11" fill="#fff" stroke="#111" stroke-width="1.5"/>
