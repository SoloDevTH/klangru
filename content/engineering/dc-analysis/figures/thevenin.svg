<circle cx="200.0" cy="80.0" r="5.0" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="210.0" y="85.0" text-anchor="start" fill="#15211e" font-size="15" font-weight="bold">a</text>
<circle cx="200.0" cy="160.0" r="5.0" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="210.0" y="165.0" text-anchor="start" fill="#15211e" font-size="15" font-weight="bold">b</text>
<text x="260.0" y="130.0" text-anchor="middle" fill="#15211e" font-size="30" font-weight="bold">≡</text>
<line x1="350.0" y1="80.0" x2="350.0" y2="102.0" stroke="#15211e" stroke-width="2"/>
<line x1="350.0" y1="138.0" x2="350.0" y2="160.0" stroke="#15211e" stroke-width="2"/>
<circle cx="350.0" cy="120.0" r="18.0" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="350.0" y="116.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">+</text>
<text x="350.0" y="133.0" text-anchor="middle" fill="#15211e" font-size="15" font-weight="bold">−</text>
<text x="326.0" y="125.0" text-anchor="end" fill="#15211e" font-size="14">V<tspan baseline-shift='sub' font-size='10'>Th</tspan></text>
<line x1="350.0" y1="80.0" x2="380.0" y2="80.0" stroke="#15211e" stroke-width="2"/>
<line x1="440.0" y1="80.0" x2="470.0" y2="80.0" stroke="#15211e" stroke-width="2"/>
<polyline points="380.0,80.0 385.0,72.0 395.0,88.0 405.0,72.0 415.0,88.0 425.0,72.0 435.0,88.0 440.0,80.0" fill="none" stroke="#15211e" stroke-width="2" stroke-linejoin="round"/>
<text x="410.0" y="64.0" text-anchor="middle" fill="#15211e" font-size="14">R<tspan baseline-shift='sub' font-size='10'>Th</tspan></text>
<polyline points="350.0,160.0 470.0,160.0" fill="none" stroke="#15211e" stroke-width="2" stroke-linejoin="round"/>
<circle cx="470.0" cy="80.0" r="5.0" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="480.0" y="85.0" text-anchor="start" fill="#15211e" font-size="15" font-weight="bold">a</text>
<circle cx="470.0" cy="160.0" r="5.0" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="480.0" y="165.0" text-anchor="start" fill="#15211e" font-size="15" font-weight="bold">b</text>
<text x="530.0" y="130.0" text-anchor="middle" fill="#15211e" font-size="30" font-weight="bold">≡</text>
<line x1="620.0" y1="80.0" x2="620.0" y2="102.0" stroke="#15211e" stroke-width="2"/>
<line x1="620.0" y1="138.0" x2="620.0" y2="160.0" stroke="#15211e" stroke-width="2"/>
<circle cx="620.0" cy="120.0" r="18.0" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<line x1="620.0" y1="131.0" x2="620.0" y2="115.8" stroke="#15211e" stroke-width="2"/>
<polygon points="620.0,109.0 616.4,117.0 623.6,117.0" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="596.0" y="125.0" text-anchor="end" fill="#15211e" font-size="14">I<tspan baseline-shift='sub' font-size='10'>N</tspan></text>
<polyline points="620.0,80.0 710.0,80.0" fill="none" stroke="#15211e" stroke-width="2" stroke-linejoin="round"/>
<polyline points="620.0,160.0 710.0,160.0" fill="none" stroke="#15211e" stroke-width="2" stroke-linejoin="round"/>
<line x1="680.0" y1="80.0" x2="680.0" y2="96.0" stroke="#15211e" stroke-width="2"/>
<line x1="680.0" y1="144.0" x2="680.0" y2="160.0" stroke="#15211e" stroke-width="2"/>
<polyline points="680.0,96.0 672.0,100.0 688.0,108.0 672.0,116.0 688.0,124.0 672.0,132.0 688.0,140.0 680.0,144.0" fill="none" stroke="#15211e" stroke-width="2" stroke-linejoin="round"/>
<text x="692.0" y="125.0" text-anchor="start" fill="#15211e" font-size="14">R<tspan baseline-shift='sub' font-size='10'>N</tspan></text>
<circle cx="710.0" cy="80.0" r="5.0" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="720.0" y="85.0" text-anchor="start" fill="#15211e" font-size="15" font-weight="bold">a</text>
<circle cx="710.0" cy="160.0" r="5.0" fill="#ffffff" stroke="#15211e" stroke-width="2"/>
<text x="720.0" y="165.0" text-anchor="start" fill="#15211e" font-size="15" font-weight="bold">b</text>
<text x="380.0" y="215.0" text-anchor="middle" fill="#777" font-size="13">V<tspan baseline-shift='sub' font-size='10'>Th</tspan> = แรงดันระหว่าง a กับ b เมื่อเปิดวงจร (ไม่มีโหลด)</text>
<text x="380.0" y="238.0" text-anchor="middle" fill="#777" font-size="13">R<tspan baseline-shift='sub' font-size='10'>Th</tspan> = R<tspan baseline-shift='sub' font-size='10'>N</tspan> = ความต้านทานที่มองเข้าไปเมื่อปิดแหล่งจ่ายอิสระ · I<tspan baseline-shift='sub' font-size='10'>N</tspan> = V<tspan baseline-shift='sub' font-size='10'>Th</tspan> / R<tspan baseline-shift='sub' font-size='10'>Th</tspan></text>
</svg>
