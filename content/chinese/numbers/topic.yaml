id: chinese.hanzi.numbers
subject: chinese
title: { th: ตัวเลขภาษาจีน 一 ถึง 百, en: Chinese numbers from one to one hundred }
summary: อ่านและเขียนตัวเลขจีน 一 ถึง 十 และ 百 แล้วนำมาประกอบเป็นเลขสองหลักแบบเดียวกับภาษาไทย เช่น 二十五 คือ ยี่สิบห้า
difficulty: 2
minutes: 30
prerequisites: [chinese.hanzi.basic-strokes, chinese.pinyin.tones]
encompasses:
  - { id: chinese.hanzi.basic-strokes, weight: 0.3 }
  - { id: chinese.pinyin.tones, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
glossary:
  - { term: 十 shí, definition: สิบ ใช้เป็นหลักสิบในการสร้างเลขสองหลัก เช่น 三十 (30) และ 十三 (13) }
  - { term: 百 bǎi, definition: ร้อย เลข 100 อ่านว่า 一百 yìbǎi }
  - { term: 两 liǎng, definition: สอง ใช้เมื่อบอกจำนวนสิ่งของ เช่น 两个 (สองอัน) ส่วนการนับเลขใช้ 二 èr }
flashcards:
  - { front: "一 二 三 四 五", back: "yī èr sān sì wǔ (1 2 3 4 5)" }
  - { front: "六 七 八 九 十", back: "liù qī bā jiǔ shí (6 7 8 9 10)" }
  - { front: "十二 กับ 二十 ต่างกันอย่างไร", back: "十二 shí'èr = 12 (สิบ + สอง) · 二十 èrshí = 20 (สอง × สิบ)" }
  - { front: "一百 อ่านว่าอย่างไร", back: "yìbǎi (一 ก่อนเสียง 3 เปลี่ยนเป็นเสียง 4) แปลว่า หนึ่งร้อย" }
