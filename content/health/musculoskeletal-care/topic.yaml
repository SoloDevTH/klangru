id: health.body.musculoskeletal-care
subject: health
title: { th: "กล้ามเนื้อ กระดูก และข้อ: ความสำคัญและการดูแล", en: "Muscles, bones and joints: why they matter and how to care for them" }
summary: หน้าที่ของกล้ามเนื้อ กระดูก และข้อต่อ ความสำคัญต่อสุขภาพ การเจริญเติบโต และพัฒนาการ และวิธีดูแล ทั้งอาหาร แคลเซียม การออกกำลังกาย ท่าทาง การยกของ และการป้องกันการบาดเจ็บ
difficulty: 2.5
minutes: 30
prerequisites: [health.body.internal-organs]
encompasses:
  - { id: health.body.internal-organs, weight: 0.15 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: กล้ามเนื้อทำงานเป็นคู่
    src: arm-muscles.svg
    alt: "แผนภาพแขนขวาที่งออยู่ที่ข้อศอก กระดูกต้นแขนตั้งตรง แขนท่อนล่างเฉียงขึ้นไปทางขวา กล้ามเนื้อต้นแขนด้านหน้าป่องและหดตัว ยึดจากหัวไหล่ไปที่แขนท่อนล่างใกล้ข้อศอก ดึงแขนท่อนล่างขึ้น กล้ามเนื้อต้นแขนด้านหลังคลายตัว ยึดจากหัวไหล่ไปที่ปลายข้อศอก ข้อศอกเป็นข้อต่อแบบบานพับ ข้อความใต้ภาพบอกว่าตอนเหยียดแขน กล้ามเนื้อด้านหลังหดตัว ด้านหน้าคลายตัว"
    caption: "กล้ามเนื้อดึงได้อย่างเดียว จึงต้องมีอีกมัดหนึ่งดึงกลับ"
  - type: worked-example
    title: กระเป๋าของภูมิหนักเกินไปไหม
    problem: "ภูมิหนัก 32 กิโลกรัม กระเป๋านักเรียนหนัก 5 กิโลกรัม ถ้ายึดหลักว่ากระเป๋าไม่ควรหนักเกินราวร้อยละ 10 ของน้ำหนักตัว กระเป๋าของภูมิหนักเกินไปหรือไม่ และควรแก้อย่างไร"
    steps:
      - text: "หาน้ำหนักกระเป๋าที่เหมาะ: ร้อยละ 10 ของ 32 = 32 × 10 ÷ 100 = 3.2 กิโลกรัม"
      - text: "เทียบ: กระเป๋าหนัก 5 กิโลกรัม มากกว่า 3.2 กิโลกรัม จึงหนักเกินไป"
      - text: "หาส่วนที่เกิน: 5 − 3.2 = 1.8 กิโลกรัม"
      - text: "แก้ไข: จัดตารางสอนแล้วนำเฉพาะหนังสือที่ใช้ ฝากของไว้ที่โรงเรียน สะพายสองบ่า และวางของหนักชิดหลัง"
        why: "กระเป๋าที่หนักและสะพายข้างเดียวทำให้ไหล่และหลังรับน้ำหนักไม่เท่ากัน ปวดง่าย"
    answer: "หนักเกินไป 1.8 กิโลกรัม ควรนำเฉพาะของที่ใช้และสะพายสองบ่า"
  - { type: check, problem: health.body.musculoskeletal-care.p006, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: figure
    title: ยกของหนักอย่างไรไม่ให้เจ็บหลัง
    src: lifting.svg
    alt: "ภาพสองช่อง ช่องซ้ายถูกวิธี คนยืนใกล้กล่อง ย่อเข่า หลังตรง ยกกล่องชิดตัว ช่องขวาผิดวิธี คนยืนขาตรง ก้มหลังโค้งลงไปหยิบกล่องที่อยู่ห่างตัว"
    caption: "ย่อเข่า หลังตรง ของชิดตัว ใช้แรงขาแทนแรงหลัง"
  - type: worked-example
    title: แคลเซียมพอหรือยัง
    problem: "วันนี้ข้าวหอม (อายุ 11 ปี) ดื่มนมจืด 1 กล่อง กินปลาเล็กปลาน้อย 2 ช้อนกินข้าว และผักกาดเขียว 1 ทัพพี ได้แคลเซียมกี่มิลลิกรัม และขาดอีกเท่าไรจึงจะครบ 1,000 มิลลิกรัม (ข้อมูลกรมอนามัย: นมจืด 1 กล่อง 226 มก. ปลาเล็กปลาน้อย 2 ช้อนกินข้าว 226 มก. ผักกาดเขียว 1 ทัพพี 96 มก.)"
    steps:
      - text: "รวมแคลเซียม: 226 + 226 + 96 = 548 มิลลิกรัม"
      - text: "หาส่วนที่ขาด: 1,000 − 548 = 452 มิลลิกรัม"
      - text: "เติมได้ เช่น ดื่มนมอีก 2 กล่องตอนเช้าและก่อนนอน ได้อีก 452 มิลลิกรัมพอดี"
        why: "226 × 2 = 452 การดื่มนมวันละ 2–3 กล่องร่วมกับอาหารอื่นช่วยให้ได้แคลเซียมพอ"
    answer: "ได้ 548 มิลลิกรัม ขาดอีก 452 มิลลิกรัม"
  - { type: check, problem: health.body.musculoskeletal-care.p010 }
glossary:
  - { term: ข้อต่อ, definition: "ตำแหน่งที่กระดูกสองชิ้นมาต่อกัน เช่น ข้อศอก ข้อเข่า ข้อไหล่" }
  - { term: เอ็นยึดข้อ, definition: "เนื้อเยื่อเหนียวที่ยึดกระดูกกับกระดูกบริเวณข้อต่อ" }
  - { term: เอ็นกล้ามเนื้อ, definition: "เนื้อเยื่อเหนียวที่ยึดกล้ามเนื้อกับกระดูก" }
  - { term: ไขกระดูก, definition: "เนื้อเยื่อภายในกระดูกที่สร้างเม็ดเลือด" }
  - { term: โรคกระดูกพรุน, definition: "ภาวะที่กระดูกบางและเปราะ หักง่าย พบมากในผู้สูงอายุ" }
flashcards:
  - { front: "ผู้ใหญ่มีกระดูกราวกี่ชิ้น", back: "ราว 206 ชิ้น (ทารกแรกเกิดราว 270 ชิ้น แล้วบางชิ้นเชื่อมกัน)" }
  - { front: "ทำไมกล้ามเนื้อต้องทำงานเป็นคู่", back: "กล้ามเนื้อหดตัวดึงได้อย่างเดียว ดันไม่ได้ จึงต้องมีอีกมัดดึงกลับ" }
  - { front: "ยกของหนักให้ถูกวิธีทำอย่างไร", back: "ยืนใกล้ของ ย่อเข่า หลังตรง ยกของชิดตัว ไม่บิดเอว" }
  - { front: "เด็ก 9–18 ปีควรได้แคลเซียมวันละเท่าไร", back: "1,000 มิลลิกรัม (กรมอนามัย)" }
  - { front: "กระเป๋านักเรียนควรหนักไม่เกินเท่าไร", back: "ราวร้อยละ 10 ของน้ำหนักตัว เช่น หนัก 30 กก. แบกไม่เกิน 3 กก." }
