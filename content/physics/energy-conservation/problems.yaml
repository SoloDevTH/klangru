    answer: { value: 3.13, tolerance: 0.03, unit: m/s }
    hints:
      - 'หาว่าลูกตุ้มอยู่สูงกว่าจุดต่ำสุดเท่าใด เมื่อเชือกทำมุม $\theta$ กับแนวดิ่ง ลูกตุ้มอยู่ต่ำกว่าจุดแขวน $L\cos\theta$'
      - 'ความสูงเหนือจุดต่ำสุดคือ $h = L - L\cos\theta = L(1 - \cos\theta)$'
      - 'แทน $h$ ใน $v = \sqrt{2gh}$'
    misconceptions:
      - { match: 4.43, feedback: 'ดูเหมือนใช้ความยาวเชือกทั้งหมดเป็นความสูง ลูกตุ้มไม่ได้อยู่สูงเท่าจุดแขวน ความสูงคือ $L(1 - \cos\theta)$' }
      - { match: 2.21, feedback: 'ความสูงถูกแล้ว แต่ลืมเลข 2 ใน $v = \sqrt{2gh}$' }
    solution: '$h = L(1 - \cos 60^\circ) = (1.0\ \mathrm{m})(1 - 0.5) = 0.5\ \mathrm{m}$ จะได้ $v = \sqrt{2gh} = \sqrt{2(9.8)(0.5)}\ \mathrm{m/s} = \sqrt{9.8}\ \mathrm{m/s} \approx 3.13\ \mathrm{m/s}$'
