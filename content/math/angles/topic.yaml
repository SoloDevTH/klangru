id: math.geometry.angles
subject: math
title: { th: มุม, en: Angles }
summary: รู้จักชนิดของมุม มุมประกอบฉาก มุมประกอบสองมุมฉาก มุมตรงข้าม มุมที่เกิดจากเส้นขนานตัดกับเส้นตัด และผลบวกมุมภายในของรูปหลายเหลี่ยม
difficulty: 2
minutes: 30
prerequisites: [math.number.integers, math.geometry.angle-measure]
encompasses:
  - { id: math.number.integers, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: protractor-50.svg
    alt: "โพรแทรกเตอร์ครึ่งวงกลมวางทาบมุม AOB จุดศูนย์กลางอยู่ที่ O แขน OB ชี้ไปทางขวาตามเส้นฐานตรงขีด 0 ของสเกลใน แขน OA ชี้ขึ้นไปทางขวาผ่านขีด 50 ของสเกลใน ซึ่งตรงกับขีด 130 ของสเกลนอก มุม AOB จึงมีขนาด 50 องศา"
    caption: "แขน $OB$ ทับขีด 0 ของสเกลใน จึงอ่านสเกลใน ได้ $\\angle AOB = 50^\\circ$ (ถ้าอ่านสเกลนอกจะได้ 130 ซึ่งผิด เพราะมุมนี้เป็นมุมแหลม)"
  - { type: check, problem: math.ang.p014, prompt: "ลองอ่านโพรแทรกเตอร์เอง เริ่มจากดูว่าแขนข้างหนึ่งทับ 0 ของสเกลไหน" }
  - type: figure
    src: transversal-angles.svg
    alt: "เส้นตรง ℓ และ m แนวนอนขนานกัน มีเส้นตัดเอียงผ่านทั้งสองเส้น ที่จุดตัดบนมีมุม 1 ขวาบน 2 ซ้ายบน 3 ซ้ายล่าง 4 ขวาล่าง ที่จุดตัดล่างมีมุม 5 ขวาบน 6 ซ้ายบน 7 ซ้ายล่าง 8 ขวาล่าง มุม 1 3 5 7 เป็นมุมแหลม มุม 2 4 6 8 เป็นมุมป้าน"
    caption: "มุมแย้ง: 3 กับ 5 และ 4 กับ 6 (เท่ากัน) · มุมภายนอกกับมุมภายในข้างเดียวกัน: 1 กับ 5, 2 กับ 6, 3 กับ 7, 4 กับ 8 (เท่ากัน) · มุมภายในข้างเดียวกันของเส้นตัด: 3 กับ 6 และ 4 กับ 5 (รวมกันได้ $180^\\circ$)"
  - type: figure
    src: triangle-angle-sum.svg
    alt: "สามเหลี่ยม ABC มีฐาน AB อยู่ด้านล่าง ลากเส้นประผ่านจุดยอด C ขนานกับ AB ที่ C มีมุมสามมุมเรียงบนเส้นประ มุมซ้ายเท่ากับมุม a ที่ A มุมขวาเท่ากับมุม b ที่ B และมุมกลางคือมุม c ของสามเหลี่ยม จึงได้ a + c + b = 180 องศา"
    caption: "มุมที่ $C$ ทั้งสามรวมเป็นมุมตรง และมุมซ้ายขวาเป็นมุมแย้งกับมุม $A$ และ $B$ มุมภายในสามเหลี่ยมจึงรวมกันได้ $180^\\circ$"
  - type: worked-example
    title: หามุมที่ไม่รู้บนเส้นตรง
    problem: "มุมสามมุมเรียงติดกันบนเส้นตรงเส้นเดียว มีขนาด $48^\\circ$, $x^\\circ$ และ $2x^\\circ$ จงหา $x$"
    steps:
      - text: "มุมที่เรียงติดกันบนเส้นตรงรวมกันเป็นมุมตรง: $48 + x + 2x = 180$"
        why: "มุมบวกกันได้ และมุมตรงมีขนาด $180^\\circ$"
      - text: "รวมพจน์คล้าย: $48 + 3x = 180$"
      - text: "ลบ 48 ทั้งสองข้าง: $3x = 132$ แล้วหารด้วย 3: $x = 44$"
      - text: "ตรวจ: มุมทั้งสามคือ $48^\\circ$, $44^\\circ$ และ $88^\\circ$ รวม $180^\\circ$ ✓"
    answer: "$x = 44$ (มุมทั้งสามคือ $48^\\circ$, $44^\\circ$, $88^\\circ$)"
  - type: worked-example
    title: ใช้มุมภายนอกของสามเหลี่ยมสร้างสมการ
    problem: "สามเหลี่ยมมีมุมภายในสองมุมขนาด $50^\\circ$ และ $(x + 25)^\\circ$ มุมภายนอกที่อยู่ติดกับมุมภายในมุมที่สามมีขนาด $(3x + 5)^\\circ$ จงหา $x$ และขนาดของมุมภายนอก"
    steps:
      - text: "มุมภายนอกเท่ากับผลบวกของมุมภายในสองมุมที่ไม่ได้อยู่ติดกับมัน: $3x + 5 = 50 + (x + 25)$"
        why: "มุมภายนอก + มุมภายในที่ติดกัน $= 180^\\circ$ และมุมภายในทั้งสาม $= 180^\\circ$ เมื่อหักมุมภายในที่ติดกันออกเหมือนกัน ส่วนที่เหลือจึงเท่ากัน"
      - text: "จัดรูป: $3x + 5 = x + 75$"
      - text: "ย้ายข้าง: $2x = 70$ ได้ $x = 35$"
      - text: "มุมภายนอก $= 3(35) + 5 = 110^\\circ$"
      - text: "ตรวจ: มุมภายในที่สาม $= 180 - 110 = 70^\\circ$ และ $50 + 60 + 70 = 180$ ✓"
        why: "$x + 25 = 60$ เมื่อ $x = 35$"
    answer: "$x = 35$ มุมภายนอกมีขนาด $110^\\circ$"
  - { type: check, problem: math.ang.p017, prompt: "ใช้สมบัติมุมภายนอกที่เพิ่งเห็น" }
  - type: interactive
    title: เส้นขนานสองเส้นกับเส้นตัด
    caption: "เส้นแนวนอนสองเส้นขนานกัน เลื่อนแถบ m เพื่อเปลี่ยนความเอียงของเส้นตัด สังเกตว่ามุมที่เส้นตัดทำกับเส้นขนานทั้งสองเส้นเปลี่ยนไปพร้อมกันและเท่ากันเสมอ (มุมภายนอกและมุมภายในข้างเดียวกันของเส้นตัด หรือมุมแย้ง)"
    widget:
      kind: function-plot
      functions: ["2", "-2", "m x"]
      sliders:
        - { name: m, min: 0.25, max: 4, step: 0.25, value: 1, label: ความชันของเส้นตัด }
      x: [-5, 5]
      y: [-5, 5]
glossary:
  - { term: มุมแหลม, definition: "มุมที่มีขนาดมากกว่า $0^\\circ$ แต่น้อยกว่า $90^\\circ$" }
  - { term: มุมป้าน, definition: "มุมที่มีขนาดมากกว่า $90^\\circ$ แต่น้อยกว่า $180^\\circ$" }
  - { term: มุมประกอบฉาก, definition: "มุมสองมุมที่มีขนาดรวมกันได้ $90^\\circ$" }
  - { term: มุมประกอบสองมุมฉาก, definition: "มุมสองมุมที่มีขนาดรวมกันได้ $180^\\circ$" }
  - { term: มุมตรงข้าม, definition: "มุมคู่ที่อยู่ตรงข้ามกันเมื่อเส้นตรงสองเส้นตัดกัน มีขนาดเท่ากันเสมอ" }
  - { term: มุมแย้ง, definition: "มุมคู่ที่อยู่คนละข้างของเส้นตัดและอยู่ระหว่างเส้นขนาน ถ้าเส้นทั้งสองขนานกัน มุมแย้งจะเท่ากัน" }
flashcards:
  - { front: "มุมประกอบฉากของ $x^\\circ$ และมุมประกอบสองมุมฉากของ $x^\\circ$", back: "มุมประกอบฉาก $90^\\circ - x^\\circ$, มุมประกอบสองมุมฉาก $180^\\circ - x^\\circ$" }
  - { front: "เส้นตรงสองเส้นตัดกัน มุมตรงข้ามมีสมบัติอย่างไร", back: "มุมตรงข้ามมีขนาดเท่ากัน ส่วนมุมที่อยู่ติดกันรวมกันได้ $180^\\circ$" }
  - { front: "เส้นขนานสองเส้นถูกเส้นตัด มุมใดเท่ากัน มุมใดรวมกันได้ $180^\\circ$", back: "มุมแย้งเท่ากัน มุมภายนอกกับมุมภายในข้างเดียวกันของเส้นตัดเท่ากัน มุมภายในที่อยู่ข้างเดียวกันของเส้นตัดรวมกันได้ $180^\\circ$" }
  - { front: "ผลบวกมุมภายในของรูป $n$ เหลี่ยม", back: "$(n - 2) \\times 180^\\circ$ ส่วนมุมภายนอกรวมกันได้ $360^\\circ$ เสมอ" }
