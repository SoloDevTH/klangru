problems:
- id: technology.design.design-process.p001
  topics:
  - technology.design.design-process
  difficulty: 1
  type: order
  stem: เรียงขั้นตอนของกระบวนการออกแบบเชิงวิศวกรรม
  items:
  - ระบุปัญหา
  - รวบรวมข้อมูลและแนวคิดที่เกี่ยวข้อง
  - ออกแบบวิธีการแก้ปัญหา
  - วางแผนและดำเนินการแก้ปัญหา
  - ทดสอบ ประเมินผล และปรับปรุงแก้ไข
  - นำเสนอวิธีการแก้ปัญหาและผล
  hints:
  - ต้องรู้ว่าปัญหาคืออะไรก่อน
  - ทดสอบได้ก็ต่อเมื่อสร้างต้นแบบแล้ว
  solution: ระบุปัญหา → รวบรวมข้อมูล → ออกแบบ → วางแผนและสร้าง → ทดสอบและปรับปรุง → นำเสนอ และวนกลับขั้นก่อนหน้าได้เมื่อพบข้อบกพร่อง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process.p002
  topics:
  - technology.design.design-process
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็น **เกณฑ์ความสำเร็จ** ของกล่องเก็บน้ำแข็ง
  choices:
  - id: a
    text: หลัง 4 ชั่วโมง น้ำแข็งเหลืออย่างน้อยร้อยละ 70
    correct: true
  - id: b
    text: งบประมาณไม่เกิน 150 บาท
    feedback: นี่คือข้อจำกัดด้านงบ ไม่ใช่สิ่งที่กล่องต้องทำได้
  - id: c
    text: ต้องทำเสร็จใน 2 สัปดาห์
    feedback: นี่คือข้อจำกัดด้านเวลา
  - id: d
    text: ใช้เฉพาะวัสดุที่หาได้ในชุมชน
    feedback: นี่คือข้อจำกัดด้านวัสดุ
  hints:
  - เกณฑ์ความสำเร็จบอกว่าชิ้นงานต้องทำอะไรได้
  - ข้อจำกัดคือขอบเขตเรื่องงบ เวลา วัสดุ
  solution: เกณฑ์ความสำเร็จคือสิ่งที่วิธีแก้ปัญหาต้องทำได้และวัดได้ ส่วนงบ เวลา และวัสดุเป็นข้อจำกัดที่ต้องทำงานให้อยู่ภายใน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process.p003
  topics:
  - technology.design.design-process
  difficulty: 2
  type: match
  stem: จับคู่กิจกรรมกับขั้นของกระบวนการออกแบบเชิงวิศวกรรม
  pairs:
  - left: สัมภาษณ์ป้าน้อยว่าเปิดกล่องน้ำแข็งบ่อยแค่ไหน
    right: รวบรวมข้อมูล
  - left: ร่างภาพกล่องสามแบบแล้วให้คะแนนในเมทริกซ์
    right: ออกแบบวิธีการแก้ปัญหา
  - left: ทำรายการวัสดุ ราคา และแบ่งหน้าที่
    right: วางแผนและดำเนินการ
  - left: ชั่งน้ำแข็งที่เหลือหลัง 4 ชั่วโมง
    right: ทดสอบและประเมินผล
  - left: ทำโปสเตอร์และสาธิตให้แม่ค้าในตลาดดู
    right: นำเสนอ
  hints:
  - ขั้นรวบรวมข้อมูลเกิดก่อนการออกแบบ
  - การชั่งน้ำแข็งคือการเก็บผลทดสอบ
  solution: แต่ละขั้นมีงานชัดเจน การรู้ว่ากำลังอยู่ขั้นใดช่วยให้ไม่ข้ามขั้นสำคัญ เช่น ข้ามการรวบรวมข้อมูลไปสร้างเลย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process.p004
  topics:
  - technology.design.design-process
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็นข้อจำกัด (constraint) ของงานออกแบบที่บังแดดให้ที่จอดจักรยานของโรงเรียน (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: ใช้งบไม่เกิน 2,000 บาท
    correct: true
    feedback: ถูก เป็นข้อจำกัดด้านงบ
  - id: b
    text: ต้องไม่กีดขวางทางเดิน
    correct: true
    feedback: ถูก เป็นข้อจำกัดด้านพื้นที่และความปลอดภัย
  - id: c
    text: ใช้วัสดุที่ทนแดดและฝน
    correct: true
    feedback: ถูก เป็นข้อจำกัดด้านวัสดุ
  - id: d
    text: ที่นั่งจักรยานใต้ที่บังแดดร้อนน้อยลงอย่างน้อย 5 องศาเซลเซียส
    feedback: นี่คือเกณฑ์ความสำเร็จ บอกว่าที่บังแดดต้องทำอะไรได้
  hints:
  - ข้อจำกัดคือขอบเขตที่ต้องอยู่ภายใน
  - ข้อที่บอกผลที่ต้องการคือเกณฑ์ความสำเร็จ
  solution: งบ พื้นที่ ความปลอดภัย และวัสดุเป็นข้อจำกัด ส่วนอุณหภูมิที่ลดลงเป็นเกณฑ์ความสำเร็จที่ใช้วัดผล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process.p005
  topics:
  - technology.design.design-process
  difficulty: 2
  type: mcq
  stem: ข้อใดเขียน **กรอบของปัญหา** ได้ชัดเจนที่สุด
  choices:
  - id: a
    text: ป้าน้อย (ใคร) ขายน้ำแข็งใสที่ตลาดนัดกลางแจ้ง (ที่ไหน) ช่วง 8–12 นาฬิกา (เมื่อไร) น้ำแข็งละลายเกือบครึ่ง (อะไร) ทำให้ขาดทุน (ทำไม) ต้องการภาชนะเก็บน้ำแข็งราคาไม่เกิน 150 บาท (อย่างไร)
    correct: true
  - id: b
    text: น้ำแข็งละลาย
    feedback: สั้นเกินไป ไม่บอกผู้ใช้ สถานที่ เวลา หรือเงื่อนไข
  - id: c
    text: อยากได้ตู้เย็นราคาแพงที่ดีที่สุด
    feedback: ระบุวิธีแก้ไว้ก่อนแล้ว และขัดกับงบของผู้ใช้
  - id: d
    text: ทำอย่างไรให้โลกเย็นลง
    feedback: กว้างเกินกว่าจะแก้ได้ด้วยงานชิ้นเดียว
  hints:
  - ใช้คำถาม 5W1H
  - กรอบปัญหาไม่ควรระบุวิธีแก้ไว้ล่วงหน้า
  solution: กรอบปัญหาที่ดีตอบ 5W1H ครบ บอกผู้ใช้ สถานการณ์ สาเหตุ และเงื่อนไข ทำให้ออกแบบและวัดผลได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process.p006
  topics:
  - technology.design.design-process
  difficulty: 2
  type: mcq
  stem: นักออกแบบต้องการผ้าที่น้ำไม่ซึม จึงศึกษาว่าทำไมหยดน้ำกลิ้งหลุดจากใบบัวได้ นี่คือการหาแนวคิดแบบใด
  choices:
  - id: a
    text: เลียนแบบธรรมชาติ ใช้ลักษณะของสิ่งมีชีวิตเป็นแนวคิดในการแก้ปัญหา
    correct: true
  - id: b
    text: ลองผิดลองถูกโดยไม่มีข้อมูล
    feedback: การศึกษาใบบัวคือการรวบรวมข้อมูลอย่างมีเป้าหมาย
  - id: c
    text: นำเสนอผลงาน
    feedback: ยังไม่ได้สร้างต้นแบบ จึงยังไม่ถึงขั้นนำเสนอ
  - id: d
    text: ทดสอบต้นแบบ
    feedback: ยังเป็นขั้นหาแนวคิด ยังไม่มีต้นแบบ
  hints:
  - ใบบัวเป็นสิ่งมีชีวิต
  - ธรรมชาติแก้ปัญหาคล้ายกันมาก่อนแล้ว
  solution: การเลียนแบบลักษณะของพืชหรือสัตว์ที่ช่วยให้อยู่รอด เป็นแหล่งแนวคิดในขั้นรวบรวมข้อมูล เช่น ใบบัวกับผ้ากันน้ำ ขนนกกับเสื้อกันหนาว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process.p007
  topics:
  - technology.design.design-process
  difficulty: 3
  type: numeric
  stem: จากเมทริกซ์ตัดสินใจ แบบ A กล่องโฟม ได้คะแนนรวม (น้ำหนัก × คะแนน) เท่าใด
  answer:
    value: 28
    unit: คะแนน
  misconceptions:
  - match: 14
    feedback: รวมคะแนนโดยไม่คูณน้ำหนักของเกณฑ์
  - match: 8
    feedback: รวมน้ำหนักของเกณฑ์ ไม่ได้คูณกับคะแนน
  hints:
  - คูณน้ำหนักของแต่ละเกณฑ์กับคะแนนของแบบ A
  - 3 × 5 + 2 × 2 + 1 × 5 + 2 × 2
  solution: $3(5) + 2(2) + 1(5) + 2(2) = 15 + 4 + 5 + 4 = 28$ คะแนน
  figure:
    src: matrix.svg
    alt: 'ตารางเมทริกซ์ตัดสินใจกล่องเก็บน้ำแข็งสามแบบ คะแนน 1–5 เกณฑ์เก็บความเย็น น้ำหนัก 3: A 5, B 4, C 2 เกณฑ์ราคาถูก น้ำหนัก 2: A 2, B 4, C 5 เกณฑ์ยกง่าย น้ำหนัก 1: A 5, B 2, C 5 เกณฑ์ใช้วัสดุเหลือใช้ น้ำหนัก 2: A 2, B 4, C 3 (A กล่องโฟม B ลังใส่แกลบ C ถังห่อผ้าเปียก)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process.p008
  topics:
  - technology.design.design-process
  difficulty: 3
  type: mcq
  stem: จากเมทริกซ์ตัดสินใจ ถ้าคิดคะแนนรวมแบบให้น้ำหนัก ควรเลือกแบบใด
  choices:
  - id: a
    text: B ลังใส่แกลบ (30 คะแนน)
    correct: true
  - id: b
    text: A กล่องโฟม (28 คะแนน)
    feedback: A ได้คะแนนเก็บความเย็นสูงสุด แต่ราคาและการใช้วัสดุเหลือใช้ต่ำ คะแนนรวมจึงน้อยกว่า B
  - id: c
    text: C ถังห่อผ้าเปียก (15 คะแนน)
    feedback: 15 คือคะแนนรวมแบบไม่คิดน้ำหนัก ถ้าคิดน้ำหนักจะได้ 27 ซึ่งต่ำที่สุด
  - id: d
    text: เลือกไม่ได้ เพราะทุกแบบคะแนนเท่ากัน
    feedback: 'คะแนนแบบให้น้ำหนักต่างกัน: A 28, B 30, C 27'
  hints:
  - คำนวณ น้ำหนัก × คะแนน ของทุกแบบ
  - 'B: 3(4) + 2(4) + 1(2) + 2(4)'
  solution: A $= 28$ B $= 3(4)+2(4)+1(2)+2(4) = 30$ C $= 3(2)+2(5)+1(5)+2(3) = 27$ จึงเลือก B ถ้ารวมคะแนนโดยไม่คิดน้ำหนักจะได้ C (15) ซึ่งเก็บความเย็นได้แย่ที่สุด
  figure:
    src: matrix.svg
    alt: 'ตารางเมทริกซ์ตัดสินใจกล่องเก็บน้ำแข็งสามแบบ คะแนน 1–5 เกณฑ์เก็บความเย็น น้ำหนัก 3: A 5, B 4, C 2 เกณฑ์ราคาถูก น้ำหนัก 2: A 2, B 4, C 5 เกณฑ์ยกง่าย น้ำหนัก 1: A 5, B 2, C 5 เกณฑ์ใช้วัสดุเหลือใช้ น้ำหนัก 2: A 2, B 4, C 3 (A กล่องโฟม B ลังใส่แกลบ C ถังห่อผ้าเปียก)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process.p009
  topics:
  - technology.design.design-process
  difficulty: 3
  type: numeric
  stem: ต้นแบบรุ่นแรกใส่น้ำแข็ง 500 g หลัง 4 ชั่วโมงเหลือ 365 g น้ำแข็งเหลือกี่เปอร์เซ็นต์ และผ่านเกณฑ์ร้อยละ 70 หรือไม่ (ตอบเฉพาะร้อยละ)
  answer:
    value: 73
    unit: '%'
  misconceptions:
  - match: 27
    feedback: นี่คือร้อยละที่ละลายไป ไม่ใช่ที่เหลือ
  - match: 135
    feedback: นำ 500 − 365 คือมวลที่ละลายเป็นกรัม ยังไม่ได้คิดเป็นร้อยละของที่เหลือ
  hints:
  - ร้อยละที่เหลือ = มวลที่เหลือ ÷ มวลเริ่มต้น × 100
  - 365 ÷ 500 × 100
  solution: $\frac{365}{500} \times 100 = 73\%$ มากกว่า 70% จึงผ่านเกณฑ์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process.p010
  topics:
  - technology.design.design-process
  difficulty: 3
  type: mcq
  stem: ทดสอบกล่องเก็บน้ำแข็งสามแบบ ข้อใดทำให้การทดสอบ **ยุติธรรม**
  choices:
  - id: a
    text: ใส่น้ำแข็งมวลเท่ากัน วางที่เดียวกัน เวลาเดียวกัน และเปิดฝาเท่ากัน
    correct: true
  - id: b
    text: ให้แต่ละกลุ่มทดสอบกล่องของตัวเองที่บ้านใครบ้านมัน
    feedback: อุณหภูมิและแสงแดดของแต่ละบ้านต่างกัน
  - id: c
    text: ใส่น้ำแข็งในกล่องที่ดีที่สุดมากกว่า
    feedback: มวลน้ำแข็งต่างกันทำให้เปรียบเทียบไม่ได้
  - id: d
    text: ทดสอบกล่อง A ตอนเช้า กล่อง B ตอนบ่าย
    feedback: อากาศตอนบ่ายร้อนกว่า ไม่ยุติธรรม
  hints:
  - เปลี่ยนเฉพาะแบบของกล่อง
  - สิ่งอื่นต้องควบคุมให้เหมือนกัน
  solution: การทดสอบต้นแบบใช้หลักเดียวกับการทดลองที่ยุติธรรม เปลี่ยนเพียงแบบของกล่อง ควบคุมมวลน้ำแข็ง สถานที่ เวลา และการเปิดฝาให้เหมือนกัน แล้วทำซ้ำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process.p011
  topics:
  - technology.design.design-process
  difficulty: 3
  type: mcq
  stem: จากผลทดสอบในแผนภูมิ ข้อใดสรุปจุดเด่นและจุดด้อยได้ถูกต้อง
  choices:
  - id: a
    text: A เก็บความเย็นได้ดีที่สุด B ผ่านเกณฑ์แบบเฉียดฉิว ส่วน C ไม่ผ่านเกณฑ์ทั้งสองครั้ง
    correct: true
  - id: b
    text: C ดีที่สุดเพราะผลสองครั้งต่างกันมากที่สุด
    feedback: C เหลือน้ำแข็งน้อยที่สุด และผลที่ต่างกันมากไม่ใช่จุดเด่น
  - id: c
    text: B ไม่ผ่านเกณฑ์เพราะครั้งที่สองได้ 350 g พอดี
    feedback: เกณฑ์คืออย่างน้อย 70% (350 g) ค่า 350 g จึงยังผ่าน แต่เฉียดฉิว
  - id: d
    text: ทุกแบบเหมือนกัน เพราะเริ่มที่ 500 g เท่ากัน
    feedback: มวลเริ่มเท่ากันเพื่อให้ยุติธรรม แต่ผลที่เหลือต่างกันชัดเจน
  hints:
  - เทียบแต่ละแท่งกับเส้นเกณฑ์ 350 g
  - '"อย่างน้อย" รวมค่าที่เท่ากับเกณฑ์ด้วย'
  solution: A เฉลี่ย 375 g (75%) B เฉลี่ย 355 g (71%) C เฉลี่ย 250 g (50%) A กับ B ผ่าน C ไม่ผ่าน B ผ่านแบบเฉียดฉิว จึงควรปรับปรุงก่อนใช้จริง
  figure:
    src: ice-test.svg
    alt: แผนภูมิแท่งมวลน้ำแข็งที่เหลือหลัง 4 ชั่วโมง เริ่ม 500 g ทดสอบ 2 ครั้ง A กล่องโฟม 380 และ 370 g B ลังใส่แกลบ 360 และ 350 g C ถังห่อผ้าเปียก 240 และ 260 g เส้นประสีแดงที่ 350 g คือเกณฑ์ร้อยละ 70
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process.p012
  topics:
  - technology.design.design-process
  difficulty: 4
  type: mcq
  stem: แบบ A เก็บความเย็นดีแต่ใช้โฟมใหม่และราคาสูง แบบ B ราคาถูกใช้แกลบเหลือใช้แต่ฝาปิดไม่สนิท แนวทางปรับปรุงใดเหมาะสมที่สุด
  choices:
  - id: a
    text: ใช้ลังใส่แกลบของแบบ B และทำฝาให้ปิดสนิทพร้อมบุฟอยล์แบบ A แล้วทดสอบซ้ำ
    correct: true
  - id: b
    text: เลือก A ทันทีเพราะเก็บความเย็นดีที่สุด
    feedback: ไม่ได้ใช้ข้อมูลเรื่องราคาและวัสดุเหลือใช้ และพลาดโอกาสรวมจุดเด่น
  - id: c
    text: ทิ้งทั้งสองแบบแล้วเริ่มใหม่
    feedback: ข้อมูลจากการทดสอบมีค่า ควรนำจุดเด่นมาใช้
  - id: d
    text: ทำแบบ B ให้ใหญ่ขึ้นสองเท่าโดยไม่แก้ฝา
    feedback: ไม่ได้แก้ข้อบกพร่องที่พบ และเพิ่มน้ำหนักจนยกยาก
  hints:
  - ดูจุดเด่นของแต่ละแบบจากข้อมูล
  - แก้จุดที่ล้มเหลวแล้วทดสอบซ้ำ
  solution: การวิเคราะห์ผลทดสอบหลายแบบช่วยให้รวมจุดเด่นเป็นแบบใหม่ที่ตรงเกณฑ์ดีขึ้น แล้วต้องทดสอบซ้ำเพื่อยืนยัน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process.p013
  topics:
  - technology.design.design-process
  difficulty: 4
  type: mcq
  stem: ทดสอบกล่องกันกระแทกไข่โดยปล่อยจากชั้น 2 ไข่แตกทุกครั้ง และพบว่ากล่องกระแทกพื้นด้วยมุมแหลมด้านเดียวกันเสมอ ข้อใดเป็นการปรับปรุงที่ตรงกับจุดที่ล้มเหลว
  choices:
  - id: a
    text: เพิ่มวัสดุที่ยุบตัวได้ที่มุมนั้นหรือทำให้กล่องตกด้านกว้างลงพื้น เพื่อยืดเวลาการชนและกระจายแรง
    correct: true
  - id: b
    text: ใช้ไข่ที่เปลือกหนากว่า
    feedback: เปลี่ยนสิ่งที่ทดสอบ ไม่ใช่การปรับปรุงการออกแบบ และทำให้การทดสอบไม่ยุติธรรม
  - id: c
    text: ทาสีกล่องให้สวยขึ้น
    feedback: ไม่เกี่ยวกับจุดที่ล้มเหลว
  - id: d
    text: ปล่อยจากที่ต่ำลงตอนทดสอบ
    feedback: เปลี่ยนเงื่อนไขการทดสอบเพื่อให้ผ่าน แต่ไม่ได้แก้ปัญหาจริง
  hints:
  - จุดที่ล้มเหลวอยู่ที่ไหน
  - แรงที่ไข่ได้รับลดลงเมื่อเวลาการชนยาวขึ้น
  solution: การระบุจุดที่ล้มเหลว (มุมที่กระแทก) ช่วยให้ปรับปรุงตรงจุด วัสดุที่ยุบตัวยืดเวลาการชน ทำให้แรงเฉลี่ยลดลง (ดู [โมเมนตัมและการดล](/topic/physics.momentum.momentum-impulse/))
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process.p014
  topics:
  - technology.design.design-process
  difficulty: 4
  type: numeric
  stem: 'รายการวัสดุของกล่องแบบใหม่: ลังกระดาษ 35 บาท แกลบ 28 บาท ฟอยล์ 15 บาท เทปกาว 12 บาท ผ้าคลุม 20 บาท รวมเป็นเงินเท่าใด และเหลืองบจาก 150 บาทกี่บาท (ตอบจำนวนที่เหลือ)'
  answer:
    value: 40
    unit: บาท
  misconceptions:
  - match: 110
    feedback: นี่คือราคารวม โจทย์ถามงบที่เหลือ
  - match: 260
    feedback: บวกงบกับราคารวม ต้องลบ
  hints:
  - รวมราคาวัสดุทุกรายการก่อน
  - นำ 150 ลบด้วยผลรวม
  solution: รวม $35 + 28 + 15 + 12 + 20 = 110$ บาท เหลือ $150 - 110 = 40$ บาท จึงอยู่ในข้อจำกัดด้านงบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process.p015
  topics:
  - technology.design.design-process
  difficulty: 4
  type: mcq
  stem: กลุ่มของมิวจะนำเสนอกล่องเก็บน้ำแข็งให้แม่ค้าในตลาดนัด ข้อใดเหมาะสมที่สุด
  choices:
  - id: a
    text: สาธิตกล่องจริง บอกราคาวัสดุและวิธีทำทีละขั้น และแสดงผลทดสอบที่เข้าใจง่ายว่าน้ำแข็งเหลือมากกว่าเดิมเท่าไร
    correct: true
  - id: b
    text: อ่านรายงานเต็มทุกหน้าพร้อมสูตรคำนวณ
    feedback: ยาวและใช้ศัพท์มากเกินสำหรับผู้ฟังกลุ่มนี้
  - id: c
    text: บอกแค่ว่ากล่องดีมาก ไม่ต้องแสดงข้อมูล
    feedback: ขาดหลักฐาน ผู้ฟังไม่มั่นใจ
  - id: d
    text: นำเสนอเฉพาะแบบที่ไม่ผ่านเกณฑ์
    feedback: ควรนำเสนอวิธีแก้ปัญหาที่ได้ผลและบอกข้อบกพร่องที่แก้แล้ว
  hints:
  - คิดถึงสิ่งที่ผู้ฟังอยากรู้
  - การนำเสนอที่ดีมีหลักฐานและเข้าใจง่าย
  solution: การนำเสนอต้องเหมาะกับผู้ฟัง แม่ค้าอยากรู้ว่าทำได้จริง ราคาเท่าไร และดีขึ้นแค่ไหน จึงควรสาธิตและแสดงข้อมูลที่เข้าใจง่าย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process.p016
  topics:
  - technology.design.design-process
  difficulty: 5
  type: mcq
  stem: ทีมออกแบบกังหันลมจิ๋วให้แอลอีดีติด ทดลองจำนวนใบพัด 2, 3, 4, 6 ใบ ได้แรงดันไฟฟ้า 0.8, 1.4, 1.6, 1.5 V ตามลำดับ (ลมจากพัดลมตัวเดียวกันระยะเท่ากัน) ขั้นต่อไปที่เหมาะสมที่สุดคืออะไร
  choices:
  - id: a
    text: เลือกช่วง 3–4 ใบ แล้วทดสอบตัวแปรอื่นทีละตัว เช่น มุมใบพัด และทดสอบซ้ำเพื่อหาแบบที่ดีที่สุด
    correct: true
  - id: b
    text: เพิ่มเป็น 12 ใบ เพราะยิ่งมากยิ่งดี
    feedback: ข้อมูลแสดงว่า 6 ใบได้น้อยกว่า 4 ใบ แนวโน้มไม่ได้เพิ่มตลอด
  - id: c
    text: เปลี่ยนจำนวนใบและมุมใบพร้อมกันเพื่อประหยัดเวลา
    feedback: เปลี่ยนสองตัวแปรพร้อมกันทำให้ไม่รู้ว่าผลมาจากอะไร
  - id: d
    text: หยุดทดสอบ เพราะ 1.6 V ยังไม่พอให้แอลอีดีติด
    feedback: ข้อมูลยังใช้ปรับปรุงต่อได้ เช่น มุมใบพัดหรือเฟืองทด
  hints:
  - 'ดูแนวโน้มของข้อมูล: เพิ่มแล้วลด'
  - การทำซ้ำเพื่อปรับปรุงเปลี่ยนทีละตัวแปร
  solution: ข้อมูลชี้ว่าจุดที่ดีที่สุดอยู่ราว 3–4 ใบ ขั้นต่อไปคือการทำซ้ำเพื่อปรับปรุง (iteration) ทดสอบตัวแปรอื่นทีละตัวอย่างยุติธรรม จนได้แบบที่ดีที่สุดภายใต้ข้อจำกัด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: technology.design.design-process.p017
  topics:
  - technology.design.design-process
  difficulty: 5
  type: mcq
  stem: ชุมชนริมคลองอยากได้ถังกรองน้ำฝนไว้ใช้ล้างจาน ข้อใดเขียนเกณฑ์และข้อจำกัดได้ครบและแม่นยำที่สุด โดยคำนึงถึงหลักวิทยาศาสตร์และผลต่อคนและสิ่งแวดล้อม
  choices:
  - id: a
    text: น้ำที่กรองแล้วใสจนมองเห็นตัวหนังสือผ่านขวดได้ กรองได้อย่างน้อย 20 ลิตรต่อชั่วโมง ใช้วัสดุในชุมชน (ทราย ถ่าน กรวด) งบไม่เกิน 500 บาท ล้างไส้กรองได้ และมีป้ายบอกว่าไม่ใช่น้ำดื่ม
    correct: true
  - id: b
    text: ถังกรองที่ดีที่สุดในโลก
    feedback: วัดไม่ได้และไม่มีข้อจำกัด
  - id: c
    text: น้ำต้องสะอาดดื่มได้ทันที ใช้เครื่องกรองราคาแพงจากต่างประเทศ
    feedback: เกินงบชุมชน และการกรองด้วยทรายถ่านทำให้ใสแต่ไม่ได้ฆ่าเชื้อ จึงไม่ควรอ้างว่าดื่มได้
  - id: d
    text: ทำให้เสร็จเร็วที่สุด ใช้วัสดุอะไรก็ได้
    feedback: ไม่มีเกณฑ์วัดคุณภาพน้ำ และวัสดุบางชนิดอาจปนเปื้อนสารอันตราย
  hints:
  - เกณฑ์ต้องวัดได้ ข้อจำกัดต้องชัด
  - คิดถึงความปลอดภัยของผู้ใช้ด้วย
  solution: กรอบที่ดีระบุเกณฑ์ที่วัดได้ (ความใส อัตราการกรอง) ข้อจำกัด (วัสดุ งบ การดูแล) และผลต่อคน (บอกชัดว่าไม่ใช่น้ำดื่ม เพราะการกรองไม่ฆ่าเชื้อโรค)
  license: CC-BY-SA-4.0
  ai_assisted: true
