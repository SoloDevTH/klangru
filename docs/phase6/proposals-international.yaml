# ข้อเสนอหัวข้อจากหลักสูตรต่างประเทศ (เฟส 6): ให้กราฟความรู้รวมหลักสูตรไทยกับหลักสูตรต่างประเทศ ไม่ได้ตามหลักสูตรฉบับเดียว
#
# ที่มา: ตัวชี้วัดของหลักสูตรต่างประเทศที่ทั้งคลัง (curriculum/mappings) และแผนไฟล์อื่นยังไม่แตะ ณ 2026-10-24
#   au-ac9-mathematics, au-ac9-science, au-ac9-digital-technologies   Australian Curriculum V9.0 (ACARA, CC BY 4.0)
#   uk-nc-mathematics, uk-nc-science, uk-nc-computing                 England National Curriculum (DfE, OGL v3.0) รหัส UKNC-* เป็นรหัสที่เราตั้ง
#   us-ccss-math, us-ngss                                             Common Core และ NGSS
#   csta-k12-cs                                                       CSTA K–12 (รวมระดับ 3B)
# รายละเอียดและเหตุผลของแต่ละหัวข้อดู docs/research/international-curricula.md
#
# หลักการ
# - ตัวชี้วัดที่หัวข้อในแผนไฟล์อื่นสอนอยู่แล้วใช้ extend: ผูกเข้าหัวข้อนั้น ไม่สร้างหัวข้อซ้ำ (หัวข้อจากหลักสูตรไทยหลายหัวข้อจึงรับตัวชี้วัดต่างประเทศเพิ่ม)
# - สร้างหัวข้อใหม่ใน topics: เฉพาะเนื้อหาที่ไม่มีทั้งในคลังและในแผน เรียงตาม prerequisite
# - extend: ผูกได้เฉพาะหัวข้อที่เสนอในแผน ไม่ผูกกับหัวข้อที่เขียนแล้วในคลัง (ตัวตรวจไม่รับ) ตัวชี้วัดที่หัวข้อในคลังสอนแล้วต้องเพิ่มใน curriculum/mappings
#   ตัวชี้วัดต่างประเทศระดับประถมที่หัวข้อในคลังสอนเพียงบางส่วน (เช่น ทศนิยมกับเศษส่วน) จึงผูกกับหัวข้อในแผนที่ใกล้ที่สุด (math.number.rationals, math.number.fraction-compare)
# - วิชา science ใหม่ใช้กับทักษะกระบวนการทางวิทยาศาสตร์ที่ใช้ร่วมกันทุกสาขา (การออกแบบการทดลอง การวิเคราะห์ข้อมูล การประเมินหลักฐาน ธรรมชาติของวิทยาศาสตร์)
#   หัวข้อเหล่านี้สอนการวางแผนและการคิด ส่วนการลงมือทดลองจริงอยู่นอกแอป
# - Working mathematically (KS3–KS4) ผูกกับ math.reasoning.problem-solving, math.modelling.mathematical-modelling และหัวข้อที่ใกล้ที่สุด
# - NGSS และ AC9 เขียนเป็นการปฏิบัติ (plan and conduct, develop a model) ผูกกับหัวข้อที่สอนแนวคิดหลัก (DCI) ของตัวชี้วัดนั้น
#   ตัวชี้วัดที่ให้ออกแบบและสร้างอุปกรณ์ผูกกับ technology.design.design-process
#
# ไม่ผูก (ต้องลงมือปฏิบัติจริงในห้องปฏิบัติการหรือภาคสนาม ทำในแอปไม่ได้)
#   au-ac9-science: AC9SFI02 AC9S1I03 AC9S2I03 AC9S3I03 AC9S4I03 AC9S5I03 AC9S6I03 AC9S7I03 AC9S8I03
#     (engage in investigations safely และ make/record observations, use equipment to measure)
#   uk-nc-science: UKNC-SC-Y1-2-WS-02 Y1-2-WS-03 Y3-4-WS-03 Y5-6-WS-02 KS3-WS-ESI-04 KS3-WS-ESI-05 KS4-WS-ESS-04 KS4-WS-ESS-06
#     (observing with equipment, performing tests, taking measurements, using apparatus, carrying out experiments)
#
