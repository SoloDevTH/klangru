      - { id: d, text: "$14\\ \\mathrm{N}$", feedback: "เป็นไปได้ เมื่อสองแรงมีทิศเดียวกัน $6 + 8 = 14\\ \\mathrm{N}$ ซึ่งเป็นค่ามากที่สุด" }
