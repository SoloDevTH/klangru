  - id: computer.algorithms.data-structures.p015
    topics: [computer.algorithms.data-structures]
    difficulty: 5
    type: order
    stem: "ใช้ dfs แบบในบทเรียน (ใช้สแตก และใส่เพื่อนบ้านแบบกลับด้านเพื่อให้ไปเพื่อนบ้านตามตัวอักษรก่อน) กับกราฟในภาพ เริ่มที่ A เรียงจุดตามลำดับที่ถูกเพิ่มเข้า seen"
    figure:
      src: graph-question.svg
      alt: "กราฟไม่มีทิศทาง 7 จุด A ถึง G เส้นเชื่อม A–B, A–D, B–C, B–E, C–D, C–F, D–G, E–F, F–G"
    items: ["A", "B", "C", "D", "G", "F", "E"]
    hints:
      - "จาก A ไป B ก่อน (ตามตัวอักษร) แล้วจาก B ไปเพื่อนบ้านตัวแรกที่ยังไม่เคยไป"
      - "เดินลึกไปจนไม่มีเพื่อนบ้านใหม่ แล้วจึงย้อนกลับ"
    solution: "A → B (เพื่อนบ้านแรกของ A) → C (เพื่อนบ้านแรกของ B ที่ยังไม่ไป) → D (C มี B, D, F) → G (D มี A, C, G) → F (G มี D, F) → E (F มี C, E, G) ลำดับ A, B, C, D, G, F, E ต่างจาก BFS เพราะเดินลึกก่อน"
