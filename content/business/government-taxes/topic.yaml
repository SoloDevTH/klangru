- id: business.econ.circular-flow
  weight: 0.3
- id: math.number.ratio-percent
  weight: 0.2
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: economic-systems.svg
  alt: แถบแนวนอนแสดงระบบเศรษฐกิจ ปลายซ้ายคือทุนนิยม (เอกชนเป็นเจ้าของ กลไกราคาตัดสินใจ) ปลายขวาคือสังคมนิยมแบบวางแผนจากส่วนกลาง (รัฐเป็นเจ้าของ รัฐวางแผน) ตรงกลางเป็นช่วงกว้างของระบบผสม มีลูกศรบอกว่ายิ่งไปทางขวา บทบาทรัฐยิ่งมาก และหมายเหตุว่าประเทศส่วนใหญ่ รวมถึงไทย อยู่ในช่วงระบบผสม
  caption: ระบบเศรษฐกิจเป็นช่วงต่อเนื่อง ประเทศส่วนใหญ่อยู่ในช่วงผสม
- type: worked-example
  title: ภาษีขั้นบันได อัตราส่วนเพิ่ม และอัตราเฉลี่ย
  problem: 'ประเทศสมมติ: $100{,}000$ บาทแรกยกเว้น ส่วนที่เกินถึง $300{,}000$ บาท เสีย $10\%$ ส่วนที่เกิน $300{,}000$ บาท เสีย $20\%$ หาภาษีและอัตราเฉลี่ยของคนที่มีเงินได้สุทธิ $250{,}000$ บาท และ $600{,}000$ บาท'
  steps:
  - text: 'เงินได้ $250{,}000$: ส่วนที่เกิน $100{,}000$ มี $150{,}000$ บาท เสีย $150{,}000 \times 10\% = 15{,}000$ บาท'
    why: เงิน 100,000 บาทแรกได้ยกเว้น จึงคิดภาษีเฉพาะส่วนที่เกิน
  - text: อัตราเฉลี่ย $= 15{,}000 \div 250{,}000 = 6\%$
  - text: 'เงินได้ $600{,}000$: ขั้นที่สอง $200{,}000 \times 10\% = 20{,}000$ ขั้นที่สาม $300{,}000 \times 20\% = 60{,}000$ รวม $80{,}000$ บาท'
    why: แต่ละช่วงคิดด้วยอัตราของช่วงนั้นเท่านั้น
  - text: อัตราเฉลี่ย $= 80{,}000 \div 600{,}000 \approx 13.3\%$ ต่ำกว่าอัตราขั้นสุดท้าย $20\%$
  - text: รายได้สูงขึ้น อัตราเฉลี่ยสูงขึ้น (6% → 13.3%) จึงเป็นภาษีก้าวหน้า
  answer: $15{,}000$ บาท ($6\%$) และ $80{,}000$ บาท ($\approx 13.3\%$)
- type: check
  problem: business.econ.government-taxes.p007
  prompt: สินค้าสาธารณะต่างจากสินค้าทั่วไปอย่างไร
- type: figure
  src: tax-burden.svg
  alt: แผนภูมิแท่งคู่ของครอบครัว ก รายได้เดือนละ 10,000 บาท และครอบครัว ข รายได้ 50,000 บาท (สมมติ) แท่งซ้ายเป็นภาษีมูลค่าเพิ่มที่จ่ายเป็นบาท ครอบครัว ก 560 บาท ครอบครัว ข 1,400 บาท แท่งขวาเป็นร้อยละของรายได้ ครอบครัว ก 5.6% ครอบครัว ข 2.8% แสดงว่าคนรายได้มากจ่ายภาษีเป็นเงินมากกว่า แต่คิดเป็นสัดส่วนของรายได้น้อยกว่า
  caption: 'ภาษีการบริโภคอัตราเดียว: จ่ายเป็นบาทต่างกัน และเป็นภาระต่อรายได้ต่างกัน (ข้อมูลสมมติ)'
- type: worked-example
  title: ภาษีมูลค่าเพิ่มในราคาสินค้า
  problem: ร้านค้าที่จดทะเบียนภาษีมูลค่าเพิ่มติดป้ายราคารวมภาษีแล้ว $1{,}070$ บาท ถ้าภาษีมูลค่าเพิ่ม $7\%$ ราคาก่อนภาษีและภาษีเป็นเท่าไร
  steps:
  - text: ราคารวมภาษี $=$ ราคาก่อนภาษี $\times 1.07$
    why: ภาษีคิดจากราคาก่อนภาษี แล้วบวกเข้าไป
  - text: ราคาก่อนภาษี $= 1{,}070 \div 1.07 = 1{,}000$ บาท
  - text: ภาษี $= 1{,}070 - 1{,}000 = 70$ บาท (หรือ $1{,}070 \times \tfrac{7}{107}$)
  - text: ถ้าคิด $1{,}070 \times 7\% = 74.90$ บาท จะผิด เพราะเป็นการคิดภาษีซ้อนบนภาษี
  answer: ราคาก่อนภาษี $1{,}000$ บาท ภาษี $70$ บาท
- type: check
  problem: business.econ.government-taxes.p006
  prompt: ถอดภาษีออกจากราคารวมอย่างไร
glossary:
- term: ระบบเศรษฐกิจแบบผสม
  definition: ระบบที่เอกชนผลิตเป็นหลักผ่านกลไกราคา และรัฐเข้ามาจัดบริการสาธารณะ กำกับดูแล และกระจายรายได้
- term: สินค้าสาธารณะ
  definition: สินค้าที่กีดกันผู้ไม่จ่ายเงินได้ยากและไม่แย่งกันใช้ เช่น ไฟถนน การป้องกันประเทศ
- term: ผู้ตีตั๋วฟรี
  definition: ผู้ที่ได้ประโยชน์จากสินค้าหรือบริการโดยไม่ร่วมจ่าย
- term: ภาษีทางตรง
  definition: ภาษีที่ผู้เสียรับภาระเอง ผลักไปให้ผู้อื่นไม่ได้ เช่น ภาษีเงินได้
- term: ภาษีทางอ้อม
  definition: ภาษีที่ผู้ขายหรือผู้นำเข้าส่งให้รัฐแต่ผลักภาระไปไว้ในราคาสินค้าได้ เช่น ภาษีมูลค่าเพิ่ม
- term: ภาษีก้าวหน้า
  definition: ภาษีที่อัตราเฉลี่ยสูงขึ้นเมื่อรายได้สูงขึ้น
- term: ภาษีถดถอย
  definition: ภาษีที่อัตราเฉลี่ยต่อรายได้ลดลงเมื่อรายได้สูงขึ้น
- term: อัตราภาษีเฉลี่ย
  definition: ภาษีทั้งหมดหารด้วยรายได้ $\times 100$
flashcards:
- front: สินค้าสาธารณะ 2 ลักษณะ
  back: กีดกันผู้ไม่จ่ายได้ยาก · ไม่แย่งกันใช้
- front: ภาษีทางตรง vs ทางอ้อม
  back: 'ตรง: ภาษีเงินได้ · อ้อม: VAT สรรพสามิต อากร (ผลักภาระไปในราคาได้)'
- front: ถอด VAT ออกจากราคารวม
  back: ภาษี $=$ ราคารวม $\times \tfrac{7}{107}$
- front: ภาษีขั้นบันได
  back: อัตราขั้นสูงใช้เฉพาะส่วนที่เกินขั้น อัตราเฉลี่ยต่ำกว่าอัตราขั้นสุดท้าย
- front: วิเคราะห์นโยบายรัฐ
  back: ใครได้ ใครเสีย ต้นทุนเท่าไร ระยะสั้นกับระยะยาว
