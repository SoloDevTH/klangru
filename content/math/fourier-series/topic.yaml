id: math.de.fourier-series
subject: math
title:
  th: อนุกรมฟูเรียร์และผลตอบสนองต่อสัญญาณเข้าเป็นคาบ
  en: Fourier series and response to periodic input
summary: การแยกฟังก์ชันคาบเป็นคลื่นไซน์และโคไซน์ สูตรสัมประสิทธิ์ ฟังก์ชันคู่และคี่ ปรากฏการณ์กิบส์ และผลตอบสนองของระบบเชิงกลต่อแรงเป็นคาบ รวมการสั่นพ้อง
