  stem: โรงเรียนสองแห่งในอำเภอเดียวกันมีนักเรียนทะเลาะกันหลังแข่งฟุตบอลทุกปี ข้อใดวิเคราะห์สาเหตุและเสนอทางแก้ได้ครบที่สุด
  choices:
  - id: a
    text: สาเหตุคือการแข่งขันที่ปลุกความเป็นพวก การยั่วยุในโซเชียลมีเดีย และไม่มีกติกาหลังการแข่ง ทางแก้คือจัดกิจกรรมร่วมกันของสองโรงเรียน ตั้งตัวแทนนักเรียนเป็นคนกลาง ปล่อยนักเรียนกลับคนละเวลา และให้ครูดูแลโพสต์ยั่วยุ
    correct: true
  - id: b
    text: สาเหตุคือฟุตบอล ทางแก้คือเลิกแข่งฟุตบอล
    feedback: กีฬาไม่ใช่สาเหตุหลัก และการเลิกแข่งไม่ได้แก้ความเป็นพวกหรือการยั่วยุ
  - id: c
    text: สาเหตุคือนักเรียนอีกโรงเรียนนิสัยไม่ดี ทางแก้คือห้ามคบกัน
    feedback: เป็นการเหมารวมและทำให้ความเป็นศัตรูมากขึ้น
  hints:
