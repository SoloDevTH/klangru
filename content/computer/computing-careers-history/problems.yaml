    ai_assisted: true

  - id: computer.society.computing-careers-history.p019
    topics: [computer.society.computing-careers-history]
    difficulty: 5
    type: mcq
    stem: "นักเรียนคนหนึ่งชอบวาดรูปและสนใจปัญหาน้ำท่วมในชุมชน ข้อใดเป็นแนวทางที่ดีในการเชื่อมความสนใจของตนกับอาชีพ"
    choices:
      - { id: a, text: "ศึกษาอาชีพที่ใช้การออกแบบและข้อมูลเพื่อแก้น้ำท่วม เช่น นักออกแบบแอปแจ้งเตือนหรือนักวิเคราะห์ข้อมูลระดับน้ำ", correct: true }
      - { id: b, text: "เลิกสนใจทั้งสองเรื่องเพราะดูไม่เกี่ยวกัน", feedback: "การออกแบบภาพและการแก้ปัญหาชุมชนเชื่อมกับเทคโนโลยีได้หลายทาง" }
      - { id: c, text: "เลือกอาชีพจากค่าตอบแทนสูงสุดเท่านั้น", feedback: "ค่าตอบแทนเป็นเพียงปัจจัยหนึ่ง ควรดูความสนใจและเป้าหมายประกอบด้วย" }
      - { id: d, text: "รอให้มีคนมาบอกว่าควรเรียนอะไรเท่านั้น", feedback: "การค้นหาความสนใจของตนเองช่วยให้เลือกเส้นทางได้ดีกว่า" }
    hints:
      - "ลองนึกถึงอาชีพที่รวมการออกแบบกับการใช้ข้อมูลเพื่อช่วยชุมชน"
      - "เป้าหมายที่ดีเริ่มจากสิ่งที่เราสนใจและอยากแก้"
    solution: "การศึกษาอาชีพที่ใช้การออกแบบและข้อมูลช่วยแก้น้ำท่วม เชื่อมความสนใจด้านวาดรูปและการแก้ปัญหาชุมชนกับอาชีพจริงได้โดยตรง"
