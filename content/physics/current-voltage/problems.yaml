  - id: phy.ohm.p015
    topics: [physics.electricity.current-voltage]
    difficulty: 3
    type: numeric
    stem: "กราฟกระแสกับความต่างศักย์ของหลอดไส้เป็นดังรูป ขณะที่ความต่างศักย์คร่อมหลอดเป็น $6\\ \\mathrm{V}$ หลอดมีความต้านทานกี่โอห์ม (ตอบเป็นตัวเลขในหน่วย Ω)"
    figure: { src: p-lamp-iv.svg, alt: "กราฟกระแส I (แอมแปร์) กับความต่างศักย์ V (โวลต์) ของหลอดไส้ เป็นเส้นโค้งลาดน้อยลงเรื่อย ๆ ผ่านจุดที่ทำเครื่องหมายไว้ (2 V, 0.16 A), (4 V, 0.24 A) และ (6 V, 0.30 A)" }
    answer: { value: 20, tolerance: 0.2, unit: Ω }
    hints:
      - "อ่านกระแสจากกราฟที่ $V = 6\\ \\mathrm{V}$"
      - "ความต้านทาน ณ จุดนั้นคือ $R = \\dfrac{V}{I}$"
    misconceptions:
      - { match: 0.05, feedback: "นั่นคือ $\\dfrac{I}{V}$ ต้องกลับเป็น $\\dfrac{V}{I}$" }
      - { match: 12.5, feedback: "นั่นคือความต้านทานที่ $2\\ \\mathrm{V}$ ($\\tfrac{2}{0.16}$) โจทย์ถามที่ $6\\ \\mathrm{V}$" }
    solution: "ที่ $V = 6\\ \\mathrm{V}$ อ่านได้ $I = 0.30\\ \\mathrm{A}$ ดังนั้น $R = \\dfrac{6}{0.30} = 20\\ \\Omega$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.ohm.p016
