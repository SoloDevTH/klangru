completeness: full-text
strands:
  - id: "K.CC"
    title: "Counting and Cardinality (Kindergarten)"
    standards:
      - id: "K.CC.A"
        text: "Know number names and the count sequence."
        indicators:
          - { id: "K.CC.1", level: "K", text: "Count to 100 by ones and by tens." }
          - { id: "K.CC.2", level: "K", text: "Count forward beginning from a given number within the known sequence (instead of having to begin at 1)." }
          - { id: "K.CC.3", level: "K", text: "Write numbers from 0 to 20. Represent a number of objects with a written numeral 0-20 (with 0 representing a count of no objects)." }
      - id: "K.CC.B"
        text: "Count to tell the number of objects."
        indicators:
          - { id: "K.CC.4", level: "K", text: "Understand the relationship between numbers and quantities; connect counting to cardinality. a. When counting objects, say the number names in the standard order, pairing each object with one and only one number name and each number name with one and only one object. b. Understand that the last number name said tells the number of objects counted. The number of objects is the same regardless of their arrangement or the order in which they were counted. c. Understand that each successive number name refers to a quantity that is one larger." }
          - { id: "K.CC.5", level: "K", text: "Count to answer \"how many?\" questions about as many as 20 things arranged in a line, a rectangular array, or a circle, or as many as 10 things in a scattered configuration; given a number from 1-20, count out that many objects." }
      - id: "K.CC.C"
        text: "Compare numbers."
        indicators:
          - { id: "K.CC.6", level: "K", text: "Identify whether the number of objects in one group is greater than, less than, or equal to the number of objects in another group, e.g., by using matching and counting strategies." }
          - { id: "K.CC.7", level: "K", text: "Compare two numbers between 1 and 10 presented as written numerals." }
  - id: "K.OA"
    title: "Operations and Algebraic Thinking (Kindergarten)"
    standards:
      - id: "K.OA.A"
        text: "Understand addition as putting together and adding to, and understand subtraction as taking apart and taking from."
        indicators:
          - { id: "K.OA.1", level: "K", text: "Represent addition and subtraction with objects, fingers, mental images, drawings, sounds (e.g., claps), acting out situations, verbal explanations, expressions, or equations." }
          - { id: "K.OA.2", level: "K", text: "Solve addition and subtraction word problems, and add and subtract within 10, e.g., by using objects or drawings to represent the problem." }
          - { id: "K.OA.3", level: "K", text: "Decompose numbers less than or equal to 10 into pairs in more than one way, e.g., by using objects or drawings, and record each decomposition by a drawing or equation (e.g., 5 = 2 + 3 and 5 = 4 + 1)." }
          - { id: "K.OA.4", level: "K", text: "For any number from 1 to 9, find the number that makes 10 when added to the given number, e.g., by using objects or drawings, and record the answer with a drawing or equation." }
          - { id: "K.OA.5", level: "K", text: "Fluently add and subtract within 5." }
  - id: "K.NBT"
    title: "Number and Operations in Base Ten (Kindergarten)"
    standards:
      - id: "K.NBT.A"
        text: "Work with numbers 11-19 to gain foundations for place value."
        indicators:
          - { id: "K.NBT.1", level: "K", text: "Compose and decompose numbers from 11 to 19 into ten ones and some further ones, e.g., by using objects or drawings, and record each composition or decomposition by a drawing or equation (e.g., 18 = 10 + 8); understand that these numbers are composed of ten ones and one, two, three, four, five, six, seven, eight, or nine ones." }
  - id: "K.MD"
    title: "Measurement and Data (Kindergarten)"
    standards:
      - id: "K.MD.A"
        text: "Describe and compare measurable attributes."
        indicators:
          - { id: "K.MD.1", level: "K", text: "Describe measurable attributes of objects, such as length or weight. Describe several measurable attributes of a single object." }
          - { id: "K.MD.2", level: "K", text: "Directly compare two objects with a measurable attribute in common, to see which object has \"more of\"/\"less of\" the attribute, and describe the difference. For example, directly compare the heights of two children and describe one child as taller/shorter." }
      - id: "K.MD.B"
        text: "Classify objects and count the number of objects in each category."
        indicators:
          - { id: "K.MD.3", level: "K", text: "Classify objects into given categories; count the numbers of objects in each category and sort the categories by count." }
  - id: "K.G"
    title: "Geometry (Kindergarten)"
    standards:
      - id: "K.G.A"
        text: "Identify and describe shapes."
        indicators:
          - { id: "K.G.1", level: "K", text: "Describe objects in the environment using names of shapes, and describe the relative positions of these objects using terms such as above, below, beside, in front of, behind, and next to." }
          - { id: "K.G.2", level: "K", text: "Correctly name shapes regardless of their orientations or overall size." }
          - { id: "K.G.3", level: "K", text: "Identify shapes as two-dimensional (lying in a plane, \"flat\") or three-dimensional (\"solid\")." }
      - id: "K.G.B"
        text: "Analyze, compare, create, and compose shapes."
        indicators:
          - { id: "K.G.4", level: "K", text: "Analyze and compare two- and three-dimensional shapes, in different sizes and orientations, using informal language to describe their similarities, differences, parts (e.g., number of sides and vertices/\"corners\") and other attributes (e.g., having sides of equal length)." }
          - { id: "K.G.5", level: "K", text: "Model shapes in the world by building shapes from components (e.g., sticks and clay balls) and drawing shapes." }
          - { id: "K.G.6", level: "K", text: "Compose simple shapes to form larger shapes. For example, \"Can you join these two triangles with full sides touching to make a rectangle?\"" }
  - id: "1.OA"
    title: "Operations and Algebraic Thinking (Grade 1)"
    standards:
      - id: "1.OA.A"
        text: "Represent and solve problems involving addition and subtraction."
        indicators:
          - { id: "1.OA.1", level: "1", text: "Use addition and subtraction within 20 to solve word problems involving situations of adding to, taking from, putting together, taking apart, and comparing, with unknowns in all positions, e.g., by using objects, drawings, and equations with a symbol for the unknown number to represent the problem." }
          - { id: "1.OA.2", level: "1", text: "Solve word problems that call for addition of three whole numbers whose sum is less than or equal to 20, e.g., by using objects, drawings, and equations with a symbol for the unknown number to represent the problem." }
      - id: "1.OA.B"
        text: "Understand and apply properties of operations and the relationship between addition and subtraction."
        indicators:
          - { id: "1.OA.3", level: "1", text: "Apply properties of operations as strategies to add and subtract. Examples: If 8 + 3 = 11 is known, then 3 + 8 = 11 is also known. (Commutative property of addition.) To add 2 + 6 + 4, the second two numbers can be added to make a ten, so 2 + 6 + 4 = 2 + 10 = 12. (Associative property of addition.)" }
          - { id: "1.OA.4", level: "1", text: "Understand subtraction as an unknown-addend problem. For example, subtract 10 - 8 by finding the number that makes 10 when added to 8." }
      - id: "1.OA.C"
        text: "Add and subtract within 20."
        indicators:
          - { id: "1.OA.5", level: "1", text: "Relate counting to addition and subtraction (e.g., by counting on 2 to add 2)." }
          - { id: "1.OA.6", level: "1", text: "Add and subtract within 20, demonstrating fluency for addition and subtraction within 10. Use strategies such as counting on; making ten (e.g., 8 + 6 = 8 + 2 + 4 = 10 + 4 = 14); decomposing a number leading to a ten (e.g., 13 - 4 = 13 - 3 - 1 = 10 - 1 = 9); using the relationship between addition and subtraction (e.g., knowing that 8 + 4 = 12, one knows 12 - 8 = 4); and creating equivalent but easier or known sums (e.g., adding 6 + 7 by creating the known equivalent 6 + 6 + 1 = 12 + 1 = 13)." }
      - id: "1.OA.D"
        text: "Work with addition and subtraction equations."
        indicators:
          - { id: "1.OA.7", level: "1", text: "Understand the meaning of the equal sign, and determine if equations involving addition and subtraction are true or false. For example, which of the following equations are true and which are false? 6 = 6, 7 = 8 - 1, 5 + 2 = 2 + 5, 4 + 1 = 5 + 2." }
          - { id: "1.OA.8", level: "1", text: "Determine the unknown whole number in an addition or subtraction equation relating three whole numbers. For example, determine the unknown number that makes the equation true in each of the equations 8 + ? = 11, 5 = _ - 3, 6 + 6 = _." }
  - id: "1.NBT"
    title: "Number and Operations in Base Ten (Grade 1)"
    standards:
      - id: "1.NBT.A"
        text: "Extend the counting sequence."
        indicators:
          - { id: "1.NBT.1", level: "1", text: "Count to 120, starting at any number less than 120. In this range, read and write numerals and represent a number of objects with a written numeral." }
      - id: "1.NBT.B"
        text: "Understand place value."
        indicators:
          - { id: "1.NBT.2", level: "1", text: "Understand that the two digits of a two-digit number represent amounts of tens and ones. Understand the following as special cases: a. 10 can be thought of as a bundle of ten ones — called a \"ten.\" b. The numbers from 11 to 19 are composed of a ten and one, two, three, four, five, six, seven, eight, or nine ones. c. The numbers 10, 20, 30, 40, 50, 60, 70, 80, 90 refer to one, two, three, four, five, six, seven, eight, or nine tens (and 0 ones)." }
          - { id: "1.NBT.3", level: "1", text: "Compare two two-digit numbers based on meanings of the tens and ones digits, recording the results of comparisons with the symbols >, =, and <." }
      - id: "1.NBT.C"
        text: "Use place value understanding and properties of operations to add and subtract."
        indicators:
          - { id: "1.NBT.4", level: "1", text: "Add within 100, including adding a two-digit number and a one-digit number, and adding a two-digit number and a multiple of 10, using concrete models or drawings and strategies based on place value, properties of operations, and/or the relationship between addition and subtraction; relate the strategy to a written method and explain the reasoning used. Understand that in adding two-digit numbers, one adds tens and tens, ones and ones; and sometimes it is necessary to compose a ten." }
          - { id: "1.NBT.5", level: "1", text: "Given a two-digit number, mentally find 10 more or 10 less than the number, without having to count; explain the reasoning used." }
          - { id: "1.NBT.6", level: "1", text: "Subtract multiples of 10 in the range 10-90 from multiples of 10 in the range 10-90 (positive or zero differences), using concrete models or drawings and strategies based on place value, properties of operations, and/or the relationship between addition and subtraction; relate the strategy to a written method and explain the reasoning used." }
  - id: "1.MD"
    title: "Measurement and Data (Grade 1)"
    standards:
      - id: "1.MD.A"
        text: "Measure lengths indirectly and by iterating length units."
        indicators:
          - { id: "1.MD.1", level: "1", text: "Order three objects by length; compare the lengths of two objects indirectly by using a third object." }
          - { id: "1.MD.2", level: "1", text: "Express the length of an object as a whole number of length units, by laying multiple copies of a shorter object (the length unit) end to end; understand that the length measurement of an object is the number of same-size length units that span it with no gaps or overlaps. Limit to contexts where the object being measured is spanned by a whole number of length units with no gaps or overlaps." }
      - id: "1.MD.B"
        text: "Tell and write time."
        indicators:
          - { id: "1.MD.3", level: "1", text: "Tell and write time in hours and half-hours using analog and digital clocks." }
      - id: "1.MD.C"
        text: "Represent and interpret data."
        indicators:
          - { id: "1.MD.4", level: "1", text: "Organize, represent, and interpret data with up to three categories; ask and answer questions about the total number of data points, how many in each category, and how many more or less are in one category than in another." }
  - id: "1.G"
    title: "Geometry (Grade 1)"
    standards:
      - id: "1.G.A"
        text: "Reason with shapes and their attributes."
        indicators:
          - { id: "1.G.1", level: "1", text: "Distinguish between defining attributes (e.g., triangles are closed and three-sided) versus non-defining attributes (e.g., color, orientation, overall size); build and draw shapes to possess defining attributes." }
          - { id: "1.G.2", level: "1", text: "Compose two-dimensional shapes (rectangles, squares, trapezoids, triangles, half-circles, and quarter-circles) or three-dimensional shapes (cubes, right rectangular prisms, right circular cones, and right circular cylinders) to create a composite shape, and compose new shapes from the composite shape." }
          - { id: "1.G.3", level: "1", text: "Partition circles and rectangles into two and four equal shares, describe the shares using the words halves, fourths, and quarters, and use the phrases half of, fourth of, and quarter of. Describe the whole as two of, or four of the shares. Understand for these examples that decomposing into more equal shares creates smaller shares." }
  - id: "2.OA"
    title: "Operations and Algebraic Thinking (Grade 2)"
    standards:
      - id: "2.OA.A"
        text: "Represent and solve problems involving addition and subtraction."
        indicators:
          - { id: "2.OA.1", level: "2", text: "Use addition and subtraction within 100 to solve one- and two-step word problems involving situations of adding to, taking from, putting together, taking apart, and comparing, with unknowns in all positions, e.g., by using drawings and equations with a symbol for the unknown number to represent the problem." }
      - id: "2.OA.B"
        text: "Add and subtract within 20."
        indicators:
          - { id: "2.OA.2", level: "2", text: "Fluently add and subtract within 20 using mental strategies. By end of Grade 2, know from memory all sums of two one-digit numbers." }
      - id: "2.OA.C"
        text: "Work with equal groups of objects to gain foundations for multiplication."
        indicators:
          - { id: "2.OA.3", level: "2", text: "Determine whether a group of objects (up to 20) has an odd or even number of members, e.g., by pairing objects or counting them by 2s; write an equation to express an even number as a sum of two equal addends." }
          - { id: "2.OA.4", level: "2", text: "Use addition to find the total number of objects arranged in rectangular arrays with up to 5 rows and up to 5 columns; write an equation to express the total as a sum of equal addends." }
  - id: "2.NBT"
    title: "Number and Operations in Base Ten (Grade 2)"
    standards:
      - id: "2.NBT.A"
        text: "Understand place value."
        indicators:
          - { id: "2.NBT.1", level: "2", text: "Understand that the three digits of a three-digit number represent amounts of hundreds, tens, and ones; e.g., 706 equals 7 hundreds, 0 tens, and 6 ones. Understand the following as special cases: a. 100 can be thought of as a bundle of ten tens — called a \"hundred.\" b. The numbers 100, 200, 300, 400, 500, 600, 700, 800, 900 refer to one, two, three, four, five, six, seven, eight, or nine hundreds (and 0 tens and 0 ones)." }
          - { id: "2.NBT.2", level: "2", text: "Count within 1000; skip-count by 5s, 10s, and 100s." }
          - { id: "2.NBT.3", level: "2", text: "Read and write numbers to 1000 using base-ten numerals, number names, and expanded form." }
          - { id: "2.NBT.4", level: "2", text: "Compare two three-digit numbers based on meanings of the hundreds, tens, and ones digits, using >, =, and < symbols to record the results of comparisons." }
      - id: "2.NBT.B"
        text: "Use place value understanding and properties of operations to add and subtract."
        indicators:
          - { id: "2.NBT.5", level: "2", text: "Fluently add and subtract within 100 using strategies based on place value, properties of operations, and/or the relationship between addition and subtraction." }
          - { id: "2.NBT.6", level: "2", text: "Add up to four two-digit numbers using strategies based on place value and properties of operations." }
          - { id: "2.NBT.7", level: "2", text: "Add and subtract within 1000, using concrete models or drawings and strategies based on place value, properties of operations, and/or the relationship between addition and subtraction; relate the strategy to a written method. Understand that in adding or subtracting three-digit numbers, one adds or subtracts hundreds and hundreds, tens and tens, ones and ones; and sometimes it is necessary to compose or decompose tens or hundreds." }
          - { id: "2.NBT.8", level: "2", text: "Mentally add 10 or 100 to a given number 100-900, and mentally subtract 10 or 100 from a given number 100-900." }
          - { id: "2.NBT.9", level: "2", text: "Explain why addition and subtraction strategies work, using place value and the properties of operations." }
  - id: "2.MD"
    title: "Measurement and Data (Grade 2)"
    standards:
      - id: "2.MD.A"
        text: "Measure and estimate lengths in standard units."
        indicators:
          - { id: "2.MD.1", level: "2", text: "Measure the length of an object by selecting and using appropriate tools such as rulers, yardsticks, meter sticks, and measuring tapes." }
          - { id: "2.MD.2", level: "2", text: "Measure the length of an object twice, using length units of different lengths for the two measurements; describe how the two measurements relate to the size of the unit chosen." }
          - { id: "2.MD.3", level: "2", text: "Estimate lengths using units of inches, feet, centimeters, and meters." }
          - { id: "2.MD.4", level: "2", text: "Measure to determine how much longer one object is than another, expressing the length difference in terms of a standard length unit." }
      - id: "2.MD.B"
        text: "Relate addition and subtraction to length."
        indicators:
          - { id: "2.MD.5", level: "2", text: "Use addition and subtraction within 100 to solve word problems involving lengths that are given in the same units, e.g., by using drawings (such as drawings of rulers) and equations with a symbol for the unknown number to represent the problem." }
          - { id: "2.MD.6", level: "2", text: "Represent whole numbers as lengths from 0 on a number line diagram with equally spaced points corresponding to the numbers 0, 1, 2, ..., and represent whole-number sums and differences within 100 on a number line diagram." }
      - id: "2.MD.C"
        text: "Work with time and money."
        indicators:
          - { id: "2.MD.7", level: "2", text: "Tell and write time from analog and digital clocks to the nearest five minutes, using a.m. and p.m." }
          - { id: "2.MD.8", level: "2", text: "Solve word problems involving dollar bills, quarters, dimes, nickels, and pennies, using $ and ¢ symbols appropriately. Example: If you have 2 dimes and 3 pennies, how many cents do you have?" }
      - id: "2.MD.D"
        text: "Represent and interpret data."
        indicators:
          - { id: "2.MD.9", level: "2", text: "Generate measurement data by measuring lengths of several objects to the nearest whole unit, or by making repeated measurements of the same object. Show the measurements by making a line plot, where the horizontal scale is marked off in whole-number units." }
          - { id: "2.MD.10", level: "2", text: "Draw a picture graph and a bar graph (with single-unit scale) to represent a data set with up to four categories. Solve simple put-together, take-apart, and compare problems using information presented in a bar graph." }
  - id: "2.G"
    title: "Geometry (Grade 2)"
    standards:
      - id: "2.G.A"
        text: "Reason with shapes and their attributes."
        indicators:
          - { id: "2.G.1", level: "2", text: "Recognize and draw shapes having specified attributes, such as a given number of angles or a given number of equal faces. Identify triangles, quadrilaterals, pentagons, hexagons, and cubes." }
          - { id: "2.G.2", level: "2", text: "Partition a rectangle into rows and columns of same-size squares and count to find the total number of them." }
          - { id: "2.G.3", level: "2", text: "Partition circles and rectangles into two, three, or four equal shares, describe the shares using the words halves, thirds, half of, a third of, etc., and describe the whole as two halves, three thirds, four fourths. Recognize that equal shares of identical wholes need not have the same shape." }
  - id: "3.OA"
    title: "Operations and Algebraic Thinking (Grade 3)"
    standards:
      - id: "3.OA.A"
        text: "Represent and solve problems involving multiplication and division."
        indicators:
          - { id: "3.OA.1", level: "3", text: "Interpret products of whole numbers, e.g., interpret 5 × 7 as the total number of objects in 5 groups of 7 objects each. For example, describe a context in which a total number of objects can be expressed as 5 × 7." }
          - { id: "3.OA.2", level: "3", text: "Interpret whole-number quotients of whole numbers, e.g., interpret 56 ÷ 8 as the number of objects in each share when 56 objects are partitioned equally into 8 shares, or as a number of shares when 56 objects are partitioned into equal shares of 8 objects each. For example, describe a context in which a number of shares or a number of groups can be expressed as 56 ÷ 8." }
          - { id: "3.OA.3", level: "3", text: "Use multiplication and division within 100 to solve word problems in situations involving equal groups, arrays, and measurement quantities, e.g., by using drawings and equations with a symbol for the unknown number to represent the problem." }
          - { id: "3.OA.4", level: "3", text: "Determine the unknown whole number in a multiplication or division equation relating three whole numbers. For example, determine the unknown number that makes the equation true in each of the equations 8 × ? = 48, 5 = _ ÷ 3, 6 × 6 = ?" }
      - id: "3.OA.B"
        text: "Understand properties of multiplication and the relationship between multiplication and division."
        indicators:
          - { id: "3.OA.5", level: "3", text: "Apply properties of operations as strategies to multiply and divide. Examples: If 6 × 4 = 24 is known, then 4 × 6 = 24 is also known. (Commutative property of multiplication.) 3 × 5 × 2 can be found by 3 × 5 = 15, then 15 × 2 = 30, or by 5 × 2 = 10, then 3 × 10 = 30. (Associative property of multiplication.) Knowing that 8 × 5 = 40 and 8 × 2 = 16, one can find 8 × 7 as 8 × (5 + 2) = (8 × 5) + (8 × 2) = 40 + 16 = 56. (Distributive property.)" }
          - { id: "3.OA.6", level: "3", text: "Understand division as an unknown-factor problem. For example, find 32 ÷ 8 by finding the number that makes 32 when multiplied by 8." }
      - id: "3.OA.C"
        text: "Multiply and divide within 100."
        indicators:
          - { id: "3.OA.7", level: "3", text: "Fluently multiply and divide within 100, using strategies such as the relationship between multiplication and division (e.g., knowing that 8 × 5 = 40, one knows 40 ÷ 5 = 8) or properties of operations. By the end of Grade 3, know from memory all products of two one-digit numbers." }
      - id: "3.OA.D"
        text: "Solve problems involving the four operations, and identify and explain patterns in arithmetic."
        indicators:
          - { id: "3.OA.8", level: "3", text: "Solve two-step word problems using the four operations. Represent these problems using equations with a letter standing for the unknown quantity. Assess the reasonableness of answers using mental computation and estimation strategies including rounding." }
          - { id: "3.OA.9", level: "3", text: "Identify arithmetic patterns (including patterns in the addition table or multiplication table), and explain them using properties of operations. For example, observe that 4 times a number is always even, and explain why 4 times a number can be decomposed into two equal addends." }
  - id: "3.NBT"
    title: "Number and Operations in Base Ten (Grade 3)"
    standards:
      - id: "3.NBT.A"
        text: "Use place value understanding and properties of operations to perform multi-digit arithmetic.¹"
        indicators:
          - { id: "3.NBT.1", level: "3", text: "Use place value understanding to round whole numbers to the nearest 10 or 100." }
          - { id: "3.NBT.2", level: "3", text: "Fluently add and subtract within 1000 using strategies and algorithms based on place value, properties of operations, and/or the relationship between addition and subtraction." }
          - { id: "3.NBT.3", level: "3", text: "Multiply one-digit whole numbers by multiples of 10 in the range 10-90 (e.g., 9 × 80, 5 × 60) using strategies based on place value and properties of operations." }
  - id: "3.NF"
    title: "Number and Operations—Fractions (Grade 3)"
    standards:
      - id: "3.NF.A"
        text: "Develop understanding of fractions as numbers."
        indicators:
          - { id: "3.NF.1", level: "3", text: "Understand a fraction 1/b as the quantity formed by 1 part when a whole is partitioned into b equal parts; understand a fraction a/b as the quantity formed by a parts of size 1/b." }
          - { id: "3.NF.2", level: "3", text: "Understand a fraction as a number on the number line; represent fractions on a number line diagram. a. Represent a fraction 1/b on a number line diagram by defining the interval from 0 to 1 as the whole and partitioning it into b equal parts. Recognize that each part has size 1/b and that the endpoint of the part based at 0 locates the number 1/b on the number line. b. Represent a fraction a/b on a number line diagram by marking off a lengths 1/b from 0. Recognize that the resulting interval has size a/b and that its endpoint locates the number a/b on the number line." }
          - { id: "3.NF.3", level: "3", text: "Explain equivalence of fractions in special cases, and compare fractions by reasoning about their size. a. Understand two fractions as equivalent (equal) if they are the same size, or the same point on a number line. b. Recognize and generate simple equivalent fractions, e.g., 1/2 = 2/4, 4/6 = 2/3. Explain why the fractions are equivalent, e.g., by using a visual fraction model. c. Express whole numbers as fractions, and recognize fractions that are equivalent to whole numbers. Examples: Express 3 in the form 3 = 3/1; recognize that 6/1 = 6; locate 4/4 and 1 at the same point of a number line diagram. d. Compare two fractions with the same numerator or the same denominator by reasoning about their size. Recognize that comparisons are valid only when the two fractions refer to the same whole. Record the results of comparisons with the symbols >, =, or <, and justify the conclusions, e.g., by using a visual fraction model." }
  - id: "3.MD"
    title: "Measurement and Data (Grade 3)"
    standards:
      - id: "3.MD.A"
        text: "Solve problems involving measurement and estimation."
        indicators:
          - { id: "3.MD.1", level: "3", text: "Tell and write time to the nearest minute and measure time intervals in minutes. Solve word problems involving addition and subtraction of time intervals in minutes, e.g., by representing the problem on a number line diagram." }
          - { id: "3.MD.2", level: "3", text: "Measure and estimate liquid volumes and masses of objects using standard units of grams (g), kilograms (kg), and liters (l). Add, subtract, multiply, or divide to solve one-step word problems involving masses or volumes that are given in the same units, e.g., by using drawings (such as a beaker with a measurement scale) to represent the problem." }
      - id: "3.MD.B"
        text: "Represent and interpret data."
        indicators:
          - { id: "3.MD.3", level: "3", text: "Draw a scaled picture graph and a scaled bar graph to represent a data set with several categories. Solve one- and two-step \"how many more\" and \"how many less\" problems using information presented in scaled bar graphs. For example, draw a bar graph in which each square in the bar graph might represent 5 pets." }
          - { id: "3.MD.4", level: "3", text: "Generate measurement data by measuring lengths using rulers marked with halves and fourths of an inch. Show the data by making a line plot, where the horizontal scale is marked off in appropriate units— whole numbers, halves, or quarters." }
      - id: "3.MD.C"
        text: "Geometric measurement: understand concepts of area and relate area to multiplication and to addition."
        indicators:
          - { id: "3.MD.5", level: "3", text: "Recognize area as an attribute of plane figures and understand concepts of area measurement. a. A square with side length 1 unit, called \"a unit square,\" is said to have \"one square unit\" of area, and can be used to measure area. b. A plane figure which can be covered without gaps or overlaps by n unit squares is said to have an area of n square units." }
          - { id: "3.MD.6", level: "3", text: "Measure areas by counting unit squares (square cm, square m, square in, square ft, and improvised units)." }
          - { id: "3.MD.7", level: "3", text: "Relate area to the operations of multiplication and addition. a. Find the area of a rectangle with whole-number side lengths by tiling it, and show that the area is the same as would be found by multiplying the side lengths. b. Multiply side lengths to find areas of rectangles with whole-number side lengths in the context of solving real world and mathematical problems, and represent whole-number products as rectangular areas in mathematical reasoning. c. Use tiling to show in a concrete case that the area of a rectangle with whole-number side lengths a and b + c is the sum of a × b and a × c. Use area models to represent the distributive property in mathematical reasoning. d. Recognize area as additive. Find areas of rectilinear figures by decomposing them into non-overlapping rectangles and adding the areas of the non-overlapping parts, applying this technique to solve real world problems." }
      - id: "3.MD.D"
        text: "Geometric measurement: recognize perimeter."
        indicators:
          - { id: "3.MD.8", level: "3", text: "Solve real world and mathematical problems involving perimeters of polygons, including finding the perimeter given the side lengths, finding an unknown side length, and exhibiting rectangles with the same perimeter and different areas or with the same area and different perimeters." }
  - id: "3.G"
    title: "Geometry (Grade 3)"
    standards:
      - id: "3.G.A"
        text: "Reason with shapes and their attributes."
        indicators:
          - { id: "3.G.1", level: "3", text: "Understand that shapes in different categories (e.g., rhombuses, rectangles, and others) may share attributes (e.g., having four sides), and that the shared attributes can define a larger category (e.g., quadrilaterals). Recognize rhombuses, rectangles, and squares as examples of quadrilaterals, and draw examples of quadrilaterals that do not belong to any of these subcategories." }
          - { id: "3.G.2", level: "3", text: "Partition shapes into parts with equal areas. Express the area of each part as a unit fraction of the whole. For example, partition a shape into 4 parts with equal area, and describe the area of each part as 1/4 of the area of the shape." }
  - id: "4.OA"
    title: "Operations and Algebraic Thinking (Grade 4)"
    standards:
      - id: "4.OA.A"
        text: "Use the four operations with whole numbers to solve problems."
        indicators:
          - { id: "4.OA.1", level: "4", text: "Interpret a multiplication equation as a comparison, e.g., interpret 35 = 5 × 7 as a statement that 35 is 5 times as many as 7 and 7 times as many as 5. Represent verbal statements of multiplicative comparisons as multiplication equations." }
          - { id: "4.OA.2", level: "4", text: "Multiply or divide to solve word problems involving multiplicative comparison, e.g., by using drawings and equations with a symbol for the unknown number to represent the problem, distinguishing multiplicative comparison from additive comparison." }
          - { id: "4.OA.3", level: "4", text: "Solve multistep word problems posed with whole numbers and having whole-number answers using the four operations, including problems in which remainders must be interpreted. Represent these problems using equations with a letter standing for the unknown quantity. Assess the reasonableness of answers using mental computation and estimation strategies including rounding." }
      - id: "4.OA.B"
        text: "Gain familiarity with factors and multiples."
        indicators:
          - { id: "4.OA.4", level: "4", text: "Find all factor pairs for a whole number in the range 1-100. Recognize that a whole number is a multiple of each of its factors. Determine whether a given whole number in the range 1-100 is a multiple of a given one-digit number. Determine whether a given whole number in the range 1-100 is prime or composite." }
      - id: "4.OA.C"
        text: "Generate and analyze patterns."
        indicators:
          - { id: "4.OA.5", level: "4", text: "Generate a number or shape pattern that follows a given rule. Identify apparent features of the pattern that were not explicit in the rule itself. For example, given the rule \"Add 3\" and the starting number 1, generate terms in the resulting sequence and observe that the terms appear to alternate between odd and even numbers. Explain informally why the numbers will continue to alternate in this way." }
  - id: "4.NBT"
    title: "Number and Operations in Base Ten (Grade 4)"
    standards:
      - id: "4.NBT.A"
        text: "Generalize place value understanding for multi-digit whole numbers."
        indicators:
          - { id: "4.NBT.1", level: "4", text: "Recognize that in a multi-digit whole number, a digit in one place represents ten times what it represents in the place to its right. For example, recognize that 700 ÷ 70 = 10 by applying concepts of place value and division." }
          - { id: "4.NBT.2", level: "4", text: "Read and write multi-digit whole numbers using base-ten numerals, number names, and expanded form. Compare two multi-digit numbers based on meanings of the digits in each place, using >, =, and < symbols to record the results of comparisons." }
          - { id: "4.NBT.3", level: "4", text: "Use place value understanding to round multi-digit whole numbers to any place." }
      - id: "4.NBT.B"
        text: "Use place value understanding and properties of operations to perform multi-digit arithmetic."
        indicators:
          - { id: "4.NBT.4", level: "4", text: "Fluently add and subtract multi-digit whole numbers using the standard algorithm." }
          - { id: "4.NBT.5", level: "4", text: "Multiply a whole number of up to four digits by a one-digit whole number, and multiply two two-digit numbers, using strategies based on place value and the properties of operations. Illustrate and explain the calculation by using equations, rectangular arrays, and/or area models." }
          - { id: "4.NBT.6", level: "4", text: "Find whole-number quotients and remainders with up to four-digit dividends and one-digit divisors, using strategies based on place value, the properties of operations, and/or the relationship between multiplication and division. Illustrate and explain the calculation by using equations, rectangular arrays, and/or area models." }
  - id: "4.NF"
    title: "Number and Operations—Fractions (Grade 4)"
    standards:
      - id: "4.NF.A"
        text: "Extend understanding of fraction equivalence and ordering."
        indicators:
          - { id: "4.NF.1", level: "4", text: "Explain why a fraction a/b is equivalent to a fraction (n × a)/(n × b) by using visual fraction models, with attention to how the number and size of the parts differ even though the two fractions themselves are the same size. Use this principle to recognize and generate equivalent fractions." }
          - { id: "4.NF.2", level: "4", text: "Compare two fractions with different numerators and different denominators, e.g., by creating common denominators or numerators, or by comparing to a benchmark fraction such as 1/2. Recognize that comparisons are valid only when the two fractions refer to the same whole. Record the results of comparisons with symbols >, =, or <, and justify the conclusions, e.g., by using a visual fraction model." }
      - id: "4.NF.B"
        text: "Build fractions from unit fractions."
        indicators:
          - { id: "4.NF.3", level: "4", text: "Understand a fraction a/b with a > 1 as a sum of fractions 1/b. a. Understand addition and subtraction of fractions as joining and separating parts referring to the same whole. b. Decompose a fraction into a sum of fractions with the same denominator in more than one way, recording each decomposition by an equation. Justify decompositions, e.g., by using a visual fraction model. Examples: 3/8 = 1/8 + 1/8 + 1/8 ; 3/8 = 1/8 + 2/8 ; 2 1/8 = 1 + 1 + 1/8 = 8/8 + 8/8 + 1/8. c. Add and subtract mixed numbers with like denominators, e.g., by replacing each mixed number with an equivalent fraction, and/or by using properties of operations and the relationship between addition and subtraction. d. Solve word problems involving addition and subtraction of fractions referring to the same whole and having like denominators, e.g., by using visual fraction models and equations to represent the problem." }
          - { id: "4.NF.4", level: "4", text: "Apply and extend previous understandings of multiplication to multiply a fraction by a whole number. a. Understand a fraction a/b as a multiple of 1/b. For example, use a visual fraction model to represent 5/4 as the product 5 × (1/4), recording the conclusion by the equation 5/4 = 5 × (1/4). b. Understand a multiple of a/b as a multiple of 1/b, and use this understanding to multiply a fraction by a whole number. For example, use a visual fraction model to express 3 × (2/5) as 6 × (1/5), recognizing this product as 6/5. (In general, n × (a/b) = (n × a)/b.) c. Solve word problems involving multiplication of a fraction by a whole number, e.g., by using visual fraction models and equations to represent the problem. For example, if each person at a party will eat 3/8 of a pound of roast beef, and there will be 5 people at the party, how many pounds of roast beef will be needed? Between what two whole numbers does your answer lie?" }
      - id: "4.NF.C"
        text: "Understand decimal notation for fractions, and compare decimal fractions."
        indicators:
          - { id: "4.NF.5", level: "4", text: "Express a fraction with denominator 10 as an equivalent fraction with denominator 100, and use this technique to add two fractions with respective denominators 10 and 100. For example, express 3/10 as 30/100, and add 3/10 + 4/100 = 34/100." }
          - { id: "4.NF.6", level: "4", text: "Use decimal notation for fractions with denominators 10 or 100. For example, rewrite 0.62 as 62/100; describe a length as 0.62 meters; locate 0.62 on a number line diagram." }
          - { id: "4.NF.7", level: "4", text: "Compare two decimals to hundredths by reasoning about their size. Recognize that comparisons are valid only when the two decimals refer to the same whole. Record the results of comparisons with the symbols >, =, or <, and justify the conclusions, e.g., by using a visual model." }
  - id: "4.MD"
    title: "Measurement and Data (Grade 4)"
    standards:
      - id: "4.MD.A"
        text: "Solve problems involving measurement and conversion of measurements."
        indicators:
          - { id: "4.MD.1", level: "4", text: "Know relative sizes of measurement units within one system of units including km, m, cm; kg, g; lb, oz.; l, ml; hr, min, sec. Within a single system of measurement, express measurements in a larger unit in terms of a smaller unit. Record measurement equivalents in a two-column table. For example, know that 1 ft is 12 times as long as 1 in. Express the length of a 4 ft snake as 48 in. Generate a conversion table for feet and inches listing the number pairs (1, 12), (2, 24), (3, 36), ..." }
          - { id: "4.MD.2", level: "4", text: "Use the four operations to solve word problems involving distances, intervals of time, liquid volumes, masses of objects, and money, including problems involving simple fractions or decimals, and problems that require expressing measurements given in a larger unit in terms of a smaller unit. Represent measurement quantities using diagrams such as number line diagrams that feature a measurement scale." }
          - { id: "4.MD.3", level: "4", text: "Apply the area and perimeter formulas for rectangles in real world and mathematical problems. For example, find the width of a rectangular room given the area of the flooring and the length, by viewing the area formula as a multiplication equation with an unknown factor." }
      - id: "4.MD.B"
        text: "Represent and interpret data."
        indicators:
          - { id: "4.MD.4", level: "4", text: "Make a line plot to display a data set of measurements in fractions of a unit (1/2, 1/4, 1/8). Solve problems involving addition and subtraction of fractions by using information presented in line plots. For example, from a line plot find and interpret the difference in length between the longest and shortest specimens in an insect collection." }
      - id: "4.MD.C"
        text: "Geometric measurement: understand concepts of angle and measure angles."
        indicators:
          - { id: "4.MD.5", level: "4", text: "Recognize angles as geometric shapes that are formed wherever two rays share a common endpoint, and understand concepts of angle measurement: a. An angle is measured with reference to a circle with its center at the common endpoint of the rays, by considering the fraction of the circular arc between the points where the two rays intersect the circle. An angle that turns through 1/360 of a circle is called a \"one-degree angle,\" and can be used to measure angles. b. An angle that turns through n one-degree angles is said to have an angle measure of n degrees." }
          - { id: "4.MD.6", level: "4", text: "Measure angles in whole-number degrees using a protractor. Sketch angles of specified measure." }
          - { id: "4.MD.7", level: "4", text: "Recognize angle measure as additive. When an angle is decomposed into non-overlapping parts, the angle measure of the whole is the sum of the angle measures of the parts. Solve addition and subtraction problems to find unknown angles on a diagram in real world and mathematical problems, e.g., by using an equation with a symbol for the unknown angle measure." }
  - id: "4.G"
    title: "Geometry (Grade 4)"
    standards:
      - id: "4.G.A"
        text: "Draw and identify lines and angles, and classify shapes by properties of their lines and angles."
        indicators:
          - { id: "4.G.1", level: "4", text: "Draw points, lines, line segments, rays, angles (right, acute, obtuse), and perpendicular and parallel lines. Identify these in two-dimensional figures." }
          - { id: "4.G.2", level: "4", text: "Classify two-dimensional figures based on the presence or absence of parallel or perpendicular lines, or the presence or absence of angles of a specified size. Recognize right triangles as a category, and identify right triangles." }
          - { id: "4.G.3", level: "4", text: "Recognize a line of symmetry for a two-dimensional figure as a line across the figure such that the figure can be folded along the line into matching parts. Identify line-symmetric figures and draw lines of symmetry." }
  - id: "5.OA"
    title: "Operations and Algebraic Thinking (Grade 5)"
    standards:
      - id: "5.OA.A"
        text: "Write and interpret numerical expressions."
        indicators:
          - { id: "5.OA.1", level: "5", text: "Use parentheses, brackets, or braces in numerical expressions, and evaluate expressions with these symbols." }
          - { id: "5.OA.2", level: "5", text: "Write simple expressions that record calculations with numbers, and interpret numerical expressions without evaluating them. For example, express the calculation \"add 8 and 7, then multiply by 2\" as 2 × (8 + 7). Recognize that 3 × (18932 + 921) is three times as large as 18932 + 921, without having to calculate the indicated sum or product." }
      - id: "5.OA.B"
        text: "Analyze patterns and relationships."
        indicators:
          - { id: "5.OA.3", level: "5", text: "Generate two numerical patterns using two given rules. Identify apparent relationships between corresponding terms. Form ordered pairs consisting of corresponding terms from the two patterns, and graph the ordered pairs on a coordinate plane. For example, given the rule \"Add 3\" and the starting number 0, and given the rule \"Add 6\" and the starting number 0, generate terms in the resulting sequences, and observe that the terms in one sequence are twice the corresponding terms in the other sequence. Explain informally why this is so." }
  - id: "5.NBT"
    title: "Number and Operations in Base Ten (Grade 5)"
    standards:
      - id: "5.NBT.A"
        text: "Understand the place value system."
        indicators:
          - { id: "5.NBT.1", level: "5", text: "Recognize that in a multi-digit number, a digit in one place represents 10 times as much as it represents in the place to its right and 1/10 of what it represents in the place to its left." }
          - { id: "5.NBT.2", level: "5", text: "Explain patterns in the number of zeros of the product when multiplying a number by powers of 10, and explain patterns in the placement of the decimal point when a decimal is multiplied or divided by a power of 10. Use whole-number exponents to denote powers of 10." }
          - { id: "5.NBT.3", level: "5", text: "Read, write, and compare decimals to thousandths. a. Read and write decimals to thousandths using base-ten numerals, number names, and expanded form, e.g., 347.392 = 3 × 100 + 4 × 10 + 7 × 1 + 3 × (1/10) + 9 × (1/100) + 2 × (1/1000). b. Compare two decimals to thousandths based on meanings of the digits in each place, using >, =, and < symbols to record the results of comparisons." }
          - { id: "5.NBT.4", level: "5", text: "Use place value understanding to round decimals to any place." }
      - id: "5.NBT.B"
        text: "Perform operations with multi-digit whole numbers and with decimals to hundredths."
        indicators:
          - { id: "5.NBT.5", level: "5", text: "Fluently multiply multi-digit whole numbers using the standard algorithm." }
          - { id: "5.NBT.6", level: "5", text: "Find whole-number quotients of whole numbers with up to four-digit dividends and two-digit divisors, using strategies based on place value, the properties of operations, and/or the relationship between multiplication and division. Illustrate and explain the calculation by using equations, rectangular arrays, and/or area models." }
          - { id: "5.NBT.7", level: "5", text: "Add, subtract, multiply, and divide decimals to hundredths, using concrete models or drawings and strategies based on place value, properties of operations, and/or the relationship between addition and subtraction; relate the strategy to a written method and explain the reasoning used." }
  - id: "5.NF"
    title: "Number and Operations—Fractions (Grade 5)"
    standards:
      - id: "5.NF.A"
        text: "Use equivalent fractions as a strategy to add and subtract fractions."
        indicators:
          - { id: "5.NF.1", level: "5", text: "Add and subtract fractions with unlike denominators (including mixed numbers) by replacing given fractions with equivalent fractions in such a way as to produce an equivalent sum or difference of fractions with like denominators. For example, 2/3 + 5/4 = 8/12 + 15/12 = 23/12. (In general, a/b + c/d = (ad + bc)/bd.)" }
          - { id: "5.NF.2", level: "5", text: "Solve word problems involving addition and subtraction of fractions referring to the same whole, including cases of unlike denominators, e.g., by using visual fraction models or equations to represent the problem. Use benchmark fractions and number sense of fractions to estimate mentally and assess the reasonableness of answers. For example, recognize an incorrect result 2/5 + 1/2 = 3/7, by observing that 3/7 < 1/2." }
      - id: "5.NF.B"
        text: "Apply and extend previous understandings of multiplication and division."
        indicators:
          - { id: "5.NF.3", level: "5", text: "Interpret a fraction as division of the numerator by the denominator (a/b = a ÷ b). Solve word problems involving division of whole numbers leading to answers in the form of fractions or mixed numbers, e.g., by using visual fraction models or equations to represent the problem. For example, interpret 3/4 as the result of dividing 3 by 4, noting that 3/4 multiplied by 4 equals 3, and that when 3 wholes are shared equally among 4 people each person has a share of size 3/4. If 9 people want to share a 50-pound sack of rice equally by weight, how many pounds of rice should each person get? Between what two whole numbers does your answer lie?" }
          - { id: "5.NF.4", level: "5", text: "Apply and extend previous understandings of multiplication to multiply a fraction or whole number by a fraction. a. Interpret the product (a/b) × q as a parts of a partition of q into b equal parts; equivalently, as the result of a sequence of operations a × q ÷ b. For example, use a visual fraction model to show (2/3) × 4 = 8/3, and create a story context for this equation. Do the same with (2/3) × (4/5) = 8/15. (In general, (a/b) × (c/d) = (ac)/(bd). b. Find the area of a rectangle with fractional side lengths by tiling it with unit squares of the appropriate unit fraction side lengths, and show that the area is the same as would be found by multiplying the side lengths. Multiply fractional side lengths to find areas of rectangles, and represent fraction products as rectangular areas." }
          - { id: "5.NF.5", level: "5", text: "Interpret multiplication as scaling (resizing), by: a. Comparing the size of a product to the size of one factor on the basis of the size of the other factor, without performing the indicated multiplication. b. Explaining why multiplying a given number by a fraction greater than 1 results in a product greater than the given number (recognizing multiplication by whole numbers greater than 1 as a familiar case); explaining why multiplying a given number by a fraction less than 1 results in a product smaller than the given number; and relating the principle of fraction equivalence a/b = (n × a)/(n × b) to the effect of multiplying a/b by 1." }
          - { id: "5.NF.6", level: "5", text: "Solve real world problems involving multiplication of fractions and mixed numbers, e.g., by using visual fraction models or equations to represent the problem." }
          - { id: "5.NF.7", level: "5", text: "Apply and extend previous understandings of division to divide unit fractions by whole numbers and whole numbers by unit fractions. a. Interpret division of a unit fraction by a non-zero whole number, and compute such quotients. For example, create a story context for (1/3) ÷ 4, and use a visual fraction model to show the quotient. Use the relationship between multiplication and division to explain that (1/3) ÷ 4 = 1/12 because (1/12) × 4 = 1/3. b. Interpret division of a whole number by a unit fraction, and compute such quotients. For example, create a story context for 4 ÷ (1/5), and use a visual fraction model to show the quotient. Use the relationship between multiplication and division to explain that 4 ÷ (1/5) = 20 because 20 × (1/5) = 4. c. Solve real world problems involving division of unit fractions by non-zero whole numbers and division of whole numbers by unit fractions, e.g., by using visual fraction models and equations to represent the problem. For example, how much chocolate will each person get if 3 people share 1/2 lb of chocolate equally? How many 1/3-cup servings are in 2 cups of raisins?" }
  - id: "5.MD"
    title: "Measurement and Data (Grade 5)"
    standards:
      - id: "5.MD.A"
        text: "Convert like measurement units within a given measurement system."
        indicators:
          - { id: "5.MD.1", level: "5", text: "Convert among different-sized standard measurement units within a given measurement system (e.g., convert 5 cm to 0.05 m), and use these conversions in solving multi-step, real world problems." }
      - id: "5.MD.B"
        text: "Represent and interpret data."
        indicators:
          - { id: "5.MD.2", level: "5", text: "Make a line plot to display a data set of measurements in fractions of a unit (1/2, 1/4, 1/8). Use operations on fractions for this grade to solve problems involving information presented in line plots. For example, given different measurements of liquid in identical beakers, find the amount of liquid each beaker would contain if the total amount in all the beakers were redistributed equally." }
      - id: "5.MD.C"
        text: "Geometric measurement: understand concepts of volume."
        indicators:
          - { id: "5.MD.3", level: "5", text: "Recognize volume as an attribute of solid figures and understand concepts of volume measurement. a. A cube with side length 1 unit, called a \"unit cube,\" is said to have \"one cubic unit\" of volume, and can be used to measure volume. b. A solid figure which can be packed without gaps or overlaps using n unit cubes is said to have a volume of n cubic units." }
          - { id: "5.MD.4", level: "5", text: "Measure volumes by counting unit cubes, using cubic cm, cubic in, cubic ft, and improvised units." }
          - { id: "5.MD.5", level: "5", text: "Relate volume to the operations of multiplication and addition and solve real world and mathematical problems involving volume. a. Find the volume of a right rectangular prism with whole-number side lengths by packing it with unit cubes, and show that the volume is the same as would be found by multiplying the edge lengths, equivalently by multiplying the height by the area of the base. Represent threefold whole-number products as volumes, e.g., to represent the associative property of multiplication. b. Apply the formulas V = l × w × h and V = b × h for rectangular prisms to find volumes of right rectangular prisms with whole-number edge lengths in the context of solving real world and mathematical problems. c. Recognize volume as additive. Find volumes of solid figures composed of two non-overlapping right rectangular prisms by adding the volumes of the non-overlapping parts, applying this technique to solve real world problems." }
  - id: "5.G"
    title: "Geometry (Grade 5)"
    standards:
      - id: "5.G.A"
        text: "Graph points on the coordinate plane to solve real-world and mathematical problems."
        indicators:
          - { id: "5.G.1", level: "5", text: "Use a pair of perpendicular number lines, called axes, to define a coordinate system, with the intersection of the lines (the origin) arranged to coincide with the 0 on each line and a given point in the plane located by using an ordered pair of numbers, called its coordinates. Understand that the first number indicates how far to travel from the origin in the direction of one axis, and the second number indicates how far to travel in the direction of the second axis, with the convention that the names of the two axes and the coordinates correspond (e.g., x-axis and x-coordinate, y-axis and y-coordinate)." }
          - { id: "5.G.2", level: "5", text: "Represent real world and mathematical problems by graphing points in the first quadrant of the coordinate plane, and interpret coordinate values of points in the context of the situation." }
      - id: "5.G.B"
        text: "Classify two-dimensional figures into categories based on their properties."
        indicators:
          - { id: "5.G.3", level: "5", text: "Understand that attributes belonging to a category of two-dimensional figures also belong to all subcategories of that category. For example, all rectangles have four right angles and squares are rectangles, so all squares have four right angles." }
          - { id: "5.G.4", level: "5", text: "Classify two-dimensional figures in a hierarchy based on properties." }
  - id: "6.RP"
    title: "Ratios and Proportional Relationships (Grade 6)"
    standards:
      - id: "6.RP.A"
        text: "Understand ratio concepts and use ratio reasoning to solve problems."
        indicators:
          - { id: "6.RP.1", level: "6", text: "Understand the concept of a ratio and use ratio language to describe a ratio relationship between two quantities. For example, \"The ratio of wings to beaks in the bird house at the zoo was 2:1, because for every 2 wings there was 1 beak.\" \"For every vote candidate A received, candidate C received nearly three votes.\"" }
          - { id: "6.RP.2", level: "6", text: "Understand the concept of a unit rate a/b associated with a ratio a:b with b ≠ 0, and use rate language in the context of a ratio relationship. For example, \"This recipe has a ratio of 3 cups of flour to 4 cups of sugar, so there is 3/4 cup of flour for each cup of sugar.\" \"We paid $75 for 15 hamburgers, which is a rate of $5 per hamburger.\"" }
          - { id: "6.RP.3", level: "6", text: "Use ratio and rate reasoning to solve real-world and mathematical problems, e.g., by reasoning about tables of equivalent ratios, tape diagrams, double number line diagrams, or equations. a. Make tables of equivalent ratios relating quantities with whole-number measurements, find missing values in the tables, and plot the pairs of values on the coordinate plane. Use tables to compare ratios. b. Solve unit rate problems including those involving unit pricing and constant speed. For example, if it took 7 hours to mow 4 lawns, then at that rate, how many lawns could be mowed in 35 hours? At what rate were lawns being mowed? c. Find a percent of a quantity as a rate per 100 (e.g., 30% of a quantity means 30/100 times the quantity); solve problems involving finding the whole, given a part and the percent. d. Use ratio reasoning to convert measurement units; manipulate and transform units appropriately when multiplying or dividing quantities." }
  - id: "6.NS"
    title: "The Number System (Grade 6)"
    standards:
      - id: "6.NS.A"
        text: "Apply and extend previous understandings of multiplication and division to divide fractions by fractions."
        indicators:
          - { id: "6.NS.1", level: "6", text: "Interpret and compute quotients of fractions, and solve word problems involving division of fractions by fractions, e.g., by using visual fraction models and equations to represent the problem. For example, create a story context for (2/3) ÷ (3/4) and use a visual fraction model to show the quotient; use the relationship between multiplication and division to explain that (2/3) ÷ (3/4) = 8/9 because 3/4 of 8/9 is 2/3. (In general, (a/b) ÷ (c/d) = ad/bc.) How much chocolate will each person get if 3 people share 1/2 lb of chocolate equally? How many 3/4-cup servings are in 2/3 of a cup of yogurt? How wide is a rectangular strip of land with length 3/4 mi and area 1/2 square mi?." }
      - id: "6.NS.B"
        text: "Compute fluently with multi-digit numbers and find common factors and multiples."
        indicators:
          - { id: "6.NS.2", level: "6", text: "Fluently divide multi-digit numbers using the standard algorithm." }
          - { id: "6.NS.3", level: "6", text: "Fluently add, subtract, multiply, and divide multi-digit decimals using the standard algorithm for each operation." }
          - { id: "6.NS.4", level: "6", text: "Find the greatest common factor of two whole numbers less than or equal to 100 and the least common multiple of two whole numbers less than or equal to 12. Use the distributive property to express a sum of two whole numbers 1-100 with a common factor as a multiple of a sum of two whole numbers with no common factor. For example, express 36 + 8 as 4 (9 + 2).." }
      - id: "6.NS.C"
        text: "Apply and extend previous understandings of numbers to the system of rational numbers."
        indicators:
          - { id: "6.NS.5", level: "6", text: "Understand that positive and negative numbers are used together to describe quantities having opposite directions or values (e.g., temperature above/below zero, elevation above/below sea level, credits/debits, positive/negative electric charge); use positive and negative numbers to represent quantities in real-world contexts, explaining the meaning of 0 in each situation." }
          - { id: "6.NS.6", level: "6", text: "Understand a rational number as a point on the number line. Extend number line diagrams and coordinate axes familiar from previous grades to represent points on the line and in the plane with negative number coordinates. a. Recognize opposite signs of numbers as indicating locations on opposite sides of 0 on the number line; recognize that the opposite of the opposite of a number is the number itself, e.g., -(-3) = 3, and that 0 is its own opposite. b. Understand signs of numbers in ordered pairs as indicating locations in quadrants of the coordinate plane; recognize that when two ordered pairs differ only by signs, the locations of the points are related by reflections across one or both axes. c. Find and position integers and other rational numbers on a horizontal or vertical number line diagram; find and position pairs of integers and other rational numbers on a coordinate plane." }
          - { id: "6.NS.7", level: "6", text: "Understand ordering and absolute value of rational numbers. a. Interpret statements of inequality as statements about the relative position of two numbers on a number line diagram. For example, interpret -3 > -7 as a statement that -3 is located to the right of -7 on a number line oriented from left to right. b. Write, interpret, and explain statements of order for rational numbers in real-world contexts. For example, write -3 °C > -7 °C to express the fact that -3 °C is warmer than -7 °C. c. Understand the absolute value of a rational number as its distance from 0 on the number line; interpret absolute value as magnitude for a positive or negative quantity in a real-world situation. For example, for an account balance of -30 dollars, write |-30| = 30 to describe the size of the debt in dollars. d. Distinguish comparisons of absolute value from statements about order. For example, recognize that an account balance less than -30 dollars represents a debt greater than 30 dollars." }
          - { id: "6.NS.8", level: "6", text: "Solve real-world and mathematical problems by graphing points in all four quadrants of the coordinate plane. Include use of coordinates and absolute value to find distances between points with the same first coordinate or the same second coordinate." }
  - id: "6.EE"
    title: "Expressions and Equations (Grade 6)"
    standards:
      - id: "6.EE.A"
        text: "Apply and extend previous understandings of arithmetic to algebraic expressions."
        indicators:
          - { id: "6.EE.1", level: "6", text: "Write and evaluate numerical expressions involving whole-number exponents." }
          - { id: "6.EE.2", level: "6", text: "Write, read, and evaluate expressions in which letters stand for numbers. a. Write expressions that record operations with numbers and with letters standing for numbers. For example, express the calculation \"Subtract y from 5\" as 5 - y. b. Identify parts of an expression using mathematical terms (sum, term, product, factor, quotient, coefficient); view one or more parts of an expression as a single entity. For example, describe the expression 2 (8 + 7) as a product of two factors; view (8 + 7) as both a single entity and a sum of two terms. c. Evaluate expressions at specific values of their variables. Include expressions that arise from formulas used in real-world problems. Perform arithmetic operations, including those involving whole-number exponents, in the conventional order when there are no parentheses to specify a particular order (Order of Operations). For example, use the formulas V = s^3 and A = 6 s^2 to find the volume and surface area of a cube with sides of length s = 1/2." }
          - { id: "6.EE.3", level: "6", text: "Apply the properties of operations to generate equivalent expressions. For example, apply the distributive property to the expression 3 (2 + x) to produce the equivalent expression 6 + 3x; apply the distributive property to the expression 24x + 18y to produce the equivalent expression 6 (4x + 3y); apply properties of operations to y + y + y to produce the equivalent expression 3y." }
          - { id: "6.EE.4", level: "6", text: "Identify when two expressions are equivalent (i.e., when the two expressions name the same number regardless of which value is substituted into them). For example, the expressions y + y + y and 3y are equivalent because they name the same number regardless of which number y stands for.." }
      - id: "6.EE.B"
        text: "Reason about and solve one-variable equations and inequalities."
        indicators:
          - { id: "6.EE.5", level: "6", text: "Understand solving an equation or inequality as a process of answering a question: which values from a specified set, if any, make the equation or inequality true? Use substitution to determine whether a given number in a specified set makes an equation or inequality true." }
          - { id: "6.EE.6", level: "6", text: "Use variables to represent numbers and write expressions when solving a real-world or mathematical problem; understand that a variable can represent an unknown number, or, depending on the purpose at hand, any number in a specified set." }
          - { id: "6.EE.7", level: "6", text: "Solve real-world and mathematical problems by writing and solving equations of the form x + p = q and px = q for cases in which p, q and x are all nonnegative rational numbers." }
          - { id: "6.EE.8", level: "6", text: "Write an inequality of the form x > c or x < c to represent a constraint or condition in a real-world or mathematical problem. Recognize that inequalities of the form x > c or x < c have infinitely many solutions; represent solutions of such inequalities on number line diagrams." }
      - id: "6.EE.C"
        text: "Represent and analyze quantitative relationships between dependent and independent variables."
        indicators:
          - { id: "6.EE.9", level: "6", text: "Use variables to represent two quantities in a real-world problem that change in relationship to one another; write an equation to express one quantity, thought of as the dependent variable, in terms of the other quantity, thought of as the independent variable. Analyze the relationship between the dependent and independent variables using graphs and tables, and relate these to the equation. For example, in a problem involving motion at constant speed, list and graph ordered pairs of distances and times, and write the equation d = 65t to represent the relationship between distance and time." }
  - id: "6.G"
    title: "Geometry (Grade 6)"
    standards:
      - id: "6.G.A"
        text: "Solve real-world and mathematical problems involving area, surface area, and volume."
        indicators:
          - { id: "6.G.1", level: "6", text: "Find the area of right triangles, other triangles, special quadrilaterals, and polygons by composing into rectangles or decomposing into triangles and other shapes; apply these techniques in the context of solving real-world and mathematical problems." }
          - { id: "6.G.2", level: "6", text: "Find the volume of a right rectangular prism with fractional edge lengths by packing it with unit cubes of the appropriate unit fraction edge lengths, and show that the volume is the same as would be found by multiplying the edge lengths of the prism. Apply the formulas V = l w h and V = b h to find volumes of right rectangular prisms with fractional edge lengths in the context of solving real-world and mathematical problems." }
          - { id: "6.G.3", level: "6", text: "Draw polygons in the coordinate plane given coordinates for the vertices; use coordinates to find the length of a side joining points with the same first coordinate or the same second coordinate. Apply these techniques in the context of solving real-world and mathematical problems." }
          - { id: "6.G.4", level: "6", text: "Represent three-dimensional figures using nets made up of rectangles and triangles, and use the nets to find the surface area of these figures. Apply these techniques in the context of solving real-world and mathematical problems." }
  - id: "6.SP"
    title: "Statistics and Probability (Grade 6)"
    standards:
      - id: "6.SP.A"
        text: "Develop understanding of statistical variability."
        indicators:
          - { id: "6.SP.1", level: "6", text: "Recognize a statistical question as one that anticipates variability in the data related to the question and accounts for it in the answers. For example, \"How old am I?\" is not a statistical question, but \"How old are the students in my school?\" is a statistical question because one anticipates variability in students' ages." }
          - { id: "6.SP.2", level: "6", text: "Understand that a set of data collected to answer a statistical question has a distribution which can be described by its center, spread, and overall shape." }
          - { id: "6.SP.3", level: "6", text: "Recognize that a measure of center for a numerical data set summarizes all of its values with a single number, while a measure of variation describes how its values vary with a single number." }
      - id: "6.SP.B"
        text: "Summarize and describe distributions."
        indicators:
          - { id: "6.SP.4", level: "6", text: "Display numerical data in plots on a number line, including dot plots, histograms, and box plots." }
          - { id: "6.SP.5", level: "6", text: "Summarize numerical data sets in relation to their context, such as by: a. Reporting the number of observations. b. Describing the nature of the attribute under investigation, including how it was measured and its units of measurement. c. Giving quantitative measures of center (median and/or mean) and variability (interquartile range and/or mean absolute deviation), as well as describing any overall pattern and any striking deviations from the overall pattern with reference to the context in which the data were gathered. d. Relating the choice of measures of center and variability to the shape of the data distribution and the context in which the data were gathered." }
  - id: "7.RP"
    title: "Ratios and Proportional Relationships (Grade 7)"
    standards:
      - id: "7.RP.A"
        text: "Analyze proportional relationships and use them to solve real-world and mathematical problems."
        indicators:
          - { id: "7.RP.1", level: "7", text: "Compute unit rates associated with ratios of fractions, including ratios of lengths, areas and other quantities measured in like or different units. For example, if a person walks 1/2 mile in each 1/4 hour, compute the unit rate as the complex fraction (1/2)/(1/4) miles per hour, equivalently 2 miles per hour." }
          - { id: "7.RP.2", level: "7", text: "Recognize and represent proportional relationships between quantities. a. Decide whether two quantities are in a proportional relationship, e.g., by testing for equivalent ratios in a table or graphing on a coordinate plane and observing whether the graph is a straight line through the origin. b. Identify the constant of proportionality (unit rate) in tables, graphs, equations, diagrams, and verbal descriptions of proportional relationships. c. Represent proportional relationships by equations. For example, if total cost t is proportional to the number n of items purchased at a constant price p, the relationship between the total cost and the number of items can be expressed as t = pn. d. Explain what a point (x, y) on the graph of a proportional relationship means in terms of the situation, with special attention to the points (0, 0) and (1, r) where r is the unit rate." }
          - { id: "7.RP.3", level: "7", text: "Use proportional relationships to solve multistep ratio and percent problems. Examples: simple interest, tax, markups and markdowns, gratuities and commissions, fees, percent increase and decrease, percent error." }
  - id: "7.NS"
    title: "The Number System (Grade 7)"
    standards:
      - id: "7.NS.A"
        text: "Apply and extend previous understandings of operations with fractions."
        indicators:
          - { id: "7.NS.1", level: "7", text: "Apply and extend previous understandings of addition and subtraction to add and subtract rational numbers; represent addition and subtraction on a horizontal or vertical number line diagram. a. Describe situations in which opposite quantities combine to make 0. For example, a hydrogen atom has 0 charge because its two constituents are oppositely charged. b. Understand p + q as the number located a distance |q| from p, in the positive or negative direction depending on whether q is positive or negative. Show that a number and its opposite have a sum of 0 (are additive inverses). Interpret sums of rational numbers by describing real-world contexts. c. Understand subtraction of rational numbers as adding the additive inverse, p - q = p + (-q). Show that the distance between two rational numbers on the number line is the absolute value of their difference, and apply this principle in real-world contexts. d. Apply properties of operations as strategies to add and subtract rational numbers." }
          - { id: "7.NS.2", level: "7", text: "Apply and extend previous understandings of multiplication and division and of fractions to multiply and divide rational numbers. a. Understand that multiplication is extended from fractions to rational numbers by requiring that operations continue to satisfy the properties of operations, particularly the distributive property, leading to products such as (-1)(-1) = 1 and the rules for multiplying signed numbers. Interpret products of rational numbers by describing real-world contexts. b. Understand that integers can be divided, provided that the divisor is not zero, and every quotient of integers (with non-zero divisor) is a rational number. If p and q are integers, then -(p/q) = (-p)/q = p/(-q). Interpret quotients of rational numbers by describing real-world contexts. c. Apply properties of operations as strategies to multiply and divide rational numbers. d. Convert a rational number to a decimal using long division; know that the decimal form of a rational number terminates in 0s or eventually repeats." }
          - { id: "7.NS.3", level: "7", text: "Solve real-world and mathematical problems involving the four operations with rational numbers." }
  - id: "7.EE"
    title: "Expressions and Equations (Grade 7)"
    standards:
      - id: "7.EE.A"
        text: "Use properties of operations to generate equivalent expressions."
        indicators:
          - { id: "7.EE.1", level: "7", text: "Apply properties of operations as strategies to add, subtract, factor, and expand linear expressions with rational coefficients." }
          - { id: "7.EE.2", level: "7", text: "Understand that rewriting an expression in different forms in a problem context can shed light on the problem and how the quantities in it are related. For example, a + 0.05a = 1.05a means that \"increase by 5%\" is the same as \"multiply by 1.05.\"" }
      - id: "7.EE.B"
        text: "Solve real-life and mathematical problems using numerical and algebraic expressions and equations."
        indicators:
          - { id: "7.EE.3", level: "7", text: "Solve multi-step real-life and mathematical problems posed with positive and negative rational numbers in any form (whole numbers, fractions, and decimals), using tools strategically. Apply properties of operations to calculate with numbers in any form; convert between forms as appropriate; and assess the reasonableness of answers using mental computation and estimation strategies. For example: If a woman making $25 an hour gets a 10% raise, she will make an additional 1/10 of her salary an hour, or $2.50, for a new salary of $27.50. If you want to place a towel bar 9 3/4 inches long in the center of a door that is 27 1/2 inches wide, you will need to place the bar about 9 inches from each edge; this estimate can be used as a check on the exact computation." }
          - { id: "7.EE.4", level: "7", text: "Use variables to represent quantities in a real-world or mathematical problem, and construct simple equations and inequalities to solve problems by reasoning about the quantities. a. Solve word problems leading to equations of the form px + q = r and p(x + q) = r, where p, q, and r are specific rational numbers. Solve equations of these forms fluently. Compare an algebraic solution to an arithmetic solution, identifying the sequence of the operations used in each approach. For example, the perimeter of a rectangle is 54 cm. Its length is 6 cm. What is its width? b. Solve word problems leading to inequalities of the form px + q > r or px + q < r, where p, q, and r are specific rational numbers. Graph the solution set of the inequality and interpret it in the context of the problem. For example: As a salesperson, you are paid $50 per week plus $3 per sale. This week you want your pay to be at least $100. Write an inequality for the number of sales you need to make, and describe the solutions." }
  - id: "7.G"
    title: "Geometry (Grade 7)"
    standards:
      - id: "7.G.A"
        text: "Draw construct, and describe geometrical figures and describe the relationships between them."
        indicators:
          - { id: "7.G.1", level: "7", text: "Solve problems involving scale drawings of geometric figures, including computing actual lengths and areas from a scale drawing and reproducing a scale drawing at a different scale." }
          - { id: "7.G.2", level: "7", text: "Draw (freehand, with ruler and protractor, and with technology) geometric shapes with given conditions. Focus on constructing triangles from three measures of angles or sides, noticing when the conditions determine a unique triangle, more than one triangle, or no triangle." }
          - { id: "7.G.3", level: "7", text: "Describe the two-dimensional figures that result from slicing three-dimensional figures, as in plane sections of right rectangular prisms and right rectangular pyramids." }
      - id: "7.G.B"
        text: "Solve real-life and mathematical problems involving angle measure, area, surface area, and volume."
        indicators:
          - { id: "7.G.4", level: "7", text: "Know the formulas for the area and circumference of a circle and use them to solve problems; give an informal derivation of the relationship between the circumference and area of a circle." }
          - { id: "7.G.5", level: "7", text: "Use facts about supplementary, complementary, vertical, and adjacent angles in a multi-step problem to write and solve simple equations for an unknown angle in a figure." }
          - { id: "7.G.6", level: "7", text: "Solve real-world and mathematical problems involving area, volume and surface area of two- and three-dimensional objects composed of triangles, quadrilaterals, polygons, cubes, and right prisms." }
  - id: "7.SP"
    title: "Statistics and Probability (Grade 7)"
    standards:
      - id: "7.SP.A"
        text: "Use random sampling to draw inferences about a population."
        indicators:
          - { id: "7.SP.1", level: "7", text: "Understand that statistics can be used to gain information about a population by examining a sample of the population; generalizations about a population from a sample are valid only if the sample is representative of that population. Understand that random sampling tends to produce representative samples and support valid inferences." }
          - { id: "7.SP.2", level: "7", text: "Use data from a random sample to draw inferences about a population with an unknown characteristic of interest. Generate multiple samples (or simulated samples) of the same size to gauge the variation in estimates or predictions. For example, estimate the mean word length in a book by randomly sampling words from the book; predict the winner of a school election based on randomly sampled survey data. Gauge how far off the estimate or prediction might be." }
      - id: "7.SP.B"
        text: "Draw informal comparative inferences about two populations."
        indicators:
          - { id: "7.SP.3", level: "7", text: "Informally assess the degree of visual overlap of two numerical data distributions with similar variabilities, measuring the difference between the centers by expressing it as a multiple of a measure of variability. For example, the mean height of players on the basketball team is 10 cm greater than the mean height of players on the soccer team, about twice the variability (mean absolute deviation) on either team; on a dot plot, the separation between the two distributions of heights is noticeable." }
          - { id: "7.SP.4", level: "7", text: "Use measures of center and measures of variability for numerical data from random samples to draw informal comparative inferences about two populations. For example, decide whether the words in a chapter of a seventh-grade science book are generally longer than the words in a chapter of a fourth-grade science book." }
      - id: "7.SP.C"
        text: "Investigate chance processes and develop, use, and evaluate probability models."
        indicators:
          - { id: "7.SP.5", level: "7", text: "Understand that the probability of a chance event is a number between 0 and 1 that expresses the likelihood of the event occurring. Larger numbers indicate greater likelihood. A probability near 0 indicates an unlikely event, a probability around 1/2 indicates an event that is neither unlikely nor likely, and a probability near 1 indicates a likely event." }
          - { id: "7.SP.6", level: "7", text: "Approximate the probability of a chance event by collecting data on the chance process that produces it and observing its long-run relative frequency, and predict the approximate relative frequency given the probability. For example, when rolling a number cube 600 times, predict that a 3 or 6 would be rolled roughly 200 times, but probably not exactly 200 times." }
          - { id: "7.SP.7", level: "7", text: "Develop a probability model and use it to find probabilities of events. Compare probabilities from a model to observed frequencies; if the agreement is not good, explain possible sources of the discrepancy. a. Develop a uniform probability model by assigning equal probability to all outcomes, and use the model to determine probabilities of events. For example, if a student is selected at random from a class, find the probability that Jane will be selected and the probability that a girl will be selected. b. Develop a probability model (which may not be uniform) by observing frequencies in data generated from a chance process. For example, find the approximate probability that a spinning penny will land heads up or that a tossed paper cup will land open-end down. Do the outcomes for the spinning penny appear to be equally likely based on the observed frequencies?" }
          - { id: "7.SP.8", level: "7", text: "Find probabilities of compound events using organized lists, tables, tree diagrams, and simulation. a. Understand that, just as with simple events, the probability of a compound event is the fraction of outcomes in the sample space for which the compound event occurs. b. Represent sample spaces for compound events using methods such as organized lists, tables and tree diagrams. For an event described in everyday language (e.g., \"rolling double sixes\"), identify the outcomes in the sample space which compose the event. c. Design and use a simulation to generate frequencies for compound events. For example, use random digits as a simulation tool to approximate the answer to the question: If 40% of donors have type A blood, what is the probability that it will take at least 4 donors to find one with type A blood?" }
  - id: "8.NS"
    title: "The Number System (Grade 8)"
    standards:
      - id: "8.NS.A"
        text: "Know that there are numbers that are not rational, and approximate them by rational numbers."
        indicators:
          - { id: "8.NS.1", level: "8", text: "Know that numbers that are not rational are called irrational. Understand informally that every number has a decimal expansion; for rational numbers show that the decimal expansion repeats eventually, and convert a decimal expansion which repeats eventually into a rational number." }
          - { id: "8.NS.2", level: "8", text: "Use rational approximations of irrational numbers to compare the size of irrational numbers, locate them approximately on a number line diagram, and estimate the value of expressions (e.g., π^2). For example, by truncating the decimal expansion of √2, show that √2 is between 1 and 2, then between 1.4 and 1.5, and explain how to continue on to get better approximations." }
  - id: "8.EE"
    title: "Expressions and Equations (Grade 8)"
    standards:
      - id: "8.EE.A"
        text: "Work with radicals and integer exponents."
        indicators:
          - { id: "8.EE.1", level: "8", text: "Know and apply the properties of integer exponents to generate equivalent numerical expressions. For example, 3^2 × 3^(-5) = 3^(-3) = 1/3^3 = 1/27." }
          - { id: "8.EE.2", level: "8", text: "Use square root and cube root symbols to represent solutions to equations of the form x^2 = p and x^3 = p, where p is a positive rational number. Evaluate square roots of small perfect squares and cube roots of small perfect cubes. Know that √2 is irrational." }
          - { id: "8.EE.3", level: "8", text: "Use numbers expressed in the form of a single digit times an integer power of 10 to estimate very large or very small quantities, and to express how many times as much one is than the other. For example, estimate the population of the United States as 3 × 10^8 and the population of the world as 7 × 10^9, and determine that the world population is more than 20 times larger." }
          - { id: "8.EE.4", level: "8", text: "Perform operations with numbers expressed in scientific notation, including problems where both decimal and scientific notation are used. Use scientific notation and choose units of appropriate size for measurements of very large or very small quantities (e.g., use millimeters per year for seafloor spreading). Interpret scientific notation that has been generated by technology" }
      - id: "8.EE.B"
        text: "Understand the connections between proportional relationships, lines, and linear equations."
        indicators:
          - { id: "8.EE.5", level: "8", text: "Graph proportional relationships, interpreting the unit rate as the slope of the graph. Compare two different proportional relationships represented in different ways. For example, compare a distance-time graph to a distance-time equation to determine which of two moving objects has greater speed." }
          - { id: "8.EE.6", level: "8", text: "Use similar triangles to explain why the slope m is the same between any two distinct points on a non-vertical line in the coordinate plane; derive the equation y = mx for a line through the origin and the equation y = mx + b for a line intercepting the vertical axis at b." }
      - id: "8.EE.C"
        text: "Analyze and solve linear equations and pairs of simultaneous linear equations."
        indicators:
          - { id: "8.EE.7", level: "8", text: "Solve linear equations in one variable. a. Give examples of linear equations in one variable with one solution, infinitely many solutions, or no solutions. Show which of these possibilities is the case by successively transforming the given equation into simpler forms, until an equivalent equation of the form x = a, a = a, or a = b results (where a and b are different numbers). b. Solve linear equations with rational number coefficients, including equations whose solutions require expanding expressions using the distributive property and collecting like terms." }
          - { id: "8.EE.8", level: "8", text: "Analyze and solve pairs of simultaneous linear equations. a. Understand that solutions to a system of two linear equations in two variables correspond to points of intersection of their graphs, because points of intersection satisfy both equations simultaneously. b. Solve systems of two linear equations in two variables algebraically, and estimate solutions by graphing the equations. Solve simple cases by inspection. For example, 3x + 2y = 5 and 3x + 2y = 6 have no solution because 3x + 2y cannot simultaneously be 5 and 6. c. Solve real-world and mathematical problems leading to two linear equations in two variables. For example, given coordinates for two pairs of points, determine whether the line through the first pair of points intersects the line through the second pair." }
  - id: "8.F"
    title: "Functions (Grade 8)"
    standards:
      - id: "8.F.A"
        text: "Define, evaluate, and compare functions."
        indicators:
          - { id: "8.F.1", level: "8", text: "Understand that a function is a rule that assigns to each input exactly one output. The graph of a function is the set of ordered pairs consisting of an input and the corresponding output." }
          - { id: "8.F.2", level: "8", text: "Compare properties of two functions each represented in a different way (algebraically, graphically, numerically in tables, or by verbal descriptions). For example, given a linear function represented by a table of values and a linear function represented by an algebraic expression, determine which function has the greater rate of change." }
          - { id: "8.F.3", level: "8", text: "Interpret the equation y = mx + b as defining a linear function, whose graph is a straight line; give examples of functions that are not linear. For example, the function A = s^2 giving the area of a square as a function of its side length is not linear because its graph contains the points (1,1), (2,4) and (3,9), which are not on a straight line." }
      - id: "8.F.B"
        text: "Use functions to model relationships between quantities."
        indicators:
          - { id: "8.F.4", level: "8", text: "Construct a function to model a linear relationship between two quantities. Determine the rate of change and initial value of the function from a description of a relationship or from two (x, y) values, including reading these from a table or from a graph. Interpret the rate of change and initial value of a linear function in terms of the situation it models, and in terms of its graph or a table of values." }
          - { id: "8.F.5", level: "8", text: "Describe qualitatively the functional relationship between two quantities by analyzing a graph (e.g., where the function is increasing or decreasing, linear or nonlinear). Sketch a graph that exhibits the qualitative features of a function that has been described verbally." }
  - id: "8.G"
    title: "Geometry (Grade 8)"
    standards:
      - id: "8.G.A"
        text: "Understand congruence and similarity using physical models, transparencies, or geometry software."
        indicators:
          - { id: "8.G.1", level: "8", text: "Verify experimentally the properties of rotations, reflections, and translations: a. Lines are taken to lines, and line segments to line segments of the same length. b. Angles are taken to angles of the same measure. c. Parallel lines are taken to parallel lines." }
          - { id: "8.G.2", level: "8", text: "Understand that a two-dimensional figure is congruent to another if the second can be obtained from the first by a sequence of rotations, reflections, and translations; given two congruent figures, describe a sequence that exhibits the congruence between them." }
          - { id: "8.G.3", level: "8", text: "Describe the effect of dilations, translations, rotations, and reflections on two-dimensional figures using coordinates." }
          - { id: "8.G.4", level: "8", text: "Understand that a two-dimensional figure is similar to another if the second can be obtained from the first by a sequence of rotations, reflections, translations, and dilations; given two similar two-dimensional figures, describe a sequence that exhibits the similarity between them." }
          - { id: "8.G.5", level: "8", text: "Use informal arguments to establish facts about the angle sum and exterior angle of triangles, about the angles created when parallel lines are cut by a transversal, and the angle-angle criterion for similarity of triangles. For example, arrange three copies of the same triangle so that the sum of the three angles appears to form a line, and give an argument in terms of transversals why this is so." }
      - id: "8.G.B"
        text: "Understand and apply the Pythagorean Theorem."
        indicators:
          - { id: "8.G.6", level: "8", text: "Explain a proof of the Pythagorean Theorem and its converse." }
          - { id: "8.G.7", level: "8", text: "Apply the Pythagorean Theorem to determine unknown side lengths in right triangles in real-world and mathematical problems in two and three dimensions." }
          - { id: "8.G.8", level: "8", text: "Apply the Pythagorean Theorem to find the distance between two points in a coordinate system." }
      - id: "8.G.C"
        text: "Solve real-world and mathematical problems involving volume of cylinders, cones, and spheres."
        indicators:
          - { id: "8.G.9", level: "8", text: "Know the formulas for the volumes of cones, cylinders, and spheres and use them to solve real-world and mathematical problems." }
  - id: "8.SP"
    title: "Statistics and Probability (Grade 8)"
    standards:
      - id: "8.SP.A"
        text: "Investigate patterns of association in bivariate data."
        indicators:
          - { id: "8.SP.1", level: "8", text: "Construct and interpret scatter plots for bivariate measurement data to investigate patterns of association between two quantities. Describe patterns such as clustering, outliers, positive or negative association, linear association, and nonlinear association." }
          - { id: "8.SP.2", level: "8", text: "Know that straight lines are widely used to model relationships between two quantitative variables. For scatter plots that suggest a linear association, informally fit a straight line, and informally assess the model fit by judging the closeness of the data points to the line." }
          - { id: "8.SP.3", level: "8", text: "Use the equation of a linear model to solve problems in the context of bivariate measurement data, interpreting the slope and intercept. For example, in a linear model for a biology experiment, interpret a slope of 1.5 cm/hr as meaning that an additional hour of sunlight each day is associated with an additional 1.5 cm in mature plant height." }
          - { id: "8.SP.4", level: "8", text: "Understand that patterns of association can also be seen in bivariate categorical data by displaying frequencies and relative frequencies in a two-way table. Construct and interpret a two-way table summarizing data on two categorical variables collected from the same subjects. Use relative frequencies calculated for rows or columns to describe possible association between the two variables. For example, collect data from students in your class on whether or not they have a curfew on school nights and whether or not they have assigned chores at home. Is there evidence that those who have a curfew also tend to have chores?" }
  - id: "N-RN"
    title: "The Real Number System (High School: Number and Quantity)"
    standards:
      - id: "N-RN.A"
        text: "Extend the properties of exponents to rational exponents."
        indicators:
          - { id: "N-RN.1", level: "HS", text: "Explain how the definition of the meaning of rational exponents follows from extending the properties of integer exponents to those values, allowing for a notation for radicals in terms of rational exponents. For example, we define 5^(1/3) to be the cube root of 5 because we want (5^(1/3))^3 = 5^((1/3)3) to hold, so (5^(1/3))^3 must equal 5." }
          - { id: "N-RN.2", level: "HS", text: "Rewrite expressions involving radicals and rational exponents using the properties of exponents." }
      - id: "N-RN.B"
        text: "Use properties of rational and irrational numbers."
        indicators:
          - { id: "N-RN.3", level: "HS", text: "Explain why the sum or product of two rational numbers is rational; that the sum of a rational number and an irrational number is irrational; and that the product of a nonzero rational number and an irrational number is irrational." }
  - id: "N-Q"
    title: "Quantities★ (High School: Number and Quantity)"
    standards:
      - id: "N-Q.A"
        text: "Reason quantitatively and use units to solve problems."
        indicators:
          - { id: "N-Q.1", level: "HS", text: "Use units as a way to understand problems and to guide the solution of multi-step problems; choose and interpret units consistently in formulas; choose and interpret the scale and the origin in graphs and data displays." }
          - { id: "N-Q.2", level: "HS", text: "Define appropriate quantities for the purpose of descriptive modeling." }
          - { id: "N-Q.3", level: "HS", text: "Choose a level of accuracy appropriate to limitations on measurement when reporting quantities." }
  - id: "N-CN"
    title: "The Complex Number System (High School: Number and Quantity)"
    standards:
      - id: "N-CN.A"
        text: "Perform arithmetic operations with complex numbers."
        indicators:
          - { id: "N-CN.1", level: "HS", text: "Know there is a complex number i such that i^2 = -1, and every complex number has the form a + bi with a and b real." }
          - { id: "N-CN.2", level: "HS", text: "Use the relation i^2 = -1 and the commutative, associative, and distributive properties to add, subtract, and multiply complex numbers." }
          - { id: "N-CN.3", level: "HS", text: "(+) Find the conjugate of a complex number; use conjugates to find moduli and quotients of complex numbers." }
      - id: "N-CN.B"
        text: "Represent complex numbers and their operations on the complex plane."
        indicators:
          - { id: "N-CN.4", level: "HS", text: "(+) Represent complex numbers on the complex plane in rectangular and polar form (including real and imaginary numbers), and explain why the rectangular and polar forms of a given complex number represent the same number." }
          - { id: "N-CN.5", level: "HS", text: "(+) Represent addition, subtraction, multiplication, and conjugation of complex numbers geometrically on the complex plane; use properties of this representation for computation. For example, (-1 + √3 i)^3 = 8 because (-1 + √3 i) has modulus 2 and argument 120°." }
          - { id: "N-CN.6", level: "HS", text: "(+) Calculate the distance between numbers in the complex plane as the modulus of the difference, and the midpoint of a segment as the average of the numbers at its endpoints." }
      - id: "N-CN.C"
        text: "Use complex numbers in polynomial identities and equations."
        indicators:
          - { id: "N-CN.7", level: "HS", text: "Solve quadratic equations with real coefficients that have complex solutions." }
          - { id: "N-CN.8", level: "HS", text: "(+) Extend polynomial identities to the complex numbers. For example, rewrite x^2 + 4 as (x + 2i)(x - 2i)." }
          - { id: "N-CN.9", level: "HS", text: "(+) Know the Fundamental Theorem of Algebra; show that it is true for quadratic polynomials." }
  - id: "N-VM"
    title: "Vector and Matrix Quantities (High School: Number and Quantity)"
    standards:
      - id: "N-VM.A"
        text: "Represent and model with vector quantities."
        indicators:
          - { id: "N-VM.1", level: "HS", text: "(+) Recognize vector quantities as having both magnitude and direction. Represent vector quantities by directed line segments, and use appropriate symbols for vectors and their magnitudes (e.g., v, |v|, ||v||, v)." }
          - { id: "N-VM.2", level: "HS", text: "(+) Find the components of a vector by subtracting the coordinates of an initial point from the coordinates of a terminal point." }
          - { id: "N-VM.3", level: "HS", text: "(+) Solve problems involving velocity and other quantities that can be represented by vectors." }
      - id: "N-VM.B"
        text: "Perform operations on vectors."
        indicators:
          - { id: "N-VM.4", level: "HS", text: "(+) Add and subtract vectors. a. Add vectors end-to-end, component-wise, and by the parallelogram rule. Understand that the magnitude of a sum of two vectors is typically not the sum of the magnitudes. b. Given two vectors in magnitude and direction form, determine the magnitude and direction of their sum. c. Understand vector subtraction v - w as v + (-w), where -w is the additive inverse of w, with the same magnitude as w and pointing in the opposite direction. Represent vector subtraction graphically by connecting the tips in the appropriate order, and perform vector subtraction component-wise." }
          - { id: "N-VM.5", level: "HS", text: "(+) Multiply a vector by a scalar. a. Represent scalar multiplication graphically by scaling vectors and possibly reversing their direction; perform scalar multiplication component-wise, e.g., as c(vx, vy) = (cvx, cvy). b. Compute the magnitude of a scalar multiple cv using ||cv|| = |c|v. Compute the direction of cv knowing that when |c|v ≠ 0, the direction of cv is either along v (for c > 0) or against v (for c < 0)." }
      - id: "N-VM.C"
        text: "Perform operations on matrices and use matrices in applications."
        indicators:
          - { id: "N-VM.6", level: "HS", text: "(+) Use matrices to represent and manipulate data, e.g., to represent payoffs or incidence relationships in a network." }
          - { id: "N-VM.7", level: "HS", text: "(+) Multiply matrices by scalars to produce new matrices, e.g., as when all of the payoffs in a game are doubled." }
          - { id: "N-VM.8", level: "HS", text: "(+) Add, subtract, and multiply matrices of appropriate dimensions." }
          - { id: "N-VM.9", level: "HS", text: "(+) Understand that, unlike multiplication of numbers, matrix multiplication for square matrices is not a commutative operation, but still satisfies the associative and distributive properties." }
          - { id: "N-VM.10", level: "HS", text: "(+) Understand that the zero and identity matrices play a role in matrix addition and multiplication similar to the role of 0 and 1 in the real numbers. The determinant of a square matrix is nonzero if and only if the matrix has a multiplicative inverse." }
          - { id: "N-VM.11", level: "HS", text: "(+) Multiply a vector (regarded as a matrix with one column) by a matrix of suitable dimensions to produce another vector. Work with matrices as transformations of vectors." }
          - { id: "N-VM.12", level: "HS", text: "(+) Work with 2 × 2 matrices as transformations of the plane, and interpret the absolute value of the determinant in terms of area." }
  - id: "A-SSE"
    title: "Seeing Structure in Expressions (High School: Algebra)"
    standards:
      - id: "A-SSE.A"
        text: "Interpret the structure of expressions."
        indicators:
          - { id: "A-SSE.1", level: "HS", text: "Interpret expressions that represent a quantity in terms of its context.★ a. Interpret parts of an expression, such as terms, factors, and coefficients. b. Interpret complicated expressions by viewing one or more of their parts as a single entity. For example, interpret P(1+r)^n as the product of P and a factor not depending on P." }
          - { id: "A-SSE.2", level: "HS", text: "Use the structure of an expression to identify ways to rewrite it. For example, see x^4 - y^4 as (x^2)^2 - (y^2)^2, thus recognizing it as a difference of squares that can be factored as (x^2 - y^2)(x^2 + y^2)." }
      - id: "A-SSE.B"
        text: "Write expressions in equivalent forms to solve problems."
        indicators:
          - { id: "A-SSE.3", level: "HS", text: "Choose and produce an equivalent form of an expression to reveal and explain properties of the quantity represented by the expression.★ a. Factor a quadratic expression to reveal the zeros of the function it defines. b. Complete the square in a quadratic expression to reveal the maximum or minimum value of the function it defines. c. Use the properties of exponents to transform expressions for exponential functions. For example the expression 1.15^t can be rewritten as (1.15^(1/12))^(12t) ≈ 1.012^(12t) to reveal the approximate equivalent monthly interest rate if the annual rate is 15%." }
          - { id: "A-SSE.4", level: "HS", text: "Derive the formula for the sum of a finite geometric series (when the common ratio is not 1), and use the formula to solve problems. For example, calculate mortgage payments.★" }
  - id: "A-APR"
    title: "Arithmetic with Polynomials and Rational Expressions (High School: Algebra)"
    standards:
      - id: "A-APR.A"
        text: "Perform arithmetic operations on polynomials."
        indicators:
          - { id: "A-APR.1", level: "HS", text: "Understand that polynomials form a system analogous to the integers, namely, they are closed under the operations of addition, subtraction, and multiplication; add, subtract, and multiply polynomials." }
      - id: "A-APR.B"
        text: "Understand the relationship between zeros and factors of polynomials."
        indicators:
          - { id: "A-APR.2", level: "HS", text: "Know and apply the Remainder Theorem: For a polynomial p(x) and a number a, the remainder on division by x - a is p(a), so p(a) = 0 if and only if (x - a) is a factor of p(x)." }
          - { id: "A-APR.3", level: "HS", text: "Identify zeros of polynomials when suitable factorizations are available, and use the zeros to construct a rough graph of the function defined by the polynomial." }
      - id: "A-APR.C"
        text: "Use polynomial identities to solve problems."
        indicators:
          - { id: "A-APR.4", level: "HS", text: "Prove polynomial identities and use them to describe numerical relationships. For example, the polynomial identity (x^2 + y^2)^2 = (x^2 - y^2)^2 + (2xy)^2 can be used to generate Pythagorean triples." }
          - { id: "A-APR.5", level: "HS", text: "(+) Know and apply the Binomial Theorem for the expansion of (x + y)n in powers of x and y for a positive integer n, where x and y are any numbers, with coefficients determined for example by Pascal's Triangle." }
      - id: "A-APR.D"
        text: "Rewrite rational expressions."
        indicators:
          - { id: "A-APR.6", level: "HS", text: "Rewrite simple rational expressions in different forms; write a(x)/b(x) in the form q(x) + r(x)/b(x), where a(x), b(x), q(x), and r(x) are polynomials with the degree of r(x) less than the degree of b(x), using inspection, long division, or, for the more complicated examples, a computer algebra system." }
          - { id: "A-APR.7", level: "HS", text: "(+) Understand that rational expressions form a system analogous to the rational numbers, closed under addition, subtraction, multiplication, and division by a nonzero rational expression; add, subtract, multiply, and divide rational expressions." }
  - id: "A-CED"
    title: "Creating Equations★ (High School: Algebra)"
    standards:
      - id: "A-CED.A"
        text: "Create equations that describe numbers or relationships."
        indicators:
          - { id: "A-CED.1", level: "HS", text: "Create equations and inequalities in one variable and use them to solve problems. Include equations arising from linear and quadratic functions, and simple rational and exponential functions." }
          - { id: "A-CED.2", level: "HS", text: "Create equations in two or more variables to represent relationships between quantities; graph equations on coordinate axes with labels and scales." }
          - { id: "A-CED.3", level: "HS", text: "Represent constraints by equations or inequalities, and by systems of equations and/or inequalities, and interpret solutions as viable or nonviable options in a modeling context. For example, represent inequalities describing nutritional and cost constraints on combinations of different foods." }
          - { id: "A-CED.4", level: "HS", text: "Rearrange formulas to highlight a quantity of interest, using the same reasoning as in solving equations. For example, rearrange Ohm's law V = IR to highlight resistance R." }
  - id: "A-REI"
    title: "Reasoning with Equations and Inequalities (High School: Algebra)"
    standards:
      - id: "A-REI.A"
        text: "Understand solving equations as a process of reasoning and explain the reasoning."
        indicators:
          - { id: "A-REI.1", level: "HS", text: "Explain each step in solving a simple equation as following from the equality of numbers asserted at the previous step, starting from the assumption that the original equation has a solution. Construct a viable argument to justify a solution method." }
          - { id: "A-REI.2", level: "HS", text: "Solve simple rational and radical equations in one variable, and give examples showing how extraneous solutions may arise." }
      - id: "A-REI.B"
        text: "Solve equations and inequalities in one variable."
        indicators:
          - { id: "A-REI.3", level: "HS", text: "Solve linear equations and inequalities in one variable, including equations with coefficients represented by letters." }
          - { id: "A-REI.4", level: "HS", text: "Solve quadratic equations in one variable. a. Use the method of completing the square to transform any quadratic equation in x into an equation of the form (x - p)^2 = q that has the same solutions. Derive the quadratic formula from this form. b. Solve quadratic equations by inspection (e.g., for x^2 = 49), taking square roots, completing the square, the quadratic formula and factoring, as appropriate to the initial form of the equation. Recognize when the quadratic formula gives complex solutions and write them as a ± bi for real numbers a and b." }
      - id: "A-REI.C"
        text: "Solve systems of equations."
        indicators:
          - { id: "A-REI.5", level: "HS", text: "Prove that, given a system of two equations in two variables, replacing one equation by the sum of that equation and a multiple of the other produces a system with the same solutions." }
          - { id: "A-REI.6", level: "HS", text: "Solve systems of linear equations exactly and approximately (e.g., with graphs), focusing on pairs of linear equations in two variables." }
          - { id: "A-REI.7", level: "HS", text: "Solve a simple system consisting of a linear equation and a quadratic equation in two variables algebraically and graphically. For example, find the points of intersection between the line y = -3x and the circle x^2 + y^2 = 3." }
          - { id: "A-REI.8", level: "HS", text: "(+) Represent a system of linear equations as a single matrix equation in a vector variable." }
          - { id: "A-REI.9", level: "HS", text: "(+) Find the inverse of a matrix if it exists and use it to solve systems of linear equations (using technology for matrices of dimension 3 × 3 or greater)." }
      - id: "A-REI.D"
        text: "Represent and solve equations and inequalities graphically."
        indicators:
          - { id: "A-REI.10", level: "HS", text: "Understand that the graph of an equation in two variables is the set of all its solutions plotted in the coordinate plane, often forming a curve (which could be a line)." }
          - { id: "A-REI.11", level: "HS", text: "Explain why the x-coordinates of the points where the graphs of the equations y = f(x) and y = g(x) intersect are the solutions of the equation f(x) = g(x); find the solutions approximately, e.g., using technology to graph the functions, make tables of values, or find successive approximations. Include cases where f(x) and/or g(x) are linear, polynomial, rational, absolute value, exponential, and logarithmic functions.★" }
          - { id: "A-REI.12", level: "HS", text: "Graph the solutions to a linear inequality in two variables as a half-plane (excluding the boundary in the case of a strict inequality), and graph the solution set to a system of linear inequalities in two variables as the intersection of the corresponding half-planes." }
  - id: "F-IF"
    title: "Interpreting Functions (High School: Functions)"
    standards:
      - id: "F-IF.A"
        text: "Understand the concept of a function and use function notation."
        indicators:
          - { id: "F-IF.1", level: "HS", text: "Understand that a function from one set (called the domain) to another set (called the range) assigns to each element of the domain exactly one element of the range. If f is a function and x is an element of its domain, then f(x) denotes the output of f corresponding to the input x. The graph of f is the graph of the equation y = f(x)." }
          - { id: "F-IF.2", level: "HS", text: "Use function notation, evaluate functions for inputs in their domains, and interpret statements that use function notation in terms of a context." }
          - { id: "F-IF.3", level: "HS", text: "Recognize that sequences are functions, sometimes defined recursively, whose domain is a subset of the integers. For example, the Fibonacci sequence is defined recursively by f(0) = f(1) = 1, f(n+1) = f(n) + f(n-1) for n ≥ 1." }
      - id: "F-IF.B"
        text: "Interpret functions that arise in applications in terms of the context."
        indicators:
          - { id: "F-IF.4", level: "HS", text: "For a function that models a relationship between two quantities, interpret key features of graphs and tables in terms of the quantities, and sketch graphs showing key features given a verbal description of the relationship. Key features include: intercepts; intervals where the function is increasing, decreasing, positive, or negative; relative maximums and minimums; symmetries; end behavior; and periodicity.★" }
          - { id: "F-IF.5", level: "HS", text: "Relate the domain of a function to its graph and, where applicable, to the quantitative relationship it describes. For example, if the function h(n) gives the number of person-hours it takes to assemble n engines in a factory, then the positive integers would be an appropriate domain for the function.★" }
          - { id: "F-IF.6", level: "HS", text: "Calculate and interpret the average rate of change of a function (presented symbolically or as a table) over a specified interval. Estimate the rate of change from a graph.★" }
      - id: "F-IF.C"
        text: "Analyze functions using different representations."
        indicators:
          - { id: "F-IF.7", level: "HS", text: "Graph functions expressed symbolically and show key features of the graph, by hand in simple cases and using technology for more complicated cases.★ a. Graph linear and quadratic functions and show intercepts, maxima, and minima. b. Graph square root, cube root, and piecewise-defined functions, including step functions and absolute value functions. c. Graph polynomial functions, identifying zeros when suitable factorizations are available, and showing end behavior. d. (+) Graph rational functions, identifying zeros and asymptotes when suitable factorizations are available, and showing end behavior. e. Graph exponential and logarithmic functions, showing intercepts and end behavior, and trigonometric functions, showing period, midline, and amplitude." }
          - { id: "F-IF.8", level: "HS", text: "Write a function defined by an expression in different but equivalent forms to reveal and explain different properties of the function. a. Use the process of factoring and completing the square in a quadratic function to show zeros, extreme values, and symmetry of the graph, and interpret these in terms of a context. b. Use the properties of exponents to interpret expressions for exponential functions. For example, identify percent rate of change in functions such as y = (1.02)^t, y = (0.97)^t, y = (1.01)^(12t), y = (1.2)^(t/10), and classify them as representing exponential growth or decay." }
          - { id: "F-IF.9", level: "HS", text: "Compare properties of two functions each represented in a different way (algebraically, graphically, numerically in tables, or by verbal descriptions). For example, given a graph of one quadratic function and an algebraic expression for another, say which has the larger maximum." }
  - id: "F-BF"
    title: "Building Functions (High School: Functions)"
    standards:
      - id: "F-BF.A"
        text: "Build a function that models a relationship between two quantities."
        indicators:
          - { id: "F-BF.1", level: "HS", text: "Write a function that describes a relationship between two quantities.★ a. Determine an explicit expression, a recursive process, or steps for calculation from a context. b. Combine standard function types using arithmetic operations. For example, build a function that models the temperature of a cooling body by adding a constant function to a decaying exponential, and relate these functions to the model. c. (+) Compose functions. For example, if T(y) is the temperature in the atmosphere as a function of height, and h(t) is the height of a weather balloon as a function of time, then T(h(t)) is the temperature at the location of the weather balloon as a function of time." }
          - { id: "F-BF.2", level: "HS", text: "Write arithmetic and geometric sequences both recursively and with an explicit formula, use them to model situations, and translate between the two forms.★" }
      - id: "F-BF.B"
        text: "Build new functions from existing functions."
        indicators:
          - { id: "F-BF.3", level: "HS", text: "Identify the effect on the graph of replacing f(x) by f(x) + k, k f(x), f(kx), and f(x + k) for specific values of k (both positive and negative); find the value of k given the graphs. Experiment with cases and illustrate an explanation of the effects on the graph using technology. Include recognizing even and odd functions from their graphs and algebraic expressions for them." }
          - { id: "F-BF.4", level: "HS", text: "Find inverse functions. a. Solve an equation of the form f(x) = c for a simple function f that has an inverse and write an expression for the inverse. For example, f(x) =2 x^3 or f(x) = (x+1)/(x-1) for x ≠ 1. b. (+) Verify by composition that one function is the inverse of another. c. (+) Read values of an inverse function from a graph or a table, given that the function has an inverse. d. (+) Produce an invertible function from a non-invertible function by restricting the domain." }
          - { id: "F-BF.5", level: "HS", text: "(+) Understand the inverse relationship between exponents and logarithms and use this relationship to solve problems involving logarithms and exponents." }
  - id: "F-LE"
    title: "Linear, Quadratic, and Exponential Models★ (High School: Functions)"
    standards:
      - id: "F-LE.A"
        text: "Construct and compare linear, quadratic, and exponential models and solve problems."
        indicators:
          - { id: "F-LE.1", level: "HS", text: "Distinguish between situations that can be modeled with linear functions and with exponential functions. a. Prove that linear functions grow by equal differences over equal intervals, and that exponential functions grow by equal factors over equal intervals. b. Recognize situations in which one quantity changes at a constant rate per unit interval relative to another. c. Recognize situations in which a quantity grows or decays by a constant percent rate per unit interval relative to another." }
          - { id: "F-LE.2", level: "HS", text: "Construct linear and exponential functions, including arithmetic and geometric sequences, given a graph, a description of a relationship, or two input-output pairs (include reading these from a table)." }
          - { id: "F-LE.3", level: "HS", text: "Observe using graphs and tables that a quantity increasing exponentially eventually exceeds a quantity increasing linearly, quadratically, or (more generally) as a polynomial function." }
          - { id: "F-LE.4", level: "HS", text: "For exponential models, express as a logarithm the solution to ab^(ct) = d where a, c, and d are numbers and the base b is 2, 10, or e; evaluate the logarithm using technology." }
      - id: "F-LE.B"
        text: "Interpret expressions for functions in terms of the situation they model."
        indicators:
          - { id: "F-LE.5", level: "HS", text: "Interpret the parameters in a linear or exponential function in terms of a context." }
  - id: "F-TF"
    title: "Trigonometric Functions (High School: Functions)"
    standards:
      - id: "F-TF.A"
        text: "Extend the domain of trigonometric functions using the unit circle."
        indicators:
          - { id: "F-TF.1", level: "HS", text: "Understand radian measure of an angle as the length of the arc on the unit circle subtended by the angle." }
          - { id: "F-TF.2", level: "HS", text: "Explain how the unit circle in the coordinate plane enables the extension of trigonometric functions to all real numbers, interpreted as radian measures of angles traversed counterclockwise around the unit circle." }
          - { id: "F-TF.3", level: "HS", text: "(+) Use special triangles to determine geometrically the values of sine, cosine, tangent for π/3, π/4 and π/6, and use the unit circle to express the values of sine, cosine, and tangent for x, π + x, and 2π - x in terms of their values for x, where x is any real number." }
          - { id: "F-TF.4", level: "HS", text: "(+) Use the unit circle to explain symmetry (odd and even) and periodicity of trigonometric functions." }
      - id: "F-TF.B"
        text: "Model periodic phenomena with trigonometric functions."
        indicators:
          - { id: "F-TF.5", level: "HS", text: "Choose trigonometric functions to model periodic phenomena with specified amplitude, frequency, and midline.★" }
          - { id: "F-TF.6", level: "HS", text: "(+) Understand that restricting a trigonometric function to a domain on which it is always increasing or always decreasing allows its inverse to be constructed." }
          - { id: "F-TF.7", level: "HS", text: "(+) Use inverse functions to solve trigonometric equations that arise in modeling contexts; evaluate the solutions using technology, and interpret them in terms of the context.★" }
      - id: "F-TF.C"
        text: "Prove and apply trigonometric identities."
        indicators:
          - { id: "F-TF.8", level: "HS", text: "Prove the Pythagorean identity sin^2(θ) + cos^2(θ) = 1 and use it to find sin(θ), cos(θ), or tan(θ) given sin(θ), cos(θ), or tan(θ) and the quadrant of the angle." }
          - { id: "F-TF.9", level: "HS", text: "(+) Prove the addition and subtraction formulas for sine, cosine, and tangent and use them to solve problems." }
  - id: "G-CO"
    title: "Congruence (High School: Geometry)"
    standards:
      - id: "G-CO.A"
        text: "Experiment with transformations in the plane"
        indicators:
          - { id: "G-CO.1", level: "HS", text: "Know precise definitions of angle, circle, perpendicular line, parallel line, and line segment, based on the undefined notions of point, line, distance along a line, and distance around a circular arc." }
          - { id: "G-CO.2", level: "HS", text: "Represent transformations in the plane using, e.g., transparencies and geometry software; describe transformations as functions that take points in the plane as inputs and give other points as outputs. Compare transformations that preserve distance and angle to those that do not (e.g., translation versus horizontal stretch)." }
          - { id: "G-CO.3", level: "HS", text: "Given a rectangle, parallelogram, trapezoid, or regular polygon, describe the rotations and reflections that carry it onto itself." }
          - { id: "G-CO.4", level: "HS", text: "Develop definitions of rotations, reflections, and translations in terms of angles, circles, perpendicular lines, parallel lines, and line segments." }
          - { id: "G-CO.5", level: "HS", text: "Given a geometric figure and a rotation, reflection, or translation, draw the transformed figure using, e.g., graph paper, tracing paper, or geometry software. Specify a sequence of transformations that will carry a given figure onto another." }
      - id: "G-CO.B"
        text: "Understand congruence in terms of rigid motions"
        indicators:
          - { id: "G-CO.6", level: "HS", text: "Use geometric descriptions of rigid motions to transform figures and to predict the effect of a given rigid motion on a given figure; given two figures, use the definition of congruence in terms of rigid motions to decide if they are congruent." }
          - { id: "G-CO.7", level: "HS", text: "Use the definition of congruence in terms of rigid motions to show that two triangles are congruent if and only if corresponding pairs of sides and corresponding pairs of angles are congruent." }
          - { id: "G-CO.8", level: "HS", text: "Explain how the criteria for triangle congruence (ASA, SAS, and SSS) follow from the definition of congruence in terms of rigid motions." }
      - id: "G-CO.C"
        text: "Prove geometric theorems"
        indicators:
          - { id: "G-CO.9", level: "HS", text: "Prove theorems about lines and angles. Theorems include: vertical angles are congruent; when a transversal crosses parallel lines, alternate interior angles are congruent and corresponding angles are congruent; points on a perpendicular bisector of a line segment are exactly those equidistant from the segment's endpoints." }
          - { id: "G-CO.10", level: "HS", text: "Prove theorems about triangles. Theorems include: measures of interior angles of a triangle sum to 180°; base angles of isosceles triangles are congruent; the segment joining midpoints of two sides of a triangle is parallel to the third side and half the length; the medians of a triangle meet at a point." }
          - { id: "G-CO.11", level: "HS", text: "Prove theorems about parallelograms. Theorems include: opposite sides are congruent, opposite angles are congruent, the diagonals of a parallelogram bisect each other, and conversely, rectangles are parallelograms with congruent diagonals." }
      - id: "G-CO.D"
        text: "Make geometric constructions"
        indicators:
          - { id: "G-CO.12", level: "HS", text: "Make formal geometric constructions with a variety of tools and methods (compass and straightedge, string, reflective devices, paper folding, dynamic geometric software, etc.). Copying a segment; copying an angle; bisecting a segment; bisecting an angle; constructing perpendicular lines, including the perpendicular bisector of a line segment; and constructing a line parallel to a given line through a point not on the line." }
          - { id: "G-CO.13", level: "HS", text: "Construct an equilateral triangle, a square, and a regular hexagon inscribed in a circle." }
  - id: "G-SRT"
    title: "Similarity, Right Triangles, and Trigonometry (High School: Geometry)"
    standards:
      - id: "G-SRT.A"
        text: "Understand similarity in terms of similarity transformations"
        indicators:
          - { id: "G-SRT.1", level: "HS", text: "Verify experimentally the properties of dilations given by a center and a scale factor: a. A dilation takes a line not passing through the center of the dilation to a parallel line, and leaves a line passing through the center unchanged. b. The dilation of a line segment is longer or shorter in the ratio given by the scale factor." }
          - { id: "G-SRT.2", level: "HS", text: "Given two figures, use the definition of similarity in terms of similarity transformations to decide if they are similar; explain using similarity transformations the meaning of similarity for triangles as the equality of all corresponding pairs of angles and the proportionality of all corresponding pairs of sides." }
          - { id: "G-SRT.3", level: "HS", text: "Use the properties of similarity transformations to establish the AA criterion for two triangles to be similar." }
      - id: "G-SRT.B"
        text: "Prove theorems involving similarity"
        indicators:
          - { id: "G-SRT.4", level: "HS", text: "Prove theorems about triangles. Theorems include: a line parallel to one side of a triangle divides the other two proportionally, and conversely; the Pythagorean Theorem proved using triangle similarity." }
          - { id: "G-SRT.5", level: "HS", text: "Use congruence and similarity criteria for triangles to solve problems and to prove relationships in geometric figures." }
      - id: "G-SRT.C"
        text: "Define trigonometric ratios and solve problems involving right triangles"
        indicators:
          - { id: "G-SRT.6", level: "HS", text: "Understand that by similarity, side ratios in right triangles are properties of the angles in the triangle, leading to definitions of trigonometric ratios for acute angles." }
          - { id: "G-SRT.7", level: "HS", text: "Explain and use the relationship between the sine and cosine of complementary angles." }
          - { id: "G-SRT.8", level: "HS", text: "Use trigonometric ratios and the Pythagorean Theorem to solve right triangles in applied problems.★" }
      - id: "G-SRT.D"
        text: "Apply trigonometry to general triangles"
        indicators:
          - { id: "G-SRT.9", level: "HS", text: "(+) Derive the formula A = 1/2 ab sin(C) for the area of a triangle by drawing an auxiliary line from a vertex perpendicular to the opposite side." }
          - { id: "G-SRT.10", level: "HS", text: "(+) Prove the Laws of Sines and Cosines and use them to solve problems." }
          - { id: "G-SRT.11", level: "HS", text: "(+) Understand and apply the Law of Sines and the Law of Cosines to find unknown measurements in right and non-right triangles (e.g., surveying problems, resultant forces)." }
  - id: "G-C"
    title: "Circles (High School: Geometry)"
    standards:
      - id: "G-C.A"
        text: "Understand and apply theorems about circles"
        indicators:
          - { id: "G-C.1", level: "HS", text: "Prove that all circles are similar." }
          - { id: "G-C.2", level: "HS", text: "Identify and describe relationships among inscribed angles, radii, and chords. Include the relationship between central, inscribed, and circumscribed angles; inscribed angles on a diameter are right angles; the radius of a circle is perpendicular to the tangent where the radius intersects the circle." }
          - { id: "G-C.3", level: "HS", text: "Construct the inscribed and circumscribed circles of a triangle, and prove properties of angles for a quadrilateral inscribed in a circle." }
          - { id: "G-C.4", level: "HS", text: "(+) Construct a tangent line from a point outside a given circle to the circle." }
      - id: "G-C.B"
        text: "Find arc lengths and areas of sectors of circles"
        indicators:
          - { id: "G-C.5", level: "HS", text: "Derive using similarity the fact that the length of the arc intercepted by an angle is proportional to the radius, and define the radian measure of the angle as the constant of proportionality; derive the formula for the area of a sector." }
  - id: "G-GPE"
    title: "Expressing Geometric Properties with Equations (High School: Geometry)"
    standards:
      - id: "G-GPE.A"
        text: "Translate between the geometric description and the equation for a conic section"
        indicators:
          - { id: "G-GPE.1", level: "HS", text: "Derive the equation of a circle of given center and radius using the Pythagorean Theorem; complete the square to find the center and radius of a circle given by an equation." }
          - { id: "G-GPE.2", level: "HS", text: "Derive the equation of a parabola given a focus and directrix." }
          - { id: "G-GPE.3", level: "HS", text: "(+) Derive the equations of ellipses and hyperbolas given the foci, using the fact that the sum or difference of distances from the foci is constant." }
      - id: "G-GPE.B"
        text: "Use coordinates to prove simple geometric theorems algebraically"
        indicators:
          - { id: "G-GPE.4", level: "HS", text: "Use coordinates to prove simple geometric theorems algebraically. For example, prove or disprove that a figure defined by four given points in the coordinate plane is a rectangle; prove or disprove that the point (1, √3) lies on the circle centered at the origin and containing the point (0, 2)." }
          - { id: "G-GPE.5", level: "HS", text: "Prove the slope criteria for parallel and perpendicular lines and use them to solve geometric problems (e.g., find the equation of a line parallel or perpendicular to a given line that passes through a given point)." }
          - { id: "G-GPE.6", level: "HS", text: "Find the point on a directed line segment between two given points that partitions the segment in a given ratio." }
          - { id: "G-GPE.7", level: "HS", text: "Use coordinates to compute perimeters of polygons and areas of triangles and rectangles, e.g., using the distance formula.*" }
  - id: "G-GMD"
    title: "Geometric Measurement and Dimension (High School: Geometry)"
    standards:
      - id: "G-GMD.A"
        text: "Explain volume formulas and use them to solve problems"
        indicators:
          - { id: "G-GMD.1", level: "HS", text: "Give an informal argument for the formulas for the circumference of a circle, area of a circle, volume of a cylinder, pyramid, and cone. Use dissection arguments, Cavalieri's principle, and informal limit arguments." }
          - { id: "G-GMD.2", level: "HS", text: "(+) Give an informal argument using Cavalieri's principle for the formulas for the volume of a sphere and other solid figures." }
          - { id: "G-GMD.3", level: "HS", text: "Use volume formulas for cylinders, pyramids, cones, and spheres to solve problems.★" }
      - id: "G-GMD.B"
        text: "Visualize relationships between two-dimensional and three-dimensional objects"
        indicators:
          - { id: "G-GMD.4", level: "HS", text: "Identify the shapes of two-dimensional cross-sections of three-dimensional objects, and identify three-dimensional objects generated by rotations of two-dimensional objects." }
  - id: "G-MG"
    title: "Modeling with Geometry (High School: Geometry)"
    standards:
      - id: "G-MG.A"
        text: "Apply geometric concepts in modeling situations"
        indicators:
          - { id: "G-MG.1", level: "HS", text: "Use geometric shapes, their measures, and their properties to describe objects (e.g., modeling a tree trunk or a human torso as a cylinder).★" }
          - { id: "G-MG.2", level: "HS", text: "Apply concepts of density based on area and volume in modeling situations (e.g., persons per square mile, BTUs per cubic foot).★" }
          - { id: "G-MG.3", level: "HS", text: "Apply geometric methods to solve design problems (e.g., designing an object or structure to satisfy physical constraints or minimize cost; working with typographic grid systems based on ratios).★" }
  - id: "S-ID"
    title: "Interpreting Categorical and Quantitative Data (High School: Statistics and Probability)"
    standards:
      - id: "S-ID.A"
        text: "Summarize, represent, and interpret data on a single count or measurement variable"
        indicators:
          - { id: "S-ID.1", level: "HS", text: "Represent data with plots on the real number line (dot plots, histograms, and box plots)." }
          - { id: "S-ID.2", level: "HS", text: "Use statistics appropriate to the shape of the data distribution to compare center (median, mean) and spread (interquartile range, standard deviation) of two or more different data sets." }
          - { id: "S-ID.3", level: "HS", text: "Interpret differences in shape, center, and spread in the context of the data sets, accounting for possible effects of extreme data points (outliers)." }
          - { id: "S-ID.4", level: "HS", text: "Use the mean and standard deviation of a data set to fit it to a normal distribution and to estimate population percentages. Recognize that there are data sets for which such a procedure is not appropriate. Use calculators, spreadsheets, and tables to estimate areas under the normal curve." }
      - id: "S-ID.B"
        text: "Summarize, represent, and interpret data on two categorical and quantitative variables"
        indicators:
          - { id: "S-ID.5", level: "HS", text: "Summarize categorical data for two categories in two-way frequency tables. Interpret relative frequencies in the context of the data (including joint, marginal, and conditional relative frequencies). Recognize possible associations and trends in the data." }
          - { id: "S-ID.6", level: "HS", text: "Represent data on two quantitative variables on a scatter plot, and describe how the variables are related. a. Fit a function to the data; use functions fitted to data to solve problems in the context of the data. Use given functions or choose a function suggested by the context. Emphasize linear, quadratic, and exponential models. b. Informally assess the fit of a function by plotting and analyzing residuals. c. Fit a linear function for a scatter plot that suggests a linear association." }
      - id: "S-ID.C"
        text: "Interpret linear models"
        indicators:
          - { id: "S-ID.7", level: "HS", text: "Interpret the slope (rate of change) and the intercept (constant term) of a linear model in the context of the data." }
          - { id: "S-ID.8", level: "HS", text: "Compute (using technology) and interpret the correlation coefficient of a linear fit." }
          - { id: "S-ID.9", level: "HS", text: "Distinguish between correlation and causation." }
  - id: "S-IC"
    title: "Making Inferences and Justifying Conclusions (High School: Statistics and Probability)"
    standards:
      - id: "S-IC.A"
        text: "Understand and evaluate random processes underlying statistical experiments"
        indicators:
          - { id: "S-IC.1", level: "HS", text: "Understand statistics as a process for making inferences about population parameters based on a random sample from that population." }
          - { id: "S-IC.2", level: "HS", text: "Decide if a specified model is consistent with results from a given data-generating process, e.g., using simulation. For example, a model says a spinning coin falls heads up with probability 0.5. Would a result of 5 tails in a row cause you to question the model?" }
      - id: "S-IC.B"
        text: "Make inferences and justify conclusions from sample surveys, experiments, and observational studies"
        indicators:
          - { id: "S-IC.3", level: "HS", text: "Recognize the purposes of and differences among sample surveys, experiments, and observational studies; explain how randomization relates to each." }
          - { id: "S-IC.4", level: "HS", text: "Use data from a sample survey to estimate a population mean or proportion; develop a margin of error through the use of simulation models for random sampling." }
          - { id: "S-IC.5", level: "HS", text: "Use data from a randomized experiment to compare two treatments; use simulations to decide if differences between parameters are significant." }
          - { id: "S-IC.6", level: "HS", text: "Evaluate reports based on data." }
  - id: "S-CP"
    title: "Conditional Probability and the Rules of Probability (High School: Statistics and Probability)"
    standards:
      - id: "S-CP.A"
        text: "Understand independence and conditional probability and use them to interpret data"
        indicators:
          - { id: "S-CP.1", level: "HS", text: "Describe events as subsets of a sample space (the set of outcomes) using characteristics (or categories) of the outcomes, or as unions, intersections, or complements of other events (\"or,\" \"and,\" \"not\")." }
          - { id: "S-CP.2", level: "HS", text: "Understand that two events A and B are independent if the probability of A and B occurring together is the product of their probabilities, and use this characterization to determine if they are independent." }
          - { id: "S-CP.3", level: "HS", text: "Understand the conditional probability of A given B as P(A and B)/P(B), and interpret independence of A and B as saying that the conditional probability of A given B is the same as the probability of A, and the conditional probability of B given A is the same as the probability of B." }
          - { id: "S-CP.4", level: "HS", text: "Construct and interpret two-way frequency tables of data when two categories are associated with each object being classified. Use the two-way table as a sample space to decide if events are independent and to approximate conditional probabilities. For example, collect data from a random sample of students in your school on their favorite subject among math, science, and English. Estimate the probability that a randomly selected student from your school will favor science given that the student is in tenth grade. Do the same for other subjects and compare the results." }
          - { id: "S-CP.5", level: "HS", text: "Recognize and explain the concepts of conditional probability and independence in everyday language and everyday situations. For example, compare the chance of having lung cancer if you are a smoker with the chance of being a smoker if you have lung cancer." }
      - id: "S-CP.B"
        text: "Use the rules of probability to compute probabilities of compound events."
        indicators:
          - { id: "S-CP.6", level: "HS", text: "Find the conditional probability of A given B as the fraction of B's outcomes that also belong to A, and interpret the answer in terms of the model." }
          - { id: "S-CP.7", level: "HS", text: "Apply the Addition Rule, P(A or B) = P(A) + P(B) - P(A and B), and interpret the answer in terms of the model." }
          - { id: "S-CP.8", level: "HS", text: "(+) Apply the general Multiplication Rule in a uniform probability model, P(A and B) = P(A)P(B|A) = P(B)P(A|B), and interpret the answer in terms of the model." }
          - { id: "S-CP.9", level: "HS", text: "(+) Use permutations and combinations to compute probabilities of compound events and solve problems." }
  - id: "S-MD"
    title: "Using Probability to Make Decisions (High School: Statistics and Probability)"
    standards:
      - id: "S-MD.A"
        text: "Calculate expected values and use them to solve problems"
        indicators:
          - { id: "S-MD.1", level: "HS", text: "(+) Define a random variable for a quantity of interest by assigning a numerical value to each event in a sample space; graph the corresponding probability distribution using the same graphical displays as for data distributions." }
          - { id: "S-MD.2", level: "HS", text: "(+) Calculate the expected value of a random variable; interpret it as the mean of the probability distribution." }
          - { id: "S-MD.3", level: "HS", text: "(+) Develop a probability distribution for a random variable defined for a sample space in which theoretical probabilities can be calculated; find the expected value. For example, find the theoretical probability distribution for the number of correct answers obtained by guessing on all five questions of a multiple-choice test where each question has four choices, and find the expected grade under various grading schemes." }
          - { id: "S-MD.4", level: "HS", text: "(+) Develop a probability distribution for a random variable defined for a sample space in which probabilities are assigned empirically; find the expected value. For example, find a current data distribution on the number of TV sets per household in the United States, and calculate the expected number of sets per household. How many TV sets would you expect to find in 100 randomly selected households?" }
      - id: "S-MD.B"
        text: "Use probability to evaluate outcomes of decisions"
        indicators:
          - { id: "S-MD.5", level: "HS", text: "(+) Weigh the possible outcomes of a decision by assigning probabilities to payoff values and finding expected values. a. Find the expected payoff for a game of chance. For example, find the expected winnings from a state lottery ticket or a game at a fast-food restaurant. b. Evaluate and compare strategies on the basis of expected values. For example, compare a high-deductible versus a low-deductible automobile insurance policy using various, but reasonable, chances of having a minor or a major accident." }
          - { id: "S-MD.6", level: "HS", text: "(+) Use probabilities to make fair decisions (e.g., drawing by lots, using a random number generator)." }
          - { id: "S-MD.7", level: "HS", text: "(+) Analyze decisions and strategies using probability concepts (e.g., product testing, medical testing, pulling a hockey goalie at the end of a game)." }
