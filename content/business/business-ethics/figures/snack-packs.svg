<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" width="520" height="230" font-family="sans-serif" font-size="14">
  <title>ถุงข้าวเกรียบสองถุง ถุงเดิม 100 กรัม ถุงใหม่ 90 กรัม ราคาเท่ากัน 25 บาท</title>
  <rect x="0" y="0" width="520" height="230" fill="#ffffff"/>
  <rect x="60.0" y="30.0" width="160.0" height="140.0" rx="14" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="140.0" y="62.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">ข้าวเกรียบกุ้ง</text>
  <text x="140.0" y="100.0" text-anchor="middle" fill="#1f2937" font-size="14">น้ำหนักสุทธิ 100 กรัม</text>
  <text x="140.0" y="135.0" text-anchor="middle" fill="#b91c1c" font-size="16" font-weight="bold">ราคา 25 บาท</text>
  <text x="140.0" y="200.0" text-anchor="middle" fill="#1f2937" font-size="14">ถุงเดิม</text>
  <rect x="300.0" y="30.0" width="160.0" height="140.0" rx="14" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="380.0" y="62.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">ข้าวเกรียบกุ้ง</text>
  <text x="380.0" y="100.0" text-anchor="middle" fill="#1f2937" font-size="14">น้ำหนักสุทธิ 90 กรัม</text>
  <text x="380.0" y="135.0" text-anchor="middle" fill="#b91c1c" font-size="16" font-weight="bold">ราคา 25 บาท</text>
  <text x="380.0" y="200.0" text-anchor="middle" fill="#1f2937" font-size="14">ถุงใหม่</text>
</svg>
