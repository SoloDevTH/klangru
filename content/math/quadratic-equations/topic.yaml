id: math.algebra.quadratic-eq
subject: math
title: { th: สมการกำลังสองตัวแปรเดียว, en: Quadratic equations }
summary: แก้สมการกำลังสองด้วยการแยกตัวประกอบและสูตร ใช้ดิสคริมิแนนต์บอกจำนวนคำตอบ และนำไปแก้โจทย์ปัญหาพื้นที่และการเคลื่อนที่
difficulty: 5
minutes: 40
prerequisites: [math.algebra.factoring, math.number.roots]
encompasses:
  - { id: math.algebra.factoring, weight: 0.5 }
  - { id: math.number.roots, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: completing-square.svg
    alt: "แบบจำลองพื้นที่ของ x² + 6x: สี่เหลี่ยมจัตุรัสด้าน x พื้นที่ x² มีสี่เหลี่ยมผืนผ้าขนาด 3 คูณ x พื้นที่ 3x ติดอยู่ทางขวาและด้านล่าง มุมขวาล่างขนาด 3 คูณ 3 พื้นที่ 9 เป็นเส้นประแสดงส่วนที่ขาด ถ้าเติม 9 จะได้สี่เหลี่ยมจัตุรัสด้าน x + 3"
    caption: "$x^2 + 6x$ ขาดอีก $9$ จึงจะเป็น $(x + 3)^2$ จึงเขียนได้ว่า $x^2 + 6x = (x + 3)^2 - 9$"
  - type: worked-example
    title: ย้ายข้างให้เป็นศูนย์ก่อนแยกตัวประกอบ
    problem: "แก้สมการ $x^2 = 3x + 10$"
    steps:
      - text: "ย้ายทุกพจน์ไปข้างซ้าย: $x^2 - 3x - 10 = 0$"
        why: "หลักการ \"ผลคูณเป็นศูนย์\" ใช้ได้เมื่ออีกข้างเป็น 0 เท่านั้น"
      - text: "หาสองจำนวนที่คูณกันได้ $-10$ และบวกกันได้ $-3$ คือ $-5$ กับ $2$"
      - text: "แยกตัวประกอบ: $(x - 5)(x + 2) = 0$"
      - text: "$x - 5 = 0$ หรือ $x + 2 = 0$ จึงได้ $x = 5$ หรือ $x = -2$"
        why: "ผลคูณของสองจำนวนเป็นศูนย์ได้เมื่อตัวใดตัวหนึ่งเป็นศูนย์"
      - text: "ตรวจ: $5^2 = 25 = 3(5) + 10$ ✓ และ $(-2)^2 = 4 = 3(-2) + 10$ ✓"
    answer: "$x = 5$ หรือ $x = -2$"
  - { type: check, problem: math.quad.p004, prompt: "ระวังคำตอบที่หายไป" }
  - type: worked-example
    title: แก้สมการด้วยการทำกำลังสองสมบูรณ์
    problem: "แก้สมการ $x^2 + 6x - 4 = 0$ ตอบในรูปที่มีรากที่สอง และประมาณเป็นทศนิยม 2 ตำแหน่ง"
    steps:
      - text: "ย้ายพจน์ค่าคงที่ไปข้างขวา: $x^2 + 6x = 4$"
      - text: "ครึ่งหนึ่งของ $6$ คือ $3$ และ $3^2 = 9$ เติม $9$ ทั้งสองข้าง: $x^2 + 6x + 9 = 13$"
        why: "เติมชิ้นมุม $3 \\times 3$ ที่ขาดในแบบจำลองพื้นที่ ต้องเติมทั้งสองข้างเพื่อให้สมการยังเท่ากัน"
      - text: "เขียนข้างซ้ายเป็นกำลังสอง: $(x + 3)^2 = 13$"
      - text: "ถอดรากที่สอง: $x + 3 = \\pm\\sqrt{13}$"
        why: "ทั้ง $\\sqrt{13}$ และ $-\\sqrt{13}$ ยกกำลังสองได้ $13$ จึงต้องมี $\\pm$"
      - text: "$x = -3 \\pm \\sqrt{13}$ ได้ $x \\approx 0.61$ หรือ $x \\approx -6.61$"
      - text: "ตรวจด้วยสูตร: $D = 36 + 16 = 52$ และ $\\dfrac{-6 \\pm \\sqrt{52}}{2} = -3 \\pm \\sqrt{13}$ ตรงกัน"
        why: "$\\sqrt{52} = \\sqrt{4 \\cdot 13} = 2\\sqrt{13}$"
    answer: "$x = -3 + \\sqrt{13} \\approx 0.61$ หรือ $x = -3 - \\sqrt{13} \\approx -6.61$"
  - type: figure
    src: discriminant-graphs.svg
    alt: "กราฟพาราโบลาสามรูปที่มีรูปร่างเดียวกัน y = x² − 2x − 3 ตัดแกน x สองจุดที่ x = −1 และ x = 3 (D > 0) y = x² − 2x + 1 แตะแกน x จุดเดียวที่ x = 1 (D = 0) y = x² − 2x + 3 อยู่เหนือแกน x ทั้งหมด (D < 0)"
    caption: "เลื่อนพาราโบลาขึ้นเรื่อย ๆ จำนวนจุดตัดแกน $x$ ลดจาก 2 เป็น 1 เป็น 0 ตามค่า $D = b^2 - 4ac$"
  - { type: check, problem: math.quad.p007, prompt: "ใช้ดิสคริมิแนนต์โดยไม่ต้องแก้สมการ" }
  - type: interactive
    title: คำตอบของสมการคือจุดที่กราฟตัดแกน x
    caption: กราฟคือ y = ax² + bx + c ลองปรับ a, b, c แล้วดูว่ากราฟตัดแกน x กี่จุด เทียบกับค่า b² − 4ac ถ้าเป็นบวกตัดสองจุด เป็นศูนย์แตะจุดเดียว เป็นลบไม่ถึงแกน x
    widget:
      kind: function-plot
      functions: ["a x^2 + b x + c"]
      sliders:
        - { name: a, min: -3, max: 3, step: 0.5, value: 1 }
        - { name: b, min: -6, max: 6, step: 1, value: -2 }
        - { name: c, min: -6, max: 6, step: 1, value: -3 }
      x: [-6, 6]
      y: [-8, 8]
  - type: simulation
    title: กราฟของสมการกำลังสอง (PhET Graphing Quadratics)
    url: https://phet.colorado.edu/en/simulations/graphing-quadratics
    provider: phet
    note: เลือกหน้า Explore ปรับค่า a, b, c แล้วเปิดการแสดงรากของสมการ สังเกตว่ารากคือตำแหน่งที่พาราโบลาตัดแกน x
glossary:
  - { term: สมการกำลังสอง, definition: "สมการรูป $ax^2 + bx + c = 0$ เมื่อ $a \\neq 0$" }
  - { term: สูตรสมการกำลังสอง, definition: "$x = \\dfrac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$ ใช้ได้กับสมการกำลังสองทุกสมการ" }
  - { term: ดิสคริมิแนนต์, definition: "ค่า $D = b^2 - 4ac$ บอกจำนวนคำตอบที่เป็นจำนวนจริง: บวกมีสองคำตอบ ศูนย์มีคำตอบเดียว ลบไม่มีคำตอบจริง" }
flashcards:
  - { front: "ถ้า $(x - a)(x - b) = 0$ แล้ว $x$ เป็นเท่าใด", back: "$x = a$ หรือ $x = b$ เพราะผลคูณเป็นศูนย์เมื่อตัวใดตัวหนึ่งเป็นศูนย์" }
  - { front: "สูตรสมการกำลังสอง", back: "$x = \\dfrac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$" }
  - { front: "$b^2 - 4ac < 0$ หมายความว่าอะไร", back: "สมการไม่มีคำตอบที่เป็นจำนวนจริง กราฟไม่ตัดแกน $x$" }
  - { front: "แก้ $x^2 = 2x$ ด้วยการหาร $x$ ทั้งสองข้างได้ไหม", back: "ไม่ได้ จะทำคำตอบ $x = 0$ หาย ต้องย้ายข้างเป็น $x(x - 2) = 0$" }
