id: chemistry.reactions.everyday-reactions
subject: chemistry
title: { th: ปฏิกิริยาเคมีในชีวิตประจำวัน, en: Chemical reactions in everyday life }
summary: การเกิดสนิมเหล็ก กรดกับโลหะ กรดกับเบส เบสกับโลหะ การเผาไหม้ ฝนกรด และการสังเคราะห์ด้วยแสง ประโยชน์และโทษของปฏิกิริยา และการออกแบบวิธีแก้ปัญหา
difficulty: 3.2
minutes: 35
prerequisites: [chemistry.reactions.chemical-reactions-intro]
encompasses:
  - { id: chemistry.reactions.chemical-reactions-intro, weight: 0.4 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: rust-test-tubes.svg
    alt: "หลอดทดลอง 3 หลอด แต่ละหลอดมีตะปูเหล็ก หลอด ก มีน้ำประปาครึ่งหลอดและเปิดสู่อากาศ ตะปูมีจุดสนิมสีน้ำตาล ผล: เกิดสนิม หลอด ข มีน้ำต้มเดือดแล้วและมีชั้นน้ำมันสีเหลืองปิดผิวน้ำ ตะปูจมอยู่ใต้น้ำ ผล: ไม่เกิดสนิม หลอด ค ปิดจุก ตะปูแขวนในอากาศแห้ง ก้นหลอดมีสารดูดความชื้น ผล: ไม่เกิดสนิม"
    caption: "สนิมเกิดเฉพาะเมื่อเหล็กสัมผัสทั้งน้ำและออกซิเจน หลอด ข ตัดออกซิเจน หลอด ค ตัดน้ำ"
  - { type: check, problem: chemistry.reactions.everyday-reactions.p001, prompt: "ดูหลอด ข และ ค ว่าขาดอะไรไป" }
  - type: worked-example
    title: เขียนสมการข้อความจากการทดลอง
    problem: "หย่อนเปลือกไข่ลงในน้ำส้มสายชู มีฟองแก๊สเกิดขึ้น นำแก๊สไปผ่านน้ำปูนใสแล้วน้ำปูนใสขุ่น จงเขียนสมการข้อความและบอกประเภทของปฏิกิริยา"
    steps:
      - text: "ระบุสารตั้งต้น: เปลือกไข่มีแคลเซียมคาร์บอเนตเป็นส่วนใหญ่ น้ำส้มสายชูมีกรดแอซีติก"
      - text: "ระบุผลิตภัณฑ์จากหลักฐาน: แก๊สที่ทำให้น้ำปูนใสขุ่นคือคาร์บอนไดออกไซด์"
        why: "การมีฟองแก๊สอย่างเดียวยังไม่บอกว่าเป็นแก๊สอะไร ต้องทดสอบด้วยน้ำปูนใส"
      - text: "ใช้รูปแบบ กรด + คาร์บอเนต → เกลือ + น้ำ + คาร์บอนไดออกไซด์ เกลือที่ได้คือแคลเซียมแอซีเทต"
      - text: "เขียนสมการข้อความ: กรดแอซีติก + แคลเซียมคาร์บอเนต → แคลเซียมแอซีเทต + น้ำ + แก๊สคาร์บอนไดออกไซด์"
    answer: "เป็นปฏิกิริยาของกรดกับสารคาร์บอเนต ได้เกลือ น้ำ และแก๊สคาร์บอนไดออกไซด์"
  - type: worked-example
    title: มวลหายไปไหนเมื่อเผาหินปูน
    problem: "เผาหินปูน (แคลเซียมคาร์บอเนต) 10.0 g ในถ้วยกระเบื้องเปิดจนสลายหมด ได้ปูนดิบ (แคลเซียมออกไซด์) 5.6 g มวลที่หายไปเป็นของอะไร และเท่าใด"
    steps:
      - text: "เขียนสมการข้อความ: แคลเซียมคาร์บอเนต → แคลเซียมออกไซด์ + แก๊สคาร์บอนไดออกไซด์ เป็นการสลายตัวด้วยความร้อน"
      - text: "ตามกฎทรงมวล มวลสารตั้งต้น = มวลผลิตภัณฑ์ทั้งหมด"
      - text: "มวลคาร์บอนไดออกไซด์ = 10.0 − 5.6 = 4.4 g ซึ่งลอยออกไปจากถ้วยเปิด"
        why: "มวลไม่ได้หายไปจริง แก๊สออกไปนอกระบบ ถ้าทำในระบบปิดมวลรวมจะเท่าเดิม"
    answer: "มวลที่หายไป 4.4 g คือแก๊สคาร์บอนไดออกไซด์"
  - { type: check, problem: chemistry.reactions.everyday-reactions.p007, prompt: "มวลสารตั้งต้นเท่ากับมวลผลิตภัณฑ์ทั้งหมด" }
glossary:
  - { term: สมการข้อความ, definition: "สมการที่เขียนชื่อสารตั้งต้นและผลิตภัณฑ์ด้วยคำ ใช้ลูกศรแทนคำว่า ได้" }
  - { term: ปฏิกิริยาสะเทิน, definition: ปฏิกิริยาระหว่างกรดกับเบส ได้เกลือและน้ำ }
  - { term: การเผาไหม้ไม่สมบูรณ์, definition: การเผาไหม้ที่ออกซิเจนไม่พอ ได้เขม่าและแก๊สคาร์บอนมอนอกไซด์ที่เป็นพิษ }
  - { term: ฝนกรด, definition: ฝนที่เป็นกรดมากกว่าปกติ เพราะมีกรดซัลฟิวริกและกรดไนตริกจากออกไซด์ของกำมะถันและไนโตรเจน }
  - { term: การสลายตัวด้วยความร้อน, definition: ปฏิกิริยาที่สารเดียวแตกเป็นสารใหม่หลายชนิดเมื่อได้รับความร้อน }
  - { term: ปฏิกิริยาการแทนที่, definition: ปฏิกิริยาที่โลหะที่ว่องไวกว่าเข้าไปแทนที่ไอออนของโลหะอื่นในสารละลาย }
flashcards:
  - { front: "เหล็กเกิดสนิมต้องมี", back: "ออกซิเจนและน้ำ (น้ำเกลือทำให้เร็วขึ้น)" }
  - { front: "กรด + โลหะ →", back: "เกลือ + แก๊สไฮโดรเจน" }
  - { front: "กรด + เบส →", back: "เกลือ + น้ำ (ปฏิกิริยาสะเทิน)" }
  - { front: "กรด + คาร์บอเนต →", back: "เกลือ + น้ำ + แก๊สคาร์บอนไดออกไซด์" }
  - { front: "แก๊สที่ทำให้เกิดฝนกรด", back: "ซัลเฟอร์ไดออกไซด์และออกไซด์ของไนโตรเจน" }
