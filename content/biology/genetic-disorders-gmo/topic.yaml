id: biology.genetics.genetic-disorders-gmo
subject: biology
title: { th: โรคทางพันธุกรรมและสิ่งมีชีวิตดัดแปรพันธุกรรม, en: "Genetic disorders and genetically modified organisms" }
summary: โรคจากความผิดปกติของยีนและโครโมโซม เช่น ธาลัสซีเมีย ดาวน์ซินโดรม การปรึกษาแพทย์ก่อนแต่งงาน หลักการสร้าง GMO ประโยชน์ ข้อกังวล กติกาในไทย และการโต้แย้งด้วยหลักฐาน
difficulty: 3.5
minutes: 40
prerequisites: [biology.genetics.genes-heredity]
encompasses:
  - { id: biology.genetics.genes-heredity, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ความผิดปกติระดับยีนกับระดับโครโมโซม
    src: gene-vs-chromosome.svg
    alt: "ภาพสองฝั่ง ฝั่งซ้ายชื่อความผิดปกติของยีน แสดงโครโมโซมคู่เหมือนสองแท่ง แท่งหนึ่งมีแถบสีขาวคือแอลลีลปกติ อีกแท่งมีแถบสีแดงที่ตำแหน่งเดียวกันคือแอลลีลผิดปกติ มีกล่องบอกว่าลำดับเบสในยีนเปลี่ยน ตัวอย่างคือธาลัสซีเมีย ตาบอดสี ฮีโมฟีเลีย ฝั่งขวาชื่อความผิดปกติของโครโมโซม เทียบโครโมโซมคู่ที่ 21 ของคนปกติซึ่งมี 2 แท่ง กับของคนที่มีดาวน์ซินโดรมซึ่งมี 3 แท่ง บอกว่าจำนวนหรือโครงสร้างของโครโมโซมเปลี่ยนและมองเห็นได้จากแคริโอไทป์ ตัวอย่างคือดาวน์ซินโดรม เทอร์เนอร์ ไคลน์เฟลเตอร์"
    caption: "ความผิดปกติของยีนมองไม่เห็นด้วยกล้องจุลทรรศน์ ส่วนความผิดปกติของโครโมโซมเห็นได้จากแคริโอไทป์ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: โอกาสที่ลูกเป็นธาลัสซีเมีย
    problem: "พ่อแม่เป็นพาหะธาลัสซีเมียชนิดเดียวกันทั้งคู่ ($Tt \\times Tt$) จงหาโอกาสที่ลูกคนหนึ่งเป็นโรค และโอกาสที่ลูกเป็นพาหะ"
    steps:
      - text: "พ่อให้เซลล์สืบพันธุ์ $T$ หรือ $t$ อย่างละครึ่ง แม่ก็เช่นเดียวกัน"
      - text: "จับคู่ได้ $TT$ $Tt$ $tT$ $tt$ โอกาสเท่ากันแบบละ $\\tfrac14$"
        why: "เซลล์สืบพันธุ์ของพ่อและแม่รวมกันอย่างสุ่ม ทั้ง 4 แบบจึงเกิดได้เท่ากัน"
      - text: "เป็นโรคต้องเป็น $tt$ ได้ $\\tfrac14$ เป็นพาหะคือ $Tt$ หรือ $tT$ ได้ $\\tfrac24 = \\tfrac12$"
    answer: "เป็นโรค $\\tfrac14$ (ร้อยละ 25) เป็นพาหะ $\\tfrac12$ (ร้อยละ 50) โอกาสนี้ใช้กับลูกแต่ละคนแยกกัน"
  - { type: check, problem: biology.genetics.genetic-disorders-gmo.p005, prompt: "เขียนตารางพันเนตต์ 2 × 2 แล้วนับช่องที่เป็น tt" }
  - type: figure
    title: การสร้างแบคทีเรียดัดแปรพันธุกรรมที่ผลิตอินซูลิน
    src: gmo-insulin.svg
    alt: "ขั้นตอน 5 ขั้นเรียงจากซ้ายไปขวา ขั้นที่ 1 ตัดยีนอินซูลิน (แถบสีแดง) ออกจาก DNA ของคนด้วยเอนไซม์ตัดจำเพาะ ขั้นที่ 2 ตัดพลาสมิดวงกลมของแบคทีเรียให้เปิดด้วยเอนไซม์ชนิดเดียวกัน ขั้นที่ 3 เชื่อมยีนเข้ากับพลาสมิดด้วยเอนไซม์ไลเกส ได้พลาสมิดรีคอมบิแนนท์ที่มีส่วนสีแดง ขั้นที่ 4 ใส่พลาสมิดรีคอมบิแนนท์เข้าเซลล์แบคทีเรีย ซึ่งมี DNA ของแบคทีเรียเองอยู่ด้วย ขั้นที่ 5 เลี้ยงแบคทีเรียให้เพิ่มจำนวน แบคทีเรียสร้างอินซูลิน (จุดสีแดง) แล้วนำไปทำให้บริสุทธิ์"
    caption: "ยีนที่ใส่มาจากคน พลาสมิดเป็นตัวพา แบคทีเรียเป็นโรงงานผลิต (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: เขียนข้อโต้แย้งจากข้อมูล
    problem: "แปลงทดลองพบว่าฝ้ายพันธุ์ทั่วไปต้องฉีดพ่นสารฆ่าหนอนเฉลี่ย 12 ครั้งต่อฤดู ฝ้าย Bt 4 ครั้งต่อฤดู (ข้อมูลสมมติ) จงเขียนข้อโต้แย้งที่มีข้อกล่าวอ้าง หลักฐาน และเหตุผล"
    steps:
      - text: "ข้อกล่าวอ้าง: ในแปลงทดลองนี้ ฝ้าย Bt ช่วยลดการใช้สารฆ่าแมลง"
        why: "ระบุขอบเขตว่าเป็นผลในแปลงทดลองนี้ ไม่สรุปเกินข้อมูล"
      - text: "หลักฐาน: ฉีดพ่นลดจาก 12 เป็น 4 ครั้ง ลดลง $\\tfrac{12-4}{12} \\times 100 \\approx 66.7$ เปอร์เซ็นต์"
      - text: "เหตุผล: ฝ้าย Bt สร้างโปรตีนที่ฆ่าหนอนเจาะสมอฝ้าย เกษตรกรจึงไม่ต้องพ่นสารบ่อย"
      - text: "ข้อโต้แย้งที่ควรตอบ: ถ้าปลูกต่อเนื่องหลายปี หนอนอาจดื้อต่อโปรตีน Bt จึงต้องติดตามข้อมูลระยะยาว"
    answer: "ข้อโต้แย้งที่ดีระบุข้อกล่าวอ้างตามขอบเขตของข้อมูล ให้ตัวเลขเป็นหลักฐาน อธิบายเหตุผล และยอมรับข้อจำกัด"
  - { type: check, problem: biology.genetics.genetic-disorders-gmo.p008, prompt: "GMO ต้องมีการใส่หรือเปลี่ยนยีนด้วยพันธุวิศวกรรม" }
glossary:
  - { term: โรคทางพันธุกรรม, definition: "โรคหรือความผิดปกติที่เกิดจากการเปลี่ยนแปลงของยีนหรือโครโมโซม และถ่ายทอดสู่ลูกได้" }
  - { term: พาหะ, definition: "คนที่มีแอลลีลด้อยที่ผิดปกติ 1 แอลลีล ไม่แสดงอาการ แต่ส่งแอลลีลนั้นให้ลูกได้" }
  - { term: แคริโอไทป์, definition: "ภาพโครโมโซมทั้งหมดในเซลล์ที่จัดเรียงเป็นคู่ตามขนาดและรูปร่าง ใช้ตรวจความผิดปกติของโครโมโซม" }
  - { term: ดาวน์ซินโดรม, definition: "ภาวะที่โครโมโซมคู่ที่ 21 มี 3 แท่ง เซลล์ร่างกายมีโครโมโซม 47 แท่ง" }
  - { term: พันธุวิศวกรรม, definition: "การเปลี่ยนแปลงสารพันธุกรรมของสิ่งมีชีวิตโดยตรง เช่น การตัดต่อยีน" }
  - { term: สิ่งมีชีวิตดัดแปรพันธุกรรม (GMO), definition: "สิ่งมีชีวิตที่สารพันธุกรรมถูกเปลี่ยนด้วยพันธุวิศวกรรม" }
  - { term: พลาสมิด, definition: "DNA วงกลมขนาดเล็กในแบคทีเรีย ใช้เป็นตัวพายีนเข้าสู่เซลล์" }
flashcards:
  - { front: "ความผิดปกติของยีนกับของโครโมโซม ต่างกันอย่างไร", back: "ยีน: ลำดับเบสเปลี่ยน (ธาลัสซีเมีย ตาบอดสี) โครโมโซม: จำนวนหรือโครงสร้างเปลี่ยน (ดาวน์ซินโดรม)" }
  - { front: "พ่อแม่เป็นพาหะทั้งคู่ ลูกเป็นโรคด้วยโอกาสเท่าใด", back: "1/4 ต่อลูกหนึ่งคน (เป็นพาหะ 1/2 ปกติ 1/4)" }
  - { front: "ทำไมตาบอดสีพบในชายมากกว่าหญิง", back: "ยีนอยู่บนโครโมโซม X ชายมี X แท่งเดียว แอลลีลด้อยแท่งเดียวก็แสดงออก" }
  - { front: "อาหาร GMO ในไทยต้องทำอะไรก่อนขาย", back: "ผ่านการประเมินความปลอดภัย และแสดงคำว่าดัดแปรพันธุกรรมบนฉลากตามเกณฑ์" }
  - { front: "ข้อโต้แย้งทางวิทยาศาสตร์มี 3 ส่วนอะไร", back: "ข้อกล่าวอ้าง หลักฐาน เหตุผล" }
