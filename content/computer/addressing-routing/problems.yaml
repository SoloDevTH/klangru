  - id: computer.networks.addressing-routing.p013
    topics: [computer.networks.addressing-routing]
    difficulty: 4
    type: code
    stem: "เขียนฟังก์ชัน best_route(table, dest) โดย table เป็นรายการคู่ (ซับเน็ต, ปลายทางทางออก) เช่น (\"10.0.0.0/8\", \"R1\") ให้คืนค่าทางออกของแถวที่ prefix ยาวที่สุดซึ่งครอบคลุม dest และคืน None ถ้าไม่มีแถวใดตรงเลย"
    starter: |
      import ipaddress

      def best_route(table, dest):
          # ตอนนี้คืนแถวแรกของตารางเสมอ ยังไม่ได้เลือก prefix ที่ยาวที่สุด
          return table[0][1]
    tests: |
      table = [("0.0.0.0/0", "ISP"), ("10.0.0.0/8", "R1"), ("10.1.0.0/16", "R2"), ("10.1.2.0/24", "R3")]
      assert best_route(table, "10.1.2.9") == "R3", "10.1.2.9 ตรงกับทั้งสี่แถว แถวที่ prefix ยาวที่สุดคือ /24 จึงควรได้ R3"
      assert best_route(table, "10.200.0.1") == "R1", "10.200.0.1 ตรงกับ /8 และ /0 เท่านั้น ควรได้ R1"
      assert best_route(table, "8.8.8.8") == "ISP", "8.8.8.8 ตรงกับ 0.0.0.0/0 เท่านั้น ควรได้ ISP"
      assert best_route([("10.0.0.0/8", "R1")], "192.168.0.1") is None, "ไม่มีแถวตรงเลย ต้องคืน None"
    reference: |
      import ipaddress

      def best_route(table, dest):
          addr = ipaddress.ip_address(dest)
          best = None
          for cidr, hop in table:
              net = ipaddress.ip_network(cidr)
              if addr in net and (best is None or net.prefixlen > best[0]):
                  best = (net.prefixlen, hop)
          return best[1] if best else None
    hints:
      - "วนดูทุกแถว แล้วตรวจว่า dest อยู่ในซับเน็ตของแถวนั้นหรือไม่ โดยใช้ ipaddress.ip_network(...)"
      - "เก็บ prefixlen ที่ยาวที่สุดที่เจอไว้ และอัปเดตเมื่อเจอแถวที่ยาวกว่า"
    solution: "วนทุกแถวเก็บแถวที่ตรงกับ dest และมี prefixlen มากที่สุด ถ้าไม่มีแถวตรงให้คืน None"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.networks.addressing-routing.p014
    topics: [computer.networks.addressing-routing]
    difficulty: 4
    type: numeric
    stem: "โรงเรียนมีที่อยู่ 10.20.0.0/16 และต้องการให้แต่ละซับเน็ตใช้ได้อย่างน้อย 500 เครื่อง ควรใช้ prefix ใหญ่ที่สุดที่ยังพอ แล้วแบ่งได้กี่ซับเน็ตจาก /16 (ตอบเป็นจำนวนเต็ม)"
    answer: { value: 128 }
    # lint_ignore: 128 ในบทเรียนคือขนาดบล็อก /26 ในตัวอย่างอีกเรื่อง ไม่ใช่การคำนวณซับเน็ตของโจทย์นี้ จึงเป็นค่าที่บังเอิญตรงกัน
    lint_ignore: [answer-in-lesson]
    hints:
      - "หา prefix ที่เล็กที่สุดซึ่งให้โฮสต์ที่ใช้ได้มากกว่าหรือเท่ากับ 500"
      - "จากนั้นนับว่า /16 แบ่งเป็นบล็อกขนาดนั้นได้กี่บล็อก โดยใช้ 2 ยกกำลังจำนวนบิตที่ยืม"
    misconceptions:
      - { match: 256, feedback: "256 เกิดจากการใช้ /24 ซึ่งให้โฮสต์ใช้ได้เพียง 254 เครื่อง ไม่พอ 500 เครื่อง" }
      - { match: 64, feedback: "64 เกิดจากใช้ prefix /22 ซึ่งให้โฮสต์ใช้ได้ 1022 เครื่อง ซึ่งเกินความต้องการและไม่ใช่ prefix ที่เล็กที่สุดที่พอ" }
    solution: "/23 ให้โฮสต์ใช้ได้ $2^9 - 2 = 510$ เครื่อง พอกับ 500 แต่ /24 ให้ 254 เครื่องไม่พอ จึงใช้ /23 ยืม $23 - 16 = 7$ บิต ได้ $2^7 = 128$ ซับเน็ต"
    license: CC-BY-SA-4.0
    ai_assisted: true

