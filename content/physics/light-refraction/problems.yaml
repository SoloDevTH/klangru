problems:
  - id: phy.refr.p001
    topics: [physics.light.refraction]
    difficulty: 1
    type: numeric
    stem: "แสงเคลื่อนที่ในแก้วชนิดหนึ่งด้วยอัตราเร็ว $2.0 \\times 10^8\\ \\mathrm{m/s}$ แก้วนี้มีดรรชนีหักเหเท่าใด ใช้ $c = 3.0 \\times 10^8\\ \\mathrm{m/s}$ (ตอบเป็นตัวเลข ไม่มีหน่วย)"
    answer: { value: 1.5, tolerance: 0.01 }
    hints:
      - "ดรรชนีหักเหบอกว่าแสงในตัวกลางช้ากว่าในสุญญากาศกี่เท่า"
      - "ใช้ $n = \\dfrac{c}{v}$"
    misconceptions:
      - { match: 0.667, feedback: "ดูเหมือนคิด $\\tfrac{v}{c}$ ดรรชนีหักเหของตัวกลางใด ๆ ต้องไม่น้อยกว่า 1 สูตรคือ $n = \\tfrac{c}{v}$" }
    solution: "$n = \\dfrac{c}{v} = \\dfrac{3.0 \\times 10^8\\ \\mathrm{m/s}}{2.0 \\times 10^8\\ \\mathrm{m/s}} = 1.5$ (ไม่มีหน่วยเพราะหน่วยตัดกันหมด)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p002
    topics: [physics.light.refraction]
    difficulty: 2
    type: numeric
    stem: "น้ำมีดรรชนีหักเห $1.33$ แสงในน้ำมีอัตราเร็วกี่เท่าของ $10^8\\ \\mathrm{m/s}$ ใช้ $c = 3.0 \\times 10^8\\ \\mathrm{m/s}$ (ตอบเป็นตัวเลขหน้า $10^8$ ทศนิยม 2 ตำแหน่ง เช่น ถ้าได้ $1.50 \\times 10^8\\ \\mathrm{m/s}$ ให้ตอบ 1.50)"
    answer: { value: 2.26, tolerance: 0.02, unit: "×10⁸ m/s" }
    hints:
      - "จัดรูป $n = \\dfrac{c}{v}$ ให้ $v$ อยู่ข้างเดียว"
      - "$v = \\dfrac{c}{n}$ แสงในน้ำต้องช้ากว่าในสุญญากาศ"
    misconceptions:
      - { match: 3.99, feedback: "ดูเหมือนคูณ $c \\times n$ แสงในน้ำต้องช้ากว่า $3.0 \\times 10^8\\ \\mathrm{m/s}$ จึงต้องหารด้วย $n$" }
    solution: "$v = \\dfrac{c}{n} = \\dfrac{3.0 \\times 10^8\\ \\mathrm{m/s}}{1.33} \\approx 2.26 \\times 10^8\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p003
    topics: [physics.light.refraction]
    difficulty: 1
    type: mcq
    stem: "ส่องไฟฉายเฉียง ๆ ลงไปในบ่อปลาที่บ้าน ลำแสงจากอากาศเข้าสู่น้ำจะเบนอย่างไร"
    choices:
      - { id: a, text: "เบนเข้าหาเส้นปกติ เพราะแสงในน้ำช้ากว่าในอากาศ", correct: true }
      - { id: b, text: "เบนออกจากเส้นปกติ เพราะแสงในน้ำช้ากว่าในอากาศ", feedback: "เมื่อแสงช้าลง ($n$ มากขึ้น) $\\sin\\theta_2 < \\sin\\theta_1$ มุมหักเหจึงเล็กลง แปลว่าเบนเข้าหาเส้นปกติ" }
      - { id: c, text: "ไม่เบนเลย เดินทางเป็นเส้นตรงต่อไป", feedback: "แสงไม่เบนเฉพาะเมื่อตกตั้งฉากกับผิวน้ำ ลำแสงที่ส่องเฉียงจะเบนเสมอ" }
      - { id: d, text: "เบนเข้าหาเส้นปกติ เพราะแสงในน้ำเร็วกว่าในอากาศ", feedback: "ทิศการเบนถูก แต่เหตุผลผิด น้ำมี $n = 1.33$ แสงในน้ำจึงช้ากว่าในอากาศ" }
    hints:
      - "น้ำมีดรรชนีหักเหมากกว่าหรือน้อยกว่าอากาศ"
      - "ใช้ $n_1 \\sin\\theta_1 = n_2 \\sin\\theta_2$ ถ้า $n_2 > n_1$ แล้ว $\\theta_2$ เล็กหรือใหญ่กว่า $\\theta_1$"
    solution: "น้ำมี $n$ มากกว่าอากาศ แสงในน้ำจึงช้ากว่า จาก $n_1 \\sin\\theta_1 = n_2 \\sin\\theta_2$ เมื่อ $n_2 > n_1$ ได้ $\\theta_2 < \\theta_1$ ลำแสงจึงเบนเข้าหาเส้นปกติ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p004
    topics: [physics.light.refraction]
    difficulty: 3
    type: numeric
    stem: "แสงจากอากาศ ($n = 1.00$) ตกกระทบผิวน้ำ ($n = 1.33$) ด้วยมุมตกกระทบ $45^\\circ$ มุมหักเหเป็นกี่องศา (ตอบเป็นตัวเลขในหน่วยองศา ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 32.1, tolerance: 0.3, unit: องศา }
    hints:
      - "ใช้กฎของสเนลล์ $n_1 \\sin\\theta_1 = n_2 \\sin\\theta_2$"
      - "หา $\\sin\\theta_2 = \\dfrac{n_1 \\sin\\theta_1}{n_2}$ ก่อน"
      - "แล้วใช้ $\\sin^{-1}$ แปลงกลับเป็นมุม"
    misconceptions:
      - { match: 33.8, feedback: "ดูเหมือนนำมุม $45^\\circ$ หารด้วย 1.33 ตรง ๆ กฎของสเนลล์ใช้ $\\sin\\theta$ ไม่ใช่ตัวมุม" }
      - { match: 70.1, feedback: "ดูเหมือนสลับ $n_1$ กับ $n_2$ ($\\sin\\theta_2 = 1.33 \\sin 45^\\circ$) ทำให้มุมใหญ่ขึ้น แต่แสงเข้าน้ำต้องเบนเข้าหาเส้นปกติ มุมต้องเล็กลง" }
    solution: "$\\sin\\theta_2 = \\dfrac{1.00 \\times \\sin 45^\\circ}{1.33} = \\dfrac{0.707}{1.33} = 0.532$ จึงได้ $\\theta_2 = \\sin^{-1}(0.532) \\approx 32.1^\\circ$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p005
    topics: [physics.light.refraction]
    difficulty: 3
    type: numeric
    stem: "แก้วมีดรรชนีหักเห $1.50$ มุมวิกฤตสำหรับแสงที่พุ่งจากแก้วออกสู่อากาศ ($n = 1.00$) เป็นกี่องศา (ตอบเป็นตัวเลขในหน่วยองศา ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 41.8, tolerance: 0.4, unit: องศา }
    hints:
      - "ที่มุมวิกฤต มุมหักเหในอากาศเป็น $90^\\circ$"
      - "ใช้ $\\sin\\theta_c = \\dfrac{n_2}{n_1}$ โดย $n_1$ คือตัวกลางที่แสงเริ่มต้นอยู่"
      - "หาค่า $\\sin\\theta_c$ แล้วใช้ $\\sin^{-1}$"
    misconceptions:
      - { match: 48.2, feedback: "ดูเหมือนใช้ $\\cos^{-1}$ แทน $\\sin^{-1}$ จากกฎของสเนลล์ $n_1 \\sin\\theta_c = n_2 \\sin 90^\\circ$ จึงเป็น $\\sin\\theta_c$" }
      - { match: 0.667, feedback: "นั่นคือค่า $\\sin\\theta_c$ ยังต้องใช้ $\\sin^{-1}$ แปลงเป็นมุม" }
    solution: "$\\sin\\theta_c = \\dfrac{1.00}{1.50} = 0.667$ จึงได้ $\\theta_c = \\sin^{-1}(0.667) \\approx 41.8^\\circ$ แสงในแก้วที่ตกกระทบผิวด้วยมุมมากกว่านี้จะสะท้อนกลับหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p006
    topics: [physics.light.refraction]
    difficulty: 3
    type: match
    stem: "จับคู่อุปกรณ์กับชนิดเลนส์และลักษณะภาพที่อุปกรณ์นั้นใช้"
    pairs:
      - { left: "กล้องถ่ายรูป", right: "เลนส์นูน วัตถุไกลกว่า $2f$ ได้ภาพจริง หัวกลับ เล็กลง" }
      - { left: "เครื่องฉายภาพ", right: "เลนส์นูน วัตถุอยู่ระหว่าง $f$ กับ $2f$ ได้ภาพจริง หัวกลับ ใหญ่ขึ้น" }
      - { left: "แว่นขยาย", right: "เลนส์นูน วัตถุใกล้กว่า $f$ ได้ภาพเสมือน หัวตั้ง ใหญ่ขึ้น" }
      - { left: "แว่นสายตาสั้น", right: "เลนส์เว้า ได้ภาพเสมือน หัวตั้ง เล็กลง" }
    hints:
      - "อุปกรณ์ใดต้องการภาพจริงบนฉากหรือเซนเซอร์ อุปกรณ์ใดให้ตาเรามองภาพผ่านเลนส์"
      - "เลนส์เว้ากระจายแสง ให้ภาพเสมือนขนาดเล็กเสมอ"
    solution: "กล้องถ่ายรูปต้องย่อภาพวัตถุไกลลงบนเซนเซอร์ (นูน $s > 2f$) · เครื่องฉายขยายภาพสไลด์ไปบนฉาก (นูน $f < s < 2f$) · แว่นขยายให้ภาพเสมือนใหญ่ (นูน $s < f$) · แว่นสายตาสั้นใช้เลนส์เว้ากระจายแสงก่อนเข้าตา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p007
    topics: [physics.light.refraction]
    difficulty: 4
    type: numeric
    stem: "วางวัตถุห่างจากเลนส์นูนที่มีความยาวโฟกัส $10\\ \\mathrm{cm}$ เป็นระยะ $15\\ \\mathrm{cm}$ ภาพเกิดห่างจากเลนส์กี่เซนติเมตร (ตอบเป็นตัวเลขในหน่วย cm ถ้าเป็นภาพเสมือนให้ใส่เครื่องหมายลบ)"
    answer: { value: 30, tolerance: 0.2, unit: cm }
    hints:
      - "ใช้ $\\dfrac{1}{f} = \\dfrac{1}{s} + \\dfrac{1}{s'}$ เลนส์นูนมี $f$ เป็นบวก"
      - "$\\dfrac{1}{s'} = \\dfrac{1}{f} - \\dfrac{1}{s}$ ทำส่วนให้เท่ากัน แล้วกลับเศษส่วน"
    misconceptions:
      - { match: 6, feedback: "ดูเหมือนบวกส่วนกลับ ($\\tfrac{1}{10} + \\tfrac{1}{15}$) เมื่อย้าย $\\tfrac{1}{s}$ ไปอีกข้างต้องเป็นการลบ" }
      - { match: 5, feedback: "ดูเหมือนนำระยะมาลบกันตรง ๆ ($15 - 10$) สูตรเลนส์ต้องคิดด้วยส่วนกลับของระยะ" }
    solution: "$\\dfrac{1}{s'} = \\dfrac{1}{10} - \\dfrac{1}{15} = \\dfrac{3 - 2}{30} = \\dfrac{1}{30}$ → $s' = +30\\ \\mathrm{cm}$ ภาพจริง หัวกลับ อยู่อีกฝั่งของเลนส์ ขนาด $m = \\tfrac{30}{15} = 2$ เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p008
    topics: [physics.light.refraction]
    difficulty: 4
    type: numeric
    stem: "เลนส์เว้ามีความยาวโฟกัส $-20\\ \\mathrm{cm}$ วางวัตถุห่างเลนส์ $20\\ \\mathrm{cm}$ ภาพเกิดที่ระยะเท่าใด (ตอบเป็นตัวเลขในหน่วย cm ถ้าเป็นภาพเสมือนให้ใส่เครื่องหมายลบ)"
    answer: { value: -10, tolerance: 0.1, unit: cm }
    hints:
      - "เลนส์เว้ามี $f$ เป็นลบ แทนค่าพร้อมเครื่องหมาย"
      - "$\\dfrac{1}{s'} = \\dfrac{1}{-20} - \\dfrac{1}{20}$ แล้วกลับเศษส่วน"
    misconceptions:
      - { match: 10, feedback: "ขนาดถูกแล้ว แต่เลนส์เว้าให้ภาพเสมือนเสมอ $s'$ ต้องเป็นลบ" }
      - { match: -20, feedback: "ดูเหมือนคิดว่าภาพเกิดที่จุดโฟกัส ต้องคำนวณจากสูตรเลนส์ $\\tfrac{1}{s'} = \\tfrac{1}{f} - \\tfrac{1}{s}$" }
    solution: "$\\dfrac{1}{s'} = -\\dfrac{1}{20} - \\dfrac{1}{20} = -\\dfrac{2}{20} = -\\dfrac{1}{10}$ → $s' = -10\\ \\mathrm{cm}$ ภาพเสมือน หัวตั้ง อยู่ฝั่งเดียวกับวัตถุ ขนาด $m = \\tfrac{10}{20} = 0.5$ เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p009
    topics: [physics.light.refraction]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "อินเทอร์เน็ตไฟเบอร์ที่บ้านส่งข้อมูลเป็นแสงไปตามเส้นใยแก้วได้โดยแสงไม่รั่วออกด้านข้าง เพราะเกิดการสะท้อนกลับหมด เงื่อนไขใดจำเป็นต่อการสะท้อนกลับหมด (เลือกได้มากกว่า 1 ข้อ)"
    choices:
      - { id: a, text: "แสงต้องเคลื่อนจากตัวกลางที่มีดรรชนีหักเหมากไปยังตัวกลางที่มีดรรชนีหักเหน้อย", correct: true }
      - { id: b, text: "มุมตกกระทบต้องมากกว่ามุมวิกฤต", correct: true }
      - { id: c, text: "แสงต้องเคลื่อนจากตัวกลางที่มีดรรชนีหักเหน้อยไปยังตัวกลางที่มีดรรชนีหักเหมาก", feedback: "ทิศนี้แสงเบนเข้าหาเส้นปกติ มุมหักเหเล็กกว่ามุมตกกระทบเสมอ จึงหักเหออกไปได้ทุกมุม ไม่มีมุมวิกฤต" }
      - { id: d, text: "มุมตกกระทบต้องน้อยกว่ามุมวิกฤต", feedback: "ถ้ามุมตกกระทบน้อยกว่ามุมวิกฤต แสงส่วนใหญ่จะหักเหออกไป การสะท้อนกลับหมดเกิดเมื่อมุมตกกระทบมากกว่ามุมวิกฤต" }
      - { id: e, text: "ผิวของเส้นใยต้องเคลือบด้วยโลหะเงาเหมือนกระจก", feedback: "การสะท้อนกลับหมดไม่ต้องใช้ผิวโลหะ เกิดจากการหักเหที่รอยต่อระหว่างแก้วสองชนิดที่ดรรชนีหักเหต่างกัน จึงแทบไม่สูญเสียแสง" }
    hints:
      - "มุมวิกฤตหาจาก $\\sin\\theta_c = \\tfrac{n_2}{n_1}$ ค่านี้ต้องน้อยกว่า 1 จึงต้องมี $n_1$ กับ $n_2$ แบบใด"
      - "เมื่อมีมุมวิกฤตแล้ว มุมตกกระทบต้องเทียบกับมุมวิกฤตอย่างไร"
    solution: "การสะท้อนกลับหมดต้องมีสองเงื่อนไข: แสงไปจาก $n$ มากสู่ $n$ น้อย (จึงมีมุมวิกฤตได้ เพราะ $\\tfrac{n_2}{n_1} < 1$) และมุมตกกระทบมากกว่ามุมวิกฤต ข้อถูกคือ a และ b"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p010
    topics: [physics.light.refraction]
    difficulty: 5
    type: numeric
    stem: "สายไฟเบอร์ที่ใช้ส่งอินเทอร์เน็ตในประเทศไทยมีแกนกลางเป็นแก้ว $n = 1.50$ หุ้มด้วยแก้วอีกชั้น $n = 1.40$ มุมวิกฤตที่รอยต่อระหว่างแกนกับชั้นหุ้มเป็นกี่องศา (ตอบเป็นตัวเลขในหน่วยองศา ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 69.0, tolerance: 0.5, unit: องศา }
    hints:
      - "แสงอยู่ในแกนกลางแล้วตกกระทบชั้นหุ้ม ตัวกลางที่ 1 และ 2 คืออะไร"
      - "ใช้ $\\sin\\theta_c = \\dfrac{n_2}{n_1}$ โดย $n_2$ คือชั้นหุ้ม ไม่ใช่อากาศ"
      - "หาค่าไซน์แล้วใช้ $\\sin^{-1}$"
    misconceptions:
      - { match: 41.8, feedback: "นั่นคือมุมวิกฤตระหว่างแก้วกับอากาศ แต่แสงในแกนกลางกระทบชั้นหุ้มที่มี $n = 1.40$ ต้องใช้ $n_2 = 1.40$" }
      - { match: 21.0, feedback: "นั่นคือ $90^\\circ - \\theta_c$ ซึ่งเป็นมุมที่วัดจากผิวรอยต่อ มุมวิกฤตวัดจากเส้นปกติ" }
    solution: "$\\sin\\theta_c = \\dfrac{1.40}{1.50} = 0.933$ จึงได้ $\\theta_c = \\sin^{-1}(0.933) \\approx 69.0^\\circ$ แสงที่วิ่งเกือบขนานกับเส้นใยตกกระทบรอยต่อด้วยมุมมากกว่า $69^\\circ$ จึงสะท้อนกลับหมดและเดินทางต่อไปในแกนกลาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p011
    topics: [physics.light.refraction]
    difficulty: 5
    type: numeric
    stem: "นักสะสมพระเครื่องใช้กล้องส่องพระซึ่งเป็นเลนส์นูนความยาวโฟกัส $5\\ \\mathrm{cm}$ ถือเลนส์ห่างองค์พระ $4\\ \\mathrm{cm}$ ภาพที่เห็นขยายกี่เท่า (ตอบเป็นตัวเลขกำลังขยาย)"
    answer: { value: 5, tolerance: 0.05 }
    hints:
      - "วัตถุอยู่ใกล้กว่าจุดโฟกัส คาดว่าได้ภาพชนิดใด"
      - "หา $s'$ จาก $\\dfrac{1}{s'} = \\dfrac{1}{f} - \\dfrac{1}{s}$ จะออกมาเป็นลบ"
      - "กำลังขยาย $m = \\dfrac{|s'|}{s}$"
    misconceptions:
      - { match: 0.2, feedback: "ดูเหมือนใช้ $\\tfrac{s}{|s'|}$ กล้องส่องพระต้องขยายภาพให้ใหญ่ขึ้น กำลังขยายคือ $\\tfrac{|s'|}{s}$" }
      - { match: 0.556, feedback: "ดูเหมือนบวกส่วนกลับ ($\\tfrac{1}{5} + \\tfrac{1}{4}$) ต้องใช้ $\\tfrac{1}{s'} = \\tfrac{1}{f} - \\tfrac{1}{s}$" }
    solution: "$\\dfrac{1}{s'} = \\dfrac{1}{5} - \\dfrac{1}{4} = \\dfrac{4 - 5}{20} = -\\dfrac{1}{20}$ → $s' = -20\\ \\mathrm{cm}$ ภาพเสมือน หัวตั้ง อยู่ฝั่งเดียวกับองค์พระ กำลังขยาย $m = \\dfrac{20}{4} = 5$ เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p012
    topics: [physics.light.refraction]
    difficulty: 4
    type: numeric
    stem: "นักเรียนส่องเลเซอร์จากอากาศ ($n = 1.00$) ลงไปในน้ำมันปาล์มด้วยมุมตกกระทบ $60^\\circ$ วัดมุมหักเหได้ $36^\\circ$ น้ำมันปาล์มมีดรรชนีหักเหเท่าใด (ตอบเป็นตัวเลข ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 1.47, tolerance: 0.015 }
    hints:
      - "ใช้กฎของสเนลล์ $n_1 \\sin\\theta_1 = n_2 \\sin\\theta_2$ ตัวไม่รู้คือ $n_2$"
      - "$n_2 = \\dfrac{n_1 \\sin\\theta_1}{\\sin\\theta_2}$ หาค่าไซน์ของแต่ละมุมก่อนหาร"
    misconceptions:
      - { match: 1.67, feedback: "ดูเหมือนนำมุมมาหารกันตรง ๆ ($\\tfrac{60}{36}$) กฎของสเนลล์ใช้อัตราส่วนของ $\\sin\\theta$" }
      - { match: 0.68, feedback: "ดูเหมือนกลับเศษส่วน ($\\tfrac{\\sin 36^\\circ}{\\sin 60^\\circ}$) ดรรชนีหักเหต้องไม่น้อยกว่า 1 และแสงเบนเข้าหาเส้นปกติแปลว่าน้ำมันมี $n$ มากกว่าอากาศ" }
    solution: "$n_2 = \\dfrac{1.00 \\times \\sin 60^\\circ}{\\sin 36^\\circ} = \\dfrac{0.866}{0.588} \\approx 1.47$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p013
    topics: [physics.light.refraction]
    difficulty: 3
    type: expression
    stem: "แสงพุ่งจากตัวกลางที่มีดรรชนีหักเห $n_1$ ไปยังตัวกลางที่มีดรรชนีหักเห $n_2$ (โดย $n_1 > n_2$) ใช้กฎของสเนลล์ $n_1 \\sin\\theta_1 = n_2 \\sin\\theta_2$ เขียน $\\sin\\theta_c$ ของมุมวิกฤตในรูปของ $n_1$ และ $n_2$"
    prefix: "\\sin\\theta_c ="
    answer: { latex: "\\frac{n_2}{n_1}", variables: [n_1, n_2] }
    misconceptions:
      - { match: "\\frac{n_1}{n_2}", feedback: "เมื่อ $n_1 > n_2$ ค่า $\\tfrac{n_1}{n_2}$ มากกว่า 1 ซึ่งเป็นค่าไซน์ไม่ได้ แทน $\\theta_1 = \\theta_c$ และ $\\theta_2 = 90^\\circ$ แล้วจัดรูปใหม่" }
      - { match: "n_1 n_2", feedback: "จาก $n_1 \\sin\\theta_c = n_2$ ต้องหารทั้งสองข้างด้วย $n_1$ ไม่ใช่คูณ" }
    hints:
      - "ที่มุมวิกฤต มุมตกกระทบคือ $\\theta_c$ และมุมหักเหเป็นเท่าใด"
      - "แทน $\\theta_2 = 90^\\circ$ ซึ่ง $\\sin 90^\\circ = 1$ แล้วจัดรูปหา $\\sin\\theta_c$"
    solution: "ที่มุมวิกฤต $\\theta_1 = \\theta_c$ และ $\\theta_2 = 90^\\circ$: $n_1 \\sin\\theta_c = n_2 \\times 1$ จึงได้ $\\sin\\theta_c = \\dfrac{n_2}{n_1}$ ซึ่งน้อยกว่า 1 เมื่อ $n_1 > n_2$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p014
    topics: [physics.light.refraction]
    difficulty: 2
    type: order
    stem: "เรียงตัวกลางตามอัตราเร็วของแสง จาก **เร็วที่สุด** ไป **ช้าที่สุด** (ดรรชนีหักเห: อากาศ 1.00, น้ำ 1.33, แก้ว 1.50, เพชร 2.42)"
    items:
      - "อากาศ"
      - "น้ำ"
      - "แก้ว"
      - "เพชร"
    hints:
      - "ดรรชนีหักเหมากแปลว่าแสงช้าลงมากหรือน้อย"
      - "จาก $v = \\dfrac{c}{n}$ ยิ่ง $n$ มาก $v$ ยิ่งน้อย"
    solution: "$v = \\tfrac{c}{n}$: อากาศ $\\approx 3.0 \\times 10^8$ > น้ำ $\\approx 2.26 \\times 10^8$ > แก้ว $2.0 \\times 10^8$ > เพชร $\\approx 1.24 \\times 10^8\\ \\mathrm{m/s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p015
    topics: [physics.light.refraction]
    difficulty: 1
    type: mcq
    stem: "มองลงไปในสระว่ายน้ำ สระดูตื้นกว่าความลึกจริง เพราะเหตุใด"
    choices:
      - { id: a, text: "แสงจากพื้นสระหักเหออกจากเส้นปกติเมื่อออกจากน้ำสู่อากาศ ตาจึงเห็นพื้นสระสูงขึ้น", correct: true }
      - { id: b, text: "น้ำดูดกลืนแสงจากพื้นสระไปบางส่วน", feedback: "การดูดกลืนทำให้ภาพมืดลง แต่ไม่ได้ทำให้ตำแหน่งที่เห็นเปลี่ยน ตำแหน่งเปลี่ยนเพราะแสงเปลี่ยนทิศที่ผิวน้ำ" }
      - { id: c, text: "แสงสะท้อนจากผิวน้ำกลับขึ้นมา", feedback: "แสงที่สะท้อนจากผิวน้ำทำให้เห็นท้องฟ้าหรือเงาสะท้อน ไม่ได้มาจากพื้นสระ ภาพพื้นสระเกิดจากแสงที่หักเหออกจากน้ำ" }
      - { id: d, text: "แสงเร็วขึ้นเมื่อเข้าน้ำ", feedback: "แสงในน้ำช้ากว่าในอากาศ ($n$ ของน้ำมากกว่า) ตอนออกจากน้ำแสงจึงเร็วขึ้นและเบนออกจากเส้นปกติ" }
    hints:
      - "แสงจากพื้นสระต้องเดินทางผ่านผิวน้ำก่อนเข้าตา"
      - "ตาเราตีความว่าแสงเดินทางเป็นเส้นตรงเสมอ"
    solution: "แสงจากพื้นสระออกจากน้ำ ($n = 1.33$) สู่อากาศ ($n = 1.00$) จึงเบนออกจากเส้นปกติ ตาลากแนวรังสีย้อนกลับเป็นเส้นตรงไปตัดกันที่จุดสูงกว่าพื้นสระจริง สระจึงดูตื้นกว่าความจริง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p016
    topics: [physics.light.refraction]
    difficulty: 2
    type: numeric
    stem: "ปลาทองว่ายอยู่ลึกจากผิวน้ำในบ่อบัว $1.2\\ \\mathrm{m}$ เมื่อมองจากด้านบนเกือบตั้งฉากกับผิวน้ำ จะเห็นปลาลึกจากผิวน้ำเท่าใด (น้ำ $n = 1.33$ อากาศ $n = 1.00$ ตอบเป็นตัวเลขในหน่วย m ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 0.902, tolerance: 0.01, unit: m }
    hints:
      - "ความลึกปรากฏหารด้วยความลึกจริงเท่ากับ $n$ ของตัวกลางที่ตาอยู่หารด้วย $n$ ของตัวกลางที่วัตถุอยู่"
      - "มองจากอากาศลงน้ำ ภาพต้องตื้นกว่าวัตถุ"
    misconceptions:
      - { match: 1.596, feedback: "ดูเหมือนคูณด้วย $1.33$ ได้ภาพลึกกว่าของจริง แต่มองจากอากาศลงน้ำ ปลาดูตื้นขึ้น ต้องหารด้วย $1.33$" }
    solution: "ความลึกปรากฏ $= 1.2 \\times \\dfrac{1.00}{1.33} \\approx 0.90\\ \\mathrm{m}$ ปลาดูอยู่สูงกว่าจริงราว $0.3\\ \\mathrm{m}$ คนจับปลาด้วยฉมวกจึงต้องเล็งให้ต่ำกว่าที่เห็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p017
    topics: [physics.light.refraction]
    difficulty: 3
    type: numeric
    stem: "ส่องแสงจากอากาศ ($n = 1.00$) เข้าสู่ตัวกลาง X วัดมุมได้ดังภาพ ตัวกลาง X มีดรรชนีหักเหเท่าใด (ตอบเป็นตัวเลข ทศนิยม 2 ตำแหน่ง)"
    figure: { src: refraction-unknown.svg, alt: "รอยต่อแนวนอน ด้านบนเป็นอากาศ n = 1.00 ด้านล่างเป็นตัวกลาง X รังสีแสงจากด้านซ้ายบนทำมุม 50° กับเส้นปกติ เข้าสู่ตัวกลาง X แล้วหักเหทำมุม 30° กับเส้นปกติ" }
    answer: { value: 1.532, tolerance: 0.015 }
    hints:
      - "ใช้กฎของสเนลล์ $n_1 \\sin\\theta_1 = n_2 \\sin\\theta_2$"
      - "มุมตกกระทบ $50^\\circ$ มุมหักเห $30^\\circ$ วัดจากเส้นปกติทั้งคู่"
      - "$n_2 = \\dfrac{n_1 \\sin 50^\\circ}{\\sin 30^\\circ}$"
    misconceptions:
      - { match: 1.667, feedback: "ดูเหมือนนำมุมมาหารกันตรง ๆ ($\\tfrac{50}{30}$) กฎของสเนลล์ใช้ค่า $\\sin$ ของมุม" }
      - { match: 0.653, feedback: "ดูเหมือนกลับเศษกับส่วน ดรรชนีหักเหต้องมากกว่า 1 และแสงเบนเข้าหาเส้นปกติ แปลว่าตัวกลาง X มี $n$ มากกว่าอากาศ" }
    solution: "$n_X = \\dfrac{1.00 \\times \\sin 50^\\circ}{\\sin 30^\\circ} = \\dfrac{0.766}{0.5} \\approx 1.53$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p018
    topics: [physics.light.refraction]
    difficulty: 3
    type: mcq
    stem: "แสงเข้าปริซึมแก้วมุมฉาก ($n = 1.50$) ตั้งฉากกับด้านประกอบมุมฉาก จึงไม่เบน แล้วเดินไปกระทบด้านตรงข้ามมุมฉาก ดังภาพ ที่ด้านตรงข้ามมุมฉาก แสงจะเป็นอย่างไร (มุมวิกฤตของแก้วกับอากาศประมาณ $41.8^\\circ$)"
    figure: { src: prism-45.svg, alt: "ปริซึมแก้วรูปสามเหลี่ยมมุมฉาก มุมแหลมสองมุมเป็น 45° แสงเดินในแนวนอนเข้าทางด้านตั้งของปริซึม ตั้งฉากกับผิวจึงไม่เบน แล้วไปกระทบด้านตรงข้ามมุมฉากซึ่งเอียง 45° มีเส้นปกติของด้านนั้นวาดเป็นเส้นประ" }
    choices:
      - { id: a, text: "สะท้อนกลับหมด เลี้ยวไป $90^\\circ$ ลงสู่ด้านล่างของปริซึม", correct: true }
      - { id: b, text: "หักเหออกสู่อากาศโดยเบนออกจากเส้นปกติ", feedback: "มุมตกกระทบที่ด้านตรงข้ามมุมฉากคือ $45^\\circ$ ซึ่งมากกว่ามุมวิกฤต $41.8^\\circ$ แสงจึงออกไม่ได้" }
      - { id: c, text: "ผ่านออกไปตรง ๆ ไม่เบน", feedback: "แสงผ่านไปไม่เบนเฉพาะเมื่อตกตั้งฉากกับผิว แต่ด้านตรงข้ามมุมฉากเอียง $45^\\circ$ กับทิศของแสง" }
      - { id: d, text: "ไม่เกิดการสะท้อนกลับหมด เพราะมุมตกกระทบต้องเป็น $90^\\circ$", feedback: "เงื่อนไขคือมุมตกกระทบมากกว่ามุมวิกฤต ไม่จำเป็นต้องถึง $90^\\circ$" }
    hints:
      - "หามุมตกกระทบที่ด้านตรงข้ามมุมฉาก (วัดจากเส้นปกติของด้านนั้น)"
      - "แสงกำลังจะออกจากแก้วสู่อากาศ ($n$ มากสู่ $n$ น้อย) เทียบมุมตกกระทบกับมุมวิกฤต"
    solution: "แสงเดินแนวนอน ด้านตรงข้ามมุมฉากเอียง $45^\\circ$ มุมตกกระทบจึงเป็น $45^\\circ$ มากกว่ามุมวิกฤต $41.8^\\circ$ และแสงไปจากแก้วสู่อากาศ จึงสะท้อนกลับหมด มุมสะท้อน $45^\\circ$ ทำให้แสงเลี้ยว $90^\\circ$ ลงไปออกทางด้านล่าง ปริซึมแบบนี้ใช้ในกล้องส่องทางไกลและกล้องเพอริสโคปแทนกระจกเงา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p019
    topics: [physics.light.refraction]
    difficulty: 4
    type: numeric
    stem: "เลเซอร์สีแดงมีความยาวคลื่นในอากาศ $650\\ \\mathrm{nm}$ เมื่อส่องเข้าไปในน้ำ ($n = 1.33$) ความยาวคลื่นในน้ำเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย nm)"
    answer: { value: 488.7, tolerance: 4.9, unit: nm }
    hints:
      - "เมื่อแสงเข้าตัวกลางใหม่ ความถี่ไม่เปลี่ยน"
      - "จาก $v = f\\lambda$ ถ้า $f$ คงที่ $\\lambda$ แปรผันตรงกับ $v$ และ $v = \\tfrac{c}{n}$"
    misconceptions:
      - { match: 864.5, feedback: "ดูเหมือนคูณด้วย $n$ แสงในน้ำช้าลง ความยาวคลื่นจึงต้องสั้นลง ต้องหารด้วย $n$" }
      - { match: 650, feedback: "ความยาวคลื่นเปลี่ยนเมื่อเข้าตัวกลาง สิ่งที่คงเดิมคือความถี่ (สีของแสง)" }
    solution: "ความถี่คงที่ $\\lambda_{\\text{น้ำ}} = \\dfrac{\\lambda_{\\text{อากาศ}}}{n} = \\dfrac{650}{1.33} \\approx 489\\ \\mathrm{nm}$ แต่ตาที่อยู่ใต้น้ำยังเห็นเป็นสีแดง เพราะสีขึ้นกับความถี่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p020
    topics: [physics.light.refraction]
    difficulty: 2
    type: mcq
    stem: "ส่องแสงขาวผ่านปริซึมแก้ว แสงแยกเป็นสีรุ้ง แสงสีใดเบนจากทิศเดิมมากที่สุด"
    choices:
      - { id: a, text: "สีม่วง", correct: true }
      - { id: b, text: "สีแดง", feedback: "แสงสีแดงมีดรรชนีหักเหในแก้วน้อยที่สุด จึงเบนน้อยที่สุด อยู่ปลายอีกด้านของสเปกตรัม" }
      - { id: c, text: "สีเขียว", feedback: "สีเขียวอยู่กลางสเปกตรัม เบนมากกว่าสีแดงแต่น้อยกว่าสีม่วง" }
      - { id: d, text: "ทุกสีเบนเท่ากัน", feedback: "ถ้าทุกสีเบนเท่ากัน แสงขาวจะไม่แยกเป็นสีรุ้ง การที่เห็นสีรุ้งแปลว่าแต่ละสีมีดรรชนีหักเหต่างกัน" }
    hints:
      - "แสงแต่ละสีมีดรรชนีหักเหในแก้วต่างกันเล็กน้อย"
      - "ดรรชนีหักเหมาก แสงเบนมาก ในแก้วแสงสีม่วงช้ากว่าแสงสีแดง"
    solution: "แสงสีม่วงมีดรรชนีหักเหในแก้วมากที่สุด จึงเบนมากที่สุด แสงสีแดงเบนน้อยที่สุด สเปกตรัมจึงเรียงจากแดงไปม่วง (การกระจายแสง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.refr.p021
    topics: [physics.light.refraction]
    difficulty: 4
    type: numeric
    stem: "คุณยายใช้แว่นขยายเลนส์นูนความยาวโฟกัส $10\\ \\mathrm{cm}$ อ่านฉลากยา ต้องการเห็นภาพเสมือนหัวตั้งใหญ่เป็น $2.5$ เท่าของตัวหนังสือ ต้องถือเลนส์ห่างฉลากกี่เซนติเมตร (ตอบเป็นตัวเลขในหน่วย cm)"
    answer: { value: 6, tolerance: 0.06, unit: cm }
    hints:
      - "ภาพเสมือนขยาย $2.5$ เท่า แปลว่า $s' = -2.5s$ (ลบเพราะภาพอยู่ฝั่งเดียวกับวัตถุ)"
      - "แทนในสูตรเลนส์ $\\dfrac{1}{10} = \\dfrac{1}{s} + \\dfrac{1}{-2.5s}$"
      - "รวมเศษส่วนทางขวาให้เป็น $\\dfrac{1.5}{2.5s}$ แล้วแก้หา $s$"
    misconceptions:
