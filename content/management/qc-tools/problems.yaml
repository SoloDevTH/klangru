problems:
  - id: mgt.qc.p001
    topics: [management.quality.qc-tools]
    difficulty: 1
    type: match
    stem: "จับคู่เครื่องมือคุณภาพกับงานที่เหมาะสมที่สุด"
    pairs:
      - { left: "ใบตรวจสอบ", right: "ขีดนับข้อมูลหน้างานลงแบบฟอร์มที่กำหนดหัวข้อไว้แล้ว" }
      - { left: "แผนภูมิพาเรโต", right: "เรียงปัญหาจากมากไปน้อยเพื่อเลือกปัญหาที่จะแก้ก่อน" }
      - { left: "แผนผังก้างปลา", right: "ระดมสมองหาสาเหตุที่เป็นไปได้ของปัญหาหนึ่ง" }
      - { left: "ฮิสโทแกรม", right: "ดูรูปร่างการกระจายของข้อมูลตัวเลขชุดหนึ่ง" }
      - { left: "แผนภาพการกระจาย", right: "ดูว่าตัวแปรสองตัวสัมพันธ์กันหรือไม่" }
      - { left: "การแบ่งชั้นข้อมูล", right: "แยกข้อมูลตามกะหรือเครื่องจักรเพื่อหาความแตกต่าง" }
      - { left: "แผนภูมิควบคุม", right: "เฝ้าดูกระบวนการตามเวลาว่ามีสาเหตุพิเศษหรือไม่" }
    hints:
      - "นึกถึงหน้าตาของแต่ละเครื่องมือ: แบบฟอร์ม แท่งเรียง ก้างปลา แท่งติดกัน จุดกระจาย เส้นตามเวลา"
      - "เครื่องมือที่มีเส้นควบคุมบนล่างใช้ดูกระบวนการตามลำดับเวลา"
    solution: "ใบตรวจสอบเก็บข้อมูล พาเรโตจัดลำดับความสำคัญ ก้างปลาหาสาเหตุ ฮิสโทแกรมดูการกระจาย แผนภาพการกระจายดูความสัมพันธ์ การแบ่งชั้นแยกกลุ่มข้อมูล และแผนภูมิควบคุมเฝ้าดูกระบวนการตามเวลา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p002
    topics: [management.quality.qc-tools]
    difficulty: 1
    type: mcq
    stem: "หัวหน้าแผนกฉุกเฉินของโรงพยาบาลนัดทีมมาระดมสมองว่า \"ทำไมผู้ป่วยจึงรอเตียงนาน\" แล้วจัดสาเหตุที่คิดได้เป็นกลุ่ม คน วิธีการ อุปกรณ์ ฯลฯ เครื่องมือใดเหมาะที่สุด"
    choices:
      - { id: a, text: "แผนผังก้างปลา", correct: true }
      - { id: b, text: "แผนภูมิควบคุม", feedback: "แผนภูมิควบคุมใช้เฝ้าดูค่าที่วัดตามเวลา ไม่ได้ใช้ระดมสมองหาสาเหตุ" }
      - { id: c, text: "ฮิสโทแกรม", feedback: "ฮิสโทแกรมแสดงการกระจายของข้อมูลตัวเลข เช่น เวลารอ แต่ไม่ได้ช่วยจัดกลุ่มสาเหตุ" }
      - { id: d, text: "แผนภาพการกระจาย", feedback: "แผนภาพการกระจายดูความสัมพันธ์ของตัวแปรสองตัว ต้องมีข้อมูลตัวเลขคู่กัน ไม่ใช่การระดมสมอง" }
    hints:
      - "งานนี้คือการหาสาเหตุ ไม่ใช่การวัดหรือการนับ"
      - "เครื่องมือใดที่วางปัญหาไว้ที่หัว แล้วแตกสาเหตุเป็นกลุ่ม"
    solution: "แผนผังก้างปลา (แผนผังสาเหตุและผล) ใช้ระดมสมองและจัดสาเหตุที่เป็นไปได้เป็นกลุ่ม เช่น คน วิธีการ อุปกรณ์ วัสดุ การวัด สภาพแวดล้อม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p003
    topics: [management.quality.qc-tools]
    difficulty: 1
    type: mcq
    stem: "ร้านเบเกอรี่อยากรู้ว่าอุณหภูมิเตาอบในแต่ละรอบ (°C) สัมพันธ์กับจำนวนขนมที่ไหม้ในรอบนั้นหรือไม่ ควรใช้เครื่องมือใด"
    choices:
      - { id: a, text: "แผนภาพการกระจาย", correct: true }
      - { id: b, text: "แผนภูมิพาเรโต", feedback: "พาเรโตเรียงประเภทปัญหาตามความถี่ ไม่ได้แสดงความสัมพันธ์ระหว่างตัวแปรตัวเลขสองตัว" }
      - { id: c, text: "ใบตรวจสอบ", feedback: "ใบตรวจสอบช่วยเก็บข้อมูลได้ แต่ไม่ได้แสดงว่าตัวแปรสองตัวสัมพันธ์กันอย่างไร" }
      - { id: d, text: "แผนผังก้างปลา", feedback: "ก้างปลาใช้ระดมสมองหาสาเหตุ ส่วนคำถามนี้มีข้อมูลตัวเลขสองตัวที่ต้องการดูความสัมพันธ์" }
    hints:
      - "มีตัวแปรตัวเลขกี่ตัวที่ต้องการเปรียบเทียบ"
      - "เครื่องมือใดวางจุดหนึ่งจุดต่อหนึ่งคู่ข้อมูล (อุณหภูมิ, จำนวนขนมไหม้)"
    solution: "แผนภาพการกระจายวางอุณหภูมิบนแกนหนึ่งและจำนวนขนมไหม้บนอีกแกน ถ้าจุดเรียงขึ้นแสดงว่าสัมพันธ์ทางบวก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p004
    topics: [management.quality.qc-tools]
    difficulty: 2
    type: numeric
    stem: "โรงงานผลิตกระทะตรวจพบของเสีย 250 ใบใน 1 สัปดาห์ แยกเป็น รอยขีดข่วน 110 บุบ 65 สีด่าง 35 ฉลากเบี้ยว 25 อื่น ๆ 15 รอยขีดข่วนคิดเป็นร้อยละเท่าใดของของเสียทั้งหมด (ตอบเป็นตัวเลขในหน่วย %)"
    answer: { value: 44, unit: "%" }
    hints:
      - "ร้อยละ = ความถี่ของประเภทนั้น ÷ ความถี่ทั้งหมด × 100"
      - "ทั้งหมดคือ 250 ใบ"
    misconceptions:
      - { match: 110, feedback: "นั่นคือจำนวนใบ ต้องแปลงเป็นร้อยละของทั้งหมดก่อน" }
    solution: "$\\dfrac{110}{250} \\times 100 = 44\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p005
    topics: [management.quality.qc-tools]
    difficulty: 2
    type: numeric
    stem: "จากข้อมูลของเสียกระทะในข้อก่อน (รอยขีดข่วน 110 บุบ 65 สีด่าง 35 ฉลากเบี้ยว 25 อื่น ๆ 15) ร้อยละสะสมของสองประเภทแรกในแผนภูมิพาเรโตเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย %)"
    answer: { value: 70, unit: "%" }
    hints:
      - "ร้อยละสะสมของประเภทที่ 2 = (ความถี่ประเภทที่ 1 + ประเภทที่ 2) ÷ ทั้งหมด × 100"
      - "ข้อมูลเรียงจากมากไปน้อยแล้ว"
    misconceptions:
      - { match: 26, feedback: "นั่นคือร้อยละของประเภท 'บุบ' อย่างเดียว ร้อยละสะสมต้องรวมประเภทก่อนหน้าด้วย" }
      - { match: 175, feedback: "นั่นคือความถี่สะสม ต้องหารด้วยทั้งหมด 250 แล้วคูณ 100" }
    solution: "ความถี่สะสม $110 + 65 = 175$ ร้อยละสะสม $\\dfrac{175}{250} \\times 100 = 70\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p006
    topics: [management.quality.qc-tools]
    difficulty: 3
    type: numeric
    stem: "จากข้อมูลของเสียกระทะ (รอยขีดข่วน 110 บุบ 65 สีด่าง 35 ฉลากเบี้ยว 25 อื่น ๆ 15 รวม 250) โรงงานต้องแก้ปัญหากี่ประเภทแรกในแผนภูมิพาเรโต จึงครอบคลุมของเสียอย่างน้อย 80% (ตอบเป็นจำนวนประเภท)"
    answer: { value: 3, unit: ประเภท }
    hints:
      - "คำนวณร้อยละสะสมทีละประเภทจากมากไปน้อย"
      - "หยุดที่ประเภทแรกที่ร้อยละสะสมถึงหรือเกิน 80%"
    misconceptions:
      - { match: 2, feedback: "สองประเภทแรกได้ร้อยละสะสม 70% ยังไม่ถึง 80% ต้องเพิ่มอีกประเภท" }
      - { match: 1, feedback: "หลักพาเรโตไม่ได้แปลว่า 20% ของจำนวนประเภทเสมอไป ต้องคำนวณร้อยละสะสมจริงจากข้อมูล" }
    solution: "ร้อยละสะสม: 44%, 70%, $\\dfrac{110 + 65 + 35}{250} \\times 100 = 84\\%$ ถึง 80% ที่ประเภทที่ 3 จึงต้องแก้ 3 ประเภท (รอยขีดข่วน บุบ สีด่าง)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p007
    topics: [management.quality.qc-tools]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการสร้างแผนภูมิพาเรโตจากข้อมูลข้อร้องเรียนให้ถูกต้อง"
    items:
      - "เก็บข้อมูลด้วยใบตรวจสอบ แยกตามประเภทข้อร้องเรียน"
      - "นับความถี่ของแต่ละประเภท"
      - "เรียงประเภทจากความถี่มากไปน้อย ให้ 'อื่น ๆ' อยู่ท้าย"
      - "คำนวณความถี่สะสมและร้อยละสะสม"
      - "วาดแท่งความถี่และเส้นร้อยละสะสม แล้วเลือกปัญหาที่จะแก้ก่อน"
    hints:
      - "ต้องมีข้อมูลก่อนจึงนับได้ และต้องเรียงก่อนจึงคิดค่าสะสมได้"
      - "การเลือกปัญหาที่จะแก้เป็นขั้นสุดท้าย หลังเห็นแผนภูมิแล้ว"
    solution: "เก็บข้อมูล → นับความถี่ → เรียงจากมากไปน้อย → คิดร้อยละสะสม → วาดแผนภูมิและเลือกปัญหา ถ้าคิดค่าสะสมก่อนเรียง เส้นสะสมจะไม่บอกว่าปัญหาใดสำคัญ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p008
    topics: [management.quality.qc-tools]
    difficulty: 2
    type: mcq
    stem: "อู่ซ่อมรถต้องการเก็บข้อมูลว่าลูกค้ากลับมาซ่อมซ้ำด้วยปัญหาแบบใดบ่อยที่สุดในแต่ละสัปดาห์ ใบตรวจสอบแบบใดเหมาะที่สุด"
    choices:
      - { id: a, text: "ตารางที่แถวเป็นประเภทปัญหาที่กำหนดไว้ล่วงหน้า คอลัมน์เป็นวัน ให้ช่างขีดนับทันทีที่พบ", correct: true }
      - { id: b, text: "สมุดเปล่าให้ช่างเขียนเล่าเหตุการณ์ตามสะดวกเมื่อมีเวลา", feedback: "ข้อความอิสระจัดกลุ่มและนับยาก และการจดย้อนหลังทำให้ข้อมูลตกหล่น" }
      - { id: c, text: "แบบสอบถามความพึงพอใจให้ลูกค้าให้คะแนน 1–5", feedback: "คะแนนความพึงพอใจไม่ได้บอกประเภทปัญหาที่ทำให้ต้องซ่อมซ้ำ" }
      - { id: d, text: "จดเฉพาะยอดรวมจำนวนรถที่กลับมาซ่อมซ้ำในแต่ละสัปดาห์", feedback: "ยอดรวมไม่ได้แยกประเภทปัญหา จึงตอบไม่ได้ว่าปัญหาใดบ่อยที่สุด" }
    hints:
      - "ใบตรวจสอบที่ดีทำให้บันทึกง่ายและนับได้ทันที"
      - "ต้องแยกได้ทั้งประเภทปัญหาและช่วงเวลา"
    solution: "ใบตรวจสอบที่ดีกำหนดหัวข้อไว้ล่วงหน้า แยกตามช่วงเวลา และให้ขีดนับทันทีที่พบ ข้อมูลจึงครบและนำไปทำแผนภูมิพาเรโตได้ทันที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p009
    topics: [management.quality.qc-tools]
    difficulty: 3
    type: numeric
    stem: "เครื่องบรรจุน้ำตาลถุงละ 500 g ในสภาพปกติให้น้ำหนักเฉลี่ย 500 g และส่วนเบี่ยงเบนมาตรฐาน 4 g เส้นควบคุมบน (UCL) ของแผนภูมิควบคุมค่าเดี่ยวเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย g)"
    answer: { value: 512, unit: g }
    hints:
      - "เส้นควบคุมห่างจากเส้นกลางกี่เท่าของส่วนเบี่ยงเบนมาตรฐาน"
      - "$\\text{UCL} = \\mu + 3\\sigma$"
    misconceptions:
      - { match: 504, feedback: "นั่นคือ $\\mu + \\sigma$ เส้นควบคุมใช้ 3 เท่าของส่วนเบี่ยงเบนมาตรฐาน" }
      - { match: 488, feedback: "นั่นคือเส้นควบคุมล่าง ($\\mu - 3\\sigma$) โจทย์ถามเส้นบน" }
    solution: "$\\text{UCL} = 500 + 3(4) = 512$ g (และ $\\text{LCL} = 500 - 12 = 488$ g)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p010
    topics: [management.quality.qc-tools]
    difficulty: 3
    type: numeric
    stem: "แผนภูมิควบคุมในภาพเป็นน้ำหนักข้าวสารถุง 5 kg จาก 15 ตัวอย่าง มีเส้นกลาง 5000 g เส้นควบคุมบน 5030 g และเส้นควบคุมล่าง 4970 g ตัวอย่างลำดับที่เท่าใดเป็นสัญญาณของสาเหตุพิเศษ (ตอบเป็นเลขลำดับตัวอย่าง)"
    figure:
      src: rice-chart.svg
      alt: "แผนภูมิควบคุม 15 ตัวอย่าง เส้นกลาง 5000 เส้นควบคุมบน 5030 เส้นควบคุมล่าง 4970 ค่าของตัวอย่างที่ 1 ถึง 15 คือ 5004, 4992, 5011, 4998, 5017, 5026, 4989, 5006, 4995, 5008, 4964, 5001, 4993, 5012, 4999 กรัม"
    answer: { value: 11 }
    hints:
      - "หาจุดที่อยู่นอกช่วงระหว่างเส้นควบคุมล่างกับบน"
      - "จุดที่อยู่ใกล้เส้นควบคุมแต่ยังไม่ข้ามยังถือว่าอยู่ในการควบคุม"
    misconceptions:
      - { match: 6, feedback: "ตัวอย่างที่ 6 (5026 g) สูงที่สุดฝั่งบน แต่ยังต่ำกว่า UCL 5030 g จึงยังอยู่ในการควบคุม" }
    solution: "ตัวอย่างที่ 11 หนัก 4964 g ต่ำกว่า LCL 4970 g จึงเป็นสัญญาณของสาเหตุพิเศษ ตัวอย่างอื่นอยู่ระหว่าง 4970–5030 g และไม่มีจุดเรียงด้านเดียวติดกันยาว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p011
    topics: [management.quality.qc-tools]
    difficulty: 2
    type: match
    stem: "โรงงานบรรจุน้ำผลไม้มีปัญหาปริมาตรไม่เต็มขวด จับคู่สาเหตุที่ทีมระดมสมองได้กับกลุ่มในแผนผังก้างปลาแบบ 6M"
    pairs:
      - { left: "พนักงานใหม่ยังไม่ได้รับการอบรม", right: "คน" }
      - { left: "หัวฉีดของเครื่องบรรจุสึก", right: "เครื่องจักร" }
      - { left: "ขวดจากผู้ขายรายใหม่มีขนาดคลาดเคลื่อน", right: "วัสดุ" }
      - { left: "เครื่องชั่งตรวจปริมาตรไม่ได้สอบเทียบ", right: "การวัด" }
    hints:
      - "6M คือ คน เครื่องจักร วิธีการ วัสดุ การวัด สภาพแวดล้อม"
      - "เครื่องมือวัดจัดอยู่ในกลุ่มการวัด แม้จะเป็นเครื่องเหมือนกัน"
    solution: "การอบรมพนักงานเป็นเรื่องของคน หัวฉีดเป็นเครื่องจักร ขวดเป็นวัสดุ และเครื่องชั่งที่ไม่ได้สอบเทียบเป็นเรื่องการวัด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p012
    topics: [management.quality.qc-tools]
    difficulty: 3
    type: numeric
    stem: "ศูนย์บริการไปรษณีย์สุ่มตรวจพัสดุวันละ 100 ชิ้น เป็นเวลา 20 วัน พบพัสดุที่จ่าหน้าผิดรวม 120 ชิ้น สัดส่วนของเสียเฉลี่ย $\\bar{p}$ ซึ่งเป็นเส้นกลางของแผนภูมิ p เป็นเท่าใด (ตอบเป็นทศนิยม)"
    answer: { value: 0.06, tolerance: 0.001 }
    hints:
      - "$\\bar{p}$ = จำนวนของเสียทั้งหมด ÷ จำนวนที่ตรวจทั้งหมด"
      - "ตรวจทั้งหมด $20 \\times 100$ ชิ้น"
    misconceptions:
      - { match: 6, feedback: "นั่นคือค่าในหน่วยร้อยละ โจทย์ให้ตอบเป็นทศนิยม (สัดส่วน)" }
      - { match: 1.2, feedback: "ดูเหมือนหารด้วย 100 ชิ้นของวันเดียว ต้องหารด้วยจำนวนที่ตรวจทั้ง 20 วัน" }
    solution: "$\\bar{p} = \\dfrac{120}{20 \\times 100} = \\dfrac{120}{2000} = 0.06$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p013
    topics: [management.quality.qc-tools]
    difficulty: 4
    type: numeric
    stem: "จากข้อก่อน ($\\bar{p} = 0.06$ ตรวจวันละ $n = 100$ ชิ้น) เส้นควบคุมบน (UCL) ของแผนภูมิ p เป็นเท่าใด (ตอบเป็นทศนิยม 3 ตำแหน่ง)"
    answer: { value: 0.131, tolerance: 0.001 }
    hints:
      - "ส่วนเบี่ยงเบนมาตรฐานของสัดส่วน $= \\sqrt{\\bar{p}(1-\\bar{p})/n}$"
      - "UCL = $\\bar{p}$ + 3 × ส่วนเบี่ยงเบนมาตรฐานนั้น"
      - "อย่าลืมหารด้วย $n$ ภายในรากที่สอง"
    misconceptions:
      - { match: 0.772, feedback: "ดูเหมือนลืมหารด้วย $n = 100$ ในรากที่สอง สูตรคือ $\\sqrt{\\bar{p}(1-\\bar{p})/n}$" }
      - { match: 0.084, feedback: "นั่นคือ $\\bar{p}$ บวกส่วนเบี่ยงเบนมาตรฐานเพียง 1 เท่า เส้นควบคุมใช้ 3 เท่า" }
    solution: "$\\sqrt{\\dfrac{0.06 \\times 0.94}{100}} = \\sqrt{0.000564} \\approx 0.02375$ ดังนั้น $\\text{UCL} = 0.06 + 3(0.02375) \\approx 0.131$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p014
    topics: [management.quality.qc-tools]
    difficulty: 4
    type: numeric
    stem: "จากข้อก่อน ($\\bar{p} = 0.06$, $n = 100$) เส้นควบคุมล่าง (LCL) ของแผนภูมิ p ที่ใช้งานจริงเป็นเท่าใด (ตอบเป็นทศนิยม)"
    answer: { value: 0, tolerance: 0.0005 }
    hints:
      - "คำนวณ $\\bar{p} - 3\\sqrt{\\bar{p}(1-\\bar{p})/n}$ ก่อน"
      - "สัดส่วนของเสียติดลบได้หรือไม่"
    misconceptions:
      - { match: -0.011, feedback: "ค่าที่คำนวณได้ติดลบ แต่สัดส่วนของเสียติดลบไม่ได้ จึงต้องใช้ LCL = 0" }
    solution: "$0.06 - 3(0.02375) \\approx -0.011$ ติดลบ จึงใช้ $\\text{LCL} = 0$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p015
    topics: [management.quality.qc-tools]
    difficulty: 4
    type: mcq
    stem: "โรงงานผลิตน็อตพบว่าความยาวน็อตทุกจุดในแผนภูมิควบคุม 30 วันล่าสุดอยู่ระหว่างเส้นควบคุมและไม่มีรูปแบบผิดปกติ แต่ยังมีน็อตราว 4% ยาวเกินเกณฑ์ที่ลูกค้ากำหนด ข้อสรุปใดถูกต้อง"
    choices:
      - { id: a, text: "กระบวนการอยู่ในการควบคุมทางสถิติ แต่ความผันแปรปกติกว้างเกินเกณฑ์ ต้องปรับปรุงกระบวนการเพื่อลดความผันแปร", correct: true }
      - { id: b, text: "เป็นไปไม่ได้ ถ้าทุกจุดอยู่ในเส้นควบคุม น็อตทุกตัวต้องผ่านเกณฑ์", feedback: "เส้นควบคุมคำนวณจากข้อมูลของกระบวนการเอง ไม่ได้มาจากเกณฑ์ของลูกค้า สองอย่างนี้จึงไม่จำเป็นต้องสอดคล้องกัน" }
      - { id: c, text: "ให้ขยับเส้นควบคุมให้ตรงกับเกณฑ์ของลูกค้า ปัญหาจะหมดไป", feedback: "การเปลี่ยนเส้นบนกราฟไม่ได้ลดความผันแปรของน็อต ยังมีน็อตเกินเกณฑ์เท่าเดิม" }
      - { id: d, text: "มีสาเหตุพิเศษเกิดขึ้น ต้องหยุดเครื่องหาสาเหตุทันที", feedback: "ไม่มีจุดหลุดหรือรูปแบบผิดปกติ จึงไม่มีสัญญาณของสาเหตุพิเศษ ปัญหามาจากความผันแปรปกติของระบบ" }
    hints:
      - "เส้นควบคุมมาจากไหน และเกณฑ์ของลูกค้ามาจากไหน"
      - "ถ้าความผันแปรปกติกว้างกว่าช่วงเกณฑ์ จะเกิดอะไรขึ้นแม้ไม่มีสาเหตุพิเศษ"
    solution: "กระบวนการอยู่ในการควบคุม (มีแต่สาเหตุทั่วไป) แต่ยังไม่มีความสามารถพอ (not capable) เพราะความผันแปรปกติกว้างกว่าเกณฑ์ ต้องปรับปรุงระบบ เช่น เปลี่ยนแม่พิมพ์หรือวิธีตั้งเครื่อง ไม่ใช่ไล่หาสาเหตุพิเศษ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p016
    topics: [management.quality.qc-tools]
    difficulty: 4
    type: mcq
    stem: "แผนภูมิควบคุมอุณหภูมิตู้เย็นเก็บวัคซีนของโรงพยาบาลส่งเสริมสุขภาพตำบลมีเส้นกลาง 5.0 °C เส้นควบคุมบน 8.0 °C และเส้นควบคุมล่าง 2.0 °C ค่าที่วัดได้ 9 ครั้งล่าสุดคือ 5.6, 5.9, 6.1, 5.8, 6.3, 6.0, 5.7, 6.4, 6.2 °C ควรสรุปอย่างไร"
    choices:
      - { id: a, text: "มีสัญญาณของสาเหตุพิเศษ เพราะ 9 จุดติดกันอยู่เหนือเส้นกลาง ควรตรวจตู้เย็น เช่น ซีลประตูหรือการเปิดตู้บ่อย", correct: true }
      - { id: b, text: "ปกติ เพราะทุกค่าอยู่ระหว่างเส้นควบคุม", feedback: "การอยู่ในเส้นควบคุมยังไม่พอ ถ้าจุดเรียงอยู่ด้านเดียวของเส้นกลางติดกันหลายจุด แสดงว่าค่าเฉลี่ยของกระบวนการเลื่อนไปแล้ว" }
      - { id: c, text: "ผิดปกติ เพราะค่า 6.4 °C สูงเกินเส้นควบคุมบน", feedback: "6.4 °C ยังต่ำกว่าเส้นควบคุมบน 8.0 °C ไม่มีจุดใดหลุดเส้นควบคุม" }
      - { id: d, text: "ควรคำนวณเส้นควบคุมใหม่จาก 9 ค่านี้ เพื่อให้เส้นกลางเป็นประมาณ 6 °C", feedback: "ถ้าคำนวณเส้นใหม่จากข้อมูลที่มีสาเหตุพิเศษ ปัญหาจะถูกซ่อนไว้ ต้องหาสาเหตุก่อน" }
    hints:
      - "นอกจากจุดหลุดเส้นควบคุมแล้ว มีสัญญาณอะไรอีกที่บอกว่ามีสาเหตุพิเศษ"
      - "ลองดูว่าค่าทั้ง 9 ค่าอยู่ด้านใดของเส้นกลาง 5.0 °C"
    solution: "ทุกค่าอยู่ในเส้นควบคุม แต่ทั้ง 9 ค่าอยู่เหนือเส้นกลางติดกัน ซึ่งเข้าเกณฑ์สัญญาณที่ใช้ทั่วไป (7–9 จุดด้านเดียว) แสดงว่าอุณหภูมิเฉลี่ยเลื่อนขึ้น ต้องหาสาเหตุก่อนวัคซีนเสื่อม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p017
    topics: [management.quality.qc-tools]
    difficulty: 3
    type: mcq
    stem: "ร้านกาแฟวาดแผนภาพการกระจายของจำนวนลูกค้าต่อวันกับจำนวนแก้วที่ทำผิดสูตรต่อวัน พบว่าจุดเรียงขึ้นชัดเจน (สัมพันธ์ทางบวก) ข้อสรุปใดเหมาะสมที่สุด"
    choices:
      - { id: a, text: "วันที่ลูกค้ามากมักมีแก้วผิดสูตรมาก ควรเก็บข้อมูลเพิ่ม เช่น คิดเป็นร้อยละต่อแก้ว หรือดูจำนวนพนักงาน ก่อนสรุปสาเหตุ", correct: true }
      - { id: b, text: "ลูกค้าเป็นสาเหตุที่ทำให้พนักงานทำผิด จึงควรรับลูกค้าให้น้อยลง", feedback: "สหสัมพันธ์ไม่ได้พิสูจน์เหตุและผล อาจมีปัจจัยอื่น เช่น จำนวนพนักงานไม่พอในวันที่ลูกค้ามาก" }
      - { id: c, text: "ทั้งสองตัวแปรไม่เกี่ยวข้องกันเลย", feedback: "จุดที่เรียงขึ้นชัดเจนแสดงว่ามีความสัมพันธ์ทางบวก" }
      - { id: d, text: "ยิ่งลูกค้ามาก ร้อยละของแก้วผิดสูตรต้องสูงขึ้นแน่นอน", feedback: "จำนวนแก้วผิดเพิ่มขึ้นอาจเพราะมีแก้วทั้งหมดมากขึ้น ร้อยละอาจเท่าเดิมก็ได้ ต้องคำนวณแยก" }
    hints:
      - "แผนภาพการกระจายบอกว่าตัวแปรเปลี่ยนไปด้วยกัน แต่บอกได้หรือไม่ว่าอะไรเป็นเหตุ"
      - "เมื่อลูกค้ามากขึ้น จำนวนแก้วทั้งหมดก็มากขึ้นด้วย"
    solution: "ความสัมพันธ์ทางบวกบอกว่าทั้งสองค่ามักสูงพร้อมกัน แต่ไม่ได้พิสูจน์เหตุและผล ควรดูร้อยละของแก้วผิดต่อแก้วทั้งหมด และปัจจัยอื่น เช่น จำนวนพนักงานหรือความเร่งรีบ ก่อนตัดสินใจแก้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p018
    topics: [management.quality.qc-tools]
    difficulty: 5
    type: numeric
    stem: "โรงงานบรรจุน้ำปลาสุ่มขวดมาครั้งละ $n = 4$ ขวด แล้วพลอตค่าเฉลี่ยของ 4 ขวดบนแผนภูมิ $\\bar{x}$ ในสภาพปกติปริมาตรขวดเดี่ยวมีค่าเฉลี่ย 250 mL และส่วนเบี่ยงเบนมาตรฐาน 6 mL เส้นควบคุมบนของแผนภูมิ $\\bar{x}$ เป็นเท่าใด (ตอบเป็นตัวเลขในหน่วย mL)"
    answer: { value: 259, unit: mL }
    hints:
      - "จุดบนแผนภูมิเป็นค่าเฉลี่ยของ 4 ขวด ไม่ใช่ขวดเดี่ยว"
      - "ส่วนเบี่ยงเบนมาตรฐานของค่าเฉลี่ย $= \\dfrac{\\sigma}{\\sqrt{n}}$"
      - "UCL = ค่าเฉลี่ย + 3 × ส่วนเบี่ยงเบนมาตรฐานของค่าเฉลี่ย"
    misconceptions:
      - { match: 268, feedback: "นั่นคือใช้ $\\sigma$ ของขวดเดี่ยว ($250 + 3 \\times 6$) ค่าเฉลี่ยของ 4 ขวดผันแปรน้อยกว่า ต้องใช้ $\\sigma/\\sqrt{4}$" }
      - { match: 254.5, feedback: "ดูเหมือนหาร $\\sigma$ ด้วย $n = 4$ แทน $\\sqrt{4} = 2$" }
    solution: "$\\sigma_{\\bar{x}} = \\dfrac{6}{\\sqrt{4}} = 3$ mL ดังนั้น $\\text{UCL} = 250 + 3(3) = 259$ mL"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p019
    topics: [management.quality.qc-tools]
    difficulty: 5
    type: numeric
    stem: "โรงงานชาซองชั่งน้ำหนักชา 10 ซองในช่วงที่เครื่องทำงานปกติได้ (g): 2.0, 2.1, 1.9, 2.0, 2.2, 1.8, 2.0, 2.1, 1.9, 2.0 ใช้ค่าเฉลี่ยและส่วนเบี่ยงเบนมาตรฐานของข้อมูลชุดนี้ (หารด้วย $N$ แบบประชากร) หาเส้นควบคุมบนของแผนภูมิค่าเดี่ยว (ตอบเป็นตัวเลขในหน่วย g ทศนิยม 2 ตำแหน่ง)"
    answer: { value: 2.33, tolerance: 0.005, unit: g }
    hints:
      - "หาค่าเฉลี่ยก่อน แล้วหาส่วนเบี่ยงเบนของแต่ละค่าจากค่าเฉลี่ย"
      - "$\\sigma = \\sqrt{\\dfrac{\\sum (x - \\mu)^2}{N}}$ โดย $N = 10$"
      - "UCL = $\\mu + 3\\sigma$"
    misconceptions:
      - { match: 2.35, feedback: "ดูเหมือนหารด้วย $N - 1 = 9$ (สูตรกลุ่มตัวอย่าง) โจทย์กำหนดให้หารด้วย $N$" }
      - { match: 2.11, feedback: "นั่นคือ $\\mu + \\sigma$ เส้นควบคุมใช้ $3\\sigma$" }
      - { match: 2.036, feedback: "ดูเหมือนใช้ความแปรปรวน ($\\sigma^2 = 0.012$) แทนส่วนเบี่ยงเบนมาตรฐาน อย่าลืมถอดรากที่สอง" }
    solution: "$\\mu = 20.0 \\div 10 = 2.0$ g ส่วนเบี่ยงเบนยกกำลังสองรวม $= 4(0.1)^2 + 2(0.2)^2 = 0.04 + 0.08 = 0.12$ ดังนั้น $\\sigma = \\sqrt{0.12/10} = \\sqrt{0.012} \\approx 0.1095$ g และ $\\text{UCL} = 2.0 + 3(0.1095) \\approx 2.33$ g"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p020
    topics: [management.quality.qc-tools]
    difficulty: 2
    type: mcq
    stem: "โรงงานทอผ้ามีผ้ามีตำหนิ 3% ในภาพรวม เมื่อแยกข้อมูลตามกะทำงาน พบว่ากะเช้า 1% กะบ่าย 1% แต่กะดึก 7% การแยกข้อมูลแบบนี้คือเครื่องมือใด"
    choices:
      - { id: a, text: "การแบ่งชั้นข้อมูล", correct: true }
      - { id: b, text: "แผนภูมิควบคุม", feedback: "แผนภูมิควบคุมดูค่าตามลำดับเวลาเทียบกับเส้นควบคุม ส่วนนี้คือการแยกข้อมูลเป็นกลุ่มตามกะ" }
      - { id: c, text: "แผนภาพการกระจาย", feedback: "แผนภาพการกระจายใช้กับตัวแปรตัวเลขสองตัว ส่วนนี้แยกตามกลุ่ม (กะ)" }
      - { id: d, text: "ใบตรวจสอบ", feedback: "ใบตรวจสอบใช้เก็บข้อมูล แต่การนำข้อมูลมาแยกเปรียบเทียบตามกะคือการแบ่งชั้น" }
    hints:
      - "ข้อมูลเดิมเป็นตัวเลขรวม แล้วถูกแยกออกเป็นกลุ่มย่อย"
      - "เครื่องมือใดช่วยให้เห็นว่ากลุ่มใดต่างจากกลุ่มอื่น"
    solution: "การแบ่งชั้นข้อมูล (stratification) แยกข้อมูลตามกะ เครื่องจักร หรือผู้ขาย ในที่นี้ทำให้เห็นว่าปัญหาเกือบทั้งหมดอยู่ที่กะดึก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qc.p021
