  - id: math.geometry.constructions.p018
    topics: [math.geometry.constructions]
    difficulty: 3
    type: numeric
    stem: "จะสร้างรูปขนมเปียกปูนที่มีเส้นทแยงมุมยาว 8 ซม. และ 6 ซม. โดยลากเส้นทแยงมุมสองเส้นให้ตัดกันเป็นมุมฉากที่จุดกึ่งกลาง บนเส้นทแยงมุมเส้นยาวต้องวัดจากจุดตัดออกไปข้างละกี่เซนติเมตร (ตอบในหน่วยเซนติเมตร)"
    answer: { value: 4, unit: cm }
    hints:
      - "เส้นทแยงมุมของขนมเปียกปูนแบ่งครึ่งซึ่งกันและกัน"
      - "ครึ่งหนึ่งของ 8 ซม."
    misconceptions:
      - { match: 8, feedback: "วัดข้างละ 8 ซม. จะได้เส้นทแยงมุมยาว 16 ซม. ต้องแบ่งครึ่ง" }
      - { match: 3, feedback: "3 ซม. คือครึ่งหนึ่งของเส้นทแยงมุมเส้นสั้น โจทย์ถามเส้นยาว" }
    solution: "เส้นทแยงมุมแบ่งครึ่งกัน จึงวัดข้างละ $8 \\div 2 = 4$ ซม. (เส้นสั้นวัดข้างละ 3 ซม.)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.geometry.constructions.p019
