<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260" font-family="sans-serif">
<title>หลัก PRICE สำหรับข้อเคล็ดและกล้ามเนื้อบาดเจ็บ</title>
<rect x="0" y="0" width="700" height="260" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="350.0" y="28.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ข้อเคล็ด กล้ามเนื้อยืดหรือฉีก: ทำตามหลัก PRICE ใน 2–3 วันแรก</text>
<rect x="18.0" y="50.0" width="122.0" height="170.0" rx="10" fill="#f9dede" stroke="#333" stroke-width="1.5"/>
<text x="79.0" y="92.0" font-size="34" text-anchor="middle" font-weight="bold" fill="#111">P</text>
<text x="79.0" y="116.0" font-size="12" text-anchor="middle" fill="#444">Protection</text>
<text x="79.0" y="142.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ป้องกัน</text>
<text x="79.0" y="170.0" font-size="12" text-anchor="middle" fill="#222">หยุดเล่นทันที</text>
<text x="79.0" y="188.0" font-size="12" text-anchor="middle" fill="#222">ไม่ให้บาดเจ็บซ้ำ</text>
<rect x="152.0" y="50.0" width="122.0" height="170.0" rx="10" fill="#fff4d6" stroke="#333" stroke-width="1.5"/>
<text x="213.0" y="92.0" font-size="34" text-anchor="middle" font-weight="bold" fill="#111">R</text>
<text x="213.0" y="116.0" font-size="12" text-anchor="middle" fill="#444">Rest</text>
<text x="213.0" y="142.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">พัก</text>
<text x="213.0" y="170.0" font-size="12" text-anchor="middle" fill="#222">ไม่ลงน้ำหนัก</text>
<text x="213.0" y="188.0" font-size="12" text-anchor="middle" fill="#222">บนส่วนที่เจ็บ</text>
<rect x="286.0" y="50.0" width="122.0" height="170.0" rx="10" fill="#dcecf9" stroke="#333" stroke-width="1.5"/>
<text x="347.0" y="92.0" font-size="34" text-anchor="middle" font-weight="bold" fill="#111">I</text>
<text x="347.0" y="116.0" font-size="12" text-anchor="middle" fill="#444">Ice</text>
<text x="347.0" y="142.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ประคบเย็น</text>
<text x="347.0" y="170.0" font-size="12" text-anchor="middle" fill="#222">ห่อผ้าก่อนประคบ</text>
<text x="347.0" y="188.0" font-size="12" text-anchor="middle" fill="#222">ครั้งละไม่เกิน 20 นาที</text>
<rect x="420.0" y="50.0" width="122.0" height="170.0" rx="10" fill="#eaf6e3" stroke="#333" stroke-width="1.5"/>
<text x="481.0" y="92.0" font-size="34" text-anchor="middle" font-weight="bold" fill="#111">C</text>
<text x="481.0" y="116.0" font-size="12" text-anchor="middle" fill="#444">Compression</text>
<text x="481.0" y="142.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">พันกระชับ</text>
<text x="481.0" y="170.0" font-size="12" text-anchor="middle" fill="#222">พันผ้ายืดพอแน่น</text>
<text x="481.0" y="188.0" font-size="12" text-anchor="middle" fill="#222">ไม่รัดจนชาหรือซีด</text>
<rect x="554.0" y="50.0" width="122.0" height="170.0" rx="10" fill="#f3e6f7" stroke="#333" stroke-width="1.5"/>
<text x="615.0" y="92.0" font-size="34" text-anchor="middle" font-weight="bold" fill="#111">E</text>
<text x="615.0" y="116.0" font-size="12" text-anchor="middle" fill="#444">Elevation</text>
<text x="615.0" y="142.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ยกสูง</text>
<text x="615.0" y="170.0" font-size="12" text-anchor="middle" fill="#222">วางบนหมอน</text>
<text x="615.0" y="188.0" font-size="12" text-anchor="middle" fill="#222">ยกให้สูงไว้</text>
<text x="350.0" y="246.0" font-size="12" text-anchor="middle" fill="#a00">ปวดมาก บวมมาก ผิดรูป หรือลงน้ำหนักไม่ได้ อาจกระดูกหัก อย่าขยับ ดามไว้และไปโรงพยาบาล</text>
</svg>
