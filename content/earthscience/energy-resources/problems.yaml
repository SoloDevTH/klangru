  - id: earthscience.resources.energy-resources.p015
    topics: [earthscience.resources.energy-resources]
    difficulty: 5
    type: numeric
    stem: "เปรียบเทียบหลอดไฟสองแบบตลอดการใช้งาน 10,000 ชั่วโมง หลอดไส้ 60 W ราคาหลอดละ 20 บาท อายุ 1,000 ชั่วโมง (ต้องใช้ 10 หลอด) หลอด LED 9 W ราคา 80 บาท อายุ 10,000 ชั่วโมง (ใช้ 1 หลอด) ค่าไฟหน่วยละ 4.50 บาท (ข้อมูลสมมติ) ใช้หลอด LED จะประหยัดเงินรวมทั้งค่าหลอดและค่าไฟได้กี่บาท"
    answer: { value: 2415, tolerance: 5, unit: บาท }
    misconceptions:
      - { match: 2295, feedback: "คิดเฉพาะค่าไฟที่ประหยัด ยังไม่ได้รวมค่าหลอดที่ต่างกัน (200 − 80 = 120 บาท)" }
      - { match: 2495, feedback: "ลืมรวมค่าหลอด LED 80 บาทในต้นทุนของหลอด LED" }
    hints:
      - "ต้นทุนรวม = ค่าหลอดทั้งหมด + ค่าไฟ"
      - "ค่าไฟหลอดไส้ $= 60 \\times 10{,}000 \\div 1{,}000 \\times 4.50$"
    solution: "หลอดไส้: ค่าไฟ $= 600 \\times 4.50 = 2{,}700$ บาท ค่าหลอด $= 10 \\times 20 = 200$ บาท รวม 2,900 บาท หลอด LED: ค่าไฟ $= 90 \\times 4.50 = 405$ บาท ค่าหลอด 80 บาท รวม 485 บาท ประหยัด $2{,}900 - 485 = 2{,}415$ บาท แม้หลอด LED แพงกว่าตอนซื้อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

