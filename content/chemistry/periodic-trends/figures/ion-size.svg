<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440">
<title>ขนาดอะตอมเทียบกับไอออน และไอออนที่มีอิเล็กตรอนเท่ากัน วาดตามมาตราส่วน</title>
<rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
