    solution: "แนวดิ่งไม่ขึ้นกับความเร็วแนวราบ: $y = \\tfrac{1}{2}gt^2 = \\tfrac{1}{2}(9.8)(0.5)^2 = 1.225\\ \\mathrm{m}$ เท่ากับลูกที่ปล่อยตกเฉย ๆ ในเวลาเดียวกัน"
