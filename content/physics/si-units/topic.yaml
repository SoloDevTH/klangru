id: physics.units.si
subject: physics
title: { th: หน่วย SI และการแปลงหน่วย, en: SI units and unit conversion }
summary: รู้จักหน่วยฐาน 7 หน่วยของระบบ SI หน่วยอนุพันธ์ คำนำหน้าหน่วย สัญกรณ์วิทยาศาสตร์ และการแปลงหน่วยอย่างเป็นระบบ เช่น km/h เป็น m/s
difficulty: 2
minutes: 30
prerequisites: [math.number.integers]
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: prefix-ladder.svg
    alt: "เส้นจำนวนของเลขยกกำลังสิบจาก 10 ยกกำลัง 9 ทางซ้ายถึง 10 ยกกำลังลบ 9 ทางขวา มีจุดกำกับคำนำหน้าหน่วย G จิกะ 10^9, M เมกะ 10^6, k กิโล 10^3, จุดที่ไม่มีคำนำหน้า 10^0, c เซนติ 10^-2, m มิลลิ 10^-3, μ ไมโคร 10^-6 และ n นาโน 10^-9 ลูกศรโค้งระหว่างคำนำหน้าที่ห่างกันขั้นละ 10^3 เขียนว่า ×1000 หมายถึงเมื่อเปลี่ยนไปใช้หน่วยที่เล็กลงหนึ่งขั้น ตัวเลขต้องคูณ 1000"
    caption: "คำนำหน้าส่วนใหญ่ห่างกันขั้นละ $10^3$ เช่น $1\\ \\mathrm{km} = 1{,}000\\ \\mathrm{m}$ และ $1\\ \\mathrm{m} = 1{,}000\\ \\mathrm{mm}$ ยกเว้นเซนติที่อยู่ระหว่างกลาง"
  - type: worked-example
    title: ความถี่ของสถานีวิทยุ FM
    problem: "สถานีวิทยุ FM แห่งหนึ่งส่งคลื่นความถี่ $95.5\\ \\mathrm{MHz}$ ความถี่นี้เท่ากับกี่เฮิรตซ์ เขียนคำตอบในรูปสัญกรณ์วิทยาศาสตร์"
    steps:
      - text: "แทนคำนำหน้า M ด้วยค่าของมัน: $95.5\\ \\mathrm{MHz} = 95.5 \\times 10^{6}\\ \\mathrm{Hz}$"
        why: "M (เมกะ ตัวพิมพ์ใหญ่) คือ $10^6$ ไม่ใช่ m (มิลลิ) ซึ่งเป็น $10^{-3}$"
      - text: "เขียน $95.5$ ให้อยู่ระหว่าง 1 กับ 10: $95.5 = 9.55 \\times 10^{1}$"
      - text: "รวมเลขชี้กำลัง: $9.55 \\times 10^{1} \\times 10^{6} = 9.55 \\times 10^{7}\\ \\mathrm{Hz}$"
        why: "คูณเลขยกกำลังที่ฐานเท่ากัน ให้นำเลขชี้กำลังมาบวกกัน"
    answer: "$9.55 \\times 10^{7}\\ \\mathrm{Hz}$ หรือ $95{,}500{,}000$ ครั้งต่อวินาที"
  - { type: check, problem: phy.si.p013, prompt: "ลองแปลงหน่วยความเร็วบนป้ายจราจร" }
  - type: figure
    src: square-metre.svg
    alt: "แผ่นสี่เหลี่ยมจัตุรัสยาวด้านละ 1 m หรือ 100 cm แบ่งเป็นตาราง 10 คูณ 10 ช่อง แต่ละช่องยาวด้านละ 10 cm มีพื้นที่ 100 cm² ช่องมุมซ้ายบนระบายสีส้มและแบ่งย่อยเป็น 100 ช่องเล็ก ช่องละ 1 cm² ข้อความด้านข้างสรุปว่า 1 m² = 100 × 100 cm² = 10,000 cm²"
    caption: "ด้านยาวขึ้น 100 เท่า พื้นที่จึงเพิ่มขึ้น $100 \\times 100 = 10{,}000$ เท่า"
  - type: worked-example
    title: เปลี่ยนเป็นหน่วย SI และตรวจหน่วยก่อนคำนวณ
    problem: "รถยนต์มวล $1{,}200\\ \\mathrm{kg}$ วิ่งด้วยอัตราเร็ว $72\\ \\mathrm{km/h}$ พลังงานจลน์ $E_k = \\tfrac{1}{2}mv^2$ ของรถมีค่ากี่กิโลจูล"
    steps:
      - text: "เปลี่ยนทุกปริมาณเป็นหน่วย SI ก่อน: $m = 1{,}200\\ \\mathrm{kg}$ อยู่แล้ว และ $v = \\dfrac{72}{3.6} = 20\\ \\mathrm{m/s}$"
        why: "สูตรทางฟิสิกส์ให้คำตอบเป็นหน่วย SI ก็ต่อเมื่อแทนค่าเป็นหน่วย SI ถ้าแทน $72$ ตรง ๆ จะได้ $3{,}110{,}400$ ซึ่งไม่ใช่จูล"
      - text: "ตรวจหน่วยของสูตร: $\\mathrm{kg} \\times (\\mathrm{m/s})^2 = \\mathrm{kg \\cdot m^2/s^2} = \\mathrm{J}$ ตรงกับหน่วยของพลังงาน"
      - text: "คำนวณ: $E_k = \\tfrac{1}{2}(1{,}200)(20)^2 = 600 \\times 400 = 240{,}000\\ \\mathrm{J}$"
      - text: "เปลี่ยนเป็นกิโลจูล: $240{,}000\\ \\mathrm{J} \\div 1{,}000 = 240\\ \\mathrm{kJ}$"
        why: "k คือ $10^3$ ตัวเลขในหน่วยที่ใหญ่ขึ้นจึงต้องเล็กลง 1,000 เท่า"
    answer: "$240\\ \\mathrm{kJ}$"
  - { type: check, problem: phy.si.p015 }
glossary:
  - { term: หน่วยฐาน, definition: "หน่วยหลัก 7 หน่วยของระบบ SI ที่กำหนดขึ้นเอง ไม่ได้สร้างจากหน่วยอื่น เช่น เมตร (m) กิโลกรัม (kg) วินาที (s)" }
  - { term: หน่วยอนุพันธ์, definition: "หน่วยที่สร้างจากหน่วยฐานด้วยการคูณหรือหาร เช่น เมตรต่อวินาที (m/s) และนิวตัน (N = kg·m/s²)" }
  - { term: คำนำหน้าหน่วย, definition: "ตัวอักษรหน้าหน่วยที่บอกว่าคูณด้วยสิบยกกำลังเท่าใด เช่น k = 10³ และ m = 10⁻³" }
  - { term: สัญกรณ์วิทยาศาสตร์, definition: "การเขียนจำนวนในรูป A × 10ⁿ โดย 1 ≤ A < 10 และ n เป็นจำนวนเต็ม" }
flashcards:
  - { front: "หน่วยฐาน SI ของมวลคืออะไร", back: "กิโลกรัม (kg) ไม่ใช่กรัม" }
  - { front: "แปลง km/h เป็น m/s ทำอย่างไร", back: "หารด้วย 3.6 เพราะ $1\\ \\mathrm{km/h} = \\dfrac{1000\\ \\mathrm{m}}{3600\\ \\mathrm{s}}$ เช่น $72\\ \\mathrm{km/h} = 20\\ \\mathrm{m/s}$" }
  - { front: "คำนำหน้า μ (ไมโคร) มีค่าเท่าใด", back: "$10^{-6}$ เช่น $1\\ \\mathrm{\\mu m} = 10^{-6}\\ \\mathrm{m}$" }
  - { front: "เขียน $0.0032$ ในรูปสัญกรณ์วิทยาศาสตร์", back: "$3.2 \\times 10^{-3}$" }
  - { front: "$1\\ \\mathrm{m^2}$ เท่ากับกี่ $\\mathrm{cm^2}$", back: "$100 \\times 100 = 10\\,000\\ \\mathrm{cm^2}$ เพราะต้องแปลงทั้งสองด้าน" }
