problems:
  - id: biology.plants.photosynthesis-intro.p001
    topics: [biology.plants.photosynthesis-intro]
    difficulty: 1
    type: mcq
    stem: "ข้อใดไม่ใช่สิ่งที่พืชใช้ในการสังเคราะห์ด้วยแสง"
    choices:
      - { id: a, text: "แก๊สออกซิเจน", correct: true }
      - { id: b, text: "แสง", feedback: "แสงให้พลังงานแก่การสังเคราะห์ด้วยแสง จึงจำเป็น" }
      - { id: c, text: "น้ำ", feedback: "น้ำเป็นวัตถุดิบ รากดูดขึ้นมาให้ใบใช้" }
      - { id: d, text: "แก๊สคาร์บอนไดออกไซด์", feedback: "แก๊สคาร์บอนไดออกไซด์เป็นวัตถุดิบ เข้าใบทางปากใบ" }
    hints:
      - "แยกให้ออกว่าอะไรเป็นวัตถุดิบ อะไรเป็นผลผลิต"
      - "สาหร่ายหางกระรอกปล่อยฟองแก๊สอะไรออกมา"
    solution: "แก๊สออกซิเจนเป็นผลผลิตของการสังเคราะห์ด้วยแสง ไม่ใช่สิ่งที่ใช้ สิ่งที่จำเป็นคือแสง คลอโรฟิลล์ น้ำ และแก๊สคาร์บอนไดออกไซด์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis-intro.p002
    topics: [biology.plants.photosynthesis-intro]
    difficulty: 1
    type: match
    stem: "จับคู่ปัจจัยในการสังเคราะห์ด้วยแสงกับที่มา"
    pairs:
      - { left: "แสง", right: "ดวงอาทิตย์" }
      - { left: "น้ำ", right: "รากดูดจากดิน" }
      - { left: "แก๊สคาร์บอนไดออกไซด์", right: "อากาศ เข้าทางปากใบ" }
      - { left: "คลอโรฟิลล์", right: "คลอโรพลาสต์ในเซลล์ใบ" }
    hints:
      - "สิ่งใดมาจากดิน สิ่งใดมาจากอากาศ"
      - "สารสีเขียวอยู่ในออร์แกเนลล์ใดของเซลล์พืช"
    solution: "แสงมาจากดวงอาทิตย์ น้ำรากดูดจากดิน แก๊สคาร์บอนไดออกไซด์มาจากอากาศเข้าทางปากใบ และคลอโรฟิลล์อยู่ในคลอโรพลาสต์ของเซลล์ใบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis-intro.p003
    topics: [biology.plants.photosynthesis-intro]
    difficulty: 1
    type: text
    stem: "ฟองแก๊สที่ผุดออกจากสาหร่ายหางกระรอกเมื่อได้รับแสง คือแก๊สอะไร"
    accepted: ["ออกซิเจน", "แก๊สออกซิเจน", "ก๊าซออกซิเจน", "O2", "O₂", "oxygen"]
    hints:
      - "เป็นผลผลิตของการสังเคราะห์ด้วยแสงที่ออกจากใบ"
      - "แก๊สนี้ทำให้ธูปที่เหลือแต่ถ่านแดงลุกเป็นเปลว"
    misconceptions:
      - { match: "คาร์บอนไดออกไซด์", feedback: "แก๊สคาร์บอนไดออกไซด์เป็นสิ่งที่พืชใช้ ส่วนแก๊สที่ปล่อยออกมาใต้แสงคืออีกชนิดหนึ่ง" }
    solution: "แก๊สออกซิเจน ทดสอบได้โดยเก็บแก๊สในหลอดทดลองแล้วสอดธูปที่เหลือแต่ถ่านแดง ธูปจะลุกเป็นเปลวไฟ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis-intro.p004
    topics: [biology.plants.photosynthesis-intro]
    difficulty: 2
    type: mcq
    stem: "หยดสารละลายไอโอดีนบนใบที่สกัดคลอโรฟิลล์ออกแล้ว ถ้าใบมีแป้ง ใบจะเป็นสีใด"
    choices:
      - { id: a, text: "สีน้ำเงินดำ", correct: true }
      - { id: b, text: "สีน้ำตาล", feedback: "สีน้ำตาลคือสีของไอโอดีนเอง แสดงว่าไม่มีแป้ง" }
      - { id: c, text: "สีเขียว", feedback: "สีเขียวคือคลอโรฟิลล์ ซึ่งถูกสกัดออกไปแล้วก่อนหยดไอโอดีน" }
      - { id: d, text: "ไม่มีสี", feedback: "ไอโอดีนกับแป้งให้สีเข้มชัดเจน" }
    hints:
      - "ลองนึกถึงการหยดไอโอดีนบนข้าวสุกหรือแป้งมัน"
      - "ไอโอดีนเองเป็นสีน้ำตาล เมื่อเจอแป้งจะเปลี่ยนเป็นสีเข้ม"
    solution: "ไอโอดีนทำปฏิกิริยากับแป้งให้สีน้ำเงินดำ ถ้าไม่มีแป้งจะเห็นเพียงสีน้ำตาลของไอโอดีน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis-intro.p005
    topics: [biology.plants.photosynthesis-intro]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการตรวจหาแป้งในใบให้ถูกต้อง"
    items:
      - "ต้มใบในน้ำเดือดประมาณ 1 นาที"
      - "แช่ใบในแอลกอฮอล์ที่วางในน้ำร้อนจนใบซีด"
      - "ล้างใบในน้ำอุ่นให้นิ่ม"
      - "หยดสารละลายไอโอดีนแล้วสังเกตสี"
    hints:
      - "ต้องเอาคลอโรฟิลล์ออกก่อนจึงจะเห็นสีของไอโอดีนชัด"
      - "แอลกอฮอล์ทำให้ใบแข็งเปราะ จึงต้องทำให้นิ่มก่อนหยดไอโอดีน"
    solution: "ต้มในน้ำเดือดให้เซลล์ตาย → แช่แอลกอฮอล์ในน้ำร้อนเพื่อสกัดคลอโรฟิลล์ → ล้างน้ำอุ่นให้นิ่ม → หยดไอโอดีน ถ้ามีแป้งจะเป็นสีน้ำเงินดำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis-intro.p006
    topics: [biology.plants.photosynthesis-intro]
    difficulty: 2
    type: mcq
    stem: "ในการตรวจหาแป้งในใบ เหตุใดต้องแช่ใบในแอลกอฮอล์ก่อนหยดไอโอดีน"
    choices:
      - { id: a, text: "เพื่อละลายคลอโรฟิลล์ออก จะได้เห็นสีที่เกิดขึ้นชัดเจน", correct: true }
      - { id: b, text: "เพื่อเปลี่ยนน้ำตาลในใบให้เป็นแป้ง", feedback: "แอลกอฮอล์ไม่ได้สร้างแป้ง แป้งที่ตรวจพบเกิดจากการสังเคราะห์ด้วยแสงของพืชเอง" }
      - { id: c, text: "เพื่อฆ่าเชื้อโรคบนใบ", feedback: "ไม่ได้มีจุดประสงค์เรื่องเชื้อโรค จุดประสงค์คือเอาสีเขียวออก" }
      - { id: d, text: "เพื่อให้ใบนิ่ม", feedback: "แอลกอฮอล์กลับทำให้ใบแข็งเปราะ ขั้นที่ทำให้ใบนิ่มคือการล้างน้ำอุ่น" }
    hints:
      - "ถ้าใบยังเขียวอยู่ จะเห็นสีน้ำเงินดำชัดหรือไม่"
      - "หลังแช่แอลกอฮอล์ ใบเปลี่ยนเป็นสีอะไร"
    solution: "คลอโรฟิลล์ละลายในแอลกอฮอล์ได้ ใบจึงซีดเป็นสีขาว เมื่อหยดไอโอดีนจะเห็นสีน้ำเงินดำหรือสีน้ำตาลได้ชัด ไม่ถูกสีเขียวบัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis-intro.p007
    topics: [biology.plants.photosynthesis-intro]
    difficulty: 3
    type: mcq
    stem: "เก็บต้นไม้ใบด่างไว้ในที่มืด 2 วัน แล้วปิดใบด้วยแถบกระดาษสีดำดังภาพ ตั้งไว้กลางแดด 6 ชั่วโมง แล้วตรวจหาแป้ง บริเวณใดจะเป็นสีน้ำเงินดำ"
    figure: { src: p-variegated-leaf.svg, alt: "ใบด่างรูปรี ครึ่งบนของใบสีเขียว ครึ่งล่างสีขาว มีแถบกระดาษสีดำปิดพาดแนวตั้งตรงกลางค่อนไปทางขวา แบ่งเป็น 4 บริเวณ ก คือส่วนสีเขียวที่ไม่ถูกปิด ข คือส่วนสีเขียวที่ถูกกระดาษปิด ค คือส่วนสีขาวที่ไม่ถูกปิด ง คือส่วนสีขาวที่ถูกกระดาษปิด" }
    choices:
      - { id: a, text: "ก เท่านั้น", correct: true }
      - { id: b, text: "ก และ ข", feedback: "บริเวณ ข มีคลอโรฟิลล์แต่ถูกปิดแสง จึงสร้างแป้งไม่ได้" }
      - { id: c, text: "ก และ ค", feedback: "บริเวณ ค ได้แสงแต่เป็นส่วนสีขาวที่ไม่มีคลอโรฟิลล์ จึงสร้างแป้งไม่ได้" }
      - { id: d, text: "ทุกบริเวณ", feedback: "ต้นไม้อยู่ในที่มืด 2 วันแล้ว แป้งเดิมถูกใช้ไปหมด แป้งใหม่เกิดได้เฉพาะที่มีครบทั้งแสงและคลอโรฟิลล์" }
    hints:
      - "บริเวณที่สร้างแป้งได้ต้องมีทั้งแสงและคลอโรฟิลล์"
      - "ตรวจทีละบริเวณ: สีเขียวหรือขาว ถูกปิดหรือไม่"
    solution: "แป้งเกิดเฉพาะที่มีทั้งคลอโรฟิลล์ (ส่วนสีเขียว) และแสง (ไม่ถูกปิด) คือบริเวณ ก เท่านั้น การเปรียบเทียบ ก กับ ข แสดงว่าต้องใช้แสง และ ก กับ ค แสดงว่าต้องใช้คลอโรฟิลล์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis-intro.p008
    topics: [biology.plants.photosynthesis-intro]
    difficulty: 3
    type: mcq
    stem: "ก่อนทดลองว่าการสังเคราะห์ด้วยแสงต้องใช้แสงหรือไม่ เหตุใดต้องนำกระถางต้นไม้ไปไว้ในที่มืด 1–2 วัน"
    choices:
      - { id: a, text: "ให้แป้งที่มีอยู่เดิมในใบถูกใช้ไปก่อน แป้งที่ตรวจพบภายหลังจึงเกิดระหว่างการทดลอง", correct: true }
      - { id: b, text: "ให้ต้นไม้หิวแสง จะได้สังเคราะห์ด้วยแสงเร็วขึ้น", feedback: "จุดประสงค์ไม่ใช่เรื่องความเร็ว แต่เป็นการกำจัดแป้งเก่าที่จะทำให้สรุปผิด" }
      - { id: c, text: "ให้คลอโรฟิลล์สลายไป", feedback: "ถ้าคลอโรฟิลล์สลาย ใบก็สร้างแป้งไม่ได้เลย การทดลองจะใช้ไม่ได้" }
      - { id: d, text: "ให้ต้นไม้ดูดน้ำได้มากขึ้น", feedback: "การไว้ในที่มืดไม่ได้มีจุดประสงค์เรื่องน้ำ" }
    hints:
      - "ถ้าใบมีแป้งอยู่แล้วตั้งแต่ก่อนทดลอง ผลการทดสอบจะบอกอะไรได้หรือไม่"
      - "ในที่มืด พืชสร้างแป้งได้ไหม แต่ยังใช้แป้งอยู่ไหม"
    solution: "ในที่มืดพืชสร้างแป้งไม่ได้แต่ยังใช้แป้งในการหายใจ แป้งเดิมจึงหมดไป ถ้าตรวจพบแป้งหลังทดลอง ก็มั่นใจได้ว่าเกิดขึ้นระหว่างการทดลอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis-intro.p009
    topics: [biology.plants.photosynthesis-intro]
    difficulty: 3
    type: numeric
    stem: "จากกราฟ (ข้อมูลสมมติ) ถ้าวางหลอดไฟห่างจากสาหร่ายหางกระรอก 30 เซนติเมตร แล้วนับฟองแก๊สนาน 3 นาที จะนับได้ประมาณกี่ฟอง"
    figure: { src: p-bubbles.svg, alt: "กราฟเส้น แกนนอนเป็นระยะจากหลอดไฟถึงสาหร่าย 0 ถึง 60 เซนติเมตร แกนตั้งเป็นจำนวนฟองแก๊สต่อนาที 0 ถึง 60 จุดข้อมูล 10 เซนติเมตร 48 ฟองต่อนาที, 20 เซนติเมตร 30, 30 เซนติเมตร 17, 40 เซนติเมตร 9, 50 เซนติเมตร 5 เส้นลดลงเมื่อระยะเพิ่มขึ้น" }
    answer: { value: 51, unit: ฟอง }
    hints:
      - "อ่านจำนวนฟองต่อนาทีที่ระยะ 30 เซนติเมตรจากกราฟ"
      - "นับนาน 3 นาที จึงคูณด้วย 3"
    misconceptions:
      - { match: 17, feedback: "นี่คือจำนวนฟองใน 1 นาที แต่นับนาน 3 นาที" }
      - { match: 90, feedback: "อ่านค่าที่ระยะ 20 เซนติเมตร (30 ฟองต่อนาที) ต้องอ่านที่ 30 เซนติเมตร" }
    solution: "ที่ระยะ 30 เซนติเมตรได้ 17 ฟองต่อนาที ใน 3 นาทีได้ $17 \\times 3 = 51$ ฟอง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis-intro.p010
    topics: [biology.plants.photosynthesis-intro]
    difficulty: 3
    type: mcq
    stem: "ครอบใบหนึ่งด้วยถุงพลาสติกที่ใส่สารดูดแก๊สคาร์บอนไดออกไซด์ไว้ และครอบอีกใบด้วยถุงเปล่า ตั้งกลางแดด แล้วตรวจหาแป้ง พบแป้งเฉพาะใบในถุงเปล่า สรุปได้ว่าอย่างไร"
    choices:
      - { id: a, text: "การสังเคราะห์ด้วยแสงต้องใช้แก๊สคาร์บอนไดออกไซด์", correct: true }
      - { id: b, text: "การสังเคราะห์ด้วยแสงต้องใช้แก๊สออกซิเจน", feedback: "สารในถุงดูดแก๊สคาร์บอนไดออกไซด์ ไม่ได้ดูดออกซิเจน" }
      - { id: c, text: "ถุงพลาสติกบังแสง", feedback: "ทั้งสองใบอยู่ในถุงพลาสติกเหมือนกัน ถ้าถุงบังแสงจริง ใบในถุงเปล่าก็ต้องไม่มีแป้งด้วย" }
      - { id: d, text: "สารในถุงทำลายคลอโรฟิลล์", feedback: "การทดลองนี้ตั้งใจเปลี่ยนเพียงปริมาณแก๊สคาร์บอนไดออกไซด์ สรุปเกินจากสิ่งที่ทดลองไม่ได้" }
    hints:
      - "สองใบต่างกันเพียงอย่างเดียว คืออะไร"
      - "ใบที่ไม่มีแก๊สคาร์บอนไดออกไซด์สร้างแป้งได้หรือไม่"
    solution: "สองใบต่างกันเพียงอย่างเดียวคือแก๊สคาร์บอนไดออกไซด์ ใบที่ขาดแก๊สนี้ไม่สร้างแป้ง จึงสรุปได้ว่าการสังเคราะห์ด้วยแสงต้องใช้แก๊สคาร์บอนไดออกไซด์ ถุงเปล่าเป็นชุดควบคุม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.photosynthesis-intro.p011
    topics: [biology.plants.photosynthesis-intro]
    difficulty: 4
    type: mcq
    stem: "ปลูกต้นหลิวในกระถาง 5 ปี รดเฉพาะน้ำฝน ต้นไม้หนักขึ้น 74 กิโลกรัม แต่ดินแห้งหายไปเพียง 0.06 กิโลกรัม (คล้ายการทดลองของฟาน เฮลมอนต์) มวลส่วนใหญ่ที่เพิ่มขึ้นมาจากไหน"
    choices:
      - { id: a, text: "แก๊สคาร์บอนไดออกไซด์จากอากาศ และน้ำ ซึ่งพืชเปลี่ยนเป็นน้ำตาลแล้วสร้างเนื้อไม้", correct: true }
      - { id: b, text: "ดินในกระถาง", feedback: "ดินหายไปเพียง 0.06 กิโลกรัม น้อยกว่ามวลที่เพิ่มขึ้นมาก" }
      - { id: c, text: "แสงแดด เพราะแสงเปลี่ยนเป็นเนื้อไม้", feedback: "แสงให้พลังงาน แต่ไม่ใช่สสารที่กลายเป็นเนื้อไม้" }
      - { id: d, text: "น้ำเพียงอย่างเดียว", feedback: "ฟาน เฮลมอนต์เคยคิดแบบนี้ แต่ต่อมาพบว่าคาร์บอนในเนื้อไม้มาจากแก๊สคาร์บอนไดออกไซด์ในอากาศ" }
