    solution: "ลวดลัดวงจรตัวต้านทาน $4\\ \\Omega$ (กลุ่มขนานของ $4\\ \\Omega$ กับ $0\\ \\Omega$ มีความต้านทาน $0$) เหลือความต้านทานรวม $2\\ \\Omega$ กระแส $= \\dfrac{6}{2} = 3\\ \\mathrm{A}$ เพิ่มจาก $1\\ \\mathrm{A}$ เป็น 3 เท่า"
