    unit: บาท
  misconceptions:
  - match: 10800
    feedback: ลืมรวมค่าแรกเข้า 2,500 บาท
  - match: 3400
    feedback: บวก 900 กับ 2,500 ยังไม่ได้คูณค่ารายเดือนด้วย 12
  hints:
