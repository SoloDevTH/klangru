problems:
  - id: computer.security.cybersecurity-basics.p001
    topics: [computer.security.cybersecurity-basics]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นรหัสผ่านบัญชีโรงเรียนที่ **จำง่ายสำหรับเรา แต่คนอื่นเดายาก** ที่สุด"
    choices:
      - { id: a, text: "ตะเกียบ-ฝนตก-ว่าว-มะม่วง (คำสุ่มสี่คำต่อกัน)", correct: true }
      - { id: b, text: "12345678", feedback: "เป็นรหัสที่คนใช้มากที่สุดแบบหนึ่ง คนร้ายลองเป็นอันดับแรก ๆ" }
      - { id: c, text: "ชื่อเล่นและปีเกิด เช่น ploy2554", feedback: "จำง่าย แต่เพื่อนและคนที่เห็นโซเชียลของเรารู้ชื่อเล่นและปีเกิดอยู่แล้ว" }
      - { id: d, text: "xQ7#", feedback: "สุ่มดี แต่สั้นมาก มีจำนวนแบบน้อย และจำยาก" }
    hints:
      - "รหัสผ่านที่ดีต้องยาว และไม่ใช่ข้อมูลที่คนอื่นรู้เกี่ยวกับเรา"
      - "คำที่ไม่เกี่ยวกันหลายคำต่อกันจำเป็นภาพได้"
    solution: "คำสุ่มสี่คำต่อกันยาว จึงมีจำนวนแบบมาก และไม่ใช่ข้อมูลส่วนตัว คนอื่นจึงเดายาก ส่วนเราจำเป็นภาพได้ง่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.cybersecurity-basics.p002
    topics: [computer.security.cybersecurity-basics]
    difficulty: 1
    type: match
    stem: "จับคู่เหตุการณ์ในระบบลงทะเบียนเรียนกับเป้าหมายความมั่นคงปลอดภัยที่ถูกทำลาย"
    pairs:
      - { left: "รายชื่อและเบอร์โทรนักเรียนหลุดไปในกลุ่มแชตสาธารณะ", right: "การรักษาความลับ" }
      - { left: "มีคนแอบเปลี่ยนวิชาเลือกของเพื่อนโดยเจ้าตัวไม่รู้", right: "ความถูกต้องครบถ้วน" }
      - { left: "เว็บลงทะเบียนเข้าไม่ได้ทั้งวันในวันสุดท้าย", right: "ความพร้อมใช้" }
    hints:
      - "ความลับ = คนที่ไม่มีสิทธิ์ได้เห็น"
      - "ถูกแก้ไข = ความถูกต้อง ใช้ไม่ได้ = ความพร้อมใช้"
    solution: "ข้อมูลหลุด → ความลับ ข้อมูลถูกแก้ → ความถูกต้องครบถ้วน ระบบใช้ไม่ได้ → ความพร้อมใช้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.cybersecurity-basics.p003
    topics: [computer.security.cybersecurity-basics]
    difficulty: 2
    type: mcq
    stem: "แก้มใช้รหัสผ่านเดียวกันในเกมออนไลน์ อีเมล และแอปธนาคาร วันหนึ่งข่าวบอกว่าข้อมูลผู้ใช้ของเกมนั้นรั่ว ข้อใดอธิบายความเสี่ยงได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "คนร้ายอาจนำอีเมลและรหัสผ่านจากเกมไปลองเข้าอีเมลและแอปธนาคารของแก้ม แล้วเข้าได้เพราะรหัสเหมือนกัน", correct: true }
      - { id: b, text: "เสี่ยงแค่บัญชีเกม เพราะรั่วจากเกมเท่านั้น", feedback: "รหัสผ่านที่ใช้ซ้ำเปิดได้ทุกบัญชีที่ใช้รหัสเดียวกัน" }
      - { id: c, text: "ไม่เสี่ยง ถ้ารหัสผ่านยาวและมีสัญลักษณ์", feedback: "รหัสยาวแค่ไหนก็ไม่ช่วย ถ้าคนร้ายได้รหัสนั้นไปแล้วจากเว็บที่รั่ว" }
      - { id: d, text: "เสี่ยงเฉพาะเมื่อแก้มเข้าเกมอีกครั้ง", feedback: "คนร้ายใช้รหัสที่รั่วได้ทันทีโดยไม่ต้องรอให้แก้มทำอะไร" }
    hints:
      - "คนร้ายได้อะไรจากข้อมูลที่รั่ว"
      - "ถ้ารหัสเหมือนกันทุกที่ รหัสเดียวเปิดได้กี่บัญชี"
    solution: "ข้อมูลที่รั่วมีอีเมลและรหัสผ่าน คนร้ายนำไปลองกับบริการอื่นทันที เพราะรู้ว่าคนจำนวนมากใช้ซ้ำ แก้มควรเปลี่ยนรหัสผ่านทุกบัญชีให้ไม่ซ้ำกัน และเปิด MFA"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.cybersecurity-basics.p004
    topics: [computer.security.cybersecurity-basics]
    difficulty: 2
    type: match
    stem: "จับคู่สิ่งที่ใช้ยืนยันตัวตนกับชนิดของปัจจัย"
    pairs:
      - { left: "PIN 6 หลักของบัตร ATM", right: "สิ่งที่รู้" }
      - { left: "กุญแจ USB สำหรับยืนยันตัวตน", right: "สิ่งที่มี" }
      - { left: "การสแกนใบหน้า", right: "สิ่งที่เป็น" }
    hints:
      - "สิ่งที่รู้อยู่ในความจำ สิ่งที่มีเป็นสิ่งของ สิ่งที่เป็นคือร่างกายของเรา"
      - "MFA ต้องใช้ปัจจัยต่างชนิดกัน"
    solution: "PIN จำไว้ในหัว = สิ่งที่รู้ กุญแจ USB เป็นของที่ถือไว้ = สิ่งที่มี ใบหน้าเป็นลักษณะของร่างกาย = สิ่งที่เป็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.cybersecurity-basics.p005
    topics: [computer.security.cybersecurity-basics]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อความ SMS ในภาพมีสัญญาณเตือนของฟิชชิงข้อใดบ้าง (เลือกทุกข้อที่ถูก)"
    figure:
      src: sms.svg
      alt: "ข้อความ SMS สมมติจากผู้ส่งชื่อ PARCEL-TH เวลา 21:47 เขียนว่า แจ้งเตือน พัสดุของท่านตกค้าง เนื่องจากที่อยู่ไม่ครบ กรุณาชำระค่าจัดส่งใหม่ 19 บาท ภายใน 2 ชั่วโมง มิฉะนั้นพัสดุจะถูกตีกลับ มีลิงก์ parcel-th-pay.example/ok และให้ติดตั้งแอปติดตามพัสดุเป็นไฟล์ .apk"
    choices:
      - { id: a, text: "เร่งให้รีบทำภายใน 2 ชั่วโมง", correct: true }
      - { id: b, text: "ให้กดลิงก์ไปเว็บที่ไม่ใช่เว็บทางการของบริษัทขนส่ง", correct: true }
      - { id: c, text: "ให้ติดตั้งแอปจากไฟล์ .apk นอกร้านแอปทางการ", correct: true }
      - { id: d, text: "จำนวนเงินน้อยเพียง 19 บาท จึงปลอดภัย", feedback: "เงินน้อยเป็นเหยื่อล่อ เป้าหมายจริงคือข้อมูลบัตรหรือการควบคุมเครื่องผ่านแอปที่ติดตั้ง" }
    hints:
      - "ฟิชชิงมักกดดันเรื่องเวลาและพาไปนอกช่องทางทางการ"
      - "แอปที่ไม่ได้มาจากร้านแอปทางการอาจควบคุมเครื่องได้"
    solution: "สัญญาณเตือนคือ เร่งเวลา ลิงก์ไปโดเมนแปลก และให้ติดตั้งไฟล์ .apk ส่วนจำนวนเงินน้อยเป็นกลลวงให้ไม่ระวัง ถ้าสงสัยให้ตรวจพัสดุผ่านแอปหรือเว็บทางการที่พิมพ์เอง อย่ากดลิงก์ในข้อความ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.cybersecurity-basics.p006
    topics: [computer.security.cybersecurity-basics]
    difficulty: 2
    type: match
    stem: "จับคู่ชนิดของมัลแวร์กับลักษณะ"
    pairs:
      - { left: "แรนซัมแวร์", right: "เข้ารหัสไฟล์ของเหยื่อแล้วเรียกค่าไถ่" }
      - { left: "โทรจัน", right: "แฝงมากับโปรแกรมที่ดูมีประโยชน์" }
      - { left: "เวิร์ม", right: "แพร่ไปยังเครื่องอื่นผ่านเครือข่ายได้เอง" }
      - { left: "สปายแวร์", right: "แอบเก็บข้อมูลการใช้งานส่งออกไป" }
    hints:
      - "ชื่อ โทรจัน มาจากม้าไม้ที่ซ่อนทหารไว้ข้างใน"
      - "ransom แปลว่าค่าไถ่ spy แปลว่าสอดแนม"
    solution: "แรนซัมแวร์เรียกค่าไถ่ โทรจันแฝงในโปรแกรมที่ดูดี เวิร์มแพร่ผ่านเครือข่ายเอง สปายแวร์แอบเก็บข้อมูล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.cybersecurity-basics.p007
    topics: [computer.security.cybersecurity-basics]
    difficulty: 3
    type: numeric
    stem: "ระบบเข้าใช้ของโรงเรียนให้ลองรหัสผ่านผิดได้ 5 ครั้ง แล้วล็อก 15 นาที ถ้ามีคนพยายามเดารหัสผ่านต่อเนื่องตลอด 24 ชั่วโมง จะลองได้มากที่สุดกี่ครั้ง"
    answer: { value: 480, unit: ครั้ง }
    hints:
      - "หนึ่งชั่วโมงมีกี่ช่วงช่วงละ 15 นาที"
      - "ช่วงละ 5 ครั้ง คูณด้วยจำนวนช่วงใน 24 ชั่วโมง"
    misconceptions:
      - { match: 120, feedback: "120 คือจำนวนครั้งใน 6 ชั่วโมง หรือคิดว่าชั่วโมงละ 5 ครั้ง ที่จริงหนึ่งชั่วโมงมี 4 ช่วง" }
      - { match: 96, feedback: "96 คือจำนวนช่วง 15 นาทีในหนึ่งวัน ต้องคูณ 5 ครั้งต่อช่วงด้วย" }
    solution: "24 ชั่วโมง = 1,440 นาที = 1,440 ÷ 15 = 96 ช่วง ช่วงละ 5 ครั้ง รวม 96 × 5 = 480 ครั้ง ถ้ารหัสเป็นตัวเลข 6 หลัก (1,000,000 แบบ) วันหนึ่งจะลองได้ไม่ถึง 0.05% การจำกัดจำนวนครั้งจึงเป็นมาตรการฝั่งระบบที่ได้ผลมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.cybersecurity-basics.p008
    topics: [computer.security.cybersecurity-basics]
    difficulty: 3
    type: mcq
    stem: "บิวเข้าระบบคะแนนของโรงเรียนด้วยบัญชีนักเรียนสำเร็จ แต่เมื่อกดปุ่ม \"แก้คะแนน\" ระบบขึ้นว่า \"คุณไม่มีสิทธิ์\" ขั้นที่บิวไม่ผ่านคืออะไร"
    choices:
      - { id: a, text: "การกำหนดสิทธิ์ เพราะบัญชีนักเรียนไม่มีสิทธิ์แก้คะแนน", correct: true }
      - { id: b, text: "การยืนยันตัวตน เพราะรหัสผ่านผิด", feedback: "บิวเข้าระบบสำเร็จแล้ว แสดงว่าผ่านการยืนยันตัวตน" }
      - { id: c, text: "ความพร้อมใช้ เพราะระบบล่ม", feedback: "ระบบยังตอบกลับได้ จึงไม่ได้ล่ม แต่ปฏิเสธเพราะเรื่องสิทธิ์" }
      - { id: d, text: "การเข้ารหัส เพราะข้อมูลคะแนนถูกเข้ารหัสไว้", feedback: "การเข้ารหัสปกป้องข้อมูลระหว่างเก็บหรือส่ง ไม่ได้ตัดสินว่าใครแก้ข้อมูลได้" }
    hints:
      - "การยืนยันตัวตนตอบว่าคุณคือใคร การกำหนดสิทธิ์ตอบว่าคุณทำอะไรได้"
      - "บิวเข้าระบบได้แล้ว"
    solution: "บิวผ่านการยืนยันตัวตน (เข้าระบบได้) แต่ไม่ผ่านการกำหนดสิทธิ์ เพราะตามหลักสิทธิ์น้อยที่สุด เฉพาะครูแก้คะแนนได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.cybersecurity-basics.p009
    topics: [computer.security.cybersecurity-basics]
    difficulty: 3
    type: mcq
    stem: "ร้านค้าออนไลน์สมมติใช้เว็บ shop.example ลิงก์ใดพาไปเว็บของร้านจริง"
    choices:
      - { id: a, text: "https://pay.shop.example/order", correct: true }
      - { id: b, text: "https://shop.example.pay-now.example/order", feedback: "โดเมนจริงคือสองส่วนขวาสุด pay-now.example คำว่า shop.example ข้างหน้าเป็นแค่ชื่อย่อยที่ใครก็ตั้งได้" }
      - { id: c, text: "https://shop-example.pay.example/order", feedback: "โดเมนจริงคือ pay.example ส่วน shop-example ที่มีขีดกลางเป็นชื่อย่อยที่ทำให้ดูคล้าย" }
      - { id: d, text: "https://pay.example/shop.example/order", feedback: "หลังเครื่องหมาย / เป็นแค่เส้นทางในเว็บ pay.example ไม่ได้บอกเจ้าของเว็บ" }
    hints:
      - "ตัด https:// และทุกอย่างหลัง / ตัวแรกออกก่อน"
      - "อ่านจากขวาไปซ้าย โดเมนจริงคือสองส่วนขวาสุด"
    solution: "pay.shop.example มีสองส่วนขวาสุดเป็น shop.example จึงเป็นชื่อย่อย pay ของเว็บร้านจริง ตัวเลือกอื่นมีโดเมนจริงเป็น pay-now.example หรือ pay.example ซึ่งเป็นของคนอื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.cybersecurity-basics.p010
    topics: [computer.security.cybersecurity-basics]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ห้องธุรการของโรงเรียนเก็บข้อมูลนักเรียนในคอมพิวเตอร์ มาตรการใดเป็น **มาตรการทางกายภาพ** (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ล็อกห้องธุรการเมื่อไม่มีคนอยู่", correct: true }
      - { id: b, text: "ตั้งให้หน้าจอล็อกเองเมื่อไม่มีการใช้งาน 2 นาที และกด Windows+L ทุกครั้งที่ลุก", correct: true }
      - { id: c, text: "ไม่เสียบแฟลชไดรฟ์ที่เก็บได้", correct: true }
      - { id: d, text: "เปิดไฟร์วอลล์ของระบบปฏิบัติการ", feedback: "ไฟร์วอลล์เป็นซอฟต์แวร์กรองการเชื่อมต่อเครือข่าย จึงเป็นมาตรการดิจิทัล" }
      - { id: e, text: "เข้ารหัสไฟล์ข้อมูลนักเรียน", feedback: "การเข้ารหัสเป็นมาตรการดิจิทัล แม้จะช่วยได้มากเมื่อเครื่องถูกขโมย" }
    hints:
      - "มาตรการทางกายภาพป้องกันการเข้าถึงตัวเครื่องและสื่อจริง ๆ"
      - "มาตรการดิจิทัลทำงานด้วยซอฟต์แวร์"
    solution: "ล็อกห้อง ล็อกหน้าจอเมื่อลุก (กันคนเดินมาใช้เครื่อง) และไม่เสียบสื่อที่ไม่รู้ที่มา เป็นมาตรการทางกายภาพ ไฟร์วอลล์และการเข้ารหัสเป็นมาตรการดิจิทัล ทั้งสองแบบใช้ร่วมกันเป็นการป้องกันหลายชั้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.cybersecurity-basics.p011
    topics: [computer.security.cybersecurity-basics]
    difficulty: 3
    type: order
    stem: "บัญชีแชตของน้ำถูกขโมยและกำลังส่งข้อความยืมเงินเพื่อน น้ำยังเข้าบัญชีได้อยู่ เรียงสิ่งที่ควรทำตามลำดับ"
    items:
      - "เปลี่ยนรหัสผ่านทันทีจากเครื่องที่ปลอดภัย"
