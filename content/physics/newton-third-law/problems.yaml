  - id: phy.n3.p021
    topics: [physics.dynamics.newton-third]
    difficulty: 4
    type: expression
    stem: "ดันกล่อง A มวล $m_A$ ด้วยแรง $F$ บนพื้นลื่น กล่อง A ดันกล่อง B มวล $m_B$ ที่วางชิดอยู่ เขียนขนาดของแรงที่ B ดัน A กลับ ในรูปของ $F$, $m_A$ และ $m_B$"
    prefix: "F_{BA} ="
    answer: { latex: "\\frac{F m_B}{m_A+m_B}", variables: [F, m_A, m_B] }
    hints:
      - "ความเร่งของทั้งสองกล่อง $a = \\dfrac{F}{m_A + m_B}$"
      - "แรงที่ A ดัน B ทำให้ B เร่ง: $F_{AB} = m_B a$ แล้วใช้กฎข้อที่ 3"
    misconceptions:
      - { match: "\\frac{F m_A}{m_A+m_B}", feedback: "นั่นคือแรงลัพธ์ของกล่อง A แรงระหว่างกล่องหาจากกล่อง B ที่ถูกดัน จึงใช้ $m_B$" }
      - { match: "F", feedback: "แรง $F$ กระทำต่อ A ทั้งหมด แต่ B ต้องการแรงเพียงพอให้มวล $m_B$ เร่งไปด้วยกัน จึงน้อยกว่า $F$" }
    solution: "$a = \\dfrac{F}{m_A + m_B}$ และ $F_{AB} = m_B a = \\dfrac{F m_B}{m_A + m_B}$ ตามกฎข้อที่ 3 $F_{BA}$ มีขนาดเท่ากัน ตรวจ: ถ้า $m_B$ เล็กมาก แรงระหว่างกล่องเกือบเป็นศูนย์ สมเหตุสมผล"
    license: CC-BY-SA-4.0
    ai_assisted: true
