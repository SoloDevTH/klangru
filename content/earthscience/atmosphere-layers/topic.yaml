id: earthscience.atmosphere.atmosphere-layers
subject: earthscience
title: { th: ชั้นบรรยากาศและความดันอากาศ, en: "Layers of the atmosphere and air pressure" }
summary: ส่วนประกอบของอากาศ บรรยากาศที่เปลี่ยนไปตั้งแต่โลกเกิด การแบ่งชั้นบรรยากาศตามอุณหภูมิและประโยชน์ของแต่ละชั้น และความดันอากาศที่ลดลงเมื่อสูงขึ้น
difficulty: 2.5
minutes: 35
prerequisites: [earthscience.atmosphere.air-wind, physics.dynamics.forces-intro]
encompasses:
  - { id: earthscience.atmosphere.air-wind, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ชั้นบรรยากาศแบ่งตามอุณหภูมิ
    src: layers.svg
    alt: "กราฟอุณหภูมิกับความสูง 0 ถึง 110 km แบ่งเป็นแถบสี่ชั้น โทรโพสเฟียร์ 0 ถึงราว 12 km อุณหภูมิลดจาก 15 °C ที่ผิวโลกถึงราว −56 °C มีลมฟ้าอากาศ เมฆ ฝน และยอดเขาเอเวอเรสต์ 8.8 km สตราโตสเฟียร์ 12 ถึง 50 km อุณหภูมิคงที่ก่อนแล้วสูงขึ้นถึงราว −3 °C มีชั้นโอโซนราว 20–30 km มีโซสเฟียร์ 50 ถึง 85 km อุณหภูมิลดลงถึงราว −86 °C ดาวตกเผาไหม้ เทอร์โมสเฟียร์ 85 km ขึ้นไป อุณหภูมิสูงขึ้นมาก เกิดแสงเหนือแสงใต้"
    caption: "ค่าตามบรรยากาศมาตรฐานสากล ความสูงจริงของแต่ละชั้นเปลี่ยนตามละติจูดและฤดู (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ทำไมแบ่งชั้นตรงที่ความสูงเหล่านี้
    problem: "ใช้กราฟอุณหภูมิกับความสูง อธิบายว่าทำไมขอบบนของโทรโพสเฟียร์อยู่ที่ราว 12 km และขอบบนของสตราโตสเฟียร์อยู่ที่ราว 50 km"
    steps:
      - text: "จาก 0 ถึงราว 12 km อุณหภูมิลดลงเมื่อสูงขึ้น"
        why: "อากาศได้ความร้อนจากพื้นโลก ยิ่งห่างพื้นยิ่งเย็น"
      - text: "เหนือราว 12 km อุณหภูมิหยุดลดและเริ่มสูงขึ้น แนวโน้มเปลี่ยน จึงเป็นขอบของชั้นใหม่"
      - text: "จาก 12 ถึง 50 km อุณหภูมิสูงขึ้น เพราะโอโซนดูดกลืนรังสีอัลตราไวโอเลต"
      - text: "เหนือราว 50 km อุณหภูมิกลับลดลงอีก แนวโน้มเปลี่ยนอีกครั้ง จึงเป็นขอบบนของสตราโตสเฟียร์"
    answer: "แบ่งชั้นตรงจุดที่อุณหภูมิเปลี่ยนจากลดลงเป็นสูงขึ้น หรือจากสูงขึ้นเป็นลดลง"
  - { type: check, problem: earthscience.atmosphere.atmosphere-layers.p010, prompt: "อะไรทำให้สตราโตสเฟียร์อุ่นขึ้น" }
  - type: figure
    title: ความดันอากาศที่ระดับความสูงต่าง ๆ
    src: pressure-altitude.svg
    alt: "กราฟเส้นโค้ง แกนตั้งเป็นความสูง 0 ถึง 20 km แกนนอนเป็นความดันอากาศ 0 ถึง 1,100 hPa เส้นเริ่มที่ 1,013 hPa ที่ระดับทะเล ลดลงเร็วในช่วงล่างแล้วช้าลง ผ่านราว 800 hPa ที่ 2 km ราว 620 hPa ที่ 4 km ราว 470 hPa ที่ 6 km ราว 360 hPa ที่ 8 km ราว 260 hPa ที่ 10 km และราว 55 hPa ที่ 20 km"
    caption: "คำนวณจากบรรยากาศมาตรฐานสากล (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ความดันบนยอดเขาเอเวอเรสต์
    problem: "ใช้แบบจำลองอย่างง่ายว่าความดันอากาศลดลงครึ่งหนึ่งทุก 5.5 km ประมาณความดันที่ความสูง 8.8 km (ยอดเขาเอเวอเรสต์) เทียบกับระดับทะเล 1,013 hPa"
    steps:
      - text: "ที่ 5.5 km ความดันเหลือครึ่งหนึ่ง $1{,}013 \\div 2 \\approx 507$ hPa"
      - text: "8.8 km สูงกว่า 5.5 km อีก 3.3 km ซึ่งไม่ถึง 5.5 km ความดันจึงยังไม่ลดลงอีกครึ่ง แต่ต้องต่ำกว่า 507 hPa"
      - text: "ที่ 11 km ความดันจะเหลือ $507 \\div 2 \\approx 253$ hPa ความดันที่ 8.8 km จึงอยู่ระหว่าง 253 กับ 507 hPa"
        why: "ความดันลดลงต่อเนื่องเมื่อสูงขึ้น"
      - text: "เทียบกับกราฟ ที่ 8.8 km อ่านได้ราว 314 hPa หรือราวหนึ่งในสามของระดับทะเล"
    answer: "ราว 300 hPa หรือราวหนึ่งในสามของความดันที่ระดับทะเล"
  - type: interactive
    title: ความดันลดลงครึ่งหนึ่งทุก h กิโลเมตร
    caption: "เส้นคือ $P = 1013 \\times 0.5^{x/h}$ เมื่อ $x$ คือความสูงเป็นกิโลเมตร ลองตั้ง $h = 5.5$ แล้วอ่านความดันที่ 2.6 km (ดอยอินทนนท์) และ 8.8 km (เอเวอเรสต์) สังเกตว่าเส้นชันช่วงล่างและราบลงเมื่อสูงขึ้น"
    widget:
      kind: function-plot
      functions: ["1013\\cdot 0.5^{\\frac{x}{h}}"]
      sliders:
        - { name: h, min: 4, max: 8, step: 0.5, value: 5.5, label: ความสูงที่ความดันลดลงครึ่งหนึ่ง (km) }
      x: [0, 20]
      y: [0, 1100]
  - { type: check, problem: earthscience.atmosphere.atmosphere-layers.p009, prompt: "ความดันอากาศเกิดจากอะไร" }
glossary:
  - { term: โทรโพสเฟียร์, definition: "บรรยากาศชั้นล่างสุด สูงจากผิวโลกถึงราว 12 km อุณหภูมิลดลงเมื่อสูงขึ้น เกิดลมฟ้าอากาศ" }
  - { term: สตราโตสเฟียร์, definition: "บรรยากาศชั้นที่สอง ราว 12 ถึง 50 km มีชั้นโอโซน อุณหภูมิสูงขึ้นเมื่อสูงขึ้น" }
  - { term: มีโซสเฟียร์, definition: "บรรยากาศชั้นที่สาม ราว 50 ถึง 85 km หนาวที่สุด ดาวตกลุกไหม้ในชั้นนี้" }
  - { term: เทอร์โมสเฟียร์, definition: "บรรยากาศชั้นบน ราว 85 km ขึ้นไป อากาศเบาบางมาก อุณหภูมิสูงขึ้นมาก เกิดแสงเหนือแสงใต้" }
  - { term: ความดันอากาศ, definition: "แรงที่อากาศกระทำตั้งฉากต่อพื้นที่หนึ่งหน่วย ที่ระดับทะเลประมาณ 1,013 เฮกโตพาสคัล" }
  - { term: ชั้นโอโซน, definition: "ส่วนของสตราโตสเฟียร์ที่มีแก๊สโอโซนมาก ดูดกลืนรังสีอัลตราไวโอเลตจากดวงอาทิตย์" }
flashcards:
  - { front: "แบ่งชั้นบรรยากาศตามอะไร", back: "การเปลี่ยนแปลงของอุณหภูมิเมื่อความสูงเพิ่มขึ้น" }
  - { front: "เรียงชั้นบรรยากาศจากล่างขึ้นบน", back: "โทรโพสเฟียร์ สตราโตสเฟียร์ มีโซสเฟียร์ เทอร์โมสเฟียร์ (แล้วเอกโซสเฟียร์)" }
  - { front: "ความดันอากาศที่ระดับทะเล", back: "ประมาณ 1,013 hPa หรือปรอทสูง 760 mm ลดลงราวครึ่งหนึ่งที่ 5.5 km" }
  - { front: "ออกซิเจนในอากาศมาจากไหน", back: "การสังเคราะห์ด้วยแสงของสิ่งมีชีวิต สะสมมากขึ้นตั้งแต่ราว 2,400 ล้านปีก่อน" }
