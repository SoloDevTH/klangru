      - "ลากเส้นฉายไปร่างภาพด้านบนและภาพด้านข้างให้ขนาดตรงกัน"
      - "เติมเส้นประของขอบที่ถูกบังและเส้นศูนย์กลาง"
      - "เน้นขอบที่มองเห็นเป็นเส้นเต็มหนา แล้วกำหนดขนาด"
    hints:
      - "ภาพด้านหน้าเป็นภาพหลัก ภาพอื่นอ้างขนาดจากภาพนี้"
      - "ร่างเบา ๆ ก่อน เน้นเส้นและใส่ขนาดเป็นขั้นท้าย"
