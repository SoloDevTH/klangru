id: technology.design.design-process-advanced
subject: technology
title:
  th: การออกแบบเชิงวิศวกรรมสำหรับปัญหาซับซ้อน
  en: Engineering design for complex problems
summary: ปัญหาชุมชนที่มีผู้ใช้หลายกลุ่มและหลายเงื่อนไข ตัดทางเลือกด้วยข้อจำกัดก่อนให้คะแนนถ่วงน้ำหนัก ทรัพย์สินทางปัญญา นำเสนอด้วยหลายเทคนิคและซอฟต์แวร์ช่วยออกแบบ ต้นทุน หาเหตุของข้อบกพร่อง และต่อยอด
difficulty: 4.5
minutes: 40
prerequisites:
- technology.design.design-process
- technology.design.materials-tools
encompasses:
- id: technology.design.design-process
  weight: 0.4
- id: technology.design.materials-tools
  weight: 0.1
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  title: ตัดก่อน แล้วจึงให้คะแนน
  src: flood-matrix.svg
  alt: 'แผนภูมิแท่งซ้อนคะแนนถ่วงน้ำหนักของเครื่องเตือนน้ำท่วม 4 แบบ (ข้อมูลสมมติ) น้ำหนักเกณฑ์ เตือนแม่นยำ 35% ผู้สูงอายุรับรู้ได้ 25% ราคา 15% ดูแลง่าย 15% ต่อยอดได้ 10% แบบ A อัลตราโซนิกและข้อความโทรศัพท์ คะแนน 5 3 2 3 5 รวม 3.75 แบบ B ลูกลอย 3 ระดับและไซเรนกับไฟ คะแนน 3 5 4 5 2 รวม 3.85 แบบ C ไม้วัดระดับ คนเฝ้า และเสียงตามสาย รวม 3.15 ถูกขีดฆ่า ตัดออกเพราะต้องมีคนเฝ้าตลอดคืน แบบ D กล้องและปัญญาประดิษฐ์ รวม 4.10 สูงสุดแต่ถูกขีดฆ่า ตัดออกเพราะราคา 4,800 บาท เกินงบ'
  caption: แบบ D คะแนนสูงสุดแต่เกินงบ จึงถูกตัดก่อนเทียบคะแนน
- type: worked-example
  title: แยกข้อจำกัดกับเกณฑ์ แล้วตัดทางเลือก
  problem: 'โรงเรียนอยากลดขยะพลาสติกในโรงอาหาร ความต้องการที่รวบรวมได้คือ งบไม่เกิน 10,000 บาท ต้องเริ่มใช้ได้ในภาคเรียนนี้ ยิ่งลดขยะได้มากยิ่งดี ยิ่งสะดวกต่อนักเรียนยิ่งดี และต้องถูกสุขอนามัย ทางเลือกตู้กดน้ำราคา 15,000 บาท ควรทำอย่างไร'
  steps:
  - text: 'ข้อจำกัด (ต้องผ่าน): งบไม่เกิน 10,000 บาท เริ่มได้ในภาคเรียนนี้ ถูกสุขอนามัย'
    why: คำว่า ต้อง ไม่เกิน บอกว่าเป็นเงื่อนไขที่ไม่ผ่านไม่ได้
  - text: 'เกณฑ์ (ให้คะแนน): ลดขยะได้มาก สะดวกต่อนักเรียน'
  - text: ตรวจข้อจำกัดก่อน ตู้กดน้ำ 15,000 บาท เกินงบ จึงตัดออกไม่ว่าคะแนนเกณฑ์จะสูงเท่าใด
  - text: ให้คะแนนถ่วงน้ำหนักเฉพาะทางเลือกที่ผ่านข้อจำกัด แล้วเลือกคะแนนสูงสุด
    why: ถ้ายังอยากได้ตู้กดน้ำ ต้องหาทางให้ผ่านข้อจำกัดก่อน เช่น หาผู้สนับสนุนหรือรุ่นที่ถูกกว่า แล้วประเมินใหม่
  answer: แยกเป็นข้อจำกัด 3 ข้อและเกณฑ์ 2 ข้อ ตัดตู้กดน้ำเพราะเกินงบ แล้วเทียบคะแนนถ่วงน้ำหนักของทางเลือกที่เหลือ
- type: check
  problem: technology.design.design-process-advanced.p001
  prompt: ข้อจำกัดเขียนด้วยคำแบบใด
- type: figure
  title: ปรับปรุงต้นแบบทีละรอบ
  src: iterations.svg
  alt: 'สามคอลัมน์แสดงการปรับปรุงต้นแบบ B (ข้อมูลสมมติ) รอบที่ 1 สร้างลูกลอย 3 ระดับต่อไซเรนโดยตรง ทดสอบพบคลื่นจากเรือทำให้ไซเรนดังผิด 4 ครั้งใน 1 วัน เหตุคือลูกลอยยกขึ้นชั่วครู่ตามคลื่น ปรับปรุงให้เตือนเมื่อลูกลอยค้างนานเกิน 30 วินาที รอบที่ 2 เพิ่มบอร์ดไมโครคอนโทรลเลอร์หน่วงเวลา ไม่มีเตือนผิดแต่แบตเตอรี่ 7 Ah ใช้ได้ 20 ชั่วโมง เหตุคือไฟแสดงสถานะติดตลอด กระแสขณะรอ 0.35 A ปรับปรุงโดยปิดไฟแสดงสถานะและให้บอร์ดพักเครื่อง รอบที่ 3 กระแสขณะรอเหลือ 0.12 A ใช้ได้ราว 58 ชั่วโมง ไม่มีเตือนผิด ผ่านเกณฑ์ทุกข้อ (ต้องอยู่ได้อย่างน้อย 24 ชั่วโมง) ต่อยอดด้วยแผงโซลาร์และส่งข้อมูลถึงผู้ใหญ่บ้าน'
  caption: ทุกรอบหาเหตุของข้อบกพร่องก่อนแก้ แล้วทดสอบซ้ำด้วยวิธีเดิม
- type: worked-example
  title: ให้เหตุผลของข้อบกพร่องและตรวจด้วยการคำนวณ
  problem: ต้นแบบรอบที่ 2 ใช้แบตเตอรี่ 12 V 7 Ah ทดสอบตอนไฟดับแล้วดับไปหลัง 20 ชั่วโมง ไม่ผ่านข้อจำกัด 24 ชั่วโมง วิเคราะห์เหตุและเสนอทางแก้
  steps:
  - text: 'ตรวจด้วยการคำนวณ: วัดกระแสขณะรอได้ 0.35 A เวลา = 7 ÷ 0.35 = 20 ชั่วโมง ตรงกับผลทดสอบ'
    why: ถ้าคำนวณตรงกับผลจริง แปลว่าเราเข้าใจระบบถูก
  - text: 'ถามว่าทำไมกระแสสูง: วัดทีละส่วน พบไฟแสดงสถานะติดตลอดและบอร์ดทำงานเต็มที่ตลอดเวลา'
  - text: 'ต้องการเวลาอย่างน้อย 24 ชั่วโมง กระแสต้องไม่เกิน 7 ÷ 24 ≈ 0.29 A'
  - text: 'ทางแก้ที่ตรงเหตุ: ปิดไฟแสดงสถานะ ให้บอร์ดพักเครื่องระหว่างอ่านค่า วัดใหม่ได้ 0.12 A คาดว่าใช้ได้ 7 ÷ 0.12 ≈ 58 ชั่วโมง'
  - text: ทดสอบซ้ำด้วยวิธีเดิม (ถอดไฟ ใช้แบตเตอรี่ลูกเดิมที่ชาร์จเต็ม) เพื่อยืนยัน
  answer: เหตุคือกระแสขณะรอสูงเกิน (0.35 A) ลดเหลือ 0.12 A แล้วทดสอบซ้ำ คาดว่าใช้ได้ราว 58 ชั่วโมง ผ่านข้อจำกัด
- type: check
  problem: technology.design.design-process-advanced.p009
  prompt: ค่าที่เกินเส้นเตือนอยู่นานแค่ไหน
glossary:
- term: ผู้มีส่วนได้ส่วนเสีย
  definition: บุคคลหรือกลุ่มที่ได้รับผลหรือมีผลต่อวิธีแก้ปัญหา เช่น ผู้ใช้ ผู้ดูแล ผู้ให้งบ และชุมชน
- term: ข้อจำกัด
  definition: เงื่อนไขที่ทางเลือกต้องผ่านทุกข้อ ไม่ผ่านข้อเดียวก็ตัดทิ้ง เช่น งบ ความปลอดภัย กฎหมาย
- term: ข้อมูลปฐมภูมิ
  definition: ข้อมูลที่ผู้ออกแบบเก็บเองโดยตรง เช่น การสำรวจ สัมภาษณ์ การวัด
- term: ข้อมูลทุติยภูมิ
  definition: ข้อมูลที่ผู้อื่นเก็บและเผยแพร่ไว้แล้ว เช่น สถิติของหน่วยงาน งานวิจัย
- term: ซอฟต์แวร์ช่วยออกแบบ (CAD)
  definition: โปรแกรมที่ใช้เขียนแบบและสร้างแบบจำลองสองหรือสามมิติ ตรวจรูปร่างและการประกอบก่อนสร้างจริง
- term: การแลกได้แลกเสีย
  definition: การยอมเสียบางเกณฑ์เพื่อได้เกณฑ์อื่นที่สำคัญกว่า พร้อมบอกเหตุผล
- term: การพัฒนาต่อยอด
  definition: ข้อเสนอปรับปรุงหรือขยายผลงานในรุ่นถัดไป โดยอาศัยผลทดสอบและข้อบกพร่องที่ยังเหลือ
flashcards:
- front: ข้อจำกัด กับ เกณฑ์ ใช้ต่างกันอย่างไร
  back: ข้อจำกัดใช้ตัดทิ้ง (ต้องผ่าน) เกณฑ์ใช้ให้คะแนนเปรียบเทียบ ตรวจข้อจำกัดก่อนเสมอ
- front: ผลเมทริกซ์พลิกเมื่อปรับน้ำหนักเล็กน้อย แปลว่าอะไร
  back: ทางเลือกสูสี ต้องให้ผู้ใช้ช่วยกำหนดน้ำหนักหรือหาข้อมูลเพิ่ม
- front: ใช้ภาพหรือโค้ดของผู้อื่นในโครงงาน
  back: ตรวจสัญญาอนุญาต ใช้ตามเงื่อนไข และให้เครดิต
- front: ให้เหตุผลของข้อบกพร่อง
  back: ถามว่าทำไมจนถึงเหตุที่แก้ได้ แก้ให้ตรงเหตุ แล้วทดสอบซ้ำด้วยวิธีเดิม
- front: เวลาใช้งานแบตเตอรี่
  back: เวลา (h) = ความจุ (Ah) ÷ กระแส (A)
