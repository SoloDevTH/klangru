id: biology.plants.plant-products-growth
subject: biology
title: { th: สารที่พืชสร้างและปัจจัยการเจริญเติบโตของพืช, en: "Plant products and factors affecting plant growth" }
summary: การทดสอบแป้ง น้ำตาล โปรตีน และลิพิดในส่วนของพืช การใช้สารจากพืชเป็นสารไล่แมลง ยา และสีย้อม และการออกแบบการทดลองเรื่องแสง น้ำ ธาตุอาหาร และอุณหภูมิที่มีผลต่อการเจริญเติบโต
difficulty: 4
minutes: 45
prerequisites: [biology.plants.photosynthesis-intro, biology.plants.transport-nutrients]
encompasses:
  - { id: biology.plants.photosynthesis-intro, weight: 0.3 }
  - { id: biology.plants.transport-nutrients, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: การทดสอบสารอาหาร
    src: food-tests.svg
    alt: "การทดสอบสารอาหาร 4 แบบ แต่ละแบบมีหลอดก่อนและหลังเมื่อพบสาร แป้ง ใช้สารละลายไอโอดีน จากสีน้ำตาลเป็นสีน้ำเงินเข้ม น้ำตาลรีดิวซ์ ใช้สารละลายเบเนดิกต์และต้มในน้ำเดือด จากสีฟ้าเป็นตะกอนสีแดงอิฐ มีแถบสีแสดงลำดับ ฟ้า เขียว เหลือง ส้ม แดงอิฐ จากน้ำตาลน้อยไปมาก โปรตีน ใช้สารละลายไบยูเรต จากสีฟ้าเป็นสีม่วง ลิพิด ใช้ซูดานทรี ได้ชั้นน้ำมันสีแดงลอยอยู่ด้านบน หรือถูบนกระดาษแล้วกระดาษโปร่งแสง"
    caption: "สีของเบเนดิกต์บอกปริมาณน้ำตาลรีดิวซ์คร่าว ๆ (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: แปลผลการทดสอบพร้อมชุดควบคุม
    problem: "ทดสอบน้ำคั้นจากเมล็ดถั่วลิสงด้วยไบยูเรตได้สีม่วง หลอดน้ำกลั่นที่หยดไบยูเรตยังเป็นสีฟ้า และเมื่อถูถั่วลิสงบดบนกระดาษ กระดาษโปร่งแสง สรุปว่าถั่วลิสงมีสารอาหารใด"
    steps:
      - text: "หลอดน้ำกลั่นไม่เปลี่ยนสี แสดงว่าไบยูเรตเองไม่ได้ทำให้เกิดสีม่วง"
        why: "ชุดควบคุมช่วยตัดความเป็นไปได้ว่าสีเปลี่ยนเพราะสารทดสอบหรือภาชนะ"
      - text: "หลอดถั่วลิสงเป็นสีม่วง แสดงว่ามีโปรตีน"
      - text: "กระดาษโปร่งแสงแสดงว่ามีลิพิด"
    answer: "ถั่วลิสงมีทั้งโปรตีนและลิพิด"
  - { type: check, problem: biology.plants.plant-products-growth.p008, prompt: "น้ำตาลทุกชนิดเป็นน้ำตาลรีดิวซ์หรือไม่" }
  - type: figure
    title: ต้นกล้าในที่สว่างและที่มืด
    src: seedling-height.svg
    alt: "กราฟเส้นความสูงเฉลี่ยของต้นกล้าถั่วเขียวชุดละ 20 ต้น แกนนอนเป็นวันที่ 0 ถึง 7 แกนตั้งเป็นความสูงเฉลี่ยเป็นเซนติเมตร ต้นในที่สว่างใบสีเขียว สูง 0, 1.0, 2.5, 4.0, 5.2, 6.3, 7.1, 7.8 ต้นในที่มืดใบสีเหลืองซีด สูง 0, 1.2, 3.4, 5.9, 8.5, 11.0, 13.2, 15.0 เป็นข้อมูลสมมติ"
    caption: "ข้อมูลสมมติ ต้นในที่มืดสูงกว่าแต่ไม่ได้เติบโตดีกว่า (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: หาค่าเฉลี่ยและอัตราการเติบโต
    problem: "ต้นข้าวโพด 5 ต้นที่ได้รับปุ๋ยมีความสูงเพิ่มขึ้นใน 10 วัน เป็น 12, 15, 14, 13 และ 16 cm จงหาความสูงที่เพิ่มขึ้นเฉลี่ยและอัตราการเติบโตเฉลี่ยต่อวัน"
    steps:
      - text: "ผลรวม $12 + 15 + 14 + 13 + 16 = 70$ cm"
      - text: "ค่าเฉลี่ย $70 \\div 5 = 14$ cm"
        why: "ใช้หลายต้นแล้วหาค่าเฉลี่ย เพื่อลดผลของต้นที่ผิดปกติ"
      - text: "อัตราการเติบโต $14 \\div 10 = 1.4$ cm ต่อวัน"
    answer: "สูงขึ้นเฉลี่ย 14 cm หรือ 1.4 cm ต่อวัน"
  - { type: check, problem: biology.plants.plant-products-growth.p004, prompt: "แยกตัวแปรต้น ตัวแปรตาม และตัวแปรควบคุม" }
  - type: figure
    title: มวลแห้งที่อุณหภูมิต่าง ๆ
    src: dry-mass-temperature.svg
    alt: "กราฟแท่งมวลแห้งรวมของต้นถั่วเขียว 10 ต้นหลังปลูก 3 สัปดาห์ที่อุณหภูมิต่าง ๆ 15 °C 1.2 กรัม 20 °C 2.6 กรัม 25 °C 3.9 กรัม 30 °C 4.4 กรัม 35 °C 3.1 กรัม 40 °C 0.9 กรัม เป็นข้อมูลสมมติ ตัวแปรอื่นควบคุมให้เท่ากัน"
    caption: "ข้อมูลสมมติ ใช้ในโจทย์ของหัวข้อนี้ (วาดโดยทีมคลังรู้)"
glossary:
  - { term: น้ำตาลรีดิวซ์, definition: "น้ำตาลที่ทำปฏิกิริยากับสารละลายเบเนดิกต์เมื่อต้ม เช่น กลูโคส ฟรักโทส แต่ไม่รวมซูโครส" }
  - { term: ซูโครส, definition: "น้ำตาลที่พืชลำเลียงทางโฟลเอ็ม สะสมมากในอ้อย ไม่ใช่น้ำตาลรีดิวซ์" }
  - { term: ชุดควบคุม, definition: "ชุดที่ใช้เปรียบเทียบ เช่น หลอดน้ำกลั่นที่ทดสอบด้วยสารเดียวกัน" }
  - { term: ตัวแปรควบคุม, definition: "สิ่งที่ต้องทำให้เท่ากันทุกชุดการทดลอง" }
  - { term: มวลแห้ง, definition: "มวลของพืชหลังอบให้น้ำระเหยออกหมด ใช้วัดการสะสมอาหาร" }
  - { term: อุณหภูมิที่เหมาะสม, definition: "อุณหภูมิที่สิ่งมีชีวิตเติบโตได้ดีที่สุด" }
flashcards:
  - { front: "ทดสอบแป้ง น้ำตาลรีดิวซ์ โปรตีน ลิพิด ด้วยอะไร", back: "ไอโอดีน เบเนดิกต์ (ต้ม) ไบยูเรต ซูดานทรีหรือกระดาษ" }
  - { front: "ทำไมน้ำอ้อยสดให้ผลกับเบเนดิกต์น้อย", back: "เพราะเป็นซูโครส ไม่ใช่น้ำตาลรีดิวซ์" }
  - { front: "ตัวอย่างสารจากพืชที่ใช้ไล่แมลง เป็นยา และย้อมสี", back: "สะเดา ตะไคร้หอม / ฟ้าทะลายโจร ขมิ้นชัน / คราม ขมิ้น ฝาง" }
  - { front: "ต้นกล้าในที่มืดเป็นอย่างไร", back: "ลำต้นยืดยาว ใบเหลืองซีด มวลแห้งลดลง" }
  - { front: "ปัจจัยภายนอกที่มีผลต่อการเจริญเติบโต", back: "แสง น้ำ ธาตุอาหาร อุณหภูมิ" }
