id: biology.animals.homeostasis
subject: biology
title: { th: การรักษาดุลยภาพของร่างกาย, en: "Homeostasis" }
summary: การป้อนกลับเชิงลบ การควบคุมน้ำและเกลือแร่ในเลือดโดยไตและฮอร์โมน ADH ดุลยภาพกรด-เบสของเลือดโดยบัฟเฟอร์ ปอด และไต และการควบคุมอุณหภูมิร่างกาย
difficulty: 5.5
minutes: 45
prerequisites: [biology.animals.excretion, biology.humans.circulatory-system]
encompasses:
  - { id: biology.animals.excretion, weight: 0.3 }
  - { id: biology.humans.circulatory-system, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: การควบคุมอุณหภูมิร่างกายด้วยการป้อนกลับเชิงลบ
    src: temperature-feedback.svg
    alt: "แผนภาพวงจรสองวง ตรงกลางคือจุดปกติราว 37 องศาเซลเซียส วงบนสีแดง เมื่ออุณหภูมิเบี่ยงขึ้นเพราะออกกำลังกายหรืออากาศร้อน ตัวรับรู้คือปลายประสาทที่ผิวหนัง ส่งสัญญาณไปศูนย์ควบคุมคือไฮโพทาลามัส ซึ่งสั่งหน่วยปฏิบัติงานให้หลอดเลือดที่ผิวหนังขยายและต่อมเหงื่อหลั่งเหงื่อ เกิดการระบายความร้อน อุณหภูมิกลับสู่จุดปกติ วงล่างสีน้ำเงิน เมื่ออุณหภูมิเบี่ยงลงเพราะอากาศหนาวหรือแช่น้ำเย็น ตัวรับรู้ที่ผิวหนังส่งสัญญาณไปไฮโพทาลามัส ซึ่งสั่งให้หลอดเลือดที่ผิวหนังหดตัวและกล้ามเนื้อโครงร่างสั่น เก็บและสร้างความร้อน อุณหภูมิกลับสู่จุดปกติ"
    caption: "ผลของการตอบสนองลบล้างการเปลี่ยนแปลง (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ร่างกายตอบสนองเมื่ออยู่ในห้องเย็น
    problem: "นักเรียนเดินจากลานกีฬาที่ร้อนเข้าห้องสมุดที่เปิดเครื่องปรับอากาศเย็นจัดนานครึ่งชั่วโมง จงอธิบายการรักษาอุณหภูมิร่างกายตามส่วนของการป้อนกลับเชิงลบ"
    steps:
      - text: "สิ่งเร้า: อุณหภูมิผิวหนังลดลงต่ำกว่าปกติ"
      - text: "ตัวรับรู้: ปลายประสาทรับความเย็นที่ผิวหนังส่งกระแสประสาทไปไฮโพทาลามัส"
      - text: "ศูนย์ควบคุม: ไฮโพทาลามัสเทียบกับจุดปกติแล้วสั่งการผ่านระบบประสาท"
      - text: "หน่วยปฏิบัติงาน: หลอดเลือดที่ผิวหนังหดตัว ลดการเสียความร้อน กล้ามเนื้อโครงร่างหดตัวถี่ ๆ สร้างความร้อน"
        why: "การหดตัวของกล้ามเนื้อใช้ ATP และปล่อยพลังงานส่วนหนึ่งออกมาเป็นความร้อน"
      - text: "ผล: อุณหภูมิแกนกลางกลับเข้าใกล้ 37 °C การกระตุ้นจึงลดลง"
    answer: "หลอดเลือดที่ผิวหนังหดตัวและกล้ามเนื้อสั่นตามคำสั่งของไฮโพทาลามัส จนอุณหภูมิกลับสู่ปกติ"
  - { type: check, problem: biology.animals.homeostasis.p006, prompt: "แยกว่าแต่ละข้อลดการเสียความร้อนหรือเพิ่มการเสียความร้อน" }
  - type: figure
    title: การควบคุมน้ำในเลือดด้วย ADH
    src: adh-water-balance.svg
    alt: "ผังลำดับ 6 กล่อง ดื่มน้ำน้อยหรือเหงื่อออกมาก ทำให้เลือดเข้มข้นขึ้นและแรงดันออสโมติกสูง ไฮโพทาลามัสรับรู้และกระตุ้น ต่อมใต้สมองส่วนหลังหลั่ง ADH ท่อหน่วยไตส่วนปลายและท่อรวมดูดน้ำกลับมาก ปัสสาวะน้อยและเข้มข้น มีเส้นประย้อนกลับบอกว่าน้ำที่ดูดกลับทำให้เลือดเจือจางลง สัญญาณกระตุ้นจึงลดลง เป็นการป้อนกลับเชิงลบ"
    caption: "เมื่อดื่มน้ำมาก ADH ลดลง ปัสสาวะมากและใส (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: หายใจช้าลงแล้ว pH ของเลือดเป็นอย่างไร
    problem: "ผู้ป่วยได้รับยาที่กดการหายใจจนหายใจช้าและตื้น จงอธิบายว่า pH ของเลือดเปลี่ยนอย่างไร และไตชดเชยอย่างไร"
    steps:
      - text: "หายใจช้า CO₂ ถูกขับออกน้อย CO₂ ในเลือดสะสม"
      - text: "ปฏิกิริยา $\\mathrm{CO_2 + H_2O \\rightleftharpoons H^+ + HCO_3^-}$ เลื่อนไปทางขวา ได้ H⁺ มากขึ้น"
        why: "ตามหลักของเลอชาเตอลิเย เมื่อสารตั้งต้นเพิ่ม สมดุลเลื่อนไปทางผลิตภัณฑ์"
      - text: "H⁺ เพิ่ม pH ของเลือดจึงลดลง เลือดเป็นกรดมากขึ้น"
      - text: "ไตชดเชยโดยขับ H⁺ ออกทางปัสสาวะมากขึ้น และดูดกลับ HCO₃⁻ เข้าเลือดมากขึ้น"
    answer: "pH ลดลง (เลือดเป็นกรด) ไตชดเชยด้วยการขับ H⁺ และดูดกลับ HCO₃⁻"
  - { type: check, problem: biology.animals.homeostasis.p008, prompt: "CO₂ ในเลือดมากขึ้น ทำให้ H⁺ มากขึ้นหรือน้อยลง" }
glossary:
  - { term: ดุลยภาพ (โฮมีโอสเตซิส), definition: "การรักษาสภาพภายในร่างกายให้ค่อนข้างคงที่ แม้สภาพภายนอกเปลี่ยนไป" }
  - { term: การป้อนกลับเชิงลบ, definition: "การควบคุมที่ผลของการตอบสนองไปลบล้างการเปลี่ยนแปลง ทำให้ค่ากลับเข้าหาจุดปกติ" }
  - { term: ไฮโพทาลามัส, definition: "สมองส่วนหน้าที่เป็นศูนย์ควบคุมอุณหภูมิ ความกระหาย และสมดุลน้ำ" }
  - { term: ADH (ฮอร์โมนแอนติไดยูเรติก), definition: "ฮอร์โมนจากต่อมใต้สมองส่วนหลัง เพิ่มการดูดน้ำกลับที่ท่อหน่วยไตส่วนปลายและท่อรวม" }
  - { term: แอลโดสเตอโรน, definition: "ฮอร์โมนจากต่อมหมวกไตส่วนนอก เพิ่มการดูดกลับ Na⁺ ที่หน่วยไต" }
  - { term: บัฟเฟอร์ไบคาร์บอเนต, definition: "ระบบ H₂CO₃ กับ HCO₃⁻ ในเลือดที่ช่วยต้าน pH ไม่ให้เปลี่ยนมาก" }
flashcards:
  - { front: "ส่วนของการป้อนกลับเชิงลบ", back: "สิ่งเร้า → ตัวรับรู้ → ศูนย์ควบคุม → หน่วยปฏิบัติงาน → ค่ากลับสู่ปกติ" }
  - { front: "ดื่มน้ำน้อย ADH และปัสสาวะเป็นอย่างไร", back: "ADH เพิ่ม ดูดน้ำกลับมาก ปัสสาวะน้อยและเข้มข้น" }
  - { front: "pH ปกติของเลือด", back: "7.35–7.45" }
  - { front: "ปอดและไตแก้เลือดที่เป็นกรดอย่างไร", back: "ปอดหายใจเร็วขับ CO₂ ไตขับ H⁺ และดูดกลับ HCO₃⁻" }
  - { front: "ร่างกายตอบสนองเมื่อหนาว", back: "หลอดเลือดที่ผิวหนังหดตัว กล้ามเนื้อโครงร่างสั่น ขนลุก" }
