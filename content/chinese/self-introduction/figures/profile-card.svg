<text x="280.0" y="54.0" font-size="20" text-anchor="middle" fill="#1f4e9c" font-weight="bold">บัตรนักเรียนแลกเปลี่ยน</text>
<rect x="46.0" y="96.0" width="110.0" height="140.0" rx="8" fill="#eef2f7" stroke="#666" stroke-width="1.5"/>
