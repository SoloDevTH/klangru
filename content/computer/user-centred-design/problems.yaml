      - { id: c, text: "เก็บเลขบัตรประชาชนของนักเรียนทุกคนเพื่อความแน่นอน", feedback: "การสั่งอาหารไม่จำเป็นต้องใช้เลขบัตรประชาชน การเก็บข้อมูลเกินจำเป็นเพิ่มความเสี่ยง" }
      - { id: d, text: "เปิดให้ทุกคนดูประวัติการกินของเพื่อนได้", feedback: "ละเมิดความเป็นส่วนตัวของนักเรียน" }
