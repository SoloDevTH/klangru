  - id: engineering.professional.engineering-ethics.p013
    topics:
      - engineering.professional.engineering-ethics
    difficulty: 4
    type: numeric
    stem: โครงสร้างหนึ่งมีโอกาสเกิดความล้มเหลวร้ายแรง 1 ใน 500 ต่อปี ถ้าอายุใช้งาน 50 ปี และแต่ละปีเป็นอิสระต่อกัน โอกาสที่จะเกิดความล้มเหลวอย่างน้อยหนึ่งครั้งตลอดอายุใช้งานกี่เปอร์เซ็นต์ (ตอบทศนิยมหนึ่งตำแหน่ง)
    answer:
      value: 9.5
      tolerance: 0.05
      unit: '%'
    hints:
      - โอกาสที่ไม่เกิดในหนึ่งปีคือ 1 ลบด้วยโอกาสที่เกิด
      - ถ้าแต่ละปีเป็นอิสระ โอกาสที่ไม่เกิดตลอด n ปีคือ (1 − p) ยกกำลัง n
      - โอกาสที่เกิดอย่างน้อยหนึ่งครั้งคือ 1 ลบด้วยโอกาสที่ไม่เกิดเลย
    misconceptions:
      - match: 10.0
        feedback: การบวกโอกาสรายปีตรง ๆ (50 × 0.2%) ได้ 10% ซึ่งประมาณเกินจริง ต้องคิดแบบ 1 − (1 − p) ยกกำลัง n
    solution: โอกาสไม่เกิดในหนึ่งปี = 1 − 1/500 = 0.998 โอกาสไม่เกิดตลอด 50 ปี = 0.998^50 ≈ 0.9047 โอกาสเกิดอย่างน้อยหนึ่งครั้ง = 1 − 0.9047 ≈ 0.0953 หรือประมาณ 9.5% ตัวเลขนี้ต้องนำไปพิจารณาคู่กับผลกระทบที่รุนแรง ไม่ใช่ดูแค่ตัวเลขโอกาส
