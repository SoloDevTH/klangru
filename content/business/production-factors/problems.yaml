problems:
  - id: business.econ.production-factors.p001
    topics: [business.econ.production-factors]
    difficulty: 1
    type: match
    stem: "ชาวนาที่ร้อยเอ็ดปลูกข้าวหอมมะลิ จับคู่สิ่งที่ใช้กับปัจจัยการผลิต"
    pairs:
      - { left: "ที่นาและน้ำฝน", right: "ที่ดิน" }
      - { left: "คนที่ช่วยดำนาและเกี่ยวข้าว", right: "แรงงาน" }
      - { left: "รถไถเดินตามและเครื่องสูบน้ำ", right: "ทุน" }
      - { left: "ชาวนาที่วางแผนว่าจะปลูกพันธุ์ใดและขายให้ใคร", right: "ผู้ประกอบการ" }
    hints:
      - "ที่ดินคือทรัพยากรธรรมชาติ ทุนคือเครื่องมือที่คนสร้างขึ้น"
      - "ผู้ประกอบการคือคนที่ตัดสินใจและรับความเสี่ยง"
    solution: "ที่นาและน้ำฝน → ที่ดิน · คนดำนา → แรงงาน · รถไถและเครื่องสูบน้ำ → ทุน · คนวางแผน → ผู้ประกอบการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.production-factors.p002
    topics: [business.econ.production-factors]
    difficulty: 1
    type: mcq
    stem: "ผลตอบแทนของ **แรงงาน** คืออะไร"
    choices:
      - { id: a, text: "ค่าจ้าง", correct: true }
      - { id: b, text: "ค่าเช่า", feedback: "ค่าเช่าเป็นผลตอบแทนของที่ดิน" }
      - { id: c, text: "ดอกเบี้ย", feedback: "ดอกเบี้ยเป็นผลตอบแทนของทุน" }
      - { id: d, text: "กำไร", feedback: "กำไรเป็นผลตอบแทนของผู้ประกอบการ" }
    hints:
      - "คนที่ทำงานให้ผู้อื่นได้รับเงินแบบใด"
      - "ลูกจ้างในร้านได้รับเงินนี้ทุกวันหรือทุกเดือน"
    solution: "แรงงานได้รับค่าจ้างหรือเงินเดือน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.production-factors.p003
    topics: [business.econ.production-factors]
    difficulty: 2
    type: match
    stem: "จับคู่ปัจจัยการผลิตกับผลตอบแทน"
    pairs:
      - { left: "ที่ดิน", right: "ค่าเช่า" }
      - { left: "แรงงาน", right: "ค่าจ้าง" }
      - { left: "ทุน", right: "ดอกเบี้ย" }
      - { left: "ผู้ประกอบการ", right: "กำไร" }
    hints:
      - "เจ้าของที่ดินให้คนอื่นใช้ที่ดินแล้วได้อะไร"
      - "ผู้ประกอบการได้ส่วนที่เหลือหลังจ่ายทุกอย่าง"
    solution: "ที่ดิน → ค่าเช่า · แรงงาน → ค่าจ้าง · ทุน → ดอกเบี้ย · ผู้ประกอบการ → กำไร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.production-factors.p004
    topics: [business.econ.production-factors]
    difficulty: 2
    type: mcq
    stem: "ร้านตัดเสื้อมีสิ่งต่อไปนี้ ข้อใดเป็น **ทุน** ในความหมายของปัจจัยการผลิต"
    choices:
      - { id: a, text: "จักรเย็บผ้า", correct: true }
      - { id: b, text: "เงินสดในลิ้นชัก", feedback: "เงินเป็นเพียงสิ่งที่ใช้ซื้อทุน ทุนในการผลิตคือเครื่องมือและเครื่องจักร" }
      - { id: c, text: "ช่างตัดเสื้อ", feedback: "ช่างตัดเสื้อเป็นแรงงาน" }
      - { id: d, text: "ฝ้ายที่ปลูกในไร่", feedback: "ฝ้ายมาจากธรรมชาติ จัดอยู่ในกลุ่มที่ดิน (ทรัพยากรธรรมชาติ)" }
    hints:
      - "ทุนคือสิ่งที่คนสร้างขึ้นเพื่อใช้ผลิตต่อ"
      - "ระวังสับสนกับเงิน"
    solution: "จักรเย็บผ้าเป็นเครื่องมือที่คนสร้างขึ้นเพื่อใช้ผลิต จึงเป็นทุน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.production-factors.p005
    topics: [business.econ.production-factors]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "การกระทำใดแสดงถึง **ผู้ผลิตที่มีความรับผิดชอบ** (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "ร้านน้ำพริกติดฉลากบอกส่วนประกอบและวันหมดอายุ", correct: true }
      - { id: b, text: "โรงงานบำบัดน้ำเสียก่อนปล่อยลงแม่น้ำ", correct: true }
      - { id: c, text: "ฟาร์มให้คนงานใส่อุปกรณ์ป้องกันเวลาพ่นยา", correct: true }
      - { id: d, text: "ร้านกักตุนหน้ากากอนามัยไว้รอขายแพงตอนขาดตลาด", feedback: "การกักตุนเพื่อขึ้นราคาเอาเปรียบผู้บริโภค" }
      - { id: e, text: "ใส่สีย้อมผ้าในขนมให้สีสวย", feedback: "สีย้อมผ้าไม่ใช่สีผสมอาหาร เป็นอันตรายต่อผู้บริโภค" }
    hints:
      - "ผู้ผลิตที่รับผิดชอบคิดถึงผู้บริโภค แรงงาน และสิ่งแวดล้อม"
      - "หาข้อที่ทำร้ายหรือเอาเปรียบผู้อื่น แล้วตัดทิ้ง"
    solution: "ฉลากถูกต้อง บำบัดน้ำเสีย และดูแลความปลอดภัยของคนงาน แสดงความรับผิดชอบ ส่วนการกักตุนและใช้สีย้อมผ้าในอาหารเป็นการเอาเปรียบและเป็นอันตราย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.production-factors.p006
    topics: [business.econ.production-factors]
    difficulty: 2
    type: numeric
    stem: "กลุ่มทอผ้าไหมในจังหวัดสุรินทร์มีคนทอ $5$ คน ทอผ้าได้สัปดาห์ละ $15$ ผืน ผลผลิตต่อคนเป็นกี่ผืนต่อสัปดาห์ (ตอบเป็นผืน)"
    answer: { value: 3, unit: ผืน }
    hints:
      - "ผลผลิตต่อคน $=$ ผลผลิตทั้งหมด $\\div$ จำนวนคน"
      - "หาร 15 ด้วย 5"
    misconceptions:
      - { match: 75, feedback: "คูณกัน แต่ต้องหารผลผลิตด้วยจำนวนคน" }
      - { match: 0.33, feedback: "หารกลับด้าน ต้องเอาผลผลิตเป็นตัวตั้ง" }
    solution: "$15 \\div 5 = 3$ ผืนต่อคนต่อสัปดาห์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.production-factors.p007
    topics: [business.econ.production-factors]
    difficulty: 3
    type: numeric
    stem: "จากตาราง ผลผลิตต่อคนงานหลังซื้อเครื่องปิดฝา เพิ่มขึ้นกี่เปอร์เซ็นต์จากก่อนซื้อ (ตอบเป็นเปอร์เซ็นต์)"
    figure: { src: chili-output.svg, alt: "ตารางของกลุ่มแม่บ้านทำน้ำพริกตาแดง ก่อนซื้อเครื่องปิดฝามีคนงาน 3 คน ผลิตน้ำพริกได้วันละ 120 กระปุก หลังซื้อเครื่องปิดฝามีคนงาน 4 คน ผลิตได้วันละ 200 กระปุก" }
    answer: { value: 25, unit: "%" }
    hints:
      - "หาผลผลิตต่อคนก่อนและหลัง"
      - "ร้อยละที่เพิ่ม $= \\dfrac{\\text{หลัง} - \\text{ก่อน}}{\\text{ก่อน}} \\times 100$"
    misconceptions:
      - { match: 66.67, feedback: "นั่นคือร้อยละที่ผลผลิตรวมเพิ่ม แต่จำนวนคนงานก็เพิ่มด้วย ต้องเทียบผลผลิตต่อคน" }
      - { match: 10, feedback: "นั่นคือจำนวนกระปุกต่อคนที่เพิ่ม ต้องหารด้วยค่าก่อนซื้อแล้วคูณ 100" }
    solution: "ก่อน $120 \\div 3 = 40$ กระปุกต่อคน หลัง $200 \\div 4 = 50$ กระปุกต่อคน เพิ่มขึ้น $\\dfrac{50 - 40}{40} \\times 100 = 25\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.production-factors.p008
    topics: [business.econ.production-factors]
    difficulty: 3
    type: mcq
    stem: "ปีนี้ราคาปุ๋ยแพงขึ้นมาก แต่ราคาข้าวโพดที่ขายได้เท่าเดิม เกษตรกรส่วนใหญ่น่าจะทำอย่างไร และเป็นเพราะปัจจัยใด"
    choices:
      - { id: a, text: "ใช้ปุ๋ยน้อยลงหรือปลูกน้อยลง เพราะราคาปัจจัยการผลิตสูงขึ้นทำให้ต้นทุนสูงขึ้น", correct: true }
      - { id: b, text: "ปลูกมากขึ้น เพราะราคาสินค้าสูงขึ้น", feedback: "ราคาข้าวโพดเท่าเดิม ไม่ได้สูงขึ้น" }
      - { id: c, text: "ไม่เปลี่ยนแปลง เพราะปุ๋ยไม่เกี่ยวกับการผลิต", feedback: "ปุ๋ยเป็นวัตถุดิบสำคัญ ราคาปุ๋ยจึงมีผลต่อต้นทุน" }
      - { id: d, text: "ปลูกมากขึ้น เพราะเทคโนโลยีดีขึ้น", feedback: "โจทย์ไม่ได้กล่าวถึงเทคโนโลยีใหม่" }
    hints:
      - "ปุ๋ยเป็นปัจจัยการผลิตหรือเป็นสินค้าที่ขาย"
      - "ต้นทุนสูงขึ้นแต่ขายได้เท่าเดิม กำไรเป็นอย่างไร"
    solution: "ราคาปัจจัยการผลิต (ปุ๋ย) สูงขึ้น ต้นทุนจึงสูงขึ้นขณะที่ราคาขายเท่าเดิม กำไรลดลง เกษตรกรจึงมักลดการใช้ปุ๋ยหรือลดพื้นที่ปลูก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.production-factors.p009
    topics: [business.econ.production-factors]
    difficulty: 3
    type: match
    stem: "จับคู่เหตุการณ์กับปัจจัยที่มีอิทธิพลต่อการผลิต"
    pairs:
      - { left: "ฟาร์มเห็ดติดระบบพ่นหมอกอัตโนมัติ เก็บเห็ดได้มากขึ้น", right: "เทคโนโลยี" }
      - { left: "น้ำท่วมสวนผลไม้ ผลผลิตเสียหาย", right: "ดินฟ้าอากาศและภัยธรรมชาติ" }
      - { left: "รัฐอุดหนุนเงินให้ผู้ปลูกพืชบางชนิด", right: "นโยบายของรัฐ" }
      - { left: "คนหันมานิยมกาแฟสด ร้านกาแฟเปิดเพิ่ม", right: "ความต้องการของผู้บริโภค" }
    hints:
      - "ดูว่าการเปลี่ยนแปลงมาจากเครื่องมือ ธรรมชาติ รัฐ หรือผู้ซื้อ"
      - "การอุดหนุนเป็นการกระทำของรัฐ"
    solution: "ระบบพ่นหมอก → เทคโนโลยี · น้ำท่วม → ดินฟ้าอากาศ · เงินอุดหนุน → นโยบายรัฐ · ความนิยมกาแฟ → ความต้องการของผู้บริโภค"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.production-factors.p010
    topics: [business.econ.production-factors]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นวิธี **ใช้ทรัพยากรอย่างยั่งยืน** ในการผลิต (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "ร้านกาแฟลดราคาให้ลูกค้าที่นำแก้วมาเอง", correct: true }
      - { id: b, text: "โรงงานติดแผงโซลาร์เซลล์บนหลังคา", correct: true }
      - { id: c, text: "เกษตรกรนำเศษฟางมาทำปุ๋ยหมักแทนการเผา", correct: true }
      - { id: d, text: "ตัดป่าต้นน้ำเพื่อขยายไร่โดยไม่ปลูกทดแทน", feedback: "ป่าต้นน้ำถูกทำลายและไม่มีการทดแทน ทรัพยากรจะหมดไป" }
      - { id: e, text: "จับปลาด้วยอวนตาถี่ที่ติดลูกปลาด้วย", feedback: "ลูกปลาถูกจับก่อนโต ปีต่อไปจะมีปลาน้อยลง" }
    hints:
      - "ยั่งยืนคือใช้วันนี้แล้วยังมีเหลือให้คนรุ่นหลัง"
      - "นึกถึง ลด ใช้ซ้ำ นำกลับมาใช้ใหม่ ปลูกทดแทน พลังงานหมุนเวียน"
    solution: "ลดแก้วใช้ครั้งเดียว ใช้พลังงานแสงอาทิตย์ และนำฟางกลับมาใช้ เป็นการใช้ทรัพยากรอย่างยั่งยืน ส่วนตัดป่าไม่ปลูกทดแทนและจับลูกปลาทำให้ทรัพยากรหมดไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.production-factors.p011
    topics: [business.econ.production-factors]
    difficulty: 3
    type: order
    stem: "เรียงสิ่งที่ผู้ประกอบการทำเมื่อเริ่มผลิตสินค้าใหม่"
    items:
      - "สำรวจว่าผู้บริโภคต้องการสินค้าอะไร"
      - "รวบรวมปัจจัยการผลิต: ที่ แรงงาน วัตถุดิบ และเครื่องมือ"
      - "ผลิตสินค้า"
      - "ตรวจคุณภาพและติดฉลากให้ถูกต้อง"
      - "นำออกจำหน่ายและฟังความเห็นของลูกค้า"
    hints:
      - "ต้องรู้ก่อนว่าจะผลิตอะไร จึงจะรวบรวมปัจจัยได้ถูก"
      - "ตรวจคุณภาพก่อนส่งถึงมือผู้บริโภค"
    solution: "สำรวจความต้องการ → รวบรวมปัจจัย → ผลิต → ตรวจคุณภาพและฉลาก → จำหน่ายและรับฟังความเห็น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.production-factors.p012
    topics: [business.econ.production-factors]
    difficulty: 4
    type: numeric
    stem: "ร้านเบเกอรี่ (สมมติ) เดือนนี้ขายได้ $32{,}000$ บาท จ่ายค่าเช่าร้าน $5{,}000$ บาท ค่าจ้างพนักงาน $12{,}000$ บาท ดอกเบี้ยเงินกู้ $1{,}000$ บาท และค่าวัตถุดิบ $9{,}000$ บาท ผู้ประกอบการได้รับผลตอบแทนกี่บาท (ตอบเป็นบาท)"
    answer: { value: 5000, unit: บาท }
    hints:
      - "ผลตอบแทนของผู้ประกอบการคือกำไร"
      - "กำไร $=$ รายได้ $-$ ค่าเช่า $-$ ค่าจ้าง $-$ ดอกเบี้ย $-$ ค่าวัตถุดิบ"
    misconceptions:
      - { match: 14000, feedback: "ลืมหักค่าวัตถุดิบ ซึ่งเป็นต้นทุนที่ต้องจ่ายเช่นกัน" }
      - { match: 27000, feedback: "นั่นคือรายจ่ายรวม ต้องนำไปลบจากรายได้" }
    solution: "รายจ่ายรวม $= 5{,}000 + 12{,}000 + 1{,}000 + 9{,}000 = 27{,}000$ บาท กำไร $= 32{,}000 - 27{,}000 = 5{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.econ.production-factors.p013
    topics: [business.econ.production-factors]
    difficulty: 4
    type: mcq
    stem: "โรงงานลูกชิ้นแห่งหนึ่ง (สมมติ) ใส่สารกันบูดเกินปริมาณที่กฎหมายกำหนด เพื่อให้เก็บได้นานและลดต้นทุน ข้อใดอธิบายผลได้ครบที่สุด"
    choices:
      - { id: a, text: "ผู้บริโภคเสี่ยงต่อสุขภาพ โรงงานอาจถูกลงโทษและเสียชื่อเสียง พนักงานอาจตกงาน จึงไม่ใช่ผู้ผลิตที่มีความรับผิดชอบ", correct: true }
      - { id: b, text: "เป็นการลดต้นทุนที่ฉลาด เพราะโรงงานมีกำไรมากขึ้น", feedback: "กำไรระยะสั้นแลกกับความปลอดภัยของผู้บริโภค ผิดทั้งกฎหมายและจริยธรรม" }
      - { id: c, text: "มีผลต่อผู้บริโภคเท่านั้น โรงงานไม่ได้รับผลใด", feedback: "เมื่อถูกตรวจพบ โรงงานถูกลงโทษและเสียลูกค้า ซึ่งกระทบเจ้าของและพนักงาน" }
      - { id: d, text: "ไม่มีผลเสีย ถ้าติดฉลากว่ามีสารกันบูด", feedback: "ฉลากไม่ได้ทำให้ปริมาณที่เกินกฎหมายปลอดภัยขึ้น" }
    hints:
      - "คิดถึงผู้บริโภค โรงงาน และพนักงาน"
      - "ผู้ผลิตที่รับผิดชอบต้องผลิตสินค้าที่ปลอดภัยและถูกกฎหมาย"
    solution: "การใส่สารเกินกำหนดทำร้ายผู้บริโภค ผิดกฎหมาย และทำให้โรงงานเสี่ยงถูกลงโทษและเสียชื่อเสียง ซึ่งย้อนกลับมากระทบเจ้าของและพนักงาน"
