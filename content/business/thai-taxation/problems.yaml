  solution: เงินได้สุทธิ $531{,}000 \to 551{,}000$ ยังอยู่ในขั้น $500{,}001$–$750{,}000$ ($15\%$) ภาษีเพิ่ม $20{,}000 \times 15\% = 3{,}000$ บาท ค่าลดหย่อน $20{,}000$ บาทจึงประหยัดภาษีเพียง $3{,}000$ บาท ไม่ใช่ $20{,}000$ บาท
