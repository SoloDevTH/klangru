<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="sans-serif" font-size="14">
  <title>วงจรข้อมูลส่วนบุคคลตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 หน้าที่ของผู้ควบคุมข้อมูลในแต่ละขั้น และสิทธิของเจ้าของข้อมูล</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>
  <rect x="30.0" y="30.0" width="190.0" height="130.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="125.0" y="73.9" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">1 ก่อนเก็บ</text>
  <text x="125.0" y="97.5" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">แจ้งวัตถุประสงค์</text>
  <text x="125.0" y="115.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">ขอความยินยอมชัดแจ้ง</text>
  <text x="125.0" y="132.6" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">(ม.19, 23)</text>
  <line x1="222.0" y1="95.0" x2="238.0" y2="95.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="240.0" y="30.0" width="190.0" height="130.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="335.0" y="73.9" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">2 เก็บ</text>
  <text x="335.0" y="97.5" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">เก็บเท่าที่จำเป็น</text>
  <text x="335.0" y="115.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">ข้อมูลอ่อนไหวเข้มกว่า</text>
  <text x="335.0" y="132.6" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">(ม.22, 26)</text>
  <line x1="432.0" y1="95.0" x2="448.0" y2="95.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="450.0" y="30.0" width="190.0" height="130.0" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="545.0" y="73.9" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">3 ใช้และเปิดเผย</text>
  <text x="545.0" y="97.5" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">ใช้ตามวัตถุประสงค์ที่แจ้ง</text>
  <text x="545.0" y="115.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">รักษาความปลอดภัย</text>
  <text x="545.0" y="132.6" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">(ม.21, 27, 37)</text>
  <line x1="642.0" y1="95.0" x2="658.0" y2="95.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="660.0" y="30.0" width="190.0" height="130.0" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="755.0" y="73.9" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">4 ลบหรือทำลาย</text>
  <text x="755.0" y="97.5" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">เมื่อพ้นความจำเป็น</text>
  <text x="755.0" y="115.0" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">หรือเจ้าของถอนความยินยอม</text>
  <text x="755.0" y="132.6" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">(ม.33, 37)</text>
  <text x="440.0" y="196.0" font-size="13" text-anchor="middle" fill="#6b7280" xml:space="preserve">ผู้ควบคุมข้อมูล (เช่น โรงเรียน ร้านค้า แอป) มีหน้าที่ข้างบน และต้องแจ้งเหตุข้อมูลรั่วภายใน 72 ชั่วโมงนับแต่ทราบเหตุ</text>
  <rect x="60.0" y="220.0" width="760.0" height="180.0" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="440.0" y="250.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">สิทธิของเจ้าของข้อมูล (ตัวเรา)</text>
  <rect x="80.0" y="270.0" width="230.0" height="46.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="195.0" y="291.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ขอเข้าถึงและขอสำเนา</text>
  <text x="195.0" y="309.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">ม.30</text>
  <rect x="325.0" y="270.0" width="230.0" height="46.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="440.0" y="291.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ขอรับข้อมูลไปใช้ที่อื่น</text>
  <text x="440.0" y="309.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">ม.31</text>
  <rect x="570.0" y="270.0" width="230.0" height="46.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="685.0" y="291.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">คัดค้านการเก็บหรือใช้</text>
  <text x="685.0" y="309.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">ม.32</text>
  <rect x="80.0" y="330.0" width="230.0" height="46.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="195.0" y="351.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ขอให้ลบหรือทำให้ระบุตัวไม่ได้</text>
  <text x="195.0" y="369.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">ม.33</text>
  <rect x="325.0" y="330.0" width="230.0" height="46.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="440.0" y="351.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ขอให้ระงับการใช้</text>
  <text x="440.0" y="369.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">ม.34</text>
  <rect x="570.0" y="330.0" width="230.0" height="46.0" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="685.0" y="351.0" font-size="14" text-anchor="middle" fill="#1f2937" xml:space="preserve">ถอนความยินยอมเมื่อใดก็ได้</text>
  <text x="685.0" y="369.0" font-size="12" text-anchor="middle" fill="#6b7280" xml:space="preserve">ม.19</text>
</svg>
