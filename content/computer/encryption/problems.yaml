problems:
  - id: computer.security.encryption.p001
    topics: [computer.security.encryption]
    difficulty: 1
    type: mcq
    stem: "จุดประสงค์หลักของการเข้ารหัสข้อความก่อนส่งผ่านอินเทอร์เน็ตคืออะไร"
    choices:
      - { id: a, text: "ให้คนกลางที่ดักข้อมูลได้อ่านเนื้อหาไม่ออก เหลือแต่ผู้รับที่มีกุญแจอ่านได้", correct: true }
      - { id: b, text: "ทำให้ไฟล์มีขนาดเล็กลงและส่งได้เร็วขึ้น", feedback: "นั่นคือการบีบอัดข้อมูล การเข้ารหัสไม่ได้ทำให้ไฟล์เล็กลง" }
      - { id: c, text: "ทำให้ข้อความไปถึงผู้รับแน่นอนแม้เครือข่ายล่ม", feedback: "การเข้ารหัสปกป้องความลับ ไม่ได้ทำให้เครือข่ายพร้อมใช้มากขึ้น" }
      - { id: d, text: "แปลข้อความเป็นภาษาอังกฤษ", feedback: "การเข้ารหัสแปลงข้อความให้อ่านไม่ออก ไม่ใช่การแปลภาษา" }
    hints:
      - "นึกถึงโน้ตลับที่ต้องผ่านมือเพื่อนหลายคน"
      - "เป้าหมายข้อใดใน CIA ที่การเข้ารหัสช่วยโดยตรง"
    solution: "การเข้ารหัสรักษาความลับ ข้อมูลที่ผ่านเราเตอร์และสายของคนอื่นถูกดักได้ แต่ถ้าเข้ารหัสไว้ คนที่ไม่มีกุญแจจะอ่านไม่ออก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.encryption.p002
    topics: [computer.security.encryption]
    difficulty: 1
    type: match
    stem: "ปุ้ยเข้ารหัส MEET AT NOON ด้วยรหัสซีซาร์ เลื่อน 3 ตำแหน่ง ได้ PHHW DW QRRQ จับคู่คำศัพท์กับสิ่งที่เกี่ยวข้อง"
    pairs:
      - { left: "ข้อความต้นฉบับ", right: "MEET AT NOON" }
      - { left: "ข้อความเข้ารหัส", right: "PHHW DW QRRQ" }
      - { left: "กุญแจ", right: "3" }
      - { left: "อัลกอริทึม", right: "เลื่อนตัวอักษรไปข้างหน้าตามกุญแจ" }
    hints:
      - "ข้อความต้นฉบับคือข้อความที่อ่านรู้เรื่อง"
      - "กุญแจคือค่าลับ ส่วนอัลกอริทึมคือวิธี"
    solution: "MEET AT NOON = ข้อความต้นฉบับ PHHW DW QRRQ = ข้อความเข้ารหัส 3 = กุญแจ การเลื่อนตัวอักษร = อัลกอริทึม ถ้าใช้อัลกอริทึมเดิมแต่เปลี่ยนกุญแจ จะได้ข้อความเข้ารหัสคนละแบบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.encryption.p003
    topics: [computer.security.encryption]
    difficulty: 2
    type: text
    stem: "เข้ารหัสคำว่า CAT ด้วยรหัสซีซาร์ กุญแจ k = 3 (เลื่อนไปข้างหน้า 3 ตำแหน่ง) ได้คำว่าอะไร"
    accepted: ["FDW"]
    misconceptions:
      - { match: "ZXQ", feedback: "เลื่อนถอยหลัง 3 ตำแหน่ง การเข้ารหัสต้องเลื่อนไปข้างหน้า" }
      - { match: "DBU", feedback: "เลื่อนแค่ 1 ตำแหน่ง กุญแจคือ 3" }
    hints:
      - "C เลื่อนไปข้างหน้า 3 ตำแหน่งคือ D, E, F"
      - "ทำแบบเดียวกันกับ A และ T"
    solution: "C → F, A → D, T → W ได้ FDW"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.encryption.p004
    topics: [computer.security.encryption]
    difficulty: 2
    type: text
    stem: "ถอดรหัสข้อความ `WKLV LV VHFUHW` ซึ่งเข้ารหัสด้วยรหัสซีซาร์ กุญแจ k = 3 (ตอบเป็นตัวพิมพ์ใหญ่)"
    accepted: ["THIS IS SECRET", "THISISSECRET"]
    misconceptions:
      - { match: "ZNOY OY YKIXKZ", feedback: "เลื่อนไปข้างหน้าอีก 3 ตำแหน่ง การถอดรหัสต้องเลื่อนถอยหลัง" }
    hints:
      - "การถอดรหัสเลื่อนกลับทางกับการเข้ารหัส"
      - "W ถอยหลัง 3 ตำแหน่งคือ V, U, T"
    solution: "เลื่อนทุกตัวถอยหลัง 3 ตำแหน่ง: W → T, K → H, L → I, V → S ได้ THIS IS SECRET"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.encryption.p005
    topics: [computer.security.encryption]
    difficulty: 2
    type: numeric
    stem: "รหัสซีซาร์ที่ใช้ตัวอักษรภาษาอังกฤษ 26 ตัว มีกุญแจที่ทำให้ข้อความเปลี่ยนไปจริงกี่ค่า (ไม่นับการเลื่อน 0 ตำแหน่ง)"
    answer: { value: 25, unit: ค่า }
    hints:
      - "เลื่อน 26 ตำแหน่งได้ตัวอักษรเดิมเหมือนเลื่อน 0"
      - "นับกุญแจ 1, 2, ... ไปจนถึงค่าก่อน 26"
    misconceptions:
      - { match: 26, feedback: "การเลื่อน 0 หรือ 26 ตำแหน่งได้ข้อความเดิม จึงไม่นับ" }
    solution: "กุญแจที่ใช้ได้คือ 1 ถึง 25 รวม 25 ค่า น้อยมากจนลองทุกค่าได้ในไม่กี่วินาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.encryption.p006
    topics: [computer.security.encryption]
    difficulty: 3
    type: numeric
    stem: "ดักได้ข้อความภาษาอังกฤษยาว 103 ตัวอักษรที่เข้ารหัสด้วยรหัสซีซาร์ แผนภูมิในภาพแสดงจำนวนครั้งที่ตัวอักษรแต่ละตัวปรากฏ ถ้าสมมติว่าตัวที่พบบ่อยที่สุดในข้อความเข้ารหัสแทนตัว E (ตัวที่พบบ่อยที่สุดในภาษาอังกฤษ) กุญแจ k ของการเข้ารหัส (เลื่อนไปข้างหน้า) คือเท่าใด"
    figure:
      src: frequency.svg
      alt: "แผนภูมิแท่งความถี่ของตัวอักษรในข้อความเข้ารหัส 103 ตัว A 15 ครั้ง C 1 D 1 H 6 I 2 J 1 K 3 L 32 M 1 N 2 O 7 P 1 R 1 S 2 T 2 U 6 V 3 W 2 Y 8 Z 7 ตัวที่เหลือ B E F G Q X ไม่ปรากฏ"
    answer: { value: 7 }
    hints:
      - "หาตัวที่แท่งสูงที่สุดก่อน"
      - "นับว่าจาก E ต้องเลื่อนไปข้างหน้ากี่ตำแหน่งจึงถึงตัวนั้น"
    misconceptions:
      - { match: 19, feedback: "นับจากตัวนั้นถอยกลับไปหา E หรือนับเลื่อนวนอีกทาง 19 คือกุญแจสำหรับถอดรหัสแบบเลื่อนไปข้างหน้า (26 − 7) ไม่ใช่กุญแจที่ใช้เข้ารหัส" }
      - { match: 11, feedback: "11 คือลำดับของ L เมื่อนับ A = 0 ต้องนับระยะจาก E ซึ่งมีลำดับ 4" }
    solution: "ตัวที่พบบ่อยที่สุดคือ L (32 ครั้ง) จาก E เลื่อนไปข้างหน้า F G H I J K L = 7 ตำแหน่ง จึงเดาว่า k = 7 ถอดรหัสโดยเลื่อนถอยหลัง 7 ได้ข้อความ MEET THE TEAM AT THE GREEN GATE ... อ่านรู้เรื่อง ยืนยันว่าถูก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.encryption.p007
    topics: [computer.security.encryption]
    difficulty: 3
    type: text
    stem: "เข้ารหัสบิต `1010` ด้วยการ XOR กับกุญแจ `0110` (XOR ให้ 1 เมื่อสองบิตต่างกัน) ได้ผลเป็นบิตใด (ตอบเป็นเลขฐานสอง 4 หลัก)"
    accepted: ["1100"]
    misconceptions:
      - { match: "0010", feedback: "นี่คือผลของ AND (1 เมื่อเป็น 1 ทั้งคู่) XOR ให้ 1 เมื่อบิตต่างกัน" }
      - { match: "1110", feedback: "นี่คือผลของ OR XOR ให้ 0 เมื่อบิตเหมือนกัน แม้จะเป็น 1 ทั้งคู่" }
    hints:
      - "เทียบทีละหลักจากซ้ายไปขวา"
      - "1 กับ 0 ต่างกันได้ 1, 0 กับ 1 ต่างกันได้ 1, 1 กับ 1 เหมือนกันได้ 0"
    solution: "1⊕0 = 1, 0⊕1 = 1, 1⊕1 = 0, 0⊕0 = 0 ได้ 1100 ถ้า XOR 1100 กับกุญแจ 0110 อีกครั้ง จะได้ 1010 คืน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.encryption.p008
    topics: [computer.security.encryption]
    difficulty: 3
    type: mcq
    stem: "รหัสแบบแทนที่ที่จับคู่ตัวอักษรแบบสุ่มมีกุญแจถึง $26! \\approx 4 \\times 10^{26}$ แบบ ซึ่งลองทุกแบบไม่ไหว แต่ทำไมยังถือว่าไม่ปลอดภัย"
    choices:
      - { id: a, text: "ตัวอักษรเดิมถูกแทนด้วยตัวเดิมทุกครั้ง ความถี่ของภาษาจึงยังอยู่ ถอดได้ด้วยการนับความถี่โดยไม่ต้องลองทุกกุญแจ", correct: true }
      - { id: b, text: "เพราะคอมพิวเตอร์ลอง 4 × 10²⁶ แบบได้ในไม่กี่วินาที", feedback: "แม้ลองได้ล้านล้านแบบต่อวินาที ก็ยังต้องใช้เวลาราวสิบล้านปี จุดอ่อนจริงอยู่ที่ความถี่" }
      - { id: c, text: "เพราะใช้ได้แค่ภาษาอังกฤษ", feedback: "ใช้กับภาษาใดก็ได้ และทุกภาษามีตัวอักษรที่ใช้บ่อย จึงแพ้การนับความถี่เหมือนกัน" }
      - { id: d, text: "เพราะไม่มีกุญแจ", feedback: "ตารางจับคู่ตัวอักษรนั่นเองคือกุญแจ" }
    hints:
      - "ปริภูมิกุญแจใหญ่ไม่พอ ถ้ามีทางลัดที่ไม่ต้องลองทุกกุญแจ"
      - "ตัว E ในข้อความต้นฉบับกลายเป็นตัวอะไรทุกครั้งหรือไม่"
    solution: "ปริภูมิกุญแจใหญ่กันการลองทุกค่าได้ แต่รูปแบบความถี่ของภาษายังเหลืออยู่ในข้อความเข้ารหัส ตัวที่พบบ่อยที่สุดจึงชี้ไปที่ E และคำสั้นอย่าง THE ช่วยไขตัวอื่นต่อ ระบบปัจจุบันจึงออกแบบให้ข้อความเข้ารหัสไม่เหลือรูปแบบเช่นนี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.encryption.p009
    topics: [computer.security.encryption]
    difficulty: 3
    type: match
    stem: "ปุ้ยและต้นข้าวต่างมีคู่กุญแจของตัวเอง จับคู่งานกับกุญแจที่ใช้"
    pairs:
      - { left: "ปุ้ยเข้ารหัสข้อความลับถึงต้นข้าว", right: "กุญแจสาธารณะของต้นข้าว" }
      - { left: "ต้นข้าวถอดรหัสข้อความนั้น", right: "กุญแจส่วนตัวของต้นข้าว" }
      - { left: "ปุ้ยลงลายมือชื่อดิจิทัลในประกาศของชมรม", right: "กุญแจส่วนตัวของปุ้ย" }
      - { left: "สมาชิกตรวจว่าประกาศมาจากปุ้ยจริง", right: "กุญแจสาธารณะของปุ้ย" }
    hints:
      - "ใครก็เข้ารหัสถึงเจ้าของได้ แต่มีแค่เจ้าของที่ถอดได้"
      - "ลายมือชื่อต้องสร้างโดยเจ้าของคนเดียว แต่ใครก็ตรวจได้"
    solution: "เข้ารหัสถึงใครใช้กุญแจสาธารณะของคนนั้น และเขาถอดด้วยกุญแจส่วนตัว ส่วนลายมือชื่อกลับทาง เจ้าของลงชื่อด้วยกุญแจส่วนตัว ทุกคนตรวจด้วยกุญแจสาธารณะของเจ้าของ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.encryption.p010
    topics: [computer.security.encryption]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อความถูกเข้ารหัสด้วยรหัสซีซาร์ กุญแจ k = 5 วิธีใดถอดรหัสได้ถูกต้อง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เลื่อนทุกตัวถอยหลัง 5 ตำแหน่ง", correct: true }
      - { id: b, text: "เลื่อนทุกตัวไปข้างหน้า 21 ตำแหน่ง", correct: true }
      - { id: c, text: "เลื่อนทุกตัวไปข้างหน้า 5 ตำแหน่ง", feedback: "เท่ากับเข้ารหัสซ้ำอีกรอบ ได้การเลื่อนรวม 10 ตำแหน่ง" }
      - { id: d, text: "เลื่อนทุกตัวถอยหลัง 21 ตำแหน่ง", feedback: "ถอยหลัง 21 เท่ากับไปข้างหน้า 5 จึงเป็นการเข้ารหัสซ้ำ ไม่ใช่การถอด" }
    hints:
      - "ตัวอักษรวนเป็นวงกลม 26 ตำแหน่ง"
      - "ถอยหลัง 5 เท่ากับไปข้างหน้ากี่ตำแหน่ง"
    solution: "ถอดรหัสคือถอยหลัง 5 ตำแหน่ง และเพราะตัวอักษรวนครบรอบที่ 26 การไปข้างหน้า 26 − 5 = 21 ตำแหน่งจึงให้ผลเดียวกัน (5 + 21 = 26 ครบรอบพอดี)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.encryption.p011
    topics: [computer.security.encryption]
    difficulty: 4
    type: numeric
    stem: "กุญแจยาว 56 บิตมีปริภูมิกุญแจมากกว่ากุญแจยาว 40 บิตกี่เท่า"
    answer: { value: 65536, unit: เท่า }
    hints:
      - "กุญแจ n บิตมี $2^n$ ค่า"
      - "หาร $2^{56}$ ด้วย $2^{40}$ แล้วใช้กฎเลขยกกำลัง"
    misconceptions:
      - { match: 16, feedback: "16 คือจำนวนบิตที่เพิ่ม แต่ทุกบิตที่เพิ่มทำให้จำนวนกุญแจเพิ่มเป็นสองเท่า จึงเป็น 2 ยกกำลัง 16" }
      - { match: 1.4, feedback: "56 ÷ 40 = 1.4 เทียบความยาวตรง ๆ แต่จำนวนกุญแจเพิ่มแบบเลขยกกำลัง" }
    solution: "$2^{56} ÷ 2^{40} = 2^{16} = 65{,}536$ เท่า เพิ่มความยาวกุญแจเพียง 16 บิต ปริภูมิกุญแจโตขึ้นหลายหมื่นเท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.encryption.p012
    topics: [computer.security.encryption]
    difficulty: 4
    type: numeric
    stem: "สมมติคอมพิวเตอร์ลองกุญแจได้ $10^{12}$ ค่าต่อวินาที การลองกุญแจ 56 บิตให้ครบทุกค่า ($2^{56}$ ค่า) ใช้เวลาประมาณกี่ชั่วโมง (ตอบทศนิยม 1 ตำแหน่ง) ผลนี้อธิบายว่าทำไมระบบปัจจุบันจึงใช้กุญแจ 128 บิตขึ้นไป"
    answer: { value: 20.0, tolerance: 0.2, unit: ชั่วโมง }
    hints:
      - "$2^{56} \\approx 7.2 \\times 10^{16}$"
      - "หารด้วย $10^{12}$ ได้เป็นวินาที แล้วหารด้วย 3,600"
    misconceptions:
      - { match: 72057.6, feedback: "นี่คือจำนวนวินาที โจทย์ถามเป็นชั่วโมง ต้องหาร 3,600" }
      - { match: 1200.96, feedback: "หารด้วย 60 ครั้งเดียวได้เป็นนาที ต้องหาร 60 อีกครั้งเพื่อเป็นชั่วโมง" }
    solution: "$2^{56} ≈ 7.2058 \\times 10^{16}$ ÷ $10^{12}$ ≈ 72,058 วินาที ÷ 3,600 ≈ 20.0 ชั่วโมง กุญแจ 56 บิตจึงไม่ปลอดภัยแล้ว ส่วนกุญแจ 128 บิตที่อัตราเดียวกันต้องใช้ราว $10^{19}$ ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.encryption.p013
    topics: [computer.security.encryption]
    difficulty: 4
    type: order
    stem: "เรียงขั้นตอนอย่างง่ายเมื่อเบราว์เซอร์เปิดเว็บ HTTPS"
    items:
      - "เบราว์เซอร์ขอเชื่อมต่อแบบปลอดภัย"
      - "เซิร์ฟเวอร์ส่งใบรับรองที่มีกุญแจสาธารณะ"
      - "เบราว์เซอร์ตรวจใบรับรองและชื่อโดเมน"
      - "ใช้กุญแจสาธารณะตกลงกุญแจรอบการใช้งาน"
      - "รับส่งข้อมูลที่เข้ารหัสแบบสมมาตรด้วยกุญแจรอบการใช้งาน"
    hints:
      - "ต้องตรวจว่าคุยกับเว็บจริงก่อนจะตกลงกุญแจ"
      - "ข้อมูลจริงส่งหลังสุด ด้วยวิธีที่เร็ว"
    solution: "ขอเชื่อมต่อ → รับใบรับรอง → ตรวจใบรับรองและโดเมน → ตกลงกุญแจรอบการใช้งานด้วยกุญแจสาธารณะ → ส่งข้อมูลด้วยกุญแจสมมาตรซึ่งเร็ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.encryption.p014
    topics: [computer.security.encryption]
    difficulty: 4
    type: mcq
    stem: "ฝนได้ลิงก์ไปเว็บ `https://bank-th.login-verify.example` เบราว์เซอร์แสดงรูปแม่กุญแจ ข้อใดสรุปได้ถูกต้อง"
    choices:
      - { id: a, text: "ข้อมูลที่ส่งถูกเข้ารหัสระหว่างฝนกับโดเมน login-verify.example แต่ไม่ได้บอกว่าเว็บนี้เป็นของธนาคาร จึงต้องตรวจชื่อโดเมนก่อนกรอกข้อมูล", correct: true }
      - { id: b, text: "เป็นเว็บของธนาคารจริง เพราะมีแม่กุญแจ", feedback: "ใครก็ขอใบรับรองให้โดเมนของตัวเองได้ เว็บฟิชชิงจึงมีแม่กุญแจได้เช่นกัน" }
      - { id: c, text: "คนกลางอ่านรหัสผ่านที่ฝนกรอกได้ เพราะเป็นลิงก์จากข้อความ", feedback: "HTTPS กันคนกลางอ่านระหว่างทางได้ ปัญหาคือข้อมูลไปถึงเจ้าของเว็บปลอมโดยตรง" }
      - { id: d, text: "แม่กุญแจแปลว่าเว็บไม่มีไวรัส", feedback: "แม่กุญแจไม่ได้ตรวจเนื้อหาของเว็บ บอกเพียงว่าการส่งข้อมูลถูกเข้ารหัส" }
    hints:
      - "แม่กุญแจรับรองอะไร และไม่ได้รับรองอะไร"
      - "โดเมนจริงของลิงก์นี้คือส่วนใด"
    solution: "ใบรับรองผูกกุญแจสาธารณะกับชื่อโดเมน แม่กุญแจจึงบอกว่าคุยกับโดเมน login-verify.example แบบเข้ารหัส ซึ่งไม่ใช่โดเมนของธนาคาร ข้อมูลที่กรอกจะถูกส่งอย่างปลอดภัยไปถึงคนร้ายโดยตรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.encryption.p015
    topics: [computer.security.encryption]
    difficulty: 5
    type: numeric
    stem: "จากตัวอย่างจำลองกุญแจสาธารณะ ต้นข้าวประกาศกุญแจสาธารณะ $(e, n) = (3, 33)$ ถ้าปุ้ยจะส่งตัวเลข $m = 5$ ข้อความเข้ารหัส $c = m^e \\bmod n$ เท่ากับเท่าใด"
    answer: { value: 26 }
    hints:
      - "คำนวณ $5^3$ ก่อน"
      - "หารผลด้วย 33 แล้วเอาเศษ"
    misconceptions:
      - { match: 125, feedback: "ลืมหารด้วย 33 เอาเศษ (mod 33)" }
      - { match: 15, feedback: "คูณ 5 × 3 แทนการยกกำลัง ต้องเป็น 5 × 5 × 5" }
    solution: "$5^3 = 125$ และ $125 = 3 \\times 33 + 26$ จึงได้ $c = 26$ ตรวจ: ต้นข้าวคำนวณ $26^7 \\bmod 33$ จะได้ 5 คืน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.encryption.p016
    topics: [computer.security.encryption]
    difficulty: 5
    type: mcq
    stem: "ร้านค้าออนไลน์ต้องการให้ (1) คนกลางอ่านเลขบัตรที่ลูกค้ากรอกไม่ได้ (2) ลูกค้ามั่นใจว่ากำลังคุยกับร้านจริง และ (3) ส่งข้อมูลจำนวนมากได้เร็ว วิธีใดตอบครบทั้งสามข้อ"
    choices:
      - { id: a, text: "ใช้ HTTPS ร้านมีใบรับรองที่หน่วยงานออกใบรับรองลงชื่อ ใช้กุญแจสาธารณะตกลงกุญแจรอบการใช้งาน แล้วเข้ารหัสข้อมูลแบบสมมาตร", correct: true }
      - { id: b, text: "เข้ารหัสทุกอย่างด้วยกุญแจสมมาตรดอกเดียว แล้วส่งกุญแจไปพร้อมข้อมูล", feedback: "คนกลางที่ดักได้ข้อมูลก็ได้กุญแจด้วย และไม่ได้พิสูจน์ว่าเป็นร้านจริง" }
      - { id: c, text: "เข้ารหัสทุกอย่างด้วยกุญแจสาธารณะอย่างเดียวโดยไม่มีใบรับรอง", feedback: "ช้ากับข้อมูลจำนวนมาก และไม่มีใบรับรองยืนยันว่ากุญแจสาธารณะเป็นของร้านจริง คนกลางอาจส่งกุญแจของตัวเองมาแทน" }
      - { id: d, text: "ใช้รหัสซีซาร์ที่ร้านคิดเองและไม่บอกใคร", feedback: "รหัสซีซาร์ลองครบทุกกุญแจได้ทันที การปิดบังวิธีไม่ได้ทำให้ปลอดภัย" }
    hints:
      - "แต่ละความต้องการแก้ด้วยเครื่องมือคนละชิ้น"
      - "ใบรับรองตอบข้อ 2 กุญแจสาธารณะแก้ปัญหาการส่งกุญแจ กุญแจสมมาตรตอบข้อ 3"
    solution: "ข้อ ก รวมทั้งสองแบบ ใบรับรองพิสูจน์ว่ากุญแจสาธารณะเป็นของร้าน (ข้อ 2) กุญแจสาธารณะใช้ตกลงกุญแจโดยคนกลางไม่รู้ และข้อมูลเข้ารหัสแบบสมมาตรซึ่งทั้งลับ (ข้อ 1) และเร็ว (ข้อ 3)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.security.encryption.p017
    topics: [computer.security.encryption]
    difficulty: 5
    type: mcq
    stem: |
      นักเรียนใช้กุญแจ XOR `0110` ชุดเดิมเข้ารหัสข้อความสองชิ้น ได้ข้อความเข้ารหัส $C_1$ = `1010` และ $C_2$ = `1111` ถ้าคนกลางดักได้ทั้งสองชิ้นแล้วนำมา XOR กัน จะเกิดอะไรขึ้น และควรสรุปอย่างไร
    choices:
      - { id: a, text: "ได้ 0101 ซึ่งเท่ากับข้อความต้นฉบับสองชิ้น XOR กัน กุญแจหักล้างกันหายไป คนกลางจึงได้ข้อมูลเกี่ยวกับข้อความโดยไม่ต้องรู้กุญแจ ต้องไม่ใช้กุญแจชุดเดิมซ้ำ", correct: true }
      - { id: b, text: "ได้ 0000 เพราะ XOR กันแล้วหักล้างทุกอย่าง จึงปลอดภัย", feedback: "1010 XOR 1111 = 0101 ไม่ใช่ 0000 และผลนี้คือข้อความต้นฉบับสองชิ้น XOR กัน ซึ่งรั่วข้อมูล" }
      - { id: c, text: "ได้กุญแจ 0110 คืนมา แต่ไม่เป็นไรเพราะกุญแจไม่ใช่ความลับ", feedback: "ผลที่ได้คือ 0101 ไม่ใช่กุญแจ แต่เป็นผล XOR ของข้อความต้นฉบับสองชิ้น และกุญแจต้องเป็นความลับเสมอ" }
      - { id: d, text: "ไม่ได้อะไรเลย เพราะ XOR ใช้ได้แค่ครั้งเดียว", feedback: "XOR คำนวณได้กับบิตชุดใดก็ได้ ปัญหาคือการใช้กุญแจซ้ำทำให้ข้อมูลรั่ว" }
    hints:
      - "คำนวณ 1010 XOR 1111 ทีละหลัก"
      - "$C_1 \\oplus C_2 = (P_1 \\oplus K) \\oplus (P_2 \\oplus K)$ กุญแจ K ที่ซ้ำกันจะเป็นอย่างไร"
    solution: "1010 ⊕ 1111 = 0101 และ $C_1 \\oplus C_2 = P_1 \\oplus P_2$ เพราะ $K \\oplus K = 0$ กุญแจหายไปจากสมการ ถ้าคนกลางเดาข้อความชิ้นหนึ่งได้ ก็ได้อีกชิ้นทันที (ในตัวอย่างนี้ข้อความต้นฉบับคือ 1100 และ 1001) one-time pad ปลอดภัยเฉพาะเมื่อใช้กุญแจครั้งเดียวจริง ๆ"
    license: CC-BY-SA-4.0
    ai_assisted: true
