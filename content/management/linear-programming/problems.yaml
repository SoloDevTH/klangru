    ai_assisted: true

  - id: management.operations.linear-programming.p017
    topics: [management.operations.linear-programming]
    difficulty: 4
    type: mcq
    stem: "นักศึกษาสร้างแบบจำลองหากำไรสูงสุด $P = 30x + 20y$ ภายใต้ $x + y \\ge 50$, $x \\ge 0$, $y \\ge 0$ แล้วพบว่าหาจุดที่ดีที่สุดไม่ได้ เหตุใด"
    choices:
      - { id: a, text: "บริเวณที่เป็นไปได้ไม่มีขอบเขต เพิ่ม x และ y ได้ไม่สิ้นสุด น่าจะลืมข้อจำกัดด้านทรัพยากร", correct: true }
      - { id: b, text: "ไม่มีบริเวณที่เป็นไปได้ เพราะข้อจำกัดขัดกัน", feedback: "มีจุดที่เป็นไปได้มากมาย เช่น (50, 0) ปัญหาคือบริเวณขยายไปไม่สิ้นสุด" }
      - { id: c, text: "คำตอบมีหลายจุดเพราะเส้นเป้าหมายขนานกับขอบ", feedback: "เส้น 30x + 20y ไม่ขนานกับ x + y = 50 และถึงขนานก็ยังหาค่าที่ดีที่สุดได้ถ้าบริเวณมีขอบเขต" }
      - { id: d, text: "ต้องมีตัวแปรมากกว่าสองตัว", feedback: "LP สองตัวแปรแก้ได้ ถ้าแบบจำลองถูกต้อง" }
    hints:
