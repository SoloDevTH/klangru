  - { framework: abet-eac, indicators: ["Criterion 3 (4)"], coverage: partial, note: "สอนความรับผิดชอบเชิงจริยธรรมและวิชาชีพ การตัดสินใจโดยมีหน้าที่ต่อสาธารณะเป็นอันดับแรก และกรอบตัดสินใจเมื่อข้อกำหนดขัดกับความปลอดภัย ผลกระทบต่อเศรษฐกิจ สิ่งแวดล้อม และสังคมสอนเพียงเป็นปัจจัยในกรอบตัดสินใจ ยังไม่ได้ลงรายละเอียดการประเมินผลกระทบ (ดู engineering.environmental.eia)" }
  - { framework: th-coe-engineering-basics, indicators: ["MET-2.10"], coverage: partial, note: "สอนจรรยาบรรณ ความรับผิดชอบ การลงนามรับรองแบบ และกรอบกฎหมายวิชาชีพ (พ.ร.บ.วิศวกร) ส่วนการจัดการความปลอดภัย อาชีวอนามัย สิ่งแวดล้อม และการพัฒนาที่ยั่งยืนอยู่ในหัวข้ออื่น" }
