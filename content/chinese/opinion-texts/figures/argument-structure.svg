<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Loma','Noto Sans Thai',sans-serif">
<title>โครงสร้างข้อโต้แย้ง</title>
<rect x="0" y="0" width="1000" height="380" fill="#fff"/>
<text x="500" y="44" font-size="28" fill="#111" text-anchor="middle" font-weight="bold">โครงสร้างข้อโต้แย้งสามส่วน</text>
<rect x="40" y="80" width="260" height="250" rx="14" fill="#fff" stroke="#1f4e9c" stroke-width="3"/>
<rect x="40" y="80" width="260" height="52" rx="14" fill="#1f4e9c" stroke="#1f4e9c" stroke-width="3"/>
<text x="170.0" y="116" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold">论点</text>
<text x="170.0" y="172" font-size="18" fill="#1f4e9c" text-anchor="middle" font-weight="bold">ความคิดหลัก</text>
<text x="170.0" y="226" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">学生应该学会控制使用时间</text>
<text x="170.0" y="292" font-size="17" fill="#444" text-anchor="middle" font-weight="normal">我认为 · 我觉得</text>
<line x1="310" y1="205.0" x2="350" y2="205.0" stroke="#555" stroke-width="3" stroke-linecap="round"/>
<rect x="360" y="80" width="260" height="250" rx="14" fill="#fff" stroke="#2a6a2a" stroke-width="3"/>
<rect x="360" y="80" width="260" height="52" rx="14" fill="#2a6a2a" stroke="#2a6a2a" stroke-width="3"/>
<text x="490.0" y="116" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold">论据</text>
<text x="490.0" y="172" font-size="18" fill="#2a6a2a" text-anchor="middle" font-weight="bold">เหตุผลและตัวอย่าง</text>
<text x="490.0" y="226" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">手机有好处，也有坏处</text>
<text x="490.0" y="292" font-size="17" fill="#444" text-anchor="middle" font-weight="normal">一方面 · 另一方面 · 比如</text>
<line x1="630" y1="205.0" x2="670" y2="205.0" stroke="#555" stroke-width="3" stroke-linecap="round"/>
<rect x="680" y="80" width="260" height="250" rx="14" fill="#fff" stroke="#b3261e" stroke-width="3"/>
<rect x="680" y="80" width="260" height="52" rx="14" fill="#b3261e" stroke="#b3261e" stroke-width="3"/>
<text x="810.0" y="116" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold">结论</text>
<text x="810.0" y="172" font-size="18" fill="#b3261e" text-anchor="middle" font-weight="bold">ข้อสรุป</text>
<text x="810.0" y="226" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">关键是怎么用手机</text>
<text x="810.0" y="292" font-size="17" fill="#444" text-anchor="middle" font-weight="normal">总之 · 由此可见</text>
<text x="500" y="362" font-size="18" fill="#444" text-anchor="middle" font-weight="normal">ตัวอย่างจากข้อความเรื่องโทรศัพท์ในบทนี้</text>
</svg>
