<rect x="70.0" y="214.0" width="154.0" height="42.0" rx="10" fill="#fff" stroke="#aaa" stroke-width="1"/>
<text x="84.0" y="244.0" font-size="18" text-anchor="start" fill="#1a1a1a" font-weight="normal">好啊！几点见？</text>
