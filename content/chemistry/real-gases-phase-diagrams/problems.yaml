  - id: chemistry.states.real-gases-phase-diagrams.p018
    topics: [chemistry.states.real-gases-phase-diagrams]
    difficulty: 5
    type: numeric
    stem: 'หม้อความดันทำให้น้ำเดือดที่อุณหภูมิสูงกว่าปกติ ถ้าน้ำเดือดที่ 120 °C ความดันภายในหม้อประมาณกี่ kPa ใช้ $\Delta H_{vap} = 40.66$ kJ/mol, $R = 8.314$ J/(mol·K) และจุดเดือดปกติ 373.15 K ที่ 101.3 kPa (ตอบเป็น kPa)'
    answer: { value: 197.3, tolerance: 1.5, unit: kPa }
    hints:
      - 'ใช้สมการเคลาซิอุส–คลาเปรองโดยแทน $T_1 = 373.15$ K ที่ 101.3 kPa และ $T_2 = 393.15$ K'
      - 'ความดันที่สูงขึ้นทำให้จุดเดือดสูงขึ้น ค่าที่ได้ต้องมากกว่า 101.3 kPa'
    misconceptions:
      - { match: 101.3, feedback: 'คิดว่าความดันไม่เปลี่ยนแม้อุณหภูมิจุดเดือดเปลี่ยน ในหม้อความดันความดันภายในสูงขึ้นจึงเดือดที่อุณหภูมิสูงขึ้น' }
    solution: '$\ln(P_2/101.3) = -(40660/8.314)(1/393.15 - 1/373.15) = 0.6667$ จึง $P_2 = 101.3 \times e^{0.6667} = 197.3$ kPa ซึ่งประมาณ 2 เท่าของความดันบรรยากาศ (ค่าที่วัดจริงประมาณ 198.7 kPa)'
    license: CC-BY-SA-4.0
    ai_assisted: true
