    ai_assisted: true

  - id: management.quality.quality-planning.p018
    topics: [management.quality.quality-planning]
    difficulty: 2
    type: numeric
    stem: "ข้อกำหนดของขวดน้ำปลาคือปริมาตร $700 \\pm 8$ mL ขีดจำกัดล่าง (LSL) ของปริมาตรคือเท่าใด (ตอบในหน่วย mL)"
    answer: { value: 692, unit: mL }
    hints:
      - "LSL = ค่าเป้าหมาย − พิกัด"
      - "$700 - 8$"
    misconceptions:
      - { match: 708, feedback: "นั่นคือขีดจำกัดบน (USL)" }
      - { match: 16, feedback: "16 คือความกว้างของช่วงพิกัดทั้งหมด ไม่ใช่ขีดจำกัดล่าง" }
    solution: "LSL $= 700 - 8 = 692$ mL และ USL $= 700 + 8 = 708$ mL"
