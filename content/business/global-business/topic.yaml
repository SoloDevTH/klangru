id: business.international.global-business
subject: business
title:
  th: ธุรกิจข้ามชาติ อัตราแลกเปลี่ยน และสภาพแวดล้อมทางธุรกิจโลก
  en: Global business, exchange rates and the business environment
summary: สภาพแวดล้อมทางธุรกิจแบบ PESTEL โลกาภิวัตน์ บริษัทข้ามชาติและรูปแบบการเข้าตลาด ตลาดเกิดใหม่ การค้าออนไลน์ข้ามพรมแดน อัตราแลกเปลี่ยน อัตราไขว้ และการป้องกันความเสี่ยงค่าเงิน
difficulty: 6
minutes: 45
prerequisites:
- business.international.trade
- business.econ.money-banking
