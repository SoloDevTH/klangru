    stem: "อนุกรม $1 + 2x + 4x^2 + 8x^3 + \\dots$ มีผลบวกเท่ากับ 4 จงหา $x$ (ตอบเป็นทศนิยม)"
    answer: { value: 0.375, tolerance: 0.001 }
    hints:
      - "เป็นอนุกรมเรขาคณิต $a_1 = 1$, $r = 2x$ มีผลบวกเมื่อ $|2x| < 1$"
      - "$\\dfrac{1}{1 - 2x} = 4$"
    misconceptions:
      - { match: 0.75, feedback: "แก้ได้ $1 - r = \\tfrac14$ จึง $r = \\tfrac34$ แต่ $r = 2x$ ต้องหารด้วย 2 อีก" }
      - { match: -1.5, feedback: "จัดสมการผิดเป็น $1 - 2x = 4$ ต้องได้ $1 - 2x = \\tfrac14$" }
    solution: "$\\dfrac{1}{1 - 2x} = 4 \\Rightarrow 1 - 2x = \\tfrac14 \\Rightarrow x = \\tfrac38 = 0.375$ ตรวจเงื่อนไข $|2x| = 0.75 < 1$ จึงใช้สูตรได้"
