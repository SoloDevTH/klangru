<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="sans-serif">
<title>ฉลากยาตัวอย่างภาษาอังกฤษ</title>
<rect x="0" y="0" width="520" height="300" fill="#fff"/>
<rect x="20.0" y="20.0" width="480.0" height="260.0" rx="10" fill="#fff" stroke="#2f5fa8" stroke-width="3"/>
<rect x="20.0" y="20.0" width="480.0" height="46.0" rx="10" fill="#2f5fa8" stroke="#2f5fa8" stroke-width="3"/>
<rect x="20.0" y="50.0" width="480.0" height="16.0" rx="0" fill="#2f5fa8" stroke="none" stroke-width="0"/>
<text x="260.0" y="51.0" font-size="19" text-anchor="middle" fill="#fff" font-weight="bold">MEDICINE X (example)  ·  21 tablets</text>
<text x="40.0" y="100.0" font-size="17" text-anchor="start" fill="#111" font-weight="bold">Take 1 tablet 3 times a day after meals.</text>
<text x="40.0" y="134.0" font-size="17" text-anchor="start" fill="#111" font-weight="bold">Do not take more than 3 tablets in 24 hours.</text>
<text x="40.0" y="168.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">Swallow whole with water. Do not chew.</text>
<text x="40.0" y="202.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">Keep out of the reach of children.</text>
<text x="40.0" y="236.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">Store below 30°C. Keep away from sunlight.</text>
<text x="40.0" y="274.0" font-size="13" text-anchor="start" fill="#777" font-weight="normal">ฉลากตัวอย่างสำหรับฝึกอ่าน ไม่ใช่ยาจริง</text>
</svg>
