  - id: phy.graph.p020
    topics: [physics.kinematics.motion-graphs]
    difficulty: 3
    type: numeric
    stem: "รถของเล่นมีความเร็ว $1\\ \\mathrm{m/s}$ ที่ $t = 0$ แล้วมีความเร่งตามกราฟความเร่ง–เวลาในภาพ ที่ $t = 7\\ \\mathrm{s}$ รถมีความเร็วเท่าใด (ตอบเป็นตัวเลขในหน่วย m/s)"
    figure: { src: at-two-steps.svg, alt: "กราฟความเร่ง a (m/s²) กับเวลา t (s) เป็นเส้นแนวนอนสองช่วง: a = 2 m/s² ตั้งแต่ 0 ถึง 3 s (พื้นที่เหนือแกนระบายสี) และ a = −1 m/s² ตั้งแต่ 3 ถึง 7 s (พื้นที่ใต้แกนระบายสี)" }
    answer: { value: 3, tolerance: 0.03, unit: m/s }
    hints:
      - "พื้นที่ใต้กราฟความเร่ง–เวลาคือความเร็วที่เปลี่ยนไป พื้นที่ใต้แกนเป็นลบ"
      - "ความเร็วปลาย $=$ ความเร็วต้น $+$ พื้นที่รวม"
    misconceptions:
      - { match: 2, feedback: "นั่นคือความเร็วที่เปลี่ยนไป ($6 - 4$) ยังต้องบวกความเร็วต้น $1\\ \\mathrm{m/s}$" }
      - { match: 11, feedback: "ดูเหมือนนับพื้นที่ใต้แกนเป็นบวก ช่วงที่ความเร่งเป็นลบทำให้ความเร็วลดลง" }
    solution: "พื้นที่ $= (2)(3) + (-1)(4) = 6 - 4 = 2\\ \\mathrm{m/s}$ ความเร็วที่ $7\\ \\mathrm{s}$ $= 1 + 2 = 3\\ \\mathrm{m/s}$"
