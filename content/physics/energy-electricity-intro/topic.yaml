id: physics.energy.energy-electricity-intro
subject: physics
title: { th: พลังงานและไฟฟ้าในชีวิตประจำวัน, en: Energy and electricity in everyday life }
summary: พลังงานหลายรูปและการเปลี่ยนรูป ความเร็วกับพลังงาน เครื่องกำเนิดไฟฟ้าและแหล่งพลังงานผลิตไฟฟ้า และการใช้ไฟฟ้าอย่างประหยัดและปลอดภัย
difficulty: 1.5
minutes: 30
prerequisites: []
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: พัดลมเปลี่ยนพลังงานอย่างไร
    problem: "เสียบปลั๊กพัดลมแล้วกดปุ่ม ใบพัดหมุนและมีลมพัดออกมา อธิบายทีละขั้นว่าเกิดอะไรขึ้น และพลังงานเปลี่ยนรูปอย่างไร"
    steps:
      - text: "กดปุ่มแล้ววงจรครบรอบ กระแสไฟฟ้าจากปลั๊กไหลเข้ามอเตอร์ของพัดลม"
      - text: "มอเตอร์หมุน แกนมอเตอร์หมุนใบพัด: พลังงานไฟฟ้าเปลี่ยนเป็นพลังงานกล"
        why: "มอเตอร์ทำงานกลับกับเครื่องกำเนิดไฟฟ้า คือเปลี่ยนไฟฟ้าเป็นการหมุน"
      - text: "ใบพัดดันอากาศ อากาศเคลื่อนที่เป็นลม: พลังงานกลส่งต่อให้อากาศ"
      - text: "พัดลมมีเสียงหึ่ง ๆ และตัวมอเตอร์อุ่นขึ้น: พลังงานส่วนหนึ่งกลายเป็นเสียงและความร้อน"
        why: "เครื่องใช้ไฟฟ้าทุกเครื่องมีพลังงานบางส่วนกลายเป็นความร้อน"
    answer: "ไฟฟ้า → การหมุนของมอเตอร์และใบพัด → ลม และมีเสียงกับความร้อนเกิดขึ้นด้วย"
  - { type: check, problem: physics.energy.energy-electricity-intro.p001, prompt: "ลองจับคู่ด้วยตัวเอง" }
  - type: figure
    title: กราฟแท่งพลังงานของการเคลื่อนที่
    src: ke-bars.svg
    alt: "กราฟแท่งสองกราฟ แกนตั้งคือพลังงานจลน์เป็นจูล กราฟซ้ายชื่อความเร็วเท่ากัน 1 m/s: มวล 2 kg พลังงาน 1 J มวล 4 kg พลังงาน 2 J มวล 6 kg พลังงาน 3 J แท่งสูงขึ้นทีละเท่ากัน กราฟขวาชื่อมวลเท่ากัน 2 kg: ความเร็ว 1 m/s พลังงาน 1 J ความเร็ว 2 m/s พลังงาน 4 J ความเร็ว 3 m/s พลังงาน 9 J แท่งสูงขึ้นเร็วขึ้นเรื่อย ๆ"
    caption: "มวล 2 เท่า พลังงาน 2 เท่า แต่ความเร็ว 2 เท่า พลังงาน 4 เท่า"
  - type: figure
    title: ผลิตไฟฟ้าจากเขื่อน
    src: power-station.svg
    alt: "ภาพสี่ช่องเรียงจากซ้ายไปขวามีลูกศรเชื่อม ช่องที่หนึ่ง น้ำในเขื่อนอยู่ที่สูง มีลูกศรน้ำไหลออกจากฐานเขื่อน ช่องที่สอง กังหันมีใบโค้ง มีลูกศรบอกว่าน้ำดันให้หมุน ช่องที่สาม เครื่องกำเนิดไฟฟ้า มีแม่เหล็กขั้ว N และ S อยู่ในขดลวดทองแดง ช่องที่สี่ บ้านที่มีหลอดไฟสว่าง ไฟฟ้ามาตามสาย"
    caption: "น้ำหมุนกังหัน กังหันหมุนแม่เหล็กในขดลวด จึงเกิดไฟฟ้า โรงไฟฟ้าแบบอื่นใช้ไอน้ำหรือลมหมุนกังหันแทน"
  - type: worked-example
    title: ค่าไฟของพัดลมหนึ่งเดือน
    problem: "พัดลมเครื่องหนึ่งใช้ไฟวันละ 0.4 หน่วย เปิดทุกวันเป็นเวลา 30 วัน ถ้าค่าไฟหน่วยละ 4 บาท ต้องจ่ายค่าไฟของพัดลมเดือนนี้กี่บาท และถ้าปิดพัดลมเมื่อไม่มีคนอยู่ จนใช้ไฟลดลงเหลือวันละ 0.3 หน่วย จะประหยัดได้กี่บาท"
    steps:
      - text: "หน่วยไฟทั้งเดือน: 0.4 × 30 = 12 หน่วย"
      - text: "ค่าไฟ: 12 × 4 = 48 บาท"
      - text: "เมื่อปิดพัดลมเมื่อไม่ใช้: 0.3 × 30 = 9 หน่วย ค่าไฟ 9 × 4 = 36 บาท"
      - text: "ประหยัดได้ 48 − 36 = 12 บาทต่อเดือน"
        why: "เครื่องเดียวประหยัดได้ไม่มาก แต่ถ้าทุกคนในบ้านปิดทุกเครื่องเมื่อไม่ใช้ จะประหยัดได้มาก"
    answer: "ค่าไฟ 48 บาท ประหยัดได้ 12 บาทต่อเดือน"
  - { type: check, problem: physics.energy.energy-electricity-intro.p011, prompt: "ลองคิดก่อนอ่านต่อ" }
  - type: simulation
    title: รูปพลังงานและการเปลี่ยนรูป (PhET Energy Forms and Changes)
    url: https://phet.colorado.edu/en/simulations/energy-forms-and-changes
    provider: phet
    note: "เลือกหน้า Systems ลองต่อแหล่งพลังงาน (ก๊อกน้ำ ดวงอาทิตย์ จักรยาน) กับเครื่องกำเนิดไฟฟ้าหรือแผงโซลาร์เซลล์ แล้วต่อกับหลอดไฟ กดแสดงสัญลักษณ์พลังงาน จะเห็นพลังงานเปลี่ยนรูปไปตามทาง"
glossary:
  - { term: พลังงาน, definition: "สิ่งที่ทำให้สิ่งต่าง ๆ เคลื่อนที่ ร้อนขึ้น ให้แสง หรือให้เสียง มีหลายรูปและเปลี่ยนรูปได้ วัดเป็นจูล (J)" }
  - { term: การเปลี่ยนรูปพลังงาน, definition: "พลังงานรูปหนึ่งเปลี่ยนเป็นอีกรูปหนึ่ง เช่น ไฟฟ้าเป็นแสงในหลอดไฟ เคมีเป็นความร้อนเมื่อเผาเชื้อเพลิง" }
  - { term: พลังงานจลน์, definition: "พลังงานของวัตถุที่กำลังเคลื่อนที่ ยิ่งเร็วและยิ่งมีมวลมาก ยิ่งมีมาก" }
  - { term: เครื่องกำเนิดไฟฟ้า, definition: "อุปกรณ์ที่หมุนแม่เหล็กในขดลวด (หรือหมุนขดลวดรอบแม่เหล็ก) เพื่อเปลี่ยนพลังงานกลเป็นพลังงานไฟฟ้า" }
  - { term: ฉลากประหยัดไฟเบอร์ 5, definition: "ฉลากบนเครื่องใช้ไฟฟ้าในไทยที่บอกว่าเครื่องนั้นประหยัดไฟมากที่สุดในกลุ่มเดียวกัน" }
flashcards:
  - { front: "หลอดไฟเปลี่ยนพลังงานไฟฟ้าเป็นอะไร", back: "แสง และความร้อน" }
  - { front: "เครื่องกำเนิดไฟฟ้าทำงานอย่างไร", back: "หมุนแม่เหล็กในขดลวด เกิดกระแสไฟฟ้า เปลี่ยนพลังงานกลเป็นพลังงานไฟฟ้า" }
  - { front: "ความเร็วเพิ่ม 2 เท่า พลังงานจลน์เพิ่มกี่เท่า", back: "4 เท่า (มวลเพิ่ม 2 เท่า พลังงานเพิ่ม 2 เท่า)" }
  - { front: "พลังงานถ่ายโอนจากที่หนึ่งไปอีกที่หนึ่งด้วยอะไรได้บ้าง", back: "เสียง แสง ความร้อน และกระแสไฟฟ้า" }
  - { front: "ใช้ไฟฟ้าอย่างปลอดภัย", back: "มือแห้ง ดึงที่ตัวปลั๊ก ไม่ใช้เครื่องกำลังสูงหลายเครื่องในปลั๊กพ่วงเดียว อยู่ห่างสายไฟที่ขาด" }
