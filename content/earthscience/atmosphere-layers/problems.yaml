problems:
  - id: earthscience.atmosphere.atmosphere-layers.p001
    topics: [earthscience.atmosphere.atmosphere-layers]
    difficulty: 1
    type: mcq
    stem: "เมฆ ฝน และพายุเกิดในบรรยากาศชั้นใด"
    choices:
      - { id: a, text: "โทรโพสเฟียร์", correct: true }
      - { id: b, text: "สตราโตสเฟียร์", feedback: "สตราโตสเฟียร์อากาศนิ่งและแห้ง มีชั้นโอโซน แต่ไม่ค่อยมีเมฆฝน" }
      - { id: c, text: "มีโซสเฟียร์", feedback: "มีโซสเฟียร์เป็นชั้นที่ดาวตกลุกไหม้ อากาศเบาบางเกินกว่าจะเกิดฝน" }
      - { id: d, text: "เทอร์โมสเฟียร์", feedback: "เทอร์โมสเฟียร์อากาศเบาบางมาก เป็นชั้นที่เกิดแสงเหนือแสงใต้" }
    hints:
      - "ไอน้ำเกือบทั้งหมดอยู่ในชั้นใด"
      - "เป็นชั้นล่างสุดที่เราอาศัยอยู่"
    solution: "โทรโพสเฟียร์เป็นชั้นล่างสุด มีไอน้ำเกือบทั้งหมดของบรรยากาศ จึงเกิดเมฆ ฝน และพายุ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.atmosphere-layers.p002
    topics: [earthscience.atmosphere.atmosphere-layers]
    difficulty: 1
    type: match
    stem: "จับคู่ชั้นบรรยากาศกับลักษณะเด่น"
    pairs:
      - { left: "โทรโพสเฟียร์", right: "เกิดลมฟ้าอากาศ ยิ่งสูงยิ่งเย็น" }
      - { left: "สตราโตสเฟียร์", right: "มีชั้นโอโซนกรองรังสีอัลตราไวโอเลต" }
      - { left: "มีโซสเฟียร์", right: "ดาวตกลุกไหม้ เป็นชั้นที่หนาวที่สุด" }
      - { left: "เทอร์โมสเฟียร์", right: "เกิดแสงเหนือแสงใต้ อุณหภูมิสูงขึ้นมาก" }
    hints:
      - "เรียงจากล่างขึ้นบน: โทรโพ สตราโต มีโซ เทอร์โม"
      - "ชั้นโอโซนอยู่ในชั้นที่สองจากล่าง"
    solution: "โทรโพสเฟียร์มีลมฟ้าอากาศ สตราโตสเฟียร์มีโอโซน มีโซสเฟียร์มีดาวตกลุกไหม้และหนาวที่สุด เทอร์โมสเฟียร์เกิดแสงเหนือแสงใต้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.atmosphere-layers.p003
    topics: [earthscience.atmosphere.atmosphere-layers]
    difficulty: 1
    type: mcq
    stem: "แก๊สใดมีมากที่สุดในอากาศแห้ง"
    choices:
      - { id: a, text: "ไนโตรเจน", correct: true }
      - { id: b, text: "ออกซิเจน", feedback: "ออกซิเจนมีราวร้อยละ 21 น้อยกว่าไนโตรเจนซึ่งมีราวร้อยละ 78" }
      - { id: c, text: "คาร์บอนไดออกไซด์", feedback: "คาร์บอนไดออกไซด์มีเพียงราวร้อยละ 0.04" }
      - { id: d, text: "อาร์กอน", feedback: "อาร์กอนมีราวร้อยละ 0.9" }
    hints:
      - "มีเกือบสี่ในห้าส่วนของอากาศ"
      - "ไม่ใช่แก๊สที่เราใช้หายใจ"
    solution: "ไนโตรเจนมีราวร้อยละ 78 ออกซิเจนราวร้อยละ 21"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.atmosphere-layers.p004
    topics: [earthscience.atmosphere.atmosphere-layers]
    difficulty: 2
    type: order
    stem: "เรียงชั้นบรรยากาศจากชั้นที่อยู่ใกล้ผิวโลกที่สุดขึ้นไป"
    items:
      - "โทรโพสเฟียร์"
      - "สตราโตสเฟียร์"
      - "มีโซสเฟียร์"
      - "เทอร์โมสเฟียร์"
    hints:
      - "ชั้นที่มีลมฟ้าอากาศอยู่ล่างสุด"
      - "ชั้นโอโซนอยู่ถัดจากชั้นล่างสุด"
    solution: "โทรโพสเฟียร์ (0–12 km) → สตราโตสเฟียร์ (12–50 km) → มีโซสเฟียร์ (50–85 km) → เทอร์โมสเฟียร์ (85 km ขึ้นไป)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.atmosphere-layers.p005
    topics: [earthscience.atmosphere.atmosphere-layers]
    difficulty: 2
    type: mcq
    stem: "นักท่องเที่ยวนำถุงขนมที่ปิดสนิทจากตัวเมืองเชียงใหม่ขึ้นไปบนยอดดอยอินทนนท์ ถุงขนมพองตึงขึ้น เพราะเหตุใด"
    choices:
      - { id: a, text: "ความดันอากาศภายนอกบนยอดดอยต่ำกว่าความดันอากาศในถุง", correct: true }
      - { id: b, text: "อากาศบนยอดดอยร้อนกว่า ทำให้อากาศในถุงขยายตัว", feedback: "บนยอดดอยอากาศเย็นกว่าในเมือง ถุงพองเพราะความดันภายนอกลดลง" }
      - { id: c, text: "บนยอดดอยมีออกซิเจนมากกว่า", feedback: "สัดส่วนของแก๊สเกือบเท่าเดิม แต่อากาศเบาบางลง" }
      - { id: d, text: "แรงโน้มถ่วงบนยอดดอยดึงถุงขึ้น", feedback: "แรงโน้มถ่วงดึงทุกอย่างลง และบนดอยต่างจากข้างล่างน้อยมาก" }
    hints:
      - "ที่สูงมีอากาศอยู่ข้างบนน้อยลง"
      - "เทียบความดันในถุงกับนอกถุง"
    solution: "ถุงปิดไว้ที่ความดันของข้างล่าง เมื่อขึ้นที่สูง ความดันอากาศภายนอกลดลง อากาศในถุงซึ่งมีความดันสูงกว่าจึงดันถุงให้พองออก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.atmosphere-layers.p006
    topics: [earthscience.atmosphere.atmosphere-layers]
    difficulty: 2
    type: text
    stem: "แก๊สในชั้นสตราโตสเฟียร์ที่ดูดกลืนรังสีอัลตราไวโอเลตจากดวงอาทิตย์ ช่วยปกป้องสิ่งมีชีวิตบนโลก คือแก๊สอะไร"
    accepted: ["โอโซน", "แก๊สโอโซน", "ozone", "o3"]
    misconceptions:
      - { match: "ออกซิเจน", feedback: "โอโซนเกิดจากออกซิเจน แต่เป็นคนละโมเลกุล โอโซนมีออกซิเจน 3 อะตอม" }
      - { match: "คาร์บอนไดออกไซด์", feedback: "คาร์บอนไดออกไซด์ดูดกลืนอินฟราเรด ไม่ใช่แก๊สที่กรองรังสีอัลตราไวโอเลต" }
    hints:
      - "ชั้นของแก๊สนี้อยู่ที่ความสูงราว 15–35 km"
      - "ชื่อแก๊สเหมือนชื่อชั้นที่ปกป้องโลก"
    solution: "โอโซน ($\\mathrm{O_3}$) ดูดกลืนรังสีอัลตราไวโอเลตแล้วเปลี่ยนเป็นความร้อน สตราโตสเฟียร์จึงอุ่นขึ้นเมื่อสูงขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.atmosphere-layers.p007
    topics: [earthscience.atmosphere.atmosphere-layers]
    difficulty: 3
    type: numeric
    stem: "จากกราฟความดันอากาศกับความสูง ที่ความสูง 6 km ความดันอากาศประมาณกี่เฮกโตพาสคัล"
    figure: { src: pressure-altitude.svg, alt: "กราฟเส้นโค้ง แกนตั้งเป็นความสูง 0 ถึง 20 km แกนนอนเป็นความดันอากาศ 0 ถึง 1,100 hPa เส้นเริ่มที่ 1,013 hPa ที่ระดับทะเล ลดลงเร็วในช่วงล่างแล้วช้าลง ผ่านราว 800 hPa ที่ 2 km ราว 620 hPa ที่ 4 km ราว 470 hPa ที่ 6 km ราว 360 hPa ที่ 8 km ราว 260 hPa ที่ 10 km และราว 55 hPa ที่ 20 km" }
    answer: { value: 470, tolerance: 30, unit: hPa }
    misconceptions:
      - { match: 1013, feedback: "1,013 hPa คือความดันที่ระดับทะเล ต้องอ่านค่าที่ความสูง 6 km" }
      - { match: 200, feedback: "อ่านค่าที่ความสูงราว 12 km ลองลากเส้นจาก 6 km บนแกนตั้งไปหาเส้นกราฟ" }
    hints:
      - "หา 6 km บนแกนตั้ง แล้วลากเส้นแนวนอนไปหาเส้นกราฟ"
      - "จากจุดนั้นลากเส้นลงมาอ่านค่าบนแกนนอน"
    solution: "ที่ 6 km เส้นกราฟอยู่ราว 470 hPa (อ่านได้ในช่วง 440–500 ถือว่าถูก) ความดันเหลือไม่ถึงครึ่งของที่ระดับทะเล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.atmosphere-layers.p008
    topics: [earthscience.atmosphere.atmosphere-layers]
    difficulty: 3
    type: numeric
    stem: "ในโทรโพสเฟียร์ อุณหภูมิลดลงประมาณ 6.5 °C ทุก 1 km ที่ตีนดอยระดับทะเลวัดได้ 32 °C ถ้าใช้อัตรานี้ ที่ความสูง 2.565 km จะมีอุณหภูมิประมาณกี่องศาเซลเซียส"
    answer: { value: 15.3, tolerance: 0.2, unit: "°C" }
    misconceptions:
      - { match: 48.7, feedback: "อุณหภูมิลดลงเมื่อสูงขึ้น ต้องลบ ไม่ใช่บวก" }
      - { match: 16.7, feedback: "16.7 °C คืออุณหภูมิที่ลดลง ต้องนำไปลบจาก 32 °C" }
    hints:
      - "อุณหภูมิที่ลดลง = 6.5 × ความสูงเป็นกิโลเมตร"
      - "นำอุณหภูมิที่ตีนดอยลบด้วยอุณหภูมิที่ลดลง"
    solution: "ลดลง $6.5 \\times 2.565 \\approx 16.7$ °C อุณหภูมิ $= 32 - 16.7 \\approx 15.3$ °C ค่าจริงต่างไปได้ตามวันและฤดู"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.atmosphere-layers.p009
    topics: [earthscience.atmosphere.atmosphere-layers]
    difficulty: 3
    type: mcq
    stem: "ทำไมความดันอากาศจึงลดลงเมื่อความสูงเพิ่มขึ้น"
    choices:
      - { id: a, text: "ยิ่งสูง อากาศที่อยู่ข้างบนและกดทับลงมายิ่งน้อยลง", correct: true }
      - { id: b, text: "ยิ่งสูง ยิ่งใกล้ดวงอาทิตย์ อากาศจึงร้อนและเบา", feedback: "ระยะที่ใกล้ดวงอาทิตย์ขึ้นไม่กี่กิโลเมตรแทบไม่มีผล และโทรโพสเฟียร์ยิ่งสูงยิ่งเย็น" }
      - { id: c, text: "ที่สูงไม่มีแรงโน้มถ่วง", feedback: "แรงโน้มถ่วงยังมีอยู่ ดาวเทียมก็ยังถูกโลกดึงอยู่" }
      - { id: d, text: "ที่สูงมีออกซิเจนน้อยกว่าไนโตรเจน", feedback: "สัดส่วนของแก๊สใกล้เคียงเดิม ความดันลดเพราะอากาศเบาบางลงทั้งหมด" }
    hints:
      - "นึกถึงฟองน้ำที่วางซ้อนกันเป็นตั้ง"
      - "ความดันอากาศเกิดจากน้ำหนักของอากาศที่อยู่ข้างบน"
    solution: "ความดันอากาศเกิดจากอากาศข้างบนที่ถูกแรงโน้มถ่วงดึงลงมากดทับ ยิ่งขึ้นสูง อากาศข้างบนยิ่งเหลือน้อย ความดันจึงลดลง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.atmosphere-layers.p010
    topics: [earthscience.atmosphere.atmosphere-layers]
    difficulty: 3
    type: mcq
    stem: "ข้อใดอธิบายได้ว่าทำไมอุณหภูมิในชั้นสตราโตสเฟียร์จึงสูงขึ้นเมื่อสูงขึ้น"
    choices:
      - { id: a, text: "โอโซนดูดกลืนรังสีอัลตราไวโอเลตจากดวงอาทิตย์แล้วเปลี่ยนเป็นความร้อน", correct: true }
      - { id: b, text: "ยิ่งสูงยิ่งใกล้ดวงอาทิตย์", feedback: "ถ้าเป็นเช่นนั้น โทรโพสเฟียร์ก็ควรร้อนขึ้นเมื่อสูงขึ้นด้วย แต่กลับเย็นลง" }
      - { id: c, text: "ความร้อนจากพื้นโลกลอยขึ้นไปสะสม", feedback: "ความร้อนจากพื้นโลกทำให้โทรโพสเฟียร์ชั้นล่างอุ่น ยิ่งไกลพื้นยิ่งเย็น" }
      - { id: d, text: "ดาวตกเผาไหม้ในชั้นนี้", feedback: "ดาวตกส่วนใหญ่ลุกไหม้ในมีโซสเฟียร์ และไม่ใช่แหล่งความร้อนหลัก" }
    hints:
      - "สตราโตสเฟียร์มีแก๊สพิเศษอะไร"
      - "แก๊สนั้นดูดกลืนรังสีชนิดใด"
    solution: "ชั้นโอโซนในสตราโตสเฟียร์ดูดกลืนรังสีอัลตราไวโอเลตแล้วเปลี่ยนเป็นความร้อน ส่วนบนของชั้นได้รับรังสีมากกว่า จึงอุ่นกว่าส่วนล่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.atmosphere-layers.p011
    topics: [earthscience.atmosphere.atmosphere-layers]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นหลักฐานว่าบรรยากาศของโลกในยุคแรกแตกต่างจากปัจจุบัน (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "หินโบราณอายุมากกว่าราว 2,400 ล้านปีมีแร่ที่จะถูกออกซิเจนทำลาย", correct: true }
      - { id: b, text: "พบซากดึกดำบรรพ์สโตรมาโทไลต์ที่แบคทีเรียสังเคราะห์ด้วยแสงสร้างไว้", correct: true }
      - { id: c, text: "แก๊สจากภูเขาไฟในปัจจุบันเป็นไอน้ำและคาร์บอนไดออกไซด์เป็นส่วนใหญ่", correct: true }
      - { id: d, text: "ปัจจุบันอากาศมีไนโตรเจนมากที่สุด", feedback: "เป็นข้อมูลของบรรยากาศปัจจุบัน ไม่ได้บอกว่ายุคแรกต่างไปอย่างไร" }
    hints:
      - "หาหลักฐานที่บอกว่ายุคแรกไม่มีออกซิเจน และออกซิเจนมาจากไหน"
      - "บรรยากาศยุคแรกมาจากแก๊สอะไร"
    solution: "แร่ในหินโบราณบอกว่าตอนนั้นไม่มีออกซิเจนอิสระ สโตรมาโทไลต์บอกว่ามีสิ่งมีชีวิตที่ผลิตออกซิเจน และแก๊สจากภูเขาไฟบอกว่าบรรยากาศยุคแรกน่าจะมีไอน้ำและคาร์บอนไดออกไซด์มาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.atmosphere-layers.p012
    topics: [earthscience.atmosphere.atmosphere-layers]
    difficulty: 4
    type: numeric
    stem: "ใช้แบบจำลองอย่างง่ายว่าความดันอากาศลดลงครึ่งหนึ่งทุก 5.5 km ถ้าที่ระดับทะเลมีความดัน 1,013 hPa ที่ความสูง 11 km จะมีความดันประมาณกี่เฮกโตพาสคัล"
    answer: { value: 253, tolerance: 3, unit: hPa }
    misconceptions:
      - { match: 0, feedback: "ลดลงครึ่งหนึ่งสองครั้งไม่ได้ทำให้เหลือศูนย์ ครึ่งของครึ่งคือหนึ่งในสี่" }
      - { match: 506.5, feedback: "นี่คือความดันที่ 5.5 km ต้องลดลงครึ่งหนึ่งอีกครั้ง" }
    hints:
      - "11 km คือ 5.5 km สองช่วง"
      - "ลดลงครึ่งหนึ่งสองครั้ง เหลือกี่ส่วนของค่าเดิม"
