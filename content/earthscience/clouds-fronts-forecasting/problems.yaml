problems:
  - id: earthscience.atmosphere.clouds-fronts-forecasting.p001
    topics: [earthscience.atmosphere.clouds-fronts-forecasting]
    difficulty: 1
    type: match
    stem: "จับคู่ชนิดของเมฆกับลักษณะ"
    pairs:
      - { left: "ซีร์รัส", right: "เมฆริ้วบางสีขาวอยู่สูงมาก ประกอบด้วยผลึกน้ำแข็ง" }
      - { left: "คิวมูโลนิมบัส", right: "เมฆก้อนสูงมาก ยอดแผ่เป็นรูปทั่ง ให้ฝนฟ้าคะนอง" }
      - { left: "สเตรตัส", right: "เมฆแผ่นสีเทาอยู่ต่ำ คล้ายหมอกที่ลอยเหนือพื้น" }
      - { left: "นิมโบสเตรตัส", right: "เมฆแผ่นหนาสีเทาเข้ม ให้ฝนตกพรำต่อเนื่อง" }
    hints:
      - "ซีร์โร = สูงเป็นริ้ว สเตรตัส = แผ่น คิวมูลัส = ก้อน นิมบัส = ให้ฝน"
      - "เมฆที่ทั้งเป็นก้อนและให้ฝนคือคิวมูโล + นิมบัส"
    solution: "ซีร์รัสเป็นริ้วสูง คิวมูโลนิมบัสเป็นก้อนสูงให้ฝนฟ้าคะนอง สเตรตัสเป็นแผ่นต่ำ และนิมโบสเตรตัสเป็นแผ่นหนาให้ฝนพรำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.clouds-fronts-forecasting.p002
    topics: [earthscience.atmosphere.clouds-fronts-forecasting]
    difficulty: 1
    type: mcq
    stem: "ก้อนอากาศที่ลอยสูงขึ้นจะเย็นลง เพราะเหตุใด"
    choices:
      - { id: a, text: "ความกดอากาศรอบข้างลดลง ก้อนอากาศจึงขยายตัวและใช้พลังงานภายในไป", correct: true }
      - { id: b, text: "ได้รับความเย็นจากอากาศที่เย็นกว่าข้างบน", feedback: "อากาศนำความร้อนได้น้อยมาก การเย็นลงของอากาศที่ยกตัวเกิดจากการขยายตัว ไม่ได้เกิดจากการถ่ายความร้อน" }
      - { id: c, text: "อยู่ห่างจากดวงอาทิตย์มากขึ้น", feedback: "ความสูงไม่กี่กิโลเมตรแทบไม่เปลี่ยนระยะห่างจากดวงอาทิตย์" }
      - { id: d, text: "ไอน้ำในก้อนอากาศหายไป", feedback: "ไอน้ำที่ควบแน่นกลับปล่อยความร้อนแฝงออกมา ทำให้อากาศอิ่มตัวเย็นลงช้ากว่า" }
    hints:
      - "ข้างบนความกดอากาศต่ำกว่า"
      - "แก๊สที่ขยายตัวโดยไม่ได้รับความร้อนเพิ่มจะเย็นลง"
    solution: "ก้อนอากาศที่ยกตัวขยายตัวเพราะความกดอากาศรอบข้างลดลง การขยายตัวใช้พลังงานภายใน อุณหภูมิจึงลดลง เรียกว่ากระบวนการแอเดียแบติก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.clouds-fronts-forecasting.p003
    topics: [earthscience.atmosphere.clouds-fronts-forecasting]
    difficulty: 2
    type: mcq
    stem: "บนแผนที่อากาศ เส้นสีน้ำเงินที่มีรูปสามเหลี่ยมอยู่ด้านหนึ่งของเส้นแทนอะไร"
    choices:
      - { id: a, text: "แนวปะทะอากาศเย็น สามเหลี่ยมชี้ไปทางที่แนวเคลื่อนไป", correct: true }
      - { id: b, text: "แนวปะทะอากาศอุ่น", feedback: "แนวปะทะอากาศอุ่นใช้เส้นสีแดงที่มีครึ่งวงกลม" }
      - { id: c, text: "แนวปะทะอากาศคงที่", feedback: "แนวปะทะคงที่มีทั้งสามเหลี่ยมสีน้ำเงินและครึ่งวงกลมสีแดงสลับกันคนละด้าน" }
      - { id: d, text: "เส้นความกดอากาศเท่า", feedback: "เส้นความกดอากาศเท่าเป็นเส้นบางที่มีตัวเลข hPa กำกับ ไม่มีสัญลักษณ์รูปสามเหลี่ยม" }
    hints:
      - "สีน้ำเงินสื่อถึงความเย็น"
      - "สามเหลี่ยมคือสัญลักษณ์ของแนวปะทะชนิดใด"
    solution: "เส้นสีน้ำเงินที่มีสามเหลี่ยมคือแนวปะทะอากาศเย็น สามเหลี่ยมชี้ไปทางที่แนวกำลังเคลื่อนไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.clouds-fronts-forecasting.p004
    topics: [earthscience.atmosphere.clouds-fronts-forecasting]
    difficulty: 2
    type: numeric
    stem: "บ่ายวันหนึ่งที่จังหวัดนครราชสีมา อุณหภูมิอากาศ 34 °C จุดน้ำค้าง 24 °C ใช้ $h \\approx 125\\ \\mathrm{m} \\times (T - T_d)$ ประมาณความสูงของฐานเมฆคิวมูลัส เป็นเมตร"
    answer: { value: 1250, tolerance: 10, unit: "m" }
    misconceptions:
      - { match: 1020, feedback: "นำผลต่าง 10 °C หารด้วย 9.8 °C/km ซึ่งลืมไปว่าจุดน้ำค้างของก้อนอากาศก็ลดลงด้วยขณะยกตัว สูตร 125 m ต่อ °C คิดรวมไว้แล้ว" }
      - { match: 4250, feedback: "ใช้อุณหภูมิ 34 °C แทนผลต่างระหว่างอุณหภูมิกับจุดน้ำค้าง" }
    hints:
      - "หาผลต่าง $T - T_d$ ก่อน"
      - "คูณผลต่างด้วย 125 m"
    solution: "$T - T_d = 34 - 24 = 10$ °C ฐานเมฆ $\\approx 125 \\times 10 = 1{,}250$ m"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.clouds-fronts-forecasting.p005
    topics: [earthscience.atmosphere.clouds-fronts-forecasting]
    difficulty: 2
    type: numeric
    stem: "แบบจำลองสถานีในภาพมีตัวเลขความกดอากาศ 182 ความกดอากาศที่สถานีนี้เป็นกี่เฮกโตพาสคัล (hPa)"
    figure: { src: p-station.svg, alt: "แบบจำลองสถานีตรวจอากาศ วงกลมระบายดำทั้งวง ซ้ายบนเขียน 18 สีแดง ซ้ายล่างเขียน 12 สีเขียว ขวาบนเขียน 182 สีน้ำเงิน ก้านขีดลมชี้ขึ้นไปทางทิศเหนือของวงกลม ปลายก้านมีขีดเต็มสองขีด" }
    answer: { value: 1018.2, tolerance: 0.05, unit: "hPa" }
    misconceptions:
      - { match: 918.2, feedback: "ตัวเลขขึ้นต้นด้วย 0–4 ต้องเติม 10 ข้างหน้า ความกดอากาศที่ผิวพื้น 918 hPa ต่ำผิดปกติมาก" }
      - { match: 182, feedback: "ตัวเลขบนแผนที่เป็นรหัสสามตัวท้ายของค่าคูณ 10 ต้องเติม 10 ข้างหน้าและใส่จุดทศนิยม" }
    hints:
      - "ตัวเลขสามหลักคือสามตัวท้ายของความกดอากาศเป็น hPa โดยไม่มีจุด"
      - "ขึ้นต้นด้วย 0–4 ให้เติม 10 ข้างหน้า แล้วใส่จุดหน้าตัวสุดท้าย"
    solution: "182 ขึ้นต้นด้วย 1 จึงเติม 10 ได้ 10182 แล้วใส่จุดหน้าตัวสุดท้าย เป็น 1018.2 hPa"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.clouds-fronts-forecasting.p006
    topics: [earthscience.atmosphere.clouds-fronts-forecasting]
    difficulty: 3
    type: numeric
    stem: "จากแบบจำลองสถานีในภาพ ลมพัดด้วยอัตราเร็วกี่กิโลเมตรต่อชั่วโมง (1 นอต = 1.852 km/h)"
    figure: { src: p-station.svg, alt: "แบบจำลองสถานีตรวจอากาศ วงกลมระบายดำทั้งวง ซ้ายบนเขียน 18 สีแดง ซ้ายล่างเขียน 12 สีเขียว ขวาบนเขียน 182 สีน้ำเงิน ก้านขีดลมชี้ขึ้นไปทางทิศเหนือของวงกลม ปลายก้านมีขีดเต็มสองขีด" }
    answer: { value: 37.0, tolerance: 0.4, unit: "km/h" }
    misconceptions:
      - { match: 20, feedback: "20 คือหน่วยนอต ต้องคูณ 1.852 เพื่อเป็นกิโลเมตรต่อชั่วโมง" }
      - { match: 18.5, feedback: "ขีดเต็มหนึ่งขีดคือ 10 นอต ไม่ใช่ 5 นอต สองขีดเต็มจึงเป็น 20 นอต" }
    hints:
      - "ขีดเต็มหนึ่งขีด = 10 นอต"
      - "นับขีดเป็นนอตแล้วคูณ 1.852"
    solution: "ขีดเต็มสองขีด = 20 นอต $= 20 \\times 1.852 \\approx 37.0$ km/h"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.clouds-fronts-forecasting.p007
    topics: [earthscience.atmosphere.clouds-fronts-forecasting]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "จากแบบจำลองสถานีในภาพ ข้อใดถูกต้อง (เลือกได้มากกว่าหนึ่งข้อ)"
    figure: { src: p-station.svg, alt: "แบบจำลองสถานีตรวจอากาศ วงกลมระบายดำทั้งวง ซ้ายบนเขียน 18 สีแดง ซ้ายล่างเขียน 12 สีเขียว ขวาบนเขียน 182 สีน้ำเงิน ก้านขีดลมชี้ขึ้นไปทางทิศเหนือของวงกลม ปลายก้านมีขีดเต็มสองขีด" }
    choices:
      - { id: a, text: "ลมพัดมาจากทิศเหนือ", correct: true }
      - { id: b, text: "เมฆปกคลุมเต็มท้องฟ้า", correct: true }
      - { id: c, text: "อุณหภูมิอากาศ 18 °C และจุดน้ำค้าง 12 °C", correct: true }
      - { id: d, text: "ลมพัดไปทางทิศเหนือ", feedback: "ก้านขีดลมชี้ไปทางที่ลมพัดมา ลมนี้จึงพัดจากทิศเหนือไปทางใต้" }
      - { id: e, text: "อากาศอิ่มตัวแล้ว", feedback: "อากาศอิ่มตัวเมื่ออุณหภูมิเท่ากับจุดน้ำค้าง ที่นี่ต่างกัน 6 °C" }
    hints:
      - "ก้านชี้ไปทางที่ลมพัดมา วงกลมดำทั้งวงคือ 8/8"
      - "ซ้ายบนคืออุณหภูมิ ซ้ายล่างคือจุดน้ำค้าง"
    solution: "ก้านชี้ทิศเหนือ ลมจึงมาจากทิศเหนือ วงกลมดำทั้งวงคือเมฆเต็มท้องฟ้า 18 °C เป็นอุณหภูมิ 12 °C เป็นจุดน้ำค้าง ยังไม่อิ่มตัวเพราะต่างกัน 6 °C"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.clouds-fronts-forecasting.p008
    topics: [earthscience.atmosphere.clouds-fronts-forecasting]
    difficulty: 3
    type: mcq
    stem: "บอลลูนตรวจอากาศวัดอุณหภูมิอากาศรอบข้างได้ 32 °C ที่ผิวพื้น และ 11 °C ที่ความสูง 3 km (ลดลงอย่างสม่ำเสมอ) อากาศวันนั้นมีเสถียรภาพแบบใด"
    choices:
      - { id: a, text: "มีเสถียรภาพแบบมีเงื่อนไข เพราะอุณหภูมิลดลง 7 °C/km อยู่ระหว่างอัตราแอเดียแบติกชื้นกับแห้ง", correct: true }
      - { id: b, text: "ไม่มีเสถียรภาพ เพราะอุณหภูมิลดลงตามความสูง", feedback: "อุณหภูมิลดลงตามความสูงเป็นเรื่องปกติ ต้องเทียบอัตราการลดลงกับ 9.8 และราว 6 °C/km" }
      - { id: c, text: "มีเสถียรภาพสมบูรณ์ เพราะลดลงน้อยกว่า 9.8 °C/km", feedback: "ลดลงน้อยกว่า 9.8 °C/km ทำให้อากาศแห้งไม่ลอยเอง แต่มากกว่าอัตราแอเดียแบติกชื้น อากาศที่อิ่มตัวจึงลอยต่อได้" }
      - { id: d, text: "ไม่มีเสถียรภาพสมบูรณ์ เพราะลดลง 21 °C", feedback: "ต้องคิดเป็นอัตราต่อกิโลเมตร 21 °C ใน 3 km คือ 7 °C/km ไม่ถึง 9.8 °C/km" }
    hints:
      - "คำนวณอัตราการลดลงต่อ 1 km"
      - "เทียบกับ 9.8 °C/km (แห้ง) และราว 6 °C/km (ชื้น)"
    solution: "$(32 - 11)/3 = 7$ °C/km น้อยกว่า 9.8 แต่มากกว่าราว 6 °C/km จึงเป็นเสถียรภาพแบบมีเงื่อนไข ถ้าอากาศถูกดันจนอิ่มตัวจะลอยต่อและเกิดเมฆก้อนสูงได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.clouds-fronts-forecasting.p009
    topics: [earthscience.atmosphere.clouds-fronts-forecasting]
    difficulty: 3
    type: order
    stem: "แนวปะทะอากาศอุ่นกำลังเคลื่อนเข้าหาเมืองหนึ่งในละติจูดกลาง เรียงลำดับสิ่งที่คนในเมืองจะสังเกตเห็น"
    items:
      - "เห็นเมฆซีร์รัสเป็นริ้วบางบนท้องฟ้าสูง"
      - "เมฆซีร์โรสเตรตัสแผ่คลุมจนเห็นวงแสงรอบดวงอาทิตย์"
      - "เมฆแอลโตสเตรตัสหนาขึ้น ดวงอาทิตย์เห็นเป็นดวงจาง ๆ"
      - "เมฆนิมโบสเตรตัสต่ำ ฝนตกพรำต่อเนื่องหลายชั่วโมง"
      - "แนวปะทะผ่านไป อากาศอุ่นและชื้นขึ้น ฝนหยุด"
    hints:
      - "แนวปะทะอากาศอุ่นลาดน้อย เมฆที่อยู่สูงที่สุดมาถึงก่อน"
      - "ยิ่งใกล้แนวปะทะที่ผิวพื้น เมฆยิ่งต่ำและหนา"
    solution: "อากาศอุ่นไต่ขึ้นตามความลาดของอากาศเย็น เมฆสูงจึงมาก่อน: ซีร์รัส → ซีร์โรสเตรตัส → แอลโตสเตรตัส → นิมโบสเตรตัสและฝนพรำ → แนวผ่านไป อากาศอุ่นชื้นขึ้น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.clouds-fronts-forecasting.p010
    topics: [earthscience.atmosphere.clouds-fronts-forecasting]
    difficulty: 4
    type: numeric
    stem: "อากาศที่ระดับทะเลมีอุณหภูมิ 28 °C จุดน้ำค้าง 20 °C ลมพัดข้ามเทือกเขาสูง 2,000 m ฐานเมฆด้านรับลมอยู่ที่ $125 \\times (T - T_d)$ เมตร ใช้อัตราแอเดียแบติกแห้ง 9.8 °C/km และชื้น 6 °C/km ถ้าฝนตกหมดที่ด้านรับลมและอากาศจมตัวลงแบบแห้งด้านปลายลม อากาศเมื่อลงถึงระดับทะเลอีกด้านมีอุณหภูมิกี่ °C"
    answer: { value: 31.8, tolerance: 0.2, unit: "°C" }
    misconceptions:
      - { match: 28, feedback: "ใช้อัตราแห้ง 9.8 °C/km ทั้งขาขึ้นและขาลง แต่เหนือฐานเมฆอากาศอิ่มตัวเย็นลงเพียงราว 6 °C/km เพราะความร้อนแฝงจากการควบแน่น" }
      - { match: 12.2, feedback: "นี่คืออุณหภูมิที่ยอดเขา ต้องคิดขาลงอีก 2 km ที่ร้อนขึ้น 9.8 °C/km" }
    hints:
      - "ฐานเมฆ $= 125 \\times 8 = 1{,}000$ m ขึ้นถึงฐานเมฆเย็นลง 9.8 °C จากนั้นอีก 1 km เย็นลง 6 °C"
      - "ขาลงจาก 2,000 m ถึงระดับทะเลร้อนขึ้น $9.8 \\times 2$ °C"
    solution: "ถึงฐานเมฆ 1 km: $28 - 9.8 = 18.2$ °C ถึงยอด 2 km: $18.2 - 6 = 12.2$ °C ลงถึงระดับทะเล: $12.2 + 9.8 \\times 2 = 31.8$ °C อากาศด้านปลายลมร้อนและแห้งกว่าด้านรับลม เกิดเงาฝน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.atmosphere.clouds-fronts-forecasting.p011
    topics: [earthscience.atmosphere.clouds-fronts-forecasting]
    difficulty: 4
    type: numeric
