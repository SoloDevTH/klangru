    ai_assisted: true

  - id: computer.society.data-ethics.p016
    topics: [computer.society.data-ethics]
    difficulty: 5
    type: numeric
    stem: "ระบบคัดกรองผู้สมัครมีความถูกต้องโดยรวม 90% จากตัวอย่าง 1,000 รายการ ในกลุ่ม A ที่มี 900 รายการถูกต้อง 95% ส่วนกลุ่ม B มี 100 รายการ ความถูกต้องของกลุ่ม B คิดเป็นกี่เปอร์เซ็นต์ (ตอบเป็นเปอร์เซ็นต์)"
    answer: { value: 45, unit: เปอร์เซ็นต์ }
    hints:
      - "หาจำนวนรายการที่ถูกต้องทั้งหมด คือ 90% ของ 1,000"
      - "หาจำนวนที่ถูกต้องในกลุ่ม A คือ 95% ของ 900 แล้วหักออก"
      - "ที่เหลือคือจำนวนที่ถูกต้องในกลุ่ม B หารด้วย 100"
    misconceptions:
      - { match: 90, feedback: "นั่นคือความถูกต้องโดยรวม โจทย์ถามความถูกต้องของกลุ่ม B เท่านั้น" }
      - { match: 55, feedback: "นั่นคือเปอร์เซ็นต์ของความผิดพลาดในกลุ่ม B ไม่ใช่ความถูกต้อง" }
    solution: "ถูกต้องทั้งหมด = 0.9 × 1,000 = 900 รายการ กลุ่ม A ถูก 0.95 × 900 = 855 รายการ กลุ่ม B ถูก 900 − 855 = 45 รายการ จาก 100 คิดเป็น 45% ซึ่งต่ำกว่าค่าเฉลี่ยรวมมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

