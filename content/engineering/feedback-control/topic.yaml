title:
  th: ระบบควบคุมป้อนกลับและตัวควบคุม PID
  en: Feedback control systems and PID controllers
summary: ระบบวงเปิดกับวงปิด แผนภาพบล็อกและฟังก์ชันถ่ายโอนวงปิด กระบวนการอันดับหนึ่งมีเวลาหน่วง ตัวควบคุม P PI PID ความเสถียรจากขั้ว และการปรับตั้งซีเกลอร์–นิโคลส์ (ค่าสมมติ)
difficulty: 9.5
minutes: 40
