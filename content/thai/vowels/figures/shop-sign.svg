<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif">
<title>ป้ายร้านอาหาร</title>
<rect x="0" y="0" width="640" height="330" fill="#fff"/>
<rect x="20.0" y="20.0" width="600.0" height="290.0" rx="14" fill="#fff8e1" stroke="#8d5524" stroke-width="6"/>
<text x="320.0" y="90.0" font-size="46" text-anchor="middle" fill="#8d5524" font-weight="bold">ร้านป้าใจ</text>
<text x="320.0" y="150.0" font-size="30" text-anchor="middle" fill="#111" font-weight="normal">ก๋วยเตี๋ยวเรือ</text>
<text x="320.0" y="194.0" font-size="30" text-anchor="middle" fill="#111" font-weight="normal">ข้าวมันไก่</text>
<text x="320.0" y="238.0" font-size="30" text-anchor="middle" fill="#111" font-weight="normal">ส้มตำ ไข่เจียว</text>
<text x="320.0" y="282.0" font-size="30" text-anchor="middle" fill="#111" font-weight="normal">น้ำเปล่า โอเลี้ยง</text>
</svg>
