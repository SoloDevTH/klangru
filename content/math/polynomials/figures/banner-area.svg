<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 310" width="500" height="310" font-family="sans-serif" font-size="15">
  <title>สี่เหลี่ยมผืนผ้ากว้าง x + 3 ยาว 2x + 1</title>
  <rect x="0" y="0" width="500" height="310" fill="#ffffff"/>
