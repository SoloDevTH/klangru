copyright: "หลักสูตรแกนกลางฯ เป็นเอกสารที่กระทรวงศึกษาธิการประกาศใช้โดยคำสั่งกระทรวง ตามการตีความของเรา เอกสารนี้เป็นประกาศหรือคำสั่งของหน่วยงานรัฐ จึงไม่เป็นงานอันมีลิขสิทธิ์ตาม พ.ร.บ.ลิขสิทธิ์ พ.ศ. 2537 มาตรา 7 คัดข้อความตัวชี้วัดได้ครบ (การตีความนี้ไม่ใช่คำปรึกษาทางกฎหมาย) การปรับปรุงภายหลัง: ฉบับปรับปรุง 2560/2561 ไม่ได้แก้กลุ่มสาระนี้ นโยบาย CEFR (ประกาศ ศธ. 2557 และประกาศ สพฐ. 2568) เป็นกรอบการวัดผลภาษาอังกฤษที่ใช้ควบคู่ ไม่ได้แก้ตัวชี้วัด"
completeness: full-text
strands:
  - id: ต1
    title: ภาษาเพื่อการสื่อสาร
    standards:
      - id: ต 1.1
        text: "เข้าใจและตีความเรื่องที่ฟังและอ่านจากสื่อประเภทต่างๆ และแสดงความคิดเห็นอย่างมีเหตุผล"
        indicators:
          - { id: "ต 1.1 ป.1/1", level: ป.1, text: "ปฏิบัติตามคำสั่งง่ายๆ ที่ฟัง" }
          - { id: "ต 1.1 ป.1/2", level: ป.1, text: "ระบุตัวอักษรและเสียง อ่านออกเสียงและสะกดคำง่ายๆ ถูกต้องตามหลักการอ่าน" }
          - { id: "ต 1.1 ป.1/3", level: ป.1, text: "เลือกภาพตรงตามความหมายของคำ และกลุ่มคำที่ฟัง" }
          - { id: "ต 1.1 ป.1/4", level: ป.1, text: "ตอบคำถามจากการฟังเรื่องใกล้ตัว" }
          - { id: "ต 1.1 ป.2/1", level: ป.2, text: "ปฏิบัติตามคำสั่ง และคำขอร้องง่ายๆ ที่ฟัง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และคำขอร้อง|ง่ายๆ” ไม่เว้นวรรค" }
          - { id: "ต 1.1 ป.2/2", level: ป.2, text: "ระบุตัวอักษรและเสียง อ่านออกเสียงคำ สะกดคำ และอ่านประโยคง่ายๆ ถูกต้องตามหลักการอ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ถูกต้อง|ตามหลักการอ่าน” ไม่เว้นวรรค" }
          - { id: "ต 1.1 ป.2/3", level: ป.2, text: "เลือกภาพตรงตามความหมายของคำ กลุ่มคำ และประโยคที่ฟัง" }
          - { id: "ต 1.1 ป.2/4", level: ป.2, text: "ตอบคำถามจากการฟังประโยค บทสนทนา หรือนิทานง่ายๆ ที่มีภาพประกอบ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การฟังประโยค|บทสนทนา” เว้นวรรค" }
          - { id: "ต 1.1 ป.3/1", level: ป.3, text: "ปฏิบัติตามคำสั่งและคำขอร้องที่ฟังหรืออ่าน" }
          - { id: "ต 1.1 ป.3/2", level: ป.3, text: "อ่านออกเสียงคำ สะกดคำ อ่านกลุ่มคำ ประโยค และบทพูดเข้าจังหวะ (chant) ง่ายๆ ถูกต้องตามหลักการอ่าน" }
          - { id: "ต 1.1 ป.3/3", level: ป.3, text: "เลือก/ระบุภาพหรือสัญลักษณ์ตรงตามความหมายของกลุ่มคำและประโยคที่ฟัง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “หรือสัญลักษณ์|ตรงตาม” ไม่เว้นวรรค" }
          - { id: "ต 1.1 ป.3/4", level: ป.3, text: "ตอบคำถามจากการฟังหรืออ่านประโยค บทสนทนา หรือนิทานง่ายๆ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การฟังหรืออ่าน|ประโยค” ไม่เว้นวรรค" }
          - { id: "ต 1.1 ป.4/1", level: ป.4, text: "ปฏิบัติตามคำสั่ง คำขอร้อง และคำแนะนำ (instructions) ง่ายๆ ที่ฟังหรืออ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และ|คำแนะนำ” ไม่เว้นวรรค" }
          - { id: "ต 1.1 ป.4/2", level: ป.4, text: "อ่านออกเสียงคำ สะกดคำ อ่านกลุ่มคำ ประโยค ข้อความง่ายๆ และบทพูดเข้าจังหวะถูกต้องตามหลักการอ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ข้อความง่ายๆ|และบทพูด” เว้นวรรค" }
          - { id: "ต 1.1 ป.4/3", level: ป.4, text: "เลือก/ระบุภาพหรือสัญลักษณ์ หรือเครื่องหมายตรงตามความหมายของประโยคและข้อความสั้นๆ ที่ฟังหรืออ่าน" }
          - { id: "ต 1.1 ป.4/4", level: ป.4, text: "ตอบคำถามจากการฟังและอ่านประโยค บทสนทนา และนิทานง่ายๆ" }
          - { id: "ต 1.1 ป.5/1", level: ป.5, text: "ปฏิบัติตามคำสั่ง คำขอร้อง และคำแนะนำง่ายๆ ที่ฟังและอ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และ|คำแนะนำง่ายๆ” ไม่เว้นวรรค" }
          - { id: "ต 1.1 ป.5/2", level: ป.5, text: "อ่านออกเสียงประโยค ข้อความ และบทกลอนสั้นๆ ถูกต้องตามหลักการอ่าน" }
          - { id: "ต 1.1 ป.5/3", level: ป.5, text: "ระบุ/วาดภาพ สัญลักษณ์หรือเครื่องหมายตรงตามความหมายของประโยคและข้อความสั้นๆ ที่ฟังหรืออ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “สัญลักษณ์หรือ|เครื่องหมายตรง” ไม่เว้นวรรค" }
          - { id: "ต 1.1 ป.5/4", level: ป.5, text: "บอกใจความสำคัญและตอบคำถามจากการฟังและอ่านบทสนทนา และนิทานง่ายๆ หรือเรื่องสั้นๆ" }
          - { id: "ต 1.1 ป.6/1", level: ป.6, text: "ปฏิบัติตามคำสั่ง คำขอร้อง และคำแนะนำที่ฟังและอ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และ|คำแนะนำที่ฟัง” ไม่เว้นวรรค" }
          - { id: "ต 1.1 ป.6/2", level: ป.6, text: "อ่านออกเสียงข้อความ นิทาน และบทกลอนสั้นๆ ถูกต้องตามหลักการอ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “นิทาน|และบทกลอน” เว้นวรรค" }
          - { id: "ต 1.1 ป.6/3", level: ป.6, text: "เลือก/ระบุประโยคหรือข้อความสั้นๆ ตรงตามภาพ สัญลักษณ์หรือเครื่องหมายที่อ่าน" }
          - { id: "ต 1.1 ป.6/4", level: ป.6, text: "บอกใจความสำคัญและตอบคำถามจากการฟัง และอ่านบทสนทนา นิทานง่ายๆ และเรื่องเล่า" }
          - { id: "ต 1.1 ม.1/1", level: ม.1, text: "ปฏิบัติตามคำสั่ง คำขอร้อง คำแนะนำ และคำชี้แจงง่ายๆ ที่ฟังและอ่าน" }
          - { id: "ต 1.1 ม.1/2", level: ม.1, text: "อ่านออกเสียงข้อความ นิทาน และบทร้อยกรอง (poem) สั้นๆ ถูกต้องตามหลักการอ่าน" }
          - { id: "ต 1.1 ม.1/3", level: ม.1, text: "เลือก/ระบุประโยคและข้อความให้สัมพันธ์กับสื่อที่ไม่ใช่ความเรียง (non-text information) ที่อ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…อที่ไม่ใช่ความเรียง|(non-text” เว้นวรรค" }
          - { id: "ต 1.1 ม.1/4", level: ม.1, text: "ระบุหัวข้อเรื่อง (topic) ใจความสำคัญ (main idea) และตอบคำถามจากการฟังและอ่านบทสนทนา นิทาน และเรื่องสั้น", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “(topic)|ใจความสำคัญ” เว้นวรรค" }
          - { id: "ต 1.1 ม.2/1", level: ม.2, text: "ปฏิบัติตามคำขอร้อง คำแนะนำ คำชี้แจง และคำอธิบายง่ายๆ ที่ฟังและอ่าน" }
          - { id: "ต 1.1 ม.2/2", level: ม.2, text: "อ่านออกเสียงข้อความ ข่าว ประกาศ และบทร้อยกรองสั้นๆ ถูกต้องตามหลักการอ่าน" }
          - { id: "ต 1.1 ม.2/3", level: ม.2, text: "ระบุ/เขียนประโยค และข้อความ ให้สัมพันธ์กับสื่อที่ไม่ใช่ความเรียงรูปแบบต่างๆ ที่อ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…อที่ไม่ใช่ความเรียง|รูปแบบต่างๆ” ไม่เว้นวรรค" }
          - { id: "ต 1.1 ม.2/4", level: ม.2, text: "เลือกหัวข้อเรื่อง ใจความสำคัญ บอกรายละเอียดสนับสนุน (supporting detail) และแสดงความคิดเห็นเกี่ยวกับเรื่องที่ฟังและอ่าน พร้อมทั้งให้เหตุผลและยกตัวอย่างง่ายๆ ประกอบ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “รายละเอียดสนับสนุน|(supporting” เว้นวรรค" }
          - { id: "ต 1.1 ม.3/1", level: ม.3, text: "ปฏิบัติตามคำขอร้อง คำแนะนำ คำชี้แจง และคำอธิบายที่ฟังและอ่าน" }
          - { id: "ต 1.1 ม.3/2", level: ม.3, text: "อ่านออกเสียงข้อความ ข่าว โฆษณา และบทร้อยกรองสั้นๆ ถูกต้องตามหลักการอ่าน" }
          - { id: "ต 1.1 ม.3/3", level: ม.3, text: "ระบุและเขียนสื่อที่ไม่ใช่ความเรียงรูปแบบต่างๆ ให้สัมพันธ์กับประโยค และข้อความที่ฟังหรืออ่าน" }
          - { id: "ต 1.1 ม.3/4", level: ม.3, text: "เลือก/ระบุหัวข้อเรื่อง ใจความสำคัญ รายละเอียดสนับสนุน และแสดงความคิดเห็นเกี่ยวกับเรื่องที่ฟังและอ่านจากสื่อประเภทต่างๆ พร้อมทั้งให้เหตุผลและยกตัวอย่างประกอบ" }
          - { id: "ต 1.1 ม.4-6/1", level: ม.4-6, text: "ปฏิบัติตามคำแนะนำในคู่มือการใช้งานต่างๆ คำชี้แจง คำอธิบาย และคำบรรยายที่ฟังและอ่าน" }
          - { id: "ต 1.1 ม.4-6/2", level: ม.4-6, text: "อ่านออกเสียงข้อความ ข่าว ประกาศ โฆษณา บทร้อยกรอง และบทละครสั้น (skit) ถูกต้องตามหลักการอ่าน" }
          - { id: "ต 1.1 ม.4-6/3", level: ม.4-6, text: "อธิบายและเขียนประโยคและข้อความให้สัมพันธ์กับสื่อที่ไม่ใช่ความเรียงรูปแบบต่างๆ ที่อ่าน รวมทั้งระบุและเขียนสื่อที่ไม่ใช่ความเรียงรูปแบบต่างๆ ให้สัมพันธ์กับประโยค และข้อความที่ฟังหรืออ่าน" }
          - { id: "ต 1.1 ม.4-6/4", level: ม.4-6, text: "จับใจความสำคัญ วิเคราะห์ความ สรุปความ ตีความ และแสดงความคิดเห็นจากการฟังและอ่านเรื่องที่เป็นสารคดี และบันเทิงคดี พร้อมทั้งให้เหตุผลและยกตัวอย่างประกอบ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “วิเคราะห์ความ|สรุปความ” เว้นวรรค" }
      - id: ต 1.2
        text: "มีทักษะการสื่อสารทางภาษาในการแลกเปลี่ยนข้อมูลข่าวสาร แสดงความรู้สึกและความคิดเห็นอย่างมีประสิทธิภาพ"
        indicators:
          - { id: "ต 1.2 ป.1/1", level: ป.1, text: "พูดโต้ตอบด้วยคำสั้นๆ ง่ายๆ ในการสื่อสารระหว่างบุคคลตามแบบที่ฟัง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ง่ายๆ|ในการสื่อสาร” เว้นวรรค; “ระหว่างบุคคล|ตามแบบที่ฟัง” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ป.1/2", level: ป.1, text: "ใช้คำสั่งง่ายๆ ตามแบบที่ฟัง" }
          - { id: "ต 1.2 ป.1/3", level: ป.1, text: "บอกความต้องการง่ายๆ ของตนเองตามแบบที่ฟัง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ของตนเอง|ตามแบบที่ฟัง” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ป.1/4", level: ป.1, text: "พูดขอและให้ข้อมูลง่ายๆ เกี่ยวกับตนเองตามแบบที่ฟัง" }
          - { id: "ต 1.2 ป.2/1", level: ป.2, text: "พูดโต้ตอบด้วยคำสั้นๆ ง่ายๆ ในการสื่อสารระหว่างบุคคลตามแบบที่ฟัง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ง่ายๆ|ในการสื่อสาร” เว้นวรรค; “ระหว่างบุคคล|ตามแบบที่ฟัง” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ป.2/2", level: ป.2, text: "ใช้คำสั่งและคำขอร้องง่ายๆ ตามแบบที่ฟัง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “คำขอร้องง่ายๆ|ตามแบบที่ฟัง” เว้นวรรค" }
          - { id: "ต 1.2 ป.2/3", level: ป.2, text: "บอกความต้องการง่ายๆ ของตนเองตามแบบที่ฟัง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ของตนเอง|ตามแบบที่ฟัง” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ป.2/4", level: ป.2, text: "พูดขอและให้ข้อมูลง่ายๆ เกี่ยวกับตนเองตามแบบที่ฟัง" }
          - { id: "ต 1.2 ป.3/1", level: ป.3, text: "พูดโต้ตอบด้วยคำสั้นๆ ง่ายๆ ในการสื่อสารระหว่างบุคคลตามแบบที่ฟัง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ง่ายๆ|ในการสื่อสาร” เว้นวรรค; “ระหว่างบุคคล|ตามแบบที่ฟัง” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ป.3/2", level: ป.3, text: "ใช้คำสั่งและคำขอร้องง่ายๆ ตามแบบที่ฟัง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “คำขอร้องง่ายๆ|ตามแบบที่ฟัง” เว้นวรรค" }
          - { id: "ต 1.2 ป.3/3", level: ป.3, text: "บอกความต้องการง่ายๆ ของตนเองตามแบบที่ฟัง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ของตนเอง|ตามแบบที่ฟัง” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ป.3/4", level: ป.3, text: "พูดขอและให้ข้อมูลง่ายๆ เกี่ยวกับตนเองและเพื่อนตามแบบที่ฟัง" }
          - { id: "ต 1.2 ป.3/5", level: ป.3, text: "บอกความรู้สึกของตนเองเกี่ยวกับสิ่งต่างๆ ใกล้ตัว หรือกิจกรรมต่างๆ ตามแบบที่ฟัง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “กิจกรรมต่างๆ|ตามแบบที่ฟัง” เว้นวรรค" }
          - { id: "ต 1.2 ป.4/1", level: ป.4, text: "พูด/เขียนโต้ตอบในการสื่อสารระหว่างบุคคล", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ในการสื่อสาร|ระหว่างบุคคล” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ป.4/2", level: ป.4, text: "ใช้คำสั่ง คำขอร้อง และคำขออนุญาตง่ายๆ" }
          - { id: "ต 1.2 ป.4/3", level: ป.4, text: "พูด/เขียนแสดงความต้องการของตนเองและขอความช่วยเหลือในสถานการณ์ง่ายๆ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ขอความช่วยเหลือ|ในสถานการณ์” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ป.4/4", level: ป.4, text: "พูด/เขียนเพื่อขอและให้ข้อมูลเกี่ยวกับตนเอง เพื่อนและครอบครัว", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ขอและให้ข้อมูล|เกี่ยวกับตนเอง” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ป.4/5", level: ป.4, text: "พูดแสดงความรู้สึกของตนเองเกี่ยวกับเรื่องต่างๆ ใกล้ตัว และกิจกรรมต่างๆ ตามแบบที่ฟัง", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และ|กิจกรรมต่างๆ” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ป.5/1", level: ป.5, text: "พูด/เขียนโต้ตอบในการสื่อสารระหว่างบุคคล", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ในการสื่อสาร|ระหว่างบุคคล” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ป.5/2", level: ป.5, text: "ใช้คำสั่ง คำขอร้อง คำขออนุญาต และให้คำแนะนำง่ายๆ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “คำขออนุญาต|และให้คำแนะนำ” เว้นวรรค" }
          - { id: "ต 1.2 ป.5/3", level: ป.5, text: "พูด/เขียนแสดงความต้องการ ขอความช่วยเหลือ ตอบรับและปฏิเสธการให้ความช่วยเหลือในสถานการณ์ง่ายๆ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความต้องการ|ขอความช่วยเหลือ” เว้นวรรค; “ความช่วยเหลือ|ในสถานการณ์” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ป.5/4", level: ป.5, text: "พูด/เขียนเพื่อขอและให้ข้อมูลเกี่ยวกับตนเอง เพื่อน ครอบครัว และเรื่องใกล้ตัว", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ขอและให้ข้อมูล|เกี่ยวกับตนเอง” ไม่เว้นวรรค; “ครอบครัว|และเรื่องใกล้ตัว” เว้นวรรค" }
          - { id: "ต 1.2 ป.5/5", level: ป.5, text: "พูด/เขียนแสดงความรู้สึกของตนเองเกี่ยวกับเรื่องต่างๆ ใกล้ตัว และกิจกรรมต่างๆ พร้อมทั้งให้เหตุผลสั้นๆ ประกอบ" }
          - { id: "ต 1.2 ป.6/1", level: ป.6, text: "พูด/เขียนโต้ตอบในการสื่อสารระหว่างบุคคล", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ในการสื่อสาร|ระหว่างบุคคล” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ป.6/2", level: ป.6, text: "ใช้คำสั่ง คำขอร้อง คำขออนุญาต และให้คำแนะนำ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “คำขออนุญาต|และให้คำแนะนำ” เว้นวรรค" }
          - { id: "ต 1.2 ป.6/3", level: ป.6, text: "พูด/เขียนแสดงความต้องการ ขอความช่วยเหลือ ตอบรับและปฏิเสธการให้ความช่วยเหลือในสถานการณ์ง่ายๆ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความต้องการ|ขอความช่วยเหลือ” เว้นวรรค; “ความช่วยเหลือ|ในสถานการณ์” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ป.6/4", level: ป.6, text: "พูดและเขียนเพื่อขอและให้ข้อมูลเกี่ยวกับตนเอง เพื่อน ครอบครัว และเรื่องใกล้ตัว" }
          - { id: "ต 1.2 ป.6/5", level: ป.6, text: "พูด/เขียนแสดงความรู้สึกของตนเองเกี่ยวกับเรื่องต่างๆ ใกล้ตัว กิจกรรมต่างๆ พร้อมทั้งให้เหตุผลสั้นๆ ประกอบ" }
          - { id: "ต 1.2 ม.1/1", level: ม.1, text: "สนทนาแลกเปลี่ยนข้อมูลเกี่ยวกับตนเอง กิจกรรม และสถานการณ์ต่างๆ ในชีวิตประจำวัน" }
          - { id: "ต 1.2 ม.1/2", level: ม.1, text: "ใช้คำขอร้อง ให้คำแนะนำ และคำชี้แจงตามสถานการณ์" }
          - { id: "ต 1.2 ม.1/3", level: ม.1, text: "พูดและเขียนแสดงความต้องการ ขอความช่วยเหลือ ตอบรับและปฏิเสธการให้ความช่วยเหลือในสถานการณ์ต่างๆ อย่างเหมาะสม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความต้องการ|ขอความช่วยเหลือ” เว้นวรรค; “การให้ความช่วยเหลือ|ในสถานการณ์ต่างๆ” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ม.1/4", level: ม.1, text: "พูดและเขียนเพื่อขอและให้ข้อมูล และแสดงความคิดเห็นเกี่ยวกับเรื่องที่ฟังหรืออ่านอย่างเหมาะสม" }
          - { id: "ต 1.2 ม.1/5", level: ม.1, text: "พูดและเขียนแสดงความรู้สึก และความคิดเห็นของตนเองเกี่ยวกับเรื่องต่างๆ ใกล้ตัว กิจกรรมต่างๆ พร้อมทั้งให้เหตุผลสั้นๆ ประกอบอย่างเหมาะสม" }
          - { id: "ต 1.2 ม.2/1", level: ม.2, text: "สนทนาแลกเปลี่ยนข้อมูลเกี่ยวกับตนเอง เรื่องต่างๆ ใกล้ตัว และสถานการณ์ต่างๆ ในชีวิตประจำวันอย่างเหมาะสม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และ|สถานการณ์ต่างๆ” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ม.2/2", level: ม.2, text: "ใช้คำขอร้อง ให้คำแนะนำ คำชี้แจง และคำอธิบายตามสถานการณ์", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “คำชี้แจง|และคำอธิบายตาม” เว้นวรรค" }
          - { id: "ต 1.2 ม.2/3", level: ม.2, text: "พูดและเขียนแสดงความต้องการ เสนอและให้ความช่วยเหลือ ตอบรับและปฏิเสธการให้ความช่วยเหลือในสถานการณ์ต่างๆ อย่างเหมาะสม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การให้ความช่วยเหลือ|ในสถานการณ์ต่างๆ” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ม.2/4", level: ม.2, text: "พูดและเขียนเพื่อขอและให้ข้อมูล บรรยาย และแสดงความคิดเห็นเกี่ยวกับเรื่องที่ฟังหรืออ่านอย่างเหมาะสม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และแสดงความคิดเห็น|เกี่ยวกับเรื่องที่ฟั…” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ม.2/5", level: ม.2, text: "พูดและเขียนแสดงความรู้สึก และความคิดเห็นของตนเองเกี่ยวกับเรื่องต่างๆ กิจกรรม และประสบการณ์ พร้อมทั้งให้เหตุผลประกอบอย่างเหมาะสม" }
          - { id: "ต 1.2 ม.3/1", level: ม.3, text: "สนทนาและเขียนโต้ตอบข้อมูลเกี่ยวกับตนเอง เรื่องต่างๆ ใกล้ตัว สถานการณ์ ข่าว เรื่องที่อยู่ในความสนใจของสังคม และสื่อสารอย่างต่อเนื่องและเหมาะสม" }
          - { id: "ต 1.2 ม.3/2", level: ม.3, text: "ใช้คำขอร้อง ให้คำแนะนำ คำชี้แจง และคำอธิบายอย่างเหมาะสม" }
          - { id: "ต 1.2 ม.3/3", level: ม.3, text: "พูดและเขียนแสดงความต้องการ เสนอและให้ความช่วยเหลือ ตอบรับและปฏิเสธการให้ความช่วยเหลือในสถานการณ์ต่างๆ อย่างเหมาะสม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การให้ความช่วยเหลือ|ในสถานการณ์ต่างๆ” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ม.3/4", level: ม.3, text: "พูดและเขียนเพื่อขอและให้ข้อมูล อธิบาย เปรียบเทียบ และแสดงความคิดเห็นเกี่ยวกับเรื่องที่ฟังหรืออ่านอย่างเหมาะสม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และแสดง|ความคิดเห็นเกี่ยวกับ” ไม่เว้นวรรค" }
          - { id: "ต 1.2 ม.3/5", level: ม.3, text: "พูดและเขียนบรรยายความรู้สึกและความคิดเห็นของตนเองเกี่ยวกับเรื่องต่างๆ กิจกรรม ประสบการณ์ และข่าว/เหตุการณ์ พร้อมทั้งให้เหตุผลประกอบอย่างเหมาะสม" }
          - { id: "ต 1.2 ม.4-6/1", level: ม.4-6, text: "สนทนาและเขียนโต้ตอบข้อมูลเกี่ยวกับตนเอง เรื่องต่างๆ ใกล้ตัว ประสบการณ์ สถานการณ์ ข่าว/เหตุการณ์ ประเด็นที่อยู่ในความสนใจของสังคม และสื่อสารอย่างต่อเนื่องและเหมาะสม" }
          - { id: "ต 1.2 ม.4-6/2", level: ม.4-6, text: "เลือกและใช้คำขอร้อง ให้คำแนะนำ คำชี้แจง คำอธิบายอย่างคล่องแคล่ว" }
          - { id: "ต 1.2 ม.4-6/3", level: ม.4-6, text: "พูดและเขียนแสดงความต้องการ เสนอ ตอบรับและปฏิเสธการให้ความช่วยเหลือในสถานการณ์จำลองหรือสถานการณ์จริงอย่างเหมาะสม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…เขียนแสดงความต้องการ|เสนอ” เว้นวรรค" }
          - { id: "ต 1.2 ม.4-6/4", level: ม.4-6, text: "พูดและเขียนเพื่อขอและให้ข้อมูล บรรยาย อธิบาย เปรียบเทียบ และแสดงความคิดเห็นเกี่ยวกับเรื่อง/ประเด็น/ข่าว/เหตุการณ์ที่ฟังและอ่านอย่างเหมาะสม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…นเพื่อขอและให้ข้อมูล|บรรยาย” เว้นวรรค" }
          - { id: "ต 1.2 ม.4-6/5", level: ม.4-6, text: "พูดและเขียนบรรยายความรู้สึกและแสดงความคิดเห็นของตนเองเกี่ยวกับเรื่องต่างๆ กิจกรรม ประสบการณ์ และข่าว/เหตุการณ์อย่างมีเหตุผล", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…งความคิดเห็นของตนเอง|เกี่ยวกับเรื่องต่างๆ” ไม่เว้นวรรค; “กิจกรรม|ประสบการณ์” เว้นวรรค; “และข่าว/เหตุการณ์|อย่างมีเหตุผล” ไม่เว้นวรรค" }
      - id: ต 1.3
        text: "นำเสนอข้อมูลข่าวสาร ความคิดรวบยอด และความคิดเห็นในเรื่องต่างๆ โดยการพูด และการเขียน"
        indicators:
          - { id: "ต 1.3 ป.1/1", level: ป.1, text: "พูดให้ข้อมูลเกี่ยวกับตนเองและเรื่องใกล้ตัว" }
          - { id: "ต 1.3 ป.2/1", level: ป.2, text: "พูดให้ข้อมูลเกี่ยวกับตนเองและเรื่องใกล้ตัว" }
          - { id: "ต 1.3 ป.3/1", level: ป.3, text: "พูดให้ข้อมูลเกี่ยวกับตนเองและเรื่องใกล้ตัว" }
          - { id: "ต 1.3 ป.3/2", level: ป.3, text: "จัดหมวดหมู่คำตามประเภทของบุคคล สัตว์ และสิ่งของตามที่ฟังหรืออ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ตามที่ฟัง|หรืออ่าน” ไม่เว้นวรรค" }
          - { id: "ต 1.3 ป.4/1", level: ป.4, text: "พูด/เขียนให้ข้อมูลเกี่ยวกับตนเอง และเรื่องใกล้ตัว" }
          - { id: "ต 1.3 ป.4/2", level: ป.4, text: "พูด/วาดภาพแสดงความสัมพันธ์ของสิ่งต่างๆ ใกล้ตัวตามที่ฟังหรืออ่าน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ตามที่ฟัง|หรืออ่าน” ไม่เว้นวรรค" }
          - { id: "ต 1.3 ป.4/3", level: ป.4, text: "พูดแสดงความคิดเห็นง่ายๆ เกี่ยวกับเรื่องต่างๆ ใกล้ตัว" }
          - { id: "ต 1.3 ป.5/1", level: ป.5, text: "พูด/เขียนให้ข้อมูลเกี่ยวกับตนเองและเรื่องใกล้ตัว" }
          - { id: "ต 1.3 ป.5/2", level: ป.5, text: "เขียนภาพ แผนผัง และแผนภูมิแสดงข้อมูลต่างๆ ตามที่ฟังหรืออ่าน" }
          - { id: "ต 1.3 ป.5/3", level: ป.5, text: "พูดแสดงความคิดเห็นเกี่ยวกับเรื่องต่างๆ ใกล้ตัว" }
          - { id: "ต 1.3 ป.6/1", level: ป.6, text: "พูด/เขียนให้ข้อมูลเกี่ยวกับตนเอง เพื่อน และสิ่งแวดล้อมใกล้ตัว" }
          - { id: "ต 1.3 ป.6/2", level: ป.6, text: "เขียนภาพ แผนผัง แผนภูมิและตารางแสดงข้อมูลต่างๆ ตามที่ฟังหรืออ่าน" }
          - { id: "ต 1.3 ป.6/3", level: ป.6, text: "พูด/เขียนแสดงความคิดเห็นเกี่ยวกับเรื่องต่างๆ ใกล้ตัว", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความคิดเห็น|เกี่ยวกับ” ไม่เว้นวรรค" }
          - { id: "ต 1.3 ม.1/1", level: ม.1, text: "พูดและเขียนบรรยายเกี่ยวกับตนเอง กิจวัตรประจำวัน ประสบการณ์ และสิ่งแวดล้อมใกล้ตัว", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ประสบการณ์|และสิ่งแวดล้อมใกล้ตั…” เว้นวรรค" }
          - { id: "ต 1.3 ม.1/2", level: ม.1, text: "พูด/เขียนสรุปใจความสำคัญ/แก่นสาระ (theme) ที่ได้จากการวิเคราะห์เรื่อง/เหตุการณ์ที่อยู่ในความสนใจของสังคม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ที่ได้จากการ|วิเคราะห์เรื่อง/” ไม่เว้นวรรค; “เหตุการณ์ที่อยู่ใน|ความสนใจของสังคม” ไม่เว้นวรรค" }
          - { id: "ต 1.3 ม.1/3", level: ม.1, text: "พูด/เขียนแสดงความคิดเห็นเกี่ยวกับกิจกรรมหรือเรื่องต่างๆ ใกล้ตัว พร้อมทั้งให้เหตุผลสั้นๆ ประกอบ" }
          - { id: "ต 1.3 ม.2/1", level: ม.2, text: "พูดและเขียนบรรยายเกี่ยวกับตนเอง กิจวัตรประจำวัน ประสบการณ์ และข่าว/เหตุการณ์ที่อยู่ในความสนใจของสังคม" }
          - { id: "ต 1.3 ม.2/2", level: ม.2, text: "พูดและเขียนสรุปใจความสำคัญ/แก่นสาระ หัวข้อเรื่อง (topic) ที่ได้จากการวิเคราะห์เรื่อง/ข่าว/เหตุการณ์ที่อยู่ในความสนใจของสังคม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ใจความสำคัญ/|แก่นสาระ” ไม่เว้นวรรค" }
          - { id: "ต 1.3 ม.2/3", level: ม.2, text: "พูดและเขียนแสดงความคิดเห็นเกี่ยวกับกิจกรรม เรื่องต่างๆ ใกล้ตัว และประสบการณ์พร้อมทั้งให้เหตุผลสั้นๆ ประกอบ" }
          - { id: "ต 1.3 ม.3/1", level: ม.3, text: "พูดและเขียนบรรยายเกี่ยวกับตนเอง ประสบการณ์ ข่าว/เหตุการณ์/เรื่อง/ประเด็นต่างๆ ที่อยู่ในความสนใจของสังคม" }
          - { id: "ต 1.3 ม.3/2", level: ม.3, text: "พูดและเขียนสรุปใจความสำคัญ/แก่นสาระ หัวข้อเรื่องที่ได้จากการวิเคราะห์เรื่อง/ข่าว/เหตุการณ์/สถานการณ์ที่อยู่ในความสนใจของสังคม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ใจความสำคัญ/|แก่นสาระ” ไม่เว้นวรรค; “…อง/ข่าว/เหตุการณ์/|สถานการณ์ที่อยู่ใน” ไม่เว้นวรรค" }
          - { id: "ต 1.3 ม.3/3", level: ม.3, text: "พูดและเขียนแสดงความคิดเห็นเกี่ยวกับกิจกรรม ประสบการณ์ และเหตุการณ์ พร้อมทั้งให้เหตุผลประกอบ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ประสบการณ์|และเหตุการณ์” เว้นวรรค" }
          - { id: "ต 1.3 ม.4-6/1", level: ม.4-6, text: "พูดและเขียนนำเสนอข้อมูลเกี่ยวกับตนเอง ประสบการณ์ ข่าว/เหตุการณ์ เรื่อง และประเด็นต่างๆ ที่อยู่ในความสนใจของสังคม" }
          - { id: "ต 1.3 ม.4-6/2", level: ม.4-6, text: "พูดและเขียนสรุปใจความสำคัญ แก่นสาระที่ได้จากการวิเคราะห์เรื่อง กิจกรรม ข่าว เหตุการณ์ และสถานการณ์ตามความสนใจ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…เขียนสรุปใจความสำคัญ|แก่นสาระที่ได้จากการ…” เว้นวรรค" }
          - { id: "ต 1.3 ม.4-6/3", level: ม.4-6, text: "พูดและเขียนแสดงความคิดเห็นเกี่ยวกับกิจกรรม ประสบการณ์ และเหตุการณ์ ทั้งในท้องถิ่น สังคม และโลก พร้อมทั้งให้เหตุผลและยกตัวอย่างประกอบ", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…เขียนแสดงความคิดเห็น|เกี่ยวกับกิจกรรม” ไม่เว้นวรรค" }
  - id: ต2
    title: ภาษาและวัฒนธรรม
    standards:
      - id: ต 2.1
        text: "เข้าใจความสัมพันธ์ระหว่างภาษากับวัฒนธรรมของเจ้าของภาษา และนำไปใช้ได้อย่างเหมาะสมกับกาลเทศะ"
        indicators:
          - { id: "ต 2.1 ป.1/1", level: ป.1, text: "พูดและทำท่าประกอบตามวัฒนธรรมของเจ้าของภาษา" }
          - { id: "ต 2.1 ป.1/2", level: ป.1, text: "บอกชื่อและคำศัพท์เกี่ยวกับเทศกาลสำคัญของเจ้าของภาษา" }
          - { id: "ต 2.1 ป.1/3", level: ป.1, text: "เข้าร่วมกิจกรรมทางภาษาและวัฒนธรรมที่เหมาะกับวัย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ทางภาษาและ|วัฒนธรรมที่” ไม่เว้นวรรค" }
          - { id: "ต 2.1 ป.2/1", level: ป.2, text: "พูดและทำท่าประกอบตามวัฒนธรรมของเจ้าของภาษา" }
          - { id: "ต 2.1 ป.2/2", level: ป.2, text: "บอกชื่อและคำศัพท์เกี่ยวกับเทศกาลสำคัญของเจ้าของภาษา" }
          - { id: "ต 2.1 ป.2/3", level: ป.2, text: "เข้าร่วมกิจกรรมทางภาษาและวัฒนธรรมที่เหมาะกับวัย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ทางภาษาและ|วัฒนธรรมที่” ไม่เว้นวรรค" }
          - { id: "ต 2.1 ป.3/1", level: ป.3, text: "พูดและทำท่าประกอบตามมารยาทสังคม/วัฒนธรรมของเจ้าของภาษา" }
          - { id: "ต 2.1 ป.3/2", level: ป.3, text: "บอกชื่อและคำศัพท์ง่ายๆ เกี่ยวกับเทศกาล/วันสำคัญ/งานฉลองและชีวิตความเป็นอยู่ของเจ้าของภาษา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “เกี่ยวกับ|เทศกาล/” ไม่เว้นวรรค; “งานฉลองและ|ชีวิตความเป็นอยู่” ไม่เว้นวรรค" }
          - { id: "ต 2.1 ป.3/3", level: ป.3, text: "เข้าร่วมกิจกรรมทางภาษาและวัฒนธรรมที่เหมาะกับวัย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ทางภาษาและ|วัฒนธรรมที่” ไม่เว้นวรรค" }
          - { id: "ต 2.1 ป.4/1", level: ป.4, text: "พูดและทำท่าประกอบอย่างสุภาพตามมารยาทสังคมและวัฒนธรรมของเจ้าของภาษา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และวัฒนธรรม|ของเจ้าของภาษา” ไม่เว้นวรรค" }
          - { id: "ต 2.1 ป.4/2", level: ป.4, text: "ตอบคำถามเกี่ยวกับเทศกาล/วันสำคัญ/งานฉลองและชีวิตความเป็นอยู่ง่ายๆ ของเจ้าของภาษา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “เทศกาล/|วันสำคัญ/” ไม่เว้นวรรค" }
          - { id: "ต 2.1 ป.4/3", level: ป.4, text: "เข้าร่วมกิจกรรมทางภาษาและวัฒนธรรมที่เหมาะกับวัย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ทางภาษาและ|วัฒนธรรมที่” ไม่เว้นวรรค" }
          - { id: "ต 2.1 ป.5/1", level: ป.5, text: "ใช้ถ้อยคำ น้ำเสียง และกิริยาท่าทางอย่างสุภาพตามมารยาทสังคมและวัฒนธรรมของเจ้าของภาษา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “กิริยาท่าทาง|อย่างสุภาพตาม” ไม่เว้นวรรค" }
          - { id: "ต 2.1 ป.5/2", level: ป.5, text: "ตอบคำถาม/บอกความสำคัญของเทศกาล/วันสำคัญ/งานฉลองและชีวิตความเป็นอยู่ง่ายๆ ของเจ้าของภาษา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “บอกความสำคัญ|ของเทศกาล/” ไม่เว้นวรรค" }
          - { id: "ต 2.1 ป.5/3", level: ป.5, text: "เข้าร่วมกิจกรรมทางภาษาและวัฒนธรรมตามความสนใจ" }
          - { id: "ต 2.1 ป.6/1", level: ป.6, text: "ใช้ถ้อยคำ น้ำเสียง และกิริยาท่าทางอย่างสุภาพ เหมาะสมตามมารยาทสังคมและวัฒนธรรมของเจ้าของภาษา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “กิริยาท่าทาง|อย่างสุภาพ” ไม่เว้นวรรค" }
          - { id: "ต 2.1 ป.6/2", level: ป.6, text: "ให้ข้อมูลเกี่ยวกับเทศกาล/วันสำคัญ/งานฉลอง/ชีวิตความเป็นอยู่ของเจ้าของภาษา" }
          - { id: "ต 2.1 ป.6/3", level: ป.6, text: "เข้าร่วมกิจกรรมทางภาษาและวัฒนธรรมตามความสนใจ" }
          - { id: "ต 2.1 ม.1/1", level: ม.1, text: "ใช้ภาษา น้ำเสียง และกิริยาท่าทางสุภาพ เหมาะสมตามมารยาทสังคม และวัฒนธรรมของเจ้าของภาษา" }
          - { id: "ต 2.1 ม.1/2", level: ม.1, text: "บรรยายเกี่ยวกับเทศกาล วันสำคัญ ชีวิตความเป็นอยู่ และประเพณีของเจ้าของภาษา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “วันสำคัญ|ชีวิตความเป็นอยู่” เว้นวรรค; “และประเพณีของ|เจ้าของภาษา” ไม่เว้นวรรค" }
          - { id: "ต 2.1 ม.1/3", level: ม.1, text: "เข้าร่วม/จัดกิจกรรมทางภาษาและวัฒนธรรมตามความสนใจ" }
          - { id: "ต 2.1 ม.2/1", level: ม.2, text: "ใช้ภาษา น้ำเสียง และกิริยาท่าทาง เหมาะกับบุคคลและโอกาสตามมารยาทสังคม และวัฒนธรรมของเจ้าของภาษา" }
          - { id: "ต 2.1 ม.2/2", level: ม.2, text: "อธิบายเกี่ยวกับเทศกาล วันสำคัญ ชีวิตความเป็นอยู่ และประเพณีของเจ้าของภาษา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “วันสำคัญ|ชีวิตความเป็นอยู่” เว้นวรรค" }
          - { id: "ต 2.1 ม.2/3", level: ม.2, text: "เข้าร่วม/จัดกิจกรรมทางภาษาและวัฒนธรรมตามความสนใจ" }
          - { id: "ต 2.1 ม.3/1", level: ม.3, text: "เลือกใช้ภาษา น้ำเสียง และกิริยาท่าทางเหมาะกับบุคคลและโอกาสตามมารยาทสังคม และวัฒนธรรมของเจ้าของภาษา" }
          - { id: "ต 2.1 ม.3/2", level: ม.3, text: "อธิบายเกี่ยวกับชีวิตความเป็นอยู่ ขนบธรรมเนียม และประเพณีของเจ้าของภาษา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ชีวิตความเป็นอยู่|ขนบธรรมเนียม” เว้นวรรค" }
          - { id: "ต 2.1 ม.3/3", level: ม.3, text: "เข้าร่วม/จัดกิจกรรมทางภาษาและวัฒนธรรมตามความสนใจ" }
          - { id: "ต 2.1 ม.4-6/1", level: ม.4-6, text: "เลือกใช้ภาษา น้ำเสียง และกิริยาท่าทางเหมาะกับระดับของบุคคล โอกาส และสถานที่ตามมารยาทสังคมและวัฒนธรรมของเจ้าของภาษา", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และกิริยา|ท่าทางเหมาะกับระดับข…” ไม่เว้นวรรค; “…หมาะกับระดับของบุคคล|โอกาส” เว้นวรรค; “และสถานที่ตามมารยาท|สังคมและวัฒนธรรมของเ…” ไม่เว้นวรรค" }
          - { id: "ต 2.1 ม.4-6/2", level: ม.4-6, text: "อธิบาย/อภิปรายวิถีชีวิต ความคิด ความเชื่อ และที่มาของขนบธรรมเนียม และประเพณีของเจ้าของภาษา" }
          - { id: "ต 2.1 ม.4-6/3", level: ม.4-6, text: "เข้าร่วม แนะนำ และจัดกิจกรรมทางภาษาและวัฒนธรรมอย่างเหมาะสม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และจัดกิจกรรม|ทางภาษาและวัฒนธรรมอย่…” ไม่เว้นวรรค" }
      - id: ต 2.2
        text: "เข้าใจความเหมือนและความแตกต่างระหว่างภาษาและวัฒนธรรมของเจ้าของภาษากับภาษาและวัฒนธรรมไทย และนำมาใช้อย่างถูกต้องและเหมาะสม"
        indicators:
          - { id: "ต 2.2 ป.1/1", level: ป.1, text: "ระบุตัวอักษรและเสียงตัวอักษรของภาษาต่างประเทศและภาษาไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ตัวอักษรของ|ภาษาต่างประเทศ” ไม่เว้นวรรค" }
          - { id: "ต 2.2 ป.2/1", level: ป.2, text: "ระบุตัวอักษรและเสียงตัวอักษรของภาษาต่างประเทศและภาษาไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ตัวอักษรของ|ภาษาต่างประเทศ” ไม่เว้นวรรค" }
          - { id: "ต 2.2 ป.3/1", level: ป.3, text: "บอกความแตกต่างของเสียงตัวอักษร คำ กลุ่มคำ และประโยคง่ายๆ ของภาษาต่างประเทศและภาษาไทย" }
          - { id: "ต 2.2 ป.4/1", level: ป.4, text: "บอกความแตกต่างของเสียงตัวอักษร คำ กลุ่มคำ ประโยค และข้อความของภาษาต่างประเทศและภาษาไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “และข้อความ|ของภาษา” ไม่เว้นวรรค" }
          - { id: "ต 2.2 ป.4/2", level: ป.4, text: "บอกความเหมือน/ความแตกต่างระหว่างเทศกาลและงานฉลองตามวัฒนธรรมของเจ้าของภาษากับของไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความแตกต่าง|ระหว่างเทศกาล” ไม่เว้นวรรค; “และงานฉลอง|ตามวัฒนธรรม” ไม่เว้นวรรค" }
          - { id: "ต 2.2 ป.5/1", level: ป.5, text: "บอกความเหมือน/ความแตกต่างระหว่างการออกเสียงประโยคชนิดต่างๆ การใช้เครื่องหมายวรรคตอน และการลำดับคำ (order) ตามโครงสร้างประโยคของภาษาต่างประเทศและภาษาไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความแตกต่าง|ระหว่าง” ไม่เว้นวรรค; “เครื่องหมาย|วรรคตอน” ไม่เว้นวรรค" }
          - { id: "ต 2.2 ป.5/2", level: ป.5, text: "บอกความเหมือน/ความแตกต่างระหว่างเทศกาลและงานฉลองของเจ้าของภาษากับของไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความแตกต่าง|ระหว่างเทศกาล” ไม่เว้นวรรค; “และงานฉลอง|ของเจ้าของภาษา” ไม่เว้นวรรค" }
          - { id: "ต 2.2 ป.6/1", level: ป.6, text: "บอกความเหมือน/ความแตกต่างระหว่างการออกเสียงประโยคชนิดต่างๆ การใช้เครื่องหมายวรรคตอน และการลำดับคำตามโครงสร้างประโยคของภาษาต่างประเทศและภาษาไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความแตกต่าง|ระหว่าง” ไม่เว้นวรรค; “เครื่องหมาย|วรรคตอน” ไม่เว้นวรรค; “การลำดับคำ|ตามโครงสร้าง” ไม่เว้นวรรค" }
          - { id: "ต 2.2 ป.6/2", level: ป.6, text: "เปรียบเทียบความเหมือน/ความแตกต่างระหว่างเทศกาล งานฉลองและประเพณีของเจ้าของภาษากับของไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความเหมือน/|ความแตกต่าง” ไม่เว้นวรรค; “ระหว่างเทศกาล|งานฉลองและ” เว้นวรรค; “ประเพณีของ|เจ้าของภาษา” ไม่เว้นวรรค" }
          - { id: "ต 2.2 ม.1/1", level: ม.1, text: "บอกความเหมือนและความแตกต่างระหว่างการออกเสียงประโยคชนิดต่างๆ การใช้เครื่องหมายวรรคตอน และการลำดับคำตามโครงสร้างประโยคของภาษาต่างประเทศและภาษาไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “การออกเสียงประโยค|ชนิดต่างๆ” ไม่เว้นวรรค; “โครงสร้างประโยคของ|ภาษาต่างประเทศ” ไม่เว้นวรรค" }
          - { id: "ต 2.2 ม.1/2", level: ม.1, text: "เปรียบเทียบความเหมือนและความแตกต่างระหว่างเทศกาล งานฉลอง วันสำคัญ และชีวิตความเป็นอยู่ของเจ้าของภาษากับของไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความเหมือนและ|ความแตกต่างระหว่าง” ไม่เว้นวรรค" }
          - { id: "ต 2.2 ม.2/1", level: ม.2, text: "เปรียบเทียบและอธิบายความเหมือนและความแตกต่างระหว่างการออกเสียงประโยคชนิดต่างๆ และการลำดับคำตามโครงสร้างประโยคของภาษาต่างประเทศและภาษาไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความแตกต่างระหว่าง|การออกเสียงประโยค” ไม่เว้นวรรค; “ภาษาต่างประเทศ|และภาษาไทย” ไม่เว้นวรรค" }
          - { id: "ต 2.2 ม.2/2", level: ม.2, text: "เปรียบเทียบและอธิบายความเหมือนและความแตกต่างระหว่างชีวิตความเป็นอยู่ และวัฒนธรรมของเจ้าของภาษากับของไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “เปรียบเทียบและอธิบาย|ความเหมือนและ” ไม่เว้นวรรค" }
          - { id: "ต 2.2 ม.3/1", level: ม.3, text: "เปรียบเทียบและอธิบายความเหมือนและความแตกต่างระหว่างการออกเสียงประโยคชนิดต่างๆ และการลำดับคำตามโครงสร้างประโยคของภาษาต่างประเทศและภาษาไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “ความแตกต่างระหว่าง|การออกเสียงประโยค” ไม่เว้นวรรค; “ภาษาต่างประเทศ|และภาษาไทย” ไม่เว้นวรรค" }
          - { id: "ต 2.2 ม.3/2", level: ม.3, text: "เปรียบเทียบและอธิบายความเหมือนและความแตกต่างระหว่างชีวิตความเป็นอยู่และวัฒนธรรมของเจ้าของภาษากับของไทย และนำไปใช้อย่างเหมาะสม", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “เปรียบเทียบและอธิบาย|ความเหมือนและ” ไม่เว้นวรรค" }
          - { id: "ต 2.2 ม.4-6/1", level: ม.4-6, text: "อธิบาย/เปรียบเทียบความแตกต่างระหว่างโครงสร้างประโยค ข้อความ สำนวน คำพังเพย สุภาษิต และบทกลอนของภาษาต่างประเทศและภาษาไทย", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…รียบเทียบความแตกต่าง|ระหว่างโครงสร้างประโ…” ไม่เว้นวรรค" }
          - { id: "ต 2.2 ม.4-6/2", level: ม.4-6, text: "วิเคราะห์/อภิปรายความเหมือนและความแตกต่างระหว่างวิถีชีวิต ความเชื่อ และวัฒนธรรมของเจ้าของภาษากับของไทย และนำไปใช้อย่างมีเหตุผล" }
  - id: ต3
    title: ภาษากับความสัมพันธ์กับกลุ่มสาระการเรียนรู้อื่น
    standards:
      - id: ต 3.1
        text: "ใช้ภาษาต่างประเทศในการเชื่อมโยงความรู้กับกลุ่มสาระการเรียนรู้อื่น และเป็นพื้นฐานในการพัฒนา แสวงหาความรู้ และเปิดโลกทัศน์ของตน"
        indicators:
          - { id: "ต 3.1 ป.1/1", level: ป.1, text: "บอกคำศัพท์ที่เกี่ยวข้องกับกลุ่มสาระการเรียนรู้อื่น", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “กลุ่มสาระ|การเรียนรู้อื่น” ไม่เว้นวรรค" }
          - { id: "ต 3.1 ป.2/1", level: ป.2, text: "บอกคำศัพท์ที่เกี่ยวข้องกับกลุ่มสาระการเรียนรู้อื่น", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “กลุ่มสาระ|การเรียนรู้อื่น” ไม่เว้นวรรค" }
          - { id: "ต 3.1 ป.3/1", level: ป.3, text: "บอกคำศัพท์ที่เกี่ยวข้องกับกลุ่มสาระการเรียนรู้อื่น", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “กลุ่มสาระ|การเรียนรู้อื่น” ไม่เว้นวรรค" }
          - { id: "ต 3.1 ป.4/1", level: ป.4, text: "ค้นคว้า รวบรวมคำศัพท์ที่เกี่ยวข้องกับกลุ่มสาระการเรียนรู้อื่น และนำเสนอด้วยการพูด/การเขียน" }
          - { id: "ต 3.1 ป.5/1", level: ป.5, text: "ค้นคว้า รวบรวมคำศัพท์ที่เกี่ยวข้องกับกลุ่มสาระการเรียนรู้อื่น และนำเสนอด้วยการพูด/การเขียน" }
          - { id: "ต 3.1 ป.6/1", level: ป.6, text: "ค้นคว้า รวบรวมคำศัพท์ที่เกี่ยวข้องกับกลุ่มสาระการเรียนรู้อื่นจากแหล่งการเรียนรู้ และนำเสนอด้วยการพูด/การเขียน" }
          - { id: "ต 3.1 ม.1/1", level: ม.1, text: "ค้นคว้า รวบรวม และสรุปข้อมูล/ข้อเท็จจริงที่เกี่ยวข้องกับกลุ่มสาระการเรียนรู้อื่นจากแหล่งการเรียนรู้ และนำเสนอด้วยการพูด/การเขียน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…ยวข้องกับกลุ่มสาระ|การเรียนรู้อื่นจากแห…” ไม่เว้นวรรค" }
          - { id: "ต 3.1 ม.2/1", level: ม.2, text: "ค้นคว้า รวบรวม และสรุปข้อมูล/ข้อเท็จจริงที่เกี่ยวข้องกับกลุ่มสาระการเรียนรู้อื่นจากแหล่งการเรียนรู้ และนำเสนอด้วยการพูด/การเขียน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…ยวข้องกับกลุ่มสาระ|การเรียนรู้อื่นจากแห…” ไม่เว้นวรรค" }
          - { id: "ต 3.1 ม.3/1", level: ม.3, text: "ค้นคว้า รวบรวม และสรุปข้อมูล/ข้อเท็จจริงที่เกี่ยวข้องกับกลุ่มสาระการเรียนรู้อื่นจากแหล่งการเรียนรู้ และนำเสนอด้วยการพูด/การเขียน", note: "ต้นฉบับขึ้นบรรทัดใหม่ในตารางและเอกสาร สพฐ. ฉบับอื่นก็ขึ้นบรรทัดตรงเดียวกัน จึงยืนยันการเว้นวรรคตรงรอยต่อไม่ได้: “…ยวข้องกับกลุ่มสาระ|การเรียนรู้อื่นจากแห…” ไม่เว้นวรรค" }
          - { id: "ต 3.1 ม.4-6/1", level: ม.4-6, text: "ค้นคว้า/สืบค้น บันทึก สรุป และแสดงความคิดเห็นเกี่ยวกับข้อมูลที่เกี่ยวข้องกับกลุ่มสาระการเรียนรู้อื่นจากแหล่งการเรียนรู้ต่างๆ และนำเสนอด้วยการพูดและการเขียน" }
  - id: ต4
    title: ภาษากับความสัมพันธ์กับชุมชนและโลก
