<rect x="75.0" y="100.0" width="190.0" height="88.0" rx="12" fill="#fff" stroke="#1e7b3c" stroke-width="2.5"/>
<text x="170.0" y="128.0" font-size="22" text-anchor="middle" fill="#1e7b3c" font-weight="bold">can</text>
<text x="170.0" y="151.0" font-size="14" text-anchor="middle" fill="#111">ทำได้ / อนุญาต</text>
<text x="170.0" y="175.0" font-size="13" text-anchor="middle" fill="#555" font-style="italic">You can use my pen.</text>
<rect x="285.0" y="100.0" width="190.0" height="88.0" rx="12" fill="#fff" stroke="#b35900" stroke-width="2.5"/>
<text x="380.0" y="128.0" font-size="22" text-anchor="middle" fill="#b35900" font-weight="bold">should</text>
<text x="380.0" y="151.0" font-size="14" text-anchor="middle" fill="#111">ควร (คำแนะนำ)</text>
<text x="380.0" y="175.0" font-size="13" text-anchor="middle" fill="#555" font-style="italic">You should drink water.</text>
<rect x="495.0" y="100.0" width="190.0" height="88.0" rx="12" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
<text x="590.0" y="128.0" font-size="22" text-anchor="middle" fill="#c0392b" font-weight="bold">must</text>
<text x="590.0" y="151.0" font-size="14" text-anchor="middle" fill="#111">ต้อง (กฎ จำเป็น)</text>
<text x="590.0" y="175.0" font-size="13" text-anchor="middle" fill="#555" font-style="italic">You must wear a helmet.</text>
<text x="20.0" y="222.0" font-size="15" text-anchor="start" fill="#111" font-weight="bold">ปฏิเสธ</text>
<rect x="75.0" y="232.0" width="190.0" height="88.0" rx="12" fill="#fff" stroke="#1e7b3c" stroke-width="2.5"/>
<text x="170.0" y="260.0" font-size="20" text-anchor="middle" fill="#1e7b3c" font-weight="bold">don't have to</text>
<text x="170.0" y="283.0" font-size="14" text-anchor="middle" fill="#111">ไม่จำเป็นต้อง (เลือกได้)</text>
<text x="170.0" y="307.0" font-size="13" text-anchor="middle" fill="#555" font-style="italic">You don't have to come.</text>
<rect x="285.0" y="232.0" width="190.0" height="88.0" rx="12" fill="#fff" stroke="#b35900" stroke-width="2.5"/>
<text x="380.0" y="260.0" font-size="20" text-anchor="middle" fill="#b35900" font-weight="bold">shouldn't</text>
<text x="380.0" y="283.0" font-size="14" text-anchor="middle" fill="#111">ไม่ควร</text>
<text x="380.0" y="307.0" font-size="13" text-anchor="middle" fill="#555" font-style="italic">You shouldn't eat too much.</text>
<rect x="495.0" y="232.0" width="190.0" height="88.0" rx="12" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
<text x="590.0" y="260.0" font-size="20" text-anchor="middle" fill="#c0392b" font-weight="bold">mustn't / can't</text>
<text x="590.0" y="283.0" font-size="14" text-anchor="middle" fill="#111">ห้าม</text>
<text x="590.0" y="307.0" font-size="13" text-anchor="middle" fill="#555" font-style="italic">You mustn't smoke here.</text>
