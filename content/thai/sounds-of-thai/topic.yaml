id: thai.grammar.sounds-of-thai
subject: thai
title: { th: ลักษณะเสียงและธรรมชาติของภาษาไทย, en: "Thai sounds and the nature of language" }
summary: เสียงสระ เสียงพยัญชนะ และเสียงวรรณยุกต์ในภาษาไทย รูปกับเสียงที่ไม่เท่ากัน ลักษณะเด่นของภาษาไทย ธรรมชาติของภาษา และพลังของภาษา
difficulty: 5
minutes: 35
prerequisites: [thai.writing.tone-rules, thai.writing.vowels]
encompasses:
  - { id: thai.writing.vowels, weight: 0.3 }
  - { id: thai.writing.tone-rules, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: vowel-chart.svg
    alt: "ตารางสระเดี่ยว 18 เสียง 3 แถว 3 คอลัมน์ คอลัมน์คือ ลิ้นส่วนหน้า ลิ้นส่วนกลาง ลิ้นส่วนหลัง แถวคือ ลิ้นยกสูง ลิ้นยกกลาง ลิ้นลดต่ำ แถวยกสูง: อิ/อี อึ/อือ อุ/อู · แถวยกกลาง: เอะ/เอ เออะ/เออ โอะ/โอ · แถวลดต่ำ: แอะ/แอ อะ/อา เอาะ/ออ คอลัมน์ลิ้นส่วนหลังระบายสี หมายถึงริมฝีปากห่อกลม ด้านล่างเขียนว่า สระประสม 3 เสียง เอีย = อี→อา เอือ = อือ→อา อัว = อู→อา"
    caption: "ตำแหน่งลิ้นของสระเดี่ยว"
  - { type: explanation, file: lesson.md }
  - type: figure
    src: consonant-places.svg
    alt: "ตาราง 6 ช่อง เรียงจากหน้าปากไปลำคอ: ริมฝีปาก (ป พ บ ม ว) ริมฝีปากกับฟัน (ฟ) ฟันหรือปุ่มเหงือก (ต ท ด น ส ร ล) เพดานแข็ง (จ ช ย) เพดานอ่อน (ก ค ง) เส้นเสียง (อ ห) รวม 21 เสียง ใต้ภาพเขียนว่า ตัวแทนเสียงละ 1 ตัว เช่น ท แทน ถ ฐ ฑ ฒ ธ ส แทน ศ ษ ซ"
    caption: "ฐานที่เกิดเสียงพยัญชนะ 21 เสียง"
  - type: worked-example
    title: แยกเสียงในคำ
    problem: "คำว่า \"ขวาน\" ประกอบด้วยเสียงอะไรบ้าง"
    steps:
      - text: "พยัญชนะต้น: ขว เป็นควบกล้ำแท้ ออกเสียง /ค/ และ /ว/"
      - text: "สระ: อา (สระเดี่ยว เสียงยาว ลิ้นส่วนกลาง ลดต่ำ)"
      - text: "พยัญชนะท้าย: น ตรงมาตราแม่กน"
      - text: "วรรณยุกต์: เสียงจัตวา"
        why: "ข เป็นอักษรสูง คำเป็น ไม่มีรูปวรรณยุกต์ จึงเป็นเสียงจัตวา (ดูบทการผันวรรณยุกต์)"
    answer: "เสียงพยัญชนะ 3 เสียง (ค ว น) สระอา 1 เสียง วรรณยุกต์จัตวา"
  - { type: check, problem: thai.grammar.sounds-of-thai.p010, prompt: "ควบกล้ำแท้ออกเสียงกี่ตัว" }
  - type: worked-example
    title: อธิบายธรรมชาติของภาษาจากตัวอย่าง
    problem: "คนไทยเรียกนกชนิดหนึ่งว่า \"กา\" เพราะร้อง \"กา กา\" แต่เรียก \"นกกระจอก\" โดยไม่ได้เลียนเสียงร้อง ตัวอย่างนี้บอกอะไรเรื่องเสียงกับความหมาย"
    steps:
      - text: "กา เป็นคำเลียนเสียงธรรมชาติ เสียงของคำมาจากเสียงร้องของนก"
      - text: "นกกระจอก ไม่ได้มาจากเสียงร้อง ชื่อนี้คนไทยตกลงใช้กันเอง"
      - text: "คำส่วนใหญ่ในทุกภาษาเป็นแบบหลัง คือเสียงกับความหมายสัมพันธ์กันตามข้อตกลง"
        why: "ถ้าเสียงกับความหมายต้องตรงกันเสมอ ทุกภาษาคงเรียกนกกระจอกด้วยคำเดียวกัน"
    answer: "เสียงกับความหมายส่วนใหญ่สัมพันธ์กันตามข้อตกลงของสังคม มีเพียงคำเลียนเสียงบางคำที่เสียงมาจากธรรมชาติ"
  - { type: check, problem: thai.grammar.sounds-of-thai.p011, prompt: "ใครกำหนดว่าเสียงใดแทนอะไร" }
glossary:
  - { term: เสียงแท้, definition: "เสียงสระ ลมผ่านออกมาโดยไม่ถูกกั้น" }
  - { term: เสียงแปร, definition: "เสียงพยัญชนะ ลมถูกกั้นหรือบีบที่ฐานกรณ์" }
  - { term: เสียงดนตรี, definition: "เสียงวรรณยุกต์ คือระดับเสียงสูงต่ำ" }
  - { term: สระประสม, definition: "สระที่เลื่อนลิ้นจากสระหนึ่งไปอีกสระ ได้แก่ เอีย เอือ อัว" }
  - { term: ภาษาคำโดด, definition: "ภาษาที่คำไม่เปลี่ยนรูปตามเพศ พจน์ หรือกาล ใช้คำอื่นช่วยบอกแทน" }
  - { term: ฐานกรณ์, definition: "ตำแหน่งในช่องปากหรือลำคอที่ลมถูกกั้นจนเกิดเสียงพยัญชนะ" }
flashcards:
  - { front: "รูปและเสียง: สระ พยัญชนะ วรรณยุกต์", back: "สระ 21 รูป 21 เสียง · พยัญชนะ 44 รูป 21 เสียง · วรรณยุกต์ 4 รูป 5 เสียง" }
  - { front: "ตัวสะกดออกเสียงได้กี่เสียง", back: "8 เสียง: ก ด บ ง น ม ย ว" }
  - { front: "ภาษาคำโดด หมายความว่า", back: "คำไม่เปลี่ยนรูปตามเพศ พจน์ กาล เช่น กิน ใช้ได้ทุกกาล" }
  - { front: "ธรรมชาติของภาษา 4 ข้อ", back: "ใช้เสียงสื่อความหมายตามข้อตกลง · หน่วยเล็กประกอบเป็นหน่วยใหญ่ · เปลี่ยนแปลงได้ · มีส่วนเหมือนและต่าง" }
