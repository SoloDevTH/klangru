<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" font-family="sans-serif" font-size="15">
  <title>แผนภาพต้นไม้หยิบลูกอมสองครั้งไม่ใส่คืน จากแดง 3 เขียว 2</title>
  <rect x="0" y="0" width="660" height="320" fill="#ffffff"/>
  <circle cx="30.0" cy="170.0" r="5" fill="#15211e" stroke="none" stroke-width="2"/>
  <line x1="30.0" y1="170.0" x2="172.0" y2="100.0" stroke="#15211e" stroke-width="2" stroke-linecap="round"/>
  <text x="100.0" y="127.0" font-size="15" text-anchor="middle" fill="#3b4fa0" font-weight="bold" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">3/5</text>
  <text x="190.0" y="106.0" font-size="16" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="normal">แดง</text>
  <line x1="208.0" y1="100.0" x2="342.0" y2="60.0" stroke="#15211e" stroke-width="2" stroke-linecap="round"/>
  <text x="275.0" y="72.0" font-size="15" text-anchor="middle" fill="#3b4fa0" font-weight="bold" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">2/4</text>
  <text x="360.0" y="66.0" font-size="16" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="normal">แดง</text>
  <text x="390.0" y="66.0" font-size="14" text-anchor="start" fill="#444" font-weight="normal" font-style="normal">แดง แดง: 3/5 × 2/4 = 6/20</text>
  <line x1="208.0" y1="100.0" x2="342.0" y2="140.0" stroke="#15211e" stroke-width="2" stroke-linecap="round"/>
  <text x="275.0" y="140.0" font-size="15" text-anchor="middle" fill="#3b4fa0" font-weight="bold" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">2/4</text>
  <text x="360.0" y="146.0" font-size="16" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="normal">เขียว</text>
  <text x="390.0" y="146.0" font-size="14" text-anchor="start" fill="#444" font-weight="normal" font-style="normal">แดง เขียว: 6/20</text>
  <line x1="30.0" y1="170.0" x2="172.0" y2="240.0" stroke="#15211e" stroke-width="2" stroke-linecap="round"/>
  <text x="100.0" y="225.0" font-size="15" text-anchor="middle" fill="#3b4fa0" font-weight="bold" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">2/5</text>
  <text x="190.0" y="246.0" font-size="16" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="normal">เขียว</text>
  <line x1="208.0" y1="240.0" x2="342.0" y2="200.0" stroke="#15211e" stroke-width="2" stroke-linecap="round"/>
  <text x="275.0" y="212.0" font-size="15" text-anchor="middle" fill="#3b4fa0" font-weight="bold" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">3/4</text>
  <text x="360.0" y="206.0" font-size="16" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="normal">แดง</text>
  <text x="390.0" y="206.0" font-size="14" text-anchor="start" fill="#444" font-weight="normal" font-style="normal">เขียว แดง: 6/20</text>
  <line x1="208.0" y1="240.0" x2="342.0" y2="280.0" stroke="#15211e" stroke-width="2" stroke-linecap="round"/>
  <text x="275.0" y="280.0" font-size="15" text-anchor="middle" fill="#3b4fa0" font-weight="bold" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">1/4</text>
  <text x="360.0" y="286.0" font-size="16" text-anchor="middle" fill="#15211e" font-weight="bold" font-style="normal">เขียว</text>
  <text x="390.0" y="286.0" font-size="14" text-anchor="start" fill="#444" font-weight="normal" font-style="normal">เขียว เขียว: 2/20</text>
  <text x="190.0" y="28.0" font-size="14" text-anchor="middle" fill="#555" font-weight="normal" font-style="normal">ครั้งที่ 1</text>
  <text x="360.0" y="28.0" font-size="14" text-anchor="middle" fill="#555" font-weight="normal" font-style="normal">ครั้งที่ 2</text>
