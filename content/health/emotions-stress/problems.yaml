problems:
- id: health.mental.emotions-stress.p001
  topics:
  - health.mental.emotions-stress
  difficulty: 1
  type: text
  stem: สายด่วนสุขภาพจิตของกรมสุขภาพจิต โทรฟรีตลอด 24 ชั่วโมง คือหมายเลขใด (ตอบเป็นตัวเลข 4 หลัก)
  accepted:
  - '1323'
  misconceptions:
  - match: '1669'
    feedback: 1669 คือการแพทย์ฉุกเฉิน ใช้เมื่อมีอันตรายเฉพาะหน้า
  - match: '1300'
    feedback: 1300 คือศูนย์ช่วยเหลือสังคม
  hints:
  - ขึ้นต้นด้วย 13
  - ลงท้ายด้วย 23
  solution: สายด่วนสุขภาพจิตคือ 1323 ฟรี ตลอด 24 ชั่วโมง และเป็นความลับ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.emotions-stress.p002
  topics:
  - health.mental.emotions-stress
  difficulty: 1
  type: mcq
  stem: ข้อใดถูกต้องเกี่ยวกับอารมณ์
  choices:
  - id: a
    text: ทุกอารมณ์เป็นเรื่องปกติ สิ่งสำคัญคือวิธีแสดงออก
    correct: true
  - id: b
    text: คนเก่งต้องไม่มีอารมณ์โกรธหรือเศร้า
    feedback: ทุกคนมีอารมณ์ทางลบได้ เป็นเรื่องปกติของมนุษย์
  - id: c
    text: อารมณ์ไม่มีผลต่อร่างกาย
    feedback: อารมณ์รุนแรงทำให้หัวใจเต้นเร็ว ปวดหัว ปวดท้องได้
  hints:
  - อารมณ์บอกข้อมูลบางอย่างกับเรา
  - ความกลัวบอกว่ามีอันตราย
  solution: อารมณ์ทุกแบบเป็นเรื่องปกติและบอกข้อมูล เราเลือกได้ว่าจะแสดงออกอย่างไรให้ไม่ทำร้ายตัวเองและคนอื่น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.emotions-stress.p003
  topics:
  - health.mental.emotions-stress
  difficulty: 2
  type: match
  stem: จับคู่สัญญาณความเครียดกับด้านที่แสดงออก
  pairs:
  - left: ใจเต้นแรง ปวดท้อง
    right: ด้านร่างกาย
  - left: กังวล หงุดหงิดง่าย
    right: ด้านอารมณ์
  - left: คิดวนว่าต้องล้มเหลว
    right: ด้านความคิด
  - left: นอนดึก ไม่อยากเจอใคร
    right: ด้านพฤติกรรม
  hints:
  - ความเครียดแสดงออกได้หลายด้าน
  - พฤติกรรมคือสิ่งที่เราทำ
  solution: อาการทางกายคือใจเต้นและปวดท้อง อารมณ์คือกังวลหงุดหงิด ความคิดคือคิดวนด้านลบ และพฤติกรรมคือนอนดึกและแยกตัว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.emotions-stress.p004
  topics:
  - health.mental.emotions-stress
  difficulty: 2
  type: order
  stem: เรียงวงจรความเครียด เริ่มจากเหตุการณ์
  items:
  - เหตุการณ์ เช่น สอบพรุ่งนี้
  - ความคิด เช่น ต้องสอบตกแน่
  - อารมณ์ เช่น กังวล กลัว
  - อาการทางกาย เช่น ใจเต้นแรง ปวดท้อง
  - พฤติกรรม เช่น นอนดึก เล่นมือถือ
  hints:
  - ความคิดเกิดก่อนอารมณ์
  - พฤติกรรมเป็นผลของทุกขั้นก่อนหน้า
  solution: เหตุการณ์ → ความคิด → อารมณ์ → อาการทางกาย → พฤติกรรม แล้วพฤติกรรมอย่างการนอนดึกก็ทำให้เครียดมากขึ้นอีก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.emotions-stress.p005
  topics:
  - health.mental.emotions-stress
  difficulty: 2
  type: mcq
  stem: คืนก่อนสอบ ต้นรู้สึกกังวลจนใจเต้นแรง วิธีใดช่วยให้สงบลงได้ทันที
  choices:
  - id: a
    text: หายใจเข้าช้า ๆ ทางจมูก แล้วหายใจออกช้า ๆ นานกว่าหายใจเข้า หลายรอบ
    correct: true
  - id: b
    text: ดื่มกาแฟเข้ม ๆ แล้วอ่านหนังสือทั้งคืน
    feedback: คาเฟอีนทำให้ใจเต้นแรงขึ้น และการอดนอนทำให้จำได้น้อยลง
  - id: c
    text: เลื่อนดูโซเชียลมีเดียจนหลับไป
    feedback: แสงและเนื้อหาจากหน้าจอทำให้หลับยากและใจไม่สงบ
  hints:
  - ร่างกายที่เครียดหายใจเร็วและตื้น
  - การหายใจช้าช่วยให้ร่างกายผ่อนคลาย
  solution: การหายใจช้า ๆ โดยหายใจออกนานกว่าหายใจเข้าช่วยให้หัวใจเต้นช้าลงและใจสงบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.emotions-stress.p006
  topics:
  - health.mental.emotions-stress
  difficulty: 2
  type: numeric
  stem: จากแผนภูมิ คืนวันพฤหัสบดีแพรวนอนน้อยกว่า 9 ชั่วโมงอยู่กี่ชั่วโมง (ตอบเป็นชั่วโมง)
  figure: &id001
    src: sleep-stress.svg
    alt: แผนภูมิแท่งและเส้น ข้อมูลสมมติของแพรวในสัปดาห์สอบ แท่งคือชั่วโมงนอน เส้นคือคะแนนความเครียด 1–10 จันทร์ นอน 9 เครียด 3 อังคาร นอน 8.5 เครียด 3 พุธ นอน 6 เครียด 6 พฤหัสบดี นอน 5.5 เครียด 8 ศุกร์ นอน 6.5 เครียด 6 เสาร์ นอน 9.5 เครียด 2 อาทิตย์ นอน 9 เครียด 2
  answer:
    value: 3.5
    tolerance: 0.01
    unit: ชั่วโมง
  misconceptions:
  - match: 5.5
    feedback: 5.5 คือชั่วโมงที่นอนจริง โจทย์ถามว่าน้อยกว่า 9 อยู่เท่าไร
  - match: 8
    feedback: 8 คือคะแนนความเครียด (เส้นสีแดง) ไม่ใช่ชั่วโมงนอน
  hints:
  - อ่านแท่งของวันพฤหัสบดี
  - นำ 9 ลบด้วยค่าที่อ่านได้
  solution: วันพฤหัสบดีนอน 5.5 ชั่วโมง น้อยกว่า 9 อยู่ 9 − 5.5 = 3.5 ชั่วโมง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.emotions-stress.p007
  topics:
  - health.mental.emotions-stress
  difficulty: 3
  type: numeric
  stem: จากแผนภูมิ มีกี่คืนที่แพรวนอนน้อยกว่า 8 ชั่วโมง ซึ่งต่ำกว่าคำแนะนำสำหรับวัยรุ่น (ตอบเป็นจำนวนคืน)
  figure: *id001
  answer:
    value: 3
    unit: คืน
  misconceptions:
  - match: 4
    feedback: วันอังคารนอน 8.5 ชั่วโมง ไม่น้อยกว่า 8
  - match: 2
    feedback: อย่าลืมวันศุกร์ที่นอน 6.5 ชั่วโมง
  hints:
  - ไล่ดูแท่งทีละวัน
  - นับแท่งที่ต่ำกว่า 8
  solution: คืนที่นอนน้อยกว่า 8 ชั่วโมงคือ พุธ 6 พฤหัสบดี 5.5 และศุกร์ 6.5 รวม 3 คืน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.emotions-stress.p008
  topics:
  - health.mental.emotions-stress
  difficulty: 3
  type: mcq
  stem: จากแผนภูมิ ข้อใดสรุปความสัมพันธ์ได้เหมาะสมที่สุด
  figure: *id001
  choices:
  - id: a
    text: คืนที่แพรวนอนน้อย คะแนนความเครียดมักสูง แสดงว่าการนอนกับความเครียดเกี่ยวข้องกัน
    correct: true
  - id: b
    text: การนอนน้อยเป็นสาเหตุเดียวของความเครียดแน่นอน
    feedback: ข้อมูล 7 วันของคนเดียวบอกได้แค่ว่าเกี่ยวข้องกัน ช่วงนี้ยังเป็นสัปดาห์สอบด้วย
  - id: c
    text: การนอนไม่เกี่ยวกับความเครียดเลย
    feedback: ข้อมูลแสดงว่าวันที่นอนน้อยคะแนนเครียดสูงกว่า
  hints:
  - เทียบแท่งกับเส้นในวันเดียวกัน
  - ระวังการสรุปว่าเป็นสาเหตุจากข้อมูลน้อย
  solution: วันที่นอนน้อย (พุธ–ศุกร์) คะแนนเครียดสูง และวันที่นอนพอคะแนนต่ำ แสดงว่าทั้งสองเกี่ยวข้องกัน และส่งผลถึงกันได้ทั้งสองทาง แต่ยังสรุปไม่ได้ว่าเป็นสาเหตุเดียว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.emotions-stress.p009
  topics:
  - health.mental.emotions-stress
  difficulty: 3
  type: mcq
  stem: ข้อใดแสดงว่าสุขภาพกายและสุขภาพจิตส่งผลถึงกัน (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: นอนไม่พอหลายวันทำให้หงุดหงิดง่าย
    correct: true
  - id: b
    text: เครียดนาน ๆ ทำให้ปวดหัวและป่วยง่าย
    correct: true
  - id: c
    text: ออกกำลังกายสม่ำเสมอช่วยให้อารมณ์ดีขึ้น
    correct: true
  - id: d
    text: สีของกระเป๋านักเรียนทำให้สอบได้คะแนนสูง
    feedback: ไม่เกี่ยวกับสุขภาพกายหรือจิตใจ
  hints:
  - คิดทั้งทางกายไปใจ และใจไปกาย
  - ข้อที่ถูกมีมากกว่าหนึ่งข้อ
  solution: การนอนและการออกกำลังกายส่งผลต่ออารมณ์ และความเครียดส่งผลต่อร่างกาย กายกับใจจึงต้องดูแลให้สมดุล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.emotions-stress.p010
  topics:
  - health.mental.emotions-stress
  difficulty: 3
  type: mcq
  stem: ข้อใดเป็นการคิดใหม่ที่ช่วยลดความเครียดก่อนแข่งว่ายน้ำ
  choices:
  - id: a
    text: "\"ฉันซ้อมมาทุกวัน วันนี้ทำให้ดีที่สุดเท่าที่ทำได้\""
    correct: true
  - id: b
    text: "\"ถ้าไม่ได้ที่หนึ่ง ทุกคนจะผิดหวังในตัวฉัน\""
    feedback: เป็นความคิดเหมารวมที่เพิ่มความกดดัน
  - id: c
    text: "\"ฉันไม่เคยทำอะไรได้ดีเลย\""
    feedback: คำว่า "ไม่เคย" เป็นการมองแง่ลบเกินจริง
  hints:
  - ความคิดที่ช่วยได้มองตามความจริงและให้กำลังใจ
  - สังเกตคำว่า "ทุกคน" "ไม่เคย"
  solution: การคิดใหม่เปลี่ยนความคิดที่เกินจริงเป็นความคิดที่สมเหตุสมผลและให้กำลังใจ ช่วยให้อารมณ์และร่างกายสงบลง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.emotions-stress.p011
  topics:
  - health.mental.emotions-stress
  difficulty: 4
  type: mcq
  stem: ข้อใดเป็นสัญญาณที่ควรชวนเพื่อนไปคุยกับผู้ใหญ่หรือผู้เชี่ยวชาญ
  choices:
  - id: a
    text: เพื่อนเศร้าและไม่อยากทำอะไรเกือบทุกวันมา 3 สัปดาห์ แยกตัวและผลการเรียนลดลง
    correct: true
  - id: b
    text: เพื่อนเสียใจหนึ่งวันเพราะทีมแพ้ แล้ววันรุ่งขึ้นก็ปกติ
    feedback: ความเสียใจชั่วคราวหลังเหตุการณ์เป็นอารมณ์ปกติ
  - id: c
    text: เพื่อนตื่นเต้นก่อนพูดหน้าห้อง
    feedback: ความตื่นเต้นก่อนทำสิ่งสำคัญเป็นเรื่องปกติ
  hints:
  - ดูว่านานแค่ไหนและกระทบชีวิตมากเพียงใด
  - สัญญาณสำคัญคือเกือบทุกวันนานเกิน 2 สัปดาห์
  solution: อาการเศร้าเกือบทุกวันนานกว่า 2 สัปดาห์ ร่วมกับแยกตัวและการเรียนแย่ลง เป็นสัญญาณที่ควรได้รับความช่วยเหลือ ไม่ใช่การวินิจฉัย แต่เป็นเหตุผลที่ควรคุยกับผู้ใหญ่หรือโทร 1323
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.emotions-stress.p012
  topics:
  - health.mental.emotions-stress
  difficulty: 4
  type: mcq
  stem: คืนหนึ่งเพื่อนส่งข้อความมาว่า "ไม่อยากอยู่แล้ว ขอให้เก็บเป็นความลับนะ" ข้อใดเหมาะสมที่สุด
  choices:
  - id: a
    text: ตอบว่าเป็นห่วงและอยากฟัง บอกผู้ใหญ่ที่ไว้ใจทันทีแม้เพื่อนขอให้เก็บเป็นความลับ ชวนโทร 1323 และถ้ามีอันตรายเฉพาะหน้าโทร 1669
    correct: true
  - id: b
    text: เก็บเป็นความลับตามที่สัญญา
    feedback: เมื่อชีวิตเพื่อนอาจตกอยู่ในอันตราย ความปลอดภัยสำคัญกว่าความลับ
  - id: c
    text: ตอบว่า "อย่าคิดมาก เดี๋ยวก็หาย" แล้วเข้านอน
    feedback: เป็นการมองข้ามความรู้สึกของเพื่อน ข้อความแบบนี้ต้องถือว่าจริงจังเสมอ
  hints:
  - ข้อความแบบนี้ต้องถือว่าจริงจังเสมอ
  - คนที่ช่วยได้มากที่สุดคือผู้ใหญ่และผู้เชี่ยวชาญ
  solution: รับฟังด้วยความห่วงใย ไม่ตัดสิน ไม่เก็บเป็นความลับ บอกผู้ใหญ่ที่ไว้ใจทันที ใช้ 1323 และโทร 1669 ถ้ามีอันตรายเฉพาะหน้า การช่วยเหลือมีอยู่จริงและช่วยได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.mental.emotions-stress.p013
  topics:
  - health.mental.emotions-stress
  difficulty: 4
  type: mcq
  stem: ข้อใดเป็นวิธีจัดการความเครียดที่ไม่ช่วยในระยะยาว
  choices:
  - id: a
    text: ดื่มเครื่องดื่มแอลกอฮอล์หรือสูบบุหรี่ไฟฟ้าเพื่อให้ลืม
    correct: true
  - id: b
    text: แบ่งงานใหญ่เป็นชิ้นเล็กแล้วทำทีละอย่าง
    feedback: เป็นวิธีที่ช่วยได้ ทำให้งานดูไม่หนักเกินไป
  - id: c
    text: เล่าให้ครูแนะแนวฟัง
    feedback: เป็นวิธีที่ช่วยได้ ครูแนะแนวช่วยหาทางออกได้
  hints:
  - วิธีที่ไม่ช่วยอาจทำให้รู้สึกดีชั่วครู่แต่เพิ่มปัญหา
  - สารเสพติดทำให้ติดและไม่ได้แก้ต้นเหตุ
  solution: การใช้แอลกอฮอล์ บุหรี่ หรือสารเสพติดไม่ได้แก้ต้นเหตุ เพิ่มปัญหาสุขภาพ และอาจทำให้ติด
  license: CC-BY-SA-4.0
