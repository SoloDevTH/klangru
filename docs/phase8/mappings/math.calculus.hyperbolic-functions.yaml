topic: math.calculus.hyperbolic-functions
rows:
  - { framework: university-foundations, indicators: ["CALC1 1.5"], coverage: partial, note: "สอนนิยาม ln x เป็นปริพันธ์ ให้ e เป็นค่าที่ ln e = 1 และให้ a^x กับ log_a x สั้น ๆ ในบทเรียน แต่ไม่มีโจทย์ฝึกฐานอื่นและการแก้สมการเลขชี้กำลัง (อยู่ใน logarithms และ exponential-functions)" }
  - { framework: university-foundations, indicators: ["CALC1 6.7"], coverage: partial, note: "ใช้ ∫ dt/t นิยาม ln และ ∫ tanh x dx = ln(cosh x) แต่ไม่สอนปริพันธ์ของ a^x หรือ log_a x ทั่วไป" }
  - { framework: university-foundations, indicators: ["CALC1 6.9"], coverage: full, note: "นิยาม sinh cosh tanh จาก e^x กราฟ เอกลักษณ์ cosh² − sinh² = 1 อนุพันธ์ ปริพันธ์ และฟังก์ชันผกผันในรูปลอการิทึม พร้อมตัวอย่างโซ่ห้อย" }
  - { framework: university-foundations, indicators: ["CALC2 2.7"], coverage: partial, note: "เหมือน CALC1 6.7 คือสอนปริพันธ์ที่ได้ ln และ ln cosh แต่ไม่ครอบคลุมปริพันธ์ของเลขชี้กำลังฐานอื่น" }
  - { framework: university-foundations, indicators: ["CALC2 2.9"], coverage: full, note: "ครบทั้งนิยาม กราฟ เอกลักษณ์ อนุพันธ์ ปริพันธ์ และฟังก์ชันผกผัน ตามตัวชี้วัดแคลคูลัสของฟังก์ชันไฮเพอร์โบลิก" }
