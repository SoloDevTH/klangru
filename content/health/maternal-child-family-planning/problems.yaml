    correct: true
  - id: b
    text: รอไปก่อน อาการเศร้าหลังคลอดเป็นเรื่องปกติและจะหายเอง
    feedback: อาการเศร้าเล็กน้อยไม่กี่วันพบบ่อย แต่อาการนานหลายสัปดาห์และคิดอยากหายไปเป็นสัญญาณของภาวะซึมเศร้าที่ต้องรักษา
  - id: c
    text: บอกให้แม่เข้มแข็งและเลิกคิดมาก
    feedback: คำพูดนี้ทำให้แม่รู้สึกผิดมากขึ้น ภาวะซึมเศร้าไม่ได้หายด้วยความตั้งใจอย่างเดียว
