<path d="M61,232 Q101,170 141,232" stroke="#666" stroke-width="1.5" fill="#cfd8e3" stroke-linecap="round"/>
<text x="180.0" y="112.0" font-size="16" text-anchor="start" fill="#666" font-weight="bold">ชื่อจีน</text>
<text x="270.0" y="112.0" font-size="17" text-anchor="start" fill="#1a1a1a" font-weight="normal">玛丽 (Mǎlì)</text>
