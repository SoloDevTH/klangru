- id: science.nature.nature-of-science.p012
  topics:
  - science.nature.nature-of-science
  difficulty: 4
  type: mcq
  stem: ทำไมโครงการจีโนมมนุษย์จึงต้องใช้นักวิทยาศาสตร์จากหลายประเทศร่วมกัน
  choices:
  - id: a
    text: งานใหญ่และซับซ้อนเกินกว่ากลุ่มเดียวจะทำได้ การแบ่งงาน แลกเปลี่ยนข้อมูล และตรวจผลของกันและกันทำให้เสร็จเร็วและเชื่อถือได้มากขึ้น
    correct: true
  - id: b
    text: เพราะแต่ละประเทศมีดีเอ็นเอไม่เหมือนกัน
    feedback: มนุษย์ทุกคนมีดีเอ็นเอคล้ายกันมาก เหตุผลหลักคือขนาดของงาน
  - id: c
    text: เพราะกฎหมายบังคับว่าห้ามทำคนเดียว
    feedback: ไม่ใช่เหตุผลทางวิทยาศาสตร์
  - id: d
    text: เพื่อให้นักวิทยาศาสตร์ทุกคนได้รางวัลโนเบล
    feedback: ความร่วมมือมีเป้าหมายเพื่อให้ได้ความรู้ ไม่ใช่รางวัล
  hints:
  - ลำดับดีเอ็นเอของมนุษย์ยาวมาก
  - ความร่วมมือช่วยทั้งเรื่องความเร็วและการตรวจสอบ
  solution: ความก้าวหน้าทางวิทยาศาสตร์มักเกิดจากความร่วมมือและการต่อยอด งานใหญ่ต้องแบ่งงานและใช้ข้อมูลร่วมกัน และการตรวจผลกันเองช่วยลดข้อผิดพลาด
