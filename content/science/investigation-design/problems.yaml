  - การสุ่มช่วยไม่ให้เราเลือกตามใจ
  solution: การสุ่มหลายจุดให้กระจายทั่วพื้นที่ทำให้ตัวอย่างเป็นตัวแทน ไม่ลำเอียงไปทางจุดที่มีมากหรือน้อย
