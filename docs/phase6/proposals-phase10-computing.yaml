  - { id: computer.society.data-ethics, title: จริยธรรมและธรรมาภิบาลข้อมูล, difficulty: 5, prereq: [computer.society.privacy, computer.data.data-processing], indicators: ["acm-cs2023:DM-SEP", "acm-cs2023:SEP-Privacy", "csta-k12-cs-2026:MS-DAT-IM-28", "csta-k12-cs-2026:MS-DAT-IM-29", "csta-k12-cs-2026:HS-DAT-IM-27", "csta-k12-cs-2026:HS-DAT-IM-28", "csta-k12-cs-2026:S1-DSC-PP-12", "csta-k12-cs-2026:S1-DSC-PP-13", "csta-k12-cs-2026:S2-DSC-PP-13", "csta-k12-cs-2026:S2-DSC-PP-14"], scope: "ความเป็นเจ้าของข้อมูลและอธิปไตยข้อมูล (ของบุคคล ชุมชน ประเทศ) ประโยชน์และความเสี่ยงของการให้เก็บข้อมูลส่วนบุคคลและเมทาดาทา การตัดสินใจในแต่ละขั้นของงานข้อมูลที่ทำให้เกิดอคติและข้อสรุปผิด (การเก็บ การติดป้าย การเลือกตัวแปร) ผลต่อกลุ่มที่ถูกมองข้าม ผลทางสังคม สิ่งแวดล้อม และจริยธรรมของการเก็บและประมวลผลข้อมูลขนาดใหญ่ ประเด็นกฎหมายของชุดข้อมูลขนาดใหญ่และแบบจำลองทำนาย ธรรมาภิบาลข้อมูล (นโยบาย สิทธิ์เข้าถึง ระยะเวลาเก็บ) เทคนิคปกป้องความเป็นส่วนตัว (ลดข้อมูล แฝงชื่อ ความเป็นส่วนตัวเชิงอนุพันธ์ด้วยการเติมสัญญาณรบกวน) หลักความโปร่งใสและความรับผิดชอบในการวิเคราะห์และสื่อสารผล และวิเคราะห์ประสิทธิผลของกฎหมาย PDPA GDPR และนโยบายองค์กร" }
