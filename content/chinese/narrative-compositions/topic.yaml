lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: story-skeleton.svg
  alt: 'ห้ากล่องเรียงจากซ้ายไปขวา: 时间 เวลา (那个周末) 地点 สถานที่ (清迈的老街) 人物 ตัวละคร (我和家人) 事件 เหตุการณ์ (买热茶 · 下雨) และ 感受 ความรู้สึก (很开心) ลูกศรเชื่อมแต่ละกล่อง'
  caption: เรื่องเล่าที่ดีตอบได้ห้าข้อนี้ ลองเติมแต่ละกล่องก่อนเริ่มเขียนจริง
- type: check
  problem: chinese.writing.narrative-compositions.p010
  prompt: ลองดูก่อนว่าประโยคไหนบอกความรู้สึก ไม่ใช่เวลาหรือสถานที่
- type: worked-example
  title: ขยายประโยคสั้นให้เป็นย่อหน้า
  problem: ฉบับร่างมีประโยคเดียวคือ 我去了书店。 จะขยายอย่างไร
  steps:
  - text: 'เพิ่มเวลาและสถานที่: 昨天下午，我和朋友去了一家书店。'
    why: ประโยคแรกตอบว่าเมื่อไรและไปกับใคร
  - text: 'เพิ่มรายละเอียดของสถานที่: 书店不大，但是很安静。'
    why: 但是 ทำให้รายละเอียดมีจุดเปรียบเทียบ ไม่ใช่แค่ข้อเท็จจริงซ้ำ
  - text: 'เพิ่มเหตุการณ์และความรู้สึก เชื่อมด้วยคำบอกลำดับ: 然后，我们在窗边坐了一个小时，我很开心。'
    why: 然后 บอกการต่อเนื่องของเหตุการณ์
  answer: 昨天下午，我和朋友去了一家书店。书店不大，但是很安静。然后，我们在窗边坐了一个小时，我很开心。
- type: worked-example
  title: เรียงลำดับเหตุการณ์ก่อนลงมือเขียน
  problem: 'เรียงเหตุการณ์นี้ตามลำดับที่ถูกต้อง: กินข้าวเช้า ไปตลาดเช้า กลับบ้าน'
  steps:
  - text: 'เรียงตามลำดับจริงของเช้าวันนั้น: ไปตลาดเช้าก่อน แล้วกินข้าว แล้วจึงกลับบ้าน'
    why: เรียงตามลำดับจริงก่อน แล้วค่อยใส่คำบอกลำดับ
  - text: 'ใส่คำบอกลำดับ: 首先 ตามด้วย 然后 และ 最后'
    why: 最后 ใช้กับเหตุการณ์สุดท้ายเท่านั้น
  answer: 首先去早市，然后吃早饭，最后回家。
- type: check
  problem: chinese.writing.narrative-compositions.p002
  prompt: คิดว่าคำบอกลำดับใดควรอยู่หน้าประโยคแรก ก่อนดูคำตอบ
glossary:
- term: 稿纸 gǎozhǐ
  definition: กระดาษตารางสำหรับเขียนเรียงความ หนึ่งช่องต่อหนึ่งอักษรหรือเครื่องหมาย
- term: 标点符号 biāodiǎn fúhào
  definition: เครื่องหมายวรรคตอน เช่น ， 。 、 “ ”
- term: 时间 shíjiān · 地点 dìdiǎn
  definition: เวลาและสถานที่ของเรื่อง ตอบว่าเกิดเมื่อไรและที่ไหน
- term: 感受 gǎnshòu
  definition: ความรู้สึกที่ตัวละครหรือผู้เล่ามีต่อเหตุการณ์
- term: 过了一会儿 guò le yíhuìr
  definition: ผ่านไปสักพัก ใช้บอกเวลาที่เว้นช่วงระหว่างเหตุการณ์
flashcards:
- front: เว้นย่อหน้าใหม่กี่ช่อง
  back: เว้นสองช่องแรกบนกระดาษตาราง
- front: 那天 · 过了一会儿
  back: วันนั้น · ผ่านไปสักพัก
- front: ห้าส่วนของเรื่องเล่า
  back: 时间 · 地点 · 人物 · 事件 · 感受
- front: เครื่องหมายคั่นรายการในจีน
  back: 、 (เช่น 苹果、香蕉和橘子)
