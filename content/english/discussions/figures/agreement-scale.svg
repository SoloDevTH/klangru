<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="sans-serif">
<title>ระดับการเห็นด้วยตั้งแต่ไม่เห็นด้วยเลยถึงเห็นด้วยเต็มที่</title>
<rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
<text x="380" y="36" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">ระดับการเห็นด้วยและวลีที่ใช้ในการอภิปราย</text>
<line x1="70" y1="165" x2="700" y2="165" stroke="#555" stroke-width="3" stroke-linecap="round"/>
<polygon points="700,165 690.10,169.78 690.10,160.22" fill="#555"/>
<circle cx="110" cy="165" r="14" fill="#b3261e" stroke="#ffffff" stroke-width="2"/>
<text x="110" y="131" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">ไม่เห็นด้วยเลย</text>
<text x="110" y="205" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">I completely</text>
<text x="110" y="225" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">disagree.</text>
<circle cx="245" cy="165" r="14" fill="#d9822b" stroke="#ffffff" stroke-width="2"/>
<text x="245" y="131" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">ไม่ค่อยเห็นด้วย</text>
<text x="245" y="205" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">I'm not sure</text>
<text x="245" y="225" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">I agree.</text>
<circle cx="380" cy="165" r="14" fill="#8a8a8a" stroke="#ffffff" stroke-width="2"/>
<text x="380" y="131" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">ยังไม่แน่ใจ</text>
<text x="380" y="205" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">That's an</text>
<text x="380" y="225" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">interesting point.</text>
<circle cx="515" cy="165" r="14" fill="#7fb069" stroke="#ffffff" stroke-width="2"/>
<text x="515" y="131" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">เห็นด้วยบางส่วน</text>
<text x="515" y="205" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">I see your point,</text>
<text x="515" y="225" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">but ...</text>
<circle cx="650" cy="165" r="14" fill="#2e6b4f" stroke="#ffffff" stroke-width="2"/>
<text x="650" y="131" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">เห็นด้วยเต็มที่</text>
<text x="650" y="205" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">I completely agree</text>
<text x="650" y="225" font-size="14" fill="#111" text-anchor="middle" font-weight="normal">with you.</text>
<text x="20" y="300" font-size="13" fill="#444" text-anchor="start" font-weight="normal">จากซ้ายไปขวาคือการเห็นด้วยมากขึ้น ใช้ but หรือ although เมื่อเห็นด้วยบางส่วน</text>
</svg>
