id: health.mental.emotions-stress
subject: health
title: { th: "อารมณ์ ความเครียด และสุขภาพจิต", en: "Emotions, stress and mental health" }
summary: อารมณ์และความเครียดมีผลต่อสุขภาพอย่างไร ความสมดุลของสุขภาพกายและใจ สัญญาณเบื้องต้นของปัญหาสุขภาพจิต วิธีจัดการอารมณ์และความเครียด และแหล่งช่วยเหลือ เช่น สายด่วน 1323
difficulty: 3.5
minutes: 35
prerequisites: [health.hygiene.national-health-rules]
encompasses:
  - { id: health.hygiene.national-health-rules, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: วงจรความเครียด
    src: stress-cycle.svg
    alt: "วงจรห้ากล่องมีลูกศรวนตามเข็มนาฬิกา เหตุการณ์ (สอบพรุ่งนี้) ไปความคิด (ต้องสอบตกแน่) ไปอารมณ์ (กังวล กลัว) ไปร่างกาย (ใจเต้นแรง ปวดท้อง) ไปพฤติกรรม (นอนดึก เล่นมือถือ) แล้ววนกลับไปเหตุการณ์ กล่องสีเขียวรอบนอกบอกจุดตัดวงจร คิดใหม่ ว่าเตรียมมาแล้ว ทำเท่าที่ทำได้ หายใจช้า ๆ ขยับร่างกาย นอนให้พอ พูดคุยกับคนที่ไว้ใจ"
  - type: worked-example
    title: ตัดวงจรคืนก่อนสอบ
    problem: "คืนก่อนสอบ แพรวคิดว่า \"ต้องสอบตกแน่\" รู้สึกกังวล ใจเต้นแรง ปวดท้อง แล้วนอนเล่นมือถือจนดึก แพรวตัดวงจรนี้ได้ที่จุดใดบ้าง"
    steps:
      - text: "ระบุวงจร: เหตุการณ์ (สอบพรุ่งนี้) → ความคิด (ต้องสอบตก) → อารมณ์ (กังวล) → ร่างกาย (ใจเต้น ปวดท้อง) → พฤติกรรม (นอนดึก)"
      - text: "ตัดที่ความคิด: เปลี่ยนเป็น \"ฉันอ่านมาแล้ว พรุ่งนี้ทำข้อที่รู้ก่อน\""
        why: "ความคิดที่ตรงตามจริงทำให้อารมณ์เบาลง"
      - text: "ตัดที่ร่างกาย: หายใจช้า ๆ โดยหายใจออกนานกว่าหายใจเข้า หลายรอบ"
      - text: "ตัดที่พฤติกรรม: วางมือถือนอกห้อง เข้านอนให้ได้ 8 ชั่วโมงขึ้นไป"
        why: "การนอนพอช่วยให้สมองจำและมีสมาธิในวันสอบ"
      - text: "ถ้ากังวลแบบนี้ทุกครั้งจนกระทบชีวิต ให้คุยกับครูแนะแนวหรือโทร 1323"
    answer: "ตัดได้ทุกจุด เช่น คิดใหม่ หายใจช้า ๆ และวางมือถือแล้วเข้านอน"
  - { type: check, problem: health.mental.emotions-stress.p005, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: worked-example
    title: อ่านบันทึกการนอนกับความเครียด
    problem: "จากบันทึกของแพรว (ข้อมูลสมมติ) คืนที่นอนน้อยที่สุดคือคืนใด คะแนนความเครียดวันนั้นเป็นเท่าไร และควรปรับอะไร"
    figure:
      src: sleep-stress.svg
      alt: "แผนภูมิแท่งและเส้น ข้อมูลสมมติของแพรวในสัปดาห์สอบ แท่งคือชั่วโมงนอน เส้นคือคะแนนความเครียด 1–10 จันทร์ นอน 9 เครียด 3 อังคาร นอน 8.5 เครียด 3 พุธ นอน 6 เครียด 6 พฤหัสบดี นอน 5.5 เครียด 8 ศุกร์ นอน 6.5 เครียด 6 เสาร์ นอน 9.5 เครียด 2 อาทิตย์ นอน 9 เครียด 2"
    steps:
      - text: "แท่งต่ำที่สุดคือวันพฤหัสบดี นอน 5.5 ชั่วโมง"
      - text: "เส้นสีแดงวันพฤหัสบดีอยู่ที่ 8 ซึ่งสูงที่สุดในสัปดาห์"
      - text: "วันที่นอน 9 ชั่วโมงขึ้นไป คะแนนความเครียดอยู่ที่ 2–3"
        why: "การนอนกับความเครียดส่งผลถึงกันทั้งสองทาง เครียดทำให้นอนไม่หลับ และนอนน้อยทำให้รับมือความเครียดได้ยาก"
      - text: "ปรับ: เตรียมอ่านล่วงหน้าเพื่อไม่ต้องอ่านดึก และเข้านอนเวลาเดิมทุกคืน"
    answer: "คืนวันพฤหัสบดี นอน 5.5 ชั่วโมง ความเครียด 8 ควรวางแผนอ่านล่วงหน้าและรักษาเวลานอน"
  - { type: check, problem: health.mental.emotions-stress.p007 }
glossary:
  - { term: อารมณ์, definition: "ความรู้สึกที่เกิดขึ้นตอบสนองต่อเหตุการณ์ เช่น ดีใจ เสียใจ โกรธ กลัว ทุกอารมณ์เป็นเรื่องปกติ" }
  - { term: ความเครียด, definition: "ปฏิกิริยาของร่างกายและจิตใจเมื่อเจอสิ่งที่รู้สึกว่ากดดันหรือคุกคาม" }
  - { term: สุขภาพจิต, definition: "สภาวะที่ทำให้รับมือความเครียดในชีวิต รู้ศักยภาพตัวเอง เรียนและทำงานได้ดี และทำประโยชน์ให้ชุมชน (องค์การอนามัยโลก)" }
  - { term: การคิดใหม่, definition: "การเปลี่ยนความคิดที่เกินจริงหรือแง่ลบให้ตรงตามจริงและให้กำลังใจ" }
flashcards:
  - { front: "สายด่วนสุขภาพจิต", back: "1323 ฟรี 24 ชั่วโมง เป็นความลับ (อันตรายเฉพาะหน้าโทร 1669)" }
  - { front: "สัญญาณที่ควรขอความช่วยเหลือ", back: "เศร้า หมดความสนใจ แยกตัว นอนหรือกินเปลี่ยน เกือบทุกวันนานเกิน 2 สัปดาห์" }
  - { front: "จัดการความเครียด", back: "ตั้งชื่ออารมณ์ หายใจช้า ๆ คิดใหม่ แบ่งงาน นอนพอ ขยับร่างกาย พูดคุย" }
  - { front: "เพื่อนพูดถึงการอยากตาย", back: "ถือว่าจริงจัง รับฟัง ไม่เก็บเป็นความลับ บอกผู้ใหญ่ทันที 1323 หรือ 1669" }
