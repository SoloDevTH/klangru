    ai_assisted: true

  - id: management.public.public-policy.p016
    topics: [management.public.public-policy]
    difficulty: 5
    type: mcq
    stem: "กระทรวงแห่งหนึ่ง (สมมติ) ให้ทุนอาหารเช้าแก่โรงเรียนที่สมัครเข้าร่วมเอง หลังหนึ่งปีพบว่าคะแนนสอบของโรงเรียนที่เข้าร่วมสูงกว่าโรงเรียนที่ไม่เข้าร่วม 8 คะแนน ข้อใดเป็นข้อโต้แย้งที่สำคัญที่สุดต่อการสรุปว่าโครงการทำให้คะแนนเพิ่ม 8 คะแนน"
    choices:
