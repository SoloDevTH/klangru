  stem: ราคาน้ำมันในตลาดโลกสูงขึ้นมาก ทำให้ค่าขนส่งและต้นทุนการผลิตสินค้าหลายชนิดสูงขึ้น ราคาสินค้าจึงแพงขึ้น เป็นเงินเฟ้อแบบใด
  choices:
