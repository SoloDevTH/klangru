<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230" font-family="sans-serif" font-size="14">
<title>ขั้นตอนการเตรียมข้อมูลห้าขั้น</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="800" height="230" fill="#ffffff"/>
<rect x="20" y="40" width="132" height="130" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="86.0" y="64" text-anchor="middle" font-size="12" fill="#6b7280">ขั้น 1</text>
<text x="86.0" y="98" text-anchor="middle" font-size="15" fill="#111827">ไฟล์ดิบ</text>
<text x="86.0" y="120" text-anchor="middle" font-size="15" fill="#111827">แบบฟอร์ม</text>
<text x="86.0" y="142" text-anchor="middle" font-size="15" fill="#111827">และบันทึกห้องสมุด</text>
<line x1="155" y1="105.0" x2="174" y2="105.0" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="177" y="40" width="132" height="130" rx="10" fill="#ecfccb" stroke="#4d7c0f" stroke-width="2"/>
<text x="243.0" y="64" text-anchor="middle" font-size="12" fill="#6b7280">ขั้น 2</text>
<text x="243.0" y="98" text-anchor="middle" font-size="15" fill="#111827">ตรวจชนิด</text>
<text x="243.0" y="120" text-anchor="middle" font-size="15" fill="#111827">ช่วง และ</text>
<text x="243.0" y="142" text-anchor="middle" font-size="15" fill="#111827">ความสอดคล้อง</text>
<line x1="312" y1="105.0" x2="331" y2="105.0" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="334" y="40" width="132" height="130" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="400.0" y="64" text-anchor="middle" font-size="12" fill="#6b7280">ขั้น 3</text>
<text x="400.0" y="98" text-anchor="middle" font-size="15" fill="#111827">ทำความสะอาด</text>
<text x="400.0" y="120" text-anchor="middle" font-size="15" fill="#111827">ข้อความ</text>
<text x="400.0" y="142" text-anchor="middle" font-size="15" fill="#111827">และค่าที่หายไป</text>
<line x1="469" y1="105.0" x2="488" y2="105.0" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="491" y="40" width="132" height="130" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="557.0" y="64" text-anchor="middle" font-size="12" fill="#6b7280">ขั้น 4</text>
<text x="557.0" y="98" text-anchor="middle" font-size="15" fill="#111827">รวมตาราง</text>
<text x="557.0" y="120" text-anchor="middle" font-size="15" fill="#111827">ด้วยคีย์ร่วม</text>
<text x="557.0" y="142" text-anchor="middle" font-size="15" fill="#111827">รหัสนักเรียน</text>
<line x1="626" y1="105.0" x2="645" y2="105.0" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="648" y="40" width="132" height="130" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="714.0" y="64" text-anchor="middle" font-size="12" fill="#6b7280">ขั้น 5</text>
<text x="714.0" y="98" text-anchor="middle" font-size="15" fill="#111827">ข้อมูลพร้อม</text>
<text x="714.0" y="120" text-anchor="middle" font-size="15" fill="#111827">วิเคราะห์</text>
<text x="714.0" y="142" text-anchor="middle" font-size="15" fill="#111827">บันทึกทุกขั้น</text>
<text x="400.0" y="200" text-anchor="middle" font-size="14" fill="#374151">ทำตามลำดับจากซ้ายไปขวา และบันทึกกฎที่ใช้ในทุกขั้น</text>
</svg>
