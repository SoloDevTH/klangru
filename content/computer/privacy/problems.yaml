      - { id: b, text: "เก็บเหมือนเดิม แต่เข้ารหัสข้อมูลพิกัดทั้งหมด", feedback: "การเข้ารหัสช่วยเรื่องความปลอดภัย แต่ยังเก็บเกินจำเป็นมาก ทั้งความถี่ เวลานอกโรงเรียน และระยะเวลาเก็บ" }
      - { id: c, text: "เก็บเหมือนเดิม แต่ให้ผู้ปกครองกดยินยอมก่อน", feedback: "ความยินยอมไม่ทำให้การเก็บเกินจำเป็นกลายเป็นเหมาะสม หลักเก็บเท่าที่จำเป็นยังใช้อยู่" }
