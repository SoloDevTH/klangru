<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="sans-serif" font-size="14">
  <title>แผนภูมิแท่งงบประมาณรายเดือนของครอบครัว</title>
  <rect x="0" y="0" width="640" height="320" fill="#ffffff"/>
  <text x="320.0" y="24.0" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="bold">งบประมาณรายเดือนของครอบครัว รายได้ 25,000 บาท</text>
  <text x="180.0" y="65.0" text-anchor="end" fill="#1f2937" font-size="13">ค่าอาหาร</text>
  <rect x="190.0" y="49.0" width="309.4" height="26.0" rx="0" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/>
  <text x="507.4" y="67.0" text-anchor="start" fill="#1f2937" font-size="13">7,500 บาท (30%)</text>
  <text x="180.0" y="105.0" text-anchor="end" fill="#1f2937" font-size="13">ค่าบ้าน ค่าน้ำ ค่าไฟ</text>
  <rect x="190.0" y="89.0" width="206.2" height="26.0" rx="0" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/>
  <text x="404.2" y="107.0" text-anchor="start" fill="#1f2937" font-size="13">5,000 บาท (20%)</text>
  <text x="180.0" y="145.0" text-anchor="end" fill="#1f2937" font-size="13">ค่าเดินทาง</text>
  <rect x="190.0" y="129.0" width="123.8" height="26.0" rx="0" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/>
  <text x="321.8" y="147.0" text-anchor="start" fill="#1f2937" font-size="13">3,000 บาท (12%)</text>
  <text x="180.0" y="185.0" text-anchor="end" fill="#1f2937" font-size="13">ค่าเรียนของลูก</text>
  <rect x="190.0" y="169.0" width="103.1" height="26.0" rx="0" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/>
  <text x="301.1" y="187.0" text-anchor="start" fill="#1f2937" font-size="13">2,500 บาท (10%)</text>
  <text x="180.0" y="225.0" text-anchor="end" fill="#1f2937" font-size="13">ของใช้และอื่น ๆ</text>
  <rect x="190.0" y="209.0" width="82.5" height="26.0" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/>
  <text x="280.5" y="227.0" text-anchor="start" fill="#1f2937" font-size="13">2,000 บาท (8%)</text>
  <text x="180.0" y="265.0" text-anchor="end" fill="#1f2937" font-size="13">เงินออม</text>
  <rect x="190.0" y="249.0" width="206.2" height="26.0" rx="0" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/>
  <text x="404.2" y="267.0" text-anchor="start" fill="#1f2937" font-size="13">5,000 บาท (20%)</text>
  <line x1="190.0" y1="45.0" x2="190.0" y2="285.0" stroke="#1f2937" stroke-width="2"/>
  <text x="320.0" y="308.0" text-anchor="middle" fill="#6b7280" font-size="13">ออมก่อนใช้: รายได้ − เงินออม = เงินที่ใช้จ่ายได้ (25,000 − 5,000 = 20,000 บาท)</text>
</svg>
