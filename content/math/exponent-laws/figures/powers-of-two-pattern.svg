  <text x="100" y="304" text-anchor="middle" fill="#2b5f9e" font-size="18" font-weight="bold">2<tspan dy="-9" font-size="13">−2</tspan></text>
  <text x="230" y="304" text-anchor="middle" fill="#15211e" font-size="18" font-weight="bold">1/4</text>
  <path d="M 310 299.0 C 350 301.0 350 331.0 310 333.0" fill="none" stroke="#b4521f" stroke-width="2"/>
  <polygon points="312,333 320,336.6 320,329.4" fill="#b4521f"/>
  <text x="352" y="321" text-anchor="start" fill="#b4521f" font-size="13" font-weight="bold">÷ 2</text>
  <rect x="40" y="316" width="260" height="38" fill="#fde9b8" stroke="#9fb0ab" stroke-width="1"/>
  <text x="100" y="342" text-anchor="middle" fill="#2b5f9e" font-size="18" font-weight="bold">2<tspan dy="-9" font-size="13">−3</tspan></text>
  <text x="230" y="342" text-anchor="middle" fill="#15211e" font-size="18" font-weight="bold">1/8</text>
  <text x="170" y="382" text-anchor="middle" fill="#15211e" font-size="13" >ลงทีละแถว เลขชี้กำลังลด 1 และค่าหารด้วย 2</text>
  <text x="170" y="404" text-anchor="middle" fill="#15211e" font-size="14" font-weight="bold">จึงได้ 2<tspan dy="-7" font-size="10">0</tspan><tspan dy="7"> = 1 และ 2</tspan><tspan dy="-7" font-size="10">−n</tspan><tspan dy="7"> = 1/2</tspan><tspan dy="-7" font-size="10">n</tspan></text>
</svg>
