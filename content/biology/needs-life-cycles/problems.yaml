problems:
  - id: biology.animals.needs-life-cycles.p001
    topics: [biology.animals.needs-life-cycles]
    difficulty: 1
    type: mcq
    multiple: true
    stem: "คนและสัตว์ต้องการสิ่งใดเพื่อดำรงชีวิต (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "อาหาร", correct: true }
      - { id: b, text: "น้ำ", correct: true }
      - { id: c, text: "อากาศ", correct: true }
      - { id: d, text: "ของเล่น", feedback: "ของเล่นทำให้สนุก แต่ไม่มีของเล่นสัตว์ก็ยังมีชีวิตอยู่ได้" }
      - { id: e, text: "แสงไฟจากหลอดไฟ", feedback: "สัตว์หลายชนิดอยู่ในที่มืดได้ เช่น ค้างคาวในถ้ำ หลอดไฟไม่ใช่สิ่งจำเป็นต่อชีวิต" }
    hints:
      - "ถ้าขาดสิ่งนี้นาน ๆ สัตว์จะตาย"
      - "นึกถึงสิ่งที่เรากิน ดื่ม และหายใจทุกวัน"
    solution: "คนและสัตว์ต้องการอาหาร น้ำ และอากาศ ขาดอย่างใดอย่างหนึ่งนาน ๆ จะตาย ของเล่นและหลอดไฟไม่จำเป็นต่อชีวิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.needs-life-cycles.p002
    topics: [biology.animals.needs-life-cycles]
    difficulty: 1
    type: order
    stem: "เรียงวัฏจักรชีวิตของผีเสื้อ เริ่มจากไข่"
    items:
      - "ไข่"
      - "หนอน"
      - "ดักแด้"
      - "ผีเสื้อ"
    hints:
      - "ไข่ของผีเสื้อฟักออกมาเป็นตัวที่กินใบไม้"
      - "ก่อนเป็นผีเสื้อ ตัวหนอนจะหยุดกินและห่อตัวนิ่ง ๆ"
    solution: "ไข่ → หนอน → ดักแด้ → ผีเสื้อ แล้วผีเสื้อวางไข่ต่อไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.needs-life-cycles.p003
    topics: [biology.animals.needs-life-cycles]
    difficulty: 1
    type: text
    stem: "หนอนผีเสื้อกินใบไม้จนตัวโต แล้วหยุดกินและห่อตัวนิ่งอยู่กับกิ่งไม้ ระยะที่นิ่งนี้เรียกว่าอะไร"
    accepted: ["ดักแด้", "ระยะดักแด้", "pupa"]
    hints:
      - "เป็นระยะที่อยู่ระหว่างหนอนกับผีเสื้อ"
      - "คำนี้มีสองพยางค์ ขึ้นต้นด้วย ด"
    misconceptions:
      - { match: "ไข่", feedback: "ไข่เป็นระยะแรกก่อนจะเป็นหนอน ระยะที่หนอนห่อตัวนิ่งคือดักแด้" }
      - { match: "ตาย", feedback: "หนอนไม่ได้ตาย มันยังมีชีวิตและกำลังเปลี่ยนร่างเป็นผีเสื้ออยู่ข้างใน" }
    solution: "ดักแด้ เป็นระยะที่ไม่กินอาหารและดูนิ่ง แต่ข้างในกำลังเปลี่ยนร่างเป็นผีเสื้อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.needs-life-cycles.p004
    topics: [biology.animals.needs-life-cycles]
    difficulty: 2
    type: match
    stem: "จับคู่สัตว์กับชื่อเรียกลูกหรือตัวอ่อนของมัน"
    pairs:
      - { left: "กบ", right: "ลูกอ๊อด" }
      - { left: "ยุง", right: "ลูกน้ำ" }
      - { left: "ผีเสื้อ", right: "หนอน" }
      - { left: "ไก่", right: "ลูกเจี๊ยบ" }
      - { left: "สุนัข", right: "ลูกสุนัข" }
    hints:
      - "ตัวอ่อนของยุงว่ายอยู่ในน้ำขัง"
      - "ลูกอ๊อดมีหางและอยู่ในน้ำ"
    solution: "กบ → ลูกอ๊อด, ยุง → ลูกน้ำ, ผีเสื้อ → หนอน, ไก่ → ลูกเจี๊ยบ, สุนัข → ลูกสุนัข"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.needs-life-cycles.p005
    topics: [biology.animals.needs-life-cycles]
    difficulty: 2
    type: mcq
    stem: "ลูกของสัตว์ชนิดใดมีรูปร่างคล้ายพ่อแม่ตั้งแต่เกิด แค่ตัวเล็กกว่า"
    choices:
      - { id: a, text: "แมว", correct: true }
      - { id: b, text: "กบ", feedback: "ลูกกบคือลูกอ๊อด มีหาง ไม่มีขา และอยู่ในน้ำ ไม่เหมือนกบเลย" }
      - { id: c, text: "ผีเสื้อ", feedback: "ลูกผีเสื้อคือหนอน ไม่มีปีก รูปร่างต่างจากผีเสื้อมาก" }
      - { id: d, text: "ยุง", feedback: "ลูกยุงคือลูกน้ำที่อยู่ในน้ำ ไม่มีปีกและรูปร่างต่างจากยุง" }
    hints:
      - "สัตว์บางชนิดเปลี่ยนรูปร่างมากระหว่างโต"
      - "นึกถึงลูกแมวกับแม่แมว"
    solution: "ลูกแมวมีรูปร่างคล้ายแม่แมวตั้งแต่เกิด ส่วนกบ ผีเสื้อ และยุงมีตัวอ่อนที่รูปร่างต่างจากตัวเต็มวัยมาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.needs-life-cycles.p006
    topics: [biology.animals.needs-life-cycles]
    difficulty: 2
    type: numeric
    stem: "จากกราฟมวลของลูกไก่ ลูกไก่หนักขึ้นกี่กรัม ตั้งแต่อายุ 2 สัปดาห์ถึงอายุ 6 สัปดาห์"
    figure: { src: chick-growth.svg, alt: "กราฟแท่งมวลของลูกไก่ตัวหนึ่ง (ข้อมูลสมมติ) แกนนอนเป็นอายุ 0 ถึง 6 สัปดาห์ แกนตั้งเป็นมวลเป็นกรัม ค่าบนแท่ง: สัปดาห์ 0 หนัก 35 กรัม สัปดาห์ 1 หนัก 70 กรัม สัปดาห์ 2 หนัก 120 กรัม สัปดาห์ 3 หนัก 190 กรัม สัปดาห์ 4 หนัก 280 กรัม สัปดาห์ 5 หนัก 380 กรัม สัปดาห์ 6 หนัก 480 กรัม" }
    answer: { value: 360, unit: กรัม }
    hints:
      - "อ่านค่ามวลที่อายุ 2 สัปดาห์และ 6 สัปดาห์จากกราฟ"
      - "หนักขึ้นเท่าไร หาได้จากมวลตอนหลังลบมวลตอนแรก"
    misconceptions:
      - { match: 480, feedback: "นี่คือมวลที่อายุ 6 สัปดาห์ โจทย์ถามว่าหนักขึ้นเท่าไร ต้องลบมวลที่อายุ 2 สัปดาห์ออก" }
      - { match: 600, feedback: "นำมวลทั้งสองมาบวกกัน การหาว่าเพิ่มขึ้นเท่าไรต้องใช้การลบ" }
      - { match: 445, feedback: "ใช้มวลแรกเกิด (35 กรัม) แทนมวลที่อายุ 2 สัปดาห์" }
    solution: "อายุ 2 สัปดาห์หนัก 120 กรัม อายุ 6 สัปดาห์หนัก 480 กรัม หนักขึ้น $480 - 120 = 360$ กรัม แสดงว่าลูกไก่เจริญเติบโต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.needs-life-cycles.p007
    topics: [biology.animals.needs-life-cycles]
    difficulty: 2
    type: mcq
    stem: "มะลิเลี้ยงปลากัดไว้ในโหลเล็ก ข้อใดเป็นวิธีดูแลที่ถูกต้อง"
    choices:
      - { id: a, text: "ให้อาหารพอดีวันละ 1–2 ครั้ง และเปลี่ยนน้ำสม่ำเสมอ ไม่ปิดฝาโหลจนสนิท", correct: true }
      - { id: b, text: "เทอาหารลงไปมาก ๆ ครั้งเดียวให้พอกินทั้งสัปดาห์", feedback: "อาหารที่ปลากินไม่หมดจะเน่า ทำให้น้ำเสียและปลาป่วย" }
      - { id: c, text: "ปิดฝาโหลให้สนิทเพื่อกันฝุ่น", feedback: "ปลากัดต้องขึ้นมาฮุบอากาศที่ผิวน้ำ ถ้าปิดสนิทนาน ๆ อากาศเหนือน้ำจะไม่ถ่ายเท" }
      - { id: d, text: "ไม่ต้องเปลี่ยนน้ำเลย เพราะปลาอยู่ในน้ำอยู่แล้ว", feedback: "น้ำที่ไม่เปลี่ยนจะสกปรกจากของเสียและเศษอาหาร ปลาต้องการน้ำสะอาด" }
    hints:
      - "ปลาต้องการอาหาร น้ำ และอากาศเหมือนสัตว์อื่น"
      - "อาหารที่มากเกินไปทำให้น้ำเป็นอย่างไร"
    solution: "ให้อาหารพอดี เปลี่ยนน้ำสะอาด และให้อากาศถ่ายเท ปลาจึงได้อาหาร น้ำ และอากาศอย่างเหมาะสม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.needs-life-cycles.p008
    topics: [biology.animals.needs-life-cycles]
    difficulty: 3
    type: order
    stem: "เรียงวัฏจักรชีวิตของกบ เริ่มจากไข่"
    items:
      - "ไข่ในวุ้น"
      - "ลูกอ๊อด"
      - "ลูกอ๊อดมีขา"
      - "ลูกกบที่หางสั้นลง"
      - "กบโตเต็มวัย"
    hints:
      - "ลูกอ๊อดมีหางก่อน แล้วค่อยงอกขา"
      - "หางหดสั้นลงเมื่อใกล้เป็นกบ"
    solution: "ไข่ในวุ้น → ลูกอ๊อด → ลูกอ๊อดมีขา → ลูกกบที่หางสั้นลง → กบโตเต็มวัย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.needs-life-cycles.p009
    topics: [biology.animals.needs-life-cycles]
    difficulty: 3
    type: mcq
    stem: "วัฏจักรชีวิตของกบกับไก่ เหมือนกันในข้อใด"
    choices:
      - { id: a, text: "เริ่มต้นชีวิตจากไข่ทั้งคู่", correct: true }
      - { id: b, text: "ลูกที่ออกจากไข่มีรูปร่างเหมือนพ่อแม่ทั้งคู่", feedback: "ลูกไก่คล้ายไก่ แต่ลูกอ๊อดไม่เหมือนกบเลย" }
      - { id: c, text: "ลูกอยู่ในน้ำและหายใจด้วยเหงือกทั้งคู่", feedback: "เฉพาะลูกอ๊อดที่อยู่ในน้ำและหายใจด้วยเหงือก ลูกไก่หายใจด้วยปอด" }
      - { id: d, text: "แม่คลอดลูกเป็นตัวทั้งคู่", feedback: "ทั้งกบและไก่ออกลูกเป็นไข่ สัตว์ที่คลอดลูกเป็นตัวคือสัตว์เลี้ยงลูกด้วยน้ำนม" }
    hints:
      - "ดูภาพวัฏจักรชีวิตของกบและไก่ ระยะแรกคืออะไร"
      - "ระวังข้อที่จริงสำหรับสัตว์ชนิดเดียว"
    solution: "ทั้งกบและไก่เริ่มชีวิตจากไข่ แต่ไข่กบอยู่ในวุ้นในน้ำ ไข่ไก่มีเปลือกแข็ง และลูกอ๊อดเปลี่ยนรูปร่างมาก ส่วนลูกไก่คล้ายพ่อแม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.needs-life-cycles.p010
    topics: [biology.animals.needs-life-cycles]
    difficulty: 3
    type: numeric
    stem: "ยุงลายวางไข่ในน้ำขังในแจกันศาลพระภูมิ ไข่ฟักเป็นลูกน้ำใน 2 วัน เป็นลูกน้ำ 5 วัน และเป็นตัวโม่ง 2 วัน จากวันที่วางไข่จนเป็นยุงใช้เวลากี่วัน"
    answer: { value: 9, unit: วัน }
    hints:
      - "ยุงต้องผ่านระยะไข่ ลูกน้ำ และตัวโม่ง ก่อนเป็นยุง"
      - "นำจำนวนวันของแต่ละระยะมารวมกัน"
    misconceptions:
      - { match: 7, feedback: "ลืมนับ 2 วันของระยะใดระยะหนึ่ง ต้องรวมทั้งไข่ ลูกน้ำ และตัวโม่ง" }
      - { match: 20, feedback: "นำจำนวนวันมาคูณกัน เวลาของแต่ละระยะต่อกันไป จึงต้องบวก" }
    solution: "$2 + 5 + 2 = 9$ วัน ถ้าเปลี่ยนน้ำทุก 7 วัน ลูกน้ำจะกลายเป็นยุงไม่ทัน จึงช่วยป้องกันไข้เลือดออก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.needs-life-cycles.p011
    topics: [biology.animals.needs-life-cycles]
    difficulty: 3
    type: mcq
    stem: "ตั๊กแตนมีวัฏจักรชีวิต ไข่ → ตัวอ่อน → ตัวเต็มวัย ข้อใดบอกความต่างจากวัฏจักรชีวิตของผีเสื้อได้ถูกต้อง"
    choices:
      - { id: a, text: "ตั๊กแตนไม่มีระยะดักแด้ และตัวอ่อนคล้ายตัวเต็มวัยแต่ยังไม่มีปีก", correct: true }
      - { id: b, text: "ตั๊กแตนไม่วางไข่ แต่คลอดลูกเป็นตัว", feedback: "ตั๊กแตนเริ่มจากไข่เหมือนผีเสื้อ" }
      - { id: c, text: "ตัวอ่อนของตั๊กแตนเป็นหนอนเหมือนผีเสื้อ", feedback: "ตัวอ่อนตั๊กแตนมีหัว อก ขาเหมือนตั๊กแตน แค่ตัวเล็กและไม่มีปีก ไม่ใช่หนอน" }
      - { id: d, text: "ตั๊กแตนมีวัฏจักร 4 ระยะเท่าผีเสื้อ", feedback: "ตั๊กแตนมี 3 ระยะ ผีเสื้อมี 4 ระยะ" }
    hints:
      - "นับจำนวนระยะของทั้งสองชนิด"
      - "ระยะใดของผีเสื้อที่ตั๊กแตนไม่มี"
    solution: "ผีเสื้อมี 4 ระยะ (ไข่ หนอน ดักแด้ ตัวเต็มวัย) ตั๊กแตนมี 3 ระยะ ไม่มีดักแด้ และตัวอ่อนคล้ายตัวเต็มวัยแต่ไม่มีปีก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.needs-life-cycles.p012
    topics: [biology.animals.needs-life-cycles]
    difficulty: 4
    type: mcq
    stem: "ข้อใดเป็นสิ่งที่วัฏจักรชีวิตของสัตว์ทุกชนิดมีเหมือนกัน"
    choices:
      - { id: a, text: "เกิด เจริญเติบโต สืบพันธุ์ และตาย", correct: true }
      - { id: b, text: "มีระยะดักแด้", feedback: "ระยะดักแด้พบในแมลงบางชนิด เช่น ผีเสื้อ ยุง ไม่พบในกบ ไก่ หรือคน" }
      - { id: c, text: "เริ่มต้นจากไข่ที่แม่วางไว้ข้างนอก", feedback: "สัตว์เลี้ยงลูกด้วยน้ำนมส่วนใหญ่ เช่น คน แมว คลอดลูกเป็นตัว" }
      - { id: d, text: "มี 4 ระยะเท่ากัน", feedback: "จำนวนระยะต่างกัน เช่น ตั๊กแตน 3 ระยะ ผีเสื้อ 4 ระยะ กบแบ่งได้ 5 ระยะ" }
    hints:
      - "หาข้อที่เป็นจริงกับผีเสื้อ กบ ไก่ และคนพร้อมกัน"
      - "ทุกชีวิตเริ่มต้น เติบโต มีลูก และจบลง"
    solution: "สัตว์ทุกชนิดเกิด เจริญเติบโต สืบพันธุ์มีลูก และตาย ส่วนจำนวนระยะ การวางไข่ และระยะดักแด้ต่างกันไปตามชนิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.needs-life-cycles.p013
    topics: [biology.animals.needs-life-cycles]
    difficulty: 4
    type: match
    stem: "จับคู่กลุ่มสัตว์กับลักษณะของวัฏจักรชีวิต"
    pairs:
      - { left: "สัตว์เลี้ยงลูกด้วยน้ำนม เช่น วัว", right: "คลอดลูกเป็นตัว ลูกกินนมแม่" }
      - { left: "สัตว์ปีก เช่น นกพิราบ", right: "วางไข่เปลือกแข็ง พ่อแม่กกไข่" }
      - { left: "สัตว์สะเทินน้ำสะเทินบก เช่น คางคก", right: "วางไข่ในน้ำ ลูกหายใจด้วยเหงือก แล้วเปลี่ยนรูปร่าง" }
