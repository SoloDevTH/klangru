id: thai.composition.word-choice
subject: thai
title: { th: การเขียนสื่อสารด้วยถ้อยคำที่ถูกต้องเหมาะสม, en: "Writing with accurate and appropriate words" }
summary: เลือกคำให้ถูกความหมาย เขียนให้ชัดเจนไม่กำกวม ใช้ระดับภาษาให้เหมาะกับผู้อ่าน ตัดคำฟุ่มเฟือยให้สละสลวย และเขียนข้อความสั้นให้ครบตรงวัตถุประสงค์
difficulty: 3
minutes: 30
prerequisites: [thai.grammar.sentences-basic, thai.writing.spelling-basics]
encompasses:
  - { id: thai.grammar.sentences-basic, weight: 0.2 }
  - { id: thai.writing.spelling-basics, weight: 0.1 }
curriculum_tags: []
lessons:
  - type: figure
    src: message-revision.svg
    alt: "ข้อความถึงครูก่อนแก้: ครูคะ งานพรุ่งนี้ยกเลิกใช่มั้ยคะ เยอะมากเลย ลูกศรไปยังข้อความหลังแก้: เรียน คุณครูสมใจ หนูทำการบ้านวิทยาศาสตร์ที่ต้องส่งพรุ่งนี้ไม่เสร็จ เพราะมี 20 ข้อ ขออนุญาตส่งวันศุกร์ได้ไหมคะ ขอบคุณค่ะ ด้านล่างบอกสิ่งที่แก้ 3 ข้อ: 1 ชัดเจน งาน เป็น การบ้านวิทยาศาสตร์ เยอะ เป็น 20 ข้อ 2 ถูกความหมาย ยกเลิก ไม่ใช่สิ่งที่อยากถาม เป็น ขออนุญาตส่งวันศุกร์ 3 เหมาะกับผู้อ่าน มีคำขึ้นต้น เรียน และคำขอบคุณ มั้ย เป็น ไหม"
    caption: "ข้อความเดียวกัน แก้ให้ถูกต้อง ชัดเจน และเหมาะกับผู้อ่าน"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: แก้ประโยคให้กระชับและเป็นแบบไทย
    problem: "แก้ประโยค \"มันเป็นการยากที่ทางโรงเรียนจะทำการจัดงานกีฬาสีในหน้าฝน\""
    steps:
      - text: "หาสำนวนต่างประเทศ: มันเป็นการยากที่จะ... มาจาก It is difficult to..."
      - text: "หาคำฟุ่มเฟือย: ทำการ ไม่เพิ่มความหมาย และ ทาง หน้า โรงเรียน ไม่จำเป็น"
      - text: "เรียงใหม่ให้ประธานขึ้นก่อน: โรงเรียน + จัดงานกีฬาสีในหน้าฝน + ได้ยาก"
        why: "ประโยคไทยมักเรียง ประธาน กริยา แล้วจึงบอกว่ายากหรือง่าย"
      - text: "อ่านทวนว่าความหมายเหมือนเดิม: ยังบอกครบว่าใครทำอะไร และยากเพราะช่วงเวลาใด"
    answer: "โรงเรียนจัดงานกีฬาสีในหน้าฝนได้ยาก"
  - { type: check, problem: thai.composition.word-choice.p005, prompt: "หาคำที่ตัดแล้วความหมายไม่เปลี่ยน" }
  - type: worked-example
    title: เขียนข้อความนัดหมายให้ครบ
    problem: "เขียนข้อความถึงเพื่อนในกลุ่มงาน นัดทำโครงงานวันเสาร์ที่ 7 พฤศจิกายน 9 โมงเช้า ที่ห้องสมุดประชาชน ให้นำแล็ปท็อปมาด้วย"
    steps:
      - text: "ผู้อ่านคือเพื่อน ใช้ภาษาสุภาพแบบเป็นกันเองได้ แต่ข้อมูลต้องครบ"
      - text: "จดสาระ: ใคร (กลุ่มเรา) ทำอะไร (ทำโครงงาน) เมื่อไร (เสาร์ 7 พ.ย. 9.00 น.) ที่ไหน (ห้องสมุดประชาชน) เตรียมอะไร (แล็ปท็อป)"
        why: "ข้อมูลที่ขาดไปข้อเดียว เช่น เวลา ทำให้นัดพลาดได้"
      - text: "เรียงเป็นข้อความสั้น: นัดทำโครงงานวันเสาร์ที่ 7 พฤศจิกายน 9.00 น. ที่ห้องสมุดประชาชน ช่วยกันนำแล็ปท็อปมาด้วยนะ"
      - text: "ตรวจ: ไม่มีคำว่า ที่เดิม หรือ เร็ว ๆ นี้ ที่คลุมเครือ"
    answer: "นัดทำโครงงานวันเสาร์ที่ 7 พฤศจิกายน เวลา 9.00 น. ที่ห้องสมุดประชาชน ช่วยกันนำแล็ปท็อปมาด้วยนะ"
  - { type: check, problem: thai.composition.word-choice.p007, prompt: "ไล่ตรวจ ใคร ทำอะไร ที่ไหน เมื่อไร" }
glossary:
  - { term: กำกวม, definition: "มีความหมายได้หลายนัย อ่านแล้วตีความได้มากกว่าหนึ่งแบบ" }
  - { term: คลุมเครือ, definition: "ไม่บ่งชัด ขาดข้อมูลที่ผู้อ่านต้องรู้ เช่น ที่เดิม เร็ว ๆ นี้" }
  - { term: คำฟุ่มเฟือย, definition: "คำที่เกินความจำเป็น ตัดออกแล้วความหมายไม่เปลี่ยน เช่น ทำการ มีการ" }
  - { term: สละสลวย, definition: "เรียบเรียงได้ความ กลมกลืน และไพเราะ" }
  - { term: ระดับภาษา, definition: "ความเป็นทางการของถ้อยคำ เลือกให้เหมาะกับผู้อ่านและโอกาส" }
flashcards:
  - { front: "ถ้อยคำที่ดีในงานเขียนมีลักษณะอย่างไร", back: "ถูกต้อง ชัดเจน เหมาะสม และสละสลวย" }
  - { front: "เลื่อน กับ ยกเลิก ต่างกันอย่างไร", back: "เลื่อน = ย้ายไปวันอื่น ยังจัดอยู่ · ยกเลิก = ไม่จัดแล้ว" }
  - { front: "แก้ มันเป็นการยากที่จะตื่นเช้า", back: "ตื่นเช้าได้ยาก หรือ การตื่นเช้าเป็นเรื่องยาก" }
  - { front: "ข้อความนัดหมายต้องมีอะไรบ้าง", back: "ใคร ทำอะไร ที่ไหน เมื่อไร (วันและเวลา) และสิ่งที่ต้องเตรียม" }
