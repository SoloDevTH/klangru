<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="sans-serif">
<title>โครงสร้างเรียงความแสดงเหตุผลห้าส่วน</title>
<rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
<text x="380" y="34" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">โครงสร้างเรียงความแสดงเหตุผล</text>
<rect x="30" y="60" width="400" height="64" rx="8" fill="#e8f0fb" stroke="#1d3f75" stroke-width="2"/>
<text x="230.0" y="86" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">บทนำ (introduction)</text>
<text x="230.0" y="108" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">ประโยคเปิด → ภูมิหลัง → thesis statement</text>
<line x1="444" y1="92.0" x2="470" y2="92.0" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="478" y="97.0" font-size="14" fill="#111" text-anchor="start" font-weight="normal">ตั้งจุดยืนให้ชัด</text>
<line x1="230.0" y1="124" x2="230.0" y2="138" stroke="#555" stroke-width="2" stroke-linecap="round"/>
<polygon points="230.0,138 225.22,128.10 234.78,128.10" fill="#555"/>
<rect x="30" y="138" width="400" height="64" rx="8" fill="#eaf4ee" stroke="#2e6b4f" stroke-width="2"/>
<text x="230.0" y="164" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">ย่อหน้าเนื้อเรื่องที่ 1</text>
<text x="230.0" y="186" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Point → Evidence → Explain → Link</text>
<line x1="444" y1="170.0" x2="470" y2="170.0" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="478" y="175.0" font-size="14" fill="#111" text-anchor="start" font-weight="normal">ประเด็นแรกที่สนับสนุน thesis</text>
<line x1="230.0" y1="202" x2="230.0" y2="216" stroke="#555" stroke-width="2" stroke-linecap="round"/>
<polygon points="230.0,216 225.22,206.10 234.78,206.10" fill="#555"/>
<rect x="30" y="216" width="400" height="64" rx="8" fill="#eaf4ee" stroke="#2e6b4f" stroke-width="2"/>
<text x="230.0" y="242" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">ย่อหน้าเนื้อเรื่องที่ 2</text>
<text x="230.0" y="264" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Point → Evidence → Explain → Link</text>
<line x1="444" y1="248.0" x2="470" y2="248.0" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="478" y="253.0" font-size="14" fill="#111" text-anchor="start" font-weight="normal">ประเด็นที่สองที่สนับสนุน thesis</text>
<line x1="230.0" y1="280" x2="230.0" y2="294" stroke="#555" stroke-width="2" stroke-linecap="round"/>
<polygon points="230.0,294 225.22,284.10 234.78,284.10" fill="#555"/>
<rect x="30" y="294" width="400" height="64" rx="8" fill="#fbeeee" stroke="#b3261e" stroke-width="2"/>
<text x="230.0" y="320" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">ข้อโต้แย้งฝ่ายตรงข้าม</text>
<text x="230.0" y="342" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">ยอมรับความเห็นอื่น → ตอบโต้ด้วยเหตุผล</text>
<line x1="444" y1="326.0" x2="470" y2="326.0" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="478" y="331.0" font-size="14" fill="#111" text-anchor="start" font-weight="normal">รับฟังฝ่ายที่คิดต่างอย่างเป็นธรรม</text>
<line x1="230.0" y1="358" x2="230.0" y2="372" stroke="#555" stroke-width="2" stroke-linecap="round"/>
<polygon points="230.0,372 225.22,362.10 234.78,362.10" fill="#555"/>
<rect x="30" y="372" width="400" height="64" rx="8" fill="#f7f1e6" stroke="#9a4d00" stroke-width="2"/>
<text x="230.0" y="398" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">บทสรุป (conclusion)</text>
<text x="230.0" y="420" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">ย้ำ thesis → ภาพรวม → ปิดด้วยความคิดสำคัญ</text>
<line x1="444" y1="404.0" x2="470" y2="404.0" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="478" y="409.0" font-size="14" fill="#111" text-anchor="start" font-weight="normal">ไม่นำข้อมูลใหม่มาในส่วนนี้</text>
<text x="380" y="456" font-size="13" fill="#444" text-anchor="middle" font-weight="normal">ลูกศรแสดงลำดับการอ่าน ย่อหน้าเนื้อเรื่องแต่ละย่อหน้ามีประเด็นเดียว</text>
</svg>
