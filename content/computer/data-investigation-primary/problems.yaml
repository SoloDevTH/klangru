problems:
  - id: computer.data.data-investigation-primary.p001
    topics: [computer.data.data-investigation-primary]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นคำถามที่ตอบได้ด้วยข้อมูล"
    choices:
      - { id: a, text: "เพื่อนในห้องชอบกินผลไม้ชนิดใดมากที่สุด", correct: true }
      - { id: b, text: "ความรักแบบไหนดีที่สุดในโลก", feedback: "คำตอบขึ้นกับความคิดและความรู้สึกของแต่ละคน ไม่มีคำตอบเดียวจากการนับ" }
      - { id: c, text: "ใครควรเป็นหัวหน้าห้องที่ดีที่สุด", feedback: "คำว่าดีต้องตกลงก่อนว่าวัดจากอะไร และยังขึ้นกับคุณค่าของห้องเรียนด้วย" }
      - { id: d, text: "ทำไมเราจึงรู้สึกเหงาในบางวัน", feedback: "เป็นเรื่องความรู้สึกภายใน การนับหรือวัดจากคนอื่นตอบได้ไม่ตรงประเด็น" }
    hints:
      - "ลองถามว่าคำตอบนั้นมาจากการนับหรือวัดสิ่งที่เห็นได้หรือไม่"
      - "ข้อที่ตอบได้ต้องมีสิ่งที่เรานับได้จากคนในห้อง"
    solution: "เพื่อนในห้องชอบผลไม้ชนิดใดมากที่สุดตอบได้ด้วยการนับคำตอบจากคนในห้อง ข้ออื่นต้องใช้ความคิด ความรู้สึก หรือคุณค่าในการตอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-investigation-primary.p002
    topics: [computer.data.data-investigation-primary]
    difficulty: 1
    type: match
    stem: "จับคู่ข้อมูลแต่ละอย่างกับประเภทที่ถูกต้อง"
    pairs:
      - { left: "ส่วนสูงของนักเรียน (เซนติเมตร)", right: "ข้อมูลตัวเลข หาค่าเฉลี่ยได้" }
      - { left: "สีเสื้อที่นักเรียนใส่", right: "ข้อมูลที่ไม่ใช่ตัวเลข ใช้นับจำนวนแต่ละสี" }
      - { left: "จำนวนพี่น้องของนักเรียน", right: "ข้อมูลตัวเลข หาผลรวมได้" }
    hints:
      - "ถามว่าสิ่งนั้นวัดหรือนับได้เป็นตัวเลขหรือไม่"
      - "ข้อมูลที่บอกประเภทหรือสี มักต้องนับเป็นกลุ่ม"
    solution: "ส่วนสูงและจำนวนพี่น้องเป็นตัวเลขที่วัดหรือนับได้ ส่วนสีเสื้อเป็นข้อมูลประเภท จึงนับจำนวนแต่ละสีแทนการหาค่าเฉลี่ย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-investigation-primary.p003
    topics: [computer.data.data-investigation-primary]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนการสืบเสาะด้วยข้อมูลให้ถูกต้อง"
    items:
      - "ตั้งคำถามที่ตอบได้ด้วยข้อมูล"
      - "วางแผนเก็บข้อมูลให้ครอบคลุมคนหลากหลาย"
      - "เก็บข้อมูลแล้วตรวจความถูกต้องและความครบ"
      - "จัดลงตารางที่แถวเป็นรายการและคอลัมน์เป็นคุณลักษณะ"
      - "วิเคราะห์ แล้วนำเสนอด้วยแผนภูมิพร้อมข้อสรุป"
    hints:
      - "ต้องรู้ก่อนว่าจะตอบอะไร จึงจะวางแผนเก็บข้อมูลได้"
      - "ข้อมูลควรตรวจก่อนนำไปคำนวณ"
    solution: "เริ่มจากตั้งคำถาม แล้ววางแผนเก็บให้หลากหลาย เก็บและตรวจข้อมูล จัดลงตาราง แล้วจึงวิเคราะห์และนำเสนอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-investigation-primary.p004
    topics: [computer.data.data-investigation-primary]
    difficulty: 1
    type: mcq
    stem: "แบบสอบถามถามว่า 'น้ำหวานรสนี้อร่อยใช่ไหม' มีปัญหาอย่างไร"
    choices:
      - { id: a, text: "คำถามชี้นำให้ตอบไปทางเดียว", correct: true }
      - { id: b, text: "ตอบด้วยตัวเลขไม่ได้เลย", feedback: "คำตอบว่าใช่หรือไม่ใช่ก็นับได้ ปัญหาอยู่ที่คำถามชี้นำมากกว่า" }
      - { id: c, text: "มีคำตอบให้เลือกน้อยเกินไป", feedback: "การมีสองคำตอบไม่ใช่ปัญหาเสมอไป ปัญหาหลักคือการชี้นำ" }
      - { id: d, text: "ควรเปลี่ยนให้ตอบด้วยสีเท่านั้น", feedback: "การเปลี่ยนรูปแบบคำตอบไม่ได้แก้ปัญหาของคำถามที่ชี้นำ" }
    hints:
      - "ลองดูว่าคำถามบอกคำตอบที่ต้องการไว้ล่วงหน้าหรือไม่"
      - "คำถามที่ดีควรเปิดให้ตอบได้หลายทาง"
    solution: "คำถามว่า 'อร่อยใช่ไหม' บอกให้คนตอบว่าใช่ตั้งแต่ต้น จึงเป็นคำถามชี้นำ ควรถามแบบเปิด เช่น ชอบน้ำหวานรสใดมากที่สุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-investigation-primary.p005
    topics: [computer.data.data-investigation-primary]
    difficulty: 2
    type: numeric
    stem: "จากส่วนสูงของนักเรียน 5 คน (เซนติเมตร) ได้แก่ 150, 152, 148, 155 และ 145 ค่าเฉลี่ยของส่วนสูงเป็นกี่เซนติเมตร"
    answer: { value: 150, tolerance: 0, unit: "เซนติเมตร" }
    hints:
      - "ค่าเฉลี่ยคือผลรวมหารด้วยจำนวนค่า"
      - "รวมส่วนสูงทั้งห้าคนก่อน แล้วหารด้วยจำนวนคน"
    solution: "ผลรวม 150 + 152 + 148 + 155 + 145 = 750 เซนติเมตร หาร 5 ได้ 150 เซนติเมตร"
    misconceptions:
      - { match: 750, feedback: "750 คือผลรวมของส่วนสูงทั้งห้าคน ยังไม่ได้หารด้วย 5" }
      - { match: 10, feedback: "10 คือผลต่างระหว่างค่าสูงสุดกับค่าต่ำสุด ซึ่งเป็นความแปรผัน ไม่ใช่ค่าเฉลี่ย" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-investigation-primary.p006
    topics: [computer.data.data-investigation-primary]
    difficulty: 2
    type: numeric
    stem: "เวลาเดินไปโรงเรียนใน 7 วัน (นาที) ได้แก่ 12, 15, 11, 25, 13, 12 และ 14 ความแปรผันของข้อมูล คือผลต่างระหว่างค่าสูงสุดกับค่าต่ำสุดกี่นาที"
    answer: { value: 14, tolerance: 0, unit: "นาที" }
    hints:
      - "หาค่าสูงสุดและค่าต่ำสุดของชุดข้อมูลก่อน"
      - "ความแปรผันแบบง่ายคือค่าสูงสุดลบค่าต่ำสุด"
    solution: "ค่าสูงสุดคือ 25 นาที ค่าต่ำสุดคือ 11 นาที ผลต่างคือ 25 − 11 = 14 นาที"
    misconceptions:
      - { match: 25, feedback: "25 คือค่าสูงสุด ยังไม่ได้ลบค่าต่ำสุด" }
      - { match: 14.57, feedback: "14.57 คือค่าเฉลี่ยของเวลาทั้งเจ็ดวัน ไม่ใช่ความแปรผัน" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-investigation-primary.p007
    topics: [computer.data.data-investigation-primary]
    difficulty: 2
    type: mcq
    stem: "ตารางบันทึกชื่อ ชั้น ผลไม้ที่ชอบ และจำนวนพี่น้องของนักเรียน 6 คน ควรจัดแบบใด"
    choices:
      - { id: a, text: "แถวแต่ละแถวคือนักเรียนหนึ่งคน และคอลัมน์แต่ละคอลัมน์คือคุณลักษณะหนึ่งอย่าง", correct: true }
      - { id: b, text: "แถวแต่ละแถวคือคุณลักษณะ และคอลัมน์แต่ละคอลัมน์คือนักเรียน", feedback: "สลับกันทำให้อ่านข้อมูลของแต่ละคนยาก และการนับในคอลัมน์ไม่ตรงกับความหมาย" }
      - { id: c, text: "มีแถวเดียว และแต่ละช่องเก็บคำตอบของทุกคนรวมกัน", feedback: "แบบนี้ไม่เห็นข้อมูลของแต่ละคนแยกกัน จึงวิเคราะห์ความสัมพันธ์ไม่ได้" }
      - { id: d, text: "ไม่ต้องจัดเป็นตาราง เขียนเป็นประโยคยาว ๆ ก็พอ", feedback: "ประโยคยาวทำให้หาค่าเฉลี่ยหรือนับในแต่ละคุณลักษณะได้ยาก" }
    hints:
      - "ดูว่าแต่ละแถวควรเป็นหนึ่งหน่วยของการเก็บข้อมูลหรือไม่"
      - "คอลัมน์ควรเก็บคุณลักษณะที่เหมือนกันของทุกคน"
    solution: "แถวคือนักเรียนหนึ่งคน คอลัมน์คือคุณลักษณะ เช่น ชื่อ ชั้น ผลไม้ที่ชอบ และจำนวนพี่น้อง ทำให้อ่านรายคนและนับในคอลัมน์ได้ง่าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-investigation-primary.p008
    topics: [computer.data.data-investigation-primary]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นวิธีที่ช่วยให้ข้อมูลไม่ลำเอียง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ถามคนจากหลายชั้นและหลายกลุ่มเพื่อน ไม่ใช่แค่กลุ่มเดียว", correct: true }
      - { id: b, text: "ใช้คำถามเปิดที่ไม่บอกคำตอบล่วงหน้า", correct: true }
      - { id: c, text: "ตรวจว่ามีคนตอบซ้ำหรือเว้นว่างหลายข้อหรือไม่", correct: true }
      - { id: d, text: "ถามเฉพาะเพื่อนสนิทที่ชอบของเหมือนเรา", feedback: "ได้คำตอบของกลุ่มเล็กที่คล้ายกัน ทำให้ข้อมูลลำเอียงไปทางกลุ่มนั้น" }
    hints:
      - "ข้อมูลที่ลำเอียงมักมาจากการเลือกคนหรือการถามที่ชี้นำ"
      - "ลองคิดว่าการตรวจข้อมูลก่อนสรุปช่วยอะไรได้บ้าง"
    solution: "การถามคนหลายกลุ่ม ใช้คำถามเปิด และตรวจความซ้ำหรือความครบ ช่วยลดความลำเอียง ส่วนการถามเฉพาะเพื่อนสนิทที่ชอบของเหมือนกันทำให้ผลลำเอียง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-investigation-primary.p009
    topics: [computer.data.data-investigation-primary]
    difficulty: 2
    type: numeric
    stem: "ร้านน้ำในโรงอาหารบันทึกยอดขายน้ำ 5 วัน (แก้ว) ได้ 80, 95, 110, 150 และ 120 ค่าเฉลี่ยของยอดขายต่อวันกี่แก้ว"
    answer: { value: 111, tolerance: 0, unit: "แก้ว" }
    hints:
      - "เริ่มจากรวมยอดขายทุกวันก่อน"
      - "หารผลรวมด้วยจำนวนวันที่บันทึก"
    solution: "ผลรวม 80 + 95 + 110 + 150 + 120 = 555 แก้ว หาร 5 วัน ได้ 111 แก้วต่อวัน"
    misconceptions:
      - { match: 555, feedback: "555 คือยอดขายรวมทั้ง 5 วัน ยังไม่ได้หาค่าเฉลี่ยต่อวัน" }
      - { match: 110, feedback: "110 คือค่าที่อยู่ตรงกลางเมื่อเรียงลำดับ (มัธยฐาน) ไม่ใช่ค่าเฉลี่ย" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-investigation-primary.p010
    topics: [computer.data.data-investigation-primary]
    difficulty: 3
    type: numeric
    stem: "ตารางบันทึกอุณหภูมิสูงสุดและยอดขายน้ำ 6 วัน ได้แก่ จันทร์ 31 องศา 120 แก้ว อังคาร 34 องศา 150 แก้ว พุธ 29 องศา 80 แก้ว พฤหัสบดี 35 องศา 160 แก้ว ศุกร์ 30 องศา 95 แก้ว และเสาร์ 33 องศา 110 แก้ว มีกี่วันที่อุณหภูมิอย่างน้อย 33 องศา และยอดขายอย่างน้อย 110 แก้วพร้อมกัน"
    answer: { value: 3, tolerance: 0, unit: "วัน" }
    hints:
      - "ดูว่าแต่ละวันต้องผ่านทั้งสองเงื่อนไขพร้อมกัน"
      - "ไล่ดูทีละวัน ตรวจอุณหภูมิก่อน แล้วจึงตรวจยอดขาย"
    solution: "อังคาร (34 องศา 150 แก้ว) พฤหัสบดี (35 องศา 160 แก้ว) และเสาร์ (33 องศา 110 แก้ว) ผ่านทั้งสองเงื่อนไข จึงมี 3 วัน"
    misconceptions:
      - { match: 4, feedback: "4 คือจำนวนวันที่ยอดขายอย่างน้อย 110 แก้ว แต่โจทย์ต้องดูอุณหภูมิประกอบด้วย" }
      - { match: 6, feedback: "6 คือจำนวนวันทั้งหมดที่บันทึก ยังไม่ได้กรองตามเงื่อนไข" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-investigation-primary.p011
    topics: [computer.data.data-investigation-primary]
    difficulty: 3
    type: numeric
    stem: "ตารางยอดขายน้ำ 6 วันรวมกันได้ 715 แก้ว ถ้าเพิ่มวันอาทิตย์ที่ขายได้ 170 แก้ว ค่าเฉลี่ยยอดขายต่อวันจากทั้งเจ็ดวันเป็นกี่แก้ว (ตอบเป็นทศนิยม 2 ตำแหน่ง)"
    answer: { value: 126.43, tolerance: 0.01, unit: "แก้ว" }
    hints:
      - "รวมยอดขายทั้งเจ็ดวันก่อน โดยนำ 170 ไปบวกกับ 715"
      - "หารด้วย 7 ไม่ใช่ 6 เพราะมีเจ็ดวัน"
    solution: "ยอดขายรวม 715 + 170 = 885 แก้ว หาร 7 วัน ได้ประมาณ 126.43 แก้วต่อวัน"
    misconceptions:
      - { match: 119.17, feedback: "119.17 คือค่าเฉลี่ยของ 6 วันเดิม ยังไม่ได้รวมวันอาทิตย์" }
      - { match: 885, feedback: "885 คือยอดขายรวมทั้งเจ็ดวัน ยังไม่ได้หารด้วย 7" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.data.data-investigation-primary.p012
    topics: [computer.data.data-investigation-primary]
    difficulty: 3
    type: mcq
    stem: "นักเรียนพบว่าวันที่ขายน้ำได้มาก โรงอาหารก็มีคนมาซื้อของมากด้วย ข้อสรุปใดระวังมากที่สุด"
    choices:
      - { id: a, text: "อาจมีปัจจัยอื่น เช่น อากาศร้อน ที่ทำให้ทั้งสองอย่างเพิ่มพร้อมกัน จึงต้องตรวจเพิ่มก่อนสรุปเรื่องสาเหตุ", correct: true }
      - { id: b, text: "คนมาโรงอาหารมากทำให้ขายน้ำได้มากแน่นอน", feedback: "การเกิดพร้อมกันไม่ได้แปลว่าอย่างหนึ่งเป็นสาเหตุของอีกอย่างเสมอไป" }
      - { id: c, text: "ไม่มีความสัมพันธ์เลยเพราะเป็นคนละเรื่องกัน", feedback: "สองอย่างที่เปลี่ยนไปพร้อมกันอาจมีความสัมพันธ์จริง จึงไม่ควรปัดทิ้งโดยไม่ตรวจ" }
      - { id: d, text: "ควรตัดวันที่ขายน้ำได้มากออกจากข้อมูล", feedback: "ข้อมูลที่เกิดขึ้นจริงไม่ควรตัดทิ้งเพียงเพราะไม่ตรงกับที่คาดไว้" }
    hints:
