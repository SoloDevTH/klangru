problems:
  - id: physics.nuclear.radioactivity.p001
    topics: [physics.nuclear.radioactivity]
    difficulty: 1
    type: mcq
    stem: "รังสีชนิดใดถูกกั้นได้ด้วยกระดาษเพียงแผ่นเดียว"
    choices:
      - { id: a, text: "รังสีแอลฟา", correct: true }
      - { id: b, text: "รังสีบีตา", feedback: "รังสีบีตาผ่านกระดาษได้ ต้องใช้แผ่นอะลูมิเนียมหนาไม่กี่มิลลิเมตรจึงกั้นได้" }
      - { id: c, text: "รังสีแกมมา", feedback: "รังสีแกมมาทะลุผ่านได้มากที่สุด แม้ตะกั่วหนาก็ลดได้แต่ไม่หมด" }
    hints:
      - "รังสีที่มีมวลมากและประจุมากชนอะตอมบ่อย จึงเสียพลังงานเร็ว"
      - "รังสีนี้คือนิวเคลียสฮีเลียม"
    solution: "รังสีแอลฟาเป็นนิวเคลียสฮีเลียมที่มีประจุ $+2$ ทำให้อะตอมที่ชนแตกตัวเป็นไอออนมากและเสียพลังงานเร็ว จึงทะลุผ่านได้น้อยที่สุด กระดาษแผ่นเดียวก็กั้นได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.radioactivity.p002
    topics: [physics.nuclear.radioactivity]
    difficulty: 1
    type: match
    stem: "จับคู่รังสีกับสิ่งที่รังสีนั้นเป็น"
    pairs:
      - { left: "รังสีแอลฟา", right: "นิวเคลียสฮีเลียม มีประจุ +2" }
      - { left: "รังสีบีตาลบ", right: "อิเล็กตรอนที่เกิดในนิวเคลียส มีประจุ −1" }
      - { left: "รังสีแกมมา", right: "คลื่นแม่เหล็กไฟฟ้าพลังงานสูง ไม่มีประจุ" }
    hints:
      - "รังสีชนิดใดไม่เบี่ยงในสนามแม่เหล็ก"
      - "รังสีชนิดใดมีเลขมวล 4"
    solution: "แอลฟาคือ $^{4}_{2}\\mathrm{He}$ บีตาลบคืออิเล็กตรอน และแกมมาคือคลื่นแม่เหล็กไฟฟ้า จึงไม่มีประจุและไม่เบี่ยงในสนาม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.radioactivity.p003
    topics: [physics.nuclear.radioactivity]
    difficulty: 2
    type: numeric
    stem: "โรงพยาบาลแห่งหนึ่งได้รับไอโอดีน-131 มา $80\\ \\mathrm{mg}$ ไอโอดีน-131 มีครึ่งชีวิตประมาณ $8$ วัน เมื่อผ่านไป $24$ วัน จะเหลือไอโอดีน-131 กี่มิลลิกรัม"
    answer: { value: 10, tolerance: 0.1, unit: mg }
    misconceptions:
      - { match: 0, feedback: "ครึ่งชีวิตไม่ได้ทำให้หมดในเวลาที่กำหนด ทุกครึ่งชีวิตเหลือครึ่งหนึ่งของที่มีอยู่" }
      - { match: 26.7, feedback: "หาร 80 ด้วย 3 (จำนวนครึ่งชีวิต) ที่ถูกต้องคือหารด้วย 2 สามครั้ง" }
    hints:
      - "24 วันเป็นกี่ครึ่งชีวิต"
      - "ทุกครึ่งชีวิตเหลือครึ่งหนึ่ง: 80 → 40 → ..."
    solution: "$24/8 = 3$ ครึ่งชีวิต $80 \\to 40 \\to 20 \\to 10\\ \\mathrm{mg}$ หรือ $80 \\times \\left(\\tfrac12\\right)^3 = 10\\ \\mathrm{mg}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.radioactivity.p004
    topics: [physics.nuclear.radioactivity]
    difficulty: 2
    type: mcq
    stem: "นิวเคลียสสลายให้รังสีบีตาลบออกมาหนึ่งอนุภาค เลขมวลและเลขอะตอมของนิวเคลียสลูกเป็นอย่างไรเมื่อเทียบกับนิวเคลียสเดิม"
    choices:
      - { id: a, text: "เลขมวลเท่าเดิม เลขอะตอมเพิ่มขึ้น 1", correct: true }
      - { id: b, text: "เลขมวลเท่าเดิม เลขอะตอมลดลง 1", feedback: "อิเล็กตรอนมีประจุ −1 เมื่อออกไป ประจุในนิวเคลียสต้องเพิ่มขึ้น 1 เพื่อให้ประจุรวมคงเดิม" }
      - { id: c, text: "เลขมวลลดลง 4 เลขอะตอมลดลง 2", feedback: "นี่คือการสลายให้รังสีแอลฟา" }
      - { id: d, text: "เลขมวลและเลขอะตอมไม่เปลี่ยน", feedback: "นี่คือการปล่อยรังสีแกมมา ซึ่งเป็นแค่การคายพลังงาน" }
    hints:
      - "ในการสลายบีตาลบ นิวตรอนเปลี่ยนเป็นอนุภาคอะไร"
      - "เขียนสมการให้ผลรวมเลขอะตอมสองข้างเท่ากัน อิเล็กตรอนมีเลขอะตอม −1"
    solution: "นิวตรอนเปลี่ยนเป็นโปรตอนและอิเล็กตรอน อิเล็กตรอนออกไปเป็นรังสีบีตา จำนวนโปรตอนจึงเพิ่ม 1 ส่วนจำนวนนิวคลีออนรวมเท่าเดิม เลขมวลจึงไม่เปลี่ยน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.radioactivity.p005
    topics: [physics.nuclear.radioactivity]
    difficulty: 2
    type: text
    stem: "เติมอนุภาคที่หายไปในสมการ $^{226}_{88}\\mathrm{Ra} \\rightarrow\\ ^{222}_{86}\\mathrm{Rn} + \\ ?$ รังสีนี้ชื่อว่ารังสีอะไร (ตอบชื่อรังสี)"
    accepted: ["แอลฟา", "รังสีแอลฟา", "อนุภาคแอลฟา", "alpha", "α", "ฮีเลียม", "นิวเคลียสฮีเลียม"]
    misconceptions:
      - { match: "บีตา", feedback: "บีตาไม่เปลี่ยนเลขมวล แต่สมการนี้เลขมวลลดลง 4" }
      - { match: "แกมมา", feedback: "แกมมาไม่เปลี่ยนเลขมวลและเลขอะตอม แต่สมการนี้ทั้งสองค่าลดลง" }
    hints:
      - "หาเลขมวลที่หายไป: 226 − 222 และเลขอะตอมที่หายไป: 88 − 86"
      - "อนุภาคที่มีเลขมวล 4 และเลขอะตอม 2 คืออะไร"
    solution: "อนุภาคที่หายไปมีเลขมวล $226 - 222 = 4$ และเลขอะตอม $88 - 86 = 2$ คือ $^{4}_{2}\\mathrm{He}$ หรือรังสีแอลฟา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.radioactivity.p006
    topics: [physics.nuclear.radioactivity]
    difficulty: 2
    type: mcq
    stem: "ผู้ใหญ่บ้านแจ้งว่ามีคนพบกล่องโลหะหนักมีสัญลักษณ์ใบพัดสามแฉกสีม่วงบนพื้นเหลืองที่ร้านรับซื้อของเก่าในหมู่บ้าน ควรทำอย่างไร"
    choices:
      - { id: a, text: "ออกห่าง กันไม่ให้ใครเข้าใกล้ แล้วแจ้งตำรวจหรือสำนักงานปรมาณูเพื่อสันติ", correct: true }
      - { id: b, text: "เปิดกล่องดูว่าข้างในเป็นอะไร แล้วค่อยตัดสินใจ", feedback: "ห้ามแกะ ข้างในอาจเป็นแหล่งกำเนิดรังสีแรงสูง กรณีที่สมุทรปราการ พ.ศ. 2543 ผู้ที่แกะชิ้นส่วนได้รับรังสีสูงจนเสียชีวิต" }
      - { id: c, text: "ใส่ถุงมือแล้วยกไปทิ้งในถังขยะไกล ๆ", feedback: "ถุงมือกันรังสีแกมมาไม่ได้ และการย้ายไปทิ้งทำให้คนอื่นเสี่ยงต่อ ต้องให้เจ้าหน้าที่ที่มีเครื่องวัดและเครื่องกำบังจัดการ" }
      - { id: d, text: "เอาน้ำราดล้างกล่องให้สะอาด", feedback: "การล้างไม่ได้หยุดรังสีจากแหล่งข้างใน และอาจทำให้สารที่รั่วออกมาเปรอะเปื้อนกว้างขึ้น" }
    hints:
      - "หลักป้องกันรังสีมีเวลา ระยะทาง และเครื่องกำบัง"
      - "ใครมีเครื่องมือวัดรังสีและอำนาจจัดการ"
    solution: "สัญลักษณ์ใบพัดสามแฉกบอกว่ามีวัสดุกัมมันตรังสี ห้ามจับ เก็บ หรือแกะ ให้ออกห่าง (ลดเวลาและเพิ่มระยะทาง) กันคนอื่น แล้วแจ้งตำรวจหรือ ปส. ให้เจ้าหน้าที่มาตรวจวัด ถ้ามีใครป่วยหลังจับวัตถุนั้นให้โทร 1669"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.radioactivity.p007
    topics: [physics.nuclear.radioactivity]
    difficulty: 3
    type: numeric
    stem: "ตัวอย่างเทคนีเชียม-99m มีนิวเคลียส $2.0 \\times 10^{12}$ นิวเคลียส ครึ่งชีวิต $6.0$ ชั่วโมง กัมมันตภาพของตัวอย่างเป็นกี่เท่าของ $10^{7}\\ \\mathrm{Bq}$ (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 6.4, tolerance: 0.07 }
    misconceptions:
      - { match: 23105, feedback: "ใช้ครึ่งชีวิตเป็นชั่วโมงโดยตรง ต้องแปลงเป็นวินาทีก่อน ($6.0 \\times 3600\\ \\mathrm{s}$) จึงได้กัมมันตภาพเป็นเบกเคอเรล" }
      - { match: 9.3, feedback: "ลืม $\\ln 2$ ค่าคงตัวการสลายคือ $\\lambda = 0.693/T_{1/2}$ ไม่ใช่ $1/T_{1/2}$" }
    hints:
      - "หา $\\lambda = \\dfrac{0.693}{T_{1/2}}$ โดยใช้ $T_{1/2}$ เป็นวินาที"
      - "$A = \\lambda N$"
    solution: "$T_{1/2} = 6.0 \\times 3600 = 21{,}600\\ \\mathrm{s}$ $\\lambda = \\dfrac{0.693}{21{,}600} = 3.21 \\times 10^{-5}\\ \\mathrm{s^{-1}}$ $A = \\lambda N = (3.21 \\times 10^{-5})(2.0 \\times 10^{12}) \\approx 6.4 \\times 10^{7}\\ \\mathrm{Bq}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.radioactivity.p008
    topics: [physics.nuclear.radioactivity]
    difficulty: 3
    type: numeric
    stem: "แหล่งรังสีโคบอลต์-60 (ครึ่งชีวิต $5.27$ ปี) ในเครื่องฉายรังสีใช้งานมา $15.81$ ปี กัมมันตภาพตอนนี้เป็นร้อยละเท่าใดของตอนเริ่มใช้"
    answer: { value: 12.5, tolerance: 0.2, unit: "%" }
    misconceptions:
      - { match: 25, feedback: "นับได้ 2 ครึ่งชีวิต แต่ $15.81 / 5.27 = 3$ ครึ่งชีวิต" }
      - { match: 33.3, feedback: "หาร 100 ด้วย 3 ต้องคูณด้วย $\\tfrac12$ สามครั้ง" }
    hints:
      - "$\\dfrac{15.81}{5.27}$ เป็นกี่ครึ่งชีวิต"
      - "$A = A_0\\left(\\tfrac12\\right)^{n}$"
    solution: "$n = 15.81/5.27 = 3$ ครึ่งชีวิต $A/A_0 = \\left(\\tfrac12\\right)^3 = \\tfrac18 = 12.5\\%$ โรงพยาบาลจึงต้องเปลี่ยนแหล่งรังสีเมื่อกัมมันตภาพต่ำลงจนใช้เวลาฉายนานเกินไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.radioactivity.p009
    topics: [physics.nuclear.radioactivity]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ข้อใดถูกต้อง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "มะม่วงที่ฉายรังสีแกมมาเพื่อกำจัดแมลงก่อนส่งออก ไม่กลายเป็นสารกัมมันตรังสี", correct: true }
      - { id: b, text: "คนที่สูดฝุ่นที่มีสารปล่อยแอลฟาเข้าปอด ได้รับรังสีต่อเนื่องแม้ออกจากบริเวณนั้นแล้ว", correct: true }
      - { id: c, text: "การเพิ่มระยะห่างจากแหล่งรังสีขนาดเล็กเป็น 2 เท่า ลดอัตรารังสีเหลือราวหนึ่งในสี่", correct: true }
      - { id: d, text: "แช่สารกัมมันตรังสีในน้ำแข็งจะทำให้สลายช้าลง", feedback: "การสลายเกิดในนิวเคลียส ไม่ขึ้นกับอุณหภูมิหรือสภาพทางเคมี" }
    hints:
      - "แยกการได้รับรังสีจากภายนอกกับการเปรอะเปื้อน"
      - "อัตรารังสีจากแหล่งขนาดเล็กแปรผกผันกับกำลังสองของระยะ"
    solution: "ก ถูก การฉายรังสีแกมมาไม่ทำให้ผลไม้ปล่อยรังสี ข ถูก เป็นการเปรอะเปื้อนภายในร่างกาย สารยังอยู่ในปอดจึงได้รับรังสีต่อไป ค ถูก $\\left(\\tfrac12\\right)^2 = \\tfrac14$ ง ผิด อุณหภูมิไม่มีผลต่อครึ่งชีวิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.radioactivity.p010
    topics: [physics.nuclear.radioactivity]
    difficulty: 4
    type: numeric
    stem: "ถ่านไม้จากแหล่งโบราณคดีแห่งหนึ่งในภาคอีสานมีคาร์บอน-14 เหลือร้อยละ $30$ ของที่พบในไม้ที่ยังมีชีวิต คาร์บอน-14 มีครึ่งชีวิต $5{,}700$ ปี ถ่านนี้มีอายุประมาณกี่ปี (ตอบเป็นจำนวนเต็มร้อย)"
    answer: { value: 9900, tolerance: 100, unit: ปี }
    misconceptions:
      - { match: 7980, feedback: "คิดว่าลดลงแบบเส้นตรง (ลดร้อยละ 50 ใน 5,700 ปี) แต่การสลายเป็นแบบเลขชี้กำลัง" }
      - { match: 3420, feedback: "คิดว่า 0.30 คือจำนวนครึ่งชีวิต ต้องแก้ $\\left(\\tfrac12\\right)^{n} = 0.30$ หา $n$" }
    hints:
      - "ตั้งสมการ $\\left(\\tfrac12\\right)^{n} = 0.30$ เมื่อ $n = t/T_{1/2}$"
      - "ใช้ลอการิทึม: $n = \\dfrac{\\log(1/0.30)}{\\log 2}$"
    solution: "$n = \\dfrac{\\log(1/0.30)}{\\log 2} = \\dfrac{0.523}{0.301} = 1.737$ ครึ่งชีวิต $t = 1.737 \\times 5{,}700 \\approx 9{,}900$ ปี ตรวจ: เหลือ 30% อยู่ระหว่าง 50% (1 ครึ่งชีวิต) กับ 25% (2 ครึ่งชีวิต) อายุจึงอยู่ระหว่าง 5,700 กับ 11,400 ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.radioactivity.p011
    topics: [physics.nuclear.radioactivity]
    difficulty: 4
    type: numeric
    stem: "กราฟแสดงกัมมันตภาพของตัวอย่างไอโซโทปกัมมันตรังสีที่วัดได้ในห้องปฏิบัติการตามเวลา จากกราฟ ไอโซโทปนี้มีครึ่งชีวิตกี่ชั่วโมง"
    figure: { src: p-activity-graph.svg, alt: "กราฟกัมมันตภาพ (เบกเคอเรล) กับเวลา (ชั่วโมง) แกนเวลา 0 ถึง 12 ชั่วโมง ช่องละ 1 ชั่วโมง แกนกัมมันตภาพ 0 ถึง 800 เบกเคอเรล ช่องละ 100 เส้นโค้งเริ่มที่ 800 Bq ที่เวลา 0 ผ่านจุด 400 Bq ที่ 3 ชั่วโมง 200 Bq ที่ 6 ชั่วโมง 100 Bq ที่ 9 ชั่วโมง และ 50 Bq ที่ 12 ชั่วโมง" }
    answer: { value: 3, tolerance: 0.1, unit: ชั่วโมง }
    misconceptions:
      - { match: 6, feedback: "6 ชั่วโมงคือเวลาที่ลดเหลือหนึ่งในสี่ (800 → 200) ซึ่งเป็น 2 ครึ่งชีวิต" }
      - { match: 12, feedback: "ไม่ใช่เวลาที่กราฟสิ้นสุด ครึ่งชีวิตคือเวลาที่ลดจาก 800 เหลือ 400 Bq" }
    hints:
      - "กัมมันตภาพเริ่มต้นเท่าใด ครึ่งหนึ่งของค่านั้นเท่าใด"
      - "ลากเส้นจากค่าครึ่งหนึ่งบนแกนตั้งไปหาเส้นโค้ง แล้วอ่านเวลา"
    solution: "เริ่มที่ $800\\ \\mathrm{Bq}$ ครึ่งหนึ่งคือ $400\\ \\mathrm{Bq}$ ซึ่งกราฟผ่านที่ $3$ ชั่วโมง ตรวจ: ที่ $6$ ชั่วโมงเหลือ $200$ และที่ $9$ ชั่วโมงเหลือ $100$ ลดลงครึ่งหนึ่งทุก $3$ ชั่วโมงจริง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.radioactivity.p012
    topics: [physics.nuclear.radioactivity]
    difficulty: 4
    type: order
