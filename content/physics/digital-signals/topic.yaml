id: physics.waves.digital-signals
subject: physics
title: { th: สัญญาณแอนะล็อกและดิจิทัล, en: Analog and digital signals }
summary: ส่งข้อมูลด้วยแบบรูปและคลื่น สัญญาณแอนะล็อกกับดิจิทัล การสุ่มวัดและการแปลงเป็นระดับ สัญญาณรบกวน และข้อดีข้อจำกัดของการส่งและเก็บข้อมูลแบบดิจิทัล
difficulty: 4
minutes: 35
prerequisites: [physics.waves.wave-basics, computer.data.binary]
encompasses:
  - { id: computer.data.binary, weight: 0.4 }
  - { id: physics.waves.wave-basics, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แปลงสัญญาณแอนะล็อกเป็นดิจิทัล
    src: analog-to-digital.svg
    alt: "สามกราฟเรียงจากบนลงล่าง กราฟที่หนึ่ง สัญญาณแอนะล็อกเป็นเส้นโค้งต่อเนื่องที่ขึ้นสูงแล้วลงต่ำ กราฟที่สอง สุ่มวัด เส้นโค้งเดิมจาง ๆ มีเส้นตั้งสีส้ม 16 เส้นห่างกันเท่า ๆ กัน ปลายเส้นเป็นจุดบนเส้นโค้ง กราฟที่สาม แปลงเป็นระดับ แกนตั้งแบ่งเป็น 8 ระดับ เขียนเป็นเลขฐานสอง 000 ถึง 111 ค่าที่วัดได้ถูกปัดเป็นระดับที่ใกล้ที่สุด ได้เส้นเป็นขั้นบันได: 100, 101, 110, 110, 110, 110, 110, 101, 011, 010, 001, 001, 001, 001, 001, 010"
    caption: "สุ่มวัดเป็นจังหวะเวลา แล้วปัดเป็นระดับ สัญญาณจึงเหลือเป็นตัวเลขที่เก็บเป็นบิตได้ แต่รายละเอียดบางส่วนหายไป"
  - type: worked-example
    title: แปลงค่าที่วัดได้เป็นบิต
    problem: "ไมโครโฟนให้แรงดันที่สุ่มวัดได้ 4 ค่า คือ 1.2, 3.7, 6.4 และ 5.1 V ตัวแปลง 3 บิตแบ่งเป็นระดับ 0, 1, ..., 7 V จะได้ข้อมูลเป็นบิตอะไร ถ้าสุ่มวัด 8,000 ครั้งต่อวินาที อัตราบิตเป็นเท่าใด"
    steps:
      - text: "ปัดแต่ละค่าเป็นระดับที่ใกล้ที่สุด: 1.2 → 1, 3.7 → 4, 6.4 → 6, 5.1 → 5"
        why: "ตัวแปลงเก็บได้เฉพาะระดับที่กำหนด ค่าระหว่างระดับต้องปัด"
      - text: "แปลงเป็นเลขฐานสอง 3 หลัก (หลักละ 4, 2, 1): 1 = 001, 4 = 100, 6 = 110, 5 = 101"
      - text: "ข้อมูลที่ส่งคือ 001 100 110 101 รวม 12 บิต"
      - text: "อัตราบิต $= 8{,}000 \\times 3 = 24{,}000$ บิตต่อวินาที"
        why: "ทุกครั้งที่สุ่มวัดต้องใช้ 3 บิต"
    answer: "001 100 110 101 และอัตราบิต 24,000 บิตต่อวินาที"
  - { type: check, problem: physics.waves.digital-signals.p003, prompt: "ลองคิดก่อนอ่านต่อ" }
  - type: figure
    title: สัญญาณรบกวนกับแอนะล็อกและดิจิทัล
    src: noise-regeneration.svg
    alt: "ส่วนบน สัญญาณแอนะล็อก แถว ก สัญญาณที่ส่งเป็นคลื่นเรียบ แถว ข เมื่อถึงปลายทางมีสัญญาณรบกวนปนเป็นเส้นหยักขรุขระทั่วทั้งคลื่น ส่วนล่าง สัญญาณดิจิทัล แถว ค สัญญาณที่ส่งเป็นพัลส์สี่เหลี่ยมแทนบิต 1 0 1 1 0 0 1 0 แถว ง เมื่อถึงปลายทางมีสัญญาณรบกวนปนเป็นเส้นหยัก แต่ระดับสูงยังอยู่เหนือเส้นประระดับตัดสิน และระดับต่ำอยู่ใต้เส้น แถว จ กู้คืนด้วยระดับตัดสินได้พัลส์สี่เหลี่ยมที่สะอาดเหมือนแถว ค"
    caption: "สัญญาณรบกวนในแอนะล็อกแยกออกไม่ได้ แต่ดิจิทัลตัดสินเพียงว่าสูงหรือต่ำกว่าระดับตัดสิน จึงสร้างสัญญาณเดิมกลับมาได้"
  - type: worked-example
    title: ตรวจจับบิตผิดด้วยบิตภาวะคู่
    problem: "ผู้ส่งต้องการส่งข้อมูล 7 บิต 1001101 ด้วยบิตภาวะคู่ ระหว่างทางสัญญาณรบกวนทำให้บิตที่ 2 พลิก ผู้รับจะรู้ได้อย่างไรว่าข้อมูลผิด"
    steps:
      - text: "นับเลข 1 ใน 1001101 ได้ 4 ตัว (คู่) จึงเติมบิตภาวะคู่เป็น 0 ส่ง 10011010"
        why: "กติกาคือจำนวนเลข 1 ทั้งหมดต้องเป็นเลขคู่"
      - text: "บิตที่ 2 พลิกจาก 0 เป็น 1 ผู้รับได้ 11011010"
      - text: "ผู้รับนับเลข 1 ได้ 5 ตัว เป็นเลขคี่ ขัดกับกติกา จึงรู้ว่ามีบิตผิด แล้วขอให้ส่งใหม่"
        why: "บิตภาวะคู่บอกว่ามีบิตผิด แต่ไม่บอกตำแหน่ง และถ้าพลิกสองบิตพร้อมกันจะตรวจไม่พบ ระบบจริงจึงใช้รหัสที่ซับซ้อนกว่า"
    answer: "ผู้รับนับเลข 1 ได้เป็นเลขคี่ จึงรู้ว่าข้อมูลผิดและขอให้ส่งใหม่"
  - { type: check, problem: physics.waves.digital-signals.p004, prompt: "ใช้ภาพสัญญาณรบกวนด้านบนช่วยตอบ" }
  - type: interactive
    title: สุ่มวัดถี่แค่ไหนจึงพอ
    caption: "เส้นแรกคือเสียงความถี่ 1 หน่วย เส้นที่สองคือเส้นที่ได้เมื่อเชื่อมจุดที่สุ่มวัดด้วยอัตรา n ครั้งต่อรอบ (แกน x คือเวลาเป็นรอบ) ลองเลื่อน n จาก 8 ลงมาเหลือ 2 จะเห็นว่าเมื่อสุ่มวัดน้อยครั้ง รูปคลื่นที่ได้ผิดไปจากเดิมมาก"
    widget:
      kind: function-plot
      functions: ["\\sin(2\\pi x)", "\\sin\\left(\\frac{2\\pi}{n}\\operatorname{floor}(n x)\\right)"]
      sliders:
        - { name: n, min: 2, max: 16, step: 1, value: 8, label: จำนวนครั้งที่สุ่มวัดต่อรอบ }
      x: [0, 3]
      y: [-1.5, 1.5]
glossary:
  - { term: สัญญาณแอนะล็อก, definition: "สัญญาณที่เปลี่ยนค่าต่อเนื่องตามสิ่งที่แทน เช่น แรงดันจากไมโครโฟนที่ขึ้นลงตามรูปคลื่นเสียง" }
  - { term: สัญญาณดิจิทัล, definition: "สัญญาณที่มีค่าเป็นระดับแยกกันชัดเจน โดยทั่วไปคือ 0 กับ 1" }
  - { term: การสุ่มวัด, definition: "การวัดค่าสัญญาณเป็นจังหวะเวลาเท่ากัน ต้องวัดอย่างน้อย 2 เท่าของความถี่สูงสุดในสัญญาณ" }
  - { term: การแปลงเป็นระดับ, definition: "การปัดค่าที่วัดได้เป็นระดับที่ใกล้ที่สุด $n$ บิตแยกได้ $2^n$ ระดับ" }
  - { term: สัญญาณรบกวน, definition: "สัญญาณไม่ต้องการที่ปนเข้ามาระหว่างการส่งหรือเก็บ ทำให้สัญญาณผิดเพี้ยน" }
  - { term: บิตภาวะคู่, definition: "บิตที่เติมท้ายข้อมูลให้จำนวนเลข 1 เป็นเลขคู่ ใช้ตรวจว่ามีบิตผิดระหว่างทางหรือไม่" }
  - { term: อัตราบิต, definition: "จำนวนบิตที่ส่งหรือเก็บต่อวินาที = อัตราสุ่มวัด × บิตต่อค่า × จำนวนช่อง" }
flashcards:
  - { front: "แอนะล็อกกับดิจิทัลต่างกันอย่างไร", back: "แอนะล็อกเปลี่ยนค่าต่อเนื่อง ดิจิทัลเป็นระดับแยกกัน (0 กับ 1)" }
  - { front: "$n$ บิตแยกได้กี่ระดับ", back: "$2^n$ ระดับ เช่น 3 บิต 8 ระดับ 16 บิต 65,536 ระดับ" }
  - { front: "ทำไมดิจิทัลทนสัญญาณรบกวนกว่า", back: "ผู้รับตัดสินแค่สูงหรือต่ำกว่าระดับตัดสิน จึงสร้างสัญญาณที่สะอาดขึ้นใหม่ได้และตรวจบิตผิดได้" }
  - { front: "อัตราสุ่มวัดต่ำสุด", back: "2 เท่าของความถี่สูงสุดในสัญญาณ (ซีดีใช้ 44,100 Hz สำหรับเสียงถึงราว 20,000 Hz)" }
  - { front: "ข้อจำกัดของดิจิทัล", back: "รายละเอียดหายจากการสุ่มวัดและการปัด ใช้บิตมาก สัญญาณอ่อนแล้วภาพหายทั้งภาพ และข้อมูลรั่วไหลหรือล้าสมัยได้" }
