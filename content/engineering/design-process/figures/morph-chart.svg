<rect x="150.0" y="174.0" width="150.0" height="60.0" rx="6" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
<text x="225.0" y="209.0" text-anchor="middle" fill="#15211e" font-size="14">คลอรีน</text>
<rect x="310.0" y="174.0" width="150.0" height="60.0" rx="6" fill="#fff4e0" stroke="#c26a00" stroke-width="3"/>
<text x="385.0" y="209.0" text-anchor="middle" fill="#15211e" font-size="14">หลอด UV</text>
<line x1="385.0" y1="90.0" x2="225.0" y2="102.0" stroke="#c26a00" stroke-width="2.5"/>
<line x1="225.0" y1="162.0" x2="385.0" y2="174.0" stroke="#c26a00" stroke-width="2.5"/>
<text x="340.0" y="268.0" text-anchor="middle" fill="#777" font-size="13">ทางเลือกทั้งหมด 3 × 2 × 2 = 12 แบบ เส้นสีส้มคือตัวอย่างหนึ่งแบบ</text>
