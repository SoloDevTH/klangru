id: business.accounting.audit-internal-control
subject: business
title:
  th: การควบคุมภายใน การกำกับดูแล และการสอบบัญชีเบื้องต้น
  en: Internal control, governance and introductory auditing
summary: องค์ประกอบการควบคุมภายใน การแบ่งแยกหน้าที่ การทุจริตในธุรกิจเล็ก การกำกับดูแลที่ดี การบริหารความเสี่ยง ขั้นตอนการสอบบัญชี การสุ่มตัวอย่าง และรายงานผู้สอบบัญชี
difficulty: 6.5
minutes: 50
prerequisites:
- business.accounting.financial-statements
- business.accounting.information-systems
- business.ethics.business-ethics
encompasses:
- id: business.accounting.financial-statements
  weight: 0.3
- id: business.accounting.double-entry
  weight: 0.1
curriculum_tags: []
lessons:
- type: explanation
  file: lesson.md
- type: figure
  src: purchase-to-pay.svg
  alt: แผนภาพกระบวนการจัดซื้อถึงจ่ายเงิน หกกล่องเรียงต่อกัน ผู้ขอซื้อ (ใบขอซื้อ) → ผู้อนุมัติ (อนุมัติตามวงเงิน) → ฝ่ายจัดซื้อ (ใบสั่งซื้อเลขเรียง) → ฝ่ายรับของ (ใบรับของ) → ฝ่ายบัญชี (จับคู่ 3 เอกสาร) → ฝ่ายการเงิน (จ่ายเงินเข้าบัญชีผู้ขาย) ใต้กล่องบอกประเภทหน้าที่ อนุมัติ อนุมัติ ดูแลทรัพย์สิน ดูแลทรัพย์สิน บันทึก ดูแลเงิน กล่องกลางอธิบายการจับคู่ 3 เอกสาร ใบสั่งซื้อ ใบรับของ และใบแจ้งหนี้ ต้องตรงกันก่อนตั้งหนี้ ด้านล่างมีสามกล่อง กระทบยอดอิสระโดยผู้ที่ไม่ได้จ่ายเงินและไม่ได้บันทึก ผู้ขายรายใหม่ต้องอนุมัติและตรวจเลขบัญชี และสิทธิในระบบที่ผู้สั่งซื้อแก้ข้อมูลผู้ขายไม่ได้ ผู้จ่ายเงินแก้บัญชีไม่ได้
  caption: แบ่งหน้าที่อนุมัติ ดูแลทรัพย์สิน บันทึก และกระทบยอดให้คนต่างกัน
- type: check
  problem: business.accounting.audit-internal-control.p001
  prompt: แต่ละการกระทำเป็นองค์ประกอบใด
- type: worked-example
  title: ออกแบบการควบคุมเงินสดของร้านกาแฟ
  problem: ร้านกาแฟ (สมมติ) มีพนักงาน $3$ คน คนหนึ่งรับเงินสด บันทึกยอดขายในสมุด และนำเงินไปฝากธนาคารเอง เจ้าของสงสัยว่าเงินหาย ควรปรับการควบคุมอย่างไร
  steps:
  - text: 'ระบุความเสี่ยง: คนเดียวทั้งรับเงิน บันทึก และฝาก จึงเก็บเงินบางส่วนแล้วบันทึกยอดขายต่ำลงได้'
    why: เริ่มจากถามว่าใครทำอะไรได้โดยไม่มีใครเห็น
  - text: ให้ทุกการขายผ่านเครื่องขายที่ออกใบเสร็จเลขเรียง และส่งเสริมการจ่ายด้วยคิวอาร์ซึ่งเข้าบัญชีร้านโดยตรง
  - text: ทุกเย็นให้พนักงานคนที่สองนับเงินสดร่วมกับคนรับเงิน แล้วเทียบกับรายงานเครื่องขาย ลงชื่อทั้งสองคน
    why: แยกการดูแลเงินกับการตรวจนับ
  - text: นำฝากทุกวัน เจ้าของเทียบสลิปฝากกับรายงานยอดขายรายวันและรายการเดินบัญชีธนาคาร (กระทบยอดโดยคนที่ไม่ได้จับเงิน)
  - text: 'ติดตามผล: ดูรายงานการยกเลิกบิลและส่วนลด ถ้าพบยกเลิกบิลบ่อยผิดปกติให้สอบถาม'
  answer: แยกการรับเงิน การตรวจนับ การบันทึก และการกระทบยอด ใช้เครื่องขายและคิวอาร์ และติดตามรายงานผิดปกติ
- type: figure
  src: audit-process.svg
  alt: แผนภาพหกขั้นตอนการสอบบัญชี รับงานและความเป็นอิสระ วางแผน (เข้าใจกิจการ กำหนดความมีสาระสำคัญ) ประเมินความเสี่ยงที่งบอาจผิดพลาดอย่างมีสาระสำคัญ ตอบสนองความเสี่ยง (ทดสอบการควบคุม วิธีตรวจสอบเนื้อหาสาระ) สรุปผล และรายงาน ด้านล่างเป็นตารางประเภทความเห็น ถ้างบแสดงข้อมูลขัดต่อข้อเท็จจริง มีสาระสำคัญแต่ไม่แพร่หลาย → มีเงื่อนไข มีสาระสำคัญและแพร่หลาย → งบการเงินไม่ถูกต้อง ถ้าหาหลักฐานที่เหมาะสมอย่างเพียงพอไม่ได้ ไม่แพร่หลาย → มีเงื่อนไข แพร่หลาย → ไม่แสดงความเห็น ถ้าไม่มีปัญหา → ไม่มีเงื่อนไข หมายเหตุว่าผู้สอบบัญชีให้ความเชื่อมั่นอย่างสมเหตุสมผล ไม่ใช่การรับประกัน
  caption: ผู้สอบบัญชีวางแผนตามความเสี่ยง เก็บหลักฐาน แล้วแสดงความเห็นต่องบการเงิน
- type: worked-example
  title: ความมีสาระสำคัญและการขยายผลจากตัวอย่าง
  problem: บริษัท (สมมติ) มีกำไรก่อนภาษี $6{,}000{,}000$ บาท ผู้สอบบัญชีกำหนดความมีสาระสำคัญโดยรวม $5\%$ ของกำไรก่อนภาษี และความมีสาระสำคัญในการปฏิบัติงาน $75\%$ ของค่านั้น ตรวจตัวอย่างสินค้าคงเหลือมูลค่า $400{,}000$ บาท พบแสดงสูงไป $6{,}000$ บาท สินค้าคงเหลือทั้งหมด $12{,}000{,}000$ บาท ควรสรุปอย่างไร
  steps:
  - text: ความมีสาระสำคัญโดยรวม $= 6{,}000{,}000 \times 0.05 = 300{,}000$ บาท
    why: กำไรก่อนภาษีเป็นเกณฑ์ที่นิยมสำหรับกิจการที่มีกำไรสม่ำเสมอ ตัวเลขร้อยละเป็นดุลยพินิจ
  - text: ความมีสาระสำคัญในการปฏิบัติงาน $= 300{,}000 \times 0.75 = 225{,}000$ บาท
  - text: อัตราข้อผิดพลาดในตัวอย่าง $= \dfrac{6{,}000}{400{,}000} = 0.015$
    why: วิธีอัตราส่วนถือว่าทั้งประชากรผิดในสัดส่วนเดียวกับตัวอย่าง
  - text: ข้อผิดพลาดคาดคะเน $= 0.015 \times 12{,}000{,}000 = 180{,}000$ บาท
  - text: $180{,}000$ ต่ำกว่า $225{,}000$ แต่ใกล้เคียง จึงควรพิจารณาความเสี่ยงจากการสุ่ม ขอให้ผู้บริหารแก้ไขรายการที่พบ หรือขยายขนาดตัวอย่าง
    why: ค่าคาดคะเนจากตัวอย่างมีความไม่แน่นอน ถ้าใกล้เกณฑ์มากไม่ควรสรุปทันที
  answer: ข้อผิดพลาดคาดคะเน $180{,}000$ บาท ต่ำกว่าเกณฑ์ $225{,}000$ บาท แต่ควรตรวจเพิ่มหรือให้แก้ไข
- type: check
  problem: business.accounting.audit-internal-control.p011
  prompt: ขยายผลข้อผิดพลาดจากตัวอย่างอย่างไร
glossary:
- term: การควบคุมภายใน
  definition: กระบวนการที่คณะกรรมการ ผู้บริหาร และพนักงานกำหนดขึ้น เพื่อให้มั่นใจอย่างสมเหตุสมผลว่าการดำเนินงาน การรายงาน และการปฏิบัติตามกฎหมายบรรลุวัตถุประสงค์
- term: การแบ่งแยกหน้าที่
  definition: การให้คนต่างกันทำหน้าที่อนุมัติ ดูแลทรัพย์สิน บันทึกบัญชี และกระทบยอด เพื่อไม่ให้คนเดียวทุจริตและปกปิดได้
- term: สามเหลี่ยมการทุจริต
  definition: แรงกดดัน โอกาส และการหาเหตุผลเข้าข้างตนเอง ซึ่งมักเกิดร่วมกันเมื่อมีการทุจริต
- term: การกำกับดูแลกิจการ
  definition: ระบบที่คณะกรรมการใช้กำกับผู้บริหารให้ทำงานอย่างรับผิดชอบ โปร่งใส และเป็นธรรมต่อผู้ถือหุ้นและผู้มีส่วนได้ส่วนเสีย
- term: ผู้มีส่วนได้ส่วนเสีย
  definition: บุคคลหรือกลุ่มที่ได้รับผลจากการดำเนินงานขององค์กร เช่น ผู้ถือหุ้น พนักงาน ลูกค้า เจ้าหนี้ ชุมชน รัฐ
- term: ความมีสาระสำคัญ
  definition: ขนาดของข้อผิดพลาดที่อาจทำให้ผู้ใช้งบการเงินตัดสินใจเปลี่ยนไป
- term: ความเสี่ยงการสอบบัญชี
  definition: ความเสี่ยงที่ผู้สอบบัญชีแสดงความเห็นไม่เหมาะสมเมื่องบการเงินแสดงข้อมูลขัดต่อข้อเท็จจริงอย่างมีสาระสำคัญ
- term: ผู้สอบบัญชีรับอนุญาต
  definition: ผู้ได้รับใบอนุญาตตามกฎหมายวิชาชีพบัญชีให้ตรวจสอบและแสดงความเห็นต่องบการเงิน
- term: การตรวจสอบเนื้อหาสาระ
  definition: วิธีตรวจที่หาข้อผิดพลาดในยอดเงินโดยตรง เช่น การวิเคราะห์เปรียบเทียบ การขอยืนยันยอด การตรวจนับ
flashcards:
- front: องค์ประกอบการควบคุมภายใน 5 ข้อ
  back: สภาพแวดล้อมการควบคุม · การประเมินความเสี่ยง · กิจกรรมการควบคุม · สารสนเทศและการสื่อสาร · กิจกรรมการติดตามผล
- front: หน้าที่ที่ควรแยก
  back: อนุมัติ · ดูแลทรัพย์สิน · บันทึกบัญชี · กระทบยอด
- front: สามเหลี่ยมการทุจริต
  back: แรงกดดัน · โอกาส · การหาเหตุผลเข้าข้างตนเอง
- front: ความเห็นของผู้สอบบัญชี 4 แบบ
  back: ไม่มีเงื่อนไข · มีเงื่อนไข · งบการเงินไม่ถูกต้อง · ไม่แสดงความเห็น
- front: ขยายผลข้อผิดพลาดแบบอัตราส่วน
  back: (ข้อผิดพลาดในตัวอย่าง ÷ มูลค่าตัวอย่าง) × มูลค่าประชากร
