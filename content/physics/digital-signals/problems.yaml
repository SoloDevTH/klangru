  - id: physics.waves.digital-signals.p015
    topics: [physics.waves.digital-signals]
    difficulty: 5
    type: numeric
    stem: "ส่งภาพขนาด 2 MB (1 MB = 1,000,000 ไบต์) ผ่านแอปแชตด้วยอินเทอร์เน็ตมือถือความเร็ว 4 Mbit/s (1 Mbit = 1,000,000 บิต) ถ้าไม่มีการบีบอัดเพิ่มและความเร็วคงที่ จะใช้เวลากี่วินาที (ตอบในหน่วย s)"
    answer: { value: 4, tolerance: 0.05, unit: s }
    hints:
      - "แปลงขนาดไฟล์เป็นบิตก่อน 1 ไบต์ = 8 บิต"
      - "เวลา = จำนวนบิต ÷ อัตราบิต"
    misconceptions:
      - { match: 0.5, feedback: "ดูเหมือนลืมแปลงไบต์เป็นบิต 2 MB คือ 16 ล้านบิต ไม่ใช่ 2 ล้านบิต" }
    solution: "ขนาดไฟล์ $= 2{,}000{,}000 \\times 8 = 16{,}000{,}000$ บิต เวลา $= \\dfrac{16{,}000{,}000}{4{,}000{,}000} = 4\\ \\mathrm{s}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.digital-signals.p016
    topics: [physics.waves.digital-signals]
    difficulty: 5
    type: mcq
    stem: "บ้านที่อยู่ไกลสถานีส่งรับสัญญาณทีวีได้อ่อน สมัยทีวีแอนะล็อกยังพอดูได้แม้ภาพมีเม็ดซ่า แต่ทีวีดิจิทัลบางช่องภาพค้างหรือหายไปทั้งภาพ คำอธิบายใดถูกต้อง"
    choices:
      - { id: a, text: "สัญญาณแอนะล็อกเสื่อมลงทีละน้อยตามสัญญาณรบกวน แต่สัญญาณดิจิทัลเมื่ออ่อนจนตัดสินบิตไม่ได้ ข้อมูลจะเสียทั้งก้อน", correct: true }
      - { id: b, text: "ทีวีดิจิทัลไม่ทนสัญญาณรบกวนเลย ทีวีแอนะล็อกทนกว่าทุกกรณี", feedback: "ในช่วงที่สัญญาณแรงพอ ทีวีดิจิทัลให้ภาพคมชัดสมบูรณ์แม้มีสัญญาณรบกวน ปัญหาเกิดเมื่อสัญญาณอ่อนเกินระดับที่ตัดสินบิตได้" }
      - { id: c, text: "ทีวีดิจิทัลใช้คลื่นเสียงแทนคลื่นวิทยุ จึงส่งได้ไม่ไกล", feedback: "ทีวีทั้งสองแบบส่งด้วยคลื่นวิทยุ ต่างกันที่วิธีแทนข้อมูลบนคลื่น" }
    hints:
      - "ระบบดิจิทัลต้องตัดสินแต่ละบิตว่าเป็น 0 หรือ 1"
      - "ถ้าสัญญาณรบกวนแรงเกือบเท่าสัญญาณ ผู้รับจะตัดสินได้หรือไม่"
    solution: "สัญญาณแอนะล็อกที่อ่อนลงยังแสดงภาพได้แต่มีสัญญาณรบกวนปน ส่วนดิจิทัลแสดงภาพสมบูรณ์ตราบที่ตัดสินบิตได้ถูก เมื่อสัญญาณอ่อนเกินจุดหนึ่ง บิตผิดจำนวนมากจนแก้ไม่ได้ ภาพจึงค้างหรือหายทันที วิธีแก้คือใช้เสาอากาศที่ดีขึ้นหรือหันเสาให้ตรงสถานี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.waves.digital-signals.p017
    topics: [physics.waves.digital-signals]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นข้อจำกัดหรือความเสี่ยงที่ควรคำนึงถึงเมื่อเก็บข้อมูลแบบดิจิทัล (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ไฟล์คัดลอกและเผยแพร่ได้ง่าย ข้อมูลส่วนตัวจึงรั่วไหลได้ง่าย", correct: true }
      - { id: b, text: "รูปแบบไฟล์หรืออุปกรณ์อ่านอาจล้าสมัยจนเปิดข้อมูลเก่าไม่ได้", correct: true }
      - { id: c, text: "ถ้าสุ่มวัดน้อยครั้งหรือใช้บิตน้อยเกินไป เสียงและภาพจะเพี้ยน", correct: true }
      - { id: d, text: "สำเนาที่คัดลอกต่อกันหลายทอดคุณภาพลดลงทุกครั้ง", feedback: "ข้อนี้เป็นปัญหาของแอนะล็อก การคัดลอกดิจิทัลคัดลอกบิตได้ตรงทุกบิต สำเนาจึงเหมือนต้นฉบับ" }
    hints:
