<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="sans-serif">
<title>รูปวรรณยุกต์ 4 รูปและตำแหน่งที่วาง</title>
<rect x="0" y="0" width="760" height="430" fill="#fff"/>
<text x="380.0" y="32.0" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">รูปวรรณยุกต์ 4 รูป</text>
<rect x="40.0" y="50.0" width="155.0" height="150.0" rx="10" fill="#fff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="117.0" y="112.0" font-size="52" text-anchor="middle" fill="#111" font-weight="normal">◌่</text>
<text x="117.0" y="148.0" font-size="19" text-anchor="middle" fill="#1f5fbf" font-weight="bold">ไม้เอก</text>
<text x="117.0" y="184.0" font-size="19" text-anchor="middle" fill="#111" font-weight="normal">เช่น ไก่</text>
<rect x="215.0" y="50.0" width="155.0" height="150.0" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
<text x="292.0" y="112.0" font-size="52" text-anchor="middle" fill="#111" font-weight="normal">◌้</text>
<text x="292.0" y="148.0" font-size="19" text-anchor="middle" fill="#c0392b" font-weight="bold">ไม้โท</text>
<text x="292.0" y="184.0" font-size="19" text-anchor="middle" fill="#111" font-weight="normal">เช่น บ้าน</text>
<rect x="390.0" y="50.0" width="155.0" height="150.0" rx="10" fill="#fff" stroke="#1e8449" stroke-width="2.5"/>
<text x="467.0" y="112.0" font-size="52" text-anchor="middle" fill="#111" font-weight="normal">◌๊</text>
<text x="467.0" y="148.0" font-size="19" text-anchor="middle" fill="#1e8449" font-weight="bold">ไม้ตรี</text>
<text x="467.0" y="184.0" font-size="19" text-anchor="middle" fill="#111" font-weight="normal">เช่น โต๊ะ</text>
<rect x="565.0" y="50.0" width="155.0" height="150.0" rx="10" fill="#fff" stroke="#7d3c98" stroke-width="2.5"/>
<text x="642.0" y="112.0" font-size="52" text-anchor="middle" fill="#111" font-weight="normal">◌๋</text>
<text x="642.0" y="148.0" font-size="19" text-anchor="middle" fill="#7d3c98" font-weight="bold">ไม้จัตวา</text>
<text x="642.0" y="184.0" font-size="19" text-anchor="middle" fill="#111" font-weight="normal">เช่น จ๋า</text>
<text x="380.0" y="240.0" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">วางตรงไหน</text>
<rect x="40.0" y="258.0" width="155.0" height="150.0" rx="10" fill="#f7f7f7" stroke="#666" stroke-width="1.5"/>
<text x="117.0" y="345.0" font-size="54" text-anchor="middle" fill="#111" font-weight="normal">ป่า</text>
<text x="117.0" y="390.0" font-size="15" text-anchor="middle" fill="#333" font-weight="normal">บนพยัญชนะต้น</text>
<rect x="215.0" y="258.0" width="155.0" height="150.0" rx="10" fill="#f7f7f7" stroke="#666" stroke-width="1.5"/>
<text x="292.0" y="345.0" font-size="54" text-anchor="middle" fill="#111" font-weight="normal">ที่</text>
<text x="292.0" y="390.0" font-size="15" text-anchor="middle" fill="#333" font-weight="normal">บนสระข้างบน</text>
<rect x="390.0" y="258.0" width="155.0" height="150.0" rx="10" fill="#f7f7f7" stroke="#666" stroke-width="1.5"/>
<text x="467.0" y="345.0" font-size="54" text-anchor="middle" fill="#111" font-weight="normal">กล้า</text>
<text x="467.0" y="390.0" font-size="15" text-anchor="middle" fill="#333" font-weight="normal">บนพยัญชนะตัวที่สอง</text>
<rect x="565.0" y="258.0" width="155.0" height="150.0" rx="10" fill="#f7f7f7" stroke="#666" stroke-width="1.5"/>
<text x="642.0" y="345.0" font-size="54" text-anchor="middle" fill="#111" font-weight="normal">น้ำ</text>
<text x="642.0" y="390.0" font-size="15" text-anchor="middle" fill="#333" font-weight="normal">บนพยัญชนะ ไม่ใช่บนสระอำ</text>
