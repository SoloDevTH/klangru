  - id: computer.society.responsible-ict.p017
    topics: [computer.society.responsible-ict]
    difficulty: 5
    type: mcq
    stem: "โอ๊ตเคยเห็นเพื่อนพิมพ์รหัสผ่านบัญชีโซเชียล วันหนึ่งโอ๊ตใช้รหัสนั้นเข้าบัญชีของเพื่อนโดยไม่ได้ขอ แล้วเปลี่ยนรูปโปรไฟล์เป็นภาพล้อเลียน \"เพื่อขำ ๆ\" ข้อใดวิเคราะห์ได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "อาจเข้าข่ายความผิดตาม พ.ร.บ.คอมพิวเตอร์ ทั้งการเข้าบัญชีโดยไม่ได้รับอนุญาต (มาตรา 5 และ 7) และการแก้ไขข้อมูลของผู้อื่น (มาตรา 9) แม้จะตั้งใจล้อเล่น", correct: true }
      - { id: b, text: "ไม่ผิด เพราะรู้รหัสผ่านอยู่แล้ว ไม่ได้เจาะระบบ", feedback: "การรู้รหัสไม่ได้แปลว่าได้รับอนุญาต รหัสผ่านเป็นมาตรการป้องกันที่มีไว้สำหรับเจ้าของบัญชี" }
      - { id: c, text: "ไม่ผิด เพราะทำเพื่อความสนุก ไม่ได้เอาเงิน", feedback: "ความผิดเรื่องการเข้าถึงและแก้ไขข้อมูลไม่ได้ขึ้นกับว่าได้เงินหรือไม่" }
      - { id: d, text: "ผิดเฉพาะเรื่องมารยาท ไม่เกี่ยวกับกฎหมาย", feedback: "มีทั้งปัญหาด้านจริยธรรมและอาจผิดกฎหมาย เพราะเข้าและแก้ไขข้อมูลในระบบที่ไม่ได้มีไว้สำหรับตน" }
    hints:
      - "แยกการกระทำเป็นสองส่วน: การเข้าบัญชี และการเปลี่ยนรูป"
      - "รหัสผ่านมีไว้สำหรับใคร และโอ๊ตได้รับอนุญาตหรือไม่"
    solution: "การเข้าบัญชีที่มีรหัสผ่านซึ่งไม่ได้มีไว้สำหรับตนโดยไม่ได้รับอนุญาตอาจผิดมาตรา 5 (เข้าระบบ) และ 7 (เข้าข้อมูล) และการเปลี่ยนรูปโปรไฟล์คือการแก้ไขข้อมูลของผู้อื่นโดยมิชอบตามมาตรา 9 เจตนาล้อเล่นไม่ได้ทำให้การกระทำนี้ถูกต้อง สิ่งที่ควรทำคือบอกเพื่อนให้เปลี่ยนรหัสผ่าน"
