- id: thai.literature.literary-analysis.p013
  topics:
  - thai.literature.literary-analysis
  difficulty: 4
  type: mcq
  stem: ดูตัวบทในภาพ กวีเล่นคำจากชื่อตำบลอย่างไร
  figure:
    src: bang-thorani.svg
    alt: ตัวบทนิราศภูเขาทองของสุนทรภู่ ตามวิกิซอร์ซ ตอนผ่านบางธรณี 4 บรรทัด บรรทัด 1 มาถึงบางธรณีทวีโศก ยามวิโยคยากใจให้สะอื้น บรรทัด 2 โอ้สุธาหนาแน่นเป็นแผ่นพื้น ถึงสี่หมื่นสองแสนทั้งแดนไตร บรรทัด 3 เมื่อเคราะห์ร้ายกายเราก็เท่านี้ ไม่มีที่พสุธาจะอาศัย บรรทัด 4 ล้วนหนามเหน็บเจ็บแสบคับแคบใจ เหมือนนกไร้รังเร่อยู่เอกา
  choices:
  - id: a
    text: เล่นคำ วิโยค กับ สะอื้น ซึ่งเสียงเหมือนกัน
    feedback: สองคำนี้เสียงไม่เหมือนกัน และไม่ได้มาจากชื่อตำบล
  - id: b
    text: เล่นคำ นก กับ รัง ซึ่งเป็นชื่อตำบล
    feedback: นกไร้รังเป็นอุปมา ไม่ใช่ชื่อตำบล
  - id: c
    text: ชื่อ บางธรณี มีคำว่า ธรณี (แผ่นดิน) กวีจึงรำพึงว่าแผ่นดินกว้างใหญ่ แต่ตนกลับ ไม่มีที่พสุธาจะอาศัย
    correct: true
    feedback: ถูก ธรณีและพสุธาหมายถึงแผ่นดินทั้งคู่
  - id: d
    text: ไม่มีการเล่นคำ
    feedback: ชื่อตำบลกับเนื้อความเชื่อมกันชัดเจน
  hints:
  - ธรณี แปลว่าอะไร
  - หาคำในบรรทัดที่ 3 ที่ความหมายเดียวกับธรณี
  solution: จาก **บางธรณี** (ธรณี = แผ่นดิน) สู่ความรู้สึกว่า **ไม่มีที่พสุธา** (แผ่นดิน) จะอาศัย ทั้งที่แผ่นดินกว้างใหญ่
  license: CC-BY-SA-4.0
  ai_assisted: true
