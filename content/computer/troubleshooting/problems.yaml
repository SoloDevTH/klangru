problems:
  - id: computer.systems.troubleshooting.p001
    topics: [computer.systems.troubleshooting]
    difficulty: 1
    type: mcq
    stem: "ข้อใดบอกอาการปัญหาคอมพิวเตอร์ให้ครูได้ **ชัดเจนที่สุด**"
    choices:
      - { id: a, text: "เครื่องหมายเลข 5 เปิดโปรแกรมวาดภาพแล้วค้าง กดอะไรก็ไม่ตอบสนอง เป็นทุกครั้งตั้งแต่เมื่อวาน", correct: true }
      - { id: b, text: "คอมพิวเตอร์เสียครับ", feedback: "ไม่บอกว่าเครื่องไหน เสียอย่างไร ครูต้องถามใหม่ทั้งหมด" }
      - { id: c, text: "เครื่องนี้ไม่ดีเลย", feedback: "เป็นความรู้สึก ไม่ได้บอกอาการ" }
      - { id: d, text: "มันเป็นอีกแล้ว", feedback: "ไม่บอกว่าเป็นอะไร เครื่องไหน และเกิดเมื่อไร" }
    hints:
      - "อาการที่ดีบอกว่าเครื่องไหน เกิดอะไร และเกิดเมื่อไร"
      - "ข้อใดใช้คำที่ช่วยให้คนอื่นเข้าใจได้ทันที"
    solution: "ข้อ ก บอกเครื่อง โปรแกรม อาการ (ค้าง ไม่ตอบสนอง) และเวลาที่เริ่มเป็น ครูจึงเริ่มแก้ได้ทันที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.troubleshooting.p002
    topics: [computer.systems.troubleshooting]
    difficulty: 1
    type: match
    stem: "จับคู่อาการกับสิ่งที่ควรตรวจเป็นอย่างแรก"
    pairs:
      - { left: "ดูคลิปแล้วไม่มีเสียง", right: "ปุ่มปิดเสียงและระดับเสียง" }
      - { left: "เครื่องเปิดติดแต่จอดำ ไฟจอไม่ติด", right: "สายไฟและปุ่มเปิดของจอ" }
      - { left: "เมาส์ไร้สายไม่ขยับ", right: "ถ่านของเมาส์และตัวรับสัญญาณ" }
      - { left: "โทรศัพท์ต่อ Wi-Fi ไม่ได้", right: "โหมดเครื่องบินและสวิตช์ Wi-Fi" }
    hints:
      - "เริ่มจากสิ่งที่ง่ายที่สุดและพบบ่อยที่สุดของแต่ละอาการ"
      - "อุปกรณ์ไร้สายต้องใช้พลังงานจากที่ใด"
    solution: "ไม่มีเสียง → ปุ่มปิดเสียงและระดับเสียง, จอดำไฟจอไม่ติด → ไฟและปุ่มของจอ, เมาส์ไร้สายไม่ขยับ → ถ่านและตัวรับสัญญาณ, ต่อ Wi-Fi ไม่ได้ → โหมดเครื่องบินและสวิตช์ Wi-Fi"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.troubleshooting.p003
    topics: [computer.systems.troubleshooting]
    difficulty: 2
    type: order
    stem: "เครื่องพิมพ์ในห้องธุรการไม่พิมพ์งาน เรียงสิ่งที่ควรลองจากง่ายและพบบ่อยไปหายาก"
    items:
      - "ดูว่าเครื่องพิมพ์เปิดอยู่ และสายไฟกับสายสัญญาณเสียบแน่น"
      - "ดูว่ากระดาษหมดหรือติดอยู่หรือไม่"
      - "ดูว่าในคอมพิวเตอร์เลือกเครื่องพิมพ์ถูกเครื่อง"
      - "ปิดแล้วเปิดเครื่องพิมพ์และคอมพิวเตอร์ใหม่"
      - "ติดตั้งไดรเวอร์เครื่องพิมพ์ใหม่"
      - "แจ้งช่างพร้อมรายการสิ่งที่ลองแล้ว"
    hints:
      - "สิ่งที่มองเห็นด้วยตาและแก้ได้ในไม่กี่วินาทีควรมาก่อน"
      - "การติดตั้งซอฟต์แวร์ใหม่ใช้เวลานานกว่า และการเรียกช่างคือขั้นสุดท้าย"
    solution: "ไฟและสาย → กระดาษ → เลือกเครื่องพิมพ์ให้ถูก → รีสตาร์ต → ติดตั้งไดรเวอร์ใหม่ → แจ้งช่าง เรียงจากสิ่งที่ตรวจง่ายและพบบ่อยไปหาสิ่งที่ยาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.troubleshooting.p004
    topics: [computer.systems.troubleshooting]
    difficulty: 2
    type: mcq
    stem: "อาการใด **น่าจะเป็นปัญหาซอฟต์แวร์** มากที่สุด"
    choices:
      - { id: a, text: "หลังติดตั้งเกมใหม่ เฉพาะเกมนั้นปิดตัวเองทุกครั้ง โปรแกรมอื่นใช้ได้ปกติ", correct: true }
      - { id: b, text: "กดปุ่มเปิดแล้วไม่มีไฟและพัดลมไม่หมุนเลย", feedback: "เกิดก่อนซอฟต์แวร์จะเริ่มทำงาน มักเป็นปัญหาไฟหรือฮาร์ดแวร์" }
      - { id: c, text: "แป้นพิมพ์ปุ่ม A กดไม่ติดในทุกโปรแกรม และกดไม่ติดเมื่อนำไปต่อเครื่องอื่นด้วย", feedback: "เสียกับทุกโปรแกรมและทุกเครื่อง แสดงว่าตัวแป้นพิมพ์เสีย" }
      - { id: d, text: "จอมีเส้นสีพาดตลอดเวลา แม้ตอนเปิดเครื่องก่อนเข้าระบบปฏิบัติการ", feedback: "เกิดก่อนระบบปฏิบัติการเริ่ม จึงน่าจะเป็นจอหรือการ์ดจอ" }
    hints:
      - "ปัญหาที่เกิดเฉพาะโปรแกรมเดียวมักเป็นซอฟต์แวร์"
      - "ปัญหาที่เกิดก่อนระบบปฏิบัติการเริ่ม หรือเกิดกับทุกโปรแกรม มักเป็นฮาร์ดแวร์"
    solution: "ปัญหาที่เกิดกับโปรแกรมเดียวหลังติดตั้งใหม่ ขณะที่โปรแกรมอื่นปกติ ชี้ไปที่ซอฟต์แวร์ ข้ออื่นเกิดก่อนระบบปฏิบัติการเริ่มหรือเกิดกับทุกโปรแกรม จึงเป็นฮาร์ดแวร์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.troubleshooting.p005
    topics: [computer.systems.troubleshooting]
    difficulty: 2
    type: mcq
    stem: "เน็ตของบ้านมดช้ามาก มดรีสตาร์ตเราเตอร์ เปลี่ยนรหัส Wi-Fi และย้ายเราเตอร์ไปวางที่ใหม่พร้อมกันทั้งหมด แล้วเน็ตเร็วขึ้น ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "มดไม่รู้ว่าวิธีใดแก้ปัญหาได้จริง เพราะเปลี่ยนหลายอย่างพร้อมกัน", correct: true }
      - { id: b, text: "การเปลี่ยนรหัส Wi-Fi คือสาเหตุแน่นอน", feedback: "ไม่มีหลักฐานแยกผลของแต่ละอย่าง อาจเป็นการรีสตาร์ตหรือการย้ายที่ก็ได้" }
      - { id: c, text: "ต้องทำทั้งสามอย่างทุกครั้งที่เน็ตช้า", feedback: "อาจทำเกินจำเป็น ถ้ารู้สาเหตุจริงจะแก้ได้ตรงจุด" }
      - { id: d, text: "วิธีนี้ดีที่สุดเพราะแก้ได้เร็ว", feedback: "แก้ได้ครั้งนี้ แต่ครั้งหน้าก็ยังไม่รู้สาเหตุ และอาจมีผลข้างเคียง เช่น ทุกเครื่องต้องใส่รหัสใหม่" }
    hints:
      - "การทดสอบแบบวิทยาศาสตร์เปลี่ยนตัวแปรทีละตัว"
      - "ถ้าเปลี่ยนสามอย่างแล้วปัญหาหาย ตอบได้ไหมว่าเพราะอย่างไหน"
    solution: "เมื่อเปลี่ยนหลายอย่างพร้อมกันแล้วปัญหาหาย เราไม่รู้ว่าอย่างไหนคือสาเหตุ ควรเปลี่ยนทีละอย่างแล้วทดสอบ จะได้รู้สาเหตุจริงและบันทึกไว้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.troubleshooting.p006
    topics: [computer.systems.troubleshooting]
    difficulty: 3
    type: numeric
    stem: "สายไฟประดับงานลอยกระทงมีชุดหลอดต่อกัน 16 ชุดเป็นสายเดียว มีชุดเดียวที่เสียทำให้ไฟดับทั้งสาย ถ้าใช้การแบ่งครึ่ง (วัดไฟที่กึ่งกลางของช่วงที่ยังสงสัย) ในกรณีแย่ที่สุดต้องวัดอย่างมากกี่ครั้งจึงรู้ว่าชุดใดเสีย"
    answer: { value: 4, unit: ครั้ง }
    hints:
      - "แต่ละครั้งที่วัด ชุดที่ต้องสงสัยเหลือครึ่งหนึ่ง"
      - "16 → 8 → 4 → 2 → 1 ใช้กี่ขั้น"
    misconceptions:
      - { match: 15, feedback: "15 คือการวัดทีละชุดในกรณีแย่ที่สุด การแบ่งครึ่งตัดทิ้งครั้งละครึ่ง จึงเร็วกว่ามาก" }
      - { match: 8, feedback: "หาร 16 ด้วย 2 ครั้งเดียว แต่ต้องแบ่งครึ่งซ้ำไปจนเหลือชุดเดียว" }
    solution: "16 → 8 → 4 → 2 → 1 ใช้ 4 ครั้ง เพราะ $2^4 = 16$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.troubleshooting.p007
    topics: [computer.systems.troubleshooting]
    difficulty: 3
    type: mcq
    stem: "เมาส์ของเครื่องหมายเลข 9 ไม่ขยับ นักเรียนนำเมาส์ตัวนี้ไปต่อกับเครื่องหมายเลข 10 แล้วใช้ได้ปกติ ข้อสรุปใดสมเหตุสมผลที่สุด"
    choices:
      - { id: a, text: "เมาส์ไม่เสีย ปัญหาน่าจะอยู่ที่เครื่องหมายเลข 9 เช่น พอร์ต USB หรือไดรเวอร์", correct: true }
      - { id: b, text: "เมาส์เสีย ต้องซื้อใหม่", feedback: "เมาส์ใช้ได้กับอีกเครื่อง จึงไม่ใช่เมาส์ที่เสีย" }
      - { id: c, text: "เครื่องหมายเลข 10 เสีย", feedback: "เครื่อง 10 ทำงานปกติกับเมาส์ตัวนี้ ไม่มีหลักฐานว่าเสีย" }
      - { id: d, text: "สรุปอะไรไม่ได้เลย", feedback: "การสลับให้ข้อมูลสำคัญ คือเมาส์ใช้ได้ ช่วยตัดสาเหตุออกไปหนึ่งอย่าง" }
    hints:
      - "การสลับกับเครื่องที่รู้ว่าใช้ได้ช่วยตัดสาเหตุออก"
      - "ถ้าเมาส์ใช้ได้กับเครื่องอื่น อะไรยังเป็นสาเหตุที่เหลืออยู่"
    solution: "เมาส์ทำงานได้กับเครื่องอื่น จึงตัดเมาส์ออกจากสาเหตุ ปัญหาน่าจะอยู่ที่เครื่องหมายเลข 9 ขั้นต่อไปคือลองพอร์ต USB อื่นของเครื่อง 9 หรือตรวจไดรเวอร์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.troubleshooting.p008
    topics: [computer.systems.troubleshooting]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการแก้ปัญหาอย่างเป็นระบบ"
    items:
      - "ระบุอาการและเก็บข้อมูล เช่น ข้อความแจ้งข้อผิดพลาด และสิ่งที่เปลี่ยนไป"
      - "ตั้งสมมติฐานสาเหตุ เรียงจากน่าจะเป็นมากและตรวจง่าย"
      - "ทดสอบสมมติฐานทีละอย่าง"
      - "แก้ไขตามสาเหตุที่พบ"
      - "ตรวจว่าปัญหาหายจริงโดยลองใช้งานเดิมอีกครั้ง"
      - "บันทึกอาการ สาเหตุ และวิธีแก้"
    hints:
      - "ต้องรู้อาการก่อนจึงจะเดาสาเหตุได้"
      - "บันทึกเมื่อแน่ใจแล้วว่าแก้ได้จริง"
    solution: "ระบุอาการ → ตั้งสมมติฐาน → ทดสอบทีละอย่าง → แก้ → ตรวจว่าหายจริง → บันทึก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.troubleshooting.p009
    topics: [computer.systems.troubleshooting]
    difficulty: 3
    type: mcq
    stem: "เครื่องหมายเลข 12 เข้าอินเทอร์เน็ตไม่ได้ ผลการทดสอบคือ (1) เครื่องหมายเลข 13 ที่ต่อสวิตช์เดียวกันใช้ได้ (2) เปลี่ยนสาย LAN ของเครื่อง 12 เป็นเส้นใหม่ก็ยังไม่ได้ (3) ย้ายสายของเครื่อง 12 ไปเสียบพอร์ตว่างอีกพอร์ตของสวิตช์ แล้วใช้ได้ ส่วนใดในภาพน่าจะเป็นสาเหตุ"
    figure:
      src: network-chain.svg
      alt: "เส้นทางข้อมูลจากเครื่องหมายเลข 12 ไปอินเทอร์เน็ต เรียงจากซ้ายไปขวา เครื่องหมายเลข 12 ต่อสาย LAN ของเครื่อง 12 เข้าพอร์ต 12 ของสวิตช์ ต่อสวิตช์ประจำห้อง ต่อเราเตอร์ของโรงเรียน แล้วไปอินเทอร์เน็ต ด้านล่างมีเครื่องหมายเลข 13 ต่อเข้าพอร์ต 13 ของสวิตช์เดียวกัน"
    choices:
      - { id: a, text: "พอร์ต 12 ของสวิตช์", correct: true }
      - { id: b, text: "เราเตอร์ของโรงเรียน", feedback: "เครื่อง 13 ใช้เราเตอร์เดียวกันแล้วยังใช้ได้ และเครื่อง 12 ก็ใช้ได้เมื่อย้ายพอร์ต" }
      - { id: c, text: "สาย LAN เส้นเดิม", feedback: "เปลี่ยนสายใหม่แล้วยังไม่ได้ สายเดิมจึงไม่ใช่สาเหตุ (อย่างน้อยไม่ใช่สาเหตุเดียว)" }
      - { id: d, text: "ตัวสวิตช์ทั้งตัว", feedback: "สวิตช์ยังส่งข้อมูลให้เครื่อง 13 และพอร์ตอื่นได้ จึงไม่ได้เสียทั้งตัว" }
    hints:
      - "ใช้ผลการทดสอบแต่ละข้อตัดส่วนที่ยังใช้ได้ออก"
      - "การย้ายไปพอร์ตอื่นเปลี่ยนแค่สิ่งเดียว แล้วปัญหาหาย"
    solution: "ข้อ 1 ตัดสวิตช์ทั้งตัว เราเตอร์ และอินเทอร์เน็ตออก ข้อ 2 ตัดสาย LAN ออก ข้อ 3 เปลี่ยนเพียงพอร์ตแล้วใช้ได้ จึงสรุปว่าพอร์ต 12 ของสวิตช์เสีย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.troubleshooting.p010
    topics: [computer.systems.troubleshooting]
    difficulty: 3
    type: mcq
    stem: "ขณะบันทึกคลิปงานกลุ่ม แท็บเล็ตขึ้นข้อความ \"Storage full\" และบันทึกไม่ได้ ควรทำอย่างไรก่อน"
    choices:
      - { id: a, text: "ย้ายหรือลบไฟล์ที่ไม่ใช้ เช่น คลิปเก่าที่สำรองไว้แล้ว เพื่อให้มีพื้นที่ว่าง แล้วบันทึกใหม่", correct: true }
      - { id: b, text: "รีเซ็ตเครื่องเป็นค่าเริ่มต้นจากโรงงานทันที", feedback: "แก้ได้แต่ข้อมูลทั้งหมดจะหาย เป็นวิธีที่รุนแรงเกินไปสำหรับปัญหานี้" }
      - { id: c, text: "ซื้อแท็บเล็ตเครื่องใหม่", feedback: "แพงเกินจำเป็น ข้อความบอกสาเหตุชัดว่าพื้นที่เต็ม" }
      - { id: d, text: "กดบันทึกซ้ำหลาย ๆ ครั้ง", feedback: "พื้นที่ยังเต็มอยู่ การกดซ้ำไม่ช่วย" }
    hints:
      - "อ่านข้อความแจ้งข้อผิดพลาด มันบอกสาเหตุ"
      - "เลือกวิธีที่แก้ตรงสาเหตุและเสียหายน้อยที่สุด"
    solution: "Storage full แปลว่าหน่วยเก็บเต็ม วิธีที่ตรงและปลอดภัยคือทำพื้นที่ว่าง โดยย้ายไฟล์ไปเก็บที่อื่นหรือลบไฟล์ที่ไม่ใช้ ก่อนลบให้แน่ใจว่าสำรองไว้แล้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.troubleshooting.p011
    topics: [computer.systems.troubleshooting]
    difficulty: 4
    type: mcq
    stem: "นักเรียนเขียนคู่มือ \"จอไม่มีภาพ\" ให้รุ่นน้องในห้องคอมพิวเตอร์ ขั้นตอนข้อใดเขียนได้ดีที่สุด"
    choices:
      - { id: a, text: "ดูไฟที่มุมจอ ถ้าไม่ติด ให้ตรวจว่าสายไฟจอเสียบแน่น แล้วกดปุ่มเปิดจอ ถ้าติดแล้ว ให้ไปข้อ 3", correct: true }
      - { id: b, text: "ตรวจทุกอย่างให้เรียบร้อย", feedback: "กว้างเกินไป รุ่นน้องไม่รู้ว่าต้องตรวจอะไรและตรวจอย่างไร" }
      - { id: c, text: "เปิดฝาเครื่องแล้วดึง RAM ออกมาเช็ด", feedback: "ยากเกินไปสำหรับขั้นแรก และไม่ปลอดภัยสำหรับนักเรียนที่ไม่ได้รับอนุญาต" }
      - { id: d, text: "ตรวจ BIOS, PSU, GPU และ VRAM", feedback: "ใช้ศัพท์ที่ผู้อ่านไม่เข้าใจ และไม่บอกวิธีตรวจหรือขั้นถัดไป" }
    hints:
      - "ขั้นตอนที่ดีมีงานเดียว ตอบได้ว่าใช่หรือไม่ และบอกว่าทำอะไรต่อ"
      - "ผู้อ่านคือรุ่นน้อง ใช้คำที่เข้าใจได้"
    solution: "ข้อ ก มีสิ่งที่ต้องดูชัดเจน มีทางเลือกเมื่อใช่หรือไม่ใช่ บอกขั้นถัดไป และเป็นสิ่งที่นักเรียนทำได้อย่างปลอดภัย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.troubleshooting.p012
    topics: [computer.systems.troubleshooting]
    difficulty: 4
    type: numeric
    stem: "ข้อมูลผ่านอุปกรณ์และสายต่อกัน 50 ชิ้นก่อนถึงปลายทาง และมีชิ้นเดียวที่เสีย ถ้าใช้การแบ่งครึ่ง ในกรณีแย่ที่สุดต้องทดสอบอย่างมากกี่ครั้ง"
    answer: { value: 6, unit: ครั้ง }
    hints:
      - "หา n ที่น้อยที่สุดที่ $2^n$ มากกว่าหรือเท่ากับ 50"
      - "ถ้าแบ่งไม่ลงตัว ให้คิดกรณีที่ปัญหาตกอยู่ในครึ่งที่ใหญ่กว่า"
    misconceptions:
      - { match: 25, feedback: "หาร 50 ด้วย 2 ครั้งเดียว ต้องแบ่งครึ่งซ้ำจนเหลือชิ้นเดียว" }
      - { match: 5, feedback: "$2^5$ = 32 ยังน้อยกว่า 50 จึงยังไม่พอ" }
    solution: "50 → 25 → 13 → 7 → 4 → 2 → 1 ใช้ 6 ครั้ง ตรงกับ $2^5 = 32 < 50 \\le 2^6 = 64$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.troubleshooting.p013
    topics: [computer.systems.troubleshooting]
    difficulty: 4
    type: mcq
    stem: "เช้าวันจันทร์ ทุกเครื่องในโรงเรียนเปิดเว็บไซต์ใดไม่ได้เลย แต่ส่งไฟล์ให้กันภายในห้องได้ และเครื่องพิมพ์ในห้องยังพิมพ์ได้ ควรตรวจสิ่งใดก่อน"
    choices:
      - { id: a, text: "เราเตอร์หรือการเชื่อมต่ออินเทอร์เน็ตของโรงเรียน ซึ่งทุกเครื่องใช้ร่วมกันเพื่อออกนอกโรงเรียน", correct: true }
      - { id: b, text: "เบราว์เซอร์ในแต่ละเครื่อง", feedback: "ปัญหาเกิดกับทุกเครื่องพร้อมกัน ไม่น่าเป็นปัญหาของแต่ละเครื่อง" }
      - { id: c, text: "สาย LAN ของทุกเครื่อง", feedback: "เครื่องยังส่งไฟล์ภายในห้องได้ สายของแต่ละเครื่องจึงยังใช้ได้" }
      - { id: d, text: "เครื่องพิมพ์", feedback: "เครื่องพิมพ์ทำงานปกติ และไม่เกี่ยวกับการเข้าเว็บ" }
    hints:
      - "อะไรที่ทุกเครื่องใช้ร่วมกันเฉพาะตอนออกไปนอกโรงเรียน"
      - "งานภายในยังทำได้ แปลว่าเครือข่ายภายในยังปกติ"
    solution: "เครือข่ายภายในปกติ (ส่งไฟล์และพิมพ์ได้) แต่ออกนอกโรงเรียนไม่ได้ทุกเครื่อง สาเหตุน่าจะอยู่ที่ส่วนที่ใช้ร่วมกันเพื่อออกอินเทอร์เน็ต คือเราเตอร์หรือการเชื่อมต่อจากผู้ให้บริการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.troubleshooting.p014
    topics: [computer.systems.troubleshooting]
    difficulty: 2
    type: text
    stem: "โปรแกรมค้าง ลองปิดโปรแกรมแล้วก็ยังผิดปกติ วิธีทั่วไปต่อไปคือปิดเครื่องแล้วเปิดใหม่ เรียกการทำแบบนี้ว่าอะไร (ตอบเป็นคำไทยทับศัพท์หรือภาษาอังกฤษ)"
    accepted: ["รีสตาร์ต", "รีสตาร์ท", "restart", "reboot", "รีบูต", "รีบูท"]
    misconceptions:
      - { match: "รีเซ็ต", feedback: "การรีเซ็ตมักหมายถึงล้างค่ากลับเป็นค่าเริ่มต้น ข้อมูลอาจหาย ไม่ใช่แค่ปิดแล้วเปิดใหม่" }
      - { match: "reset", feedback: "การรีเซ็ตมักหมายถึงล้างค่ากลับเป็นค่าเริ่มต้น ข้อมูลอาจหาย ไม่ใช่แค่ปิดแล้วเปิดใหม่" }
    hints:
      - "คำนี้แปลว่าเริ่มต้นใหม่"
      - "ขึ้นต้นด้วย รี"
    solution: "การปิดแล้วเปิดเครื่องใหม่เรียกว่า รีสตาร์ต (restart) หรือรีบูต (reboot) ช่วยล้างสถานะผิดพลาดชั่วคราวในหน่วยความจำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.troubleshooting.p015
    topics: [computer.systems.troubleshooting]
    difficulty: 5
    type: numeric
    stem: |
      คอมพิวเตอร์เครื่องหนึ่งไม่มีเสียง ช่างประเมินสาเหตุที่เป็นไปได้ 3 อย่าง (มีจริงเพียงอย่างเดียว) ช่างตรวจตามลำดับ A → B → C และหยุดเมื่อพบสาเหตุ เวลาที่คาดว่าจะใช้ (ค่าคาดหมาย) เป็นกี่นาที

      | สาเหตุ | โอกาสที่เป็นสาเหตุ | เวลาที่ใช้ตรวจ |
      |---|---|---|
      | A สายลำโพงหลวม | 50% | 1 นาที |
      | B ไดรเวอร์เสียง | 30% | 10 นาที |
      | C การ์ดเสียงเสีย | 20% | 30 นาที |
    answer: { value: 12, tolerance: 0.1, unit: นาที }
    hints:
      - "ถ้าสาเหตุคือ A ใช้ 1 นาที ถ้าเป็น B ต้องตรวจ A ก่อน จึงใช้ 1 + 10 นาที ถ้าเป็น C ใช้ 1 + 10 + 30 นาที"
      - "ค่าคาดหมาย = ผลรวมของ (โอกาส × เวลาที่ใช้ในกรณีนั้น)"
    misconceptions:
      - { match: 41, feedback: "41 นาทีคือเวลาเมื่อต้องตรวจครบทั้งสามอย่าง ซึ่งเกิดเฉพาะเมื่อสาเหตุคือ C (20%)" }
      - { match: 9.5, feedback: "คูณโอกาสกับเวลาตรวจของแต่ละอย่างแยกกัน แต่ถ้าสาเหตุคือ B ต้องเสียเวลาตรวจ A ก่อนด้วย" }
    solution: "0.5 × 1 + 0.3 × (1 + 10) + 0.2 × (1 + 10 + 30) = 0.5 + 3.3 + 8.2 = 12 นาที ถ้าตรวจกลับลำดับ C → B → A จะได้ 0.2 × 30 + 0.3 × 40 + 0.5 × 41 = 38.5 นาที การตรวจสิ่งที่น่าจะเป็นและตรวจง่ายก่อนจึงประหยัดเวลา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.troubleshooting.p016
    topics: [computer.systems.troubleshooting]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ชมรมคอมพิวเตอร์จะทำคู่มือแก้ปัญหาให้ทุกห้องเรียนในโรงเรียนใช้ ข้อใดเป็นแนวทางที่ทำให้คู่มือ **ใช้ได้จริงกับผู้อื่น** (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ให้ครูหรือนักเรียนที่ไม่เคยเห็นปัญหาลองทำตามคู่มือ แล้วแก้ขั้นที่ทำให้สับสน", correct: true }
      - { id: b, text: "ระบุจุดที่ต้องหยุดและแจ้งช่าง และข้อห้ามด้านความปลอดภัยไว้ชัดเจน", correct: true }
      - { id: c, text: "เรียงขั้นจากง่ายและพบบ่อยไปยาก แต่ละขั้นตอบได้ว่าใช่หรือไม่ และบอกขั้นถัดไป", correct: true }
      - { id: d, text: "ใส่ทุกวิธีที่ชมรมรู้ไว้ในขั้นเดียวยาว ๆ เพื่อให้ครบถ้วน", feedback: "ขั้นที่ยาวและมีหลายงานทำให้ผู้ใช้หลงและข้ามบางอย่าง ควรแยกเป็นขั้นละงานเดียว" }
    hints:
      - "คู่มือที่ดีต้องให้คนอื่นทำตามได้โดยไม่มีผู้เขียนอยู่ด้วย"
      - "คิดทั้งด้านความชัดเจน ความปลอดภัย และการทดสอบคู่มือ"
    solution: "คู่มือที่ใช้ได้จริงต้องผ่านการทดลองใช้โดยผู้อื่น (ก) บอกขอบเขตและความปลอดภัย (ข) และมีโครงสร้างขั้นละงานเดียวที่เรียงจากง่ายไปยาก (ค) ส่วนการยัดทุกวิธีไว้ในขั้นเดียวทำให้ใช้ยาก"
    license: CC-BY-SA-4.0
    ai_assisted: true
