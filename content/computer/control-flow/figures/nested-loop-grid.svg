  <text x="360.0" y="206.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#15211e">11</text>
  <rect x="402" y="174" width="84" height="52" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="444.0" y="206.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#15211e">12</text>
  <text x="340" y="270" text-anchor="middle" font-size="14" font-weight="normal" fill="#15211e">ลูปในวนครบทุกคอลัมน์ของแถวหนึ่งก่อน แล้วลูปนอกจึงขยับไปแถวถัดไป</text>
  <text x="340" y="292" text-anchor="middle" font-size="14" font-weight="normal" fill="#4a5a55">ช่องสีส้มคือรอบแรกของทั้งสองลูป (i = 1, j = 1) แต่ละช่องทำงานเพียงครั้งเดียว</text>
</svg>
