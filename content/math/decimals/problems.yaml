  - id: math.dec.p019
    topics: [math.number.decimals]
    difficulty: 3
    type: mcq
    stem: "เศษส่วนใดเขียนเป็นทศนิยม **รู้จบ** ได้ (หารแล้วจบ ไม่ซ้ำไม่รู้จบ)"
    choices:
      - { id: a, text: "$\\dfrac{7}{20}$", correct: true }
      - { id: b, text: "$\\dfrac{1}{6}$", feedback: "$6 = 2 \\times 3$ มีตัวประกอบ 3 จึงได้ทศนิยมซ้ำ $0.1\\dot{6}$" }
      - { id: c, text: "$\\dfrac{2}{9}$", feedback: "$9 = 3 \\times 3$ จึงได้ทศนิยมซ้ำ $0.\\dot{2}$" }
      - { id: d, text: "$\\dfrac{5}{12}$", feedback: "$12 = 2^2 \\times 3$ มีตัวประกอบ 3 จึงได้ทศนิยมซ้ำ $0.41\\dot{6}$" }
    hints:
      - "เศษส่วนอย่างต่ำเป็นทศนิยมรู้จบได้เมื่อขยายให้ตัวส่วนเป็น 10, 100, 1000, … ได้"
      - "แยกตัวประกอบเฉพาะของตัวส่วน ถ้ามีแต่ 2 และ 5 จะเป็นทศนิยมรู้จบ"
    solution: "$20 = 2^2 \\times 5$ มีแต่ตัวประกอบ 2 และ 5 จึงขยายเป็นส่วนร้อยได้: $\\tfrac{7}{20} = \\tfrac{35}{100} = 0.35$ ส่วนตัวเลือกอื่นมีตัวประกอบ 3 ในตัวส่วน จึงเป็นทศนิยมซ้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

