problems:
  - id: math.stats.pictographs-tables.p001
    topics: [math.stats.pictographs-tables]
    difficulty: 1
    type: numeric
    stem: "ฟ้านับคะแนนเสียงเลือกหัวหน้าห้องด้วยรอยขีด คุณต้นได้รอยขีดเป็นกลุ่มที่มีขีดขวางทับ 2 กลุ่ม และขีดเดี่ยวอีก 3 ขีด คุณต้นได้กี่คะแนน"
    answer: { value: 13, unit: คะแนน }
    hints:
      - "กลุ่มที่มีขีดขวางทับ 1 กลุ่มแทนกี่ขีด"
      - "1 กลุ่ม = 5 ขีด (4 ขีดตั้งกับ 1 ขีดขวาง)"
    misconceptions:
      - { match: 11, feedback: "นับกลุ่มละ 4 ขีด แต่ขีดขวางก็นับด้วย กลุ่มหนึ่งจึงเป็น 5" }
      - { match: 5, feedback: "นับจำนวนกลุ่มและขีดเดี่ยว (2 + 3) แต่ 1 กลุ่มแทน 5 ขีด" }
    solution: "2 กลุ่ม $= 5 + 5 = 10$ ขีด รวมขีดเดี่ยวอีก 3 ได้ $10 + 3 = 13$ คะแนน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.pictographs-tables.p002
    topics: [math.stats.pictographs-tables]
    difficulty: 1
    type: mcq
    stem: "จากแผนภูมิรูปภาพ ห้องใดยืมหนังสือมากที่สุด"
    figure: { src: pictograph-books.svg, alt: "แผนภูมิรูปภาพจำนวนหนังสือที่แต่ละห้องยืมจากห้องสมุดในสัปดาห์นี้ รูปหนังสือ 1 รูปแทน 10 เล่ม ป.3/1 มี 4 รูป ป.3/2 มี 3 รูปครึ่ง ป.3/3 มี 5 รูป ป.3/4 มี 2 รูปครึ่ง" }
    choices:
      - { id: a, text: "ป.3/1", feedback: "ป.3/1 มี 4 รูป ยังมีห้องที่มีรูปมากกว่า" }
      - { id: b, text: "ป.3/2", feedback: "ป.3/2 มี 3 รูปครึ่ง น้อยกว่า ป.3/1 และ ป.3/3" }
      - { id: c, text: "ป.3/3", correct: true }
      - { id: d, text: "ป.3/4", feedback: "ป.3/4 มีรูปน้อยที่สุด จึงยืมน้อยที่สุด" }
    hints:
      - "ทุกรูปแทนจำนวนเท่ากัน"
      - "ห้องที่มีรูปมากที่สุดยืมมากที่สุด"
    solution: "ป.3/3 มี 5 รูปซึ่งมากที่สุด จึงยืมหนังสือมากที่สุด ($5 \\times 10 = 50$ เล่ม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.pictographs-tables.p003
    topics: [math.stats.pictographs-tables]
    difficulty: 2
    type: numeric
    stem: "จากแผนภูมิรูปภาพ ห้อง ป.3/1 ยืมหนังสือกี่เล่ม"
    figure: { src: pictograph-books.svg, alt: "แผนภูมิรูปภาพจำนวนหนังสือที่แต่ละห้องยืมจากห้องสมุดในสัปดาห์นี้ รูปหนังสือ 1 รูปแทน 10 เล่ม ป.3/1 มี 4 รูป ป.3/2 มี 3 รูปครึ่ง ป.3/3 มี 5 รูป ป.3/4 มี 2 รูปครึ่ง" }
    answer: { value: 40, unit: เล่ม }
    hints:
      - "ดูคำอธิบายสัญลักษณ์ใต้แผนภูมิ 1 รูปแทนกี่เล่ม"
      - "คูณจำนวนรูปด้วย 10"
    misconceptions:
      - { match: 4, feedback: "4 คือจำนวนรูป แต่ 1 รูปแทน 10 เล่ม" }
    solution: "ป.3/1 มี 4 รูป $4 \\times 10 = 40$ เล่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.pictographs-tables.p004
    topics: [math.stats.pictographs-tables]
    difficulty: 2
    type: numeric
    stem: "จากแผนภูมิรูปภาพ ห้อง ป.3/2 ยืมหนังสือกี่เล่ม"
    figure: { src: pictograph-books.svg, alt: "แผนภูมิรูปภาพจำนวนหนังสือที่แต่ละห้องยืมจากห้องสมุดในสัปดาห์นี้ รูปหนังสือ 1 รูปแทน 10 เล่ม ป.3/1 มี 4 รูป ป.3/2 มี 3 รูปครึ่ง ป.3/3 มี 5 รูป ป.3/4 มี 2 รูปครึ่ง" }
    answer: { value: 35, unit: เล่ม }
    hints:
      - "นับรูปเต็มก่อน แล้วดูครึ่งรูป"
      - "1 รูปแทน 10 เล่ม ครึ่งรูปจึงแทน 5 เล่ม"
    misconceptions:
      - { match: 30, feedback: "ลืมครึ่งรูป ครึ่งรูปแทนอีก 5 เล่ม" }
      - { match: 40, feedback: "นับครึ่งรูปเป็นรูปเต็ม ครึ่งรูปแทน 5 เล่ม ไม่ใช่ 10" }
    solution: "3 รูปเต็ม $= 3 \\times 10 = 30$ เล่ม ครึ่งรูป $= 5$ เล่ม รวม $30 + 5 = 35$ เล่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.pictographs-tables.p005
    topics: [math.stats.pictographs-tables]
    difficulty: 3
    type: numeric
    stem: "จากแผนภูมิรูปภาพ ห้อง ป.3/3 ยืมหนังสือมากกว่าห้อง ป.3/4 กี่เล่ม"
    figure: { src: pictograph-books.svg, alt: "แผนภูมิรูปภาพจำนวนหนังสือที่แต่ละห้องยืมจากห้องสมุดในสัปดาห์นี้ รูปหนังสือ 1 รูปแทน 10 เล่ม ป.3/1 มี 4 รูป ป.3/2 มี 3 รูปครึ่ง ป.3/3 มี 5 รูป ป.3/4 มี 2 รูปครึ่ง" }
    answer: { value: 25, unit: เล่ม }
    hints:
      - "หาจำนวนเล่มของทั้งสองห้องก่อน"
      - "มากกว่ากันเท่าไร ใช้การลบ"
    misconceptions:
      - { match: 75, feedback: "บวกกัน แต่โจทย์ถามว่ามากกว่ากันเท่าไร ต้องลบ" }
      - { match: 2.5, feedback: "2.5 คือจำนวนรูปที่ต่างกัน ต้องคูณด้วย 10" }
    solution: "ป.3/3: $5 \\times 10 = 50$ เล่ม ป.3/4: $2 \\times 10 + 5 = 25$ เล่ม มากกว่ากัน $50 - 25 = 25$ เล่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.pictographs-tables.p006
    topics: [math.stats.pictographs-tables]
    difficulty: 3
    type: numeric
    stem: "จากแผนภูมิรูปภาพ ทั้งสี่ห้องยืมหนังสือรวมกันกี่เล่ม"
    figure: { src: pictograph-books.svg, alt: "แผนภูมิรูปภาพจำนวนหนังสือที่แต่ละห้องยืมจากห้องสมุดในสัปดาห์นี้ รูปหนังสือ 1 รูปแทน 10 เล่ม ป.3/1 มี 4 รูป ป.3/2 มี 3 รูปครึ่ง ป.3/3 มี 5 รูป ป.3/4 มี 2 รูปครึ่ง" }
    answer: { value: 150, unit: เล่ม }
    hints:
      - "นับรูปทั้งหมดก่อน (ครึ่งรูป 2 ชิ้นเท่ากับ 1 รูป)"
      - "แล้วคูณจำนวนรูปทั้งหมดด้วย 10"
    misconceptions:
      - { match: 15, feedback: "15 คือจำนวนรูปทั้งหมด ต้องคูณด้วย 10" }
      - { match: 140, feedback: "อาจลืมครึ่งรูปไปหนึ่งชิ้น ครึ่งรูป 2 ชิ้นรวมเป็น 10 เล่ม" }
    solution: "จำนวนรูป $4 + 3.5 + 5 + 2.5 = 15$ รูป รวม $15 \\times 10 = 150$ เล่ม (หรือ $40 + 35 + 50 + 25 = 150$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.pictographs-tables.p007
    topics: [math.stats.pictographs-tables]
    difficulty: 2
    type: numeric
    stem: "แผนภูมิรูปภาพจำนวนนักเรียนที่มาเข้าค่ายลูกเสือ รูปคน 1 รูปแทน 5 คน วันแรกมี 6 รูป วันแรกมีนักเรียนกี่คน"
    answer: { value: 30, unit: คน }
    hints:
      - "1 รูปแทน 5 คน"
      - "6 รูป คือ 5 หกครั้ง"
    misconceptions:
      - { match: 6, feedback: "6 คือจำนวนรูป ต้องคูณด้วย 5" }
      - { match: 11, feedback: "บวก 6 กับ 5 แต่ต้องคูณ เพราะทุกรูปแทน 5 คน" }
    solution: "$6 \\times 5 = 30$ คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.pictographs-tables.p008
    topics: [math.stats.pictographs-tables]
    difficulty: 2
    type: numeric
    stem: |
      ตารางแสดงกีฬาที่นักเรียนชั้น ป.3 ชอบ มีนักเรียนชอบตะกร้อกี่คน

      | กีฬา | จำนวนนักเรียน |
      |---|---|
      | ฟุตบอล | 12 |
      | ตะกร้อ | ? |
      | วอลเลย์บอล | 9 |
      | แบดมินตัน | 7 |
      | รวม | 36 |
    answer: { value: 8, unit: คน }
    hints:
      - "แถวรวมคือผลรวมของทุกกีฬา"
      - "นำ 36 ลบจำนวนของกีฬาที่รู้แล้ว"
    misconceptions:
      - { match: 64, feedback: "บวกทุกจำนวนรวมกับ 36 ด้วย แต่ 36 คือผลรวมอยู่แล้ว ต้องลบ" }
      - { match: 28, feedback: "28 คือผลรวมของกีฬาที่รู้แล้ว ($12 + 9 + 7$) ต้องนำไปลบออกจาก 36" }
    solution: "กีฬาที่รู้แล้วรวม $12 + 9 + 7 = 28$ คน ตะกร้อ $= 36 - 28 = 8$ คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.pictographs-tables.p009
    topics: [math.stats.pictographs-tables]
    difficulty: 3
    type: numeric
    stem: |
      ตารางสองทางแสดงวิธีมาโรงเรียนของนักเรียนชั้น ป.4 มีนักเรียนปั่นจักรยานมาโรงเรียนทั้งหมดกี่คน

      | | เดิน | จักรยาน | รถโรงเรียน |
      |---|---|---|---|
      | ชาย | 8 | 7 | 12 |
      | หญิง | 10 | 5 | 9 |
    answer: { value: 12, unit: คน }
    hints:
      - "หาหลัก จักรยาน"
      - "บวกนักเรียนชายและหญิงในหลักนั้น"
    misconceptions:
      - { match: 7, feedback: "นับแค่นักเรียนชาย ต้องรวมนักเรียนหญิงที่ปั่นจักรยานด้วย" }
      - { match: 27, feedback: "27 คือนักเรียนชายทั้งหมด (อ่านตามแถว) โจทย์ถามหลักจักรยาน" }
    solution: "หลักจักรยาน: ชาย 7 คน หญิง 5 คน รวม $7 + 5 = 12$ คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.pictographs-tables.p010
    topics: [math.stats.pictographs-tables]
    difficulty: 4
    type: numeric
    stem: |
      ตารางสองทางแสดงจำนวนนักเรียนในชมรม ห้อง ป.4/2 มีนักเรียนในชมรมกีฬากี่คน

      | ห้อง | ดนตรี | กีฬา | ศิลปะ | รวม |
      |---|---|---|---|---|
      | ป.4/1 | 9 | 14 | 7 | 30 |
      | ป.4/2 | 11 | ? | 6 | 29 |
      | รวม | 20 | 26 | 13 | 59 |
    answer: { value: 12, unit: คน }
    hints:
      - "ใช้แถว ป.4/2 หรือหลัก กีฬา ก็ได้"
      - "แถว ป.4/2: 29 ลบดนตรีและศิลปะ หรือหลักกีฬา: 26 ลบ ป.4/1"
    misconceptions:
      - { match: 14, feedback: "14 คือชมรมกีฬาของ ป.4/1 โจทย์ถาม ป.4/2" }
      - { match: 26, feedback: "26 คือชมรมกีฬารวมทั้งสองห้อง ต้องลบส่วนของ ป.4/1" }
    solution: "ตามแถว: $29 - 11 - 6 = 12$ คน ตรวจตามหลัก: $26 - 14 = 12$ คน ได้เท่ากัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.pictographs-tables.p011
    topics: [math.stats.pictographs-tables]
    difficulty: 2
    type: numeric
    stem: "จากกราฟเส้น ร้านป้าแดงขายข้าวเหนียวมะม่วงในเดือนมีนาคมได้กี่กล่อง"
    figure: { src: line-problem.svg, alt: "กราฟเส้นยอดขายข้าวเหนียวมะม่วงของร้านป้าแดงเป็นกล่อง แกนนอนเป็นเดือน ม.ค. ถึง มิ.ย. แกนตั้ง 0 ถึง 280 เส้นตารางทุก 20 และมีตัวเลขทุก 40 จุดบนกราฟ ม.ค. 120 ก.พ. 160 มี.ค. 220 เม.ย. 260 พ.ค. 240 มิ.ย. 180" }
    answer: { value: 220, unit: กล่อง }
    hints:
      - "หา มี.ค. บนแกนนอน แล้วมองขึ้นไปถึงจุด"
      - "เส้นตารางห่างกันทีละ 20 จุดอยู่เหนือเส้น 200 ไปหนึ่งเส้น"
    misconceptions:
      - { match: 240, feedback: "อาจอ่านจุดของเดือน พ.ค. หรือนับเส้นตารางเกินไปหนึ่งเส้น" }
      - { match: 210, feedback: "เส้นตารางเพิ่มทีละ 20 ไม่ใช่ 10 จุดอยู่บนเส้นที่อยู่เหนือ 200 พอดี" }
    solution: "จุดของเดือน มี.ค. อยู่บนเส้นตารางถัดจาก 200 ขึ้นไปหนึ่งเส้น จึงเป็น 220 กล่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.pictographs-tables.p012
    topics: [math.stats.pictographs-tables]
    difficulty: 3
    type: numeric
    stem: "จากกราฟเส้น ยอดขายเดือนเมษายนมากกว่าเดือนกุมภาพันธ์กี่กล่อง"
    figure: { src: line-problem.svg, alt: "กราฟเส้นยอดขายข้าวเหนียวมะม่วงของร้านป้าแดงเป็นกล่อง แกนนอนเป็นเดือน ม.ค. ถึง มิ.ย. แกนตั้ง 0 ถึง 280 เส้นตารางทุก 20 และมีตัวเลขทุก 40 จุดบนกราฟ ม.ค. 120 ก.พ. 160 มี.ค. 220 เม.ย. 260 พ.ค. 240 มิ.ย. 180" }
    answer: { value: 100, unit: กล่อง }
    hints:
      - "อ่านค่าของเดือน ก.พ. และ เม.ย."
      - "นำค่าที่มากกว่าลบค่าที่น้อยกว่า"
    misconceptions:
      - { match: 420, feedback: "บวกสองเดือน แต่โจทย์ถามว่ามากกว่ากันเท่าไร ต้องลบ" }
      - { match: 40, feedback: "40 คือผลต่างของ มี.ค. กับ เม.ย. โจทย์ให้เทียบ ก.พ. กับ เม.ย." }
    solution: "เม.ย. 260 กล่อง ก.พ. 160 กล่อง มากกว่ากัน $260 - 160 = 100$ กล่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.pictographs-tables.p013
    topics: [math.stats.pictographs-tables]
    difficulty: 4
    type: mcq
    stem: "จากกราฟเส้น ยอดขายเพิ่มขึ้นมากที่สุดในช่วงใด (เทียบเดือนที่ติดกัน)"
    figure: { src: line-problem.svg, alt: "กราฟเส้นยอดขายข้าวเหนียวมะม่วงของร้านป้าแดงเป็นกล่อง แกนนอนเป็นเดือน ม.ค. ถึง มิ.ย. แกนตั้ง 0 ถึง 280 เส้นตารางทุก 20 และมีตัวเลขทุก 40 จุดบนกราฟ ม.ค. 120 ก.พ. 160 มี.ค. 220 เม.ย. 260 พ.ค. 240 มิ.ย. 180" }
    choices:
      - { id: a, text: "ม.ค. ถึง ก.พ.", feedback: "ช่วงนี้เพิ่ม $160 - 120 = 40$ กล่อง ยังมีช่วงที่เพิ่มมากกว่า" }
      - { id: b, text: "ก.พ. ถึง มี.ค.", correct: true }
      - { id: c, text: "มี.ค. ถึง เม.ย.", feedback: "เม.ย. สูงที่สุด แต่ช่วงนี้เพิ่มแค่ $260 - 220 = 40$ กล่อง จุดสูงสุดไม่ใช่ช่วงที่เพิ่มมากที่สุด" }
      - { id: d, text: "พ.ค. ถึง มิ.ย.", feedback: "ช่วงนี้เส้นลง ยอดขายลดลง 60 กล่อง ไม่ได้เพิ่ม" }
    hints:
      - "ช่วงที่เส้นขึ้นชันที่สุดคือช่วงที่เพิ่มมากที่สุด"
      - "หาผลต่างของแต่ละช่วงที่เส้นขึ้น"
    solution: "ช่วงที่เพิ่ม: ม.ค.–ก.พ. 40, ก.พ.–มี.ค. 60, มี.ค.–เม.ย. 40 ช่วง ก.พ. ถึง มี.ค. เพิ่มมากที่สุด (60 กล่อง) และเป็นช่วงที่เส้นชันขึ้นมากที่สุด"
