  stem: 'พหุนามที่สร้างจากอนุพันธ์ของฟังก์ชัน ณ จุด $a$ เพื่อประมาณฟังก์ชันรอบจุดนั้น เรียกว่าอะไร (ตอบชื่อ)'
  accepted:
