  - id: biology.cells.cytoskeleton-junctions.p018
    topics: [biology.cells.cytoskeleton-junctions]
    difficulty: 3
    type: code
    stem: "เขียนฟังก์ชัน `magnification(image_mm, actual_um)` ที่รับขนาดของภาพเป็นมิลลิเมตรและขนาดจริงเป็นไมโครเมตร แล้วคืนค่ากำลังขยาย (ตัวเลขไม่มีหน่วย)"
    starter: |
      def magnification(image_mm, actual_um):
          pass
    tests: |
      r = magnification(60, 20)
      assert r is not None, "ไม่ได้คืนค่า (ได้ None) ต้องใช้ return ไม่ใช่ print"
      assert abs(r - 3000) < 1e-6, f"magnification(60, 20) ควรได้ 3000 แต่ได้ {r} อย่าลืมแปลง mm เป็น μm (1 mm = 1000 μm)"
      r2 = magnification(7.5, 0.5)
      assert abs(r2 - 15000) < 1e-6, f"magnification(7.5, 0.5) ควรได้ 15000 แต่ได้ {r2}"
      assert abs(magnification(1, 1000) - 1) < 1e-6, "ถ้าขนาดภาพเท่ากับขนาดจริง กำลังขยายต้องเป็น 1"
    reference: |
      def magnification(image_mm, actual_um):
          return image_mm * 1000 / actual_um
    hints:
      - "ใช้สูตรกำลังขยาย = ขนาดในภาพ ÷ ขนาดจริง"
      - "ต้องคูณ image_mm ด้วย 1000 เพื่อให้ได้หน่วย μm ก่อนหาร"
    solution: "แปลงขนาดภาพเป็นไมโครเมตรด้วยการคูณ 1000 แล้วหารด้วยขนาดจริง เช่น magnification(60, 20) = 60 × 1000 ÷ 20 = 3000"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.cells.cytoskeleton-junctions.p019
