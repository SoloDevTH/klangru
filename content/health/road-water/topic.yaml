id: health.safety.road-water
subject: health
title: { th: ความปลอดภัยทางน้ำ ทางบก และการเดินทาง, en: "Water, road and travel safety" }
summary: การเดินและข้ามถนนในประเทศที่รถวิ่งชิดซ้าย หมวกนิรภัย เข็มขัดนิรภัยและคาร์ซีต การโดยสารรถสาธารณะ การวางแผนเดินทาง การป้องกันการจมน้ำ และหลักตะโกน โยน ยื่น
difficulty: 1.5
minutes: 30
prerequisites: [health.safety.home-school-play]
encompasses:
  - { id: health.safety.home-school-play, weight: 0.25 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ข้ามถนนตรงทางม้าลาย
    src: road-crossing.svg
    alt: "ภาพมองจากด้านบนของถนนสองเลนมีทางม้าลาย เด็กยืนบนทางเท้าด้านล่างหน้าทางม้าลาย รถในเลนใกล้เด็ก (เลนล่าง) วิ่งจากทางขวาไปทางซ้าย รถในเลนไกล (เลนบน) วิ่งจากทางซ้ายไปทางขวา ข้อความบอกว่า 1 มองขวา 2 มองซ้าย 3 มองขวาอีกครั้ง แล้วจึงเดินข้าม"
    caption: "ประเทศไทยรถวิ่งชิดซ้าย รถเลนที่ใกล้เราที่สุดจึงมาจากทางขวา"
  - type: worked-example
    title: เดินจากบ้านไปโรงเรียน
    problem: "บ้านของต้นกล้าอยู่ในซอยที่ไม่มีทางเท้า ต้องเดินออกมาที่ถนนใหญ่แล้วข้ามถนนไปโรงเรียนซึ่งอยู่ฝั่งตรงข้าม มีสะพานลอยอยู่ห่างออกไป 50 เมตร ต้นกล้าควรเดินอย่างไร"
    steps:
      - text: "ในซอยที่ไม่มีทางเท้า เดินชิดขอบทางด้านขวา สวนทางกับรถ"
        why: "การเดินสวนทางกับรถทำให้เห็นรถที่วิ่งเข้ามาหาและหลบได้ทัน"
      - text: "ที่ถนนใหญ่ เดินบนทางเท้าไปที่สะพานลอย แม้จะไกลกว่าการข้ามตรงหน้าโรงเรียน"
        why: "ถนนใหญ่มีรถมากและเร็ว การข้ามนอกทางข้ามเสี่ยงถูกรถชน"
      - text: "ข้ามบนสะพานลอย เดิน ไม่วิ่งหรือผลักกันบนบันได"
      - text: "ถ้าไม่มีสะพานลอยหรือทางม้าลาย ให้ไปข้ามตรงที่มีครูหรือเจ้าหน้าที่จราจรช่วยโบกรถ และมองขวา ซ้าย ขวา ก่อนข้าม"
    answer: "เดินชิดขวาสวนทางรถในซอย เดินบนทางเท้า แล้วข้ามทางสะพานลอย"
  - { type: check, problem: health.safety.road-water.p004, prompt: "ลองตอบก่อนอ่านต่อ" }
  - type: figure
    title: ตะโกน โยน ยื่น
    src: shout-throw-reach.svg
    alt: "ภาพสามช่องแสดงการช่วยคนตกน้ำจากบนฝั่ง ช่อง 1 ตะโกน: คนบนฝั่งตะโกนช่วยด้วยและโทร 1669 ช่อง 2 โยน: คนบนฝั่งโยนแกลลอนเปล่าที่ลอยน้ำได้ให้คนตกน้ำเกาะ ช่อง 3 ยื่น: คนบนฝั่งยื่นไม้ยาวให้คนตกน้ำจับแล้วดึง ทุกช่องเขียนว่าอยู่บนฝั่ง ไม่กระโดดลงไป"
    caption: "หลักที่กรมควบคุมโรคแนะนำ ผู้ช่วยอยู่บนฝั่งเสมอ"
  - type: worked-example
    title: อ่านข้อมูลการจมน้ำ
    problem: "จากข้อมูลเฝ้าระวังของกรมควบคุมโรค เด็กอายุต่ำกว่า 15 ปีจมน้ำ 16 เหตุการณ์ เกิดในคลองและแม่น้ำร้อยละ 50 เหตุการณ์ในคลองและแม่น้ำมีกี่เหตุการณ์ และข้อมูลนี้บอกอะไรเรา"
    figure:
      src: drowning-places.svg
      alt: "แผนภูมิแท่ง แหล่งน้ำที่เกิดเหตุเด็กอายุต่ำกว่า 15 ปีจมน้ำ 16 เหตุการณ์ ช่วง 1 ม.ค.–6 มิ.ย. 2565 ข้อมูลกรมควบคุมโรค คลองและแม่น้ำร้อยละ 50 แหล่งน้ำเกษตรร้อยละ 31 ทะเลร้อยละ 13 สระว่ายน้ำร้อยละ 6"
    steps:
      - text: "ร้อยละ 50 ของ 16 คือ 50 ÷ 100 × 16 = 8 เหตุการณ์"
      - text: "แหล่งน้ำที่เกิดเหตุมากที่สุดคือคลองและแม่น้ำ รองลงมาคือแหล่งน้ำเกษตร เช่น บ่อ สระ ฝาย"
        why: "แหล่งน้ำเหล่านี้อยู่ใกล้บ้าน ไม่มีเจ้าหน้าที่ดูแล และไม่มีรั้วหรือป้ายเตือน"
      - text: "สระว่ายน้ำซึ่งมีคนดูแลเกิดเหตุน้อยที่สุด จึงควรเล่นน้ำในที่ที่จัดไว้และมีผู้ใหญ่ดูแล"
    answer: "8 เหตุการณ์ และแหล่งน้ำใกล้บ้านที่ไม่มีคนดูแลอันตรายที่สุด"
  - { type: check, problem: health.safety.road-water.p008 }
glossary:
  - { term: ทางม้าลาย, definition: "ทางข้ามถนนที่ทาสีขาวสลับเป็นแถบ รถต้องหยุดให้คนข้าม" }
  - { term: หมวกนิรภัย, definition: "หมวกกันกระแทกสำหรับคนขับและคนซ้อนรถจักรยานยนต์และคนขี่จักรยาน" }
  - { term: ที่นั่งนิรภัยสำหรับเด็ก, definition: "เบาะเสริมสำหรับเด็กในรถยนต์ (คาร์ซีต) กฎหมายไทยกำหนดให้เด็กอายุไม่เกิน 6 ปีใช้" }
  - { term: เสื้อชูชีพ, definition: "เสื้อที่ช่วยให้ลอยตัวในน้ำ ต้องสวมเมื่อนั่งเรือหรือทำกิจกรรมทางน้ำ" }
  - { term: ตะโกน โยน ยื่น, definition: "หลักช่วยคนตกน้ำจากบนฝั่งโดยไม่กระโดดลงไป" }
flashcards:
  - { front: "ก่อนข้ามถนนในไทยต้องมองอย่างไร", back: "มองขวา มองซ้าย แล้วมองขวาอีกครั้ง" }
  - { front: "ไม่มีทางเท้า ควรเดินฝั่งไหน", back: "ชิดขอบทางด้านขวา สวนทางกับรถ" }
  - { front: "ใครต้องคาดเข็มขัดนิรภัยในรถยนต์", back: "ทุกคนทุกที่นั่ง เด็กอายุไม่เกิน 6 ปีนั่งคาร์ซีต" }
  - { front: "เห็นคนตกน้ำทำอย่างไร", back: "ตะโกน โยน ยื่น ไม่กระโดดลงไปช่วย และโทร 1669" }
