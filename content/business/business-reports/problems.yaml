problems:
- id: business.communication.business-reports.p001
  topics:
  - business.communication.business-reports
  difficulty: 1
  type: mcq
  stem: ผู้บริหารที่อ่านรายงานส่วนใหญ่ต้องการอะไรเป็นอันดับแรก
  choices:
  - id: a
    text: ตารางข้อมูลดิบทั้งหมด
    feedback: ข้อมูลดิบควรอยู่ในภาคผนวก ไม่ใช่สิ่งแรกที่ผู้บริหารต้องอ่าน
  - id: b
    text: ข้อสรุปและการตัดสินใจที่ต้องการจากพวกเขา
    correct: true
  - id: c
    text: ประวัติการก่อตั้งบริษัท
    feedback: เป็นข้อมูลพื้นหลังที่ไม่ตอบคำถามที่ผู้บริหารต้องตัดสินใจ
  - id: d
    text: คำอธิบายขั้นตอนการเก็บข้อมูลทุกขั้น
    feedback: วิธีการสำคัญแต่ไม่ควรขึ้นต้นรายงาน
  hints:
  - คิดว่าผู้บริหารมีเวลาอ่านจำกัด จะอ่านอะไรก่อน
  - รายงานที่ดีบอกคำตอบก่อนแล้วจึงให้หลักฐาน
  solution: ผู้บริหารต้องการรู้ข้อสรุปและสิ่งที่ต้องตัดสินใจก่อน แล้วจึงดูเหตุผลและหลักฐานตามลำดับ รายงานจึงควรขึ้นต้นด้วยข้อสรุป
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.communication.business-reports.p002
  topics:
  - business.communication.business-reports
  difficulty: 1
  type: mcq
  stem: ต้องการแจ้งกำหนดการประชุมพรุ่งนี้เวลา 10.00 น. ให้ทีมงาน 5 คนทราบ ควรใช้ช่องทางใด
  choices:
  - id: a
    text: อีเมลสั้น ๆ ที่มีหัวข้อ วันเวลา และสถานที่
    correct: true
  - id: b
    text: รายงานวิเคราะห์ความยาว 50 หน้า
    feedback: เกินความจำเป็นของข้อความสั้น
  - id: c
    text: อินโฟกราฟิกเผยแพร่ต่อสาธารณะ
    feedback: ไม่ใช่ข้อมูลสาธารณะและไม่จำเป็นต้องมีภาพ
  - id: d
    text: ประชุมนาน 2 ชั่วโมงเพื่อแจ้งกำหนดการ
    feedback: การประชุมเกินความจำเป็นสำหรับข้อมูลสั้น ๆ
  hints:
  - ข้อความที่มีข้อมูลเดียวและไม่ต้องการการโต้ตอบเหมาะกับช่องทางแบบใด
  - เลือกช่องทางที่สั้นและส่งถึงทุกคนได้ทันที
  solution: ข้อความสั้นที่ต้องการแจ้งเพียงกำหนดการเหมาะกับอีเมลสั้น การเลือกช่องทางควรเทียบกับความยาวและจุดประสงค์ของข้อความ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.communication.business-reports.p003
  topics:
  - business.communication.business-reports
  difficulty: 2
  type: match
  stem: จับคู่ส่วนของรายงานธุรกิจกับเนื้อหาที่ควรอยู่ในส่วนนั้น
  pairs:
  - left: บทสรุปผู้บริหาร
    right: ข้อสรุปหลักและการตัดสินใจที่ต้องการในหน้าเดียว
  - left: ข้อค้นพบ
    right: ผลการวิเคราะห์พร้อมหลักฐานรองรับ
  - left: ข้อเสนอแนะ
    right: สิ่งที่ควรทำ ผู้รับผิดชอบ และกรอบเวลา
  - left: ภาคผนวก
    right: ตารางข้อมูลดิบและวิธีคำนวณ
  hints:
  - ส่วนใดอ่านได้โดยไม่ต้องดูรายละเอียด
  - ข้อมูลดิบและวิธีคำนวณเหมาะกับผู้ที่ต้องการตรวจสอบมากกว่าผู้อ่านทั่วไป
  solution: บทสรุปผู้บริหารให้ข้อสรุปในหน้าเดียว ข้อค้นพบมีหลักฐาน ข้อเสนอแนะบอกการกระทำ และภาคผนวกเก็บข้อมูลดิบไว้ตรวจสอบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.communication.business-reports.p004
  topics:
  - business.communication.business-reports
  difficulty: 2
  type: numeric
  stem: ร้านขนมในเชียงใหม่ (สมมติ) มีรายได้ 400,000 บาทในเดือนหนึ่ง ต้นทุนขาย 260,000 บาท กำไรขั้นต้นเป็นกี่เปอร์เซ็นต์ของรายได้ (ตอบเป็นเปอร์เซ็นต์)
  answer:
    value: 35.0
    tolerance: 0.1
    unit: '%'
  misconceptions:
  - match: 65.0
    feedback: นั่นคืออัตราต้นทุนขาย ไม่ใช่กำไรขั้นต้น ให้เอาต้นทุนขายออกจากรายได้ก่อน
  hints:
  - กำไรขั้นต้นคือรายได้ลบต้นทุนขาย
  - คำนวณ (400,000 − 260,000) ÷ 400,000 × 100
  solution: กำไรขั้นต้น = 400,000 − 260,000 = 140,000 บาท คิดเป็น 140,000 ÷ 400,000 × 100 = 35% ของรายได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.communication.business-reports.p005
  topics:
  - business.communication.business-reports
  difficulty: 2
  type: numeric
  stem: ร้านขนมแห่งหนึ่ง (สมมติ) มีรายได้ 400,000 บาท ต้นทุนขาย 260,000 บาท และค่าใช้จ่ายดำเนินงาน 112,000 บาท กำไรสุทธิเป็นกี่เปอร์เซ็นต์ของรายได้ (ตอบเป็นเปอร์เซ็นต์)
  answer:
    value: 7.0
    tolerance: 0.1
    unit: '%'
  misconceptions:
  - match: 35.0
    feedback: นั่นคืออัตรากำไรขั้นต้น ยังไม่ได้หักค่าใช้จ่ายดำเนินงาน
  hints:
  - หากำไรขั้นต้นก่อน แล้วหากำไรสุทธิ = กำไรขั้นต้น − ค่าใช้จ่ายดำเนินงาน
  - นำกำไรสุทธิไปหารรายได้แล้วคูณ 100
  solution: กำไรขั้นต้น = 400,000 − 260,000 = 140,000 บาท กำไรสุทธิ = 140,000 − 112,000 = 28,000 บาท คิดเป็น 28,000 ÷ 400,000 × 100 = 7% ของรายได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.communication.business-reports.p006
  topics:
  - business.communication.business-reports
  difficulty: 2
  type: mcq
  stem: ดูกราฟคู่ด้านบนที่แสดงยอดขายสมมติ 2567 และ 2568 ข้อใดอธิบายผลของการเลือกแกนตั้งได้ถูกต้อง
  figure:
    src: chart-axis.svg
    alt: กราฟแท่งสองกราฟแสดงยอดขายสองปี กราฟซ้ายแกนตั้งเริ่มที่ 90 แท่งของปี 2568 สูงกว่าปี 2567 มาก กราฟขวาแกนตั้งเริ่มที่ 0 แท่งสองแท่งเกือบเท่ากัน
    caption: ยอดขายสมมติ หน่วยล้านบาท
  choices:
  - id: a
    text: กราฟซ้ายซื่อตรงกว่าเพราะแท่งสูงชัดเจน
    feedback: แท่งที่สูงชัดไม่ได้แปลว่าซื่อตรง ต้องดูว่าแกนเริ่มที่ค่าใด
  - id: b
    text: กราฟซ้ายทำให้ความต่าง 4 ล้านบาทดูใหญ่เกินจริง เพราะแกนตั้งเริ่มที่ 90
    correct: true
  - id: c
    text: กราฟขวาผิดเพราะไม่มีเส้นแกนตั้ง
    feedback: กราฟขวาแสดงข้อมูลเดียวกันโดยแกนเริ่มที่ศูนย์
  - id: d
    text: สองกราฟให้ข้อมูลต่างกันเพราะแต่ละกราฟมีตัวเลขไม่เท่ากัน
    feedback: ข้อมูลในสองกราฟเหมือนกัน ต่างกันเพียงแกนตั้ง
  hints:
  - ดูค่าที่แกนตั้งเริ่มต้น แล้วเทียบกับความสูงของแท่ง
  - กราฟแท่งควรเริ่มที่ศูนย์เพื่อให้สัดส่วนของแท่งตรงกับค่า
  solution: แกนตั้งของกราฟซ้ายเริ่มที่ 90 ทำให้ความต่าง 4 ล้านบาทในสัดส่วนเล็กน้อยดูเหมือนแตกต่างมาก กราฟแท่งที่ควรซื่อตรงจึงควรเริ่มแกนที่ศูนย์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.communication.business-reports.p007
  topics:
  - business.communication.business-reports
  difficulty: 3
  type: numeric
  stem: ยอดขายของร้านหนึ่งเดือนก่อนเป็น 480,000 บาท และเดือนนี้เป็น 528,000 บาท ยอดขายเพิ่มขึ้นกี่เปอร์เซ็นต์ (ตอบเป็นเปอร์เซ็นต์)
  answer:
    value: 10.0
    tolerance: 0.05
    unit: '%'
  misconceptions:
  - match: 48000
    feedback: นั่นคือผลต่างเป็นบาท ไม่ใช่เปอร์เซ็นต์ ต้องหารด้วยยอดเดิม
  hints:
  - หาผลต่างของยอดขายก่อน
  - เทียบผลต่างกับยอดเดิม (480,000) แล้วคูณ 100
  solution: (528,000 − 480,000) ÷ 480,000 × 100 = 10% ยอดขายเพิ่มขึ้น 10%
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.communication.business-reports.p008
  topics:
  - business.communication.business-reports
  difficulty: 3
  type: numeric
  stem: อัตรากำไรสุทธิของบริษัทแห่งหนึ่งเพิ่มจาก 8% ในปีก่อนเป็น 10% ในปีนี้ อัตรากำไรเพิ่มขึ้นกี่จุดเปอร์เซ็นต์ (ตอบเป็นจุดเปอร์เซ็นต์)
  answer:
    value: 2
    tolerance: 0.05
    unit: จุดเปอร์เซ็นต์
  misconceptions:
  - match: 25.0
    feedback: นั่นคือการเปลี่ยนแปลงเป็นร้อยละของค่าเดิม แต่โจทย์ถามผลต่างของอัตราเป็นจุดเปอร์เซ็นต์
  hints:
  - ลบอัตราเดิมออกจากอัตราใหม่โดยตรง
  - จุดเปอร์เซ็นต์คือผลต่างของสองอัตราเปอร์เซ็นต์
  solution: 10% − 8% = 2 จุดเปอร์เซ็นต์ ไม่ใช่ 25% ซึ่งเป็นการเปลี่ยนแปลงเทียบกับค่าเดิม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.communication.business-reports.p009
  topics:
  - business.communication.business-reports
  difficulty: 3
  type: mcq
  stem: ต้องเปรียบเทียบยอดขายของสาขา 5 แห่งในเดือนนี้ให้เห็นค่าแต่ละสาขาชัดเจน ควรใช้แผนภูมิแบบใด
  choices:
  - id: a
    text: แผนภูมิแท่งเรียงตามขนาด
    correct: true
  - id: b
    text: แผนภูมิเส้นที่ลากเชื่อมสาขาที่ไม่เกี่ยวเนื่องกันตามเวลา
    feedback: เส้นเหมาะกับแนวโน้มตามเวลา ไม่เหมาะกับการเทียบสาขาที่ไม่มีลำดับเวลา
  - id: c
    text: แผนภูมิวงกลม 5 ส่วน
    feedback: โจทย์ต้องการเทียบค่าระหว่างสาขา ไม่ใช่แสดงสัดส่วนของทั้งหมด และวงกลม 5 ส่วนเทียบขนาดได้ยากเมื่อส่วนใกล้กัน
  - id: d
    text: แผนภูมิ 3 มิติเพื่อให้ดูสวย
    feedback: มิติที่สามบิดการรับรู้ค่าและไม่ช่วยให้เทียบได้ดีขึ้น
  hints:
  - ถามว่าต้องการเทียบค่าหรือดูแนวโน้มตามเวลา
  - แท่งเหมาะกับการเทียบค่าระหว่างหมวดหมู่
  solution: แผนภูมิแท่งทำให้เทียบค่าระหว่างหมวดหมู่ได้ชัดเจนและเรียงลำดับได้ง่าย ส่วนแผนภูมิ 3 มิติและวงกลมที่มีหลายส่วนทำให้อ่านค่าได้ยาก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.communication.business-reports.p010
  topics:
  - business.communication.business-reports
  difficulty: 3
  type: mcq
  multiple: true
  stem: ข้อใดทำให้กราฟแสดงผลเข้าใจผิดได้ (เลือกทุกข้อที่ถูก)
  choices:
  - id: a
    text: แกนตั้งของกราฟแท่งไม่เริ่มที่ศูนย์
    correct: true
  - id: b
    text: เลือกช่วงเวลาเริ่มต้นที่ทำให้แนวโน้มดูดีที่สุด (เลือกเฉพาะข้อมูลที่เอื้อ)
    correct: true
  - id: c
    text: ใช้ความกว้างของแท่งหรือเอฟเฟกต์ 3 มิติที่บิดขนาดที่เห็น
    correct: true
  - id: d
    text: ระบุแหล่งที่มาของข้อมูลและปีที่เก็บไว้ใต้กราฟ
    feedback: การระบุแหล่งที่มาช่วยให้ตรวจสอบได้ ไม่ใช่สาเหตุของการเข้าใจผิด
  hints:
  - คิดถึงสิ่งที่ทำให้ขนาดแท่งหรือเส้นดูต่างจากความจริง
  - ข้อที่ช่วยให้ตรวจสอบได้ไม่ทำให้เข้าใจผิด
  solution: แกนที่ไม่เริ่มที่ศูนย์ การเลือกช่วงเวลาให้เอื้อ และเอฟเฟกต์ 3 มิติทำให้ผู้อ่านเข้าใจผิดได้ ส่วนการระบุแหล่งที่มาเป็นการเพิ่มความโปร่งใส
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.communication.business-reports.p011
  topics:
  - business.communication.business-reports
  difficulty: 1
  type: numeric
  stem: ตารางงบประมาณมี 4 รายการ ได้แก่ 12,000 บาท 8,500 บาท 3,200 บาท และ 1,300 บาท รวมทั้งหมดเป็นกี่บาท (ตอบเป็นบาท)
  answer:
    value: 25000
    tolerance: 0.5
    unit: บาท
  misconceptions:
  - match: 23700
    feedback: ลืมรวมรายการสุดท้ายที่ 1,300 บาท
  hints:
  - รวมทีละรายการอย่างเป็นระบบ
  - คำนวณ 12,000 + 8,500 + 3,200 + 1,300
  solution: 12,000 + 8,500 + 3,200 + 1,300 = 25,000 บาท ก่อนนำเสนอควรตรวจยอดรวมทุกครั้ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.communication.business-reports.p012
  topics:
  - business.communication.business-reports
  difficulty: 4
  type: order
  stem: เรียงลำดับการเขียนบทสรุปผู้บริหารตามหลักการขึ้นต้นด้วยข้อสรุป
  items:
  - ข้อสรุปและคำแนะนำที่ผู้บริหารต้องตัดสินใจ
  - เหตุผลหลักสามข้อพร้อมตัวเลขสนับสนุน
  - ข้อจำกัดของข้อมูลและสมมติฐานที่ใช้
  - ชี้ไปยังแหล่งข้อมูลและตารางในภาคผนวก
  hints:
  - ขึ้นต้นด้วยสิ่งที่ผู้อ่านต้องรู้และตัดสินใจก่อน
  - ข้อจำกัดมักตามหลังเหตุผล และรายละเอียดอยู่ท้ายสุด
  solution: เริ่มด้วยข้อสรุปและคำแนะนำ ตามด้วยเหตุผลพร้อมตัวเลข แล้วบอกข้อจำกัด และชี้ไปยังภาคผนวกสำหรับผู้ที่ต้องการตรวจสอบ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.communication.business-reports.p013
  topics:
  - business.communication.business-reports
  difficulty: 4
  type: mcq
  stem: ควรตั้งชื่อหัวข้อสไลด์ (headline) ของยอดขายสาขาทางเหนือในไตรมาสนี้ข้อใดดีที่สุด
  choices:
  - id: a
    text: ยอดขายไตรมาสนี้
    feedback: เป็นหัวข้อหมวดที่ไม่บอกผู้ฟังว่าสิ่งที่ค้นพบคืออะไร
  - id: b
    text: สาขาทางเหนือยอดขายเพิ่ม 10% หลังเปิดโปรแกรมสมาชิกในไตรมาสนี้
    correct: true
  - id: c
    text: ข้อมูลยอดขายเดือนมีนาคม
    feedback: บอกเดือนแต่ไม่บอกข้อสรุป
  - id: d
    text: ภาพรวมผลการดำเนินงานของบริษัท
    feedback: เป็นคำกว้างที่ไม่บอกสิ่งที่ต้องการให้ผู้ฟังจำ
  hints:
  - ชื่อหัวข้อที่ดีบอกข้อความที่ต้องการให้ผู้ฟังจำ
  - ลองอ่านชื่อสไลด์เป็นประโยคที่มีกริยาและตัวเลข
  solution: หัวข้อสไลด์ที่ดีเป็นประโยคข้อสรุปที่มีตัวเลขหรือการกระทำชัดเจน ให้ผู้ฟังรู้ทันทีว่าประเด็นคืออะไร หนึ่งสไลด์ควรมีหนึ่งประเด็น
