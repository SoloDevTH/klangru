<line x1="330.0" y1="240.0" x2="360.0" y2="240.0" stroke="#15211e" stroke-width="3.5"/>
<line x1="185.0" y1="240.0" x2="185.0" y2="249.2" stroke="#15211e" stroke-width="2"/>
<polygon points="185.0,256.0 188.6,248.0 181.4,248.0" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<line x1="355.0" y1="240.0" x2="355.0" y2="249.2" stroke="#15211e" stroke-width="2"/>
<polygon points="355.0,256.0 358.6,248.0 351.4,248.0" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="180.0" y="234.0" text-anchor="middle" fill="#15211e" font-size="13">A</text>
<text x="360.0" y="234.0" text-anchor="middle" fill="#15211e" font-size="13">A</text>
<text x="380.0" y="245.0" text-anchor="start" fill="#15211e" font-size="13">แนวระนาบตัดของภาพตัด</text>
<text x="20.0" y="295.0" text-anchor="start" fill="#15211e" font-size="14" font-weight="bold">เส้นบอกขนาด</text>
<line x1="180.0" y1="276.0" x2="180.0" y2="298.0" stroke="#15211e" stroke-width="1"/>
<line x1="360.0" y1="276.0" x2="360.0" y2="298.0" stroke="#15211e" stroke-width="1"/>
<line x1="270.0" y1="290.0" x2="189.7" y2="290.0" stroke="#15211e" stroke-width="1.2"/>
<polygon points="182.0,290.0 191.0,294.1 191.0,285.9" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<line x1="270.0" y1="290.0" x2="350.4" y2="290.0" stroke="#15211e" stroke-width="1.2"/>
