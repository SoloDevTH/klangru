    type: mcq
    stem: "หลังสะสางเอกสารแล้ว ฝ่ายการเงินของเทศบาลติดป้ายสีบนแฟ้มตามปีงบประมาณ และกำหนดชั้นวางของแต่ละปี ใครต้องการแฟ้มใดหยิบได้ภายใน 30 วินาที นี่คือ ส ใด"
    choices:
      - { id: a, text: "สะดวก", correct: true }
      - { id: b, text: "สะสาง", feedback: "สะสางทำไปแล้ว (แยกของไม่จำเป็นออก) ขั้นนี้คือการจัดวางของที่เหลือให้หยิบง่าย" }
      - { id: c, text: "สุขลักษณะ", feedback: "สุขลักษณะคือการรักษามาตรฐานของสามขั้นแรกให้คงอยู่ ส่วนการกำหนดที่วางและติดป้ายคือสะดวก" }
      - { id: d, text: "สะอาด", feedback: "สะอาดคือการทำความสะอาดและตรวจสิ่งผิดปกติ ไม่ใช่การติดป้ายและจัดที่วาง" }
    hints:
      - "การติดป้ายและกำหนดที่วางทำให้อะไรง่ายขึ้น"
      - "เป็น ส ที่อยู่ถัดจากสะสาง"
    solution: "การกำหนดที่วาง ติดป้าย และทำให้หยิบใช้ได้เร็วคือ **สะดวก** ซึ่งเป็น ส ที่สองต่อจากสะสาง"
