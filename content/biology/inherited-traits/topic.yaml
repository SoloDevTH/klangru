id: biology.genetics.inherited-traits
subject: biology
title: { th: ลักษณะทางพันธุกรรม, en: "Inherited traits" }
summary: ลักษณะที่ถ่ายทอดจากพ่อแม่สู่ลูกในพืช สัตว์ และคน ลูกคล้ายแต่ไม่เหมือนพ่อแม่ ผลของสิ่งแวดล้อม ความแปรผันแบบต่อเนื่องและไม่ต่อเนื่อง และการตั้งคำถามจากลักษณะของตนเอง
difficulty: 2
minutes: 30
prerequisites: [biology.diversity.classifying-organisms]
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ตัวอย่างลักษณะทางพันธุกรรมของคน
    src: trait-pairs.svg
    alt: "ภาพ 4 ช่อง ช่องที่ 1 ติ่งหูห้อย ใบหูด้านข้าง ส่วนล่างสุดของใบหูห้อยลงมาเป็นติ่ง แยกจากแนวแก้มที่เป็นเส้นประ ช่องที่ 2 ติ่งหูติด ส่วนล่างของใบหูต่อเข้ากับแนวแก้มโดยตรง ไม่มีติ่งห้อย ช่องที่ 3 มีลักยิ้ม หน้ายิ้มที่มีรอยบุ๋มเล็ก ๆ ที่แก้มสองข้าง ช่องที่ 4 ไม่มีลักยิ้ม หน้ายิ้มที่แก้มเรียบ"
    caption: "ลักษณะเหล่านี้แบ่งเป็นสองแบบชัดเจน เป็นความแปรผันแบบไม่ต่อเนื่อง (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: แยกลักษณะทางพันธุกรรมกับลักษณะจากสิ่งแวดล้อม
    problem: "น้องมิ้นมีผมหยิกเหมือนพ่อ มีแผลเป็นที่ศอก ว่ายน้ำเก่ง และมีลักยิ้มเหมือนแม่ ลักษณะใดถ่ายทอดไปถึงลูกของน้องมิ้นได้"
    steps:
      - text: "ถามทีละลักษณะว่าได้มาจากพ่อแม่ หรือเกิดขึ้นภายหลัง"
      - text: "ผมหยิกเหมือนพ่อ และลักยิ้มเหมือนแม่ ได้มาจากพ่อแม่ จึงเป็นลักษณะทางพันธุกรรม"
        why: "ลักษณะที่ได้จากพ่อแม่ส่งต่อไปรุ่นถัดไปได้"
      - text: "แผลเป็นเกิดจากอุบัติเหตุ และการว่ายน้ำเก่งเกิดจากการฝึก จึงไม่ถ่ายทอด"
    answer: "ผมหยิกและลักยิ้มถ่ายทอดไปถึงลูกได้ ส่วนแผลเป็นและการว่ายน้ำเก่งไม่ถ่ายทอด"
  - { type: check, problem: biology.genetics.inherited-traits.p001, prompt: "ถามแบบเดียวกันว่าลักษณะนี้ได้จากพ่อแม่หรือเกิดภายหลัง" }
  - type: worked-example
    title: อ่านฮิสโทแกรมความสูง
    problem: "ฮิสโทแกรมความสูงของนักเรียน 25 คน ช่วง 130–135 cm มี 2 คน 135–140 cm มี 6 คน 140–145 cm มี 9 คน 145–150 cm มี 5 คน และ 150–155 cm มี 3 คน นักเรียนที่สูงตั้งแต่ 145 cm ขึ้นไปมีกี่คน และช่วงใดมีนักเรียนมากที่สุด"
    steps:
      - text: "ช่วงที่สูงตั้งแต่ 145 cm ขึ้นไป คือ 145–150 และ 150–155"
      - text: "รวม $5 + 3 = 8$ คน"
        why: "แต่ละแท่งของฮิสโทแกรมบอกจำนวนคนในช่วงนั้น"
      - text: "แท่งที่สูงที่สุดคือ 140–145 cm มี 9 คน"
    answer: "สูงตั้งแต่ 145 cm ขึ้นไป 8 คน และช่วง 140–145 cm มีนักเรียนมากที่สุด"
  - { type: check, problem: biology.genetics.inherited-traits.p009, prompt: "ทำไมความสูงจึงต้องเขียนเป็นฮิสโทแกรม" }
glossary:
  - { term: ลักษณะทางพันธุกรรม, definition: "ลักษณะที่ถ่ายทอดจากพ่อแม่ไปสู่ลูก เช่น ติ่งหู ลักยิ้ม สีดอก สีขน" }
  - { term: ยีน, definition: "สิ่งที่อยู่ในเซลล์และควบคุมลักษณะทางพันธุกรรม ลูกได้รับจากทั้งพ่อและแม่" }
  - { term: ความแปรผัน, definition: "ความแตกต่างของลักษณะระหว่างสิ่งมีชีวิตชนิดเดียวกัน" }
  - { term: ความแปรผันแบบต่อเนื่อง, definition: "ความแปรผันที่มีค่าได้ทุกค่าในช่วงหนึ่ง เช่น ความสูง น้ำหนัก แสดงด้วยฮิสโทแกรม" }
  - { term: ความแปรผันแบบไม่ต่อเนื่อง, definition: "ความแปรผันที่แบ่งเป็นกลุ่มชัดเจน เช่น ติ่งหู หมู่เลือด แสดงด้วยแผนภูมิแท่งแยกกัน" }
flashcards:
  - { front: "ลูกได้ลักษณะทางพันธุกรรมจากใคร", back: "จากทั้งพ่อและแม่" }
  - { front: "ตัวอย่างลักษณะที่ไม่ถ่ายทอดทางพันธุกรรม", back: "แผลเป็น ผมย้อม ภาษาที่พูด กล้ามจากการออกกำลังกาย" }
  - { front: "ความสูงเป็นความแปรผันแบบใด", back: "แบบต่อเนื่อง เขียนเป็นฮิสโทแกรม" }
  - { front: "ทำไมพ่อแม่ติ่งหูห้อยมีลูกติ่งหูติดได้", back: "ลักษณะบางอย่างซ่อนอยู่ในพ่อแม่ แล้วปรากฏในรุ่นลูกหรือรุ่นหลาน" }
