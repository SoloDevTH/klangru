<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="sans-serif">
<title>จากประโยคบอกเล่าเป็นคำถาม Yes/No และคำถาม Wh-</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7b3c"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#fff"/>
<text x="125.0" y="30.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">ประโยคบอกเล่า</text>
<text x="380.0" y="30.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">คำถาม Yes/No</text>
<text x="635.0" y="30.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">คำถาม Wh-</text>
<text x="20.0" y="64.0" font-size="14" text-anchor="start" fill="#b35900" font-weight="bold">verb to be</text>
<rect x="17.5" y="74.0" width="215.0" height="50.0" rx="10" fill="#eef3fa" stroke="#1f4e9c" stroke-width="2"/>
<text x="125.0" y="105.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">She is at school.</text>
<rect x="272.5" y="74.0" width="215.0" height="50.0" rx="10" fill="#e9f5ec" stroke="#1e7b3c" stroke-width="2"/>
<text x="380.0" y="105.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Is she at school?</text>
<rect x="527.5" y="74.0" width="215.0" height="50.0" rx="10" fill="#e9f5ec" stroke="#1e7b3c" stroke-width="2"/>
<text x="635.0" y="105.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Where is she?</text>
<line x1="236.5" y1="99.0" x2="268.5" y2="99.0" stroke="#1e7b3c" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="252.5" y="152.0" font-size="13" text-anchor="middle" fill="#1e7b3c">ย้าย is ขึ้นหน้าประธาน</text>
<line x1="491.5" y1="99.0" x2="523.5" y2="99.0" stroke="#1e7b3c" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="507.5" y="152.0" font-size="13" text-anchor="middle" fill="#1e7b3c">ใส่ Where หน้าสุด</text>
<text x="20.0" y="194.0" font-size="14" text-anchor="start" fill="#b35900" font-weight="bold">กริยาทั่วไป</text>
<rect x="17.5" y="204.0" width="215.0" height="50.0" rx="10" fill="#eef3fa" stroke="#1f4e9c" stroke-width="2"/>
<text x="125.0" y="235.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">She works at a bank.</text>
<rect x="272.5" y="204.0" width="215.0" height="50.0" rx="10" fill="#e9f5ec" stroke="#1e7b3c" stroke-width="2"/>
<text x="380.0" y="235.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Does she work at a bank?</text>
<rect x="527.5" y="204.0" width="215.0" height="50.0" rx="10" fill="#e9f5ec" stroke="#1e7b3c" stroke-width="2"/>
<text x="635.0" y="235.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Where does she work?</text>
<line x1="236.5" y1="229.0" x2="268.5" y2="229.0" stroke="#1e7b3c" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="252.5" y="282.0" font-size="13" text-anchor="middle" fill="#1e7b3c">ใส่ Does + กริยารูปเดิม</text>
<line x1="491.5" y1="229.0" x2="523.5" y2="229.0" stroke="#1e7b3c" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="507.5" y="282.0" font-size="13" text-anchor="middle" fill="#1e7b3c">ใส่ Where หน้าสุด</text>
<text x="380.0" y="338.0" font-size="15" text-anchor="middle" fill="#555">คำตอบ: Yes, she is. / No, she isn't.  ·  Yes, she does. / No, she doesn't.</text>
</svg>
