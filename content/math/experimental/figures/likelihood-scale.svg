<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 195" width="700" height="195" font-family="sans-serif" font-size="16">
  <title>มาตราส่วนความน่าจะเป็นจาก 0 ถึง 1</title>
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#f3c9a8"/><stop offset="1" stop-color="#9fd3c7"/></linearGradient></defs>
  <rect x="50" y="58" width="600" height="24" rx="12" fill="url(#g)" stroke="#15211e" stroke-width="1.5"/>
  <line x1="50" y1="50" x2="50" y2="90" stroke="#15211e" stroke-width="2"/>
  <text x="50.0" y="36.0" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#15211e" font-weight="bold">0</text>
  <text x="50.0" y="110.0" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#0a6b60" font-weight="bold">เป็นไปไม่ได้</text>
  <line x1="200.0" y1="50" x2="200.0" y2="90" stroke="#15211e" stroke-width="2"/>
  <line x1="350.0" y1="50" x2="350.0" y2="90" stroke="#15211e" stroke-width="2"/>
  <text x="350.0" y="36.0" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#15211e" font-weight="bold">1/2</text>
  <text x="350.0" y="110.0" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#0a6b60" font-weight="bold">เท่า ๆ กัน</text>
  <line x1="500.0" y1="50" x2="500.0" y2="90" stroke="#15211e" stroke-width="2"/>
  <line x1="650" y1="50" x2="650" y2="90" stroke="#15211e" stroke-width="2"/>
  <text x="650.0" y="36.0" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#15211e" font-weight="bold">1</text>
  <text x="650.0" y="110.0" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#0a6b60" font-weight="bold">แน่นอน</text>
  <text x="200.0" y="110.0" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#b4521f" font-weight="bold">ไม่น่าจะเกิด</text>
  <text x="500.0" y="110.0" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#0a6b60" font-weight="bold">น่าจะเกิด</text>
  <circle cx="50.0" cy="70" r="11" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
  <text x="50.0" y="71.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#15211e" font-weight="bold">A</text>
  <text x="50.0" y="152.0" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#15211e">A  ทอยเต๋าได้ 7</text>
  <circle cx="150.0" cy="70" r="11" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
  <text x="150.0" y="71.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#15211e" font-weight="bold">B</text>
  <text x="270.0" y="152.0" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#15211e">B  ทอยเต๋าได้ 6</text>
  <circle cx="350.0" cy="70" r="11" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
  <text x="350.0" y="71.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#15211e" font-weight="bold">C</text>
  <text x="490.0" y="152.0" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#15211e">C  โยนเหรียญได้หัว</text>
  <circle cx="550.0" cy="70" r="11" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
  <text x="550.0" y="71.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#15211e" font-weight="bold">D</text>
  <text x="50.0" y="178.0" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#15211e">D  ทอยเต๋าได้มากกว่า 1</text>
  <circle cx="650.0" cy="70" r="11" fill="#ffffff" stroke="#15211e" stroke-width="1.5"/>
  <text x="650.0" y="71.0" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#15211e" font-weight="bold">E</text>
  <text x="270.0" y="178.0" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#15211e">E  ทอยเต๋าได้น้อยกว่า 7</text>
</svg>
