<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440" font-family="sans-serif" font-size="14">
  <title>แผนที่ตำแหน่งร้านกาแฟสี่ร้านตามราคาและคุณภาพที่ลูกค้ารับรู้ (สมมติ)</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="520" height="440" fill="#ffffff"/>
  <line x1="80.0" y1="220.0" x2="440.0" y2="220.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="260.0" y1="400.0" x2="260.0" y2="40.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="436.0" y="210.0" text-anchor="end" fill="#1f2937" font-size="13">ราคาสูง</text>
  <text x="84.0" y="210.0" text-anchor="start" fill="#1f2937" font-size="13">ราคาต่ำ</text>
