  - คำนี้บอกว่า ‘ต่อมา’
  - ขึ้นต้นด้วย 后
  solution: '**后来 (hòulái)** (ตอบ 然后 (ránhòu) ก็ได้ แต่ 后来 เหมาะกว่าเมื่อเล่าเหตุการณ์ในอดีตที่เปลี่ยนไป) เขียนว่า 后来 (hòulái)，天开始下雨 (tiān kāishǐ xiàyǔ) (ต่อมา ฝนเริ่มตก)'
  id: chinese.writing.narrative-compositions.p011
