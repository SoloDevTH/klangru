id: business.entrepreneurship.careers
subject: business
title: { th: อาชีพ การเลือกอาชีพ และการเตรียมตัวทำงาน, en: "Careers, career choice and preparing for work" }
summary: ความหมายและความสำคัญของอาชีพ อาชีพในชุมชน การสำรวจตนเองและเลือกอาชีพ การเตรียมตัวและหาประสบการณ์ การหางาน เทคโนโลยีในอาชีพ และคุณลักษณะที่ดีต่ออาชีพ
difficulty: 2
minutes: 30
prerequisites: [business.econ.scarcity-choice]
encompasses: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: career-venn.svg
    alt: "แผนภาพเวนน์สามวง วงซ้ายบนคือความสนใจ สิ่งที่ชอบทำ วงขวาบนคือความถนัดและความรู้ วงล่างคือความต้องการของตลาด งานที่มีคนจ้างหรือมีคนซื้อ ตรงกลางที่สามวงซ้อนกันเขียนว่าอาชีพที่เหมาะกับเรา"
    caption: "อาชีพที่เหมาะอยู่ตรงที่ความสนใจ ความถนัด และความต้องการของตลาดซ้อนกัน"
  - { type: check, problem: business.entrepreneurship.careers.p004, prompt: "อาชีพอิสระกับอาชีพรับจ้างต่างกันอย่างไร" }
  - type: worked-example
    title: ใช้ตารางให้คะแนนเลือกระหว่างสองอาชีพ
    problem: "ข้าวเรียน ม.3 สนใจสองอาชีพ คือ ครูอนุบาล กับ เชฟ เธอให้น้ำหนักเกณฑ์ ความสนใจ $\\times 3$ ความถนัด $\\times 2$ โอกาสมีงานทำ $\\times 1$ และให้คะแนนครูอนุบาล $4, 3, 3$ เชฟ $5, 2, 4$ (เต็ม 5) อาชีพใดเหมาะกับข้าวกว่าตามตารางนี้"
    steps:
      - text: "คูณคะแนนแต่ละเกณฑ์ด้วยน้ำหนัก ครูอนุบาล: $3 \\times 4 + 2 \\times 3 + 1 \\times 3 = 12 + 6 + 3 = 21$"
        why: "ข้าวให้ความสนใจสำคัญที่สุด จึงคูณ 3"
      - text: "เชฟ: $3 \\times 5 + 2 \\times 2 + 1 \\times 4 = 15 + 4 + 4 = 23$"
      - text: "เชฟได้คะแนนมากกว่า $23 > 21$ แต่ห่างกันไม่มาก"
      - text: "ข้อสังเกต: ความถนัดด้านอาหารของข้าวได้แค่ 2 เธอควรหาประสบการณ์ เช่น ช่วยงานครัวที่ร้านของญาติ หรือเรียนทำอาหารระยะสั้น แล้วให้คะแนนใหม่"
        why: "ตารางเป็นเครื่องมือช่วยคิด ไม่ใช่คำตอบสุดท้าย ประสบการณ์จริงช่วยให้คะแนนแม่นขึ้น"
    answer: "เชฟได้ $23$ คะแนน ครูอนุบาลได้ $21$ คะแนน เชฟเหมาะกว่าเล็กน้อย แต่ควรหาประสบการณ์ด้านอาหารเพิ่มก่อนตัดสินใจ"
  - type: figure
    src: career-path.svg
    alt: "ผังห้าขั้นเรียงจากซ้ายไปขวา สำรวจตนเอง (สนใจ ถนัด รู้อะไร) หาข้อมูลอาชีพ (ถาม สังเกต อ่าน) เลือกอาชีพ (ประเมินทางเลือก) เตรียมตัว (เรียน ฝึก หาประสบการณ์) เข้าสู่อาชีพ (หางาน หรือสร้างอาชีพเอง) ด้านล่างเขียนว่าระหว่างทางสร้างคุณลักษณะที่ดี ขยัน ซื่อสัตย์ รับผิดชอบ ตรงต่อเวลา ใฝ่เรียนรู้"
    caption: "เส้นทางสู่อาชีพ"
  - { type: check, problem: business.entrepreneurship.careers.p010, prompt: "ประกาศงานนี้น่าสงสัยตรงไหน" }
glossary:
  - { term: อาชีพ, definition: "งานที่ทำอย่างสุจริตเป็นประจำเพื่อให้ได้รายได้มาเลี้ยงชีพ" }
  - { term: อาชีพอิสระ, definition: "อาชีพที่ทำเองเป็นเจ้าของ รายได้ขึ้นกับผลงานหรือยอดขาย เช่น ค้าขาย เกษตรกรรม" }
  - { term: อาชีพรับจ้าง, definition: "อาชีพที่ทำงานให้นายจ้างหรือหน่วยงานรัฐ ได้ค่าจ้างหรือเงินเดือนตามข้อตกลง" }
  - { term: ความถนัด, definition: "ความสามารถที่ทำได้ดีหรือเรียนรู้ได้เร็วกว่าเรื่องอื่น" }
  - { term: ประวัติย่อ, definition: "เอกสารสั้น ๆ สรุปข้อมูลติดต่อ การศึกษา ทักษะ และประสบการณ์ ใช้สมัครงาน" }
  - { term: ใบอนุญาตประกอบวิชาชีพ, definition: "เอกสารจากองค์กรวิชาชีพที่อนุญาตให้ทำงานบางอาชีพ เช่น แพทย์ พยาบาล ครู ผู้สอบบัญชีรับอนุญาต" }
flashcards:
  - { front: "อาชีพที่เหมาะกับเรา", back: "จุดที่ความสนใจ ความถนัดและความรู้ และความต้องการของตลาดซ้อนกัน" }
  - { front: "อาชีพอิสระกับอาชีพรับจ้าง", back: "อิสระ: เป็นเจ้าของ รายได้ไม่แน่นอน เลือกเวลาเอง · รับจ้าง: มีนายจ้าง รายได้ค่อนข้างแน่นอน ทำตามกฎขององค์กร" }
  - { front: "วิธีหาประสบการณ์อาชีพ", back: "ช่วยงานครอบครัว จิตอาสา โครงงาน เยี่ยมชมสถานประกอบการ ฝึกงาน ทำงานพิเศษเมื่ออายุถึง" }
  - { front: "สัญญาณงานหลอกลวง", back: "ให้จ่ายเงินก่อน ค่าตอบแทนสูงผิดปกติ ขอรหัสผ่านหรือบัญชี ไปต่างประเทศโดยไม่มีเอกสารชัดเจน" }
  - { front: "คุณลักษณะที่ดีต่ออาชีพ", back: "ขยัน ซื่อสัตย์ รับผิดชอบ ตรงต่อเวลา อดทน ใฝ่เรียนรู้ ทำงานเป็นทีม" }
