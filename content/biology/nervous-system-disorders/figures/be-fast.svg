<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="sans-serif" font-size="14">
<title>หลักจำ BE FAST สำหรับสังเกตอาการเตือนของโรคหลอดเลือดสมอง ได้แก่ การทรงตัว ตา ใบหน้า แขน การพูด และเวลา</title>
<rect x="0" y="0" width="860" height="470" fill="#ffffff"/>
<rect x="20" y="30" width="260" height="170" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
<circle cx="70" cy="85" r="32" fill="#1565c0"/>
<text x="70" y="96" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="bold">B</text>
<text x="115" y="80" fill="#263238" font-size="18" font-weight="bold">Balance</text>
<text x="40" y="140" fill="#37474f" font-size="14">การทรงตัวเสียทันที เดินหรือยืนไม่มั่น</text>
<rect x="300" y="30" width="260" height="170" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
<circle cx="350" cy="85" r="32" fill="#1565c0"/>
<text x="350" y="96" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="bold">E</text>
<text x="395" y="80" fill="#263238" font-size="18" font-weight="bold">Eyes</text>
<text x="320" y="140" fill="#37474f" font-size="14">ตามัวหรือเห็นภาพซ้อนข้างเดียวทันที</text>
<rect x="580" y="30" width="260" height="170" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
<circle cx="630" cy="85" r="32" fill="#1565c0"/>
<text x="630" y="96" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="bold">F</text>
<text x="675" y="80" fill="#263238" font-size="18" font-weight="bold">Face</text>
<text x="600" y="140" fill="#37474f" font-size="14">มุมปากตกหรือใบหน้าเบี้ยวข้างเดียว</text>
<rect x="20" y="230" width="260" height="170" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
<circle cx="70" cy="285" r="32" fill="#1565c0"/>
<text x="70" y="296" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="bold">A</text>
<text x="115" y="280" fill="#263238" font-size="18" font-weight="bold">Arm</text>
<text x="40" y="340" fill="#37474f" font-size="14">แขนหรือขาอ่อนแรงข้างเดียว</text>
<rect x="300" y="230" width="260" height="170" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
<circle cx="350" cy="285" r="32" fill="#1565c0"/>
<text x="350" y="296" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="bold">S</text>
<text x="395" y="280" fill="#263238" font-size="18" font-weight="bold">Speech</text>
<text x="320" y="340" fill="#37474f" font-size="14">พูดไม่ชัด พูดลำบาก หรือพูดไม่ออก</text>
<rect x="580" y="230" width="260" height="170" rx="16" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
<circle cx="630" cy="285" r="32" fill="#c62828"/>
<text x="630" y="296" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="bold">T</text>
<text x="675" y="280" fill="#263238" font-size="18" font-weight="bold">Time</text>
<text x="600" y="340" fill="#37474f" font-size="14">เวลาสำคัญ โทร 1669 ทันที</text>
<text x="430" y="458" text-anchor="middle" fill="#555" font-size="12">ภาพเป็นสื่อการเรียนรู้เท่านั้น ถ้าสงสัยว่ามีอาการเตือน ให้รีบโทร 1669</text>
</svg>