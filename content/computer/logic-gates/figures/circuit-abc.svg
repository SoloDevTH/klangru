  <rect x="0" y="0" width="520" height="260" fill="#ffffff"/>
  <path d="M150,30 H195.0 A25.0,25.0 0 0 1 195.0,80 H150 Z" fill="#fff" stroke="#15211e" stroke-width="2" />
