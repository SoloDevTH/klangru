    ai_assisted: true

  - id: phy.work.p015
    topics: [physics.energy.work]
    difficulty: 3
    type: numeric
    stem: "ร้านแก๊สใช้ไม้กระดานยาว $4\\ \\mathrm{m}$ พาดท้ายรถกระบะซึ่งสูง $1\\ \\mathrm{m}$ เพื่อเข็นถังแก๊สมวล $30\\ \\mathrm{kg}$ ขึ้นรถ ถ้าไม่มีแรงเสียดทาน ต้องออกแรงขนานกับไม้กระดานอย่างน้อยเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย N)"
    answer: { value: 73.5, tolerance: 0.5, unit: N }
    hints:
      - "งานที่ใช้เข็นขึ้นทางลาดเท่ากับงานที่ใช้ยกขึ้นตรง ๆ เมื่อไม่มีแรงเสียดทาน"
      - "$F \\times L = mgh$"
    misconceptions:
      - { match: 294, feedback: "นี่คือแรงที่ต้องใช้ยกถังขึ้นตรง ๆ (น้ำหนักถัง) ทางลาดช่วยลดแรง เพราะเข็นเป็นระยะยาวกว่า" }
      - { match: 1176, feedback: "ดูเหมือนคูณน้ำหนักด้วยความยาวไม้กระดาน ซึ่งได้งานที่ผิด ต้องหารงานที่ได้ $mgh$ ด้วยความยาวไม้กระดาน" }
    solution: "งานที่ได้ $mgh = 30 \\times 9.8 \\times 1 = 294\\ \\mathrm{J}$ ไม่มีแรงเสียดทาน $F \\times 4 = 294$ จึงได้ $F = 73.5\\ \\mathrm{N}$ น้อยกว่าน้ำหนักถังสี่เท่า แต่ต้องเข็นไกลกว่าความสูงสี่เท่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.work.p016
    topics: [physics.energy.work]
    difficulty: 2
    type: numeric
    stem: "ลูกมะพร้าวมวล $1.5\\ \\mathrm{kg}$ หล่นจากยอดต้นสูง $8\\ \\mathrm{m}$ ลงถึงพื้น แรงโน้มถ่วงทำงานต่อลูกมะพร้าวเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย J)"
    answer: { value: 117.6, tolerance: 0.5, unit: J }
    hints:
      - "แรงโน้มถ่วง (น้ำหนัก) ชี้ลง และลูกมะพร้าวเคลื่อนที่ลง"
      - "$W = Fs = mg \\times h$"
    misconceptions:
      - { match: 12, feedback: "ดูเหมือนใช้มวลแทนแรง แรงโน้มถ่วงคือน้ำหนัก $mg$ ในหน่วยนิวตัน" }
      - { match: -117.6, feedback: "แรงโน้มถ่วงกับการเคลื่อนที่มีทิศเดียวกัน (ลง) งานจึงเป็นบวก" }
    solution: "$W = mgh = 1.5 \\times 9.8 \\times 8 = 117.6\\ \\mathrm{J}$ เป็นบวก เพราะแรงกับการกระจัดชี้ลงเหมือนกัน ลูกมะพร้าวจึงเร็วขึ้นขณะตก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: phy.work.p017
    topics: [physics.energy.work]
    difficulty: 3
    type: numeric
    stem: "โยนลูกบอลมวล $0.5\\ \\mathrm{kg}$ ขึ้นไปตรง ๆ ลูกบอลขึ้นไปได้สูง $3\\ \\mathrm{m}$ จากจุดที่ออกจากมือ ระหว่างขาขึ้น แรงโน้มถ่วงทำงานต่อลูกบอลเท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$ (ตอบเป็นตัวเลขในหน่วย J พร้อมเครื่องหมาย)"
    answer: { value: -14.7, tolerance: 0.1, unit: J }
    hints:
      - "ขาขึ้น ลูกบอลเคลื่อนที่ขึ้น แต่แรงโน้มถ่วงชี้ลง มุมระหว่างแรงกับการกระจัดเป็นเท่าใด"
      - "$W = mgh\\cos 180^\\circ$"
    misconceptions:
      - { match: 14.7, feedback: "แรงโน้มถ่วงสวนทางกับการเคลื่อนที่ขาขึ้น งานจึงเป็นลบ ลูกบอลจึงช้าลง" }
      - { match: -1.5, feedback: "ดูเหมือนใช้มวลแทนน้ำหนัก ต้องคูณ $g$ ด้วย" }
    solution: "$W = mgh\\cos 180^\\circ = (0.5)(9.8)(3)(-1) = -14.7\\ \\mathrm{J}$ แรงโน้มถ่วงดึงพลังงานจลน์ออกจากลูกบอลจนหยุดที่จุดสูงสุด"
