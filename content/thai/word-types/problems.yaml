    stem: "ประโยคใดมีคำที่พิมพ์ตัวหนาเป็น **คำบุพบท** (เลือกให้ครบ)"
    choices:
      - { id: a, text: "เขายืน**ข้างหน้า**บ้าน", correct: true }
      - { id: b, text: "เขายืนอยู่**ข้างหน้า**", feedback: "ไม่มีคำนามตามหลัง ข้างหน้า จึงขยายกริยา ยืนอยู่ เป็นคำวิเศษณ์" }
      - { id: c, text: "ของขวัญชิ้นนี้**สำหรับ**คุณครู", correct: true }
      - { id: d, text: "ฉันมาสาย**เพราะ**รถติด", feedback: "เพราะ เชื่อมสองข้อความ (ฉันมาสาย กับ รถติด) จึงเป็นคำสันธาน" }
      - { id: e, text: "แมวนอน**ใต้**ต้นไม้", correct: true }
    hints:
