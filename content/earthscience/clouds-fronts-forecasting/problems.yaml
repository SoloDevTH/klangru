      - { id: b, text: "อากาศเย็นลอยขึ้นเหนืออากาศร้อน แล้วกลายเป็นฝน", feedback: "อากาศเย็นหนาแน่นกว่า จึงมุดอยู่ข้างล่าง อากาศร้อนต่างหากที่ถูกยกขึ้น" }
      - { id: c, text: "ความกดอากาศสูงทำให้อากาศจมตัว จึงเกิดเมฆฝน", feedback: "อากาศจมตัวทำให้ฟ้าโปร่ง พายุเกิดที่แนวที่มวลอากาศเย็นปะทะอากาศร้อนและอากาศร้อนถูกยกตัว" }
      - { id: d, text: "อากาศเย็นทำให้ไอน้ำแข็งตัวเป็นลูกเห็บโดยตรงที่ผิวพื้น", feedback: "ลูกเห็บเกิดในเมฆคิวมูโลนิมบัสที่สูงมาก ซึ่งต้องมีกระแสอากาศยกตัวแรง" }
