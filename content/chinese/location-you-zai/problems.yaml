  stem: ข้อใดเปรียบเทียบการบอกตำแหน่งภาษาไทยกับภาษาจีนได้ถูกต้อง
  choices:
  - id: a
    text: ภาษาจีนใช้ 在 แทนคำว่า มี
    feedback: มี คือ 有 ส่วน 在 แปลว่า อยู่
  - id: b
    text: ภาษาจีนต้องเติม 里 หลังชื่อเมืองเสมอ
    feedback: ชื่อเมืองและประเทศไม่ต้องเติม 里 เช่น 我在曼谷
  - id: c
    text: ภาษาไทยวางคำบอกทิศหน้าคำนาม (บนโต๊ะ) ภาษาจีนวางหลังคำนาม (桌子上) แต่ลำดับ สิ่งของ อยู่ สถานที่ และ สถานที่ มี สิ่งของ เหมือนกัน
    correct: true
    feedback: ถูก หนังสืออยู่บนโต๊ะ = 书在桌子上 · บนโต๊ะมีหนังสือ = 桌子上有书
  - id: d
    text: ทั้งสองภาษาวางคำบอกทิศหน้าคำนาม
    feedback: ภาษาจีนพูดว่า 桌子上 (โต๊ะ บน)
  hints:
  - เทียบ บนโต๊ะ กับ 桌子上
  - เทียบ หนังสืออยู่บนโต๊ะ กับ 书在桌子上 คำต่อคำ
  solution: 'คำบอกทิศ: ไทยอยู่ **หน้า** คำนาม จีนอยู่ **หลัง** คำนาม ส่วนลำดับประโยค 在 และ 有 เหมือนภาษาไทย'
