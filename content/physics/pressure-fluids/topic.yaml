id: physics.matter.pressure-fluids
subject: physics
title: { th: ความดันและของไหล, en: Pressure and fluids }
summary: คำนวณความดันจากแรงต่อพื้นที่ ความดันในของเหลวตามความลึก ใช้หลักของพาสคัลกับแม่แรงไฮดรอลิก และหาแรงลอยตัวด้วยหลักของอาร์คิมีดีส
difficulty: 5
minutes: 40
prerequisites: [physics.dynamics.weight-normal, math.geometry.volume-surface]
encompasses:
  - { id: physics.dynamics.weight-normal, weight: 0.4 }
  - { id: math.geometry.volume-surface, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: buoyancy-forces.svg
    alt: "ภาพซ้าย: ก้อนวัตถุทรงสี่เหลี่ยมจมอยู่ใต้ผิวน้ำ ลูกศรแรงดันของน้ำที่กดด้านบนสั้น ลูกศรที่ดันด้านล่างขึ้นยาวกว่าเพราะลึกกว่า ลูกศรด้านข้างซ้ายขวายาวเท่ากันที่ความลึกเดียวกันจึงหักล้างกัน ภาพขวา: แผนภาพแรงของก้อนอะลูมิเนียมที่แขวนกับตาชั่งสปริงและจมทั้งก้อน น้ำหนัก W = 13.23 N ชี้ลง แรงลอยตัว F_B = 4.9 N และแรงดึง T = 8.33 N ชี้ขึ้น ความยาวลูกศรเป็นสัดส่วนกับขนาดแรง"
    caption: "แรงลอยตัวเกิดจากน้ำดันด้านล่างมากกว่าด้านบน และเมื่อวัตถุนิ่ง แรงขึ้นรวมกัน ($T + F_B$) เท่ากับแรงลง ($W$)"
  - type: worked-example
    title: อ่านตาชั่งสปริงเมื่อก้อนโลหะจมในน้ำ
    problem: "ก้อนอะลูมิเนียมปริมาตร $500\\ \\mathrm{cm^3}$ ความหนาแน่น $2{,}700\\ \\mathrm{kg/m^3}$ แขวนกับตาชั่งสปริงแล้วหย่อนให้จมในน้ำทั้งก้อนโดยไม่แตะก้นภาชนะ ตาชั่งอ่านได้เท่าใด ใช้ $\\rho_{\\text{น้ำ}} = 1{,}000\\ \\mathrm{kg/m^3}$ และ $g = 9.8\\ \\mathrm{m/s^2}$"
    steps:
      - text: "วาดแผนภาพแรง: น้ำหนัก $W$ ชี้ลง แรงลอยตัว $F_B$ และแรงดึงของตาชั่ง $T$ ชี้ขึ้น ก้อนโลหะนิ่ง จึงได้ $T + F_B = W$"
        why: "ตาชั่งอ่านค่าแรงดึง $T$ ไม่ได้อ่านน้ำหนักโดยตรง ต้องรู้ก่อนว่ามีแรงอะไรช่วยพยุงอีกบ้าง"
      - text: "แปลงปริมาตร: $500\\ \\mathrm{cm^3} = 500 \\times 10^{-6}\\ \\mathrm{m^3} = 5 \\times 10^{-4}\\ \\mathrm{m^3}$"
        why: "$1\\ \\mathrm{m} = 100\\ \\mathrm{cm}$ ดังนั้น $1\\ \\mathrm{m^3} = 100^3 = 10^6\\ \\mathrm{cm^3}$"
      - text: "น้ำหนัก: $m = \\rho V = (2{,}700)(5 \\times 10^{-4}) = 1.35\\ \\mathrm{kg}$ จึงได้ $W = mg = 1.35 \\times 9.8 = 13.23\\ \\mathrm{N}$"
      - text: "แรงลอยตัว: $F_B = \\rho_{\\text{น้ำ}} V g = (1{,}000)(5 \\times 10^{-4})(9.8) = 4.9\\ \\mathrm{N}$"
        why: "ใช้ความหนาแน่นของน้ำ ไม่ใช่ของอะลูมิเนียม เพราะแรงลอยตัวเท่ากับน้ำหนักของน้ำที่ถูกแทนที่"
      - text: "ตาชั่งอ่านได้ $T = W - F_B = 13.23 - 4.9 = 8.33\\ \\mathrm{N}$"
    answer: "ตาชั่งอ่านได้ $8.33\\ \\mathrm{N}$ น้อยกว่าน้ำหนักจริง $4.9\\ \\mathrm{N}$"
  - { type: check, problem: phy.press.p018, prompt: "ลองคิดก่อนอ่านต่อ: วัตถุที่ลอยนิ่งมีแรงอะไรบ้าง ขนาดเท่าใด" }
  - type: figure
    src: barometer-manometer.svg
    alt: "ภาพซ้าย: บารอมิเตอร์ปรอท หลอดแก้วคว่ำในอ่างปรอท ลำปรอทในหลอดสูง h = 760 mm จากผิวปรอทในอ่าง เหนือลำปรอทเป็นสุญญากาศ ความดันบรรยากาศ P₀ กดผิวปรอทในอ่าง ภาพขวา: แมนอมิเตอร์ปลายเปิด หลอดรูปตัว U ใส่ของเหลว ปลายซ้ายต่อกับถังแก๊สความดัน P ปลายขวาเปิดสู่อากาศ ระดับของเหลวฝั่งแก๊สต่ำกว่าฝั่งเปิดเป็นระยะ h"
    caption: "บารอมิเตอร์: $P_0 = \\rho_{\\text{ปรอท}} g h$ · แมนอมิเตอร์: ระดับฝั่งแก๊สต่ำกว่า แปลว่าแก๊สดันแรงกว่าอากาศ $P = P_0 + \\rho g h$"
  - type: worked-example
    title: วัดความดันแก๊สด้วยแมนอมิเตอร์ปรอท
    problem: "แมนอมิเตอร์ปลายเปิดบรรจุปรอท ($\\rho = 13{,}600\\ \\mathrm{kg/m^3}$) ต่อกับถังแก๊ส ระดับปรอทฝั่งที่ต่อกับถังต่ำกว่าฝั่งที่เปิดสู่อากาศ $5\\ \\mathrm{cm}$ ความดันบรรยากาศ $101.3\\ \\mathrm{kPa}$ แก๊สในถังมีความดันสัมบูรณ์เท่าใด ใช้ $g = 9.8\\ \\mathrm{m/s^2}$"
    steps:
      - text: "ฝั่งแก๊สมีระดับต่ำกว่า แปลว่าแก๊สดันปรอทลงแรงกว่าอากาศ ความดันแก๊สจึง **มากกว่า** ความดันบรรยากาศ: $P = P_0 + \\rho g h$"
        why: "ลากเส้นระดับผ่านผิวปรอทฝั่งแก๊ส ความดันที่ระดับนี้ทั้งสองฝั่งเท่ากัน ฝั่งแก๊สคือ $P$ ส่วนฝั่งเปิดคือความดันอากาศบวกความดันของลำปรอทสูง $h$ ที่อยู่เหนือระดับนั้น"
      - text: "ความดันเกจ: $\\rho g h = (13{,}600)(9.8)(0.05) = 6{,}664\\ \\mathrm{Pa} \\approx 6.66\\ \\mathrm{kPa}$"
        why: "ต้องแปลง $5\\ \\mathrm{cm}$ เป็น $0.05\\ \\mathrm{m}$ ก่อนแทนค่า"
      - text: "ความดันสัมบูรณ์: $P = 101.3 + 6.66 \\approx 108.0\\ \\mathrm{kPa}$"
    answer: "ประมาณ $108\\ \\mathrm{kPa}$ (ความดันเกจ $6.66\\ \\mathrm{kPa}$)"
  - { type: check, problem: phy.press.p016 }
  - type: interactive
    title: ความดันตามความลึกในของเหลวชนิดต่าง ๆ
    caption: แกนนอนคือความลึก (m) แกนตั้งคือความดัน (kPa) ใช้ g = 9.8 m/s² เส้นล่างคือความดันเนื่องจากของเหลว ρgh ส่วนเส้นบนรวมความดันบรรยากาศ 101.3 kPa ด้วย เลื่อน r (ความหนาแน่น) จาก 800 (น้ำมัน) ไป 1,000 (น้ำจืด) และ 1,025 (น้ำทะเล) สังเกตว่ากราฟเป็นเส้นตรง ลึกเป็นสองเท่าความดันจากของเหลวก็เป็นสองเท่า
    widget:
      kind: function-plot
      functions: ["\\frac{9.8 r x}{1000}", "101.3 + \\frac{9.8 r x}{1000}"]
      sliders:
        - { name: r, min: 500, max: 2000, step: 25, value: 1000, label: ความหนาแน่นของของเหลว ρ (kg/m³) }
      x: [0, 20]
      y: [0, 400]
  - type: simulation
    title: ความดันในของเหลว (PhET Under Pressure)
    url: https://phet.colorado.edu/en/simulations/under-pressure
    provider: phet
    note: วางเครื่องวัดความดันที่ความลึกต่าง ๆ ในสระที่มีรูปร่างต่างกัน แล้วเปลี่ยนชนิดของเหลวและค่า g ความดันที่ความลึกเท่ากันจะเท่ากันไม่ว่าสระจะเป็นรูปทรงใด
  - type: simulation
    title: แรงลอยตัว (PhET Buoyancy)
    url: https://phet.colorado.edu/en/simulations/buoyancy
    provider: phet
    note: หย่อนก้อนวัตถุที่มีความหนาแน่นต่าง ๆ ลงในน้ำ ดูแรงลอยตัวเทียบกับน้ำหนัก และสังเกตว่าระดับน้ำที่สูงขึ้นบอกปริมาตรของน้ำที่ถูกแทนที่
glossary:
  - { term: ความดัน, definition: "แรงที่กระทำตั้งฉากกับผิวต่อหนึ่งหน่วยพื้นที่ $P = F/A$ หน่วยพาสคัล ($1\\ \\mathrm{Pa} = 1\\ \\mathrm{N/m^2}$)" }
  - { term: ความดันบรรยากาศ, definition: "ความดันจากอากาศที่ระดับน้ำทะเล ประมาณ $1.013 \\times 10^5\\ \\mathrm{Pa}$" }
  - { term: หลักของพาสคัล, definition: "ความดันที่เพิ่มให้ของเหลวในภาชนะปิดถ่ายทอดไปทุกจุดของของเหลวเท่ากัน" }
  - { term: แรงลอยตัว, definition: "แรงที่ของไหลดันวัตถุขึ้น เท่ากับน้ำหนักของของไหลที่ถูกแทนที่ $F_B = \\rho V g$ (หลักของอาร์คิมีดีส)" }
flashcards:
  - { front: "สูตรความดันและหน่วย", back: "$P = F/A$ หน่วย $\\mathrm{Pa} = \\mathrm{N/m^2}$" }
  - { front: "ความดันเนื่องจากของเหลวที่ความลึก $h$", back: "$P = \\rho g h$ ขึ้นกับความลึกและความหนาแน่น ไม่ขึ้นกับรูปร่างภาชนะ" }
  - { front: "แม่แรงไฮดรอลิก: ความสัมพันธ์ของแรงกับพื้นที่ลูกสูบ", back: "$\\dfrac{F_1}{A_1} = \\dfrac{F_2}{A_2}$ ลูกสูบใหญ่กว่ากี่เท่า แรงมากกว่าเท่านั้น" }
  - { front: "แมนอมิเตอร์ปลายเปิด: ระดับของเหลวฝั่งแก๊สต่ำกว่าฝั่งเปิด $h$", back: "$P_{\\text{แก๊ส}} = P_0 + \\rho g h$ (ถ้าฝั่งแก๊สสูงกว่า ใช้ $P_0 - \\rho g h$)" }
  - { front: "หลักของอาร์คิมีดีส", back: "แรงลอยตัว = น้ำหนักของของเหลวที่ถูกแทนที่ $F_B = \\rho_{\\text{ของเหลว}} V_{\\text{จม}} g$" }
