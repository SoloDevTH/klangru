completeness: full-text
strands:
  - id: ง1
    title: การดำรงชีวิตและครอบครัว
    standards:
      - id: ง 1.1
        text: "เข้าใจการทำงาน มีความคิดสร้างสรรค์ มีทักษะกระบวนการทำงาน ทักษะการจัดการ ทักษะกระบวนการแก้ปัญหา ทักษะการทำงานร่วมกัน และทักษะการแสวงหาความรู้ มีคุณธรรม และลักษณะนิสัยในการทำงาน มีจิตสำนึกในการใช้พลังงาน ทรัพยากร และสิ่งแวดล้อม เพื่อการดำรงชีวิตและครอบครัว"
        indicators:
          - { id: "ง 1.1 ป.1/1", level: ป.1, text: "บอกวิธีการทำงานเพื่อช่วยเหลือตนเอง" }
          - { id: "ง 1.1 ป.1/2", level: ป.1, text: "ใช้วัสดุ อุปกรณ์ และเครื่องมือง่ายๆ ในการทำงานอย่างปลอดภัย" }
          - { id: "ง 1.1 ป.1/3", level: ป.1, text: "ทำงานเพื่อช่วยเหลือตนเองอย่างกระตือรือร้นและตรงเวลา" }
          - { id: "ง 1.1 ป.2/1", level: ป.2, text: "บอกวิธีการและประโยชน์การทำงานเพื่อช่วยเหลือตนเองและครอบครัว" }
          - { id: "ง 1.1 ป.2/2", level: ป.2, text: "ใช้วัสดุ อุปกรณ์ และเครื่องมือในการทำงานอย่างเหมาะสมกับงานและประหยัด" }
          - { id: "ง 1.1 ป.2/3", level: ป.2, text: "ทำงานเพื่อช่วยเหลือตนเองและครอบครัวอย่างปลอดภัย" }
          - { id: "ง 1.1 ป.3/1", level: ป.3, text: "อธิบายวิธีการและประโยชน์การทำงาน เพื่อช่วยเหลือตนเอง ครอบครัว และส่วนรวม" }
          - { id: "ง 1.1 ป.3/2", level: ป.3, text: "ใช้วัสดุ อุปกรณ์ และเครื่องมือตรงกับลักษณะงาน", note: "รอยต่อ “เครื่องมือ|ตรงกับ” ขึ้นบรรทัดใหม่ในเล่มหลักสูตรและเอกสาร สพฐ. ไม่เว้นวรรค (เอกสาร สพฐ. ปี 2566 ที่ใช้รหัสใหม่พิมพ์เว้นวรรค)" }
          - { id: "ง 1.1 ป.3/3", level: ป.3, text: "ทำงานอย่างเป็นขั้นตอนตามกระบวนการทำงานด้วยความสะอาด ความรอบคอบ และอนุรักษ์สิ่งแวดล้อม", note: "รอยต่อ “ความรอบคอบ|และอนุรักษ์” ขึ้นบรรทัดใหม่ในทุกเอกสารที่ตรวจ จึงเว้นวรรคตามรูปรายการแบบเดียวกับ ง 1.1 ป.3/1 (“ครอบครัว และส่วนรวม”)" }
          - { id: "ง 1.1 ป.4/1", level: ป.4, text: "อธิบายเหตุผลในการทำงานให้บรรลุเป้าหมาย" }
          - { id: "ง 1.1 ป.4/2", level: ป.4, text: "ทำงานบรรลุเป้าหมายที่วางไว้อย่างเป็นขั้นตอน ด้วยความขยัน อดทน รับผิดชอบ และซื่อสัตย์", note: "รอยต่อ “ด้วยความขยัน|อดทน” ขึ้นบรรทัดใหม่ในเอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง (สพฐ.) เว้นวรรคตามรูปรายการ (เอกสาร สพฐ. ปี 2566 ก็เว้นวรรค)" }
          - { id: "ง 1.1 ป.4/3", level: ป.4, text: "ปฏิบัติตนอย่างมีมารยาทในการทำงาน" }
          - { id: "ง 1.1 ป.4/4", level: ป.4, text: "ใช้พลังงานและทรัพยากรในการทำงานอย่างประหยัดและคุ้มค่า" }
          - { id: "ง 1.1 ป.5/1", level: ป.5, text: "อธิบายเหตุผลในการทำงานแต่ละขั้นตอนถูกต้องตามกระบวนการทำงาน" }
          - { id: "ง 1.1 ป.5/2", level: ป.5, text: "ใช้ทักษะการจัดการในการทำงานอย่างเป็นระบบ ประณีตและมีความคิดสร้างสรรค์", note: "เว้นวรรคตรงรอยต่อ “อย่างเป็นระบบ|ประณีต” ตามเอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง (สพฐ.) ซึ่งพิมพ์ว่า “อย่างเป็นระบบ ประณีต และมีความคิดสร้างสรรค์” (เล่มหลักสูตรไม่มีเว้นวรรคหน้า “และ”)" }
          - { id: "ง 1.1 ป.5/3", level: ป.5, text: "ปฏิบัติตนอย่างมีมารยาทในการทำงานกับสมาชิกในครอบครัว" }
          - { id: "ง 1.1 ป.5/4", level: ป.5, text: "มีจิตสำนึกในการใช้พลังงานและทรัพยากรอย่างประหยัดและคุ้มค่า" }
          - { id: "ง 1.1 ป.6/1", level: ป.6, text: "อภิปรายแนวทางในการทำงานและปรับปรุงการทำงานแต่ละขั้นตอน" }
          - { id: "ง 1.1 ป.6/2", level: ป.6, text: "ใช้ทักษะการจัดการในการทำงานและทักษะการทำงานร่วมกัน", note: "ข้อความตามเล่มหลักสูตร (“และทักษะการทำงานร่วมกัน”) เอกสาร สพฐ. ฉบับอื่นพิมพ์ว่า “และมีทักษะการทำงานร่วมกัน”" }
          - { id: "ง 1.1 ป.6/3", level: ป.6, text: "ปฏิบัติตนอย่างมีมารยาทในการทำงานกับครอบครัวและผู้อื่น" }
          - { id: "ง 1.1 ม.1/1", level: ม.1, text: "วิเคราะห์ขั้นตอนการทำงานตามกระบวนการทำงาน" }
          - { id: "ง 1.1 ม.1/2", level: ม.1, text: "ใช้กระบวนการกลุ่มในการทำงานด้วยความเสียสละ" }
          - { id: "ง 1.1 ม.1/3", level: ม.1, text: "ตัดสินใจแก้ปัญหาการทำงานอย่างมีเหตุผล" }
          - { id: "ง 1.1 ม.2/1", level: ม.2, text: "ใช้ทักษะการแสวงหาความรู้ เพื่อพัฒนาการทำงาน" }
          - { id: "ง 1.1 ม.2/2", level: ม.2, text: "ใช้ทักษะกระบวนการแก้ปัญหาในการทำงาน" }
          - { id: "ง 1.1 ม.2/3", level: ม.2, text: "มีจิตสำนึกในการทำงานและใช้ทรัพยากรในการปฏิบัติงานอย่างประหยัดและคุ้มค่า" }
          - { id: "ง 1.1 ม.3/1", level: ม.3, text: "อภิปรายขั้นตอนการทำงานที่มีประสิทธิภาพ" }
          - { id: "ง 1.1 ม.3/2", level: ม.3, text: "ใช้ทักษะในการทำงานร่วมกันอย่างมีคุณธรรม" }
          - { id: "ง 1.1 ม.3/3", level: ม.3, text: "อภิปรายการทำงานโดยใช้ทักษะการจัดการเพื่อการประหยัดพลังงาน ทรัพยากร และสิ่งแวดล้อม", note: "รอยต่อ “พลังงาน|ทรัพยากร” เว้นวรรคตามรูปรายการ (เอกสาร สพฐ. ปี 2566 พิมพ์กลางบรรทัดและเว้นวรรค)" }
          - { id: "ง 1.1 ม.4-6/1", level: ม.4-6, text: "อธิบายวิธีการทำงานเพื่อการดำรงชีวิต" }
          - { id: "ง 1.1 ม.4-6/2", level: ม.4-6, text: "สร้างผลงานอย่างมีความคิดสร้างสรรค์ และมีทักษะการทำงานร่วมกัน" }
          - { id: "ง 1.1 ม.4-6/3", level: ม.4-6, text: "มีทักษะการจัดการในการทำงาน" }
          - { id: "ง 1.1 ม.4-6/4", level: ม.4-6, text: "มีทักษะกระบวนการแก้ปัญหาในการทำงาน" }
          - { id: "ง 1.1 ม.4-6/5", level: ม.4-6, text: "มีทักษะในการแสวงหาความรู้เพื่อการดำรงชีวิต" }
          - { id: "ง 1.1 ม.4-6/6", level: ม.4-6, text: "มีคุณธรรมและลักษณะนิสัยในการทำงาน" }
          - { id: "ง 1.1 ม.4-6/7", level: ม.4-6, text: "ใช้พลังงาน ทรัพยากรในการทำงานอย่างคุ้มค่าและยั่งยืน เพื่อการอนุรักษ์สิ่งแวดล้อม" }
  - id: ง2
    title: การอาชีพ
    standards:
      - id: ง 2.1
        text: "เข้าใจ มีทักษะที่จำเป็น มีประสบการณ์ เห็นแนวทางในงานอาชีพ ใช้เทคโนโลยีเพื่อพัฒนาอาชีพ มีคุณธรรม และมีเจตคติที่ดีต่ออาชีพ"
        indicators:
          - { id: "ง 2.1 ป.4/1", level: ป.4, text: "อธิบายความหมายและความสำคัญของอาชีพ" }
          - { id: "ง 2.1 ป.5/1", level: ป.5, text: "สำรวจข้อมูลที่เกี่ยวกับอาชีพต่างๆ ในชุมชน" }
          - { id: "ง 2.1 ป.5/2", level: ป.5, text: "ระบุความแตกต่างของอาชีพ" }
          - { id: "ง 2.1 ป.6/1", level: ป.6, text: "สำรวจตนเองเพื่อวางแผนในการเลือกอาชีพ" }
          - { id: "ง 2.1 ป.6/2", level: ป.6, text: "ระบุความรู้ ความสามารถ และคุณธรรมที่สัมพันธ์กับอาชีพที่สนใจ", note: "เว้นวรรคตรงรอยต่อ “ความรู้|ความสามารถ” ตามเอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง (สพฐ.) และ “ความสามารถ|และคุณธรรม” ตามรูปรายการ" }
          - { id: "ง 2.1 ม.1/1", level: ม.1, text: "อธิบายแนวทางการเลือกอาชีพ" }
          - { id: "ง 2.1 ม.1/2", level: ม.1, text: "มีเจตคติที่ดีต่อการประกอบอาชีพ" }
          - { id: "ง 2.1 ม.1/3", level: ม.1, text: "เห็นความสำคัญของการสร้างอาชีพ" }
          - { id: "ง 2.1 ม.2/1", level: ม.2, text: "อธิบายการเสริมสร้างประสบการณ์อาชีพ" }
          - { id: "ง 2.1 ม.2/2", level: ม.2, text: "ระบุการเตรียมตัวเข้าสู่อาชีพ" }
          - { id: "ง 2.1 ม.2/3", level: ม.2, text: "มีทักษะพื้นฐานที่จำเป็นสำหรับการประกอบอาชีพที่สนใจ" }
          - { id: "ง 2.1 ม.3/1", level: ม.3, text: "อภิปรายการหางานด้วยวิธีที่หลากหลาย" }
          - { id: "ง 2.1 ม.3/2", level: ม.3, text: "วิเคราะห์แนวทางเข้าสู่อาชีพ" }
          - { id: "ง 2.1 ม.3/3", level: ม.3, text: "ประเมินทางเลือกในการประกอบอาชีพที่สอดคล้องกับความรู้ ความถนัด และความสนใจของตนเอง", note: "เว้นวรรคตรงรอยต่อ “ความรู้|ความถนัด” ตามเอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง (สพฐ.)" }
          - { id: "ง 2.1 ม.4-6/1", level: ม.4-6, text: "อภิปรายแนวทางสู่เข้าอาชีพที่สนใจ", note: "ข้อความตามเล่มหลักสูตรทุกตัวอักษร (“แนวทางสู่เข้าอาชีพ” ตรวจกับภาพหน้า 219 แล้ว) ซึ่งน่าจะพิมพ์ผิด เอกสารตัวชี้วัดและสาระการเรียนรู้แกนกลาง (สพฐ.) พิมพ์ว่า “อภิปรายแนวทางเข้าสู่อาชีพที่สนใจ” และเอกสาร สพฐ. ปี 2566 พิมพ์ว่า “อภิปรายแนวทางสู่อาชีพที่สนใจ”" }
          - { id: "ง 2.1 ม.4-6/2", level: ม.4-6, text: "เลือกและใช้เทคโนโลยีอย่างเหมาะสมกับอาชีพ" }
          - { id: "ง 2.1 ม.4-6/3", level: ม.4-6, text: "มีประสบการณ์ในอาชีพที่ถนัดและสนใจ" }
          - { id: "ง 2.1 ม.4-6/4", level: ม.4-6, text: "มีคุณลักษณะที่ดีต่ออาชีพ" }
