  - id: biology.plants.plant-products-growth.p015
    topics: [biology.plants.plant-products-growth]
    difficulty: 4
    type: order
    stem: "ทดสอบน้ำคั้นจากผลไม้ 4 ชนิดด้วยสารละลายเบเนดิกต์ในปริมาณเท่ากันแล้วต้มเท่ากัน ได้สีดังนี้ มะนาว สีเขียว มะม่วงสุก ตะกอนสีแดงอิฐ แตงโม สีเหลือง ฝรั่ง สีส้ม เรียงจากน้ำคั้นที่มีน้ำตาลรีดิวซ์น้อยที่สุดไปมากที่สุด"
    items:
      - "มะนาว"
      - "แตงโม"
      - "ฝรั่ง"
      - "มะม่วงสุก"
    hints:
      - "สีของเบเนดิกต์เปลี่ยนจากฟ้า ไปเขียว เหลือง ส้ม และแดงอิฐ"
      - "สีที่ไปไกลจากสีฟ้ามากขึ้นแปลว่ามีน้ำตาลมากขึ้น"
    solution: "สีเขียว < เหลือง < ส้ม < แดงอิฐ จึงเรียงเป็น มะนาว → แตงโม → ฝรั่ง → มะม่วงสุก ผลนี้บอกปริมาณคร่าว ๆ และใช้ได้เพราะควบคุมปริมาณสารและเวลาต้มให้เท่ากัน"
