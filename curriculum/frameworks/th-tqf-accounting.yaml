# มาตรฐานคุณวุฒิระดับปริญญาตรี สาขาวิชาการบัญชี พ.ศ. ๒๕๖๒ (มคอ.๑) เอกสารแนบท้ายประกาศกระทรวงศึกษาธิการ
#
# ทำไมไม่ใช่ "สาขาวิชาบริหารธุรกิจ" (ตรวจเมื่อ 2026-10-24)
# - ไม่มีประกาศมาตรฐานคุณวุฒิระดับปริญญาตรี สาขาวิชาบริหารธุรกิจ รายการ มคอ.๑ ทั้งหมดที่สำนักงานปลัดกระทรวงศึกษาธิการ
#   รวบรวมไว้ (26 สาขาระดับปริญญาตรี ดู sources) ไม่มีสาขานี้ หลักสูตร บธ.บ. ของมหาวิทยาลัยที่ตรวจ (มหาวิทยาลัยพะเยา 2564,
#   มทร.พระนคร 2565, มหาวิทยาลัยทักษิณ) อ้างเพียงกรอบมาตรฐานคุณวุฒิระดับอุดมศึกษาแห่งชาติ พ.ศ. 2552 ไม่ได้อ้างมาตรฐานสาขา
# - สาขาที่ใกล้ที่สุดและมีประกาศจริงคือ "สาขาวิชาการบัญชี" ซึ่งปริญญาหนึ่งที่กำหนดคือ บริหารธุรกิจบัณฑิต (การบัญชี) และ
#   เนื้อหาสาระสำคัญครอบคลุมแกนวิชาธุรกิจ (บัญชีการเงินและบริหาร การเงิน ภาษี กฎหมายธุรกิจ เศรษฐศาสตร์
#   สภาพแวดล้อมธุรกิจ ธุรกิจระหว่างประเทศ กลยุทธ์และพฤติกรรมองค์กร คณิตศาสตร์และสถิติ จริยธรรม) ไฟล์นี้จึงเก็บฉบับนี้
#   และตั้งชื่อตามสาขาจริง (th-tqf-accounting) แทน th-tqf-business-admin
# - ฉบับ พ.ศ. ๒๕๖๒ (ราชกิจจานุเบกษา เล่ม ๑๓๖ ตอนพิเศษ ๗๘ ง วันที่ ๒๘ มีนาคม ๒๕๖๒ ประกาศ ณ วันที่ 28 กุมภาพันธ์ 2562)
#   ข้อ ๑ ยกเลิกฉบับ พ.ศ. ๒๕๕๓ ไม่พบฉบับแก้ไขหลังจากนี้ แต่กฎกระทรวงมาตรฐานคุณวุฒิระดับอุดมศึกษา พ.ศ. 2565 เปลี่ยนกรอบระดับชาติ
#   แล้ว (ผลลัพธ์การเรียนรู้ 4 ด้าน) ยังไม่ได้ยืนยันว่ามาตรฐานสาขาฉบับนี้ยังใช้บังคับเต็มรูปหรือไม่
#
# โครงและรหัส
# - ต้นฉบับมีเลขข้อของตัวเอง ไฟล์นี้ใช้เลขข้อนั้นเป็นรหัส (เขียนเป็นเลขอารบิก) ไม่ได้ตั้งรหัสใหม่
#   strand 5 = ข้อ ๕ มาตรฐานผลลัพธ์การเรียนรู้ (standard = ด้าน ๕.๑-๕.๕, indicator = ผลลัพธ์ ๕.x.x)
#   strand 8 = ข้อ ๘ เนื้อหาสาระสำคัญของสาขาวิชา (standard = ๘.๑-๘.๓, indicator = กลุ่มเนื้อหา ๘.x.x)
#   ข้อ ๘.๓ ไม่มีข้อย่อย จึงใช้ "8.3" เป็นทั้ง standard และ indicator หนึ่งรายการ
# - ข้อ ๘ ต้นฉบับพิมพ์ชื่อกลุ่มเนื้อหาหนึ่งบรรทัดแล้วตามด้วยคำอธิบาย ไฟล์นี้เชื่อมสองส่วนด้วย ": " (แบบเดียวกับ th-coe-engineering-basics)
# - ไม่ได้เก็บข้อ ๑-๔, ๖-๗, ๙ เป็นต้นไป (ชื่อปริญญา คุณลักษณะบัณฑิต โครงสร้างหลักสูตร กลยุทธ์การสอน ฯลฯ)
# - ข้อความในชั้นข้อความของ PDF เข้ารหัสสระอำผิด (ได้ " า") จึงถอดด้วย pypdf แล้วแทนกลับเป็น "ำ"
#   และตรวจทานทุกรายการกับภาพหน้า PDF (หน้า 4, 5, 7, 8 ของไฟล์) เช่น "ต่างๆ" ไม่เว้นวรรค "ผู้มีส่วนได้ส่วนเสีย" ไม่เว้นวรรค
#   ช่องว่างหลายช่องที่เกิดจากการจัดชิดขอบถูกยุบเป็นช่องเดียว รอยต่อบรรทัดภายในย่อหน้าถือว่าไม่เว้นวรรค (ยกเว้นต้นบรรทัดที่ขึ้นรายการใหม่)
