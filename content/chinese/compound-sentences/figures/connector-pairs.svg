<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei','Noto Sans Thai',sans-serif">
<title>คู่คำเชื่อม 5 คู่ หน้าที่ และตำแหน่งของคำที่สอง</title>
<defs><marker id="a1f4e9c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker><marker id="a2a6a2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a6a2a"/></marker><marker id="a5b3a8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3a8c"/></marker><marker id="a7a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5a00"/></marker><marker id="ab3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<rect x="0" y="0" width="780" height="470" fill="#fff"/>
<text x="390.0" y="30.0" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="bold">คำเชื่อมภาษาจีนมัก "มาเป็นคู่" ภาษาไทยมักใช้คำเดียวก็พอ</text>
<text x="150.0" y="66.0" font-size="15" text-anchor="middle" fill="#666" font-weight="bold">ส่วนแรก</text>
<text x="385.0" y="66.0" font-size="15" text-anchor="middle" fill="#666" font-weight="bold">ส่วนหลัง</text>
<text x="555.0" y="66.0" font-size="15" text-anchor="middle" fill="#666" font-weight="bold">หน้าที่</text>
<text x="675.0" y="66.0" font-size="15" text-anchor="middle" fill="#666" font-weight="bold">ภาษาไทย</text>
<rect x="40.0" y="78.0" width="220.0" height="46.0" rx="10" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="150.0" y="108.0" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="normal">因为 yīnwèi</text>
<line x1="262.0" y1="101.0" x2="282.0" y2="101.0" stroke="#1f4e9c" stroke-width="2" stroke-linecap="round" marker-end="url(#a1f4e9c)"/>
<rect x="285.0" y="78.0" width="200.0" height="46.0" rx="10" fill="#dbe8f8" stroke="#1f4e9c" stroke-width="2"/>
<text x="385.0" y="108.0" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="normal">所以 suǒyǐ</text>
<text x="555.0" y="107.0" font-size="16" text-anchor="middle" fill="#1f4e9c" font-weight="bold">เหตุ → ผล</text>
<text x="675.0" y="107.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">เพราะ… จึง…</text>
<rect x="40.0" y="140.0" width="220.0" height="46.0" rx="10" fill="#dcefd6" stroke="#2a6a2a" stroke-width="2"/>
<text x="150.0" y="170.0" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="normal">如果 rúguǒ</text>
<line x1="262.0" y1="163.0" x2="282.0" y2="163.0" stroke="#2a6a2a" stroke-width="2" stroke-linecap="round" marker-end="url(#a2a6a2a)"/>
<rect x="285.0" y="140.0" width="200.0" height="46.0" rx="10" fill="#dcefd6" stroke="#2a6a2a" stroke-width="2"/>
<text x="385.0" y="170.0" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="normal">就 jiù</text>
<text x="555.0" y="169.0" font-size="16" text-anchor="middle" fill="#2a6a2a" font-weight="bold">เงื่อนไข</text>
<text x="675.0" y="169.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ถ้า… ก็…</text>
<rect x="40.0" y="202.0" width="220.0" height="46.0" rx="10" fill="#fbe0dc" stroke="#b3261e" stroke-width="2"/>
<text x="150.0" y="232.0" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="normal">虽然 suīrán</text>
<line x1="262.0" y1="225.0" x2="282.0" y2="225.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round" marker-end="url(#ab3261e)"/>
<rect x="285.0" y="202.0" width="200.0" height="46.0" rx="10" fill="#fbe0dc" stroke="#b3261e" stroke-width="2"/>
<text x="385.0" y="232.0" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="normal">但是 dànshì</text>
<text x="555.0" y="231.0" font-size="16" text-anchor="middle" fill="#b3261e" font-weight="bold">ขัดแย้ง</text>
<text x="675.0" y="231.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ถึงแม้… แต่…</text>
<rect x="40.0" y="264.0" width="220.0" height="46.0" rx="10" fill="#fbf0c0" stroke="#7a5a00" stroke-width="2"/>
<text x="150.0" y="294.0" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="normal">先 xiān</text>
<line x1="262.0" y1="287.0" x2="282.0" y2="287.0" stroke="#7a5a00" stroke-width="2" stroke-linecap="round" marker-end="url(#a7a5a00)"/>
<rect x="285.0" y="264.0" width="200.0" height="46.0" rx="10" fill="#fbf0c0" stroke="#7a5a00" stroke-width="2"/>
<text x="385.0" y="294.0" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="normal">再 zài / 然后 ránhòu</text>
<text x="555.0" y="293.0" font-size="16" text-anchor="middle" fill="#7a5a00" font-weight="bold">ลำดับ</text>
<text x="675.0" y="293.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ก่อน… แล้ว…</text>
<rect x="40.0" y="326.0" width="220.0" height="46.0" rx="10" fill="#e6dcf5" stroke="#5b3a8c" stroke-width="2"/>
<text x="150.0" y="356.0" font-size="19" text-anchor="middle" fill="#1a1a1a" font-weight="normal">不但 búdàn</text>
<line x1="262.0" y1="349.0" x2="282.0" y2="349.0" stroke="#5b3a8c" stroke-width="2" stroke-linecap="round" marker-end="url(#a5b3a8c)"/>
<rect x="285.0" y="326.0" width="200.0" height="46.0" rx="10" fill="#e6dcf5" stroke="#5b3a8c" stroke-width="2"/>
<text x="385.0" y="356.0" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="normal">而且 érqiě</text>
<text x="555.0" y="355.0" font-size="16" text-anchor="middle" fill="#5b3a8c" font-weight="bold">เพิ่มเติม</text>
<text x="675.0" y="355.0" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">ไม่เพียง… แต่ยัง…</text>
<rect x="40.0" y="400.0" width="700.0" height="58.0" rx="10" fill="#fafafa" stroke="#666" stroke-width="1.2"/>
<text x="390.0" y="424.0" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="normal">就 และ 再 เป็นคำวิเศษณ์ วางหลังประธาน หน้ากริยา:  如果下雨，我们就不去。</text>
<text x="390.0" y="447.0" font-size="16" text-anchor="middle" fill="#b3261e" font-weight="normal">✗ 如果下雨，就我们不去。     ✗ 虽然…所以…  (จับคู่ผิด)</text>
</svg>
