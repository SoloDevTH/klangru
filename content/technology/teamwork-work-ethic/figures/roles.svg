<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="sans-serif">
<title>บทบาทในกลุ่มงาน</title>
<rect width="760" height="420" fill="#ffffff"/>
<text x="380.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">บทบาทในกลุ่มงานที่ทุกคนยังมีส่วนร่วม</text>
<rect x="190.0" y="56" width="380" height="62" rx="12" fill="#fef9c3" stroke="#334155" stroke-width="2"/>
<text x="380.0" y="83" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">เป้าหมายร่วมของกลุ่ม</text>
<text x="380.0" y="105" text-anchor="middle" font-size="14" fill="#374151">เขียนให้ชัด วัดได้ และทุกคนเข้าใจตรงกัน</text>
<line x1="380.0" y1="118" x2="102.5" y2="220" stroke="#334155" stroke-width="2"/>
<rect x="20.0" y="220" width="165" height="130" rx="12" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="102.5" y="254" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">ผู้นำ</text>
<text x="102.5" y="286" text-anchor="middle" font-size="13" fill="#374151">ประสานงานและช่วยให้</text>
<text x="102.5" y="306" text-anchor="middle" font-size="13" fill="#374151">กลุ่มตัดสินใจร่วมกัน</text>
<line x1="380.0" y1="118" x2="287.5" y2="220" stroke="#334155" stroke-width="2"/>
<rect x="205.0" y="220" width="165" height="130" rx="12" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="287.5" y="254" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">เลขานุการ</text>
<text x="287.5" y="286" text-anchor="middle" font-size="13" fill="#374151">บันทึกความคืบหน้า</text>
<text x="287.5" y="306" text-anchor="middle" font-size="13" fill="#374151">และติดตามกำหนดส่ง</text>
<line x1="380.0" y1="118" x2="472.5" y2="220" stroke="#334155" stroke-width="2"/>
<rect x="390.0" y="220" width="165" height="130" rx="12" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="472.5" y="254" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">สมาชิก</text>
<text x="472.5" y="286" text-anchor="middle" font-size="13" fill="#374151">รับผิดชอบงานที่ได้รับ</text>
<text x="472.5" y="306" text-anchor="middle" font-size="13" fill="#374151">ให้เสร็จตามเวลา</text>
<line x1="380.0" y1="118" x2="657.5" y2="220" stroke="#334155" stroke-width="2"/>
<rect x="575.0" y="220" width="165" height="130" rx="12" fill="#fbcfe8" stroke="#334155" stroke-width="2"/>
<text x="657.5" y="254" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">ผู้ดูแลวัสดุ</text>
<text x="657.5" y="286" text-anchor="middle" font-size="13" fill="#374151">จัดหาและดูแลอุปกรณ์</text>
<text x="657.5" y="306" text-anchor="middle" font-size="13" fill="#374151">ที่ใช้ร่วมกัน</text>
<text x="380.0" y="380" text-anchor="middle" font-size="14" fill="#374151">ถ้าสมาชิกคนใดติดขัด ให้ปรับบทบาทหรือการแบ่งงานร่วมกัน ไม่ตำหนิต่อหน้ากลุ่ม</text>
<text x="380.0" y="404" text-anchor="middle" font-size="14" fill="#374151">บางกลุ่มอาจรวมหรือเปลี่ยนชื่อบทบาทได้ตามขนาดและลักษณะงาน</text>
</svg>
