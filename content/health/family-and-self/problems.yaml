    stem: "จากแผนผังครอบครัวของต้นข้าว ถ้าวิชัยมีลูก ลูกของวิชัยจะเป็นญาติแบบใดกับต้นข้าว (ตอบเป็นคำเรียกความเป็นญาติ)"
    figure:
