  - ประชุมจัดตั้งบริษัท ตั้งกรรมการและผู้สอบบัญชี
  - ผู้เริ่มก่อการส่งมอบกิจการให้กรรมการ และเรียกเก็บค่าหุ้นอย่างน้อยร้อยละ 25
  - ยื่นขอจดทะเบียนจัดตั้งบริษัท
  hints:
