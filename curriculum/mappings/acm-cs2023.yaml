# หัวข้อในคลังที่ตรงกับ knowledge unit ของ ACM/IEEE-CS/AAAI CS2023
# CS2023 เป็นหลักสูตรระดับปริญญาตรี หัวข้อพื้นฐานของคลังจึงสอนได้เพียงบางส่วนของแต่ละ knowledge unit
framework: acm-cs2023
mappings:
  - topic: computer.algorithms.intro
    indicators: ["SDF-Algorithms"]
    coverage: partial
    note: "แนวคิดของอัลกอริทึมและการค้นหาแบบลำดับ ยังไม่มีการเรียงลำดับ การท่องต้นไม้และกราฟ และการวิเคราะห์ประสิทธิภาพ"
  - topic: computer.data.binary
    indicators: ["AR-Representation"]
    coverage: partial
    note: "บิต ไบต์ เลขฐาน และการแทนข้อมูลที่ไม่ใช่ตัวเลข ยังไม่มีจำนวนลบแบบส่วนเติมเต็มสอง จุดตรึง และจุดลอยตัว"
  - topic: computer.programming.basics
    indicators: ["SDF-Fundamentals"]
    coverage: partial
    note: "ตัวแปร ชนิดข้อมูล นิพจน์ การกำหนดค่า เงื่อนไข การวนซ้ำ การไล่โปรแกรม และข้อผิดพลาด ผู้เรียนเขียนและรันโปรแกรมสั้นเองในแอปพร้อมชุดทดสอบ ยังไม่มีฟังก์ชัน ข้อมูลแบบมีโครงสร้าง ไฟล์ การเรียกซ้ำ และการจัดการ exception"
  - topic: computer.data.number-representation
    indicators: [AR-Representation]
    coverage: full
    note: บิต ไบต์ เวิร์ด เลขฐานสิบหก จำนวนไม่มีเครื่องหมาย เครื่องหมายและขนาด ส่วนเติมเต็มสอง การล้น จุดตรึง จุดลอยตัว IEEE 754 32 บิต และรหัสตัวอักษรในฐานสิบหก (รายละเอียดการแทนอักขระอยู่ใน computer.data.binary)
  - topic: computer.systems.logic-gates
    indicators: [SF-Foundations, AR-Logic]
    coverage: partial
    note: ดิจิทัลกับแอนะล็อก เกตและพีชคณิตบูลีน สถานะและเครื่องสถานะจำกัดครบ การประมวลผลตามลำดับกับแบบขนานกล่าวถึงสั้น ๆ เท่านั้น
  - topic: computer.data.data-processing
    indicators: [DM-Data]
    coverage: full
    note: วงจรชีวิตข้อมูลหกขั้นรวมการเก็บรักษาและทำลาย
  - topic: computer.networks.internet-basics
    indicators: [NC-Fundamentals, NC-Applications]
    coverage: full
  - topic: computer.programming.design-debug
    indicators: [SDF-Practices, SE-Validation]
    coverage: partial
    note: การออกแบบกรณีทดสอบ รูปแบบโค้ดที่อ่านง่าย และคอมเมนต์ครบ ยังไม่มีการใช้ IDE และตัวดีบักจริงหรือการเขียนข้อกำหนดของโมดูล
  - topic: computer.society.computing-impacts
    indicators: [SEP-Context, SEP-History]
    coverage: partial
    note: ผลต่อบุคคลและสังคมและการเข้าถึงไม่ได้ครบ ผลของความไม่หลากหลายของทีมพัฒนามีเพียงประเด็นความแม่นยำที่ลำเอียงในโจทย์ p012
  - topic: computer.society.responsible-ict
    indicators: [SEP-IP, SDF-SEP]
    coverage: full
  - topic: computer.society.responsible-ict
    indicators: [SEP-Security, SEP-Professional-Ethics]
    coverage: partial
    note: กฎหมายอาชญากรรมคอมพิวเตอร์ของไทยและการเข้าถึงโดยมิชอบ มัลแวร์ สแปม ส่วนวิศวกรรมสังคมและการโจมตีโครงสร้างพื้นฐานกล่าวถึงสั้น ๆ (มาตรา 12 ไม่ได้สอน) และนโยบายความปลอดภัยขององค์กรไม่ได้สอน
  - topic: computer.systems.computer-systems
    indicators: [SF-Overview, AR-Memory]
    coverage: full
    note: "AR-Memory: ลำดับชั้นหน่วยความจำ แคช และเวลาเข้าถึงเฉลี่ย (p013) ส่วนหน่วยความจำเสมือนกล่าวเพียงว่าระบบสลับข้อมูลไปหน่วยเก็บถาวรเมื่อ RAM เต็ม"
  - topic: computer.systems.computer-systems
    indicators: [AR-Assembly, AR-IO]
    coverage: partial
    note: สถาปัตยกรรมฟอน นอยมันน์ วงรอบดึง ถอดรหัส ทำคำสั่งด้วยเครื่องจำลอง LOAD/ADD/STORE และหลายแกน (p016) แต่ไม่มีภาษาแอสเซมบลีจริงหรือการกระโดด
  - topic: computer.programming.functions
    indicators: [SDF-Fundamentals]
    coverage: partial
    note: ตัวแปร นิพจน์ เงื่อนไข วงวน ฟังก์ชัน ขอบเขต ลิสต์ การเรียกซ้ำ และการไล่การทำงาน ผู้เรียนเขียนฟังก์ชันเองในแอปให้ผ่านชุดทดสอบ ยังไม่มีการอ่านเขียนไฟล์และการจัดการข้อผิดพลาดด้วย try
  - topic: computer.security.cybersecurity-basics
    indicators: [SEC-Foundations]
    coverage: full
    note: CIA การยืนยันตัวตนและการกำหนดสิทธิ์ ภัยคุกคามและช่องโหว่ สิทธิ์น้อยที่สุด และการป้องกันหลายชั้น
  - topic: computer.security.cybersecurity-basics
    indicators: [NC-Security]
    coverage: partial
    note: การดักข้อมูลบน Wi-Fi DoS ไฟร์วอลล์ WPA2/WPA3 และ HTTPS ยังไม่มี VPN ระบบตรวจจับการบุกรุก และการโจมตีระดับโพรโทคอล
  - topic: computer.security.encryption
    indicators: [SEC-Crypto]
    coverage: partial
    note: รหัสแบบดั้งเดิมพร้อมจุดอ่อน (ลองทุกกุญแจ การนับความถี่) ปริภูมิกุญแจ กุญแจสมมาตร กุญแจสาธารณะ ลายมือชื่อดิจิทัล ใบรับรอง และ HTTPS ยังไม่มีฟังก์ชันแฮชและรหัสยืนยันความถูกต้องของข้อความ (MAC)
  - topic: computer.society.inclusive-design
    indicators: [HCI-Accessibility]
    coverage: full
    note: ข้อจำกัดถาวร ชั่วคราว ตามสถานการณ์ หลัก WCAG สี่ข้อ อัตราส่วนความต่างของสี ข้อความแทนภาพ และเทคโนโลยีช่วยเหลือ
  - topic: computer.society.inclusive-design
    indicators: [HCI-User, SEP-DEIA]
    coverage: partial
    note: การสังเกตผู้ใช้จริงและการทดสอบกับผู้ใช้หลากหลาย ส่วนการออกแบบที่ยึดผู้ใช้เป็นศูนย์กลางแบบเต็ม (user story ต้นแบบ การประเมิน) อยู่ใน computer.design.user-centred-design
  - topic: computer.society.privacy
    indicators: [SEP-Privacy]
    coverage: partial
    note: ผลของการเก็บข้อมูลจำนวนมาก การระบุตัวซ้ำจากข้อมูลที่ลบชื่อแล้ว k-anonymity แฝงชื่อ และกล้องจดจำใบหน้ากับสิทธิพลเมือง ยังไม่มี differential privacy และกรอบกฎหมายหลายประเทศในเชิงลึก
  - topic: computer.systems.operating-systems
    indicators: [OS-Purpose, SF-Resource]
    coverage: full
    note: ระบบปฏิบัติการเป็นตัวกลางระหว่างฮาร์ดแวร์กับแอป การจัดสรรหน่วยประมวลผลแบบ FCFS SJF และวนรอบพร้อมการคำนวณเวลารอ การแบ่งหน้าหน่วยความจำ คิวอุปกรณ์ และภาวะติดตาย
  - topic: computer.systems.operating-systems
    indicators: [OS-Principles]
    coverage: partial
    note: นามธรรม กระบวนการและสถานะ โหมดผู้ใช้กับโหมดเคอร์เนล และ system call ยังไม่มีอินเทอร์รัปต์และการทำงานพร้อมกันของเธรด
  - topic: computer.algorithms.searching-sorting
    indicators: [SDF-Algorithms, AL-Foundational, AL-Strategies, AL-Complexity]
    coverage: partial
    note: แนวคิดของประสิทธิภาพ การค้นหาและการเรียงลำดับ และผลต่อเวลา ผู้เรียนเขียนการค้นหาแบบลำดับและแบบทวิภาคเองในแอป ซึ่งชุดทดสอบนับจำนวนครั้งที่อ่านสมาชิก ยังไม่มีการท่องต้นไม้และกราฟ ซึ่งอยู่ใน computer.algorithms.data-structures
  - topic: computer.data.databases
    indicators: [DM-Core, DM-Modeling, DM-Relational, DM-Security]
    coverage: full
    note: จุดประสงค์ของ DBMS การแยกข้อมูลออกจากโปรแกรม การใช้ร่วมกัน ธุรกรรมที่สำเร็จทั้งหมดหรือไม่เกิดเลย และข้อมูลมีโครงสร้างกับไม่มีโครงสร้าง
  - topic: computer.data.databases
    indicators: [DM-Querying, SEC-Coding]
    coverage: partial
    note: SELECT WHERE ORDER BY COUNT และ JOIN สามตาราง ทุกคำสั่งตรวจด้วย sqlite3 ของ Python ยังไม่มี GROUP BY และคำสั่ง UPDATE DELETE และผู้เรียนไม่ได้รันคำสั่งเองในแอป
  - topic: computer.programming.lists-strings
    indicators: [SDF-Data-Structures]
    coverage: partial
    note: ลิสต์ ดิกชันนารี เซต การประมวลผลสตริง การเลือกโครงสร้างให้เหมาะกับปัญหา และผลต่อความเร็วของ in (ลิสต์เทียบทีละตัว ดิกชันนารีและเซตใช้ตารางแฮช) ผู้เรียนเขียนฟังก์ชันที่ใช้ลิสต์และดิกชันนารีเองในแอป ยังไม่มีสแตกและคิว ซึ่งอยู่ใน computer.algorithms.data-structures
  - topic: computer.programming.teamwork
    indicators: [SE-Teamwork, SE-Tools]
    coverage: full
    note: บทบาทในทีม กระบวนการแบบ agile (รอบสั้น บอร์ดงาน คุยสั้นทุกวัน ทบทวนท้ายรอบ) การสื่อสาร กติกาทีม การแก้ความขัดแย้งด้วยข้อมูลจากผู้ใช้ และการเขียนโปรแกรมเป็นคู่
  - topic: computer.projects.app-development
    indicators: [FPL-Event-Driven, SPD-Common]
    coverage: partial
    note: เหตุการณ์ ตัวจัดการ วงวนเหตุการณ์ (จำลองด้วยดิกชันนารีของฟังก์ชัน) ตัวจับเวลา ตัวจัดการที่ต้องทำงานเร็ว และเหตุการณ์ซ้ำหรือผิดลำดับ ยังไม่มีการเขียนโปรแกรมแบบตอบสนอง (reactive) และการทำงานพร้อมกัน
  - topic: computer.algorithms.data-structures
    indicators: [AL-Foundational]
    coverage: partial
    note: สแตก คิว ตารางแฮช (การชนกัน) ต้นไม้ค้นหาแบบทวิภาค (ค้นหา ใส่ ต้นไม้เอียง) กราฟแบบลิสต์ประชิดและเมทริกซ์ประชิด และอัลกอริทึมกราฟ BFS กับ DFS ส่วนอาร์เรย์ ลิสต์ เซต การค้นหา และการเรียงลำดับอยู่ในหัวข้อก่อนหน้า ยังไม่มีอัลกอริทึมกราฟแบบมีน้ำหนัก (เช่น ทางสั้นที่สุดแบบดิกสตรา ต้นไม้แผ่ทั่วที่น้อยที่สุด)
  - topic: computer.algorithms.data-structures
    indicators: [SDF-Data-Structures]
    coverage: full
    note: สแตก (ลิสต์ append/pop) คิว (deque) ดิกชันนารีและเซตในฐานะตารางแฮช การเลือกใช้ตามงาน และผลต่อสมรรถนะ (list.pop(0) กับ deque, ต้นไม้เอียง, ลิสต์กับเมทริกซ์ประชิด) โดยลิสต์และการประมวลผลสตริงสอนแล้วใน computer.programming.lists-strings ซึ่งเป็น prerequisite ทางอ้อม
  - topic: computer.algorithms.efficiency
    indicators: [AL-Complexity]
    coverage: partial
    note: บิ๊กโอเชิงรูปนัย (c และ n0) และหน่วยความจำ ต่อจาก searching-sorting ยังไม่มีปัญหาที่แก้ได้ยาก (P และ NP)
  - topic: computer.society.computing-careers-history
    indicators: [SEP-History, SEP-DEIA]
    coverage: partial
    note: ไทม์ไลน์และผู้บุกเบิกหลายคน (เอดา ทัวริง ฮอปเปอร์) แต่ยังไม่ครอบคลุมฮาร์ดแวร์ ซอฟต์แวร์ และองค์กรทั้งหมดในประวัติศาสตร์
  - topic: computer.society.green-computing
    indicators: [SEP-Sustainability, AR-SEP, SF-SEP]
    coverage: partial
    note: ความยั่งยืนของอุปกรณ์ผ่านวงจรชีวิต การซ่อม และการออกแบบประหยัดพลังงาน แต่เป็นการแนะนำระดับเบื้องต้น ยังไม่ครอบคลุมตัวชี้วัดการประเมินเชิงระบบ
  - topic: computer.data.visualization
    indicators: [GIT-Visualization]
    coverage: partial
    note: หลักการเลือกแผนภาพ ธรรมเนียมกราฟ และการออกแบบที่ทำให้เข้าใจผิด ยังไม่ครอบคลุมเทคนิคการแสดงผลเชิงโต้ตอบหรือกราฟขนาดใหญ่
  - topic: computer.design.usability-evaluation
    indicators: [HCI-Evaluation]
    coverage: full
    note: การประเมินเชิงฮิวริสติก การทดสอบกับผู้ใช้แบบคิดดังๆ ตัวชี้วัดอัตราสำเร็จ เวลา และ SUS การทดสอบ A/B (บทเรียนส่วนการประเมิน; โจทย์ p003 p005 p006 p007 p009 p012 p014 p016)
  - topic: computer.design.usability-evaluation
    indicators: [HCI-Design, HCI-User, HCI-SEP]
    coverage: partial
    note: รอบการปรับปรุงและการจัดลำดับแก้ไข และปัจจัยมนุษย์ที่ใช้กับการออกแบบ ยังไม่สอนการออกแบบระบบทั้งระบบตั้งแต่ต้น (โจทย์ p008 p011 p015)
  - topic: computer.society.data-ethics
    indicators: [DM-SEP, SEP-Privacy]
    coverage: partial
    note: จริยธรรมวิชาชีพในการจัดการข้อมูลครอบคลุมบางส่วน ยังไม่ครอบคลุมจรรยาบรรณวิชาชีพโดยละเอียด
  - topic: computer.society.digital-economy
    indicators: [SEP-Economies, OS-SEP]
    coverage: partial
    note: ครอบคลุมต้นทุนส่วนเพิ่มเกือบศูนย์ ผลของเครือข่าย แพลตฟอร์มสองฝั่ง ผูกขาด โมเดลรายได้ โอเพนซอร์ส การจ้างภายนอก งานบนแพลตฟอร์ม และนโยบายรองรับแรงงาน ยังไม่ลึกถึงการวิเคราะห์ตลาดเชิงทฤษฎีและนโยบายการแข่งขันโดยละเอียด
  - topic: computer.systems.iot
    indicators: [NC-Emerging]
    coverage: partial
    note: สถาปัตยกรรม IoT โพรโทคอล การประมวลผลที่ขอบ และ 5G กับ SDN ในระดับแนวคิด (บทเรียนส่วนสถาปัตยกรรม โพรโทคอล และเทคโนโลยีเครือข่ายใหม่) ยังไม่ลงลึกเทคโนโลยีเครือข่ายใหม่อื่น ๆ
  - topic: computer.systems.mobile-computing
    indicators: [NC-Mobility, SPD-Mobile]
    coverage: partial
    note: เครือข่ายเซลลูลาร์ สถานีฐาน การส่งต่อ การเปลี่ยนเครือข่ายและที่อยู่ IP และ Wi-Fi โรมมิ่ง (บทเรียนส่วนเครือข่ายและส่วนที่อยู่ IP; โจทย์ p001 p004 p014) ยังไม่ลงลึกโพรโทคอลการเคลื่อนที่ของ IP
  - topic: computer.systems.mobile-computing
    indicators: [SPD-Common]
    coverage: full
    note: ข้อควรคิดทุกแพลตฟอร์ม ได้แก่ การเข้าถึงได้ ภาษาและฟอนต์ไทย ความปลอดภัย และการอัปเดต (บทเรียนส่วนเรื่องที่ต้องคิดทุกแพลตฟอร์ม; โจทย์ p017)
  - topic: computer.systems.virtualization-cloud
    indicators: [OS-Virtualization, SF-Security, AR-Security]
    coverage: partial
    note: ไฮเปอร์ไวเซอร์ชนิดที่ 1 และ 2 และการเปรียบเทียบคอนเทนเนอร์กับเครื่องเสมือนในระดับแนวคิด ยังไม่ลงรายละเอียดการจัดสรรทรัพยากรภายในไฮเปอร์ไวเซอร์ (บทเรียนส่วนเครื่องเสมือนและคอนเทนเนอร์; ภาพ vm-vs-container)
  - topic: computer.systems.virtualization-cloud
    indicators: [OS-Protection]
    coverage: full
    note: การแยกกระบวนการ รายการควบคุมการเข้าถึง ความสามารถ แซนด์บ็อกซ์ และสิทธิ์น้อยที่สุด (บทเรียนส่วนการแยกในระบบปฏิบัติการ; ตัวอย่างแสดงวิธีทำการกำหนดสิทธิ์; โจทย์ p007 p011 p012)
  - topic: computer.ai.responsible-ai
    indicators: [AI-SEP]
    coverage: partial
    note: สอนหลักจริยธรรม AI (ความเป็นธรรม ความโปร่งใส การอธิบายได้ ความรับผิดชอบ ความเป็นส่วนตัว ความปลอดภัย) ผลต่อสังคม มนุษย์ในวงจร และกรอบกฎหมายแบบภาพรวม แต่ยังไม่สอนการประเมินระบบ AI เชิงเทคนิคอย่างลึก
  - topic: computer.data.sql-advanced
    indicators: [DM-Querying, DM-Processing, DM-Internals]
    coverage: partial
    note: สอนการสร้างคำสั่งสืบค้นด้วย GROUP BY HAVING ฟังก์ชันรวม LEFT JOIN และการจัดการ NULL (บทเรียนและโจทย์ p001 ถึง p010) แต่ผู้เรียนเลือกคำสั่ง ไล่ผล และจำลองด้วย Python เท่านั้น ไม่ได้เขียนคำสั่ง SQL เองเพราะแอปไม่มีตัวรัน SQL
  - topic: computer.networks.addressing-routing
    indicators: [NC-Routing]
    coverage: partial
    note: สอน CIDR การคำนวณซับเน็ต การเลือกเส้นทางแบบ longest prefix match และแนวคิดเวกเตอร์ระยะทางกับสถานะลิงก์ ระดับแนะนำ ไม่รวมอัลกอริทึมเส้นทางเชิงลึกและการกำหนดค่าโพรโทคอลจริง
  - topic: computer.security.hashing-authentication
    indicators: [SEC-Crypto]
    coverage: partial
    note: สอนฟังก์ชันแฮช ซอลต์ PBKDF2 HMAC ทบทวนลายมือชื่อดิจิทัลและ TOTP ในระดับแนวคิด ไม่ครอบคลุมรหัสลับแบบดั้งเดิมทั้งหมด (สอนแล้วในหัวข้อการเข้ารหัส) และไม่ลงลึกการเข้ารหัสสมมาตรกับกุญแจสาธารณะเชิงคณิตศาสตร์
  - topic: computer.security.risk-policy
    indicators: [SEC-Governance, SEP-Security]
    coverage: partial
    note: สอนการประเมินความเสี่ยง ทางจัดการ นโยบาย และการเข้าถึงตามบทบาท แต่ยังไม่สอนโครงสร้างการกำกับดูแลขององค์กรและการตรวจสอบเชิงระบบ
  - topic: computer.society.computing-ethics
    indicators: [SEP-Ethical-Analysis]
    coverage: full
    note: สอนกรอบวิเคราะห์เชิงจริยธรรมสี่แบบ (ผลลัพธ์นิยม หน้าที่นิยม คุณธรรม สัญญาประชาคม) และขั้นตอนวิเคราะห์ผู้มีส่วนได้เสีย โจทย์ p001 p002 p006
  - topic: computer.society.computing-ethics
    indicators: [SEP-Professional-Ethics, SEP-Context, AL-SEP, HCI-Accountability]
    coverage: partial
    note: สอนหลักความรับผิดชอบของผู้ปฏิบัติงานและการรายงานปัญหาจากจรรยาบรรณทั่วไป (p005 p019) แต่ยังไม่ได้วิเคราะห์กรณีจรรยาบรรณฉบับเต็มทีละข้อ ข้อความเฉพาะต้องตรวจก่อนเผยแพร่
  - topic: computer.theory.discrete-structures
    indicators: [MSF-Discrete]
    coverage: partial
    note: สอนการพิสูจน์ (ตรง แย้งสลับที่ ข้อขัดแย้ง ตัวอย่างค้าน) อุปนัยทั้งเชิงคณิตศาสตร์และเชิงโครงสร้าง ความสัมพันธ์และสมบัติ สมมูล อันดับบางส่วน ฟังก์ชันหนึ่งต่อหนึ่งและทั่วถึง หลักรังนกพิราบ เลขคณิตมอดุลาร์ ห.ร.ม. แบบยุคลิด และต้นไม้ แต่ไม่ครอบคลุมตรรกะและทฤษฎีกราฟ/ผลรวมเชิงลึกทั้งหมดของหลักสูตร
  - topic: computer.web.web-apps
    indicators: [SPD-Web]
    coverage: partial
    note: สอนฝั่งลูกข่ายกับฝั่งแม่ข่ายด้วย JavaScript DOM ตัวจัดการเหตุการณ์ HTTP เมธอดและรหัสสถานะ JSON REST คุกกี้และเซสชัน แต่ไม่ได้สร้างเว็บแอปเต็มรูปแบบ และกรอบงานสอนเพียงระดับแนวคิด
