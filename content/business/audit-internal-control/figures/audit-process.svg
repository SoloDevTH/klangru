<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370" font-family="sans-serif" font-size="14">
  <title>ขั้นตอนการสอบบัญชีและประเภทความเห็นในรายงานผู้สอบบัญชี</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="860" height="370" fill="#ffffff"/>
  <rect x="8.0" y="20.0" width="130.0" height="96.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="73.0" y="63.3" text-anchor="middle" fill="#1f2937" font-size="12.5" font-weight="bold">1. รับงาน</text>
  <text x="73.0" y="80.8" text-anchor="middle" fill="#1f2937" font-size="11.5">ตรวจความเป็นอิสระ</text>
  <line x1="138.0" y1="68.0" x2="148.0" y2="68.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="150.0" y="20.0" width="130.0" height="96.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="215.0" y="54.5" text-anchor="middle" fill="#1f2937" font-size="12.5" font-weight="bold">2. วางแผน</text>
  <text x="215.0" y="72.0" text-anchor="middle" fill="#1f2937" font-size="11.5">เข้าใจกิจการ</text>
  <text x="215.0" y="89.5" text-anchor="middle" fill="#1f2937" font-size="11.5">กำหนดสาระสำคัญ</text>
  <line x1="280.0" y1="68.0" x2="290.0" y2="68.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="292.0" y="20.0" width="130.0" height="96.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="357.0" y="54.5" text-anchor="middle" fill="#1f2937" font-size="12.5" font-weight="bold">3. ประเมิน</text>
  <text x="357.0" y="72.0" text-anchor="middle" fill="#1f2937" font-size="11.5">ความเสี่ยงที่งบ</text>
  <text x="357.0" y="89.5" text-anchor="middle" fill="#1f2937" font-size="11.5">อาจผิดพลาด</text>
  <line x1="422.0" y1="68.0" x2="432.0" y2="68.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="434.0" y="20.0" width="130.0" height="96.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="499.0" y="54.5" text-anchor="middle" fill="#1f2937" font-size="12.5" font-weight="bold">4. ตอบสนอง</text>
  <text x="499.0" y="72.0" text-anchor="middle" fill="#1f2937" font-size="11.5">ทดสอบการควบคุม</text>
  <text x="499.0" y="89.5" text-anchor="middle" fill="#1f2937" font-size="11.5">ตรวจเนื้อหาสาระ</text>
  <line x1="564.0" y1="68.0" x2="574.0" y2="68.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="576.0" y="20.0" width="130.0" height="96.0" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="641.0" y="54.5" text-anchor="middle" fill="#1f2937" font-size="12.5" font-weight="bold">5. สรุปผล</text>
  <text x="641.0" y="72.0" text-anchor="middle" fill="#1f2937" font-size="11.5">ประเมินข้อผิดพลาด</text>
  <text x="641.0" y="89.5" text-anchor="middle" fill="#1f2937" font-size="11.5">ที่พบ</text>
  <line x1="706.0" y1="68.0" x2="716.0" y2="68.0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="718.0" y="20.0" width="130.0" height="96.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="783.0" y="54.5" text-anchor="middle" fill="#1f2937" font-size="12.5" font-weight="bold">6. รายงาน</text>
  <text x="783.0" y="72.0" text-anchor="middle" fill="#1f2937" font-size="11.5">แสดงความเห็น</text>
  <text x="783.0" y="89.5" text-anchor="middle" fill="#1f2937" font-size="11.5">ต่องบการเงิน</text>
  <text x="430.0" y="150.0" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="bold">ความเห็นของผู้สอบบัญชีขึ้นกับคำถามสองข้อ</text>
  <rect x="70" y="165" width="720" height="44" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/>
  <text x="78.0" y="191.4" text-anchor="start" fill="#1f2937" font-size="12.5" font-weight="bold"></text>
  <line x1="330" y1="165" x2="330" y2="209" stroke="#1f2937" stroke-width="1"/>
  <text x="445.0" y="191.4" text-anchor="middle" fill="#1f2937" font-size="12.5" font-weight="bold">ผลกระทบมีสาระสำคัญ แต่ไม่แพร่หลาย</text>
  <line x1="560" y1="165" x2="560" y2="209" stroke="#1f2937" stroke-width="1"/>
  <text x="675.0" y="191.4" text-anchor="middle" fill="#1f2937" font-size="12.5" font-weight="bold">มีสาระสำคัญและแพร่หลาย</text>
  <rect x="70" y="209" width="720" height="44" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="78.0" y="235.4" text-anchor="start" fill="#1f2937" font-size="12.5">งบการเงินแสดงข้อมูลขัดต่อข้อเท็จจริง</text>
  <line x1="330" y1="209" x2="330" y2="253" stroke="#1f2937" stroke-width="1"/>
  <text x="445.0" y="235.4" text-anchor="middle" fill="#1f2937" font-size="12.5">แบบมีเงื่อนไข</text>
  <line x1="560" y1="209" x2="560" y2="253" stroke="#1f2937" stroke-width="1"/>
  <text x="675.0" y="235.4" text-anchor="middle" fill="#1f2937" font-size="12.5">แบบงบการเงินไม่ถูกต้อง</text>
  <rect x="70" y="253" width="720" height="44" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
  <text x="78.0" y="279.4" text-anchor="start" fill="#1f2937" font-size="12.5">หาหลักฐานที่เหมาะสมอย่างเพียงพอไม่ได้</text>
  <line x1="330" y1="253" x2="330" y2="297" stroke="#1f2937" stroke-width="1"/>
  <text x="445.0" y="279.4" text-anchor="middle" fill="#1f2937" font-size="12.5">แบบมีเงื่อนไข</text>
  <line x1="560" y1="253" x2="560" y2="297" stroke="#1f2937" stroke-width="1"/>
  <text x="675.0" y="279.4" text-anchor="middle" fill="#1f2937" font-size="12.5">ไม่แสดงความเห็น</text>
  <text x="430.0" y="322.0" text-anchor="middle" fill="#166534" font-size="13" font-weight="bold">ถ้าไม่พบข้อผิดพลาดที่มีสาระสำคัญและหาหลักฐานได้เพียงพอ → ความเห็นแบบไม่มีเงื่อนไข</text>
  <text x="430.0" y="350.0" text-anchor="middle" fill="#6b7280" font-size="12">ผู้สอบบัญชีให้ความเชื่อมั่นอย่างสมเหตุสมผล ไม่ใช่การรับประกันว่าไม่มีข้อผิดพลาดหรือการทุจริตเลย</text>
</svg>
