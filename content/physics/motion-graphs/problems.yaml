      - "เส้นตัดกันเมื่อ $x_1 = x_2$"
      - "หรือคิดว่าระยะห่าง $300\\ \\mathrm{m}$ ลดลงด้วยอัตรา $20 + 10$ เมตรต่อวินาที"
