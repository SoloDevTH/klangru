<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="sans-serif">
<title>ตัวการันต์ไม่ออกเสียง</title>
<defs></defs>
<rect x="0" y="0" width="860" height="330" fill="#fff"/>
<text x="20.0" y="34.0" font-size="21" text-anchor="start" fill="#1f5fbf" font-weight="bold">ตัวการันต์ (มีไม้ทัณฑฆาตกำกับ) ไม่ออกเสียง</text>
<text x="840.0" y="34.0" font-size="16" text-anchor="end" fill="#c0392b" font-weight="normal">สีแดง = ไม่ออกเสียง</text>
<rect x="30.0" y="70.0" width="250.0" height="105.0" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="155" y="122" font-size="38" text-anchor="middle"><tspan fill="#111">สัต</tspan><tspan fill="#c0392b">ว์</tspan></text>
<text x="155.0" y="158.0" font-size="19" text-anchor="middle" fill="#1f5fbf" font-weight="normal">อ่านว่า สัด</text>
<rect x="305.0" y="70.0" width="250.0" height="105.0" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="430" y="122" font-size="38" text-anchor="middle"><tspan fill="#111">จัน</tspan><tspan fill="#c0392b">ทร์</tspan></text>
<text x="430.0" y="158.0" font-size="19" text-anchor="middle" fill="#1f5fbf" font-weight="normal">อ่านว่า จัน</text>
<rect x="580.0" y="70.0" width="250.0" height="105.0" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="705" y="122" font-size="38" text-anchor="middle"><tspan fill="#111">ศุก</tspan><tspan fill="#c0392b">ร์</tspan></text>
<text x="705.0" y="158.0" font-size="19" text-anchor="middle" fill="#1f5fbf" font-weight="normal">อ่านว่า สุก</text>
<rect x="30.0" y="195.0" width="250.0" height="105.0" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="155" y="247" font-size="38" text-anchor="middle"><tspan fill="#111">ศัก</tspan><tspan fill="#c0392b">ดิ์</tspan></text>
<text x="155.0" y="283.0" font-size="19" text-anchor="middle" fill="#1f5fbf" font-weight="normal">อ่านว่า สัก</text>
<rect x="305.0" y="195.0" width="250.0" height="105.0" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="430" y="247" font-size="38" text-anchor="middle"><tspan fill="#111">พัน</tspan><tspan fill="#c0392b">ธุ์</tspan></text>
<text x="430.0" y="283.0" font-size="19" text-anchor="middle" fill="#1f5fbf" font-weight="normal">อ่านว่า พัน</text>
<rect x="580.0" y="195.0" width="250.0" height="105.0" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="705" y="247" font-size="38" text-anchor="middle"><tspan fill="#111">กษัต</tspan><tspan fill="#c0392b">ริย์</tspan></text>
<text x="705.0" y="283.0" font-size="19" text-anchor="middle" fill="#1f5fbf" font-weight="normal">อ่านว่า กะ-สัด</text>
</svg>
