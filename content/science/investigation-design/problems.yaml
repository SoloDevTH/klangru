- id: science.inquiry.investigation-design.p016
  topics:
  - science.inquiry.investigation-design
  difficulty: 5
  type: mcq
  stem: มิ้นท์วางแผนทดสอบว่า "แสงมีผลต่อการงอกของเมล็ดถั่วเขียวหรือไม่" โดยวางจานที่ 1 ริมหน้าต่างและรดน้ำทุกเช้า วางจานที่ 2 ในตู้มืดและรดน้ำเมื่อนึกได้ จานแรกใส่ 20 เมล็ด จานที่สองใส่ 5 เมล็ด แผนนี้มีข้อบกพร่องอะไรบ้าง (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: การรดน้ำไม่เท่ากันในสองจาน
    correct: true
    feedback: ถูก น้ำเป็นอีกตัวแปรที่มีผลต่อการงอก
  - id: b
    text: จำนวนเมล็ดไม่เท่ากัน ทำให้เปรียบเทียบได้ยาก
    correct: true
    feedback: ถูก ควรใช้จำนวนเท่ากันและคิดเป็นร้อยละ
  - id: c
    text: อุณหภูมิริมหน้าต่างกับในตู้อาจต่างกัน
