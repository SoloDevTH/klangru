  - id: chemistry.equilibrium.chemical-equilibrium.p019
    topics: [chemistry.equilibrium.chemical-equilibrium]
    difficulty: 5
    type: numeric
    stem: "ใส่ $\\mathrm{H_2}$ 0.200 mol/L และ $\\mathrm{I_2}$ 0.100 mol/L ในภาชนะปิดที่ 430 °C ($K_c = 54.3$ สำหรับ $\\mathrm{H_2 + I_2 \\rightleftharpoons 2HI}$) ที่ภาวะสมดุลมี HI กี่ mol/L"
    answer: { value: 0.188, unit: mol/L, tolerance: 0.002 }
    misconceptions:
      - { match: 0.2, feedback: "คิดว่า I₂ ถูกใช้หมด แต่ปฏิกิริยาผันกลับได้ ที่สมดุลยังเหลือ I₂ อยู่บ้าง" }
      - { match: 0.0939, feedback: "นี่คือค่า x ความเข้มข้นของ HI คือ 2x" }
    hints:
      - "ตาราง ICE: H₂ เหลือ 0.200 − x, I₂ เหลือ 0.100 − x, HI = 2x"
      - "$\\dfrac{4x^2}{(0.200 - x)(0.100 - x)} = 54.3$ จัดเป็นสมการกำลังสอง แล้วเลือกรากที่ x < 0.100"
    solution: "$4x^2 = 54.3(0.0200 - 0.300x + x^2)$ ได้ $50.3x^2 - 16.29x + 1.086 = 0$ รากที่ใช้ได้คือ $x = 0.0939$ (อีกรากคือ 0.230 มากกว่า 0.100 ใช้ไม่ได้) $[\\mathrm{HI}] = 2x =$ **0.188 mol/L** ตรวจ: $0.1878^2/(0.1061 \\times 0.00612) \\approx 54.3$"
    license: CC-BY-SA-4.0
    ai_assisted: true
