<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="sans-serif">
<title>ระบบหายใจ ระบบไหลเวียนโลหิต และระบบสืบพันธุ์ทำงานร่วมกัน</title>
<rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="340.0" y="26.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">สามระบบช่วยให้ร่างกายมีชีวิต เติบโต และพัฒนา</text>
<rect x="30.0" y="50.0" width="190.0" height="120.0" rx="10" fill="#dcecf9" stroke="#333" stroke-width="1.5"/>
<text x="125.0" y="74.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ระบบหายใจ</text>
<text x="125.0" y="96.0" font-size="13" text-anchor="middle" fill="#222">จมูก หลอดลม ปอด</text>
<text x="125.0" y="114.0" font-size="13" text-anchor="middle" fill="#222">รับออกซิเจนเข้า</text>
<text x="125.0" y="132.0" font-size="13" text-anchor="middle" fill="#222">ขับคาร์บอนไดออกไซด์ออก</text>
<rect x="250.0" y="50.0" width="190.0" height="120.0" rx="10" fill="#f9dede" stroke="#333" stroke-width="1.5"/>
<text x="345.0" y="74.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ระบบไหลเวียนโลหิต</text>
<text x="345.0" y="96.0" font-size="13" text-anchor="middle" fill="#222">หัวใจ หลอดเลือด เลือด</text>
<text x="345.0" y="114.0" font-size="13" text-anchor="middle" fill="#222">ลำเลียงออกซิเจน</text>
<text x="345.0" y="132.0" font-size="13" text-anchor="middle" fill="#222">สารอาหาร และของเสีย</text>
<rect x="470.0" y="50.0" width="180.0" height="120.0" rx="10" fill="#eaf6e3" stroke="#333" stroke-width="1.5"/>
<text x="560.0" y="74.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">เซลล์ทั่วร่างกาย</text>
<text x="560.0" y="96.0" font-size="13" text-anchor="middle" fill="#222">ใช้ออกซิเจนและสารอาหาร</text>
<text x="560.0" y="114.0" font-size="13" text-anchor="middle" fill="#222">สร้างพลังงาน</text>
<text x="560.0" y="132.0" font-size="13" text-anchor="middle" fill="#222">เพื่อเคลื่อนไหวและเติบโต</text>
<line x1="222.0" y1="95.0" x2="248.0" y2="95.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="248.0" y1="125.0" x2="222.0" y2="125.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="235.0" y="88.0" font-size="11" text-anchor="middle" fill="#111">O₂</text>
<text x="235.0" y="142.0" font-size="11" text-anchor="middle" fill="#111">CO₂</text>
<line x1="442.0" y1="95.0" x2="468.0" y2="95.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="468.0" y1="125.0" x2="442.0" y2="125.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="250.0" y="230.0" width="190.0" height="120.0" rx="10" fill="#f3e6f7" stroke="#333" stroke-width="1.5"/>
<text x="345.0" y="254.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ระบบสืบพันธุ์</text>
<text x="345.0" y="276.0" font-size="13" text-anchor="middle" fill="#222">อวัยวะสืบพันธุ์</text>
<text x="345.0" y="294.0" font-size="13" text-anchor="middle" fill="#222">สร้างเซลล์สืบพันธุ์</text>
<text x="345.0" y="312.0" font-size="13" text-anchor="middle" fill="#222">และฮอร์โมนเพศ</text>
<line x1="345.0" y1="228.0" x2="345.0" y2="172.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="352.0" y="205.0" font-size="12" text-anchor="start" fill="#111">ฮอร์โมนเดินทางไปกับเลือด</text>
<rect x="470.0" y="230.0" width="180.0" height="120.0" rx="10" fill="#fff4d6" stroke="#333" stroke-width="1.5"/>
<text x="560.0" y="254.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">วัยรุ่น</text>
<text x="560.0" y="276.0" font-size="13" text-anchor="middle" fill="#222">ร่างกายเปลี่ยนแปลง</text>
<text x="560.0" y="294.0" font-size="13" text-anchor="middle" fill="#222">สูงขึ้น โตเป็นผู้ใหญ่</text>
<text x="560.0" y="312.0" font-size="13" text-anchor="middle" fill="#222">พร้อมมีลูกได้ในอนาคต</text>
<line x1="442.0" y1="290.0" x2="468.0" y2="290.0" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30.0" y="230.0" width="190.0" height="120.0" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
<text x="125.0" y="254.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ดูแลทั้งสามระบบ</text>
<text x="125.0" y="276.0" font-size="13" text-anchor="middle" fill="#222">ออกกำลังกาย ไม่สูบบุหรี่</text>
<text x="125.0" y="294.0" font-size="13" text-anchor="middle" fill="#222">เลี่ยงฝุ่นควัน นอนพอ</text>
<text x="125.0" y="312.0" font-size="13" text-anchor="middle" fill="#222">รักษาความสะอาด</text>
<text x="340.0" y="385.0" font-size="12" text-anchor="middle" fill="#555">แผนภาพอย่างง่าย ไม่ใช่ภาพกายวิภาค</text>
</svg>
