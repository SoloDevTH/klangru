problems:
  - id: computer.ai.search-planning.p001
    topics: [computer.ai.search-planning]
    difficulty: 1
    type: mcq
    stem: "ข้อใดอธิบาย **ปริภูมิสถานะ** (state space) ได้ถูกต้อง"
    choices:
      - { id: a, text: "ตัวเลขที่บอกต้นทุนรวมของเส้นทางที่ดีที่สุด", feedback: "นั่นคือต้นทุนของคำตอบ ไม่ใช่ปริภูมิสถานะ" }
      - { id: b, text: "เซตของสถานะที่เป็นไปได้ทั้งหมดพร้อมการกระทำที่เปลี่ยนสถานะจากหนึ่งไปอีกสถานะ", correct: true }
      - { id: c, text: "โค้ดที่ใช้เก็บคิวของ BFS", feedback: "คิวเป็นโครงสร้างข้อมูลที่ใช้ค้นหา ไม่ใช่ปริภูมิสถานะ" }
      - { id: d, text: "จำนวนเซนเซอร์ที่เอเจนต์มี", feedback: "เซนเซอร์เกี่ยวกับการรับรู้ ไม่ได้นิยามปริภูมิสถานะ" }
    hints:
      - "คิดถึงสิ่งที่ต้องค้นหาผ่านมัน"
      - "ปริภูมิสถานะประกอบด้วยสถานะและการเชื่อมระหว่างสถานะ"
      - "เลือกข้อที่มีทั้งสถานะและการกระทำ"
    solution: "ปริภูมิสถานะคือชุดของสถานะทั้งหมดที่เป็นไปได้และการกระทำที่ใช้เปลี่ยนสถานะ การค้นหาคือการเดินไปในปริภูมินี้จนถึงเป้าหมาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.search-planning.p002
    topics: [computer.ai.search-planning]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนการแก้ปัญหาค้นหาของเอเจนต์ จากขั้นแรกไปขั้นสุดท้าย"
    items:
      - "นิยามสถานะเริ่มต้น การกระทำ และการทดสอบเป้าหมาย"
      - "กำหนดต้นทุนของแต่ละการกระทำ"
      - "ขยายสถานะที่อยู่ในขอบเขตการค้นหาทีละสถานะ"
      - "เก็บเส้นทางที่ถึงเป้าหมายแล้วคืนลำดับการกระทำ"
      - "ดำเนินการตามลำดับการกระทำนั้นในสภาพแวดล้อมจริง"
    hints:
      - "ก่อนค้นหาต้องรู้ก่อนว่าปัญหาคืออะไร"
      - "ต้นทุนต้องรู้ก่อนจะเลือกเส้นทางที่ดีที่สุด"
      - "ขั้นสุดท้ายคือการนำแผนไปทำจริง"
    solution: "เริ่มจากนิยามปัญหาและต้นทุน แล้วขยายสถานะทีละสถานะจนเจอเป้าหมาย เก็บเส้นทาง และลงมือทำตามแผน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.search-planning.p003
    topics: [computer.ai.search-planning]
    difficulty: 1
    type: numeric
    stem: "บนกริดที่ไม่มีกำแพง เอเจนต์เดินได้เฉพาะขึ้น ลง ซ้าย และขวาทีละ 1 ช่อง จากช่อง (0, 0) ไปช่อง (3, 2) ต้องใช้อย่างน้อยกี่ก้าว"
    answer: { value: 5, tolerance: 0, unit: "ก้าว" }
    misconceptions:
      - { match: 6, feedback: "ใช้การคูณ 3 × 2 แทนการบวกระยะในแต่ละแกน การเดินต้องรวมระยะแนวนอนกับแนวตั้ง" }
    hints:
      - "นับระยะที่ต้องไปในแนวนอนก่อน"
      - "จากนั้นนับระยะที่ต้องไปในแนวตั้ง"
      - "นำสองระยะมารวมกัน"
    solution: "ต้องไปแนวนอน 3 ช่องและแนวตั้ง 2 ช่อง รวม 3 + 2 = 5 ก้าว ซึ่งเป็นระยะแมนฮัตตัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.search-planning.p004
    topics: [computer.ai.search-planning]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นสภาพแวดล้อมที่สังเกตได้ทั้งหมดและกำหนดได้ (deterministic)"
    choices:
      - { id: a, text: "กระดานหมากรุก ซึ่งทั้งสองฝ่ายเห็นตำแหน่งทุกตัวและผลของการเดินแต่ละครั้งแน่นอน", correct: true }
      - { id: b, text: "การเล่นไพ่โป๊กเกอร์ที่มองไม่เห็นไพ่ของคู่แข่ง", feedback: "ไพ่ของคู่แข่งมองไม่เห็น จึงสังเกตได้เพียงบางส่วน" }
      - { id: c, text: "การขับรถบนถนนที่มีคนและรถเคลื่อนที่อยู่ตลอดเวลา", feedback: "สภาพแวดล้อมมีการเปลี่ยนแปลงตลอดเวลา จึงไม่ใช่แบบคงที่" }
      - { id: d, text: "การโยนลูกเต๋าเพื่อเดินในเกมกระดาน", feedback: "ผลของลูกเต๋าสุ่ม จึงไม่ใช่แบบกำหนดได้" }
    hints:
      - "ลองดูว่าแต่ละตัวเลือกมองเห็นทุกอย่างหรือไม่"
      - "ตรวจว่าผลของการกระทำแน่นอนหรือมีความสุ่ม"
      - "เลือกข้อที่ทั้งเห็นทุกอย่างและผลแน่นอน"
    solution: "หมากรุกเห็นตำแหน่งทั้งหมดบนกระดาน และผลของการเดินแต่ละครั้งแน่นอน จึงเป็นสภาพแวดล้อมที่สังเกตได้ทั้งหมดและกำหนดได้ ตัวเลือกอื่นมีบางส่วนที่ซ่อนหรือมีการสุ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.search-planning.p005
    topics: [computer.ai.search-planning]
    difficulty: 2
    type: numeric
    stem: "กราฟมีจุด S, A, B, C, D, E และ G โดยเชื่อมขอบดังนี้ S–A, S–B, A–C, B–D, C–E, D–E และ E–G จากจุด S ไปจุด G ด้วยการเดินตามขอบ ต้องใช้จำนวนขอบอย่างน้อยเท่าใด"
    answer: { value: 4, tolerance: 0, unit: "ขอบ" }
    misconceptions:
      - { match: 5, feedback: "นับจำนวนจุดบนเส้นทาง (S, A, C, E, G) แทนจำนวนขอบ" }
    hints:
      - "หาเส้นทางที่เริ่มจาก S และถึง G"
      - "ทุกเส้นทางต้องผ่าน E ก่อนถึง G ลองดูทั้งทางที่ผ่าน A และทางที่ผ่าน B"
      - "นับจำนวนขอบของเส้นทางที่สั้นที่สุด"
    solution: "เส้นทาง S–A–C–E–G และ S–B–D–E–G มีเส้นทางละ 4 ขอบ ไม่มีเส้นทางที่สั้นกว่า จึงต้องใช้อย่างน้อย 4 ขอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.search-planning.p006
    topics: [computer.ai.search-planning]
    difficulty: 2
    type: numeric
    stem: "บนกริดที่เดินได้สี่ทิศทาง ฮิวริสติกแมนฮัตตันจากช่อง (2, 5) ถึงเป้าหมาย (6, 1) มีค่าเท่าใด"
    answer: { value: 8, tolerance: 0 }
    misconceptions:
      - { match: 4, feedback: "คิดเพียงระยะแนวนอนหรือแนวตั้งอย่างเดียว ต้องรวมทั้งสองแกน" }
    hints:
      - "ระยะแมนฮัตตันคือผลรวมของค่าสัมบูรณ์ของผลต่างในแต่ละแกน"
      - "แกน x ต่างกัน 4 และแกน y ต่างกัน 4"
      - "นำ 4 กับ 4 มารวมกัน"
    solution: "h = |2 − 6| + |5 − 1| = 4 + 4 = 8"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.search-planning.p007
    topics: [computer.ai.search-planning]
    difficulty: 2
    type: match
    stem: "จับคู่วิธีค้นหากับลักษณะการทำงาน"
    pairs:
      - { left: "BFS", right: "ใช้คิวขยายทีละระดับ ได้เส้นทางสั้นที่สุดเมื่อทุกก้าวมีต้นทุนเท่ากัน" }
      - { left: "DFS", right: "ใช้สแตกลงลึกไปก่อน อาจได้เส้นทางยาวที่ไม่ใช่สั้นที่สุด" }
      - { left: "UCS", right: "ขยายสถานะที่มีต้นทุนรวมต่ำสุดก่อน" }
      - { left: "A*", right: "เลือกสถานะที่ค่า g + h ต่ำสุด โดยใช้ฮิวริสติกที่ยอมรับได้" }
    hints:
      - "ดูว่าแต่ละวิธีเลือกขยายสถานะจากอะไร"
      - "สแตกทำงานแบบเข้าหลังออกก่อน"
      - "A* ใช้ทั้งต้นทุนที่จ่ายแล้วและการประมาณที่เหลือ"
    solution: "BFS ขยายทีละระดับด้วยคิว DFS ลงลึกด้วยสแตก UCS เลือกต้นทุนรวมต่ำสุด และ A* ใช้ g + h ที่มีฮิวริสติกยอมรับได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.search-planning.p008
    topics: [computer.ai.search-planning]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ฮิวริสติกที่ยอมรับได้ (admissible) มีคุณสมบัติใดบ้าง (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ไม่เคยประมาณต้นทุนที่เหลือเกินค่าจริง", correct: true }
      - { id: b, text: "เมื่อใช้กับ A* จะได้เส้นทางที่ต้นทุนต่ำสุด", correct: true }
      - { id: c, text: "ต้องให้ค่าศูนย์เสมอ", feedback: "ฮิวริสติกที่ให้ศูนย์เสมอยอมรับได้ก็จริง แต่ไม่ใช่คุณสมบัติที่นิยาม" }
      - { id: d, text: "ต้องมีค่ามากกว่าต้นทุนจริงเสมอ", feedback: "นั่นทำให้ประมาณเกินจริง ซึ่งไม่ยอมรับได้" }
    hints:
      - "ฮิวริสติกที่ดีต้องไม่มองโลกในแง่ดีเกินจริง"
      - "คิดว่าการประมาณเกินทำให้ A* พลาดเส้นทางที่ดีที่สุดได้อย่างไร"
      - "เลือกข้อที่บอกว่าไม่ประมาณเกินและการันตีผลลัพธ์"
    solution: "ฮิวริสติกที่ยอมรับได้คือไม่ประมาณเกินต้นทุนจริงที่เหลือ เมื่อใช้กับ A* จะได้เส้นทางที่ต้นทุนต่ำสุด ตัวเลือกที่ผิดคือการบังคับให้เป็นศูนย์หรือให้มากกว่าค่าจริง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.search-planning.p009
    topics: [computer.ai.search-planning]
    difficulty: 3
    type: numeric
    stem: "ช่องหนึ่งในการค้นหาแบบ A* มีต้นทุนที่จ่ายแล้ว g = 5 และฮิวริสติกที่เหลือ h = 4 ค่า f = g + h เท่ากับเท่าใด"
    answer: { value: 9, tolerance: 0 }
    misconceptions:
      - { match: 4, feedback: "ใช้เฉพาะ h โดยลืมบวกต้นทุนที่จ่ายแล้ว g" }
    hints:
      - "f คือผลรวมของ g และ h"
      - "g คือต้นทุนที่จ่ายจากจุดเริ่มถึงช่องนี้แล้ว"
      - "นำ 5 กับ 4 มารวมกัน"
    solution: "f = g + h = 5 + 4 = 9"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.search-planning.p010
    topics: [computer.ai.search-planning]
    difficulty: 3
    type: numeric
    stem: "กริดมี 4 คอลัมน์และ 3 แถว ใช้พิกัด (คอลัมน์, แถว) นับจาก 0 ช่องที่เป็นกำแพงคือ (1, 0) และ (1, 1) จุดเริ่มคือ (0, 0) เป้าหมายคือ (3, 0) เดินได้ขึ้น ลง ซ้าย ขวา ทีละ 1 ช่อง เส้นทางที่สั้นที่สุดยาวกี่ก้าว"
    answer: { value: 7, tolerance: 0, unit: "ก้าว" }
    misconceptions:
      - { match: 3, feedback: "คำนวณระยะแมนฮัตตันโดยไม่สนใจกำแพง เส้นทางจริงต้องอ้อมไป" }
    hints:
      - "ลองหาเส้นทางอ้อมลงไปแถวล่างที่ไม่มีกำแพง"
      - "กำแพงทำให้ต้องอ้อมจากแถว 0 ไปแถว 2 ก่อน"
      - "นับก้าวทั้งหมดของเส้นทางอ้อมที่สั้นที่สุด"
    solution: "เส้นทางหนึ่งคือ (0,0)→(0,1)→(0,2)→(1,2)→(2,2)→(2,1)→(2,0)→(3,0) มี 7 ก้าว ไม่มีเส้นทางใดที่สั้นกว่านี้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.search-planning.p011
    topics: [computer.ai.search-planning]
    difficulty: 3
    type: numeric
    stem: "เอเจนต์หนึ่งตัวและกล่องหนึ่งกล่องอยู่ในกริด 5 คูณ 5 ที่ไม่มีกำแพง ตำแหน่งของเอเจนต์และกล่องต้องไม่ซ้อนกัน มีสถานะที่เป็นไปได้ทั้งหมดกี่สถานะ"
    answer: { value: 600, tolerance: 0, unit: "สถานะ" }
    misconceptions:
      - { match: 625, feedback: "คิดว่ากล่องและเอเจนต์วางซ้อนกันได้ จึงคูณ 25 × 25 แต่โจทย์ห้ามซ้อนกัน" }
    hints:
      - "กริด 5 คูณ 5 มี 25 ช่อง"
      - "เอเจนต์เลือกช่องได้ 25 ช่อง กล่องเลือกได้เหลือ 24 ช่อง"
      - "นำ 25 คูณ 24"
    solution: "เอเจนต์มี 25 ตำแหน่งและกล่องมี 24 ตำแหน่งที่ไม่ซ้อนกัน จึงมี 25 × 24 = 600 สถานะ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.search-planning.p012
    topics: [computer.ai.search-planning]
    difficulty: 3
    type: mcq
    stem: "เหตุใด BFS จึงได้เส้นทางที่สั้นที่สุดเมื่อทุกก้าวมีต้นทุนเท่ากัน"
    choices:
      - { id: a, text: "เพราะขยายสถานะตามระดับความลึก ระดับแรกที่พบเป้าหมายจึงมีจำนวนก้าวน้อยที่สุด", correct: true }
      - { id: b, text: "เพราะเลือกสถานะที่ใกล้เป้าหมายที่สุดเสมอ", feedback: "นั่นคือการค้นหาแบบละโมบ ซึ่งไม่รับประกันเส้นทางสั้นที่สุด" }
      - { id: c, text: "เพราะใช้สแตกและเดินลึกไปเรื่อย ๆ", feedback: "นั่นคือ DFS ซึ่งไม่รับประกันเส้นทางสั้นที่สุด" }
      - { id: d, text: "เพราะเดาเส้นทางแบบสุ่มแล้วเลือกเส้นทางแรกที่พบ", feedback: "การสุ่มไม่รับประกันเส้นทางสั้นที่สุด" }
    hints:
      - "ลองนึกว่า BFS ขยายสถานะทีละระดับอย่างไร"
      - "ถ้าระดับหนึ่งยังไม่พบเป้าหมาย ระดับถัดไปยังไม่ถูกพิจารณา"
      - "เลือกข้อที่พูดถึงการขยายตามระดับ"
    solution: "BFS ขยายทุกสถานะในระดับ d ก่อนระดับ d+1 เมื่อทุกก้าวมีต้นทุนเท่ากัน สถานะแรกที่พบเป้าหมายจึงอยู่ที่ระดับต่ำสุดเสมอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.search-planning.p013
    topics: [computer.ai.search-planning]
    difficulty: 4
    type: numeric
