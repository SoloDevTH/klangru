  - id: math.ef.p016
    topics: [math.functions.exponential]
    difficulty: 4
    type: numeric
    stem: "เงินฝากเติบโตตาม $A = 1000(1.01)^{12t}$ บาท เมื่อ $t$ คือจำนวนปี (ดอกเบี้ย 1% ต่อเดือน ทบต้นทุกเดือน) ในหนึ่งปี เงินเพิ่มขึ้นกี่เปอร์เซ็นต์ (ตอบทศนิยม 2 ตำแหน่ง)"
    answer: { value: 12.68, tolerance: 0.02, unit: "%" }
    hints:
      - "เขียนใหม่เป็น $A = 1000\\left[(1.01)^{12}\\right]^t$ ตัวคูณต่อปีคือ $(1.01)^{12}$"
      - "คำนวณ $(1.01)^{12}$ แล้วลบ 1 เพื่อหาอัตราการเพิ่มต่อปี"
    misconceptions:
      - { match: 12, feedback: "คิดว่า 1% ต่อเดือน 12 เดือนเท่ากับ 12% ต่อปี แต่ดอกเบี้ยทบต้นทุกเดือน ดอกเบี้ยของเดือนก่อน ๆ ก็ได้ดอกเบี้ยด้วย จึงมากกว่า 12%" }
      - { match: 1, feedback: "1% คืออัตราต่อเดือน โจทย์ถามการเพิ่มขึ้นในหนึ่งปี" }
    solution: "$(1.01)^{12} \\approx 1.1268$ จึงได้ $A = 1000(1.1268)^t$ เงินเพิ่มขึ้นประมาณ $12.68\\%$ ต่อปี มากกว่า 12% เล็กน้อยเพราะทบต้นทุกเดือน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p017
    topics: [math.functions.exponential]
    difficulty: 3
    type: expression
    stem: "ตารางแสดงค่าของฟังก์ชันเอกซ์โพเนนเชียล: $x = 0, 1, 2, 3$ ได้ $y = 4, 2, 1, 0.5$ จงเขียนสมการของฟังก์ชันนี้"
    prefix: "y ="
    answer: { latex: "4\\cdot\\left(\\frac{1}{2}\\right)^{x}", variables: [x] }
    hints:
      - "ค่าเริ่มต้น $a$ คือค่า $y$ เมื่อ $x = 0$"
      - "ตัวคูณ $b$ คืออัตราส่วนของค่าที่อยู่ติดกัน เช่น $\\tfrac{2}{4}$"
    misconceptions:
      - { match: "4\\cdot 2^{x}", feedback: "ค่า $y$ ลดลง ตัวคูณจึงต้องน้อยกว่า 1 คือ $\\tfrac12$ ไม่ใช่ 2" }
      - { match: "4 - 2x", feedback: "ฟังก์ชันเชิงเส้นนี้ให้ $y = 4, 2, 0, -2$ ไม่ตรงกับตาราง ตารางนี้คูณ $\\tfrac12$ ทุกขั้น ไม่ได้ลบเท่ากันทุกขั้น" }
    solution: "$a = 4$ และ $b = \\tfrac{2}{4} = \\tfrac{1}{2}$ จึงได้ $y = 4\\left(\\tfrac{1}{2}\\right)^x$ ตรวจ: $x = 3$ ได้ $4 \\times \\tfrac18 = 0.5$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p018
    topics: [math.functions.exponential]
    difficulty: 3
    type: numeric
    stem: "กราฟของฟังก์ชัน $y = a \\cdot b^x$ ผ่านจุด $(0, 2)$ และ $(1, 6)$ ตามภาพ จงหาค่าของ $y$ เมื่อ $x = 3$"
    figure: { src: exponential-two-points.svg, alt: "กราฟเส้นโค้งเพิ่มขึ้นแบบเอกซ์โพเนนเชียล ผ่านจุด (0, 2) ซึ่งเป็นจุดตัดแกน y และจุด (1, 6) ทางซ้ายเข้าใกล้แกน x แต่ไม่แตะ" }
    answer: { value: 54 }
    hints:
      - "จุด $(0, 2)$ บอกค่าเริ่มต้น $a$"
      - "จาก $x = 0$ ไป $x = 1$ ค่า $y$ ถูกคูณด้วยเท่าใด นั่นคือ $b$"
    misconceptions:
      - { match: 14, feedback: "ต่อแบบเพิ่มทีละ 4 (เชิงเส้น) แต่กราฟนี้เป็นเอกซ์โพเนนเชียล ต้องคูณ 3 ทุกขั้น" }
      - { match: 18, feedback: "นั่นคือค่าเมื่อ $x = 2$ ยังต้องคูณ 3 อีกหนึ่งครั้ง" }
    solution: "$a = 2$ และ $b = \\tfrac{6}{2} = 3$ จึงได้ $y = 2 \\cdot 3^x$ เมื่อ $x = 3$: $y = 2 \\times 27 = 54$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p019
    topics: [math.functions.exponential]
    difficulty: 4
    type: numeric
    stem: "จำนวนเต็มบวก $x$ ที่น้อยที่สุดที่ทำให้ $2^x > 100x$ คือเท่าใด"
    answer: { value: 10 }
    hints:
      - "ลองทำตารางค่าของ $2^x$ กับ $100x$ สำหรับ $x = 6, 7, 8, \\dots$"
      - "ช่วงแรก $100x$ มากกว่ามาก แต่ $2^x$ คูณ 2 ทุกขั้น จึงตามทันในที่สุด"
    misconceptions:
      - { match: 7, feedback: "$2^7 = 128$ มากกว่า 100 แต่ต้องเทียบกับ $100x = 700$ ซึ่งยังมากกว่า" }
      - { match: 1, feedback: "$2^1 = 2$ น้อยกว่า $100$ มาก ลองไล่ค่า $x$ ที่ใหญ่ขึ้น" }
    solution: "$x = 9$: $2^9 = 512 < 900$ และ $x = 10$: $2^{10} = 1024 > 1000$ คำตอบคือ 10 ฟังก์ชันเอกซ์โพเนนเชียลที่เติบโตแซงฟังก์ชันเชิงเส้นได้เสมอในที่สุด ไม่ว่าฟังก์ชันเชิงเส้นจะชันแค่ไหน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p020
    topics: [math.functions.exponential]
    difficulty: 4
    type: numeric
    stem: "ประชากรของเมืองแห่งหนึ่งประมาณได้ด้วย $P = 50{,}000(1.2)^{t/10}$ คน เมื่อ $t$ คือจำนวนปีนับจากวันนี้ หลังจาก 30 ปีจะมีประชากรประมาณกี่คน"
    answer: { value: 86400, tolerance: 1, unit: คน }
    hints:
      - "เลขชี้กำลัง $\\tfrac{t}{10}$ บอกว่าผ่านไปกี่ช่วง 10 ปี และทุกช่วงเพิ่มขึ้น 20%"
      - "$t = 30$ ได้เลขชี้กำลัง 3 แล้วคำนวณ $1.2^3$"
    misconceptions:
      - { match: 80000, feedback: "คิดว่าเพิ่ม 20% ของจำนวนเดิมทุก 10 ปี รวม 60% แต่ทุกช่วงเพิ่มจากจำนวนที่มีอยู่ตอนนั้น ต้องคูณ $1.2$ สามครั้ง" }
      - { match: 11868816, feedback: "ใช้เลขชี้กำลัง 30 แต่ $1.2$ คือการเพิ่มต่อ 10 ปี เลขชี้กำลังจึงเป็น $\\tfrac{30}{10} = 3$" }
    solution: "$P = 50{,}000(1.2)^{3} = 50{,}000 \\times 1.728 = 86{,}400$ คน ฟังก์ชันนี้แสดงการเพิ่ม 20% ทุก 10 ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p021
    topics: [math.functions.exponential]
    difficulty: 5
    type: numeric
    stem: "สารกัมมันตรังสีชนิดหนึ่งมีครึ่งชีวิต 8 วัน หลังจาก 24 วันเหลือสารนี้ 5 กรัม ตอนเริ่มต้นมีสารนี้กี่กรัม"
    answer: { value: 40, unit: กรัม }
    hints:
      - "24 วันคือครึ่งชีวิตกี่รอบ"
      - "ทุกรอบเหลือครึ่งหนึ่ง จึงได้ $5 = M \\cdot \\left(\\tfrac12\\right)^{3}$ แก้หา $M$"
    misconceptions:
      - { match: 15, feedback: "คูณ $5 \\times 3$ แต่ย้อนเวลาหนึ่งรอบครึ่งชีวิตคือคูณ 2 ต้องคูณ 2 สามครั้ง" }
      - { match: 0.625, feedback: "นั่นคือการหารครึ่งต่อไปอีกสามรอบ (ไปข้างหน้า) แต่โจทย์ถามปริมาณตอนเริ่มต้น ต้องย้อนกลับด้วยการคูณ 2" }
    solution: "24 วัน $= 3$ รอบครึ่งชีวิต จึงได้ $M \\left(\\tfrac12\\right)^3 = 5$ ดังนั้น $M = 5 \\times 2^3 = 40$ กรัม ตรวจ: $40 \\to 20 \\to 10 \\to 5$ ✓"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.ef.p022
    topics: [math.functions.exponential]
    difficulty: 2
    type: numeric
    stem: "ให้ $f(x) = 3 \\cdot 2^x$ จงหา $f(-1)$"
    answer: { value: 1.5, tolerance: 0.01 }
    hints:
      - "$2^{-1} = \\tfrac{1}{2}$"
      - "ยกกำลังก่อนแล้วจึงคูณด้วย 3"
    misconceptions:
      - { match: -6, feedback: "เลขชี้กำลังลบไม่ได้ทำให้ผลเป็นลบ $2^{-1} = \\tfrac12$ จึงได้ $3 \\times \\tfrac12$" }
      - { match: 0.17, feedback: "ยกกำลัง $(3 \\cdot 2)^{-1} = \\tfrac16$ แต่เลขชี้กำลังใช้กับ 2 ตัวเดียว" }
    solution: "$f(-1) = 3 \\times 2^{-1} = 3 \\times \\tfrac{1}{2} = 1.5$ ค่าของฟังก์ชันเอกซ์โพเนนเชียลที่มี $a > 0$ เป็นบวกเสมอ แม้ $x$ ติดลบ"
