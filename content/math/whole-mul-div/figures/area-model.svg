<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="sans-serif" font-size="16">
  <title>แบบจำลองพื้นที่ 23 × 14</title>
  <rect x="0" y="0" width="720" height="330" fill="#ffffff"/>
  <rect x="90.0" y="60.0" width="220.0" height="110.0" rx="0" fill="#e2f0ed" stroke="#15211e" stroke-width="1.5"/>
  <text x="200.0" y="121.0" font-size="15" text-anchor="middle" fill="#15211e">20 × 10 = 200</text>
  <rect x="310.0" y="60.0" width="33.0" height="110.0" rx="0" fill="#fde7c8" stroke="#15211e" stroke-width="1.5"/>
  <text x="326.5" y="121.0" font-size="13" text-anchor="middle" fill="#15211e">30</text>
  <rect x="90.0" y="170.0" width="220.0" height="44.0" rx="0" fill="#dbeafe" stroke="#15211e" stroke-width="1.5"/>
  <text x="200.0" y="198.0" font-size="15" text-anchor="middle" fill="#15211e">20 × 4 = 80</text>
  <rect x="310.0" y="170.0" width="33.0" height="44.0" rx="0" fill="#ede9fe" stroke="#15211e" stroke-width="1.5"/>
  <text x="326.5" y="198.0" font-size="13" text-anchor="middle" fill="#15211e">12</text>
  <text x="200.0" y="48.0" font-size="16" text-anchor="middle" fill="#15211e" font-weight="bold">20</text>
  <text x="326.5" y="48.0" font-size="16" text-anchor="middle" fill="#15211e" font-weight="bold">3</text>
  <text x="78.0" y="121.0" font-size="16" text-anchor="end" fill="#15211e" font-weight="bold">10</text>
  <text x="78.0" y="198.0" font-size="16" text-anchor="end" fill="#15211e" font-weight="bold">4</text>
  <text x="393.0" y="95.0" font-size="18" text-anchor="start" fill="#15211e" font-weight="bold">23 × 14</text>
  <text x="393.0" y="130.0" font-size="18" text-anchor="start" fill="#15211e">= 200 + 30 + 80 + 12</text>
  <text x="393.0" y="165.0" font-size="18" text-anchor="start" fill="#0a6b60" font-weight="bold">= 322</text>
  <text x="393.0" y="210.0" font-size="16" text-anchor="start" fill="#15211e" font-weight="bold">ตั้งคูณ</text>
  <text x="393.0" y="238.0" font-size="16" text-anchor="start" fill="#15211e">23 × 4 = 92</text>
  <text x="393.0" y="266.0" font-size="16" text-anchor="start" fill="#15211e">23 × 10 = 230</text>
  <text x="393.0" y="294.0" font-size="16" text-anchor="start" fill="#15211e">92 + 230 = 322</text>
</svg>
