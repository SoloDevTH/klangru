problems:
  - id: health.safety.road-water.p001
    topics: [health.safety.road-water]
    difficulty: 1
    type: mcq
    stem: "ควรข้ามถนนตรงที่ใด"
    choices:
      - { id: a, text: "ทางม้าลายหรือสะพานลอย", correct: true }
      - { id: b, text: "ตรงไหนก็ได้ที่ใกล้ที่สุด", feedback: "การข้ามนอกทางข้าม คนขับไม่คาดว่าจะมีคนข้าม จึงเสี่ยงถูกรถชน" }
      - { id: c, text: "ระหว่างรถที่จอดอยู่", feedback: "รถที่จอดบังทำให้คนขับมองไม่เห็นเรา และเราก็มองไม่เห็นรถ" }
    hints:
      - "มีที่ที่ทำไว้ให้คนข้ามโดยเฉพาะ"
      - "ทาสีขาวสลับเป็นแถบ หรือเป็นสะพานข้ามถนน"
    solution: "ข้ามตรงทางม้าลาย สะพานลอย หรือสัญญาณไฟคนข้าม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.road-water.p002
    topics: [health.safety.road-water]
    difficulty: 1
    type: mcq
    stem: "ซ้อนท้ายรถจักรยานยนต์ของแม่ไปตลาด ต้องทำอย่างไร"
    choices:
      - { id: a, text: "สวมหมวกนิรภัยและรัดสายคาง", correct: true }
      - { id: b, text: "ไม่ต้องสวมหมวก เพราะแม่สวมแล้ว", feedback: "คนซ้อนก็ศีรษะกระแทกพื้นได้ ทั้งคนขับและคนซ้อนต้องสวมหมวกนิรภัย" }
      - { id: c, text: "ถือหมวกไว้ในมือ", feedback: "หมวกในมือไม่ได้ป้องกันศีรษะ ต้องสวมและรัดสายคาง" }
    hints:
      - "อวัยวะใดอันตรายที่สุดเมื่อล้มรถ"
      - "หมวกต้องอยู่บนศีรษะและรัดสายคางจึงจะไม่หลุด"
    solution: "สวมหมวกนิรภัยขนาดพอดีและรัดสายคางทุกครั้ง แม้ทางใกล้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.road-water.p003
    topics: [health.safety.road-water]
    difficulty: 1
    type: text
    stem: "เมื่อนั่งเรือข้ามฟาก ต้องสวมเสื้ออะไรเพื่อช่วยให้ลอยตัวถ้าตกน้ำ"
    accepted: ["เสื้อชูชีพ", "ชูชีพ", "life jacket", "เสื้อพยุงตัว"]
    misconceptions:
      - { match: "เสื้อกันฝน", feedback: "เสื้อกันฝนไม่ช่วยให้ลอยน้ำ ต้องสวมเสื้อชูชีพ" }
    hints:
      - "เสื้อนี้มักมีสีส้มหรือสีเหลือง"
      - "ชื่อขึ้นต้นด้วย เสื้อชู..."
    solution: "เสื้อชูชีพ ช่วยให้ลอยตัวอยู่ในน้ำได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.road-water.p004
    topics: [health.safety.road-water]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการข้ามถนนที่ทางม้าลายในประเทศไทย"
    items:
      - "หยุดยืนที่ขอบทางเท้า"
      - "มองขวา"
      - "มองซ้าย"
      - "มองขวาอีกครั้ง"
      - "เมื่อไม่มีรถหรือรถหยุดแล้ว เดินข้ามตรง ๆ ไม่วิ่ง"
    hints:
      - "หยุดก่อนแล้วจึงมอง"
      - "รถเลนที่ใกล้เราที่สุดมาจากทางขวา"
    solution: "หยุดที่ขอบทาง → มองขวา → มองซ้าย → มองขวาอีกครั้ง → เดินข้ามตรง ๆ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.road-water.p005
    topics: [health.safety.road-water]
    difficulty: 2
    type: mcq
    stem: "ในประเทศไทย ก่อนข้ามถนนควรมองทางใดก่อน และเพราะอะไร"
    choices:
      - { id: a, text: "มองขวาก่อน เพราะรถวิ่งชิดซ้าย รถเลนที่ใกล้เราที่สุดจึงมาจากทางขวา", correct: true }
      - { id: b, text: "มองซ้ายก่อน เพราะรถวิ่งชิดซ้าย", feedback: "รถที่วิ่งชิดซ้ายในเลนใกล้เรากำลังวิ่งมาจากทางขวาของเรา ดูภาพทางม้าลายในบทเรียน" }
      - { id: c, text: "มองตรงไปข้างหน้าก็พอ", feedback: "รถมาจากทั้งสองข้าง ต้องหันมองทั้งขวาและซ้าย" }
    hints:
      - "ยืนบนทางเท้า หันหน้าไปทางถนน รถในเลนแรกวิ่งชิดซ้ายของคนขับ"
      - "ดูภาพทางม้าลายว่ารถเลนใกล้มาจากด้านไหน"
    solution: "มองขวาก่อน เพราะรถในเลนที่อยู่ใกล้เราวิ่งมาจากทางขวา แล้วมองซ้าย และมองขวาอีกครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.road-water.p006
    topics: [health.safety.road-water]
    difficulty: 2
    type: match
    stem: "จับคู่การเดินทางกับข้อปฏิบัติเพื่อความปลอดภัย"
    pairs:
      - { left: "นั่งรถยนต์", right: "คาดเข็มขัดนิรภัยทุกที่นั่ง" }
      - { left: "ซ้อนรถจักรยานยนต์", right: "สวมหมวกนิรภัยและรัดสายคาง" }
      - { left: "นั่งเรือ", right: "สวมเสื้อชูชีพและนั่งนิ่ง ๆ" }
      - { left: "นั่งรถสองแถว", right: "ขึ้นลงเมื่อรถหยุดสนิท ไม่ห้อยท้าย" }
      - { left: "เดินในซอยที่ไม่มีทางเท้า", right: "เดินชิดขวาสวนทางกับรถ" }
    hints:
      - "นึกถึงอุปกรณ์นิรภัยของแต่ละพาหนะ"
      - "การเดินสวนทางรถทำให้เห็นรถที่วิ่งมา"
    solution: "รถยนต์-เข็มขัดนิรภัย, จักรยานยนต์-หมวกนิรภัย, เรือ-เสื้อชูชีพ, สองแถว-ขึ้นลงเมื่อหยุดไม่ห้อยท้าย, ไม่มีทางเท้า-เดินชิดขวาสวนทางรถ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.road-water.p007
    topics: [health.safety.road-water]
    difficulty: 2
    type: mcq
    stem: "เพื่อนลื่นตกลงไปในบ่อน้ำลึกข้างสนาม และกำลังตะเกียกตะกาย เราว่ายน้ำได้นิดหน่อย ควรทำอย่างไร"
    choices:
      - { id: a, text: "อยู่บนฝั่ง ตะโกนเรียกผู้ใหญ่ แล้วโยนหรือยื่นของให้เพื่อนเกาะ", correct: true }
      - { id: b, text: "กระโดดลงไปดึงเพื่อนขึ้นมา", feedback: "คนจมน้ำจะกอดรัดผู้ช่วยจนจมไปด้วยกัน กรมควบคุมโรคแนะนำไม่ให้กระโดดลงไป" }
      - { id: c, text: "วิ่งกลับบ้านไปเปลี่ยนชุดก่อนแล้วค่อยกลับมาช่วย", feedback: "การจมน้ำเกิดเร็วมาก ต้องเรียกคนช่วยและหาของโยนให้เกาะทันที" }
    hints:
      - "ความปลอดภัยของผู้ช่วยต้องมาก่อน"
      - "จำหลัก ตะโกน โยน ยื่น"
    solution: "ไม่กระโดดลงไป ให้ตะโกนเรียกผู้ใหญ่และโทร 1669 โยนของที่ลอยน้ำได้ หรือยื่นไม้หรือผ้าให้จับ แล้วดึงเข้าฝั่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.road-water.p008
    topics: [health.safety.road-water]
    difficulty: 2
    type: match
    stem: "จับคู่ขั้นของหลัก ตะโกน โยน ยื่น กับสิ่งที่ทำ"
    pairs:
      - { left: "ตะโกน", right: "เรียกคนมาช่วยและโทร 1669" }
      - { left: "โยน", right: "ส่งแกลลอนเปล่าหรือห่วงยางให้เกาะ" }
      - { left: "ยื่น", right: "ส่งไม้หรือผ้าขาวม้าให้จับแล้วดึงเข้าฝั่ง" }
    hints:
      - "แต่ละขั้นเป็นคำกริยาที่บอกสิ่งที่ทำ"
      - "โยนใช้ของที่ลอยน้ำได้ ยื่นใช้ของที่ยาว"
    solution: "ตะโกน-เรียกคนและโทร 1669, โยน-ของลอยน้ำ, ยื่น-ของยาวให้จับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.road-water.p009
    topics: [health.safety.road-water]
    difficulty: 3
    type: numeric
    stem: "ข้อมูลเฝ้าระวังของกรมควบคุมโรค (1 ม.ค.–6 มิ.ย. 2565) พบเหตุการณ์จมน้ำ 19 เหตุการณ์ เป็นเด็กอายุต่ำกว่า 15 ปี 16 เหตุการณ์ คิดเป็นร้อยละเท่าไร (ตอบเป็นร้อยละ ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 84.2, tolerance: 0.5, unit: "%" }
    misconceptions:
      - { match: 15.8, feedback: "15.8 คือร้อยละของเหตุการณ์ที่เป็นผู้มีอายุ 15 ปีขึ้นไป (3 เหตุการณ์)" }
      - { match: 118.75, feedback: "นำ 19 ÷ 16 กลับด้าน ต้องนำส่วน (16) หารด้วยทั้งหมด (19)" }
    hints:
      - "ร้อยละ = ส่วน ÷ ทั้งหมด × 100"
      - "นำ 16 หารด้วย 19 แล้วคูณ 100"
    solution: "16 ÷ 19 × 100 ≈ 84.2 คือประมาณร้อยละ 84 ตรงกับที่รายงานไว้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.road-water.p010
    topics: [health.safety.road-water]
    difficulty: 3
    type: numeric
    stem: "จากแผนภูมิ เด็กจมน้ำ 16 เหตุการณ์ เกิดในคลองและแม่น้ำร้อยละ 50 เหตุการณ์ในคลองและแม่น้ำมีกี่เหตุการณ์ (ตอบเป็นเหตุการณ์)"
    figure:
      src: drowning-places.svg
      alt: "แผนภูมิแท่ง แหล่งน้ำที่เกิดเหตุเด็กอายุต่ำกว่า 15 ปีจมน้ำ 16 เหตุการณ์ ช่วง 1 ม.ค.–6 มิ.ย. 2565 ข้อมูลกรมควบคุมโรค คลองและแม่น้ำร้อยละ 50 แหล่งน้ำเกษตรร้อยละ 31 ทะเลร้อยละ 13 สระว่ายน้ำร้อยละ 6"
    answer: { value: 8, unit: เหตุการณ์ }
    misconceptions:
      - { match: 50, feedback: "50 คือร้อยละ ไม่ใช่จำนวนเหตุการณ์ ต้องคิดจาก 16 เหตุการณ์" }
      - { match: 32, feedback: "นำ 16 ÷ 50 × 100 กลับด้าน ร้อยละ 50 ของ 16 คือ 50 ÷ 100 × 16" }
    hints:
      - "ร้อยละ 50 คือครึ่งหนึ่ง"
      - "คำนวณ 50 ÷ 100 × 16"
    solution: "50 ÷ 100 × 16 = 8 เหตุการณ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.road-water.p011
    topics: [health.safety.road-water]
    difficulty: 3
    type: mcq
    stem: "ถนนในหมู่บ้านไม่มีทางเท้า บัวต้องเดินไปบ้านยาย ควรเดินอย่างไร"
    choices:
      - { id: a, text: "เดินชิดขอบทางด้านขวา สวนทางกับรถ", correct: true }
      - { id: b, text: "เดินชิดซ้าย ไปทางเดียวกับรถ", feedback: "รถจะมาจากข้างหลัง เรามองไม่เห็นและหลบไม่ทัน" }
      - { id: c, text: "เดินกลางถนนเพราะกว้างดี", feedback: "กลางถนนเป็นทางของรถ เสี่ยงถูกชนมาก" }
    hints:
      - "อยากเห็นรถที่วิ่งเข้ามาหาเรา"
      - "ในไทยรถวิ่งชิดซ้าย"
    solution: "เดินชิดขอบทางด้านขวา สวนทางกับรถ จะเห็นรถที่วิ่งเข้ามาและหลบได้ทัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.road-water.p012
    topics: [health.safety.road-water]
    difficulty: 3
    type: mcq
    stem: "ปิ่นมาถึงทางข้ามตอนที่สัญญาณไฟรูปคนสีเขียวกำลังกระพริบ ปิ่นควรทำอย่างไร"
    choices:
      - { id: a, text: "รอที่ขอบทางเท้า แล้วข้ามเมื่อไฟคนเดินสีเขียวรอบใหม่ติด", correct: true }
      - { id: b, text: "วิ่งข้ามให้ทันก่อนไฟแดง", feedback: "ไฟเขียวกระพริบแปลว่าใกล้หมดเวลา ถ้าเริ่มข้ามอาจติดกลางถนนตอนรถออกตัว และการวิ่งอาจล้ม" }
      - { id: c, text: "เดินข้ามช้า ๆ เพราะรถต้องรอ", feedback: "เมื่อไฟเปลี่ยน รถจะได้สิทธิ์ไป การอยู่กลางถนนอันตราย" }
    hints:
      - "ไฟเขียวกระพริบเตือนว่าอะไร"
      - "ห้ามเริ่มข้ามเมื่อไฟกระพริบ"
    solution: "ไฟเขียวกระพริบหมายถึงใกล้หมดเวลาข้าม อย่าเริ่มข้าม ให้รอรอบใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.road-water.p013
    topics: [health.safety.road-water]
    difficulty: 3
    type: mcq
    stem: "ตอนเลิกเรียน รถสองแถวคนแน่น เพื่อน ๆ ชวนกันยืนห้อยท้ายรถไปส่งที่ตลาด ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ไม่ห้อยท้าย รอคันต่อไปที่มีที่นั่ง และชวนเพื่อนรอด้วย", correct: true }
      - { id: b, text: "ห้อยท้ายได้ถ้าจับให้แน่น", feedback: "เมื่อรถเบรกหรือเลี้ยว ห้อยท้ายตกลงมาได้ง่ายแม้จะจับแน่น" }
      - { id: c, text: "ห้อยได้เพราะตลาดอยู่ใกล้", feedback: "อุบัติเหตุเกิดได้แม้ระยะทางสั้น" }
    hints:
      - "การห้อยท้ายรถเสี่ยงอะไร"
      - "มีทางเลือกที่ปลอดภัยกว่าหรือไม่"
    solution: "ไม่ห้อยท้ายรถ รอคันต่อไปที่มีที่นั่ง ขึ้นลงเมื่อรถหยุดสนิท และจับราวให้มั่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.road-water.p014
    topics: [health.safety.road-water]
    difficulty: 4
    type: numeric
    stem: "ถนนหน้าโรงเรียนกว้าง 12 เมตร ถ้าน้องเดินข้ามด้วยอัตราเร็ว 1.2 เมตรต่อวินาที จะใช้เวลากี่วินาทีจึงถึงอีกฝั่ง (ตอบเป็นวินาที)"
    answer: { value: 10, unit: วินาที }
    misconceptions:
      - { match: 14.4, feedback: "นำ 12 × 1.2 ไม่ถูก เวลา = ระยะทาง ÷ อัตราเร็ว" }
      - { match: 0.1, feedback: "นำ 1.2 ÷ 12 กลับด้าน ต้องนำระยะทางหารด้วยอัตราเร็ว" }
    hints:
      - "เวลา = ระยะทาง ÷ อัตราเร็ว"
      - "นำ 12 หารด้วย 1.2"
    solution: "12 ÷ 1.2 = 10 วินาที จึงต้องเริ่มข้ามตอนไฟเขียวเพิ่งติด ไม่ใช่ตอนกระพริบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.road-water.p015
    topics: [health.safety.road-water]
    difficulty: 4
    type: mcq
    stem: "ครอบครัวของขวัญขับรถยนต์ไปเที่ยวหัวหิน มีพ่อ แม่ ขวัญอายุ 10 ปี และน้องอายุ 4 ปี ข้อใดจัดที่นั่งได้ถูกต้องตามกฎหมายและปลอดภัยที่สุด"
    choices:
      - { id: a, text: "น้องนั่งคาร์ซีตที่เบาะหลัง ขวัญนั่งเบาะหลังคาดเข็มขัด พ่อแม่คาดเข็มขัด", correct: true }
      - { id: b, text: "แม่อุ้มน้องนั่งเบาะหน้า ขวัญนั่งเบาะหลังไม่ต้องคาดเข็มขัด", feedback: "เด็กอายุไม่เกิน 6 ปีต้องนั่งคาร์ซีต การอุ้มไม่ปลอดภัย และทุกที่นั่งต้องคาดเข็มขัด" }
      - { id: c, text: "น้องนั่งเบาะหลังคาดเข็มขัดผู้ใหญ่ ขวัญนั่งเบาะหน้า", feedback: "เข็มขัดของผู้ใหญ่ไม่พอดีตัวเด็กเล็ก กฎหมายกำหนดให้เด็กไม่เกิน 6 ปีใช้ที่นั่งนิรภัยสำหรับเด็ก" }
    hints:
      - "กฎหมายกำหนดอะไรสำหรับเด็กอายุไม่เกิน 6 ปี"
      - "ทุกที่นั่งต้องคาดเข็มขัดนิรภัย"
    solution: "ตาม พ.ร.บ.จราจรทางบก ฉบับที่ 13 พ.ศ. 2565 ทุกที่นั่งต้องคาดเข็มขัด และเด็กอายุไม่เกิน 6 ปีต้องนั่งที่นั่งนิรภัยสำหรับเด็ก เด็กควรนั่งเบาะหลัง"
