id: biology.genetics.dna-replication-repair
subject: biology
title: { th: การจำลองดีเอ็นเอและการซ่อมดีเอ็นเอ, en: "DNA replication and repair" }
summary: การจำลองดีเอ็นเอแบบกึ่งอนุรักษ์ ส้อมจำลอง เอนไซม์ในการจำลองทั้งในโพรแคริโอตและยูแคริโอต เทโลเมียร์ และกลไกการซ่อมดีเอ็นเอที่ผิดพลาดหรือเสียหาย
difficulty: 6.5
minutes: 45
prerequisites: [biology.genetics.chromosomes-dna]
encompasses:
  - { id: biology.genetics.chromosomes-dna, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: การจำลองดีเอ็นเอแบบกึ่งอนุรักษ์ในสามรุ่น
    src: semiconservative.svg
    alt: "แผนภาพแสดงดีเอ็นเอสามรุ่น แต่ละกรอบเส้นประคือหนึ่งโมเลกุลที่มีสองสาย รุ่นศูนย์มีหนึ่งโมเลกุลที่เป็นสายหนักทั้งสองสาย รุ่นหนึ่งมีสองโมเลกุลลูกผสมที่มีสายหนักหนึ่งสายและสายเบาหนึ่งสาย รุ่นสองมีสี่โมเลกุล เป็นลูกผสมสองโมเลกุลและสายเบาทั้งสองสายอีกสองโมเลกุล"
    caption: "สายเดิมหนึ่งสายยังคงอยู่ในทุกโมเลกุลลูกผสมของรุ่นแรก (แผนภาพวาดโดยทีมคลังรู้)"
  - type: figure
    title: ส้อมจำลองดีเอ็นเอและเอนไซม์ที่ทำงาน
    src: replication-fork.svg
    alt: "แผนภาพส้อมจำลอง ทางซ้ายเป็นดีเอ็นเอเกลียวคู่ที่มีโทโพไอโซเมอเรสอยู่ข้างหน้าส้อม ลูกศรบอกว่าส้อมเคลื่อนไปทางซ้าย เฮลิเคสอยู่ที่จุดแยก สายแม่แบบสองสายแยกออกไปทางขวา สายบนมีโปรตีนจับสายเดี่ยวเกาะใกล้ส้อม และมีสายตามเป็นชิ้นโอคาซากิสามชิ้นที่มีไพรเมอร์ RNA ที่ปลาย 5′ ลูกศรชี้ออกจากส้อม มีไลเกสที่รอยต่อระหว่างชิ้น สายล่างมีสายนำต่อเนื่องที่ลูกศรชี้เข้าหาส้อมและมีดีเอ็นเอพอลิเมอเรสที่ปลาย ระบุปลาย 5′ และ 3′ ของสายแม่แบบ"
    caption: "สายนำสังเคราะห์ต่อเนื่องและสายตามสังเคราะห์เป็นชิ้นโอคาซากิ (แผนภาพวาดโดยทีมคลังรู้)"
  - type: worked-example
    title: คำนวณเวลาจำลองโครโมโซมวงกลมของแบคทีเรีย
    problem: "(ตัวเลขสมมติ) โครโมโซมวงกลมของแบคทีเรียชนิดหนึ่งยาว 3,000,000 คู่เบส มีจุดเริ่มจำลองหนึ่งจุดและส้อมสองทิศทาง ถ้าแต่ละส้อมเคลื่อนได้ 500 คู่เบสต่อวินาที การจำลองทั้งโครโมโซมใช้เวลากี่นาที"
    steps:
      - text: "แบ่งโครโมโซมให้แต่ละส้อม เนื่องจากส้อมทั้งสองเคลื่อนออกจากจุดเริ่มจำลองไปคนละทิศ $\\frac{3{,}000{,}000}{2} = 1{,}500{,}000$ คู่เบส"
        why: "โครโมโซมวงกลมมีจุดเริ่มจำลองหนึ่งจุด ส้อมทั้งสองจึงช่วยกันจำลองครึ่งหนึ่งต่อคน"
      - text: "คำนวณเวลาต่อส้อม $\\frac{1{,}500{,}000}{500} = 3{,}000$ วินาที"
      - text: "แปลงเป็นนาที $\\frac{3{,}000}{60} = 50$ นาที"
        why: "ผลที่ได้เป็นวินาทีต้องแปลงเป็นนาทีตามที่โจทย์ถาม"
    answer: "การจำลองทั้งโครโมโซมใช้เวลาประมาณ 50 นาที"
  - { type: check, problem: biology.genetics.dna-replication-repair.p005, prompt: "ลองคิดก่อนอ่านต่อ: เหตุใดสายตามจึงถูกสังเคราะห์เป็นชิ้นสั้น ๆ" }
glossary:
  - { term: เฮลิเคส, definition: "เอนไซม์ที่คลายเกลียวดีเอ็นเอและแยกสายออกจากกันที่ส้อมจำลอง" }
  - { term: ส้อมจำลอง, definition: "บริเวณที่ดีเอ็นเอเกลียวคู่ถูกแยกออกเป็นสองสาย เพื่อใช้เป็นแม่แบบในการจำลอง" }
  - { term: ชิ้นโอคาซากิ, definition: "ชิ้นดีเอ็นเอสั้น ๆ ที่สังเคราะห์บนสายตามระหว่างการจำลอง ก่อนถูกเชื่อมต่อกัน" }
  - { term: เทโลเมียร์, definition: "ลำดับซ้ำที่ปลายโครโมโซมยูแคริโอต ช่วยป้องกันโครโมโซมจากการเชื่อมกันและการสูญเสียข้อมูล" }
  - { term: เทโลเมอเรส, definition: "เอนไซม์ที่เติมลำดับเทโลเมียร์ที่ปลายโครโมโซม โดยใช้ RNA เป็นแม่แบบ" }
  - { term: การพิสูจน์อักษร, definition: "ความสามารถของดีเอ็นเอพอลิเมอเรสในการตัดนิวคลีโอไทด์ที่ผิดออกทันทีระหว่างการสังเคราะห์" }
flashcards:
  - { front: "ดีเอ็นเอจำลองแบบใด และหลักฐานคืออะไร", back: "กึ่งอนุรักษ์ หลักฐานคือการทดลองของเมเซลสันและสตาห์ล พบดีเอ็นเอระดับกลางในรุ่นแรก" }
  - { front: "ดีเอ็นเอพอลิเมอเรสเติมนิวคลีโอไทด์ทิศใด", back: "5′→3′ เท่านั้น" }
  - { front: "เหตุใดสายตามเป็นชิ้นโอคาซากิ", back: "พอลิเมอเรสสร้างได้เฉพาะ 5′→3′ ซึ่งสวนทางกับการคลายเกลียว" }
  - { front: "ทำไมเทโลเมียร์จึงสั้นลงทุกการแบ่งเซลล์", back: "ปลายสายตามไม่สามารถถูกจำลองได้เต็มเมื่อไพรเมอร์ที่ปลายถูกลบออก" }
