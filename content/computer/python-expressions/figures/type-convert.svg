<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 310" width="530" height="310" font-family="sans-serif" font-size="13">
<title>ตารางแสดงการแปลงชนิดข้อมูลใน Python ห้าตัวอย่าง จากค่าเริ่มต้นไปเป็นชนิดใหม่และผลที่ได้</title>
<rect x="0" y="0" width="530" height="310" fill="#ffffff"/>
<text x="265.0" y="24" text-anchor="middle" font-weight="bold" font-size="14" fill="#1f2937">การแปลงชนิดข้อมูลด้วย int, str และ float</text>
<rect x="0" y="40" width="140" height="40" fill="#e0e7ff" stroke="#4b5563" stroke-width="1.5"/>
<text x="70.0" y="65" text-anchor="middle" font-weight="bold" fill="#1f2937">ค่าเริ่มต้น</text>
<rect x="140" y="40" width="80" height="40" fill="#e0e7ff" stroke="#4b5563" stroke-width="1.5"/>
<text x="180.0" y="65" text-anchor="middle" font-weight="bold" fill="#1f2937">แปลงด้วย</text>
<rect x="220" y="40" width="110" height="40" fill="#e0e7ff" stroke="#4b5563" stroke-width="1.5"/>
<text x="275.0" y="65" text-anchor="middle" font-weight="bold" fill="#1f2937">ผลที่ได้</text>
<rect x="330" y="40" width="200" height="40" fill="#e0e7ff" stroke="#4b5563" stroke-width="1.5"/>
<text x="430.0" y="65" text-anchor="middle" font-weight="bold" fill="#1f2937">หมายเหตุ</text>
<rect x="0" y="80" width="140" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="70.0" y="105" text-anchor="middle" fill="#1f2937">"12" (สตริง)</text>
<rect x="140" y="80" width="80" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="180.0" y="105" text-anchor="middle" fill="#1f2937">int</text>
<rect x="220" y="80" width="110" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="275.0" y="105" text-anchor="middle" fill="#1f2937">12</text>
<rect x="330" y="80" width="200" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="430.0" y="105" text-anchor="middle" fill="#1f2937">เป็นจำนวนเต็ม</text>
<rect x="0" y="120" width="140" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="70.0" y="145" text-anchor="middle" fill="#1f2937">12 (int)</text>
<rect x="140" y="120" width="80" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="180.0" y="145" text-anchor="middle" fill="#1f2937">str</text>
<rect x="220" y="120" width="110" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="275.0" y="145" text-anchor="middle" fill="#1f2937">"12"</text>
<rect x="330" y="120" width="200" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="430.0" y="145" text-anchor="middle" fill="#1f2937">กลายเป็นข้อความ</text>
<rect x="0" y="160" width="140" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="70.0" y="185" text-anchor="middle" fill="#1f2937">12 (int)</text>
<rect x="140" y="160" width="80" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="180.0" y="185" text-anchor="middle" fill="#1f2937">float</text>
<rect x="220" y="160" width="110" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="275.0" y="185" text-anchor="middle" fill="#1f2937">12.0</text>
<rect x="330" y="160" width="200" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="430.0" y="185" text-anchor="middle" fill="#1f2937">เป็นทศนิยม</text>
<rect x="0" y="200" width="140" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="70.0" y="225" text-anchor="middle" fill="#1f2937">12.9 (float)</text>
<rect x="140" y="200" width="80" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="180.0" y="225" text-anchor="middle" fill="#1f2937">int</text>
<rect x="220" y="200" width="110" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="275.0" y="225" text-anchor="middle" fill="#1f2937">12</text>
<rect x="330" y="200" width="200" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="430.0" y="225" text-anchor="middle" fill="#1f2937">ตัดทศนิยมทิ้ง ไม่ปัดเศษ</text>
<rect x="0" y="240" width="140" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="70.0" y="265" text-anchor="middle" fill="#1f2937">"12.5" (สตริง)</text>
<rect x="140" y="240" width="80" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="180.0" y="265" text-anchor="middle" fill="#1f2937">int</text>
<rect x="220" y="240" width="110" height="40" fill="#fff1f2" stroke="#4b5563" stroke-width="1.5"/>
<text x="275.0" y="265" text-anchor="middle" fill="#1f2937">ValueError</text>
<rect x="330" y="240" width="200" height="40" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
<text x="430.0" y="265" text-anchor="middle" fill="#1f2937">ต้องแปลงเป็น float ก่อน</text>
<text x="265.0" y="300" text-anchor="middle" fill="#6b7280" font-size="12">ข้อความทศนิยมต้องแปลงผ่าน float ก่อน เช่น int(float("12.5")) ได้ 12</text>
</svg>