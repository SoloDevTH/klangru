<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="sans-serif" font-size="14">
  <title>ลำดับชั้นหน่วยความจำ จากรีจิสเตอร์ที่เร็วที่สุดแต่จุน้อยที่สุดด้านบน ถึงหน่วยเก็บถาวรที่ช้าแต่จุมากด้านล่าง</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
  <polygon points="230.0,40.0 290.0,40.0 335.0,104.0 185.0,104.0" fill="#fee2e2" stroke="#1f2937" stroke-width="1.5"/>
  <text x="260.0" y="74.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">รีจิสเตอร์</text>
  <text x="260.0" y="91.0" font-size="11" text-anchor="middle" fill="#6b7280">ในซีพียู</text>
  <text x="540.0" y="77.0" font-size="14" text-anchor="middle" fill="#1f2937">&lt; 1 ns</text>
  <text x="700.0" y="77.0" font-size="14" text-anchor="middle" fill="#1f2937">ไม่กี่ร้อยไบต์</text>
  <polygon points="185.0,104.0 335.0,104.0 380.0,168.0 140.0,168.0" fill="#ffedd5" stroke="#1f2937" stroke-width="1.5"/>
  <text x="260.0" y="138.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">แคช</text>
  <text x="260.0" y="155.0" font-size="11" text-anchor="middle" fill="#6b7280">ในชิปซีพียู</text>
  <text x="540.0" y="141.0" font-size="14" text-anchor="middle" fill="#1f2937">ราว 1–10 ns</text>
  <text x="700.0" y="141.0" font-size="14" text-anchor="middle" fill="#1f2937">KB ถึง MB</text>
  <polygon points="140.0,168.0 380.0,168.0 425.0,232.0 95.0,232.0" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="260.0" y="202.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">หน่วยความจำหลัก (RAM)</text>
  <text x="260.0" y="219.0" font-size="11" text-anchor="middle" fill="#6b7280">บนเมนบอร์ด</text>
  <text x="540.0" y="205.0" font-size="14" text-anchor="middle" fill="#1f2937">ราว 100 ns</text>
  <text x="700.0" y="205.0" font-size="14" text-anchor="middle" fill="#1f2937">หลาย GB</text>
  <polygon points="95.0,232.0 425.0,232.0 470.0,296.0 50.0,296.0" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="260.0" y="266.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">SSD</text>
  <text x="260.0" y="283.0" font-size="11" text-anchor="middle" fill="#6b7280">หน่วยเก็บถาวร</text>
  <text x="540.0" y="269.0" font-size="14" text-anchor="middle" fill="#1f2937">ราว 0.1 ms</text>
  <text x="700.0" y="269.0" font-size="14" text-anchor="middle" fill="#1f2937">หลายร้อย GB ถึง TB</text>
  <polygon points="50.0,296.0 470.0,296.0 515.0,360.0 5.0,360.0" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="260.0" y="330.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">ฮาร์ดดิสก์</text>
  <text x="260.0" y="347.0" font-size="11" text-anchor="middle" fill="#6b7280">หน่วยเก็บถาวร</text>
  <text x="540.0" y="333.0" font-size="14" text-anchor="middle" fill="#1f2937">ราว 10 ms</text>
  <text x="700.0" y="333.0" font-size="14" text-anchor="middle" fill="#1f2937">หลาย TB</text>
  <text x="540.0" y="28.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">เวลาเข้าถึงโดยประมาณ</text>
  <text x="700.0" y="28.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">ความจุโดยทั่วไป</text>
  <line x1="30.0" y1="60.0" x2="30.0" y2="330.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="40.0" y="375.0" font-size="13" text-anchor="start" fill="#6b7280">ล่างลง: ช้าลง จุมากขึ้น ราคาต่อ GB ถูกลง</text>
  <text x="40.0" y="402.0" font-size="13" text-anchor="start" fill="#6b7280">รีจิสเตอร์ แคช และ RAM ข้อมูลหายเมื่อไฟดับ ส่วน SSD และฮาร์ดดิสก์ไม่หาย</text>
</svg>
