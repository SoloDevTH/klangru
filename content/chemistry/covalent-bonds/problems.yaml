      - "ต่อพันธะเดี่ยว H–C–N ก่อน แล้วดูว่า C ยังขาดอิเล็กตรอนกี่ตัว"
      - "ย้ายคู่โดดเดี่ยวจาก N มาเป็นพันธะระหว่าง C กับ N จน C ครบ 8"
    misconceptions:
