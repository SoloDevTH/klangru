<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="sans-serif" font-size="14">
  <title>แผนภาพแสดงว่าอุณหภูมิสูงเป็นเหตุให้ยอดขายไอศกรีมและจำนวนคนไปเล่นน้ำเพิ่มขึ้นพร้อมกัน ทั้งสองอย่างสัมพันธ์กันแต่ไม่ได้เป็นเหตุและผลต่อกัน</title>
  <rect x="0" y="0" width="760" height="350" fill="#ffffff"/>
  <defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="290" y="60" width="180" height="50" rx="10" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="380.0" y="90.0" text-anchor="middle" font-size="15" fill="#1f2937">อุณหภูมิสูงในฤดูร้อน</text>
  <rect x="60" y="220" width="200" height="50" rx="10" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="160.0" y="250.0" text-anchor="middle" font-size="15" fill="#1f2937">ยอดขายไอศกรีมเพิ่ม</text>
  <rect x="500" y="220" width="200" height="50" rx="10" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="600.0" y="250.0" text-anchor="middle" font-size="15" fill="#1f2937">จำนวนคนไปเล่นน้ำเพิ่ม</text>
  <line x1="350" y1="110" x2="180" y2="218" stroke="#1f2937" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="390" y1="110" x2="560" y2="218" stroke="#1f2937" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="262" y1="245" x2="498" y2="245" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="380" y="236" text-anchor="middle" font-size="13" fill="#dc2626">สัมพันธ์กันพร้อมกัน</text>
  <text x="380" y="300" text-anchor="middle" font-size="13" fill="#1f2937">ไม่ได้หมายความว่าไอศกรีมทำให้คนไปเล่นน้ำ</text>
  <text x="380" y="322" text-anchor="middle" font-size="13" fill="#1f2937">ตัวแปรร่วม (อุณหภูมิ) อธิบายทั้งสองอย่าง</text>
</svg>
