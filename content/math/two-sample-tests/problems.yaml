  difficulty: 5
  type: mcq
  stem: ข้อความใดเกี่ยวกับการวิเคราะห์ข้อมูลจับคู่ด้วยการทดสอบ $t$ แบบอิสระ (ไม่จับคู่) เมื่อคู่ข้อมูลมีสหสัมพันธ์บวกสูง
  choices:
  - id: a
    text: ค่า $s$ ของผลต่างรายคู่จะเล็กกว่าที่ควร การวิเคราะห์แบบอิสระจึงประเมินความคลาดเคลื่อนมาตรฐานต่ำเกินจริง
    correct: false
    feedback: ผลกลับกัน เมื่อสหสัมพันธ์บวก ความแปรปรวนของผลต่างจะเล็ก แต่วิธีอิสระไม่ใช้ข้อมูลนี้ จึงประเมินความคลาดเคลื่อนสูงเกินจริง
  - id: b
    text: วิธีอิสระให้ค่า $t$ ที่ถูกต้องกว่าเสมอ เพราะไม่ต้องสมมติความสัมพันธ์
    correct: false
    feedback: วิธีนี้ไม่ได้ใช้ความสัมพันธ์รายคู่ จึงพลาดข้อมูลที่สำคัญ
  - id: c
    text: วิธีอิสระประเมินความคลาดเคลื่อนมาตรฐานสูงเกินจริง ทำให้อำนาจการทดสอบต่ำกว่าวิธีจับคู่
    correct: true
  - id: d
    text: วิธีอิสระและวิธีจับคู่ให้ผลเหมือนกันเสมอ ไม่ว่าสหสัมพันธ์จะเป็นเท่าใด
    correct: false
    feedback: สหสัมพันธ์มีผลต่อความคลาดเคลื่อนมาตรฐาน จึงให้ผลต่างกันได้
  hints:
  - คิดถึงความแปรปรวนของผลต่างเมื่อข้อมูลเกี่ยวข้องกัน
  - สหสัมพันธ์บวกทำให้ $\operatorname{Var}(X-Y)$ เล็กลง
  solution: $\operatorname{Var}(X-Y) = \sigma_X^2 + \sigma_Y^2 - 2\rho\sigma_X\sigma_Y$ เมื่อ $\rho$ สูง ค่านี้เล็กลง วิธีอิสระจึงใช้ความคลาดเคลื่อนสูงเกินจริงและอำนาจต่ำ
