<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="sans-serif" font-size="15">
  <title>แผนภูมิแท่งพลังงานของเด็กมวล 20 kg บนสไลเดอร์สูง 3 m ที่ยอด ที่ด้านล่างถ้าไม่มีแรงเสียดทาน และที่ด้านล่างจริง</title>
  <rect x="0" y="0" width="560" height="330" fill="#ffffff"/>
  <line x1="40.0" y1="250.0" x2="530.0" y2="250.0" stroke="#15211e" stroke-width="2" stroke-linecap="round"/>
  <rect x="60.0" y="61.8" width="120.0" height="188.2" rx="0" fill="#d9e8f5" stroke="#1f5fa8" stroke-width="1.8"/>
  <text x="120.0" y="160.9" fill="#15211e" font-size="13" text-anchor="middle">Eₚ 588 J</text>
  <text x="120.0" y="272.0" fill="#15211e" font-size="13" text-anchor="middle">ที่ยอด</text>
  <rect x="220.0" y="61.8" width="120.0" height="188.2" rx="0" fill="#cfe7e2" stroke="#0a6b60" stroke-width="1.8"/>
  <text x="280.0" y="160.9" fill="#15211e" font-size="13" text-anchor="middle">Eₖ 588 J</text>
  <text x="280.0" y="272.0" fill="#15211e" font-size="13" text-anchor="middle">ด้านล่าง ถ้าไม่มี</text>
  <text x="280.0" y="290.0" fill="#15211e" font-size="13" text-anchor="middle">แรงเสียดทาน</text>
  <rect x="380.0" y="134.8" width="120.0" height="115.2" rx="0" fill="#cfe7e2" stroke="#0a6b60" stroke-width="1.8"/>
  <text x="440.0" y="197.4" fill="#15211e" font-size="13" text-anchor="middle">Eₖ 360 J</text>
  <rect x="380.0" y="61.8" width="120.0" height="73.0" rx="0" fill="#f6c9b3" stroke="#b3261e" stroke-width="1.8"/>
  <text x="440.0" y="103.3" fill="#15211e" font-size="13" text-anchor="middle">ความร้อน 228 J</text>
  <text x="440.0" y="272.0" fill="#15211e" font-size="13" text-anchor="middle">ด้านล่างจริง</text>
  <line x1="40.0" y1="61.8" x2="530.0" y2="61.8" stroke="#6b7672" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="530.0" y="55.8" fill="#6b7672" font-size="13" text-anchor="end">พลังงานรวม 588 J</text>
</svg>
