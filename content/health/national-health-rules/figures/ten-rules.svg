<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="sans-serif">
<title>สุขบัญญัติแห่งชาติ 10 ประการ</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
<text x="380.0" y="34.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#111">สุขบัญญัติแห่งชาติ 10 ประการ</text>
<rect x="20.0" y="56.0" width="355.0" height="78.0" rx="10" fill="#e3f0e6" stroke="#335" stroke-width="1.5" />
<circle cx="54.0" cy="95.0" r="22.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="54.0" y="102.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">1</text>
<text x="86.0" y="90.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">ดูแลรักษาร่างกายและของใช้</text>
<text x="86.0" y="114.0" font-size="15" text-anchor="start" font-weight="normal" fill="#111">ให้สะอาด</text>
<rect x="20.0" y="146.0" width="355.0" height="78.0" rx="10" fill="#e3f0e6" stroke="#335" stroke-width="1.5" />
<circle cx="54.0" cy="185.0" r="22.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="54.0" y="192.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">2</text>
<text x="86.0" y="180.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">รักษาฟันให้แข็งแรงและแปรงฟัน</text>
<text x="86.0" y="204.0" font-size="15" text-anchor="start" font-weight="normal" fill="#111">ทุกวันอย่างถูกต้อง</text>
<rect x="20.0" y="236.0" width="355.0" height="78.0" rx="10" fill="#e3f0e6" stroke="#335" stroke-width="1.5" />
<circle cx="54.0" cy="275.0" r="22.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="54.0" y="282.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">3</text>
<text x="86.0" y="270.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">ล้างมือให้สะอาดก่อนกินอาหาร</text>
<text x="86.0" y="294.0" font-size="15" text-anchor="start" font-weight="normal" fill="#111">และหลังขับถ่าย</text>
<rect x="20.0" y="326.0" width="355.0" height="78.0" rx="10" fill="#e3f0e6" stroke="#335" stroke-width="1.5" />
<circle cx="54.0" cy="365.0" r="22.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="54.0" y="372.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">4</text>
<text x="86.0" y="360.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">กินอาหารสุก สะอาด ปราศจากสารอันตราย</text>
<text x="86.0" y="384.0" font-size="15" text-anchor="start" font-weight="normal" fill="#111">หลีกเลี่ยงอาหารรสจัด สีฉูดฉาด</text>
<rect x="20.0" y="416.0" width="355.0" height="78.0" rx="10" fill="#e3f0e6" stroke="#335" stroke-width="1.5" />
<circle cx="54.0" cy="455.0" r="22.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="54.0" y="462.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">5</text>
<text x="86.0" y="450.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">งดบุหรี่ สุรา สารเสพติด การพนัน</text>
<text x="86.0" y="474.0" font-size="15" text-anchor="start" font-weight="normal" fill="#111">และการสำส่อนทางเพศ</text>
<rect x="385.0" y="56.0" width="355.0" height="78.0" rx="10" fill="#e6eef8" stroke="#335" stroke-width="1.5" />
<circle cx="419.0" cy="95.0" r="22.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="419.0" y="102.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">6</text>
<text x="451.0" y="90.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">สร้างความสัมพันธ์ในครอบครัว</text>
<text x="451.0" y="114.0" font-size="15" text-anchor="start" font-weight="normal" fill="#111">ให้อบอุ่น</text>
<rect x="385.0" y="146.0" width="355.0" height="78.0" rx="10" fill="#e6eef8" stroke="#335" stroke-width="1.5" />
<circle cx="419.0" cy="185.0" r="22.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="419.0" y="192.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">7</text>
<text x="451.0" y="180.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">ป้องกันอุบัติภัย</text>
<text x="451.0" y="204.0" font-size="15" text-anchor="start" font-weight="normal" fill="#111">ด้วยความไม่ประมาท</text>
<rect x="385.0" y="236.0" width="355.0" height="78.0" rx="10" fill="#e6eef8" stroke="#335" stroke-width="1.5" />
<circle cx="419.0" cy="275.0" r="22.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="419.0" y="282.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">8</text>
<text x="451.0" y="270.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">ออกกำลังกายสม่ำเสมอ</text>
<text x="451.0" y="294.0" font-size="15" text-anchor="start" font-weight="normal" fill="#111">และตรวจสุขภาพประจำปี</text>
<rect x="385.0" y="326.0" width="355.0" height="78.0" rx="10" fill="#e6eef8" stroke="#335" stroke-width="1.5" />
<circle cx="419.0" cy="365.0" r="22.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="419.0" y="372.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">9</text>
<text x="451.0" y="360.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">ทำจิตใจให้ร่าเริงแจ่มใส</text>
<text x="451.0" y="384.0" font-size="15" text-anchor="start" font-weight="normal" fill="#111">อยู่เสมอ</text>
<rect x="385.0" y="416.0" width="355.0" height="78.0" rx="10" fill="#e6eef8" stroke="#335" stroke-width="1.5" />
<circle cx="419.0" cy="455.0" r="22.0" fill="#1f4e9a" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="419.0" y="462.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">10</text>
<text x="451.0" y="450.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">มีสำนึกต่อส่วนรวม</text>
<text x="451.0" y="474.0" font-size="15" text-anchor="start" font-weight="normal" fill="#111">ร่วมสร้างสรรค์สังคม</text>
<text x="380.0" y="512.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#444">ที่มา: กองสุขศึกษา กรมสนับสนุนบริการสุขภาพ กระทรวงสาธารณสุข</text>
</svg>
