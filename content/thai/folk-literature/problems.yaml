problems:
- id: thai.literature.folk-literature.p001
  topics:
  - thai.literature.folk-literature
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นลักษณะของ **วรรณกรรมพื้นบ้าน**
  choices:
  - id: a
    text: ไม่รู้ว่าใครแต่ง เล่าหรือร้องต่อ ๆ กันมา
    correct: true
    feedback: ถูก
  - id: b
    text: มีผู้แต่งคนเดียว และมีฉบับที่ถูกเพียงฉบับเดียว
    feedback: วรรณกรรมพื้นบ้านไม่รู้ผู้แต่ง และมีหลายสำนวน
  - id: c
    text: ต้องอ่านจากหนังสือเท่านั้น
    feedback: วรรณกรรมพื้นบ้านส่งต่อกันด้วยปาก
  - id: d
    text: ใช้คำยากที่เด็กไม่เข้าใจ
    feedback: วรรณกรรมพื้นบ้านใช้ภาษาง่าย มีคำคล้องจอง
  hints:
  - นึกถึงเพลงรีรีข้าวสาร ใครแต่ง
  - วรรณกรรมพื้นบ้านส่งต่อกันอย่างไร
  solution: วรรณกรรมพื้นบ้าน **ไม่รู้ผู้แต่ง** และ **เล่าหรือร้องปากต่อปาก** จึงมีหลายสำนวน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.folk-literature.p002
  topics:
  - thai.literature.folk-literature
  difficulty: 1
  type: match
  stem: จับคู่วรรณกรรมพื้นบ้านกับกลุ่มของมัน
  pairs:
  - left: รีรีข้าวสาร
    right: บทร้องเล่นของเด็ก
  - left: เจ้าเนื้อละมุนเอย
    right: เพลงกล่อมเด็ก
  - left: เพลงฉ่อย
    right: เพลงพื้นบ้าน
  - left: ปลาบู่ทอง
    right: นิทานพื้นบ้าน
  hints:
  - บทร้องเล่นร้องประกอบการเล่น เพลงกล่อมร้องให้เด็กนอน
  - เพลงพื้นบ้านผู้ใหญ่ร้องโต้ตอบ นิทานเป็นเรื่องเล่า
  solution: รีรีข้าวสาร = บทร้องเล่น · เจ้าเนื้อละมุน = เพลงกล่อมเด็ก · เพลงฉ่อย = เพลงพื้นบ้าน · ปลาบู่ทอง = นิทานพื้นบ้าน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.folk-literature.p003
  topics:
  - thai.literature.folk-literature
  difficulty: 2
  type: order
  stem: เรียงวรรคของบทร้องเล่น **รีรีข้าวสาร** ตามฉบับในบทเรียน (วิกิซอร์ซ)
  items:
  - รีรีข้าวสาร
  - สองทะนานข้าวเปลือก
  - เลือกท้องใบลาน
  - เก็บเบี้ยใต้ถุนร้าน
  - คดข้าวใส่จาน
  - พานเอาคนข้างหลังไว้
  hints:
  - คำท้ายวรรคมักคล้องจองกับคำในวรรคถัดไป
  - เปลือก คล้องกับ เลือก และ พาน อยู่วรรคสุดท้าย
  solution: รีรีข้าวสาร → สองทะนานข้าวเปลือก → เลือกท้องใบลาน → เก็บเบี้ยใต้ถุนร้าน → คดข้าวใส่จาน → พานเอาคนข้างหลังไว้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.folk-literature.p004
  topics:
  - thai.literature.folk-literature
  difficulty: 2
  type: mcq
  stem: 'บทร้องเล่น "โยกเยก" (วิกิซอร์ซ): โยกเยกเอย / น้ำท่วมเมฆ / กระต่ายลอยคอ / หมาหางงอ / กอดคอโยกเยก คำใด **คล้องจอง** กับคำว่า "คอ" ในวรรคที่ 3'
  choices:
  - id: a
    text: งอ
    correct: true
    feedback: ถูก คอ–งอ ใช้สระ -อ เหมือนกัน
  - id: b
    text: เมฆ
    feedback: คล้องจองกับ โยกเยก (สระ เ-)
  - id: c
    text: กระต่าย
    feedback: ไม่มีสระ -อ
  - id: d
    text: น้ำ
    feedback: ไม่คล้องจองกับ คอ
  hints:
  - คำคล้องจองมีเสียงสระและตัวสะกดเหมือนกัน
  - อ่านวรรคที่ 4
  solution: '**คอ–งอ** คล้องจองกัน (สระ -อ ไม่มีตัวสะกด)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.folk-literature.p005
  topics:
  - thai.literature.folk-literature
  difficulty: 2
  type: match
  stem: จับคู่ภาคกับเพลงพื้นบ้าน
  pairs:
  - left: ภาคกลาง
    right: ลำตัด
  - left: ภาคเหนือ
    right: ซอ
  - left: ภาคอีสาน
    right: หมอลำ
  - left: ภาคใต้
    right: เพลงบอก
  hints:
  - ซอ ในภาษาถิ่นเหนือแปลว่าร้องเพลง
  - เพลงบอกใช้บอกข่าวช่วงสงกรานต์ในภาคใต้
  solution: กลาง = ลำตัด · เหนือ = ซอ · อีสาน = หมอลำ · ใต้ = เพลงบอก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.folk-literature.p006
  topics:
  - thai.literature.folk-literature
  difficulty: 2
  type: mcq
  stem: '"**คด**ข้าวใส่จาน" ในรีรีข้าวสาร คำว่า คด หมายความว่าอย่างไร'
  choices:
  - id: a
    text: ตักข้าวสุกออกจากหม้อ
    correct: true
    feedback: ถูก ตามพจนานุกรมฉบับราชบัณฑิตยสถาน
  - id: b
    text: ไม่ตรง งอ
    feedback: เป็นอีกความหมายของ คด ซึ่งไม่เข้ากับบริบท
  - id: c
    text: ไม่ซื่อ โกง
    feedback: เป็นอีกความหมาย ไม่เข้ากับการใส่ข้าวในจาน
  - id: d
    text: หุงข้าว
    feedback: หุงคือทำให้สุก ไม่ใช่การตัก
  hints:
  - คำหลายความหมายต้องดูบริบท
  - ทำอะไรกับข้าวเพื่อใส่จาน
  solution: '**คด** ในที่นี้คือ **ตักข้าวสุกออกจากหม้อ** ใส่จาน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.folk-literature.p007
  topics:
  - thai.literature.folk-literature
  difficulty: 3
  type: mcq
  stem: '"สองทะนานข้าวเปลือก" **ทะนาน** คืออะไร'
  choices:
  - id: a
    text: เครื่องตวงข้าว ทำจากกะโหลกมะพร้าวหรือทองเหลือง
    correct: true
    feedback: ถูก ทะนานเป็นเครื่องตวงสมัยก่อน และเป็นหน่วยตวงด้วย
  - id: b
    text: ถุงใส่ข้าว
    feedback: ไม่ใช่ ทะนานใช้ตวง
  - id: c
    text: ยุ้งเก็บข้าว
    feedback: ยุ้งเป็นที่เก็บข้าวขนาดใหญ่
  - id: d
    text: คนสีข้าว
    feedback: ทะนานเป็นสิ่งของ ไม่ใช่คน
  hints:
  - คำว่า สอง นำหน้า แสดงว่าทะนานใช้นับปริมาณ
  - คนสมัยก่อนตวงข้าวด้วยอะไร
  solution: '**ทะนาน** คือเครื่องตวงสมัยก่อน ทำจากกะโหลกมะพร้าวหรือทองเหลือง'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.folk-literature.p008
  topics:
  - thai.literature.folk-literature
  difficulty: 3
  type: mcq
  stem: '"เก็บ**เบี้ย**ใต้ถุนร้าน" เบี้ย คืออะไร'
  choices:
  - id: a
    text: เปลือกหอยที่ใช้เป็นเงินในสมัยก่อน
    correct: true
    feedback: ถูก เปลือกหอยเบี้ยเคยใช้เป็นเงินตรา
  - id: b
    text: เมล็ดข้าว
    feedback: ข้าวพูดถึงแล้วในวรรคอื่น
  - id: c
    text: ขนมชนิดหนึ่ง
    feedback: ไม่ใช่
  - id: d
    text: เบี้ยเลี้ยงที่ได้จากการทำงาน
    feedback: เป็นความหมายสมัยใหม่ ไม่ตรงกับบทร้องเก่า
  hints:
  - คนสมัยก่อนใช้อะไรเป็นเงิน
  - คำว่า เบี้ย ยังอยู่ในสำนวน เบี้ยน้อยหอยน้อย
  solution: '**เบี้ย** คือเปลือกหอยที่ใช้เป็นเงินในสมัยก่อน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.folk-literature.p009
  topics:
  - thai.literature.folk-literature
  difficulty: 3
  type: mcq
  stem: นิทานพื้นบ้านอีสานเรื่อง **ก่องข้าวน้อยฆ่าแม่** ให้ข้อคิดข้อใดชัดที่สุด
  choices:
  - id: a
    text: อย่าตัดสินใจทำสิ่งใดตอนโกรธ และควรกตัญญูต่อพ่อแม่
    correct: true
    feedback: ถูก ลูกทำร้ายแม่เพราะโกรธ แล้วจึงรู้ว่าข้าวพอกิน เสียใจภายหลัง
  - id: b
    text: ควรกินข้าวให้มาก ๆ
    feedback: ไม่ได้มาจากเรื่อง
  - id: c
    text: ก่องข้าวควรมีขนาดใหญ่
    feedback: เป็นรายละเอียด ไม่ใช่ข้อคิด
  - id: d
    text: ควรสร้างเจดีย์ไว้ทุกหมู่บ้าน
    feedback: การสร้างเจดีย์เป็นเหตุการณ์ในเรื่อง ไม่ใช่ข้อคิด
  hints:
  - ตัวละครทำอะไร และผลเป็นอย่างไร
  - เขาเสียใจเพราะอะไร
  solution: 'ลูกโกรธจนทำร้ายแม่ แล้วรู้ว่าตนเข้าใจผิด ข้อคิด: **อย่าทำสิ่งใดตอนโกรธ** และ **กตัญญูต่อพ่อแม่**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.folk-literature.p010
  topics:
  - thai.literature.folk-literature
  difficulty: 3
  type: mcq
  stem: เพลงกล่อมเด็ก "เจ้าเนื้อละมุนเอย เจ้าเนื้ออุ่นเหมือนสำลี แม่มิให้ผู้ใดต้อง..." บอกความรู้สึกใดของแม่
  choices:
  - id: a
    text: รักและหวงแหนลูก
    correct: true
    feedback: ถูก แม่เปรียบลูกเหมือนสำลีและทองดี ไม่ให้ใครแตะต้อง
  - id: b
    text: โกรธลูก
    feedback: ไม่มีคำที่แสดงความโกรธ
  - id: c
    text: เบื่อที่ต้องกล่อมลูก
    feedback: ไม่มีคำที่แสดงความเบื่อ
  - id: d
    text: กลัวสำลีหาย
    feedback: สำลีเป็นสิ่งที่ใช้เปรียบ ไม่ใช่เรื่องจริง
  hints:
  - แม่เปรียบลูกกับอะไร
  - คำว่า มิให้ผู้ใดต้อง แสดงความรู้สึกอย่างไร
  solution: แม่เปรียบลูกกับสำลีและทองดี และไม่ให้ใครแตะต้อง แสดงว่า **รักและหวงแหนลูก**
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.folk-literature.p011
  topics:
  - thai.literature.folk-literature
  difficulty: 3
  type: text
  stem: บทร้องเล่น "มอญซ่อนผ้า / ตุ๊กตาอยู่ข้างหลัง" คำใดในวรรคที่ 2 **คล้องจอง** กับคำว่า "ผ้า" (พิมพ์คำเดียว)
  accepted:
  - ตา
  - ตุ๊กตา
  misconceptions:
  - match: หลัง
    feedback: หลังเป็นคำท้ายวรรค แต่สระ -ั ง ไม่ตรงกับ ผ้า
  - match: ข้าง
    feedback: ข้าง มีตัวสะกด ง ไม่คล้องกับ ผ้า
  hints:
  - ผ้า ใช้สระ -า ไม่มีตัวสะกด
  - หาคำในวรรคที่ 2 ที่ลงท้ายด้วยเสียง -า
  solution: '**ผ้า–(ตุ๊ก)ตา** ใช้สระ -า ไม่มีตัวสะกดเหมือนกัน'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.folk-literature.p012
  topics:
  - thai.literature.folk-literature
  difficulty: 4
  type: mcq
  stem: ฉบับหนึ่งของรีรีข้าวสารจบว่า "...พานเอาคนข้างหลังไว้" อีกฉบับจบว่า "...พานเอาคนข้างหลังไว้ให้ดี" ข้อสรุปใดถูกต้อง
  choices:
  - id: a
    text: ทั้งสองฉบับเป็นสำนวนของวรรณกรรมพื้นบ้านที่ต่างกันได้
    correct: true
    feedback: ถูก วรรณกรรมพื้นบ้านส่งต่อปากต่อปาก จึงมีหลายสำนวน
  - id: b
    text: ฉบับที่ยาวกว่าถูก อีกฉบับผิด
    feedback: ไม่มีฉบับต้นแบบที่ผู้แต่งเขียนไว้
  - id: c
    text: ฉบับที่สั้นกว่าถูก อีกฉบับผิด
    feedback: ไม่มีฉบับต้นแบบที่ผู้แต่งเขียนไว้
  - id: d
    text: ต้องถามผู้แต่งว่าฉบับใดถูก
    feedback: วรรณกรรมพื้นบ้านไม่รู้ผู้แต่ง
  hints:
  - วรรณกรรมพื้นบ้านส่งต่อกันอย่างไร
  - รู้ผู้แต่งหรือไม่
  solution: วรรณกรรมพื้นบ้าน **มีหลายสำนวน** ทั้งสองฉบับจึงเป็นสำนวนที่ร้องกันจริง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.folk-literature.p013
  topics:
  - thai.literature.folk-literature
  difficulty: 4
  type: mcq
  stem: '**เพลงกล่อมเด็ก** ต่างจาก **บทร้องเล่น** อย่างไร'
  choices:
  - id: a
    text: เพลงกล่อมเด็กผู้ใหญ่ร้องให้เด็กนอน ทำนองช้า บทร้องเล่นเด็กร้องเองประกอบการเล่น
    correct: true
    feedback: ถูก
  - id: b
    text: เพลงกล่อมเด็กมีผู้แต่ง บทร้องเล่นไม่มี
    feedback: ทั้งสองแบบส่วนใหญ่ไม่รู้ผู้แต่ง
  - id: c
    text: บทร้องเล่นร้องตอนนอน เพลงกล่อมร้องตอนเล่น
    feedback: สลับกัน
  - id: d
    text: ไม่ต่างกัน
    feedback: ต่างกันทั้งผู้ร้องและจุดประสงค์
  hints:
  - ใครร้อง ร้องเมื่อไร
  - จุดประสงค์ของแต่ละแบบคืออะไร
  solution: 'เพลงกล่อมเด็ก: ผู้ใหญ่ร้องให้เด็ก **นอน** · บทร้องเล่น: เด็กร้องเอง **ประกอบการเล่น**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.folk-literature.p014
  topics:
  - thai.literature.folk-literature
  difficulty: 4
  type: order
  stem: เรียงขั้นตอนการ **เล่านิทานพื้นบ้าน** ให้เพื่อนฟัง
  items:
  - บอกชื่อนิทานและว่าเป็นนิทานของถิ่นใด
  - แนะนำตัวละครและสถานที่
  - เล่าเหตุการณ์ตามลำดับจนจบ
  - บอกข้อคิดที่ได้จากเรื่อง
  hints:
  - เริ่มจากบอกว่าเป็นเรื่องอะไร
  - ข้อคิดอยู่ท้ายสุด
  solution: ชื่อและถิ่นของนิทาน → ตัวละครและสถานที่ → เหตุการณ์ตามลำดับ → ข้อคิด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: thai.literature.folk-literature.p015
  topics:
  - thai.literature.folk-literature
