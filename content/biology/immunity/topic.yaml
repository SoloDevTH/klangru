id: biology.animals.immunity
subject: biology
title: { th: ภูมิคุ้มกัน, en: "Immunity" }
summary: เชื้อก่อโรคในสัตว์และพืช กลไกต่อต้านสิ่งแปลกปลอมแบบไม่จำเพาะและแบบจำเพาะ ภูมิคุ้มกันก่อเองและรับมา วัคซีน ภูมิคุ้มกันหมู่ ภูมิแพ้ ภูมิต้านทานต่อเนื้อเยื่อตนเอง และเอชไอวี
difficulty: 6
minutes: 50
prerequisites: [biology.animals.circulation]
encompasses:
  - { id: biology.animals.circulation, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แผนผังกลไกต่อต้านสิ่งแปลกปลอม
    src: immune-overview.svg
    alt: "แผนผังเริ่มจากสิ่งแปลกปลอม เช่น แบคทีเรีย ไวรัส รา พิษ ฝั่งซ้ายคือแบบไม่จำเพาะ ด่านที่ 1 สิ่งกีดขวาง ได้แก่ ผิวหนัง เยื่อเมือก ขนจมูก น้ำตาที่มีไลโซไซม์ กรดในกระเพาะ ต่อด้วยด่านที่ 2 ภายในร่างกาย ได้แก่ ฟาโกไซต์ (นิวโทรฟิล แมโครฟาจ) การอักเสบ ไข้ เซลล์เอ็นเค อินเตอร์เฟอรอน ซึ่งเกิดทันทีและทำงานแบบเดียวกันกับสิ่งแปลกปลอมทุกชนิด ฝั่งขวาคือแบบจำเพาะ (ด่านที่ 3) แมโครฟาจนำเสนอแอนติเจนให้เซลล์ทีผู้ช่วย เซลล์ทีผู้ช่วยกระตุ้นสองทาง ทางแรกภูมิคุ้มกันแบบสารน้ำ เซลล์บีเปลี่ยนเป็นเซลล์พลาสมาสร้างแอนติบอดีจับแอนติเจนในของเหลว ทางที่สองภูมิคุ้มกันแบบใช้เซลล์ เซลล์ทีพิฆาตทำลายเซลล์ที่ติดเชื้อและเซลล์มะเร็ง ทั้งสองทางให้เซลล์ความจำ (บีและที) ซึ่งเมื่อพบแอนติเจนเดิมอีกจะตอบสนองเร็วและแรงกว่า ด้านล่างเขียนว่าวัคซีนกระตุ้นให้เกิดเซลล์ความจำโดยไม่ต้องป่วยเป็นโรคก่อน"
    caption: "แบบไม่จำเพาะเกิดทันที แบบจำเพาะเกิดช้ากว่าแต่จำได้ (วาดโดยทีมคลังรู้)"
  - type: figure
    title: การตอบสนองปฐมภูมิและทุติยภูมิ
    src: antibody-response.svg
    alt: "กราฟระดับแอนติบอดีในเลือดกับเวลา 0 ถึง 70 วัน ได้รับแอนติเจนครั้งที่ 1 ในวันที่ 0 แอนติบอดีเริ่มขึ้นราววันที่ 5 สูงสุดราว 10 หน่วยในวันที่ 14 แล้วค่อย ๆ ลดลงเกือบศูนย์ ได้รับแอนติเจนเดิมครั้งที่ 2 ในวันที่ 42 แอนติบอดีขึ้นเร็วมาก สูงสุดราว 100 หน่วยในวันที่ 49 แล้วลดลงช้า ๆ ยังเหลือราว 55 หน่วยในวันที่ 70 ป้ายบอกว่าครั้งแรกช้าและระดับต่ำ ครั้งที่สองเร็วและระดับสูง"
    caption: "เซลล์ความจำทำให้การตอบสนองครั้งที่สองเร็วและแรงกว่า (วาดโดยทีมคลังรู้ ข้อมูลเพื่อแสดงแนวโน้ม)"
  - { type: check, problem: biology.animals.immunity.p005, prompt: "นึกถึงกราฟการตอบสนองครั้งที่สอง" }
  - type: worked-example
    title: ภูมิคุ้มกันหมู่ต้องครอบคลุมเท่าใด
    problem: "โรคหัดแพร่ได้ง่ายมาก ผู้ป่วย 1 คนในชุมชนที่ไม่มีภูมิคุ้มกันแพร่เชื้อต่อได้ราว 12–18 คน ถ้าใช้ค่า 15 คน ชุมชนต้องมีผู้มีภูมิคุ้มกันอย่างน้อยร้อยละเท่าใดการระบาดจึงหยุดลง"
    steps:
      - text: "ให้ $R_0 = 15$ คือจำนวนคนที่ผู้ป่วย 1 คนแพร่เชื้อให้เมื่อทุกคนไม่มีภูมิคุ้มกัน"
      - text: "ถ้าสัดส่วน $p$ ของชุมชนมีภูมิคุ้มกัน ผู้ป่วย 1 คนแพร่ต่อได้เฉลี่ย $R_0(1 - p)$ คน"
      - text: "การระบาดหยุดเมื่อ $R_0(1 - p) < 1$ จึงได้ $p > 1 - \\tfrac{1}{R_0} = 1 - \\tfrac{1}{15}$"
        why: "ถ้าผู้ป่วยแต่ละคนแพร่ต่อได้ไม่ถึง 1 คน จำนวนผู้ป่วยจะลดลงทุกรอบ"
      - text: "$1 - \\tfrac{1}{15} \\approx 0.933$ หรือร้อยละ 93.3"
    answer: "อย่างน้อยราวร้อยละ 93 องค์การอนามัยโลกจึงตั้งเป้าความครอบคลุมวัคซีนหัด 2 เข็มที่ร้อยละ 95"
  - { type: check, problem: biology.animals.immunity.p004, prompt: "ถามว่าร่างกายสร้างแอนติบอดีเองหรือได้รับแอนติบอดีสำเร็จรูป" }
glossary:
  - { term: แอนติเจน, definition: "สารหรือส่วนของสิ่งแปลกปลอมที่กระตุ้นให้ร่างกายสร้างภูมิคุ้มกันแบบจำเพาะ" }
  - { term: แอนติบอดี, definition: "โปรตีนรูปตัว Y ที่เซลล์พลาสมาสร้าง จับกับแอนติเจนอย่างจำเพาะ" }
  - { term: ฟาโกไซต์, definition: "เซลล์เม็ดเลือดขาวที่กินสิ่งแปลกปลอม เช่น นิวโทรฟิล แมโครฟาจ" }
  - { term: เซลล์ทีผู้ช่วย, definition: "ลิมโฟไซต์ที่กระตุ้นเซลล์บีและเซลล์ทีพิฆาต เป็นเซลล์ที่เอชไอวีทำลาย" }
  - { term: เซลล์ความจำ, definition: "ลิมโฟไซต์ที่อยู่ได้นาน จำแอนติเจนเดิมได้ ทำให้การตอบสนองครั้งต่อไปเร็วและแรง" }
  - { term: ภูมิคุ้มกันก่อเอง, definition: "ภูมิคุ้มกันที่ร่างกายสร้างแอนติบอดีและเซลล์ความจำเอง เช่น หลังป่วยหรือได้รับวัคซีน" }
  - { term: ภูมิคุ้มกันรับมา, definition: "ภูมิคุ้มกันจากการได้รับแอนติบอดีสำเร็จรูป เช่น เซรุ่ม น้ำนมแม่" }
  - { term: ภูมิคุ้มกันหมู่, definition: "การที่คนส่วนใหญ่มีภูมิคุ้มกันจนเชื้อแพร่ต่อได้ยาก ช่วยปกป้องคนที่ไม่มีภูมิคุ้มกัน" }
flashcards:
  - { front: "แบบไม่จำเพาะกับแบบจำเพาะ ต่างกันอย่างไร", back: "ไม่จำเพาะ: เกิดทันที ทำงานแบบเดียวกันกับทุกชนิด จำเพาะ: ต่อแอนติเจนชนิดเดียว ช้ากว่า มีเซลล์ความจำ" }
  - { front: "วัคซีนกับเซรุ่ม", back: "วัคซีน = ก่อเอง ช้า อยู่นาน เซรุ่ม = รับมา ได้ผลทันที อยู่ไม่นาน" }
  - { front: "เอชไอวีทำลายเซลล์ใด", back: "เซลล์ทีผู้ช่วย (CD4)" }
  - { front: "สารที่เซลล์มาสต์หลั่งเมื่อแพ้", back: "ฮิสตามีน" }
  - { front: "ภูมิคุ้มกันหมู่ ต้องครอบคลุมอย่างน้อย", back: "1 − 1/R₀ ของประชากร" }
