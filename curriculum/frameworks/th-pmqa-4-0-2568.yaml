copyright: "เอกสารของหน่วยงานรัฐ ไม่พบข้อความเรื่องสัญญาอนุญาต คู่มือการประเมินไม่ใช่กฎหมาย ระเบียบ หรือประกาศตาม พ.ร.บ.ลิขสิทธิ์ พ.ศ. 2537 มาตรา 7 ที่ชัดเจน จึงถือว่ามีลิขสิทธิ์ของสำนักงาน ก.พ.ร. ไฟล์นี้เก็บเฉพาะรหัส ชื่อหมวดและชื่อประเด็น กับสรุปด้วยคำของคลังรู้"
completeness: structure-and-summary
strands:
  - id: "1"
    title: หมวด 1 การนำองค์การ
    standards:
      - id: "1"
        text: "ผู้บริหารกำหนดทิศทาง กำกับดูแล และมุ่งผลลัพธ์ต่อประเทศ (สรุปความ)"
        indicators:
          - { id: "1.1", text: "ระบบการนำองค์การที่สร้างความยั่งยืน: ผู้บริหารวิเคราะห์ปัจจัยภายในภายนอก กำหนดวิสัยทัศน์และทิศทางที่เชื่อมกับพันธกิจ ประโยชน์สุขของประชาชน และยุทธศาสตร์ชาติ" }
          - { id: "1.2", text: "ระบบการกำกับดูแลที่มีประสิทธิภาพและสร้างความโปร่งใส: ป้องกันและปราบปรามการทุจริต วิเคราะห์ความเสี่ยงด้านทุจริต และเปิดเผยการทำงานให้ตรวจสอบได้" }
          - { id: "1.3", text: "คำนึงถึงผลกระทบต่อสังคมและการมุ่งเน้นให้เกิดผลลัพธ์: จัดการความเสี่ยงและความกังวลของสาธารณะต่อโครงการ และติดตามผลกระทบของการดำเนินงาน" }
  - id: "2"
    title: หมวด 2 การวางแผนเชิงยุทธศาสตร์
    standards:
      - id: "2"
        text: "จัดทำ ถ่ายทอด และติดตามแผนยุทธศาสตร์ (สรุปความ)"
        indicators:
          - { id: "2.1", text: "แผนยุทธศาสตร์ที่ตอบสนองความท้าทายและสร้างนวัตกรรมเพื่อการเปลี่ยนแปลง: วิเคราะห์ความท้าทายและโอกาส แล้วกำหนดยุทธศาสตร์และเป้าหมายที่ท้าทาย" }
          - { id: "2.2", text: "การขับเคลื่อนเป้าหมายยุทธศาสตร์ทั้งระยะสั้นและระยะยาว สอดคล้องพันธกิจและยุทธศาสตร์ประเทศ: แปลงยุทธศาสตร์เป็นแผนปฏิบัติการ ตัวชี้วัด และการจัดสรรทรัพยากรผ่านเครือข่าย" }
          - { id: "2.3", text: "การติดตามการเปลี่ยนแปลง การปรับแผน และการรายงานผล: ติดตามความก้าวหน้า ปรับแผนเมื่อสถานการณ์เปลี่ยน และรายงานผลอย่างโปร่งใส" }
  - id: "3"
    title: หมวด 3 การให้ความสำคัญกับผู้รับบริการและผู้มีส่วนได้ส่วนเสีย
    standards:
      - id: "3"
        text: "เข้าใจความต้องการและยกระดับบริการประชาชน (สรุปความ)"
        indicators:
          - { id: "3.1", text: "ระบบข้อมูลและสารสนเทศที่ทันสมัยเพื่อการบริการและการเข้าถึง: เก็บและใช้ข้อมูลผู้รับบริการ เปิดช่องทางเข้าถึงบริการที่หลากหลาย" }
          - { id: "3.2", text: "การปรับปรุงและการสร้างนวัตกรรมการบริการและตอบสนองความต้องการ: ใช้ผลความพึงพอใจและข้อร้องเรียนปรับปรุงบริการ และออกแบบบริการใหม่" }
          - { id: "3.3", text: "การมุ่งเน้นประชาชน: ให้ประชาชนและผู้มีส่วนได้ส่วนเสียมีส่วนร่วม และจัดบริการเชิงรุกโดยยึดประชาชนเป็นศูนย์กลาง" }
  - id: "4"
    title: หมวด 4 การวัด วิเคราะห์ และการจัดการความรู้
    standards:
      - id: "4"
        text: "ใช้ข้อมูล ตัววัด และความรู้ในการบริหาร (สรุปความ)"
        indicators:
          - { id: "4.1", text: "การใช้ฐานข้อมูลและการกำหนดตัววัดเพื่อการติดตามงานอย่างมีประสิทธิผล: เลือกตัววัดระดับปฏิบัติการและยุทธศาสตร์ วิเคราะห์ผล และใช้ข้อมูลตัดสินใจ" }
          - { id: "4.2", text: "การบริหารจัดการข้อมูล สารสนเทศ การดูแลความเสี่ยงด้านข้อมูลและระบบความมั่นคงทางไซเบอร์: ทำให้ข้อมูลถูกต้อง ใช้งานได้ และปลอดภัย" }
          - { id: "4.3", text: "การใช้องค์ความรู้ของส่วนราชการในการแก้ปัญหา เรียนรู้ และเพื่อพัฒนาส่วนราชการ: รวบรวม แบ่งปัน และต่อยอดความรู้ขององค์การ" }
  - id: "5"
    title: หมวด 5 การมุ่งเน้นบุคลากร
    standards:
      - id: "5"
        text: "บริหาร พัฒนา และสร้างวัฒนธรรมการทำงานของบุคลากร (สรุปความ)"
        indicators:
          - { id: "5.1", text: "ระบบการจัดการบุคลากรตอบสนองยุทธศาสตร์และสร้างแรงจูงใจ: วางแผนอัตรากำลังและขีดความสามารถ และสร้างแรงจูงใจให้บุคลากร" }
          - { id: "5.2", text: "วัฒนธรรมการทำงานที่ดี คล่องตัว รับผิดชอบ สู่การเกิดผลงานที่มีสมรรถนะสูงและนวัตกรรม: สร้างความผูกพันและการทำงานร่วมกันข้ามหน่วยงาน" }
          - { id: "5.3", text: "ระบบการพัฒนาและการเรียนรู้ของบุคลากร: พัฒนาทักษะ รวมถึงทักษะดิจิทัล และวัดผลของการพัฒนา" }
  - id: "6"
    title: หมวด 6 การมุ่งเน้นระบบปฏิบัติการ
    standards:
      - id: "6"
        text: "ออกแบบ ปรับปรุง และสร้างนวัตกรรมกระบวนการทำงาน (สรุปความ)"
        indicators:
          - { id: "6.1", text: "การออกแบบและการจัดการกระบวนการทำงานที่เชื่อมโยงตั้งแต่ต้นจนจบนำสู่ผลลัพธ์ที่ต้องการ: กำหนดข้อกำหนดของกระบวนการ ตัวชี้วัด และควบคุมกระบวนการ" }
          - { id: "6.2", text: "การสร้างนวัตกรรมในการปรับปรุงผลผลิต กระบวนการ การบริการ: ปรับปรุงกระบวนการต่อเนื่อง ลดต้นทุนและขั้นตอน และนำเทคโนโลยีมาใช้" }
          - { id: "6.3", text: "การมุ่งเน้นประสิทธิผลทั้งองค์การและผลกระทบต่อยุทธศาสตร์ประเทศ: เชื่อมกระบวนการกับหน่วยงานอื่นและวัดผลกระทบต่อประชาชนและประเทศ" }
  - id: "7"
    title: หมวด 7 ผลลัพธ์การดำเนินการ
    standards:
      - id: "7"
        text: "ตัวชี้วัดผลลัพธ์หกด้าน (สรุปความ)"
        indicators:
          - { id: "7.1", text: "ตัวชี้วัดด้านประสิทธิผลและการบรรลุพันธกิจ: ผลตามแผนปฏิบัติราชการที่เชื่อมกับพันธกิจหลักและยุทธศาสตร์" }
          - { id: "7.2", text: "ตัวชี้วัดด้านผู้รับบริการ และประชาชน: ความพึงพอใจ ความไม่พึงพอใจ และความผูกพันของผู้รับบริการและผู้มีส่วนได้ส่วนเสีย" }
          - { id: "7.3", text: "ตัวชี้วัดด้านบุคลากร: การพัฒนา การเรียนรู้ ความก้าวหน้า และการทำงานร่วมกันของบุคลากร" }
          - { id: "7.4", text: "ตัวชี้วัดด้านการเป็นต้นแบบ: ผู้บริหาร บุคลากร หรือวิธีปฏิบัติที่เป็นแบบอย่างให้หน่วยงานอื่น" }
          - { id: "7.5", text: "ตัวชี้วัดด้านผลกระทบต่อเศรษฐกิจ สังคม สาธารณสุข และสิ่งแวดล้อม: ผลที่เกิดกับพื้นที่และประเทศนอกเหนือจากเป้าหมายของงาน" }
          - { id: "7.6", text: "ตัวชี้วัดด้านประสิทธิผลและการจัดการกระบวนการ: การลดต้นทุน นวัตกรรม และผลของการจัดการกระบวนการ" }
