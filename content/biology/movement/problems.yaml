    ai_assisted: true

  - id: biology.animals.movement.p014
    topics: [biology.animals.movement]
    difficulty: 4
    type: numeric
    stem: "ไบเซปส์ของนักเรียนออกแรงได้มากที่สุด 600 N ยึดห่างข้อศอก 4 cm ถ้าปลายแขนอยู่ในแนวระดับ และไม่คิดน้ำหนักปลายแขน นักเรียนถือของในมือที่ระยะ 35 cm จากข้อศอกได้หนักที่สุดกี่นิวตัน (ตอบทศนิยม 1 ตำแหน่ง)"
    answer: { value: 68.6, unit: N, tolerance: 0.7 }
    misconceptions:
      - { match: 5250, feedback: "สลับระยะ แรงของของในมือต้องน้อยกว่าแรงกล้ามเนื้อ เพราะอยู่ไกลจุดหมุนกว่า" }
      - { match: 600, feedback: "ของในมือหนักเท่าแรงกล้ามเนื้อไม่ได้ เพราะระยะจากจุดหมุนต่างกัน" }
    hints:
      - "โมเมนต์ของไบเซปส์ = โมเมนต์ของของในมือ"
      - "$600 \\times 4 = W \\times 35$"
    solution: "$W = \\frac{600 \\times 4}{35} = \\frac{2400}{35} \\approx 68.6$ N ไบเซปส์ยึดใกล้ข้อศอก จึงยกของได้เบากว่าแรงที่ออกมาก แต่ทำให้มือเคลื่อนได้ไกลและเร็ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.animals.movement.p015
    topics: [biology.animals.movement]
    difficulty: 4
    type: mcq
    stem: "เนื้ออกไก่ที่ขายในตลาดส่วนใหญ่คือกล้ามเนื้อเพกทอรัลเมเจอร์ ในนกที่บินได้ กล้ามเนื้อนี้มีขนาดใหญ่มากและยึดกับสันกระดูกอก ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "กล้ามเนื้อนี้หดตัวดึงปีกลง ซึ่งเป็นจังหวะที่สร้างแรงยกมากที่สุด จึงต้องใหญ่และต้องการสันกระดูกอกกว้างให้ยึด", correct: true }
      - { id: b, text: "กล้ามเนื้อนี้หดตัวดันปีกขึ้น", feedback: "กล้ามเนื้อดันไม่ได้ และเพกทอรัลเมเจอร์ดึงปีกลง ส่วนการยกปีกใช้กล้ามเนื้ออีกมัดที่อยู่ใต้ลงไป" }
      - { id: c, text: "กล้ามเนื้อนี้ใหญ่เพราะเก็บอากาศไว้ช่วยให้ตัวเบา", feedback: "อากาศเก็บในถุงลมและกระดูกกลวง ไม่ใช่ในกล้ามเนื้อ" }
      - { id: d, text: "สันกระดูกอกมีไว้ป้องกันหัวใจเพียงอย่างเดียว", feedback: "สันกระดูกอกเป็นที่ยึดของกล้ามเนื้อบินขนาดใหญ่" }
    hints:
      - "จังหวะใดของการกระพือปีกที่ต้องออกแรงมากที่สุด"
      - "กล้ามเนื้อใหญ่ต้องมีพื้นที่ยึดกับกระดูกมาก"
    solution: "เพกทอรัลเมเจอร์หดตัวดึงปีกลง ซึ่งผลักอากาศลงและยกตัวนกขึ้น จึงเป็นกล้ามเนื้อที่ใหญ่ที่สุดของนก และต้องการสันกระดูกอกที่กว้างเป็นที่ยึด"
