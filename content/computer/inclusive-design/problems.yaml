      - { id: b, text: "แอปอาจมีสีไม่ตรงกับสีประจำโรงเรียน", feedback: "เป็นเรื่องความสวยงาม ไม่ได้ทำให้นักเรียนกลุ่มใดเสียโอกาส" }
      - { id: c, text: "ครูจะตรวจงานได้เร็วขึ้น", feedback: "เป็นข้อดีของระบบ ไม่ใช่ปัญหาความเสมอภาค" }
