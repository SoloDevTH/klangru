    ai_assisted: true

  - id: computer.systems.physical-computing.p015
    topics: [computer.systems.physical-computing]
    difficulty: 5
    type: numeric
    stem: "กราฟแสดงค่าความชื้นดินที่อ่านได้ 14 ครั้ง ระบบใช้สองเกณฑ์: ปั๊มเริ่มต้นปิด เปิดเมื่อค่าที่อ่าน **ต่ำกว่า 30%** และปิดเมื่อค่าที่อ่าน **เกิน 60%** ระหว่างนั้นคงสถานะเดิม หลังอ่านแต่ละครั้งแล้วตัดสินใจ ปั๊มอยู่ในสถานะเปิดทั้งหมดกี่ครั้งจาก 14 ครั้ง"
    figure:
      src: moisture-readings.svg
      alt: "กราฟเส้นค่าความชื้นดิน แกนนอนคือครั้งที่อ่าน 1 ถึง 14 แกนตั้งคือความชื้น 0 ถึง 80 เปอร์เซ็นต์ ค่าที่อ่านตามลำดับคือ 55, 42, 31, 28, 35, 47, 58, 63, 50, 33, 29, 26, 45, 61 มีเส้นประแนวนอนที่ 30 เปอร์เซ็นต์ ป้ายว่าเกณฑ์เปิดปั๊ม และที่ 60 เปอร์เซ็นต์ ป้ายว่าเกณฑ์ปิดปั๊ม"
    answer: { value: 7, unit: "ครั้ง" }
    hints:
      - "จดสถานะปั๊มหลังอ่านแต่ละครั้ง เริ่มจากปิด"
      - "เมื่อเปิดแล้ว ปั๊มจะเปิดค้างไปจนกว่าจะพบค่าที่เกิน 60 (ค่า 35, 47, 58 ยังไม่ทำให้ปิด)"
    misconceptions:
      - { match: 3, feedback: "นับเฉพาะค่าที่ต่ำกว่า 30 ซึ่งเป็นการคิดแบบเกณฑ์เดียว แต่ระบบนี้คงสถานะเปิดไว้จนค่าเกิน 60" }
      - { match: 2, feedback: "2 คือจำนวนครั้งที่ปั๊มเริ่มเปิด โจทย์ถามจำนวนครั้งที่อ่านแล้วปั๊มอยู่ในสถานะเปิด" }
    solution: "ครั้งที่ 1–3 (55, 42, 31) ปิด ครั้งที่ 4 (28) ต่ำกว่า 30 จึงเปิด ครั้งที่ 5–7 (35, 47, 58) ยังไม่เกิน 60 เปิดค้าง ครั้งที่ 8 (63) เกิน 60 จึงปิด ครั้งที่ 9–10 (50, 33) ปิด ครั้งที่ 11 (29) เปิด ครั้งที่ 12–13 (26, 45) เปิดค้าง ครั้งที่ 14 (61) ปิด ปั๊มเปิดในครั้งที่ 4, 5, 6, 7, 11, 12, 13 รวม 7 ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.physical-computing.p016
    topics: [computer.systems.physical-computing]
    difficulty: 5
    type: numeric
    stem: "เซนเซอร์ไร้สายใช้กระแส 0.5 mA ขณะหลับ และ 80 mA ขณะส่งข้อมูล ทุก 10 นาที (600 วินาที) มันส่งข้อมูล 2 วินาทีแล้วหลับ 598 วินาที แบตเตอรี่ 2,000 mAh จะใช้ได้ประมาณกี่วัน (คิดจากกระแสเฉลี่ย ปัดทศนิยม 1 ตำแหน่ง)"
    answer: { value: 108.9, tolerance: 1.1, unit: "วัน" }
    hints:
      - "กระแสเฉลี่ย = (0.5 × 598 + 80 × 2) ÷ 600 mA"
      - "ชั่วโมงที่ใช้ได้ = 2,000 mAh ÷ กระแสเฉลี่ย แล้วหารด้วย 24"
    misconceptions:
      - { match: 166.7, feedback: "คิดเฉพาะกระแสขณะหลับ ลืมช่วงส่งข้อมูลซึ่งใช้กระแสสูงมาก" }
      - { match: 1.0, feedback: "คิดว่าใช้ 80 mA ตลอดเวลา แต่ส่งข้อมูลเพียง 2 วินาทีในทุก 600 วินาที" }
    solution: "กระแสเฉลี่ย = (0.5 × 598 + 80 × 2) ÷ 600 = (299 + 160) ÷ 600 = 0.765 mA ใช้ได้ 2,000 ÷ 0.765 ≈ 2,614 ชั่วโมง ≈ 108.9 วัน ถ้าส่งทุก 30 นาทีแทน กระแสเฉลี่ยจะลดลงและใช้ได้นานขึ้น (แบบจำลองอย่างง่าย ไม่คิดการเสื่อมของแบตเตอรี่)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.systems.physical-computing.p017
    topics: [computer.systems.physical-computing]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "ทีมนักเรียนออกแบบ **ระบบเตือนน้ำท่วมใต้ถุนบ้าน** ที่วัดระดับน้ำและส่งข้อความเตือนไปยังโทรศัพท์ของคนในบ้าน ข้อใดเป็นการออกแบบที่เหมาะสม (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ใช้เซนเซอร์วัดระยะแบบอัลตราโซนิกติดเหนือพื้น วัดระยะถึงผิวน้ำ", correct: true, feedback: "วัดจากด้านบนโดยไม่แช่น้ำ ระยะยิ่งสั้นแปลว่าน้ำยิ่งสูง" }
      - { id: b, text: "ส่งข้อความเตือนเมื่อระดับน้ำเกินเกณฑ์ และบันทึกค่าเป็นระยะเพื่อดูแนวโน้ม", correct: true, feedback: "เป็นทั้งการส่งข้อมูลเมื่อมีเหตุ และการเก็บข้อมูลไว้วิเคราะห์" }
      - { id: c, text: "ทดสอบด้วยถังน้ำก่อนติดตั้ง เพื่อปรับเทียบระยะกับระดับน้ำจริง", correct: true, feedback: "การปรับเทียบทำให้ค่าดิบแปลงเป็นระดับน้ำที่ถูกต้อง" }
      - { id: d, text: "ส่งข้อความเตือนทุกครั้งที่อ่านค่า ทุก 1 วินาที แม้น้ำยังไม่ขึ้น", feedback: "ข้อความถี่เกินไปทำให้คนเพิกเฉยต่อคำเตือน และเปลืองพลังงาน" }
      - { id: e, text: "ต่อลำโพงไฟบ้าน 220 V เข้ากับขาบอร์ดโดยตรงเพื่อให้เสียงดัง", feedback: "ห้ามต่ออุปกรณ์ไฟบ้านตรงกับขาบอร์ด ใช้บัซเซอร์ที่ใช้ไฟต่ำหรือวงจรขับ" }
    hints:
      - "ระบบที่ดีต้องวัดได้ถูก ส่งข้อมูลอย่างมีประโยชน์ และปลอดภัย"
      - "คิดว่าคนในบ้านจะรู้สึกอย่างไรถ้าได้ข้อความทุกวินาที"
    solution: "ข้อ a, b และ c ถูก ระบบรวมฮาร์ดแวร์ (เซนเซอร์ระยะ บอร์ด โมดูลสื่อสาร) กับซอฟต์แวร์ (แปลงค่า เทียบเกณฑ์ ส่งและเก็บข้อมูล) และผ่านการปรับเทียบ ข้อ d ทำให้คำเตือนไร้ความหมาย ข้อ e อันตราย"
    license: CC-BY-SA-4.0
    ai_assisted: true
