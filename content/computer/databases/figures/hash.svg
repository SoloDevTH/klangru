  <text x="155.0" y="163.5" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">รหัสผ่าน</text>
  <text x="155.0" y="181.7" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">sunflower22</text>
  <rect x="80.0" y="200.0" width="150.0" height="30.0" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="155.0" y="219.6" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">ซอลต์ 4b80…</text>
  <line x1="232.0" y1="168.0" x2="318.0" y2="180.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="232.0" y1="215.0" x2="318.0" y2="190.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="320.0" y="152.0" width="200.0" height="60.0" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="420.0" y="177.5" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">ฟังก์ชันแฮชที่ช้า</text>
  <text x="420.0" y="195.7" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">(เช่น bcrypt, Argon2)</text>
  <line x1="522.0" y1="182.0" x2="598.0" y2="182.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="600.0" y="152.0" width="270.0" height="60.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="735.0" y="177.5" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">เก็บ: ซอลต์ 4b80…</text>
  <text x="735.0" y="195.7" font-size="13" text-anchor="middle" fill="#1f2937" xml:space="preserve">ค่าแฮช 0d93…</text>
  <text x="20.0" y="248.0" font-size="13" text-anchor="start" fill="#6b7280" xml:space="preserve">รหัสผ่านเหมือนกัน แต่ค่าแฮชต่างกัน และย้อนจากค่าแฮชกลับเป็นรหัสผ่านไม่ได้</text>
</svg>
