problems:
  - id: science.society.science-and-society.p001
    topics: [science.society.science-and-society]
    difficulty: 1
    type: match
    stem: "การเปลี่ยนจากการเผาเศษพืชเป็นการไถกลบ จับคู่ผลกระทบแต่ละด้านกับตัวอย่าง"
    pairs:
      - { left: "ด้านสังคม", right: "คนในชุมชนป่วยเป็นโรคทางเดินหายใจน้อยลง" }
      - { left: "ด้านเศรษฐกิจ", right: "เกษตรกรมีค่าใช้จ่ายค่ารถไถเพิ่มขึ้น" }
      - { left: "ด้านสิ่งแวดล้อม", right: "ฝุ่นในอากาศลดลง ดินมีอินทรียวัตถุมากขึ้น" }
      - { left: "ด้านจริยธรรม", right: "ใครควรรับภาระค่าใช้จ่ายของทางเลือกใหม่ให้ยุติธรรม" }
    hints:
      - "เศรษฐกิจเกี่ยวกับเงิน สิ่งแวดล้อมเกี่ยวกับดิน น้ำ อากาศ"
      - "จริยธรรมถามว่าอะไรถูกต้องและยุติธรรม"
    solution: "สุขภาพของคนในชุมชนเป็นผลด้านสังคม ค่าใช้จ่ายเป็นด้านเศรษฐกิจ ฝุ่นและดินเป็นด้านสิ่งแวดล้อม และความยุติธรรมของการแบ่งภาระเป็นด้านจริยธรรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.society.science-and-society.p002
    topics: [science.society.science-and-society]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างการใช้ความรู้วิทยาศาสตร์แก้ปัญหาในชีวิตประจำวัน"
    choices:
      - { id: a, text: "ดูค่าฝุ่น PM2.5 ในแอปก่อนตัดสินใจให้เด็กเล่นกลางแจ้ง", correct: true }
      - { id: b, text: "เลือกเสื้อสีที่ชอบไปโรงเรียน", feedback: "เป็นความชอบส่วนตัว ไม่ได้ใช้ข้อมูลหรือความรู้วิทยาศาสตร์แก้ปัญหา" }
      - { id: c, text: "เชื่อข้อความที่ส่งต่อกันมาโดยไม่ตรวจสอบ", feedback: "การเชื่อโดยไม่ตรวจหลักฐานตรงข้ามกับวิธีคิดทางวิทยาศาสตร์" }
      - { id: d, text: "เดาว่าพรุ่งนี้ฝนจะตกเพราะฝันถึงฝน", feedback: "ความฝันไม่ใช่ข้อมูลที่ตรวจสอบได้ ควรดูพยากรณ์อากาศ" }
    hints:
      - "มองหาการใช้ข้อมูลที่วัดได้มาตัดสินใจ"
      - "ค่าฝุ่นมาจากเครื่องวัด"
    solution: "การดูค่าฝุ่นจากเครื่องวัดแล้วใช้ตัดสินใจ เป็นการใช้ข้อมูลและความรู้เรื่องผลของฝุ่นต่อสุขภาพเพื่อลดความเสี่ยง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.society.science-and-society.p003
    topics: [science.society.science-and-society]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ชุมชนหนึ่งในจังหวัดน่านจะหาทางลดการเผาไร่ข้าวโพด ใครบ้างเป็นผู้มีส่วนได้เสียที่ควรรับฟัง (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "เกษตรกรผู้ปลูกข้าวโพด", correct: true }
      - { id: b, text: "ผู้ป่วยโรคทางเดินหายใจและครอบครัว", correct: true }
      - { id: c, text: "เจ้าหน้าที่สาธารณสุขและนักวิชาการที่มีข้อมูล", correct: true }
      - { id: d, text: "โรงเรียนในพื้นที่", correct: true }
      - { id: e, text: "ไม่ต้องฟังใคร ให้ผู้เชี่ยวชาญคนเดียวตัดสิน", feedback: "ผู้เชี่ยวชาญให้หลักฐานได้ แต่การตัดสินใจที่ส่งผลต่อหลายฝ่ายควรรับฟังผู้ได้รับผลด้วย" }
    hints:
      - "ผู้มีส่วนได้เสียคือใครก็ตามที่ได้รับผลหรือมีส่วนร่วม"
      - "คิดทั้งผู้ได้ประโยชน์และผู้เสียประโยชน์"
    solution: "เกษตรกร ผู้ได้รับผลกระทบด้านสุขภาพ ผู้มีข้อมูล และโรงเรียน ล้วนได้รับผลหรือมีข้อมูลสำคัญ การรับฟังทุกฝ่ายช่วยให้ได้ทางเลือกที่ทำได้จริงและยุติธรรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.society.science-and-society.p004
    topics: [science.society.science-and-society]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนการตัดสินใจเรื่องที่เกี่ยวกับวิทยาศาสตร์ในชุมชน"
    items:
      - "ระบุปัญหาว่าเกิดอะไร กับใคร ที่ไหน"
      - "รวบรวมหลักฐานจากการวัดและงานวิจัย"
      - "รับฟังผู้มีส่วนได้เสียและค่านิยมของแต่ละฝ่าย"
      - "เปรียบเทียบทางเลือก ทั้งประโยชน์ ความเสี่ยง และต้นทุน"
      - "ตัดสินใจ แล้วติดตามผลและปรับเมื่อมีหลักฐานใหม่"
    hints:
      - "ต้องรู้ปัญหาก่อนหาหลักฐาน"
      - "การติดตามผลเป็นขั้นสุดท้ายที่วนกลับไปเริ่มใหม่ได้"
    solution: "ระบุปัญหา → หลักฐาน → ผู้มีส่วนได้เสีย → เปรียบเทียบทางเลือก → ตัดสินใจและติดตามผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.society.science-and-society.p005
    topics: [science.society.science-and-society]
    difficulty: 2
    type: text
    stem: "การที่ผู้เข้าร่วมการวิจัยได้รับข้อมูลครบถ้วนก่อน แล้วตกลงเข้าร่วมด้วยความสมัครใจ เรียกว่าการให้อะไร"
    accepted: ["ความยินยอม", "การให้ความยินยอม", "ความยินยอมโดยได้รับข้อมูล", "informed consent", "consent", "ยินยอม"]
    misconceptions:
      - { match: "ยาหลอก", feedback: "ยาหลอกคือสิ่งที่ให้กลุ่มควบคุม ไม่ใช่การตกลงเข้าร่วม" }
    hints:
      - "ผู้เข้าร่วมต้องรู้ก่อนว่าจะเกิดอะไรขึ้น แล้วจึงตกลง"
      - "ภาษาอังกฤษคือ informed consent"
    solution: "ความยินยอมโดยได้รับข้อมูล (informed consent) เป็นหลักจริยธรรมพื้นฐานของการวิจัยในมนุษย์ ผู้เข้าร่วมถอนตัวได้ทุกเมื่อ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.society.science-and-society.p006
    topics: [science.society.science-and-society]
    difficulty: 3
    type: numeric
    stem: "โรคติดเชื้อสมมติโรคหนึ่งทำให้เกิดโรคแทรกซ้อนรุนแรง 1 ใน 100 คนที่ป่วย ส่วนวัคซีนป้องกันโรคนี้มีผลข้างเคียงรุนแรง 1 ใน 100,000 คนที่ฉีด (ข้อมูลสมมติ) ความเสี่ยงจากโรคมากเป็นกี่เท่าของความเสี่ยงจากวัคซีน"
    answer: { value: 1000, tolerance: 1, unit: "เท่า" }
    misconceptions:
      - { match: 0.001, feedback: "กลับเศษเป็นส่วน ความเสี่ยงจากโรค (1/100) มากกว่าความเสี่ยงจากวัคซีน (1/100,000)" }
      - { match: 99900, feedback: "ลบตัวส่วน แต่ต้องเทียบเป็นอัตราส่วนของความเสี่ยง" }
    hints:
      - "ความเสี่ยงจากโรค = 1/100 ความเสี่ยงจากวัคซีน = 1/100,000"
      - "หารความเสี่ยงจากโรคด้วยความเสี่ยงจากวัคซีน"
    solution: "$\\dfrac{1/100}{1/100{,}000} = \\dfrac{100{,}000}{100} = 1{,}000$ เท่า (ในการตัดสินใจจริงต้องดูโอกาสติดเชื้อด้วย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.society.science-and-society.p007
    topics: [science.society.science-and-society]
    difficulty: 3
    type: numeric
    stem: "ก่อนรณรงค์คัดแยกขยะ หมู่บ้านหนึ่งมี 30 จาก 120 ครัวเรือนที่คัดแยกขยะ หลังนักเรียนนำผลการทดลองเรื่องปุ๋ยหมักไปเล่าและสาธิต มี 78 ครัวเรือนที่คัดแยก (ข้อมูลสมมติ) หลังรณรงค์คิดเป็นร้อยละเท่าใดของครัวเรือนทั้งหมด"
    answer: { value: 65, tolerance: 0.5, unit: "%" }
    misconceptions:
      - { match: 40, feedback: "40 คือจุดร้อยละที่เพิ่มขึ้น (65 − 25) โจทย์ถามร้อยละหลังรณรงค์" }
      - { match: 78, feedback: "78 คือจำนวนครัวเรือน ต้องหารด้วย 120 แล้วคูณ 100" }
    hints:
      - "ร้อยละ = จำนวนที่คัดแยก ÷ ทั้งหมด × 100"
      - "$78 \\div 120 \\times 100$"
    solution: "$\\dfrac{78}{120} \\times 100 = 65\\%$ เพิ่มจาก 25% การสาธิตที่เห็นผลจริงและได้ปุ๋ยใช้ฟรีช่วยให้คนยอมรับความรู้ใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.society.science-and-society.p008
    topics: [science.society.science-and-society]
    difficulty: 3
    type: mcq
    stem: "ข้อความใดตรงกับความเห็นร่วมทางวิทยาศาสตร์เกี่ยวกับอาหารดัดแปลงพันธุกรรม (GMO) มากที่สุด"
    choices:
      - { id: a, text: "อาหาร GMO ที่ผ่านการประเมินแล้วปลอดภัยต่อการบริโภคเทียบเท่าอาหารทั่วไป แต่ยังมีประเด็นด้านสิ่งแวดล้อมและเศรษฐกิจที่ต้องพิจารณาเป็นกรณี", correct: true }
      - { id: b, text: "อาหาร GMO ทุกชนิดเป็นพิษและก่อมะเร็ง", feedback: "ไม่ตรงกับหลักฐาน การประเมินความปลอดภัยของอาหาร GMO ที่ได้รับอนุมัติไม่พบความเสี่ยงต่อการบริโภคมากกว่าอาหารทั่วไป" }
      - { id: c, text: "พืช GMO ไม่มีผลกระทบใด ๆ ทั้งต่อสิ่งแวดล้อมและสังคม จึงไม่ต้องมีการกำกับดูแล", feedback: "ความปลอดภัยต่อการบริโภคไม่ได้แปลว่าไม่มีประเด็นอื่น เช่น การกระจายของยีน และสิทธิบัตรเมล็ดพันธุ์ จึงต้องประเมินและกำกับดูแล" }
      - { id: d, text: "นักวิทยาศาสตร์ยังไม่เคยศึกษาเรื่องนี้เลย", feedback: "มีการศึกษาจำนวนมากและรายงานทบทวนจากองค์กรวิทยาศาสตร์หลัก" }
    hints:
      - "แยกคำถามเรื่องความปลอดภัยในการกิน กับประเด็นสิ่งแวดล้อมและเศรษฐกิจ"
      - "ระวังคำว่า ทุกชนิด และ ไม่มีผลใด ๆ"
    solution: "องค์กรวิทยาศาสตร์หลักสรุปว่าอาหาร GMO ที่ผ่านการประเมินปลอดภัยต่อการบริโภคเทียบเท่าอาหารทั่วไป ส่วนผลด้านสิ่งแวดล้อมและเศรษฐกิจขึ้นกับพืชและบริบท จึงประเมินเป็นกรณี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.society.science-and-society.p009
    topics: [science.society.science-and-society]
    difficulty: 3
    type: mcq
    stem: "ระบบ AI สมมติที่ช่วยคัดกรองโรคผิวหนังจากภาพถ่าย ถูกฝึกด้วยภาพจากคนผิวสีอ่อนเป็นส่วนใหญ่ ปัญหาด้านจริยธรรมที่สำคัญที่สุดคือข้อใด"
    choices:
      - { id: a, text: "ระบบอาจคัดกรองผิดพลาดบ่อยกว่าในคนผิวสีเข้ม ทำให้การรักษาไม่เท่าเทียม", correct: true }
      - { id: b, text: "ระบบจะทำงานช้าลง", feedback: "ความเร็วไม่เกี่ยวกับสีผิวในข้อมูลฝึก ปัญหาคือความแม่นยำไม่เท่ากันในแต่ละกลุ่ม" }
      - { id: c, text: "ไม่มีปัญหา เพราะคอมพิวเตอร์เป็นกลางเสมอ", feedback: "AI เรียนรู้จากข้อมูล ถ้าข้อมูลไม่ครอบคลุม ผลก็ลำเอียงได้" }
      - { id: d, text: "ภาพถ่ายจะมีสีเพี้ยน", feedback: "ปัญหาไม่ได้อยู่ที่สีของภาพ แต่อยู่ที่ข้อมูลฝึกไม่ครอบคลุมทุกกลุ่ม" }
    hints:
      - "AI เรียนรู้จากตัวอย่างที่ได้เห็น"
      - "ถ้าตัวอย่างไม่ครอบคลุมทุกกลุ่ม จะเกิดอะไรกับกลุ่มที่ขาด"
    solution: "ข้อมูลฝึกที่ไม่ครอบคลุมทำให้ AI แม่นยำน้อยลงกับกลุ่มที่มีข้อมูลน้อย เกิดความไม่เท่าเทียม แก้ได้โดยใช้ข้อมูลที่หลากหลายและทดสอบผลแยกตามกลุ่มก่อนใช้งานจริง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.society.science-and-society.p010
    topics: [science.society.science-and-society]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "ปัจจัยใดช่วยให้ความรู้หรือวิธีปฏิบัติทางวิทยาศาสตร์ได้รับการยอมรับในสังคมกว้างขวาง (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "มีหลักฐานแข็งแรงและผลทำซ้ำได้", correct: true }
      - { id: b, text: "ใช้ได้จริงในราคาที่คนจ่ายได้", correct: true }
      - { id: c, text: "สื่อสารเข้าใจง่ายและสอดคล้องกับวิถีชีวิต", correct: true }
      - { id: d, text: "มาจากแหล่งหรือบุคคลที่ชุมชนไว้วางใจ", correct: true }
      - { id: e, text: "ใช้ศัพท์ยากที่สุดเพื่อให้ดูน่าเชื่อถือ", feedback: "ศัพท์ยากทำให้คนเข้าใจน้อยลงและยอมรับยากขึ้น" }
    hints:
      - "นึกถึงการล้างมือ หรือการคาดเข็มขัดนิรภัย"
      - "คนจะทำตามเมื่อเชื่อ เข้าใจ และทำได้"
    solution: "หลักฐานแข็งแรง ต้นทุนที่จ่ายได้ การสื่อสารที่เข้าใจง่าย และความไว้วางใจ ช่วยให้สังคมยอมรับ ส่วนการใช้ศัพท์ยากกลับเป็นอุปสรรค"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.society.science-and-society.p011
    topics: [science.society.science-and-society]
    difficulty: 4
    type: mcq
    stem: "นักวิจัยในประเทศเขตร้อนอย่างไทยมีงานวิจัยเรื่องไข้เลือดออกจำนวนมาก ขณะที่ประเทศเขตหนาวมีงานวิจัยเรื่องนี้น้อยกว่า เหตุผลใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "ความต้องการและค่านิยมของสังคมกำหนดว่าจะให้ทุนและความสนใจกับปัญหาใด โรคที่พบมากในพื้นที่จึงได้รับการวิจัยมาก", correct: true }
      - { id: b, text: "นักวิทยาศาสตร์เขตหนาวไม่มีความสามารถศึกษาเรื่องนี้", feedback: "ความสามารถไม่ได้ขึ้นกับภูมิอากาศ สิ่งที่ต่างคือปัญหาที่สังคมนั้นให้ความสำคัญ" }
      - { id: c, text: "ไข้เลือดออกไม่ใช่โรคที่สำคัญ", feedback: "ไข้เลือดออกเป็นปัญหาสาธารณสุขสำคัญในเขตร้อน จึงได้รับความสนใจในภูมิภาคนี้" }
      - { id: d, text: "งานวิจัยทุกเรื่องได้รับทุนเท่ากันเสมอ", feedback: "ทุนวิจัยมีจำกัดและจัดสรรตามลำดับความสำคัญที่สังคมกำหนด" }
    hints:
      - "ใครเป็นผู้จัดสรรทุนวิจัย และให้ความสำคัญกับอะไร"
      - "ยุงลายพาหะพบมากที่ใด"
    solution: "ทุนและความสนใจวิจัยขึ้นกับความจำเป็นและค่านิยมของสังคม ประเทศเขตร้อนได้รับผลจากไข้เลือดออกมาก จึงลงทุนวิจัยเรื่องนี้มาก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.society.science-and-society.p012
    topics: [science.society.science-and-society]
    difficulty: 4
    type: mcq
    stem: "จังหวัดหนึ่งกำลังพิจารณามาตรการลดฝุ่นควัน ข้อใดอธิบายบทบาทของนักวิทยาศาสตร์ได้เหมาะสมที่สุด"
    choices:
      - { id: a, text: "ให้ข้อมูลแหล่งที่มาของฝุ่น ผลต่อสุขภาพ และผลที่คาดว่าจะเกิดจากแต่ละทางเลือก พร้อมความไม่แน่นอน เพื่อให้ผู้ตัดสินใจและประชาชนใช้ประกอบ", correct: true }
      - { id: b, text: "ตัดสินใจแทนทุกฝ่าย เพราะรู้มากที่สุด", feedback: "การตัดสินใจต้องชั่งน้ำหนักหลักฐานกับต้นทุน ความยุติธรรม และค่านิยม ซึ่งเป็นเรื่องของสังคมร่วมกัน" }
      - { id: c, text: "ไม่ควรให้ความเห็นใด ๆ เพราะเป็นเรื่องของสังคม", feedback: "ถ้าไม่มีหลักฐาน การตัดสินใจอาจผิดพลาด นักวิทยาศาสตร์ควรสื่อสารสิ่งที่รู้อย่างชัดเจน" }
      - { id: d, text: "เลือกนำเสนอเฉพาะข้อมูลที่สนับสนุนทางเลือกที่ตนชอบ", feedback: "การเลือกข้อมูลบางส่วนทำให้การตัดสินใจลำเอียง ควรนำเสนอหลักฐานทั้งหมดอย่างเป็นกลาง" }
    hints:
      - "วิทยาศาสตร์บอกว่าอะไรจะเกิด สังคมตัดสินว่าควรทำอะไร"
      - "การสื่อสารที่ดีบอกความไม่แน่นอนด้วย"
    solution: "นักวิทยาศาสตร์ให้หลักฐานและอธิบายผลของทางเลือกอย่างเป็นกลาง ผู้กำหนดนโยบายและประชาชนนำไปชั่งน้ำหนักกับค่านิยม ต้นทุน และความยุติธรรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.society.science-and-society.p013
    topics: [science.society.science-and-society]
    difficulty: 4
    type: numeric
    stem: "หมู่บ้าน 50 ครัวเรือนจะติดตั้งเครื่องกรองน้ำชุมชนราคา 60,000 บาท ค่าดูแลเดือนละ 1,000 บาท ปัจจุบันแต่ละครัวเรือนซื้อน้ำดื่มเดือนละ 300 บาท (ข้อมูลสมมติ) ถ้าเลิกซื้อน้ำดื่ม เงินที่ประหยัดได้จะคืนค่าเครื่องในกี่เดือน"
    answer: { value: 4.29, tolerance: 0.05, unit: "เดือน" }
    misconceptions:
      - { match: 4, feedback: "ลืมหักค่าดูแลเดือนละ 1,000 บาท เงินที่ประหยัดได้จริงคือ 15,000 − 1,000 บาทต่อเดือน" }
      - { match: 200, feedback: "หารด้วยค่าน้ำของครัวเรือนเดียว ต้องคิดรวมทั้งหมู่บ้าน 50 ครัวเรือน" }
    hints:
      - "เงินที่ประหยัดต่อเดือน = 50 × 300 − 1,000"
      - "จำนวนเดือน = ราคาเครื่อง ÷ เงินที่ประหยัดต่อเดือน"
    solution: "ประหยัด $50 \\times 300 - 1{,}000 = 14{,}000$ บาทต่อเดือน คืนทุนใน $60{,}000 / 14{,}000 \\approx 4.3$ เดือน นอกจากเงิน ยังต้องคิดเรื่องคุณภาพน้ำ การตรวจน้ำสม่ำเสมอ และผู้รับผิดชอบดูแลเครื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.society.science-and-society.p014
    topics: [science.society.science-and-society]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "สหกรณ์การเกษตรสมมติแห่งหนึ่งในภาคกลางจะใช้โดรนพ่นสารกำจัดศัตรูพืชแทนแรงงานคน ข้อใดเป็นผลที่ควรพิจารณาก่อนตัดสินใจ (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "ผู้พ่นสัมผัสสารเคมีน้อยลง ลดความเสี่ยงต่อสุขภาพ", correct: true }
      - { id: b, text: "ละอองสารอาจปลิวไปยังบ้านเรือนหรือแหล่งน้ำใกล้เคียง ถ้าพ่นช่วงลมแรง", correct: true }
      - { id: c, text: "แรงงานรับจ้างพ่นยาในชุมชนอาจมีรายได้ลดลง", correct: true }
      - { id: d, text: "ต้องมีการฝึกอบรมและกฎความปลอดภัยในการบิน", correct: true }
      - { id: e, text: "โดรนทำให้ศัตรูพืชหายไปถาวร ไม่ต้องใช้สารอีกเลย", feedback: "โดรนเปลี่ยนวิธีพ่น ไม่ได้เปลี่ยนวงจรชีวิตของศัตรูพืช และเป็นการกล่าวอ้างเกินจริง" }
    hints:
      - "คิดทั้งผลด้านสุขภาพ สิ่งแวดล้อม เศรษฐกิจ และความปลอดภัย"
      - "ทั้งประโยชน์และความเสี่ยงล้วนต้องพิจารณา"
    solution: "เทคโนโลยีใหม่มีทั้งประโยชน์ (ผู้พ่นปลอดภัยขึ้น) และความเสี่ยง (ละอองปลิว) ผลทางเศรษฐกิจต่อแรงงาน และต้องมีกฎความปลอดภัย ส่วนข้อ e เป็นการกล่าวอ้างเกินจริง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.society.science-and-society.p015
    topics: [science.society.science-and-society]
    difficulty: 5
    type: mcq
    stem: "ในการประชุมหมู่บ้านเรื่องการลดการเผา ข้อเสนอใดใช้ทั้งหลักฐานและการคำนึงถึงผู้มีส่วนได้เสียได้สมดุลที่สุด"
    choices:
      - { id: a, text: "ใช้ข้อมูลจากเครื่องวัดฝุ่นที่แสดงว่าค่าฝุ่นสูงขึ้นช่วงที่มีการเผา ทดลองไถกลบในแปลงนำร่อง 10 แปลงร่วมกับเกษตรกรอาสา บันทึกต้นทุนและผลผลิต แล้วนำผลมาตัดสินใจร่วมกันในปีถัดไป", correct: true }
      - { id: b, text: "ห้ามเผาทันทีและปรับเกษตรกรทุกคนที่ฝ่าฝืน โดยไม่ต้องสอบถามว่ามีทางเลือกอะไร", feedback: "อาจลดฝุ่นได้ แต่ไม่ได้คำนึงถึงต้นทุนและทางเลือกของเกษตรกร จึงอาจทำได้ยากในทางปฏิบัติ" }
      - { id: c, text: "ไม่ต้องทำอะไร เพราะฝุ่นมาจากที่อื่นด้วย", feedback: "ฝุ่นมาจากหลายแหล่งจริง แต่หลักฐานที่วัดในพื้นที่บอกว่าการเผาในชุมชนมีส่วนด้วย การไม่ทำอะไรเลยไม่ได้ใช้หลักฐาน" }
      - { id: d, text: "เชื่อตามข้อความในสื่อสังคมว่าฝุ่นไม่มีผลต่อสุขภาพ", feedback: "ขัดกับหลักฐานทางการแพทย์จำนวนมาก และไม่ได้ตรวจแหล่งข้อมูล" }
    hints:
      - "ข้อเสนอที่ดีใช้ข้อมูลจริง ทดลองก่อนขยายผล และให้ผู้ได้รับผลมีส่วนร่วม"
      - "ดูว่าข้อเสนอใดมีการติดตามผล"
    solution: "ข้อ a ใช้หลักฐานจากการวัด ทดลองนำร่องเพื่อเก็บข้อมูลต้นทุนและผลผลิต ให้เกษตรกรมีส่วนร่วม และตัดสินใจจากผลที่ได้ ซึ่งสอดคล้องกับวงจรการตัดสินใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.society.science-and-society.p016
    topics: [science.society.science-and-society]
    difficulty: 5
    type: numeric
    stem: "ชุมชนสมมติมีประชากร 20,000 คน ในหนึ่งฤดูระบาด ความเสี่ยงป่วยหนักของคนที่ไม่ได้รับวัคซีนคือ 2% และของคนที่ได้รับวัคซีนคือ 0.2% (ข้อมูลสมมติ ไม่คิดผลที่วัคซีนช่วยลดการแพร่เชื้อ) ถ้ามีคนได้รับวัคซีน 15,000 คน จำนวนผู้ป่วยหนักที่คาดว่าจะเกิดน้อยกว่ากรณีที่ไม่มีใครได้รับวัคซีนกี่คน"
    answer: { value: 270, tolerance: 1, unit: "คน" }
    misconceptions:
      - { match: 130, feedback: "130 คือจำนวนผู้ป่วยหนักที่คาดว่าจะเกิดเมื่อฉีด 15,000 คน โจทย์ถามว่าลดลงกี่คนจาก 400 คน" }
      - { match: 360, feedback: "คิดเหมือนทุกคนได้รับวัคซีน แต่ยังมีคนไม่ได้รับ 5,000 คนที่ความเสี่ยงยังเป็น 2%" }
    hints:
      - "ไม่มีใครได้วัคซีน: $20{,}000 \\times 0.02$ คน"
      - "ได้วัคซีน 15,000 คน: $15{,}000 \\times 0.002 + 5{,}000 \\times 0.02$ คน"
    solution: "ไม่มีวัคซีน: 400 คน ฉีด 15,000 คน: $30 + 100 = 130$ คน ลดลง $400 - 130 = 270$ คน ในความจริงจะลดได้มากกว่านี้ถ้าวัคซีนช่วยลดการแพร่เชื้อด้วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: science.society.science-and-society.p017
    topics: [science.society.science-and-society]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างที่ค่านิยมของสังคมกำหนดขอบเขตของงานวิจัย"
    choices:
      - { id: a, text: "งานวิจัยที่ทำกับคนต้องผ่านคณะกรรมการจริยธรรม และผู้เข้าร่วมต้องให้ความยินยอม", correct: true }
      - { id: b, text: "น้ำเดือดที่ 100 °C ที่ความดันบรรยากาศปกติ", feedback: "เป็นข้อเท็จจริงทางธรรมชาติ ไม่ได้ขึ้นกับค่านิยมของสังคม" }
      - { id: c, text: "แสงเดินทางเร็วกว่าเสียง", feedback: "เป็นข้อเท็จจริงจากการวัด ไม่ใช่ค่านิยม" }
      - { id: d, text: "ผลการทดลองต้องบันทึกตามจริง", feedback: "เป็นหลักความซื่อสัตย์ทางวิทยาศาสตร์ แต่โจทย์ถามถึงขอบเขตที่สังคมกำหนดว่าวิจัยแบบใดทำได้" }
    hints:
      - "ค่านิยมเกี่ยวกับสิ่งที่สังคมเห็นว่าถูกต้องหรือควรทำ"
      - "อะไรที่กำหนดว่าการวิจัยแบบใดทำได้หรือไม่ได้"
    solution: "การคุ้มครองผู้เข้าร่วมวิจัยผ่านคณะกรรมการจริยธรรมและความยินยอม มาจากค่านิยมของสังคมเรื่องสิทธิและความปลอดภัยของมนุษย์ ส่วนข้ออื่นเป็นข้อเท็จจริงทางธรรมชาติหรือหลักปฏิบัติในการบันทึกข้อมูล"
    license: CC-BY-SA-4.0
    ai_assisted: true
