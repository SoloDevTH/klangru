problems:
  - id: physics.light.ray-diagrams.p001
    topics: [physics.light.ray-diagrams]
    difficulty: 1
    type: mcq
    stem: "กระจกโค้งที่ติดตามทางโค้งหรือทางแยกบนถนนเป็นกระจกชนิดใด"
    choices:
      - { id: a, text: "กระจกนูน", correct: true }
      - { id: b, text: "กระจกเว้า", feedback: "กระจกเว้าให้ภาพกลับหัวเมื่อวัตถุอยู่ไกล คนขับจะเห็นรถกลับหัว กระจกจราจรต้องให้ภาพหัวตั้งและเห็นกว้าง" }
      - { id: c, text: "กระจกเงาราบ", feedback: "กระจกเงาราบเห็นได้แคบ ไม่พอสำหรับมองรถที่มาจากมุมโค้ง" }
    hints:
      - "กระจกจราจรต้องให้เห็นบริเวณกว้าง และภาพต้องหัวตั้งเสมอ"
      - "กระจกชนิดใดให้ภาพเสมือนหัวตั้งย่อ ไม่ว่าวัตถุอยู่ที่ใด"
    solution: "กระจกนูนให้ภาพเสมือน หัวตั้ง ย่อ เสมอ จึงเห็นบริเวณกว้างและไม่กลับหัว เหมาะกับทางโค้งและทางแยก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.ray-diagrams.p002
    topics: [physics.light.ray-diagrams]
    difficulty: 1
    type: text
    stem: "ภาพที่เกิดจากรังสีสะท้อนหรือรังสีหักเหตัดกันจริง และฉายลงบนฉากได้ เรียกว่าภาพอะไร"
    accepted: ["ภาพจริง", "จริง", "real image", "real"]
    misconceptions:
      - { match: "ภาพเสมือน", feedback: "ภาพเสมือนเกิดจากแนวต่อของรังสี (เส้นประ) แสงไม่ได้ไปถึงตรงนั้นจริง จึงฉายบนฉากไม่ได้" }
    hints:
      - "ถ้าแสงไปรวมกันที่จุดนั้นจริง ๆ ฉากที่วางตรงนั้นจะสว่าง"
      - "ภาพมีสองชนิด คือภาพจริงกับภาพเสมือน"
    solution: "ภาพจริงเกิดจากรังสีที่ตัดกันจริง จึงฉายบนฉากได้ เช่น ภาพบนจอของเครื่องฉาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.ray-diagrams.p003
    topics: [physics.light.ray-diagrams]
    difficulty: 2
    type: mcq
    stem: "รังสีจากปลายวัตถุที่พุ่งผ่าน **จุดกึ่งกลางของเลนส์บาง** จะเป็นอย่างไรหลังผ่านเลนส์"
    choices:
      - { id: a, text: "เดินทางเป็นเส้นตรงต่อไปในแนวเดิม", correct: true }
      - { id: b, text: "หักเหผ่านจุดโฟกัส", feedback: "รังสีที่หักเหผ่านจุดโฟกัสคือรังสีที่เข้ามาขนานแกน ไม่ใช่รังสีที่ผ่านจุดกึ่งกลางเลนส์" }
      - { id: c, text: "หักเหออกขนานแกน", feedback: "รังสีที่ออกขนานแกนคือรังสีที่เข้ามาผ่านจุดโฟกัสฝั่งวัตถุ" }
    hints:
      - "ตรงกลางเลนส์บาง ผิวสองด้านเกือบขนานกันเหมือนกระจกแผ่นบาง"
      - "แสงผ่านกระจกแผ่นบางแล้วเบนหรือไม่"
    solution: "ที่จุดกึ่งกลาง เลนส์บางเหมือนแผ่นแก้วบางที่ผิวขนานกัน รังสีจึงเดินทางเป็นเส้นตรงไม่เบน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.ray-diagrams.p004
    topics: [physics.light.ray-diagrams]
    difficulty: 2
    type: match
    stem: "จับคู่อุปกรณ์กับชนิดของกระจกหรือเลนส์และภาพที่ได้"
    pairs:
      - { left: "ไฟหน้ารถ", right: "หลอดไฟอยู่ที่จุดโฟกัสของกระจกเว้า แสงออกเป็นลำขนาน" }
      - { left: "แว่นขยาย", right: "เลนส์นูน วัตถุใกล้กว่าจุดโฟกัส ได้ภาพเสมือนขยาย" }
      - { left: "กล้องถ่ายรูป", right: "เลนส์นูน วัตถุไกลกว่า 2F ได้ภาพจริงย่อ" }
      - { left: "กระจกมองข้างรถจักรยานยนต์", right: "กระจกนูน ได้ภาพเสมือนย่อ มุมมองกว้าง" }
    hints:
      - "อุปกรณ์ใดต้องการภาพบนเซนเซอร์ (ภาพจริง) อุปกรณ์ใดให้ตาส่องดูภาพ (ภาพเสมือน)"
      - "แสงจากจุดโฟกัสของกระจกเว้าสะท้อนออกไปอย่างไร"
    solution: "ไฟหน้ารถวางหลอดที่ F ของกระจกเว้าให้แสงขนาน แว่นขยายใช้เลนส์นูนกับวัตถุใกล้กว่า F กล้องถ่ายรูปใช้เลนส์นูนกับวัตถุไกล กระจกมองข้างใช้กระจกนูนให้เห็นกว้าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.ray-diagrams.p005
    topics: [physics.light.ray-diagrams]
    difficulty: 2
    type: mcq
    stem: "วางวัตถุหน้ากระจกเว้าไกลกว่าจุดศูนย์กลางความโค้ง $C$ เขียนแผนภาพรังสีแล้วจะได้ภาพแบบใด"
    choices:
      - { id: a, text: "ภาพจริง หัวกลับ เล็กกว่าวัตถุ อยู่ระหว่าง $F$ กับ $C$", correct: true }
      - { id: b, text: "ภาพเสมือน หัวตั้ง ขยาย อยู่หลังกระจก", feedback: "ภาพแบบนี้เกิดเมื่อวัตถุอยู่ใกล้กว่า $F$ (เช่น กระจกแต่งหน้า) ไม่ใช่เมื่อวัตถุอยู่ไกล" }
      - { id: c, text: "ภาพจริง หัวกลับ ใหญ่กว่าวัตถุ อยู่ไกลกว่า $C$", feedback: "ภาพแบบนี้เกิดเมื่อวัตถุอยู่ระหว่าง $F$ กับ $C$ ลองสลับบทบาทของวัตถุกับภาพดู" }
    hints:
      - "ลากรังสีขนานแกน (สะท้อนผ่าน $F$) และรังสีผ่าน $C$ (สะท้อนกลับทางเดิม)"
      - "สองเส้นนี้ตัดกันหน้ากระจกหรือหลังกระจก ใกล้หรือไกลกว่า $C$"
    solution: "รังสีสะท้อนตัดกันจริงหน้ากระจก ระหว่าง $F$ กับ $C$ ภาพจึงเป็นภาพจริง หัวกลับ เล็กกว่าวัตถุ เช่น $f = 10$, $s = 30\\ \\mathrm{cm}$ ได้ $s' = 15\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.ray-diagrams.p006
    topics: [physics.light.ray-diagrams]
    difficulty: 3
    type: mcq
    stem: "นักเรียนวาดรังสีหลักสามเส้นจากปลายวัตถุผ่านเลนส์นูนดังภาพ เส้นใดวาดผิด"
    figure: { src: p-which-ray.svg, alt: "แผนภาพเลนส์นูน มีจุด F ทางซ้ายและ F′ ทางขวาของเลนส์ วัตถุเป็นลูกศรตั้งอยู่ไกลกว่า F ทางซ้าย รังสีเส้นที่ 1 สีแดงออกจากปลายวัตถุขนานแกน ถึงเลนส์แล้วหักเหผ่าน F′ รังสีเส้นที่ 2 สีเขียวผ่านจุดกึ่งกลางเลนส์เป็นเส้นตรง รังสีเส้นที่ 3 สีม่วงผ่าน F ฝั่งวัตถุไปถึงเลนส์ใต้แกน แล้วหักเหขึ้นไปผ่าน F′" }
    choices:
      - { id: a, text: "เส้นที่ 3", correct: true }
      - { id: b, text: "เส้นที่ 1", feedback: "รังสีขนานแกนหักเหผ่าน F′ อีกฝั่ง เส้นที่ 1 ถูกแล้ว" }
      - { id: c, text: "เส้นที่ 2", feedback: "รังสีผ่านจุดกึ่งกลางเลนส์ไม่เบน เส้นที่ 2 ถูกแล้ว" }
    hints:
      - "รังสีที่ผ่าน F ฝั่งวัตถุก่อนถึงเลนส์ ออกจากเลนส์อย่างไร"
      - "ถ้าวาดถูก รังสีทั้งสามต้องตัดกันที่จุดเดียว"
    solution: "รังสีที่ผ่าน F ฝั่งวัตถุต้องหักเหออกขนานแกน แต่เส้นที่ 3 ถูกวาดให้ผ่าน F′ จึงผิด สังเกตได้จากเส้นที่ 3 ไม่ได้ตัดกับเส้นที่ 1 และ 2 ที่จุดเดียวกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.ray-diagrams.p007
    topics: [physics.light.ray-diagrams]
    difficulty: 3
    type: numeric
    stem: "วางวัตถุห่างกระจกเว้าความยาวโฟกัส $12\\ \\mathrm{cm}$ เป็นระยะ $18\\ \\mathrm{cm}$ ภาพอยู่ห่างกระจกเท่าใด (ตอบในหน่วย cm ภาพจริงตอบเป็นบวก)"
    answer: { value: 36, tolerance: 0.4, unit: cm }
    misconceptions:
      - { match: 7.2, feedback: "บวกส่วนกลับ $\\tfrac{1}{12} + \\tfrac{1}{18}$ ต้องลบ $\\tfrac{1}{s'} = \\tfrac{1}{f} - \\tfrac{1}{s}$" }
      - { match: 6, feedback: "ลบระยะกันตรง ๆ ต้องลบส่วนกลับ ไม่ใช่ลบตัวระยะ" }
    hints:
      - "ใช้ $\\tfrac{1}{f} = \\tfrac{1}{s} + \\tfrac{1}{s'}$ กระจกเว้า $f$ เป็นบวก"
      - "$\\tfrac{1}{s'} = \\tfrac{1}{12} - \\tfrac{1}{18}$ แล้วกลับเศษส่วน"
    solution: "$\\tfrac{1}{s'} = \\tfrac{1}{12} - \\tfrac{1}{18} = \\tfrac{3 - 2}{36} = \\tfrac{1}{36}$ ได้ $s' = 36\\ \\mathrm{cm}$ เป็นภาพจริงหน้ากระจก ตรงกับแผนภาพ (วัตถุอยู่ระหว่าง $F$ กับ $C$ ภาพอยู่ไกลกว่า $C$)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.ray-diagrams.p008
    topics: [physics.light.ray-diagrams]
    difficulty: 3
    type: numeric
    stem: "ผู้หญิงสูง $156\\ \\mathrm{cm}$ ระดับตาสูงจากพื้น $146\\ \\mathrm{cm}$ ต้องการติดกระจกเงาราบบนผนังให้ส่องเห็นตัวเองได้ทั้งตัวพอดี กระจกต้องยาวอย่างน้อยเท่าใด (ตอบในหน่วย cm)"
    answer: { value: 78, tolerance: 0.5, unit: cm }
    misconceptions:
      - { match: 156, feedback: "กระจกไม่ต้องยาวเท่าตัวคน รังสีจากศีรษะและเท้าสะท้อนที่จุดกึ่งกลางระหว่างระดับนั้นกับระดับตา" }
      - { match: 73, feedback: "$73\\ \\mathrm{cm}$ คือความสูงของขอบล่างกระจกจากพื้น (ครึ่งหนึ่งของระดับตา) ไม่ใช่ความยาวกระจก" }
    hints:
      - "รังสีจากเท้าสะท้อนเข้าตาที่ความสูงเท่าใด รังสีจากศีรษะสะท้อนที่ความสูงเท่าใด"
      - "ขอบล่าง = ครึ่งหนึ่งของระดับตา ขอบบน = กึ่งกลางระหว่างระดับตากับศีรษะ"
    solution: "ขอบล่างอยู่ที่ $\\tfrac{146}{2} = 73\\ \\mathrm{cm}$ ขอบบนอยู่ที่ $\\tfrac{146 + 156}{2} = 151\\ \\mathrm{cm}$ กระจกยาว $151 - 73 = 78\\ \\mathrm{cm}$ ซึ่งเท่ากับครึ่งหนึ่งของความสูง $156\\ \\mathrm{cm}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.ray-diagrams.p009
    topics: [physics.light.ray-diagrams]
    difficulty: 3
    type: numeric
    stem: "สระว่ายน้ำในโรงเรียนลึกจริง $1.8\\ \\mathrm{m}$ มองจากขอบสระลงไปเกือบตั้งฉากกับผิวน้ำ ($n_{\\text{น้ำ}} = 1.33$) จะเห็นก้นสระลึกประมาณเท่าใด (ตอบในหน่วย m)"
    answer: { value: 1.35, tolerance: 0.02, unit: m }
    misconceptions:
      - { match: 2.39, feedback: "คูณด้วย $n$ ทำให้สระดูลึกขึ้น แต่มองจากอากาศลงน้ำ ก้นสระดูตื้นลง ต้องหารด้วย $1.33$" }
    hints:
      - "มองจากอากาศลงไปในน้ำ วัตถุดูตื้นลงหรือลึกลง"
      - "ความลึกปรากฏ = ความลึกจริง × $\\dfrac{n_{\\text{อากาศ}}}{n_{\\text{น้ำ}}}$"
    solution: "ความลึกปรากฏ $= 1.8 \\times \\dfrac{1}{1.33} \\approx 1.35\\ \\mathrm{m}$ สระจึงดูตื้นกว่าจริงเกือบครึ่งเมตร ห้ามกระโดดลงสระโดยกะความลึกด้วยตา"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.ray-diagrams.p010
    topics: [physics.light.ray-diagrams]
    difficulty: 3
    type: numeric
    stem: "วางวัตถุสูง $9\\ \\mathrm{cm}$ ห่างเลนส์นูนความยาวโฟกัส $20\\ \\mathrm{cm}$ เป็นระยะ $60\\ \\mathrm{cm}$ ภาพสูงเท่าใด (ตอบในหน่วย cm)"
    answer: { value: 4.5, tolerance: 0.05, unit: cm }
    misconceptions:
      - { match: 18, feedback: "ใช้กำลังขยายกลับด้าน $m = \\tfrac{s}{s'}$ ที่ถูกคือ $m = \\tfrac{|s'|}{s}$" }
      - { match: 9, feedback: "ภาพไม่ได้สูงเท่าวัตถุเสมอ ต้องหาระยะภาพแล้วคูณด้วยกำลังขยาย" }
    hints:
      - "หาระยะภาพ $s'$ จาก $\\tfrac{1}{s'} = \\tfrac{1}{f} - \\tfrac{1}{s}$ ก่อน"
      - "ความสูงภาพ = ความสูงวัตถุ × $\\dfrac{|s'|}{s}$"
    solution: "$\\tfrac{1}{s'} = \\tfrac{1}{20} - \\tfrac{1}{60} = \\tfrac{2}{60}$ ได้ $s' = 30\\ \\mathrm{cm}$ กำลังขยาย $m = \\tfrac{30}{60} = 0.5$ ภาพสูง $9 \\times 0.5 = 4.5\\ \\mathrm{cm}$ (ภาพจริง หัวกลับ)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.ray-diagrams.p011
    topics: [physics.light.ray-diagrams]
    difficulty: 4
    type: numeric
    stem: "วางวัตถุห่างเลนส์เว้าความยาวโฟกัส $15\\ \\mathrm{cm}$ เป็นระยะ $30\\ \\mathrm{cm}$ ระยะภาพ $s'$ เป็นเท่าใด (ตอบในหน่วย cm ใส่เครื่องหมายตามระบบในบทเรียน)"
    answer: { value: -10, tolerance: 0.1, unit: cm }
    misconceptions:
      - { match: 30, feedback: "ใช้ $f = +15$ ซึ่งเป็นของเลนส์นูน เลนส์เว้าต้องใช้ $f = -15\\ \\mathrm{cm}$" }
      - { match: 10, feedback: "ขนาดถูกแล้ว แต่ภาพของเลนส์เว้าเป็นภาพเสมือน ฝั่งเดียวกับวัตถุ $s'$ ต้องเป็นลบ" }
    hints:
      - "เลนส์เว้ามี $f$ เป็นลบ"
      - "$\\tfrac{1}{s'} = -\\tfrac{1}{15} - \\tfrac{1}{30}$"
    solution: "$\\tfrac{1}{s'} = -\\tfrac{1}{15} - \\tfrac{1}{30} = -\\tfrac{3}{30} = -\\tfrac{1}{10}$ ได้ $s' = -10\\ \\mathrm{cm}$ ภาพเสมือน หัวตั้ง ฝั่งเดียวกับวัตถุ อยู่ระหว่างเลนส์กับ $F$ ตรงกับแผนภาพรังสีของเลนส์เว้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.light.ray-diagrams.p012
    topics: [physics.light.ray-diagrams]
    difficulty: 4
    type: numeric
    stem: "ปลาในคลองมองขึ้นไปเห็นนกกระเต็นเกาะกิ่งไม้สูงจากผิวน้ำ $0.60\\ \\mathrm{m}$ เมื่อปลามองขึ้นเกือบตั้งฉากกับผิวน้ำ ($n_{\\text{น้ำ}} = 1.33$) ปลาเห็นนกอยู่สูงจากผิวน้ำเท่าใด (ตอบในหน่วย m)"
    answer: { value: 0.798, tolerance: 0.008, unit: m }
    misconceptions:
      - { match: 0.451, feedback: "หารด้วย $1.33$ เหมือนตอนมองจากอากาศลงน้ำ แต่ตอนนี้ตาอยู่ในน้ำ อัตราส่วนกลับกัน วัตถุจึงดูไกลขึ้น" }
    hints:
      - "ความลึกปรากฏ / ความลึกจริง $= n_{\\text{ตัวกลางที่ตาอยู่}} / n_{\\text{ตัวกลางที่วัตถุอยู่}}$"
      - "ตาอยู่ในน้ำ ($n = 1.33$) นกอยู่ในอากาศ ($n = 1$)"
    solution: "ระยะปรากฏ $= 0.60 \\times \\dfrac{1.33}{1} \\approx 0.80\\ \\mathrm{m}$ ปลาเห็นนกอยู่สูงกว่าความจริง"
