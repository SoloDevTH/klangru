  - id: chemistry.equilibrium.chemical-equilibrium.p018
    topics: [chemistry.equilibrium.chemical-equilibrium]
    difficulty: 5
    type: mcq
    stem: "วิศวกรต้องปรับสภาวะการผลิต $\\mathrm{SO_3}$ สำหรับทำกรดซัลฟิวริก $\\mathrm{2SO_2(g) + O_2(g) \\rightleftharpoons 2SO_3(g)}$ (คายความร้อน) ให้ได้ $\\mathrm{SO_3}$ มากและผลิตได้เร็วพอ ชุดสภาวะใดเหมาะสมที่สุด"
    choices:
      - { id: a, text: "อุณหภูมิปานกลางราว 450 °C ใช้ตัวเร่ง V₂O₅ ใช้อากาศ (O₂) มากเกินพอ และดึง SO₃ ออกไปดูดซับ", correct: true, feedback: "ถูก อุณหภูมิประนีประนอมระหว่างผลได้กับอัตรา ตัวเร่งชดเชยอัตรา O₂ เกินพอและการดึง SO₃ ออกทำให้สมดุลเลื่อนไปทางขวา" }
      - { id: b, text: "อุณหภูมิสูงมากราว 1,000 °C เพื่อให้เร็วที่สุด", feedback: "เร็วขึ้นจริง แต่ปฏิกิริยาคายความร้อน ที่อุณหภูมิสูงมาก K ลดลง ได้ SO₃ น้อย" }
      - { id: c, text: "อุณหภูมิห้องและไม่ใช้ตัวเร่ง เพื่อให้ K สูงที่สุด", feedback: "K สูงก็จริง แต่ปฏิกิริยาช้าจนผลิตไม่ได้ในทางปฏิบัติ" }
      - { id: d, text: "ใช้ SO₂ มากเกินพอและเก็บ SO₃ ไว้ในเครื่องปฏิกรณ์", feedback: "การเก็บ SO₃ ไว้ทำให้สมดุลไม่เลื่อนไปข้างหน้า และ SO₂ มีราคาและอันตรายมากกว่าอากาศ" }
