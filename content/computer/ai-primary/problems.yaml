problems:
  - id: computer.ai.ai-primary.p001
    topics: [computer.ai.ai-primary]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นงานที่คนทำได้ดีกว่าคอมพิวเตอร์"
    choices:
      - { id: a, text: "เข้าใจว่าเพื่อนพูดติดตลกหรือพูดจริงจังจากน้ำเสียงและสถานการณ์", correct: true }
      - { id: b, text: "นับภาพผลไม้หนึ่งพันรูปให้เสร็จในไม่กี่นาที", feedback: "คอมพิวเตอร์ทำงานซ้ำจำนวนมากได้เร็วกว่าคนมาก" }
      - { id: c, text: "คัดแยกชิ้นส่วนที่เหมือนกันจำนวนพันชิ้นด้วยกฎเดิมโดยไม่เหนื่อย", feedback: "งานซ้ำแบบนี้คอมพิวเตอร์ทำได้ดีกว่าคน" }
      - { id: d, text: "ตรวจว่าทุกช่องในตารางคำนวณถูกต้องหรือไม่ทีละช่อง", feedback: "งานตรวจซ้ำในตารางขนาดใหญ่คอมพิวเตอร์ทำได้เร็วกว่าคน" }
    hints:
      - "ลองนึกถึงงานที่ต้องเข้าใจความรู้สึกหรือบริบท"
      - "งานที่ทำซ้ำจำนวนมากมักเหมาะกับคอมพิวเตอร์"
    solution: "การเข้าใจความรู้สึกและบริบทของคนเป็นจุดที่คนทำได้ดีกว่า ส่วนงานซ้ำจำนวนมากคอมพิวเตอร์ทำได้เร็วและไม่เหนื่อย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.ai-primary.p002
    topics: [computer.ai.ai-primary]
    difficulty: 1
    type: match
    stem: "จับคู่งานกับผู้ที่ทำได้ดีกว่า"
    pairs:
      - { left: "จำชื่อผลไม้ที่เพิ่งเห็นเพียงครั้งเดียว", right: "คนเรียนรู้จากตัวอย่างไม่กี่ชิ้นได้" }
      - { left: "นับภาพผลไม้หนึ่งพันรูปให้เสร็จ", right: "คอมพิวเตอร์ทำซ้ำได้เร็วและไม่เหนื่อย" }
      - { left: "เข้าใจว่าเพื่อนพูดติดตลกหรือจริงจัง", right: "คนใช้บริบทและน้ำเสียงประกอบการตัดสิน" }
    hints:
      - "ลองดูว่างานนั้นต้องใช้ความเข้าใจบริบท หรือต้องทำซ้ำจำนวนมาก"
      - "ระลึกว่าคนเรียนรู้เร็วจากตัวอย่างไม่กี่ชิ้น"
    solution: "คนเรียนจากตัวอย่างไม่กี่ชิ้นได้ คอมพิวเตอร์ทำซ้ำได้เร็ว และคนใช้บริบทกับน้ำเสียงในการตัดสินใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.ai-primary.p003
    topics: [computer.ai.ai-primary]
    difficulty: 1
    type: order
    stem: "เรียงขั้นตอนการฝึกแบบจำลองแยกภาพผลไม้ให้ถูกต้อง"
    items:
      - "เก็บภาพตัวอย่างของแต่ละผลไม้"
      - "ติดป้ายชื่อผลไม้ให้ทุกภาพ"
      - "ฝึกแบบจำลองจากภาพและป้ายที่ติดไว้"
      - "ทดสอบด้วยภาพที่ไม่เคยใช้ฝึก"
      - "ดูชนิดที่ทายผิดแล้วเพิ่มตัวอย่าง"
    hints:
      - "ต้องมีภาพและป้ายก่อนที่เครื่องจะเรียนได้"
      - "ทดสอบควรทำหลังฝึกเสร็จ และเพิ่มตัวอย่างเมื่อพบความผิดพลาด"
    solution: "เก็บภาพ ติดป้าย ฝึก ทดสอบด้วยภาพใหม่ แล้วเพิ่มตัวอย่างของชนิดที่ทายผิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.ai-primary.p004
    topics: [computer.ai.ai-primary]
    difficulty: 1
    type: mcq
    stem: "ทำไมต้องทดสอบแบบจำลองด้วยภาพที่ไม่เคยใช้ฝึก"
    choices:
      - { id: a, text: "เพื่อดูว่าแบบจำลองเรียนลักษณะทั่วไปหรือแค่จำภาพที่เคยเห็น", correct: true }
      - { id: b, text: "เพื่อให้แบบจำลองมีภาพมากขึ้นโดยไม่ต้องเก็บเพิ่ม", feedback: "การทดสอบไม่ได้เพิ่มภาพฝึก และภาพทดสอบต้องแยกจากภาพฝึก" }
      - { id: c, text: "เพราะภาพที่ใช้ฝึกต้องลบทิ้งหลังจากฝึกเสร็จ", feedback: "ไม่จำเป็นต้องลบภาพฝึก เหตุผลคือการวัดความแม่นยำกับภาพใหม่" }
      - { id: d, text: "เพื่อเปลี่ยนชื่อป้ายกำกับของภาพทั้งหมด", feedback: "การทดสอบไม่ได้เปลี่ยนป้ายกำกับ" }
    hints:
      - "ถ้าทดสอบด้วยภาพเดิม ผลจะบอกอะไรได้บ้าง"
      - "ดูว่าแบบจำลองทายภาพที่ไม่เคยเห็นได้หรือไม่"
    solution: "ภาพใหม่ช่วยให้รู้ว่าแบบจำลองเรียนลักษณะทั่วไปได้หรือไม่ ถ้าทดสอบด้วยภาพเดิมอาจแค่จำภาพได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.ai-primary.p005
    topics: [computer.ai.ai-primary]
    difficulty: 2
    type: numeric
    stem: "แบบจำลองทดสอบด้วยภาพใหม่ 25 ภาพ ทายถูก 21 ภาพ ความถูกต้องของแบบจำลองเป็นกี่เปอร์เซ็นต์"
    answer: { value: 84, tolerance: 0, unit: "%" }
    hints:
      - "หาอัตราส่วนของจำนวนที่ทายถูกเทียบกับจำนวนภาพทั้งหมด"
      - "นำอัตราส่วนที่ได้มาคูณด้วย 100"
    solution: "21 ÷ 25 × 100 = 84 เปอร์เซ็นต์"
    misconceptions:
      - { match: 21, feedback: "21 คือจำนวนภาพที่ทายถูก ยังไม่ได้เทียบกับจำนวนภาพทั้งหมดเป็นร้อยละ" }
      - { match: 16, feedback: "16 คืออัตราความผิดพลาด (4 ÷ 25 × 100) ไม่ใช่ความถูกต้อง" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.ai-primary.p006
    topics: [computer.ai.ai-primary]
    difficulty: 2
    type: numeric
    stem: "ตัวอย่างฝึกของร้านขายผลไม้ในตลาดมีมะม่วงสุก 24 ภาพ และยังไม่มีมะม่วงดิบ เมื่อเพิ่มมะม่วงดิบอีก 8 ภาพ มะม่วงดิบคิดเป็นกี่เปอร์เซ็นต์ของตัวอย่างฝึกทั้งหมด"
    answer: { value: 25, tolerance: 0.01, unit: "%" }
    hints:
      - "หาจำนวนตัวอย่างทั้งหมดหลังเพิ่มภาพแล้วก่อน"
      - "นำจำนวนมะม่วงดิบหารด้วยตัวอย่างทั้งหมด แล้วคูณด้วย 100"
    solution: "ตัวอย่างทั้งหมด 24 + 8 = 32 ภาพ มะม่วงดิบ 8 ÷ 32 × 100 = 25 เปอร์เซ็นต์"
    misconceptions:
      - { match: 8, feedback: "8 คือจำนวนภาพมะม่วงดิบ ยังไม่ได้เทียบกับตัวอย่างทั้งหมดเป็นร้อยละ" }
      - { match: 33.33, feedback: "33.33 คือเทียบกับมะม่วงสุก (8 ÷ 24) แทนตัวอย่างทั้งหมด ต้องหารด้วย 32" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.ai-primary.p007
    topics: [computer.ai.ai-primary]
    difficulty: 2
    type: mcq
    stem: "แบบจำลองทายผิดบ่อยเมื่อเจอภาพที่ไม่ตรงกับตัวอย่างฝึก สาเหตุหลักคือข้อใด"
    choices:
      - { id: a, text: "ตัวอย่างฝึกไม่ครอบคลุมความหลากหลายของสิ่งที่จะเจอจริง", correct: true }
      - { id: b, text: "คอมพิวเตอร์เสียความจำจากการทำงานนาน", feedback: "ความจำไม่ได้เสีย ปัญหาคือตัวอย่างที่ให้เรียนไม่ครอบคลุม" }
      - { id: c, text: "ภาพที่ทดสอบมีสีมากเกินไป", feedback: "สีที่หลากหลายไม่ใช่สาเหตุหลัก ถ้าตัวอย่างฝึกครอบคลุมสีเหล่านั้นแล้ว" }
      - { id: d, text: "แบบจำลองไม่ควรถูกทดสอบเลย", feedback: "การทดสอบจำเป็นเพื่อดูว่าแบบจำลองแม่นแค่ไหน" }
    hints:
      - "ลองดูว่าแบบจำลองเคยเห็นภาพแบบนั้นหรือไม่"
      - "ปัญหาอยู่ที่ข้อมูลที่ใช้เรียน ไม่ได้อยู่ที่ความสามารถของคอมพิวเตอร์"
    solution: "แบบจำลองทายได้ดีเฉพาะสิ่งที่เคยเรียนมาพอสมควร ถ้าตัวอย่างฝึกไม่ครอบคลุม จะทายผิดเมื่อเจอภาพที่ต่างออกไป"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.ai-primary.p008
    topics: [computer.ai.ai-primary]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดช่วยให้แบบจำลองแยกผลไม้ได้แม่นขึ้น (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "เพิ่มตัวอย่างที่มีสี รูปร่าง และแสงต่างกัน", correct: true }
      - { id: b, text: "ติดป้ายให้ถูกต้องทุกภาพ", correct: true }
      - { id: c, text: "ทดสอบด้วยภาพใหม่แล้วเพิ่มตัวอย่างของชนิดที่ทายผิด", correct: true }
      - { id: d, text: "ใช้ภาพเดิมซ้ำ ๆ ทั้งหมดเพื่อให้เครื่องจำได้ดี", feedback: "ภาพซ้ำไม่ได้เพิ่มความหลากหลาย แบบจำลองจึงไม่เรียนลักษณะที่ต่างออกไป" }
    hints:
      - "ลองนึกว่าการเพิ่มความหลากหลายช่วยให้เครื่องเรียนอะไรเพิ่มขึ้น"
      - "ป้ายกำกับที่ผิดส่งผลต่อการเรียนรู้โดยตรง"
    solution: "การเพิ่มความหลากหลาย การติดป้ายให้ถูกต้อง และการเพิ่มตัวอย่างจากภาพที่ทายผิด ช่วยให้แบบจำลองแม่นขึ้น ส่วนการใช้ภาพเดิมซ้ำไม่ช่วย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.ai-primary.p009
    topics: [computer.ai.ai-primary]
    difficulty: 2
    type: numeric
    stem: "ตัวอย่างฝึก 60 ภาพ แบ่งเป็น 3 ชนิดเท่า ๆ กัน คือมะม่วง กล้วย และส้ม แต่ละชนิดมีกี่ภาพ"
    answer: { value: 20, tolerance: 0, unit: "ภาพ" }
    hints:
      - "ถ้าแบ่งเท่า ๆ กันเป็น 3 ชนิด ให้หารจำนวนทั้งหมดด้วย 3"
      - "ลองตรวจว่า 20 คูณ 3 เท่ากับ 60 หรือไม่"
    solution: "60 ÷ 3 = 20 ภาพต่อชนิด"
    misconceptions:
      - { match: 60, feedback: "60 คือจำนวนภาพทั้งหมด ไม่ใช่จำนวนของแต่ละชนิด" }
      - { match: 30, feedback: "30 เกิดจากการหารด้วย 2 แทนการหารด้วย 3 ตามจำนวนชนิด" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.ai-primary.p010
    topics: [computer.ai.ai-primary]
    difficulty: 3
    type: numeric
    stem: "ก่อนเพิ่มตัวอย่าง แบบจำลองทายถูก 6 จาก 10 ภาพทดสอบ หลังเพิ่มตัวอย่างทายถูก 9 จาก 10 ภาพ ความถูกต้องเพิ่มขึ้นกี่จุดร้อยละ"
    answer: { value: 30, tolerance: 0, unit: "จุดร้อยละ" }
    hints:
      - "หาความถูกต้องก่อนและหลังเป็นร้อยละ แล้วลบกัน"
      - "จุดร้อยละคือผลต่างของร้อยละสองค่า ไม่ใช่สัดส่วนของค่าเดิม"
    solution: "ก่อน 6 ÷ 10 = 60 เปอร์เซ็นต์ หลัง 9 ÷ 10 = 90 เปอร์เซ็นต์ ต่างกัน 90 − 60 = 30 จุดร้อยละ"
    misconceptions:
      - { match: 50, feedback: "50 คือการเทียบกับค่าเดิม (30 ÷ 60) ซึ่งเป็นการเพิ่มขึ้นคิดเป็นร้อยละ แต่โจทย์ถามเป็นจุดร้อยละ" }
      - { match: 3, feedback: "3 คือผลต่างของจำนวนภาพที่ทายถูก ยังไม่ได้เปลี่ยนเป็นร้อยละ" }
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.ai-primary.p011
    topics: [computer.ai.ai-primary]
    difficulty: 3
    type: mcq
    stem: "นักเรียนเก็บแต่ภาพแอปเปิลแดงทั้งหมดแล้วให้แบบจำลองแยกแอปเปิลกับมะนาว ผลที่น่าจะเกิดขึ้นคืออะไร"
    choices:
      - { id: a, text: "แบบจำลองอาจทายทุกภาพเป็นแอปเปิล เพราะไม่เคยเห็นตัวอย่างมะนาวเลย", correct: true }
      - { id: b, text: "แบบจำลองจะแยกได้ถูก 100 เปอร์เซ็นต์ เพราะมีแต่แอปเปิลชนิดเดียว", feedback: "ถ้าไม่เคยเห็นมะนาว แบบจำลองไม่มีทางรู้จักมะนาวได้" }
      - { id: c, text: "แบบจำลองจะรู้จักมะนาวได้เองจากสีเขียว", feedback: "แบบจำลองเรียนได้เฉพาะสิ่งที่มีตัวอย่างและป้ายกำกับให้เรียน" }
      - { id: d, text: "แบบจำลองจะแยกได้ดีขึ้นเมื่อทดสอบด้วยภาพแอปเปิลอีกครั้ง", feedback: "การทดสอบด้วยแอปเปิลเพิ่มไม่ได้ทำให้เรียนรู้มะนาว" }
    hints:
      - "คิดว่าแบบจำลองเรียนได้จากอะไรบ้าง"
      - "ถ้าไม่เคยเห็นสิ่งหนึ่ง แบบจำลองจะจำแนกสิ่งนั้นได้หรือไม่"
    solution: "ตัวอย่างฝึกมีแต่แอปเปิล แบบจำลองจึงไม่รู้จักมะนาว อาจทายทุกภาพเป็นแอปเปิลได้ ต้องเก็บภาพมะนาวที่มีป้ายกำกับเพิ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.ai-primary.p012
    topics: [computer.ai.ai-primary]
    difficulty: 3
    type: match
    stem: "จับคู่คำศัพท์การเรียนรู้ของเครื่องกับความหมาย"
    pairs:
      - { left: "ตัวอย่างฝึก", right: "ภาพที่ใช้สอนแบบจำลองพร้อมชื่อที่ถูกต้อง" }
      - { left: "ป้ายกำกับ", right: "ชื่อที่บอกว่าภาพนั้นเป็นอะไร" }
      - { left: "ตัวอย่างทดสอบ", right: "ภาพที่ไม่เคยใช้สอนเพื่อวัดความแม่นยำ" }
    hints:
      - "ลองนึกว่าภาพแต่ละชนิดถูกใช้ทำอะไรในขั้นตอนการฝึก"
      - "ป้ายกำกับเป็นข้อมูลที่บอกคำตอบของภาพ"
    solution: "ตัวอย่างฝึกคือภาพที่ใช้สอน ป้ายกำกับคือชื่อของภาพ และตัวอย่างทดสอบคือภาพที่ไม่เคยใช้สอนเพื่อวัดความแม่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.ai.ai-primary.p013
    topics: [computer.ai.ai-primary]
    difficulty: 3
    type: mcq
    stem: "ภาพกล้วยที่ถ่ายใต้แสงน้อยทำให้แบบจำลองทายผิดเป็นส้ม ข้อใดน่าจะช่วยได้มากที่สุด"
