id: chemistry.bonding.covalent
subject: chemistry
title: { th: พันธะโคเวเลนต์และรูปร่างโมเลกุล, en: Covalent bonds and molecular shape }
summary: อโลหะใช้เวเลนซ์อิเล็กตรอนร่วมกันเพื่อให้ครบแปดตามกฎออกเตต เกิดพันธะเดี่ยว คู่ หรือสาม และคู่อิเล็กตรอนที่ผลักกันกำหนดรูปร่างของโมเลกุล
difficulty: 4
minutes: 35
prerequisites: [chemistry.matter.periodic-table]
encompasses:
  - { id: chemistry.matter.periodic-table, weight: 0.4 }
  - { id: chemistry.matter.atoms, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: molecule
    title: น้ำ (H₂O) รูปร่างมุมงอ
    cid: 962
    name: water
    caption: หมุนดูว่าไฮโดรเจนสองอะตอมไม่ได้อยู่ตรงข้ามกัน เพราะคู่อิเล็กตรอนโดดเดี่ยว 2 คู่บนออกซิเจนดันพันธะให้งอ มุมราว 104.5°
  - type: molecule
    title: มีเทน (CH₄) ทรงสี่หน้า
    cid: 297
    name: methane
    caption: พันธะ C–H ทั้งสี่ชี้ไปยังมุมของทรงสี่หน้า ห่างกันเท่า ๆ กันที่มุมราว 109.5°
  - type: molecule
    title: แอมโมเนีย (NH₃) พีระมิดฐานสามเหลี่ยม
    cid: 222
    name: ammonia
    caption: ไนโตรเจนอยู่ยอดพีระมิด มีคู่อิเล็กตรอนโดดเดี่ยว 1 คู่อยู่ด้านบน ทำให้มุม H–N–H ราว 107° เล็กกว่ามีเทนเล็กน้อย
  - type: molecule
    title: คาร์บอนไดออกไซด์ (CO₂) เส้นตรง
    cid: 280
    name: carbon dioxide
    caption: พันธะคู่ C=O สองพันธะชี้ไปคนละทางพอดี คาร์บอนไม่มีคู่อิเล็กตรอนโดดเดี่ยว โมเลกุลจึงเป็นเส้นตรง 180°
  - type: molecule
    title: ไนโตรเจน (N₂) พันธะสาม
    cid: 947
    name: nitrogen
    caption: ไนโตรเจนสองอะตอมใช้อิเล็กตรอนร่วมกัน 3 คู่ เป็นพันธะที่แข็งแรงมาก แก๊สไนโตรเจนจึงไม่ค่อยทำปฏิกิริยา
  - type: simulation
    title: ลองสร้างรูปร่างโมเลกุล (PhET Molecule Shapes Basics)
    url: https://phet.colorado.edu/en/simulations/molecule-shapes-basics
    provider: phet
    note: เพิ่มพันธะและคู่อิเล็กตรอนโดดเดี่ยวรอบอะตอมกลาง แล้วสังเกตว่ารูปร่างและมุมพันธะเปลี่ยนอย่างไร
glossary:
  - { term: พันธะโคเวเลนต์, definition: พันธะที่เกิดจากอะตอมสองอะตอมใช้คู่อิเล็กตรอนร่วมกัน มักเกิดระหว่างอโลหะกับอโลหะ }
  - { term: กฎออกเตต, definition: อะตอมมักเกิดพันธะจนมีอิเล็กตรอนชั้นนอกสุด 8 ตัวเหมือนแก๊สมีตระกูล (ไฮโดรเจนต้องการ 2 ตัว) }
  - { term: คู่อิเล็กตรอนโดดเดี่ยว, definition: คู่อิเล็กตรอนชั้นนอกสุดที่ไม่ได้ใช้สร้างพันธะ แต่ยังผลักคู่อิเล็กตรอนอื่นและมีผลต่อรูปร่างโมเลกุล }
  - { term: สูตรโครงสร้าง, definition: สูตรที่แสดงว่าอะตอมใดต่อกับอะตอมใด โดยใช้เส้นแทนพันธะ เช่น H–O–H }
flashcards:
  - { front: "พันธะเดี่ยว คู่ และสาม ใช้อิเล็กตรอนร่วมกันกี่ตัว", back: "เดี่ยว 2 ตัว (1 คู่) · คู่ 4 ตัว (2 คู่) · สาม 6 ตัว (3 คู่)" }
  - { front: "H, O, N, C มักสร้างพันธะกี่พันธะ", back: "H 1 · O 2 · N 3 · C 4 (เท่ากับจำนวนอิเล็กตรอนที่ขาดไปจากออกเตต หรือจาก 2 สำหรับ H)" }
  - { front: "รูปร่างของ $\\mathrm{CH_4}$, $\\mathrm{NH_3}$, $\\mathrm{H_2O}$, $\\mathrm{CO_2}$", back: "ทรงสี่หน้า · พีระมิดฐานสามเหลี่ยม · มุมงอ · เส้นตรง" }
  - { front: "ทำไมน้ำเป็นมุมงอแต่ $\\mathrm{CO_2}$ เป็นเส้นตรง", back: "ออกซิเจนในน้ำมีคู่อิเล็กตรอนโดดเดี่ยว 2 คู่ดันพันธะให้งอ ส่วนคาร์บอนใน $\\mathrm{CO_2}$ ไม่มีคู่โดดเดี่ยว" }
