<text x="350.0" y="306.5" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Quotes &amp; other views  (คำพูด มุมมองอื่น)</text>
<text x="350.0" y="330.5" font-size="14" text-anchor="middle" fill="#111" font-weight="normal" font-style="italic">“Now I feel much safer.”</text>
