    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p015
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 4
    type: numeric
    stem: "ครูต้องการหานักเรียนที่สูงที่สุดในกลุ่ม 8 คน ใช้อัลกอริทึม: ให้คนแรกยืนรอ แล้วเทียบความสูงกับคนถัดไปทีละคน คนที่สูงกว่ายืนรอต่อ ต้องเทียบความสูงทั้งหมดกี่ครั้ง"
    answer: { value: 7, unit: ครั้ง }
    hints:
      - "การเทียบแต่ละครั้งคัดคนที่เตี้ยกว่าออก 1 คน"
      - "ต้องคัดออกกี่คนจึงเหลือคนเดียว"
    misconceptions:
      - { match: 8, feedback: "คนแรกไม่ต้องเทียบกับใครตอนเริ่ม การเทียบเริ่มเมื่อมีคนที่สองมา จึงน้อยกว่าจำนวนคน 1 ครั้ง" }
      - { match: 28, feedback: "28 คือการเทียบทุกคู่ แต่อัลกอริทึมนี้เทียบแค่คนที่รออยู่กับคนถัดไป" }
    solution: "8 คนต้องคัดออก 7 คน การเทียบแต่ละครั้งคัดออก 1 คน จึงเทียบ 7 ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p016
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 4
    type: mcq
    stem: "ห้องสมุดมีบัตรรายชื่อหนังสือ 500 ใบเรียงตามตัวอักษรในกล่อง แก้มต้องการหาบัตรหนังสือเล่มหนึ่ง วิธีใดเหมาะที่สุด และเพราะอะไร"
    choices:
      - { id: a, text: "เปิดบัตรตรงกลางกล่องก่อน แล้วตัดสินว่าจะหาต่อครึ่งหน้าหรือครึ่งหลัง ทำซ้ำไปเรื่อย ๆ เพราะตัดบัตรทิ้งได้ครึ่งหนึ่งทุกครั้ง", correct: true }
      - { id: b, text: "เปิดทีละใบจากใบแรก เพราะง่ายที่สุด", feedback: "ได้ผลถูกเหมือนกัน แต่กรณีแย่ที่สุดต้องเปิด 500 ใบ ไม่ได้ใช้ประโยชน์จากการที่บัตรเรียงไว้แล้ว" }
      - { id: c, text: "สุ่มหยิบบัตรขึ้นมาดูไปเรื่อย ๆ", feedback: "อาจหยิบซ้ำใบเดิม และไม่รับประกันว่าจะเจอเร็ว" }
      - { id: d, text: "เทบัตรทั้งหมดออกมาแล้วเรียงใหม่ก่อนหา", feedback: "บัตรเรียงอยู่แล้ว การเรียงใหม่เพิ่มงานโดยไม่จำเป็น" }
    hints:
      - "บัตรเรียงตามตัวอักษรอยู่แล้ว ข้อมูลนี้ช่วยอะไร"
      - "เปรียบเทียบจำนวนบัตรที่ต้องเปิดในกรณีแย่ที่สุด"
    solution: "การเปิดตรงกลางแล้วตัดครึ่งใช้ประโยชน์จากการเรียงลำดับ ตัดบัตรทิ้งได้ครึ่งหนึ่งทุกครั้ง 500 ใบใช้ไม่เกินประมาณ 9 ครั้ง ส่วนการเปิดทีละใบอาจต้องเปิด 500 ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p017
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 4
    type: mcq
    stem: "รู้ว่า (1) สมาชิกชมรมหุ่นยนต์ทุกคนเขียนโปรแกรมเป็น (2) ต้นเป็นสมาชิกชมรมหุ่นยนต์ (3) ฝนเขียนโปรแกรมเป็น ข้อสรุปใดถูกต้องแน่นอน"
    choices:
      - { id: a, text: "ต้นเขียนโปรแกรมเป็น", correct: true }
      - { id: b, text: "ฝนเป็นสมาชิกชมรมหุ่นยนต์", feedback: "คนที่เขียนโปรแกรมเป็นอาจไม่ได้อยู่ชมรมหุ่นยนต์ นี่คือการคิดกลับด้าน" }
      - { id: c, text: "ทุกคนที่เขียนโปรแกรมเป็นอยู่ชมรมหุ่นยนต์", feedback: "ข้อ (1) บอกแค่ว่าสมาชิกทุกคนเขียนโปรแกรมเป็น ไม่ได้บอกกลับกัน" }
      - { id: d, text: "ต้นกับฝนอยู่ชมรมเดียวกัน", feedback: "ไม่มีข้อมูลว่าฝนอยู่ชมรมใด" }
    hints:
      - "นำข้อ (1) กับ (2) มาใช้ด้วยกัน"
      - "ข้อ (3) บอกอะไรเกี่ยวกับชมรมของฝนได้หรือไม่"
    solution: "จาก (1) และ (2) ต้นเป็นสมาชิก และสมาชิกทุกคนเขียนโปรแกรมเป็น จึงสรุปได้ว่าต้นเขียนโปรแกรมเป็น ส่วนข้อมูลของฝนไม่พอบอกว่าอยู่ชมรมใด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p018
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 5
    type: numeric
    stem: "เพื่อนคิดเลข 1 ถึง 100 ไว้ ทุกครั้งที่ทายเพื่อนบอกว่า ถูก มากไป หรือ น้อยไป ถ้าทายเลขกลางของช่วงที่เหลือทุกครั้ง กรณีแย่ที่สุดต้องทายกี่ครั้ง"
    answer: { value: 7, unit: ครั้ง }
    hints:
      - "ทายแต่ละครั้งตัดตัวเลขที่เหลือได้ประมาณครึ่งหนึ่ง"
      - "ทาย 1 ครั้งครอบคลุมได้ 1 ตัว 2 ครั้งได้ 1 + 2 = 3 ตัว 3 ครั้งได้ 1 + 2 + 4 = 7 ตัว ต่อไปจนเกิน 100"
    misconceptions:
      - { match: 100, feedback: "100 ครั้งคือกรณีแย่ที่สุดของการทายทีละตัว แต่การทายเลขกลางตัดตัวเลือกได้ครึ่งหนึ่งทุกครั้ง" }
      - { match: 50, feedback: "50 คือเลขที่ทายครั้งแรก ไม่ใช่จำนวนครั้ง การทายเลขกลางลดช่วงลงครึ่งหนึ่งทุกครั้ง" }
    solution: "ทาย k ครั้งครอบคลุมได้ 1 + 2 + 4 + … = 2^k − 1 ตัว 6 ครั้งได้ 63 ตัว ไม่พอ 7 ครั้งได้ 127 ตัว พอสำหรับ 100 จึงใช้มากที่สุด 7 ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: computer.algorithms.logical-reasoning.p019
    topics: [computer.algorithms.logical-reasoning]
    difficulty: 5
    type: mcq
    stem: |
      ครูเขียนอัลกอริทึมตัดเกรดวิชาคอมพิวเตอร์ (คะแนนเต็ม 100) ดังนี้

      ```
      ถ้า คะแนน >= 50 แล้ว ผล = "ผ่าน"
      ถ้า คะแนน >= 80 แล้ว ผล = "ดีเยี่ยม"
      ไม่เช่นนั้น ผล = "ไม่ผ่าน"
      ```

      (บรรทัด ไม่เช่นนั้น เป็นของเงื่อนไขบรรทัดที่สอง) นักเรียนที่ได้ 65 คะแนนได้ผลอะไร และอัลกอริทึมนี้มีปัญหาหรือไม่
    choices:
      - { id: a, text: "ได้ ไม่ผ่าน ซึ่งผิด ควรตรวจ >= 80 ก่อน แล้วจึงตรวจ >= 50 และใช้ ไม่เช่นนั้น ต่อกันเป็นชุดเดียว", correct: true }
      - { id: b, text: "ได้ ผ่าน และอัลกอริทึมถูกต้อง", feedback: "บรรทัดแรกตั้งค่าเป็น ผ่าน จริง แต่บรรทัดที่สองเป็นเท็จ จึงทำ ไม่เช่นนั้น ทับค่าเป็น ไม่ผ่าน" }
      - { id: c, text: "ได้ ดีเยี่ยม", feedback: "65 >= 80 เป็นเท็จ จึงไม่ได้ ดีเยี่ยม" }
      - { id: d, text: "ได้ทั้ง ผ่าน และ ดีเยี่ยม", feedback: "ตัวแปร ผล เก็บค่าได้ทีละค่า ค่าใหม่จะทับค่าเดิม" }
    hints:
      - "ไล่ทีละบรรทัดด้วยคะแนน 65 แล้วจดค่า ผล หลังแต่ละบรรทัด"
      - "ไม่เช่นนั้น ทำงานเมื่อเงื่อนไขบรรทัดที่สองเป็นเท็จ แล้วค่าของ ผล เปลี่ยนเป็นอะไร"
    solution: "บรรทัดแรก 65 >= 50 จริง ผล = ผ่าน บรรทัดที่สอง 65 >= 80 เท็จ จึงทำ ไม่เช่นนั้น ผล = ไม่ผ่าน ทับค่าเดิม ผลจึงผิด ควรเขียนเป็นชุดเดียว: ถ้า >= 80 ดีเยี่ยม ไม่เช่นนั้น ถ้า >= 50 ผ่าน ไม่เช่นนั้น ไม่ผ่าน"
    license: CC-BY-SA-4.0
    ai_assisted: true
