    ai_assisted: true

  - id: health.fitness.fitness-components.p015
    topics: [health.fitness.fitness-components]
    difficulty: 4
    type: numeric
    stem: "บันทึกกิจกรรมทางกายระดับปานกลางถึงหนักของฝนใน 1 สัปดาห์ (นาที) คือ จันทร์ 45 อังคาร 70 พุธ 30 พฤหัสบดี 90 ศุกร์ 60 เสาร์ 20 อาทิตย์ 105 เฉลี่ยวันละกี่นาที (ตอบเป็นตัวเลขในหน่วยนาที)"
    answer: { value: 60, unit: นาที }
    misconceptions:
      - { match: 420, feedback: "420 คือผลรวมทั้งสัปดาห์ ต้องหารด้วย 7 วัน" }
      - { match: 84, feedback: "หารด้วย 5 วัน แต่บันทึกมี 7 วัน" }
    hints:
      - "บวกนาทีของทั้ง 7 วัน"
      - "ค่าเฉลี่ย = ผลรวม ÷ จำนวนวัน"
    solution: "$45 + 70 + 30 + 90 + 60 + 20 + 105 = 420$ นาที เฉลี่ย $420 \\div 7 = 60$ นาทีต่อวัน ถึงคำแนะนำของ WHO แม้บางวันจะน้อยกว่า 60 นาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.fitness.fitness-components.p016
    topics: [health.fitness.fitness-components]
