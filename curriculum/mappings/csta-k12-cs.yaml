    coverage: full
    note: ชั่งการเปิดเผยกับการเก็บเป็นความลับ การเก็บอัตโนมัติด้วยคุกกี้ ตำแหน่ง ประวัติการใช้งาน และการอนุมาน และผลด้านความปลอดภัย กฎหมาย จริยธรรม และเศรษฐกิจ
  - topic: computer.systems.operating-systems
    indicators: [3A-CS-02, 3B-CS-01]
    coverage: full
    note: ชั้นฮาร์ดแวร์ ซอฟต์แวร์ระบบ และซอฟต์แวร์ประยุกต์ การติดต่อระหว่างชั้นผ่าน system call และไดรเวอร์ การเทียบระดับนามธรรม (เกมเอนจินกับโค้ดระดับต่ำ) และการจัดหมวดหน้าที่ของระบบปฏิบัติการหกด้าน
  - topic: computer.algorithms.searching-sorting
    indicators: [3A-AP-15]
    coverage: full
    note: ชั่งความอ่านง่ายกับประสิทธิภาพในการเลือกอัลกอริทึมและโครงสร้างควบคุม (for ที่ return ทันทีเมื่อเจอ while สำหรับทวิภาค เรียงครั้งเดียวแล้วค้นทวิภาคเมื่อค้นบ่อย ใช้ sorted ในงานจริง) พร้อมบอกข้อดีข้อเสียของทางที่เลือก
  - topic: computer.data.databases
    indicators: [3A-DA-10]
    coverage: full
    note: "ชั่งการจัดข้อมูล (ตารางเดียวที่ซ้ำซ้อนกับการแยกตารางที่ต้อง JOIN) และที่เก็บข้อมูล (ในเครื่องกับคลาวด์: อินเทอร์เน็ต การสำรอง ค่าบริการ ความเป็นส่วนตัว) พร้อมกรณีร้านสหกรณ์บนดอย"
  - topic: computer.programming.development-process
    indicators: [1B-AP-13, 3B-AP-24]
    coverage: full
    note: วางแผนการพัฒนาแบบวนรอบโดยฟังผู้ใช้หลายกลุ่ม (นักเรียน แม่ค้า ครู ผู้ปกครอง ผู้มีข้อจำกัด) จัดลำดับความเห็นด้วยผลต่อผู้ใช้กับแรงที่ต้องใช้ และวางแผนรอบถัดไป
  - topic: computer.programming.development-process
    indicators: [1B-AP-12, 3B-AP-22, 2-AP-15, 3A-AP-19, 3A-AP-23, 3B-AP-17, 3B-AP-19, 3B-AP-21]
    coverage: partial
    note: ต่อยอดโปรแกรมเดิมตามสัญญาอนุญาตพร้อมให้เครดิต เพิ่มความสามารถ (ค่ากล่องกลับบ้าน ส่วนลดสมาชิก) และอภิปรายผลที่ไม่ตั้งใจ เช่น ค่าเริ่มต้นของพารามิเตอร์ที่ทำให้ลูกค้าทั่วไปได้ส่วนลด แต่ผู้เรียนไม่ได้แก้โปรแกรมเองในแอป
  - topic: computer.programming.lists-strings
