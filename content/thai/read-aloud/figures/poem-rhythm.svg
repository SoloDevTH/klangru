<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="sans-serif">
<title>จังหวะการอ่านกลอนสุภาพและกาพย์ยานี</title>
<rect x="0" y="0" width="860" height="470" fill="#fff"/>
<text x="20.0" y="36.0" font-size="21" text-anchor="start" fill="#1f5fbf" font-weight="bold">กลอนสุภาพ: วรรคละ 8 คำ อ่านเป็น 3 / 2 / 3</text>
<text x="30.0" y="90.0" font-size="23" text-anchor="start" fill="#111" font-weight="normal">ยามเช้าตรู่  /  ดูฟ้า  /  สีทองผ่อง</text>
<text x="450.0" y="90.0" font-size="23" text-anchor="start" fill="#111" font-weight="normal">นกร้องก้อง  /  กังวาน  /  เสียงแสนหวาน</text>
<text x="30.0" y="150.0" font-size="23" text-anchor="start" fill="#111" font-weight="normal">ลมโชยพัด  /  ดอกไม้  /  หอมทั่วลาน</text>
<text x="450.0" y="150.0" font-size="23" text-anchor="start" fill="#111" font-weight="normal">เด็กสำราญ  /  ร่าเริง  /  ไปโรงเรียน</text>
<text x="430.0" y="220.0" font-size="18" text-anchor="middle" fill="#c0392b" font-weight="bold">สัมผัส: ผ่อง–ก้อง · หวาน–ลาน · ลาน–(สำ)ราญ</text>
<line x1="20.0" y1="250.0" x2="840.0" y2="250.0" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
<text x="20.0" y="290.0" font-size="21" text-anchor="start" fill="#1f5fbf" font-weight="bold">กาพย์ยานี 11: วรรคหน้า 5 คำ (2 / 3) · วรรคหลัง 6 คำ (3 / 3)</text>
<text x="30.0" y="340.0" font-size="23" text-anchor="start" fill="#111" font-weight="normal">เช้านี้  /  ฟ้าแจ่มใส</text>
<text x="450.0" y="340.0" font-size="23" text-anchor="start" fill="#111" font-weight="normal">ลมโชยไกล  /  พาชื่นบาน</text>
<text x="30.0" y="400.0" font-size="23" text-anchor="start" fill="#111" font-weight="normal">นกน้อย  /  ร้องขับขาน</text>
<text x="450.0" y="400.0" font-size="23" text-anchor="start" fill="#111" font-weight="normal">ทุกหัวใจ  /  สุขสดใส</text>
<text x="430.0" y="458.0" font-size="18" text-anchor="middle" fill="#c0392b" font-weight="bold">สัมผัส: ใส–ไกล · บาน–ขาน</text>
</svg>
