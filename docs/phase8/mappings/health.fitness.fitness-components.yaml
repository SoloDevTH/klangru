  - { framework: th-core-2551-health-pe, indicators: ["พ 3.2 ป.3/1"], coverage: partial, note: "สอนการเลือกกิจกรรมตามจุดเด่น จุดด้อย และข้อจำกัด มีโจทย์เลือกการละเล่นพื้นเมือง (p011) แต่การเลือกและออกกำลังกายจริงของผู้เรียนแต่ละคนแอปตรวจไม่ได้" }
  - { framework: th-core-2551-health-pe, indicators: ["พ 4.1 ป.4/4", "พ 4.1 ป.5/5", "พ 4.1 ม.3/5"], coverage: partial, note: "สอนรายการทดสอบของกรมพลศึกษา องค์ประกอบที่แต่ละรายการวัด การอ่านผลเทียบเกณฑ์ตามอายุและเพศ การคิดร้อยละความก้าวหน้า และความแตกต่างระหว่างบุคคล แต่การทดสอบจริงต้องทำกับครูพลศึกษา แอปวัดสมรรถภาพไม่ได้" }
  - { framework: th-core-2551-health-pe, indicators: ["พ 4.1 ป.3/5", "พ 4.1 ป.6/4", "พ 4.1 ม.1/4", "พ 4.1 ม.2/7"], coverage: partial, note: "สอนการเลือกกิจกรรมตามองค์ประกอบที่ต่ำ การปรับปรุงทีละน้อยอย่างสม่ำเสมอ เกณฑ์ที่ต้องไปให้ถึง และคำแนะนำของ WHO แต่การสร้างเสริมและพัฒนาสมรรถภาพจริงต้องฝึกนอกแอป หลักการฝึกแบบละเอียด (FITT) อยู่ในหัวข้อ health.fitness.training-principles" }
