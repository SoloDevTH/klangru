<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" font-family="sans-serif">
  <title>สตริง ก่า แยกเป็นสามอักขระ ได้แก่ ก วรรณยุกต์ไม้เอก และสระอา มีดัชนี 0 ถึง 2</title>
  <rect x="0" y="0" width="560" height="250" fill="#ffffff"/>
  <text x="20" y="30" font-size="15" font-weight="bold" fill="#1f2937" font-family="monospace">s = "ก่า"    len(s) = 3</text>
  <rect x="40" y="60" width="140" height="110" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="132" font-size="60" text-anchor="middle" fill="#1f2937" font-family="Loma, Sarabun, Noto Sans Thai, sans-serif">ก</text>
  <text x="110" y="194" font-size="15" text-anchor="middle" fill="#374151" font-family="monospace">[0] U+0E01</text>
  <rect x="220" y="60" width="140" height="110" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="290" y="132" font-size="60" text-anchor="middle" fill="#1f2937" font-family="Loma, Sarabun, Noto Sans Thai, sans-serif">่</text>
  <text x="290" y="194" font-size="15" text-anchor="middle" fill="#374151" font-family="monospace">[1] U+0E48</text>
  <rect x="400" y="60" width="140" height="110" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="132" font-size="60" text-anchor="middle" fill="#1f2937" font-family="Loma, Sarabun, Noto Sans Thai, sans-serif">า</text>
  <text x="470" y="194" font-size="15" text-anchor="middle" fill="#374151" font-family="monospace">[2] U+0E32</text>
  <text x="280" y="225" font-size="14" text-anchor="middle" fill="#6b7280">วรรณยุกต์และสระเป็นอักขระแยกจากพยัญชนะ ความกว้างบนจอไม่เท่ากับจำนวนอักขระ</text>
</svg>
