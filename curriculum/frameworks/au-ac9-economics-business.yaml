          - { id: "AC9HE8S02", level: "8", text: "locate, select and organise information and data from a range of sources" }
          - { id: "AC9HE9S01", level: "9", text: "develop and modify questions to investigate a contemporary economic and business issue" }
          - { id: "AC9HE9S02", level: "9", text: "locate, select and analyse information and data from a range of sources" }
          - { id: "AC9HE10S01", level: "10", text: "develop and modify questions to investigate a contemporary economic and business issue" }
          - { id: "AC9HE10S02", level: "10", text: "locate, select and analyse information and data from a range of sources" }
