<text x="450.0" y="266.0" text-anchor="middle" font-size="13" fill="#555">ปัญหาที่วัดได้</text>
<text x="450.0" y="286.0" text-anchor="middle" font-size="13" fill="#555">→ ผลที่ยั่งยืน</text>
