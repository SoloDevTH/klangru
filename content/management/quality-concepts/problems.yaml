problems:
  - id: mgt.qt.p001
    topics: [management.quality.concepts]
    difficulty: 1
    type: mcq
    stem: "ร้านอาหารตามสั่งตั้งเป้าว่าลูกค้าต้องได้อาหารภายใน 15 นาที หลังเปลี่ยนวิธีจัดคิวมาหนึ่งสัปดาห์ เจ้าของร้านนำเวลาที่จดไว้มาเทียบกับเป้า 15 นาที ขั้นนี้คือขั้นใดของวงจร PDCA"
    choices:
      - { id: a, text: "C (Check) ตรวจสอบ", correct: true }
      - { id: b, text: "P (Plan) วางแผน", feedback: "การตั้งเป้า 15 นาทีและคิดวิธีจัดคิวคือขั้นวางแผน ซึ่งทำไปแล้ว ตอนนี้กำลังวัดผลเทียบกับเป้า" }
      - { id: c, text: "D (Do) ลงมือทำ", feedback: "การใช้วิธีจัดคิวใหม่หนึ่งสัปดาห์คือขั้นลงมือทำ ส่วนการนำผลมาเทียบกับเป้าคือขั้นถัดไป" }
      - { id: d, text: "A (Act) ปรับปรุง", feedback: "ขั้น Act คือการตัดสินใจหลังรู้ผลแล้ว เช่น ใช้วิธีใหม่เป็นมาตรฐาน ยังไม่ถึงขั้นนั้น" }
    hints:
      - "ไล่ดูว่าร้านทำอะไรไปแล้วบ้าง: ตั้งเป้า ลองวิธีใหม่ แล้วตอนนี้กำลังทำอะไร"
      - "ขั้นที่นำผลที่วัดได้มาเทียบกับเป้าหมายมีชื่อว่าอะไร"
    solution: "ร้านตั้งเป้าและวางวิธี (P) ลองจัดคิวแบบใหม่ (D) แล้วนำเวลาจริงมาเทียบกับเป้า ซึ่งคือขั้น C ตรวจสอบ ขั้นต่อไปจะเป็น A ตัดสินใจว่าจะใช้วิธีนี้ต่อหรือปรับแผน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p002
    topics: [management.quality.concepts]
    difficulty: 1
    type: order
    stem: "แผนกผู้ป่วยนอกของโรงพยาบาลต้องการลดเวลารอรับยา เรียงขั้นตอนตามวงจร PDCA ให้ถูกต้อง"
    items:
      - "ตั้งเป้าลดเวลารอรับยาจาก 40 นาทีเหลือ 25 นาที และวางแผนแยกช่องจ่ายยาสำหรับผู้ป่วยที่ได้ยาไม่เกิน 2 รายการ"
      - "เปิดช่องจ่ายยาด่วนทดลอง 1 เดือน และจับเวลารอของผู้ป่วยทุกคน"
      - "นำเวลารอเฉลี่ยหลังทดลองมาเทียบกับเป้า 25 นาที"
      - "ได้ผลตามเป้า จึงเขียนเป็นขั้นตอนปฏิบัติมาตรฐานและใช้ทุกวัน"
    hints:
      - "วงจรเริ่มจากการตั้งเป้าและวางแผนเสมอ"
      - "ลำดับคือ วางแผน → ลงมือทำ → ตรวจสอบผล → ปรับปรุงหรือทำเป็นมาตรฐาน"
    solution: "P ตั้งเป้าและวางแผนช่องจ่ายยาด่วน → D ทดลอง 1 เดือนพร้อมเก็บข้อมูล → C เทียบผลกับเป้า → A ทำเป็นมาตรฐานเพราะได้ผล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p003
    topics: [management.quality.concepts]
    difficulty: 1
    type: match
    stem: "โรงงานผลิตรองเท้า จับคู่รายการค่าใช้จ่ายกับกลุ่มของต้นทุนคุณภาพ"
    pairs:
      - { left: "ค่าอบรมพนักงานเย็บก่อนเริ่มงาน", right: "ต้นทุนป้องกัน" }
      - { left: "ค่าตรวจรับหนังจากผู้ขาย", right: "ต้นทุนประเมิน" }
      - { left: "ค่ารองเท้าที่เย็บผิดแล้วต้องทิ้งในโรงงาน", right: "ต้นทุนความล้มเหลวภายใน" }
      - { left: "ค่าเปลี่ยนรองเท้าให้ลูกค้าที่พื้นหลุด", right: "ต้นทุนความล้มเหลวภายนอก" }
    hints:
      - "ถามตัวเองว่าจ่ายเงินก่อนเกิดของเสีย จ่ายเพื่อตรวจหา หรือจ่ายเพราะของเสียเกิดแล้ว"
      - "ของเสียที่พบในโรงงานเป็นความล้มเหลวภายใน ของเสียที่ลูกค้าพบเป็นความล้มเหลวภายนอก"
    solution: "อบรมก่อนทำงานคือการป้องกัน ตรวจรับวัตถุดิบคือการประเมิน ของเสียที่ทิ้งในโรงงานคือความล้มเหลวภายใน และการเปลี่ยนสินค้าให้ลูกค้าคือความล้มเหลวภายนอก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p004
    topics: [management.quality.concepts]
    difficulty: 2
    type: numeric
    stem: "บริษัทผลิตพัดลมมีต้นทุนป้องกัน 40,000 บาท ต้นทุนประเมิน 60,000 บาท ต้นทุนความล้มเหลวภายใน 150,000 บาท และต้นทุนความล้มเหลวภายนอก 250,000 บาท ต้นทุนคุณภาพรวมเป็นเท่าใด (ตอบเป็นตัวเลขในหน่วยบาท)"
    answer: { value: 500000, unit: บาท }
    hints:
      - "ต้นทุนคุณภาพรวมประกอบด้วยกี่กลุ่ม"
      - "นำต้นทุนทั้งสี่กลุ่มมารวมกัน"
    misconceptions:
      - { match: 400000, feedback: "นั่นคือต้นทุนความล้มเหลวเท่านั้น (ต้นทุนของคุณภาพที่ไม่ดี) ต้นทุนคุณภาพรวมต้องนับต้นทุนป้องกันและประเมินด้วย" }
      - { match: 100000, feedback: "นั่นคือเฉพาะต้นทุนป้องกันกับประเมิน ต้องรวมต้นทุนความล้มเหลวทั้งภายในและภายนอกด้วย" }
    solution: "ต้นทุนคุณภาพรวม $= 40{,}000 + 60{,}000 + 150{,}000 + 250{,}000 = 500{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p005
    topics: [management.quality.concepts]
    difficulty: 2
    type: numeric
    stem: "บริษัทในข้อก่อนมีต้นทุนคุณภาพรวม 500,000 บาท และยอดขาย 10,000,000 บาท ต้นทุนคุณภาพคิดเป็นร้อยละเท่าใดของยอดขาย (ตอบเป็นตัวเลขในหน่วย %)"
    answer: { value: 5, unit: "%" }
    hints:
      - "ร้อยละของยอดขาย = ส่วนที่สนใจ ÷ ยอดขาย × 100"
      - "นำต้นทุนคุณภาพไปหารด้วยยอดขาย แล้วคูณ 100"
    misconceptions:
      - { match: 20, feedback: "ดูเหมือนนำยอดขายไปหารด้วยต้นทุนคุณภาพ ต้องเอาต้นทุนคุณภาพเป็นตัวตั้ง หารด้วยยอดขาย" }
    solution: "$\\dfrac{500{,}000}{10{,}000{,}000} \\times 100 = 5\\%$ ของยอดขาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p006
    topics: [management.quality.concepts]
    difficulty: 2
    type: mcq
    stem: "ข้อใดอธิบายการบริหารคุณภาพโดยรวม (TQM) ได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "ทุกคนทุกฝ่ายร่วมกันปรับปรุงงานอย่างต่อเนื่อง โดยมุ่งที่ความต้องการของลูกค้าและตัดสินใจจากข้อมูล", correct: true }
      - { id: b, text: "ให้แผนกควบคุมคุณภาพรับผิดชอบเรื่องคุณภาพทั้งหมด ฝ่ายอื่นทำงานของตนตามปกติ", feedback: "TQM เน้นว่าคุณภาพเป็นหน้าที่ของทุกคน ไม่ใช่ของแผนกเดียว" }
      - { id: c, text: "เพิ่มพนักงานตรวจสินค้าสำเร็จรูปทุกชิ้นก่อนส่งให้ลูกค้า", feedback: "นี่คือแนวคิดแบบการตรวจสอบ (inspection) ซึ่งเป็นขั้นแรกของวิวัฒนาการคุณภาพ TQM เน้นป้องกันมากกว่าคัดของเสีย" }
      - { id: d, text: "ซื้อวัตถุดิบที่แพงที่สุดเพื่อให้สินค้ามีคุณภาพสูงสุด", feedback: "คุณภาพไม่ได้แปลว่าแพง และ TQM เป็นวิธีบริหารทั้งระบบ ไม่ใช่การเลือกวัตถุดิบอย่างเดียว" }
    hints:
      - "คำว่า 'โดยรวม' (Total) หมายถึงใครบ้างที่มีส่วนร่วม"
      - "TQM เน้นการป้องกันและการปรับปรุงต่อเนื่อง มากกว่าการคัดของเสียตอนท้าย"
    solution: "TQM คือการให้ทุกคนในองค์กรมีส่วนร่วม มุ่งที่ลูกค้า ปรับปรุงกระบวนการต่อเนื่อง และใช้ข้อมูลตัดสินใจ ตัวเลือกอื่นเป็นแนวคิดการตรวจคัดหรือการมองคุณภาพว่าเป็นของแพง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p007
    topics: [management.quality.concepts]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นหลักการบริหารคุณภาพของมาตรฐานตระกูล ISO 9000 (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "มุ่งเน้นลูกค้า", correct: true }
      - { id: b, text: "การตัดสินใจจากหลักฐาน", correct: true }
      - { id: c, text: "การบริหารเชิงกระบวนการ", correct: true }
      - { id: d, text: "ซื้อวัตถุดิบจากผู้ขายที่ให้ราคาต่ำสุดเสมอ", feedback: "หลักการที่เกี่ยวข้องคือการบริหารความสัมพันธ์กับผู้ขายและผู้มีส่วนได้ส่วนเสีย ซึ่งดูคุณภาพและความร่วมมือระยะยาว ไม่ใช่ราคาต่ำสุดอย่างเดียว" }
      - { id: e, text: "ตรวจสินค้าสำเร็จรูปทุกชิ้นแทนการปรับปรุงกระบวนการ", feedback: "หลักการข้อหนึ่งคือการปรับปรุง ซึ่งมุ่งแก้ที่กระบวนการ การตรวจทุกชิ้นไม่ใช่หลักการของมาตรฐานนี้" }
    hints:
      - "หลักการมี 7 ข้อ เริ่มจากลูกค้าและผู้นำ"
      - "ตัวเลือกที่เน้นราคาต่ำสุดหรือการตรวจคัดอย่างเดียว ขัดกับแนวคิดการป้องกันและการปรับปรุง"
    solution: "หลักการ 7 ข้อ ได้แก่ มุ่งเน้นลูกค้า ความเป็นผู้นำ การมีส่วนร่วมของบุคลากร การบริหารเชิงกระบวนการ การปรับปรุง การตัดสินใจจากหลักฐาน และการบริหารความสัมพันธ์ จึงถูกข้อ ก ข และ ค"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p008
    topics: [management.quality.concepts]
    difficulty: 3
    type: numeric
    stem: "โรงงานผลิตกระเบื้องมีรายการต้นทุนในปีนี้ดังนี้ เศษกระเบื้องแตกที่ทิ้งในโรงงาน 120,000 บาท ค่าแรงขัดแต่งกระเบื้องที่สีไม่สม่ำเสมอ 80,000 บาท ค่าตรวจสอบกระเบื้องก่อนบรรจุ 60,000 บาท ค่าขนส่งรับกระเบื้องที่ลูกค้าตีกลับ 50,000 บาท และค่าชดเชยลูกค้าที่ปูแล้วร้าว 70,000 บาท ต้นทุนของคุณภาพที่ไม่ดี (ความล้มเหลวภายในรวมภายนอก) เป็นเท่าใด (ตอบเป็นตัวเลขในหน่วยบาท)"
    answer: { value: 320000, unit: บาท }
    hints:
      - "แยกก่อนว่ารายการใดเป็นความล้มเหลว และรายการใดเป็นการประเมิน"
      - "ค่าตรวจสอบก่อนบรรจุเป็นต้นทุนประเมิน ไม่นับในข้อนี้"
      - "รวมเฉพาะรายการที่เกิดเพราะมีของเสียแล้ว ทั้งที่พบในโรงงานและที่ลูกค้าพบ"
    misconceptions:
      - { match: 380000, feedback: "ดูเหมือนนับค่าตรวจสอบ 60,000 บาทด้วย ค่าตรวจสอบเป็นต้นทุนประเมิน ไม่ใช่ต้นทุนความล้มเหลว" }
      - { match: 200000, feedback: "นั่นคือความล้มเหลวภายในเท่านั้น ต้องรวมความล้มเหลวภายนอก (ค่าขนส่งของตีกลับและค่าชดเชย) ด้วย" }
    solution: "ล้มเหลวภายใน $= 120{,}000 + 80{,}000 = 200{,}000$ บาท ล้มเหลวภายนอก $= 50{,}000 + 70{,}000 = 120{,}000$ บาท รวม $320{,}000$ บาท (ค่าตรวจสอบ 60,000 บาท เป็นต้นทุนประเมิน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p009
    topics: [management.quality.concepts]
    difficulty: 3
    type: match
    stem: "จับคู่ข้อกำหนดของ ISO 9001:2015 กับขั้นของวงจร PDCA ที่ข้อกำหนดนั้นทำหน้าที่เป็นหลัก"
    pairs:
      - { left: "ข้อ 6 การวางแผน (รับมือความเสี่ยง ตั้งวัตถุประสงค์คุณภาพ)", right: "P วางแผน" }
      - { left: "ข้อ 8 การดำเนินงาน (ผลิตสินค้าและให้บริการ)", right: "D ลงมือทำ" }
      - { left: "ข้อ 9 การประเมินผล (วัด ตรวจติดตามภายใน ทบทวนโดยผู้บริหาร)", right: "C ตรวจสอบ" }
      - { left: "ข้อ 10 การปรับปรุง (แก้ไขสิ่งที่ไม่เป็นไปตามข้อกำหนด)", right: "A ปรับปรุง" }
    hints:
      - "ดูคำสำคัญในชื่อข้อกำหนด: วางแผน ดำเนินงาน ประเมิน ปรับปรุง"
      - "การวัดผลและตรวจติดตามคือการตรวจสอบ ส่วนการแก้ไขให้ดีขึ้นคือการปรับปรุง"
    solution: "ข้อ 6 คือ P ข้อ 8 คือ D ข้อ 9 คือ C และข้อ 10 คือ A (ข้อ 7 การสนับสนุนอยู่ในส่วน D ร่วมกับข้อ 8 ข้อ 5 ความเป็นผู้นำอยู่กลางวงจร)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p010
    topics: [management.quality.concepts]
    difficulty: 3
    type: mcq
    stem: "สำนักงานที่ดินทดลองให้ประชาชนจองคิวออนไลน์ 1 เดือน เพื่อลดเวลารอจาก 60 นาทีเหลือ 30 นาที แต่ผลที่วัดได้เฉลี่ย 55 นาที เพราะคนส่วนใหญ่ไม่รู้ว่ามีระบบจองคิว ตามแนวคิด PDCA ควรทำอย่างไรต่อ"
    choices:
      - { id: a, text: "วิเคราะห์สาเหตุที่ไม่ได้ผล ปรับแผน เช่น ประชาสัมพันธ์ระบบจองคิว แล้วเริ่มวงจรรอบใหม่", correct: true }
      - { id: b, text: "เลิกระบบจองคิวทันทีและกลับไปใช้วิธีเดิม เพราะการทดลองล้มเหลว", feedback: "ขั้น Act ไม่ได้แปลว่าล้มเลิกเมื่อไม่ถึงเป้า แต่ให้ใช้สิ่งที่เรียนรู้ปรับแผนแล้ววนรอบใหม่" }
      - { id: c, text: "ประกาศให้ระบบจองคิวเป็นมาตรฐานถาวรทันที", feedback: "ผลยังห่างจากเป้ามาก การทำเป็นมาตรฐานควรทำเมื่อวิธีนั้นได้ผลแล้ว" }
      - { id: d, text: "เปลี่ยนเป้าหมายเป็น 55 นาทีเพื่อให้ถือว่าบรรลุเป้า", feedback: "การลดเป้าให้ตรงกับผลไม่ได้ปรับปรุงอะไร ประชาชนยังต้องรอนานเท่าเดิม" }
    hints:
      - "ผลการตรวจสอบ (C) บอกว่ายังไม่ถึงเป้า และรู้สาเหตุแล้ว"
      - "ขั้น A มีสองทาง: ทำเป็นมาตรฐานเมื่อได้ผล หรือปรับแผนแล้ววนใหม่เมื่อยังไม่ได้ผล"
    solution: "ผลยังไม่ถึงเป้า แต่รู้สาเหตุว่าประชาชนไม่รู้จักระบบ ขั้น A จึงควรปรับแผน (เช่น ประชาสัมพันธ์ ติดป้าย ส่งข้อความ) แล้วเริ่ม PDCA รอบใหม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: mgt.qt.p011
    topics: [management.quality.concepts]
    difficulty: 3
    type: numeric
    stem: "ร้านเบเกอรี่มีต้นทุนคุณภาพรวม 600,000 บาทต่อปี ในจำนวนนี้เป็นต้นทุนป้องกัน 30,000 บาท ต้นทุนป้องกันคิดเป็นร้อยละเท่าใดของต้นทุนคุณภาพรวม (ตอบเป็นตัวเลขในหน่วย %)"
    answer: { value: 5, unit: "%" }
    hints:
      - "เทียบส่วน (ต้นทุนป้องกัน) กับทั้งหมด (ต้นทุนคุณภาพรวม)"
      - "หารแล้วคูณ 100"
    misconceptions:
      - { match: 20, feedback: "ดูเหมือนหารกลับด้าน ($600{,}000 \\div 30{,}000$) ต้องเอาต้นทุนป้องกันเป็นตัวตั้ง" }
    solution: "$\\dfrac{30{,}000}{600{,}000} \\times 100 = 5\\%$ แสดงว่าร้านลงทุนป้องกันน้อยมากเมื่อเทียบกับต้นทุนคุณภาพทั้งหมด"
