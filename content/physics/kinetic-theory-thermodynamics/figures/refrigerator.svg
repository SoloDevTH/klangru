<polygon points="215.0,240.0 226.0,244.9 226.0,235.1" fill="#15211e" stroke="#15211e" stroke-width="1" stroke-linejoin="round"/>
<text x="360.0" y="280.0" text-anchor="middle" fill="#15211e" font-size="13">วาล์วขยายตัว</text>
<text x="360.0" y="298.0" text-anchor="middle" fill="#777" font-size="12">สารทำความเย็นขยายตัว เย็นลงมาก</text>
<line x1="110.0" y1="150.0" x2="157.3" y2="150.0" stroke="#1f5fa8" stroke-width="2"/>
