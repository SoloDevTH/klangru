<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" font-family="sans-serif">
<title>บทความเรื่องพืชในทะเลทราย</title>
<defs></defs>
<rect x="0" y="0" width="860" height="250" fill="#fff"/>
<rect x="10.0" y="10.0" width="840.0" height="230.0" rx="10" fill="#fffdf5" stroke="#b08900" stroke-width="2"/>
<text x="30.0" y="48.0" font-size="22" text-anchor="start" fill="#7a5c00" font-weight="bold">พืชในทะเลทราย</text>
<text x="30.0" y="96.0" font-size="20" text-anchor="start" fill="#111" font-weight="normal">ทะเลทรายมีฝนตกน้อยมาก พืชที่อยู่ได้จึงต้องปรับตัวให้ทนแล้ง</text>
<text x="30.0" y="136.0" font-size="20" text-anchor="start" fill="#111" font-weight="normal">กระบองเพชรเก็บน้ำไว้ในลำต้นที่อวบหนา และมีหนามแทนใบ</text>
<text x="30.0" y="176.0" font-size="20" text-anchor="start" fill="#111" font-weight="normal">ใบที่แผ่กว้างทำให้น้ำในต้นระเหยออกไปเป็นไอได้มาก</text>
<text x="30.0" y="216.0" font-size="20" text-anchor="start" fill="#111" font-weight="normal">หนามช่วยลดการคายน้ำ พืชจึงเก็บน้ำไว้ได้นานในหน้าแล้ง</text>
</svg>
