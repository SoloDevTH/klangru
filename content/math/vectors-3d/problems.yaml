  - id: math.calculus.vectors-3d.p018
    topics: [math.calculus.vectors-3d]
    difficulty: 5
    type: numeric
    stem: "เส้นตรง $\\langle x, y, z \\rangle = \\langle 1, 0, 2 \\rangle + t\\langle 1, 2, -1 \\rangle$ ตัดระนาบ $x + y + z = 9$ ที่จุดใด ตอบพิกัด $y$ ของจุดตัด"
    answer: { value: 6 }
    hints:
      - "แทน $x = 1 + t$, $y = 2t$, $z = 2 - t$ ลงในสมการระนาบ"
      - "ได้สมการของ $t$ แก้หา $t$ แล้วแทนกลับหา $y$"
    misconceptions:
      - { match: 3, feedback: "3 คือค่า $t$ ต้องแทนกลับใน $y = 2t$" }
    solution: "$(1 + t) + 2t + (2 - t) = 9$ ได้ $3 + 2t = 9$, $t = 3$ จุดตัดคือ $(4, 6, -1)$ ตรวจ: $4 + 6 - 1 = 9$ พิกัด $y = 6$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.calculus.vectors-3d.p019
    topics: [math.calculus.vectors-3d]
    difficulty: 5
    type: order
    stem: "เรียงขั้นตอนการหาสมการระนาบที่ผ่านสามจุด $P, Q, R$ ที่ไม่อยู่บนเส้นตรงเดียวกัน"
    items:
      - "หาเวกเตอร์ $\\overrightarrow{PQ}$ และ $\\overrightarrow{PR}$"
      - "หาเวกเตอร์แนวฉาก $\\mathbf{n} = \\overrightarrow{PQ} \\times \\overrightarrow{PR}$"
      - "แทน $\\mathbf{n} = \\langle a, b, c \\rangle$ และพิกัด $P$ ใน $a(x - x_0) + b(y - y_0) + c(z - z_0) = 0$"
      - "จัดรูปเป็น $ax + by + cz = d$"
      - "ตรวจโดยแทนพิกัด $Q$ และ $R$ ว่าสอดคล้องกับสมการ"
    hints:
      - "เวกเตอร์แนวฉากต้องตั้งฉากกับเวกเตอร์สองตัวที่อยู่ในระนาบ"
      - "ใช้จุดใดจุดหนึ่งในสามจุดเป็น $(x_0, y_0, z_0)$ แล้วตรวจกับอีกสองจุด"
    solution: "สร้างเวกเตอร์สองตัวบนระนาบ → ผลคูณไขว้ได้ $\\mathbf{n}$ → แทนในสมการจุด–แนวฉาก → จัดรูป → ตรวจด้วยอีกสองจุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.calculus.vectors-3d.p020
    topics: [math.calculus.vectors-3d]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "ให้ $\\mathbf{u}, \\mathbf{v}$ เป็นเวกเตอร์ในสามมิติใด ๆ ข้อใดจริงเสมอ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "$\\mathbf{u} \\times \\mathbf{v} = -(\\mathbf{v} \\times \\mathbf{u})$", correct: true }
      - { id: b, text: "$\\mathbf{u} \\cdot \\mathbf{v} = \\mathbf{v} \\cdot \\mathbf{u}$", correct: true }
      - { id: c, text: "$(\\mathbf{u} \\times \\mathbf{v}) \\cdot \\mathbf{u} = 0$", correct: true }
      - { id: d, text: "$\\mathbf{u} \\times \\mathbf{v} = \\mathbf{v} \\times \\mathbf{u}$", feedback: "ผลคูณไขว้ไม่สลับที่ การสลับลำดับทำให้ทิศกลับ" }
      - { id: e, text: "$|\\mathbf{u} \\times \\mathbf{v}| = |\\mathbf{u}||\\mathbf{v}|$", feedback: "ขาด $\\sin\\theta$ จริงเฉพาะเมื่อ u ตั้งฉากกับ v" }
    hints:
      - "ผลคูณจุดสลับที่ได้ ผลคูณไขว้สลับแล้วเปลี่ยนเครื่องหมาย"
      - "$\\mathbf{u} \\times \\mathbf{v}$ ตั้งฉากกับ $\\mathbf{u}$ เสมอ"
    solution: "ข้อ a, b, c จริงเสมอ ข้อ d ผิดเพราะ $\\mathbf{v} \\times \\mathbf{u} = -(\\mathbf{u} \\times \\mathbf{v})$ ข้อ e ผิดเพราะ $|\\mathbf{u} \\times \\mathbf{v}| = |\\mathbf{u}||\\mathbf{v}|\\sin\\theta$"
    license: CC-BY-SA-4.0
    ai_assisted: true
