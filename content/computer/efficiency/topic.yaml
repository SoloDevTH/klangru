id: computer.algorithms.efficiency
subject: computer
title: { th: ประสิทธิภาพและความถูกต้องของอัลกอริทึม, en: "Algorithm efficiency and correctness" }
summary: นับขั้นเป็นฟังก์ชันของขนาดข้อมูล นิยามบิ๊กโอด้วย c และ n0 พิสูจน์ความถูกต้องด้วยค่าคงตัวของวงวน ปรับอัลกอริทึมคลาสสิกกับปัญหาใหม่ และประเมินด้านประสิทธิภาพ ความถูกต้อง และความชัดเจน
difficulty: 5.5
minutes: 50
prerequisites: [computer.algorithms.searching-sorting]
encompasses:
  - { id: computer.algorithms.searching-sorting, weight: 0.4 }
  - { id: computer.programming.lists-strings, weight: 0.2 }
  - { id: computer.programming.design-debug, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: big-o-bound.svg
    alt: "กราฟจำนวนขั้นเทียบกับขนาดข้อมูล n ตั้งแต่ 0 ถึง 12 เส้นสีแดง f(n) = 3n + 5 เริ่มที่ 5 เส้นสีน้ำเงิน 4n เริ่มที่ 0 สองเส้นตัดกันที่จุด (5, 20) เส้นประลงมาที่ n0 = 5 พื้นที่ตั้งแต่ n = 5 ไปทางขวาเป็นสีเขียว เขียนว่า ช่วง n ≥ n0 เส้น 4n อยู่เหนือหรือเท่ากับ 3n + 5 เสมอ"
    caption: "เมื่อ n ≥ 5 เส้น 4n อยู่เหนือ 3n + 5 เสมอ 3n + 5 จึงเป็น O(n)"
  - type: interactive
    title: ลองหาค่า c ที่ทำให้ c·n อยู่เหนือ 3n + 5
    caption: "เลื่อน c แล้วดูว่าเส้นตรง c·n ตัดกับ 3n + 5 ที่ใด ถ้า c ≤ 3 เส้นทั้งสองไม่ตัดกันในช่วง n ที่เป็นบวก ถ้า c มากขึ้น n0 ยิ่งเล็กลง"
    widget:
      kind: function-plot
      functions: ["3x+5", "c x"]
      sliders:
        - { name: c, min: 1, max: 8, step: 0.5, value: 4, label: ค่าคงที่ c }
      x: [0, 12]
      y: [0, 60]
  - type: worked-example
    title: หา c และ n0 แล้วสรุปบิ๊กโอ
    problem: "โปรแกรมหนึ่งใช้ T(n) = 4n² + 10n + 6 ขั้น ให้แสดงว่าเป็น O(n²) โดยหาค่า c และ n0"
    steps:
      - text: "เป้าหมาย: หา c และ n0 ที่ทำให้ 4n² + 10n + 6 ≤ c·n² ทุก n ≥ n0"
      - text: "เมื่อ n ≥ 1 จะได้ 10n ≤ 10n² และ 6 ≤ 6n²"
        why: "คูณ n ที่มากกว่าหรือเท่ากับ 1 เข้าไปทำให้ค่าไม่ลดลง จึงแทนพจน์เล็กด้วยพจน์ n² ได้"
      - text: "รวมได้ 4n² + 10n + 6 ≤ 4n² + 10n² + 6n² = 20n²"
      - text: "จึงเลือก c = 20 และ n0 = 1 ได้ตามนิยาม T(n) เป็น O(n²)"
        why: "นิยามต้องการแค่ c และ n0 คู่หนึ่งที่ใช้ได้ ไม่จำเป็นต้องเป็นค่าที่เล็กที่สุด"
      - text: "ตรวจตัวอย่าง: n = 10 ได้ T(10) = 400 + 100 + 6 = 506 ≤ 20 × 100 = 2,000 จริง"
    answer: "เลือก c = 20 และ n0 = 1 แล้ว 4n² + 10n + 6 ≤ 20n² ทุก n ≥ 1 จึงเป็น O(n²)"
  - { type: check, problem: computer.algorithms.efficiency.p004, prompt: "ลองหา n0 ที่เล็กที่สุดเมื่อ c = 4" }
  - type: figure
    src: invariant-max.svg
    alt: "ลิสต์ 31, 27, 35, 29, 40, 33 ดัชนี 0 ถึง 5 ขณะ i = 3 ช่องดัชนี 0 ถึง 2 (31, 27, 35) เป็นสีเขียว เขียนว่าตรวจแล้ว best = 35 ช่องดัชนี 3 ถึง 5 (29, 40, 33) เป็นสีเทา เขียนว่ายังไม่ตรวจ ลูกศรชี้ที่ดัชนี 3 เขียนว่า i = 3 กำลังจะตรวจ หัวภาพเขียนว่า ค่าคงตัวของวงวน ก่อนตรวจ a[i] ทุกรอบ best คือค่ามากที่สุดของ a[0] ถึง a[i−1] ข้อความล่างบอกว่าตรวจ 29 แล้ว best ยังเป็น 35 ค่าคงตัวยังจริงสำหรับ a[0] ถึง a[3]"
    caption: "ค่าคงตัวบอกความจริงของส่วนที่ตรวจแล้ว ทุกครั้งก่อนเริ่มรอบใหม่"
  - type: worked-example
    title: ปรับทวิภาคหาวันแรกที่ยอดสะสมถึงเป้า
    problem: "ชมรมออมเงินบันทึกยอดเงินสะสมรายวัน (เพิ่มขึ้นหรือเท่าเดิมทุกวัน) 365 วันในลิสต์ total ต้องการหาวันแรกที่ยอดสะสมถึง 5,000 บาท ให้เลือกอัลกอริทึม ประเมินจำนวนรอบ และบอกเหตุผลที่ถูกต้อง"
    steps:
      - text: "สังเกตว่าลิสต์เรียงจากน้อยไปมากอยู่แล้ว เพราะยอดสะสมไม่เคยลดลง"
        why: "ทวิภาคใช้ได้เฉพาะข้อมูลที่เรียงแล้ว จึงต้องตรวจเงื่อนไขนี้ก่อน"
      - text: "ปัญหาคือหาดัชนีแรกที่ total[d] ≥ 5000 ซึ่งตรงกับฟังก์ชัน first_at_least(total, 5000) ในบทเรียน"
      - text: "จำนวนรอบ: ช่วงหดครึ่งหนึ่งทุกรอบ 365 → ... → 1 ใช้ไม่เกินราว ⌈log₂ 366⌉ = 9 รอบ เทียบกับไล่ทีละวันได้ถึง 365 รอบ"
      - text: "ความถูกต้อง: ค่าคงตัวคือวันก่อนดัชนี low ยอดยังไม่ถึง 5,000 และตั้งแต่ดัชนี high ยอดถึงแล้ว เมื่อ low = high จึงเป็นวันแรกพอดี"
      - text: "ถ้าคืนค่า 365 (เท่ากับ len(total)) แปลว่าทั้งปียอดไม่ถึงเป้า ต้องเขียนกรณีนี้ให้ผู้ใช้เข้าใจ"
        why: "กรณีขอบที่ไม่มีคำตอบเป็นจุดที่โปรแกรมดัดแปลงผิดบ่อยที่สุด"
    answer: "ใช้ first_at_least(total, 5000) ซึ่งดัดแปลงจากทวิภาค ใช้ไม่เกินราว 9 รอบ ถูกต้องตามค่าคงตัว และต้องจัดการกรณีคืนค่า 365 ซึ่งหมายถึงไม่ถึงเป้า"
  - { type: check, problem: computer.algorithms.efficiency.p007, prompt: "เลือกค่าคงตัวที่ใช้พิสูจน์ find_max ได้" }
glossary:
  - { term: สัญกรณ์บิ๊กโอ (Big-O notation), definition: "f(n) เป็น O(g(n)) เมื่อมีค่าคงที่บวก c และ n0 ที่ทำให้ f(n) ≤ c·g(n) ทุก n ≥ n0 ใช้บอกขอบบนของอัตราการโต" }
  - { term: กรณีแย่ที่สุด (worst case), definition: "ข้อมูลขนาด n แบบที่ทำให้อัลกอริทึมใช้ขั้นมากที่สุด" }
  - { term: ค่าคงตัวของวงวน (loop invariant), definition: "ข้อความที่จริงทุกครั้งก่อนเริ่มรอบของวงวน ใช้พิสูจน์ว่าวงวนให้ผลถูกต้อง" }
  - { term: เริ่มต้น คงอยู่ จบ, definition: "สามขั้นของการพิสูจน์ด้วยค่าคงตัว: จริงก่อนรอบแรก ถ้าจริงก่อนรอบใดก็จริงก่อนรอบถัดไป และเมื่อวงวนจบได้ผลที่ต้องการ" }
  - { term: ความซับซ้อนด้านหน่วยความจำ (space complexity), definition: "อัตราการโตของหน่วยความจำที่อัลกอริทึมใช้เพิ่มเมื่อข้อมูลใหญ่ขึ้น" }
flashcards:
  - { front: "นิยาม f(n) เป็น O(g(n))", back: "มี c > 0 และ n0 ที่ f(n) ≤ c·g(n) ทุก n ≥ n0" }
  - { front: "3n + 5 ≤ 4n ตั้งแต่ n เท่าใด", back: "n ≥ 5 จึงใช้ c = 4, n0 = 5" }
  - { front: "วงวนซ้อน n × n แล้วตามด้วยวงวน n รอบ เป็นบิ๊กโอเท่าใด", back: "n² + n จึงเป็น O(n²)" }
  - { front: "พิสูจน์ด้วยค่าคงตัวของวงวนมีกี่ขั้น อะไรบ้าง", back: "3 ขั้น: เริ่มต้น คงอยู่ จบ (และต้องแสดงว่าวงวนจบได้)" }
  - { front: "ทำไมการทดสอบอย่างเดียวพิสูจน์ความถูกต้องไม่ได้", back: "ทดสอบข้อมูลทุกแบบไม่ไหว การทดสอบแสดงได้ว่ามีบั๊ก แต่แสดงไม่ได้ว่าไม่มี" }
