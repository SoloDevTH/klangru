# ผลการเรียนรู้รายวิชาเพิ่มเติม สาระฟิสิกส์ (ฉบับปรับปรุง พ.ศ. 2560) ระดับ ม.4–6
#
# การจัดโครงสร้าง (ต้นฉบับไม่มีระดับ สาระ→มาตรฐาน→ตัวชี้วัด แบบหลักสูตรแกนกลาง จึงจับคู่ดังนี้)
#   strand    = สาระฟิสิกส์ ทั้งสาระ (หนึ่งไฟล์ต่อหนึ่งรายวิชาเพิ่มเติม)
#   standard  = ข้อ ๑, ๒, ... ของสาระ (ข้อความ "เข้าใจ..." ที่ขึ้นต้นตารางผลการเรียนรู้แต่ละตาราง) ทำหน้าที่จัดกลุ่มเนื้อหา
#   indicator = ผลการเรียนรู้แต่ละข้อ level = ชั้นที่ต้นฉบับระบุในคอลัมน์ "ชั้น" (ม.4, ม.5, ม.6)
#
# รหัส: ต้นฉบับไม่มีรหัสทางการ ต้นฉบับนับเลขผลการเรียนรู้ใหม่ตั้งแต่ ๑ ในแต่ละชั้นของแต่ละข้อ
#   รหัสในไฟล์นี้ ("ฟิสิกส์ <ข้อ> ม.<ชั้น>/<ลำดับ>" เช่น "ฟิสิกส์ 1 ม.4/1") เป็นรหัสที่คลังรู้ตั้งเอง ตามเลขข้อ ชั้น และลำดับในต้นฉบับ
#   ข้อความผลการเรียนรู้และข้อความมาตรฐานคัดจากต้นฉบับทุกตัวอักษร (เลขไทยในข้อความคงไว้ตามต้นฉบับ)
#
# วิธีคัด: ข้อความอยู่ในชั้นข้อความของ PDF (ไม่ใช่ภาพสแกน) แยกคอลัมน์ผลการเรียนรู้ด้วย pdftotext ตามพิกัด
#   และกำหนดช่องว่างตามอักขระช่องว่างที่มีจริงใน PDF (อ่านด้วย pypdf) จึงมีช่องว่างบางจุดที่ผู้จัดหน้าใส่ไว้ท้ายบรรทัด
#   ทำให้บางคำดูเหมือนถูกเว้นวรรคกลางวลี และบางจุดที่ขึ้นบรรทัดใหม่โดยไม่มีอักขระช่องว่างจะติดกัน คงไว้ตามต้นฉบับ
#   ข้อความมาตรฐานจัดชิดขอบสองข้าง PDF ไม่มีอักขระช่องว่าง จึงกำหนดช่องว่างจากระยะห่างระหว่างคำ
#   โดยเทียบหัวตารางกับหน้า "สาระวิทยาศาสตร์เพิ่มเติม" (หน้า 129-131) จุดที่ตัดบรรทัดตรงกันทั้งสองแห่งตัดสินจากวลี
#   และจากไฟล์ Word ของ สสวท. (PhysicsLO_Group_1-4.docx)
# หมายเหตุมาตรฐาน: หน้า 130 ของต้นฉบับเขียน "ฮาร์มอนิกส์อย่างง่าย" (ข้อ 2) และ "อาร์คิมีดีส" (ข้อ 4)
#   ส่วนหัวตารางผลการเรียนรู้ (หน้า 198 และ 213) เขียน "ฮาร์มอนิกอย่างง่าย" และ "อาร์คิมีดิส" ไฟล์นี้ใช้ข้อความหัวตาราง
# ตรวจทาน: ผลการเรียนรู้ฟิสิกส์ 61 จาก 67 ข้อตรงกับไฟล์ Word ของ สสวท. ทุกตัวอักษรเมื่อไม่นับช่องว่าง
#   อีก 6 ข้อ ไฟล์ Word (ปี 2562) ใช้ถ้อยคำต่างไป ไฟล์นี้ใช้ถ้อยคำในหนังสือ สพฐ. และบันทึกถ้อยคำของ สสวท. ไว้ใน note

