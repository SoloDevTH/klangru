    answer: { value: 15, unit: m }
    hints:
      - "ความยาวรอบรูป $46$ คือ $2 \\times$ (กว้าง $+$ ยาว) ดังนั้นกว้าง $+$ ยาว $= 23$"
      - "ให้ด้านกว้างยาว $x$ ด้านยาวจึงเป็น $23 - x$ ตั้งสมการ $x(23 - x) = 120$"
      - "จัดรูปเป็น $x^2 - 23x + 120 = 0$ แล้วแยกตัวประกอบ"
    misconceptions:
      - { match: 8, feedback: "นั่นคือด้านกว้าง โจทย์ถามด้านยาว ซึ่งคือคำตอบอีกตัวของสมการ" }
      - { match: 43.22, feedback: "ดูเหมือนใช้ $x(46 - x) = 120$ แต่ $46$ เป็นความยาวรอบรูปทั้งหมด กว้างบวกยาวเท่ากับครึ่งหนึ่ง คือ $23$" }
    solution: "กว้าง $+$ ยาว $= 23$ ให้กว้าง $x$: $x(23 - x) = 120$ → $x^2 - 23x + 120 = 0$ → $(x - 8)(x - 15) = 0$ ได้ $x = 8$ หรือ $15$ ด้านจึงยาว $8$ และ $15\\ \\mathrm{m}$ ด้านยาวคือ $15\\ \\mathrm{m}$ ตรวจ: $2(8 + 15) = 46$ และ $8 \\times 15 = 120$ ✓"
