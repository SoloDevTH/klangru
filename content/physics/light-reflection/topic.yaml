id: physics.light.reflection
subject: physics
title: { th: การสะท้อนของแสง, en: Reflection of light }
summary: กฎการสะท้อน ภาพในกระจกเงาราบ จำนวนภาพจากกระจกสองบาน และภาพจากกระจกเว้ากับกระจกนูนด้วยสูตรกระจก
difficulty: 4
minutes: 35
prerequisites: [math.geometry.angles]
encompasses:
  - { id: math.geometry.angles, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: law-of-reflection.svg
    alt: "กระจกเงาราบวางแนวนอน มีเส้นปกติเป็นเส้นประตั้งฉากกับกระจก ณ จุดตกกระทบ รังสีตกกระทบมาจากด้านซ้ายบนทำมุม θi กับเส้นปกติ รังสีสะท้อนออกไปทางขวาบนทำมุม θr กับเส้นปกติ มุมทั้งสองเท่ากัน (40° ในภาพ) และรังสีทั้งสองอยู่คนละข้างของเส้นปกติ"
    caption: "วัดมุมจากเส้นปกติเสมอ $\\theta_i = \\theta_r$"
  - { type: explanation, file: lesson.md }
  - type: worked-example
    title: มุมที่วัดจากผิวกระจก
    problem: "แสงเลเซอร์ตกกระทบกระจกเงาราบโดยทำมุม $35^\\circ$ กับผิวกระจก จงหามุมตกกระทบ มุมสะท้อน และมุมระหว่างรังสีตกกระทบกับรังสีสะท้อน"
    steps:
      - text: "เส้นปกติตั้งฉากกับผิว มุมตกกระทบ $\\theta_i = 90^\\circ - 35^\\circ = 55^\\circ$"
        why: "กฎการสะท้อนใช้มุมที่วัดจากเส้นปกติ ไม่ใช่จากผิว"
      - text: "กฎการสะท้อน: $\\theta_r = \\theta_i = 55^\\circ$"
      - text: "รังสีทั้งสองอยู่คนละข้างของเส้นปกติ มุมระหว่างกันจึงเป็น $55^\\circ + 55^\\circ = 110^\\circ$"
    answer: "มุมตกกระทบ $55^\\circ$ มุมสะท้อน $55^\\circ$ และรังสีทั้งสองทำมุมกัน $110^\\circ$"
  - { type: check, problem: phy.refl.p002, prompt: "ระวังว่ามุมวัดจากอะไร" }
  - type: worked-example
    title: วาดรังสีแล้วคำนวณภาพจากกระจกเว้า
    problem: "วางวัตถุสูง $5\\ \\mathrm{cm}$ ห่างกระจกเว้าความยาวโฟกัส $10\\ \\mathrm{cm}$ เป็นระยะ $30\\ \\mathrm{cm}$ จงบอกตำแหน่ง ชนิด และขนาดของภาพ"
    figure:
      src: concave-ray-diagram.svg
      alt: "แผนภาพรังสีของกระจกเว้า วัตถุตั้งอยู่บนแกนไกลกว่าจุด C รังสีที่ 1 ขนานแกนไปกระทบกระจกแล้วสะท้อนผ่าน F รังสีที่ 2 ผ่าน F ไปกระทบกระจกแล้วสะท้อนขนานแกน รังสีที่ 3 ผ่าน C ไปตกตั้งฉากกับกระจกแล้วสะท้อนกลับทางเดิม รังสีสะท้อนทั้งสามตัดกันที่จุดเดียวใต้แกนระหว่าง F กับ C เกิดภาพจริงหัวกลับขนาดเล็กกว่าวัตถุ"
    steps:
      - text: "วาดรังสีอย่างน้อยสองเส้นจากปลายวัตถุ (ภาพประกอบ) รังสีสะท้อนตัดกันจริงหน้ากระจก ระหว่าง $F$ กับ $C$ ใต้แกน จึงคาดว่าเป็นภาพจริง หัวกลับ เล็กกว่าวัตถุ"
        why: "แผนภาพช่วยตรวจคำตอบจากสูตร ถ้าเครื่องหมายหรือขนาดที่คำนวณได้ขัดกับภาพที่วาด แปลว่าคำนวณผิด"
      - text: "สูตรกระจก: $\\dfrac{1}{s'} = \\dfrac{1}{10} - \\dfrac{1}{30} = \\dfrac{3 - 1}{30} = \\dfrac{1}{15}$ ได้ $s' = +15\\ \\mathrm{cm}$"
      - text: "$s'$ เป็นบวก จึงเป็นภาพจริงหน้ากระจก ห่าง $15\\ \\mathrm{cm}$ ซึ่งอยู่ระหว่าง $F$ ($10\\ \\mathrm{cm}$) กับ $C$ ($20\\ \\mathrm{cm}$) ตรงกับแผนภาพ"
      - text: "กำลังขยาย $m = \\dfrac{|s'|}{s} = \\dfrac{15}{30} = 0.5$ ภาพสูง $0.5 \\times 5 = 2.5\\ \\mathrm{cm}$"
    answer: "ภาพจริง หัวกลับ ห่างกระจก $15\\ \\mathrm{cm}$ สูง $2.5\\ \\mathrm{cm}$"
  - type: figure
    src: convex-ray-diagram.svg
    alt: "แผนภาพรังสีของกระจกนูน วัตถุอยู่หน้ากระจก จุด F และ C อยู่หลังกระจก รังสีขนานแกนสะท้อนออกไปเหมือนมาจาก F รังสีที่เล็งไปยัง F สะท้อนขนานแกน และรังสีที่เล็งไปยัง C สะท้อนกลับทางเดิม แนวต่อของรังสีสะท้อนเป็นเส้นประหลังกระจกและตัดกันที่จุดระหว่างกระจกกับ F เกิดภาพเสมือนหัวตั้งขนาดเล็กกว่าวัตถุ (วัตถุห่าง 30 cm กระจก f = −15 cm ภาพอยู่หลังกระจก 10 cm สูงหนึ่งในสามของวัตถุ)"
    caption: "กระจกนูน: รังสีสะท้อนกระจายออกเสมอ ภาพจึงเป็นภาพเสมือน หัวตั้ง ขนาดเล็ก อยู่หลังกระจกระหว่างกระจกกับ $F$"
  - { type: check, problem: phy.refl.p005, prompt: "ดูแผนภาพกระจกนูนแล้วลองตอบ" }
  - type: interactive
    title: ระยะภาพของกระจกโค้ง
    caption: แกนนอนคือระยะวัตถุ s (cm) แกนตั้งคือระยะภาพ s' จากสูตรกระจก ค่า f บวกคือกระจกเว้า ค่าลบคือกระจกนูน สังเกตว่ากระจกเว้าให้ s' เป็นลบ (ภาพเสมือน) เมื่อวัตถุอยู่ใกล้กว่า f และกราฟพุ่งขึ้นเมื่อวัตถุอยู่ที่จุดโฟกัสพอดี ส่วนกระจกนูนให้ s' เป็นลบเสมอ
    widget:
      kind: function-plot
      functions: ["\\frac{f x}{x-f}"]
      sliders:
        - { name: f, min: -20, max: 19, step: 3, value: 10, label: ความยาวโฟกัส (cm) }
      x: [0, 60]
      y: [-60, 60]
  - type: simulation
    title: "ภาพจากเลนส์และกระจก (PhET Geometric Optics: Basics)"
    url: https://phet.colorado.edu/en/simulations/geometric-optics-basics
    provider: phet
    note: เลือกหน้าจอกระจก (Mirror) ลากวัตถุเข้าใกล้และออกห่างกระจกเว้า สังเกตว่าภาพเปลี่ยนจากภาพจริงหัวกลับเป็นภาพเสมือนหัวตั้งเมื่อวัตถุผ่านจุดโฟกัส แล้วเปลี่ยนเป็นกระจกนูนเพื่อเปรียบเทียบ
glossary:
  - { term: เส้นปกติ, definition: "เส้นที่ตั้งฉากกับผิวกระจก ณ จุดที่แสงตกกระทบ ใช้เป็นแนวอ้างอิงในการวัดมุมตกกระทบและมุมสะท้อน" }
  - { term: ภาพจริง, definition: "ภาพที่เกิดจากแสงไปตัดกันจริง ฉายบนฉากได้ ภาพจากกระจกเป็นภาพหัวกลับและอยู่หน้ากระจก" }
  - { term: ภาพเสมือน, definition: "ภาพที่เกิดจากแนวต่อของรังสีแสง ฉายบนฉากไม่ได้ ภาพจากกระจกเป็นภาพหัวตั้งและอยู่หลังกระจก" }
  - { term: จุดโฟกัส, definition: "จุดที่รังสีขนานกับแกนมุขสำคัญสะท้อนไปรวมกัน (กระจกเว้า) หรือดูเหมือนกระจายออกมา (กระจกนูน) อยู่ห่างกระจก $f = \\tfrac{R}{2}$" }
flashcards:
  - { front: "กฎการสะท้อนของแสง", back: "มุมตกกระทบเท่ากับมุมสะท้อน วัดจากเส้นปกติ และรังสีทั้งสองกับเส้นปกติอยู่บนระนาบเดียวกัน" }
  - { front: "ลักษณะภาพในกระจกเงาราบ", back: "ภาพเสมือน หัวตั้ง ขนาดเท่าวัตถุ อยู่หลังกระจกเท่ากับระยะวัตถุ กลับซ้ายเป็นขวา" }
  - { front: "จำนวนภาพจากกระจกเงาราบสองบานทำมุม $\\theta$", back: "$N = \\dfrac{360^\\circ}{\\theta} - 1$ เช่น $90^\\circ$ ได้ 3 ภาพ $60^\\circ$ ได้ 5 ภาพ" }
  - { front: "สูตรกระจกและความหมายของเครื่องหมาย", back: "$\\dfrac{1}{f} = \\dfrac{1}{s} + \\dfrac{1}{s'}$ กระจกเว้า $f > 0$ กระจกนูน $f < 0$ · $s' > 0$ ภาพจริง $s' < 0$ ภาพเสมือน" }
  - { front: "ทำไมกระจกตามทางแยกใช้กระจกนูน", back: "กระจกนูนให้ภาพเสมือน หัวตั้ง ขนาดเล็ก จึงเห็นบริเวณกว้างกว่ากระจกเงาราบขนาดเท่ากัน" }
