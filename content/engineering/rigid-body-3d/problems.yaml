problems:
- id: engineering.mechanics.rigid-body-3d.p001
  topics:
  - engineering.mechanics.rigid-body-3d
  difficulty: 1
  type: mcq
  stem: วัตถุแข็งเกร็งหมุนรอบแกนที่ผ่านศูนย์กลางมวล เมื่อใดโมเมนตัมเชิงมุม $\vec H$ จะขนานกับ $\vec\omega$
  choices:
  - id: a
    text: เมื่อแกนหมุนเป็นแกนหลักของความเฉื่อย
    correct: true
  - id: b
    text: ทุกครั้ง เพราะ $H = I\omega$
    feedback: $H = I\omega$ แบบสเกลาร์ใช้ได้เฉพาะแกนหลัก ในสามมิติ $\vec H = \mathbf{I}\vec\omega$ เป็นเมทริกซ์คูณเวกเตอร์
  - id: c
    text: เมื่อวัตถุมีมวลมาก
    feedback: มวลมีผลต่อขนาดของ $H$ ไม่ใช่ทิศ
  - id: d
    text: เมื่อหมุนช้า
    feedback: ทิศของ $\vec H$ เทียบกับ $\vec\omega$ ไม่ขึ้นกับความเร็ว ขนาดของ $\omega$ คูณทุกส่วนเท่ากัน
  hints:
  - $\vec H = \mathbf{I}\vec\omega$ เมื่อใด $\mathbf{I}\vec\omega$ ขนานกับ $\vec\omega$
  - นิยามของเวกเตอร์เฉพาะ
  solution: $\mathbf{I}\vec\omega = \lambda\vec\omega$ ก็ต่อเมื่อ $\vec\omega$ เป็นเวกเตอร์เฉพาะของเทนเซอร์ความเฉื่อย คือหมุนรอบแกนหลัก เช่น ล้อที่ถ่วงสมดุลแล้วหมุนรอบเพลา
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: engineering.mechanics.rigid-body-3d.p002
  topics:
  - engineering.mechanics.rigid-body-3d
  difficulty: 1
  type: match
  stem: จับคู่ปริมาณกับนิยาม
  pairs:
  - left: โมเมนต์ความเฉื่อย $I_{xx}$
    right: $\int (y^2 + z^2)\,dm$
  - left: ผลคูณความเฉื่อย $I_{xy}$
    right: $\int xy\,dm$
  - left: โมเมนต์ความเฉื่อยหลัก
    right: ค่าเฉพาะของเทนเซอร์ความเฉื่อย
  - left: แกนหลักของความเฉื่อย
    right: เวกเตอร์เฉพาะของเทนเซอร์ความเฉื่อย
  hints:
  - $I_{xx}$ ใช้ระยะตั้งฉากจากแกน $x$ ยกกำลังสอง
  - ผลคูณความเฉื่อยเป็นศูนย์เมื่อวัตถุสมมาตร
  solution: $I_{xx}$ ใช้ระยะจากแกน $x$ ยกกำลังสอง ($y^2 + z^2$) ผลคูณความเฉื่อยวัดความไม่สมมาตร ค่าเฉพาะและเวกเตอร์เฉพาะของเทนเซอร์คือโมเมนต์ความเฉื่อยหลักและทิศของแกนหลัก
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: engineering.mechanics.rigid-body-3d.p003
  topics:
  - engineering.mechanics.rigid-body-3d
  difficulty: 2
  type: numeric
  stem: มวลจุด $2\ \mathrm{kg}$ อยู่ที่ $(0.3, 0.4, 0)\ \mathrm{m}$ จงหา $I_{xx}$ รอบจุดกำเนิด ($\mathrm{kg\cdot m^2}$)
  answer:
    value: 0.32
    tolerance: 0.01
    unit: kg·m²
  misconceptions:
  - match: 0.5
    feedback: นั่นคือ $I_{zz} = m(x^2 + y^2)$
  - match: 0.18
    feedback: ใช้ $mx^2$ ระยะจากแกน $x$ ไม่ใช่พิกัด $x$
  hints:
  - $I_{xx} = m(y^2 + z^2)$
  - ระยะตั้งฉากจากแกน $x$ ไม่รวมพิกัด $x$
  solution: $I_{xx} = 2(0.4^2 + 0^2) = 0.32\ \mathrm{kg\cdot m^2}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: engineering.mechanics.rigid-body-3d.p004
  topics:
  - engineering.mechanics.rigid-body-3d
  difficulty: 2
  type: numeric
  stem: มวลจุดเดียวกัน ($2\ \mathrm{kg}$ ที่ $(0.3, 0.4, 0)$) สมาชิกแถว $x$ หลัก $y$ ของเทนเซอร์ความเฉื่อย $\mathbf{I}$ มีค่าเท่าใด ($\mathrm{kg\cdot m^2}$ ตอบพร้อมเครื่องหมาย)
  answer:
    value: -0.24
    tolerance: 0.005
    unit: kg·m²
  misconceptions:
  - match: 0.24
    feedback: ลืมเครื่องหมายลบของสมาชิกนอกแนวทแยง
  - match: 0.0
    feedback: มวลไม่อยู่บนแกนใดแกนหนึ่ง ผลคูณความเฉื่อยจึงไม่เป็นศูนย์
  hints:
  - ผลคูณความเฉื่อย $I_{xy} = \int xy\,dm = mxy$
  - สมาชิกนอกแนวทแยงของเทนเซอร์เป็น $-I_{xy}$
  solution: $I_{xy} = 2(0.3)(0.4) = 0.24$ สมาชิกในเทนเซอร์ $= -I_{xy} = -0.24\ \mathrm{kg\cdot m^2}$ (ตำราบางเล่มนิยามผลคูณความเฉื่อยรวมเครื่องหมายลบไว้แล้ว ต้องดูนิยามที่ใช้)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: engineering.mechanics.rigid-body-3d.p005
  topics:
  - engineering.mechanics.rigid-body-3d
  difficulty: 2
  type: numeric
  stem: วัตถุมีเทนเซอร์ความเฉื่อยรอบศูนย์กลางมวล $\mathbf{I} = \mathrm{diag}(2, 3, 5)\ \mathrm{kg\cdot m^2}$ หมุนด้วย $\vec\omega = (1, 2, 0)\ \mathrm{rad/s}$ จงหา $H_y$ ($\mathrm{kg\cdot m^2/s}$)
  answer:
    value: 6.0
    unit: kg·m²/s
  misconceptions:
  - match: 4.0
    feedback: ใช้ $I_{xx}$ คูณ $\omega_y$
  - match: 10.0
    feedback: ใช้ $I_{zz}$ คูณ $\omega_y$
  hints:
  - แกนพิกัดเป็นแกนหลัก $\vec H = (I_1\omega_x, I_2\omega_y, I_3\omega_z)$
  - $H_y = I_{yy}\omega_y$
  solution: $\vec H = (2 \times 1, 3 \times 2, 0) = (2, 6, 0)$ ได้ $H_y = 6\ \mathrm{kg\cdot m^2/s}$ สังเกตว่า $\vec H$ ไม่ขนานกับ $\vec\omega = (1, 2, 0)$ เพราะ $6/2 \ne 2/1$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: engineering.mechanics.rigid-body-3d.p006
  topics:
  - engineering.mechanics.rigid-body-3d
  difficulty: 2
  type: mcq
  stem: ใบพัดของเครื่องสีข้าวมีมวลเยื้องศูนย์สองก้อนเท่ากัน อยู่คนละด้านของเพลาและคนละตำแหน่งตามแนวเพลา (ดูภาพ) เพลานี้อยู่ในสภาพใด
  choices:
  - id: a
    text: สมดุลสถิต แต่ไม่สมดุลพลวัต แบริ่งรับคู่ควบที่หมุนตามเพลา
    correct: true
  - id: b
    text: สมดุลทั้งสถิตและพลวัต เพราะมวลหักล้างกัน
    feedback: แรงหนีศูนย์หักล้างกันแต่ไม่อยู่บนแนวเดียวกัน จึงเกิดคู่ควบ
  - id: c
    text: ไม่สมดุลสถิต
    feedback: ศูนย์กลางมวลรวมอยู่บนแกน วางนิ่งไว้มุมใดเพลาก็ไม่หมุนเอง จึงสมดุลสถิต
  - id: d
    text: ไม่มีแรงกระทำต่อแบริ่งเลย
    feedback: คู่ควบ $mr\omega^2 \cdot 2a$ ต้องมีแรงปฏิกิริยาที่แบริ่งทั้งสองต้าน
  figure: &id001
    src: p-shaft.svg
    alt: เพลาวางบนแบริ่ง A และ B ห่างกัน 0.6 เมตร มีมวล 0.2 กิโลกรัมสองก้อนติดที่รัศมี 0.1 เมตร ก้อนหนึ่งชี้ขึ้น อีกก้อนชี้ลง ห่างกันตามแนวเพลา 0.3 เมตร และอยู่สมมาตรรอบกึ่งกลางเพลา เพลาหมุน 1,500 รอบต่อนาที
  hints:
  - ศูนย์กลางมวลรวมอยู่ที่ใด
  - แรงหนีศูนย์สองแรงเท่ากันแต่ไม่อยู่ในแนวเดียวกัน ได้อะไร
  solution: ศูนย์กลางมวลอยู่บนแกน (สมดุลสถิต) แต่ผลคูณความเฉื่อย $I_{xz} \ne 0$ แกนหมุนจึงไม่ใช่แกนหลัก แรงหนีศูนย์เกิดคู่ควบที่หมุนตามเพลา เครื่องสั่น ต้องถ่วงสองระนาบ (สมดุลพลวัต)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: engineering.mechanics.rigid-body-3d.p007
  topics:
  - engineering.mechanics.rigid-body-3d
  difficulty: 3
  type: numeric
  stem: ชิ้นส่วนมวล $4\ \mathrm{kg}$ มี $I_{G,xx} = 0.05\ \mathrm{kg\cdot m^2}$ ศูนย์กลางมวลอยู่ที่ $(0.1, 0.2, 0.3)\ \mathrm{m}$ จากจุด O จงหา $I_{O,xx}$ ($\mathrm{kg\cdot m^2}$)
  answer:
    value: 0.57
    tolerance: 0.01
    unit: kg·m²
  misconceptions:
  - match: 0.09
    feedback: ใช้ $x_G^2$ แทน $y_G^2 + z_G^2$
  - match: 0.61
    feedback: รวมทั้งสามพิกัด
  - match: -0.47
    feedback: ลบแทนการบวก แกนที่ไม่ผ่าน G มีโมเมนต์ความเฉื่อยมากกว่าเสมอ
  hints:
  - 'ทฤษฎีบทแกนขนานสามมิติ: $I_{O,xx} = I_{G,xx} + m(y_G^2 + z_G^2)$'
  - ใช้เฉพาะพิกัดที่ตั้งฉากกับแกน $x$
  solution: $I_{O,xx} = 0.05 + 4(0.2^2 + 0.3^2) = 0.05 + 4(0.13) = 0.57\ \mathrm{kg\cdot m^2}$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: engineering.mechanics.rigid-body-3d.p008
  topics:
  - engineering.mechanics.rigid-body-3d
  difficulty: 3
  type: numeric
  stem: แผ่นบางมวล $2\ \mathrm{kg}$ ขนาด $0.3 \times 0.2\ \mathrm{m}$ (ดูภาพ) หมุนรอบเส้นทแยงมุมด้วย $12\ \mathrm{rad/s}$ มุมระหว่าง $\vec H$ กับ $\vec\omega$ เป็นกี่องศา ($I_{xx} = mb^2/12$, $I_{yy} = ma^2/12$ รอบศูนย์กลาง)
  answer:
    value: 22.619865
    tolerance: 0.3
    unit: °
  misconceptions:
  - match: 0.0
    feedback: $\vec H$ ขนานกับ $\vec\omega$ เฉพาะแกนหลัก เส้นทแยงมุมของสี่เหลี่ยมผืนผ้าไม่ใช่แกนหลัก
  - match: 56.309932
    feedback: นั่นคือมุมของ $\vec H$ จากแกน $x$ ยังไม่ได้ลบมุมของ $\vec\omega$
  figure: &id002
    src: p-plate.svg
    alt: แผ่นบางสี่เหลี่ยมผืนผ้ากว้าง 0.3 เมตร (แนวแกน x) สูง 0.2 เมตร (แนวแกน y) ยึดกับเพลาที่วางตามเส้นทแยงมุมของแผ่น เพลารองด้วยแบริ่งสองตัวนอกแผ่น ลูกศร ω ชี้ตามเส้นทแยงมุม
  hints:
  - $\vec\omega = 12(0.3, 0.2)/\sqrt{0.13}$
  - หา $\vec H = (I_{xx}\omega_x, I_{yy}\omega_y)$ แล้วเทียบมุมของสองเวกเตอร์
  solution: $I_{xx} = 0.00667$, $I_{yy} = 0.015$ $\vec\omega = (9.985, 6.656)$ ได้ $\vec H = (0.0666, 0.0998)$ มุมของ $\vec\omega$ คือ $33.69^\circ$ มุมของ $\vec H$ คือ $56.31^\circ$ ต่างกัน $22.62^\circ$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: engineering.mechanics.rigid-body-3d.p009
  topics:
  - engineering.mechanics.rigid-body-3d
  difficulty: 3
  type: numeric
  stem: เทนเซอร์ความเฉื่อย $\mathbf{I} = \begin{bmatrix}0.3 & -0.1 & 0\\ -0.1 & 0.2 & 0\\ 0 & 0 & 0.4\end{bmatrix}\ \mathrm{kg\cdot m^2}$ และ $\vec\omega = (4, 2, 0)\ \mathrm{rad/s}$ จงหาพลังงานจลน์การหมุน $T = \tfrac12\vec\omega\cdot\mathbf{I}\vec\omega$ (J)
  answer:
    value: 2.0
    unit: J
  misconceptions:
  - match: 2.8
    feedback: ไม่คิดสมาชิกนอกแนวทแยง (ผลคูณความเฉื่อย)
  - match: 4.0
    feedback: ลืมตัวคูณ $\tfrac12$
  hints:
  - หา $\vec H = \mathbf{I}\vec\omega$ ก่อน
  - $T = \tfrac12\vec\omega\cdot\vec H$
  solution: $\vec H = (0.3 \cdot 4 - 0.1 \cdot 2,\ -0.1 \cdot 4 + 0.2 \cdot 2,\ 0) = (1.0, 0, 0)$ ได้ $T = \tfrac12(4 \times 1.0 + 2 \times 0) = 2.0\ \mathrm{J}$ (ถ้าไม่คิดผลคูณความเฉื่อยจะได้ $2.8\ \mathrm{J}$ ซึ่งผิด)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: engineering.mechanics.rigid-body-3d.p010
  topics:
  - engineering.mechanics.rigid-body-3d
  difficulty: 3
  type: order
  stem: เรียงขั้นตอนหาแกนหลักและโมเมนต์ความเฉื่อยหลักของชิ้นส่วนที่ไม่สมมาตร
  items:
  - เลือกจุดอ้างอิง (มักเป็นศูนย์กลางมวล) และแกนพิกัด
  - หา $I_{xx}, I_{yy}, I_{zz}$ และผลคูณความเฉื่อย (ใช้ทฤษฎีบทแกนขนานกับชิ้นส่วนย่อย)
  - เขียนเทนเซอร์ความเฉื่อยแบบสมมาตร โดยสมาชิกนอกแนวทแยงเป็น $-I_{xy}, -I_{yz}, -I_{zx}$
  - แก้ $\det(\mathbf{I} - \lambda\mathbf{1}) = 0$ ได้โมเมนต์ความเฉื่อยหลัก
  - แทน $\lambda$ แต่ละค่าหาเวกเตอร์เฉพาะ ซึ่งเป็นทิศของแกนหลักที่ตั้งฉากกัน
  hints:
  - ต้องมีเทนเซอร์ก่อนหาค่าเฉพาะ
  - ค่าเฉพาะได้ก่อนเวกเตอร์เฉพาะ
  solution: จุดอ้างอิงและแกน → สมาชิกของเทนเซอร์ → เขียนเทนเซอร์ → ค่าเฉพาะ (โมเมนต์ความเฉื่อยหลัก) → เวกเตอร์เฉพาะ (แกนหลัก) เทนเซอร์สมมาตรจึงได้ค่าเฉพาะจริงและแกนหลักตั้งฉากกันเสมอ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: engineering.mechanics.rigid-body-3d.p011
  topics:
  - engineering.mechanics.rigid-body-3d
  difficulty: 4
  type: numeric
  stem: จากเทนเซอร์ $\mathbf{I} = \begin{bmatrix}0.3 & -0.1 & 0\\ -0.1 & 0.2 & 0\\ 0 & 0 & 0.4\end{bmatrix}\ \mathrm{kg\cdot m^2}$ ของแขนหุ่นยนต์ในโรงงานประกอบรถยนต์ (ข้อมูลสมมติ) จงหาโมเมนต์ความเฉื่อยหลักค่าน้อยที่สุด ($\mathrm{kg\cdot m^2}$)
  answer:
    value: 0.138197
    tolerance: 0.0014
    unit: kg·m²
  misconceptions:
  - match: 0.2
    feedback: ตอบสมาชิกแนวทแยง ซึ่งไม่ใช่ค่าเฉพาะเมื่อมีผลคูณความเฉื่อย
  - match: 0.1
    feedback: ลบผลคูณความเฉื่อยออกจากสมาชิกแนวทแยงตรง ๆ
  hints:
  - แกน $z$ เป็นแกนหลักอยู่แล้ว ($0.4$) เหลือบล็อก $2 \times 2$
  - $(0.3 - \lambda)(0.2 - \lambda) - 0.01 = 0$
  solution: $\lambda^2 - 0.5\lambda + 0.05 = 0$ ได้ $\lambda = 0.25 \pm \sqrt{0.0125} = 0.3618$ หรือ $0.1382$ รวมกับ $0.4$ ค่าน้อยที่สุดคือ $0.1382\ \mathrm{kg\cdot m^2}$ (ตรวจด้วย numpy.linalg.eigh ได้ค่าเดียวกัน และผลรวม $= 0.9 =$ trace)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: engineering.mechanics.rigid-body-3d.p012
  topics:
  - engineering.mechanics.rigid-body-3d
  difficulty: 4
  type: numeric
  stem: จากเทนเซอร์ในข้อก่อน แกนหลักที่มีโมเมนต์ความเฉื่อยหลักค่ามากในระนาบ $xy$ ทำมุมเท่าใดกับแกน $x$ (องศา ตอบพร้อมเครื่องหมาย ทวนเข็มนาฬิกาเป็นบวก อยู่ในช่วง $-90^\circ$ ถึง $90^\circ$)
  answer:
    value: -31.717474
    tolerance: 0.3
    unit: °
  misconceptions:
  - match: 31.717474
    feedback: เครื่องหมายผิด สมาชิกนอกแนวทแยงเป็น $-0.1$
  - match: -63.434949
    feedback: ลืมหารมุม $2\theta$ ด้วย 2
  hints:
  - 'ใช้สูตรเดียวกับระนาบหลักของความเค้น: $\tan 2\theta = \dfrac{2(\text{สมาชิก } xy)}{I_{xx} - I_{yy}}$'
  - สมาชิก $xy$ ของเทนเซอร์คือ $-0.1$ ตรวจคำตอบด้วย $(\mathbf{I} - \lambda\mathbf{1})\vec v = 0$
