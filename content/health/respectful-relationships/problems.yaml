problems:
- id: health.family.respectful-relationships.p001
  topics:
  - health.family.respectful-relationships
  difficulty: 1
  type: mcq
  stem: ข้อใดเป็นการแสดงความเคารพในความสัมพันธ์
  choices:
  - id: a
    text: ฟังความเห็นของเพื่อนจนจบก่อนตอบ
    correct: true
  - id: b
    text: ตัดบทและบอกว่าเพื่อนคิดไม่ถูก
    feedback: การตัดบทและตัดสินทำให้อีกฝ่ายไม่รู้สึกได้รับการเคารพ
  - id: c
    text: ล้อเพื่อนเมื่อเพื่อนพูดผิด
    feedback: การล้อทำลายความเคารพในความสัมพันธ์
  - id: d
    text: เดินหนีเมื่อไม่อยากฟัง
    feedback: การหนีโดยไม่บอกเป็นการไม่เคารพอีกฝ่าย
  hints:
  - ความเคารพคือการให้เกียรติความเห็นและความรู้สึกของอีกฝ่าย
  - ลองดูว่าข้อไหนให้โอกาสอีกฝ่ายได้พูดจนจบ
  solution: การฟังความเห็นของเพื่อนจนจบก่อนตอบ แสดงว่าเราให้เกียรติความคิดของอีกฝ่าย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.respectful-relationships.p002
  topics:
  - health.family.respectful-relationships
  difficulty: 1
  type: match
  stem: จับคู่คำศัพท์กับความหมาย
  pairs:
  - left: ความเห็นอกเห็นใจ
    right: เข้าใจความรู้สึกของอีกฝ่าย
  - left: อำนาจ
    right: ความสามารถที่มีอิทธิพลต่อการตัดสินใจของคนอื่น
  - left: การบังคับ
    right: ทำให้อีกฝ่ายต้องทำโดยไม่ยินยอม
  - left: ความยินยอม
    right: การตกลงด้วยความเต็มใจและอิสระ
  hints:
  - ความเห็นอกเห็นใจคือการเข้าใจความรู้สึกของอีกฝ่าย
  - ความยินยอมต้องมาจากความเต็มใจและอิสระ
  solution: ความเห็นอกเห็นใจ = เข้าใจความรู้สึกของอีกฝ่าย, อำนาจ = ความสามารถที่มีอิทธิพลต่อการตัดสินใจของคนอื่น, การบังคับ = ทำให้อีกฝ่ายต้องทำโดยไม่ยินยอม, ความยินยอม = การตกลงด้วยความเต็มใจและอิสระ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.respectful-relationships.p003
  topics:
  - health.family.respectful-relationships
  difficulty: 2
  type: mcq
  stem: รุ่นพี่ชวนน้องทำการบ้านให้ตนเอง และขู่ว่าจะไม่ช่วยงานกิจกรรมถ้าน้องไม่ทำ ข้อนี้เป็นอะไร
  choices:
  - id: a
    text: การใช้อำนาจบังคับ
    correct: true
  - id: b
    text: การโน้มน้าวด้วยเหตุผล
    feedback: การโน้มน้าวด้วยเหตุผลให้อีกฝ่ายเลือกได้เอง ไม่ได้ขู่
  - id: c
    text: ความเอื้อเฟื้อ
    feedback: ความเอื้อเฟื้อคือการให้โดยไม่บังคับ
  - id: d
    text: การปรึกษาหารือ
    feedback: การปรึกษาหารือเปิดให้อีกฝ่ายตัดสินใจได้จริง
  hints:
  - ลองดูว่าใครมีอำนาจมากกว่าและใช้อำนาจนั้นอย่างไร
  - การขู่เพื่อให้ทำตามไม่ใช่การโน้มน้าวด้วยเหตุผล
  solution: รุ่นพี่ใช้อำนาจและการขู่เพื่อบังคับให้น้องทำตาม ซึ่งไม่เคารพความเต็มใจของน้อง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.respectful-relationships.p004
  topics:
  - health.family.respectful-relationships
  difficulty: 2
  type: mcq
  stem: ประโยคใดเป็นประโยค "ฉัน..." ที่มั่นใจและให้เกียรติ
  choices:
  - id: a
    text: ฉันอยากลองดูหนังแนวผจญภัยบ้าง เราผลัดกันเลือกคนละรอบได้ไหม
    correct: true
  - id: b
    text: เธอเลือกอะไรก็ได้ ฉันไม่สนแล้ว
    feedback: เป็นการยอมตามและไม่บอกความต้องการของตัวเอง
  - id: c
    text: เธอเลือกหนังแย่มาก ทำไมชอบแบบนี้
    feedback: เป็นการดูถูกอีกฝ่าย ซึ่งเป็นการสื่อสารแบบก้าวร้าว
  - id: d
    text: ก็ได้ ตามที่เธอต้องการ
    feedback: เป็นการยอมตามโดยไม่บอกความรู้สึกของตัวเอง
  hints:
  - ประโยคที่มั่นใจบอกความต้องการของเราโดยไม่ดูถูกอีกฝ่าย
  - ลองดูว่าข้อไหนบอกความต้องการและเคารพทางเลือกของอีกฝ่าย
  solution: '"ฉันอยากลองดูหนังแนวผจญภัยบ้าง เราผลัดกันเลือกคนละรอบได้ไหม" บอกความต้องการของเราชัดเจน และยังเปิดทางให้อีกฝ่ายได้เลือกด้วย'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.respectful-relationships.p005
  topics:
  - health.family.respectful-relationships
  difficulty: 2
  type: text
  stem: เมื่อให้ความยินยอมไปแล้ว ผู้ให้สามารถเปลี่ยนใจและขอหยุดได้ทุกเมื่อ เรียกการกระทำนี้ว่าอะไร (ตอบเป็นคำ)
  accepted:
  - การถอนความยินยอม
  - ถอนความยินยอม
  - ถอนได้
  - ถอน
  hints:
  - คำนี้มีคำว่า "ความยินยอม" อยู่ด้วย
  - เป็นการยกเลิกสิ่งที่เคยให้ไว้
  solution: เรียกว่าการถอนความยินยอม ซึ่งทำได้ทุกเมื่อ และอีกฝ่ายต้องเคารพการตัดสินใจนั้น
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.respectful-relationships.p006
  topics:
  - health.family.respectful-relationships
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็นการควบคุมในความสัมพันธ์ (เลือกได้หลายข้อ)
  multiple: true
  choices:
  - id: a
    text: ตรวจโทรศัพท์ของอีกฝ่ายโดยไม่ยินยอม
    correct: true
  - id: b
    text: จำกัดไม่ให้พบเพื่อนที่ไว้ใจ
    correct: true
  - id: c
    text: ขู่ว่าจะทำร้ายตัวเองถ้าอีกฝ่ายจะเลิก
    correct: true
  - id: d
    text: ชวนไปกินข้าวด้วยกันวันหยุด
    feedback: การชวนที่อีกฝ่ายเลือกได้ไม่ใช่การควบคุม
  - id: e
    text: ถามความรู้สึกก่อนตัดสินใจ
    feedback: การถามความรู้สึกแสดงความเคารพ ไม่ใช่การควบคุม
  hints:
  - การควบคุมคือการจำกัดอิสระและการตัดสินใจของอีกฝ่าย
  - ลองดูว่าข้อไหนทำให้อีกฝ่ายไม่สามารถตัดสินใจเองได้
  solution: การตรวจโทรศัพท์โดยไม่ยินยอม การจำกัดไม่ให้พบเพื่อนที่ไว้ใจ และการขู่ว่าจะทำร้ายตัวเองเมื่อจะเลิก เป็นการควบคุมที่ไม่เคารพอีกฝ่าย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.respectful-relationships.p007
  topics:
  - health.family.respectful-relationships
  difficulty: 2
  type: numeric
  stem: สามคนผลัดกันเลือกกิจกรรมในช่วง 12 สัปดาห์ โดยแต่ละคนได้เลือกเท่ากัน แต่ละคนได้เลือกกี่สัปดาห์ (ตอบเป็นสัปดาห์)
  answer:
    value: 4.0
    tolerance: 0
    unit: สัปดาห์
  misconceptions:
  - match: 12
    feedback: นั่นคือระยะเวลาทั้งหมด ไม่ใช่ระยะเวลาของแต่ละคน
  - match: 36
    feedback: นั่นคือการคูณ แต่เวลามีเพียง 12 สัปดาห์ ต้องหารให้เท่า ๆ กัน
  hints:
  - แบ่งระยะเวลาทั้งหมดเท่า ๆ กันให้ทุกคน
  - ระยะเวลาทั้งหมดถูกแบ่งให้ทั้งสามคน ไม่ใช่ให้คนเดียว
  solution: 12 ÷ 3 = 4 สัปดาห์ต่อคน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.respectful-relationships.p008
  topics:
  - health.family.respectful-relationships
  difficulty: 3
  type: mcq
  stem: ทำไม "หึงแปลว่ารัก" จึงเป็นภาพเหมารวมทางเพศที่อันตราย
  choices:
  - id: a
    text: เพราะทำให้คนยอมรับการควบคุมว่าเป็นเรื่องปกติและมองไม่เห็นสัญญาณอันตราย
    correct: true
  - id: b
    text: เพราะความหึงไม่มีผลต่อความสัมพันธ์เลย
    feedback: ความหึงแบบควบคุมมีผลต่อความรู้สึกและอิสระของทั้งสองฝ่าย
  - id: c
    text: เพราะความหึงทำให้ความสัมพันธ์สนุกขึ้น
    feedback: ความหึงที่จำกัดอิสระไม่ได้ทำให้ความสัมพันธ์มีความสุข
  - id: d
    text: เพราะคนที่หึงมักเป็นคนไม่ดีเสมอ
    feedback: ประโยคนี้เป็นการตีตราอีกแบบ จึงไม่ควรสรุปเช่นนั้น
  hints:
  - ลองนึกว่าความเชื่อนี้ทำให้การควบคุมดูเหมือนความรักหรือไม่
  - ความหวงแหนที่จำกัดอิสระของอีกฝ่ายไม่ใช่สัญญาณของความรัก
  solution: ความเชื่อว่าหึงแปลว่ารัก อาจทำให้คนยอมรับการควบคุมว่าเป็นเรื่องปกติ และมองไม่เห็นสัญญาณอันตรายที่ควรหยุด
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.respectful-relationships.p009
  topics:
  - health.family.respectful-relationships
  difficulty: 3
  type: order
  stem: เรียงขั้นตอนการปฏิเสธอย่างมั่นใจเมื่อถูกกดดัน (จากขั้นแรกไปขั้นสุดท้าย)
  items:
  - หยุดคิดสักครู่ก่อนตอบ
  - บอกความรู้สึกด้วยประโยค "ฉัน..."
  - บอกสิ่งที่ต้องการหรือไม่ต้องการ
  - เสนอทางเลือกถ้าต้องการ
  - ถ้ายังถูกกดดันซ้ำ ให้ออกจากสถานการณ์และขอความช่วยเหลือ
  hints:
  - เริ่มจากหยุดคิดสักครู่ก่อนตอบ
  - ถ้ายังถูกกดดันซ้ำ ให้ออกจากสถานการณ์และขอความช่วยเหลือ
  solution: หยุดคิด บอกความรู้สึกด้วยประโยค "ฉัน..." บอกสิ่งที่ต้องการหรือไม่ต้องการ เสนอทางเลือกถ้าต้องการ และถ้ายังถูกกดดันซ้ำ ให้ออกจากสถานการณ์และขอความช่วยเหลือ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.respectful-relationships.p010
  topics:
  - health.family.respectful-relationships
  difficulty: 3
  type: mcq
  stem: คู่รักคนหนึ่งพูดว่า "ไม่ต้องคิดเยอะ ถ้ารักฉันเธอต้องยอมทุกอย่าง" ข้อใดถูกต้อง
  choices:
  - id: a
    text: การยอมทุกอย่างแสดงว่ารักกันจริง
    feedback: ความรักที่เคารพกันไม่จำเป็นต้องยอมทุกอย่าง
  - id: b
    text: นี่คือการกดดันและควบคุม ไม่ใช่ความรักที่เคารพกัน ควรปรึกษาผู้ใหญ่ที่ไว้ใจ
    correct: true
  - id: c
    text: ถ้ายอมครั้งหนึ่งแล้วต้องยอมตลอดไป
    feedback: ทุกครั้งต้องเป็นการตัดสินใจใหม่ด้วยความเต็มใจ
  - id: d
    text: เป็นเรื่องปกติของความรักที่ทั้งสองฝ่ายต้องรับได้
    feedback: การรับได้ต้องมาจากความเต็มใจ ไม่ใช่การถูกกดดัน
  hints:
  - ลองดูว่าคำพูดนี้ให้อีกฝ่ายมีทางเลือกหรือไม่
  - ความรักที่เคารพกันไม่ต้องให้ยอมทุกอย่างเพื่อพิสูจน์
  solution: คำพูดนี้เป็นการกดดันและควบคุม ไม่ใช่ความรักที่เคารพกัน ควรปรึกษาผู้ใหญ่ที่ไว้ใจหรือติดต่อหน่วยช่วยเหลือ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.respectful-relationships.p011
  topics:
  - health.family.respectful-relationships
  difficulty: 4
  type: mcq
  stem: ข้อใดอธิบายความต่างระหว่างการโน้มน้าวกับการบังคับได้ถูกต้องที่สุด
  choices:
  - id: a
    text: การโน้มน้าวให้อีกฝ่ายตัดสินใจได้เองโดยเคารพคำตอบ ส่วนการบังคับทำให้ไม่มีทางเลือก
    correct: true
  - id: b
    text: ต่างกันที่ระดับเสียงเท่านั้น
    feedback: ความต่างอยู่ที่การเคารพทางเลือกของอีกฝ่าย ไม่ใช่ระดับเสียง
  - id: c
    text: ไม่มีความต่างเพราะทั้งสองทำให้อีกฝ่ายเปลี่ยนใจ
    feedback: การเปลี่ยนใจที่เกิดจากการกดดันไม่ใช่การยินยอมที่แท้จริง
  - id: d
    text: การบังคับดีกว่าการโน้มน้าวเพราะเร็วกว่า
    feedback: การบังคับทำลายความไว้ใจและความเคารพในระยะยาว
  hints:
  - ลองดูว่าอีกฝ่ายยังเลือกได้หรือไม่เมื่อถูกพูดคุยด้วย
  - การโน้มน้าวเคารพคำตอบของอีกฝ่าย
  solution: การโน้มน้าวให้เหตุผลและเคารพคำตอบของอีกฝ่าย ส่วนการบังคับทำให้อีกฝ่ายไม่มีทางเลือกที่แท้จริง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.family.respectful-relationships.p012
  topics:
  - health.family.respectful-relationships
  difficulty: 4
  type: match
  stem: จับคู่พฤติกรรมกับระดับของการมีอิทธิพลต่ออีกฝ่าย (ตามสเกลในบทเรียน)
  pairs:
  - left: ตรวจโทรศัพท์ของอีกฝ่ายทุกวันโดยไม่ยินยอม และห้ามคุยกับเพื่อนบางคน
    right: การควบคุม
  - left: ชวนดูหนังเรื่องที่ตัวเองชอบ บอกเหตุผล แล้วยอมรับเมื่ออีกฝ่ายตอบว่าไม่
    right: การโน้มน้าว
  - left: ถามซ้ำ ๆ ทั้งวันจนอีกฝ่ายรู้สึกว่าไม่มีทางเลือกนอกจากยอม
    right: การกดดัน
  - left: ขู่ว่าจะทำร้ายถ้าไม่ทำตาม
    right: การบังคับ
  hints:
  - ข้อที่อีกฝ่ายยังตอบว่าไม่ได้โดยไม่มีผลเสียคือการโน้มน้าว ข้อที่ใช้การขู่หรือกำลังคือการบังคับ
  - การพูดซ้ำจนไม่มีทางเลือกคือการกดดัน ส่วนการจำกัดอิสระและการตรวจตราต่อเนื่องคือการควบคุม
