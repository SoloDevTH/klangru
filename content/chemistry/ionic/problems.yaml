problems:
  - id: chemistry.bonding.ionic.p001
    topics: [chemistry.bonding.ionic]
    difficulty: 1
    type: mcq
    stem: "สัญลักษณ์แบบจุดของลิวอิสของแมกนีเซียม (หมู่ 2) มีจุดกี่จุด"
    choices:
      - { id: a, text: "2 จุด", correct: true, feedback: "ถูก จำนวนจุดเท่ากับเวเลนซ์อิเล็กตรอน ซึ่งเท่ากับเลขหมู่สำหรับหมู่ 1–2" }
      - { id: b, text: "12 จุด", feedback: "12 คือเลขอะตอม (อิเล็กตรอนทั้งหมด) สัญลักษณ์ลิวอิสแสดงเฉพาะเวเลนซ์อิเล็กตรอน" }
      - { id: c, text: "6 จุด", feedback: "6 จุดคือจำนวนที่ต้องได้รับเพิ่มเพื่อให้ครบแปด ไม่ใช่สิ่งที่แมกนีเซียมมีอยู่" }
    hints:
      - "จุดแทนเวเลนซ์อิเล็กตรอนเท่านั้น"
      - "ธาตุหมู่ 2 มีเวเลนซ์อิเล็กตรอนกี่ตัว"
    solution: "แมกนีเซียม (2, 8, 2) มีเวเลนซ์อิเล็กตรอน 2 ตัว สัญลักษณ์ลิวอิสจึงมี **2 จุด**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.ionic.p002
    topics: [chemistry.bonding.ionic]
    difficulty: 2
    type: match
    stem: "จับคู่ธาตุกับไอออนที่มักเกิดในสารประกอบไอออนิก"
    pairs:
      - { left: "โพแทสเซียม (หมู่ 1)", right: "$\\mathrm{K^+}$" }
      - { left: "แคลเซียม (หมู่ 2)", right: "$\\mathrm{Ca^{2+}}$" }
      - { left: "อะลูมิเนียม (หมู่ 13)", right: "$\\mathrm{Al^{3+}}$" }
      - { left: "ซัลเฟอร์ (หมู่ 16)", right: "$\\mathrm{S^{2-}}$" }
      - { left: "โบรมีน (หมู่ 17)", right: "$\\mathrm{Br^-}$" }
    hints:
      - "โลหะเสียเวเลนซ์อิเล็กตรอนทั้งหมด ได้ประจุบวกเท่าจำนวนนั้น"
      - "อโลหะรับอิเล็กตรอนจนครบแปด ประจุลบ = 8 − เวเลนซ์อิเล็กตรอน"
    solution: "K เสีย 1 ได้ K⁺ · Ca เสีย 2 ได้ Ca²⁺ · Al เสีย 3 ได้ Al³⁺ · S รับ 2 ได้ S²⁻ · Br รับ 1 ได้ Br⁻"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.ionic.p003
    topics: [chemistry.bonding.ionic]
    difficulty: 2
    type: text
    stem: "เขียนสูตรเคมีของอะลูมิเนียมออกไซด์ ซึ่งเกิดจาก $\\mathrm{Al^{3+}}$ และ $\\mathrm{O^{2-}}$ (พิมพ์ตัวเลขห้อยเป็นตัวเลขธรรมดา เช่น H2O)"
    accepted: ["Al2O3", "Al₂O₃"]
    misconceptions:
      - { match: "AlO", feedback: "ประจุยังไม่หักล้างกัน +3 กับ −2 รวมได้ +1" }
      - { match: "Al3O2", feedback: "สลับตัวเลขผิดตัว Al 3 ไอออน (+9) กับ O 2 ไอออน (−4) ไม่เท่ากัน" }
    hints:
      - "หาจำนวนไอออนที่ทำให้ประจุบวกรวมเท่ากับประจุลบรวม"
      - "ค.ร.น. ของ 3 กับ 2 คือ 6"
    solution: "Al 2 ไอออนให้ +6 และ O 3 ไอออนให้ −6 สูตรจึงเป็น $\\mathrm{Al_2O_3}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.ionic.p004
    topics: [chemistry.bonding.ionic]
    difficulty: 2
    type: text
    stem: "ดีเกลือที่ร้านขายยาไทยขายเป็นยาระบายมีสูตร $\\mathrm{MgSO_4}$ จงเรียกชื่อทางเคมีของสารนี้"
    accepted: ["แมกนีเซียมซัลเฟต", "แมกนีเซียม ซัลเฟต", "magnesium sulfate", "magnesium sulphate"]
    misconceptions:
      - { match: "แมกนีเซียมซัลไฟด์", feedback: "ซัลไฟด์คือ $\\mathrm{S^{2-}}$ ส่วน $\\mathrm{SO_4^{2-}}$ คือซัลเฟต" }
      - { match: "แมกนีเซียม(II) ซัลเฟต", feedback: "แมกนีเซียมมีประจุ 2+ เพียงแบบเดียว จึงไม่ต้องใส่เลขโรมัน" }
    hints:
      - "ชื่อ = ชื่อไอออนบวก + ชื่อไอออนลบ"
      - "$\\mathrm{SO_4^{2-}}$ เป็นไอออนกลุ่มอะตอมที่มีชื่อเฉพาะ"
    solution: "$\\mathrm{Mg^{2+}}$ คือแมกนีเซียม $\\mathrm{SO_4^{2-}}$ คือซัลเฟต จึงเป็น **แมกนีเซียมซัลเฟต**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.ionic.p005
    topics: [chemistry.bonding.ionic]
    difficulty: 3
    type: text
    stem: "เขียนสูตรเคมีของแคลเซียมฟอสเฟต ($\\mathrm{Ca^{2+}}$ กับ $\\mathrm{PO_4^{3-}}$) ซึ่งเป็นแร่ธาตุหลักในกระดูก (พิมพ์ตัวเลขห้อยเป็นตัวเลขธรรมดา และใส่วงเล็บถ้าจำเป็น)"
    accepted: ["Ca3(PO4)2", "Ca₃(PO₄)₂"]
    misconceptions:
      - { match: "Ca3PO42", feedback: "ต้องใส่วงเล็บรอบ $\\mathrm{PO_4}$ เพราะเลข 2 คูณทั้งกลุ่ม" }
      - { match: "CaPO4", feedback: "ประจุยังไม่หักล้าง +2 กับ −3 รวมได้ −1" }
      - { match: "Ca2(PO4)3", feedback: "สลับจำนวนผิด Ca 2 ไอออน (+4) กับ $\\mathrm{PO_4}$ 3 ไอออน (−9) ไม่เท่ากัน" }
    hints:
      - "ค.ร.น. ของ 2 กับ 3 คือ 6"
      - "ไอออนกลุ่มอะตอมที่มีมากกว่าหนึ่งตัวต้องอยู่ในวงเล็บ"
    solution: "Ca 3 ไอออน (+6) กับ $\\mathrm{PO_4}$ 2 ไอออน (−6) ได้ $\\mathrm{Ca_3(PO_4)_2}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.ionic.p006
    topics: [chemistry.bonding.ionic]
    difficulty: 3
    type: mcq
    stem: "ชื่อที่ถูกต้องของ $\\mathrm{FeCl_3}$ คือข้อใด"
    choices:
      - { id: a, text: "ไอร์ออน(III) คลอไรด์", correct: true, feedback: "ถูก เหล็กมีได้หลายประจุ จึงบอกประจุ 3+ ด้วยเลขโรมัน" }
      - { id: b, text: "ไอร์ออนไตรคลอไรด์", feedback: "คำบอกจำนวนอย่าง ไตร ใช้กับสารโคเวเลนต์ สารไอออนิกบอกประจุของโลหะแทน" }
      - { id: c, text: "ไอร์ออนคลอไรด์", feedback: "ยังไม่บอกว่าเป็นเหล็ก 2+ หรือ 3+ ซึ่งเป็นสารต่างกัน ($\\mathrm{FeCl_2}$ กับ $\\mathrm{FeCl_3}$)" }
      - { id: d, text: "ไอร์ออน(III) คลอรีน", feedback: "ไอออนลบธาตุเดียวต้องเปลี่ยนท้ายเป็น -ไอด์ คลอรีนจึงเป็นคลอไรด์" }
    hints:
      - "หาประจุของ Fe จาก Cl⁻ 3 ไอออน"
      - "โลหะแทรนซิชันบอกประจุด้วยเลขโรมันในวงเล็บ"
    solution: "Cl⁻ 3 ไอออนรวม −3 Fe จึงเป็น +3 ชื่อคือ **ไอร์ออน(III) คลอไรด์**"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.ionic.p007
    topics: [chemistry.bonding.ionic]
    difficulty: 3
    type: mcq
    stem: "สารในข้อใดเป็นสารประกอบที่อยู่ในรูปไอออน"
    choices:
      - { id: a, text: "$\\mathrm{CaCl_2}$", correct: true, feedback: "ถูก เป็นสารประกอบของโลหะ (Ca) กับอโลหะ (Cl) อยู่เป็นไอออน $\\mathrm{Ca^{2+}}$ และ $\\mathrm{Cl^-}$" }
      - { id: b, text: "$\\mathrm{Cl_2}$", feedback: "มีธาตุเดียว จึงเป็นธาตุ และอยู่เป็นโมเลกุล" }
      - { id: c, text: "$\\mathrm{CO_2}$", feedback: "เป็นสารประกอบก็จริง แต่ C กับ O เป็นอโลหะ ยึดกันด้วยพันธะโคเวเลนต์ อยู่เป็นโมเลกุล" }
      - { id: d, text: "$\\mathrm{Ne}$", feedback: "เป็นธาตุที่อยู่เป็นอะตอมเดี่ยว" }
    hints:
      - "สารประกอบต้องมีมากกว่าหนึ่งธาตุ"
      - "สารประกอบของโลหะกับอโลหะอยู่ในรูปไอออน"
    solution: "$\\mathrm{CaCl_2}$ เป็นสารประกอบของโลหะกับอโลหะ อยู่เป็นไอออน · $\\mathrm{Cl_2}$ ธาตุ (โมเลกุล) · $\\mathrm{CO_2}$ สารประกอบ (โมเลกุล) · Ne ธาตุ (อะตอม)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.ionic.p008
    topics: [chemistry.bonding.ionic]
    difficulty: 3
    type: match
    stem: "จับคู่สูตรเคมีกับคำอธิบายที่ถูกต้อง"
    pairs:
      - { left: "$\\mathrm{Ar}$", right: "ธาตุ อยู่เป็นอะตอม" }
      - { left: "$\\mathrm{N_2}$", right: "ธาตุ อยู่เป็นโมเลกุล" }
      - { left: "$\\mathrm{NH_3}$", right: "สารประกอบ อยู่เป็นโมเลกุล" }
      - { left: "$\\mathrm{KBr}$", right: "สารประกอบ อยู่เป็นไอออน" }
    hints:
      - "นับจำนวนชนิดธาตุในสูตรก่อน"
      - "โลหะกับอโลหะเป็นไอออน อโลหะกับอโลหะเป็นโมเลกุล"
    solution: "Ar เป็นแก๊สมีตระกูล อยู่เป็นอะตอมเดี่ยว · $\\mathrm{N_2}$ ธาตุเดียวสองอะตอม เป็นโมเลกุล · $\\mathrm{NH_3}$ อโลหะสองชนิด เป็นโมเลกุล · KBr โลหะกับอโลหะ เป็นไอออน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.ionic.p009
    topics: [chemistry.bonding.ionic]
    difficulty: 3
    type: numeric
    stem: "ละลายแคลเซียมคลอไรด์ ($\\mathrm{CaCl_2}$) 0.5 mol ในน้ำ ซึ่งแตกตัวเป็นไอออนทั้งหมด จะได้ไอออนรวมกี่โมล"
    answer: { value: 1.5, tolerance: 0.01, unit: mol }
    misconceptions:
      - { match: 1, feedback: "นับเฉพาะไอออนคลอไรด์ (0.5 × 2) ต้องรวมไอออนแคลเซียมด้วย" }
      - { match: 0.5, feedback: "สารไอออนิกแตกตัวเป็นหลายไอออน ไม่ได้อยู่เป็นหน่วยเดียว" }
    hints:
      - "เขียนสมการการแตกตัว $\\mathrm{CaCl_2 \\to Ca^{2+} + 2Cl^-}$"
      - "1 mol ของ $\\mathrm{CaCl_2}$ ให้ไอออนกี่โมล"
    solution: "$\\mathrm{CaCl_2(s) \\to Ca^{2+}(aq) + 2Cl^-(aq)}$ 1 mol ให้ไอออน 3 mol ดังนั้น 0.5 mol ให้ $0.5 \\times 3 = 1.5$ mol"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.ionic.p010
    topics: [chemistry.bonding.ionic]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "นักเรียนต่อวงจรหลอดไฟทดสอบการนำไฟฟ้าของสารละลายในน้ำ สารละลายใดเป็นสารละลายอิเล็กโทรไลต์ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ผงเกลือแร่ (ORS) ละลายน้ำ ซึ่งมีโซเดียมคลอไรด์และโพแทสเซียมคลอไรด์", correct: true, feedback: "ถูก เกลือละลายแบบแตกตัวเป็นไอออน" }
      - { id: b, text: "กรดไฮโดรคลอริก ($\\mathrm{HCl}$ ในน้ำ)", correct: true, feedback: "ถูก HCl เป็นโมเลกุลโคเวเลนต์ แต่ทำปฏิกิริยากับน้ำแตกตัวเป็น $\\mathrm{H_3O^+}$ และ $\\mathrm{Cl^-}$" }
      - { id: c, text: "น้ำเชื่อม (น้ำตาลทรายในน้ำ)", feedback: "น้ำตาลละลายเป็นโมเลกุล ไม่แตกตัว จึงเป็นนอนอิเล็กโทรไลต์" }
      - { id: d, text: "เอทานอลในน้ำ", feedback: "เอทานอลละลายเป็นโมเลกุล ไม่แตกตัว" }
    hints:
      - "สารละลายนำไฟฟ้าได้เมื่อมีไอออนเคลื่อนที่อยู่"
      - "สารโคเวเลนต์บางชนิดก็แตกตัวในน้ำได้"
    solution: "เกลือแร่และกรดไฮโดรคลอริกให้ไอออนในน้ำ จึงเป็นอิเล็กโทรไลต์ ส่วนน้ำตาลและเอทานอลละลายแบบไม่แตกตัว เป็นนอนอิเล็กโทรไลต์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.ionic.p011
    topics: [chemistry.bonding.ionic]
    difficulty: 4
    type: numeric
    stem: "จากข้อมูล (kJ/mol): ระเหิด Na +107 · พลังงานไอออไนเซชันของ Na +496 · $\\tfrac12$ พลังงานพันธะ Cl–Cl +122 · สัมพรรคภาพอิเล็กตรอนของ Cl −349 · พลังงานโครงผลึก NaCl −787 จงหาพลังงานของการเกิด NaCl(s) จาก Na(s) และ $\\mathrm{Cl_2(g)}$ ในหน่วย kJ/mol"
    answer: { value: -411, tolerance: 1, unit: kJ/mol }
    misconceptions:
      - { match: 287, feedback: "ใช้สัมพรรคภาพอิเล็กตรอนเป็นบวก แต่การรับอิเล็กตรอนของ Cl คายพลังงาน (−349)" }
      - { match: 1163, feedback: "ใช้พลังงานโครงผลึกเป็นบวก แต่ไอออนแก๊สรวมเป็นผลึกคายพลังงาน (−787)" }
    hints:
      - "พลังงานของการเกิด = ผลรวมของทุกขั้นในวัฏจักร"
      - "รักษาเครื่องหมาย: ดูดพลังงานเป็นบวก คายเป็นลบ"
    solution: "$107 + 496 + 122 - 349 - 787 = -411$ kJ/mol"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.ionic.p012
    topics: [chemistry.bonding.ionic]
    difficulty: 4
    type: mcq
    stem: "เกล็ดเกลือแกงแห้งไม่นำไฟฟ้า แต่เกลือที่หลอมเหลวและน้ำเกลือนำไฟฟ้าได้ เหตุผลใดถูกต้อง"
    choices:
      - { id: a, text: "ในผลึก ไอออนถูกตรึงอยู่กับที่ เมื่อหลอมเหลวหรือละลายน้ำ ไอออนเคลื่อนที่ได้", correct: true, feedback: "ถูก การนำไฟฟ้าต้องมีอนุภาคที่มีประจุเคลื่อนที่ได้" }
      - { id: b, text: "ในผลึกไม่มีไอออน ไอออนเพิ่งเกิดตอนหลอมเหลวหรือละลาย", feedback: "ผลึกเกลือแกงประกอบด้วยไอออนอยู่แล้ว แต่ไอออนเคลื่อนที่ไม่ได้" }
      - { id: c, text: "เกลือแกงมีอิเล็กตรอนอิสระแบบโลหะเมื่อละลายน้ำ", feedback: "สารละลายเกลือนำไฟฟ้าด้วยไอออน ไม่ใช่อิเล็กตรอนอิสระ" }
    hints:
      - "สารนำไฟฟ้าได้เมื่อมีอนุภาคที่มีประจุและเคลื่อนที่ได้"
      - "ในผลึก ไอออนอยู่ที่ใด"
    solution: "ผลึก NaCl มีไอออนอยู่แล้ว แต่ถูกยึดในโครงผลึกจนเคลื่อนที่ไม่ได้ เมื่อหลอมเหลวหรือละลายน้ำ โครงผลึกถูกทำลาย ไอออนเคลื่อนที่ได้จึงนำไฟฟ้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.bonding.ionic.p013
    topics: [chemistry.bonding.ionic]
    difficulty: 4
    type: mcq
    stem: "ภาพแสดงชั้นไอออนในผลึกไอออนิกก่อนและหลังชั้นกลางถูกแรงดันให้เลื่อนไปหนึ่งตำแหน่ง ข้อใดอธิบายว่าทำไมผลึกไอออนิกเปราะ"
    figure:
      src: p-lattice-shift.svg
      alt: "ซ้าย: ไอออนบวกและลบเรียงสลับกันทั้งแนวนอนและแนวตั้ง 3 ชั้น ทุกไอออนบวกมีไอออนลบอยู่ข้างบนและข้างล่าง ขวา: หลังชั้นกลางถูกดันไปทางขวาหนึ่งตำแหน่ง ไอออนลบในชั้นกลางอยู่ตรงกับไอออนลบในชั้นบนและชั้นล่าง และไอออนบวกอยู่ตรงกับไอออนบวก"
    choices:
      - { id: a, text: "หลังเลื่อน ไอออนประจุเดียวกันมาประจันกัน จึงผลักกันจนผลึกแตก", correct: true, feedback: "ถูก แรงผลักทำให้ผลึกแยกตามแนวชั้น" }
      - { id: b, text: "หลังเลื่อน ไอออนบวกกับลบดึงดูดกันแรงขึ้น ผลึกจึงแตก", feedback: "หลังเลื่อน ไอออนประจุตรงข้ามไม่ได้อยู่ตรงกันแล้ว แรงที่เกิดคือแรงผลัก" }
      - { id: c, text: "ผลึกไอออนิกมีอิเล็กตรอนอิสระที่หลุดออกเมื่อถูกทุบ", feedback: "ผลึกไอออนิกไม่มีอิเล็กตรอนอิสระ นั่นเป็นลักษณะของโลหะ" }
    hints:
      - "ดูว่าหลังเลื่อน ไอออนในชั้นกลางอยู่ตรงกับไอออนชนิดใดในชั้นบนและล่าง"
      - "ประจุเหมือนกันผลักกัน"
    solution: "เมื่อชั้นไอออนเลื่อนไปหนึ่งตำแหน่ง ไอออนบวกมาอยู่ตรงไอออนบวก ไอออนลบมาอยู่ตรงไอออนลบ จึงผลักกันจนผลึกแยกตามแนวชั้น ผลึกไอออนิกจึงเปราะ ต่างจากโลหะที่ทุบแล้วเปลี่ยนรูปได้"
