  - id: health.fitness.fitness-components.p017
    topics: [health.fitness.fitness-components]
    difficulty: 5
    type: mcq
    stem: "ตามเกณฑ์ลุก-นั่ง 60 วินาทีของกรมพลศึกษา (2555) เด็กชายอายุ 10 ปีที่ทำได้ 32 ครั้งอยู่ระดับดี แต่เด็กชายอายุ 12 ปีที่ทำได้ 32 ครั้งเท่ากันอยู่ระดับปานกลาง ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "เกณฑ์แยกตามอายุ เด็กที่โตกว่ามักมีกล้ามเนื้อแข็งแรงกว่า เกณฑ์ของอายุมากจึงสูงกว่า", correct: true }
      - { id: b, text: "ครูให้คะแนนเด็กอายุ 10 ปีมากกว่าเพราะลำเอียง", feedback: "ระดับมาจากตารางเกณฑ์มาตรฐาน ไม่ได้มาจากความชอบของครู" }
      - { id: c, text: "เด็กอายุ 10 ปีทำได้มากกว่า", feedback: "ทั้งสองคนทำได้ 32 ครั้งเท่ากัน ที่ต่างคือเกณฑ์ที่ใช้เทียบ" }
      - { id: d, text: "ตารางผิด ทุกอายุควรใช้เกณฑ์เดียวกัน", feedback: "เกณฑ์มาตรฐานสร้างจากข้อมูลเด็กแต่ละอายุและเพศ จึงต้องแยกกัน" }
    hints:
      - "เกณฑ์มาตรฐานสร้างจากข้อมูลของเด็กกลุ่มอายุและเพศเดียวกัน"
      - "เด็กโตขึ้น ร่างกายเปลี่ยนแปลงอย่างไร"
    solution: "เกณฑ์สมรรถภาพทางกายแยกตามอายุและเพศ เพราะความสามารถเปลี่ยนตามการเจริญเติบโต อายุ 10 ปีระดับดีคือ 32–41 ครั้ง ส่วนอายุ 12 ปีระดับดีเริ่มที่ 34 ครั้ง 32 ครั้งจึงเป็นปานกลาง"
