problems:
  - id: business.ethics.business-ethics.p001
    topics: [business.ethics.business-ethics]
    difficulty: 1
    type: mcq
    stem: "ข้อใดอธิบาย **จริยธรรมทางธุรกิจ** ได้ถูกต้องที่สุด"
    choices:
      - { id: a, text: "หลักความประพฤติที่ถูกต้องดีงามในการทำธุรกิจต่อลูกค้า พนักงาน คู่ค้า ชุมชน และสิ่งแวดล้อม", correct: true }
      - { id: b, text: "การทำทุกอย่างที่กฎหมายไม่ได้ห้าม เพื่อให้ได้กำไรมากที่สุด", feedback: "กฎหมายเป็นเพียงขั้นต่ำ สิ่งที่ไม่ผิดกฎหมายอาจยังไม่ถูกจริยธรรม" }
      - { id: c, text: "การบริจาคเงินให้การกุศลทุกปี", feedback: "การบริจาคเป็นกิจกรรมเพื่อสังคมอย่างหนึ่ง แต่จริยธรรมครอบคลุมการทำธุรกิจทุกด้าน" }
      - { id: d, text: "กฎหมายที่รัฐใช้ลงโทษธุรกิจที่โกง", feedback: "นั่นคือกฎหมาย จริยธรรมเป็นหลักความประพฤติที่กว้างกว่าและไม่จำเป็นต้องมีบทลงโทษ" }
    hints:
      - "จริยธรรมต่างจากกฎหมายตรงไหน"
      - "หาข้อที่พูดถึงความถูกต้องต่อทุกฝ่ายที่เกี่ยวข้อง"
    solution: "จริยธรรมทางธุรกิจคือหลักความประพฤติที่ถูกต้องดีงามในการทำธุรกิจต่อผู้มีส่วนได้ส่วนเสียทุกกลุ่ม ซึ่งกว้างกว่ากฎหมายและกว้างกว่าการบริจาค"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.ethics.business-ethics.p002
    topics: [business.ethics.business-ethics]
    difficulty: 1
    type: match
    stem: "จับคู่หลักการพื้นฐานของจรรยาบรรณวิชาชีพบัญชีกับพฤติกรรมที่ตรงกัน"
    pairs:
      - { left: "ไม่ลงชื่อรับรองรายงานที่รู้ว่ามีตัวเลขเท็จ", right: "ความซื่อสัตย์สุจริต" }
      - { left: "ไม่เล่าเรื่องหนี้สินของลูกค้าให้เพื่อนฟัง", right: "การรักษาความลับ" }
      - { left: "อบรมมาตรฐานการบัญชีฉบับใหม่ก่อนรับงาน", right: "ความรู้ ความสามารถ และความเอาใจใส่" }
      - { left: "ไม่ให้ความสนิทกับลูกค้ามีผลต่อความเห็นในงาน", right: "ความเที่ยงธรรม" }
    hints:
      - "นึกถึงคำสำคัญ: เท็จ ความลับ มาตรฐานใหม่ อคติ"
      - "ความเที่ยงธรรมคือไม่ให้อคติหรืออิทธิพลมาครอบงำดุลยพินิจ"
    solution: "ตัวเลขเท็จ → ซื่อสัตย์สุจริต · ไม่เล่าเรื่องลูกค้า → รักษาความลับ · อบรมมาตรฐานใหม่ → ความรู้ความสามารถและความเอาใจใส่ · ไม่ให้ความสนิทมีผล → เที่ยงธรรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.ethics.business-ethics.p003
    topics: [business.ethics.business-ethics]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นตัวอย่างของการกระทำที่ **อาจไม่ผิดกฎหมาย แต่มีปัญหาทางจริยธรรม**"
    choices:
      - { id: a, text: "ร้านลดปริมาณขนมในถุงลงแต่ขายราคาเดิม และออกแบบถุงให้ดูเหมือนเดิมเพื่อไม่ให้ลูกค้าสังเกต", correct: true }
      - { id: b, text: "ร้านไม่ยื่นภาษีตามกำหนด", feedback: "การไม่ยื่นภาษีผิดกฎหมายโดยตรง" }
      - { id: c, text: "ร้านติดป้ายราคาชัดเจนและให้ใบเสร็จทุกครั้ง", feedback: "เป็นการกระทำที่ถูกทั้งกฎหมายและจริยธรรม" }
      - { id: d, text: "ร้านจ้างพนักงานโดยจ่ายค่าจ้างต่ำกว่าที่กฎหมายกำหนด", feedback: "จ่ายต่ำกว่าค่าจ้างขั้นต่ำผิดกฎหมายแรงงาน" }
    hints:
      - "ตัดข้อที่ผิดกฎหมายชัดเจนออกก่อน"
      - "หาข้อที่ข้อมูลเป็นความจริง แต่ตั้งใจทำให้ลูกค้าไม่ทันสังเกต"
    solution: "การลดปริมาณแต่ฉลากบอกน้ำหนักจริงอาจไม่ผิดกฎหมาย แต่ตั้งใจให้ลูกค้าไม่สังเกต จึงขัดหลักความซื่อสัตย์และความโปร่งใส ส่วนข้ออื่นผิดกฎหมายหรือถูกต้องอยู่แล้ว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.ethics.business-ethics.p004
    topics: [business.ethics.business-ethics]
    difficulty: 2
    type: numeric
    stem: "กลุ่มวิสาหกิจกาแฟในจังหวัดเชียงราย (กลุ่มสมมติ) ตกลงรับซื้อเมล็ดกาแฟจากเกษตรกรสูงกว่าราคาตลาด 15% เพื่อให้เกษตรกรมีรายได้เป็นธรรม ถ้าราคาตลาดกิโลกรัมละ 80 บาท กลุ่มจะรับซื้อกิโลกรัมละกี่บาท (ตอบเป็นบาท)"
    answer: { value: 92, unit: บาท }
    hints:
      - "สูงกว่า 15% คือ ราคาตลาดบวกอีก 15% ของราคาตลาด"
      - "คูณราคาตลาดด้วย $1.15$"
    misconceptions:
      - { match: 12, feedback: "นั่นคือส่วนที่เพิ่มขึ้น ต้องบวกกับราคาตลาด 80 บาทด้วย" }
      - { match: 95, feedback: "บวก 15 บาทตรง ๆ แต่โจทย์บอก 15% ของราคาตลาด" }
    solution: "$80 \\times 1.15 = 92$ บาทต่อกิโลกรัม (เพิ่มขึ้น $80 \\times 0.15 = 12$ บาท)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.ethics.business-ethics.p005
    topics: [business.ethics.business-ethics]
    difficulty: 2
    type: mcq
    stem: "สถานการณ์ใดเป็น **ความขัดแย้งทางผลประโยชน์**"
    choices:
      - { id: a, text: "พนักงานจัดซื้อสั่งวัสดุจากร้านของพี่ชายตัวเอง โดยไม่แจ้งบริษัท", correct: true }
      - { id: b, text: "พนักงานจัดซื้อขอใบเสนอราคาจากร้านสามร้านแล้วเลือกร้านที่คุ้มที่สุด", feedback: "เป็นวิธีจัดซื้อที่โปร่งใส ไม่มีประโยชน์ส่วนตัวเข้ามาเกี่ยว" }
      - { id: c, text: "พนักงานบัญชีทำงานล่วงเวลาและได้ค่าล่วงเวลาตามระเบียบ", feedback: "ค่าล่วงเวลาตามระเบียบเป็นสิทธิ ไม่ขัดกับหน้าที่" }
      - { id: d, text: "ผู้จัดการตัดสินใจลดราคาสินค้าเพื่อเพิ่มยอดขาย", feedback: "เป็นการตัดสินใจทางธุรกิจตามหน้าที่ ไม่มีประโยชน์ส่วนตัวที่ขัดแย้ง" }
    hints:
      - "หาข้อที่ประโยชน์ส่วนตัว (หรือของครอบครัว) อาจขัดกับประโยชน์ของบริษัท"
      - "การไม่เปิดเผยทำให้ปัญหาร้ายแรงขึ้น"
    solution: "การสั่งซื้อจากร้านของพี่ชายทำให้ประโยชน์ของครอบครัวอาจขัดกับหน้าที่หาของที่คุ้มที่สุดให้บริษัท และยังไม่ได้เปิดเผย จึงเป็นความขัดแย้งทางผลประโยชน์ ที่ถูกคือแจ้งบริษัทและไม่ร่วมตัดสินใจเลือกร้าน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.ethics.business-ethics.p006
    topics: [business.ethics.business-ethics]
    difficulty: 2
    type: match
    stem: "จับคู่การกระทำของโรงแรมแห่งหนึ่ง (สมมติ) กับระดับในพีระมิดความรับผิดชอบต่อสังคม"
    pairs:
      - { left: "ตั้งราคาห้องให้มีกำไรพอจ่ายค่าจ้างและอยู่รอด", right: "ทางเศรษฐกิจ" }
      - { left: "ขึ้นทะเบียนลูกจ้างในระบบประกันสังคมตามที่กฎหมายกำหนด", right: "ทางกฎหมาย" }
      - { left: "จ้างคนในท้องถิ่นและจ่ายค่าจ้างสูงกว่าขั้นต่ำตามฝีมือแม้กฎหมายไม่บังคับ", right: "เชิงจริยธรรม" }
      - { left: "สนับสนุนทุนการศึกษาให้นักเรียนในตำบล", right: "เชิงการให้" }
    hints:
      - "ฐานคือการอยู่รอด ถัดมาคือสิ่งที่กฎหมายบังคับ"
      - "เชิงจริยธรรมคือสิ่งที่ถูกต้องเกินกว่ากฎหมาย เชิงการให้คือการช่วยสังคมนอกธุรกิจหลัก"
    solution: "มีกำไรอยู่รอด → เศรษฐกิจ · ประกันสังคม → กฎหมาย · ค่าจ้างเป็นธรรมเกินขั้นต่ำ → จริยธรรม · ทุนการศึกษา → การให้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.ethics.business-ethics.p007
    topics: [business.ethics.business-ethics]
    difficulty: 3
    type: numeric
    stem: "ร้านข้าวเกรียบในจังหวัดระยอง (ร้านสมมติ) เปลี่ยนถุงจาก 100 กรัมเป็น 90 กรัม แต่ขายราคาเดิม 25 บาทตามภาพ ราคาต่อกรัมเพิ่มขึ้นกี่เปอร์เซ็นต์ (ตอบเป็นเปอร์เซ็นต์ ทศนิยม 1 ตำแหน่ง)"
    figure: { src: snack-packs.svg, alt: "ถุงข้าวเกรียบกุ้งสองถุง ถุงเดิมน้ำหนักสุทธิ 100 กรัม ราคา 25 บาท ถุงใหม่น้ำหนักสุทธิ 90 กรัม ราคา 25 บาท" }
    answer: { value: 11.1, tolerance: 0.1, unit: "%" }
    hints:
      - "หาราคาต่อกรัมของถุงเดิมและถุงใหม่"
      - "ร้อยละที่เพิ่ม $= \\dfrac{\\text{ใหม่} - \\text{เดิม}}{\\text{เดิม}} \\times 100$"
    misconceptions:
      - { match: 10, feedback: "10% คือน้ำหนักที่ลดลง แต่ราคาต่อกรัมเพิ่มขึ้นมากกว่านั้น เพราะหารด้วยจำนวนกรัมที่น้อยลง" }
    solution: "ถุงเดิม $25 \\div 100 = 0.25$ บาทต่อกรัม ถุงใหม่ $25 \\div 90 \\approx 0.2778$ บาทต่อกรัม เพิ่มขึ้น $\\dfrac{0.2778 - 0.25}{0.25} \\times 100 \\approx 11.1\\%$ ลูกค้าจ่ายแพงขึ้นจริงโดยไม่รู้ตัว การแจ้งลูกค้าอย่างเปิดเผยจึงเป็นทางที่โปร่งใสกว่า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.ethics.business-ethics.p008
    topics: [business.ethics.business-ethics]
    difficulty: 3
    type: mcq
    stem: "นักบัญชีของสำนักงานบัญชีเล่าให้เพื่อนในวงข้าวฟังว่า \"ร้านทองหัวมุมขาดทุนหนัก ใกล้ปิดแล้ว\" โดยรู้มาจากงบการเงินที่ตนทำให้ร้านนั้น นักบัญชีขัดหลักการพื้นฐานข้อใด **มากที่สุด**"
    choices:
      - { id: a, text: "การรักษาความลับ", correct: true }
      - { id: b, text: "ความรู้ ความสามารถ และความเอาใจใส่", feedback: "งบการเงินอาจทำได้ถูกต้องดี ปัญหาอยู่ที่การนำข้อมูลไปเปิดเผย" }
      - { id: c, text: "ความเที่ยงธรรม", feedback: "ไม่มีการใช้ดุลยพินิจที่ถูกอคติครอบงำในเรื่องนี้ ประเด็นหลักคือข้อมูลของลูกค้ารั่วไหล" }
      - { id: d, text: "ไม่ขัดหลักการใด เพราะพูดความจริง", feedback: "แม้เป็นความจริง ข้อมูลที่ได้จากงานต้องเก็บเป็นความลับ เว้นแต่กฎหมายกำหนดให้เปิดเผย" }
    hints:
      - "ข้อมูลนี้ได้มาจากความสัมพันธ์ทางวิชาชีพหรือไม่"
      - "พูดความจริงก็ยังผิดได้ ถ้าเป็นข้อมูลที่ต้องเก็บไว้"
    solution: "ข้อมูลทางการเงินของลูกค้าได้มาจากการทำงาน ต้องรักษาความลับ การนำไปเล่าทำให้ร้านเสียหายและขัดหลักการรักษาความลับ (และยังกระทบพฤติกรรมทางวิชาชีพด้วย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.ethics.business-ethics.p009
    topics: [business.ethics.business-ethics]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการตัดสินใจเชิงจริยธรรม"
    items:
      - "รวบรวมข้อเท็จจริงของสถานการณ์"
      - "ระบุประเด็นจริยธรรมและผู้มีส่วนได้ส่วนเสีย"
      - "หาทางเลือกที่ทำได้ให้ครบ"
      - "ประเมินแต่ละทางด้วยกฎหมาย จรรยาบรรณ และผลกระทบ"
      - "ตัดสินใจ ลงมือ และบันทึกเหตุผล"
    hints:
      - "ต้องรู้ข้อเท็จจริงก่อนจะบอกได้ว่าใครได้รับผลกระทบ"
      - "ประเมินได้ก็ต่อเมื่อมีทางเลือกให้เปรียบเทียบแล้ว"
    solution: "ข้อเท็จจริง → ประเด็นและผู้มีส่วนได้ส่วนเสีย → ทางเลือก → ประเมิน → ตัดสินใจและบันทึก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.ethics.business-ethics.p010
    topics: [business.ethics.business-ethics]
    difficulty: 3
    type: match
    stem: "จับคู่สถานการณ์ของนักบัญชีกับประเภทของอุปสรรคต่อการปฏิบัติตามจรรยาบรรณ"
    pairs:
      - { left: "ได้โบนัสเพิ่มถ้ากำไรของบริษัทสูงขึ้น", right: "ผลประโยชน์ส่วนตน" }
      - { left: "ถูกขอให้ตรวจระบบบัญชีที่ตัวเองเป็นคนออกแบบ", right: "การสอบทานผลงานตนเอง" }
      - { left: "ไปพูดแทนลูกค้าในข้อพิพาทกับคู่ค้าจนเข้าข้างลูกค้าเต็มที่", right: "การเป็นผู้ให้การสนับสนุน" }
      - { left: "ทำบัญชีให้ลูกค้ารายเดิมมาสิบห้าปีจนสนิทเป็นญาติ", right: "ความคุ้นเคย" }
      - { left: "ผู้บริหารขู่ว่าจะเลิกจ้างถ้าไม่ยอมแก้ตัวเลข", right: "การถูกข่มขู่" }
    hints:
      - "ดูว่าแรงกดดันมาจากเงิน งานของตัวเอง การเข้าข้าง ความสนิท หรือการขู่"
      - "การสอบทานผลงานตนเองคือการประเมินงานที่ตนเองทำไว้ก่อน"
    solution: "โบนัส → ผลประโยชน์ส่วนตน · ตรวจระบบที่ตนออกแบบ → สอบทานผลงานตนเอง · พูดแทนลูกค้า → ผู้ให้การสนับสนุน · สนิทสิบห้าปี → ความคุ้นเคย · ขู่เลิกจ้าง → ถูกข่มขู่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.ethics.business-ethics.p011
    topics: [business.ethics.business-ethics]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "โรงงานแปรรูปอาหารแห่งหนึ่งในจังหวัดสมุทรสาคร (สมมติ) ทำกิจกรรมต่อไปนี้ ข้อใดเป็น CSR **ในกระบวนการ** ทำธุรกิจ (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "บำบัดน้ำเสียจากสายการผลิตก่อนปล่อยลงคลอง", correct: true }
      - { id: b, text: "ติดฉลากส่วนประกอบและสารก่อภูมิแพ้ให้ครบและอ่านง่าย", correct: true }
      - { id: c, text: "จัดอุปกรณ์ป้องกันและอบรมความปลอดภัยให้พนักงานในสายการผลิต", correct: true }
      - { id: d, text: "พาพนักงานไปปลูกป่าชายเลนปีละครั้ง", feedback: "เป็นกิจกรรมเพื่อสังคมที่ดี แต่อยู่นอกกระบวนการผลิตหลัก" }
      - { id: e, text: "บริจาคอาหารกระป๋องให้ผู้ประสบอุทกภัย", feedback: "เป็น CSR นอกกระบวนการ (การให้) ไม่ใช่การปรับวิธีทำธุรกิจหลัก" }
    hints:
      - "ในกระบวนการ คือ สิ่งที่ทำระหว่างผลิตและขายสินค้าหลักของโรงงาน"
      - "นอกกระบวนการ คือ กิจกรรมเพิ่มเติมที่ไม่เกี่ยวกับการผลิตโดยตรง"
    solution: "บำบัดน้ำเสีย ฉลากถูกต้อง และความปลอดภัยของพนักงาน เกิดขึ้นในกระบวนการผลิตหลัก จึงเป็น CSR ในกระบวนการ ส่วนปลูกป่าและบริจาคเป็น CSR นอกกระบวนการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.ethics.business-ethics.p012
    topics: [business.ethics.business-ethics]
    difficulty: 4
    type: numeric
    stem: "บริษัทหนึ่ง (สมมติ) รายงานกำไรสุทธิปีนี้ $180{,}000$ บาท ภายหลังพบว่าผู้จัดการให้บันทึกยอดขาย $50{,}000$ บาท ซึ่งจะส่งของให้ลูกค้าในปีหน้า เป็นยอดขายของปีนี้ พร้อมต้นทุนสินค้าของรายการนั้น $30{,}000$ บาท ถ้าแก้ให้ถูกต้อง กำไรสุทธิปีนี้เป็นกี่บาท (ตอบเป็นบาท)"
    answer: { value: 160000, unit: บาท }
    hints:
      - "รายการนี้ทำให้ทั้งรายได้และค่าใช้จ่าย (ต้นทุนขาย) ของปีนี้เกินจริง"
      - "กำไรที่เกินจริง $=$ ยอดขาย $-$ ต้นทุนของรายการนั้น แล้วนำไปหักจากกำไรที่รายงาน"
    misconceptions:
      - { match: 130000, feedback: "หักยอดขายออกทั้งหมด แต่ลืมหักต้นทุนขายของรายการนั้นออกด้วย กำไรที่เกินมาจึงเป็นแค่ $50{,}000 - 30{,}000$" }
      - { match: 200000, feedback: "ต้องหักกำไรที่เกินจริงออก ไม่ใช่บวกเพิ่ม" }
    solution: "รายการนี้ทำให้กำไรเกินจริง $50{,}000 - 30{,}000 = 20{,}000$ บาท กำไรที่ถูกต้อง $= 180{,}000 - 20{,}000 = 160{,}000$ บาท การบันทึกรายได้ก่อนงวดเพื่อให้กำไรสูงขัดหลักความซื่อสัตย์สุจริตและความโปร่งใส"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.ethics.business-ethics.p013
    topics: [business.ethics.business-ethics]
    difficulty: 4
    type: mcq
    stem: "ปลายปี ผู้อำนวยการบอกพนักงานบัญชีว่า \"ถ้าไม่ย้ายค่าใช้จ่ายเดือนธันวาคมไปบันทึกเดือนมกราคม ปีหน้าไม่ต้องมาทำงาน\" ข้อใดระบุ **ประเภทอุปสรรค** และ **การตอบสนองที่เหมาะสมที่สุด** ได้ถูกต้อง"
    choices:
      - { id: a, text: "อุปสรรคจากการถูกข่มขู่ บันทึกตามจริง อธิบายเหตุผลทางบัญชี เก็บหลักฐาน และแจ้งผู้มีหน้าที่กำกับดูแลหรือขอคำปรึกษา", correct: true }
      - { id: b, text: "อุปสรรคจากความคุ้นเคย ทำตามคำสั่งเพราะผู้อำนวยการรู้จักกันมานาน", feedback: "ประเด็นคือการขู่ ไม่ใช่ความสนิท และการทำตามคำสั่งทำให้งบการเงินผิด" }
      - { id: c, text: "อุปสรรคจากผลประโยชน์ส่วนตน ลาออกทันทีโดยไม่บอกเหตุผล", feedback: "แรงกดดันมาจากการขู่ และการลาออกเงียบ ๆ ไม่ได้แก้งบการเงินที่ผิด ควรพยายามแก้ไขผ่านช่องทางที่เหมาะสมก่อน" }
      - { id: d, text: "อุปสรรคจากการถูกข่มขู่ ทำตามคำสั่งแต่เขียนบันทึกไว้ว่าไม่เห็นด้วย", feedback: "ระบุอุปสรรคถูก แต่การบันทึกว่าไม่เห็นด้วยไม่ทำให้การบิดเบือนตัวเลขกลายเป็นถูกต้อง" }
    hints:
      - "แรงกดดันในสถานการณ์นี้มาจากอะไร"
      - "การตอบสนองที่ดีต้องรักษาความถูกต้องของงบและใช้ช่องทางที่องค์กรมี"
    solution: "การขู่เลิกจ้างคืออุปสรรคจากการถูกข่มขู่ นักบัญชีต้องบันทึกค่าใช้จ่ายในงวดที่เกิดขึ้น อธิบายด้วยหลักการบัญชี เก็บหลักฐานการหารือ และแจ้งผู้มีหน้าที่กำกับดูแลหรือขอคำปรึกษา (เช่น องค์กรวิชาชีพหรือที่ปรึกษากฎหมาย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.ethics.business-ethics.p014
    topics: [business.ethics.business-ethics]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "โรงงานย้อมผ้าริมแม่น้ำ (สมมติ) คิดจะหยุดเดินระบบบำบัดน้ำเสียตอนกลางคืนเพื่อประหยัดค่าไฟ ผู้มีส่วนได้ส่วนเสียกลุ่มใด **ได้รับผลกระทบโดยตรง** ถ้าทำเช่นนั้น (เลือกได้มากกว่าหนึ่งข้อ)"
    choices:
      - { id: a, text: "ชาวบ้านท้ายน้ำที่ใช้น้ำและจับปลา", correct: true }
      - { id: b, text: "เจ้าของและผู้ถือหุ้น ซึ่งเสี่ยงถูกปรับ ถูกสั่งปิด และเสียชื่อเสียง", correct: true }
      - { id: c, text: "พนักงาน ซึ่งเสี่ยงตกงานถ้าโรงงานถูกสั่งปิด", correct: true }
      - { id: d, text: "ไม่มีใครได้รับผลกระทบ เพราะน้ำเสียตอนกลางคืนมีน้อย", feedback: "ปริมาณน้อยไม่ได้แปลว่าไม่มีผลกระทบ และการตั้งใจปล่อยน้ำเสียผิดทั้งกฎหมายและจริยธรรม" }
    hints:
      - "คิดทั้งผู้มีส่วนได้ส่วนเสียภายนอกและภายใน"
      - "ผลกระทบไม่ได้เกิดเฉพาะคนที่ใช้น้ำ แต่รวมถึงคนที่อาจเสียงานหรือเสียเงินด้วย"
    solution: "ชาวบ้านได้รับน้ำเสียโดยตรง เจ้าของเสี่ยงค่าปรับและชื่อเสียง พนักงานเสี่ยงตกงาน การประหยัดค่าไฟเล็กน้อยจึงสร้างความเสียหายให้หลายกลุ่ม ทางที่ถูกคือเดินระบบตลอดและหาวิธีลดค่าไฟอื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.ethics.business-ethics.p015
    topics: [business.ethics.business-ethics]
    difficulty: 4
    type: mcq
    stem: "หัวหน้าฝ่ายจัดซื้อได้รับกระเช้าและบัตรกำนัลมูลค่าประมาณ 15,000 บาทจากผู้ขายรายหนึ่ง ก่อนบริษัทจะเลือกผู้ขายรายใหม่สัปดาห์หน้า ข้อใดเป็นการกระทำที่เหมาะสมที่สุด"
    choices:
      - { id: a, text: "ปฏิเสธหรือคืนของขวัญ แจ้งผู้บังคับบัญชาตามนโยบายของบริษัท และไม่ร่วมให้คะแนนผู้ขายรายนี้ถ้านโยบายกำหนด", correct: true }
      - { id: b, text: "รับไว้ เพราะตั้งใจว่าจะให้คะแนนอย่างยุติธรรมอยู่แล้ว", feedback: "แม้ใจเป็นกลาง คนอื่นก็มองว่าอาจลำเอียง ความเที่ยงธรรมต้องดูทั้งความจริงและที่ปรากฏต่อผู้อื่น" }
      - { id: c, text: "รับไว้แล้วแบ่งให้ทุกคนในแผนก จะได้ไม่มีใครได้เปรียบ", feedback: "ของขวัญยังมาจากผู้ขายที่กำลังแข่งขัน ทั้งแผนกจึงอาจลำเอียง" }
      - { id: d, text: "รับไว้และเลือกผู้ขายรายนี้เพื่อตอบแทนน้ำใจ", feedback: "เป็นการให้ผลประโยชน์ส่วนตนมีผลต่อการตัดสินใจ ขัดหลักเที่ยงธรรมโดยตรง" }
    hints:
      - "ช่วงเวลาที่ได้รับของขวัญสำคัญอย่างไร"
      - "นึกถึงขั้นตอนจัดการความขัดแย้งทางผลประโยชน์: เปิดเผย ไม่ร่วมตัดสินใจ ทำตามนโยบาย"
    solution: "ของขวัญมูลค่าสูงก่อนการคัดเลือกทำให้เกิดอุปสรรคจากผลประโยชน์ส่วนตน วิธีที่เหมาะสมคือปฏิเสธหรือคืน แจ้งผู้บังคับบัญชา และทำตามนโยบายของบริษัท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.ethics.business-ethics.p016
    topics: [business.ethics.business-ethics]
    difficulty: 5
    type: mcq
    stem: "บริษัทค้าปลีกในต่างจังหวัด (สมมติ) ขาดทุนต่อเนื่องและต้องปิดหนึ่งสาขาที่มีพนักงาน 40 คน ทางเลือกใดดีที่สุด **เมื่อพิจารณาผู้มีส่วนได้ส่วนเสียทุกกลุ่ม**"
    choices:
      - { id: a, text: "แจ้งพนักงานล่วงหน้าตามกฎหมาย จ่ายค่าชดเชยครบ เสนอย้ายไปสาขาอื่นหรือช่วยหางาน และแจ้งลูกค้าและผู้ขายถึงวันปิด", correct: true }
      - { id: b, text: "ปิดทันทีโดยไม่แจ้งล่วงหน้า เพื่อไม่ให้พนักงานลาออกก่อนและของในสาขาเสียหาย", feedback: "ปกป้องเจ้าของฝ่ายเดียวและอาจขัดกฎหมายคุ้มครองแรงงาน ทำร้ายพนักงานและชื่อเสียงบริษัท" }
      - { id: c, text: "ไม่ปิดสาขา แม้จะขาดทุนจนทั้งบริษัทอาจล้ม", feedback: "ถ้าทั้งบริษัทล้ม พนักงานทุกสาขาจะเสียงาน ความรับผิดชอบทางเศรษฐกิจคือฐานที่ต้องรักษา" }
      - { id: d, text: "ให้พนักงานเซ็นใบลาออกเองเพื่อไม่ต้องจ่ายค่าชดเชย", feedback: "เป็นการหลีกเลี่ยงสิทธิของพนักงาน ผิดจริยธรรมและอาจผิดกฎหมาย" }
    hints:
      - "ทางที่ดีต้องให้บริษัทอยู่รอดและเคารพสิทธิของพนักงานไปพร้อมกัน"
      - "ไล่ดูผลต่อเจ้าของ พนักงาน ลูกค้า และผู้ขาย ในแต่ละทาง"
    solution: "ข้อ ก รักษาความอยู่รอดของบริษัท (ระดับเศรษฐกิจ) ทำตามกฎหมาย (ระดับกฎหมาย) และลดผลเสียต่อพนักงาน ลูกค้า และผู้ขายอย่างเปิดเผย (ระดับจริยธรรม) ทางอื่นทำร้ายผู้มีส่วนได้ส่วนเสียบางกลุ่มอย่างรุนแรง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: business.ethics.business-ethics.p017
    topics: [business.ethics.business-ethics]
    difficulty: 5
    type: mcq
    stem: "ร้านขนมไทยที่ขายดี (สมมติ) ได้ข้อเสนอกู้เงินก้อนใหญ่เพื่อเปิดพร้อมกันอีก 10 สาขาภายในปีเดียว เจ้าของตัดสินใจเปิดเพิ่มทีละ 1–2 สาขา ฝึกคนให้ได้มาตรฐานก่อน และใช้กำไรของร้านเป็นหลักแทนการกู้ทั้งหมด การตัดสินใจนี้สอดคล้องกับหลักของปรัชญาของเศรษฐกิจพอเพียงข้อใด **ชัดเจนที่สุด**"
    choices:
      - { id: a, text: "ความพอประมาณและการมีภูมิคุ้มกันที่ดี: ขยายตามกำลัง และไม่สร้างหนี้ที่อาจทำให้ร้านล้มเมื่อเศรษฐกิจผันผวน", correct: true }
      - { id: b, text: "การไม่ขยายกิจการเลย เพราะเศรษฐกิจพอเพียงห้ามการเติบโต", feedback: "เศรษฐกิจพอเพียงไม่ได้ห้ามการเติบโต แต่ให้เติบโตอย่างพอประมาณ มีเหตุผล และมีภูมิคุ้มกัน" }
      - { id: c, text: "การทำกำไรให้สูงที่สุดในเวลาสั้นที่สุด", feedback: "เป้าหมายนี้ตรงข้ามกับความพอประมาณ และมักต้องแลกกับความเสี่ยงสูง" }
      - { id: d, text: "การพึ่งพาเงินกู้ เพราะเป็นการใช้ความรู้ทางการเงิน", feedback: "เจ้าของเลือกลดการพึ่งพาเงินกู้ ซึ่งเป็นการสร้างภูมิคุ้มกัน" }
    hints:
      - "ปรัชญาของเศรษฐกิจพอเพียงมีสามห่วง: ความพอประมาณ ความมีเหตุผล การมีภูมิคุ้มกันที่ดี"
      - "การขยายทีละน้อยและลดหนี้ช่วยป้องกันความเสี่ยงอะไร"
