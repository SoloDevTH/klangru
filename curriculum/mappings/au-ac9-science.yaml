# หัวข้อในคลังกับ Australian Curriculum: Science V9.0 (F–10)
# จับคู่จากเนื้อหาใน lesson.md และ problems.yaml จริง (ตรวจ 2026-10-24)
# content description ของ AC9 กว้างและเน้นการสืบเสาะ (investigate, model) หัวข้อในคลังสอนแนวคิดและการคำนวณ จึงเป็น partial เกือบทั้งหมด
# คลังยังไม่มีหัวข้อชีววิทยาและโลกและอวกาศ จึงไม่มีแถวของ sub-strand Biological sciences และ Earth and space sciences
framework: au-ac9-science
mappings:
  - topic: physics.dynamics.forces
    indicators: ["AC9S1U03", "AC9S4U03", "AC9S7U04"]
    coverage: partial
    note: "แรงเป็นการผลักหรือดึง ขนาดและทิศทาง แรงที่พบบ่อย แผนภาพแรง และแรงลัพธ์ที่สมดุลและไม่สมดุล ยังไม่ใช่การสืบเสาะด้วยการทดลอง"
  - topic: physics.dynamics.gravitation
    indicators: ["AC9S4U03", "AC9S7U04"]
    coverage: partial
    note: "แรงโน้มถ่วงระหว่างมวลและค่า g ส่วนของแรงโน้มถ่วงใน AC9S4U03 และ AC9S7U04"
  - topic: physics.magnetism.magnetic-field
    indicators: ["AC9S4U03"]
    coverage: partial
    note: "แรงแม่เหล็กกระทำต่อวัตถุโดยไม่ต้องสัมผัส ส่วนของแรงแม่เหล็กใน AC9S4U03"
  - topic: physics.dynamics.newton-first
    indicators: [AC9S7U04]
    coverage: full
    note: สอนครบหลังเติมเนื้อหาเฟส 7
  - topic: physics.dynamics.newton-first
    indicators: ["AC9S10U05"]
    coverage: partial
    note: "แรงลัพธ์เป็นศูนย์ทำให้สภาพการเคลื่อนที่ไม่เปลี่ยน ความเฉื่อยสัมพันธ์กับมวล"
  - topic: physics.dynamics.newton-second
    indicators: [AC9S10U05]
    coverage: full
    note: สอนครบหลังเติมเนื้อหาเฟส 7
  - topic: physics.dynamics.newton-second
    indicators: ["AC9S7U04"]
    coverage: partial
    note: "AC9S10U05 ส่วนความสัมพันธ์เชิงปริมาณของแรง มวล และความเร่ง (F = ma) ครบ แต่ยังไม่ได้วิเคราะห์ข้อมูลจากการทดลองเอง"
  - topic: physics.dynamics.newton-third
    indicators: ["AC9S10U05"]
    coverage: partial
    note: "กฎข้อที่ 3 เป็นส่วนหนึ่งของกฎการเคลื่อนที่ของนิวตัน"
  - topic: physics.waves.wave-basics
    indicators: ["AC9S9U04"]
    coverage: partial
    note: "แบบจำลองคลื่นอธิบายการถ่ายโอนพลังงานผ่านตัวกลาง ยังไม่เทียบกับแบบจำลองอนุภาค"
  - topic: physics.waves.sound
    indicators: [AC9S2U02]
    coverage: full
    note: สอนครบหลังเติมเนื้อหาเฟส 7
  - topic: physics.waves.sound
    indicators: ["AC9S9U04"]
    coverage: partial
    note: "เสียงเกิดจากการสั่นและเดินทางเป็นคลื่นตามยาวผ่านตัวกลาง"
  - topic: physics.light.reflection
    indicators: ["AC9S5U03"]
    coverage: partial
    note: "แสงเดินทางเป็นเส้นตรงและการสะท้อน ยังไม่มีการเกิดเงา"
  - topic: physics.light.refraction
    indicators: ["AC9S5U03"]
    coverage: partial
    note: "การหักเหของแสง ส่วนของการหักเหใน AC9S5U03"
  - topic: physics.electricity.circuits
    indicators: ["AC9S6U03"]
    coverage: partial
    note: "ส่วนประกอบของวงจร วงจรอนุกรมและขนาน การลัดวงจร ยังไม่เน้นการเปลี่ยนรูปพลังงานในวงจร"
  - topic: physics.electricity.charge
    indicators: ["AC9S6U03"]
    coverage: partial
    note: "ตัวนำและฉนวน ส่วนของ AC9S6U03"
  - topic: physics.electricity.electric-power
    indicators: ["AC9S6U03"]
    coverage: partial
    note: "พลังงานไฟฟ้าที่เครื่องใช้ไฟฟ้าเปลี่ยนเป็นพลังงานรูปอื่นและค่าไฟ"
  - topic: physics.units.measurement
    indicators: ["AC9S9I03", "AC9S10I03"]
    coverage: partial
    note: "ความละเอียดของเครื่องมือ การอ่านค่า เลขนัยสำคัญ และที่มาของความคลาดเคลื่อน ยังไม่ได้ใช้อุปกรณ์จริง"
  - topic: chemistry.matter.atoms
    indicators: ["AC9S9U06"]
    coverage: partial
    note: "แบบจำลองอะตอมเปลี่ยนตามการค้นพบอิเล็กตรอน โปรตอน และนิวตรอน ไอโซโทป ยังไม่มีการสลายกัมมันตรังสี"
  - topic: chemistry.matter.periodic-table
    indicators: ["AC9S10U06"]
    coverage: full
    note: "การจัดเรียงอิเล็กตรอนกับตำแหน่งในตารางธาตุ หมู่ คาบ และแนวโน้มสมบัติ"
  - topic: chemistry.bonding.covalent
    indicators: ["AC9S8U06"]
    coverage: partial
    note: "สูตรโมเลกุลและแบบจำลองโมเลกุลสองและสามมิติ ยังไม่จำแนกธาตุ สารประกอบ และของผสม"
  - topic: physics.energy.conservation
    indicators: [AC9S8U05, AC9S9U05]
    coverage: full
    note: การอนุรักษ์พลังงานกลและพลังงานที่เปลี่ยนเป็นความร้อนเมื่อมีแรงเสียดทาน ประสิทธิภาพอยู่ใน power
  - topic: physics.dynamics.friction
    indicators: [AC9S4U03]
    coverage: full
    note: ผลของแรงเสียดทานต่อการเคลื่อนที่ ส่วนแรงโน้มถ่วงอยู่ใน gravitation และแรงแม่เหล็กอยู่ใน magnetic-field
  - topic: physics.energy.kinetic-potential
    indicators: [AC9S8U05]
    coverage: full
    note: จำแนกพลังงานจลน์ พลังงานศักย์โน้มถ่วง และพลังงานศักย์ยืดหยุ่น และการเปลี่ยนรูประหว่างกัน
  - topic: physics.thermal.phase-change
    indicators: [AC9S3U04, AC9S7U05]
    coverage: full
    note: การเพิ่มหรือลดความร้อนทำให้เปลี่ยนสถานะ และความร้อนแฝง ยังไม่สำรวจสมบัติของของแข็งและของเหลว
  - topic: physics.energy.power
    indicators: [AC9S9U05]
    coverage: full
    note: ประสิทธิภาพเป็นอัตราส่วนของพลังงานที่ได้ต่อพลังงานที่ใส่ ส่วนของ AC9S9U05
  - topic: physics.thermal.temperature-heat
    indicators: [AC9S3U03]
    coverage: full
    note: ความร้อนถ่ายโอนจากวัตถุร้อนไปเย็นและอุณหภูมิผสม ยังไม่ระบุแหล่งความร้อนในชีวิตประจำวัน
  - topic: physics.dynamics.forces-intro
    indicators: [AC9SFU02]
    coverage: full
