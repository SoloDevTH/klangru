strands:
  - id: "N"
    title: "Number"
    standards:
      - id: "AC9MFN"
        text: "Number – Foundation"
        indicators:
          - { id: "AC9MFN01", level: "F", text: "name, represent and order numbers including zero to at least 20, using physical and virtual materials and numerals" }
          - { id: "AC9MFN02", level: "F", text: "recognise and name the number of objects within a collection up to 5 using subitising" }
          - { id: "AC9MFN03", level: "F", text: "quantify and compare collections to at least 20 using counting and explain or demonstrate reasoning" }
          - { id: "AC9MFN04", level: "F", text: "partition and combine collections up to 10 using part-part-whole relationships and subitising to recognise and name the parts" }
          - { id: "AC9MFN05", level: "F", text: "represent practical situations involving addition, subtraction and quantification with physical and virtual materials and use counting or subitising strategies" }
          - { id: "AC9MFN06", level: "F", text: "represent practical situations that involve equal sharing and grouping with physical and virtual materials and use counting or subitising strategies", note: "ข้อความตามเว็บไซต์ ACARA เอกสาร curriculum content (Word) พิมพ์ว่า \"represent practical situations involving equal sharing and grouping with physical and virtual materials and use counting or subitising strategies\"" }
      - id: "AC9M1N"
        text: "Number – Year 1"
        indicators:
          - { id: "AC9M1N01", level: "1", text: "recognise, represent and order numbers to at least 120 using physical and virtual materials, numerals, number lines and charts" }
          - { id: "AC9M1N02", level: "1", text: "partition one- and two-digit numbers in different ways using physical and virtual materials, including partitioning two-digit numbers into tens and ones" }
          - { id: "AC9M1N03", level: "1", text: "quantify sets of objects, to at least 120, by partitioning collections into equal groups using number knowledge and skip counting" }
          - { id: "AC9M1N04", level: "1", text: "add and subtract numbers within 20, using physical and virtual materials, part-part-whole knowledge to 10 and a variety of calculation strategies" }
          - { id: "AC9M1N05", level: "1", text: "use mathematical modelling to solve practical problems involving additive situations including simple money transactions; represent the situations with diagrams, physical and virtual materials, and use calculation strategies to solve the problem", note: "ข้อความตามเว็บไซต์ ACARA เอกสาร curriculum content (Word) พิมพ์ว่า \"use mathematical modelling to solve practical problems involving additive situations, including simple money transactions; represent the situations with diagrams, physical and virtual materials, and use calculation strategies to solve the problem\" · เอกสาร scope and sequence พิมพ์ว่า \"use mathematical modelling to solve practical problems involving additive situations, including simple money transactions; represent the situations with diagrams, physical and virtual materials, and use calculation strategies to solve the problem\"" }
          - { id: "AC9M1N06", level: "1", text: "use mathematical modelling to solve practical problems involving equal sharing and grouping; represent the situations with diagrams, physical and virtual materials, and use calculation strategies to solve the problem" }
      - id: "AC9M2N"
        text: "Number – Year 2"
        indicators:
          - { id: "AC9M2N01", level: "2", text: "recognise, represent and order numbers to at least 1000 using physical and virtual materials, numerals and number lines" }
          - { id: "AC9M2N02", level: "2", text: "partition, rearrange, regroup and rename two- and three-digit numbers using standard and non-standard groupings; recognise the role of a zero digit in place value notation" }
          - { id: "AC9M2N03", level: "2", text: "recognise and describe one-half as one of 2 equal parts of a whole and connect halves, quarters and eighths through repeated halving" }
          - { id: "AC9M2N04", level: "2", text: "add and subtract one- and two-digit numbers, representing problems using number sentences, and solve using part-part-whole reasoning and a variety of calculation strategies", note: "ข้อความตามเว็บไซต์ ACARA เอกสาร curriculum content (Word) พิมพ์ว่า \"add and subtract one- and two-digit numbers, representing problems using number sentences and solve using part-part-whole reasoning and a variety of calculation strategies\" · เอกสาร scope and sequence พิมพ์ว่า \"add and subtract one- and two-digit numbers, representing problems using number sentences and solve using part-part-whole reasoning and a variety of calculation strategies\"" }
          - { id: "AC9M2N05", level: "2", text: "multiply and divide by one-digit numbers using repeated addition, equal grouping, arrays, and partitioning to support a variety of calculation strategies", note: "เอกสาร scope and sequence พิมพ์ว่า \"multiply and divide by one-digit numbers using repeated addition, equal grouping, arrays and partitioning to support a variety of calculation strategies\"" }
          - { id: "AC9M2N06", level: "2", text: "use mathematical modelling to solve practical problems involving additive and multiplicative situations, including money transactions; represent situations and choose calculation strategies; interpret and communicate solutions in terms of the situation" }
      - id: "AC9M3N"
        text: "Number – Year 3"
        indicators:
          - { id: "AC9M3N01", level: "3", text: "recognise, represent and order natural numbers using naming and writing conventions for numerals beyond 10 000" }
          - { id: "AC9M3N02", level: "3", text: "recognise and represent unit fractions including 1/2, 1/3, 1/4, 1/5 and 1/10 and their multiples in different ways; combine fractions with the same denominator to complete the whole" }
          - { id: "AC9M3N03", level: "3", text: "add and subtract two- and three-digit numbers using place value to partition, rearrange and regroup numbers to assist in calculations without a calculator" }
          - { id: "AC9M3N04", level: "3", text: "multiply and divide one- and two-digit numbers, representing problems using number sentences, diagrams and arrays, and using a variety of calculation strategies" }
          - { id: "AC9M3N05", level: "3", text: "estimate the quantity of objects in collections and make estimates when solving problems to determine the reasonableness of calculations" }
          - { id: "AC9M3N06", level: "3", text: "use mathematical modelling to solve practical problems involving additive and multiplicative situations including financial contexts; formulate problems using number sentences and choose calculation strategies, using digital tools where appropriate; interpret and communicate solutions in terms of the situation" }
          - { id: "AC9M3N07", level: "3", text: "follow and create algorithms involving a sequence of steps and decisions to investigate numbers; describe any emerging patterns" }
      - id: "AC9M4N"
        text: "Number – Year 4"
        indicators:
          - { id: "AC9M4N01", level: "4", text: "recognise and extend the application of place value to tenths and hundredths and use the conventions of decimal notation to name and represent decimals" }
          - { id: "AC9M4N02", level: "4", text: "explain and use the properties of odd and even numbers" }
          - { id: "AC9M4N03", level: "4", text: "find equivalent representations of fractions using related denominators and make connections between fractions and decimal notation" }
          - { id: "AC9M4N04", level: "4", text: "count by fractions including mixed numerals; locate and represent these fractions as numbers on number lines" }
          - { id: "AC9M4N05", level: "4", text: "solve problems involving multiplying or dividing natural numbers by multiples and powers of 10 without a calculator, using the multiplicative relationship between the place value of digits" }
          - { id: "AC9M4N06", level: "4", text: "develop efficient strategies and use appropriate digital tools for solving problems involving addition and subtraction, and multiplication and division where there is no remainder" }
          - { id: "AC9M4N07", level: "4", text: "choose and use estimation and rounding to check and explain the reasonableness of calculations including the results of financial transactions" }
          - { id: "AC9M4N08", level: "4", text: "use mathematical modelling to solve practical problems involving additive and multiplicative situations including financial contexts; formulate the problems using number sentences and choose efficient calculation strategies, using digital tools where appropriate; interpret and communicate solutions in terms of the situation", note: "เอกสาร scope and sequence พิมพ์ว่า \"use mathematical modelling to solve practical problems that involve additive and multiplicative situations including financial contexts; formulate the problems using number sentences and choose efficient calculation strategies, using digital tools where appropriate; interpret and communicate solutions in terms of the situation\"" }
          - { id: "AC9M4N09", level: "4", text: "follow and create algorithms involving a sequence of steps and decisions that use addition or multiplication to generate sets of numbers; identify and describe any emerging patterns" }
      - id: "AC9M5N"
        text: "Number – Year 5"
        indicators:
          - { id: "AC9M5N01", level: "5", text: "interpret, compare and order numbers with more than 2 decimal places, including numbers greater than one, using place value understanding; represent these on a number line" }
          - { id: "AC9M5N02", level: "5", text: "express natural numbers as products of their factors, recognise multiples and determine if one number is divisible by another" }
          - { id: "AC9M5N03", level: "5", text: "compare and order fractions with the same and related denominators including mixed numerals, applying knowledge of factors and multiples; represent these fractions on a number line" }
          - { id: "AC9M5N04", level: "5", text: "recognise that 100% represents the complete whole and use percentages to describe, represent and compare relative size; connect familiar percentages to their decimal and fraction equivalents" }
          - { id: "AC9M5N05", level: "5", text: "solve problems involving addition and subtraction of fractions with the same or related denominators, using different strategies" }
          - { id: "AC9M5N06", level: "5", text: "solve problems involving multiplication of larger numbers by one- or two-digit numbers, choosing efficient calculation strategies and using digital tools where appropriate; check the reasonableness of answers" }
          - { id: "AC9M5N07", level: "5", text: "solve problems involving division, choosing efficient strategies and using digital tools where appropriate; interpret any remainder according to the context and express results as a whole number, decimal or fraction" }
          - { id: "AC9M5N08", level: "5", text: "check and explain the reasonableness of solutions to problems including financial contexts using estimation strategies appropriate to the context" }
          - { id: "AC9M5N09", level: "5", text: "use mathematical modelling to solve practical problems involving additive and multiplicative situations including financial contexts; formulate the problems, choosing operations and efficient calculation strategies, using digital tools where appropriate; interpret and communicate solutions in terms of the situation" }
          - { id: "AC9M5N10", level: "5", text: "create and use algorithms involving a sequence of steps and decisions and digital tools to experiment with factors, multiples and divisibility; identify, interpret and describe emerging patterns" }
      - id: "AC9M6N"
        text: "Number – Year 6"
        indicators:
          - { id: "AC9M6N01", level: "6", text: "recognise situations, including financial contexts, that use integers; locate and represent integers on a number line and as coordinates on the Cartesian plane" }
          - { id: "AC9M6N02", level: "6", text: "identify and describe the properties of prime, composite and square numbers and use these properties to solve problems and simplify calculations" }
          - { id: "AC9M6N03", level: "6", text: "apply knowledge of equivalence to compare, order and represent common fractions including halves, thirds and quarters on the same number line and justify their order" }
          - { id: "AC9M6N04", level: "6", text: "apply knowledge of place value to add and subtract decimals, using digital tools where appropriate; use estimation and rounding to check the reasonableness of answers" }
          - { id: "AC9M6N05", level: "6", text: "solve problems involving addition and subtraction of fractions using knowledge of equivalent fractions" }
          - { id: "AC9M6N06", level: "6", text: "multiply and divide decimals by multiples of powers of 10 without a calculator, applying knowledge of place value and proficiency with multiplication facts; using estimation and rounding to check the reasonableness of answers", note: "เอกสาร scope and sequence พิมพ์ว่า \"multiply and divide decimals by multiples of powers of 10 without a calculator, applying knowledge of place value and proficiency with multiplication facts, using estimation and rounding to check the reasonableness of answers\"" }
          - { id: "AC9M6N07", level: "6", text: "solve problems that require finding a familiar fraction, decimal or percentage of a quantity, including percentage discounts, choosing efficient calculation strategies and using digital tools where appropriate" }
          - { id: "AC9M6N08", level: "6", text: "approximate numerical solutions to problems involving rational numbers and percentages, including financial contexts, using appropriate estimation strategies" }
          - { id: "AC9M6N09", level: "6", text: "use mathematical modelling to solve practical problems involving natural and rational numbers and percentages, including in financial contexts; formulate the problems, choosing operations and efficient calculation strategies, and using digital tools where appropriate; interpret and communicate solutions in terms of the situation, justifying the choices made", note: "ข้อความตามเว็บไซต์ ACARA เอกสาร curriculum content (Word) พิมพ์ว่า \"use mathematical modelling to solve practical problems, involving rational numbers and percentages, including in financial contexts; formulate the problems, choosing operations and efficient calculation strategies, and using digital tools where appropriate; interpret and communicate solutions in terms of the situation, justifying the choices made\" · เอกสาร scope and sequence พิมพ์ว่า \"use mathematical modelling to solve practical problems, involving rational numbers and percentages, including in financial contexts; formulate the problems, choosing operations and efficient calculation strategies, and using digital tools where appropriate; interpret and communicate solutions in terms of the situation, justifying the choices made\"" }
      - id: "AC9M7N"
        text: "Number – Year 7"
        indicators:
          - { id: "AC9M7N01", level: "7", text: "describe the relationship between perfect square numbers and square roots, and use squares of numbers and square roots of perfect square numbers to solve problems" }
          - { id: "AC9M7N02", level: "7", text: "represent natural numbers as products of powers of prime numbers using exponent notation" }
          - { id: "AC9M7N03", level: "7", text: "represent natural numbers in expanded notation using place value and powers of 10" }
          - { id: "AC9M7N04", level: "7", text: "find equivalent representations of rational numbers and represent rational numbers on a number line" }
          - { id: "AC9M7N05", level: "7", text: "round decimals to a given accuracy appropriate to the context and use appropriate rounding and estimation to check the reasonableness of solutions" }
          - { id: "AC9M7N06", level: "7", text: "use the 4 operations with positive rational numbers including fractions, decimals and percentages to solve problems using efficient calculation strategies" }
          - { id: "AC9M7N07", level: "7", text: "compare, order and solve problems involving addition and subtraction of integers" }
          - { id: "AC9M7N08", level: "7", text: "recognise, represent and solve problems involving ratios" }
          - { id: "AC9M7N09", level: "7", text: "use mathematical modelling to solve practical problems, involving rational numbers and percentages, including financial contexts; formulate problems, choosing representations and efficient calculation strategies, using digital tools as appropriate; interpret and communicate solutions in terms of the situation, justifying choices made about the representation", note: "ข้อความตามเว็บไซต์ ACARA เอกสาร curriculum content (Word) พิมพ์ว่า \"use mathematical modelling to solve practical problems involving rational numbers and percentages, including financial contexts; formulate problems, choosing representations and efficient calculation strategies, using digital tools as appropriate; interpret and communicate solutions in terms of the situation, justifying choices made about the representation\" · เอกสาร scope and sequence พิมพ์ว่า \"use mathematical modelling to solve practical problems involving rational numbers and percentages, including financial contexts; formulate problems, choosing representations and efficient calculation strategies, using digital tools as appropriate; interpret and communicate solutions in terms of the situation, justifying choices made about the representation\"" }
      - id: "AC9M8N"
        text: "Number – Year 8"
        indicators:
          - { id: "AC9M8N01", level: "8", text: "recognise irrational numbers in applied contexts, including square roots and π" }
          - { id: "AC9M8N02", level: "8", text: "establish and apply the exponent laws with positive integer exponents and the zero-exponent, using exponent notation with numbers" }
          - { id: "AC9M8N03", level: "8", text: "recognise terminating and recurring decimals, using digital tools as appropriate" }
          - { id: "AC9M8N04", level: "8", text: "use the 4 operations with integers and with rational numbers, choosing and using efficient strategies and digital tools where appropriate" }
          - { id: "AC9M8N05", level: "8", text: "use mathematical modelling to solve practical problems involving rational numbers and percentages, including financial contexts; formulate problems, choosing efficient calculation strategies and using digital tools where appropriate; interpret and communicate solutions in terms of the situation, reviewing the appropriateness of the model" }
      - id: "AC9M9N"
        text: "Number – Year 9"
        indicators:
          - { id: "AC9M9N01", level: "9", text: "recognise that the real number system includes the rational numbers and the irrational numbers, and solve problems involving real numbers using digital tools" }
      - id: "AC9M10N"
        text: "Number – Year 10"
        indicators:
          - { id: "AC9M10N01", level: "10", text: "recognise the effect of using approximations of real numbers in repeated calculations and compare the results when using exact representations" }
  - id: "A"
    title: "Algebra"
    standards:
      - id: "AC9MFA"
        text: "Algebra – Foundation"
        indicators:
          - { id: "AC9MFA01", level: "F", text: "recognise, copy and continue repeating patterns represented in different ways" }
      - id: "AC9M1A"
        text: "Algebra – Year 1"
        indicators:
          - { id: "AC9M1A01", level: "1", text: "recognise, continue and create pattern sequences, with numbers, symbols, shapes and objects, formed by skip counting, initially by twos, fives and tens" }
          - { id: "AC9M1A02", level: "1", text: "recognise, continue and create repeating patterns with numbers, symbols, shapes and objects, identifying the repeating unit" }
      - id: "AC9M2A"
        text: "Algebra – Year 2"
        indicators:
          - { id: "AC9M2A01", level: "2", text: "recognise, describe and create additive patterns that increase or decrease by a constant amount, using numbers, shapes and objects, and identify missing elements in the pattern" }
          - { id: "AC9M2A02", level: "2", text: "recall and demonstrate proficiency with addition facts to 20; extend and apply facts to develop related subtraction facts" }
          - { id: "AC9M2A03", level: "2", text: "recall and demonstrate proficiency with multiplication facts for twos; extend and apply facts to develop the related division facts using doubling and halving" }
      - id: "AC9M3A"
        text: "Algebra – Year 3"
        indicators:
          - { id: "AC9M3A01", level: "3", text: "recognise and explain the connection between addition and subtraction as inverse operations, apply to partition numbers and find unknown values in number sentences" }
          - { id: "AC9M3A02", level: "3", text: "extend and apply knowledge of addition and subtraction facts to 20 to develop efficient mental strategies for computation with larger numbers without a calculator" }
          - { id: "AC9M3A03", level: "3", text: "recall and demonstrate proficiency with multiplication facts for 3, 4, 5 and 10; extend and apply facts to develop the related division facts" }
      - id: "AC9M4A"
        text: "Algebra – Year 4"
        indicators:
          - { id: "AC9M4A01", level: "4", text: "find unknown values in numerical equations involving addition and subtraction, using the properties of numbers and operations" }
          - { id: "AC9M4A02", level: "4", text: "recall and demonstrate proficiency with multiplication facts up to 10 x 10 and related division facts; extend and apply facts to develop efficient mental strategies for computation with larger numbers without a calculator", note: "เอกสาร scope and sequence พิมพ์ว่า \"recall and demonstrate proficiency with multiplication facts up to 10 x 10 and related division facts, and explain the patterns in these; extend and apply facts to develop efficient mental strategies for computation with larger numbers without a calculator\"" }
      - id: "AC9M5A"
        text: "Algebra – Year 5"
        indicators:
          - { id: "AC9M5A01", level: "5", text: "recognise and explain the connection between multiplication and division as inverse operations and use this to develop families of number facts" }
          - { id: "AC9M5A02", level: "5", text: "find unknown values in numerical equations involving multiplication and division using the properties of numbers and operations" }
      - id: "AC9M6A"
        text: "Algebra – Year 6"
        indicators:
          - { id: "AC9M6A01", level: "6", text: "recognise and use rules that generate visually growing patterns and number patterns involving rational numbers" }
          - { id: "AC9M6A02", level: "6", text: "find unknown values in numerical equations involving brackets and combinations of arithmetic operations, using the properties of numbers and operations" }
          - { id: "AC9M6A03", level: "6", text: "create and use algorithms involving a sequence of steps and decisions that use rules to generate sets of numbers; identify, interpret and explain emerging patterns" }
      - id: "AC9M7A"
        text: "Algebra – Year 7"
        indicators:
          - { id: "AC9M7A01", level: "7", text: "recognise and use variables to represent everyday formulas algebraically and substitute values into formulas to determine an unknown" }
          - { id: "AC9M7A02", level: "7", text: "formulate algebraic expressions using constants, variables, operations and brackets" }
          - { id: "AC9M7A03", level: "7", text: "solve one-variable linear equations with natural number solutions; verify the solution by substitution" }
          - { id: "AC9M7A04", level: "7", text: "describe relationships between variables represented in graphs of functions from authentic data" }
          - { id: "AC9M7A05", level: "7", text: "generate tables of values from visually growing patterns or the rule of a function; describe and plot these relationships on the Cartesian plane" }
          - { id: "AC9M7A06", level: "7", text: "manipulate formulas involving several variables using digital tools, and describe the effect of systematic variation in the values of the variables" }
      - id: "AC9M8A"
        text: "Algebra – Year 8"
        indicators:
          - { id: "AC9M8A01", level: "8", text: "create, expand, factorise, rearrange and simplify linear expressions, applying the associative, commutative, identity, distributive and inverse properties" }
          - { id: "AC9M8A02", level: "8", text: "graph linear relations on the Cartesian plane using digital tools where appropriate; solve linear equations and one-variable inequalities using graphical and algebraic techniques; verify solutions by substitution" }
          - { id: "AC9M8A03", level: "8", text: "use mathematical modelling to solve applied problems involving linear relations, including financial contexts; formulate problems with linear functions, choosing a representation; interpret and communicate solutions in terms of the situation, reviewing the appropriateness of the model", note: "ข้อความตามเว็บไซต์ ACARA เอกสาร curriculum content (Word) พิมพ์ว่า \"use mathematical modelling to solve applied problems involving linear relations , including financial contexts; formulate problems with linear functions, choosing a representation; interpret and communicate solutions in terms of the situation, reviewing the appropriateness of the model\"" }
          - { id: "AC9M8A04", level: "8", text: "experiment with linear functions and relations using digital tools, making and testing conjectures and generalising emerging patterns" }
      - id: "AC9M9A"
        text: "Algebra – Year 9"
        indicators:
          - { id: "AC9M9A01", level: "9", text: "apply the exponent laws to numerical expressions with integer exponents and extend to variables" }
          - { id: "AC9M9A02", level: "9", text: "simplify algebraic expressions, expand binomial products and factorise monic quadratic expressions" }
          - { id: "AC9M9A03", level: "9", text: "find the gradient of a line segment, the midpoint of the line interval and the distance between 2 distinct points on the Cartesian plane" }
          - { id: "AC9M9A04", level: "9", text: "identify and graph quadratic functions, solve quadratic equations graphically and numerically, and solve monic quadratic equations with integer roots algebraically, using graphing software and digital tools as appropriate" }
          - { id: "AC9M9A05", level: "9", text: "use mathematical modelling to solve applied problems involving change including financial contexts; formulate problems, choosing to use either linear or quadratic functions; interpret solutions in terms of the situation; evaluate the model and report methods and findings" }
          - { id: "AC9M9A06", level: "9", text: "experiment with the effects of the variation of parameters on graphs of related functions, using digital tools, making connections between graphical and algebraic representations, and generalising emerging patterns" }
      - id: "AC9M10A"
        text: "Algebra – Year 10"
        indicators:
          - { id: "AC9M10A01", level: "10", text: "expand, factorise and simplify expressions and solve equations algebraically, applying exponent laws involving products, quotients and powers of variables, and the distributive property" }
          - { id: "AC9M10A02", level: "10", text: "solve linear inequalities and simultaneous linear equations in 2 variables; interpret solutions graphically and communicate solutions in terms of the situation" }
          - { id: "AC9M10A03", level: "10", text: "recognise the connection between algebraic and graphical representations of exponential relations and solve related exponential equations, using digital tools where appropriate" }
          - { id: "AC9M10A04", level: "10", text: "use mathematical modelling to solve applied problems involving growth and decay, including financial contexts; formulate problems, choosing to apply linear, quadratic or exponential models; interpret solutions in terms of the situation; evaluate and modify models as necessary and report assumptions, methods and findings" }
          - { id: "AC9M10A05", level: "10", text: "experiment with functions and relations using digital tools, making and testing conjectures and generalising emerging patterns" }
  - id: "M"
    title: "Measurement"
    standards:
      - id: "AC9MFM"
        text: "Measurement – Foundation"
        indicators:
          - { id: "AC9MFM01", level: "F", text: "identify and compare attributes of objects and events, including length, capacity, mass and duration, using direct comparisons and communicating reasoning" }
          - { id: "AC9MFM02", level: "F", text: "sequence days of the week and times of the day including morning, lunchtime, afternoon and night time, and connect them to familiar events and actions" }
      - id: "AC9M1M"
        text: "Measurement – Year 1"
        indicators:
          - { id: "AC9M1M01", level: "1", text: "compare directly and indirectly and order objects and events using attributes of length, mass, capacity and duration, communicating reasoning" }
          - { id: "AC9M1M02", level: "1", text: "measure the length of shapes and objects using informal units, recognising that units need to be uniform and used end-to-end" }
          - { id: "AC9M1M03", level: "1", text: "describe the duration and sequence of events using years, months, weeks, days and hours" }
      - id: "AC9M2M"
        text: "Measurement – Year 2"
        indicators:
          - { id: "AC9M2M01", level: "2", text: "measure and compare objects based on length, capacity and mass using appropriate uniform informal units and smaller units for accuracy when necessary" }
          - { id: "AC9M2M02", level: "2", text: "identify common uses and represent halves, quarters and eighths in relation to shapes, objects and events" }
          - { id: "AC9M2M03", level: "2", text: "identify the date and determine the number of days between events using calendars" }
          - { id: "AC9M2M04", level: "2", text: "recognise and read the time represented on an analog clock to the hour, half-hour and quarter-hour" }
          - { id: "AC9M2M05", level: "2", text: "identify, describe and demonstrate quarter, half, three-quarter and full measures of turn in everyday situations" }
      - id: "AC9M3M"
        text: "Measurement – Year 3"
        indicators:
          - { id: "AC9M3M01", level: "3", text: "identify which metric units are used to measure everyday items; use measurements of familiar items and known units to make estimates" }
          - { id: "AC9M3M02", level: "3", text: "measure and compare objects using familiar metric units of length, mass and capacity, and instruments with labelled markings" }
          - { id: "AC9M3M03", level: "3", text: "recognise and use the relationship between formal units of time including days, hours, minutes and seconds to estimate and compare the duration of events" }
          - { id: "AC9M3M04", level: "3", text: "describe the relationship between the hours and minutes on analog and digital clocks, and read the time to the nearest minute" }
          - { id: "AC9M3M05", level: "3", text: "identify angles as measures of turn and compare angles with right angles in everyday situations" }
          - { id: "AC9M3M06", level: "3", text: "recognise the relationships between dollars and cents and represent money values in different ways" }
      - id: "AC9M4M"
        text: "Measurement – Year 4"
        indicators:
          - { id: "AC9M4M01", level: "4", text: "interpret unmarked and partial units when measuring and comparing attributes of length, mass, capacity, duration and temperature, using scaled and digital instruments and appropriate units" }
          - { id: "AC9M4M02", level: "4", text: "recognise ways of measuring and approximating the perimeter and area of shapes and enclosed spaces, using appropriate formal and informal units" }
          - { id: "AC9M4M03", level: "4", text: "solve problems involving the duration of time including situations involving “am” and “pm” and conversions between units of time" }
          - { id: "AC9M4M04", level: "4", text: "estimate and compare angles using angle names including acute, obtuse, straight angle, reflex and revolution, and recognise their relationship to a right angle" }
      - id: "AC9M5M"
        text: "Measurement – Year 5"
        indicators:
          - { id: "AC9M5M01", level: "5", text: "choose appropriate metric units when measuring the length, mass and capacity of objects; use smaller units or a combination of units to obtain a more accurate measure" }
          - { id: "AC9M5M02", level: "5", text: "solve practical problems involving the perimeter and area of regular and irregular shapes using appropriate metric units" }
          - { id: "AC9M5M03", level: "5", text: "compare 12- and 24-hour time systems and solve practical problems involving the conversion between them" }
          - { id: "AC9M5M04", level: "5", text: "estimate, construct and measure angles in degrees, using appropriate tools including a protractor, and relate these measures to angle names" }
      - id: "AC9M6M"
        text: "Measurement – Year 6"
        indicators:
          - { id: "AC9M6M01", level: "6", text: "convert between common metric units of length, mass and capacity; choose and use decimal representations of metric measurements relevant to the context of a problem" }
          - { id: "AC9M6M02", level: "6", text: "establish the formula for the area of a rectangle and use it to solve practical problems" }
          - { id: "AC9M6M03", level: "6", text: "interpret and use timetables and itineraries to plan activities and determine the duration of events and journeys" }
          - { id: "AC9M6M04", level: "6", text: "identify the relationships between angles on a straight line, angles at a point and vertically opposite angles; use these to determine unknown angles, communicating reasoning" }
      - id: "AC9M7M"
        text: "Measurement – Year 7"
        indicators:
          - { id: "AC9M7M01", level: "7", text: "solve problems involving the area of triangles and parallelograms using established formulas and appropriate units" }
          - { id: "AC9M7M02", level: "7", text: "solve problems involving the volume of right prisms including rectangular and triangular prisms, using established formulas and appropriate units" }
          - { id: "AC9M7M03", level: "7", text: "describe the relationship between π and the features of circles including the circumference, radius and diameter" }
          - { id: "AC9M7M04", level: "7", text: "identify corresponding, alternate and co-interior relationships between angles formed when parallel lines are crossed by a transversal; use them to solve problems and explain reasons" }
          - { id: "AC9M7M05", level: "7", text: "demonstrate that the interior angle sum of a triangle in the plane is 180° and apply this to determine the interior angle sum of other shapes and the size of unknown angles" }
          - { id: "AC9M7M06", level: "7", text: "use mathematical modelling to solve practical problems involving ratios; formulate problems, interpret and communicate solutions in terms of the situation, justifying choices made about the representation" }
      - id: "AC9M8M"
        text: "Measurement – Year 8"
        indicators:
          - { id: "AC9M8M01", level: "8", text: "solve problems involving the area and perimeter of irregular and composite shapes using appropriate units" }
          - { id: "AC9M8M02", level: "8", text: "solve problems involving the volume and capacity of right prisms using appropriate units" }
          - { id: "AC9M8M03", level: "8", text: "solve problems involving the circumference and area of a circle using formulas and appropriate units" }
          - { id: "AC9M8M04", level: "8", text: "solve problems involving duration, including using 12- and 24-hour time across multiple time zones" }
          - { id: "AC9M8M05", level: "8", text: "recognise and use rates to solve problems involving the comparison of 2 related quantities of different units of measure" }
          - { id: "AC9M8M06", level: "8", text: "use Pythagoras’ theorem to solve problems involving the side lengths of right-angled triangles" }
          - { id: "AC9M8M07", level: "8", text: "use mathematical modelling to solve practical problems involving ratios and rates, including financial contexts; formulate problems; interpret and communicate solutions in terms of the situation, reviewing the appropriateness of the model" }
      - id: "AC9M9M"
        text: "Measurement – Year 9"
        indicators:
          - { id: "AC9M9M01", level: "9", text: "solve problems involving the volume and surface area of right prisms and cylinders using appropriate units" }
          - { id: "AC9M9M02", level: "9", text: "solve problems involving very small and very large measurements, time scales and intervals expressed in scientific notation" }
          - { id: "AC9M9M03", level: "9", text: "solve spatial problems, applying angle properties, scale, similarity, Pythagoras’ theorem and trigonometry in right-angled triangles" }
          - { id: "AC9M9M04", level: "9", text: "calculate and interpret absolute, relative and percentage errors in measurements, recognising that all measurements are estimates" }
          - { id: "AC9M9M05", level: "9", text: "use mathematical modelling to solve practical problems involving direct proportion, rates, ratio and scale, including financial contexts; formulate the problems and interpret solutions in terms of the situation; evaluate the model and report methods and findings" }
      - id: "AC9M10M"
        text: "Measurement – Year 10"
        indicators:
          - { id: "AC9M10M01", level: "10", text: "solve problems involving the surface area and volume of composite objects using appropriate units" }
          - { id: "AC9M10M02", level: "10", text: "interpret and use logarithmic scales in applied contexts involving small and large quantities and change" }
          - { id: "AC9M10M03", level: "10", text: "solve practical problems applying Pythagoras’ theorem and trigonometry of right-angled triangles, including problems involving direction and angles of elevation and depression" }
          - { id: "AC9M10M04", level: "10", text: "identify the impact of measurement errors on the accuracy of results in practical contexts" }
          - { id: "AC9M10M05", level: "10", text: "use mathematical modelling to solve practical problems involving proportion and scaling of objects; formulate problems and interpret solutions in terms of the situation; evaluate and modify models as necessary, and report assumptions, methods and findings" }
  - id: "SP"
    title: "Space"
    standards:
      - id: "AC9MFSP"
        text: "Space – Foundation"
        indicators:
          - { id: "AC9MFSP01", level: "F", text: "sort, name and create familiar shapes; recognise and describe familiar shapes within objects in the environment, giving reasons" }
          - { id: "AC9MFSP02", level: "F", text: "describe the position and location of themselves and objects in relation to other people and objects within a familiar space" }
      - id: "AC9M1SP"
        text: "Space – Year 1"
        indicators:
          - { id: "AC9M1SP01", level: "1", text: "make, compare and classify familiar shapes; recognise familiar shapes and objects in the environment, identifying the similarities and differences between them" }
          - { id: "AC9M1SP02", level: "1", text: "give and follow directions to move people and objects to different locations within a space" }
      - id: "AC9M2SP"
        text: "Space – Year 2"
        indicators:
          - { id: "AC9M2SP01", level: "2", text: "recognise, compare and classify shapes, referencing the number of sides and using spatial terms such as “opposite”, “parallel”, “curved” and “straight”" }
          - { id: "AC9M2SP02", level: "2", text: "locate positions in two-dimensional representations of a familiar space; move positions by following directions and pathways" }
      - id: "AC9M3SP"
        text: "Space – Year 3"
        indicators:
          - { id: "AC9M3SP01", level: "3", text: "make, compare and classify objects, identifying key features and explaining why these features make them suited to their uses" }
          - { id: "AC9M3SP02", level: "3", text: "interpret and create two-dimensional representations of familiar environments, locating key landmarks and objects relative to each other" }
      - id: "AC9M4SP"
        text: "Space – Year 4"
        indicators:
          - { id: "AC9M4SP01", level: "4", text: "represent and approximate composite shapes and objects in the environment, using combinations of familiar shapes and objects" }
          - { id: "AC9M4SP02", level: "4", text: "create and interpret grid reference systems using grid references and directions to locate and describe positions and pathways" }
          - { id: "AC9M4SP03", level: "4", text: "recognise line and rotational symmetry of shapes and create symmetrical patterns and pictures, using dynamic geometric software where appropriate" }
      - id: "AC9M5SP"
        text: "Space – Year 5"
        indicators:
          - { id: "AC9M5SP01", level: "5", text: "connect objects to their nets and build objects from their nets using spatial and geometric reasoning" }
          - { id: "AC9M5SP02", level: "5", text: "construct a grid coordinate system that uses coordinates to locate positions within a space; use coordinates and directional language to describe position and movement" }
          - { id: "AC9M5SP03", level: "5", text: "describe and perform translations, reflections and rotations of shapes, using dynamic geometric software where appropriate; recognise what changes and what remains the same, and identify any symmetries" }
      - id: "AC9M6SP"
        text: "Space – Year 6"
        indicators:
          - { id: "AC9M6SP01", level: "6", text: "compare the parallel cross-sections of objects and recognise their relationships to right prisms" }
          - { id: "AC9M6SP02", level: "6", text: "locate points in the 4 quadrants of a Cartesian plane; describe changes to the coordinates when a point is moved to a different position in the plane" }
          - { id: "AC9M6SP03", level: "6", text: "recognise and use combinations of transformations to create tessellations and other geometric patterns, using dynamic geometric software where appropriate" }
      - id: "AC9M7SP"
        text: "Space – Year 7"
        indicators:
          - { id: "AC9M7SP01", level: "7", text: "represent objects in 2 dimensions; discuss and reason about the advantages and disadvantages of different representations" }
          - { id: "AC9M7SP02", level: "7", text: "classify triangles, quadrilaterals and other polygons according to their side and angle properties; identify and reason about relationships" }
          - { id: "AC9M7SP03", level: "7", text: "describe transformations of a set of points using coordinates in the Cartesian plane, translations and reflections on an axis, and rotations about a given point" }
          - { id: "AC9M7SP04", level: "7", text: "design and create algorithms involving a sequence of steps and decisions that will sort and classify sets of shapes according to their attributes, and describe how the algorithms work" }
      - id: "AC9M8SP"
        text: "Space – Year 8"
        indicators:
          - { id: "AC9M8SP01", level: "8", text: "identify the conditions for congruence and similarity of triangles and explain the conditions for other sets of common shapes to be congruent or similar, including those formed by transformations" }
          - { id: "AC9M8SP02", level: "8", text: "establish properties of quadrilaterals using congruent triangles and angle properties, and solve related problems explaining reasoning" }
          - { id: "AC9M8SP03", level: "8", text: "describe the position and location of objects in 3 dimensions in different ways, including using a three-dimensional coordinate system with the use of dynamic geometric software and other digital tools" }
          - { id: "AC9M8SP04", level: "8", text: "design, create and test algorithms involving a sequence of steps and decisions that identify congruency or similarity of shapes, and describe how the algorithm works" }
      - id: "AC9M9SP"
        text: "Space – Year 9"
        indicators:
          - { id: "AC9M9SP01", level: "9", text: "recognise the constancy of the sine, cosine and tangent ratios for a given angle in right-angled triangles using properties of similarity" }
          - { id: "AC9M9SP02", level: "9", text: "apply the enlargement transformation to shapes and objects using dynamic geometry software as appropriate; identify and explain aspects that remain the same and those that change" }
          - { id: "AC9M9SP03", level: "9", text: "design, test and refine algorithms involving a sequence of steps and decisions based on geometric constructions and theorems; discuss and evaluate refinements" }
      - id: "AC9M10SP"
        text: "Space – Year 10"
        indicators:
          - { id: "AC9M10SP01", level: "10", text: "apply deductive reasoning to proofs involving shapes in the plane and use theorems to solve spatial problems" }
          - { id: "AC9M10SP02", level: "10", text: "interpret networks and network diagrams used to represent relationships in practical situations and describe connectedness" }
          - { id: "AC9M10SP03", level: "10", text: "design, test and refine solutions to spatial problems using algorithms and digital tools; communicate and justify solutions" }
  - id: "ST"
    title: "Statistics"
    standards:
      - id: "AC9MFST"
        text: "Statistics – Foundation"
        indicators:
          - { id: "AC9MFST01", level: "F", text: "collect, sort and compare data represented by objects and images in response to given investigative questions that relate to familiar situations" }
      - id: "AC9M1ST"
        text: "Statistics – Year 1"
        indicators:
          - { id: "AC9M1ST01", level: "1", text: "acquire and record data for categorical variables in various ways including using digital tools, objects, images, drawings, lists, tally marks and symbols" }
          - { id: "AC9M1ST02", level: "1", text: "represent collected data for a categorical variable using one-to-one displays and digital tools where appropriate; compare the data using frequencies and discuss the findings" }
      - id: "AC9M2ST"
        text: "Statistics – Year 2"
        indicators:
          - { id: "AC9M2ST01", level: "2", text: "acquire data for categorical variables through surveys, observation, experiment and using digital tools; sort data into relevant categories and display data using lists and tables" }
          - { id: "AC9M2ST02", level: "2", text: "create different graphical representations of data using software where appropriate; compare the different representations, identify and describe common and distinctive features in response to questions" }
      - id: "AC9M3ST"
        text: "Statistics – Year 3"
        indicators:
          - { id: "AC9M3ST01", level: "3", text: "acquire data for categorical and discrete numerical variables to address a question of interest or purpose by observing, collecting and accessing data sets; record the data using appropriate methods including frequency tables and spreadsheets" }
          - { id: "AC9M3ST02", level: "3", text: "create and compare different graphical representations of data sets including using software where appropriate; interpret the data in terms of the context" }
          - { id: "AC9M3ST03", level: "3", text: "conduct guided statistical investigations involving the collection, representation and interpretation of data for categorical and discrete numerical variables with respect to questions of interest" }
      - id: "AC9M4ST"
        text: "Statistics – Year 4"
        indicators:
          - { id: "AC9M4ST01", level: "4", text: "acquire data for categorical and discrete numerical variables to address a question of interest or purpose, using digital tools; represent data using many-to-one pictographs, column graphs and other displays or visualisations; interpret and discuss the information that has been created", note: "ข้อความตามเว็บไซต์ ACARA เอกสาร curriculum content (Word) พิมพ์ว่า \"acquire data for categorical and discrete numerical variables to address a question of interest or purpose using digital tools; represent data using many-to-one pictographs, column graphs and other displays or visualisations; interpret and discuss the information that has been created\" · เอกสาร scope and sequence พิมพ์ว่า \"acquire data for categorical and discrete numerical variables to address a question of interest or purpose using digital tools; represent data using many-to-one pictographs, column graphs and other displays or visualisations; interpret and discuss the information that has been created\"" }
          - { id: "AC9M4ST02", level: "4", text: "analyse the effectiveness of different displays or visualisations in illustrating and comparing data distributions, then discuss the shape of distributions and the variation in the data" }
          - { id: "AC9M4ST03", level: "4", text: "conduct statistical investigations, collecting data through survey responses and other methods; record and display data using digital tools; interpret the data and communicate the results" }
      - id: "AC9M5ST"
        text: "Statistics – Year 5"
        indicators:
          - { id: "AC9M5ST01", level: "5", text: "acquire, validate and represent data for nominal and ordinal categorical and discrete numerical variables, to address a question of interest or purpose using software including spreadsheets; discuss and report on data distributions in terms of highest frequency (mode) and shape, in the context of the data", note: "ข้อความตามเว็บไซต์ ACARA เอกสาร curriculum content (Word) พิมพ์ว่า \"acquire, validate and represent data for nominal and ordinal categorical and discrete numerical variables to address a question of interest or purpose using software including spreadsheets; discuss and report on data distributions in terms of highest frequency (mode) and shape, in the context of the data\" · เอกสาร scope and sequence พิมพ์ว่า \"acquire, validate and represent data for nominal and ordinal categorical and discrete numerical variables to address a question of interest or purpose using software including spreadsheets; discuss and report on data distributions in terms of highest frequency (mode) and shape, in the context of the data\"" }
          - { id: "AC9M5ST02", level: "5", text: "interpret line graphs representing change over time; discuss the relationships that are represented and conclusions that can be made" }
          - { id: "AC9M5ST03", level: "5", text: "plan and conduct statistical investigations by posing questions or identifying a problem and collecting relevant data; choose appropriate displays and interpret the data; communicate findings within the context of the investigation" }
      - id: "AC9M6ST"
        text: "Statistics – Year 6"
        indicators:
          - { id: "AC9M6ST01", level: "6", text: "interpret and compare data sets for ordinal and nominal categorical, discrete and continuous numerical variables using comparative displays or visualisations and digital tools; compare distributions in terms of mode, range and shape" }
          - { id: "AC9M6ST02", level: "6", text: "identify statistically informed arguments presented in traditional and digital media; discuss and critique methods, data representations and conclusions" }
          - { id: "AC9M6ST03", level: "6", text: "plan and conduct statistical investigations by posing and refining questions or identifying a problem and collecting relevant data; analyse and interpret the data and communicate findings within the context of the investigation" }
      - id: "AC9M7ST"
        text: "Statistics – Year 7"
        indicators:
          - { id: "AC9M7ST01", level: "7", text: "acquire data sets for discrete and continuous numerical variables and calculate the range, median, mean and mode; make and justify decisions about which measures of central tendency provide useful insights into the nature of the distribution of data" }
          - { id: "AC9M7ST02", level: "7", text: "create different types of numerical data displays including stem-and-leaf plots using software where appropriate; describe and compare the distribution of data, commenting on the shape, centre and spread including outliers and determining the range, median, mean and mode" }
          - { id: "AC9M7ST03", level: "7", text: "plan and conduct statistical investigations involving data for discrete and continuous numerical variables; analyse and interpret distributions of data and report findings in terms of shape and summary statistics", note: "เอกสาร scope and sequence พิมพ์ว่า \"plan and conduct statistical investigations involving data for discrete and continuous numerical variables ; analyse and interpret distributions of data and report findings in terms of shape and summary statistics\"" }
      - id: "AC9M8ST"
        text: "Statistics – Year 8"
        indicators:
          - { id: "AC9M8ST01", level: "8", text: "investigate techniques for data collection including census, sampling, experiment and observation, and explain the practicalities and implications of obtaining data through these techniques" }
          - { id: "AC9M8ST02", level: "8", text: "analyse and report on the distribution of data from primary and secondary sources using random and non-random sampling techniques to select and study samples" }
          - { id: "AC9M8ST03", level: "8", text: "compare variations in distributions and proportions obtained from random samples of the same size drawn from a population and recognise the effect of sample size on this variation" }
          - { id: "AC9M8ST04", level: "8", text: "plan and conduct statistical investigations involving samples of a population; use ethical and fair methods to make inferences about the population and report findings, acknowledging uncertainty" }
      - id: "AC9M9ST"
        text: "Statistics – Year 9"
        indicators:
          - { id: "AC9M9ST01", level: "9", text: "analyse reports of surveys in digital media and elsewhere for information on how data was obtained to estimate population means and medians" }
          - { id: "AC9M9ST02", level: "9", text: "analyse how different sampling methods can affect the results of surveys and how choice of representation can be used to support a particular point of view" }
          - { id: "AC9M9ST03", level: "9", text: "represent the distribution of multiple data sets for numerical variables using comparative representations; compare data distributions with consideration of centre, spread and shape, and the effect of outliers on these measures" }
          - { id: "AC9M9ST04", level: "9", text: "choose appropriate forms of display or visualisation for a given type of data; justify selections and interpret displays for a given context" }
          - { id: "AC9M9ST05", level: "9", text: "plan and conduct statistical investigations involving the collection and analysis of different kinds of data; report findings and discuss the strength of evidence to support any conclusions" }
      - id: "AC9M10ST"
        text: "Statistics – Year 10"
        indicators:
          - { id: "AC9M10ST01", level: "10", text: "analyse claims, inferences and conclusions of statistical reports in the media, including ethical considerations and identification of potential sources of bias" }
          - { id: "AC9M10ST02", level: "10", text: "compare data distributions for continuous numerical variables using appropriate data displays including boxplots; discuss the shapes of these distributions in terms of centre, spread, shape and outliers in the context of the data" }
          - { id: "AC9M10ST03", level: "10", text: "construct scatterplots and comment on the association between the 2 numerical variables in terms of strength, direction and linearity" }
          - { id: "AC9M10ST04", level: "10", text: "construct two-way tables and discuss possible relationship between categorical variables" }
          - { id: "AC9M10ST05", level: "10", text: "plan and conduct statistical investigations of situations that involve bivariate data; evaluate and report findings with consideration of limitations of any inferences" }
  - id: "P"
    title: "Probability"
    standards:
      - id: "AC9M3P"
        text: "Probability – Year 3"
        indicators:
          - { id: "AC9M3P01", level: "3", text: "identify practical activities and everyday events involving chance; describe possible outcomes and events as ‘likely’ or ‘unlikely’ and identify some events as ‘certain’ or ‘impossible’ explaining reasoning", note: "เอกสาร scope and sequence พิมพ์ว่า \"identify practical activities and everyday events that involve chance; describe possible outcomes and events as ‘likely’ or ‘unlikely’ and identify some events as ‘certain’ or ‘impossible’ explaining reasoning\"" }
          - { id: "AC9M3P02", level: "3", text: "conduct repeated chance experiments; identify and describe possible outcomes, record the results, recognise and discuss the variation" }
      - id: "AC9M4P"
        text: "Probability – Year 4"
        indicators:
          - { id: "AC9M4P01", level: "4", text: "describe possible everyday events and the possible outcomes of chance experiments and order outcomes or events based on their likelihood of occurring; identify independent or dependent events" }
          - { id: "AC9M4P02", level: "4", text: "conduct repeated chance experiments to observe relationships between outcomes; identify and describe the variation in results", note: "เอกสาร scope and sequence พิมพ์ว่า \"conduct repeated chance experiments to observe relationships between outcomes in games and other chance situations, and identify and describe the variation in results\"" }
      - id: "AC9M5P"
        text: "Probability – Year 5"
        indicators:
          - { id: "AC9M5P01", level: "5", text: "list the possible outcomes of chance experiments involving equally likely outcomes and compare to those which are not equally likely" }
          - { id: "AC9M5P02", level: "5", text: "conduct repeated chance experiments including those with and without equally likely outcomes, observe and record the results; use frequency to compare outcomes and estimate their likelihoods", note: "ข้อความตามเว็บไซต์ ACARA เอกสาร curriculum content (Word) พิมพ์ว่า \"conduct repeated chance experiments including those with and without equally likely outcomes, observe and record the results ; use frequency to compare outcomes and estimate their likelihoods\"" }
      - id: "AC9M6P"
        text: "Probability – Year 6"
        indicators:
          - { id: "AC9M6P01", level: "6", text: "recognise that probabilities lie on numerical scales of 0 – 1 or 0% – 100% and use estimation to assign probabilities that events occur in a given context, using common fractions, percentages and decimals" }
          - { id: "AC9M6P02", level: "6", text: "conduct repeated chance experiments and run simulations with an increasing number of trials using digital tools; compare observations with expected results and discuss the effect on variation of increasing the number of trials" }
      - id: "AC9M7P"
        text: "Probability – Year 7"
        indicators:
          - { id: "AC9M7P01", level: "7", text: "identify the sample space for single-stage events; assign probabilities to the outcomes of these events and predict relative frequencies for related events" }
          - { id: "AC9M7P02", level: "7", text: "conduct repeated chance experiments and run simulations with a large number of trials using digital tools; compare predictions about outcomes with observed results, explaining the differences" }
      - id: "AC9M8P"
        text: "Probability – Year 8"
        indicators:
          - { id: "AC9M8P01", level: "8", text: "recognise that complementary events have a combined probability of one; use this relationship to calculate probabilities in applied contexts" }
          - { id: "AC9M8P02", level: "8", text: "determine all possible combinations for 2 events, using two-way tables, tree diagrams and Venn diagrams, and use these to determine probabilities of specific outcomes in practical situations" }
          - { id: "AC9M8P03", level: "8", text: "conduct repeated chance experiments and simulations, using digital tools to determine probabilities for compound events, and describe results" }
      - id: "AC9M9P"
        text: "Probability – Year 9"
        indicators:
          - { id: "AC9M9P01", level: "9", text: "list all outcomes for compound events both with and without replacement, using lists, tree diagrams, tables or arrays; assign probabilities to outcomes" }
          - { id: "AC9M9P02", level: "9", text: "calculate relative frequencies from given or collected data to estimate probabilities of events involving “and”, inclusive “or” and exclusive “or”" }
          - { id: "AC9M9P03", level: "9", text: "design and conduct repeated chance experiments and simulations, using digital tools to compare probabilities of simple events to related compound events, and describe results" }
      - id: "AC9M10P"
        text: "Probability – Year 10"
        indicators:
          - { id: "AC9M10P01", level: "10", text: "use the language of “if ... then”, “given”, “of”, “knowing that” to describe and interpret situations involving conditional probability" }
          - { id: "AC9M10P02", level: "10", text: "design and conduct repeated chance experiments and simulations using digital tools to model conditional probability and interpret results" }
  - id: "10A"
    title: "Optional content for post-Year 10 mathematics pathways"
    standards:
      - id: "AU-M10A-N"
        text: "Number – suggested content"
        indicators:
          - { id: "AU-M10A-N-01", level: "10A", text: "operations on numbers involving fractional exponents and surds" }
      - id: "AU-M10A-A"
        text: "Algebra – suggested content"
        indicators:
          - { id: "AU-M10A-A-01", level: "10A", text: "simplification of combinations of linear expressions with rational coefficients and the solution of related equations" }
          - { id: "AU-M10A-A-02", level: "10A", text: "algebraic representations of quadratic functions of the form f(x) = ax^2 + bx + c where a, b and c are non-zero integers, and their transformation to the form f(x) = a(x + h)^2 + k where h and k are non-zero rational numbers, and the solution of related equations", note: "ต้นฉบับแยกข้อนี้เป็นสองแถวในตาราง รวมเป็นข้อเดียวและเติมช่องว่างที่ขาด (\"wherea\")" }
          - { id: "AU-M10A-A-03", level: "10A", text: "the graphs of y = sin(x) and y = cos(x) as functions of a real variable and the solution of related equations" }
          - { id: "AU-M10A-A-04", level: "10A", text: "the inverse relationship between exponential functions and logarithmic functions and the solution of related equations" }
      - id: "AU-M10A-M"
        text: "Measurement – suggested content"
        indicators:
          - { id: "AU-M10A-M-01", level: "10A", text: "the effect of increasingly small changes in the value of variables on the average rate of change and in relation to limiting values" }
      - id: "AU-M10A-SP"
        text: "Space – suggested content"
        indicators:
          - { id: "AU-M10A-SP-01", level: "10A", text: "relationships between angles and various lines associated with circles (radii, diameters, chords, tangents)" }
      - id: "AU-M10A-ST"
        text: "Statistics – suggested content"
        indicators:
          - { id: "AU-M10A-ST-01", level: "10A", text: "measures of spread, their interpretation and usefulness with respect to different data distributions" }
      - id: "AU-M10A-P"
        text: "Probability – suggested content"
        indicators:
          - { id: "AU-M10A-P-01", level: "10A", text: "counting principles, and factorial notation as a representation that provides efficient counting in multiplicative contexts, including calculations of probabilities" }
