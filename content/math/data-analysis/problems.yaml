problems:
  - id: math.stats.data-analysis.p001
    topics: [math.stats.data-analysis]
    difficulty: 1
    type: mcq
    stem: "ข้อใดเป็นคำถามทางสถิติ"
    choices:
      - { id: a, text: "นักเรียนห้อง ม.2/3 แต่ละคนมีพี่น้องกี่คน", correct: true }
      - { id: b, text: "ห้อง ม.2/3 มีนักเรียนกี่คน", feedback: "คำถามนี้มีคำตอบเดียว (นับครั้งเดียวก็รู้) ไม่มีความแปรปรวน" }
      - { id: c, text: "ฉันสูงกี่เซนติเมตร", feedback: "ถามค่าของคนคนเดียว ได้ตัวเลขตัวเดียว ไม่ต้องเก็บข้อมูลหลายค่า" }
    hints:
      - "คำถามทางสถิติคาดว่าคำตอบจะไม่เท่ากัน"
      - "ข้อใดต้องเก็บข้อมูลจากหลายคนแล้วได้คำตอบต่างกัน"
    solution: "จำนวนพี่น้องของแต่ละคนต่างกัน ต้องเก็บข้อมูลหลายค่าแล้วดูภาพรวม จึงเป็นคำถามทางสถิติ อีกสองข้อมีคำตอบเดียว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.data-analysis.p002
    topics: [math.stats.data-analysis]
    difficulty: 1
    type: match
    stem: "จับคู่ข้อมูลกับชนิดของข้อมูล"
    pairs:
      - { left: "สีที่ชอบ", right: "เชิงคุณภาพ ไม่มีลำดับ" }
      - { left: "ระดับความพอใจ (น้อย ปานกลาง มาก)", right: "เชิงคุณภาพ มีลำดับ" }
      - { left: "จำนวนพี่น้อง", right: "เชิงปริมาณ ไม่ต่อเนื่อง" }
      - { left: "ส่วนสูง", right: "เชิงปริมาณ ต่อเนื่อง" }
    hints:
      - "ข้อมูลเชิงปริมาณเป็นตัวเลขที่นำมาคำนวณได้ ข้อมูลเชิงคุณภาพเป็นกลุ่มหรือประเภท"
      - "ข้อมูลที่นับได้เป็นจำนวนเต็มคือไม่ต่อเนื่อง ข้อมูลที่วัดได้ละเอียดเท่าไรก็ได้คือต่อเนื่อง"
    solution: "สีเป็นกลุ่มที่ไม่มีลำดับ ความพอใจเป็นกลุ่มที่เรียงลำดับได้ จำนวนพี่น้องนับได้เป็นจำนวนเต็ม ส่วนสูงวัดได้ละเอียดเป็นทศนิยม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.data-analysis.p003
    topics: [math.stats.data-analysis]
    difficulty: 2
    type: numeric
    stem: "จากแผนภาพจุด เวลานอนที่เป็นฐานนิยมคือกี่ชั่วโมง (ตอบในหน่วยชั่วโมง)"
    figure: { src: sleep-dot-plot.svg, alt: "แผนภาพจุดเวลานอนต่อคืนของนักเรียน 16 คน เส้นจำนวนจาก 6 ถึง 9 ชั่วโมง แบ่งทีละครึ่งชั่วโมง จำนวนจุด: 6 ครึ่ง มี 1 จุด, 7 มี 3 จุด, 7 ครึ่ง มี 4 จุด, 8 มี 5 จุด, 8 ครึ่ง มี 2 จุด, 9 มี 1 จุด" }
    answer: { value: 8, unit: ชั่วโมง }
    hints:
      - "ฐานนิยมคือค่าที่มีข้อมูลมากที่สุด"
      - "หาเสาที่มีจุดสูงที่สุด แล้วอ่านค่าบนเส้นจำนวน"
    misconceptions:
      - { match: 5, feedback: "5 คือจำนวนนักเรียน (ความถี่) ฐานนิยมคือค่าบนเส้นจำนวนที่มีจุดมากที่สุด" }
    solution: "เสาที่สูงที่สุดมี 5 จุดอยู่เหนือ 8 ฐานนิยมจึงเป็น 8 ชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.data-analysis.p004
    topics: [math.stats.data-analysis]
    difficulty: 2
    type: numeric
    stem: "จากแผนภาพจุดเวลานอน นักเรียนที่นอนนานที่สุดนอนนานกว่านักเรียนที่นอนน้อยที่สุดกี่ชั่วโมง (ตอบในหน่วยชั่วโมง)"
    figure: { src: sleep-dot-plot.svg, alt: "แผนภาพจุดเวลานอนต่อคืนของนักเรียน 16 คน เส้นจำนวนจาก 6 ถึง 9 ชั่วโมง แบ่งทีละครึ่งชั่วโมง จำนวนจุด: 6 ครึ่ง มี 1 จุด, 7 มี 3 จุด, 7 ครึ่ง มี 4 จุด, 8 มี 5 จุด, 8 ครึ่ง มี 2 จุด, 9 มี 1 จุด" }
    answer: { value: 2.5, tolerance: 0.01, unit: ชั่วโมง }
    hints:
      - "ค่าน้อยที่สุดและมากที่สุดคือจุดซ้ายสุดและขวาสุด ไม่ใช่ปลายเส้นจำนวน"
      - "พิสัย = ค่ามากที่สุด − ค่าน้อยที่สุด"
    misconceptions:
      - { match: 3, feedback: "ใช้ปลายเส้นจำนวน 6 ถึง 9 แต่ไม่มีใครนอน 6 ชั่วโมง จุดซ้ายสุดอยู่ที่ 6 ครึ่ง" }
    solution: "ค่าน้อยสุด $6\\tfrac12$ ชั่วโมง ค่ามากสุด 9 ชั่วโมง ต่างกัน $9 - 6\\tfrac12 = 2\\tfrac12$ ชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.data-analysis.p005
    topics: [math.stats.data-analysis]
    difficulty: 2
    type: numeric
    stem: "แผนภาพต้นใบแสดงอายุของผู้บริจาคโลหิตที่หน่วยรับบริจาคเคลื่อนที่ในวันหนึ่ง มีผู้บริจาคที่อายุน้อยกว่า 30 ปีกี่คน (ตอบเป็นจำนวนคน)"
    figure: { src: donor-stem-leaf.svg, alt: "แผนภาพต้นใบอายุผู้บริจาคโลหิต 15 คน 1 | 8 หมายถึง 18 ปี ต้น 1 ใบ 8 9 ต้น 2 ใบ 1 3 3 5 8 ต้น 3 ใบ 0 2 4 5 8 ต้น 4 ใบ 1 5 ต้น 5 ใบ 2" }
    answer: { value: 7, unit: คน }
    hints:
      - "อายุน้อยกว่า 30 คืออยู่ในต้น 1 และต้น 2"
      - "นับใบในสองแถวนั้น"
    misconceptions:
      - { match: 8, feedback: "นับ 30 ปีด้วย โจทย์ถามน้อยกว่า 30 ปี" }
      - { match: 5, feedback: "นับแค่ต้น 2 ลืมต้น 1 (18 และ 19 ปี)" }
    solution: "ต้น 1 มี 2 คน (18, 19) ต้น 2 มี 5 คน (21, 23, 23, 25, 28) รวม 7 คน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.data-analysis.p006
    topics: [math.stats.data-analysis]
    difficulty: 2
    type: numeric
    stem: "จากแผนภาพต้นใบอายุผู้บริจาคโลหิต 15 คน มัธยฐานของอายุคือกี่ปี (ตอบในหน่วยปี)"
    figure: { src: donor-stem-leaf.svg, alt: "แผนภาพต้นใบอายุผู้บริจาคโลหิต 15 คน 1 | 8 หมายถึง 18 ปี ต้น 1 ใบ 8 9 ต้น 2 ใบ 1 3 3 5 8 ต้น 3 ใบ 0 2 4 5 8 ต้น 4 ใบ 1 5 ต้น 5 ใบ 2" }
    answer: { value: 30, unit: ปี }
    hints:
      - "ข้อมูลเรียงแล้ว 15 ตัว มัธยฐานอยู่ตำแหน่ง $\\tfrac{15 + 1}{2}$"
      - "นับจากค่าน้อยที่สุดไปถึงตัวที่ 8"
    misconceptions:
      - { match: 8, feedback: "8 คือตำแหน่งของมัธยฐาน ต้องอ่านค่าของข้อมูลตัวที่ 8" }
      - { match: 35, feedback: "นั่นคือกึ่งกลางระหว่าง 18 กับ 52 มัธยฐานคือค่าที่อยู่ตรงกลางเมื่อเรียงข้อมูล ไม่ใช่กึ่งกลางของพิสัย" }
    solution: "ตำแหน่ง $\\tfrac{15 + 1}{2} = 8$ นับ 18, 19, 21, 23, 23, 25, 28, **30** ข้อมูลตัวที่ 8 คือ 30 ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.data-analysis.p007
    topics: [math.stats.data-analysis]
    difficulty: 3
    type: numeric
    stem: "จากแผนภาพต้นใบอายุผู้บริจาคโลหิต 15 คน หาควอร์ไทล์ที่ 1 ($Q_1$) โดยใช้ตำแหน่ง $\\tfrac{r(N+1)}{4}$ (ตอบในหน่วยปี)"
    figure: { src: donor-stem-leaf.svg, alt: "แผนภาพต้นใบอายุผู้บริจาคโลหิต 15 คน 1 | 8 หมายถึง 18 ปี ต้น 1 ใบ 8 9 ต้น 2 ใบ 1 3 3 5 8 ต้น 3 ใบ 0 2 4 5 8 ต้น 4 ใบ 1 5 ต้น 5 ใบ 2" }
    answer: { value: 23, unit: ปี }
    hints:
      - "ตำแหน่งของ $Q_1 = \\tfrac{1 \\times (15 + 1)}{4}$"
      - "อ่านค่าข้อมูลตัวที่ 4 จากน้อยไปมาก"
    misconceptions:
      - { match: 4, feedback: "4 คือตำแหน่ง ต้องอ่านค่าของข้อมูลตัวที่ 4" }
      - { match: 21, feedback: "ใช้ตำแหน่ง $\\tfrac{rN}{4} = 3.75$ แล้วปัดลง สูตรในบทนี้คือ $\\tfrac{r(N+1)}{4}$" }
    solution: "ตำแหน่ง $= \\tfrac{1 \\times 16}{4} = 4$ ข้อมูลตัวที่ 4 คือ 23 ปี จึงได้ $Q_1 = 23$ ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.data-analysis.p008
    topics: [math.stats.data-analysis]
    difficulty: 3
    type: numeric
    stem: "แม่ค้าเทน้ำมะพร้าวใส่แก้วขนาดเท่ากัน 8 ใบ ได้ปริมาณ (ลิตร) $\\tfrac18, \\tfrac28, \\tfrac38, \\tfrac48, \\tfrac48, \\tfrac58, \\tfrac68, \\tfrac78$ ถ้าเทรวมกันแล้วแบ่งใส่ 8 แก้วให้เท่ากัน แต่ละแก้วจะมีน้ำมะพร้าวกี่ลิตร (ตอบในหน่วยลิตร)"
    answer: { value: 0.5, tolerance: 0.01, unit: ลิตร }
    hints:
      - "รวมปริมาณทั้งหมดก่อน: บวกตัวเศษเพราะตัวส่วนเท่ากัน"
      - "แล้วหารผลรวมด้วย 8"
    misconceptions:
      - { match: 4, feedback: "4 ลิตรคือปริมาณรวม ยังต้องแบ่งให้ 8 แก้ว" }
    solution: "ผลรวม $= \\tfrac{1+2+3+4+4+5+6+7}{8} = \\tfrac{32}{8} = 4$ ลิตร แบ่ง 8 แก้ว ได้แก้วละ $4 \\div 8 = \\tfrac12$ ลิตร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.data-analysis.p009
    topics: [math.stats.data-analysis]
    difficulty: 3
    type: mcq
    stem: "สมชายสอบวัดความรู้ได้คะแนนตรงกับเปอร์เซ็นไทล์ที่ 85 ข้อใดอธิบายถูกต้อง"
    choices:
      - { id: a, text: "ประมาณร้อยละ 85 ของผู้สอบได้คะแนนไม่เกินคะแนนของสมชาย", correct: true }
      - { id: b, text: "สมชายตอบถูกร้อยละ 85 ของข้อสอบ", feedback: "เปอร์เซ็นไทล์บอกตำแหน่งเทียบกับผู้สอบคนอื่น ไม่ได้บอกร้อยละของคะแนนที่ได้" }
      - { id: c, text: "สมชายได้ 85 คะแนน", feedback: "85 คือลำดับของเปอร์เซ็นไทล์ ไม่ใช่คะแนน คะแนนจริงอาจเป็นเท่าไรก็ได้" }
      - { id: d, text: "มีผู้สอบ 85 คนที่ได้คะแนนน้อยกว่าสมชาย", feedback: "เปอร์เซ็นไทล์เป็นร้อยละของผู้สอบทั้งหมด ไม่ใช่จำนวนคน" }
    hints:
      - "เปอร์เซ็นไทล์แบ่งข้อมูลที่เรียงแล้วเป็น 100 ส่วน"
      - "$P_{85}$ คือค่าที่ข้อมูลประมาณร้อยละ 85 มีค่าไม่เกินค่านี้"
    solution: "$P_{85}$ หมายถึงข้อมูลประมาณร้อยละ 85 มีค่าไม่เกินค่านี้ คะแนนของสมชายจึงสูงกว่าหรือเท่ากับผู้สอบประมาณร้อยละ 85"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.data-analysis.p010
    topics: [math.stats.data-analysis]
    difficulty: 3
    type: mcq
    stem: "แผนภาพจุดของรายได้ต่อวันของร้านค้าในตลาดนัดแห่งหนึ่ง จุดส่วนใหญ่กองอยู่ทางซ้าย และมีไม่กี่จุดกระจายออกไปไกลทางขวา ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ข้อมูลเบ้ขวา และค่าเฉลี่ยน่าจะมากกว่ามัธยฐาน", correct: true }
      - { id: b, text: "ข้อมูลเบ้ซ้าย และค่าเฉลี่ยน่าจะน้อยกว่ามัธยฐาน", feedback: "ชื่อของความเบ้เรียกตามทิศของหาง หางยาวไปทางขวาจึงเป็นเบ้ขวา" }
      - { id: c, text: "ข้อมูลสมมาตร ค่าเฉลี่ยเท่ากับมัธยฐาน", feedback: "ข้อมูลกองทางเดียวและมีหางยาวอีกทาง จึงไม่สมมาตร" }
      - { id: d, text: "ข้อมูลเบ้ขวา และค่าเฉลี่ยน่าจะน้อยกว่ามัธยฐาน", feedback: "ค่าที่สูงมากในหางดึงค่าเฉลี่ยขึ้น แต่แทบไม่กระทบมัธยฐาน ค่าเฉลี่ยจึงมากกว่า" }
    hints:
      - "เรียกชื่อความเบ้ตามทิศที่หางยาวออกไป"
      - "ค่าที่สูงมากไม่กี่ค่ามีผลกับค่าเฉลี่ยหรือมัธยฐานมากกว่ากัน"
    solution: "หางยาวไปทางขวาคือเบ้ขวา ร้านที่รายได้สูงมากไม่กี่ร้านดึงค่าเฉลี่ยให้สูงขึ้น ขณะที่มัธยฐานขึ้นกับลำดับเท่านั้น ค่าเฉลี่ยจึงน่าจะมากกว่ามัธยฐาน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.data-analysis.p011
    topics: [math.stats.data-analysis]
    difficulty: 3
    type: order
    stem: "เรียงขั้นตอนการใช้สถิติตอบคำถามว่า \"นักเรียน ม.2 ใช้เวลาเดินทางมาโรงเรียนนานเท่าใด\""
    items:
      - "ตั้งคำถามทางสถิติให้ชัดว่าจะเก็บข้อมูลอะไรจากใคร"
      - "เก็บรวบรวมข้อมูลเวลาเดินทางของนักเรียน"
      - "นำเสนอข้อมูลด้วยแผนภาพจุดหรือแผนภาพต้นใบ"
      - "หาค่ากลาง การกระจาย และตำแหน่งที่ของข้อมูล"
      - "แปลความหมายและใช้ผลประกอบการตัดสินใจ"
    hints:
      - "ต้องรู้ว่าจะถามอะไรก่อนจึงเก็บข้อมูลได้"
      - "วิเคราะห์ได้หลังจากจัดและนำเสนอข้อมูลแล้ว"
    solution: "ตั้งคำถาม → เก็บข้อมูล → นำเสนอ → วิเคราะห์ → แปลความหมายและตัดสินใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.data-analysis.p012
    topics: [math.stats.data-analysis]
    difficulty: 3
    type: numeric
    stem: "จากแผนภาพต้นใบอายุผู้บริจาคโลหิต 15 คน หาควอร์ไทล์ที่ 3 ($Q_3$) (ตอบในหน่วยปี)"
    figure: { src: donor-stem-leaf.svg, alt: "แผนภาพต้นใบอายุผู้บริจาคโลหิต 15 คน 1 | 8 หมายถึง 18 ปี ต้น 1 ใบ 8 9 ต้น 2 ใบ 1 3 3 5 8 ต้น 3 ใบ 0 2 4 5 8 ต้น 4 ใบ 1 5 ต้น 5 ใบ 2" }
    answer: { value: 38, unit: ปี }
    hints:
      - "ตำแหน่งของ $Q_3 = \\tfrac{3(15 + 1)}{4}$"
      - "อ่านค่าข้อมูลตัวที่ 12"
    misconceptions:
      - { match: 12, feedback: "12 คือตำแหน่ง ต้องอ่านค่าของข้อมูลตัวที่ 12" }
      - { match: 41, feedback: "นับเกินไปหนึ่งตำแหน่ง ข้อมูลตัวที่ 12 คือ 38 ส่วน 41 เป็นตัวที่ 13" }
    solution: "ตำแหน่ง $= \\tfrac{3 \\times 16}{4} = 12$ ข้อมูลตัวที่ 12 คือ 38 ปี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: math.stats.data-analysis.p013
    topics: [math.stats.data-analysis]
