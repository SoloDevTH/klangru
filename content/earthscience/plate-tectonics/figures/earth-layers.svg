<line x1="580.3" y1="420" x2="580.3" y2="428" stroke="#111"/>
<text x="580.3" y="444.0" text-anchor="middle" font-size="12" fill="#222">2,890</text>
<line x1="463.2" y1="420" x2="463.2" y2="428" stroke="#111"/>
<text x="463.2" y="444.0" text-anchor="middle" font-size="12" fill="#222">5,150</text>
<line x1="400.0" y1="420" x2="400.0" y2="428" stroke="#111"/>
<text x="400.0" y="444.0" text-anchor="middle" font-size="12" fill="#222">6,371</text>
<text x="565.0" y="462.0" text-anchor="middle" font-size="12" fill="#475569">ความลึกจากผิวโลก (km) วาดตามมาตราส่วน ยกเว้นความหนาของเปลือกโลก</text>
