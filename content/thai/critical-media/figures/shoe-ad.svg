<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" font-family="'Sarabun','Noto Sans Thai','Noto Sans Thai UI','Leelawadee UI','Tahoma','Loma',sans-serif">
<title>โฆษณาสมมติ รองเท้าวิ่งตราลมกรด</title>
<defs></defs>
<rect x="0" y="0" width="700" height="500" fill="#fff"/>
<rect x="10.0" y="10.0" width="680.0" height="480.0" rx="18" fill="#0d47a1" stroke="#0d47a1" stroke-width="1.5"/>
<text x="350.0" y="62.0" font-size="30" text-anchor="middle" fill="#fff" font-weight="bold">รองเท้าวิ่ง ตราลมกรด</text>
<text x="350.0" y="88.0" font-size="14" text-anchor="middle" fill="#bbdefb" font-weight="normal">(โฆษณาสมมติ)</text>
<text x="350.0" y="150.0" font-size="24" text-anchor="middle" fill="#fff" font-weight="bold">นักวิ่งทั่วประเทศเลือกใช้!</text>
<text x="350.0" y="206.0" font-size="24" text-anchor="middle" fill="#fff" font-weight="bold">ดาราดังใส่วิ่งทุกเช้า</text>
<text x="350.0" y="262.0" font-size="24" text-anchor="middle" fill="#fff" font-weight="bold">สูตรพื้นนุ่มพิเศษ วิ่งไกลไม่รู้จบ</text>
<text x="350.0" y="318.0" font-size="24" text-anchor="middle" fill="#ffeb3b" font-weight="bold">ผู้ใช้ 9 ใน 10 คนพอใจ*</text>
<text x="350.0" y="374.0" font-size="24" text-anchor="middle" fill="#ff8a80" font-weight="bold">เหลือเพียง 20 คู่ ลดราคาวันนี้วันเดียว!</text>
<text x="350.0" y="432.0" font-size="20" text-anchor="middle" fill="#fff" font-weight="normal">ราคาปกติ 1,990 บาท เหลือ 1,490 บาท</text>
<text x="30.0" y="474.0" font-size="14" text-anchor="start" fill="#bbdefb" font-weight="normal">* สำรวจจากผู้ซื้อ 10 คนที่ร้านสาขาแรก</text>
</svg>
