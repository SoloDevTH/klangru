<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="sans-serif">
<title>ฝนตกแนวดิ่งเมื่อมองจากพื้นถนน และฝนดูเฉียงเมื่อมองจากรถที่วิ่งไปข้างหน้า</title>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f2937"/></marker><marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="ao" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c2410c"/></marker></defs>
<rect width="720" height="300" fill="#ffffff"/>
<text x="190.0" y="30.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">มองจากพื้นถนน</text>
<line x1="30" y1="230" x2="350" y2="230" stroke="#334155" stroke-width="2"/>
<rect x="120" y="170" width="150" height="45" rx="8" fill="#f97316" fill-opacity="0.85" stroke="#7c2d12"/>
<rect x="150" y="150" width="90" height="25" rx="5" fill="#fdba74" stroke="#7c2d12"/>
<circle cx="150" cy="222" r="11" fill="#1f2937"/><circle cx="245" cy="222" r="11" fill="#1f2937"/>
<line x1="285.0" y1="192.0" x2="360.0" y2="192.0" stroke="#c2410c" stroke-width="3" marker-end="url(#ao)"/>
<text x="322.0" y="180.0" text-anchor="middle" font-size="12" fill="#c2410c" font-weight="normal">รถ 20 m/s</text>
<line x1="80" y1="55" x2="80" y2="80" stroke="#64748b" stroke-width="1.5"/>
<line x1="140" y1="55" x2="140" y2="80" stroke="#64748b" stroke-width="1.5"/>
<line x1="200" y1="55" x2="200" y2="80" stroke="#64748b" stroke-width="1.5"/>
<line x1="260" y1="55" x2="260" y2="80" stroke="#64748b" stroke-width="1.5"/>
<line x1="320" y1="55" x2="320" y2="80" stroke="#64748b" stroke-width="1.5"/>
<line x1="200.0" y1="95.0" x2="200.0" y2="132.0" stroke="#0369a1" stroke-width="3" marker-end="url(#ab)"/>
<text x="200.0" y="88.0" text-anchor="middle" font-size="12" fill="#111" font-weight="normal"></text>
<text x="260.0" y="118.0" text-anchor="start" font-size="12" fill="#0369a1" font-weight="normal">ฝนตกแนวดิ่ง 10 m/s</text>
<text x="470.0" y="30.0" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">มองจากในรถ</text>
<line x1="470" y1="140" x2="470" y2="220" stroke="#94a3b8" stroke-dasharray="4 4"/>
<circle cx="470" cy="210" r="6" fill="#c2410c"/>
<text x="470.0" y="232.0" text-anchor="middle" font-size="12" fill="#c2410c" font-weight="normal">รถ</text>
<line x1="590.0" y1="150.0" x2="470.0" y2="210.0" stroke="#0369a1" stroke-width="3" marker-end="url(#ab)"/>
<text x="510.0" y="128.0" text-anchor="middle" font-size="12" fill="#0369a1" font-weight="normal">ฝนเทียบกับรถ (ความเร็วสัมพัทธ์)</text>
<text x="462.0" y="170.0" text-anchor="end" font-size="12" fill="#64748b" font-weight="normal">แนวดิ่ง</text>
<text x="360.0" y="286.0" text-anchor="middle" font-size="12" fill="#444" font-weight="normal">ฝนดูเฉียงจากรถ เพราะความเร็วสัมพัทธ์ = ความเร็วฝนบนพื้น − ความเร็วรถ</text>
</svg>