id: earthscience.astronomy.eclipses-space-tech
subject: earthscience
title: { th: สุริยุปราคา จันทรุปราคา และเทคโนโลยีอวกาศ, en: "Eclipses and space technology" }
summary: การเกิดสุริยุปราคาและจันทรุปราคาจากแบบจำลองเงามืดเงามัว การเปรียบเทียบสองปรากฏการณ์ พัฒนาการของเทคโนโลยีอวกาศ และดาวเทียมที่ใช้ในชีวิตประจำวัน
difficulty: 2.2
minutes: 30
prerequisites: [earthscience.astronomy.moon-solar-system]
encompasses:
  - { id: earthscience.astronomy.moon-solar-system, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: แบบจำลองสุริยุปราคา
    src: solar-eclipse.svg
    alt: "ดวงอาทิตย์ทางซ้าย ดวงจันทร์อยู่ตรงกลาง โลกทางขวา ทั้งสามเรียงเป็นแนวเดียวกัน เส้นประจากขอบดวงอาทิตย์ผ่านขอบดวงจันทร์แบ่งเงาของดวงจันทร์เป็นสองส่วน เงามืดสีดำเป็นกรวยแคบลงเรื่อย ๆ แตะผิวโลกเป็นจุดเล็ก ๆ คนตรงนั้นเห็นสุริยุปราคาเต็มดวง เงามัวสีเทากว้างออกรอบเงามืด คนในเงามัวเห็นดวงอาทิตย์แหว่งบางส่วน ตำแหน่งนี้ตรงกับวันเดือนดับ"
    caption: "เงามืดของดวงจันทร์ตกบนโลกเป็นบริเวณแคบ ๆ เท่านั้น (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: บอกชนิดของอุปราคาจากตำแหน่ง
    problem: "คืนวันเพ็ญคืนหนึ่ง ดวงอาทิตย์ โลก และดวงจันทร์เรียงเป็นเส้นตรงพอดี จะเกิดปรากฏการณ์ใด และคนไทยที่อยู่ด้านกลางคืนของโลกจะเห็นดวงจันทร์เป็นอย่างไร"
    steps:
      - text: "วันเพ็ญ ดวงจันทร์อยู่ด้านตรงข้ามกับดวงอาทิตย์ โลกจึงอยู่ตรงกลาง"
      - text: "วัตถุตรงกลางทอดเงาไปหาวัตถุด้านหลัง เงาของโลกจึงตกบนดวงจันทร์ เกิดจันทรุปราคา"
        why: "ถ้าดวงจันทร์อยู่ตรงกลาง เงาของดวงจันทร์จะตกบนโลก ซึ่งเป็นสุริยุปราคา และเกิดได้เฉพาะวันเดือนดับ"
      - text: "เรียงเป็นเส้นตรงพอดี ดวงจันทร์จึงเข้าไปในเงามืดทั้งดวง เป็นจันทรุปราคาเต็มดวง"
      - text: "แสงอาทิตย์ที่ผ่านบรรยากาศของโลกหักเหเข้าไปในเงา แสงสีแดงผ่านได้มากที่สุด ดวงจันทร์จึงเป็นสีแดงอิฐ"
    answer: "จันทรุปราคาเต็มดวง ทุกคนที่อยู่ด้านกลางคืนเห็นดวงจันทร์เป็นสีแดงอิฐ ดูด้วยตาเปล่าได้อย่างปลอดภัย"
  - { type: check, problem: earthscience.astronomy.eclipses-space-tech.p004, prompt: "อะไรอยู่ตรงกลาง เงาของมันตกบนอะไร" }
  - type: figure
    title: แบบจำลองจันทรุปราคา
    src: lunar-eclipse.svg
    alt: "ดวงอาทิตย์ทางซ้าย โลกอยู่ตรงกลาง ดวงจันทร์ทางขวา เงามืดของโลกเป็นกรวยสีดำยาวไปทางขวา ล้อมรอบด้วยเงามัวสีเทาที่กว้างออก ดวงจันทร์เคลื่อนที่ขึ้นตามเส้นประผ่านเงาของโลก ขณะอยู่ในเงามืดดวงจันทร์เป็นสีแดงอิฐ ตำแหน่งนี้ตรงกับวันเพ็ญ"
    caption: "เงาของโลกใหญ่กว่าดวงจันทร์มาก ดวงจันทร์จึงอยู่ในเงามืดได้นานกว่าหนึ่งชั่วโมง (วาดโดยทีมคลังรู้ ไม่ได้ตามมาตราส่วน)"
  - type: worked-example
    title: ทำไมไม่เกิดอุปราคาทุกเดือน
    problem: "ดวงจันทร์โคจรรอบโลกเดือนละครั้ง มีวันเพ็ญและวันเดือนดับทุกเดือน แต่ทำไมอุปราคาเกิดเพียงปีละไม่กี่ครั้ง"
    steps:
      - text: "อุปราคาเกิดได้เมื่อดวงอาทิตย์ โลก และดวงจันทร์อยู่ในแนวเส้นตรงเดียวกันพอดี"
      - text: "วงโคจรของดวงจันทร์เอียงจากระนาบวงโคจรของโลกประมาณ 5 องศา"
      - text: "วันเพ็ญส่วนใหญ่ ดวงจันทร์จึงผ่านสูงหรือต่ำกว่าเงาของโลก และวันเดือนดับส่วนใหญ่ เงาของดวงจันทร์ก็ผ่านเหนือหรือใต้โลกไป"
        why: "เงามีขนาดจำกัด เอียงเพียง 5 องศาที่ระยะไกลขนาดนั้นก็พลาดเงาได้"
      - text: "แนวเส้นตรงพอดีเกิดในช่วงที่เรียกว่าฤดูอุปราคา ซึ่งมาถึงทุกประมาณ 6 เดือน"
    answer: "เพราะวงโคจรของดวงจันทร์เอียงประมาณ 5 องศา ส่วนใหญ่ทั้งสามดวงจึงไม่เรียงเป็นแนวเดียวกันพอดี"
  - { type: check, problem: earthscience.astronomy.eclipses-space-tech.p006, prompt: "วงโคจรของดวงจันทร์อยู่ระนาบเดียวกับวงโคจรของโลกหรือไม่" }
glossary:
  - { term: สุริยุปราคา, definition: "ปรากฏการณ์ที่ดวงจันทร์อยู่ระหว่างดวงอาทิตย์กับโลก เงาของดวงจันทร์ตกบนโลก เกิดในวันเดือนดับ" }
  - { term: จันทรุปราคา, definition: "ปรากฏการณ์ที่โลกอยู่ระหว่างดวงอาทิตย์กับดวงจันทร์ ดวงจันทร์เข้าไปในเงาของโลก เกิดในวันเพ็ญ" }
  - { term: เงามืด, definition: "ส่วนของเงาที่แสงจากแหล่งกำเนิดถูกบังทั้งหมด" }
  - { term: เงามัว, definition: "ส่วนของเงาที่แสงถูกบังเพียงบางส่วน อยู่รอบเงามืด" }
  - { term: สุริยุปราคาวงแหวน, definition: "สุริยุปราคาที่ดวงจันทร์ดูเล็กกว่าดวงอาทิตย์เล็กน้อย บังไม่มิด เห็นขอบดวงอาทิตย์เป็นวงแหวนสว่าง" }
  - { term: ดาวเทียม, definition: "วัตถุที่โคจรรอบดาวดวงอื่น ดาวเทียมที่มนุษย์สร้างใช้สื่อสาร นำทาง พยากรณ์อากาศ และสำรวจทรัพยากร" }
  - { term: ไทยโชต, definition: "ดาวเทียมสำรวจทรัพยากรดวงแรกของไทย (THEOS) ขึ้นสู่อวกาศ พ.ศ. 2551 ดูแลโดย GISTDA" }
flashcards:
  - { front: "สุริยุปราคาเกิดเมื่อใด", back: "ดวงจันทร์อยู่ระหว่างดวงอาทิตย์กับโลกในแนวเดียวกัน ตรงกับวันเดือนดับ" }
  - { front: "จันทรุปราคาเกิดเมื่อใด", back: "โลกอยู่ระหว่างดวงอาทิตย์กับดวงจันทร์ ดวงจันทร์เข้าไปในเงาโลก ตรงกับวันเพ็ญ" }
  - { front: "ทำไมดวงจันทร์บังดวงอาทิตย์ได้พอดี", back: "ดวงอาทิตย์ใหญ่กว่าประมาณ 400 เท่า แต่ไกลกว่าประมาณ 400 เท่า บนฟ้าจึงดูใหญ่พอ ๆ กัน" }
  - { front: "ดูสุริยุปราคาอย่างปลอดภัยได้อย่างไร", back: "ใช้แว่นกรองแสงสำหรับดูดวงอาทิตย์โดยเฉพาะ หรือดูภาพที่ฉายผ่านรูเล็ก ๆ ห้ามใช้แว่นกันแดด" }
  - { front: "ยกตัวอย่างดาวเทียมในชีวิตประจำวัน", back: "ดาวเทียมอุตุนิยมวิทยา ดาวเทียมนำทาง (GPS) ดาวเทียมสื่อสาร และดาวเทียมสำรวจทรัพยากร เช่น ไทยโชต" }
