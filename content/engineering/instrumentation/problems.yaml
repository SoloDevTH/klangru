  - การสอบเทียบใช้หาและแก้ค่าที่เลื่อนนี้
  solution: ค่าที่เลื่อนไปทางเดียวกันทุกครั้งคือความคลาดเคลื่อนเชิงระบบ การสอบเทียบเทียบกับค่าอ้างอิงแล้วใส่ค่าชดเชยได้ ส่วนการอ่านซ้ำช่วยลดได้เฉพาะความคลาดเคลื่อนสุ่ม
