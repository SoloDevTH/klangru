  - id: math.calculus.shells-arc-length.p018
    topics: [math.calculus.shells-arc-length]
    difficulty: 5
    type: numeric
    stem: "ถ้วยใส่น้ำจิ้มมีผิวด้านในที่ได้จากการหมุนเส้นโค้ง $y=\\frac{x^2}{4}$ บนช่วง $0\\le x\\le 4$ รอบแกน $y$ (หน่วยเซนติเมตร) ปากถ้วยอยู่ที่ระดับ $y=4$ จงหาความจุของถ้วยเมื่อเติมจนเต็มปาก (ทศนิยม 2 ตำแหน่ง หน่วยลูกบาศก์เซนติเมตร)"
    answer: { value: 100.53, tolerance: 0.01, unit: ลูกบาศก์เซนติเมตร }
    hints:
      - "ของเหลวอยู่ระหว่างเส้นโค้ง $y=\\frac{x^2}{4}$ กับเส้น $y=4$"
      - "ใช้วิธีเปลือกทรงกระบอก รัศมีคือ $x$ และความสูงคือ $4-\\frac{x^2}{4}$"
      - "ความจุคือ $\\int_0^4 2\\pi x\\left(4-\\frac{x^2}{4}\\right)dx$"
    misconceptions:
      - { match: 50.27, feedback: "50.27 คือ $16\\pi$ เกิดจากลืมตัวประกอบ 2 ใน $2\\pi$ ของสูตรเปลือกทรงกระบอก" }
      - { match: 201.06, feedback: "201.06 คือ $64\\pi$ ซึ่งเป็นปริมาตรทรงกระบอกรัศมี 4 สูง 4 ที่ครอบถ้วยไว้ ต้องหักส่วนใต้ผิวถ้วยออก" }
    solution: "$V=\\int_0^4 2\\pi x\\left(4-\\frac{x^2}{4}\\right)dx=2\\pi\\left[2x^2-\\frac{x^4}{16}\\right]_0^4=2\\pi(32-16)=32\\pi\\approx 100.53$ ลูกบาศก์เซนติเมตร"
