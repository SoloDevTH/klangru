  <text x="370.0" y="95.0" font-size="15" text-anchor="start" fill="#15211e">13 ÷ 12 ได้ 1  เขียน 1 เหนือหลักร้อย</text>
  <text x="370.0" y="150.0" font-size="15" text-anchor="start" fill="#15211e">1 × 12 = 12  ลบ 13 − 12 = 1  ดึง 5 ลงมาเป็น 15</text>
  <text x="370.0" y="205.0" font-size="15" text-anchor="start" fill="#15211e">15 ÷ 12 ได้ 1  เหลือ 3  ดึง 8 ลงมาเป็น 38</text>
  <text x="370.0" y="260.0" font-size="15" text-anchor="start" fill="#15211e">38 ÷ 12 ได้ 3  3 × 12 = 36  เหลือเศษ 2</text>
  <text x="370.0" y="315.0" font-size="15" text-anchor="start" fill="#0a6b60" font-weight="bold">ตอบ 113 เศษ 2   ตรวจ: 12 × 113 + 2 = 1,358</text>
