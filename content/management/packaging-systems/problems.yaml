    hints:
      - "ต้องรู้พื้นที่บนพาเลทก่อน จึงนับได้ว่าวางกล่องกี่กล่องต่อชั้น"
      - "การตรวจแรงกดทำหลังรู้จำนวนชั้นและน้ำหนักของทั้งกองแล้ว"
