    ai_assisted: true

  - id: math.pyth.p016
    topics: [math.geometry.pythagoras]
    difficulty: 3
    type: numeric
    stem: "ร้านกาแฟแห่งหนึ่งทำทางลาดสำหรับรถเข็นคนพิการ ให้สูงขึ้น $0.5\\ \\mathrm{m}$ ในระยะตามแนวราบ $6\\ \\mathrm{m}$ (ความชัน $1 : 12$ ตามที่กฎกระทรวงกำหนด) พื้นทางลาดยาวกี่เมตร (ตอบทศนิยม 2 ตำแหน่ง ในหน่วย m)"
