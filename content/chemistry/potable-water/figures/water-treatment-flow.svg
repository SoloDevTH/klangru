<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="sans-serif"><title>ขั้นตอนการผลิตน้ำประปาจากน้ำผิวดิน</title><defs><marker id="arr1d3557" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/></marker></defs><rect width="900" height="400" fill="#fff"/><rect x="35.0" y="50.0" width="170.0" height="96.0" rx="8" fill="#e3f0fb" stroke="#1d3557" stroke-width="1.6"/>
<text x="120.0" y="84.2" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">1 รับน้ำดิบ</text>
<text x="120.0" y="103.2" font-size="15" fill="#222" text-anchor="middle">แม่น้ำ คลอง</text>
<text x="120.0" y="122.2" font-size="15" fill="#222" text-anchor="middle">อ่างเก็บน้ำ</text>
