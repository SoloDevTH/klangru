<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="sans-serif" font-size="14">
<title>งบคาร์บอน: คาร์บอนไดออกไซด์ที่ปล่อยไปแล้วกับที่เหลือ</title>
<rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
<text x="380.0" y="28.0" text-anchor="middle" font-size="15" fill="#111" font-weight="bold">งบคาร์บอน (หน่วย พันล้านตัน CO₂ หรือ Gt CO₂)</text>
<text x="40.0" y="70.0" text-anchor="start" font-size="13" fill="#111" font-weight="bold">เป้าหมาย 1.5 °C (โอกาสสำเร็จ 50%)</text>
<rect x="40.0" y="80.0" width="430.2" height="40.0" rx="0" fill="#57534e" stroke="#fff" stroke-width="1"/>
<text x="255.1" y="105.0" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">ปล่อยไปแล้ว ค.ศ. 1850–2019 ราว 2,390</text>
<rect x="470.2" y="80.0" width="90.0" height="40.0" rx="0" fill="#f97316" stroke="#fff" stroke-width="1"/>
<text x="515.2" y="105.0" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">เหลือ 500</text>
<text x="40.0" y="180.0" text-anchor="start" font-size="13" fill="#111" font-weight="bold">เป้าหมาย 2 °C (โอกาสสำเร็จ 67%)</text>
<rect x="40.0" y="190.0" width="430.2" height="40.0" rx="0" fill="#57534e" stroke="#fff" stroke-width="1"/>
<text x="255.1" y="215.0" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">ปล่อยไปแล้ว ราว 2,390</text>
<rect x="470.2" y="190.0" width="207.0" height="40.0" rx="0" fill="#2563eb" stroke="#fff" stroke-width="1"/>
<text x="573.7" y="215.0" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">เหลือ 1,150</text>
<line x1="40.0" y1="250.0" x2="40.0" y2="256.0" stroke="#334155" stroke-width="1"/>
<text x="40.0" y="272.0" text-anchor="middle" font-size="11" fill="#222">0</text>
<line x1="220.0" y1="250.0" x2="220.0" y2="256.0" stroke="#334155" stroke-width="1"/>
<text x="220.0" y="272.0" text-anchor="middle" font-size="11" fill="#222">1,000</text>
<line x1="400.0" y1="250.0" x2="400.0" y2="256.0" stroke="#334155" stroke-width="1"/>
<text x="400.0" y="272.0" text-anchor="middle" font-size="11" fill="#222">2,000</text>
<line x1="580.0" y1="250.0" x2="580.0" y2="256.0" stroke="#334155" stroke-width="1"/>
<text x="580.0" y="272.0" text-anchor="middle" font-size="11" fill="#222">3,000</text>
<line x1="40.0" y1="250.0" x2="688.0" y2="250.0" stroke="#334155" stroke-width="1"/>
<text x="40.0" y="308.0" text-anchor="start" font-size="11" fill="#555">งบที่เหลือนับตั้งแต่ต้น ค.ศ. 2020 ตามรายงาน IPCC AR6 คณะทำงานที่ 1</text>
<text x="40.0" y="324.0" text-anchor="start" font-size="11" fill="#555">ทั้งโลกปล่อย CO₂ ราว 40 Gt ต่อปี (ค่าโดยประมาณ)</text>
</svg>