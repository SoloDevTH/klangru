<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" font-family="sans-serif" font-size="15">
  <title>สัญลักษณ์ผังงานที่ใช้บ่อย</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15211e"/></marker></defs>
  <rect x="0" y="0" width="640" height="200" fill="#ffffff"/>
  <rect x="20.0" y="47.0" width="120" height="46" rx="23.0" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="80" y="75" text-anchor="middle" font-size="15" fill="#15211e" font-weight="normal">เริ่ม</text>
  <polygon points="181.0,47.0 305.0,47.0 289.0,93.0 165.0,93.0" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="235" y="75" text-anchor="middle" font-size="15" fill="#15211e" font-weight="normal">รับ / แสดง</text>
  <rect x="335.0" y="47.0" width="130" height="46" fill="#e2f0ed" stroke="#15211e" stroke-width="2"/>
  <text x="400" y="75" text-anchor="middle" font-size="15" fill="#15211e" font-weight="normal">x = x + 1</text>
  <polygon points="560,32.0 625.0,70 560,108.0 495.0,70" fill="#fff4e8" stroke="#15211e" stroke-width="2"/>
  <text x="560" y="75" text-anchor="middle" font-size="15" fill="#15211e" font-weight="normal">x &gt; 5 ?</text>
  <text x="80" y="145" text-anchor="middle" font-size="15" fill="#15211e" font-weight="bold">เริ่มต้น หรือ จบ</text>
  <text x="80" y="169" text-anchor="middle" font-size="13" fill="#4a5a56" font-weight="normal">(วงรี)</text>
  <text x="235" y="145" text-anchor="middle" font-size="15" fill="#15211e" font-weight="bold">รับข้อมูล หรือ แสดงผล</text>
  <text x="235" y="169" text-anchor="middle" font-size="13" fill="#4a5a56" font-weight="normal">(สี่เหลี่ยมด้านขนาน)</text>
  <text x="400" y="145" text-anchor="middle" font-size="15" fill="#15211e" font-weight="bold">ประมวลผล คำนวณ</text>
  <text x="400" y="169" text-anchor="middle" font-size="13" fill="#4a5a56" font-weight="normal">(สี่เหลี่ยมผืนผ้า)</text>
  <text x="560" y="145" text-anchor="middle" font-size="15" fill="#15211e" font-weight="bold">ตัดสินใจ ตามเงื่อนไข</text>
  <text x="560" y="169" text-anchor="middle" font-size="13" fill="#4a5a56" font-weight="normal">(สี่เหลี่ยมข้าวหลามตัด)</text>
</svg>
