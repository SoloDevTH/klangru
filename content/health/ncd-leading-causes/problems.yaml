problems:
- id: health.disease.ncd-leading-causes.p001
  topics:
  - health.disease.ncd-leading-causes
  difficulty: 1
  type: mcq
  stem: โรคใดเป็นโรคไม่ติดต่อ
  choices:
  - id: a
    text: เบาหวาน
    correct: true
  - id: b
    text: ไข้เลือดออก
    feedback: เกิดจากไวรัสที่ยุงลายเป็นพาหะ จึงเป็นโรคติดต่อ
  - id: c
    text: วัณโรค
    feedback: เกิดจากเชื้อแบคทีเรีย ติดต่อทางการหายใจ
  - id: d
    text: ไข้หวัดใหญ่
    feedback: เกิดจากไวรัส ติดต่อจากคนสู่คน
  hints:
  - โรคไม่ติดต่อไม่ได้เกิดจากเชื้อโรค
  - ค่อย ๆ เกิดจากพฤติกรรมและปัจจัยหลายอย่าง
  solution: เบาหวานเป็นโรคไม่ติดต่อเรื้อรัง ส่วนไข้เลือดออก วัณโรค และไข้หวัดใหญ่เกิดจากเชื้อและติดต่อได้
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.disease.ncd-leading-causes.p002
  topics:
  - health.disease.ncd-leading-causes
  difficulty: 1
  type: mcq
  stem: จากกราฟ ในปี 2566 โรคไม่ติดต่อหลักโรคใดมีอัตราตายสูงที่สุดในห้าโรคนี้
  choices:
  - id: a
    text: หลอดเลือดสมอง
    correct: true
  - id: b
    text: หัวใจขาดเลือด
    feedback: สูงเป็นอันดับสอง 33.53 ต่อแสนคน
  - id: c
    text: เบาหวาน
    feedback: 22.03 ต่อแสนคน ต่ำกว่าหลอดเลือดสมองมาก
  - id: d
    text: ทางเดินหายใจเรื้อรัง
    feedback: ต่ำที่สุดในกลุ่มนี้ แต่เพิ่มขึ้นเร็ว
  hints:
  - ดูแท่งสีเข้มที่สุดของแต่ละโรค
  - แท่งที่สูงที่สุดอยู่ทางซ้าย
  solution: ปี 2566 โรคหลอดเลือดสมองมีอัตราตาย 58.30 ต่อประชากรแสนคน สูงที่สุดในห้าโรคหลักและสูงต่อเนื่องตั้งแต่ปี 2564
  figure: &id001
    src: death-rates.svg
    alt: กราฟแท่งอัตราตายต่อประชากรแสนคน ปี 2564, 2565, 2566 ที่มา มรณบัตร รวบรวมโดยกองโรคไม่ติดต่อ หลอดเลือดสมอง 55.53, 58.02, 58.30 หัวใจขาดเลือด 33.54, 35.07, 33.53 เบาหวาน 24.55, 25.87, 22.03 ความดันโลหิตสูง 14.48, 15.43, 13.47 ทางเดินหายใจเรื้อรัง 8.00, 9.33, 13.26
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.disease.ncd-leading-causes.p003
  topics:
  - health.disease.ncd-leading-causes
  difficulty: 2
  type: numeric
  stem: กรมควบคุมโรคระบุว่าคนไทยเสียชีวิตจากโรคไม่ติดต่อปีละกว่า 400,000 ราย ถ้าใช้ 400,000 รายต่อปี เฉลี่ยวันละประมาณกี่ราย (ใช้ 365 วัน ตอบทศนิยม 1 ตำแหน่ง)
  answer:
    value: 1095.9
    tolerance: 2
    unit: ราย/วัน
  misconceptions:
  - match: 33333.3
    feedback: นี่คือค่าเฉลี่ยต่อเดือน
  - match: 7692.3
    feedback: นี่คือค่าเฉลี่ยต่อสัปดาห์
  hints:
  - หารด้วยจำนวนวันใน 1 ปี
  - 400,000 ÷ 365
  solution: $400{,}000 \div 365 \approx 1095.9$ ราย ตรงกับที่กรมควบคุมโรคระบุว่าวันละมากกว่า 1,000 คน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.disease.ncd-leading-causes.p004
  topics:
  - health.disease.ncd-leading-causes
  difficulty: 2
  type: mcq
  stem: ข้อใดเป็นปัจจัยเสี่ยงของโรคไม่ติดต่อที่ **แก้ไขได้** (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: สูบบุหรี่
    correct: true
    feedback: ถูก
  - id: b
    text: กินเค็มและหวานจัด
    correct: true
    feedback: ถูก
  - id: c
    text: มีกิจกรรมทางกายไม่เพียงพอ
    correct: true
    feedback: ถูก
  - id: d
    text: อายุมากขึ้น
    feedback: แก้ไขไม่ได้ แต่ยิ่งต้องดูแลปัจจัยอื่น
  - id: e
    text: พ่อแม่เป็นเบาหวาน
    feedback: พันธุกรรมแก้ไม่ได้ แต่ปรับพฤติกรรมเพื่อลดโอกาสได้
  hints:
  - ปัจจัยที่เป็นพฤติกรรมแก้ไขได้
  - อายุและพันธุกรรมเปลี่ยนไม่ได้
  solution: บุหรี่ อาหาร และกิจกรรมทางกายเป็นปัจจัยที่แก้ไขได้ ส่วนอายุและพันธุกรรมแก้ไขไม่ได้ ผู้มีประวัติครอบครัวจึงควรดูแลพฤติกรรมให้ดียิ่งขึ้นและตรวจคัดกรองตามวัย
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.disease.ncd-leading-causes.p005
  topics:
  - health.disease.ncd-leading-causes
  difficulty: 2
  type: match
  stem: จับคู่กลุ่มโรคไม่ติดต่อหลักกับตัวอย่าง
  pairs:
  - left: โรคหัวใจและหลอดเลือด
    right: หลอดเลือดสมองตีบจนเป็นอัมพาต
  - left: โรคทางเดินหายใจเรื้อรัง
    right: ปอดอุดกั้นเรื้อรังในผู้สูบบุหรี่มานาน
  - left: โรคมะเร็ง
    right: มะเร็งตับและท่อน้ำดี
  - left: โรคเบาหวาน
    right: ระดับน้ำตาลในเลือดสูงเรื้อรัง
  hints:
  - หลอดเลือดสมองอยู่ในกลุ่มหัวใจและหลอดเลือด
  - ปอดอุดกั้นเรื้อรังเกี่ยวกับการหายใจ
  solution: หลอดเลือดสมอง = หัวใจและหลอดเลือด ปอดอุดกั้นเรื้อรัง = ทางเดินหายใจเรื้อรัง มะเร็งตับ = มะเร็ง น้ำตาลในเลือดสูงเรื้อรัง = เบาหวาน
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.disease.ncd-leading-causes.p006
  topics:
  - health.disease.ncd-leading-causes
  difficulty: 3
  type: numeric
  stem: จากกราฟ ปี 2566 อัตราตายจากโรคหลอดเลือดสมองเป็นกี่เท่าของโรคหัวใจขาดเลือด (ตอบทศนิยม 2 ตำแหน่ง)
  answer:
    value: 1.74
    tolerance: 0.02
    unit: เท่า
  misconceptions:
  - match: 24.77
    feedback: นี่คือผลต่าง ไม่ใช่จำนวนเท่า
  - match: 0.58
    feedback: หารกลับด้าน
  hints:
  - อ่านค่าของปี 2566 ทั้งสองโรค
  - 58.30 ÷ 33.53
  solution: $58.30 \div 33.53 \approx 1.74$ เท่า
  figure: *id001
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.disease.ncd-leading-causes.p007
  topics:
  - health.disease.ncd-leading-causes
  difficulty: 3
  type: numeric
  stem: จากภาพ ความชุกของโรคอ้วนในคนไทยอายุ 15 ปีขึ้นไปเพิ่มจากร้อยละ 28.6 (2546–2547) เป็นร้อยละ 45 (2567–2568) คิดเป็นการเพิ่มขึ้นกี่เปอร์เซ็นต์จากค่าเดิม
  answer:
    value: 57.3
    tolerance: 0.5
    unit: '%'
  misconceptions:
  - match: 16.4
    feedback: นี่คือผลต่างของร้อยละ (จุดร้อยละ) ยังไม่ได้เทียบกับค่าเดิม
  - match: 36.4
    feedback: ต้องหารด้วยค่าเดิม 28.6
  hints:
  - ใช้ (ค่าใหม่ − ค่าเดิม) ÷ ค่าเดิม × 100
  - ค่าเดิมคือ 28.6
  solution: $\frac{45 - 28.6}{28.6} \times 100 \approx 57.3\%$ ตรงกับที่กรมควบคุมโรครายงานว่าโรคอ้วนเพิ่มขึ้นร้อยละ 57.3 ในรอบ 20 ปี
  figure:
    src: prevalence.svg
    alt: แผนภาพจุดคู่ร้อยละของประชากรอายุ 15 ปีขึ้นไป สำรวจปี 2546–2547 เทียบ 2567–2568 โรคอ้วน 28.6 เป็น 45 อ้วนลงพุง 26 เป็น 44.7 ความดันโลหิตสูง 22 เป็น 29.5 เบาหวาน 6.6 เป็น 10.6
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.disease.ncd-leading-causes.p008
  topics:
  - health.disease.ncd-leading-causes
  difficulty: 3
  type: mcq
  stem: กรมควบคุมโรครายงานว่าช่วงปี 2546–2568 การสูบบุหรี่ลดจากร้อยละ 25.3 เป็น 18.5 แต่การมีกิจกรรมทางกายต่ำเพิ่มจากร้อยละ 22.6 เป็น 42.6 ข้อสรุปใดสมเหตุสมผลที่สุด
  choices:
  - id: a
    text: ปัจจัยเสี่ยงที่น่ากังวลที่สุดตอนนี้คือการเคลื่อนไหวน้อย ควรเพิ่มมาตรการส่งเสริมกิจกรรมทางกาย
    correct: true
  - id: b
    text: ไม่ต้องรณรงค์เรื่องบุหรี่อีกแล้ว
    feedback: ยังมีผู้สูบเกือบหนึ่งในห้า และบุหรี่ยังเป็นปัจจัยภาระโรคอันดับสอง
  - id: c
    text: โรคไม่ติดต่อจะลดลงแน่นอนเพราะคนสูบบุหรี่น้อยลง
    feedback: ปัจจัยอื่นแย่ลง และความชุกของโรคอ้วน เบาหวาน ความดันเพิ่มขึ้น
  - id: d
    text: กิจกรรมทางกายไม่เกี่ยวกับโรคไม่ติดต่อ
    feedback: การเคลื่อนไหวน้อยเป็นหนึ่งในตัวเร่งหลักที่กรมควบคุมโรคระบุ
  hints:
  - ดูทิศทางของแต่ละปัจจัย
  - ปัจจัยใดเพิ่มเกือบเท่าตัว
  solution: การสูบบุหรี่ลดลงเป็นข่าวดี แต่การมีกิจกรรมทางกายต่ำเพิ่มเกือบเท่าตัว จึงเป็นปัจจัยที่ควรเร่งแก้ เช่น สร้างพื้นที่ออกกำลังกายและลดเวลานั่งหน้าจอ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.disease.ncd-leading-causes.p009
  topics:
  - health.disease.ncd-leading-causes
  difficulty: 3
  type: order
  stem: เรียงลำดับเส้นทางจากพฤติกรรมเสี่ยงไปสู่ผลรุนแรงของโรคหลอดเลือดสมอง
  items:
  - กินเค็มจัดและไม่ออกกำลังกายเป็นเวลาหลายปี
  - ความดันโลหิตสูงขึ้นโดยไม่รู้ตัว
  - หลอดเลือดสมองเสื่อมและตีบหรือแตก
  - เป็นอัมพาตหรือเสียชีวิต
  hints:
  - พฤติกรรมนำไปสู่ปัจจัยด้านเมตาบอลิกก่อน
  - ความดันโลหิตสูงมักไม่มีอาการ
  solution: พฤติกรรมเสี่ยง → ปัจจัยด้านเมตาบอลิก (ความดันสูง) → หลอดเลือดเสียหาย → ทุพพลภาพหรือเสียชีวิต การตรวจวัดความดันช่วยตัดวงจรได้ตั้งแต่ขั้นที่สอง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.disease.ncd-leading-causes.p010
  topics:
  - health.disease.ncd-leading-causes
  difficulty: 3
  type: numeric
  stem: จากกราฟ อัตราตายจากโรคทางเดินหายใจเรื้อรังเพิ่มขึ้นจากปี 2564 ถึงปี 2566 กี่รายต่อประชากรแสนคน
  answer:
    value: 5.26
    tolerance: 0.01
    unit: ต่อแสนคน
  misconceptions:
  - match: 21.26
    feedback: ต้องลบ ไม่ใช่บวก
  - match: 3.93
    feedback: ต้องใช้ค่าปี 2564 คือ 8.00 ไม่ใช่ปี 2565
  hints:
  - อ่านค่าปี 2564 และปี 2566
  - 13.26 − 8.00
  solution: $13.26 - 8.00 = 5.26$ ต่อประชากรแสนคน แม้อัตราต่ำที่สุดในห้าโรค แต่เพิ่มเร็วจึงควรเฝ้าระวัง เช่น ลดการสูบบุหรี่และมลพิษทางอากาศ
  figure: *id001
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.disease.ncd-leading-causes.p011
  topics:
  - health.disease.ncd-leading-causes
  difficulty: 4
  type: mcq
  stem: มาตรการใดเป็นการป้องกันโรคไม่ติดต่อใน **ระดับสังคม** (เลือกทุกข้อที่ถูก)
  multiple: true
  choices:
  - id: a
    text: เก็บภาษีเครื่องดื่มที่มีน้ำตาลสูง
    correct: true
    feedback: ถูก
  - id: b
    text: สร้างทางเดินและทางจักรยานที่ปลอดภัย
    correct: true
    feedback: ถูก
  - id: c
    text: ให้โรงเรียนเลิกขายน้ำอัดลม
    correct: true
    feedback: ถูก
  - id: d
    text: กำหนดเขตปลอดบุหรี่
    correct: true
    feedback: ถูก
  - id: e
    text: ตั้งใจเดินขึ้นบันไดแทนลิฟต์ของตัวเอง
    feedback: เป็นพฤติกรรมระดับบุคคล
  hints:
  - ระดับสังคมคือมาตรการที่เปลี่ยนสิ่งแวดล้อมหรือนโยบายสำหรับทุกคน
  - การตัดสินใจของคนคนเดียวเป็นระดับบุคคล
  solution: ภาษี การออกแบบเมือง นโยบายโรงเรียน และกฎหมายยาสูบเป็นมาตรการระดับสังคม ซึ่งช่วยให้คนเลือกพฤติกรรมที่ดีได้ง่ายขึ้น ส่วนการเดินขึ้นบันไดเป็นระดับบุคคล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.disease.ncd-leading-causes.p012
  topics:
  - health.disease.ncd-leading-causes
  difficulty: 4
  type: numeric
  stem: จังหวัด ก มีประชากร 500,000 คน อัตราตายจากโรคหลอดเลือดสมอง 60 ต่อแสนคน จังหวัด ข มีประชากร 2,000,000 คน อัตราตาย 40 ต่อแสนคน (ข้อมูลสมมติ) จังหวัด ข มีผู้เสียชีวิตจากโรคนี้มากกว่าจังหวัด ก กี่ราย
  answer:
    value: 500.0
    unit: ราย
  misconceptions:
  - match: 20
    feedback: นี่คือผลต่างของอัตรา ไม่ใช่จำนวนผู้ตาย
  - match: -500
    feedback: จังหวัด ข มีผู้ตายมากกว่า คำตอบจึงเป็นค่าบวก
  hints:
  - จำนวนผู้ตาย = อัตรา × ประชากร ÷ 100,000
  - จังหวัด ก ได้ 300 ราย หาของจังหวัด ข แล้วลบกัน
  solution: จังหวัด ก $60 \times 500{,}000 \div 100{,}000 = 300$ ราย จังหวัด ข $40 \times 2{,}000{,}000 \div 100{,}000 = 800$ ราย ต่างกัน $500$ ราย แม้อัตราของ ข ต่ำกว่า แต่จำนวนผู้ตายมากกว่าเพราะประชากรมากกว่า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: health.disease.ncd-leading-causes.p013
  topics:
  - health.disease.ncd-leading-causes
  difficulty: 4
  type: mcq
  stem: คุณตาของปลายอายุ 68 ปี ความดันโลหิตสูง สูบบุหรี่ ชอบกินอาหารรสจัด และเลิกกินยาเองเพราะ "ไม่มีอาการแล้ว" ปลายควรช่วยวางแผนดูแลคุณตาอย่างไร
  choices:
