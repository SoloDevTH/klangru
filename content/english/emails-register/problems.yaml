problems:
- id: english.writing.emails-register.p001
  topics:
  - english.writing.emails-register
  difficulty: 1
  type: mcq
  stem: อีเมลถึงผู้จัดงานที่คุณไม่รู้จักชื่อ ควรเปิดด้วยคำใดจึงเหมาะที่สุด
  choices:
  - id: a
    text: Hey you,
    feedback: เป็นกันเองเกินไปและไม่สุภาพกับคนที่เรายังไม่รู้จัก
  - id: b
    text: Dear Sir or Madam,
    correct: true
    feedback: ถูก ใช้เมื่อไม่รู้ชื่อผู้รับ
  - id: c
    text: Yo!
    feedback: เป็นภาษาไม่เป็นทางการมาก ไม่เหมาะกับอีเมลถึงผู้จัดงาน
  - id: d
    text: Dear Professor Chen,
    feedback: ใช้ได้เมื่อรู้ชื่อผู้รับ แต่โจทย์บอกว่าไม่รู้ชื่อ
  hints:
  - คิดว่าเรารู้ชื่อผู้รับหรือไม่
  - ถ้าไม่รู้ชื่อ ให้ใช้คำขึ้นต้นแบบทั่วไปที่สุภาพ
  solution: ใช้ *Dear Sir or Madam,* เมื่อไม่รู้ชื่อผู้รับ คำขึ้นต้นนี้สุภาพและเป็นทางการ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.emails-register.p002
  topics:
  - english.writing.emails-register
  difficulty: 1
  type: text
  stem: 'เติมคำลงท้ายที่เหมาะกับอีเมลทางการที่เปิดด้วย *Dear Mr Smith,* (ก่อนชื่อของผู้เขียน): *___*'
  accepted:
  - Yours sincerely
  - Yours sincerely,
  misconceptions:
  - match: Best wishes
    feedback: ใช้ได้ในอีเมลกึ่งทางการที่รู้จักกันพอสมควร แต่เมื่อเปิดด้วยชื่อสกุลกับผู้ใหญ่ ควรใช้ Yours sincerely
  - match: Cheers
    feedback: Cheers เป็นคำลงท้ายไม่เป็นทางการ ใช้กับเพื่อนสนิท
  - match: Kind regards
    feedback: Kind regards พบบ่อยในอีเมลกึ่งทางการ แต่โจทย์ต้องการคำลงท้ายแบบทางการที่คู่กับ Dear + ชื่อสกุล คือ Yours sincerely
  hints:
  - ดูคำขึ้นต้นที่ใช้ชื่อสกุลของผู้รับ
  - เป็นคำลงท้ายแบบทางการที่ใช้กับ Dear + ชื่อผู้รับ
  solution: 'ใช้ *Yours sincerely,* เมื่อเปิดด้วยชื่อผู้รับ เช่น *Dear Mr Smith,*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.emails-register.p003
  topics:
  - english.writing.emails-register
  difficulty: 1
  type: match
  stem: จับคู่คำขึ้นต้นหรือคำลงท้ายกับระดับภาษาที่เหมาะสม
  pairs:
  - left: 'Hi Anna,'
    right: คำขึ้นต้นกับเพื่อนสนิทที่ไม่เป็นทางการ
  - left: 'Dear Dr Kaew,'
    right: คำขึ้นต้นทางการเมื่อรู้จักชื่อผู้รับ
  - left: Yours faithfully,
    right: คำลงท้ายเมื่อเปิดด้วย Dear Sir or Madam
  - left: Kind regards,
    right: คำลงท้ายกึ่งทางการกับคนที่รู้จักกันพอประมาณ
  hints:
  - ดูว่าผู้รับรู้จักเรามากแค่ไหน
  - Yours faithfully คู่กับการเปิดด้วยคำที่ไม่มีชื่อ
  solution: 'Hi Anna, → เพื่อนสนิท · Dear Dr Kaew, → ทางการที่รู้ชื่อ · Yours faithfully, → เปิดด้วย Dear Sir or Madam · Kind regards, → กึ่งทางการ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.emails-register.p004
  topics:
  - english.writing.emails-register
  difficulty: 2
  type: order
  stem: เรียงส่วนของอีเมลขอข้อมูลฉบับนี้ให้ถูกลำดับ จากคำขึ้นต้นถึงชื่อผู้ส่ง
  items:
  - 'Dear Ms Wongsakul,'
  - I'm writing to ask about the registration process for the summer course.
  - Would it be possible to send me the registration form by Friday?
  - Thank you very much for your time.
  - Yours sincerely,
  - Nattaya Srisuk
  hints:
  - เริ่มด้วยคำขึ้นต้นและบอกเหตุผลของอีเมลก่อนคำขอ
  - คำลงท้ายและชื่อผู้ส่งอยู่ท้ายสุด
  solution: ลำดับคือ คำขึ้นต้น → บอกเหตุผล → คำขอแบบอ้อม → ขอบคุณ → คำลงท้าย → ชื่อผู้ส่ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.emails-register.p005
  topics:
  - english.writing.emails-register
  difficulty: 2
  type: mcq
  stem: คุณต้องการขอไฟล์ประกอบการเรียนจากอาจารย์ที่ยังไม่สนิท ข้อใดสุภาพที่สุด
  choices:
  - id: a
    text: Send me the file.
    feedback: เป็นคำสั่งตรง ๆ ไม่เหมาะกับอาจารย์ที่ยังไม่สนิท
  - id: b
    text: Send me the file, please.
    feedback: มี please แล้ว แต่ประโยคยังเป็นคำสั่งอยู่
  - id: c
    text: I would be grateful if you could send me the file.
    correct: true
    feedback: ถูก ใช้ประโยคอ้อมและ grateful เพื่อให้ผู้รับไม่รู้สึกถูกบังคับ
  - id: d
    text: Gimme the file.
    feedback: เป็นคำแสลงและไม่สุภาพมาก
  hints:
  - ดูว่าประโยคเป็นคำสั่งหรือคำขอ
  - ประโยคอ้อมที่มี could หรือ grateful ช่วยลดความตรง
  solution: '*I would be grateful if you could send me the file.* เป็นคำขอที่สุภาพที่สุดในสี่ข้อ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.emails-register.p006
  topics:
  - english.writing.emails-register
  difficulty: 2
  type: text
  stem: 'เติมคำกริยาช่วยให้ประโยคปฏิเสธอย่างสุภาพ: *I''m afraid I ___ be able to attend the meeting.*'
  accepted:
  - won't
  - will not
  misconceptions:
  - match: can't
    feedback: can't be able ซ้ำกันเอง ประโยคปฏิเสธเรื่องอนาคตต้องใช้ won't be able to
  - match: don't
    feedback: don't ใช้กับ be able to ไม่ได้ ต้องใช้ will หรือ won't
  hints:
  - เหตุการณ์ที่ปฏิเสธคือการเข้าร่วมประชุมในอนาคต
  - ใช้รูปปฏิเสธของ will
  solution: '*I''m afraid I **won''t** be able to attend the meeting.* ใช้ I''m afraid นำหน้าเพื่อให้การปฏิเสธนุ่มนวลขึ้น'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.emails-register.p007
  topics:
  - english.writing.emails-register
  difficulty: 3
  type: mcq
  stem: ดูอีเมลสองฉบับที่นักเรียนส่งถึงครูประจำวิชา ฉบับใดเหมาะสมที่สุดและเพราะเหตุใด
  figure:
    src: email-cards.svg
    alt: อีเมลสองฉบับถึงครูประจำวิชาเรื่องการส่งรายงาน อีเมล ก มีหัวเรื่อง Homework deadline เริ่มด้วย Dear Mr Lee, ลงท้ายด้วย Yours sincerely, และชื่อ Pim อีเมล ข มีหัวเรื่อง homework?? เขียนด้วยตัวพิมพ์เล็กทั้งหมดและลงท้ายด้วยชื่อ pim
  choices:
  - id: a
    text: ฉบับ ก เพราะมีคำขึ้นต้น ประโยคอ้อม และคำลงท้ายที่เหมาะกับครู
    correct: true
    feedback: ถูก อีเมลนี้มีโครงสร้างครบและใช้ระดับภาษาที่ให้เกียรติผู้รับ
  - id: b
    text: ฉบับ ข เพราะสั้นและตรงประเด็น
    feedback: สั้นและตรงก็จริง แต่คำย่ออย่าง pls, asap, thx และคำขึ้นต้น hey sir ไม่เหมาะกับครู
  - id: c
    text: ทั้งสองฉบับเหมาะเท่ากัน เพราะครูคงเข้าใจทั้งคู่
    feedback: ความเข้าใจได้ไม่ใช่เกณฑ์เดียว ระดับภาษาต้องเหมาะกับผู้รับด้วย
  - id: d
    text: ไม่มีฉบับใดเหมาะ เพราะต้องใช้ภาษาตัวพิมพ์ใหญ่ทั้งหมด
    feedback: ตัวพิมพ์ใหญ่ทั้งประโยคไม่สุภาพ ไม่ใช่สิ่งที่อีเมลทางการต้องมี
  hints:
  - ดูคำขึ้นต้นและคำลงท้ายของแต่ละฉบับ
  - ดูว่าคำขอเป็นคำสั่งหรือคำขออ้อม
  solution: ฉบับ ก ใช้ Dear Mr Lee, คำขอแบบอ้อม และ Yours sincerely, ส่วนฉบับ ข ใช้คำย่อ ตัวพิมพ์เล็กทั้งหมด และคำขึ้นต้น hey sir ที่ไม่เหมาะกับครู
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.emails-register.p008
  topics:
  - english.writing.emails-register
  difficulty: 3
  type: order
  stem: เรียงข้อความตอบกลับข่าวดีของเพื่อนสนิทให้ถูกลำดับ
  items:
  - 'Hi Nok,'
  - Congratulations on your new job at the hospital!
  - That's amazing news, and you really deserve it.
  - Are you free for coffee on Friday? I'd love to hear all about it.
  - Cheers,
  - Pim
  hints:
  - ตอบรับข่าวดีก่อนถามเรื่องอื่น
  - คำลงท้ายแบบไม่เป็นทางการอยู่ก่อนชื่อ
  solution: ลำดับคือ คำทักทาย → แสดงความยินดี → That's amazing news ซึ่งอ้างถึงข่าวในประโยคก่อน → ชวนพบ → คำลงท้าย → ชื่อผู้ส่ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.emails-register.p009
  topics:
  - english.writing.emails-register
  difficulty: 3
  type: text
  stem: 'เติมคำนามที่ขอโทษได้เหมาะสม: *We apologise for the ___ in sending your certificate.*'
  accepted:
  - delay
  misconceptions:
  - match: late
    feedback: late เป็นคำคุณศัพท์ หลัง the ต้องใช้คำนาม เช่น delay
  - match: slow
    feedback: slow เป็นคำคุณศัพท์เช่นกัน หลัง the ต้องใช้คำนาม
  hints:
  - หลัง the ต้องเป็นคำนาม
  - คำนามที่หมายถึงการช้าไปกว่ากำหนด
  solution: '*We apologise for the **delay** in sending your certificate.* หลัง the ต้องเป็นคำนาม และ delay in + V-ing เป็นคู่คำที่ใช้ในอีเมลขอโทษ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.emails-register.p010
  topics:
  - english.writing.emails-register
  difficulty: 3
  type: mcq
  stem: เพื่อนเชิญคุณไปงานแต่งงานที่กรุงเทพฯ วันเสาร์ แต่คุณติดธุระ ข้อความใดปฏิเสธอย่างสุภาพที่สุด
  choices:
  - id: a
    text: No, I'm not coming.
    feedback: ห้วนเกินไป ไม่มีคำขอบคุณหรือคำแสดงความเสียใจ
  - id: b
    text: I'll think about it.
    feedback: คลุมเครือ ผู้เชิญอาจไม่รู้ว่าจะได้มาหรือไม่
  - id: c
    text: Sorry, I'm busy. Bye.
    feedback: ไม่สุภาพพอ และขาดการขอบคุณและความหวังดี
  - id: d
    text: Thanks so much for inviting me! I'm really sorry, but I can't make it on Saturday. I hope the wedding is wonderful, and let's catch up soon!
    correct: true
    feedback: ถูก มีการขอบคุณ ปฏิเสธชัดเจน และแสดงความหวังดี
  hints:
  - การปฏิเสธที่สุภาพมักเริ่มด้วยการขอบคุณ
  - ดูว่ามีคำว่า sorry และความหวังดีหรือไม่
  solution: ข้อ d สุภาพเพราะขอบคุณ ปฏิเสธอย่างชัดเจน ขอโทษ และแสดงความหวังดีต่อคู่บ่าวสาว
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.emails-register.p011
  topics:
  - english.writing.emails-register
  difficulty: 3
  type: match
  stem: จับคู่ประโยคกับหน้าที่ของประโยคนั้นในอีเมล
  pairs:
  - left: I'm writing to complain about the late delivery of my order.
    right: บอกเหตุผลของการร้องเรียน
  - left: I would appreciate it if you could look into this matter.
    right: ขอให้ผู้รับตรวจสอบเรื่องที่ร้องเรียน
  - left: Thank you for getting back to me so quickly.
    right: ขอบคุณที่ตอบกลับอย่างรวดเร็ว
  - left: I'm sorry for the inconvenience this has caused.
    right: แสดงความเสียใจต่อความไม่สะดวกที่เกิดขึ้น
  hints:
  - ประโยคแรกบอกว่าทำไมเราจึงเขียน
  - คำว่า appreciate และ look into ใช้ขอให้ตรวจสอบ
  solution: 'complain → บอกเหตุผล · look into this → ขอให้ตรวจสอบ · getting back to me → ขอบคุณ · inconvenience → ขอโทษ'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.emails-register.p012
  topics:
  - english.writing.emails-register
  difficulty: 4
  type: mcq
  stem: ลูกค้าส่งอีเมลร้องเรียนว่าสินค้ามาช้า ข้อความตอบกลับใดเหมาะที่สุดสำหรับฝ่ายบริการลูกค้า
  choices:
  - id: a
    text: That's not our problem. Check the date yourself.
    feedback: ไม่แสดงความรับผิดชอบและไม่สุภาพอย่างมาก
  - id: b
    text: Sorry about that, whatever, it'll come eventually.
    feedback: ไม่จริงจัง และไม่บอกข้อมูลที่ลูกค้าต้องการ
  - id: c
    text: We're sorry for the delay. We're checking with the courier now and will update you by Monday.
    correct: true
    feedback: ถูก ขอโทษ บอกสิ่งที่กำลังทำ และบอกเวลาที่จะแจ้งผลกลับ
  - id: d
    text: Hey, sorry lol. Our bad.
    feedback: เป็นคำแสลงและไม่เป็นทางการเกินไปสำหรับการแก้ปัญหาลูกค้า
  hints:
  - ลูกค้าต้องการทั้งการขอโทษและข้อมูลที่ชัดเจน
  - ดูว่าคำตอบบอกขั้นตอนต่อไปหรือไม่
  solution: ข้อ c ขอโทษ บอกสิ่งที่กำลังทำ และกำหนดเวลาที่จะตอบกลับ ซึ่งเป็นระดับภาษาที่เหมาะกับลูกค้า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.emails-register.p013
  topics:
  - english.writing.emails-register
  difficulty: 4
  type: text
  stem: 'เติมคำที่ทำให้คำขอนุ่มนวลและเป็นทางการ: *Would it be ___ to move our meeting to Thursday?*'
  accepted:
  - possible
  misconceptions:
  - match: okay
    feedback: okay เป็นภาษาไม่เป็นทางการกว่า ในอีเมลทางการให้ใช้ possible
  - match: ok
    feedback: ok เป็นคำย่อที่ไม่เป็นทางการ ไม่เหมาะกับคำขอแบบทางการ
  hints:
  - โครงสร้าง Would it be ... to ... ใช้ตามด้วยคำคุณศัพท์
  - คำคุณศัพท์ที่แปลว่า "เป็นไปได้"
  solution: '*Would it be **possible** to move our meeting to Thursday?*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.writing.emails-register.p014
  topics:
  - english.writing.emails-register
  difficulty: 4
  type: order
  stem: เรียงอีเมลร้องเรียนฉบับนี้ให้ถูกลำดับ
  items:
  - 'Dear Sir or Madam,'
  - I'm writing to complain about the delivery of my order (No. 4521), which arrived three days late.
  - The box was damaged, and two items were missing.
  - I would appreciate it if you could look into this and arrange a replacement or a refund.
  - I look forward to hearing from you.
  - Yours faithfully,
  - Pim Rattanakorn
  hints:
  - เริ่มด้วยคำขึ้นต้นที่ไม่มีชื่อผู้รับ แล้วบอกเหตุผลของการร้องเรียน
  - เมื่อขึ้นต้นด้วย Dear Sir or Madam ลงท้ายด้วย Yours faithfully
