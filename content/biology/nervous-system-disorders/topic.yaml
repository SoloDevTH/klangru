id: biology.animals.nervous-system-disorders
subject: biology
title: { th: ความผิดปกติของระบบประสาท, en: "Nervous system disorders" }
summary: โรคเสื่อมของระบบประสาท โรคหลอดเลือดสมอง ลมชัก ความผิดปกติทางพัฒนาการ โรคทางจิตเวช และการบาดเจ็บของสมอง พร้อมแนวทางขอความช่วยเหลือและการไม่ตีตรา
difficulty: 6
minutes: 40
prerequisites: [biology.animals.nervous-system]
encompasses:
  - { id: biology.animals.nervous-system, weight: 0.3 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: หลักจำ BE FAST สำหรับอาการเตือนของโรคหลอดเลือดสมอง
    src: be-fast.svg
    alt: "ภาพหกกรอบเรียงเป็นสองแถว แต่ละกรอบมีอักษรในวงกลมและคำภาษาอังกฤษกับคำอธิบายภาษาไทย ได้แก่ B การทรงตัวเสียทันที E ตามัวหรือเห็นภาพซ้อนข้างเดียว F มุมปากตกหรือใบหน้าเบี้ยวข้างเดียว A แขนหรือขาอ่อนแรงข้างเดียว S พูดไม่ชัดหรือพูดไม่ออก และ T กรอบสีแดงที่ระบุว่าเวลาสำคัญ ให้โทร 1669 ทันที"
    caption: "ถ้าพบอาการใดอาการหนึ่งอย่างกะทันหัน ให้โทร 1669 ทันที (แผนภาพวาดโดยทีมคลังรู้ ไม่ใช่คำแนะนำทางการแพทย์สำหรับบุคคล)"
  - type: figure
    title: โรคหลอดเลือดสมองสองชนิด
    src: stroke-types.svg
    alt: "ภาพสองกรอบ กรอบซ้ายแสดงหลอดเลือดแดงที่มีลิ่มเลือดสีเข้มขวางอยู่ แขนงที่ไปเลี้ยงวงรีสีเทาซึ่งแทนเนื้อสมองที่ขาดเลือดเป็นเส้นประจาง กรอบขวาแสดงหลอดเลือดแดงที่ผนังแตก มีเลือดไหลออกไปคั่งอยู่ในวงรีสีชมพู"
    caption: "แบบขาดเลือดเกิดจากการอุดตัน แบบเลือดออกเกิดจากหลอดเลือดแตก ทั้งสองแบบทำให้เซลล์สมองเสียหาย (แผนภาพวาดโดยทีมคลังรู้)"
  - { type: check, problem: biology.animals.nervous-system-disorders.p002, prompt: "ลองคิดก่อนอ่านต่อ: หมายเลขสายด่วนเหตุฉุกเฉินของไทยคืออะไร" }
glossary:
  - { term: โรคเสื่อมของระบบประสาท, definition: "โรคที่เซลล์ประสาทค่อย ๆ สูญเสียไปตามเวลา เช่น อัลไซเมอร์และพาร์กินสัน" }
  - { term: โรคหลอดเลือดสมอง, definition: "ภาวะที่เลือดไปเลี้ยงสมองส่วนหนึ่งหยุดชะงัก อาจเกิดจากการอุดตันหรือหลอดเลือดแตก" }
  - { term: ลมชัก, definition: "การที่เซลล์ประสาทจำนวนมากปล่อยกระแสไฟฟ้าผิดปกติพร้อมกันเป็นช่วง ทำให้เกิดอาการชัก" }
  - { term: ออทิซึม, definition: "ความแตกต่างทางพัฒนาการของสมองที่เริ่มตั้งแต่วัยเด็ก ส่งผลต่อการสื่อสารและการเข้าใจสังคม" }
  - { term: โดปามีน, definition: "สารสื่อประสาทที่เกี่ยวข้องกับการเคลื่อนไหว การควบคุมความสนใจ และการให้รางวัลในสมอง" }
  - { term: BE FAST, definition: "หลักจำอาการเตือนของโรคหลอดเลือดสมอง ได้แก่ การทรงตัว ตา ใบหน้า แขน การพูด และเวลา" }
flashcards:
  - { front: "อาการเตือนโรคหลอดเลือดสมองตามหลัก BE FAST มีอะไรบ้าง", back: "Balance ทรงตัวเสีย, Eyes ตามัว, Face มุมปากตก, Arm แขนอ่อนแรง, Speech พูดไม่ชัด, Time โทร 1669 ทันที" }
  - { front: "พาร์กินสันเกี่ยวข้องกับเซลล์ประสาทชนิดใด", back: "เซลล์ประสาทที่สร้างโดปามีนในก้านสมองเสื่อมลง" }
  - { front: "ขณะชักควรทำอย่างไร", back: "ดูแลรอบตัวให้ปลอดภัย ปกป้องศีรษะ ไม่กดตัว ไม่ใส่สิ่งของเข้าปาก เมื่อหยุดชักจึงจัดให้นอนตะแคง" }
  - { front: "หมายเลขสายด่วนสุขภาพจิตและเหตุฉุกเฉินของไทย", back: "1323 สุขภาพจิต / 1669 เหตุฉุกเฉิน" }
