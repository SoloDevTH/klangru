id: biology.ecology.environmental-issues
subject: biology
title: { th: ทรัพยากรธรรมชาติและปัญหาสิ่งแวดล้อม, en: "Natural resources and environmental issues" }
summary: การขาดแคลนน้ำและมลพิษทางน้ำ มลพิษทางอากาศและ PM2.5 ปัญหาทรัพยากรดิน การทำลายป่า สัตว์ป่าที่ลดลง ปะการังฟอกขาว และการประเมินแนวทางจัดการอย่างรอบด้านด้วยข้อมูลจริงของไทยและโลก
difficulty: 4.5
minutes: 45
prerequisites: [biology.ecology.populations]
encompasses:
  - { id: biology.ecology.populations, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: ค่าเฉลี่ยรายปีของ PM2.5 ทั้งประเทศ
    src: pm25-thailand.svg
    alt: "กราฟแท่ง ค่าเฉลี่ยรายปีของ PM2.5 ทั้งประเทศ ปี 2566 เท่ากับ 26 และปี 2567 เท่ากับ 24 ไมโครกรัมต่อลูกบาศก์เมตร มีเส้นประสีน้ำเงินที่ 15 คือมาตรฐานรายปีของไทย และเส้นประสีเขียวที่ 5 คือแนวทางขององค์การอนามัยโลกปี 2021 แท่งทั้งสองสูงกว่าทั้งสองเส้น ข้อมูลจากรายงานสถานการณ์มลพิษของประเทศไทย ปี 2567 กรมควบคุมมลพิษ 96 สถานี"
    caption: "ค่าลดลงแต่ยังสูงกว่ามาตรฐาน (ข้อมูลกรมควบคุมมลพิษ วาดโดยทีมคลังรู้)"
  - type: figure
    title: ยูโทรฟิเคชัน
    src: eutrophication.svg
    alt: "ผังลำดับ 5 กล่อง ปุ๋ยและน้ำทิ้งพาไนเตรตและฟอสเฟตลงแหล่งน้ำ → สาหร่ายเพิ่มจำนวน น้ำเขียวและบังแสง → สาหร่ายตาย ผู้ย่อยสลายเพิ่มขึ้น → ออกซิเจนในน้ำลดลง → ปลาตาย น้ำเน่าเสีย ใต้ผังเขียนว่าผู้ย่อยสลายใช้ออกซิเจนในการหายใจขณะย่อยซากสาหร่ายจำนวนมาก จึงเป็นสาเหตุหลักที่ออกซิเจนลดลง"
    caption: "ธาตุอาหารที่มากเกินไปทำให้แหล่งน้ำขาดออกซิเจน (วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: ประเมินทางแก้ปัญหาการเผาเศษวัสดุเกษตร
    problem: "จังหวัดหนึ่งเสนอ 3 ทางแก้ปัญหาการเผาตอซังข้าวโพด ก) ห้ามเผาและปรับผู้ฝ่าฝืน ข) ตั้งจุดรับซื้อตอซังไปทำเชื้อเพลิงชีวมวล ค) แจกหน้ากากให้ประชาชน จงประเมินด้วยเกณฑ์ แก้ที่ต้นเหตุ ความเป็นธรรมต่อเกษตรกร และวัดผลได้"
    steps:
      - text: "ต้นเหตุคือเกษตรกรเผาเพราะเป็นวิธีเตรียมแปลงที่เร็วและถูกที่สุด"
      - text: "ก) ลดการเผาได้ถ้าบังคับใช้จริง แต่เพิ่มต้นทุนให้เกษตรกรโดยไม่มีทางเลือก อาจเกิดการลักลอบเผา"
      - text: "ข) แก้ที่ต้นเหตุและให้รายได้แทน แต่ต้องมีงบลงทุนและตลาดรับซื้อที่ยั่งยืน"
        why: "ทางแก้ที่ทำให้ทางเลือกใหม่คุ้มกว่าการเผามักได้รับความร่วมมือมากกว่าการห้ามอย่างเดียว"
      - text: "ค) ลดผลต่อสุขภาพระยะสั้น แต่ไม่ลดฝุ่นที่ต้นเหตุ"
      - text: "วัดผลได้ทุกทางจากจุดความร้อนจากดาวเทียมและค่า PM2.5 ก่อนและหลัง ทางแก้ที่ดีอาจใช้ ข เป็นหลัก ร่วมกับ ก และใช้ ค ป้องกันระหว่างรอผล"
    answer: "ข แก้ต้นเหตุและเป็นธรรมที่สุด ควรใช้ร่วมกับการบังคับใช้กฎหมาย และใช้หน้ากากเป็นมาตรการป้องกันชั่วคราว"
  - { type: check, problem: biology.ecology.environmental-issues.p013, prompt: "ทางแก้ใดลดสาเหตุที่เกษตรกรเลือกเผา" }
  - type: figure
    title: ปะการังฟอกขาวทั่วโลก 4 ครั้ง
    src: coral-bleaching.svg
    alt: "กราฟแท่ง ร้อยละของพื้นที่แนวปะการังโลกที่เจอความร้อนระดับทำให้ฟอกขาวในเหตุการณ์ฟอกขาวทั่วโลกแต่ละครั้ง ครั้งที่ 1 ค.ศ. 1998 ร้อยละ 21 ครั้งที่ 2 ค.ศ. 2010 ร้อยละ 37 ครั้งที่ 3 ค.ศ. 2014–2017 ร้อยละ 68 ครั้งที่ 4 ค.ศ. 2023–2025 ร้อยละ 84 ข้อมูลจาก NOAA Coral Reef Watch"
    caption: "เหตุการณ์ฟอกขาวแต่ละครั้งกว้างขึ้น (ข้อมูล NOAA วาดโดยทีมคลังรู้)"
  - type: worked-example
    title: อ่านข้อมูลปะการังฟอกขาวอย่างระมัดระวัง
    problem: "จากกราฟ ครั้งที่ 4 กว้างกว่าครั้งที่ 1 กี่เท่า และข้อมูลนี้บอกหรือไม่ว่าปะการังร้อยละ 84 ของโลกตายแล้ว"
    steps:
      - text: "$\\frac{84}{21} = 4$ เท่า"
      - text: "ข้อมูลวัด 'พื้นที่ที่เจอความร้อนถึงระดับฟอกขาว' ไม่ได้วัดการตาย"
        why: "การอ่านให้ตรงกับสิ่งที่วัดจริงสำคัญเท่ากับการคำนวณ"
      - text: "ปะการังที่ฟอกขาวยังมีชีวิต ถ้าน้ำเย็นลงเร็วอาจได้สาหร่ายกลับมา ถ้าร้อนนานหรือฟอกขาวซ้ำบ่อยจึงตายมาก"
    answer: "4 เท่า และไม่ได้แปลว่าตายร้อยละ 84 แต่บอกว่าพื้นที่ที่เสี่ยงฟอกขาวกว้างขึ้นมาก"
  - { type: check, problem: biology.ecology.environmental-issues.p011, prompt: "ฟอกขาวกับตายต่างกันอย่างไร" }
glossary:
  - { term: PM2.5, definition: "ฝุ่นละอองขนาดไม่เกิน 2.5 ไมโครเมตร เข้าลึกถึงถุงลมปอดได้" }
  - { term: BOD, definition: "ปริมาณออกซิเจนที่จุลินทรีย์ใช้ย่อยสารอินทรีย์ในน้ำ ยิ่งสูงยิ่งเน่าเสีย" }
  - { term: ยูโทรฟิเคชัน, definition: "ภาวะที่ธาตุอาหารมากเกินไปทำให้สาหร่ายเพิ่มมาก แล้วออกซิเจนในน้ำลดลงเมื่อสาหร่ายตายและถูกย่อย" }
  - { term: ฝนกรด, definition: "ฝนที่เป็นกรดมากกว่าปกติจาก SO₂ และ NOx ที่รวมกับน้ำในบรรยากาศ" }
  - { term: ปะการังฟอกขาว, definition: "ภาวะที่ปะการังขับสาหร่ายที่อยู่ร่วมกันออกเมื่อน้ำร้อนผิดปกติ ทำให้เห็นโครงหินปูนสีขาว" }
  - { term: การสูญเสียแหล่งที่อยู่, definition: "การที่แหล่งที่อยู่ของสิ่งมีชีวิตถูกทำลายหรือแบ่งเป็นหย่อม เป็นสาเหตุใหญ่ที่สุดของการลดลงของสัตว์ป่า" }
flashcards:
  - { front: "PM2.5 เฉลี่ยทั้งประเทศ ปี 2567 (กรมควบคุมมลพิษ)", back: "24 ไมโครกรัมต่อลูกบาศก์เมตร มาตรฐานรายปีของไทย 15 แนวทาง WHO 5" }
  - { front: "แหล่งของ SO₂ และ NOx", back: "SO₂ จากการเผาถ่านหินที่มีกำมะถัน NOx จากการเผาไหม้อุณหภูมิสูง เช่น เครื่องยนต์" }
  - { front: "ทำไมยูโทรฟิเคชันทำให้ปลาตาย", back: "ผู้ย่อยสลายใช้ออกซิเจนมากขณะย่อยซากสาหร่าย ออกซิเจนในน้ำจึงลดลง" }
  - { front: "สาเหตุใหญ่ที่สุดที่ทำให้สัตว์ป่าลดลง", back: "การสูญเสียแหล่งที่อยู่" }
  - { front: "เกณฑ์ประเมินทางแก้ปัญหาสิ่งแวดล้อม", back: "แก้ต้นเหตุ วัดผลได้ คุ้มทุน เป็นธรรมต่อผู้ได้รับผล และไม่มีผลข้างเคียงร้ายแรง" }
