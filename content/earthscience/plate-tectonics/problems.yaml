problems:
  - id: earthscience.geology.plate-tectonics.p001
    topics: [earthscience.geology.plate-tectonics]
    difficulty: 1
    type: mcq
    stem: "ชั้นใดของโลกเป็นของเหลว"
    choices:
      - { id: a, text: "แก่นโลกชั้นนอก", correct: true }
      - { id: b, text: "เนื้อโลกทั้งชั้น", feedback: "เนื้อโลกเกือบทั้งหมดเป็นของแข็ง ฐานธรณีภาคอ่อนตัวและไหลได้ช้า แต่ไม่ใช่ของเหลว" }
      - { id: c, text: "แก่นโลกชั้นใน", feedback: "แก่นชั้นในร้อนมากแต่ความดันสูงมาก จึงเป็นของแข็ง" }
      - { id: d, text: "ธรณีภาค", feedback: "ธรณีภาคแข็งและแตกเป็นแผ่นธรณี" }
    hints:
      - "คลื่นชนิดใดผ่านชั้นนี้ไม่ได้"
      - "ชั้นนี้อยู่ที่ความลึก 2,890–5,150 km"
    solution: "แก่นโลกชั้นนอกเป็นเหล็กและนิกเกิลหลอมเหลว หลักฐานคือคลื่น S ผ่านไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.plate-tectonics.p002
    topics: [earthscience.geology.plate-tectonics]
    difficulty: 1
    type: match
    stem: "จับคู่แนวรอยต่อของแผ่นธรณีกับตัวอย่าง"
    pairs:
      - { left: "แยกออกจากกัน", right: "สันเขากลางมหาสมุทรแอตแลนติก" }
      - { left: "ทวีปชนทวีป", right: "เทือกเขาหิมาลัย" }
      - { left: "มหาสมุทรมุดใต้ทวีป", right: "เทือกเขาแอนดีสและร่องลึกข้างชายฝั่ง" }
      - { left: "เลื่อนผ่านกัน", right: "รอยเลื่อนสะกายในเมียนมา" }
    hints:
      - "สันเขากลางมหาสมุทรคือที่ที่สร้างพื้นสมุทรใหม่"
      - "รอยเลื่อนที่แผ่นเลื่อนสวนกันในแนวระดับ"
    solution: "สันเขาแอตแลนติกเป็นแนวแยกออก หิมาลัยเกิดจากทวีปชนทวีป แอนดีสเกิดจากแผ่นมหาสมุทรมุดใต้ทวีป และรอยเลื่อนสะกายเป็นแนวเลื่อนผ่านกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.plate-tectonics.p003
    topics: [earthscience.geology.plate-tectonics]
    difficulty: 2
    type: mcq
    stem: "สถานีวัดแผ่นดินไหวที่อยู่ห่างจากจุดเกิดเกิน 104° ไม่ได้รับคลื่น S โดยตรงเลย ข้อมูลนี้สนับสนุนข้อสรุปใด"
    figure: { src: shadow-zones.svg, alt: "ภาพตัดโลก จุดเกิดแผ่นดินไหวอยู่ด้านบน แก่นโลกชั้นนอกที่เป็นของเหลวอยู่ตรงกลาง เส้นคลื่นจากจุดเกิดไปถึงผิวโลกไม่เกิน 104° แถบสีม่วงที่ 104°–140° ทั้งสองข้างเป็นเขตอับคลื่น P เส้นประสีน้ำเงินจาก 104° ลงไปถึงด้านตรงข้ามเป็นเขตอับคลื่น S" }
    choices:
      - { id: a, text: "แก่นโลกชั้นนอกเป็นของเหลว เพราะคลื่น S ผ่านของเหลวไม่ได้", correct: true }
      - { id: b, text: "คลื่น S อ่อนลงจนหมดเมื่อเดินทางไกล", feedback: "คลื่น P เดินทางไกลกว่านั้นได้ และขอบเขตอับคมชัดที่ 104° แสดงว่ามีชั้นที่คลื่น S ผ่านไม่ได้ ไม่ใช่แค่อ่อนลง" }
      - { id: c, text: "แก่นโลกชั้นในเป็นของเหลว", feedback: "เขตอับคลื่น S เกิดจากแก่นชั้นนอก ส่วนแก่นชั้นในเป็นของแข็ง" }
      - { id: d, text: "เปลือกโลกหนามากใต้ทวีป", feedback: "ความหนาของเปลือกโลกไม่ได้ทำให้คลื่น S หายไปทั้งครึ่งโลก" }
    hints:
      - "คลื่น S เป็นคลื่นตามขวาง"
      - "คลื่นตามขวางผ่านตัวกลางสถานะใดไม่ได้"
    solution: "คลื่น S เป็นคลื่นตามขวาง ผ่านของเหลวไม่ได้ การที่ไม่มีคลื่น S เลยหลัง 104° แสดงว่ามีชั้นของเหลวขนาดใหญ่ขวางอยู่ คือแก่นโลกชั้นนอก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.plate-tectonics.p004
    topics: [earthscience.geology.plate-tectonics]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นหลักฐานที่เวเกเนอร์ใช้สนับสนุนทฤษฎีทวีปเลื่อน (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "ขอบทวีปอเมริกาใต้กับแอฟริกาต่อกันได้", correct: true }
      - { id: b, text: "ซากมีโซซอรัสซึ่งเป็นสัตว์น้ำจืด พบทั้งในบราซิลและแอฟริกาใต้", correct: true }
      - { id: c, text: "ร่องรอยธารน้ำแข็งโบราณในบริเวณที่ปัจจุบันเป็นเขตร้อน", correct: true }
      - { id: d, text: "แถบแม่เหล็กสมมาตรสองข้างสันเขากลางมหาสมุทร", feedback: "แถบแม่เหล็กค้นพบในทศวรรษ 1960 หลังเวเกเนอร์เสียชีวิตแล้ว เป็นหลักฐานของการแผ่ขยายพื้นสมุทร" }
    hints:
      - "เวเกเนอร์เสนอแนวคิดใน พ.ศ. 2455 ก่อนมีการสำรวจพื้นมหาสมุทรอย่างละเอียด"
      - "หลักฐานของเขามาจากทวีป ซากดึกดำบรรพ์ และภูมิอากาศโบราณ"
    solution: "เวเกเนอร์ใช้รูปร่างขอบทวีป ซากดึกดำบรรพ์ หินและเทือกเขาที่ต่อกัน และร่องรอยภูมิอากาศโบราณ ส่วนแถบแม่เหล็กเป็นหลักฐานที่พบภายหลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.plate-tectonics.p005
    topics: [earthscience.geology.plate-tectonics]
    difficulty: 2
    type: text
    stem: "มหาทวีปที่เวเกเนอร์เสนอว่าทวีปทั้งหมดเคยรวมกันอยู่ มีชื่อว่าอะไร"
    accepted: ["แพนเจีย", "pangaea", "pangea"]
    misconceptions:
      - { match: "กอนด์วานา", feedback: "กอนด์วานาเป็นมหาทวีปซีกโลกใต้ที่เป็นส่วนหนึ่งของแพนเจีย ชื่อมหาทวีปที่รวมทุกทวีปคือแพนเจีย" }
    hints:
      - "ชื่อมาจากภาษากรีก แปลว่า แผ่นดินทั้งหมด"
      - "ขึ้นต้นด้วย แพน"
    solution: "แพนเจีย (Pangaea) แปลว่า แผ่นดินทั้งหมด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.plate-tectonics.p006
    topics: [earthscience.geology.plate-tectonics]
    difficulty: 2
    type: order
    stem: "เรียงชั้นของโลกตามองค์ประกอบ จากผิวโลกไปถึงศูนย์กลาง"
    items:
      - "เปลือกโลก"
      - "เนื้อโลก"
      - "แก่นโลกชั้นนอก"
      - "แก่นโลกชั้นใน"
    hints:
      - "ชั้นที่บางที่สุดอยู่นอกสุด"
      - "แก่นโลกแบ่งเป็นชั้นนอกที่เป็นของเหลวกับชั้นในที่เป็นของแข็ง"
    solution: "เปลือกโลก → เนื้อโลก (ถึงราว 2,890 km) → แก่นโลกชั้นนอก (ถึง 5,150 km) → แก่นโลกชั้นใน (ถึงศูนย์กลาง 6,371 km)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.plate-tectonics.p007
    topics: [earthscience.geology.plate-tectonics]
    difficulty: 3
    type: numeric
    stem: "จากภาพแถบแม่เหล็ก หินที่อยู่ห่างสันเขา 40 km มีอายุ 2.0 ล้านปี แผ่นธรณีข้างหนึ่งเคลื่อนออกจากสันเขาด้วยอัตราเร็วเฉลี่ยกี่เซนติเมตรต่อปี"
    figure: { src: p-magnetic-stripes.svg, alt: "แถบแม่เหล็กสีดำสลับขาวบนพื้นสมุทร สมมาตรสองข้างสันเขากลางมหาสมุทร แต่ละแถบกว้าง 20 km ระยะจากสันเขา 0 ถึง 100 km ทั้งสองข้าง ลูกศรบอกอายุ 2.0 ล้านปีที่ระยะ 40 km และ 4.0 ล้านปีที่ระยะ 80 km ทั้งสองข้าง" }
    answer: { value: 2, tolerance: 0.05, unit: cm/ปี }
    misconceptions:
      - { match: 4, feedback: "4 cm/ปี คืออัตราที่สองแผ่นแยกห่างกัน (รวมสองข้าง) โจทย์ถามข้างเดียว" }
      - { match: 20, feedback: "20 คือคำตอบในหน่วยมิลลิเมตรต่อปี หรือกิโลเมตรต่อล้านปี ต้องแปลงเป็นเซนติเมตรต่อปี" }
    hints:
      - "อัตราเร็ว = ระยะทาง ÷ เวลา"
      - "แปลง 40 km เป็นเซนติเมตร ($4.0 \\times 10^6$ cm) และ 2.0 ล้านปีเป็น $2.0 \\times 10^6$ ปี"
    solution: "$v = \\dfrac{4.0 \\times 10^6\\ \\mathrm{cm}}{2.0 \\times 10^6\\ \\text{ปี}} = 2.0$ cm/ปี ตรวจกับหิน 80 km อายุ 4.0 ล้านปีก็ได้ค่าเดิม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.plate-tectonics.p008
    topics: [earthscience.geology.plate-tectonics]
    difficulty: 3
    type: mcq
    stem: "หินพื้นสมุทรที่เก่าที่สุดมีอายุราว 180 ล้านปี แต่หินบนทวีปบางแห่งมีอายุราว 4,000 ล้านปี ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "เปลือกมหาสมุทรถูกสร้างใหม่ที่สันเขาและมุดกลับลงไปที่ร่องลึกตลอดเวลา ส่วนเปลือกทวีปเบากว่าจึงไม่มุดลง", correct: true }
      - { id: b, text: "มหาสมุทรเพิ่งเกิดเมื่อ 180 ล้านปีก่อน ก่อนหน้านั้นโลกไม่มีมหาสมุทร", feedback: "โลกมีมหาสมุทรมานานกว่านั้นมาก แต่พื้นสมุทรเก่าถูกทำลายที่แนวมุดตัวไปแล้ว" }
      - { id: c, text: "น้ำทะเลกัดกร่อนหินเก่าจนหมด", feedback: "การกัดกร่อนไม่ได้ทำให้พื้นสมุทรทั้งหมดอายุน้อยอย่างเป็นระบบตามระยะจากสันเขา" }
      - { id: d, text: "หินบนทวีปเกิดจากอุกกาบาต", feedback: "หินเก่าบนทวีปเกิดบนโลก ความต่างของอายุมาจากการหมุนเวียนของเปลือกมหาสมุทร" }
    hints:
      - "เปลือกมหาสมุทรเกิดที่ไหน และหายไปที่ไหน"
      - "เปลือกชนิดใดหนาแน่นกว่า"
    solution: "เปลือกมหาสมุทรเกิดที่สันเขา เคลื่อนออก แล้วมุดลงที่ร่องลึก จึงอยู่ได้ไม่นานทางธรณีวิทยา ส่วนเปลือกทวีปหนาแน่นน้อยกว่าจึงลอยอยู่และเก็บหินเก่าไว้ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.plate-tectonics.p009
    topics: [earthscience.geology.plate-tectonics]
    difficulty: 3
    type: numeric
    stem: "สถานีวัดแผ่นดินไหวบันทึกคลื่น S มาถึงหลังคลื่น P 20 s ถ้าในเปลือกโลกคลื่น P มีอัตราเร็ว 6.0 km/s และคลื่น S มีอัตราเร็ว 3.5 km/s สถานีอยู่ห่างจุดเกิดแผ่นดินไหวกี่กิโลเมตร"
    answer: { value: 168, tolerance: 2, unit: km }
    misconceptions:
      - { match: 120, feedback: "คูณ 20 s ด้วยอัตราเร็วคลื่น P อย่างเดียว 20 s คือผลต่างของเวลาเดินทาง ไม่ใช่เวลาเดินทางของคลื่น P" }
      - { match: 50, feedback: "คูณ 20 s ด้วยผลต่างของอัตราเร็ว (2.5 km/s) ต้องใช้ผลต่างของเวลาต่อกิโลเมตร $1/v_S - 1/v_P$" }
    hints:
      - "เวลาของคลื่น S ลบเวลาของคลื่น P: $d/v_S - d/v_P = 20$"
      - "$d = 20 \\div (1/3.5 - 1/6.0)$"
    solution: "$\\dfrac{d}{3.5} - \\dfrac{d}{6.0} = 20$ จะได้ $d \\times 0.119 = 20$ ดังนั้น $d = 168$ km นักธรณีวิทยาใช้หลักนี้จากหลายสถานีเพื่อหาตำแหน่งจุดเกิดแผ่นดินไหว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.plate-tectonics.p010
    topics: [earthscience.geology.plate-tectonics]
    difficulty: 3
    type: mcq
    stem: "บนยอดเขาหิมาลัยพบซากดึกดำบรรพ์ของสัตว์ทะเลในหินปูน ข้อใดอธิบายได้ถูกต้อง"
    choices:
      - { id: a, text: "หินที่เคยตกตะกอนในทะเลระหว่างอินเดียกับเอเชีย ถูกดันยกขึ้นเมื่อแผ่นทวีปทั้งสองชนกัน", correct: true }
      - { id: b, text: "น้ำทะเลเคยท่วมสูงถึงยอดเขาหิมาลัยในปัจจุบัน", feedback: "ระดับน้ำทะเลไม่เคยสูงหลายพันเมตร หินต่างหากที่ถูกยกขึ้น" }
      - { id: c, text: "นกพาซากสัตว์ทะเลขึ้นไปทิ้งไว้", feedback: "ซากอยู่ในเนื้อหินปูนเป็นชั้นหนา ไม่ใช่ซากที่ถูกนำมาวาง" }
      - { id: d, text: "แผ่นมหาสมุทรมุดลงจนเกิดภูเขาไฟพ่นซากขึ้นมา", feedback: "หิมาลัยเกิดจากทวีปชนทวีป และหินปูนเป็นหินตะกอน ไม่ใช่หินจากภูเขาไฟ" }
    hints:
      - "หินปูนที่มีซากสัตว์ทะเลเกิดที่ไหน"
      - "แนวรอยต่อแบบใดที่ยกหินขึ้นเป็นเทือกเขาสูงโดยไม่มีภูเขาไฟมาก"
    solution: "หินปูนเกิดในทะเลที่เคยอยู่ระหว่างอินเดียกับเอเชีย เมื่อแผ่นอินเดียชนแผ่นยูเรเชีย ทวีปทั้งสองไม่มุดลงง่าย หินจึงถูกบีบและยกขึ้นเป็นเทือกเขาหิมาลัย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: earthscience.geology.plate-tectonics.p011
    topics: [earthscience.geology.plate-tectonics]
    difficulty: 3
    type: mcq
    stem: "สึนามิที่ซัดชายฝั่งอันดามันของไทยเมื่อ 26 ธันวาคม 2547 เกิดจากแผ่นดินไหวขนาด 9.1 ใกล้ร่องลึกซุนดา แผ่นดินไหวนี้เกิดที่แนวรอยต่อแบบใด"
    choices:
      - { id: a, text: "แนวเข้าหากัน แผ่นมหาสมุทรอินเดีย–ออสเตรเลียมุดลงใต้แผ่นซุนดา", correct: true }
      - { id: b, text: "แนวแยกออกจากกัน", feedback: "แนวแยกออกมักเกิดแผ่นดินไหวตื้นขนาดไม่ใหญ่มาก แผ่นดินไหวขนาด 9 เกิดที่แนวมุดตัว" }
