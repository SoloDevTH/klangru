    stem: "สมมติว่าผึ้งในพื้นที่ปลูกลำไยลดลงมากเพราะใช้สารฆ่าแมลงผิดวิธี เรียงผลกระทบที่ตามมาตามลำดับเหตุและผล"
    items:
      - "ผึ้งและแมลงผสมเกสรลดจำนวนลง"
      - "ดอกลำไยได้รับการถ่ายเรณูน้อยลง"
      - "ติดผลน้อยลง"
      - "ผลผลิตและรายได้ของชาวสวนลดลง"
    hints:
      - "เริ่มจากสิ่งที่เปลี่ยนเป็นอย่างแรก"
      - "ผลเกิดหลังการถ่ายเรณูและการปฏิสนธิ"
    solution: "ผึ้งลดลง → ถ่ายเรณูน้อยลง → ติดผลน้อยลง → ผลผลิตและรายได้ลดลง แสดงว่าความหลากหลายทางชีวภาพเกี่ยวกับอาหารและเศรษฐกิจของมนุษย์โดยตรง"
