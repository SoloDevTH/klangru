      - { id: c, text: "ไม่มีแรงเสียดทาน เพราะลังไม่ไถล", feedback: "ลังไม่ไถลเพราะมีแรงเสียดทานสถิตยึดไว้ ถ้าไม่มีแรงเสียดทาน ลังจะอยู่ที่เดิมขณะกระบะเลื่อนออกไป" }
      - { id: d, text: "ชี้ลง เพราะลังกดพื้นกระบะ", feedback: "แรงที่ลังกดพื้นเป็นแรงตั้งฉากที่กระทำต่อกระบะ ส่วนแรงเสียดทานขนานกับผิว" }
    hints:
