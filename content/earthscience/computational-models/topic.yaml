id: earthscience.systems.computational-models
subject: earthscience
title: { th: แบบจำลองคอมพิวเตอร์ของระบบโลกและความยั่งยืน, en: "Computational models of Earth systems and sustainability" }
summary: สร้างแบบจำลองคอมพิวเตอร์อย่างง่ายแบบสต็อกและการไหล ได้แก่ สมดุลพลังงานของโลก กล่องคาร์บอน และประชากรปลากับการจับ ใช้เปรียบเทียบฉากทัศน์ ตรวจความน่าเชื่อถือ และบอกข้อจำกัด
difficulty: 6
minutes: 40
prerequisites: [earthscience.atmosphere.climate-change, biology.ecology.environmental-issues, computer.programming.functions]
encompasses:
  - { id: earthscience.atmosphere.climate-change, weight: 0.3 }
  - { id: computer.programming.functions, weight: 0.2 }
  - { id: biology.ecology.environmental-issues, weight: 0.1 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: interactive
    title: หาอุณหภูมิสมดุลจากฟลักซ์สุทธิ
    caption: "เส้นคือฟลักซ์สุทธิ $340.25(1-a) - 5.67k x^4$ วัตต์ต่อตารางเมตร เมื่อ $x$ คืออุณหภูมิเป็นร้อยเคลวิน ($x = 2.88$ คือ 288 K) $a$ คืออัลบีโด และ $k$ คือสภาพเปล่งรังสีที่มีผล จุดที่เส้นตัดแกนนอนคืออุณหภูมิสมดุล ทางซ้ายของจุดนั้นฟลักซ์เป็นบวก โลกร้อนขึ้น ทางขวาเป็นลบ โลกเย็นลง ลองลด $k$ (แก๊สเรือนกระจกมากขึ้น) หรือเพิ่ม $a$ แล้วดูว่าจุดตัดเลื่อนไปทางใด"
    widget:
      kind: function-plot
      functions: ["340.25\\cdot(1-a)-5.67\\cdot k\\cdot x^{4}"]
      sliders:
        - { name: a, min: 0.1, max: 0.7, step: 0.02, value: 0.3, label: อัลบีโด }
        - { name: k, min: 0.5, max: 1, step: 0.01, value: 0.61, label: สภาพเปล่งรังสีที่มีผล }
      x: [2, 3.3]
      y: [-300, 300]
  - type: figure
    title: ผลของแบบจำลองสมดุลพลังงานกับขนาดของก้าวเวลา
    src: ebm-output.svg
    alt: "กราฟอุณหภูมิที่เพิ่มขึ้น (K) กับเวลา 0 ถึง 30 ปี หลังเพิ่มแรงบังคับ 3.7 วัตต์ต่อตารางเมตร เส้นทึบสีน้ำเงินใช้ก้าวเวลา 1 ปี เพิ่มขึ้นเร็วในช่วงแรกแล้วค่อย ๆ เข้าใกล้เส้นประสีเขียน สมดุลใหม่ +1.11 K ภายในราว 15 ปี เส้นประสีแดงใช้ก้าวเวลา 10 ปี มีจุดที่ปี 0, 10, 20, 30 ค่า 0, +2.8, −1.4 และ +4.9 K แกว่งแรงขึ้นเรื่อย ๆ หมายเหตุ C = 4.2 × 10⁸ J/(m²·K) α = 0.30 ε = 0.612 เริ่มจากสมดุลเดิม 287.8 K"
    caption: "ก้าวเวลาที่เล็กพอให้ผลราบเรียบ ก้าวที่ใหญ่เกินไปทำให้แกว่งและผิด (วาดโดยทีมคลังรู้ จากผลที่คำนวณด้วย Python)"
  - type: worked-example
    title: คำนวณแบบจำลองสมดุลพลังงานก้าวแรก
    problem: "โลกในแบบจำลองอยู่ที่สมดุล 287.8 K แล้วแรงบังคับเพิ่มทันที $F = 3.7\\ \\mathrm{W/m^2}$ ใช้ $C = 4.2 \\times 10^8\\ \\mathrm{J/(m^2\\cdot K)}$ และก้าวเวลา 1 ปี ($3.15 \\times 10^7$ s) หาอุณหภูมิหลังปีแรก"
    steps:
      - text: "ที่สมดุลเดิม แสงที่ดูดกลืนเท่ากับรังสีที่ออก ฟลักซ์สุทธิจึงเท่ากับ $F = 3.7\\ \\mathrm{W/m^2}$ พอดี"
      - text: "พลังงานที่สะสมใน 1 ปีต่อตารางเมตร $= 3.7 \\times 3.15 \\times 10^7 \\approx 1.17 \\times 10^8\\ \\mathrm{J}$"
        why: "วัตต์คือจูลต่อวินาที ต้องคูณจำนวนวินาทีในหนึ่งปี"
      - text: "อุณหภูมิเพิ่ม $= 1.17 \\times 10^8 / 4.2 \\times 10^8 \\approx 0.28$ K"
      - text: "อุณหภูมิใหม่ $\\approx 287.8 + 0.28 = 288.1$ K ก้าวต่อไปฟลักซ์สุทธิจะน้อยลง เพราะโลกที่อุ่นขึ้นแผ่รังสีมากขึ้น"
    answer: "ราว 288.1 K (เพิ่ม 0.28 K ในปีแรก)"
  - { type: check, problem: earthscience.systems.computational-models.p007, prompt: "แปลงฟลักซ์เป็นพลังงานในหนึ่งปีก่อน" }
  - type: figure
    title: แบบจำลองกล่องคาร์บอน
    src: box-model.svg
    alt: "แผนภาพสามกล่องเรียงจากซ้ายไปขวา กล่องแหล่งปล่อย (เผาเชื้อเพลิงซากดึกดำบรรพ์ ตัดป่า ผลิตปูนซีเมนต์) มีลูกศร E ปล่อย ชี้เข้ากล่องบรรยากาศ (สต็อก A) ซึ่งเขียนว่า A คือคาร์บอนในอากาศ (GtC) 1 ppm = 2.12 GtC ปัจจุบัน 420 ppm ≈ 890 GtC ก่อนอุตสาหกรรม A₀ ≈ 594 GtC จากกล่องบรรยากาศมีลูกศร k(A − A₀) ดูดกลับ ชี้ไปกล่องแหล่งดูดกลับ (มหาสมุทร พืชบนบกและดิน) หัวภาพเขียนว่า อัตราการเปลี่ยนของสต็อก = อัตราเข้า − อัตราออก ด้านล่างเขียนว่า A ปีถัดไป = A + E − k × (A − A₀) ตัวอย่าง E = 10 GtC ต่อปี k = 0.02 ต่อปี"
    caption: "การดูดกลับแปรผันตามส่วนเกินจากระดับก่อนยุคอุตสาหกรรม (วาดโดยทีมคลังรู้ ค่าโดยประมาณ)"
  - type: figure
    title: ผลของแบบจำลองกล่องคาร์บอนและประชากรปลา
    src: model-outputs.svg
    alt: "กราฟสองกราฟ กราฟ ก กล่องคาร์บอน แกนนอนปีนับจาก ค.ศ. 2020 ถึง 80 ปี แกนตั้ง CO₂ 250–550 ppm ทุกเส้นเริ่มที่ 420 ppm เส้นแดงปล่อยคงที่ 10 GtC ต่อปี เพิ่มขึ้นต่อเนื่องถึงราว 497 ppm เส้นส้มลดเป็นเส้นตรงถึงศูนย์ใน 40 ปี ขึ้นถึงราว 434 ppm ที่ปีที่ 14 แล้วลดลงเหลือราว 334 ppm เส้นน้ำเงินหยุดปล่อยทันที ลดลงเหลือราว 308 ppm มีเส้นประ 280 ppm ก่อนอุตสาหกรรม กราฟ ข ประชากรปลา แกนนอน 0–40 ปี แกนตั้ง 0–1,000 ตัน ทุกเส้นเริ่ม 800 ตัน H = 50 เพิ่มแล้วคงที่ราว 887 ตัน H = 100 ลดเล็กน้อยแล้วคงที่ราว 724 ตัน H = 125 ลดช้า ๆ เหลือราว 540 ตันที่ปีที่ 40 H = 150 ลดเร็วขึ้นเรื่อย ๆ จนเป็นศูนย์ราวปีที่ 19 หมายเหตุ r = 0.5 ต่อปี K = 1,000 ตัน ค่าสมมติ"
    caption: "แบบจำลองช่วยเปรียบเทียบฉากทัศน์ การปล่อยหรือการจับที่ต่างกันเล็กน้อยให้ผลระยะยาวต่างกันมาก (วาดโดยทีมคลังรู้ จากผลที่คำนวณด้วย Python)"
  - type: worked-example
    title: จำลองการจับปลาสามปีด้วยมือ
    problem: "ปลา 800 ตัน $r = 0.5$ ต่อปี $K = 1{,}000$ ตัน จับปีละ 150 ตัน ใช้ $N_{t+1} = N_t + rN_t(1 - N_t/K) - H$ หาปริมาณปลาในปีที่ 1, 2 และ 3"
    steps:
      - text: "ปีที่ 1: การเพิ่ม $0.5 \\times 800 \\times (1 - 0.8) = 80$ ได้ $800 + 80 - 150 = 730$ ตัน"
      - text: "ปีที่ 2: การเพิ่ม $0.5 \\times 730 \\times 0.27 = 98.55$ ได้ $730 + 98.55 - 150 \\approx 678.6$ ตัน"
      - text: "ปีที่ 3: การเพิ่ม $0.5 \\times 678.55 \\times 0.32145 \\approx 109.06$ ได้ $678.55 + 109.06 - 150 \\approx 637.6$ ตัน"
        why: "เมื่อปลาน้อยลงจนใกล้ K/2 การเพิ่มตามธรรมชาติมากขึ้น แต่ยังสูงสุดได้เพียง rK/4 = 125 ตัน จึงไม่มีวันทันการจับ 150 ตัน"
      - text: "เขียนเป็นฟังก์ชันแล้ววนลูป 40 รอบ จะพบว่าปลาหมดราวปีที่ 19"
    answer: "730, 678.6 และ 637.6 ตัน ลดลงทุกปีเพราะจับเกินผลผลิตสูงสุดที่ยั่งยืน"
  - { type: check, problem: earthscience.systems.computational-models.p011 }
glossary:
  - { term: แบบจำลองคอมพิวเตอร์, definition: "ชุดสมการและโปรแกรมที่แทนระบบจริงอย่างง่าย ใช้คำนวณว่าระบบจะเปลี่ยนอย่างไรตามเวลา" }
  - { term: สต็อก, definition: "ปริมาณที่สะสมในระบบ ณ เวลาหนึ่ง เช่น คาร์บอนในบรรยากาศ" }
  - { term: การไหล, definition: "อัตราที่ปริมาณเข้าหรือออกจากสต็อก มีหน่วยต่อเวลา" }
  - { term: วิธีออยเลอร์, definition: "การคำนวณทีละก้าวเวลา ค่าใหม่ = ค่าเดิม + อัตราการเปลี่ยน × ก้าวเวลา" }
  - { term: แบบจำลองสมดุลพลังงานมิติศูนย์, definition: "แบบจำลองที่มองทั้งโลกเป็นจุดเดียว ใช้หาอุณหภูมิเฉลี่ยจากพลังงานเข้าและออก" }
  - { term: ผลผลิตสูงสุดที่ยั่งยืน, definition: "ปริมาณที่จับได้มากที่สุดทุกปีโดยประชากรไม่ลดลง ในแบบจำลองลอจิสติกเท่ากับ rK/4" }
  - { term: ฉากทัศน์, definition: "ภาพอนาคตแบบหนึ่งตามข้อสมมติที่เลือก เช่น ปล่อยคงที่ หรือลดการปล่อยจนเป็นศูนย์" }
  - { term: การวิเคราะห์ความไว, definition: "การเปลี่ยนพารามิเตอร์ทีละตัวเพื่อดูว่าผลของแบบจำลองเปลี่ยนมากเพียงใด" }
flashcards:
  - { front: "สูตรก้าวเวลาของวิธีออยเลอร์", back: "ค่าใหม่ = ค่าเดิม + (อัตราเข้า − อัตราออก) × Δt" }
  - { front: "อุณหภูมิสมดุลของแบบจำลองสมดุลพลังงาน", back: "T = [S(1 − α)/(4εσ)]^(1/4) ได้ 254.6 K เมื่อ ε = 1 และราว 288 K เมื่อ ε ≈ 0.61" }
  - { front: "ก้าวเวลาใหญ่เกินไปทำให้เกิดอะไร", back: "ผลกระโดดข้ามสมดุล แกว่ง และผิด ต้องลดก้าวแล้วตรวจว่าผลไม่เปลี่ยน" }
  - { front: "ผลผลิตสูงสุดที่ยั่งยืนของแบบจำลองลอจิสติก", back: "rK/4 ที่ประชากร K/2 จับเกินค่านี้ประชากรจะลดลงไม่หยุด" }
  - { front: "ตรวจแบบจำลองอย่างไร", back: "ตรวจหน่วยและก้าวเวลา เทียบกับข้อมูลในอดีต วิเคราะห์ความไว และบอกข้อจำกัด" }
