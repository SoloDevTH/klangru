problems:
  - id: biology.ecology.adaptation-food-chains.p001
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 1
    type: mcq
    stem: "ในโซ่อาหาร ข้าว → ตั๊กแตน → กบ สิ่งมีชีวิตใดเป็นผู้ผลิต"
    choices:
      - { id: a, text: "ข้าว", correct: true }
      - { id: b, text: "ตั๊กแตน", feedback: "ตั๊กแตนกินข้าว จึงเป็นผู้บริโภค ไม่ได้สร้างอาหารเอง" }
      - { id: c, text: "กบ", feedback: "กบอยู่ท้ายโซ่ เป็นผู้บริโภคที่กินตั๊กแตน" }
      - { id: d, text: "ดวงอาทิตย์", feedback: "ดวงอาทิตย์ให้แสง แต่ไม่ใช่สิ่งมีชีวิต จึงไม่ใช่ผู้ผลิต" }
    hints:
      - "ผู้ผลิตสร้างอาหารเองได้"
      - "สิ่งมีชีวิตใดในโซ่นี้สร้างอาหารเองได้ด้วยแสง"
    solution: "ข้าวเป็นพืช สร้างอาหารเองได้ด้วยแสง จึงเป็นผู้ผลิต และอยู่ต้นโซ่อาหาร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.adaptation-food-chains.p002
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 1
    type: match
    stem: "จับคู่สิ่งมีชีวิตกับลักษณะที่ช่วยให้อยู่รอดในแหล่งที่อยู่"
    pairs:
      - { left: "ผักตบชวา", right: "ก้านใบพองมีช่องอากาศ ลอยน้ำได้" }
      - { left: "โกงกาง", right: "รากค้ำจุนยึดดินเลน" }
      - { left: "กระบองเพชร", right: "ใบเป็นหนาม ลำต้นอวบเก็บน้ำ" }
      - { left: "เป็ด", right: "เท้ามีพังผืดไว้พุ้ยน้ำ" }
      - { left: "ปลา", right: "มีเหงือกหายใจในน้ำ" }
    hints:
      - "คิดว่าสิ่งมีชีวิตแต่ละชนิดอยู่ที่ไหน"
      - "ที่แห้งแล้งต้องเก็บน้ำ ที่มีน้ำต้องลอยหรือว่ายได้ ดินเลนต้องยึดให้แน่น"
    solution: "ผักตบชวามีก้านใบพองลอยน้ำ โกงกางมีรากค้ำจุนในดินเลน กระบองเพชรมีใบเป็นหนามและลำต้นเก็บน้ำ เป็ดมีพังผืดว่ายน้ำ และปลามีเหงือกหายใจในน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.adaptation-food-chains.p003
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 1
    type: text
    stem: "เห็ด รา และแบคทีเรียที่ย่อยซากพืช ซากสัตว์ และมูล ให้กลายเป็นแร่ธาตุคืนสู่ดิน มีบทบาทเรียกว่าอะไร"
    accepted: ["ผู้ย่อยสลาย", "ผู้ย่อย", "decomposer", "decomposers"]
    hints:
      - "สิ่งมีชีวิตกลุ่มนี้ไม่ได้สร้างอาหารเอง และไม่ได้ล่าสัตว์"
      - "มันทำให้ซากเน่าเปื่อยและสลายไป"
    misconceptions:
      - { match: "ผู้ผลิต", feedback: "เห็ดและราไม่มีสีเขียว สร้างอาหารเองไม่ได้ จึงไม่ใช่ผู้ผลิต" }
      - { match: "ผู้บริโภค", feedback: "สิ่งมีชีวิตกลุ่มนี้มีชื่อบทบาทเฉพาะ เพราะได้อาหารจากการย่อยซาก" }
    solution: "ผู้ย่อยสลาย ย่อยซากและมูลให้เป็นแร่ธาตุ พืชจึงนำแร่ธาตุกลับไปใช้ได้อีก"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.adaptation-food-chains.p004
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 2
    type: order
    stem: "ในทุ่งนามีหนูกินข้าว งูกินหนู และเหยี่ยวกินงู เรียงเป็นโซ่อาหาร เริ่มจากผู้ผลิต"
    items:
      - "ข้าว"
      - "หนู"
      - "งู"
      - "เหยี่ยว"
    hints:
      - "โซ่อาหารเริ่มที่สิ่งมีชีวิตที่สร้างอาหารเองได้"
      - "ต่อด้วยผู้ที่กินสิ่งนั้น ไปจนถึงผู้ล่าลำดับสุดท้าย"
    solution: "ข้าว → หนู → งู → เหยี่ยว ข้าวเป็นผู้ผลิต หนูกินข้าว งูกินหนู และเหยี่ยวกินงู"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.adaptation-food-chains.p005
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 2
    type: mcq
    stem: "ลูกศรในโซ่อาหาร หญ้า → วัว หมายความว่าอย่างไร"
    choices:
      - { id: a, text: "หญ้าถูกวัวกิน อาหารและพลังงานส่งจากหญ้าไปที่วัว", correct: true }
      - { id: b, text: "วัวถูกหญ้ากิน", feedback: "ลูกศรชี้จากสิ่งที่ถูกกินไปหาผู้กิน วัวเป็นผู้กินหญ้า" }
      - { id: c, text: "หญ้าเดินไปหาวัว", feedback: "ลูกศรไม่ได้บอกการเคลื่อนที่ แต่บอกทางที่อาหารส่งต่อไป" }
      - { id: d, text: "หญ้ากับวัวช่วยเหลือกัน", feedback: "โซ่อาหารบอกว่าใครกินใคร ไม่ได้บอกการช่วยเหลือกัน" }
    hints:
      - "ใครกินใคร ระหว่างหญ้ากับวัว"
      - "ลูกศรชี้ไปหาผู้กิน"
    solution: "ลูกศรชี้จากสิ่งที่ถูกกินไปหาผู้กิน หญ้า → วัว จึงหมายถึงวัวกินหญ้า อาหารและพลังงานส่งจากหญ้าไปที่วัว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.adaptation-food-chains.p006
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 2
    type: mcq
    stem: "ผึ้งบินไปดูดน้ำหวานจากดอกลำไยในสวนที่เชียงใหม่ ความสัมพันธ์ระหว่างผึ้งกับต้นลำไยเป็นแบบใด"
    choices:
      - { id: a, text: "ช่วยเหลือกัน ผึ้งได้น้ำหวาน ต้นลำไยได้รับการถ่ายเรณูจึงติดผล", correct: true }
      - { id: b, text: "ผู้ล่ากับเหยื่อ", feedback: "ผึ้งไม่ได้ฆ่าหรือกินต้นลำไย ดอกยังติดผลได้" }
      - { id: c, text: "เบียดเบียน ผึ้งได้ประโยชน์ ต้นลำไยเสียประโยชน์", feedback: "ต้นลำไยไม่ได้เสียประโยชน์ กลับได้ผึ้งช่วยพาละอองเรณู" }
      - { id: d, text: "ไม่มีความสัมพันธ์กัน", feedback: "ทั้งสองฝ่ายได้อะไรบางอย่างจากกัน" }
    hints:
      - "ผึ้งได้อะไร และต้นลำไยได้อะไร"
      - "ละอองเรณูติดตัวผึ้งไปที่ดอกอื่น"
    solution: "ผึ้งได้น้ำหวานเป็นอาหาร ต้นลำไยได้ผึ้งช่วยพาละอองเรณูไปดอกอื่นทำให้ติดผล ทั้งสองฝ่ายได้ประโยชน์ เป็นความสัมพันธ์แบบช่วยเหลือกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.adaptation-food-chains.p007
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 2
    type: numeric
    stem: "ในโซ่อาหาร ข้าว → ตั๊กแตน → กบ → งู → เหยี่ยว มีผู้บริโภคกี่ชนิด"
    answer: { value: 4, unit: ชนิด }
    hints:
      - "ผู้บริโภคคือสิ่งมีชีวิตที่ต้องกินสิ่งมีชีวิตอื่น"
      - "นับทุกตัวยกเว้นผู้ผลิต"
    misconceptions:
      - { match: 5, feedback: "นับข้าวด้วย แต่ข้าวเป็นผู้ผลิต ไม่ใช่ผู้บริโภค" }
      - { match: 1, feedback: "ผู้บริโภคไม่ได้มีแค่ตัวสุดท้าย ทุกตัวที่กินสิ่งอื่นเป็นผู้บริโภค" }
    solution: "ผู้บริโภค ได้แก่ ตั๊กแตน กบ งู และเหยี่ยว รวม 4 ชนิด ข้าวเป็นผู้ผลิต"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.adaptation-food-chains.p008
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 2
    type: mcq
    stem: "ข้อใดเป็นความสัมพันธ์ระหว่างสิ่งมีชีวิตกับสิ่งไม่มีชีวิต"
    choices:
      - { id: a, text: "ต้นมะม่วงใช้แสงแดดและน้ำในการสร้างอาหาร", correct: true }
      - { id: b, text: "แมวจับหนูกิน", feedback: "แมวและหนูเป็นสิ่งมีชีวิตทั้งคู่" }
      - { id: c, text: "กล้วยไม้เกาะบนกิ่งต้นมะขาม", feedback: "กล้วยไม้และต้นมะขามเป็นสิ่งมีชีวิตทั้งคู่" }
      - { id: d, text: "เห็บดูดเลือดสุนัข", feedback: "เห็บและสุนัขเป็นสิ่งมีชีวิตทั้งคู่" }
    hints:
      - "หาข้อที่มีสิ่งที่ไม่ใช่สิ่งมีชีวิต"
      - "แสงแดด น้ำ ดิน อากาศ ไม่ใช่สิ่งมีชีวิต"
    solution: "แสงแดดและน้ำเป็นสิ่งไม่มีชีวิต ต้นมะม่วงใช้สิ่งเหล่านี้สร้างอาหาร ส่วนข้ออื่นเป็นความสัมพันธ์ระหว่างสิ่งมีชีวิตด้วยกัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.adaptation-food-chains.p009
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 3
    type: numeric
    stem: "จากแผนภาพสายใยอาหารในสระน้ำ มีโซ่อาหารที่เริ่มจากสาหร่ายไปจนถึงนกกระยางทั้งหมดกี่สาย"
    figure: { src: p-pond-web.svg, alt: "แผนภาพสายใยอาหารในสระน้ำ มีกล่อง 6 กล่อง ลูกศรชี้จากสิ่งที่ถูกกินไปหาผู้กิน สาหร่ายชี้ไปที่ลูกน้ำยุงและลูกอ๊อด ลูกน้ำยุงชี้ไปที่ปลาหางนกยูง ปลาหางนกยูงชี้ไปที่ปลาช่อนและนกกระยาง ลูกอ๊อดชี้ไปที่ปลาช่อน และปลาช่อนชี้ไปที่นกกระยาง" }
    answer: { value: 3, unit: สาย }
    hints:
      - "เริ่มที่สาหร่าย แล้วเดินตามลูกศรไปทีละทางจนถึงนกกระยาง"
      - "ปลาหางนกยูงมีลูกศรออก 2 ทาง แต่ละทางนับเป็นคนละสาย"
    misconceptions:
      - { match: 7, feedback: "นับจำนวนลูกศร ต้องนับเส้นทางที่เดินตามลูกศรจากสาหร่ายจนถึงนกกระยาง" }
      - { match: 2, feedback: "ยังขาดหนึ่งสาย ปลาหางนกยูงถูกทั้งปลาช่อนและนกกระยางกิน จึงแยกเป็น 2 สาย" }
    solution: "1) สาหร่าย → ลูกน้ำยุง → ปลาหางนกยูง → ปลาช่อน → นกกระยาง 2) สาหร่าย → ลูกน้ำยุง → ปลาหางนกยูง → นกกระยาง 3) สาหร่าย → ลูกอ๊อด → ปลาช่อน → นกกระยาง รวม 3 สาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.adaptation-food-chains.p010
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 3
    type: mcq
    stem: "จากแผนภาพสายใยอาหารในสระน้ำ ถ้ามีคนจับปลาหางนกยูงไปหมด จำนวนลูกน้ำยุงในสระน่าจะเป็นอย่างไร"
    figure: { src: p-pond-web.svg, alt: "แผนภาพสายใยอาหารในสระน้ำ มีกล่อง 6 กล่อง ลูกศรชี้จากสิ่งที่ถูกกินไปหาผู้กิน สาหร่ายชี้ไปที่ลูกน้ำยุงและลูกอ๊อด ลูกน้ำยุงชี้ไปที่ปลาหางนกยูง ปลาหางนกยูงชี้ไปที่ปลาช่อนและนกกระยาง ลูกอ๊อดชี้ไปที่ปลาช่อน และปลาช่อนชี้ไปที่นกกระยาง" }
    choices:
      - { id: a, text: "เพิ่มขึ้น เพราะไม่มีผู้ล่ากินลูกน้ำยุง", correct: true }
      - { id: b, text: "ลดลง เพราะขาดอาหาร", feedback: "ลูกน้ำยุงกินสาหร่าย ไม่ได้กินปลาหางนกยูง อาหารของมันจึงไม่ได้หายไป" }
      - { id: c, text: "เท่าเดิม เพราะลูกน้ำยุงไม่เกี่ยวกับปลาหางนกยูง", feedback: "ดูลูกศร ลูกน้ำยุงชี้ไปที่ปลาหางนกยูง แปลว่าถูกปลาหางนกยูงกิน" }
      - { id: d, text: "ลดลง เพราะนกกระยางจะหันมากินลูกน้ำยุงแทน", feedback: "ในแผนภาพไม่มีลูกศรจากลูกน้ำยุงไปที่นกกระยาง" }
    hints:
      - "ลูกศรจากลูกน้ำยุงชี้ไปที่ใคร"
      - "ถ้าผู้ล่าหายไป เหยื่อจะเป็นอย่างไร"
    solution: "ปลาหางนกยูงเป็นผู้ล่าลูกน้ำยุง เมื่อปลาหางนกยูงหายไป ลูกน้ำยุงจะรอดมากขึ้นและเพิ่มจำนวน ชาวบ้านจึงนิยมเลี้ยงปลาหางนกยูงในโอ่งน้ำเพื่อช่วยกำจัดลูกน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.adaptation-food-chains.p011
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 3
    type: mcq
    stem: "ใบบัวที่แผ่อยู่บนผิวน้ำมีปากใบ (รูเล็ก ๆ ที่ให้อากาศเข้าออก) อยู่ด้านบนของใบเป็นส่วนใหญ่ ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "ด้านล่างของใบติดน้ำ ปากใบด้านบนจึงรับอากาศได้", correct: true }
      - { id: b, text: "ปากใบด้านบนช่วยให้ใบจมลงในน้ำ", feedback: "บัวต้องการให้ใบลอยรับแสง ปากใบไม่ได้ทำให้ใบจม" }
      - { id: c, text: "ปากใบอยู่ด้านไหนก็ได้ ไม่มีผลต่อการอยู่รอด", feedback: "ถ้าปากใบอยู่ด้านที่ติดน้ำ อากาศจะเข้าออกได้ยาก" }
      - { id: d, text: "บัวตั้งใจย้ายปากใบขึ้นมาด้านบนเมื่อปลูกในน้ำ", feedback: "ลักษณะนี้ถ่ายทอดมาจากพ่อแม่ ต้นบัวไม่ได้ตั้งใจเปลี่ยน" }
    hints:
      - "ด้านใดของใบบัวสัมผัสอากาศ"
      - "ปากใบเป็นทางให้อากาศเข้าออก"
    solution: "ด้านล่างของใบบัวแนบผิวน้ำ ส่วนด้านบนสัมผัสอากาศ ปากใบด้านบนจึงแลกเปลี่ยนอากาศได้ เป็นโครงสร้างที่เหมาะกับการอยู่ในน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.adaptation-food-chains.p012
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 3
    type: match
    stem: "ชายเลนแห่งหนึ่งที่จังหวัดสมุทรสาครมีน้ำทะเลท่วมถึงวันละสองครั้ง จับคู่สิ่งมีชีวิตกับผลที่น่าจะเกิดเมื่ออยู่ในชายเลนนี้"
    pairs:
      - { left: "ต้นโกงกาง", right: "อยู่รอดได้ดี มีรากค้ำจุนและทนน้ำเค็ม" }
      - { left: "ปลาตีน", right: "อยู่รอดได้ดี คืบบนเลนได้ตอนน้ำลง" }
      - { left: "ต้นมะม่วง", right: "อยู่ไม่ได้ เพราะทนน้ำเค็มท่วมรากไม่ได้" }
      - { left: "ปลาทองที่เลี้ยงในตู้", right: "อยู่ไม่ได้ เพราะเป็นปลาน้ำจืด" }
    hints:
      - "ชายเลนมีน้ำเค็มและดินเลน น้ำขึ้นลงทุกวัน"
      - "สิ่งมีชีวิตที่ปกติพบในชายเลนมีโครงสร้างที่เหมาะอยู่แล้ว"
    solution: "โกงกางและปลาตีนพบตามธรรมชาติในป่าชายเลน มีโครงสร้างที่เหมาะจึงอยู่รอดได้ดี ส่วนต้นมะม่วงและปลาทองเป็นสิ่งมีชีวิตของที่น้ำจืดหรือบนบก จึงอยู่ในน้ำเค็มไม่ได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.adaptation-food-chains.p013
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 4
    type: mcq
    stem: "ชาวนาในหมู่บ้านหนึ่งจับกบในนาไปขายจนกบเหลือน้อยมาก ในนามีโซ่อาหาร ข้าว → ตั๊กแตน → กบ → งู ปีต่อมาน่าจะเกิดอะไรขึ้น"
    choices:
      - { id: a, text: "ตั๊กแตนเพิ่มขึ้น ข้าวถูกกัดกินเสียหายมากขึ้น และงูมีอาหารน้อยลง", correct: true }
      - { id: b, text: "ตั๊กแตนลดลง เพราะกบไม่ได้ช่วยดูแล", feedback: "กบเป็นผู้ล่าตั๊กแตน เมื่อกบลดลงตั๊กแตนจะรอดมากขึ้น" }
      - { id: c, text: "ข้าวได้ผลมากขึ้น เพราะไม่มีกบเหยียบต้นข้าว", feedback: "ตั๊กแตนที่เพิ่มขึ้นจะกินต้นข้าว ข้าวจึงน่าจะได้ผลน้อยลง" }
      - { id: d, text: "งูเพิ่มขึ้น เพราะมีที่อยู่มากขึ้น", feedback: "งูกินกบ เมื่อกบลดลงงูจะขาดอาหาร" }
    hints:
      - "ดูว่ากบกินอะไร และอะไรกินกบ"
      - "ไล่ผลทีละขั้นทั้งด้านซ้ายและขวาของกบในโซ่อาหาร"
    solution: "กบกินตั๊กแตน เมื่อกบลดลง ตั๊กแตนจึงเพิ่มขึ้นและกินข้าวมากขึ้น ส่วนงูซึ่งกินกบจะขาดอาหาร การจับสัตว์มากเกินไปจึงกระทบทั้งโซ่อาหาร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.adaptation-food-chains.p014
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 4
    type: mcq
    multiple: true
    stem: "โรงเรียนริมคลองต้องการช่วยดูแลคลองให้สัตว์น้ำอยู่ได้ ข้อใดช่วยได้จริง (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "เก็บขยะพลาสติกไม่ให้ลงคลอง", correct: true }
      - { id: b, text: "ไม่จับปลาในช่วงฤดูวางไข่", correct: true }
      - { id: c, text: "ปลูกต้นไม้ริมคลองให้ร่มเงาและกันดินพัง", correct: true }
      - { id: d, text: "เทน้ำยาล้างจานที่เหลือลงคลองเพราะน้ำในคลองจะเจือจางเอง", feedback: "สารเคมีทำให้น้ำเสีย สัตว์น้ำอาจตาย น้ำในคลองเจือจางไม่ทันเมื่อทิ้งทุกวัน" }
      - { id: e, text: "จับปลาช่อนออกให้หมด ปลาเล็กจะได้ไม่ถูกกิน", feedback: "ปลาช่อนเป็นส่วนหนึ่งของโซ่อาหาร ถ้าหายไปจะกระทบสัตว์อื่นทั้งระบบ" }
    hints:
      - "สิ่งใดทำให้น้ำสกปรก หรือทำให้สัตว์ชนิดใดหายไป"
      - "การช่วยที่ดีคือการรักษาทั้งที่อยู่และโซ่อาหารไว้"
    solution: "เก็บขยะ ไม่จับปลาช่วงวางไข่ และปลูกต้นไม้ริมคลอง ช่วยรักษาที่อยู่และสัตว์น้ำ ส่วนการทิ้งสารเคมีลงคลองทำให้น้ำเสีย และการกำจัดผู้ล่าทำให้โซ่อาหารเสียสมดุล"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.adaptation-food-chains.p015
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 4
    type: text
    stem: "ในโซ่อาหาร หญ้า → ตั๊กแตน → นกเอี้ยง → เหยี่ยว สัตว์ชนิดใดเป็นทั้งผู้ล่าและเหยื่อ ตอบมาหนึ่งชนิดที่อยู่ระหว่างตั๊กแตนกับเหยี่ยว"
    accepted: ["นกเอี้ยง", "เอี้ยง"]
    hints:
      - "ผู้ล่าคือสัตว์ที่กินสัตว์อื่น เหยื่อคือสัตว์ที่ถูกสัตว์อื่นกิน"
      - "สัตว์ที่อยู่ระหว่างตั๊กแตนกับเหยี่ยวกินตั๊กแตน และถูกเหยี่ยวกิน"
    misconceptions:
      - { match: "ตั๊กแตน", feedback: "ตั๊กแตนกินหญ้า ซึ่งเป็นพืช จึงไม่ได้เป็นผู้ล่า" }
      - { match: "เหยี่ยว", feedback: "เหยี่ยวอยู่ท้ายโซ่ ไม่มีใครกินในโซ่นี้ จึงไม่ได้เป็นเหยื่อ" }
    solution: "นกเอี้ยงกินตั๊กแตนจึงเป็นผู้ล่า และถูกเหยี่ยวกินจึงเป็นเหยื่อด้วย ตั๊กแตนเป็นเหยื่อแต่กินพืช ส่วนเหยี่ยวเป็นผู้ล่าลำดับสุดท้าย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.adaptation-food-chains.p016
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 5
    type: mcq
    stem: "บนหาดทรายสีขาวมีหนูชนิดหนึ่งที่มีทั้งตัวขนสีอ่อนและตัวขนสีเข้ม และมีนกฮูกล่าหนู นักวิทยาศาสตร์นับหนูทุกปี พบว่าหนูสีอ่อนเพิ่มจากร้อยละ 50 เป็นร้อยละ 80 ในเวลา 10 ปี ข้อใดเป็นคำอธิบายที่มีหลักฐานรองรับดีที่สุด"
    choices:
      - { id: a, text: "หนูสีอ่อนกลมกลืนกับทรายขาว นกฮูกจับได้ยากกว่า จึงรอดและมีลูกที่ขนสีอ่อนมากกว่า", correct: true }
      - { id: b, text: "หนูสีเข้มย้อมขนตัวเองให้อ่อนลงเพื่อหลบนกฮูก", feedback: "หนูเปลี่ยนสีขนเองไม่ได้ สีขนถ่ายทอดจากพ่อแม่" }
      - { id: c, text: "แดดบนหาดทรายทำให้ขนของหนูทุกตัวซีดลง", feedback: "ถ้าแดดทำให้ซีดทุกตัว จะไม่มีหนูสีเข้มเหลืออยู่ ข้อมูลยังมีหนูสีเข้มร้อยละ 20" }
      - { id: d, text: "นกฮูกชอบกินหนูสีอ่อนมากกว่า", feedback: "ถ้าเป็นเช่นนั้นหนูสีอ่อนต้องลดลง แต่ข้อมูลบอกว่าเพิ่มขึ้น" }
    hints:
      - "สีใดมองเห็นยากบนทรายสีขาว"
      - "ตัวที่รอดได้จะมีลูก และลูกมักมีสีขนเหมือนพ่อแม่"
    solution: "หนูสีอ่อนกลมกลืนกับทราย นกฮูกมองเห็นยาก จึงรอดและมีลูกได้มากกว่า ลูกได้สีขนจากพ่อแม่ หนูสีอ่อนจึงเพิ่มขึ้นในแต่ละรุ่น นี่คือการปรับตัวที่เกิดผ่านรุ่นต่อรุ่น และเมื่อเกิดต่อเนื่องนานมากจะนำไปสู่วิวัฒนาการ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.ecology.adaptation-food-chains.p017
    topics: [biology.ecology.adaptation-food-chains]
    difficulty: 5
    type: mcq
    stem: "ชาวสวนพ่นยาฆ่าแมลงในสวนทุกสัปดาห์ หนอนและตั๊กแตนตายเกือบหมด ต่อมาพบว่านกกินแมลงในสวนก็ลดลงด้วย และหลายเดือนต่อมาดอกไม้ติดผลน้อยลง ข้อใดอธิบายได้ครบที่สุด"
    choices:
      - { id: a, text: "นกขาดอาหารเพราะแมลงที่เป็นเหยื่อลดลง และยาฆ่าแมลงยังฆ่าผึ้งที่ช่วยถ่ายเรณู ดอกจึงติดผลน้อย", correct: true }
      - { id: b, text: "นกลดลงเพราะนกไม่ชอบกลิ่นยา และดอกติดผลน้อยเพราะอากาศร้อน", feedback: "คำอธิบายนี้ไม่ได้ใช้ความสัมพันธ์ในโซ่อาหารและการถ่ายเรณูซึ่งมีหลักฐานชัดกว่า" }
      - { id: c, text: "ยาฆ่าแมลงทำให้ต้นไม้สร้างอาหารเพิ่ม จึงไม่ต้องติดผล", feedback: "ยาฆ่าแมลงไม่ได้ทำให้พืชสร้างอาหารเพิ่ม และพืชยังต้องติดผลเพื่อขยายพันธุ์" }
      - { id: d, text: "นกเพิ่มขึ้นแต่ย้ายไปอยู่ที่อื่น", feedback: "ข้อมูลบอกว่านกในสวนลดลง และไม่ได้อธิบายเรื่องดอกติดผลน้อย" }
    hints:
      - "นกกินแมลงต้องพึ่งอะไรเป็นอาหาร"
      - "ดอกไม้ต้องอาศัยสัตว์ชนิดใดในการถ่ายเรณู ยาฆ่าแมลงทำอะไรกับสัตว์นั้น"
    solution: "ยาฆ่าแมลงทำให้แมลงที่เป็นเหยื่อลดลง นกกินแมลงจึงขาดอาหาร ยาเดียวกันยังฆ่าผึ้งและแมลงที่ช่วยถ่ายเรณู ดอกจึงติดผลน้อยลง จึงควรใช้สารเคมีเท่าที่จำเป็น"
    license: CC-BY-SA-4.0
    ai_assisted: true
