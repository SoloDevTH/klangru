<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="sans-serif">
<title>ตารางแก้ปัญหาจากคู่มือพัดลมตั้งโต๊ะสมมุติ</title>
<defs></defs>
<rect x="0" y="0" width="860" height="420" fill="#fff"/>
<text x="20.0" y="36.0" font-size="20" text-anchor="start" fill="#1f5fbf" font-weight="bold">คู่มือพัดลมตั้งโต๊ะ (สมมุติ): ตารางแก้ปัญหาเบื้องต้น</text>
<rect x="20.0" y="56.0" width="820.0" height="40.0" rx="0" fill="#e3f2fd" stroke="#333" stroke-width="1.5"/>
<text x="32.0" y="83.0" font-size="18" text-anchor="start" fill="#111" font-weight="bold">อาการ</text>
<text x="312.0" y="83.0" font-size="18" text-anchor="start" fill="#111" font-weight="bold">สาเหตุที่เป็นไปได้</text>
<text x="572.0" y="83.0" font-size="18" text-anchor="start" fill="#111" font-weight="bold">วิธีแก้</text>
<rect x="20.0" y="96.0" width="820.0" height="52.0" rx="0" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="32.0" y="129.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">ไฟไม่ติด ใบพัดไม่หมุน</text>
<text x="312.0" y="129.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">ปลั๊กหลวม</text>
<text x="572.0" y="129.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">เสียบปลั๊กให้แน่น</text>
<rect x="20.0" y="148.0" width="820.0" height="52.0" rx="0" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="32.0" y="181.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">ใบพัดหมุน แต่มีเสียงดัง</text>
<text x="312.0" y="181.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">ฝาครอบใบพัดหลวม</text>
<text x="572.0" y="181.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">ถอดปลั๊ก แล้วขันฝาครอบให้แน่น</text>
<rect x="20.0" y="200.0" width="820.0" height="52.0" rx="0" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="32.0" y="233.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">หัวพัดลมไม่ส่าย</text>
<text x="312.0" y="233.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">ปุ่มส่ายไม่ได้กด</text>
<text x="572.0" y="233.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">กดปุ่มส่ายที่ด้านบนลง</text>
<rect x="20.0" y="252.0" width="820.0" height="52.0" rx="0" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="32.0" y="285.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">ทำแล้วยังไม่หาย</text>
<text x="312.0" y="285.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">ชิ้นส่วนภายในเสีย</text>
<text x="572.0" y="285.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">หยุดใช้ ส่งศูนย์บริการ</text>
<line x1="300.0" y1="56.0" x2="300.0" y2="304.0" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
<line x1="560.0" y1="56.0" x2="560.0" y2="304.0" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
<rect x="20.0" y="330.0" width="820.0" height="74.0" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
<text x="36.0" y="360.0" font-size="18" text-anchor="start" fill="#c62828" font-weight="bold">คำเตือน: ถอดปลั๊กทุกครั้งก่อนทำความสะอาดหรือถอดชิ้นส่วน</text>
<text x="36.0" y="390.0" font-size="17" text-anchor="start" fill="#111" font-weight="normal">อย่าสอดนิ้วหรือสิ่งของเข้าไปในฝาครอบขณะใบพัดหมุน</text>
</svg>
