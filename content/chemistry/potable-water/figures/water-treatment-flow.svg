<text x="120.0" y="264.2" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">8 ถังน้ำใส</text>
<text x="120.0" y="283.2" font-size="15" fill="#222" text-anchor="middle">ส่งไปหอถังสูง</text>
<text x="120.0" y="302.2" font-size="15" fill="#222" text-anchor="middle">และบ้านเรือน</text>
<text x="450.0" y="365.0" font-size="14" fill="#444" text-anchor="middle">ขั้น 3–5 กำจัดความขุ่นด้วยการทำให้ตะกอนรวมตัวแล้วตกตะกอน ขั้น 6 คือการกรอง ขั้น 7 ฆ่าเชื้อ</text>
<text x="450.0" y="388.0" font-size="14" fill="#444" text-anchor="middle">น้ำบาดาลมักข้ามขั้น 3–5 แต่อาจต้องเติมอากาศและกรองเพื่อกำจัดเหล็ก</text></svg>
