  - { framework: au-ac9-mathematics, indicators: ["AC9M10SP01"], coverage: full, note: "การพิสูจน์ทดสอบผ่านการเรียงขั้นพิสูจน์ การเลือกเหตุผลของขั้น และการหาข้อบกพร่อง (แอปตรวจการเขียนพิสูจน์อิสระไม่ได้) และใช้ทฤษฎีบทแก้ปัญหา" }
  - { framework: uk-nc-mathematics, indicators: ["UKNC-MA-KS3-G-07"], coverage: partial, note: "พิสูจน์สมบัติของสามเหลี่ยม สี่เหลี่ยมด้านขนาน และวงกลม (วงกลมทุกวงคล้ายกัน) ไม่ได้ใช้ซอฟต์แวร์เรขาคณิต" }
  - { framework: us-ccss-math, indicators: ["G-CO.9", "G-CO.11", "G-SRT.3", "G-C.1", "G-GPE.4", "G-GMD.1"], coverage: partial, note: "แอปตรวจการเขียนพิสูจน์เองไม่ได้ จึงฝึกด้วยการเรียงขั้น เลือกเหตุผล และหาข้อบกพร่อง (ตามคำสั่งงาน ตัวชี้วัดที่ให้เขียนพิสูจน์จับคู่ partial) เนื้อหาครบ: มุมตรงข้าม มุมแย้ง/สมนัย เส้นแบ่งครึ่งตั้งฉากและบทกลับ สมบัติสี่เหลี่ยมด้านขนาน เกณฑ์ ม.ม. วงกลมคล้ายกัน พิสูจน์ด้วยพิกัด เหตุผลของสูตรวงกลม พีระมิด กรวย ทรงกระบอก" }
  - { framework: us-ccss-math, indicators: ["G-CO.7", "G-SRT.2"], coverage: partial, note: "อธิบายความเท่ากันทุกประการและความคล้ายด้วยการแปลงในบทเรียน และมีโจทย์จับคู่จุดของรูปคล้าย แต่ยังไม่มีโจทย์ที่ให้หาการแปลงที่ทับรูปจริง" }
  - { framework: us-ccss-math, indicators: ["G-GMD.2"], coverage: full, note: "ปริมาตรทรงกลมด้วยหลักของคาวาเลียรี (ครึ่งทรงกลม = ทรงกระบอกเจาะกรวย) มีโจทย์คำนวณพื้นที่หน้าตัด" }
