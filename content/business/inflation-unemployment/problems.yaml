problems:
- id: business.econ.inflation-unemployment.p001
  topics:
  - business.econ.inflation-unemployment
  difficulty: 1
  type: mcq
  stem: '**ภาวะเงินเฟ้อ** คืออะไร'
  choices:
  - id: a
    text: ภาวะที่ระดับราคาสินค้าและบริการโดยทั่วไปสูงขึ้นต่อเนื่อง
    correct: true
  - id: b
    text: ภาวะที่ราคาสินค้าชนิดเดียวสูงขึ้นในวันเดียว
    feedback: เงินเฟ้อดูราคาโดยรวมหลายสินค้าในช่วงเวลาหนึ่ง ไม่ใช่สินค้าชนิดเดียว
  - id: c
    text: ภาวะที่คนมีเงินมากขึ้นทุกคน
    feedback: เงินเฟ้อคือราคาสูงขึ้น ไม่ได้แปลว่าทุกคนมีเงินมากขึ้น
  - id: d
    text: ภาวะที่ราคาสินค้าโดยทั่วไปลดลง
    feedback: นั่นคือภาวะเงินฝืด
  hints:
  - คิดถึงคำว่า "ระดับราคาโดยทั่วไป"
  - เงินเฟ้อทำให้เงินจำนวนเท่าเดิมซื้อของได้น้อยลง
  solution: เงินเฟ้อคือระดับราคาสินค้าและบริการโดยทั่วไปสูงขึ้นอย่างต่อเนื่อง ทำให้อำนาจซื้อของเงินลดลง ตรงข้ามกับเงินฝืดที่ระดับราคาโดยทั่วไปลดลงต่อเนื่อง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.inflation-unemployment.p002
  topics:
  - business.econ.inflation-unemployment
  difficulty: 1
  type: mcq
  stem: ข้อใดนับเป็น **ผู้ว่างงาน**
  choices:
  - id: a
    text: พี่โอ๊ตเรียนจบแล้ว ยังไม่มีงาน และกำลังส่งใบสมัครงานทุกสัปดาห์
    correct: true
  - id: b
    text: น้องเมย์เป็นนักเรียน ม.3 เรียนเต็มเวลา
    feedback: นักเรียนที่ไม่ได้หางานอยู่นอกกำลังแรงงาน ไม่นับเป็นผู้ว่างงาน
  - id: c
    text: คุณตาเกษียณแล้วและไม่ต้องการทำงาน
    feedback: ผู้เกษียณที่ไม่หางานอยู่นอกกำลังแรงงาน
  - id: d
    text: น้าต้อยขายของออนไลน์ที่บ้านวันละหลายชั่วโมง
    feedback: ขายของออนไลน์คือมีงานทำ
  hints:
  - ผู้ว่างงานต้องไม่มีงานทำ และต้องพร้อมทำงานหรือกำลังหางาน
  - คนที่ไม่หางานอยู่นอกกำลังแรงงาน
  solution: ผู้ว่างงานคือผู้ที่ไม่มีงานทำ พร้อมทำงาน และกำลังหางาน นักเรียนเต็มเวลาและผู้เกษียณที่ไม่หางานอยู่นอกกำลังแรงงาน ส่วนผู้ที่ขายของออนไลน์เป็นผู้มีงานทำ
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.inflation-unemployment.p003
  topics:
  - business.econ.inflation-unemployment
  difficulty: 2
  type: numeric
  stem: ก๋วยเตี๋ยวชามละ $50$ บาท ปีถัดมาขึ้นเป็น $60$ บาท ราคาเพิ่มขึ้นกี่เปอร์เซ็นต์ (ตอบเป็น %)
  answer:
    value: 20
    unit: '%'
  misconceptions:
  - match: 16.666667
    feedback: หารด้วยราคาใหม่ ต้องหารด้วยราคาเดิม
  - match: 10
    feedback: นั่นคือจำนวนบาทที่เพิ่ม
  hints:
  - ร้อยละที่เพิ่ม $= \dfrac{\text{ใหม่} - \text{เดิม}}{\text{เดิม}} \times 100$
  - ใช้ราคาเดิมเป็นตัวหาร
  solution: $\dfrac{60 - 50}{50} \times 100 = 20\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.inflation-unemployment.p004
  topics:
  - business.econ.inflation-unemployment
  difficulty: 2
  type: match
  stem: จับคู่สถานการณ์กับประเภทของการว่างงาน
  pairs:
  - left: ลาออกจากงานเก่า กำลังหางานใหม่ที่เหมาะกับตัวเอง
    right: การว่างงานชั่วคราวระหว่างเปลี่ยนงาน
  - left: โรงงานใช้หุ่นยนต์แทนคน แรงงานไม่มีทักษะที่งานใหม่ต้องการ
    right: การว่างงานเชิงโครงสร้าง
  - left: เศรษฐกิจซบเซา ยอดขายตก บริษัทหลายแห่งลดคน
    right: การว่างงานตามวัฏจักรเศรษฐกิจ
  - left: ชาวนาว่างงานหลังเก็บเกี่ยวจนถึงฤดูทำนาถัดไป
    right: การว่างงานตามฤดูกาล
  hints:
  - 'ถามว่าสาเหตุคืออะไร: เปลี่ยนงาน ทักษะไม่ตรง เศรษฐกิจตกต่ำ หรือฤดูกาล'
  - การว่างงานเชิงโครงสร้างมักแก้ด้วยการฝึกทักษะใหม่
  solution: เปลี่ยนงาน → ชั่วคราว · ทักษะไม่ตรงกับเทคโนโลยีใหม่ → โครงสร้าง · เศรษฐกิจตกต่ำ → วัฏจักร · หลังเก็บเกี่ยว → ฤดูกาล
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.inflation-unemployment.p005
  topics:
  - business.econ.inflation-unemployment
  difficulty: 2
  type: numeric
  stem: 'ตะกร้าสินค้าสมมติของครอบครัวหนึ่งต่อเดือน: ข้าวสาร $20$ กก. ไข่ $60$ ฟอง น้ำมัน $30$ ลิตร ค่าเดินทาง $24$ เที่ยว ปีฐานราคาเป็น $35$, $4$, $40$, $15$ บาทต่อหน่วย ปีนี้เป็น $36$, $4.5$, $41$, $16$ บาท ดัชนีราคาของปีนี้ (ปีฐาน $= 100$) เป็นเท่าใด (ตอบทศนิยม 2 ตำแหน่ง)'
  answer:
    value: 104.16
    tolerance: 0.05
  misconceptions:
  - match: 4.16
    feedback: นั่นคืออัตราเงินเฟ้อ โจทย์ถามค่าดัชนี
  - match: 96.0061
    feedback: หารกลับด้าน
  hints:
  - ค่าตะกร้าปีฐาน $= 20(35) + 60(4) + 30(40) + 24(15)$
  - ดัชนี $=$ ค่าตะกร้าปีนี้ $\div$ ค่าตะกร้าปีฐาน $\times 100$
  solution: ปีฐาน $= 700 + 240 + 1{,}200 + 360 = 2{,}500$ บาท ปีนี้ $= 720 + 270 + 1{,}230 + 384 = 2{,}604$ บาท ดัชนี $= \dfrac{2{,}604}{2{,}500} \times 100 = 104.16$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.inflation-unemployment.p006
  topics:
  - business.econ.inflation-unemployment
  difficulty: 3
  type: numeric
  stem: จากภาพดัชนีราคาผู้บริโภคของประเทศสมมติ **อัตราเงินเฟ้อปี 2565** เป็นกี่เปอร์เซ็นต์ (ตอบเป็น %)
  answer:
    value: 5
    unit: '%'
  misconceptions:
  - match: 6
    feedback: นั่นคือผลต่างเป็นจุดของดัชนี ต้องหารด้วยค่าปีก่อน
  - match: 26
    feedback: เทียบกับ 100 แต่ปีก่อนหน้าไม่ใช่ 100
  figure: &id001
    src: p-cpi-table.svg
    alt: แผนภูมิแท่งดัชนีราคาผู้บริโภคของประเทศสมมติ ปี 2564 เท่ากับ 120.0 ปี 2565 เท่ากับ 126.0 ปี 2566 เท่ากับ 125.0 ปี 2567 เท่ากับ 127.5
  hints:
  - อัตราเงินเฟ้อ $= \dfrac{\text{CPI ปีนี้} - \text{CPI ปีก่อน}}{\text{CPI ปีก่อน}} \times 100$
  - ใช้ CPI ปี 2564 และ 2565
  solution: $\dfrac{126.0 - 120.0}{120.0} \times 100 = 5\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.inflation-unemployment.p007
  topics:
  - business.econ.inflation-unemployment
  difficulty: 3
  type: mcq
  stem: จากภาพดัชนีราคาผู้บริโภคของประเทศสมมติ ปีใดเกิด **เงินฝืด** (ระดับราคาลดลงจากปีก่อน)
  choices:
  - id: a
    text: ปี 2566
    correct: true
  - id: b
    text: ปี 2565
    feedback: ปี 2565 ดัชนีเพิ่มจาก 120.0 เป็น 126.0 คือเงินเฟ้อ
  - id: c
    text: ปี 2567
    feedback: ปี 2567 ดัชนีเพิ่มจาก 125.0 เป็น 127.5
  - id: d
    text: ไม่มีปีใดเลย เพราะดัชนีสูงกว่า 100 ทุกปี
    feedback: ดัชนีสูงกว่า 100 แปลว่าแพงกว่าปีฐาน แต่เงินฝืดดูการเปลี่ยนจากปีก่อน
  figure: *id001
  hints:
  - เทียบดัชนีแต่ละปีกับปีก่อนหน้า
  - เงินฝืดคืออัตราเปลี่ยนแปลงติดลบ
  solution: ปี 2566 ดัชนีลดจาก $126.0$ เป็น $125.0$ อัตราเปลี่ยนแปลง $\approx -0.79\%$ จึงเป็นเงินฝืดในปีนั้น (ระดับราคาลดลง แม้ยังสูงกว่าปีฐาน)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.inflation-unemployment.p008
  topics:
  - business.econ.inflation-unemployment
  difficulty: 3
  type: numeric
  stem: จังหวัดสมมติแห่งหนึ่งมีผู้อายุ 15 ปีขึ้นไป $1{,}200{,}000$ คน เป็นผู้มีงานทำ $760{,}000$ คน ผู้ว่างงาน (ไม่มีงานและกำลังหางาน) $40{,}000$ คน ที่เหลือเป็นผู้อยู่นอกกำลังแรงงาน เช่น นักเรียน ผู้ทำงานบ้าน ผู้เกษียณ **อัตราการว่างงาน** เป็นกี่เปอร์เซ็นต์ (ตอบเป็น %)
  answer:
    value: 5
    unit: '%'
  misconceptions:
  - match: 3.333333
    feedback: หารด้วยประชากรอายุ 15 ปีขึ้นไปทั้งหมด ต้องหารด้วยกำลังแรงงาน
  - match: 5.263158
    feedback: หารด้วยผู้มีงานทำ ต้องรวมผู้ว่างงานในตัวหารด้วย
  hints:
  - กำลังแรงงาน $=$ ผู้มีงานทำ $+$ ผู้ว่างงาน
  - อัตราการว่างงาน $=$ ผู้ว่างงาน $\div$ กำลังแรงงาน $\times 100$
  solution: กำลังแรงงาน $= 760{,}000 + 40{,}000 = 800{,}000$ คน อัตราการว่างงาน $= \dfrac{40{,}000}{800{,}000} \times 100 = 5\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.inflation-unemployment.p009
  topics:
  - business.econ.inflation-unemployment
  difficulty: 3
  type: numeric
  stem: จังหวัดสมมติแห่งหนึ่งมีผู้อายุ 15 ปีขึ้นไป $1{,}200{,}000$ คน เป็นผู้มีงานทำ $760{,}000$ คน ผู้ว่างงาน (ไม่มีงานและกำลังหางาน) $40{,}000$ คน ที่เหลือเป็นผู้อยู่นอกกำลังแรงงาน เช่น นักเรียน ผู้ทำงานบ้าน ผู้เกษียณ **อัตราการมีส่วนร่วมในกำลังแรงงาน** (กำลังแรงงาน $\div$ ผู้อายุ 15 ปีขึ้นไป) เป็นกี่เปอร์เซ็นต์ (ตอบเป็น % ทศนิยม 2 ตำแหน่ง)
  answer:
    value: 66.666667
    tolerance: 0.1
    unit: '%'
  misconceptions:
  - match: 63.333333
    feedback: ลืมนับผู้ว่างงานซึ่งอยู่ในกำลังแรงงาน
  - match: 33.333333
    feedback: นั่นคือสัดส่วนผู้อยู่นอกกำลังแรงงาน
  hints:
  - กำลังแรงงานรวมทั้งผู้มีงานทำและผู้ว่างงาน
  - $800{,}000 \div 1{,}200{,}000$
  solution: $\dfrac{800{,}000}{1{,}200{,}000} \times 100 \approx 66.67\%$
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.inflation-unemployment.p010
  topics:
  - business.econ.inflation-unemployment
  difficulty: 3
  type: mcq
  stem: ถ้าเกิดเงินเฟ้อสูงกว่าที่ทุกคนคาดไว้ ใคร **ได้ประโยชน์** มากที่สุด
  choices:
  - id: a
    text: ผู้กู้เงินที่ตกลงดอกเบี้ยคงที่ไว้แล้ว
    correct: true
  - id: b
    text: ผู้ฝากเงินที่ได้ดอกเบี้ยคงที่
    feedback: ดอกเบี้ยคงที่ไม่ทันราคาที่สูงขึ้น ผู้ฝากเสียอำนาจซื้อ
  - id: c
    text: ผู้เกษียณที่ได้เงินบำนาญคงที่
    feedback: รายได้คงที่ซื้อของได้น้อยลง
  - id: d
    text: ผู้ให้กู้ที่ตกลงดอกเบี้ยคงที่
    feedback: เงินที่ได้คืนมีค่าลดลง ผู้ให้กู้เสียประโยชน์
  hints:
  - เงินที่ต้องจ่ายคืนในอนาคตมีค่าเท่าเดิมหรือลดลงเมื่อของแพงขึ้น
  - ใครจ่ายเงินจำนวนคงที่ในอนาคต
  solution: ผู้กู้ที่ดอกเบี้ยคงที่จ่ายคืนด้วยเงินที่มีค่าลดลง จึงได้ประโยชน์ ส่วนผู้ฝาก ผู้ให้กู้ และผู้มีรายได้คงที่เสียประโยชน์
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.inflation-unemployment.p011
  topics:
  - business.econ.inflation-unemployment
  difficulty: 4
  type: numeric
  stem: ฝากเงินประจำได้ดอกเบี้ย $2\%$ ต่อปี (สมมติ ไม่คิดภาษี) ขณะที่อัตราเงินเฟ้อ $3.5\%$ อัตราผลตอบแทนที่แท้จริงเป็นกี่เปอร์เซ็นต์ (ใช้ $\dfrac{1 + i}{1 + \pi} - 1$ ตอบเป็น % ทศนิยม 2 ตำแหน่ง)
  answer:
    value: -1.449275
    tolerance: 0.06
    unit: '%'
  misconceptions:
  - match: 5.5
    feedback: บวกสองอัตรา ต้องหักเงินเฟ้อออก
  - match: 1.45
    feedback: เครื่องหมายผิด ดอกเบี้ยต่ำกว่าเงินเฟ้อ ผลตอบแทนแท้จริงต้องติดลบ
  hints:
  - แทน $i = 0.02$ และ $\pi = 0.035$
  - ผลลัพธ์ติดลบแปลว่าอำนาจซื้อลดลง
  solution: $\dfrac{1.02}{1.035} - 1 \approx -0.01449$ หรือ $-1.45\%$ (ค่าประมาณ $2 - 3.5 = -1.5\%$) เงินฝากโตไม่ทันราคาสินค้า
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.inflation-unemployment.p012
  topics:
  - business.econ.inflation-unemployment
  difficulty: 4
  type: numeric
  stem: พนักงานได้ขึ้นเงินเดือนจาก $15{,}000$ เป็น $15{,}450$ บาท ในปีที่อัตราเงินเฟ้อ $4\%$ **ค่าจ้างที่แท้จริง** เปลี่ยนไปกี่เปอร์เซ็นต์ (ตอบเป็น % ทศนิยม 2 ตำแหน่ง ติดลบถ้าลดลง)
  answer:
    value: -0.961538
    tolerance: 0.03
    unit: '%'
  misconceptions:
  - match: 3
    feedback: นั่นคือค่าจ้างที่เป็นตัวเงิน ยังไม่หักเงินเฟ้อ
  - match: 7
    feedback: บวกเงินเฟ้อ ต้องหักออก
  hints:
  - ค่าจ้างเพิ่มขึ้นกี่เปอร์เซ็นต์ก่อน
  - ค่าจ้างแท้จริงเปลี่ยน $= \dfrac{1 + \text{ค่าจ้างที่เพิ่ม}}{1 + \text{เงินเฟ้อ}} - 1$
  solution: ค่าจ้างเพิ่ม $3\%$ ค่าจ้างแท้จริงเปลี่ยน $= \dfrac{1.03}{1.04} - 1 \approx -0.96\%$ แม้ได้เงินเพิ่ม แต่ซื้อของได้น้อยลง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: business.econ.inflation-unemployment.p013
  topics:
  - business.econ.inflation-unemployment
  difficulty: 4
  type: mcq
  stem: เศรษฐกิจเกิด **เงินฝืดต่อเนื่อง** ข้อใดน่าจะเกิดขึ้น เลือกทุกข้อที่ถูก
  multiple: true
  choices:
  - id: a
