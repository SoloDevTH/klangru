problems:
  - id: physics.electricity.simple-circuits.p001
    topics: [physics.electricity.simple-circuits]
    difficulty: 1
    type: mcq
    stem: "ในไฟฉาย ส่วนประกอบใดเป็นแหล่งกำเนิดไฟฟ้า"
    choices:
      - { id: a, text: "ถ่านไฟฉาย", correct: true }
      - { id: b, text: "หลอดไฟ", feedback: "หลอดไฟรับพลังงานไฟฟ้าแล้วเปลี่ยนเป็นแสง ไม่ได้ให้พลังงานไฟฟ้า" }
      - { id: c, text: "สวิตช์", feedback: "สวิตช์ทำหน้าที่เปิดและปิดวงจร ไม่ได้ให้พลังงานไฟฟ้า" }
    hints:
      - "ถ้าถอดชิ้นไหนออก ไฟฉายจะไม่มีพลังงานไฟฟ้าเลย"
      - "แหล่งกำเนิดไฟฟ้ามีขั้วบวกและขั้วลบ"
    solution: "ถ่านไฟฉาย (เซลล์ไฟฟ้า) เป็นแหล่งกำเนิดไฟฟ้า ให้พลังงานไฟฟ้าแก่วงจร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.simple-circuits.p002
    topics: [physics.electricity.simple-circuits]
    difficulty: 1
    type: match
    stem: "จับคู่ส่วนประกอบของวงจรไฟฟ้ากับหน้าที่"
    pairs:
      - { left: "เซลล์ไฟฟ้า", right: "ให้พลังงานไฟฟ้า" }
      - { left: "สายไฟ", right: "เป็นทางให้กระแสไฟฟ้าไหลผ่าน" }
      - { left: "สวิตช์", right: "เปิดหรือปิดวงจร" }
      - { left: "หลอดไฟ", right: "เปลี่ยนพลังงานไฟฟ้าเป็นแสง" }
    hints:
      - "ส่วนไหนให้พลังงาน ส่วนไหนใช้พลังงาน"
      - "ส่วนไหนทำหน้าที่เหมือนสะพานที่ยกขึ้นวางลงได้"
    solution: "เซลล์ไฟฟ้าให้พลังงาน สายไฟเป็นทางของกระแส สวิตช์เปิดปิดวงจร หลอดไฟเปลี่ยนพลังงานไฟฟ้าเป็นแสง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.simple-circuits.p003
    topics: [physics.electricity.simple-circuits]
    difficulty: 1
    type: mcq
    stem: "วงจรมีถ่านไฟฉาย สายไฟ หลอดไฟ และสวิตช์ ต่อกันครบ เมื่อเปิดสวิตช์ (ยกสะพานขึ้น) หลอดไฟจะเป็นอย่างไร"
    choices:
      - { id: a, text: "ดับ เพราะวงจรขาด กระแสไหลไม่ได้", correct: true }
      - { id: b, text: "สว่าง เพราะยังมีถ่านไฟฉายอยู่", feedback: "มีถ่านแต่ทางเดินของกระแสขาดที่สวิตช์ กระแสจึงไหลไม่ได้" }
      - { id: c, text: "สว่างมากขึ้น", feedback: "การเปิดสวิตช์ไม่ได้เพิ่มพลังงาน แต่ทำให้วงจรขาด" }
    hints:
      - "เปิดสวิตช์แล้ว ทางเดินของกระแสครบรอบหรือไม่"
      - "หลอดไฟสว่างเมื่อวงจรปิดเท่านั้น"
    solution: "เปิดสวิตช์คือยกสะพานขึ้น ทางเดินของกระแสขาด เป็นวงจรเปิด หลอดไฟจึงดับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.simple-circuits.p004
    topics: [physics.electricity.simple-circuits]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ของใช้ใดในบ้านทำงานด้วยไฟฟ้า (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "หม้อหุงข้าวไฟฟ้า", correct: true }
      - { id: b, text: "รีโมตทีวี", correct: true }
      - { id: c, text: "พัดลม", correct: true }
      - { id: d, text: "เตาถ่าน", feedback: "เตาถ่านให้ความร้อนจากการเผาถ่าน ไม่ได้ใช้ไฟฟ้า" }
      - { id: e, text: "จักรยาน", feedback: "จักรยานทั่วไปเคลื่อนที่ด้วยแรงปั่นของคน ไม่ได้ใช้ไฟฟ้า" }
    hints:
      - "ของชิ้นไหนต้องเสียบปลั๊กหรือใส่ถ่าน"
      - "รีโมตทีวีใช้ไฟฟ้าจากถ่าน"
    solution: "หม้อหุงข้าวไฟฟ้าและพัดลมใช้ไฟบ้าน รีโมตทีวีใช้ถ่าน จึงทำงานด้วยไฟฟ้าทั้งสามอย่าง ส่วนเตาถ่านและจักรยานไม่ใช้ไฟฟ้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.simple-circuits.p005
    topics: [physics.electricity.simple-circuits]
    difficulty: 2
    type: numeric
    stem: "ของเล่นใส่ถ่านไฟฉายก้อนละ 1.5 V จำนวน 3 ก้อน ต่อแบบอนุกรมอย่างถูกต้อง ความต่างศักย์รวมเป็นกี่โวลต์ (ตอบในหน่วย V)"
    answer: { value: 4.5, tolerance: 0.01, unit: V }
    misconceptions:
      - { match: 1.5, feedback: "ต่ออนุกรมอย่างถูกต้อง ความต่างศักย์ของทุกก้อนรวมกัน ไม่ได้เท่ากับก้อนเดียว" }
      - { match: 0.5, feedback: "ดูเหมือนนำ 1.5 หารด้วย 3 การต่ออนุกรมต้องบวกกัน" }
    hints:
      - "ต่อแบบอนุกรมอย่างถูกต้อง ความต่างศักย์รวมกันหรือแบ่งกัน"
      - "บวกค่าของถ่านทุกก้อน"
    solution: "ต่อแบบอนุกรมความต่างศักย์รวมกัน $1.5 + 1.5 + 1.5 = 4.5\\ \\mathrm{V}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.simple-circuits.p006
    topics: [physics.electricity.simple-circuits]
    difficulty: 2
    type: mcq
    stem: "หลอดไฟมีจุดต่อสองจุด นักเรียนมีถ่านไฟฉาย 1 ก้อนกับสายไฟ 2 เส้น ต่อแบบใดหลอดไฟจึงสว่าง"
    choices:
      - { id: a, text: "สายเส้นที่ 1 ต่อขั้วบวกกับจุดต่อที่ 1 ของหลอด สายเส้นที่ 2 ต่อจุดต่อที่ 2 ของหลอดกับขั้วลบ", correct: true }
      - { id: b, text: "สายเส้นที่ 1 ต่อขั้วบวกกับจุดต่อที่ 1 ของหลอด สายเส้นที่ 2 ต่อขั้วลบกับจุดต่อที่ 1 ของหลอดเหมือนกัน", feedback: "สายทั้งสองไปต่อที่จุดเดียวกัน กระแสไม่ผ่านไส้หลอด จึงไม่สว่าง และยังเป็นการลัดวงจรที่ทำให้ถ่านหมดเร็ว" }
      - { id: c, text: "ใช้สายเส้นเดียวต่อขั้วบวกกับหลอดไฟ", feedback: "สายเส้นเดียวไม่ครบรอบ กระแสต้องไหลกลับเข้าขั้วลบด้วย" }
    hints:
      - "หลอดไฟสว่างเมื่อทางเดินของกระแสครบรอบ"
      - "กระแสต้องไหลจากขั้วบวก ผ่านไส้หลอดจากจุดต่อหนึ่งไปอีกจุดต่อหนึ่ง แล้วกลับขั้วลบ"
    solution: "ต้องต่อให้ครบรอบ ขั้วบวก → จุดต่อที่ 1 → ไส้หลอด → จุดต่อที่ 2 → ขั้วลบ หลอดไฟจึงสว่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.simple-circuits.p007
    topics: [physics.electricity.simple-circuits]
    difficulty: 2
    type: order
    stem: "เรียงขั้นตอนต่อวงจรไฟฟ้าที่มีถ่านไฟฉาย สวิตช์ และหลอดไฟ ให้ปลอดภัยและทดสอบได้"
    items:
      - "เปิดสวิตช์ (ยกสะพานขึ้น) ไว้ก่อน"
      - "ต่อสายไฟจากขั้วบวกของถ่านไปที่สวิตช์"
      - "ต่อสายไฟจากสวิตช์ไปที่จุดต่อหนึ่งของหลอดไฟ"
      - "ต่อสายไฟจากจุดต่ออีกจุดของหลอดไฟกลับมาที่ขั้วลบ"
      - "ปิดสวิตช์ แล้วดูว่าหลอดไฟสว่าง"
    hints:
      - "ระหว่างต่อสาย ควรให้วงจรยังไม่ครบรอบ"
      - "ต่อสายตามทางเดินของกระแส จากขั้วบวกไปจนกลับขั้วลบ แล้วจึงทดสอบ"
    solution: "เปิดสวิตช์ไว้ก่อน → ต่อขั้วบวกไปสวิตช์ → ต่อสวิตช์ไปหลอดไฟ → ต่อหลอดไฟกลับขั้วลบ → ปิดสวิตช์ทดสอบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.simple-circuits.p008
    topics: [physics.electricity.simple-circuits]
    difficulty: 3
    type: numeric
    stem: "ไฟฉายใส่ถ่าน 1.5 V สองก้อนเรียงกัน แต่ใส่ก้อนที่สองกลับด้าน ทำให้ขั้วบวกชนขั้วบวก ความต่างศักย์รวมเป็นกี่โวลต์ (ตอบในหน่วย V)"
    answer: { value: 0, tolerance: 0.01, unit: V }
    misconceptions:
      - { match: 3, feedback: "ถ้าใส่ถูกจะได้ 3 V แต่ก้อนที่ใส่กลับด้านดันกระแสสวนทาง ความต่างศักย์จึงหักล้างกัน" }
      - { match: 1.5, feedback: "ก้อนที่ใส่กลับด้านไม่ได้แค่ไม่ช่วย แต่ดันสวนทางกับก้อนแรก จึงหักล้างกันหมด" }
    hints:
      - "ถ่านสองก้อนดันกระแสไปทางเดียวกันหรือสวนทางกัน"
      - "ดันสวนทางกันด้วยค่าเท่ากัน ผลรวมเป็นเท่าไร"
    solution: "ก้อนแรกดัน $1.5\\ \\mathrm{V}$ ไปทางหนึ่ง ก้อนที่กลับด้านดัน $1.5\\ \\mathrm{V}$ สวนทาง ผลรวม $1.5 - 1.5 = 0\\ \\mathrm{V}$ ไฟฉายจึงไม่สว่าง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.simple-circuits.p009
    topics: [physics.electricity.simple-circuits]
    difficulty: 3
    type: mcq
    stem: "หลอดไฟ P Q R ต่อแบบอนุกรมกับแบตเตอรี่ตามภาพ ไส้หลอดของหลอด Q ขาด หลอดใดสว่าง"
    figure: { src: p-broken-series.svg, alt: "แผนภาพวงจร หลอดไฟสามดวง P Q R ต่อเรียงกันเป็นแถวเดียวกับแบตเตอรี่ หลอด Q ตรงกลางมีขีดสีแดงพาดและป้ายว่าไส้หลอดขาด" }
    choices:
      - { id: a, text: "ไม่มีหลอดใดสว่าง", correct: true }
      - { id: b, text: "P และ R สว่าง", feedback: "ในวงจรอนุกรม กระแสมีทางเดินทางเดียวผ่านทุกหลอด เมื่อ Q ขาด ทางเดินขาด P และ R จึงดับด้วย" }
      - { id: c, text: "P สว่างดวงเดียว เพราะอยู่ก่อนหลอดที่ขาด", feedback: "กระแสต้องไหลครบรอบจึงไหลได้ ไม่มีการไหลไปถึงครึ่งทางแล้วหยุด" }
    hints:
      - "วงจรอนุกรมมีทางเดินของกระแสกี่ทาง"
      - "ถ้าทางเดินขาดตรงหนึ่ง กระแสไหลในส่วนอื่นได้หรือไม่"
    solution: "หลอดทั้งสามต่ออนุกรม กระแสมีทางเดินทางเดียว เมื่อไส้หลอด Q ขาด วงจรขาด กระแสไหลไม่ได้ทั้งวงจร ทุกหลอดจึงดับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.simple-circuits.p010
    topics: [physics.electricity.simple-circuits]
    difficulty: 3
    type: mcq
    stem: "ไฟประดับสายหนึ่งที่แขวนในงานลอยกระทง เมื่อหลอดดวงหนึ่งหลุดจากขั้ว หลอดที่เหลือทั้งสายดับหมด ไฟประดับสายนี้ต่อหลอดแบบใด"
    choices:
      - { id: a, text: "แบบอนุกรม", correct: true }
      - { id: b, text: "แบบขนาน", feedback: "ถ้าต่อแบบขนาน แต่ละหลอดมีทางเดินของกระแสของตัวเอง หลอดหนึ่งหลุด หลอดอื่นยังสว่าง" }
      - { id: c, text: "บอกไม่ได้", feedback: "อาการดับหมดเมื่อหลอดเดียวหลุดบอกได้ว่าทุกหลอดอยู่บนทางเดินเดียวกัน" }
    hints:
      - "หลอดหลุดดวงเดียว แต่ดับหมด แสดงว่ากระแสผ่านทุกหลอดทางเดียวกันหรือไม่"
      - "การต่อแบบใดมีทางเดินของกระแสทางเดียว"
    solution: "หลอดหลุดดวงเดียวทำให้ทางเดินของกระแสขาดทั้งสาย แสดงว่าทุกหลอดอยู่บนทางเดินเดียวกัน คือต่อแบบอนุกรม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.simple-circuits.p011
    topics: [physics.electricity.simple-circuits]
    difficulty: 3
    type: mcq
    multiple: true
    stem: "จากแผนภาพวงจร เมื่อสวิตช์ S เปิดอยู่ (ตามภาพ) หลอดไฟดวงใดสว่าง (เลือกทุกข้อที่ถูก)"
    figure: { src: p-switch-branch.svg, alt: "แผนภาพวงจร แบตเตอรี่อยู่ด้านล่างซ้าย สายด้านบนผ่านหลอด A แล้วถึงจุดต่อ จากจุดต่อแยกเป็นสองทางลงไปถึงสายด้านล่าง ทางแรกมีหลอด B ทางที่สองมีสวิตช์ S ซึ่งเปิดอยู่ ต่อกับหลอด C แล้วรวมกันกลับไปที่แบตเตอรี่" }
    choices:
      - { id: a, text: "หลอด A", correct: true }
      - { id: b, text: "หลอด B", correct: true }
      - { id: c, text: "หลอด C", feedback: "สวิตช์ S อยู่ทางเดียวกับหลอด C เมื่อ S เปิด ทางนี้ขาด หลอด C จึงดับ" }
    hints:
      - "ไล่ทางเดินของกระแสจากแบตเตอรี่ ผ่านหลอด A แล้วแยกเป็นสองทาง"
      - "ทางไหนขาดเพราะสวิตช์เปิด"
    solution: "กระแสไหลผ่านหลอด A แล้วแยกสองทาง ทางที่มีหลอด B ครบรอบ ส่วนทางที่มีหลอด C ขาดที่สวิตช์ S หลอด A และ B จึงสว่าง หลอด C ดับ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.electricity.simple-circuits.p012
    topics: [physics.electricity.simple-circuits]
    difficulty: 4
    type: mcq
    stem: "จากแผนภาพวงจรในข้อก่อน (หลอด A อยู่ทางหลัก หลอด B และหลอด C กับสวิตช์ S อยู่คนละทางที่แยกออก) ปิดสวิตช์ S แล้ว ต่อมาไส้หลอด A ขาด หลอดใดยังสว่าง"
    figure: { src: p-switch-branch.svg, alt: "แผนภาพวงจร แบตเตอรี่อยู่ด้านล่างซ้าย สายด้านบนผ่านหลอด A แล้วถึงจุดต่อ จากจุดต่อแยกเป็นสองทางลงไปถึงสายด้านล่าง ทางแรกมีหลอด B ทางที่สองมีสวิตช์ S ต่อกับหลอด C แล้วรวมกันกลับไปที่แบตเตอรี่" }
    choices:
      - { id: a, text: "ไม่มีหลอดใดสว่าง", correct: true }
      - { id: b, text: "หลอด B และ C", feedback: "B และ C แยกทางกันก็จริง แต่กระแสทุกทางต้องผ่านหลอด A ก่อน เมื่อ A ขาด ไม่มีกระแสไปถึงทางแยก" }
      - { id: c, text: "หลอด B ดวงเดียว", feedback: "สวิตช์ S ปิดแล้ว ทาง C ไม่ได้ขาด และที่สำคัญคือกระแสต้องผ่าน A ก่อนทั้งคู่" }
    hints:
      - "หลอด A อยู่บนทางเดินที่กระแสทั้งหมดต้องผ่านหรือไม่"
      - "ถ้าทางหลักขาด ทางแยกยังมีกระแสหรือไม่"
