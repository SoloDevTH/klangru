- id: chinese.grammar.progressive-bi.p009
  topics:
  - chinese.grammar.progressive-bi
  difficulty: 3
  type: mcq
  stem: แม่ถามว่ากำลังดูทีวีอยู่หรือเปล่า เราตอบว่า "เปล่า ฉันไม่ได้ดูทีวี ฉันอ่านหนังสืออยู่" ส่วนแรกพูดว่าอย่างไร
  choices:
  - id: a
    text: 我没看电视在。
    feedback: 在 ต้องอยู่หน้ากริยา
  - id: b
    text: 我不看了电视。
    feedback: 了 กับ 不 ไม่บอกว่ากำลังทำ และวางผิดตำแหน่ง
  - id: c
    text: 我没在看电视。
    correct: true
    feedback: ถูก ปฏิเสธการกระทำที่กำลังทำด้วย 没(在)
  - id: d
    text: 我在不看电视。
    feedback: คำปฏิเสธต้องอยู่หน้า 在
  hints:
  - 'รูปบอกเล่า: 我在看电视'
  - ปฏิเสธใช้ 没 วางหน้า 在
  solution: '**我没在看电视，我在看书。** Wǒ méi zài kàn diànshì, wǒ zài kàn shū.'
  license: CC-BY-SA-4.0
  ai_assisted: true
