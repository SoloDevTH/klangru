problems:
  - id: health.fitness.fitness-components.p001
    topics: [health.fitness.fitness-components]
    difficulty: 1
    type: mcq
    stem: "การทดสอบนั่งงอตัวไปข้างหน้า ใช้วัดสมรรถภาพทางกายด้านใด"
    choices:
      - { id: a, text: "ความอ่อนตัว", correct: true }
      - { id: b, text: "ความอดทนของระบบหัวใจและหายใจ", feedback: "ด้านนี้วัดด้วยการทดสอบที่ต้องออกแรงต่อเนื่อง เช่น ยืนยกเข่าขึ้นลง 3 นาที" }
      - { id: c, text: "ความเร็ว", feedback: "ความเร็ววัดด้วยการวิ่งระยะสั้น ไม่ใช่การนั่งงอตัว" }
      - { id: d, text: "องค์ประกอบของร่างกาย", feedback: "องค์ประกอบของร่างกายดูจากดัชนีมวลกายหรือไขมันใต้ผิวหนัง" }
    hints:
      - "การนั่งงอตัวดูว่าเอื้อมไปได้ไกลแค่ไหน"
      - "ข้อต่อและกล้ามเนื้อที่ยืดได้ดีทำให้งอตัวได้มาก"
    solution: "นั่งงอตัวไปข้างหน้าวัดความอ่อนตัวของหลังและต้นขาด้านหลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.fitness.fitness-components.p002
    topics: [health.fitness.fitness-components]
    difficulty: 1
    type: match
    stem: "จับคู่รายการทดสอบกับสมรรถภาพที่วัด"
    pairs:
      - { left: "นั่งงอตัวไปข้างหน้า", right: "ความอ่อนตัว" }
      - { left: "ลุก-นั่ง 60 วินาที", right: "ความแข็งแรงและอดทนของกล้ามเนื้อท้อง" }
      - { left: "ดันพื้นประยุกต์ 30 วินาที", right: "ความแข็งแรงและอดทนของกล้ามเนื้อแขนและไหล่" }
      - { left: "ยืนยกเข่าขึ้นลง 3 นาที", right: "ความอดทนของระบบหัวใจและหายใจ" }
      - { left: "ดัชนีมวลกาย", right: "องค์ประกอบของร่างกาย" }
    hints:
      - "ดูว่าการทดสอบใช้กล้ามเนื้อส่วนใด"
      - "การทดสอบที่ทำต่อเนื่องหลายนาทีวัดหัวใจและปอด"
    solution: "นั่งงอตัว → อ่อนตัว, ลุก-นั่ง → กล้ามเนื้อท้อง, ดันพื้น → แขนและไหล่, ยืนยกเข่า 3 นาที → หัวใจและหายใจ, ดัชนีมวลกาย → องค์ประกอบของร่างกาย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.fitness.fitness-components.p003
    topics: [health.fitness.fitness-components]
    difficulty: 1
    type: numeric
    stem: "องค์การอนามัยโลกแนะนำว่าเด็กอายุ 5–17 ปีควรมีกิจกรรมทางกายระดับปานกลางถึงหนักเฉลี่ยวันละอย่างน้อยกี่นาที (ตอบเป็นตัวเลขในหน่วยนาที)"
    answer: { value: 60, unit: นาที }
    misconceptions:
      - { match: 30, feedback: "30 นาทีน้อยกว่าคำแนะนำสำหรับเด็ก เด็กและวัยรุ่นควรได้เฉลี่ยวันละ 60 นาที" }
      - { match: 150, feedback: "150 นาทีต่อสัปดาห์เป็นคำแนะนำขั้นต่ำของผู้ใหญ่ เด็กควรได้เฉลี่ยวันละ 60 นาที" }
    hints:
      - "คำตอบเท่ากับ 1 ชั่วโมง"
      - "เป็นค่าเฉลี่ยต่อวันตลอดสัปดาห์"
    solution: "WHO (2020) แนะนำเด็กและวัยรุ่นอายุ 5–17 ปี เฉลี่ยวันละอย่างน้อย 60 นาที"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.fitness.fitness-components.p004
    topics: [health.fitness.fitness-components]
    difficulty: 2
    type: numeric
    stem: "ถ้าเด็กคนหนึ่งออกกำลังกายวันละ 60 นาทีทุกวัน ใน 1 สัปดาห์จะมีกิจกรรมทางกายรวมกี่นาที (ตอบเป็นตัวเลขในหน่วยนาที)"
    answer: { value: 420, unit: นาที }
    misconceptions:
      - { match: 300, feedback: "คิดแค่ 5 วันทำการ แต่โจทย์บอกว่าทุกวัน 1 สัปดาห์มี 7 วัน" }
      - { match: 67, feedback: "ต้องคูณ 60 กับ 7 ไม่ใช่บวกกัน" }
    hints:
      - "1 สัปดาห์มีกี่วัน"
      - "นำนาทีต่อวันคูณจำนวนวัน"
    solution: "$60 \\times 7 = 420$ นาที หรือ 7 ชั่วโมงต่อสัปดาห์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.fitness.fitness-components.p005
    topics: [health.fitness.fitness-components]
    difficulty: 2
    type: mcq
    stem: "ใช้ตารางเกณฑ์อายุ 12 ปี เด็กชายอายุ 12 ปีลุก-นั่งได้ 30 ครั้งใน 60 วินาที อยู่ในระดับใด"
    figure:
      src: norms-age12.svg
      alt: "ตารางเกณฑ์สมรรถภาพทางกายเด็กอายุ 12 ปี กรมพลศึกษา 2555 ห้าระดับ ต่ำมาก ต่ำ ปานกลาง ดี ดีมาก ลุก-นั่ง 60 วินาที ชาย: 13 ลงมา, 14–23, 24–33, 34–43, 44 ขึ้นไป หญิง: 12 ลงมา, 13–22, 23–32, 33–42, 43 ขึ้นไป ดันพื้น 30 วินาที ชาย: 11 ลงมา, 12–19, 20–27, 28–35, 36 ขึ้นไป หญิง: 9 ลงมา, 10–17, 18–25, 26–33, 34 ขึ้นไป นั่งงอตัวไปข้างหน้า (เซนติเมตร) ชาย: 3 ลงมา, 4–7, 8–11, 12–15, 16 ขึ้นไป หญิง: 4 ลงมา, 5–9, 10–14, 15–19, 20 ขึ้นไป"
    choices:
      - { id: a, text: "ปานกลาง", correct: true }
      - { id: b, text: "ดี", feedback: "ระดับดีของเด็กชาย 12 ปีเริ่มที่ 34 ครั้ง 30 ครั้งยังไม่ถึง" }
      - { id: c, text: "ต่ำ", feedback: "ระดับต่ำคือ 14–23 ครั้ง 30 ครั้งสูงกว่านั้น" }
      - { id: d, text: "ดีมาก", feedback: "ดีมากต้องได้ 44 ครั้งขึ้นไป" }
    hints:
      - "ดูแถวลุก-นั่ง เพศชาย"
      - "หาช่วงที่มี 30 อยู่"
    solution: "แถวลุก-นั่ง ชาย ช่วง 24–33 คือปานกลาง 30 ครั้งจึงอยู่ระดับปานกลาง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.fitness.fitness-components.p006
    topics: [health.fitness.fitness-components]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดเป็นประโยชน์ของการออกกำลังกายสม่ำเสมอ (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "หัวใจและปอดทำงานได้ดีขึ้น", correct: true }
      - { id: b, text: "นอนหลับดีและอารมณ์ดีขึ้น", correct: true }
      - { id: c, text: "ท่าทางสง่า คล่องแคล่ว และมั่นใจในตนเองมากขึ้น", correct: true }
      - { id: d, text: "ไม่ต้องกินอาหารครบ 5 หมู่อีก", feedback: "การออกกำลังกายไม่ได้แทนอาหาร ร่างกายยังต้องการสารอาหารครบหมู่" }
      - { id: e, text: "ไม่มีวันเจ็บป่วยอีกเลย", feedback: "ช่วยลดโอกาสเจ็บป่วย แต่ไม่ได้รับประกันว่าจะไม่ป่วยเลย" }
    hints:
      - "คิดถึงประโยชน์ต่อร่างกาย จิตใจ และบุคลิกภาพ"
      - "ข้อที่ถูกมีสามข้อ"
    solution: "การออกกำลังกายช่วยหัวใจและปอด การนอนและอารมณ์ และบุคลิกภาพ แต่ไม่ได้แทนอาหารหรือทำให้ไม่ป่วยเลย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.fitness.fitness-components.p007
    topics: [health.fitness.fitness-components]
    difficulty: 3
    type: mcq
    stem: "ใช้ตารางเกณฑ์อายุ 12 ปี เด็กหญิงอายุ 12 ปีดันพื้นได้ 26 ครั้งใน 30 วินาที อยู่ในระดับใด"
    figure:
      src: norms-age12.svg
      alt: "ตารางเกณฑ์สมรรถภาพทางกายเด็กอายุ 12 ปี กรมพลศึกษา 2555 ห้าระดับ ต่ำมาก ต่ำ ปานกลาง ดี ดีมาก ลุก-นั่ง 60 วินาที ชาย: 13 ลงมา, 14–23, 24–33, 34–43, 44 ขึ้นไป หญิง: 12 ลงมา, 13–22, 23–32, 33–42, 43 ขึ้นไป ดันพื้น 30 วินาที ชาย: 11 ลงมา, 12–19, 20–27, 28–35, 36 ขึ้นไป หญิง: 9 ลงมา, 10–17, 18–25, 26–33, 34 ขึ้นไป นั่งงอตัวไปข้างหน้า (เซนติเมตร) ชาย: 3 ลงมา, 4–7, 8–11, 12–15, 16 ขึ้นไป หญิง: 4 ลงมา, 5–9, 10–14, 15–19, 20 ขึ้นไป"
    choices:
      - { id: a, text: "ดี", correct: true }
      - { id: b, text: "ปานกลาง", feedback: "ถ้าเป็นเด็กชาย 26 ครั้งจะอยู่ระดับปานกลาง แต่เด็กหญิงใช้แถวหญิง ซึ่ง 26–33 คือระดับดี" }
      - { id: c, text: "ดีมาก", feedback: "ดีมากของเด็กหญิงต้องได้ 34 ครั้งขึ้นไป" }
    hints:
      - "ระวังเลือกแถวเพศให้ถูก"
      - "แถวดันพื้น หญิง ช่วงใดมี 26"
    solution: "แถวดันพื้น หญิง ช่วง 26–33 คือดี 26 ครั้งจึงอยู่ระดับดี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.fitness.fitness-components.p008
    topics: [health.fitness.fitness-components]
    difficulty: 3
    type: numeric
    stem: "เด็กชายอายุ 12 ปีลุก-นั่งได้ 30 ครั้งใน 60 วินาที ตามเกณฑ์อายุ 12 ปี เขาต้องทำเพิ่มอีกอย่างน้อยกี่ครั้งจึงจะถึงระดับดี (ตอบเป็นตัวเลขในหน่วยครั้ง)"
    figure:
      src: norms-age12.svg
      alt: "ตารางเกณฑ์สมรรถภาพทางกายเด็กอายุ 12 ปี กรมพลศึกษา 2555 ห้าระดับ ต่ำมาก ต่ำ ปานกลาง ดี ดีมาก ลุก-นั่ง 60 วินาที ชาย: 13 ลงมา, 14–23, 24–33, 34–43, 44 ขึ้นไป หญิง: 12 ลงมา, 13–22, 23–32, 33–42, 43 ขึ้นไป ดันพื้น 30 วินาที ชาย: 11 ลงมา, 12–19, 20–27, 28–35, 36 ขึ้นไป หญิง: 9 ลงมา, 10–17, 18–25, 26–33, 34 ขึ้นไป นั่งงอตัวไปข้างหน้า (เซนติเมตร) ชาย: 3 ลงมา, 4–7, 8–11, 12–15, 16 ขึ้นไป หญิง: 4 ลงมา, 5–9, 10–14, 15–19, 20 ขึ้นไป"
    answer: { value: 4, unit: ครั้ง }
    misconceptions:
      - { match: 3, feedback: "33 ครั้งยังเป็นระดับปานกลาง ระดับดีเริ่มที่ 34 ครั้ง" }
      - { match: 14, feedback: "14 ครั้งคือระยะถึงระดับดีมาก (44) ระดับดีเริ่มที่ 34 ครั้ง" }
    hints:
      - "ระดับดีของเด็กชาย 12 ปีเริ่มที่กี่ครั้ง"
      - "นำค่าเริ่มต้นของระดับดีลบผลที่ทำได้"
    solution: "ระดับดีเริ่มที่ 34 ครั้ง $34 - 30 = 4$ ครั้ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.fitness.fitness-components.p009
    topics: [health.fitness.fitness-components]
    difficulty: 3
    type: text
    stem: "ใช้ตารางเกณฑ์อายุ 12 ปี เด็กหญิงอายุ 12 ปีนั่งงอตัวไปข้างหน้าได้ 8 เซนติเมตร อยู่ในระดับใด (ตอบชื่อระดับ)"
    figure:
      src: norms-age12.svg
      alt: "ตารางเกณฑ์สมรรถภาพทางกายเด็กอายุ 12 ปี กรมพลศึกษา 2555 ห้าระดับ ต่ำมาก ต่ำ ปานกลาง ดี ดีมาก ลุก-นั่ง 60 วินาที ชาย: 13 ลงมา, 14–23, 24–33, 34–43, 44 ขึ้นไป หญิง: 12 ลงมา, 13–22, 23–32, 33–42, 43 ขึ้นไป ดันพื้น 30 วินาที ชาย: 11 ลงมา, 12–19, 20–27, 28–35, 36 ขึ้นไป หญิง: 9 ลงมา, 10–17, 18–25, 26–33, 34 ขึ้นไป นั่งงอตัวไปข้างหน้า (เซนติเมตร) ชาย: 3 ลงมา, 4–7, 8–11, 12–15, 16 ขึ้นไป หญิง: 4 ลงมา, 5–9, 10–14, 15–19, 20 ขึ้นไป"
    accepted: ["ต่ำ", "ระดับต่ำ"]
    misconceptions:
      - { match: "ปานกลาง", feedback: "ถ้าเป็นเด็กชาย 8 เซนติเมตรคือปานกลาง แต่แถวหญิงช่วง 5–9 คือระดับต่ำ" }
      - { match: "ต่ำมาก", feedback: "ต่ำมากของเด็กหญิงคือ 4 เซนติเมตรลงมา" }
    hints:
      - "ดูแถวนั่งงอตัว เพศหญิง"
      - "8 อยู่ในช่วงใด"
    solution: "แถวนั่งงอตัว หญิง ช่วง 5–9 เซนติเมตรคือระดับต่ำ ควรฝึกยืดเหยียดกล้ามเนื้อหลังและต้นขาด้านหลังสม่ำเสมอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.fitness.fitness-components.p010
    topics: [health.fitness.fitness-components]
    difficulty: 3
    type: mcq
    stem: "ผลทดสอบของเก่งพบว่าความอดทนของระบบหัวใจและหายใจอยู่ระดับต่ำ กิจกรรมใดช่วยพัฒนาด้านนี้ได้ตรงที่สุด"
    choices:
      - { id: a, text: "ปั่นจักรยานหรือวิ่งเหยาะต่อเนื่องครั้งละ 20–30 นาที", correct: true }
      - { id: b, text: "นั่งยืดเหยียดกล้ามเนื้อ", feedback: "การยืดเหยียดพัฒนาความอ่อนตัว ไม่ได้ฝึกหัวใจและปอดให้ทำงานต่อเนื่อง" }
      - { id: c, text: "ยกของหนักครั้งเดียวให้ได้มากที่สุด", feedback: "เป็นการฝึกความแข็งแรงของกล้ามเนื้อ ไม่ใช่ความอดทนของหัวใจและปอด" }
      - { id: d, text: "นั่งเล่นเกมบนโทรศัพท์", feedback: "การนั่งนิ่งไม่ได้พัฒนาสมรรถภาพทางกาย และควรลดเวลาหน้าจอ" }
    hints:
      - "หัวใจและปอดได้ฝึกเมื่อกล้ามเนื้อมัดใหญ่ออกแรงต่อเนื่องนาน ๆ"
      - "หากิจกรรมที่ทำให้หายใจเร็วขึ้นต่อเนื่องหลายนาที"
    solution: "กิจกรรมแอโรบิกที่ใช้กล้ามเนื้อมัดใหญ่ต่อเนื่อง เช่น ปั่นจักรยาน วิ่งเหยาะ ว่ายน้ำ กระโดดเชือก พัฒนาความอดทนของระบบหัวใจและหายใจ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.fitness.fitness-components.p011
    topics: [health.fitness.fitness-components]
    difficulty: 3
    type: mcq
    stem: "ปลาวิ่งเร็วและหลบหลีกเก่ง แต่แขนยังไม่ค่อยมีแรง ครูให้เลือกการละเล่นพื้นเมืองหนึ่งอย่างเพื่อพัฒนาจุดด้อยของตัวเอง ปลาควรเลือกอะไร"
    choices:
      - { id: a, text: "ชักเย่อ", correct: true }
      - { id: b, text: "วิ่งเปี้ยว", feedback: "วิ่งเปี้ยวใช้ความเร็ว ซึ่งเป็นจุดเด่นของปลาอยู่แล้ว ไม่ได้ฝึกแขนมากนัก" }
      - { id: c, text: "มอญซ่อนผ้า", feedback: "มอญซ่อนผ้าเน้นการวิ่งและความว่องไว ไม่ได้ฝึกแรงแขนโดยตรง" }
      - { id: d, text: "ซ่อนหา", feedback: "ซ่อนหาไม่ได้ฝึกความแข็งแรงของแขน" }
    hints:
      - "จุดด้อยของปลาคือกล้ามเนื้อส่วนใด"
      - "การละเล่นใดต้องใช้แขนดึงแรง ๆ"
    solution: "ชักเย่อใช้แรงดึงจากแขน ไหล่ และลำตัว จึงช่วยพัฒนาความแข็งแรงของกล้ามเนื้อแขนซึ่งเป็นจุดด้อยของปลา"
