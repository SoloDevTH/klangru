problems:
  - id: health.safety.natural-disasters.p001
    topics: [health.safety.natural-disasters]
    difficulty: 1
    type: mcq
    stem: "ขณะนั่งเรียนในห้อง เกิดแผ่นดินไหว พื้นสั่นแรง ควรทำอย่างไรเป็นอย่างแรก"
    choices:
      - { id: a, text: "หมอบลงใต้โต๊ะ ใช้แขนป้องศีรษะ และเกาะโต๊ะให้แน่น", correct: true }
      - { id: b, text: "วิ่งลงบันไดทันทีขณะพื้นยังสั่น", feedback: "ขณะสั่นอาจล้มหรือถูกของหล่นใส่ ให้หมอบ ป้อง เกาะ ก่อน แล้วออกเมื่อหยุดสั่น" }
      - { id: c, text: "ยืนดูที่หน้าต่างว่าเกิดอะไรขึ้น", feedback: "กระจกหน้าต่างอาจแตกใส่ ต้องอยู่ห่างหน้าต่าง" }
    hints:
      - "จำสามคำของ ปภ."
      - "หาที่กำบังที่แข็งแรงก่อน"
    solution: "หมอบ ป้อง เกาะ ใต้โต๊ะที่แข็งแรง ห่างจากหน้าต่าง แล้วรอจนหยุดสั่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.natural-disasters.p002
    topics: [health.safety.natural-disasters]
    difficulty: 1
    type: text
    stem: "สายด่วนนิรภัยของกรมป้องกันและบรรเทาสาธารณภัย (ปภ.) ซึ่งรับแจ้งเหตุตลอด 24 ชั่วโมง คือหมายเลขใด"
    accepted: ["1784"]
    misconceptions:
      - { match: "1669", feedback: "1669 คือเบอร์เรียกรถพยาบาลเมื่อเจ็บป่วยฉุกเฉิน ส่วนการขอความช่วยเหลือจากภัยพิบัติโทร ปภ." }
      - { match: "191", feedback: "191 คือเบอร์ตำรวจ" }
    hints:
      - "เป็นตัวเลขสี่หลัก ขึ้นต้นด้วย 17"
      - "ลงท้ายด้วย 84"
    solution: "1784 สายด่วนนิรภัย ปภ."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.natural-disasters.p003
    topics: [health.safety.natural-disasters]
    difficulty: 2
    type: order
    stem: "เรียงการปฏิบัติตนเมื่อเกิดแผ่นดินไหวขณะอยู่ในอาคารเรียน"
    items:
      - "หมอบลงใต้โต๊ะที่แข็งแรง"
      - "ใช้แขนป้องศีรษะ"
      - "เกาะขาโต๊ะไว้ให้แน่นจนหยุดสั่น"
      - "เดินลงบันไดออกจากอาคาร ไม่ใช้ลิฟต์"
      - "รวมกันที่ที่โล่งห่างจากอาคาร และไม่รีบกลับเข้าอาคาร"
    hints:
      - "หมอบ ป้อง เกาะ ทำระหว่างพื้นสั่น"
      - "ออกจากอาคารเมื่อหยุดสั่นแล้ว"
    solution: "หมอบ → ป้อง → เกาะ → เมื่อหยุดสั่นเดินลงบันได → รวมที่ที่โล่งและรอคำสั่ง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.natural-disasters.p004
    topics: [health.safety.natural-disasters]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "ข้อใดควรอยู่ในถุงยังชีพฉุกเฉินตามคำแนะนำของ ปภ. (เลือกทุกข้อที่ถูก)"
    choices:
      - { id: a, text: "น้ำดื่มและอาหารแห้งที่เก็บได้นาน", correct: true }
      - { id: b, text: "ไฟฉายพร้อมถ่านสำรอง", correct: true }
      - { id: c, text: "ยาประจำตัวและชุดปฐมพยาบาล", correct: true }
      - { id: d, text: "เอกสารสำคัญในซองกันน้ำ", correct: true }
      - { id: e, text: "เค้กสดและนมเปิดแล้ว", feedback: "อาหารสดเสียเร็ว ถุงยังชีพต้องใช้อาหารแห้งที่เก็บได้นาน" }
      - { id: f, text: "เครื่องเล่นเกมขนาดใหญ่", feedback: "ไม่จำเป็นต่อการดำรงชีวิต และทำให้ถุงหนัก" }
    hints:
      - "ปภ. แนะนำของจำเป็น 6 กลุ่ม"
      - "ข้อที่ถูกมีสี่ข้อ"
    solution: "น้ำและอาหารแห้ง ไฟฉายและถ่าน ยาประจำตัวและชุดปฐมพยาบาล เอกสารสำคัญในซองกันน้ำ อยู่ในรายการ 6 สิ่งจำเป็นของ ปภ."
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.natural-disasters.p005
    topics: [health.safety.natural-disasters]
    difficulty: 2
    type: match
    stem: "จับคู่สถานการณ์กับการปฏิบัติตนที่ปลอดภัย"
    pairs:
      - { left: "ฝนฟ้าคะนองขณะเล่นฟุตบอลในสนาม", right: "เข้าไปในอาคาร ไม่หลบใต้ต้นไม้" }
      - { left: "อยู่ที่ชายหาดแล้วเห็นน้ำทะเลลดลงผิดปกติ", right: "รีบหนีขึ้นที่สูงทันที" }
      - { left: "น้ำไหลเชี่ยวท่วมถนนที่ต้องเดินผ่าน", right: "ไม่เดินข้าม รอหรือใช้ทางอื่น" }
      - { left: "อากาศร้อนจัดในวันกีฬาสี", right: "ดื่มน้ำบ่อยและพักในที่ร่ม" }
    hints:
      - "น้ำทะเลลดผิดปกติเป็นสัญญาณเตือนสึนามิ"
      - "ต้นไม้สูงมักถูกฟ้าผ่า"
    solution: "ฟ้าคะนอง-เข้าอาคาร, น้ำทะเลลด-หนีขึ้นที่สูง, น้ำไหลเชี่ยว-ไม่เดินข้าม, ร้อนจัด-ดื่มน้ำและอยู่ในที่ร่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.natural-disasters.p006
    topics: [health.safety.natural-disasters]
    difficulty: 2
    type: numeric
    stem: "ใบบัวเห็นฟ้าแลบ แล้วนับได้ 9 วินาทีจึงได้ยินเสียงฟ้าร้อง ถ้าเสียงเดินทาง 1 กิโลเมตรในเวลาประมาณ 3 วินาที ฟ้าผ่าอยู่ห่างประมาณกี่กิโลเมตร (ตอบเป็นกิโลเมตร)"
    answer: { value: 3, unit: กิโลเมตร }
    misconceptions:
      - { match: 27, feedback: "ต้องหารด้วย 3 ไม่ใช่คูณ ทุก 3 วินาทีคือ 1 กิโลเมตร" }
      - { match: 9, feedback: "9 คือจำนวนวินาที ต้องแปลงเป็นกิโลเมตรโดยหารด้วย 3" }
    hints:
      - "แสงมาถึงเราแทบทันที แต่เสียงมาช้ากว่า"
      - "ทุก 3 วินาที เท่ากับระยะทางประมาณ 1 กิโลเมตร"
    solution: "9 ÷ 3 = 3 กิโลเมตร ฟ้าผ่าอยู่ใกล้พอเป็นอันตราย ต้องเข้าไปในอาคาร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.natural-disasters.p007
    topics: [health.safety.natural-disasters]
    difficulty: 3
    type: mcq
    stem: "หลังฝนตกหนัก น้ำป่าไหลเชี่ยวข้ามถนนในหมู่บ้าน ลึกประมาณ 20 เซนติเมตร พี่ชายบอกว่า \"แค่ครึ่งแข้ง เดินข้ามได้\" ข้อใดถูกต้อง"
    figure:
      src: flood-depth.svg
      alt: "ภาพวาดตามสัดส่วน คนยืนในน้ำไหลเชี่ยวลึกราว 15 เซนติเมตร เขียนว่าผู้ใหญ่ล้มได้ และรถยนต์ในน้ำไหลเชี่ยวลึกราว 30 เซนติเมตร เขียนว่าพัดรถยนต์ส่วนใหญ่ได้ ข้อมูลกรมอุตุนิยมวิทยาสหรัฐอเมริกา"
    choices:
      - { id: a, text: "ไม่ควรข้าม เพราะน้ำไหลเชี่ยวลึกเพียงราว 15 เซนติเมตรก็ทำให้ผู้ใหญ่ล้มได้", correct: true }
      - { id: b, text: "ข้ามได้ เพราะน้ำไม่ถึงเข่า", feedback: "ความแรงของน้ำที่ไหลสำคัญกว่าความลึก น้ำ 20 เซนติเมตรที่ไหลเชี่ยวพัดคนล้มได้" }
      - { id: c, text: "ขับรถจักรยานยนต์ข้ามเร็ว ๆ แทน", feedback: "น้ำไหลเชี่ยวพัดรถล้มได้ และอาจมีถนนพังอยู่ใต้น้ำ" }
    hints:
      - "เทียบความลึก 20 เซนติเมตรกับตัวเลขในภาพ"
      - "อันตรายมาจากความเร็วของน้ำ ไม่ใช่แค่ความลึก"
    solution: "20 เซนติเมตรมากกว่าราว 15 เซนติเมตรที่ทำให้ผู้ใหญ่ล้มได้ จึงไม่ควรเดินหรือขับรถข้าม ให้รอหรือใช้ทางอื่น"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.natural-disasters.p008
    topics: [health.safety.natural-disasters]
    difficulty: 3
    type: match
    stem: "หลังน้ำท่วมใหญ่ในอำเภอหนึ่ง จับคู่ผลกระทบกับด้านของผลกระทบ"
    pairs:
      - { left: "ชาวบ้านเป็นน้ำกัดเท้าและอุจจาระร่วง", right: "ด้านร่างกาย" }
      - { left: "เด็กหลายคนฝันร้ายและกลัวเสียงฝน", right: "ด้านจิตใจ" }
      - { left: "โรงเรียนปิดเพราะใช้เป็นศูนย์พักพิง และหลายครอบครัวขาดรายได้", right: "ด้านสังคม" }
    hints:
      - "ความเจ็บป่วยเป็นเรื่องของร่างกาย"
      - "การเรียน การทำงาน และการอยู่ร่วมกันเป็นเรื่องของสังคม"
    solution: "น้ำกัดเท้าและท้องเสีย-ร่างกาย, ฝันร้ายและกลัว-จิตใจ, โรงเรียนปิดและขาดรายได้-สังคม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.natural-disasters.p009
    topics: [health.safety.natural-disasters]
    difficulty: 3
    type: mcq
    stem: "บ้านของต้นน้ำอยู่ติดเชิงเขาและใกล้ลำห้วยในภาคเหนือ ฝนตกหนักมาสามวันแล้ว ข้อใดเป็นสิ่งบอกเหตุว่าอาจเกิดดินถล่ม ตามที่กรมทรัพยากรธรณีให้ชุมชนเฝ้าระวัง"
    choices:
      - { id: a, text: "น้ำในห้วยขึ้นเร็ว สีน้ำเปลี่ยนเป็นสีดินบนภูเขา และมีเสียงดังอื้ออึงจากภูเขา", correct: true }
      - { id: b, text: "ท้องฟ้าแจ่มใสและลมสงบ", feedback: "เป็นสภาพอากาศปกติ ไม่ใช่สิ่งบอกเหตุดินถล่ม" }
      - { id: c, text: "น้ำในห้วยใสและลดระดับลงช้า ๆ", feedback: "สิ่งบอกเหตุคือน้ำขึ้นเร็วและสีเปลี่ยนเป็นสีดิน ไม่ใช่น้ำใสที่ลดลง" }
    hints:
      - "ดินที่ไหลลงมาจะทำให้น้ำเปลี่ยนสี"
      - "ดินและหินที่เคลื่อนตัวทำให้เกิดเสียง"
    solution: "สิ่งบอกเหตุได้แก่ ฝนตกหนักมาก น้ำในห้วยขึ้นเร็ว สีน้ำเปลี่ยนเป็นสีดินบนภูเขา และเสียงดังผิดปกติ เมื่อพบให้รีบไปจุดปลอดภัยที่นัดหมายไว้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.natural-disasters.p010
    topics: [health.safety.natural-disasters]
    difficulty: 3
    type: numeric
    stem: "อาสาสมัครในหมู่บ้านเชิงเขาวัดน้ำฝนได้ 45, 38 และ 30 มิลลิเมตรในสามช่วงของวันเดียวกัน (รวม 24 ชั่วโมง) ฝนวันนั้นรวมกี่มิลลิเมตร (ตอบเป็นมิลลิเมตร)"
    answer: { value: 113, unit: มิลลิเมตร }
    misconceptions:
      - { match: 37.67, feedback: "37.67 คือค่าเฉลี่ยของสามช่วง โจทย์ถามปริมาณฝนรวมทั้งวัน" }
      - { match: 45, feedback: "45 คือช่วงที่ฝนตกมากที่สุด ต้องรวมทุกช่วง" }
    hints:
      - "ฝนรวมทั้งวัน = ผลบวกของทุกช่วง"
      - "เทียบผลรวมกับ 100 มิลลิเมตรต่อวัน ซึ่งเป็นเกณฑ์เฝ้าระวังดินถล่ม"
    solution: "45 + 38 + 30 = 113 มิลลิเมตร มากกว่า 100 มิลลิเมตรต่อวัน จึงต้องเฝ้าระวังดินถล่มและแจ้งผู้ใหญ่บ้าน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.natural-disasters.p011
    topics: [health.safety.natural-disasters]
    difficulty: 3
    type: mcq
    stem: "โทรศัพท์มือถือของทุกคนในบ้านดังพร้อมกัน มีข้อความเตือนจากทางราชการว่าเขื่อนจะระบายน้ำเพิ่ม พื้นที่นอกคันกั้นน้ำอาจถูกน้ำท่วม ครอบครัวของเกดอยู่นอกคันกั้นน้ำ ควรทำอย่างไร"
    choices:
      - { id: a, text: "ทำตามคำแนะนำในข้อความ ยกของขึ้นที่สูง เตรียมถุงยังชีพ และติดตามประกาศต่อ", correct: true }
      - { id: b, text: "ไม่สนใจ เพราะตอนนี้ยังไม่มีน้ำ", feedback: "ข้อความเตือนภัยมาก่อนเพื่อให้มีเวลาเตรียมตัว ถ้ารอจนน้ำมาจะไม่ทัน" }
      - { id: c, text: "ส่งต่อข้อความพร้อมเติมข่าวลือที่ได้ยินมา", feedback: "การเติมข่าวลือทำให้คนสับสน ควรส่งต่อเฉพาะข้อมูลจากทางราชการ" }
    hints:
      - "ข้อความเตือนภัยที่ส่งเข้ามือถือทุกเครื่องในพื้นที่มาจากทางราชการ"
      - "การเตรียมตัวก่อนเกิดภัยช่วยลดความเสียหาย"
    solution: "ทำตามประกาศ ยกของขึ้นที่สูง เตรียมถุงยังชีพ และติดตามข่าวจากทางราชการ เช่น แอป THAI DISASTER ALERT"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.natural-disasters.p012
    topics: [health.safety.natural-disasters]
    difficulty: 4
    type: numeric
    stem: "เห็นฟ้าแลบ แล้วอีก 6 วินาทีจึงได้ยินเสียงฟ้าร้อง ถ้าเสียงเดินทางในอากาศได้ 343 เมตรต่อวินาที ฟ้าผ่าอยู่ห่างกี่เมตร (ตอบเป็นเมตร)"
    answer: { value: 2058, tolerance: 1, unit: เมตร }
    misconceptions:
      - { match: 57.17, feedback: "ระยะทาง = อัตราเร็ว × เวลา ต้องคูณ ไม่ใช่หาร" }
      - { match: 2, feedback: "2 คือคำตอบโดยประมาณในหน่วยกิโลเมตร โจทย์ให้ตอบเป็นเมตร" }
    hints:
      - "ระยะทาง = อัตราเร็ว × เวลา"
      - "343 × 6"
    solution: "343 × 6 = 2,058 เมตร หรือราว 2 กิโลเมตร ใกล้พอที่จะถูกฟ้าผ่าได้ ต้องเข้าไปในอาคาร"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: health.safety.natural-disasters.p013
    topics: [health.safety.natural-disasters]
    difficulty: 4
    type: numeric
    stem: "ระหว่างแข่งกีฬาสี ได้ยินเสียงฟ้าร้องครั้งสุดท้ายเวลา 15:40 น. ถ้าต้องรอ 30 นาทีหลังฟ้าร้องครั้งสุดท้ายก่อนกลับไปเล่น จะกลับไปเล่นได้เร็วที่สุดเวลา 16 นาฬิกากี่นาที (ตอบเป็นนาที)"
    answer: { value: 10, unit: นาที }
    misconceptions:
