  - id: management.operations.maintenance-reliability.p014
    topics: [management.operations.maintenance-reliability]
    difficulty: 4
    type: mcq
    stem: "เครื่องทำความเย็นของห้องเก็บวัคซีนในโรงพยาบาล (สมมติ) เสียแบบสุ่ม ไม่ขึ้นกับอายุ (อยู่ในช่วงอัตราการเสียคงที่) ถ้าเสียวัคซีนจะเสียหายมูลค่าสูง ควรใช้การบำรุงรักษาแบบใดเป็นหลัก"
    choices:
      - { id: a, text: "เชิงพยากรณ์: ติดตามอุณหภูมิและกระแสไฟของคอมเพรสเซอร์ต่อเนื่องพร้อมสัญญาณเตือน และมีตู้สำรอง", correct: true }
      - { id: b, text: "ซ่อมเมื่อเสีย เพราะเครื่องเสียแบบสุ่มอยู่แล้ว", feedback: "ผลกระทบของการเสียสูงมาก รอให้เสียแล้วซ่อมไม่คุ้ม" }
      - { id: c, text: "เปลี่ยนเครื่องใหม่ทุก 6 เดือนตามรอบ", feedback: "เมื่อเสียแบบสุ่ม เครื่องใหม่ก็เสียได้ด้วยอัตราเดิม การเปลี่ยนตามรอบสิ้นเปลืองโดยไม่ลดการเสียมาก" }
      - { id: d, text: "ลดการเปิดประตูตู้ให้น้อยลงอย่างเดียว", feedback: "ช่วยเรื่องอุณหภูมิได้บ้าง แต่ไม่ได้ตรวจจับหรือรับมือเมื่อเครื่องเริ่มผิดปกติ" }
    hints:
      - "เมื่อการเสียไม่ขึ้นกับอายุ การทำตามรอบเวลาช่วยได้น้อย"
      - "ถ้าผลกระทบสูง ควรตรวจจับความผิดปกติแต่เนิ่น ๆ และมีระบบสำรอง"
    solution: "การเสียแบบสุ่มไม่ลดลงด้วยการเปลี่ยนตามรอบ ควรเฝ้าดูสภาพจริงเพื่อพบความผิดปกติก่อนเสีย และมีตู้สำรองเพื่อความต่อเนื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.maintenance-reliability.p015
    topics: [management.operations.maintenance-reliability]
    difficulty: 5
    type: numeric
    stem: "ศูนย์ข้อมูลของหน่วยงานรัฐแห่งหนึ่ง (สมมติ) ต้องการให้ระบบไฟสำรองมีความเชื่อถือได้อย่างน้อย 0.999 ในช่วงไฟดับ เครื่องปั่นไฟแต่ละเครื่องมีความเชื่อถือได้ 0.90 และเสียอิสระต่อกัน ต้องต่อขนานอย่างน้อยกี่เครื่อง"
    answer: { value: 3, unit: เครื่อง }
    hints:
      - "เครื่องปั่นไฟ $n$ เครื่องขนาน: $R = 1 - 0.1^n$"
      - "หาค่า $n$ ที่น้อยที่สุดที่ $1 - 0.1^n \\ge 0.999$"
    misconceptions:
      - { match: 2, feedback: "สองเครื่องได้ $1 - 0.01 = 0.99$ ยังไม่ถึง 0.999" }
      - { match: 10, feedback: "ดูเหมือนคิดว่าต้องเพิ่มทีละ 0.1 ระบบขนานลดโอกาสเสียแบบคูณ" }
    solution: "$n = 2$: $1 - 0.1^2 = 0.99$ ไม่พอ $n = 3$: $1 - 0.1^3 = 0.999$ พอดี จึงต้องอย่างน้อย 3 เครื่อง (และต้องทดสอบเดินเครื่องตามรอบด้วย)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.maintenance-reliability.p016
    topics: [management.operations.maintenance-reliability]
    difficulty: 5
    type: mcq
    multiple: true
    stem: "โรงพยาบาลจังหวัดแห่งหนึ่ง (สมมติ) ทำแผนความต่อเนื่องเมื่อไฟฟ้าดับ ข้อใดเป็นแนวปฏิบัติที่ดี เลือกทุกข้อที่ถูก"
    choices:
      - { id: a, text: "ระบุพื้นที่ที่หยุดไม่ได้ เช่น ห้องผ่าตัด ไอซียู ห้องเก็บวัคซีน แล้วต่อเข้าระบบไฟสำรองก่อน", correct: true }
      - { id: b, text: "ทดสอบเดินเครื่องปั่นไฟสำรองพร้อมโหลดตามรอบและบันทึกผล", correct: true }
      - { id: c, text: "สำรองน้ำมันเชื้อเพลิงให้พอใช้ตามระยะเวลาที่ประเมินไว้ และมีสัญญากับผู้ส่งน้ำมัน", correct: true }
      - { id: d, text: "ซ้อมแผนกับเจ้าหน้าที่จริงเป็นระยะ", correct: true }
      - { id: e, text: "เก็บเครื่องปั่นไฟไว้ไม่ใช้งานเลยจนกว่าจะเกิดไฟดับจริง เพื่อไม่ให้สึกหรอ", feedback: "เครื่องที่ไม่เคยเดินอาจสตาร์ตไม่ติดในวันที่ต้องใช้ ต้องทดสอบตามรอบ" }
    hints:
      - "แผนที่ดีระบุสิ่งสำคัญ เตรียมทรัพยากร และพิสูจน์ว่าใช้ได้จริง"
      - "ระบบสำรองที่ไม่เคยทดสอบเชื่อถือได้หรือไม่"
    solution: "ก ข ค ง ถูก แผนต้องจัดลำดับพื้นที่สำคัญ ทดสอบระบบสำรอง เตรียมเชื้อเพลิง และซ้อมกับคนจริง ส่วนการไม่ทดสอบเลยทำให้ไม่รู้ว่าระบบใช้ได้หรือไม่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.maintenance-reliability.p017
    topics: [management.operations.maintenance-reliability]
    difficulty: 5
    type: numeric
    stem: "เครื่องฉีดพลาสติกมี MTBF 300 ชั่วโมง และ MTTR 20 ชั่วโมง ทีม TPM เตรียมอะไหล่หลักไว้ข้างเครื่องและฝึกช่าง ทำให้ MTTR ลดเหลือ 8 ชั่วโมง โดย MTBF เท่าเดิม ความพร้อมใช้ใหม่เป็นร้อยละเท่าใด (ตอบในหน่วย % ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 97.4, unit: "%", tolerance: 0.1 }
    hints:
      - "$A = \\dfrac{\\text{MTBF}}{\\text{MTBF} + \\text{MTTR}}$ ด้วย MTTR ใหม่"
      - "$\\dfrac{300}{308}$"
    misconceptions:
      - { match: 93.75, feedback: "นั่นคือความพร้อมใช้เดิม (MTTR 20 ชั่วโมง)" }
      - { match: 2.6, feedback: "นั่นคือสัดส่วนเวลาที่เครื่องไม่พร้อมใช้ ($8/308$) โจทย์ถามความพร้อมใช้" }
    solution: "$A = \\dfrac{300}{300 + 8} \\approx 0.974 = 97.4\\%$ เพิ่มจาก 93.75% โดยไม่ต้องลดการเสียเลย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.maintenance-reliability.p018
    topics: [management.operations.maintenance-reliability]
    difficulty: 3
    type: mcq
    stem: "ผู้จัดการโรงงานบอกว่า \"เครื่องนี้ MTBF 1,000 ชั่วโมง แปลว่าจะไม่เสียแน่นอนใน 1,000 ชั่วโมงแรก\" ถ้าเครื่องอยู่ในช่วงอัตราการเสียคงที่ ข้อใดถูกต้อง"
    choices:
      - { id: a, text: "ไม่ถูก โอกาสทำงานครบ 1,000 ชั่วโมงโดยไม่เสียมีเพียงราว 37%", correct: true }
      - { id: b, text: "ถูก MTBF คือเวลาขั้นต่ำก่อนเสีย", feedback: "MTBF เป็นค่าเฉลี่ย ไม่ใช่ค่าขั้นต่ำ เครื่องเสียก่อนหรือหลังก็ได้" }
      - { id: c, text: "ไม่ถูก โอกาสทำงานครบ 1,000 ชั่วโมงคือ 50% พอดี", feedback: "ในการแจกแจงเอกซ์โพเนนเชียล $R(\\text{MTBF}) = e^{-1} \\approx 0.37$ ไม่ใช่ 0.5" }
      - { id: d, text: "ไม่ถูก เครื่องต้องเสียก่อน 1,000 ชั่วโมงแน่นอน", feedback: "มีโอกาสราว 37% ที่จะทำงานครบโดยไม่เสีย" }
    hints:
      - "$R(t) = e^{-t/\\text{MTBF}}$"
      - "แทน $t = \\text{MTBF}$"
    solution: "$R(1{,}000) = e^{-1{,}000/1{,}000} = e^{-1} \\approx 0.37$ เครื่องมีโอกาสราว 63% ที่จะเสียก่อนถึง MTBF"
    license: CC-BY-SA-4.0
    ai_assisted: true
