  - id: computer.society.responsible-ict.p013
    topics: [computer.society.responsible-ict]
    difficulty: 4
    type: mcq
    stem: "สถานการณ์ใดมีแนวโน้มเป็น **การใช้งานโดยชอบธรรม** ตาม พ.ร.บ.ลิขสิทธิ์มากที่สุด"
    choices:
      - { id: a, text: "ครูฉายคลิปข่าวสั้น ๆ 1 นาทีในห้องเรียนเพื่อสอน โดยบอกแหล่งที่มา และไม่ได้เก็บเงินนักเรียน", correct: true }
      - { id: b, text: "นักเรียนอัปโหลดภาพยนตร์ทั้งเรื่องให้เพื่อนทั้งโรงเรียนดาวน์โหลด", feedback: "เผยแพร่ทั้งเรื่องแก่คนจำนวนมาก ขัดต่อการหาประโยชน์ตามปกติของเจ้าของ" }
      - { id: c, text: "ร้านถ่ายเอกสารถ่ายหนังสือทั้งเล่มขายให้นักเรียน", feedback: "เป็นการทำเพื่อหากำไรและทำทั้งเล่ม กระทบเจ้าของเกินสมควร" }
      - { id: d, text: "นำเพลงของศิลปินมาใส่คลิปโฆษณาสินค้าโดยให้เครดิต", feedback: "การโฆษณาสินค้าเป็นการใช้เพื่อการค้า การให้เครดิตไม่ได้ทำให้เป็นการใช้โดยชอบธรรม" }
    hints:
      - "ตรวจเงื่อนไข: ไม่หากำไร ใช้เท่าที่จำเป็น ระบุเจ้าของ และไม่กระทบประโยชน์ของเจ้าของเกินสมควร"
      - "กฎหมายยกเว้นให้ผู้สอนที่ใช้เพื่อการสอนโดยไม่หากำไร"
    solution: "มาตรา 32 ยกเว้นการใช้เพื่อการสอนโดยไม่หากำไร เมื่อไม่ขัดต่อการหาประโยชน์ตามปกติของเจ้าของ ข้อ ก ใช้สั้น ๆ เพื่อสอน บอกที่มา และไม่เก็บเงิน ส่วนข้ออื่นใช้ทั้งเรื่อง ใช้หากำไร หรือใช้เพื่อการค้า"
