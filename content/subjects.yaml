  color: "#15803d"
- id: earthscience
  title: { th: โลกและอวกาศ, en: Earth and space science }
  description: โครงสร้างโลก หินและแร่ บรรยากาศและลมฟ้าอากาศ ระบบสุริยะ และดาราศาสตร์
  color: "#9a3412"
- id: science
  title: { th: ทักษะวิทยาศาสตร์, en: Scientific inquiry }
  description: การตั้งคำถาม ออกแบบการทดลอง วิเคราะห์ข้อมูล ประเมินหลักฐาน และธรรมชาติของวิทยาศาสตร์
