<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 290" width="620" height="290" font-family="sans-serif">
<title>ตารางว่าแต่ละคนกำลังทำอะไรเมื่อคืนนี้</title>
<rect x="0" y="0" width="620" height="290" fill="#fff"/>
<text x="310.0" y="30.0" font-size="19" text-anchor="middle" fill="#111" font-weight="bold">Last night: What were they doing?</text>
<rect x="30.0" y="45.0" width="570.0" height="36.0" rx="0" fill="#e3eefb" stroke="#555" stroke-width="1.5"/>
<text x="90.0" y="69.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Name</text>
<text x="265.0" y="69.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">7:00 – 8:00 p.m.</text>
<text x="490.0" y="69.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">8:00 – 9:00 p.m.</text>
<rect x="30.0" y="81.0" width="570.0" height="38.0" rx="0" fill="#fff" stroke="#bbb" stroke-width="1"/>
<text x="90.0" y="106.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Grandma</text>
<text x="265.0" y="106.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">watching TV</text>
<text x="490.0" y="106.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">sleeping</text>
<rect x="30.0" y="119.0" width="570.0" height="38.0" rx="0" fill="#f6f6f6" stroke="#bbb" stroke-width="1"/>
<text x="90.0" y="144.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Dad</text>
<text x="265.0" y="144.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">cooking dinner</text>
<text x="490.0" y="144.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">washing the dishes</text>
<rect x="30.0" y="157.0" width="570.0" height="38.0" rx="0" fill="#fff" stroke="#bbb" stroke-width="1"/>
<text x="90.0" y="182.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Mum</text>
<text x="265.0" y="182.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">reading the news</text>
<text x="490.0" y="182.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">talking on the phone</text>
<rect x="30.0" y="195.0" width="570.0" height="38.0" rx="0" fill="#f6f6f6" stroke="#bbb" stroke-width="1"/>
<text x="90.0" y="220.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Mook</text>
<text x="265.0" y="220.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">doing her homework</text>
<text x="490.0" y="220.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">playing the guitar</text>
<rect x="30.0" y="233.0" width="570.0" height="38.0" rx="0" fill="#fff" stroke="#bbb" stroke-width="1"/>
<text x="90.0" y="258.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Ben</text>
<text x="265.0" y="258.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">playing football</text>
<text x="490.0" y="258.0" font-size="16" text-anchor="middle" fill="#111" font-weight="normal">taking a shower</text>
<line x1="150.0" y1="45.0" x2="150.0" y2="271.0" stroke="#bbb" stroke-width="1" stroke-linecap="round"/>
<line x1="380.0" y1="45.0" x2="380.0" y2="271.0" stroke="#bbb" stroke-width="1" stroke-linecap="round"/>
</svg>
