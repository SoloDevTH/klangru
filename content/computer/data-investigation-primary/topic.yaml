id: computer.data.data-investigation-primary
subject: computer
title: { th: สืบเสาะหาคำตอบด้วยข้อมูล, en: "Finding answers with data" }
summary: ตั้งคำถามที่ตอบได้ด้วยข้อมูล เก็บข้อมูลให้ไม่ลำเอียง จัดตารางให้แถวเป็นรายการและคอลัมน์เป็นคุณลักษณะ ตรวจความถูกต้องก่อนสรุป และดูความสัมพันธ์ของสองสิ่งอย่างระวัง
difficulty: 2
minutes: 35
prerequisites: [computer.data.digital-data-basics, math.stats.pictographs-tables]
encompasses:
  - { id: computer.data.digital-data-basics, weight: 0.2 }
  - { id: math.stats.pictographs-tables, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: records-table.svg
    alt: "ตารางมีห้าแถวข้อมูลนักเรียนและแถวหัวตารางสี่คอลัมน์ ได้แก่ ชื่อ ชั้น ผลไม้ที่ชอบ และส่วนสูง แถวแต่ละแถวคือหนึ่งคน และแต่ละคอลัมน์คือหนึ่งคุณลักษณะ"
    caption: "แถวคือหนึ่งคน คอลัมน์คือหนึ่งคุณลักษณะ"
  - type: worked-example
    title: ตรวจข้อมูลก่อนหาค่าเฉลี่ย
    problem: "ผู้สำรวจถามอายุนักเรียน 8 คนในชมรม ได้คำตอบ 11, 12, 11, 150, 12, (ไม่ได้ตอบ), 11 และ 13 ค่าเฉลี่ยของอายุจากข้อมูลที่ใช้ได้เป็นเท่าใด"
    steps:
      - text: "นับคำตอบทั้งหมด 8 ชุด มี 1 ชุดที่ไม่ได้ตอบ จึงตัดทิ้ง"
        why: "ค่าว่างไม่มีตัวเลขให้คำนวณ และจะทำให้จำนวนคนในการหารผิดไป"
      - text: "ค่า 150 ปีเป็นไปไม่ได้สำหรับนักเรียน จึงตัดทิ้ง และบันทึกไว้ว่าตัดเพราะค่าเป็นไปไม่ได้"
        why: "ค่าที่ผิดแน่นอนดึงค่าเฉลี่ยให้คลาดเคลื่อนมาก ต้องตรวจก่อนนำไปคำนวณ"
      - text: "เหลือ 6 ชุดที่ใช้ได้ คืออายุ 11, 12, 11, 12, 11 และ 13 รวมเป็น 70 ปี"
      - text: "หาค่าเฉลี่ย 70 ÷ 6 ≈ 11.67 ปี และรายงานด้วยว่าใช้ข้อมูล 6 ชุดจาก 8 ชุด"
        why: "การบอกจำนวนข้อมูลที่ใช้ทำให้คนอ่านรู้ว่าผลสรุปมาจากข้อมูลกี่ชุด"
    answer: "ค่าเฉลี่ยอายุ 11.67 ปี จากข้อมูล 6 ชุด (ตัดออก 2 ชุด)"
  - { type: check, problem: computer.data.data-investigation-primary.p004, prompt: "ลองตรวจว่าคำถามใดในแบบสอบถามทำให้ผลเอนไปทางเดียว" }
  - type: figure
    src: survey-bars.svg
    alt: "แผนภูมิแท่งแสดงจำนวนคนที่เลือกเมนูสี่อย่าง ข้าวมันไก่ 15 คน ก๋วยเตี๋ยว 12 คน ข้าวผัด 8 คน และขนมจีน 5 คน รวมเป็น 40 คน แกนตั้งบอกจำนวนคน"
    caption: "แผนภูมิแท่งช่วยให้เห็นภาพผลสำรวจได้ชัดกว่าการอ่านตัวเลขเรียงกัน"
  - type: worked-example
    title: ดูความสัมพันธ์ของอุณหภูมิกับยอดขายน้ำ
    problem: "ร้านน้ำในโรงอาหารบันทึกอุณหภูมิสูงสุดและยอดขาย 6 วัน ได้แก่ จันทร์ 31 องศา 120 แก้ว อังคาร 34 องศา 150 แก้ว พุธ 29 องศา 80 แก้ว พฤหัสบดี 35 องศา 160 แก้ว ศุกร์ 30 องศา 95 แก้ว และเสาร์ 33 องศา 110 แก้ว วันที่ร้อนกับวันที่ขายดีมีความสัมพันธ์กันหรือไม่"
    steps:
      - text: "แบ่งวันตามอุณหภูมิ ร้อนคือ 33 องศาขึ้นไป ได้ 3 วัน คือ อังคาร พฤหัสบดี และเสาร์"
      - text: "แบ่งวันตามยอดขาย ขายดีคือ 110 แก้วขึ้นไป ได้ 4 วัน คือ จันทร์ อังคาร พฤหัสบดี และเสาร์"
        why: "ต้องแบ่งทั้งสองทางพร้อมกันเพื่อนับให้ครบ ไม่ใช่นับเฉพาะวันที่เห็นว่าเด่น"
      - text: "นับในตาราง 2 × 2: ร้อนและขายดี 3 วัน, ร้อนแต่ขายไม่ดี 0 วัน, ไม่ร้อนแต่ขายดี 1 วัน (จันทร์), ไม่ร้อนและขายไม่ดี 2 วัน (พุธ และศุกร์)"
      - text: "สรุป วันที่ร้อนขายดีทุกวัน แต่มีวันที่ไม่ร้อนก็ขายดีด้วย จึงควรเก็บข้อมูลเพิ่มก่อนสรุปว่าความร้อนเป็นสาเหตุ"
        why: "ความสัมพันธ์ที่เห็นพร้อมกันยังไม่พอจะบอกสาเหตุ อาจมีปัจจัยอื่นอยู่เบื้องหลัง"
    answer: "วันที่ร้อนขายดีทั้งหมด (3 จาก 3 วัน) จึงมีความสัมพันธ์ในข้อมูลนี้ แต่ยังสรุปเรื่องสาเหตุไม่ได้"
  - { type: check, problem: computer.data.data-investigation-primary.p012, prompt: "ลองคิดว่าข้อสรุปใดระวังที่สุดเมื่อเห็นสองอย่างเพิ่มพร้อมกัน" }
glossary:
  - { term: ระเบียน (record), definition: "ข้อมูลของสิ่งหนึ่งรายการ เช่น นักเรียนหนึ่งคน เก็บเป็นหนึ่งแถวในตาราง" }
  - { term: คุณลักษณะ (attribute), definition: "ลักษณะหรือค่าที่บอกรายละเอียดของระเบียน เช่น ชั้น ส่วนสูง หรือผลไม้ที่ชอบ เก็บเป็นหนึ่งคอลัมน์" }
  - { term: ความลำเอียง (bias), definition: "ความคลาดเคลื่อนที่ทำให้ข้อมูลที่เก็บมาไม่ตรงกับกลุ่มใหญ่จริง เช่น ถามเฉพาะกลุ่มเพื่อนที่คล้ายกัน" }
  - { term: คำถามชี้นำ (leading question), definition: "คำถามที่บอกคำตอบที่ต้องการไว้ล่วงหน้า ทำให้ผู้ตอบเลือกคำตอบนั้นมากกว่าปกติ" }
  - { term: ความแปรผัน (variation), definition: "ความต่างกันของข้อมูลชุดเดียวกัน วัดแบบง่ายได้จากค่าสูงสุดลบค่าต่ำสุด" }
flashcards:
  - { front: "แถวและคอลัมน์ในตารางข้อมูลควรเป็นอะไร", back: "แถวคือระเบียนหนึ่งรายการ คอลัมน์คือคุณลักษณะหนึ่งอย่าง" }
  - { front: "ทำไมต้องตรวจข้อมูลก่อนหาค่าเฉลี่ย", back: "ค่าที่ว่างหรือเป็นไปไม่ได้จะดึงค่าเฉลี่ยให้คลาดเคลื่อน" }
  - { front: "คำถาม 'อร่อยใช่ไหม' มีปัญหาอะไร", back: "เป็นคำถามชี้นำ ควรถามแบบเปิด เช่น ชอบรสใดมากที่สุด" }
  - { front: "ความแปรผันของข้อมูลคำนวณอย่างไรแบบง่าย", back: "ค่าสูงสุดลบค่าต่ำสุด" }
