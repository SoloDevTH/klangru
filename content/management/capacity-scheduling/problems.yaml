problems:
  - id: management.operations.capacity-scheduling.p001
    topics: [management.operations.capacity-scheduling]
    difficulty: 1
    type: mcq
    stem: "เครื่องบรรจุขวดผลิตได้สูงสุดตามสเปก 600 ขวดต่อชั่วโมง แต่เมื่อหักเวลาเปลี่ยนขนาดขวดและทำความสะอาดตามแผน ผลิตได้ราว 520 ขวดต่อชั่วโมง ตัวเลข 520 คืออะไร"
    choices:
      - { id: a, text: "กำลังการผลิตที่ได้ผล", correct: true }
      - { id: b, text: "กำลังการผลิตที่ออกแบบ", feedback: "กำลังที่ออกแบบคือ 600 ขวดตามสเปกเมื่อไม่หยุดเลย" }
      - { id: c, text: "ผลผลิตจริง", feedback: "ผลผลิตจริงยังต้องหักเครื่องเสียและของเสียที่ไม่ได้วางแผนไว้ จึงมักต่ำกว่า 520" }
      - { id: d, text: "อัตราการใช้", feedback: "อัตราการใช้เป็นอัตราส่วน ไม่ใช่จำนวนขวดต่อชั่วโมง" }
    hints:
      - "มีกำลังการผลิตสามระดับ: ออกแบบ ได้ผล และผลผลิตจริง"
      - "520 หักเฉพาะการหยุดที่วางแผนไว้"
    solution: "กำลังการผลิตที่ได้ผลคือกำลังที่ออกแบบหักการหยุดที่หลีกเลี่ยงไม่ได้ตามแผน จึงเป็น 520 ขวดต่อชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.capacity-scheduling.p002
    topics: [management.operations.capacity-scheduling]
    difficulty: 1
    type: match
    stem: "จับคู่กฎการจัดลำดับงานกับความหมาย"
    pairs:
      - { left: "FCFS", right: "ทำงานที่มาถึงก่อนก่อน" }
      - { left: "SPT", right: "ทำงานที่ใช้เวลาทำสั้นที่สุดก่อน" }
      - { left: "EDD", right: "ทำงานที่มีกำหนดส่งเร็วที่สุดก่อน" }
      - { left: "กฎของจอห์นสัน", right: "จัดลำดับงานที่ต้องผ่านสองเครื่องตามลำดับเดียวกัน" }
    hints:
      - "FCFS = First Come First Served"
      - "SPT = Shortest Processing Time, EDD = Earliest Due Date"
    solution: "FCFS มาก่อนทำก่อน SPT เวลาทำสั้นสุดก่อน EDD กำหนดส่งเร็วสุดก่อน และกฎของจอห์นสันใช้กับงานที่ผ่านสองเครื่อง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.capacity-scheduling.p003
    topics: [management.operations.capacity-scheduling]
    difficulty: 1
    type: numeric
    stem: "ห้องปฏิบัติการของโรงพยาบาล (สมมติ) ออกแบบให้ตรวจได้วันละ 600 ตัวอย่าง กำลังที่ได้ผลคือวันละ 520 ตัวอย่าง เมื่อวานตรวจได้จริง 468 ตัวอย่าง อัตราการใช้เป็นร้อยละเท่าใด"
    answer: { value: 78, unit: "%" }
    hints:
      - "อัตราการใช้ = ผลผลิตจริง ÷ กำลังการผลิตที่ออกแบบ"
      - "468 ÷ 600 × 100"
    misconceptions:
      - { match: 90, feedback: "นั่นคือประสิทธิภาพ (หารด้วยกำลังที่ได้ผล 520) อัตราการใช้หารด้วยกำลังที่ออกแบบ" }
      - { match: 86.67, feedback: "นั่นคือกำลังที่ได้ผลเทียบกับกำลังที่ออกแบบ (520 ÷ 600) ไม่ได้ใช้ผลผลิตจริง" }
    solution: "อัตราการใช้ $= 468 \\div 600 \\times 100 = 78\\%$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.capacity-scheduling.p004
    topics: [management.operations.capacity-scheduling]
    difficulty: 2
    type: numeric
    stem: "จากห้องปฏิบัติการในข้อก่อน (ออกแบบ 600 ได้ผล 520 ตรวจจริง 468 ตัวอย่างต่อวัน) ประสิทธิภาพเป็นร้อยละเท่าใด"
    answer: { value: 90, unit: "%" }
    hints:
      - "ประสิทธิภาพ = ผลผลิตจริง ÷ กำลังการผลิตที่ได้ผล"
      - "468 ÷ 520 × 100"
    misconceptions:
      - { match: 78, feedback: "นั่นคืออัตราการใช้ (หารด้วยกำลังที่ออกแบบ) ประสิทธิภาพหารด้วยกำลังที่ได้ผล" }
      - { match: 111.11, feedback: "หารกลับด้าน ต้องเป็นผลผลิตจริง ÷ กำลังที่ได้ผล ซึ่งไม่เกิน 100%" }
    solution: "ประสิทธิภาพ $= 468 \\div 520 \\times 100 = 90\\%$ แปลว่าเสียไป 10% จากเหตุที่ไม่ได้วางแผน เช่น เครื่องเสียหรือตัวอย่างต้องตรวจซ้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.capacity-scheduling.p005
    topics: [management.operations.capacity-scheduling]
    difficulty: 2
    type: mcq
    stem: "โรงพยาบาลมีผู้ป่วยนอกมากในวันจันทร์และน้อยในวันศุกร์ กลยุทธ์ใดเหมาะที่สุดในการวางแผนกำลังคน"
    choices:
      - { id: a, text: "ปรับกำลังตามความต้องการ เช่น จัดเวรแพทย์และพยาบาลเพิ่มวันจันทร์", correct: true }
      - { id: b, text: "ผลิตคงที่ แล้วเก็บบริการวันศุกร์ไว้ใช้วันจันทร์", feedback: "บริการตรวจรักษาเก็บเป็นสินค้าคงคลังไม่ได้ จึงใช้แผนผลิตคงที่แบบโรงงานไม่ได้" }
      - { id: c, text: "จัดคนเท่ากันทุกวันตามความต้องการเฉลี่ย", feedback: "วันจันทร์จะรอนานมาก ส่วนวันศุกร์คนว่าง เพราะบริการเก็บไว้ไม่ได้" }
      - { id: d, text: "จัดคนตามวันที่มีผู้ป่วยมากที่สุดทุกวัน", feedback: "ทำให้ต้นทุนสูงและคนว่างในวันที่ผู้ป่วยน้อย" }
    hints:
      - "บริการเก็บเป็นสต็อกได้หรือไม่"
      - "ถ้าเก็บไม่ได้ ต้องปรับกำลังให้ตามความต้องการ"
    solution: "งานบริการเก็บเป็นสินค้าคงคลังไม่ได้ จึงต้องใช้กลยุทธ์ตามความต้องการ เช่น ปรับตารางเวร ใช้เจ้าหน้าที่ชั่วคราว หรือนัดผู้ป่วยให้กระจายวัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.capacity-scheduling.p006
    topics: [management.operations.capacity-scheduling]
    difficulty: 2
    type: order
    stem: "ร้านตัดเสื้อ (สมมติ) มีงานรอสี่งาน (เวลาทำ, กำหนดส่ง เป็นวัน): W (4, 9) X (7, 10) Y (2, 4) Z (5, 16) เรียงลำดับงานตามกฎ SPT"
    items:
      - "Y (2 วัน)"
      - "W (4 วัน)"
      - "Z (5 วัน)"
      - "X (7 วัน)"
    hints:
      - "SPT ดูเฉพาะเวลาทำ ไม่ดูกำหนดส่ง"
      - "เรียงเวลาทำจากน้อยไปมาก"
    solution: "เวลาทำ Y 2, W 4, Z 5, X 7 ลำดับ SPT จึงเป็น Y → W → Z → X"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.capacity-scheduling.p007
    topics: [management.operations.capacity-scheduling]
    difficulty: 3
    type: numeric
    stem: "งานสี่งานของร้านตัดเสื้อ (เวลาทำ, กำหนดส่ง เป็นวัน): W (4, 9) X (7, 10) Y (2, 4) Z (5, 16) ถ้าจัดลำดับตามกฎ SPT เวลาเฉลี่ยในระบบเป็นกี่วัน"
    answer: { value: 9.25, unit: วัน, tolerance: 0.01 }
    hints:
      - "ลำดับ SPT: Y W Z X หาเวลาเสร็จสะสมของแต่ละงาน"
      - "เวลาเสร็จ 2, 6, 11, 18 แล้วหาค่าเฉลี่ย"
    misconceptions:
      - { match: 11.5, feedback: "นั่นคือค่าเฉลี่ยเมื่อทำตามลำดับที่มาถึง (FCFS) ต้องเรียงตาม SPT ก่อน" }
      - { match: 4.5, feedback: "นั่นคือเวลาทำเฉลี่ยของงาน เวลาในระบบต้องรวมเวลาที่รองานก่อนหน้าด้วย" }
    solution: "ลำดับ Y W Z X เวลาเสร็จ 2, 6, 11, 18 รวม 37 วัน เวลาเฉลี่ยในระบบ $37 \\div 4 = 9.25$ วัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.capacity-scheduling.p008
    topics: [management.operations.capacity-scheduling]
    difficulty: 3
    type: numeric
    stem: "งานสี่งานเดิม W (4, 9) X (7, 10) Y (2, 4) Z (5, 16) ถ้าจัดลำดับตามกฎ EDD ความล่าช้าเฉลี่ยเป็นกี่วัน"
    answer: { value: 1.25, unit: วัน, tolerance: 0.01 }
    hints:
      - "ลำดับ EDD: เรียงตามกำหนดส่ง Y (4) W (9) X (10) Z (16)"
      - "ความล่าช้า = max(0, เวลาเสร็จ − กำหนดส่ง) แล้วเฉลี่ยทั้งสี่งาน"
    misconceptions:
      - { match: 0, feedback: "ดูเหมือนนำงานที่เสร็จก่อนกำหนดมาเป็นค่าลบหักล้างกัน ความล่าช้าของงานที่เสร็จก่อนกำหนดเป็น 0" }
      - { match: 2.5, feedback: "หารด้วยจำนวนงานที่ช้า (2 งาน) ความล่าช้าเฉลี่ยต้องหารด้วยจำนวนงานทั้งหมด" }
    solution: "ลำดับ Y W X Z เวลาเสร็จ 2, 6, 13, 18 ความล่าช้า 0, 0, 3, 2 รวม 5 วัน เฉลี่ย $5 \\div 4 = 1.25$ วัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.capacity-scheduling.p009
    topics: [management.operations.capacity-scheduling]
    difficulty: 3
    type: numeric
    stem: "จากแผนภูมิแกนต์ของร้านพิมพ์ในภาพ นับตั้งแต่เวลา 0 จนงานสุดท้ายเสร็จ เครื่องที่ 2 ว่างรวมกี่ชั่วโมง"
    figure:
      src: p-gantt.svg
      alt: "แผนภูมิแกนต์สองแถว แกนเวลา 0–16 ชั่วโมง เครื่องที่ 1: งาน ก 0–3, ข 3–8, ค 8–10 เครื่องที่ 2: งาน ก 3–7, ข 8–10, ค 10–16"
    answer: { value: 4, unit: ชั่วโมง }
    hints:
      - "หาช่วงที่แถวเครื่องที่ 2 ไม่มีแท่ง ตั้งแต่ 0 ถึง 16"
      - "มีช่วงว่างก่อนงานแรกและระหว่างงาน"
    misconceptions:
      - { match: 1, feedback: "นับเฉพาะช่วงว่างระหว่างงาน (7–8) ยังไม่ได้นับช่วง 0–3 ที่เครื่องที่ 2 รองานแรก" }
      - { match: 3, feedback: "นับเฉพาะช่วงรองานแรก (0–3) ยังไม่ได้นับช่วง 7–8" }
    solution: "เครื่องที่ 2 ว่างช่วง 0–3 (3 ชั่วโมง) และ 7–8 (1 ชั่วโมง) รวม 4 ชั่วโมง จากทั้งหมด 16 ชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.capacity-scheduling.p010
    topics: [management.operations.capacity-scheduling]
    difficulty: 3
    type: numeric
    stem: "โรงงานข้าวเกรียบ (สมมติ) พยากรณ์ความต้องการ 6 เดือนรวม 7,000 ลัง มีคงคลังต้นงวด 400 ลัง และต้องการให้เหลือคงคลังปลายงวด 600 ลัง ถ้าใช้แผนผลิตคงที่ ต้องผลิตเดือนละกี่ลัง"
    answer: { value: 1200, unit: ลัง }
    hints:
      - "ต้องผลิตรวม = ความต้องการ − คงคลังต้นงวด + คงคลังปลายงวด"
      - "หารด้วย 6 เดือน"
    misconceptions:
      - { match: 1166.67, feedback: "ไม่ได้ปรับคงคลังต้นงวดและปลายงวด" }
      - { match: 1333.33, feedback: "บวกคงคลังต้นงวดแทนที่จะลบ ของที่มีอยู่แล้วช่วยลดสิ่งที่ต้องผลิต" }
    solution: "ผลิตรวม $7{,}000 - 400 + 600 = 7{,}200$ ลัง ผลิตเดือนละ $7{,}200 \\div 6 = 1{,}200$ ลัง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.capacity-scheduling.p011
    topics: [management.operations.capacity-scheduling]
    difficulty: 4
    type: numeric
    stem: "งานห้างานต้องผ่านเครื่องไส (เครื่อง 1) แล้วเครื่องขัด (เครื่อง 2) เวลา (ชั่วโมง) เครื่อง 1/เครื่อง 2: P 4/6, Q 7/3, R 2/5, S 6/8, T 5/2 ถ้าจัดลำดับตามกฎของจอห์นสัน งานทั้งหมดเสร็จที่ชั่วโมงที่เท่าใด"
    answer: { value: 26, unit: ชั่วโมง }
    hints:
      - "จัดลำดับก่อน: เวลาน้อยสุดที่เครื่อง 1 วางหน้า ที่เครื่อง 2 วางท้าย"
      - "ลำดับที่ได้ R P S Q T แล้วไล่เวลาเริ่มและเสร็จทีละเครื่อง เครื่อง 2 เริ่มงานได้เมื่อเครื่อง 1 ทำงานนั้นเสร็จและเครื่อง 2 ว่าง"
    misconceptions:
      - { match: 29, feedback: "นั่นคือเวลาเมื่อทำตามลำดับตัวอักษร P Q R S T ยังไม่ได้ใช้กฎของจอห์นสัน" }
      - { match: 24, feedback: "นั่นคือผลรวมเวลาของเครื่อง 1 เท่านั้น ต้องรอให้งานสุดท้ายผ่านเครื่อง 2 ด้วย" }
    solution: "ลำดับ R P S Q T เครื่อง 1: R 0–2, P 2–6, S 6–12, Q 12–19, T 19–24 เครื่อง 2: R 2–7, P 7–13, S 13–21, Q 21–24, T 24–26 งานทั้งหมดเสร็จที่ 26 ชั่วโมง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.capacity-scheduling.p012
    topics: [management.operations.capacity-scheduling]
    difficulty: 4
    type: order
    stem: "เรียงลำดับงานตามกฎของจอห์นสัน เวลา (ชั่วโมง) เครื่อง 1/เครื่อง 2: P 4/6, Q 7/3, R 2/5, S 6/8, T 5/2"
    items:
      - "R"
      - "P"
      - "S"
      - "Q"
      - "T"
    hints:
      - "เวลาน้อยสุดทั้งตารางคือ 2 มีสองค่า: R ที่เครื่อง 1 (วางหน้า) และ T ที่เครื่อง 2 (วางท้าย)"
      - "ที่เหลือ P Q S: เวลาน้อยสุดคือ 3 (Q ที่เครื่อง 2) วางท้ายที่ว่าง"
    solution: "R ไปหน้าสุด T ไปท้ายสุด Q (3 ที่เครื่อง 2) ไปท้ายก่อน T P (4 ที่เครื่อง 1) ไปหน้าต่อจาก R เหลือ S อยู่กลาง ได้ R P S Q T"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.capacity-scheduling.p013
    topics: [management.operations.capacity-scheduling]
    difficulty: 4
    type: numeric
    stem: "ศูนย์บรรจุผลไม้ (สมมติ) ใช้แผนผลิตตามความต้องการ ความต้องการสามเดือนเป็น 800, 1,000 และ 900 ตัน เดือนก่อนหน้าผลิต 900 ตัน การเพิ่มอัตราผลิตมีต้นทุน 40 บาทต่อตัน การลดมีต้นทุน 25 บาทต่อตัน ต้นทุนการปรับอัตราผลิตรวมสามเดือนเป็นกี่บาท"
    answer: { value: 13000, unit: บาท }
    hints:
      - "เทียบแต่ละเดือนกับเดือนก่อนหน้า เริ่มจาก 900 → 800"
      - "ลด 100 (×25) เพิ่ม 200 (×40) ลด 100 (×25)"
    misconceptions:
      - { match: 16000, feedback: "ใช้ต้นทุน 40 บาทกับทุกการเปลี่ยนแปลง การลดอัตราผลิตมีต้นทุน 25 บาทต่อตัน" }
      - { match: 10500, feedback: "ไม่ได้คิดการเปลี่ยนจาก 900 ของเดือนก่อนหน้าเป็น 800 ในเดือนแรก" }
    solution: "เดือน 1 ลด 100 ตัน $= 2{,}500$ บาท เดือน 2 เพิ่ม 200 ตัน $= 8{,}000$ บาท เดือน 3 ลด 100 ตัน $= 2{,}500$ บาท รวม $13{,}000$ บาท"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: management.operations.capacity-scheduling.p014
    topics: [management.operations.capacity-scheduling]
    difficulty: 4
    type: numeric
