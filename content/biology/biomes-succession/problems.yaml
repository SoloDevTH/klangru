      - { id: c, text: "ข้อมูลพิสูจน์ว่าไร่ร้างไม่มีทางกลายเป็นป่า", feedback: "แปลงที่ไม่ถูกไฟไหม้เกือบทั้งหมดกลายเป็นป่า" }
      - { id: d, text: "ไฟไม่เกี่ยวข้อง เพราะแปลงที่ไม่ถูกไฟไหม้ก็มีแปลงที่ไม่เป็นป่า 1 แปลง", feedback: "ข้อยกเว้น 1 ใน 12 แปลงไม่ได้ลบล้างรูปแบบที่ชัดเจนระหว่างสองกลุ่ม (11/12 เทียบ 1/8)" }
