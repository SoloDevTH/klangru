  - id: chemistry.bonding.polarity-intermolecular.p016
    topics: [chemistry.bonding.polarity-intermolecular]
    difficulty: 5
    type: mcq
    stem: "นักเรียนหยดน้ำ เอทานอล และอะซีโตน (น้ำยาล้างเล็บ) อย่างละ 1 หยดบนกระจกพร้อมกันในห้องเรียน พบว่าอะซีโตนแห้งก่อน ตามด้วยเอทานอล ส่วนน้ำแห้งช้าที่สุด ข้อสรุปใดสอดคล้องกับผลนี้"
    choices:
      - { id: a, text: "แรงระหว่างโมเลกุลของน้ำมากที่สุด และของอะซีโตนน้อยที่สุด", correct: true, feedback: "ถูก สารที่แรงระหว่างโมเลกุลน้อย โมเลกุลหลุดออกจากผิวของเหลวได้ง่าย" }
      - { id: b, text: "อะซีโตนมีพันธะโคเวเลนต์อ่อนที่สุด จึงสลายตัวเร็ว", feedback: "การระเหยไม่ได้ทำลายพันธะโคเวเลนต์ โมเลกุลอะซีโตนยังอยู่ครบในไอ" }
      - { id: c, text: "น้ำมีมวลโมเลกุลมากที่สุด จึงระเหยช้าที่สุด", feedback: "น้ำ (18 g/mol) เบากว่าเอทานอล (46) และอะซีโตน (58) ความต่างมาจากพันธะไฮโดรเจน" }
    hints:
      - "สารที่ระเหยเร็วคือสารที่โมเลกุลหลุดออกจากกันง่าย"
      - "อะซีโตนไม่มี H ต่อกับ O ส่วนเอทานอลมีหนึ่งตำแหน่ง และน้ำมีสองตำแหน่ง"
    solution: "อัตราการระเหยสะท้อนความแรงของแรงระหว่างโมเลกุล อะซีโตนมีแรงระหว่างขั้วแต่ไม่มีพันธะไฮโดรเจนระหว่างโมเลกุลของตัวเอง เอทานอลมีพันธะไฮโดรเจนหนึ่งตำแหน่งต่อโมเลกุล น้ำมีพันธะไฮโดรเจนได้มากที่สุด จึงระเหยช้าที่สุด"
