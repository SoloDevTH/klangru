  - id: biology.plants.photosynthesis-intro.p015
    topics: [biology.plants.photosynthesis-intro]
    difficulty: 5
    type: order
    stem: "อะตอมคาร์บอนในแก๊สคาร์บอนไดออกไซด์ที่เราหายใจออก อาจเดินทางกลับมาหาเราได้ เรียงลำดับเส้นทางนี้ให้ถูกต้อง"
    items:
      - "แก๊สคาร์บอนไดออกไซด์แพร่เข้าใบข้าวทางปากใบ"
      - "ใบข้าวสังเคราะห์ด้วยแสงได้น้ำตาล"
      - "น้ำตาลถูกเปลี่ยนเป็นแป้งเก็บไว้ในเมล็ดข้าว"
      - "เรากินข้าว ร่างกายย่อยแป้งเป็นน้ำตาล"
      - "เซลล์ของเราหายใจระดับเซลล์ ปล่อยแก๊สคาร์บอนไดออกไซด์ออกมาอีกครั้ง"
    hints:
      - "เริ่มจากคาร์บอนในอากาศเข้าสู่พืช"
      - "สุดท้ายคาร์บอนกลับสู่อากาศด้วยการหายใจ"
    solution: "แก๊สคาร์บอนไดออกไซด์เข้าใบ → สังเคราะห์ด้วยแสงเป็นน้ำตาล → เก็บเป็นแป้งในเมล็ด → เรากินและย่อยเป็นน้ำตาล → หายใจระดับเซลล์ คืนแก๊สคาร์บอนไดออกไซด์สู่อากาศ สสารหมุนเวียน ส่วนพลังงานไหลมาจากแสงอาทิตย์"
    license: CC-BY-SA-4.0
    ai_assisted: true

