    text: ข้อความส่วนนั้นเป็นโมฆะ ลุงสมศักดิ์รับผิดในฐานะผู้ค้ำประกันไม่เกินหนี้ของลูกหนี้ และมีสิทธิให้เจ้าหนี้ไปเรียกจากลูกหนี้ก่อน
    correct: true
  - id: b
    text: ลุงสมศักดิ์ต้องจ่ายแทนทันทีที่ลูกหนี้ผิดนัด โดยเจ้าหนี้ไม่ต้องแจ้ง
