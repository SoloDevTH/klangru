  difficulty: 5
  type: mcq
  stem: ตอนดึก ลูกพี่ลูกน้องของนนท์ที่ใช้ยาบ้ามาหลายวันพูดคนเดียว หวาดระแวงว่ามีคนจะทำร้าย และถือมีดเดินไปมาหน้าบ้าน นนท์ควรทำอย่างไร
  choices:
  - id: a
    text: ออกห่างไปอยู่ที่ปลอดภัยพร้อมคนในบ้าน และให้ผู้ใหญ่โทร 1669 หรือ 191 ทันที
    correct: true
  - id: b
    text: เข้าไปแย่งมีดเอง
    feedback: เสี่ยงถูกทำร้าย ผู้ที่มีอาการทางจิตจากยาอาจตอบสนองรุนแรง
  - id: c
    text: ต่อว่าให้เขาสำนึก
    feedback: การโต้เถียงอาจทำให้เขาระแวงและก้าวร้าวมากขึ้น
  - id: d
    text: รอให้เขาหลับแล้วค่อยบอกผู้ใหญ่ตอนเช้า
    feedback: นี่เป็นเหตุฉุกเฉินที่อาจมีคนบาดเจ็บ ต้องขอความช่วยเหลือทันที
  hints:
