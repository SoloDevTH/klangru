id: english.grammar.english-vs-thai
subject: english
title: { th: "เปรียบเทียบโครงสร้างภาษาอังกฤษกับภาษาไทย", en: "Comparing English and Thai structures" }
summary: เทียบลำดับคำ ตำแหน่งคุณศัพท์ tense พหูพจน์ เครื่องหมายวรรคตอน ทำนองเสียงของประโยค และสุภาษิตที่ความหมายใกล้กันระหว่างภาษาอังกฤษกับภาษาไทย
difficulty: 4
minutes: 40
prerequisites: [english.grammar.questions, english.grammar.adjectives-comparison]
encompasses:
  - { id: english.grammar.questions, weight: 0.3 }
  - { id: english.grammar.adjectives-comparison, weight: 0.2 }
curriculum_tags: []
lessons:
  - type: figure
    src: word-order.svg
    alt: "แผนภาพเทียบลำดับคำสองตัวอย่าง ตัวอย่างแรก แมวดำสองตัวของฉัน → my two black cats แถวไทยมีกล่อง แมว ดำ สอง ตัว ของฉัน แถวอังกฤษมีกล่อง my two black cats มีลูกศรไขว้กัน: แมว→cats, ดำ→black, สอง→two, ของฉัน→my ส่วน ตัว ไม่มีลูกศร ใต้ภาพเขียนว่า ตัว (ลักษณนาม) ไม่มีในภาษาอังกฤษ แต่ cat ต้องเติม -s ตัวอย่างที่สอง คุณไปไหน → Where are you going? ลูกศร คุณ→you, ไป→going?, ไหน→Where ใต้ภาพเขียนว่า คำถามไปไว้หน้าประโยค เพิ่มกริยาช่วย are และ ? ท้ายประโยค"
    caption: "ลำดับคำของกลุ่มคำนามและคำถาม wh- เรียงกลับกันในสองภาษา"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.grammar.english-vs-thai.p004, prompt: "เขาสูง ภาษาอังกฤษขาดอะไร" }
  - type: worked-example
    title: แปลประโยคที่มีทั้งคุณศัพท์ จำนวน และ tense
    problem: "แปลเป็นภาษาอังกฤษ: \"พรุ่งนี้น้องสาวสองคนของฉันจะซื้อรองเท้าสีขาวคู่ใหม่\""
    steps:
      - text: "หาเวลา: พรุ่งนี้ + จะ → อนาคต ใช้ *will buy*"
      - text: "ประธาน: น้องสาวสองคนของฉัน → เจ้าของไว้หน้า จำนวนตามมา คำนามเติม s: *my two younger sisters*"
        why: "ภาษาไทยไม่มีพหูพจน์ แต่ two ต้องตามด้วยคำนามพหูพจน์"
      - text: "กรรม: รองเท้าสีขาวคู่ใหม่ → ไม่มีลักษณนาม คู่ ภาษาอังกฤษใช้ shoes (มีสองข้างจึงเป็นพหูพจน์) เรียงคุณศัพท์ อายุก่อนสี: *new white shoes*"
      - text: "เรียงเป็น SVO แล้ววางคำบอกเวลาไว้หน้าหรือท้ายประโยค ปิดด้วยจุด"
    answer: "*Tomorrow my two younger sisters will buy new white shoes.* (หรือ *My two younger sisters will buy new white shoes tomorrow.*)"
  - { type: check, problem: english.grammar.english-vs-thai.p007, prompt: "สุภาษิตคู่ไหนใช้ภาพต่างกันแต่ความหมายเหมือนกัน" }
glossary:
  - { term: word order, definition: "ลำดับคำในประโยค ทั้งสองภาษาเป็น SVO แต่ลำดับในกลุ่มคำนามและคำถามต่างกัน" }
  - { term: classifier, definition: "ลักษณนาม (ตัว คน ใบ) มีในภาษาไทย ไม่มีในภาษาอังกฤษ" }
  - { term: tense, definition: "กาล รูปกริยาที่เปลี่ยนตามเวลา ภาษาไทยไม่มี ใช้คำบอกเวลาแทน" }
  - { term: article, definition: "คำนำหน้านาม a, an, the ไม่มีในภาษาไทย" }
  - { term: tone language, definition: "ภาษาวรรณยุกต์ ระดับเสียงเปลี่ยนความหมายของคำ เช่น ภาษาไทย" }
  - { term: intonation, definition: "ทำนองเสียงขึ้นลงของทั้งประโยคในภาษาอังกฤษ" }
  - { term: proverb, definition: "สุภาษิต ถ้อยคำสั้น ๆ ที่สอนข้อคิด" }
flashcards:
  - { front: "แมวดำสองตัวของฉัน", back: "my two black cats" }
  - { front: "คุณไปไหน", back: "Where are you going?" }
  - { front: "เขาสูง (ภาษาอังกฤษต้องเพิ่มอะไร)", back: "verb to be: He is tall." }
  - { front: "หนีเสือปะจระเข้", back: "Out of the frying pan into the fire." }
  - { front: "คำถาม yes/no ภาษาอังกฤษใช้ทำนองเสียงแบบใด", back: "มักขึ้นเสียงท้าย ↗ (ภาษาไทยใช้คำว่า ไหม)" }
