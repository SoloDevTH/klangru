problems:
- id: english.grammar.conditionals.p001
  topics:
  - english.grammar.conditionals
  difficulty: 1
  type: text
  stem: 'เติมกริยา melt ในรูปที่ถูก: *If you heat ice, it ___.*'
  accepted:
  - melts
  - will melt
  misconceptions:
  - match: melt
    feedback: 'ประธาน it ใน present simple ต้องเติม s: melts'
  - match: melted
    feedback: ข้อเท็จจริงทั่วไปใช้ present simple ไม่ใช้อดีต
  - match: would melt
    feedback: นี่เป็นข้อเท็จจริงที่เกิดได้จริง ไม่ใช่เรื่องสมมุติ ไม่ใช้ would
  hints:
  - ข้อเท็จจริงที่เกิดทุกครั้ง = zero conditional
  - If + present, present (it → เติม s)
  solution: '*If you heat ice, it **melts**.* (zero conditional ใช้ *will melt* ก็ได้)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.conditionals.p002
  topics:
  - english.grammar.conditionals
  difficulty: 1
  type: mcq
  stem: 'เลือกคำที่ถูก: *If it rains tomorrow, we ___ at home.*'
  choices:
  - id: a
    text: will stay
    correct: true
    feedback: ถูก เป็นไปได้จริงในอนาคต ใช้ will + V1
  - id: b
    text: stayed
    feedback: tomorrow เป็นอนาคต ไม่ใช้กริยาอดีต
  - id: c
    text: would stayed
    feedback: หลัง would ใช้ V1 และเหตุการณ์นี้เป็นไปได้จริง ใช้ will
  - id: d
    text: will staying
    feedback: หลัง will ใช้ V1
  hints:
  - tomorrow + เป็นไปได้จริง = first conditional
  - If + present, will + V1
  solution: '*If it rains tomorrow, we **will stay** at home.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.conditionals.p003
  topics:
  - english.grammar.conditionals
  difficulty: 1
  type: mcq
  stem: '*If you mix red and yellow, you get orange.* เป็น conditional แบบใด'
  choices:
  - id: a
    text: 'zero: ข้อเท็จจริงที่เกิดทุกครั้ง'
    correct: true
    feedback: ถูก ทั้งสองส่วนเป็น present simple และเป็นจริงเสมอ
  - id: b
    text: 'first: เป็นไปได้ในอนาคต'
    feedback: first ต้องมี will ในส่วนผล
  - id: c
    text: 'second: สมมุติ ไม่จริง'
    feedback: second ใช้ past + would และเป็นเรื่องสมมุติ
  hints:
  - ดู tense ทั้งสองส่วน
  - present + present = ข้อเท็จจริง
  solution: เป็น **zero conditional** ผสมแดงกับเหลืองได้สีส้มทุกครั้ง
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.conditionals.p004
  topics:
  - english.grammar.conditionals
  difficulty: 2
  type: text
  stem: 'เติมกริยา have ในรูปที่ถูก: *If I ___ time tomorrow, I will help you with your project.*'
  accepted:
  - have
  misconceptions:
  - match: will have
    feedback: 'ห้ามใช้ will ใน if-clause ใช้ present simple: have'
  - match: had
    feedback: ส่วนผลใช้ will จึงเป็น first conditional ส่วน if ใช้ present simple
  - match: has
    feedback: ประธาน I ใช้ have
  hints:
  - ส่วนผลมี will → first conditional
  - if-clause ใช้ present simple ไม่ใช้ will
  solution: '*If I **have** time tomorrow, I will help you with your project.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.conditionals.p005
  topics:
  - english.grammar.conditionals
  difficulty: 2
  type: mcq
  stem: 'เลือกคำที่ถูก: *If I ___ a lot of money, I would buy a new house for my parents.*'
  choices:
  - id: a
    text: had
    correct: true
    feedback: ถูก ส่วนผลใช้ would เป็นเรื่องสมมุติ if-clause ใช้ past simple
  - id: b
    text: have
    feedback: 'ใช้ would ในส่วนผล if-clause ต้องเป็น past simple: had'
  - id: c
    text: will have
    feedback: ห้ามใช้ will ใน if-clause
  - id: d
    text: would have
    feedback: would ไม่อยู่ใน if-clause ของ second conditional
  hints:
  - ส่วนผลมี would → second conditional
  - If + past simple, would + V1
  solution: '*If I **had** a lot of money, I would buy a new house for my parents.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.conditionals.p006
  topics:
  - english.grammar.conditionals
  difficulty: 2
  type: match
  stem: จับคู่ if-clause กับส่วนผลให้ถูกทั้งไวยากรณ์และความหมาย
  pairs:
  - left: If you don't water plants,
    right: they die.
  - left: If you leave now,
    right: you will catch the last bus.
  - left: If I were a bird,
    right: I would fly over the mountains.
  - left: If you press this button,
    right: the machine starts.
  hints:
  - ดูว่าเป็นข้อเท็จจริง เป็นไปได้ หรือสมมุติ
  - If I were ... → would · If you leave now → will
  solution: ไม่รดน้ำ → they die (zero) · ออกตอนนี้ → will catch (first) · ถ้าเป็นนก → would fly (second) · กดปุ่ม → the machine starts (zero)
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.conditionals.p007
  topics:
  - english.grammar.conditionals
  difficulty: 2
  type: text
  stem: 'เติม so หรือ such: *It was ___ a hot day that we went swimming in the river.*'
  accepted:
  - such
  misconceptions:
  - match: so
    feedback: หลังช่องว่างมี a hot day (มีคำนาม) ต้องใช้ such
  - match: such a
    feedback: ในประโยคมี a อยู่แล้ว เติมแค่ such
  hints:
  - ดูว่าหลังช่องว่างมีคำนามไหม
  - such + a + คุณศัพท์ + คำนาม
  solution: '*It was **such** a hot day that we went swimming in the river.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.conditionals.p008
  topics:
  - english.grammar.conditionals
  difficulty: 3
  type: text
  stem: 'เติม so หรือ such: *The durian smelled ___ bad that nobody wanted to sit near it.*'
  accepted:
  - so
  misconceptions:
  - match: such
    feedback: หลังช่องว่างเป็นคุณศัพท์ bad ไม่มีคำนาม ใช้ so
  - match: very
    feedback: very ใช้กับ that ในความหมาย มากจนกระทั่ง ไม่ได้ ใช้ so ... that
  hints:
  - หลังช่องว่างมีแค่คุณศัพท์
  - so + คุณศัพท์ + that
  solution: '*The durian smelled **so** bad that nobody wanted to sit near it.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.conditionals.p009
  topics:
  - english.grammar.conditionals
  difficulty: 3
  type: mcq
  stem: '*Unless you hurry, you will miss the bus.* หมายความว่าอย่างไร'
  choices:
  - id: a
    text: ถ้าไม่รีบ จะตกรถ
    correct: true
    feedback: ถูก unless = if ... not
  - id: b
    text: ถ้ารีบ จะตกรถ
    feedback: unless มีความหมายปฏิเสธ (ถ้าไม่)
  - id: c
    text: ถึงจะรีบ ก็ตกรถอยู่ดี
    feedback: unless ไม่ได้แปลว่า ถึงแม้
  - id: d
    text: รีบไปขึ้นรถเมล์ทุกวัน
    feedback: ประโยคนี้เป็นเงื่อนไขครั้งหนึ่ง ไม่ใช่กิจวัตร
  hints:
  - unless = if not
  - Unless you hurry = If you don't hurry
  solution: '*Unless you hurry* = *If you don''t hurry* → **ถ้าไม่รีบ จะตกรถ**'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.conditionals.p010
  topics:
  - english.grammar.conditionals
  difficulty: 3
  type: mcq
  stem: '*If I were the prime minister, I would build more parks.* ข้อใดถูกต้องเกี่ยวกับประโยคนี้'
  choices:
  - id: a
    text: ผู้พูดไม่ได้เป็นนายกรัฐมนตรี เป็นการสมมุติ
    correct: true
    feedback: ถูก second conditional บอกเรื่องสมมุติที่ไม่จริงตอนนี้
  - id: b
    text: ผู้พูดเคยเป็นนายกรัฐมนตรีในอดีต
    feedback: were ใน second conditional ไม่ได้หมายถึงอดีต แต่หมายถึงสมมุติ
  - id: c
    text: ผู้พูดจะได้เป็นนายกรัฐมนตรีแน่นอน
    feedback: ถ้าเป็นไปได้จริงจะใช้ first conditional (will)
  - id: d
    text: ผู้พูดสร้างสวนสาธารณะไปแล้ว
    feedback: would build คือ จะสร้าง (ถ้าเป็นจริง) ยังไม่ได้สร้าง
  hints:
  - were + would = second conditional
  - past tense ในประโยคสมมุติไม่ได้บอกเวลาในอดีต
  solution: เป็นการสมมุติ **ผู้พูดไม่ได้เป็นนายกรัฐมนตรี** แต่บอกว่าถ้าเป็นจะสร้างสวนเพิ่ม
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.conditionals.p011
  topics:
  - english.grammar.conditionals
  difficulty: 3
  type: text
  stem: 'เติมกริยา eat ในรูปปฏิเสธ: *If I ___ breakfast, I feel hungry all morning.*'
  accepted:
  - do not eat
  - don't eat
  misconceptions:
  - match: not eat
    feedback: 'ต้องมี do: don''t eat'
  - match: won't eat
    feedback: ห้ามใช้ will ใน if-clause
  - match: doesn't eat
    feedback: ประธาน I ใช้ don't
  - match: didn't eat
    feedback: ส่วนผลเป็น present (feel) เป็นเรื่องที่เกิดทุกครั้ง ใช้ present simple
  hints:
  - เรื่องที่เกิดทุกครั้ง = zero conditional ใช้ present simple
  - 'ปฏิเสธของ present simple กับ I: don''t + V1'
  solution: '*If I **don''t eat** breakfast, I feel hungry all morning.* (หรือ *do not eat*)'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.conditionals.p012
  topics:
  - english.grammar.conditionals
  difficulty: 3
  type: order
  stem: เรียงเป็นประโยค first conditional ที่ถูกต้อง
  items:
  - We'll miss the start of the film
  - if
  - we
  - don't leave
  - now.
  hints:
  - ส่วนผลอยู่หน้า ไม่ต้องมีจุลภาค
  - if + ประธาน + present simple
  solution: '*We''ll miss the start of the film if we don''t leave now.*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.conditionals.p013
  topics:
  - english.grammar.conditionals
  difficulty: 4
  type: text
  stem: 'รวมสองประโยคด้วย **so ... that** แล้วพิมพ์ทั้งประโยค: *The test was very difficult. Many students failed.*'
  accepted:
  - The test was so difficult that many students failed.
  - The test was so difficult that many students failed
  - The test was so difficult many students failed.
  - The test was so difficult many students failed
  misconceptions:
  - match: The test was such difficult that many students failed.
    feedback: หลัง such ต้องมีคำนาม คุณศัพท์อย่างเดียวใช้ so
  - match: The test was so difficult that many students fail.
    feedback: เหตุการณ์ในอดีต ใช้ failed
  - match: The test was very difficult that many students failed.
    feedback: ใช้ very กับ that ไม่ได้ ต้องเป็น so ... that
  hints:
  - แทน very ด้วย so แล้วเติม that + ผล
  - so + คุณศัพท์ + that + ผล
  solution: '***The test was so difficult that many students failed.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.conditionals.p014
  topics:
  - english.grammar.conditionals
  difficulty: 4
  type: mcq
  stem: ข้อใดถูกต้อง
  choices:
  - id: a
    text: It was such a beautiful beach that we stayed all day.
    correct: true
    feedback: ถูก such + a + คุณศัพท์ + คำนามเอกพจน์
  - id: b
    text: It was such beautiful beach that we stayed all day.
    feedback: 'beach เป็นคำนามเอกพจน์นับได้ ต้องมี a: such a beautiful beach'
  - id: c
    text: It was so beautiful beach that we stayed all day.
    feedback: มีคำนาม beach ต้องใช้ such a ไม่ใช่ so
  - id: d
    text: It was a such beautiful beach that we stayed all day.
    feedback: 'a อยู่หลัง such: such a'
  hints:
  - หลังช่องมีคำนามเอกพจน์ (beach)
  - such + a/an + คุณศัพท์ + คำนาม
  solution: '***It was such a beautiful beach that we stayed all day.***'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.conditionals.p015
  topics:
  - english.grammar.conditionals
  difficulty: 4
  type: mcq
  stem: ข้อใด **ผิด**
  choices:
  - id: a
    text: If it will rain this afternoon, the match will be cancelled.
    correct: true
    feedback: ผิดจริง ห้ามใช้ will ใน if-clause ต้องเป็น If it rains this afternoon
  - id: b
    text: If it rains this afternoon, the match will be cancelled.
    feedback: ถูก first conditional
  - id: c
    text: The match will be cancelled if it rains this afternoon.
    feedback: ถูก if-clause อยู่หลัง ไม่ต้องมีจุลภาค
  - id: d
    text: Unless it stops raining, the match will be cancelled.
    feedback: ถูก unless = if ... not
  hints:
  - ตรวจ if-clause ว่ามี will ไหม
  - if-clause ของ first conditional ใช้ present simple
  solution: '***If it will rain this afternoon, ...*** ผิด ต้องเป็น *If it **rains** this afternoon, ...*'
  license: CC-BY-SA-4.0
  ai_assisted: true
- id: english.grammar.conditionals.p016
  topics:
  - english.grammar.conditionals
  difficulty: 4
  type: text
  stem: 'เปลี่ยนเป็น second conditional แล้วพิมพ์ทั้งประโยค: *I don''t have a bike, so I can''t ride to school.* (ขึ้นต้นด้วย If)'
  accepted:
  - If I had a bike, I could ride to school.
  - If I had a bike, I could ride to school
  - If I had a bike I could ride to school.
  - If I had a bike I could ride to school
  - If I had a bike, I would be able to ride to school.
  - If I had a bike, I would be able to ride to school
  - If I had a bike, I'd be able to ride to school.
  - If I had a bike, I'd be able to ride to school
  - If I had a bike I would be able to ride to school.
  - If I had a bike I would be able to ride to school
  - If I had a bike I'd be able to ride to school.
  - If I had a bike I'd be able to ride to school
  - If I had a bike, I would ride to school.
  - If I had a bike, I would ride to school
  - If I had a bike, I'd ride to school.
  - If I had a bike, I'd ride to school
  - If I had a bike I would ride to school.
  - If I had a bike I would ride to school
  - If I had a bike I'd ride to school.
  - If I had a bike I'd ride to school
  misconceptions:
  - match: If I have a bike, I could ride to school.
    feedback: 'เรื่องสมมุติ (ความจริงไม่มีจักรยาน) if-clause ใช้ past simple: had'
  - match: If I had a bike, I can ride to school.
    feedback: second conditional ใช้ could หรือ would ไม่ใช่ can
  - match: If I didn't have a bike, I could ride to school.
    feedback: 'ความหมายกลับกัน ความจริงคือไม่มี จึงสมมุติว่า มี: If I had a bike'
  - match: If I would have a bike, I could ride to school.
    feedback: ไม่ใช้ would ใน if-clause
  hints:
  - 'ความจริง: ไม่มีจักรยาน → สมมุติว่ามี'
  - If + past simple, could/would + V1
  solution: '***If I had a bike, I could ride to school.*** (หรือ *I would ride / I would be able to ride*)'
