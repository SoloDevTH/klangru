problems:
  - id: chemistry.matter.pure-substances.p001
    topics: [chemistry.matter.pure-substances]
    difficulty: 1
    type: mcq
    stem: "สารในข้อใดเป็นสารบริสุทธิ์"
    choices:
      - { id: a, text: "น้ำกลั่น", correct: true, feedback: "ถูก มีแต่โมเลกุลน้ำชนิดเดียว" }
      - { id: b, text: "น้ำเกลือ", feedback: "มีน้ำและเกลือปนกัน เป็นสารผสม" }
      - { id: c, text: "อากาศ", feedback: "อากาศมีไนโตรเจน ออกซิเจน และแก๊สอื่นปนกัน เป็นสารผสม" }
      - { id: d, text: "น้ำส้มคั้น", feedback: "มีน้ำ น้ำตาล กรด และเนื้อส้มปนกัน เป็นสารผสม" }
    hints:
      - "สารบริสุทธิ์มีองค์ประกอบเพียงชนิดเดียว"
      - "ข้อใดมีอนุภาคชนิดเดียว"
    solution: "**น้ำกลั่น** มีแต่โมเลกุลน้ำ จึงเป็นสารบริสุทธิ์ ข้ออื่นมีสารหลายชนิดปนกัน เป็นสารผสม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.pure-substances.p002
    topics: [chemistry.matter.pure-substances]
    difficulty: 1
    type: match
    stem: "จับคู่สารกับประเภท"
    pairs:
      - { left: "น้ำตาลทราย", right: "สารบริสุทธิ์" }
      - { left: "น้ำเชื่อม", right: "สารผสมเนื้อเดียว" }
      - { left: "น้ำโคลน", right: "สารผสมเนื้อผสม" }
    hints:
      - "น้ำตาลทรายมีองค์ประกอบชนิดเดียว"
      - "สารผสมที่มองเห็นส่วนประกอบแยกกันคือเนื้อผสม"
    solution: "น้ำตาลทรายเป็นสารบริสุทธิ์ (ซูโครส) · น้ำเชื่อมเป็นสารละลายใสเนื้อเดียว · น้ำโคลนมองเห็นดินแขวนลอย จึงเป็นสารเนื้อผสม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.pure-substances.p003
    topics: [chemistry.matter.pure-substances]
    difficulty: 2
    type: numeric
    stem: "ก้อนโลหะทรงสี่เหลี่ยมขนาด 4.0 cm × 2.5 cm × 2.0 cm มีมวล 179.2 g ความหนาแน่นเท่ากับกี่ $\\mathrm{g/cm^3}$"
    answer: { value: 8.96, tolerance: 0.05, unit: g/cm³ }
    misconceptions:
      - { match: 0.112, feedback: "หารปริมาตรด้วยมวล ต้องเป็นมวล ÷ ปริมาตร" }
      - { match: 21.08, feedback: "ใช้ผลบวกของด้าน (8.5) เป็นปริมาตร ต้องคูณกัน" }
    hints:
      - "ปริมาตรทรงสี่เหลี่ยม = กว้าง × ยาว × สูง"
      - "$\\rho = m / V$"
    solution: "$V = 4.0 \\times 2.5 \\times 2.0 = 20\\ \\mathrm{cm^3}$ · $\\rho = 179.2 / 20 = 8.96\\ \\mathrm{g/cm^3}$ ตรงกับทองแดง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.pure-substances.p004
    topics: [chemistry.matter.pure-substances]
    difficulty: 2
    type: mcq
    stem: "จากกราฟการต้มน้ำกลั่นและน้ำเกลือ ข้อใดบอกลักษณะของน้ำเกลือได้ถูกต้อง"
    choices:
      - { id: a, text: "เดือดที่อุณหภูมิสูงกว่า 100 °C และอุณหภูมิค่อย ๆ สูงขึ้นขณะเดือด", correct: true, feedback: "ถูก เป็นลักษณะของสารผสม" }
      - { id: b, text: "เดือดที่ 100 °C และอุณหภูมิคงที่เหมือนน้ำกลั่น", feedback: "นั่นคือลักษณะของน้ำกลั่นซึ่งเป็นสารบริสุทธิ์" }
      - { id: c, text: "เดือดที่อุณหภูมิต่ำกว่า 100 °C", feedback: "เกลือที่ละลายอยู่ทำให้จุดเดือด **สูงขึ้น** ไม่ใช่ต่ำลง" }
    hints:
      - "ดูเส้นประสีแดงหลังจากเริ่มเดือด"
      - "เส้นราบหรือยังเอียงขึ้น"
    solution: "น้ำเกลือเป็นสารผสม เดือดที่อุณหภูมิสูงกว่า 100 °C และขณะเดือด น้ำระเหยไป น้ำเกลือที่เหลือเข้มข้นขึ้น อุณหภูมิจึงค่อย ๆ สูงขึ้น ไม่ราบเหมือนสารบริสุทธิ์"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.pure-substances.p005
    topics: [chemistry.matter.pure-substances]
    difficulty: 2
    type: numeric
    stem: "น้ำมันพืชมีความหนาแน่น $0.92\\ \\mathrm{g/cm^3}$ น้ำมันพืช 500 $\\mathrm{cm^3}$ มีมวลกี่กรัม"
    answer: { value: 460, tolerance: 2, unit: g }
    misconceptions:
      - { match: 543.5, feedback: "หาร 500 ด้วย 0.92 ต้องคูณ: มวล = ความหนาแน่น × ปริมาตร" }
    hints:
      - "จัดสูตร $\\rho = m/V$ ให้ $m$ อยู่ข้างเดียว"
      - "$m = \\rho \\times V$"
    solution: "$m = 0.92 \\times 500 = 460$ g น้อยกว่าน้ำปริมาตรเท่ากัน (500 g) น้ำมันจึงลอยน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.pure-substances.p006
    topics: [chemistry.matter.pure-substances]
    difficulty: 3
    type: numeric
    stem: "ก้อนโลหะหนัก 37.8 g ถูกหย่อนลงในกระบอกตวงดังภาพ จงหาความหนาแน่นของก้อนโลหะเป็น $\\mathrm{g/cm^3}$"
    figure:
      src: p-displacement-density.svg
      alt: "กระบอกตวงสองใบ สเกล 0 ถึง 100 mL ขีดละ 2 mL ใบซ้าย (ก่อน) ส่วนโค้งล่างของผิวน้ำอยู่ที่ 50 mL ใบขวา (หลังใส่ก้อนโลหะ) มีก้อนโลหะอยู่ก้นกระบอก ส่วนโค้งล่างของผิวน้ำอยู่ที่ 64 mL"
    answer: { value: 2.7, tolerance: 0.03, unit: g/cm³ }
    misconceptions:
      - { match: 0.59, feedback: "หารด้วยระดับน้ำหลังใส่ (64 mL) ปริมาตรของโลหะคือส่วนที่เพิ่มขึ้นเท่านั้น" }
      - { match: 0.756, feedback: "หารด้วยระดับน้ำก่อนใส่ (50 mL) ต้องใช้ผลต่างของระดับน้ำ" }
    hints:
      - "อ่านส่วนโค้งล่างของผิวน้ำทั้งก่อนและหลัง"
      - "ปริมาตรโลหะ = ระดับหลัง − ระดับก่อน ($1\\ \\mathrm{mL} = 1\\ \\mathrm{cm^3}$)"
    solution: "ปริมาตร $= 64 - 50 = 14\\ \\mathrm{cm^3}$ · $\\rho = 37.8 / 14 = 2.70\\ \\mathrm{g/cm^3}$ น่าจะเป็นอะลูมิเนียม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.pure-substances.p007
    topics: [chemistry.matter.pure-substances]
    difficulty: 3
    type: mcq
    stem: "แนฟทาลีนบริสุทธิ์หลอมเหลวที่ประมาณ 80 °C นักเรียนวัดจุดหลอมเหลวของตัวอย่างแนฟทาลีนได้ในช่วง 75–78 °C สรุปได้อย่างไร"
    choices:
      - { id: a, text: "ตัวอย่างมีสิ่งเจือปน เพราะหลอมต่ำกว่าและหลอมในช่วงกว้าง", correct: true, feedback: "ถูก สิ่งเจือปนทำให้จุดหลอมเหลวลดลงและไม่คมชัด" }
      - { id: b, text: "ตัวอย่างบริสุทธิ์กว่าปกติ", feedback: "สารบริสุทธิ์หลอมที่อุณหภูมิเดียวชัดเจน ตัวอย่างนี้หลอมในช่วงกว้าง" }
      - { id: c, text: "เทอร์มอมิเตอร์เสียเท่านั้น สรุปเรื่องความบริสุทธิ์ไม่ได้", feedback: "ความคลาดเคลื่อนของเครื่องมือเป็นไปได้ แต่การหลอมเป็นช่วงกว้างเป็นลักษณะของสารผสม" }
    hints:
      - "สารบริสุทธิ์หลอมเหลวที่อุณหภูมิเดียว"
      - "สิ่งเจือปนมีผลต่อจุดหลอมเหลวอย่างไร"
    solution: "สารบริสุทธิ์หลอมที่อุณหภูมิคงที่ค่าเดียว ตัวอย่างนี้หลอมต่ำกว่า 80 °C และเป็นช่วง 3 องศา แสดงว่ามีสิ่งเจือปน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.pure-substances.p008
    topics: [chemistry.matter.pure-substances]
    difficulty: 3
    type: order
    stem: "เทน้ำผึ้ง (ประมาณ $1.4\\ \\mathrm{g/cm^3}$) น้ำ ($1.00$) และน้ำมันพืช ($0.92$) ลงในแก้วใสใบเดียวกัน แล้วหย่อนจุกไม้ก๊อก ($0.24$) ลงไป เรียงสิ่งที่อยู่จากชั้นบนสุดลงไปชั้นล่างสุด"
    items:
      - "จุกไม้ก๊อก"
      - "น้ำมันพืช"
      - "น้ำ"
      - "น้ำผึ้ง"
    hints:
      - "สารที่หนาแน่นน้อยกว่าลอยอยู่บนสารที่หนาแน่นมากกว่า"
      - "เรียงความหนาแน่นจากน้อยไปมาก"
    solution: "จุกไม้ก๊อก (0.24) < น้ำมันพืช (0.92) < น้ำ (1.00) < น้ำผึ้ง (1.4) สารที่หนาแน่นน้อยที่สุดอยู่บนสุด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.pure-substances.p009
    topics: [chemistry.matter.pure-substances]
    difficulty: 2
    type: mcq
    stem: "ขวดน้ำดื่มเขียนว่า \"น้ำดื่มบริสุทธิ์\" และฉลากบอกว่ามีแคลเซียม แมกนีเซียม และโซเดียมละลายอยู่ ในทางวิทยาศาสตร์ น้ำดื่มขวดนี้เป็นสารประเภทใด"
    choices:
      - { id: a, text: "สารผสม เพราะมีแร่ธาตุหลายชนิดละลายอยู่ในน้ำ", correct: true, feedback: "ถูก บริสุทธิ์บนฉลากหมายถึงสะอาดปลอดภัย ไม่ใช่มีองค์ประกอบชนิดเดียว" }
      - { id: b, text: "สารบริสุทธิ์ เพราะฉลากเขียนว่าบริสุทธิ์", feedback: "คำบนฉลากใช้ความหมายทั่วไป ในวิทยาศาสตร์ต้องดูว่ามีองค์ประกอบกี่ชนิด" }
      - { id: c, text: "สารบริสุทธิ์ เพราะมองเห็นเป็นเนื้อเดียวและใส", feedback: "สารละลายก็ใสและเป็นเนื้อเดียว แต่เป็นสารผสม" }
    hints:
      - "สารบริสุทธิ์มีองค์ประกอบกี่ชนิด"
      - "ฉลากบอกว่ามีอะไรอยู่ในน้ำบ้าง"
    solution: "น้ำดื่มมีน้ำและแร่ธาตุละลายอยู่หลายชนิด จึงเป็น **สารผสมเนื้อเดียว** (สารละลาย) คำว่าบริสุทธิ์บนฉลากหมายถึงสะอาด ไม่มีสิ่งปนเปื้อนที่เป็นอันตราย"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.pure-substances.p010
    topics: [chemistry.matter.pure-substances]
    difficulty: 4
    type: mcq
    stem: "กำไลโลหะสีขาวจากร้านเครื่องประดับหนัก 52.5 g แทนที่น้ำได้ $5.0\\ \\mathrm{cm^3}$ กำไลนี้น่าจะทำจากโลหะใด (อะลูมิเนียม 2.70 · เหล็ก 7.87 · เงิน 10.5 · แพลทินัม 21.4 $\\mathrm{g/cm^3}$)"
    choices:
      - { id: a, text: "เงิน", correct: true, feedback: "ถูก ความหนาแน่น 10.5 g/cm³ ตรงกับเงิน" }
      - { id: b, text: "อะลูมิเนียม", feedback: "อะลูมิเนียมเบากว่ามาก กำไลขนาดนี้จะหนักเพียงราว 13.5 g" }
      - { id: c, text: "แพลทินัม", feedback: "แพลทินัมหนาแน่นเกือบสองเท่าของค่าที่คำนวณได้" }
      - { id: d, text: "เหล็ก", feedback: "เหล็กหนาแน่น 7.87 g/cm³ น้อยกว่าค่าที่คำนวณได้" }
    hints:
      - "คำนวณความหนาแน่นของกำไล"
      - "เทียบกับตารางความหนาแน่น"
    solution: "$\\rho = 52.5 / 5.0 = 10.5\\ \\mathrm{g/cm^3}$ ตรงกับเงิน (การยืนยันจริงอาจต้องตรวจสมบัติอื่นประกอบ เพราะโลหะผสมบางชนิดอาจมีความหนาแน่นใกล้กัน)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.pure-substances.p011
    topics: [chemistry.matter.pure-substances]
    difficulty: 4
    type: numeric
    stem: "อะลูมิเนียมมีความหนาแน่น $2.70\\ \\mathrm{g/cm^3}$ คิดเป็นกี่ $\\mathrm{kg/m^3}$"
    answer: { value: 2700, tolerance: 10, unit: kg/m³ }
    misconceptions:
      - { match: 0.0027, feedback: "หาร 1,000 แทนการคูณ 1 m³ มี 1,000,000 cm³ และ 1 kg = 1,000 g จึงต้องคูณ 1,000" }
      - { match: 2700000, feedback: "คูณ 1,000,000 แต่ลืมเปลี่ยนกรัมเป็นกิโลกรัม (หาร 1,000)" }
    hints:
      - "$1\\ \\mathrm{m^3} = 1{,}000{,}000\\ \\mathrm{cm^3}$ และ $1\\ \\mathrm{kg} = 1{,}000\\ \\mathrm{g}$"
      - "$1\\ \\mathrm{g/cm^3} = 1{,}000\\ \\mathrm{kg/m^3}$"
    solution: "$2.70\\ \\mathrm{g/cm^3} = 2.70 \\times \\dfrac{10^6\\ \\mathrm{cm^3/m^3}}{10^3\\ \\mathrm{g/kg}} = 2{,}700\\ \\mathrm{kg/m^3}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.pure-substances.p012
    topics: [chemistry.matter.pure-substances]
    difficulty: 4
    type: mcq
    stem: "แม่ค้าทำไข่เค็มทดสอบน้ำเกลือที่ต้มไว้โดยหย่อนไข่สดลงไป ถ้าไข่จมให้เติมเกลืออีก จนไข่ลอยปริ่มน้ำจึงใช้ได้ หลักการนี้ใช้สมบัติใด"
    choices:
      - { id: a, text: "ความหนาแน่นของน้ำเกลือเพิ่มขึ้นตามปริมาณเกลือ จนมากกว่าความหนาแน่นของไข่", correct: true, feedback: "ถูก ความหนาแน่นของสารผสมเปลี่ยนตามสัดส่วน" }
      - { id: b, text: "เกลือทำให้ไข่เบาลง", feedback: "มวลของไข่ไม่เปลี่ยน สิ่งที่เปลี่ยนคือน้ำเกลือรอบไข่" }
      - { id: c, text: "น้ำเกลือมีจุดเดือดสูงขึ้น", feedback: "จุดเดือดเปลี่ยนจริง แต่ไม่เกี่ยวกับการจมหรือลอยของไข่" }
    hints:
      - "วัตถุลอยเมื่อหนาแน่นน้อยกว่าของเหลว"
      - "เติมเกลือแล้วอะไรในน้ำเกลือเปลี่ยน"
    solution: "น้ำเกลือเป็นสารผสม ยิ่งเติมเกลือ มวลต่อปริมาตรยิ่งมาก ไข่สดหนาแน่นกว่าน้ำเปล่าเล็กน้อย เมื่อน้ำเกลือหนาแน่นกว่าไข่ ไข่จึงลอย แม่ค้าจึงรู้ว่าน้ำเกลือเข้มข้นพอ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: chemistry.matter.pure-substances.p013
    topics: [chemistry.matter.pure-substances]
    difficulty: 4
    type: numeric
    stem: "กระบอกตวงเปล่าหนัก 85.0 g เมื่อเทน้ำเกลือลงไป 50.0 mL ชั่งรวมได้ 142.5 g น้ำเกลือมีความหนาแน่นกี่ g/mL"
    answer: { value: 1.15, tolerance: 0.01, unit: g/mL }
    misconceptions:
      - { match: 2.85, feedback: "ใช้มวลรวมที่มีกระบอกตวงด้วย ต้องหักมวลกระบอกตวงเปล่าออกก่อน" }
      - { match: 0.87, feedback: "หารปริมาตรด้วยมวล ต้องเป็นมวล ÷ ปริมาตร" }
    hints:
      - "มวลน้ำเกลือ = มวลรวม − มวลกระบอกตวงเปล่า"
      - "$\\rho = m / V$"
