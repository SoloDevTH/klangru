id: health.sport.rules-fair-play
subject: health
title: { th: กฎ กติกา มารยาท และน้ำใจนักกีฬา, en: "Rules, etiquette and sportsmanship" }
summary: ความต่างของกฎ กติกา และข้อตกลง กติกาพื้นฐานของกีฬายอดนิยม สิทธิของตนและผู้อื่น การยอมรับความแตกต่าง มารยาทในการเล่นและการดู น้ำใจนักกีฬา และคุณค่าของกีฬา
difficulty: 2
minutes: 30
prerequisites: []
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    title: กติกาพื้นฐานของกีฬายอดนิยม
    src: sport-rules.svg
    alt: "ตารางเปรียบเทียบกีฬาหกชนิด ฟุตบอล ผู้เล่นฝ่ายละ 11 คน 2 ครึ่ง ครึ่งละ 45 นาที ฟุตซอล 5 คน 2 ครึ่ง ครึ่งละ 20 นาที วอลเลย์บอล 6 คน ชนะ 3 ใน 5 เซต เซตละ 25 คะแนน ต้องนำ 2 คะแนน เซต 5 เล่น 15 บาสเกตบอล 5 คน ต้องยิงภายใน 24 วินาทีตามกติกา FIBA ลูกยิง 2 หรือ 3 คะแนน ลูกโทษ 1 เซปักตะกร้อ 3 คน ชนะ 2 ใน 3 เซต เซตละ 21 คะแนน แบดมินตัน 1 หรือ 2 คน ชนะ 2 ใน 3 เกม เกมละ 21 คะแนน ต้องนำ 2 คะแนน สูงสุด 30"
    caption: "ตัวเลขตามกติการะดับสากล การแข่งขันในโรงเรียนอาจตกลงปรับให้สั้นลง"
  - type: worked-example
    title: อ่านคะแนนวอลเลย์บอล
    problem: "จากกระดานคะแนน ทีมบ้านหนองบัวต้องทำอย่างไรจึงจะยังมีโอกาสชนะการแข่งขัน"
    figure:
      src: volleyball-score.svg
      alt: "กระดานคะแนนวอลเลย์บอลนักเรียนหญิง รอบชิงชนะเลิศ ทีมบ้านดอนแดง: เซต 1 ได้ 25 เซต 2 ได้ 23 เซต 3 ได้ 25 เซต 4 ได้ 24 ทีมบ้านหนองบัว: เซต 1 ได้ 21 เซต 2 ได้ 25 เซต 3 ได้ 18 เซต 4 ได้ 24 เซต 4 กำลังแข่งอยู่"
    steps:
      - text: "นับเซตที่จบแล้ว: เซต 1 ดอนแดงชนะ 25–21 เซต 2 หนองบัวชนะ 25–23 เซต 3 ดอนแดงชนะ 25–18"
      - text: "ตอนนี้ดอนแดงนำ 2 ต่อ 1 เซต ในการแข่งแบบชนะ 3 ใน 5 เซต"
      - text: "ถ้าดอนแดงชนะเซต 4 จะครบ 3 เซตและจบการแข่งขัน หนองบัวจึงต้องชนะเซต 4"
      - text: "เซต 4 เสมอ 24–24 หนองบัวต้องนำ 2 คะแนน เช่น 26–24 แล้วไปชนะต่อในเซต 5 ซึ่งเล่นถึง 15 คะแนน"
        why: "เซตที่ 5 สั้นกว่าเซตอื่น ตามกติกาเล่นถึง 15 คะแนนและต้องนำ 2 คะแนน"
    answer: "หนองบัวต้องชนะเซต 4 (นำ 2 คะแนน) แล้วชนะเซต 5 ด้วย"
  - { type: check, problem: health.sport.rules-fair-play.p009, prompt: "ลองใช้กติกาการนำ 2 คะแนน" }
  - type: worked-example
    title: แยกพฤติกรรมตามมารยาทและน้ำใจนักกีฬา
    problem: "ระหว่างแข่งแบดมินตันคู่ เพื่อนของเราตีลูกออก แต่กรรมการขานว่าลูกลง ฝ่ายเราจึงได้คะแนน เราเห็นชัดว่าลูกออก ควรทำอย่างไร และเพราะอะไร"
    steps:
      - text: "ข้อเท็จจริง: ลูกออกจริง คะแนนที่ได้ไม่ยุติธรรมต่อคู่แข่ง"
      - text: "หลักน้ำใจนักกีฬา: เล่นอย่างซื่อสัตย์ เคารพสิทธิของคู่แข่งที่จะได้รับการตัดสินที่ถูกต้อง"
      - text: "วิธีทำ: บอกกรรมการอย่างสุภาพว่าเราเห็นว่าลูกออก แล้วยอมรับการตัดสินใหม่ของกรรมการ"
        why: "การตัดสินเป็นหน้าที่ของกรรมการ ผู้เล่นให้ข้อมูลได้อย่างสุภาพ แต่ไม่โต้เถียง"
      - text: "ผลที่ได้: คู่แข่งและผู้ดูเชื่อถือเรา การแข่งขันยุติธรรมและน่าชื่นชม"
    answer: "บอกกรรมการอย่างสุภาพว่าลูกออก แล้วยอมรับคำตัดสิน เพราะเป็นการเล่นอย่างซื่อสัตย์และเคารพสิทธิคู่แข่ง"
  - { type: check, problem: health.sport.rules-fair-play.p002 }
glossary:
  - { term: กติกา, definition: "ข้อกำหนดของการเล่นหรือการแข่งขันกีฬาชนิดหนึ่ง กติการะดับสากลกำหนดโดยสหพันธ์กีฬา" }
  - { term: ข้อตกลง, definition: "สิ่งที่ผู้เล่นตกลงกันเองก่อนเล่น เช่น เขตที่เล่น เวลาที่เล่น" }
  - { term: น้ำใจนักกีฬา, definition: "คุณธรรมของการเล่นและอยู่ร่วมกัน แสดงออกด้วยการมีวินัย เคารพกฎกติกา รู้แพ้ รู้ชนะ รู้อภัย" }
  - { term: การนับคะแนนทุกลูก, definition: "ระบบที่ฝ่ายชนะในแต่ละลูกได้ 1 คะแนนเสมอ ไม่ว่าใครเป็นฝ่ายเสิร์ฟ ใช้ในวอลเลย์บอล แบดมินตัน และเซปักตะกร้อ" }
  - { term: เรกู, definition: "ทีมเซปักตะกร้อที่มีผู้เล่น 3 คน" }
flashcards:
  - { front: "กติกา กฎ และข้อตกลง ต่างกันอย่างไร", back: "กติกา: ข้อกำหนดของกีฬาชนิดนั้น กฎ: ระเบียบที่ทุกคนต้องทำตาม ข้อตกลง: สิ่งที่ผู้เล่นตกลงกันเองก่อนเล่น" }
  - { front: "น้ำใจนักกีฬาแสดงออกอย่างไร", back: "มีวินัย เคารพกฎกติกา รู้แพ้ รู้ชนะ รู้อภัย" }
  - { front: "วอลเลย์บอลจบเซตเมื่อใด", back: "เมื่อได้ 25 คะแนนและนำอย่างน้อย 2 คะแนน (เซตที่ 5 เล่นถึง 15)" }
  - { front: "มารยาทของผู้ดูกีฬามีอะไรบ้าง", back: "ปรบมือให้ทั้งสองฝ่าย เชียร์สุภาพ ไม่โห่ ไม่ล้อเลียน ไม่ขว้างปาสิ่งของ เคารพกรรมการ รักษาความสะอาด" }
