id: english.writing.describing-self
subject: english
title: { th: "การพูดและเขียนให้ข้อมูลเกี่ยวกับตนเองและเรื่องใกล้ตัว", en: "Giving information about yourself and your surroundings" }
summary: กรอกแบบฟอร์มข้อมูลส่วนตัว ขอและให้ข้อมูล เขียนย่อหน้าเรื่องตนเอง ครอบครัว เพื่อน กิจวัตร และละแวกบ้าน และเขียนโน้ตสั้น
difficulty: 3
minutes: 35
prerequisites: [english.grammar.present-simple, english.grammar.connectors]
encompasses:
  - { id: english.grammar.present-simple, weight: 0.3 }
  - { id: english.grammar.connectors, weight: 0.3 }
curriculum_tags: []
lessons:
  - type: figure
    src: registration-form.svg
    alt: "แบบฟอร์มสมัคร Summer English Camp ที่กรอกแล้ว หัวกระดาษบอก Date format: DD/MM/YYYY ข้อมูล Title: Miss, First name: Malee, Surname: Srisuk, Date of birth: 14/03/2012, Age: 14, Nationality: Thai, Address: 25 Moo 3, Rim Tai, Mae Rim, Chiang Mai 50180, Languages: Thai, English, Hobbies: reading, badminton, Signature: Malee S."
    caption: "แบบฟอร์มของมาลี (ข้อมูลสมมุติ)"
  - { type: explanation, file: lesson.md }
  - { type: check, problem: english.writing.describing-self.p005, prompt: "แบบฟอร์มแบบ DD/MM/YYYY เขียนวันที่อย่างไร" }
  - type: figure
    src: penpal-profile.svg
    alt: "ข้อมูลเพื่อนทางจดหมาย Name: Liam Walker, Age: 13, From: Auckland, New Zealand, Lives with: mum, dad, younger sister, Likes: rugby, drawing, Doesn't like: spiders, cold weather, Gets up: 7:00 a.m., School: 8:45 a.m. – 3:00 p.m., After school: rugby practice (Tue, Thu)"
    caption: "ข้อมูลของ Liam ใช้ในตัวอย่างและโจทย์"
  - type: worked-example
    title: เขียนแนะนำเพื่อนจากข้อมูลในตาราง
    problem: "ใช้ข้อมูลของ Liam เขียนย่อหน้าสั้น ๆ แนะนำเขาให้เพื่อนในห้องรู้จัก"
    steps:
      - text: "ประโยคใจความ: *Liam Walker is my pen pal from Auckland, New Zealand.*"
      - text: "อายุและครอบครัว ใช้ he และเติม s: *He is thirteen years old. He lives with his mum, dad and younger sister.*"
        why: "ประธานเอกพจน์บุรุษที่ 3 กริยาต้องเติม s: lives"
      - text: "สิ่งที่ชอบและไม่ชอบ เชื่อมด้วย but: *He likes rugby and drawing, but he doesn't like spiders.*"
      - text: "กิจวัตร: *He gets up at seven o'clock. On Tuesdays and Thursdays, he has rugby practice after school.*"
      - text: "ประโยคปิด: *I want to visit him in New Zealand one day.*"
    answer: "ย่อหน้าห้าส่วน: ใจความ ครอบครัว ความชอบ กิจวัตร ประโยคปิด"
  - { type: check, problem: english.writing.describing-self.p010, prompt: "Liam ตื่นนอนกี่โมง เขียนอย่างไร" }
glossary:
  - { term: surname, definition: "นามสกุล (last name, family name)" }
  - { term: nationality, definition: "สัญชาติ เช่น Thai, British, American" }
  - { term: topic sentence, definition: "ประโยคใจความ บอกว่าย่อหน้าพูดถึงอะไร" }
  - { term: pen pal, definition: "เพื่อนทางจดหมายหรืออีเมล (ภาษาอังกฤษแบบบริติชเรียก pen friend ได้)" }
  - { term: note, definition: "ข้อความสั้นบอกเรื่องเฉพาะหน้า เช่น บอกว่าไปไหน กลับกี่โมง" }
flashcards:
  - { front: "First name / Surname", back: "ชื่อ / นามสกุล" }
  - { front: "05/12/2013 ในอังกฤษ vs สหรัฐฯ", back: "5 ธันวาคม (DD/MM) vs 12 พฤษภาคม (MM/DD)" }
  - { front: "Nationality ของคนไทย", back: "Thai (ไม่ใช่ Thailand)" }
  - { front: "พ.ศ. เป็น ค.ศ.", back: "ลบ 543" }
  - { front: "ย่อหน้ามีสามส่วน", back: "topic sentence → details → closing sentence" }
