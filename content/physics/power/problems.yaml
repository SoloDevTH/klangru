  - id: phy.pow.p018
    topics: [physics.energy.power]
    difficulty: 4
    type: numeric
    stem: 'ใช้ระบบรอกในภาพยกกล่องหนัก $400\ \mathrm{N}$ ขึ้นสูง $1.5\ \mathrm{m}$ ต้องดึงเชือกด้วยแรง $250\ \mathrm{N}$ เป็นระยะ $3\ \mathrm{m}$ ระบบรอกนี้มีประสิทธิภาพกี่เปอร์เซ็นต์ (ตอบเป็นตัวเลขในหน่วย %)'
