    stem: "อะตอม Na มีรัศมี 186 pm เมื่อเป็น $\\mathrm{Na^+}$ มีรัศมี 102 pm รัศมีลดลงร้อยละเท่าใด (ทศนิยม 1 ตำแหน่ง)"
    answer: { value: 45.2, tolerance: 0.2, unit: "%" }
    misconceptions:
