problems:
  - id: physics.nuclear.nuclear-energy-particles.p001
    topics: [physics.nuclear.nuclear-energy-particles]
    difficulty: 1
    type: mcq
    stem: "แรงใดยึดโปรตอนและนิวตรอนไว้ในนิวเคลียส ทั้งที่โปรตอนผลักกันทางไฟฟ้า"
    choices:
      - { id: a, text: "แรงเข้ม (แรงนิวเคลียร์)", correct: true }
      - { id: b, text: "แรงโน้มถ่วง", feedback: "แรงโน้มถ่วงระหว่างนิวคลีออนอ่อนกว่าแรงผลักทางไฟฟ้ามากมาย ยึดนิวเคลียสไม่ได้" }
      - { id: c, text: "แรงแม่เหล็กไฟฟ้า", feedback: "แรงไฟฟ้าระหว่างโปรตอนเป็นแรงผลัก จึงเป็นแรงที่พยายามแยกนิวเคลียส" }
      - { id: d, text: "แรงอ่อน", feedback: "แรงอ่อนเกี่ยวกับการเปลี่ยนชนิดของอนุภาค เช่น การสลายให้บีตา ไม่ได้ยึดนิวเคลียส" }
    hints:
      - "แรงนี้ต้องเป็นแรงดึงดูดที่มากกว่าแรงผลักทางไฟฟ้า"
      - "แรงนี้มีระยะทำการสั้นมากประมาณขนาดของนิวคลีออน"
    solution: "แรงเข้มเป็นแรงดึงดูดระหว่างนิวคลีออนที่มากกว่าแรงไฟฟ้าเมื่ออยู่ใกล้กัน แต่มีระยะทำการสั้นประมาณ $10^{-15}\\ \\mathrm{m}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.nuclear-energy-particles.p002
    topics: [physics.nuclear.nuclear-energy-particles]
    difficulty: 1
    type: match
    stem: "จับคู่อนุภาคกับคำอธิบายตามแบบจำลองมาตรฐาน"
    pairs:
      - { left: "ควาร์ก", right: "อนุภาคที่ประกอบกันเป็นโปรตอนและนิวตรอน" }
      - { left: "อิเล็กตรอน", right: "เลปตอนที่มีประจุ −1 อยู่รอบนิวเคลียส" }
      - { left: "โฟตอน", right: "อนุภาคพาแรงแม่เหล็กไฟฟ้า" }
      - { left: "กลูออน", right: "อนุภาคพาแรงเข้มระหว่างควาร์ก" }
      - { left: "นิวทริโน", right: "เลปตอนที่ไม่มีประจุ มวลน้อยมาก" }
    hints:
      - "อนุภาคมูลฐานแบ่งเป็นควาร์ก เลปตอน และอนุภาคพาแรง"
      - "แสงเป็นกลุ่มของโฟตอน"
    solution: "ควาร์กประกอบเป็นนิวคลีออน อิเล็กตรอนและนิวทริโนเป็นเลปตอน (อิเล็กตรอนมีประจุ −1 นิวทริโนไม่มีประจุ) โฟตอนพาแรงแม่เหล็กไฟฟ้า และกลูออนพาแรงเข้ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.nuclear-energy-particles.p003
    topics: [physics.nuclear.nuclear-energy-particles]
    difficulty: 2
    type: mcq
    stem: "ควาร์กอัป (u) มีประจุ $+\\tfrac23 e$ และควาร์กดาวน์ (d) มีประจุ $-\\tfrac13 e$ นิวตรอนประกอบด้วยควาร์กชุดใด"
    choices:
      - { id: a, text: "udd", correct: true }
      - { id: b, text: "uud", feedback: "uud มีประจุรวม $+1$ คือโปรตอน" }
      - { id: c, text: "uuu", feedback: "ประจุรวมเป็น $+2$ ไม่ใช่ศูนย์" }
      - { id: d, text: "ddd", feedback: "ประจุรวมเป็น $-1$ ไม่ใช่ศูนย์" }
    hints:
      - "นิวตรอนมีประจุรวมเป็นศูนย์"
      - "ลองรวมประจุของแต่ละชุด"
    solution: "udd: $+\\tfrac23 - \\tfrac13 - \\tfrac13 = 0$ ตรงกับนิวตรอน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.nuclear-energy-particles.p004
    topics: [physics.nuclear.nuclear-energy-particles]
    difficulty: 2
    type: numeric
    stem: "นิวเคลียสออกซิเจน-16 มีมวลพร่อง $0.1370\\ \\mathrm{u}$ พลังงานยึดเหนี่ยวเป็นกี่เมกะอิเล็กตรอนโวลต์ ($1\\ \\mathrm{u} \\to 931.5\\ \\mathrm{MeV}$)"
    answer: { value: 127.6, tolerance: 1, unit: MeV }
    misconceptions:
      - { match: 7.98, feedback: "นี่คือพลังงานยึดเหนี่ยวต่อนิวคลีออน โจทย์ถามพลังงานยึดเหนี่ยวทั้งนิวเคลียส ไม่ต้องหารด้วย 16" }
    hints:
      - "$E = \\Delta m \\times 931.5\\ \\mathrm{MeV/u}$"
      - "คูณมวลพร่องเป็นหน่วย u ด้วย 931.5"
    solution: "$E = 0.1370 \\times 931.5 \\approx 127.6\\ \\mathrm{MeV}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.nuclear-energy-particles.p005
    topics: [physics.nuclear.nuclear-energy-particles]
    difficulty: 2
    type: mcq
    stem: "ปฏิกิริยา $^{2}_{1}\\mathrm{H} +\\ ^{2}_{1}\\mathrm{H} \\to\\ ^{3}_{2}\\mathrm{He} +\\ ^{1}_{0}\\mathrm{n}$ เป็นปฏิกิริยาแบบใด"
    choices:
      - { id: a, text: "ฟิวชัน", correct: true }
      - { id: b, text: "ฟิชชัน", feedback: "ฟิชชันคือนิวเคลียสหนักแตกตัว ปฏิกิริยานี้นิวเคลียสเบาสองนิวเคลียสรวมกัน" }
      - { id: c, text: "การสลายให้แอลฟา", feedback: "การสลายให้แอลฟาเริ่มจากนิวเคลียสเดียวแล้วปล่อยนิวเคลียสฮีเลียม-4 ออกมา" }
      - { id: d, text: "ปฏิกิริยาเคมี", feedback: "นิวเคลียสเปลี่ยนชนิด จึงเป็นปฏิกิริยานิวเคลียร์ ไม่ใช่ปฏิกิริยาเคมี" }
    hints:
      - "ดูว่านิวเคลียสก่อนปฏิกิริยาเบาหรือหนัก"
      - "นิวเคลียสรวมกันหรือแตกออก"
    solution: "ดิวเทอรอนสองนิวเคลียสรวมกันเป็นฮีเลียม-3 ซึ่งหนักขึ้น จึงเป็นฟิวชัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.nuclear-energy-particles.p006
    topics: [physics.nuclear.nuclear-energy-particles]
    difficulty: 3
    type: numeric
    stem: "จงหาพลังงานยึดเหนี่ยวต่อนิวคลีออนของคาร์บอน-12 เป็นเมกะอิเล็กตรอนโวลต์ กำหนดมวลอะตอม $^{1}\\mathrm{H} = 1.007825\\ \\mathrm{u}$ นิวตรอน $= 1.008665\\ \\mathrm{u}$ $^{12}\\mathrm{C} = 12.000000\\ \\mathrm{u}$ ($1\\ \\mathrm{u} \\to 931.5\\ \\mathrm{MeV}$)"
    answer: { value: 7.68, tolerance: 0.05, unit: MeV }
    misconceptions:
      - { match: 92.2, feedback: "นี่คือพลังงานยึดเหนี่ยวทั้งนิวเคลียส ต้องหารด้วยจำนวนนิวคลีออน 12" }
      - { match: 15.4, feedback: "หารด้วย 6 (จำนวนโปรตอน) ต้องหารด้วยจำนวนนิวคลีออนทั้งหมด 12" }
    hints:
      - "คาร์บอน-12 มีโปรตอน 6 นิวตรอน 6"
      - "$\\Delta m = 6(1.007825) + 6(1.008665) - 12.000000$ แล้วคูณ 931.5 และหารด้วย 12"
    solution: "$\\Delta m = 12.098940 - 12.000000 = 0.098940\\ \\mathrm{u}$ พลังงานยึดเหนี่ยว $= 0.098940 \\times 931.5 = 92.2\\ \\mathrm{MeV}$ ต่อนิวคลีออน $= 92.2/12 = 7.68\\ \\mathrm{MeV}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.nuclear-energy-particles.p007
    topics: [physics.nuclear.nuclear-energy-particles]
    difficulty: 2
    type: numeric
    stem: "ในฟิชชัน $^{235}_{92}\\mathrm{U} +\\ ^{1}_{0}\\mathrm{n} \\to\\ ^{141}_{56}\\mathrm{Ba} +\\ ^{92}_{36}\\mathrm{Kr} + x\\,^{1}_{0}\\mathrm{n}$ จำนวนนิวตรอน $x$ ที่เกิดขึ้นเป็นเท่าใด"
    answer: { value: 3, tolerance: 0 }
    misconceptions:
      - { match: 2, feedback: "ลืมนับนิวตรอนที่เข้าไปชน เลขมวลด้านซ้ายคือ $235 + 1 = 236$" }
    hints:
      - "เลขมวลก่อนและหลังต้องเท่ากัน"
      - "$236 = 141 + 92 + x$"
    solution: "เลขมวลด้านซ้าย $= 236$ ด้านขวา $= 141 + 92 + x = 233 + x$ จึงได้ $x = 3$ (เลขอะตอม $92 = 56 + 36$ ดุลแล้ว)"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.nuclear-energy-particles.p008
    topics: [physics.nuclear.nuclear-energy-particles]
    difficulty: 3
    type: numeric
    stem: "ถ้ามวล $1.0\\ \\mathrm{g}$ เปลี่ยนเป็นพลังงานทั้งหมด จะได้พลังงานกี่เท่าของ $10^{13}\\ \\mathrm{J}$ ($c = 3.0 \\times 10^{8}\\ \\mathrm{m/s}$)"
    answer: { value: 9.0, tolerance: 0.05 }
    misconceptions:
      - { match: 9000, feedback: "ใช้มวลเป็นกรัม ต้องแปลงเป็น $1.0 \\times 10^{-3}\\ \\mathrm{kg}$" }
      - { match: 0.00000003, feedback: "ใช้ $c$ แทน $c^2$" }
    hints:
      - "$E = mc^2$ ใช้มวลเป็นกิโลกรัม"
      - "$E = (1.0 \\times 10^{-3})(3.0 \\times 10^{8})^2$"
    solution: "$E = (1.0 \\times 10^{-3})(9.0 \\times 10^{16}) = 9.0 \\times 10^{13}\\ \\mathrm{J}$ เท่ากับพลังงานจากการเผาน้ำมันหลายพันตัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.nuclear-energy-particles.p009
    topics: [physics.nuclear.nuclear-energy-particles]
    difficulty: 3
    type: mcq
    stem: "ทำไมฟิวชันจึงเกิดได้เฉพาะที่อุณหภูมิสูงมาก เช่น ใจกลางดวงอาทิตย์"
    choices:
      - { id: a, text: "นิวเคลียสมีประจุบวก ต้องเคลื่อนที่เร็วมากจึงเอาชนะแรงผลักและเข้าใกล้จนแรงเข้มทำงานได้", correct: true }
      - { id: b, text: "ความร้อนทำให้นิวเคลียสแตกออกเป็นชิ้นเล็กก่อน", feedback: "นั่นใกล้กับฟิชชันมากกว่า ฟิวชันต้องการให้นิวเคลียสรวมกัน" }
      - { id: c, text: "อุณหภูมิสูงทำให้มวลของนิวเคลียสเพิ่มขึ้น", feedback: "อุณหภูมิไม่ได้ทำให้มวลนิวเคลียสเพิ่มอย่างมีนัยสำคัญ ปัญหาคือแรงผลักทางไฟฟ้า" }
      - { id: d, text: "ต้องใช้ความร้อนเผาไฮโดรเจนเหมือนการเผาไหม้", feedback: "ฟิวชันไม่ใช่การเผาไหม้ทางเคมี ไม่ต้องใช้ออกซิเจน" }
    hints:
      - "นิวเคลียสทั้งสองมีประจุชนิดใด"
      - "แรงเข้มมีระยะทำการสั้นมาก"
    solution: "นิวเคลียสมีประจุบวกจึงผลักกัน ต้องมีพลังงานจลน์สูงมาก (อุณหภูมิหลายล้านเคลวิน) จึงเข้าใกล้กันในระยะประมาณ $10^{-15}\\ \\mathrm{m}$ ที่แรงเข้มดึงให้รวมกันได้"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.nuclear-energy-particles.p010
    topics: [physics.nuclear.nuclear-energy-particles]
    difficulty: 4
    type: numeric
    stem: "จงหาพลังงานที่ปล่อยออกมาทันทีจากฟิชชัน $^{235}_{92}\\mathrm{U} +\\ ^{1}_{0}\\mathrm{n} \\to\\ ^{141}_{56}\\mathrm{Ba} +\\ ^{92}_{36}\\mathrm{Kr} + 3\\,^{1}_{0}\\mathrm{n}$ เป็นเมกะอิเล็กตรอนโวลต์ กำหนดมวล U-235 $= 235.043928\\ \\mathrm{u}$, Ba-141 $= 140.914404\\ \\mathrm{u}$, Kr-92 $= 91.926173\\ \\mathrm{u}$, นิวตรอน $= 1.008665\\ \\mathrm{u}$ ($1\\ \\mathrm{u} \\to 931.5\\ \\mathrm{MeV}$)"
    answer: { value: 173, tolerance: 2, unit: MeV }
    misconceptions:
      - { match: 2052, feedback: "นับนิวตรอนด้านขวาแค่ตัวเดียว (หรือไม่นับนิวตรอนเลยทั้งสองด้าน) ต้องหักมวลนิวตรอน 3 ตัวที่เกิดขึ้น" }
    hints:
      - "มวลก่อน $= 235.043928 + 1.008665$"
      - "มวลหลัง $= 140.914404 + 91.926173 + 3(1.008665)$ หาผลต่างแล้วคูณ 931.5"
    solution: "มวลก่อน $= 236.052593\\ \\mathrm{u}$ มวลหลัง $= 235.866572\\ \\mathrm{u}$ ผลต่าง $= 0.186021\\ \\mathrm{u}$ จึงได้ $Q = 0.186021 \\times 931.5 \\approx 173\\ \\mathrm{MeV}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.nuclear-energy-particles.p011
    topics: [physics.nuclear.nuclear-energy-particles]
    difficulty: 4
    type: match
    stem: "จับคู่ส่วนประกอบของเตาปฏิกรณ์นิวเคลียร์กับหน้าที่"
    pairs:
      - { left: "แท่งเชื้อเพลิง", right: "มียูเรเนียมที่เกิดฟิชชัน" }
      - { left: "ตัวหน่วงความเร็วนิวตรอน", right: "ทำให้นิวตรอนช้าลงจนเกิดฟิชชันได้ดี" }
      - { left: "แท่งควบคุม", right: "ดูดกลืนนิวตรอนเพื่อคุมอัตราการเกิดฟิชชัน" }
      - { left: "สารหล่อเย็น", right: "นำความร้อนออกจากแกนเตาไปผลิตไอน้ำ" }
      - { left: "เครื่องกำบังรังสี", right: "ลดรังสีที่ออกมานอกเตา" }
    hints:
      - "นิวตรอนช้าทำให้ยูเรเนียม-235 เกิดฟิชชันได้ดีกว่านิวตรอนเร็ว"
      - "ถ้าต้องการให้ปฏิกิริยาช้าลง ต้องลดจำนวนนิวตรอน"
    solution: "แท่งเชื้อเพลิงเป็นแหล่งฟิชชัน ตัวหน่วง (เช่น น้ำ) ทำให้นิวตรอนช้าลง แท่งควบคุม (เช่น โบรอน แคดเมียม) ดูดกลืนนิวตรอน สารหล่อเย็นพาความร้อนออกไป และเครื่องกำบังลดรังสี"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.nuclear-energy-particles.p012
    topics: [physics.nuclear.nuclear-energy-particles]
    difficulty: 3
    type: mcq
    stem: "เครื่องปฏิกรณ์ปรมาณูวิจัย ปปว-1/1 ที่บางเขน กรุงเทพฯ ใช้ประโยชน์หลักในด้านใด"
    choices:
      - { id: a, text: "ผลิตสารกัมมันตรังสีสำหรับการแพทย์และใช้ในงานวิจัย", correct: true }
      - { id: b, text: "ผลิตไฟฟ้าเข้าระบบให้กรุงเทพฯ", feedback: "ปปว-1/1 เป็นเครื่องปฏิกรณ์วิจัยกำลังต่ำ ไม่ได้ผลิตไฟฟ้า ประเทศไทยยังไม่มีโรงไฟฟ้านิวเคลียร์" }
      - { id: c, text: "ทดลองปฏิกิริยาฟิวชัน", feedback: "เครื่องนี้ใช้ฟิชชันของยูเรเนียม ไม่ใช่ฟิวชัน" }
      - { id: d, text: "ผลิตอาวุธนิวเคลียร์", feedback: "ไทยใช้นิวเคลียร์เพื่อสันติ และเชื้อเพลิงของเครื่องวิจัยนี้เป็นยูเรเนียมเสริมสมรรถนะต่ำ" }
    hints:
      - "เครื่องนี้ดูแลโดยสถาบันเทคโนโลยีนิวเคลียร์แห่งชาติ"
      - "นิวตรอนจำนวนมากในเตาใช้ทำให้ธาตุบางชนิดกลายเป็นไอโซโทปกัมมันตรังสี"
    solution: "ปปว-1/1 ใช้นิวตรอนผลิตไอโซโทปกัมมันตรังสี เช่น สำหรับการแพทย์ และใช้วิเคราะห์ธาตุและงานวิจัย ไม่ได้ผลิตไฟฟ้า"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: physics.nuclear.nuclear-energy-particles.p013
    topics: [physics.nuclear.nuclear-energy-particles]
    difficulty: 4
    type: mcq
    stem: "จากกราฟพลังงานยึดเหนี่ยวต่อนิวคลีออน เหตุใดทั้งฟิชชันของนิวเคลียสหนักและฟิวชันของนิวเคลียสเบาจึงปล่อยพลังงาน"
    choices:
      - { id: a, text: "ผลผลิตของทั้งสองแบบมีพลังงานยึดเหนี่ยวต่อนิวคลีออนสูงกว่าตั้งต้น มวลรวมจึงลดลง", correct: true }
