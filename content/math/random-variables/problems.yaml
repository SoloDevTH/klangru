  - id: math.stats.random-variables.p017
    topics: [math.stats.random-variables]
    difficulty: 5
    type: numeric
    stem: "ผ้าทอม้วนหนึ่งมีจุดบกพร่องเฉลี่ย 3 จุด จำนวนจุดบกพร่องมีการแจกแจงปัวซง ความน่าจะเป็นที่ผ้าม้วนหนึ่งมีจุดบกพร่องไม่เกิน 1 จุดเท่ากับเท่าใด (ทศนิยมสี่ตำแหน่ง)"
    answer: { value: 0.1991, tolerance: 0.001 }
    hints:
      - "ไม่เกิน 1 จุด $= P(X = 0) + P(X = 1)$"
      - "$\\lambda = 3$: $P(X = 0) = e^{-3}$ และ $P(X = 1) = 3e^{-3}$"
    misconceptions:
      - { match: 0.0498, feedback: "นี่คือ $P(X = 0)$ อย่างเดียว ไม่เกิน 1 ต้องรวม $P(X = 1)$ ด้วย" }
      - { match: 0.1494, feedback: "นี่คือ $P(X = 1)$ อย่างเดียว ต้องรวม $P(X = 0)$ ด้วย" }
    solution: "$e^{-3}(1 + 3) = 4e^{-3} \\approx 4 \\times 0.049787 = 0.1991$"
    license: CC-BY-SA-4.0
    ai_assisted: true

