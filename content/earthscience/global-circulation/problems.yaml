    solution: "ใกล้เส้นศูนย์สูตร $\\sin\\varphi \\approx 0$ แรงคอริออลิสแทบเป็นศูนย์ ลมที่ไหลเข้าหาความกดอากาศต่ำจึงพุ่งตรงเข้าไปเติมเต็มโดยไม่หมุนวน พายุหมุนจึงก่อตัวไม่ได้"
