id: management.quality.qc-tools
subject: management
title: { th: เครื่องมือคุณภาพ 7 อย่าง, en: The seven basic quality tools }
summary: ใช้ใบตรวจสอบ แผนภูมิพาเรโต แผนผังก้างปลา ฮิสโทแกรม แผนภาพการกระจาย การแบ่งชั้นข้อมูล และแผนภูมิควบคุม หาปัญหาสำคัญและเฝ้าดูกระบวนการ
difficulty: 5.5
minutes: 40
prerequisites: [math.stats.dispersion, math.stats.data-display, management.quality.concepts]
encompasses:
  - { id: math.stats.data-display, weight: 0.4 }
  - { id: math.stats.dispersion, weight: 0.3 }
  - { id: math.stats.central-tendency, weight: 0.2 }
  - { id: management.quality.concepts, weight: 0.2 }
curriculum_tags: []
lessons:
  - { type: explanation, file: lesson.md }
  - type: figure
    src: pareto.svg
    alt: "แผนภูมิพาเรโตข้อร้องเรียนร้านอาหาร 160 ครั้ง แท่งเรียงจากมากไปน้อย รออาหารนาน 68 อาหารไม่ตรงที่สั่ง 41 อาหารเย็น 22 ห้องน้ำ 12 คิดเงินผิด 9 อื่น ๆ 8 เส้นร้อยละสะสมบนแกนขวาผ่าน 42.5% 68.1% 81.9% แล้วไปถึง 100% มีเส้นประที่ 80% ซึ่งเส้นสะสมข้ามหลังแท่งที่สาม"
    caption: "สามประเภทแรกรวมกันเกิน 80% ของข้อร้องเรียนทั้งหมด"
  - type: worked-example
    title: สร้างตารางพาเรโตของข้อร้องเรียนร้านอาหาร
    problem: "ร้านอาหารขีดนับข้อร้องเรียน 1 เดือนได้ดังนี้ อาหารเย็น 22 รออาหารนาน 68 คิดเงินผิด 9 อื่น ๆ 8 ห้องน้ำไม่สะอาด 12 อาหารไม่ตรงที่สั่ง 41 ต้องแก้กี่ประเภทแรกจึงครอบคลุมข้อร้องเรียนอย่างน้อย 80%"
    steps:
      - text: "รวมทั้งหมด: $22 + 68 + 9 + 8 + 12 + 41 = 160$ ครั้ง"
      - text: "เรียงจากมากไปน้อย ให้ 'อื่น ๆ' อยู่ท้าย: รอนาน 68 · ไม่ตรงที่สั่ง 41 · อาหารเย็น 22 · ห้องน้ำ 12 · คิดเงินผิด 9 · อื่น ๆ 8"
        why: "'อื่น ๆ' รวมหลายเรื่องเล็กไว้ด้วยกัน ไม่ใช่ปัญหาเดียว จึงวางท้ายเสมอแม้ความถี่จะมากก็ตาม"
      - text: "ความถี่สะสม: 68, 109, 131, 143, 152, 160"
      - text: "ร้อยละสะสม: $\\tfrac{68}{160} = 42.5\\%$, $\\tfrac{109}{160} \\approx 68.1\\%$, $\\tfrac{131}{160} \\approx 81.9\\%$, 89.4%, 95.0%, 100%"
      - text: "ร้อยละสะสมเกิน 80% ครั้งแรกที่ประเภทที่ 3 (81.9%)"
        why: "สองประเภทแรกได้แค่ 68.1% ยังไม่ถึง 80%"
    answer: "แก้ 3 ประเภทแรก (รอนาน ไม่ตรงที่สั่ง อาหารเย็น) ครอบคลุมราว 81.9% ของข้อร้องเรียน"
  - { type: check, problem: mgt.qc.p006, prompt: "ลองใช้วิธีเดียวกันกับข้อมูลชุดใหม่" }
  - type: figure
    src: fishbone.svg
    alt: "แผนผังก้างปลา หัวปลาทางขวาคือปัญหาผู้ป่วยนอกรอพบแพทย์นานเกิน 2 ชั่วโมง ก้างหกกลุ่ม คน: แพทย์เข้าตรวจสาย พยาบาลคัดกรองน้อย วิธีการ: เรียกคิวไม่เป็นระบบ ซักประวัติซ้ำ เครื่องจักร: ระบบคิวล่ม เครื่องวัดความดันน้อย วัสดุ: แฟ้มประวัติหาย การวัด: ไม่จับเวลารอ ไม่มีตัวชี้วัดรายวัน สภาพแวดล้อม: ผู้ป่วยมาพร้อมกันตอนเช้า"
    caption: "แผนผังก้างปลาของโรงพยาบาลแห่งหนึ่ง สาเหตุแต่ละข้อเป็นเพียงสมมติฐาน ต้องเก็บข้อมูลยืนยันก่อนแก้"
  - type: figure
    src: control-chart.svg
    alt: "แผนภูมิควบคุมปริมาตรน้ำดื่มบรรจุขวด 20 ตัวอย่าง เส้นกลาง 600 มิลลิลิตร เส้นควบคุมบน 606 เส้นควบคุมล่าง 594 ตัวอย่างที่ 9 มีค่า 607 หลุดเหนือเส้นควบคุมบน และตัวอย่างที่ 13 ถึง 20 รวม 8 จุดอยู่เหนือเส้นกลางติดกัน จุดอื่นอยู่ระหว่าง 597 ถึง 603"
    caption: "สองสัญญาณของสาเหตุพิเศษ: จุดหลุดเส้นควบคุม และจุดเรียงอยู่ด้านเดียวติดกันหลายจุด"
  - type: worked-example
    title: แผนภูมิ p ของใบสั่งยาที่ต้องแก้ไข
    problem: "ห้องยาของโรงพยาบาลสุ่มตรวจใบสั่งยาวันละ 200 ใบ เป็นเวลา 25 วัน พบใบที่ต้องแก้ไขรวม 250 ใบ จงหาเส้นควบคุมของแผนภูมิ p และบอกว่าวันที่พบ 21 ใบจาก 200 ใบ ผิดปกติหรือไม่"
    steps:
      - text: "สัดส่วนเฉลี่ย: $\\bar{p} = \\dfrac{250}{25 \\times 200} = \\dfrac{250}{5000} = 0.05$"
        why: "ต้องหารด้วยจำนวนใบที่ตรวจทั้งหมด ไม่ใช่จำนวนวัน"
      - text: "ส่วนเบี่ยงเบนมาตรฐานของสัดส่วน: $\\sqrt{\\dfrac{0.05 \\times 0.95}{200}} \\approx 0.0154$"
      - text: "$\\text{UCL} = 0.05 + 3(0.0154) \\approx 0.0962$ และ $\\text{LCL} = 0.05 - 3(0.0154) \\approx 0.0038$"
        why: "LCL ยังเป็นบวก จึงใช้ค่านี้ได้ ถ้าติดลบจะปัดเป็น 0"
      - text: "วันที่ผิดปกติ: $\\dfrac{21}{200} = 0.105$ ซึ่งมากกว่า UCL 0.0962"
    answer: "CL = 0.05, UCL ≈ 0.096, LCL ≈ 0.004 วันที่พบ 21 ใบ (0.105) หลุดเหนือ UCL เป็นสัญญาณสาเหตุพิเศษ ควรตรวจว่าวันนั้นเกิดอะไรขึ้น เช่น ระบบสั่งยาขัดข้อง"
  - { type: check, problem: mgt.qc.p009 }
glossary:
  - { term: แผนภูมิพาเรโต, definition: "แผนภูมิแท่งเรียงความถี่จากมากไปน้อย พร้อมเส้นร้อยละสะสม ใช้หาปัญหาสำคัญไม่กี่เรื่อง" }
  - { term: แผนผังก้างปลา, definition: "แผนผังสาเหตุและผลที่แตกสาเหตุของปัญหาเป็นกลุ่ม เช่น 6M (คน เครื่องจักร วิธีการ วัสดุ การวัด สภาพแวดล้อม)" }
  - { term: แผนภูมิควบคุม, definition: "กราฟค่าที่วัดตามเวลา มีเส้นกลางและเส้นควบคุมบนล่าง (มักห่างเส้นกลาง 3 ส่วนเบี่ยงเบนมาตรฐาน) ใช้แยกสาเหตุพิเศษจากสาเหตุทั่วไป" }
  - { term: สาเหตุพิเศษ, definition: "สาเหตุของความผันแปรที่ไม่ได้เกิดตามปกติ เช่น เครื่องเสีย วัตถุดิบผิดล็อต ต้องหาและแก้ ต่างจากสาเหตุทั่วไปที่เกิดเล็กน้อยตลอดเวลา" }
flashcards:
  - { front: "เครื่องมือคุณภาพ 7 อย่าง", back: "ใบตรวจสอบ · แผนภูมิพาเรโต · แผนผังก้างปลา · ฮิสโทแกรม · แผนภาพการกระจาย · การแบ่งชั้นข้อมูล · แผนภูมิควบคุม" }
  - { front: "ร้อยละสะสมในแผนภูมิพาเรโต", back: "ความถี่สะสม ÷ ความถี่ทั้งหมด × 100 หลังเรียงจากมากไปน้อยแล้ว" }
  - { front: "เส้นควบคุมของค่าเดี่ยว", back: "$\\text{UCL} = \\mu + 3\\sigma$, $\\text{LCL} = \\mu - 3\\sigma$ ถ้าแต่ละจุดเป็นค่าเฉลี่ยของ $n$ ชิ้น ใช้ $\\sigma/\\sqrt{n}$" }
  - { front: "เส้นควบคุมของแผนภูมิ p", back: "$\\bar{p} \\pm 3\\sqrt{\\bar{p}(1-\\bar{p})/n}$ ถ้า LCL ติดลบให้ใช้ 0" }
  - { front: "เส้นควบคุมต่างจากเกณฑ์ (specification) อย่างไร", back: "เส้นควบคุมคำนวณจากข้อมูลของกระบวนการเอง เกณฑ์มาจากลูกค้าหรือกฎหมาย กระบวนการที่อยู่ในการควบคุมอาจยังไม่ผ่านเกณฑ์" }
