problems:
  - id: biology.plants.plant-transport.p001
    topics: [biology.plants.plant-transport]
    difficulty: 1
    type: mcq
    stem: "เมื่อเซลล์คุมรับน้ำจนเต่ง ปากใบจะเป็นอย่างไร"
    choices:
      - { id: a, text: "เปิด", correct: true }
      - { id: b, text: "ปิด", feedback: "เซลล์คุมที่เหี่ยวทำให้ปากใบปิด เมื่อเต่งผนังด้านในที่หนาจะโค้งออก ช่องจึงกว้าง" }
      - { id: c, text: "ไม่เปลี่ยนแปลง", feedback: "ความเต่งของเซลล์คุมเป็นตัวควบคุมการเปิดปิดปากใบ" }
      - { id: d, text: "เซลล์คุมแตกออก", feedback: "ผนังเซลล์ของพืชกันไม่ให้เซลล์แตก" }
    hints:
      - "ผนังด้านที่ติดช่องปากใบหนากว่าด้านนอก"
      - "เมื่อเซลล์เต่ง ผนังบางด้านนอกยืดได้มากกว่า"
    solution: "เมื่อเซลล์คุมเต่ง ผนังด้านนอกที่บางยืดออกมากกว่าผนังด้านในที่หนา เซลล์คุมจึงโค้งออกจากกัน ปากใบเปิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-transport.p002
    topics: [biology.plants.plant-transport]
    difficulty: 1
    type: text
    stem: "การที่น้ำในใบระเหยเป็นไอออกทางปากใบ เรียกว่าอะไร"
    accepted: ["การคายน้ำ", "คายน้ำ", "transpiration"]
    hints:
      - "เป็นการสูญเสียน้ำในรูปไอ"
      - "เป็นแรงหลักที่ดึงน้ำขึ้นในไซเลม"
    misconceptions:
      - { match: "การคายน้ำเป็นหยด", feedback: "การคายน้ำเป็นหยดคือน้ำออกเป็นหยดของเหลวทางรูเปิดที่ขอบใบ ไม่ใช่ไอน้ำทางปากใบ" }
      - { match: "การระเหย", feedback: "ใกล้แล้ว แต่ในพืชมีชื่อเฉพาะของกระบวนการนี้" }
    solution: "การคายน้ำ น้ำระเหยเป็นไอออกทางปากใบ และเป็นแรงหลักที่ดึงน้ำขึ้นในไซเลม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-transport.p003
    topics: [biology.plants.plant-transport]
    difficulty: 1
    type: match
    stem: "จับคู่ธาตุอาหารกับบทบาทในพืช"
    pairs:
      - { left: "แมกนีเซียม", right: "เป็นองค์ประกอบของคลอโรฟิลล์" }
      - { left: "ฟอสฟอรัส", right: "เป็นองค์ประกอบของ ATP และกรดนิวคลีอิก" }
      - { left: "แคลเซียม", right: "เป็นองค์ประกอบของผนังเซลล์" }
      - { left: "โพแทสเซียม", right: "ควบคุมการเปิดปิดปากใบ" }
    hints:
      - "ไอออนใดเข้าออกเซลล์คุม"
      - "ATP มีหมู่ฟอสเฟต"
    solution: "แมกนีเซียมอยู่ในคลอโรฟิลล์ ฟอสฟอรัสอยู่ใน ATP และกรดนิวคลีอิก แคลเซียมอยู่ในผนังเซลล์ และโพแทสเซียมควบคุมการเปิดปิดปากใบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-transport.p004
    topics: [biology.plants.plant-transport]
    difficulty: 2
    type: order
    stem: "เรียงเส้นทางของน้ำ ตั้งแต่ดินจนออกจากใบ"
    items:
      - "ขนราก"
      - "คอร์เทกซ์ของราก"
      - "เอนโดเดอร์มิส"
      - "ไซเลมในรากและลำต้น"
      - "เซลล์มีโซฟิลล์ในใบ"
      - "ช่องอากาศในใบ แล้วออกทางปากใบ"
    hints:
      - "น้ำผ่านคอร์เทกซ์ก่อนถึงชั้นที่มีแถบแคสพาเรียน"
      - "ในใบ น้ำระเหยจากผิวเซลล์มีโซฟิลล์เข้าสู่ช่องอากาศ"
    solution: "ขนราก → คอร์เทกซ์ → เอนโดเดอร์มิส → ไซเลมในรากและลำต้น → มีโซฟิลล์ → ช่องอากาศ → ปากใบ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-transport.p005
    topics: [biology.plants.plant-transport]
    difficulty: 2
    type: mcq
    multiple: true
    stem: "สภาพใดทำให้อัตราการคายน้ำของต้นไม้เพิ่มขึ้น (เลือกได้หลายข้อ)"
    choices:
      - { id: a, text: "แดดจัด", correct: true }
      - { id: b, text: "ลมพัดแรง", correct: true }
      - { id: c, text: "อากาศแห้ง ความชื้นต่ำ", correct: true }
      - { id: d, text: "ฝนตกชุก อากาศชื้นมาก", feedback: "อากาศชื้นทำให้ความต่างของไอน้ำระหว่างในใบกับนอกใบน้อย การคายน้ำจึงลดลง" }
      - { id: e, text: "กลางคืนที่มืดสนิท", feedback: "ตอนมืดปากใบส่วนใหญ่ปิด การคายน้ำจึงลดลง" }
    hints:
      - "สิ่งใดทำให้ปากใบเปิด"
      - "สิ่งใดทำให้ไอน้ำนอกใบน้อยลง"
    solution: "แสงทำให้ปากใบเปิด ลมพัดไอน้ำออกจากผิวใบ และอากาศแห้งทำให้ความต่างของไอน้ำมาก ทั้งสามจึงเพิ่มการคายน้ำ ส่วนอากาศชื้นและความมืดลดการคายน้ำ"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-transport.p006
    topics: [biology.plants.plant-transport]
    difficulty: 2
    type: mcq
    stem: "แถบแคสพาเรียนที่เอนโดเดอร์มิสของรากมีความสำคัญอย่างไร"
    choices:
      - { id: a, text: "บังคับให้น้ำและแร่ธาตุผ่านเยื่อหุ้มเซลล์ จึงคัดเลือกสารก่อนเข้าไซเลม", correct: true }
      - { id: b, text: "ช่วยปั๊มน้ำขึ้นสู่ลำต้น", feedback: "แถบแคสพาเรียนเป็นสารกันน้ำในผนังเซลล์ ไม่ได้ปั๊มน้ำ" }
      - { id: c, text: "เป็นที่สร้างรากแขนง", feedback: "รากแขนงเกิดจากเพริไซเคิล" }
      - { id: d, text: "เก็บอาหารสะสมให้ราก", feedback: "อาหารสะสมอยู่ในคอร์เทกซ์ ไม่ใช่หน้าที่ของแถบแคสพาเรียน" }
    hints:
      - "แถบนี้เคลือบด้วยซูเบอรินซึ่งน้ำผ่านไม่ได้"
      - "น้ำที่มาตามผนังเซลล์ (อโพพลาสต์) จะต้องไปทางใด"
    solution: "แถบแคสพาเรียนกั้นทางอโพพลาสต์ น้ำและแร่ธาตุต้องผ่านเยื่อหุ้มเซลล์ของเอนโดเดอร์มิส ซึ่งคัดเลือกได้ว่าสารใดเข้าไซเลม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-transport.p007
    topics: [biology.plants.plant-transport]
    difficulty: 3
    type: order
    stem: "เรียงเหตุการณ์ที่ทำให้ปากใบเปิดเมื่อได้รับแสง"
    items:
      - "เซลล์คุมได้รับแสง ปั๊ม H⁺ ออกนอกเซลล์"
      - "K⁺ เคลื่อนเข้าสู่เซลล์คุม"
      - "ความเข้มข้นของตัวละลายในเซลล์คุมสูงขึ้น"
      - "น้ำเข้าเซลล์คุมโดยออสโมซิส"
      - "เซลล์คุมเต่งและโค้งออก ปากใบเปิด"
    hints:
      - "การปั๊ม H⁺ ทำให้ K⁺ เข้าเซลล์ได้"
      - "น้ำเคลื่อนที่ตามความเข้มข้นของตัวละลาย"
    solution: "แสง → ปั๊ม H⁺ ออก → K⁺ เข้า → ตัวละลายเข้มข้นขึ้น → น้ำเข้าโดยออสโมซิส → เซลล์คุมเต่ง ปากใบเปิด"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-transport.p008
    topics: [biology.plants.plant-transport]
    difficulty: 3
    type: numeric
    stem: "ในโพโทมิเตอร์ที่หลอดแก้วมีรัศมีภายใน 0.5 mm ฟองอากาศเคลื่อนที่ได้ 36 mm ในเวลา 4 นาที กิ่งไม้ดูดน้ำได้กี่ลูกบาศก์มิลลิเมตรต่อนาที ตอบทศนิยม 2 ตำแหน่ง"
    answer: { value: 7.07, tolerance: 0.07, unit: mm³/min }
    hints:
      - "ปริมาตรน้ำในหลอด = πr² × ระยะที่ฟองอากาศเคลื่อน"
      - "หารด้วยเวลาเพื่อได้อัตราต่อนาที"
    misconceptions:
      - { match: 9, feedback: "36 ÷ 4 คืออัตราเป็นมิลลิเมตรต่อนาที ยังไม่ได้แปลงเป็นปริมาตร" }
      - { match: 28.27, feedback: "นี่คือปริมาตรทั้งหมดใน 4 นาที ต้องหารด้วย 4" }
    solution: "ปริมาตร $= \\pi (0.5)^2 \\times 36 \\approx 28.27\\ \\mathrm{mm^3}$ อัตรา $= 28.27 \\div 4 \\approx 7.07\\ \\mathrm{mm^3/min}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-transport.p009
    topics: [biology.plants.plant-transport]
    difficulty: 3
    type: numeric
    stem: "จากกราฟผลการทดลองด้วยโพโทมิเตอร์ ฟองอากาศในชุด ข. หน้าพัดลม เคลื่อนที่เร็วกว่าชุด ก. อากาศนิ่ง กี่เท่า"
    figure: { src: p-potometer.svg, alt: "กราฟระยะที่ฟองอากาศเคลื่อน (mm) กับเวลา 0 ถึง 5 นาที หลอดแก้วรัศมีภายใน 0.5 mm มีเส้นตรงสองเส้นเริ่มที่จุดกำเนิด เส้นทึบสีแดง ข. หน้าพัดลม ผ่านจุด 15 30 45 60 75 mm ที่เวลา 1 2 3 4 5 นาที เส้นประสีน้ำเงิน ก. อากาศนิ่ง ผ่านจุด 6 12 18 24 30 mm ที่เวลา 1 2 3 4 5 นาที" }
    answer: { value: 2.5, tolerance: 0.03 }
    hints:
      - "หาความชันของแต่ละเส้น (mm ต่อนาที)"
      - "นำความชันของชุด ข. หารด้วยความชันของชุด ก."
    misconceptions:
      - { match: 0.4, feedback: "หารกลับด้าน ชุด ข. เร็วกว่า คำตอบต้องมากกว่า 1" }
      - { match: 9, feedback: "นี่คือผลต่างของอัตรา (15 − 6) โจทย์ถามว่ากี่เท่า" }
    solution: "ชุด ข. $= 75 \\div 5 = 15$ mm/min ชุด ก. $= 30 \\div 5 = 6$ mm/min เร็วกว่า $15 \\div 6 = 2.5$ เท่า เพราะลมพัดไอน้ำออกจากผิวใบ การคายน้ำจึงเพิ่ม"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-transport.p010
    topics: [biology.plants.plant-transport]
    difficulty: 3
    type: mcq
    stem: "ต้นมะนาวในกระถางมีใบอ่อนที่ยอดเหลืองซีดระหว่างเส้นใบ แต่เส้นใบยังเขียว ส่วนใบแก่ยังเขียวปกติ น่าจะขาดธาตุใดมากที่สุด"
    choices:
      - { id: a, text: "เหล็ก", correct: true }
      - { id: b, text: "ไนโตรเจน", feedback: "ไนโตรเจนเคลื่อนย้ายได้ อาการขาดจึงเกิดที่ใบแก่ก่อน" }
      - { id: c, text: "แมกนีเซียม", feedback: "แมกนีเซียมเคลื่อนย้ายได้ อาการเหลืองระหว่างเส้นใบจึงเกิดที่ใบแก่ก่อน" }
      - { id: d, text: "โพแทสเซียม", feedback: "ขาดโพแทสเซียมมักทำให้ขอบใบแก่ไหม้" }
    hints:
      - "อาการเกิดที่ใบอ่อน แปลว่าธาตุนั้นเคลื่อนย้ายในพืชได้หรือไม่"
      - "ธาตุใดจำเป็นต่อการสร้างคลอโรฟิลล์และเคลื่อนย้ายไม่ได้"
    solution: "อาการที่ใบอ่อนแสดงว่าธาตุนั้นเคลื่อนย้ายไม่ได้ เหล็กจำเป็นต่อการสร้างคลอโรฟิลล์และเคลื่อนย้ายไม่ได้ ใบอ่อนจึงเหลืองระหว่างเส้นใบ ส่วน N และ Mg เคลื่อนย้ายได้ อาการจะเกิดที่ใบแก่"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-transport.p011
    topics: [biology.plants.plant-transport]
    difficulty: 3
    type: mcq
    stem: "หลังน้ำท่วมสวนทุเรียนนานหลายวัน แม้ดินยังชุ่มน้ำ ต้นทุเรียนกลับใบเหลืองและเหี่ยว ข้อใดอธิบายได้ดีที่สุด"
    choices:
      - { id: a, text: "ดินที่น้ำขังขาดออกซิเจน รากหายใจไม่ได้ จึงขาดพลังงานในการดูดธาตุอาหารและรากเริ่มเสียหาย", correct: true }
      - { id: b, text: "น้ำมากเกินไปทำให้ไซเลมแตก", feedback: "ไซเลมไม่ได้แตกเพราะมีน้ำมาก ปัญหาอยู่ที่รากขาดออกซิเจน" }
      - { id: c, text: "น้ำท่วมทำให้ปากใบเปิดตลอดเวลา", feedback: "น้ำท่วมที่รากไม่ได้ทำให้ปากใบเปิดตลอดเวลา" }
      - { id: d, text: "น้ำท่วมพัดคลอโรฟิลล์ออกจากใบ", feedback: "คลอโรฟิลล์อยู่ในคลอโรพลาสต์ภายในเซลล์ น้ำไม่ได้พัดออกไป" }
    hints:
      - "การดูดธาตุอาหารส่วนใหญ่ใช้พลังงาน"
      - "รากได้พลังงานจากการหายใจ ซึ่งต้องใช้แก๊สใด"
    solution: "ดินที่น้ำขังมีออกซิเจนน้อย รากหายใจระดับเซลล์ได้น้อย ขาด ATP สำหรับลำเลียงธาตุอาหารแบบใช้พลังงาน และรากที่เสียหายดูดน้ำได้น้อย ใบจึงเหลืองและเหี่ยว"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-transport.p012
    topics: [biology.plants.plant-transport]
    difficulty: 3
    type: mcq
    stem: "นักวิทยาศาสตร์ให้เพลี้ยอ่อนแทงปากเข้าลำต้น แล้วตัดลำตัวออกเหลือแต่ปาก พบว่าของเหลวที่มีซูโครสเข้มข้นไหลออกมาจากปากที่ค้างอยู่ได้เองหลายชั่วโมง ผลนี้สนับสนุนข้อใด"
    choices:
      - { id: a, text: "ในซีฟทิวบ์มีความดัน สารละลายจึงไหลออกเอง ตามสมมติฐานการไหลเนื่องจากความดัน", correct: true }
      - { id: b, text: "เพลี้ยอ่อนดูดน้ำจากไซเลม", feedback: "ของเหลวมีซูโครสเข้มข้น ซึ่งเป็นสารที่ลำเลียงในโฟลเอ็ม" }
      - { id: c, text: "โฟลเอ็มลำเลียงด้วยการแพร่เท่านั้น", feedback: "การแพร่ไม่ทำให้ของเหลวพุ่งออกมาเองต่อเนื่อง ผลนี้แสดงว่ามีแรงดัน" }
      - { id: d, text: "ซีฟทิวบ์ตายแล้วเหมือนไซเลม", feedback: "ซีฟทิวบ์เป็นเซลล์ที่มีชีวิต และการทดลองนี้ไม่ได้ทดสอบเรื่องนี้" }
    hints:
      - "ของเหลวที่มีซูโครสมาจากเนื้อเยื่อใด"
      - "ทำไมของเหลวจึงไหลออกมาได้เองโดยไม่มีเพลี้ยดูด"
    solution: "ซูโครสบอกว่าของเหลวมาจากซีฟทิวบ์ของโฟลเอ็ม และการไหลออกเองแสดงว่าภายในมีความดันสูง สนับสนุนสมมติฐานการไหลเนื่องจากความดัน"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-transport.p013
    topics: [biology.plants.plant-transport]
    difficulty: 4
    type: numeric
    stem: "ลูกบาศก์ยาวด้านละ 4 cm มีอัตราส่วนพื้นที่ผิวต่อปริมาตรเท่าใด (ตอบเป็นจำนวนต่อ 1 หน่วยปริมาตร)"
    answer: { value: 1.5, tolerance: 0.02, unit: cm⁻¹ }
    hints:
      - "พื้นที่ผิว = 6 × ด้าน² ปริมาตร = ด้าน³"
      - "นำพื้นที่ผิวหารด้วยปริมาตร"
    misconceptions:
      - { match: 6, feedback: "นี่คืออัตราส่วนของลูกบาศก์ยาว 1 cm ลองคำนวณกับด้าน 4 cm" }
      - { match: 0.67, feedback: "หารกลับด้าน ต้องเป็นพื้นที่ผิว ÷ ปริมาตร" }
    solution: "พื้นที่ผิว $= 6 \\times 4^2 = 96\\ \\mathrm{cm^2}$ ปริมาตร $= 4^3 = 64\\ \\mathrm{cm^3}$ อัตราส่วน $= 96 \\div 64 = 1.5$ ขนาดใหญ่ขึ้นอัตราส่วนยิ่งลด การแพร่จึงไม่พอ ต้องมีระบบลำเลียง"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-transport.p014
    topics: [biology.plants.plant-transport]
    difficulty: 4
    type: numeric
    stem: "จากกราฟผลการทดลองด้วยโพโทมิเตอร์ (หลอดแก้วรัศมีภายใน 0.5 mm) อัตราการดูดน้ำของชุด ข. หน้าพัดลม เป็นกี่ลูกบาศก์มิลลิเมตรต่อนาที ตอบทศนิยม 2 ตำแหน่ง"
    figure: { src: p-potometer.svg, alt: "กราฟระยะที่ฟองอากาศเคลื่อน (mm) กับเวลา 0 ถึง 5 นาที หลอดแก้วรัศมีภายใน 0.5 mm มีเส้นตรงสองเส้นเริ่มที่จุดกำเนิด เส้นทึบสีแดง ข. หน้าพัดลม ผ่านจุด 15 30 45 60 75 mm ที่เวลา 1 2 3 4 5 นาที เส้นประสีน้ำเงิน ก. อากาศนิ่ง ผ่านจุด 6 12 18 24 30 mm ที่เวลา 1 2 3 4 5 นาที" }
    answer: { value: 11.78, tolerance: 0.12, unit: mm³/min }
    hints:
      - "อ่านความชันของเส้น ข. เป็น mm ต่อนาที"
      - "อัตราปริมาตร = πr² × ความชัน"
    misconceptions:
      - { match: 47.12, feedback: "ใช้ 1 mm ซึ่งเป็นเส้นผ่านศูนย์กลาง ต้องใช้รัศมี 0.5 mm" }
      - { match: 3.75, feedback: "ลืมคูณ π" }
    solution: "ความชันของชุด ข. $= 75 \\div 5 = 15$ mm/min อัตรา $= \\pi (0.5)^2 \\times 15 \\approx 11.78\\ \\mathrm{mm^3/min}$"
    license: CC-BY-SA-4.0
    ai_assisted: true

  - id: biology.plants.plant-transport.p015
    topics: [biology.plants.plant-transport]
    difficulty: 4
    type: mcq
    stem: "ให้ใบมันฝรั่งที่อยู่ในช่วงสร้างหัวรับแก๊ส ¹⁴CO₂ (คาร์บอนกัมมันตรังสี) แล้วตรวจหาคาร์บอนกัมมันตรังสีในพืช ผลใดสอดคล้องกับสมมติฐานการไหลเนื่องจากความดันมากที่สุด"
    choices:
      - { id: a, text: "พบในซูโครสในโฟลเอ็ม และไปสะสมเป็นแป้งในหัว", correct: true }
      - { id: b, text: "พบในน้ำในไซเลมที่ไหลขึ้นไปยังยอด", feedback: "ไซเลมลำเลียงน้ำและแร่ธาตุจากราก ไม่ได้ลำเลียงน้ำตาลที่ใบสร้าง" }
      - { id: c, text: "ไม่พบที่อื่นนอกจากใบ เพราะน้ำตาลไม่เคลื่อนที่", feedback: "หัวมันฝรั่งเป็นแหล่งรับ น้ำตาลต้องเคลื่อนจากใบไปที่หัว" }
      - { id: d, text: "พบในหัวก่อนพบในใบ", feedback: "คาร์บอนถูกตรึงที่ใบก่อน แล้วจึงลำเลียงไปที่หัว" }
    hints:
      - "ใบตรึง CO₂ เป็นน้ำตาลด้วยการสังเคราะห์ด้วยแสง"
      - "หัวมันฝรั่งเป็นแหล่งสร้างหรือแหล่งรับในช่วงนี้"
    solution: "ใบ (แหล่งสร้าง) ตรึง ¹⁴C เป็นน้ำตาล แล้วลำเลียงเป็นซูโครสทางโฟลเอ็มไปยังหัว (แหล่งรับ) ซึ่งเปลี่ยนเป็นแป้งเก็บไว้"
